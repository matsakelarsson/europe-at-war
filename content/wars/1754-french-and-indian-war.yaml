  - title: Lake George and Oswego
    date: 1755–1756
    when: "1755-09-08"
    borders: "1756-08-14"
    countries: [us, ca, gb, fr]
    body:
      - "William Johnson, a New York trader and landowner who had close ties to the Mohawk, led about 1,500 provincials and 200 Mohawk under Theyanoguin (Hendrick) towards Crown Point, camping at the lake he renamed Lake George. On 8 September 1755 Baron Dieskau, with about 220 French regulars, 600 Canadians and 700 Native warriors, most of them Kanien’kehá:ka and Abenaki from the mission villages, ambushed a column sent out from the camp, killing Theyanoguin and Colonel Ephraim Williams. Dieskau then attacked Johnson’s camp, was beaten off and wounded and captured; many of his Kahnawake warriors, unwilling to fight their Mohawk kin, had held back. Johnson built Fort William Henry at the head of the lake, and the French began Fort Carillon at Ticonderoga."
      - "Britain declared war on France in May 1756 and France on Britain in June, and the Marquis de Montcalm arrived to command the French regulars. In March Gaspard-Joseph Chaussegros de Léry destroyed Fort Bull on the Oneida carrying place. In August Montcalm crossed Lake Ontario with some 3,000 men and besieged the three forts at Oswego, Britain’s only post on the Great Lakes, which surrendered on 14 August with about 1,700 prisoners; his Native allies killed some of the prisoners and took others as captives."
      - "On the Pennsylvania frontier French troops and Lenape took Fort Granville at the end of July 1756. On 8 September Colonel John Armstrong led about 300 Pennsylvanians against the Lenape town of Kittanning on the Allegheny, the base of many raids, and burned it; the Lenape leader Captain Jacobs was killed."
    facts:
      - [Battle of Lake George, "8 September 1755"]
      - [Fall of Oswego, "14 August 1756"]
      - [Prisoners taken at Oswego, "about 1,700"]
      - [Kittanning, "8 September 1756"]
