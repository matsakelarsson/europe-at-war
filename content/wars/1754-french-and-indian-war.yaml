  - title: Fort Duquesne and the treaty of Easton
    date: 1758
    when: "1758-11-24"
    borders: "1758-11-25"
    countries: [us, gb, fr]
    body:
      - "Brigadier John Forbes, a Scot gravely ill throughout the campaign, led some 6,000 to 7,000 regulars and provincials, among them Washington’s Virginians, and several hundred Cherokee and Catawba warriors against Fort Duquesne. Instead of Braddock’s road he cut a new one straight across Pennsylvania from Carlisle, building fortified depots at Raystown (Fort Bedford) and Loyalhanna (Fort Ligonier) as he went. On 14 September Major James Grant, sent ahead with about 750 men, was routed outside Fort Duquesne with about 340 killed, wounded or captured, and on 12 October a French and Native force attacked Fort Ligonier and was beaten off."
      - "The decision came through diplomacy. In the summer the Moravian Christian Frederick Post carried peace messages to the Lenape towns on the Ohio. At Easton, from 7 to 26 October, Pennsylvania and New Jersey met leaders of the Haudenosaunee, the eastern Lenape under Teedyuscung and the western Lenape envoy Pisquetomen; Pennsylvania gave back to the Haudenosaunee the lands west of the Alleghenies bought at Albany in 1754, and the western Lenape, with whom Post went back to the Ohio, agreed to stand aside. With his allies leaving him and his supplies cut off by the fall of Fort Frontenac, François-Marie Le Marchand de Lignery blew up Fort Duquesne on 24 November and withdrew to Venango. Forbes occupied the Forks the next day and named the place Pittsburgh, after Pitt; he died in Philadelphia in March 1759."
    facts:
      - [Grant’s defeat, "14 September 1758"]
      - [Conference at Easton, "7–26 October 1758"]
      - [Fort Duquesne abandoned, "24 November 1758"]
