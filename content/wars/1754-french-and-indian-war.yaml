  - title: Fort William Henry
    date: 1757
    when: "1757-08-09"
    borders: "1757-08-09"
    countries: [us, ca, gb, fr]
    body:
      - "In 1757 the new British commander, Lord Loudoun, took most of his regulars to Halifax for an attack on Louisbourg, which he called off when a French fleet gathered there. Montcalm used the chance to strike south. Besides some 6,000 regulars and militia he had about 1,800 Native warriors from more than thirty nations, from the mission villages of Canada to the far side of Lake Michigan, who had come for honour, plunder and captives. On 3 August his army came down Lake George by boat and along the shore and besieged Fort William Henry, held by Lieutenant Colonel George Monro with some 2,300 to 2,500 regulars and provincials, many of them sick. General Daniel Webb, at Fort Edward some 25 km away, sent no help."
      - "After six days of bombardment Monro surrendered on 9 August. Montcalm granted the honours of war: the garrison would march to Fort Edward under French escort, keeping its muskets, and promise not to serve again for eighteen months. The warriors, who had not been consulted and saw the plunder and captives they fought for slipping away, killed sick and wounded men left in the fort and the next morning fell on the column as it set out. Jonathan Carver’s widely read account of 1778 claimed that as many as 1,500 were killed or carried off; the historian Ian Steele’s reconstruction puts the dead and missing among the prisoners at 69 to 184. Several hundred were seized as captives; Montcalm secured the release of some 500, but the warriors took about 200 more home with them."
      - "The warriors took smallpox home from the fort, and it spread through the Great Lakes; many western nations did not return to fight for France. Montcalm burned the fort and withdrew. In November a French and Native force under François-Marie Picoté de Belestre destroyed the German settlement of German Flatts on the Mohawk River. The events at Fort William Henry were later retold, freely, in James Fenimore Cooper’s The Last of the Mohicans (1826)."
    facts:
      - [Siege of Fort William Henry, "3–9 August 1757"]
      - [Montcalm’s force, "about 6,000 French and 1,800 Native warriors"]
      - [Dead and missing after the surrender, "69 to 184 by Steele’s estimate"]
