  - title: Louisbourg
    date: June – July 1758
    when: "1758-06-08"
    borders: "1758-07-26"
    countries: [ca, gb, fr]
    view:
      center: [-60.00, 45.89]
      size: [50, 45]
    body:
      - "William Pitt, who led the British government from 1757, made America the main theatre of the war. He sent more regulars, paid the colonies for the troops they raised and gave command to younger officers. For 1758 he planned three campaigns, against Louisbourg, against Fort Carillon and towards Lake Champlain, and against Fort Duquesne. Meanwhile the Royal Navy kept most French reinforcements and supplies from reaching Canada."
      - "Major General Jeffery Amherst sailed from Halifax with about 13,000 soldiers in 150 transports, escorted by some 40 warships under Admiral Edward Boscawen. On 8 June Brigadier James Wolfe’s boats were thrown back from the beach of Gabarus Bay until a party found a sheltered landing in a cove; Wolfe then took Lighthouse Point, from where his guns covered the harbour. The governor, Augustin de Boschenry de Drucour, with about 3,500 regulars and the crews of the warships in the harbour, held out for seven weeks, while his wife, Marie-Anne, fired cannon on the ramparts each day to encourage the defenders. When fire had destroyed or the British had captured the last French ships, Drucour surrendered on 26 July 1758. Amherst refused the honours of war, and some 6,600 soldiers, sailors and inhabitants were taken prisoner."
      - "It was too late in the year to sail on to Quebec. Instead British forces under Wolfe and others raided the fishing settlements of the Gaspé and the Miramichi, and the Acadians of Île Saint-Jean, about 3,100 people, were deported to France. In 1760 British engineers blew up Louisbourg’s walls."
    facts:
      - [Siege of Louisbourg, "8 June – 26 July 1758"]
      - [British force, "about 13,000 soldiers and some 40 warships"]
      - [Taken prisoner, "about 6,600"]
