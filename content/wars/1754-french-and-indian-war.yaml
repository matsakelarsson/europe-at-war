  - title: Signal Hill and the Peace of Paris
    date: 1762–1763
    when: "1762-09-15"
    borders: "1763-02-11"
    countries: [ca, us, gb, fr, es, pm]
    body:
      - "Spain entered the war on France’s side in January 1762, and Britain took Havana in August. Hoping to gain something to bargain with, France sent a small squadron under the Chevalier de Ternay with some 800 troops under the Comte d’Haussonville, which surprised and took St. John’s, Newfoundland, on 27 June 1762 and raided the fishing settlements. Lieutenant Colonel William Amherst, Jeffery’s brother, gathered about 1,500 men from New York, Halifax and Louisbourg, landed at Torbay and on 15 September stormed Signal Hill above the town. Ternay’s ships slipped away in fog, and the garrison surrendered on 18 September, in the last battle of the war in North America."
      - "By the secret Treaty of Fontainebleau of 3 November 1762 France gave Louisiana west of the Mississippi, with New Orleans, to Spain. By the Treaty of Paris of 10 February 1763 France ceded Canada, Île Royale, Île Saint-Jean and all its claims east of the Mississippi to Britain, keeping only the islands of Saint-Pierre and Miquelon and its fishing rights on the coast of Newfoundland, and Britain gave back the sugar islands of Guadeloupe and Martinique, which it had taken, keeping Canada instead. Spain ceded Florida to Britain in return for Havana."
      - "The Native nations, who had not been defeated and were not consulted, learned that France had handed their lands to Britain; within months the western nations rose in Pontiac’s War. In October 1763 the Royal Proclamation created the Province of Quebec and reserved the land west of the Appalachians for the Native nations. The war had nearly doubled Britain’s national debt, and Parliament’s attempts to make the colonies pay part of the cost led to the American Revolution."
    facts:
      - [Battle of Signal Hill, "15 September 1762"]
      - [Treaty of Fontainebleau, "3 November 1762"]
      - [Treaty of Paris, "10 February 1763"]
