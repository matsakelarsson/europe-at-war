  - title: Beauséjour and the expulsion of the Acadians
    date: 1755–1764
    when: "1755-06-16"
    borders: "1755-09-05"
    countries: [ca, us, gb, fr]
    body:
      - "Some 14,000 Acadians lived in Nova Scotia and on the French islands of Île Saint-Jean and Île Royale, most of them around the Bay of Fundy under British rule since 1713. They had long refused an unconditional oath of allegiance that might force them to fight France and their Mi’kmaq neighbours, and after the years of Father Le Loutre’s War the governor, Charles Lawrence, saw them as a danger. In June 1755 Lieutenant Colonel Robert Monckton brought some 2,000 New England provincials and 270 regulars from Boston and besieged Fort Beauséjour on the Chignecto isthmus. Its commander, Louis Du Pont Duchambon de Vergor, surrendered on 16 June; armed Acadians were found among its defenders, and the British renamed it Fort Cumberland."
      - "On 28 July 1755 Lawrence and his council decided to deport all the Acadians. At Grand-Pré on 5 September Lieutenant Colonel John Winslow told the men gathered in the church that they and their families would be removed and their land and cattle forfeited; the same was done at Pisiquid, Annapolis Royal and Chignecto, and the villages were burned. Some 6,000 to 7,000 people were shipped that autumn to the Anglo-American colonies from Massachusetts to Georgia, which had not been warned, and families were often separated. At the Petitcodiac on 3 September Acadians and Mi’kmaq under Charles Deschamps de Boishébert defeated a British detachment burning their farms."
      - "The deportations went on until 1764, from the Saint John River, Cape Sable and, after the fall of Louisbourg in 1758, from Île Saint-Jean and Île Royale to France; that year the Duke William, the Violet and the Ruby sank on the crossing, and some 850 to 1,000 people drowned. In all, by different estimates, about 10,000 to 11,500 of some 14,000 Acadians were deported, and perhaps 5,000 died of disease, hunger and shipwreck. Others hid in the woods or fled to Quebec and the Miramichi, where Boishébert and Joseph Broussard, called Beausoleil, led Acadian and Mi’kmaq resistance. After 1764 many settled in Louisiana, where their descendants are the Cajuns, and others returned to the Maritimes. Acadians remember it as the Grand Dérangement; a royal proclamation of 2003 acknowledged the deportation and the suffering it caused, without an apology, and made 28 July a day of commemoration."
    facts:
      - [Fall of Fort Beauséjour, "16 June 1755"]
      - [Deportation ordered, "28 July 1755"]
      - [Deported 1755–1764, "about 10,000 to 11,500 of some 14,000 Acadians"]
      - [Died, "perhaps 5,000"]
