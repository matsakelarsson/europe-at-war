  - title: Niagara, Ticonderoga and Saint-Francis
    date: 1759
    when: "1759-07-26"
    borders: "1759-07-26"
    countries: [us, ca, gb, fr]
    body:
      - "For 1759 Pitt planned to finish New France: Wolfe would sail up the St. Lawrence to Quebec, Amherst would advance by Lake Champlain, and a third army would take Niagara. Seeing which way the war was going, the Haudenosaunee now joined the British in strength, and nearly 1,000 of their warriors went with William Johnson. Brigadier John Prideaux besieged Fort Niagara from 6 July; when he was killed by a British shell on 20 July, Johnson took command. On 24 July a relief force of French troops and Native allies from the Ohio and Illinois posts under Lignery and Charles-Philippe Aubry was destroyed at La Belle-Famille, below the fort, and the commander, Pierre Pouchot, surrendered on 26 July. The French abandoned their posts on Lake Erie and the upper Ohio."
      - "Amherst came down Lake George with about 11,000 men. François-Charles de Bourlamaque, with orders to delay him and fall back, blew up Fort Carillon on 26–27 July and abandoned Fort Saint-Frédéric at Crown Point on 31 July, retreating to Île aux Noix on the Richelieu. Amherst stopped to build a great new fort at Crown Point and went no further that year."
      - "From Crown Point Amherst sent Major Robert Rogers with some 200 rangers and Stockbridge Mohican scouts, about 140 of whom reached the village, to destroy Saint-Francis (Odanak), the Abenaki mission village on the St. Lawrence from which many raids on New England had come. At dawn on 4 October 1759 they attacked and burned it. Rogers claimed about 200 killed; French reports put the dead at about 30, mostly women and children, as many of the men were away. On their retreat through the wilderness the starving rangers were pursued, and some 50 of them were killed, captured or died of hunger."
    facts:
      - [Siege of Fort Niagara, "6–26 July 1759"]
      - [La Belle-Famille, "24 July 1759"]
      - [Carillon blown up, "26–27 July 1759"]
      - [Raid on Saint-Francis, "4 October 1759"]
