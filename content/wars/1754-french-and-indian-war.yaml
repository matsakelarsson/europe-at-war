  - title: Carillon and Fort Frontenac
    date: July – August 1758
    when: "1758-07-08"
    borders: "1758-08-27"
    countries: [us, ca, gb, fr]
    body:
      - "Major General James Abercromby led the largest army yet seen in North America, about 16,000 men, some 6,000 of them regulars and the rest provincials and rangers, down Lake George in hundreds of boats in early July 1758. On 6 July, in a confused skirmish in the woods, the young Brigadier Lord Howe, the army’s most admired officer, was killed. Montcalm, with fewer than 4,000 men, had his troops build a log breastwork on the heights before Fort Carillon and, below it, an abatis of felled trees with sharpened branches."
      - "On 8 July Abercromby, without waiting for his artillery, sent his regulars against the breastwork in assault after assault for most of the afternoon; the Highlanders of the 42nd Regiment lost more than half their men. Abercromby reported 547 killed, 1,356 wounded and 77 missing; the French lost 104 killed and 273 wounded. The British army retreated up the lake, and Montcalm raised a cross on the battlefield."
      - "In August Lieutenant Colonel John Bradstreet led about 3,000 men, most of them provincials, from the Mohawk valley by Oneida Lake to the ruins of Oswego and across Lake Ontario, and on 27 August took Fort Frontenac, where the French kept the stores and ships that supplied their western posts. Its loss cut the line to Fort Duquesne."
    facts:
      - [Battle of Carillon, "8 July 1758"]
      - [Forces, "about 16,000 British against fewer than 4,000 French"]
      - [British losses, "547 killed, 1,356 wounded, 77 missing"]
      - [Fort Frontenac taken, "27 August 1758"]
