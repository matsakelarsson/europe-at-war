notes:
  - "Most dates are converted from the Chinese lunar calendar and differ by a few weeks between sources (the Qing entry into Ili is dated May or June 1755)."
  - "The destruction of the Dzungars is widely described by historians as a genocide; Mark Levene called it “arguably the eighteenth century genocide par excellence”, and Peter Perdue and Michael Clarke describe the extermination of the Dzungars as a people. Others ask how far the deaths were planned rather than caused by epidemic and war, and Chinese official histories present the campaigns as the unification of the north-west and the suppression of rebellion. The population figures come from the Qing scholar Wei Yuan (1794–1857) and are estimates."
  - The Oirats (western Mongols) included the Choros (the ruling Dzungar clan), the Dörbet, the Khoit and the Khoshut; the Torghuts had moved to the Volga in the 1630s and returned in 1771.
  - The Kazakh side of these years is told in the Kazakh–Dzungar wars, and the revolt of the Altishahr Khojas in the Tarim basin (1757–1759) has its own entry.
