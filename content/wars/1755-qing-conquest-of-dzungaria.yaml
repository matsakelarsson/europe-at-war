id: qing-conquest-of-dzungaria
name: Qing conquest of the Dzungar Khanate
start: "1755-03"
end: "1758"
tier: A
summary: "The campaigns in which the Qing empire destroyed the Dzungar Khanate, the last great nomad state of Inner Asia, and most of the Dzungar people with it. After the death of Galdan Tseren in 1745 the khanate broke up in succession wars, and in 1754 the defeated prince Amursana went over to the Qing. In 1755 two Qing armies, with Amursana, marched to the Ili valley almost unopposed; the khan Dawachi was captured and the khanate dissolved. When the Qianlong emperor offered Amursana only a share of the Dzungar lands, he rebelled in September 1755, and the Khalkha prince Chingünjav rose in 1756. In 1757–1758 the Qing crushed both risings, and the emperor ordered that the Dzungar men be killed. War, massacre, a smallpox epidemic, Kazakh raids and flight destroyed the Dzungars as a people: of a population put at about 600,000, most estimates of the dead range from about 420,000 to 480,000. Amursana died in Russian exile in 1757. The Qing resettled Dzungaria with soldiers and farmers from elsewhere in the empire and, after conquering the Tarim basin in 1759, called the new territory Xinjiang."
countries: [cn, mn, kz, ru]
sides:
