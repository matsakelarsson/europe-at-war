  - title: Xinjiang
    date: 1758–1771
    when: "1760"
    borders: "1760-01-01"
    countries: [cn, mn, kz, ru]
    body:
      - Dzungaria was left nearly empty. After the conquest of the Tarim basin in 1759 the Qing named the whole territory Xinjiang, the “new frontier”, and in 1762 placed it under a military governor, the General of Ili, who from 1763 had his seat at the new fortress city of Huiyuan in the Ili valley. Western Mongolia around Khovd and the Tannu Uriankhai (today’s Tuva) were also taken into the empire.
      - To fill the land and guard the frontier the Qing brought in Manchu, Xibe, Solon, Chahar and Oirat soldiers with their families; the Xibe, who arrived from Manchuria in 1765, still live south of the Ili. Han and Hui farmers, convicts and merchants settled around Ürümqi and Barkol (James Millward counts about 155,000 Han settlers on state farms between 1760 and 1830), and Turkic Muslim farmers from the Tarim, later called Taranchi, were moved to the Ili valley. The Kazakhs moved into the western pastures as Qing tributaries. In 1771 the Torghuts, Oirats who had lived on the Volga since the 1630s, returned to Dzungaria and were settled under Qing rule.
      - The Qianlong emperor counted the war among his Ten Great Campaigns, commemorated it with temples at Chengde and with a set of battle engravings made in Paris from paintings by the Jesuit artists at his court.
    facts:
      - [General of Ili, "from 1762"]
      - [Xibe arrive in the Ili valley, "1765"]
      - [Return of the Torghuts, "1771"]
    markers:
      - kind: capital
