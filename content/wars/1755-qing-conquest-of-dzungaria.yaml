  - title: Amursana and Chingünjav
    date: September 1755 – January 1757
    when: "1755-09-24"
    borders: "1756-06-01"
    countries: [cn, mn, kz]
    body:
      - On 24 September 1755 Amursana slipped away from his escort on the way to an audience at Chengde, returned to the Tarbagatai and called the Oirats to rise. Many did. At Ili, Bandi and his small force were surrounded; on 4 October Bandi and his colleague Ebilun took their own lives. The Qianlong emperor, who had been warned against trusting Amursana, punished the officials who had let him go.
      - In the spring of 1756 a new Qing army retook Ili, and Amursana fled to the Kazakhs, whose khan Ablai refused to hand him over. That summer the Khalkha prince Chingünjav, a descendant of Chinggis Khan who had plotted with Amursana and was alarmed by the execution of the Khalkha noble who had commanded Amursana’s escort, left his post in the Uriankhai with his men and sent the emperor a list of grievances. Unrest spread across Khalkha; Qing posts were attacked, Chinese merchants robbed and the relay stations across Mongolia disrupted for months. But the Jebtsundamba Khutugtu and the other great nobles did not join him, and he never had more than one or two thousand men. Deserted by most of them, he was captured near Khankh at the northern end of Lake Khövsgöl in January 1757 without a battle, and executed in Beijing on 11 March 1757 with almost all his family.
      - In December 1756 Oirat groups who had submitted rose again, seized Ürümqi and forced the Qing general Zhaohui to fall back from Ili to Barkol.
    facts:
      - [Amursana escapes, "24 September 1755"]
      - [Death of Bandi at Ili, "4 October 1755"]
      - [Ili retaken, "spring 1756"]
      - [Chingünjav’s rising, "summer 1756 – January 1757"]
      - [Chingünjav executed, "11 March 1757, Beijing"]
