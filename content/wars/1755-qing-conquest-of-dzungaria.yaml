steps:
  - title: The Dzungar succession wars
    date: 1745–1754
    when: "1754"
    borders: "1754-12-01"
    countries: [cn, mn, kz]
    body:
      - Galdan Tseren, who had ruled the Dzungars since 1727 and made peace with the Qing in 1739, died in 1745. His young son Tsewang Dorji Namjal was blinded and deposed in 1750 by his half-brother Lama Dorji, who was in turn overthrown and killed in the winter of 1752–1753 by two nobles who had taken refuge among the Kazakhs, Dawachi, a grandson of the general Tseren Dondub, and his ally Amursana, a prince of the Khoit. Dawachi became khan, but the two soon fell out.
      - The fighting drove whole Oirat groups to seek Qing protection. In 1753 the Dörbet under their three chiefs named Tseren crossed into Qing territory, and in the summer of 1754 Amursana, beaten by Dawachi, followed with about 5,000 fighting men and 20,000 women and children. The Qianlong emperor received him at his summer palace at Chengde late in 1754 and decided, against the advice of many of his officials, to put an end to the Dzungar state.
    facts:
      - [Death of Galdan Tseren, "1745"]
      - [Dawachi becomes khan, "1753"]
      - [Amursana goes over to the Qing, "summer 1754"]
    markers:
      - kind: capital
        side: dz
        name: Ili
        date: 1745–1754
        text: Centre of the Dzungar Khanate, in the Ili valley near today’s Ghulja (Yining), where the succession struggles were fought out.
        lonlat: [81.278, 43.908]
      - kind: event
        side: qing
        name: Chengde
        date: late 1754
        text: The Qianlong emperor received Amursana at his summer palace and planned the campaign against Dawachi.
        lonlat: [117.938, 40.987]
      - kind: event
