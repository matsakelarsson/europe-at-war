        via: [[83.000, 46.700], [87.500, 47.200], [92.000, 47.600], [96.500, 47.750]]
  - title: The march on Ili
    date: March – July 1755
    when: "1755-06"
    borders: "1755-07-15"
    countries: [cn, mn]
    body:
      - In the spring of 1755 two Qing armies, each of about 25,000 men, set out for the Ili valley, the northern one from Uliastai under Bandi, with Amursana as one of its generals, the western one from Barkol under Yongchang and Sarel. Their supplies were planned for a short campaign. Few Dzungars fought for Dawachi; nobles and their people came over to the Qing all along the way, among them the Khoja brothers Burhan al-Din and Khoja Jahan, Afaqi leaders of the Tarim oases whom the Dzungars had held hostage at Ili. The armies met at Bortala and entered the Ili valley in early summer without a battle.
      - Dawachi fell back with about 10,000 men to the Gädän mountain (Gedeng) south of the Ili. There, in a night raid celebrated by the Qing, the Oirat officer Ayusi, who had gone over to the Qing, rode into his camp with about two dozen horsemen, and Dawachi’s army broke up. Dawachi fled south over the Tian Shan to Uch Turfan, where the local hakim beg, Khojis, seized him and handed him to the Qing in July. He was taken to Beijing, pardoned and given a princely title.
      - Qianlong now planned to divide the Dzungar lands among four Oirat khans, of the Choros, Dörbet, Khoit and Khoshut, under Qing supervision. Amursana, who had expected to rule all the Dzungars, was to be khan of the Khoit only. Bandi was left at Ili with a few hundred men, and the rest of the army went home.
    facts:
      - [Qing armies, "two of about 25,000 men each"]
      - [Ili taken, "May–June 1755, without a battle"]
      - [Dawachi captured, "July 1755, at Uch Turfan"]
