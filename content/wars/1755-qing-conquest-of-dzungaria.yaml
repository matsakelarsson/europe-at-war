  - title: The destruction of the Dzungars
    date: 1757–1758
    when: "1757-06"
    borders: "1758-06-01"
    countries: [cn, mn, kz, ru]
    body:
      - In 1757 the Qing sent fresh armies under Zhaohui and the Khalkha prince Cenggunjab. Amursana returned to Dzungaria, was beaten again and fled once more to the Kazakhs; Ablai Khan then made his peace with the Qing and sent tribute. In July Amursana crossed into Russian territory at Semipalatinsk on the Irtysh. He died of smallpox at Tobolsk on 21 September 1757, and the Russians refused Qing demands for his body.
      - The Qianlong emperor had decided that the Dzungars could not be trusted to submit again. His edicts ordered his generals to show no mercy, to kill the young and strong men, and to give the women, children and old people to Qing soldiers and allies as servants; commanders were rewarded or punished according to their zeal. Qing troops and their Khalkha and Oirat auxiliaries hunted down Dzungar groups across Dzungaria in 1757 and 1758, while a smallpox epidemic spread through the camps. Kazakh and Kyrgyz raiders, and Muslims of the Tarim oases, took many Dzungars captive.
      - The Qing scholar Wei Yuan, writing in the 1840s, estimated that of about 600,000 Dzungars in 200,000 households, some four in ten died of smallpox, two in ten fled to Russia or the Kazakhs and three in ten were killed by the army. Modern estimates of the dead range from about 420,000 to 480,000, some 70 to 80 per cent of the population, with higher figures in some works. Survivors were scattered among the Kazakhs and in Russia, or enrolled in Qing banners; the name Dzungar all but disappeared.
    facts:
      - [Death of Amursana, "21 September 1757, Tobolsk"]
      - [Dzungar population before 1755, "about 600,000 (Wei Yuan)"]
      - [Estimated dead, "about 420,000 to 480,000 (Perdue, Clarke)"]
