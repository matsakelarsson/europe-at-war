  - title: Chinsurah and Mir Qasim
    date: 1758–1760
    when: "1759-11-25"
    borders: "1760-10-20"
    countries: [in, bd]
    body:
      - Mir Jafar depended on the Company and paid it and its officers huge sums; the Company also received the zamindari of the 24 Parganas south of Calcutta. In 1759 the Mughal crown prince, later Shah Alam II, invaded Bihar and besieged Patna, and a relief force under Clive drove him off. The Dutch East India Company, invited in secret by Mir Jafar, sent troops from Batavia to its settlement of Chinsurah, but in November 1759 the British under Colonel Francis Forde defeated them at Chinsurah and Biderra, and the Dutch had to pay compensation.
      - Clive went home in 1760. With Mir Jafar unable to pay the money he owed, the Calcutta council replaced him on 20 October 1760 with his son-in-law Mir Qasim, who had agreed to cede the districts of Burdwan, Midnapore and Chittagong to the Company to pay for its army.
    facts:
      - [Battle of Chinsurah, "25 November 1759, British victory over the Dutch"]
      - [Mir Qasim made Nawab, "20 October 1760"]
      - [Burdwan, Midnapore and Chittagong ceded, "1760"]
    markers:
