notes:
  - The number who died in the Black Hole of Calcutta is disputed. The only detailed account, by the survivor John Zephaniah Holwell, says that 123 of 146 prisoners died; later historians, who doubt Holwell’s figures, give lower numbers, such as Stanley Wolpert’s 64 imprisoned and 21 surviving. The story was used for generations in Britain to justify the conquest.
  - The Company’s victory owed much to divisions at the Nawab’s court and to the bankers of Murshidabad, the Jagat Seths, who backed the conspiracy against Siraj-ud-Daulah. Mir Jafar and Mir Qasim paid the Company and its servants huge sums, and Company servants traded privately free of the duties paid by Indian merchants; both were central to the quarrel of 1763.
  - The Carnatic Wars in the south, the other half of the Anglo-French struggle in India, are told separately.
