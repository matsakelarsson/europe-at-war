steps:
  - title: The fall of Calcutta
    date: April – June 1756
    when: "1756-06-20"
    borders: "1756-06-20"
    countries: [in]
    body:
      - Alivardi Khan died in April 1756 and was succeeded by his young grandson Siraj-ud-Daulah. The new Nawab was angry that the British at Calcutta were strengthening Fort William against the French without his leave, sheltering a fugitive official of his court and abusing their trading privileges. In June his troops seized the British factory at Kasimbazar, near his capital, and his army marched on Calcutta. Many of the British, including the governor, Roger Drake, escaped downriver by ship, and the fort fell on 20 June 1756.
      - That night the remaining prisoners were shut into the fort’s small punishment cell, the Black Hole. According to the survivor John Zephaniah Holwell, 123 of 146 died of heat and suffocation; modern estimates are much lower, but many died. The Nawab renamed the town Alinagar and left a garrison. The surviving British gathered at Fulta, down the Hooghly, and sent word to Madras.
    facts:
      - [Kasimbazar factory seized, "early June 1756"]
      - [Calcutta taken by the Nawab, "20 June 1756"]
      - [Black Hole deaths, "123 of 146 according to Holwell; modern estimates lower"]
