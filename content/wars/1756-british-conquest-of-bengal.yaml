id: british-conquest-of-bengal
name: British conquest of Bengal
start: "1756-06"
end: "1765-08-16"
tier: A
summary: "The wars in which the British East India Company became the real ruler of Bengal, Bihar and Orissa, the richest province of Mughal India. In 1756 the young Nawab Siraj-ud-Daulah took the Company’s town of Calcutta; a force from Madras under Robert Clive retook it, seized the French settlement of Chandernagore and, in league with the Nawab’s own commander Mir Jafar, defeated Siraj at Plassey on 23 June 1757. The Company made and unmade nawabs, replacing Mir Jafar with Mir Qasim in 1760, and when Mir Qasim tried to rule on his own terms it fought and beat him in 1763. At Buxar in October 1764 it defeated Mir Qasim, the Nawab of Awadh and the Mughal emperor Shah Alam II together, and by the settlement of Allahabad in August 1765 the emperor granted the Company the diwani, the right to collect the revenue of the three provinces."
countries: [in, bd]
