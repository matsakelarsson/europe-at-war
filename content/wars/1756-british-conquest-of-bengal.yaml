  - title: Plassey
    date: April – July 1757
    when: "1757-06-23"
    borders: "1757-07-02"
    countries: [in]
    body:
      - Siraj-ud-Daulah was now distrusted by much of his court. Clive and the Calcutta council secretly agreed with Mir Jafar, the Nawab’s paymaster and commander, and with the bankers Jagat Seth, Rai Durlabh and the merchant Omichund, to make Mir Jafar Nawab in return for large payments. On 13 June Clive marched north with about 3,000 men, some 750 to 800 of them British and the rest sepoys, with eight field guns. On 23 June 1757 he met the Nawab’s army, about 50,000 strong with a small French artillery detachment, in a mango grove near the village of Plassey on the Bhagirathi.
      - The battle was mostly an artillery duel. A heavy rain soaked the Nawab’s powder while the British kept theirs covered, and his loyal general Mir Madan was mortally wounded in a cavalry charge. Mir Jafar’s divisions stood aside, Siraj fled to Murshidabad, and by late afternoon the British had taken his camp. The British lost about 22 killed and 50 wounded; the Nawab’s army lost about 500. Mir Jafar was proclaimed Nawab. Siraj was caught near Rajmahal and killed on 2 July on the orders of Mir Jafar’s son Miran.
    facts:
      - [Battle of Plassey, "23 June 1757, British victory"]
      - [British force, "about 3,000, with 750–800 Europeans and 2,100 sepoys"]
      - [Nawab’s army, "about 50,000"]
      - [Losses, "British 22 killed, 50 wounded; Nawab about 500"]
    markers:
