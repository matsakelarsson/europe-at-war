  - title: The war with Mir Qasim
    date: June – November 1763
    when: "1763-10-06"
    borders: "1763-11"
    countries: [in]
    body:
      - Mir Qasim moved his capital to Munger in Bihar, reformed the revenue and trained an army on European lines. The quarrel came over trade. Company servants used the Company’s free passes, the dastaks, to trade privately inside Bengal without paying duties, and sold them to Indian merchants; when Mir Qasim abolished internal duties for everyone, the Calcutta council protested. On 25 June 1763 the Company’s agent at Patna, William Ellis, tried to seize the city; he was driven out and captured with his men.
      - The council declared war on 7 July, restored Mir Jafar as Nawab, and sent Major Thomas Adams up the Ganges. His small army beat Mir Qasim’s troops at Katwa on 19 July, at Gheria in August and at the fortified pass of Udhua Nala in September, and took Munger in October. On 6 October 1763, at Patna, Mir Qasim had his British prisoners killed, 45 in all, with some 200 sepoys who had refused to join him. Patna was stormed in November and Mir Qasim fled to Awadh.
    facts:
      - [Ellis’s attack on Patna, "25 June 1763"]
      - [Battle of Katwa, "19 July 1763, British victory"]
      - [Udhua Nala, "September 1763, British victory"]
      - [Patna massacre, "6 October 1763; 45 British prisoners and about 200 sepoys killed"]
    markers:
