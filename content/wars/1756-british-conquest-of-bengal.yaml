  - title: Clive and Watson
    date: December 1756 – March 1757
    when: "1757-02-05"
    borders: "1757-03-23"
    countries: [in]
    body:
      - The Madras council sent a fleet under Admiral Charles Watson with several hundred European soldiers and a larger number of sepoys under Robert Clive. They entered the Hooghly in December, took the fort of Budge Budge and retook Calcutta on 2 January 1757 almost without resistance, then sacked the Nawab’s town of Hooghly. When Siraj-ud-Daulah came south with his army, Clive attacked his camp outside Calcutta at dawn on 5 February in thick fog. The attack was a confused affair with heavy losses, but it shook the Nawab, who on 9 February signed the treaty of Alinagar, restoring the Company’s privileges and allowing it to fortify Calcutta.
      - Britain and France were again at war, and Clive and Watson turned on the French settlement of Chandernagore, a few miles up the river. Watson’s ships sailed up and bombarded Fort d’Orléans, and the French surrendered on 23 March 1757. The French factor at Kasimbazar, Jean Law, retreated up the Ganges with his men.
    facts:
      - [Calcutta retaken, "2 January 1757"]
      - [Clive’s attack on the Nawab’s camp, "5 February 1757"]
      - [Treaty of Alinagar, "9 February 1757"]
      - [Chandernagore surrenders, "23 March 1757"]
    markers:
