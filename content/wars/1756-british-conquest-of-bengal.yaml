  - title: Buxar and Allahabad
    date: 1764 – August 1765
    when: "1764-10-23"
    borders: "1765-08-12"
    countries: [in, bd]
    body:
      - Mir Qasim found allies in Shuja-ud-Daula, the Nawab of Awadh, and in the emperor Shah Alam II, who was living in Awadh. Their armies advanced into Bihar in 1764, and on 22–23 October Major Hector Munro, with about 7,000 men, mostly sepoys, met some 40,000 at Buxar on the Ganges. After several hours of hard fighting the allied army broke. Wikipedia gives the British losses as about 850 killed, wounded and missing, and those of the allies as some 2,000 killed and 4,000 wounded.
      - Shah Alam came over to the British camp. Shuja fought on, but was beaten again at Kora in May 1765. Clive returned to India as governor and, at Allahabad in August 1765, settled the peace. The emperor granted the Company the diwani of Bengal, Bihar and Orissa in return for 26 lakh rupees a year and the districts of Kora and Allahabad, and Shuja got Awadh back on payment of 50 lakh rupees. The Nawab of Bengal kept his title, but from now on the Company collected the revenue and commanded the army.
    facts:
      - [Battle of Buxar, "22–23 October 1764, British victory"]
      - [Armies, "British about 7,000; allies about 40,000"]
      - [Diwani granted, "12 August 1765"]
      - [Treaty with Shuja-ud-Daula, "16 August 1765"]
    markers:
