  - title: Berlin, Kolberg and the peace of 1762
    date: 1760–1762
    when: "1760-10"
    borders: "1762-05-05"
    countries: [de, pl, ru, at]
    body:
      - In October 1760, while Frederick was in Silesia, a Russian corps under Gottlob Totleben and Zakhar Chernyshev and an Austrian corps under Franz Moritz von Lacy marched on Berlin. The small garrison withdrew, and the city surrendered on 9 October. The occupiers took a heavy ransom and destroyed arms works, then left three days later as Frederick approached. The Russians had twice besieged the Pomeranian port of Kolberg without success. In 1761 Pyotr Rumyantsev besieged it again by land and sea, and on 16 December its garrison surrendered, giving Russia a harbour for its army in Pomerania.
      - Prussia was close to exhaustion when Empress Elizabeth died on 5 January 1762. Her nephew and heir, Peter III, admired Frederick. He made peace at once, and in the Treaty of Saint Petersburg on 5 May handed back East Prussia and Pomerania, asking nothing in return. In June he allied with Frederick and placed Chernyshev’s corps under his command. Sweden made peace at Hamburg on 22 May. In July Peter was overthrown by his wife, Catherine II, who kept the peace but ended the alliance. Without Russia, Austria could not win, and the Peace of Hubertusburg in February 1763 left Prussia with Silesia.
    facts:
      - [Berlin occupied, "9–12 October 1760"]
      - [Kolberg surrendered, 16 December 1761]
      - [Treaty of Saint Petersburg, "5 May 1762, Russia gives back its conquests"]
    markers:
      - kind: taken
        side: ru
        name: Berlin
        date: 9–12 October 1760
        text: Russian and Austrian troops held the Prussian capital for three days and took a ransom before Frederick’s approach drove them out.
        lonlat: [13.4, 52.52]
      - kind: taken
        side: ru
        name: Kolberg
        date: 16 December 1761
        text: After sieges in 1758 and 1760 had failed, Rumyantsev starved the fortress into surrender.
        lonlat: [15.58, 54.18]
      - kind: event
        name: Königsberg
        date: 1762
        text: Under the Treaty of Saint Petersburg, East Prussia, held by Russia since 1758, went back to Prussia.
        lonlat: [20.51, 54.71]
