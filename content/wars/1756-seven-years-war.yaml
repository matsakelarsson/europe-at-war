notes:
  - Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date Elizabeth’s death 25 December 1761.
  - Sweden’s part in the war is told separately, as the Pomeranian War.
  - The steps follow the war in central Europe, between Prussia and Austria and on the Russian front, with an outline of the war in western Germany. The war at sea, in North America, the Caribbean, West Africa and India is not yet told here.
  - Places in Silesia, Bohemia and Moravia are named in their German forms of the time; the markers give today’s names.
