        lonlat: [-7.243, 39.413]
      - kind: battle
        side: gb
        name: Vila Velha
        date: October 1762
        text: A night attack led by Lieutenant-Colonel Charles Lee broke up a Spanish detachment guarding the crossing of the Tagus.
        lonlat: [-7.67, 39.655]
        lp: l
