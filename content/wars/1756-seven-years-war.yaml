steps:
  - title: Saxony overrun, Lobositz and Pirna
    date: August – October 1756
    when: "1756-08-29"
    borders: "1756-10-16"
    countries: [de, cz, at]
    body:
      - In 1756 Europe’s alliances were turned upside down. Britain, anxious for Hanover, made a treaty with Prussia at Westminster in January, and Austria, which wanted Silesia back, then allied with its old enemy France. Russia was arming to join them. Frederick II decided to strike first. On 29 August his army, over 60,000 strong, marched into Saxony, whose elector, Augustus III, was also king of Poland and leaned towards Austria. The Prussians occupied Dresden on 9 September, and the Saxon army of some 18,000 men shut itself up in a fortified camp at Pirna, on the Elbe above the capital.
      - An Austrian army under Field Marshal Maximilian Ulysses Browne marched north to rescue the Saxons. Frederick met it with about 28,000 men on 1 October at Lobositz, on the Elbe in northern Bohemia. After a long and confused day Browne fell back in good order, but he could not break through to Pirna. Starving after five weeks of blockade, the Saxons tried to cross the Elbe, were trapped beneath the Lilienstein rock and surrendered in mid-October. Frederick forced the men into Prussian regiments, from which many deserted, and Saxony was occupied and squeezed for money and recruits for the rest of the war.
    facts:
      - [Prussian invasion of Saxony, 29 August 1756]
      - [Battle of Lobositz, "1 October 1756, Prussian victory"]
      - [Saxon surrender at Pirna, "Mid-October 1756, about 18,000 men"]
    markers:
      - kind: taken
        side: pr
        name: Dresden
        date: 9 September 1756
        text: The Prussians occupied the Saxon capital. Augustus III soon left for Warsaw, and his electorate was run from Berlin until 1763.
        lonlat: [13.74, 51.05]
        lp: l
      - kind: siege
        side: pr
        name: Pirna
        date: September – October 1756
        text: Blockaded in their camp between Pirna and the fortress of Königstein, the Saxons surrendered beneath the Lilienstein after a failed attempt to escape across the Elbe.
        lonlat: [14.085, 50.931]
      - kind: battle
        side: pr
        name: Battle of Lobositz
        date: 1 October 1756
        text: Today’s Lovosice. Frederick claimed the victory, but Browne’s army withdrew intact and the Prussians lost as many men as the Austrians.
        lonlat: [14.033, 50.513]
    arrows:
      - side: pr
        label: Frederick II
        via: [[13.0, 51.56], [13.74, 51.05], [13.95, 50.75], [14.03, 50.54]]
      - side: at
        label: Browne
        via: [[15.2, 50.03], [14.6, 50.25], [14.13, 50.4], [14.06, 50.5]]
    areas:
      - style: occupied
        side: pr
        label: Occupied by Prussia from 1756
        atoms: [DE-SN, DE-BB~sax, PL-LB~sax, PL-DS~sax, DE-ST~sax, DE-TH~sax, DE-TH~pr1815~sax]
  - title: Prague, Kolín, Rossbach and Leuthen
    date: 1757
    when: "1757-04-18"
    borders: "1757-12-05"
    countries: [cz, de, pl, at, fr]
    body:
      - Frederick invaded Bohemia in April 1757. On 6 May he attacked Prince Charles of Lorraine’s army east of Prague and drove it into the city, losing some 14,000 men; Field Marshal Schwerin was killed carrying a regimental flag, and Browne was mortally wounded. But on 18 June at Kolín Frederick attacked an Austrian relief army under Leopold von Daun and was badly beaten, losing about 14,000 of his 34,000 men, and he had to leave Bohemia. Over the summer the French overran Hanover, the Russians invaded East Prussia and the Swedes Pomerania, and in October an Austrian raid briefly held Berlin to ransom.
      - Frederick saved himself with two famous victories. On 5 November at Rossbach in Saxony, a French and Imperial army of about 41,000 under the Prince of Soubise and Saxe-Hildburghausen tried to march round his flank, and Friedrich Wilhelm von Seydlitz’s cavalry routed it in ninety minutes, for the loss of fewer than 600 Prussians. The Austrians took Schweidnitz and Breslau. Frederick marched east, and on 5 December at Leuthen his 36,000 men rolled up the flank of Charles of Lorraine’s army of about 65,000. The Austrians lost some 22,000 men, more than half of them captured, and Breslau was retaken before Christmas.
    facts:
      - [Battle of Kolín, "18 June 1757, Austrian victory"]
      - [Battle of Rossbach, "5 November 1757, Prussian victory"]
      - [Battle of Leuthen, "5 December 1757, Prussian victory"]
    markers:
      - kind: battle
        side: pr
        name: Battle of Prague
        date: 6 May 1757
        text: Fought around Štěrboholy, east of the city. A costly Prussian victory that left the Austrian army besieged in Prague.
        lonlat: [14.55, 50.083]
        lp: l
      - kind: battle
        side: at
        name: Battle of Kolín
        date: 18 June 1757
        text: Frederick’s first defeat. Daun’s victory saved Prague and forced the Prussians out of Bohemia.
        lonlat: [15.122, 50.029]
      - kind: taken
        side: at
        name: Berlin
        date: 16 October 1757
        text: An Austrian raiding force under András Hadik held the Prussian capital for a day and left with a ransom.
        lonlat: [13.4, 52.52]
      - kind: battle
        side: pr
        name: Battle of Rossbach
        date: 5 November 1757
        text: Seydlitz’s cavalry and a few battalions of infantry routed the French and the Imperial army. It made Frederick a hero in much of Germany and in Britain.
        lonlat: [11.894, 51.269]
      - kind: battle
        side: at
        name: Battle of Breslau
        date: 22 November 1757
        text: Prince Charles beat the Duke of Brunswick-Bevern’s Prussians outside the city, which surrendered soon afterwards.
        lonlat: [17.03, 51.11]
      - kind: battle
        side: pr
        name: Battle of Leuthen
        date: 5 December 1757
        text: Today’s Lutynia. Frederick hid his march behind low hills and fell on the Austrian left wing. Many consider it his masterpiece.
        lonlat: [16.753, 51.152]
        lp: l
    arrows:
      - side: fr
        label: Soubise and Hildburghausen
        via: [[10.9, 50.98], [11.5, 51.15], [11.86, 51.26]]
      - side: at
        label: Charles of Lorraine
        via: [[14.8, 50.9], [15.6, 51.0], [16.5, 50.92], [16.97, 51.08]]
      - side: pr
        label: Frederick II
        via: [[12.37, 51.34], [14.42, 51.18], [16.16, 51.21], [16.72, 51.15]]
  - title: Gross-Jägersdorf and Zorndorf
    date: 1757–1758
    when: "1757-07"
    borders: "1758-08-25"
    countries: [ru, lt, pl, de]
    body:
      - Russia joined Austria and France against Prussia in 1757. Empress Elizabeth’s army, about 55,000 strong under Field Marshal Stepan Apraksin, invaded East Prussia, and a detachment took the port of Memel in July. On 30 August Hans von Lehwaldt’s 28,000 Prussians attacked Apraksin at Gross-Jägersdorf and were beaten off after Pyotr Rumyantsev led reserve regiments through a wood into the fight. Instead of following up, Apraksin fell back to the Neman. He was short of supplies, and perhaps feared that the ailing empress would die and be succeeded by her pro-Prussian nephew Peter. He was dismissed and arrested.
      - His successor, William Fermor, marched into East Prussia in January 1758 almost unopposed. Königsberg surrendered on 22 January, and the province swore allegiance to Elizabeth and stayed under Russian rule for four years. In August Fermor advanced into Brandenburg and bombarded the Oder fortress of Küstrin, setting the town on fire. Frederick II hurried north and on 25 August attacked the Russian army at Zorndorf. With about 11,000 Prussian and some 16,000 Russian casualties it was one of the bloodiest battles of the century. Both sides claimed victory, but Fermor withdrew.
    facts:
      - [Battle of Gross-Jägersdorf, "30 August 1757, Russian victory"]
      - [Königsberg occupied, 22 January 1758]
      - [Battle of Zorndorf, "25 August 1758, indecisive"]
    markers:
      - kind: taken
        side: ru
        name: Memel
        date: July 1757
        text: Russian troops and ships took the Prussian port, today’s Klaipėda, at the start of the invasion.
        lonlat: [21.13, 55.71]
      - kind: battle
        side: ru
        name: Battle of Gross-Jägersdorf
        date: 30 August 1757
        text: Lehwaldt’s Prussians attacked the larger Russian army and were driven off. Apraksin did not pursue.
        lonlat: [21.48, 54.62]
      - kind: taken
        side: ru
        name: Königsberg
        date: 22 January 1758
        text: The capital of East Prussia surrendered without a fight. Its people, the philosopher Immanuel Kant among them, became subjects of the Russian empress.
        lonlat: [20.51, 54.71]
        lp: l
      - kind: event
        side: ru
        name: Küstrin
        date: 15 August 1758
        text: Russian guns set the town on fire, but its fortress held out.
        lonlat: [14.65, 52.58]
        lp: b
      - kind: battle
        name: Battle of Zorndorf
        date: 25 August 1758
        text: A day of slaughter in which both armies lost about a third of their men. The Russians held their ground, then withdrew.
        lonlat: [14.654, 52.672]
        lp: t
    arrows:
      - side: ru
        label: Apraksin
        via: [[23.9, 54.9], [22.7, 54.75], [21.6, 54.63]]
      - side: ru
        label: Fermor
        via: [[17.95, 53.1], [16.9, 52.42], [15.6, 52.6], [14.75, 52.62]]
      - side: pr
        label: Frederick II
        via: [[16.2, 51.2], [15.1, 52.0], [14.6, 52.6]]
    areas:
      - style: occupied
        side: ru
        label: Held by Russia, 1758–1762
        atoms: [RU-KGD, LT-KL~memel, PL-WN!, PL-WN~pl1930]
  - title: Hochkirch and Minden
    date: 1758–1759
    when: "1758-05"
    borders: "1759-08-01"
    countries: [cz, de, at, fr, gb]
    body:
      - In 1758 Frederick invaded Moravia and in May laid siege to Olmütz. On 30 June the Austrian general Ernst Gideon von Laudon destroyed a great Prussian supply convoy at Domstadtl, and Frederick had to give up the siege and retreat through Bohemia. After fighting the Russians at Zorndorf in August he hurried back to Saxony, where Daun’s army had moved close to his own. Before dawn on 14 October the Austrians surprised the Prussian camp at Hochkirch, near Bautzen. Frederick lost over 9,000 men and much of his artillery, and Field Marshal James Keith was killed, but Daun did not follow up his victory.
      - In the west, the French had beaten the Duke of Cumberland’s Hanoverian army at Hastenbeck in July 1757 and occupied Hanover. Britain then paid for a new army of Hanoverians, Hessians and Brunswickers under Duke Ferdinand of Brunswick, joined by British troops in 1758. It drove the French back over the Rhine early in 1758 and beat them at Krefeld on 23 June. On 1 August 1759 at Minden on the Weser, British and Hanoverian infantry, advancing through a misunderstood order, broke charge after charge of the French cavalry, and the French retreated. Ferdinand’s army shielded Hanover and Prussia’s western flank until the end of the war.
    facts:
      - [Battle of Hochkirch, "14 October 1758, Austrian victory"]
      - [Battle of Krefeld, "23 June 1758, allied victory"]
      - [Battle of Minden, "1 August 1759, allied victory"]
    markers:
      - kind: siege
        side: at
        name: Olmütz
        date: May – July 1758
        text: The Moravian fortress, today’s Olomouc, held out until the loss of his supply convoy forced Frederick to give up the siege.
        lonlat: [17.251, 49.594]
        lp: l
      - kind: battle
        side: at
        name: Battle of Domstadtl
        date: 30 June 1758
        text: Laudon ambushed the huge wagon train bringing supplies and money to the siege, at today’s Domašov nad Bystřicí.
        lonlat: [17.44, 49.74]
      - kind: battle
        side: at
        name: Battle of Hochkirch
        date: 14 October 1758
        text: Daun’s night march and dawn attack caught the Prussians in their camp. Keith and Prince Francis of Brunswick were among the dead.
        lonlat: [14.57, 51.149]
      - kind: battle
        side: gb
        name: Battle of Krefeld
        date: 23 June 1758
        text: Ferdinand of Brunswick beat a larger French army under the Count of Clermont on the left bank of the Rhine.
        lonlat: [6.567, 51.333]
      - kind: battle
        side: gb
        name: Battle of Minden
        date: 1 August 1759
        text: The allied victory saved Hanover. The British cavalry commander, Lord George Sackville, refused to charge and was court-martialled.
        lonlat: [8.891, 52.328]
    arrows:
      - side: pr
        label: Frederick II
        via: [[17.33, 50.47], [17.6, 49.95], [17.3, 49.63]]
      - side: fr
        label: Contades
        via: [[8.77, 50.81], [8.75, 51.7], [8.87, 52.27]]
  - title: Kunersdorf
    date: 1759
    when: "1759-07"
    borders: "1759-08-12"
    countries: [pl, de, ru, at]
    body:
      - In 1759 a new commander, Pyotr Saltykov, led the Russian army west through Poland towards the Oder to join the Austrians. On 23 July he beat a smaller Prussian force under Carl Heinrich von Wedel at Kay, near Paltzig, then took Frankfurt an der Oder, where Austrian troops under Ernst Gideon von Laudon joined him. Frederick gathered about 50,000 men, crossed the Oder north of Frankfurt and on 12 August attacked the allied army of some 60,000, dug in on the hills by the village of Kunersdorf.
      - His first attacks drove in the Russian left, but his tired troops were thrown back again and again from the heights, and Laudon’s cavalry finally broke them. About 19,000 Prussians were killed, wounded or captured, more than a third of the army, and the allies lost some 16,000. That night Frederick wrote that all was lost. But Saltykov, whose army had suffered terribly, and the Austrian commander Leopold von Daun did not march on Berlin, and their armies drew apart. Frederick called his escape the “miracle of the House of Brandenburg”.
    facts:
      - [Battle of Kay, "23 July 1759, Russian victory"]
      - [Battle of Kunersdorf, "12 August 1759, Russian and Austrian victory"]
      - [Prussian losses at Kunersdorf, "About 19,000 of some 50,000"]
    markers:
      - kind: battle
        side: ru
        name: Battle of Kay
        date: 23 July 1759
        text: Wedel attacked Saltykov’s stronger army on Frederick’s orders and was beaten, opening the way to the Oder.
        lonlat: [15.55, 52.16]
      - kind: taken
        side: ru
        name: Frankfurt an der Oder
        date: 31 July 1759
        text: Occupied by the Russians, who joined the Austrians here.
        lonlat: [14.55, 52.35]
        lp: l
      - kind: battle
        side: ru
        name: Battle of Kunersdorf
        date: 12 August 1759
        text: Frederick’s worst defeat. His army was scattered, and for a few days he had only a few thousand men left under arms.
        lonlat: [14.63, 52.34]
        lp: b
    arrows:
      - side: ru
        label: Saltykov
        via: [[16.9, 52.42], [15.9, 52.2], [15.0, 52.3], [14.7, 52.34]]
      - side: at
        label: Laudon
        via: [[15.0, 51.55], [14.75, 51.95], [14.64, 52.28]]
      - side: pr
        label: Frederick II
        via: [[14.3, 52.22], [14.55, 52.52], [14.72, 52.42], [14.66, 52.36]]
    areas:
      - style: occupied
        side: ru
        label: Held by Russia, 1758–1762
        atoms: [RU-KGD, LT-KL~memel, PL-WN!, PL-WN~pl1930]
  - title: Liegnitz and Torgau
    date: June – November 1760
    when: "1760-06-23"
    borders: "1760-11-03"
    countries: [pl, de, at, ru]
    body:
      - By 1760 Prussia was short of men and money, and the Austrians took the initiative. On 23 June Laudon destroyed Fouqué’s Prussian corps at Landeshut in Silesia, and in July he took Glatz. Frederick besieged Dresden, and his guns burned much of the city, but he could not take it. He marched to Silesia, where Laudon, Daun and a Russian army were closing in. At dawn on 15 August near Liegnitz he caught Laudon’s corps on its own and beat it before the others could come up. The Austrians lost some 8,500 men, more than half of them captured, and the Russians drew back across the Oder.
      - In October, while Frederick was still in Silesia, Russian and Austrian troops briefly occupied Berlin. He turned back to Saxony, and on 3 November attacked Daun’s army, dug in on the Süptitz heights outside Torgau. His columns went in piecemeal and were shot down, and by nightfall he thought the battle lost, until Hans Joachim von Zieten’s corps stormed the heights from the south. Daun, wounded, withdrew across the Elbe in the night. Torgau was one of the bloodiest battles of the war, with by some counts up to 16,000 Prussian and 15,000 Austrian casualties, and it left the Austrians little of Saxony beyond Dresden.
    facts:
      - [Battle of Landeshut, "23 June 1760, Austrian victory"]
      - [Battle of Liegnitz, "15 August 1760, Prussian victory"]
      - [Battle of Torgau, "3 November 1760, Prussian victory"]
    markers:
      - kind: battle
        side: at
        name: Battle of Landeshut
        date: 23 June 1760
        text: Today’s Kamienna Góra. Laudon’s much larger force stormed Fouqué’s entrenchments, and most of the Prussian corps was killed or captured.
        lonlat: [16.03, 50.78]
      - kind: taken
        side: at
        name: Glatz
        date: 26 July 1760
        text: Laudon took the fortress, today’s Kłodzko, which the Austrians held until the peace.
        lonlat: [16.65, 50.44]
      - kind: held
        side: at
        name: Dresden
        date: July 1760
        text: The Austrian garrison held out against Frederick’s siege. His bombardment destroyed much of the old town, including the Kreuzkirche.
        lonlat: [13.74, 51.05]
      - kind: battle
        side: pr
        name: Battle of Liegnitz
        date: 15 August 1760
        text: Fought north-east of today’s Legnica. Frederick’s victory stopped the Austrian and Russian armies from joining forces.
        lonlat: [16.188, 51.225]
      - kind: battle
        side: pr
        name: Battle of Torgau
        date: 3 November 1760
        text: A costly victory won only at dusk. Frederick was hit in the chest by a spent musket ball.
        lonlat: [12.93, 51.575]
    arrows:
      - side: pr
        label: Frederick, August
        via: [[13.74, 51.05], [14.98, 51.15], [16.1, 51.2]]
      - side: at
        label: Laudon
        via: [[16.05, 50.8], [16.15, 51.05], [16.2, 51.2]]
      - side: pr
        label: Frederick, October
        via: [[16.16, 51.21], [14.7, 51.95], [13.3, 51.8], [12.97, 51.6]]
  - title: Berlin, Kolberg and the peace of 1762
    date: 1760–1762
    when: "1760-10"
    borders: "1762-05-05"
    countries: [de, pl, ru, at]
    body:
      - In October 1760, while Frederick was in Silesia, a Russian corps under Gottlob Totleben and Zakhar Chernyshev and an Austrian corps under Franz Moritz von Lacy marched on Berlin. The small garrison withdrew, and the city surrendered on 9 October. The occupiers took a heavy ransom and destroyed arms works, then left three days later as Frederick approached. The Russians had twice besieged the Pomeranian port of Kolberg without success. In 1761 Pyotr Rumyantsev besieged it again by land and sea, and on 16 December its garrison surrendered, giving Russia a harbour for its army in Pomerania.
      - Prussia was close to exhaustion when Empress Elizabeth died on 5 January 1762. Her nephew and heir, Peter III, admired Frederick. He made peace at once, and in the Treaty of Saint Petersburg on 5 May handed back East Prussia and Pomerania, asking nothing in return. In June he allied with Frederick and placed Chernyshev’s corps under his command. Sweden made peace at Hamburg on 22 May. In July Peter was overthrown by his wife, Catherine II, who kept the peace but ended the alliance. Without Russia, Austria could not win, and the Peace of Hubertusburg in February 1763 left Prussia with Silesia.
    facts:
      - [Berlin occupied, "9–12 October 1760"]
      - [Kolberg surrendered, 16 December 1761]
      - [Treaty of Saint Petersburg, "5 May 1762, Russia gives back its conquests"]
    markers:
      - kind: taken
        side: ru
        name: Berlin
        date: 9–12 October 1760
        text: Russian and Austrian troops held the Prussian capital for three days and took a ransom before Frederick’s approach drove them out.
        lonlat: [13.4, 52.52]
      - kind: taken
        side: ru
        name: Kolberg
        date: 16 December 1761
        text: After sieges in 1758 and 1760 had failed, Rumyantsev starved the fortress into surrender.
        lonlat: [15.58, 54.18]
      - kind: event
        name: Königsberg
        date: 1762
