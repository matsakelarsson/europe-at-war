notes:
  - Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date Elizabeth’s death 25 December 1761.
  - Sweden’s part in the war is told separately, as the Pomeranian War.
  - The steps so far follow the war between Russia and Prussia.
