  - title: Exhaustion and the Peace of Hubertusburg
    date: 1761 – February 1763
    when: "1761-08"
    borders: "1763-02-15"
    countries: [de, pl, at]
    body:
      - Prussia could no longer win the war, only avoid losing it. In August 1761 Frederick dug his army in at Bunzelwitz in Silesia, and the far larger Austrian and Russian armies did not dare attack; but once he had moved away, Laudon stormed Schweidnitz on 1 October. Britain stopped its subsidies in 1762. Then Russia made peace. On 21 July Frederick drove the Austrians from the heights of Burkersdorf, while a Russian corps, ordered home after Peter III’s overthrow, stood by in his lines. He retook Schweidnitz in October, and on 29 October Prince Henry beat the Austrians and the Imperial army at Freiberg in Saxony.
      - Britain and France agreed peace terms in November 1762, and Austria, on its own, could not hope to defeat Prussia. Envoys of Austria, Prussia and Saxony met at the Saxon hunting lodge of Hubertusburg, and on 15 February 1763, five days after the Treaty of Paris, they agreed to restore the borders of 1756. Prussia kept Silesia and Glatz and left Saxony, and Frederick promised his vote to Maria Theresa’s son Joseph at the next imperial election. The war had cost Prussia, by some estimates, a tenth of its people, and left Saxony ruined, but it made Prussia one of Europe’s great powers.
    facts:
      - [Battle of Freiberg, "29 October 1762, Prussian victory"]
      - [Peace of Hubertusburg, 15 February 1763]
      - [Result, "The borders of 1756; Silesia stays Prussian"]
    markers:
      - kind: held
        side: pr
        name: Bunzelwitz
        date: August – September 1761
        text: For three weeks Laudon’s Austrians and Alexander Buturlin’s Russians faced Frederick’s entrenched camp, today in Bolesławice, without attacking.
        lonlat: [16.464, 50.893]
        lp: t
      - kind: siege
        name: Schweidnitz
        date: 1761–1762
        text: Today’s Świdnica. Laudon took the fortress by storm on 1 October 1761, and Frederick won it back after a two-month siege on 9 October 1762.
        lonlat: [16.483, 50.85]
      - kind: battle
        side: pr
        name: Battle of Burkersdorf
        date: 21 July 1762
        text: Frederick’s troops stormed Daun’s positions on the hills south of Schweidnitz, near today’s Burkatów.
        lonlat: [16.466, 50.793]
        lp: b
      - kind: battle
        side: pr
        name: Battle of Freiberg
        date: 29 October 1762
        text: Prince Henry’s victory, the last great battle of the war in Germany, secured most of Saxony for Prussia.
        lonlat: [13.343, 50.912]
      - kind: treaty
        name: Peace of Hubertusburg
        date: 15 February 1763
        text: Austria, Prussia and Saxony made peace on the basis of the borders of 1756 at this hunting lodge near Wermsdorf.
        lonlat: [12.94, 51.278]
  - title: Minorca and Portugal
    date: 1756–1763
    when: "1762-05-05"
    borders: "1763-02-10"
    countries: [es, pt, gb, fr]
    body:
      - The war between Britain and France had begun in the Mediterranean, months before Frederick invaded Saxony. On 18 April 1756 a French army of some 15,000 men under the Duke of Richelieu landed on Minorca, British since 1708, and besieged Fort St Philip, which guarded Port Mahon. Admiral John Byng, sent with a fleet to relieve it, fought an indecisive battle with the French fleet off the island on 20 May and then sailed back to Gibraltar, and the garrison surrendered on 29 June. Byng was court-martialled for failing to do his utmost and shot on the deck of a warship at Portsmouth in March 1757, “to encourage the others”, as Voltaire put it in Candide.
      - Spain joined France in January 1762 under the Bourbon Family Compact, and when Portugal, Britain’s ally, refused to close its ports to British ships, Spanish armies invaded it on 5 May. A first army of 22,000 took Miranda do Douro, Bragança and Chaves in Trás-os-Montes, but peasant bands cut its supplies and it fell back. Britain sent some 7,000 troops, and the Count of Schaumburg-Lippe took command of the reorganised Portuguese army. A second, Franco-Spanish army under the Count of Aranda took Almeida in August and pushed towards Abrantes. The allies raided the Spanish bases at Valencia de Alcántara and Vila Velha, peasants stripped the country bare, and hunger, sickness and desertion broke the invaders; a British report put their losses at 30,000. A truce followed in December. By the Treaty of Paris of 10 February 1763 Spain gave back its conquests, Britain returned Havana, taken from Spain in 1762, in exchange for Florida, and France handed Minorca back to Britain.
    facts:
      - [Fort St Philip surrenders, "29 June 1756"]
      - [Spanish invasion of Portugal, "5 May – 24 November 1762"]
      - [Treaty of Paris, "10 February 1763: Minorca returned to Britain"]
    markers:
      - kind: event
        side: fr
        name: French landing
        date: 18 April 1756
        text: Richelieu’s army came ashore at Ciutadella, at the western end of the island, and marched east to Mahon.
        lonlat: [3.838, 40.0]
      - kind: naval
        name: Battle of Minorca
        date: 20 May 1756
        text: The British and French fleets fought an inconclusive action south-east of the island. Byng then held a council of war and sailed back to Gibraltar, leaving the garrison to its fate.
        lonlat: [4.5, 39.72]
        lp: b
      - kind: siege
        side: fr
        name: Fort St Philip
        date: 20 April – 29 June 1756
        text: The garrison under Lieutenant-Governor William Blakeney, then in his eighties, held out for more than two months and marched out with the honours of war.
        lonlat: [4.3, 39.871]
      - kind: taken
        side: es
        name: Miranda do Douro
        date: 9 May 1762
        text: An accidental explosion of the castle’s powder magazine killed some 400 people and blew breaches in the walls, and the town surrendered.
        lonlat: [-6.274, 41.495]
      - kind: siege
        side: es
        name: Almeida
