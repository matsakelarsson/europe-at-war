id: seven-years-war
name: Seven Years’ War
start: "1756"
end: "1763"
tier: B
summary: A war in which Prussia and Great Britain, with Hanover, fought Austria, France, Russia, Sweden and most of the Holy Roman Empire, while Britain and France, joined by Spain in 1762, fought at sea and in North America, the Caribbean, West Africa and India. Prussia survived invasions from all sides and kept Silesia at the Peace of Hubertusburg in 1763, and the Treaty of Paris left Britain the leading colonial power.
