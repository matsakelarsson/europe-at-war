    body:
      - In the Seven Years’ War Sweden joined France, Austria and Russia against Prussia, hoping to win back the Pomeranian lands lost in 1720. Swedish troops crossed into Prussian territory on 13 September 1757, but were driven back and blockaded in Stralsund until a Russian army came to their rescue in 1758.
      - The war went back and forth across Pomerania, Brandenburg and Mecklenburg in small battles such as Tornow and Fehrbellin in September 1758, and Swedish ships beat a Prussian flotilla on the Stettin Lagoon in 1759. When Russia made peace and allied with Prussia in May 1762, Sweden had to give up. The Treaty of Hamburg on 22 May 1762 restored the pre-war borders.
