summary: "Sweden’s part in the Seven Years’ War: it joined France, Austria and Russia against Prussia, hoping to regain the Pomeranian lands lost in 1720. Five years of inconclusive fighting in Pomerania and Brandenburg ended with the Treaty of Hamburg in 1762, which restored the pre-war borders."
