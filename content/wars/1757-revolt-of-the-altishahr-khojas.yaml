  - title: The Black River camp
    date: October 1758 – February 1759
    when: "1758-10"
    borders: "1758-12-01"
    countries: [cn]
    body:
      - Zhaohui, the victor of the Dzungar campaigns, took over the command and in October 1758 advanced on Yarkand with a few thousand men. He could not take the city, and after a battle outside it at Tonguzluq the khojas’ troops surrounded his army in a camp on the Black River (Kara Usu) near Yarkand. The Qing troops dug in and held out for about three months, through the winter, living on what they could find; Qing accounts tell of them finding buried grain and recovering the enemy’s lead shot from the trees they cut for firewood.
      - A relief force of about 600 men under Fude and Machang came up from Aksu early in 1759. On 3 February 1759 more than 5,000 horsemen under Burhan al-Din attacked it at Qurman, north-east of Yarkand, but were beaten off, and Zhaohui broke out of the camp to join the relief force. Both armies withdrew to Aksu to prepare a new campaign.
    facts:
      - [Siege of the Black River camp, "October 1758 – February 1759"]
      - [Battle of Qurman, "3 February 1759, Qing victory"]
