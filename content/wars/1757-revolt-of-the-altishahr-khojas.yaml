steps:
  - title: The khojas break with the Qing
    date: 1755–1758
    when: "1757"
    borders: "1757-06-01"
    countries: [cn]
    body:
      - The Afaqi Khojas, descendants of the Sufi master Afaq Khoja, had ruled the oasis cities of the Tarim basin for the Dzungars since 1680, until the Dzungars, distrusting them, kept the family as hostages in the Ili valley. When the Qing armies reached Ili in 1755 they freed the brothers Burhan al-Din and Khoja Jahan, and sent Burhan al-Din back to Kashgar and Yarkand to rule for them. Khoja Jahan joined Amursana’s revolt and then followed his brother south.
      - With the Qing fighting Amursana in Dzungaria, the brothers decided to rule on their own. In 1757 Khoja Jahan killed the Qing envoy Amindao and his escort, and the khojas proclaimed their independence. Many begs of the oases followed them; others, and the rulers of Turfan and Hami, stayed with the Qing.
      - Early in 1758 a Qing army of about 10,000 men under Yarhashan marched west from Turfan along the northern rim of the basin and besieged Kucha, where Khoja Jahan held out for months before slipping away to the west. Aksu and Uch Turfan opened their gates, and Yarhashan, blamed for letting the khojas escape, was recalled and executed.
    facts:
      - [Khojas proclaim independence, "1757"]
      - [Siege of Kucha, "summer 1758"]
      - [Qing army, "about 10,000 men"]
