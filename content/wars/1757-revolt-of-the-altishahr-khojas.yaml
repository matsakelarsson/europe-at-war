  - title: Kashgar, Yarkand and the Pamirs
    date: June – September 1759
    when: "1759-07"
    borders: "1759-09-01"
    countries: [cn, tj, af]
    body:
      - In the summer of 1759 Zhaohui and Fude marched on Yarkand and Kashgar again. The khojas had lost the support of many of the townspeople, and both cities opened their gates as the brothers fled west with their followers into the Pamirs. Qing troops pursued them, defeating them at Arcul on 1 September and again at Yesil Kol Nor (Yashilkul), and the khojas crossed into Badakhshan.
      - Sultan Shah, the ruler of Badakhshan, at first refused to give them up. Under Qing threats he had them killed and sent Khoja Jahan’s head to the Qing; Burhan al-Din’s remains were later sent to Yarkand. The Qianlong emperor celebrated the conquest at Beijing, and Altishahr and Dzungaria were united as Xinjiang under the General of Ili, with Qing councillors at Kashgar and Yarkand ruling through local hakim begs. Burhan al-Din’s son Sarimsaq escaped to Kokand, and his descendants led the khoja invasions of the 19th century.
    facts:
      - [Kashgar and Yarkand taken, "summer 1759"]
      - [Battle of Arcul, "1 September 1759, Qing victory"]
      - [Khojas killed in Badakhshan, "autumn 1759"]
