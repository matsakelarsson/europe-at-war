id: revolt-of-the-altishahr-khojas
name: Revolt of the Altishahr Khojas
start: "1757"
end: "1759-09"
tier: B
summary: "The war in which the Qing empire conquered Altishahr, the oasis cities of the Tarim basin, from the Afaqi Khojas, a family of Sufi leaders who had ruled them under the Dzungars. Released from Dzungar captivity by the Qing in 1755, the brothers Burhan al-Din and Khoja Jahan returned to Kashgar and Yarkand as Qing vassals, but in 1757, while the Qing were fighting Amursana, they declared their independence and killed a Qing envoy. In 1758 a Qing army took Kucha, Aksu and Uch Turfan, but the brothers escaped, and Zhaohui’s army was besieged for three months at the Black River camp outside Yarkand until relieved in February 1759. In the summer of 1759 the Qing took Kashgar and Yarkand, and the khojas fled over the Pamirs to Badakhshan, where the ruler Sultan Shah had them killed and sent Khoja Jahan’s head to the Qing. Altishahr was joined to Dzungaria as Xinjiang and governed through local begs under Qing military officials; the khojas’ descendants in exile led new invasions from Kokand in the 19th century."
countries: [cn, tj, af]
sides:
  - id: qing
    name: Qing empire and allied begs
    polities: [qing]
    ink: gold
    moves: Qing moves
    success: Qing success
  - id: khoja
    name: Afaqi Khojas (Burhan al-Din and Khoja Jahan)
    polities: [afaqi-khojas]
    ink: green
    moves: Khoja moves
    success: Khoja success
notes:
  - "The brothers are known by many names: Burhan al-Din as the Greater Khoja (Chinese Da Hezhuo, Boluonidu), Khoja Jahan (Khwaja-i Jahan) as the Lesser Khoja (Xiao Hezhuo, Huojizhan). The Afaqi (White Mountain) Khojas were rivals of the Ishaqi (Black Mountain) Khojas, some of whom sided with the Qing."
  - Several Turkic Muslim leaders fought for the Qing, among them Emin Khoja of Turfan, the rulers of Hami and Khojis, the hakim beg of Uch Turfan. Dates are converted from the Chinese lunar calendar and may differ by weeks between sources.
