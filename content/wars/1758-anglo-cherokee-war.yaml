  - title: Grant’s campaign and the peace
    date: 1761
    when: "1761-06-10"
    borders: "1761-06-10"
    countries: [us]
    body:
      - "In 1761 Lieutenant Colonel James Grant led some 2,400 to 2,800 men, British regulars, South Carolina provincials, among them the young Francis Marion, and Catawba, Chickasaw, Mohawk and Stockbridge warriors, from Fort Prince George into the mountains. On 10 June the Cherokee attacked his column near Echoe, where they had stopped Montgomery, but Grant fought his way through. Over the next month his army burned some fifteen Middle towns (eighteen by some counts), their fields and food stores, and drove about 5,000 people into the mountains, where many faced famine; smallpox had already killed many Cherokee in 1759–1760."
      - "Attakullakulla, who had kept faith with the British, led the Cherokee to peace. A Virginia army under Adam Stephen had advanced to the Long Island of the Holston, where Overhill leaders made peace with Virginia in November 1761, and in December a treaty with South Carolina was signed at Charles Town, setting a boundary that took Cherokee hunting lands. The Virginia officer Henry Timberlake went to the Overhill towns and in 1762 took Ostenaco and two other leaders to London to meet George III."
    facts:
