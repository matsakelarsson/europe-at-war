id: anglo-cherokee-war
name: Anglo-Cherokee War
start: "1758-05"
end: "1761-12"
tier: B
summary: "A war between the Cherokee and the British colonies of South Carolina, Virginia and North Carolina, backed by British regular troops, during the French and Indian War. The Cherokee had been Britain’s allies, and hundreds of their warriors served against the French in 1758, but Virginia frontiersmen killed some 30 to 40 of them on their way home, and their kin took revenge on the frontier as Cherokee law required. Governor William Henry Lyttelton of South Carolina seized Cherokee peace envoys as hostages in 1759; in February 1760 Oconostota besieged Fort Prince George, and after its commander was killed the garrison put the hostages to death. In 1760 the Cherokee raided the Carolina backcountry, turned back a British army under Archibald Montgomery at Echoe, and starved Fort Loudoun into surrender, killing many of its garrison as they marched away. In 1761 a larger army under James Grant fought its way into the Middle towns and burned some fifteen to eighteen towns and their crops, leaving thousands of Cherokee facing famine. Attakullakulla led the Cherokee to peace in treaties with Virginia and South Carolina at the end of 1761."
countries: [us]
sides:
  - id: che
    name: Cherokee (Oconostota, Standing Turkey, Ostenaco and other leaders)
    polities: [cherokee]
    ink: red
    moves: Cherokee moves
    success: Cherokee success
  - id: brit
    name: South Carolina, Virginia and North Carolina, with British regulars and Catawba, Chickasaw, Mohawk and Stockbridge allies
    polities: [british-america, united-kingdom, catawba, chickasaw]
    ink: navy
    moves: British and colonial moves
    success: British and colonial success
notes:
  - Also called the Cherokee War or the Cherokee Uprising. The Cherokee lived in four groups of towns, the Lower towns in today’s north-western South Carolina, the Middle and Valley towns in western North Carolina and the Overhill towns in eastern Tennessee, each with its own leaders; the Overhill leader Attakullakulla (Little Carpenter) worked for peace with Britain throughout.
  - Most accounts come from British officers and colonial officials. Numbers are uncertain, among them the number of hostages killed at Fort Prince George, which ranges from 14 to 23 in different sources.
