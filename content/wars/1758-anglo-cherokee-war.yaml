steps:
  - title: Allies turned enemies
    date: 1758–1759
    when: "1758-05"
    borders: "1759-12-26"
    countries: [us]
    body:
      - "The Cherokee were Britain’s most important allies in the South. Britain built Fort Prince George by the Lower town of Keowee in 1753 and Fort Loudoun among the Overhill towns in 1756–1757, partly to keep the French and their allies out, and several hundred Cherokee warriors joined General John Forbes’s campaign against Fort Duquesne in 1758. On their way home through the Virginia backcountry some of them took horses they believed they were owed, and Virginia frontiersmen killed and scalped some 30 to 40 Cherokee. Under Cherokee law the kin of the dead had to take revenge, and war parties killed settlers on the frontiers of North and South Carolina; French agents from Fort Toulouse encouraged them."
      - "In the autumn of 1759 Oconostota, the great warrior of Chota, led a delegation to Charles Town to make peace. Governor William Henry Lyttelton refused to treat, held the envoys and marched with well over 1,000 militia (1,100 to 1,700 by different counts) to Fort Prince George, where late in December he forced a treaty on the Cherokee leaders who came there: they were to hand over the men who had killed settlers, and about two dozen of the envoys were kept in the fort as hostages until they did. Smallpox broke out in Lyttelton’s camp, and he hurried home, claiming a victory."
    facts:
      - [Cherokee killed in Virginia, "30–40 (1758)"]
      - [Lyttelton’s treaty at Fort Prince George, "late December 1759 (22 or 26 December in different accounts)"]
