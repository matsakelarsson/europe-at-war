  - title: Fort Prince George, Echoe and Fort Loudoun
    date: 1760
    when: "1760-02-16"
    borders: "1760-08-10"
    countries: [us]
    body:
      - "In February 1760 Cherokee war parties fell on the Carolina backcountry; at Long Canes on 1 February they killed some 23 settlers fleeing towards Augusta. Oconostota besieged Fort Prince George, and on 16 February he lured its commander, Lieutenant Richard Coytmore, out to a parley, where Coytmore was shot. The garrison killed the hostages in the fort, between 14 and 23 men by different accounts, and the war spread along the whole frontier. In March the Overhill Cherokee began to besiege Fort Loudoun."
      - "General Jeffery Amherst sent Colonel Archibald Montgomery south with some 1,200 to 1,600 Highland and Royal Scots regulars, joined by provincials and Catawba scouts. In June they burned the Lower towns, Keowee among them, killing and capturing their people, then marched into the mountains towards the Middle towns. On 27 June the Cherokee ambushed them at the pass near Echoe and killed or wounded nearly 100; Montgomery turned back and sailed for New York."
      - "Fort Loudoun, with no hope of relief, surrendered on 7–8 August to Oconostota and Standing Turkey on terms that let the garrison march to the settlements. On 10 August some 700 Cherokee attacked the column near Cane Creek, killing the commander Paul Demeré, two other officers, 23 soldiers and three women, and took most of the rest captive. Attakullakulla ransomed the trader and officer John Stuart, later Britain’s superintendent of Indian affairs in the South."
    facts:
