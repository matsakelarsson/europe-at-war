notes:
  - "Dates are those of the Burmese chronicles and French missionary letters as given in the sources cited. Burmese sources give the army as 46,000 men and 3,500 horses, Thai sources 30,000."
  - "The cause of Alaungpaya’s death is disputed: the Burmese chronicles say he died of dysentery; Thai chronicles and some French accounts say he was injured when a cannon burst while he was directing the bombardment of the palace."
  - "Names: Tavoy is today’s Dawei, Mergui Myeik and Martaban Mottama. In Thailand the war is called Alaungpaya’s War."
