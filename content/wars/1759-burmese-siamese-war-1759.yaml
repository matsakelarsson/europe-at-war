id: burmese-siamese-war-1759
name: Burmese–Siamese War (1759–1760)
start: "1759-12-21"
end: "1760-05-11"
tier: B
summary: "Alaungpaya’s invasion of Siam, the first Burmese army to reach Ayutthaya since 1587. Having united Burma, Alaungpaya accused Siam of sheltering Mon rebels and, when the Siamese at Mergui held a ship he claimed as his, left Rangoon on 21 December 1759 with about 40,000 men. His armies took Tavoy, Mergui and Tenasserim, crossed the hills by the Singkhon Pass in March 1760, swept up the Gulf coast through Kuiburi, Phetchaburi and Ratchaburi, and reached Ayutthaya at the end of March. Siam, weakened by quarrels between King Ekkathat and his brother Uthumphon, held out behind its walls. The Burmese burned the suburbs, massacred refugees outside the southern moat on 13 April and shelled the palace, but on 16 April Alaungpaya fell ill, from dysentery by the Burmese chronicles, from a bursting cannon by Siamese and French accounts. The army withdrew by the Mae Sot pass, and Alaungpaya died on the march on 11 May 1760. Burma kept Tavoy; the war prepared the invasion that destroyed Ayutthaya in 1767."
countries: [mm, th]
sides:
  - id: kb
    name: Konbaung Burma (Alaungpaya)
    polities: [konbaung]
    ink: brown
