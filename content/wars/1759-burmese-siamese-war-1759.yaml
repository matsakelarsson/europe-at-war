steps:
  - title: Tenasserim and the Gulf coast
    date: December 1759 – March 1760
    when: "1759-12"
    borders: "1760-03"
    countries: [mm, th]
    body:
      - "Siam had sheltered Mon refugees after the fall of Pegu, and in 1758 the Mon of Lower Burma rose again. In September 1759 the Siamese at Mergui refused to hand over a Mon ship that Alaungpaya claimed as a royal Burmese vessel. Seeing himself as a universal Buddhist ruler, a cakkavatti, and resolved to end the shelter Siam gave the Mon, he left Rangoon on 21 December 1759 with his son, the prince of Myedu (later King Hsinbyushin), and his old comrade Minkhaung Nawrahta in command of the vanguard. Tavoy, independent since 1752, fell in December or early January; Mergui and Tenasserim followed in February 1760, after Siam refused his demands for the ship and for the return of refugees."
      - "In early March the Burmese crossed the Tenasserim hills by the Singkhon Pass and routed the Siamese force sent to meet them. Ayutthaya was taken by surprise. At Wakhao beach a local official, Khun Rong Palat Chu, made a stand that Thai tradition remembers; Kuiburi fell on 16 March and Phetchaburi surrendered around 22 March, followed by Ratchaburi and Suphanburi. In Ayutthaya the supporters of King Ekkathat were pushed aside and his brother Uthumphon, who had abdicated in 1758 to become a monk, took command. At the Noi river, late in March, Siamese gunners caught the vanguard crossing; Alaungpaya’s main army arrived to save it, and the Siamese commander was killed."
    facts:
      - ["Burmese army", "about 40,000 men (46,000 by Burmese sources, 30,000 by Thai)"]
      - ["Mergui taken", "early February 1760"]
      - ["Kuiburi taken", "16 March 1760"]
