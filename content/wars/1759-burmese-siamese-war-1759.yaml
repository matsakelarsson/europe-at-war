  - title: Before Ayutthaya, and the retreat
    date: March – May 1760
    when: "1760-04"
    borders: "1760-05"
    countries: [th, mm]
    body:
      - "On 27 March 1760 Alaungpaya made camp at Ban Kum, in today’s Bang Ban district, about ten kilometres north-west of Ayutthaya. The Siamese kept to their walls, waiting for the rains, and sent envoys to buy time. Minkhaung Nawrahta brought the vanguard to the northern wall on 8 April; the Burmese burned the houses outside the walls, and on 13 April a force of about 2,000 men fell on the southern suburbs, killing many of the people who had taken refuge there and the foreign merchants among them; the head of the Dutch trading post drowned. From 14 April the Burmese shelled the city, and on 16 April guns placed at Wat Na Phramen, just off the northern wall, struck the royal palace."
      - "That day Alaungpaya fell ill. The army withdrew from the walls that night and on 17 April began its retreat, leaving Minkhaung Nawrahta’s regiment at Ban Kum as a rearguard; it beat off the Siamese pursuit ordered by Uthumphon on 20 April and left around 25 April. The army went home by the Mae Sot pass. Alaungpaya died on 11 May 1760 at Kinywa, in today’s Bilin township, between Myawaddy and Martaban, aged 45. Burma kept Tavoy, but the Tenasserim coast south of it stayed Siamese until 1765. His son Hsinbyushin, who had led the vanguard, would return."
    facts:
