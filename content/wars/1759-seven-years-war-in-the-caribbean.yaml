  - title: Dominica, Martinique and the Windward Islands
    date: "June 1761 – March 1762"
    when: "1762-02"
    borders: "1762-03-05"
    countries: [fr, dm, lc, gd, vc, gb]
    body:
      - "Dominica and Saint Vincent had been declared neutral by France and Britain in 1748 and left to their Kalinago and Garifuna inhabitants, but French colonists had moved onto both. On 6 June 1761 troops under Lord Rollo, brought from North America and Guadeloupe by Commodore Sir James Douglas, landed at Roseau on Dominica and stormed the French positions above the town; the inhabitants swore allegiance the next day."
      - "After the fall of Canada more troops were free, and Monckton sailed from Barbados on 5 January 1762 with some 8,000 soldiers in Rodney’s fleet. They landed on Martinique on 16 January at Case Navire, north of Fort-Royal, and fought their way over the steep ridges that guarded the town, storming the Morne Tortenson on 24 January and the Morne Grenier on 27 January, where the French militia were routed. Fort-Royal surrendered on 4 February, and on 12 February Governor Louis-Charles Le Vassor de La Touche capitulated for the whole island at Saint-Pierre. Saint Lucia gave up on 26 February, Grenada on 4 March and Saint Vincent a few days later, leaving France with no colony in the Windward Islands."
    facts:
      - [Dominica taken, "6–7 June 1761"]
      - [British landing on Martinique, "16 January 1762"]
      - [Martinique capitulates, "12 February 1762"]
