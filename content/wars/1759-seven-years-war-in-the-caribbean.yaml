steps:
  - title: Martinique repulsed, Guadeloupe taken
    date: "January – May 1759"
    when: "1759"
    borders: "1759-05-02"
    countries: [fr, gb]
    body:
      - "William Pitt’s ministry sent some 6,800 soldiers to the West Indies to seize a French sugar island that could be traded at the peace. Hopson and Moore gathered the force at Barbados and in mid-January 1759 landed near Fort-Royal on Martinique, but after a day’s fighting in difficult country Hopson re-embarked his men, judged the defences of Saint-Pierre too strong and sailed for Guadeloupe."
      - "On 22–23 January the fleet bombarded Basse-Terre, the capital, until it was in ruins, and on the 24th the troops landed. The French and their militia withdrew to the mountains, and while the British stood still fever and dysentery spread: by February a quarter of the army was sick and Hopson himself died on 27 February. Moore’s ships had meanwhile battered Fort Louis on Grande-Terre into surrender on 14 February. Barrington, who succeeded Hopson, moved most of the army there and used the fleet to land raiding parties along the coasts, burning plantations until the planters pressed Governor Nadau du Treil to give in. The island capitulated on 1–2 May 1759, on generous terms that let the planters sell their sugar to Britain; a French squadron under Admiral Maximin de Bompart, which had reached Martinique, arrived off Guadeloupe a few days later and turned back. By the end of the year disease had killed some 800 of the British garrison."
    facts:
      - [British expedition, "about 6,800 soldiers"]
      - [Basse-Terre bombarded, "22–23 January 1759"]
      - [Capitulation of Guadeloupe, "1–2 May 1759"]
