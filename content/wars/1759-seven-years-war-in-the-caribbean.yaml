  - title: The siege of Havana
    date: "June – August 1762"
    when: "1762-07"
    borders: "1762-08-13"
    countries: [cu, gb, es]
    view: {center: [-82.33, 23.13], size: [60, 50]}
    body:
      - "Britain declared war on Spain on 4 January 1762 and struck at Havana, the strongest fortress and naval base in Spanish America. Pocock’s fleet, with Albemarle’s army of nearly 13,000 soldiers drawn from Britain and the troops that had taken Martinique, and 600 enslaved men hired from Jamaica as labourers, took the dangerous Old Bahama Channel along Cuba’s north coast and appeared off Havana on 6 June. Captain General Juan de Prado had some 2,400 regulars, a fleet of twelve ships of the line, sailors and militia, among them Black and mulatto battalions; he blocked the harbour with a boom and three scuttled warships and settled on delay, waiting for the rainy season and fever to wear down the besiegers."
      - "The British landed at Cojímar east of the city on 7 June and saw that the heights of La Cabaña, overlooking the Morro castle, had been left unfortified. They took them and from 22 June bombarded the Morro, while militia under the Guanabacoa alderman Pepe Antonio harassed their camps. The Morro’s commander, the naval officer Luis Vicente de Velasco, repaired the walls each night and held out for six weeks; a naval attack on 1 July was beaten off, and Spanish sorties failed. British sappers, helped by the enslaved labourers from Jamaica, mined under a bastion, and on 30 July the mine was fired and the fort stormed; Velasco was mortally wounded. From the Morro and La Cabaña British guns bombarded Havana on 11 August, and Prado surrendered on 13 August 1762, giving up the city, nine ships of the line and a great treasure."
      - "The victory cost Britain dearly: 2,764 men were killed, wounded or missing in action, and 4,708 had died of disease by 18 October. During the eleven-month occupation British merchants brought in about 3,200 enslaved Africans, and Havana opened to British trade. In the Treaty of Paris Britain returned Havana in exchange for Florida, and France compensated Spain with western Louisiana; in July 1763 the Count of Ricla, with Alejandro O’Reilly as his second-in-command, took over the city for Spain. Spain rebuilt Havana’s defences, starting with the great fortress of La Cabaña, and armed a Cuban militia."
    facts:
      - [British army at Havana, "about 13,000 soldiers"]
      - [El Morro stormed, "30 July 1762"]
      - [Havana surrenders, "13 August 1762"]
      - [British dead of disease, "4,708 by 18 October 1762"]
