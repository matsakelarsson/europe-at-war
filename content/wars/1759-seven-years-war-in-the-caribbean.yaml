id: seven-years-war-in-the-caribbean
name: Seven Years’ War in the Caribbean
start: "1759-01"
end: "1763-02-10"
tier: B
summary: "The British conquest of France’s and Spain’s most valuable Caribbean islands during the Seven Years’ War. In January 1759 an expedition under Major-General Peregrine Hopson and Commodore John Moore was beaten off at Martinique and turned on Guadeloupe; after months of fighting in which disease killed far more men than the French, Colonel John Barrington received the island’s capitulation on 1–2 May 1759, days before a French relief squadron arrived. In June 1761 a force from Guadeloupe took Dominica, the “neutral island” long left to the Kalinago. Early in 1762 Major-General Robert Monckton and Rear-Admiral George Rodney captured Martinique, after which Saint Lucia, Grenada and Saint Vincent gave up without a fight. Spain had entered the war in January 1762, and in June a great fleet under Admiral George Pocock landed an army under the Earl of Albemarle near Havana. The fortress of El Morro fell on 30 July after a siege in which its commander Luis Vicente de Velasco was mortally wounded, and Havana surrendered on 13 August 1762 with nine Spanish ships of the line; yellow fever and malaria killed some 4,700 British soldiers and sailors by October. In the Treaty of Paris of 10 February 1763 Britain gave back Guadeloupe, Martinique, Saint Lucia and Havana, taking Florida from Spain in exchange for Havana, and kept Dominica, Saint Vincent, Grenada and Tobago."
countries: [fr, dm, lc, gd, vc, cu, gb, es]
sides:
  - id: gb
    name: Great Britain, with troops from the British colonies in the Caribbean and North America
    polities: [united-kingdom, british-west-indies]
    ink: red
    moves: British moves
    success: British success
  - id: fr
    name: France (the French Antilles)
    polities: [france, french-west-indies]
    ink: blue
    moves: French moves
    success: French success
  - id: es
    name: Spain (from January 1762)
    polities: [spain, cuba]
    ink: gold
    moves: Spanish moves
    success: Spanish success
notes:
  - "The war in Europe, India and North America is told in the Seven Years’ War; the British conquest of Canada is told in the French and Indian War."
  - "The islands taken in the war are shown as British-occupied areas in the steps; the base map changes hands only with the Treaty of Paris of 1763."
  - "Enslaved people made up most of the population of all these islands. Thousands were forced to labour on fortifications on both sides, and at Havana enslaved and free Black militiamen fought in the defence; the Spanish Crown later freed some of the enslaved men who had fought."
