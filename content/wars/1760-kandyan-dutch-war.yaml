id: kandyan-dutch-war
name: Kandyan–Dutch war
start: "1760"
end: "1766-02-14"
tier: C
summary: "The war between the Kingdom of Kandy, in the highlands of Sri Lanka, and the Dutch East India Company, which held the island’s coasts. In 1760–1761 a great rising broke out in the Dutch-ruled lowlands, and in 1761 King Kirti Sri Rajasinha’s forces came down to support it, overrunning Matara and Hanwella and destroying Dutch forts in the south. The new governor, Lubbert Jan van Eck, retook them in 1762 and Puttalam and Chilaw in 1763. A first Dutch expedition against Kandy in 1764 was turned back by bad weather and roads, but a second, of some 7,000 to 8,000 men, took the abandoned capital in February 1765 and plundered the palace. The Kandyans fought on from the hills, attacking supply lines while disease weakened the Dutch, until the king, his kingdom close to starvation, accepted the Treaty of Batticaloa (Hanguranketha) on 14 February 1766. Kandy recognised Dutch sovereignty over the whole coastline to a depth of about four miles inland, lost its access to the sea and allowed the Dutch to peel cinnamon in its forests. The Dutch held these lands until the British took them in 1795–1796."
