id: tackys-revolt
name: Tacky’s Revolt
start: "1760-04-07"
end: "1761"
tier: B
summary: "The war of liberation fought by enslaved Coromantee (Akan) people in Jamaica in 1760–1761, the largest rising in the British Caribbean in the eighteenth century. Its leaders had been soldiers and nobles on the Gold Coast, and they planned to overthrow British rule and make the island a free African state. On Easter Monday, 7 April 1760, Tacky, a Fante royal enslaved in St Mary, led a rising on the estates near Port Maria; his men seized arms from Fort Haldane, but the militia and Maroons from the eastern Maroon towns, bound by the treaties of 1739, hunted them down, and Tacky was shot dead within days. On 25 May a larger, better-planned rising broke out in Westmoreland under Apongo, called Wager by the British, said to have been a prince and war leader on the Gold Coast; his fighters fortified a camp in the hills and beat off the militia before regular troops, sailors and Leeward Maroons stormed it in early June. Apongo was captured in July and executed, but bands under his lieutenant Simon fought on from the Cockpit Country into 1761, and plots were uncovered across the island, including in Kingston, where Coromantee people had crowned a ‘Queen’, Cubah. Over 60 whites and a similar number of free people of colour were killed; some 400 rebels died in battle or by execution by the usual count (the militia claimed more), and more than 500 were transported and sold abroad. The historian Trevor Burnard judged that in its shock to the British Empire only the American Revolution surpassed it in that century."
countries: [jm, gb]
