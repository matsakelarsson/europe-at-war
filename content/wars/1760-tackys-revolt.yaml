  - title: Apongo, Simon and the war in the west
    date: "May 1760 – 1761"
    when: "1760-06"
    borders: "1760-06-02"
    countries: [jm, gb]
    body:
      - "The main blow fell in the west. On 25 May 1760, timed for the departure of a naval escort from Bluefields Bay, Coromantee people on the Masemure estate in Westmoreland rose under Apongo, whom the British called Wager, said to have been a prince and war leader on the Gold Coast; his lieutenant Simon fired the first shot, killing the estate’s manager. The rising spread over the neighbouring estates, and the rebels fortified a camp in the hills with a barricade and well-stocked magazines, while white and Black refugees fled to Savanna-la-Mar. On 29 May the Westmoreland militia attacked the barricade and was driven off."
      - "Martial law was declared again. On 1–2 June militia from three parishes, a company of the 74th Regiment, sailors and the Leeward Maroons of Accompong stormed the barricade in a two-hour fight; many rebels, women and children among them, were killed or driven over a precipice. Smaller bands fought on, and new risings broke out in St James and Hanover on 7 June; Maroons from Trelawny Town and Accompong and militia patrols hunted them through June. The militia claimed some 700 rebels killed in the west, and many took their own lives. Apongo was captured on 3 July and sentenced to hang in chains for three days and then be burned to death."
      - "Simon led the survivors, some fifty armed men and women, to High Windward in the Cockpit Country, from where they raided estates in St Elizabeth, and in January 1761 to Mile Gully; he was reported killed in a skirmish, but his band fought on, and Governor Moore declared the western rising over only late in 1761. In Kingston the authorities found that Coromantee people had crowned Cubah as their queen; she was sentenced to transportation, escaped back to the island and was executed. The Assembly passed harsh new laws against Obeah and the movement of the enslaved, and rebels inspired by Tacky and Apongo rose again in St Mary in 1765 and in Westmoreland in 1766."
    facts:
