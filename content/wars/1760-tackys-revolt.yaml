steps:
  - title: Tacky’s rising in St Mary
    date: "April 1760"
    when: "1760-04"
    borders: "1760-04-14"
    countries: [jm, gb]
    body:
      - "Jamaica in 1760 held some 170,000 enslaved people and only about 12,000 whites. Many of the enslaved had been brought from the Gold Coast, where wars between Akan states had made captives of soldiers and nobles; the British called them Coromantees after the slave fort of Kormantse. Tacky, who had been a chief in the Fante state of Eguafo before he was captured in war and sold, worked as a driver on the Frontier estate in St Mary. He and other leaders, among them Quaw Badu, Sang and Sobadou, spent months planning a rising across the island."
      - "Before dawn on Easter Monday, 7 April 1760, Tacky’s followers took the Frontier and Trinity estates and killed several overseers, then broke into the storehouse of Fort Haldane, which guarded Port Maria, killed the storekeeper and carried off about four barrels of powder and forty muskets. Joined by hundreds of people from the Heywood Hall and Esher estates, they gathered at Ballard’s Valley, where Obeah men gave them a powder to protect them from bullets. But a man from Esher slipped away to raise the alarm. Lieutenant Governor Sir Henry Moore sent soldiers of the 74th Regiment and mounted militia from Spanish Town, and the Maroons of Scott’s Hall, Charles Town and Moore Town were called out under their treaty duty. When the militia captured and killed an Obeah man, many rebels lost heart and went back to the estates."
      - "Tacky fought on in the hills with a small band. Within days the Maroons caught up with him, and Davy, a Maroon marksman, shot him dead; his head was displayed in Spanish Town. His remaining followers took their own lives in a cave rather than surrender. Captured rebels were burned alive or hung in iron cages to starve, and the plots that had been meant to rise with Tacky across the island came to light."
    facts:
      - [Rising begins, "7 April 1760 (Easter Monday)"]
      - [Arms seized at Fort Haldane, "about 4 barrels of powder, 40 muskets"]
      - [Death of Tacky, "mid-April 1760"]
