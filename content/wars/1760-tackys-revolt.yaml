notes:
  - "The rising is known mainly from colonial sources: the planter-historian Edward Long, the diary of the Westmoreland overseer Thomas Thistlewood, the records of the Assembly and of courts martial. Their numbers, especially the militia’s claim to have killed some 700 rebels in the west, cannot be checked. Vincent Brown’s study (2020) and his interactive map reconstruct the war as a planned, island-wide military campaign rather than a series of local revolts."
  - "Jamaica was still the main British base in the Caribbean in the Seven Years’ War, which the British were then fighting; the rebels in the west timed their rising for the departure of a naval escort from Bluefields Bay."
