steps:
  - title: Draper and Cornish take Manila
    date: September – October 1762
    when: "1762-09-24"
    borders: "1762-10-06"
    countries: [ph, gb, in]
    body:
      - Britain declared war on Spain in January 1762, when Spain joined France in the Seven Years’ War. At Madras the East India Company and the Crown fitted out an expedition against Manila, the hub of Spain’s trade between China and Mexico, which the Company hoped to keep as a base for its own China trade. It sailed in August with eight ships of the line and three frigates under Rear-Admiral Samuel Cornish, carrying about 6,800 men under Brigadier William Draper, among them the 79th Regiment of Foot, Company sepoys, and seamen and marines from the fleet.
      - The fleet entered Manila Bay on 24 September 1762, before news of the war had reached the city. Governor Pedro de Arandía had died in 1759, and Manila was governed by the archbishop, Manuel Rojo del Río y Vieyra, as acting governor. The British landed south of the walls, used the churches of the suburbs as cover and bombarded the city for ten days, firing more than 20,000 shot and 5,000 bombs. Filipino militia brought in from the provinces attacked the British lines and were driven back with heavy losses.
      - On 5 October the British guns opened a breach in the bastion of San Diego, and at dawn on 6 October the troops stormed it, meeting little resistance. Spanish accounts give about 85 Spanish soldiers and militiamen killed and 300 Filipino troops killed and 400 wounded during the siege; the British lost 147 killed and wounded. The city was sacked, by Rojo’s account for forty hours. Rojo surrendered Manila and the port of Cavite and agreed to a ransom of four million Spanish dollars, of which only about a quarter was ever paid. British ships also took two galleons, the Filipina, inbound from Acapulco with silver, and the outbound Santísima Trinidad, whose cargo was valued at 1.5 million dollars.
    facts:
      - [British force, "about 6,800 regulars, sepoys, sailors and marines"]
      - [Fleet in Manila Bay, "24 September 1762"]
      - [Manila stormed, "6 October 1762"]
      - [Ransom agreed, "4 million dollars, about a quarter paid"]
