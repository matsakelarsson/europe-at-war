notes:
  - Dates are in the Gregorian calendar. The Spanish in Manila, who had come across the Pacific, kept their calendar a day behind Europe’s until 1844, so Spanish accounts date the storming of Manila to 5 October 1762.
  - The British force was a joint venture of the Crown and the East India Company, which hoped to make Manila a base for its trade with China. The numbers of Spanish and Filipino dead come from Spanish accounts.
