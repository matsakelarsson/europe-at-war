id: british-occupation-of-manila
name: British occupation of Manila
start: "1762-09-24"
end: "1764-04"
tier: B
summary: "The capture and occupation of Manila and Cavite by a British and East India Company expedition from Madras in the Seven Years’ War, and the risings it set off in Luzon. Spain had entered the war on France’s side in January 1762. On 24 September a fleet under Rear-Admiral Samuel Cornish, carrying about 6,800 soldiers, sailors and marines under Brigadier William Draper, among them Company sepoys, sailed into Manila Bay. The city, governed by the acting governor, Archbishop Manuel Rojo, had small regular forces and thousands of Filipino militia; it was stormed on 6 October and sacked, and Rojo agreed to a ransom of four million dollars, of which only a quarter was ever paid. The judge Simón de Anda y Salazar escaped to Pampanga, proclaimed himself governor and, with an army of Filipino volunteers, kept the British confined to Manila and Cavite. In the Ilocos Diego Silang rose against Spanish rule in December 1762 and sought British help, which never came; he was killed on 28 May 1763, and his widow Gabriela Silang fought on until she and her followers were captured and hanged at Vigan in September. Juan de la Cruz Palaris led a revolt in Pangasinan that lasted until 1765. The Treaty of Paris of 10 February 1763 returned Manila to Spain, and the British sailed away in April 1764."
countries: [ph, gb, in, es]
