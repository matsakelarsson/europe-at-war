  - title: Anda, the Silangs and Palaris
    date: October 1762 – September 1763
    when: "1762-12"
    borders: "1763-03-01"
    countries: [ph, gb]
    body:
      - Simón de Anda y Salazar, a judge of the Audiencia, slipped out of Manila on the night before the city fell, crossed to Bulacan and set up his headquarters at Bacolor in Pampanga. On 8 October he wrote to Rojo claiming the governorship for himself, and he refused to recognise the surrender. He raised an army that grew to more than 10,000, most of them Filipino volunteers, many of them without muskets. The British held Manila and Cavite but could not extend their rule. Captain Sleigh, reinforced by about 400 Chinese, took Malolos on 22 January 1763 but withdrew on 7 February without reaching Anda; in the spring Captain Backhouse marched as far as Batangas. Anda had Chinese he suspected of helping the British executed.
      - In the north, the fall of Manila set off risings against Spanish rule. In the Ilocos Diego Silang, a former courier of the friars, led a revolt against tribute and the abuses of the province’s Spanish officials from December 1762, took over Vigan and set out to found an Ilocano state of his own. The British promised him arms and help, which never arrived. On 28 May 1763 he was killed at Vigan by Miguel Vicos and Pedro Becbec, former companions paid, by most accounts, by the church authorities. His widow Gabriela Silang fled to Abra and took command; her attack on Vigan on 10 September failed, and she and her followers were captured and hanged in the plaza of Vigan on 20 September 1763.
      - In Pangasinan the principales of Binalatongan demanded the removal of the provincial governor and an end to tribute while the islands were under British control. When Anda refused, Juan de la Cruz Palaris rose in November 1762; at his height he led about 10,000 men and held Pangasinan up to the Agno river, and he kept in touch with Silang. A Spanish force under Alfonso de Arayat was driven back in a battle on the Agno on 1 March 1763.
    facts:
