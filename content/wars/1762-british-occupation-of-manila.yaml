  - title: Peace and the British withdrawal
    date: July 1763 – April 1764
    when: "1763-07-24"
    borders: "1764-04-05"
    countries: [ph, gb, in]
    body:
      - The Treaty of Paris, signed on 10 February 1763, provided that conquests not known of at the signing were to be returned, and Manila fell under that clause. News that the fighting had ended reached Manila on 24 July 1763 and a draft of the treaty on 26 August, but the order to withdraw took months more to arrive. Archbishop Rojo died in January 1764, and Anda then agreed to an armistice. The British sailed from Manila and Cavite in the first week of April 1764, and Spanish rule was restored.
      - The British took with them Azim ud-Din I, the Sultan of Sulu, whom the Spanish had held prisoner in Manila since the early 1750s and whom the British had freed; he signed a treaty of alliance with the East India Company, which hoped to trade in Sulu, and returned to rule in Jolo. In Pangasinan, many of Palaris’s men surrendered once news of the peace arrived; the Spanish defeated him at Mabalitec in December 1763, and he was betrayed, captured in January 1765 and hanged on 26 February 1765.
      - The occupation showed how thinly Spain held the islands and how much it depended on the friars and on Filipino soldiers and principales. Anda, made governor himself in 1770, pressed for reforms of the army and of trade, and many of the Chinese of Manila, who were blamed for siding with the British, were expelled by royal order in the years that followed.
    facts:
      - [Treaty of Paris, "10 February 1763"]
      - [News of the peace in Manila, "24 July 1763"]
      - [British evacuation, "first week of April 1764"]
      - [Palaris hanged, "26 February 1765"]
