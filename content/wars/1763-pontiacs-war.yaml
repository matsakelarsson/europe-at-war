  - title: The road to peace
    date: 1764–1766
    when: "1764-07"
    borders: "1765-10-10"
    countries: [us, ca]
    body:
      - "In July and August 1764 Sir William Johnson, Britain’s superintendent of Indian affairs in the North, held a congress at Fort Niagara with about 2,000 people from some two dozen nations, most of them Haudenosaunee and peoples of the upper Great Lakes. The Seneca ceded the Niagara portage, and the Covenant Chain of alliance was renewed; many First Nations in Canada regard the Treaty of Niagara, recorded in wampum, as their acceptance of the Royal Proclamation on their own terms. Colonel John Bradstreet led 1,200 men along Lake Erie to Detroit and made treaties that General Thomas Gage refused to accept. In October Bouquet marched 1,150 men from Fort Pitt to the Muskingum; there, under the threat of his army, Guyasuta and the Lenape, Shawnee and Mingo leaders handed over more than 200 captives, many of them adopted into Native families who had to be forced to leave."
      - "The Illinois country, where the Shawnee war leader Charlot Kaské and others urged war on, was opened by diplomacy: after George Croghan’s mission, British troops took over Fort de Chartres from the French in October 1765. On 25 July 1766 Pontiac made peace with Johnson at Fort Ontario in Oswego. No land was ceded and no hostages given, and Britain restored the gifts and trade that Amherst had cut off. Pontiac was killed by a Peoria man at Cahokia in 1769."
    facts:
