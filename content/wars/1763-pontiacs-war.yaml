steps:
  - title: The forts fall
    date: April – June 1763
    when: "1763-05-09"
    borders: "1763-06-20"
    countries: [us, ca]
    body:
      - "When the French surrendered Canada in 1760, British troops took over their posts on the Great Lakes and the Ohio. In the French alliance, gifts of goods, guns and powder had been the duty of a “father” to his allies; Amherst saw them as bribes and cut them back, restricting the sale of gunpowder at the same time. Traders cheated, settlers moved onto the lands of the upper Ohio, and the Seneca leaders Guyasuta and Tahaiadoris had already sent war belts to the western nations in 1761. The Lenape prophet Neolin taught that the Master of Life wanted the Native peoples to give up European goods and drive the British out. In 1763 came news that France had ceded their country to Britain without consulting them."
      - "On 27 April 1763 Pontiac, an Odawa war leader, spoke at a council on the Ecorse River near Detroit. On 7 May he entered the fort with about 300 armed men to seize it, but its commander, Major Henry Gladwin, had been warned, and two days later Pontiac’s Odawa, with Potawatomi, Wendat and Ojibwe, laid siege to it. Within six weeks the war spread: the Wendat took Fort Sandusky on 16 May, the Potawatomi Fort St. Joseph on 25 May and the Miami Fort Miami on 27 May; Wea, Kickapoo and Mascouten took Ouiatenon on 1 June without bloodshed; on 4 June, the king’s birthday, Ojibwe playing a ball game outside Michilimackinac chased the ball through the gate and took the fort; and in mid-June the Seneca and their allies took Venango, Le Boeuf and Presque Isle. Lenape and Shawnee war parties raided the frontier of Pennsylvania, Maryland and Virginia, killing or capturing hundreds of settlers and driving thousands east."
    facts:
      - [Council on the Ecorse River, "27 April 1763"]
      - [Siege of Detroit, "9 May – 31 October 1763"]
      - [British forts taken, "eight, between 16 May and 20 June 1763"]
