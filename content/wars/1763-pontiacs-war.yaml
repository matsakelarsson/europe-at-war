  - title: Bloody Run, Bushy Run and Devil’s Hole
    date: June – December 1763
    when: "1763-07-31"
    borders: "1763-08-06"
    countries: [us, ca]
    body:
      - "At besieged Fort Pitt, on 24 June, the commander Simeon Ecuyer gave two Lenape envoys two blankets and a handkerchief from the smallpox hospital, as the trader William Trent recorded, hoping they would carry the disease to their people. In July Amherst and Colonel Henry Bouquet discussed the same idea in their letters. Smallpox did break out among the Ohio nations in 1763–1764, but it was already in the region, and historians disagree on whether the blankets played a part."
      - "At Detroit Captain James Dalyell led about 250 men out of the fort on the night of 31 July to surprise Pontiac’s camp; they were ambushed at Parent’s Creek, renamed Bloody Run, and Dalyell and some 20 others were killed. Bouquet, marching to relieve Fort Pitt with about 500 Highlanders and Royal Americans, was attacked by Lenape, Shawnee, Mingo and Wendat warriors at Bushy Run on 5 August; the next day he drew them into the open with a feigned retreat and routed them, losing about 50 killed, and he reached Fort Pitt a few days later. On 14 September some 300 Seneca, with Odawa and Ojibwe, ambushed a supply train and the troops sent to save it at Devil’s Hole on the Niagara portage, killing more than 70 soldiers and teamsters (about 100 by some counts), the deadliest fight of the war for British soldiers."
      - "On 7 October 1763 King George III issued the Royal Proclamation, which forbade settlement and private land purchases west of the Appalachian watershed and reserved that land for the Native nations. At the end of October, after the French commander in the Illinois country told him no help would come, Pontiac lifted the siege of Detroit. In December the Paxton Boys, frontiersmen from Lancaster County, killed six Conestoga (Susquehannock) at their town on 14 December and the other fourteen, held for their protection in the Lancaster workhouse, on 27 December; in February 1764 hundreds of them marched on Philadelphia before Benjamin Franklin and others talked them into going home."
    facts:
