id: pontiacs-war
name: Pontiac’s War
start: "1763-05-07"
end: "1766-07-25"
tier: B
summary: "A war in which a loose confederacy of the Native nations of the Great Lakes, the Ohio country and the Illinois country rose against British rule after the fall of New France. Britain had taken over the French posts, and its commander, Jeffery Amherst, cut back the gifts and the gunpowder that the alliance with France had provided, while British traders and settlers pressed west and the Lenape prophet Neolin called for a return to the old ways and the expulsion of the British. In May 1763 the Odawa leader Pontiac besieged Detroit, and within weeks Wendat, Potawatomi, Miami, Wea, Ojibwe and Seneca warriors had taken eight British forts, while Lenape and Shawnee war parties drove thousands of settlers from the frontier of Pennsylvania, Maryland and Virginia. Detroit, Fort Pitt and Niagara held. Henry Bouquet won at Bushy Run in August 1763, but the Seneca destroyed a convoy at Devil’s Hole, Pontiac’s men beat a sortie from Detroit at Bloody Run, and at Fort Pitt the British gave Lenape envoys blankets from their smallpox hospital. The Royal Proclamation of October 1763 reserved the land west of the Appalachians for the Native nations. Peace came by stages: Johnson’s congress at Niagara in 1764, Bouquet’s expedition to the Muskingum, which brought the return of over 200 captives, the British occupation of the Illinois country in 1765 and Pontiac’s treaty at Oswego in 1766. Apart from the Niagara portage, given up by the Seneca, no land was ceded, and Britain restored the gifts it had stopped."
countries: [us, ca]
sides:
  - id: pon
    name: Pontiac’s confederacy (Odawa, Ojibwe, Potawatomi, Wendat, Seneca and Mingo, Lenape, Shawnee, Miami, Wea, Kickapoo and others)
    polities: [odawa, shawnee, lenape, mingo]
    ink: teal
