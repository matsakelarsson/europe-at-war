notes:
  - Also called Pontiac’s Rebellion or Pontiac’s Uprising. Historians now stress that Pontiac led only the war around Detroit; the war had many leaders, among them the Seneca Guyasuta, who had sent war belts in 1761, the Lenape Shingas and the Shawnee Charlot Kaské.
  - Whether the smallpox blankets given at Fort Pitt spread the epidemic that struck the Ohio nations in 1763–1764 is debated; smallpox was already present in the region, and historians are divided on the blankets’ effect.
  - Casualties are uncertain. About 400 British soldiers were killed in action and perhaps 50 more after capture. Some historians put the settlers killed at about 450; George Croghan’s contemporary estimate of 2,000 killed or captured is often repeated, but the historian Gregory Dowd rejects it as unreliable. Some 4,000 settlers were driven from their homes. At least 200 Native warriors were killed; other Native losses, from war and disease, are unknown.
