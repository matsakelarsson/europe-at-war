steps:
  - title: Lan Na, the Lao kingdoms and the Tenasserim coast
    date: 1763 – January 1765
    when: "1764-02"
    borders: "1765-04"
    countries: [th, la, mm]
    body:
      - "Alaungpaya’s death in 1760 left the conquest of Siam unfinished. His son Naungdawgyi sent an army in 1762 to restore Burmese rule over Lan Na, independent since 1727; Chiang Mai fell in August 1763 and most of its people were deported to Burma. When Hsinbyushin, Alaungpaya’s second son, became king at the end of 1763 he planned the conquest of Siam as a whole, beginning with the lands on its flanks. He sent Ne Myo Thihapate with 20,000 men to Lan Na in February 1764; Thihapate put down risings at Phayao and Lamphun, raised levies across the Shan and Lan Na states and, invited by King Ong Boun of Vientiane against his rival, marched on Luang Prabang, which fell in March 1765. Both Lao kingdoms became Burmese vassals."
      - "A second army of 20,000 under Maha Nawrahta, with about 200 French gunners captured at Syriam in 1756, marched south in December 1764. Its vanguard retook Tavoy, whose governor had gone over to Siam in 1763, and when the Siamese refused to hand him over Maha Nawrahta took Mergui and Tenasserim on 11 January 1765, killing those of the inhabitants who had not escaped. The coast, Siamese for centuries, would stay Burmese for good. Hsinbyushin himself campaigned in Manipur and on 1 April 1765 moved his capital to Ava."
    facts:
      - ["Chiang Mai taken", "August 1763"]
      - ["Luang Prabang taken", "March 1765"]
      - ["Mergui and Tenasserim taken", "11 January 1765"]
