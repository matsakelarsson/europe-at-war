  - title: The siege through the floods
    date: June 1766 – January 1767
    when: "1766-09"
    borders: "1767-01"
    countries: [th, mm, cn]
    body:
      - "From February to September 1766 there was no major battle at Ayutthaya, while the flood rose around the city. In the east, Prince Thepphiphit, Ekkathat’s rebellious half-brother, gathered men from Chanthaburi at Prachinburi; a Burmese force beat him at Paknam Yothaka in September 1766 and occupied Prachinburi and the Bang Pakong valley. On 14 September the Burmese reached the city walls. In November, with the flood at its height, a Siamese fleet under Phraya Phetchaburi and Phraya Tak was defeated at Wat Sangkhawat south-east of the city, and ten days later a sortie against Ne Myo Thihapate’s camp at Phosamton, to the north, failed as well. By December Ayutthaya could field only a few thousand men; disease and hunger spread in the city."
      - "Ekkathat’s commanders quarrelled, and Phraya Tak, a governor of Teochew Chinese descent blamed for the defeat at Wat Sangkhawat, decided to break out. On 4 January 1767 he and about 500 Siamese and Chinese followers cut their way through the thinner Burmese lines to the east, beat a Burmese force near Prachinburi on 10 January and reached Rayong on the east coast, untouched by the war."
      - "Burma, meanwhile, was at war with the Qing. A Chinese army had attacked Kengtung in December 1765, and in late 1766 a second invasion took Bhamo, retaken by the Burmese in January 1767. In a directive dated 9 January 1767 Hsinbyushin ordered his commanders in Siam to take the city quickly and come home."
    facts:
      - ["Burmese at the walls", "14 September 1766"]
      - ["Battle of Wat Sangkhawat", "November 1766, Burmese victory"]
      - ["Phraya Tak breaks out", "4 January 1767"]
    markers:
