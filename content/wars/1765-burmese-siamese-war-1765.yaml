  - title: Two armies converge on Ayutthaya
    date: May 1765 – January 1766
    when: "1765-08"
    borders: "1766-01"
    countries: [th, mm]
    body:
      - "Hsinbyushin had learned from 1760 that an invasion must start early. In May 1765 Maha Nawrahta’s vanguard of 5,000 crossed the hills by the Myitta pass to Kanchanaburi, and by August it had beaten a Siamese force at Bang Bamru. On 23 August 1765, at the height of the rains, Ne Myo Thihapate’s army of Burmese, Lan Na and Lao troops left Lampang down the Wang river into northern Siam; it took Sukhothai in October and moved down the Chao Phraya. Maha Nawrahta left Tavoy with the main western army on 23 October and reached Ayutthaya’s western approaches in about two months, half the time Alaungpaya had needed."
      - "Siam, ruled by King Ekkathat and weakened by palace feuds, gathered its forces at the capital. The Dutch closed their trading post and sailed away in October and November 1765. In December the Burmese vanguard occupied Thonburi and Nonthaburi, downstream of the city; an English trader, William Powney, joined a Siamese night attack on the Nonthaburi garrison, which failed, and left. Early in 1766 a large Siamese army under Phraya Phollathep was beaten at Siguk, west of the city. On 20 January 1766 Ne Myo Thihapate reached the environs of Ayutthaya and joined Maha Nawrahta."
    facts:
      - ["Burmese armies", "about 40,000–50,000 men in two columns"]
      - ["Ne Myo Thihapate leaves Lampang", "23 August 1765"]
      - ["Maha Nawrahta leaves Tavoy", "23 October 1765"]
      - ["Armies meet before Ayutthaya", "20 January 1766"]
    markers:
