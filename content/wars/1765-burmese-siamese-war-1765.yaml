  - title: Battles at the outskirts, and Bang Rachan
    date: January – June 1766
    when: "1766-01"
    borders: "1766-06"
    countries: [th]
    body:
      - "Ekkathat sent the prime minister, Chaophraya Phrakhlang, with an army by land and river against Ne Myo Thihapate, who met it north-west of Paknam Prasop on the Lopburi river in January 1766 and routed it; a second attempt three days later failed too. A few days on, the Siamese attacked the Burmese entrenched around the pagoda of Wat Phukhaothong, built by Bayinnaung after his victory in 1569, just north-west of the city, and were beaten again. The two Burmese armies now ringed Ayutthaya from the north and west. Ekkathat brought the monks of the outlying temples, among them his brother Uthumphon, inside the walls."
      - "Siam’s strategy, as in 1760, was to wait behind the walls of its island capital until the rains flooded the plain and forced the enemy home. The Burmese, instead, built fortified camps on high ground and gathered boats to stay through the floods. Behind their lines, villagers who had fled their homes gathered round a monk, Phra Thammachot, at Bang Rachan, north-west of Ayutthaya, and from February 1766 beat off Burmese attacks. By Thai tradition the camp withstood eight assaults in five months before falling on 20 June 1766, when a Mon in Burmese service, Thugyi, took command against it."
    facts:
      - ["Battle of Paknam Prasop", "January 1766, Burmese victory"]
      - ["Battle of Wat Phukhaothong", "January 1766, Burmese victory"]
      - ["Bang Rachan falls", "20 June 1766"]
    markers:
