id: burmese-siamese-war-1765
name: Burmese–Siamese War (1765–1767)
start: "1765-08-23"
end: "1767-04-07"
tier: A
summary: "The war in which Konbaung Burma destroyed Ayutthaya, the capital of Siam for four centuries. King Hsinbyushin, who had served in his father Alaungpaya’s failed invasion of 1760, first took Lan Na and the Lao kingdoms of Luang Prabang and Vientiane (1763–1765) and the Tenasserim coast (January 1765). In the second half of 1765 two Burmese armies, about 40,000 to 50,000 men in all, invaded Siam: Maha Nawrahta’s from Tavoy in the west and Ne Myo Thihapate’s from Lan Na down the rivers of the north. They met before Ayutthaya in January 1766, beat the Siamese armies sent against them and settled down to a siege that lasted fourteen months, through the floods of the rainy season. Village resistance such as that at Bang Rachan delayed them; a Chinese invasion of Burma from the end of 1765 pressed them to finish. On 7 April 1767 the Burmese undermined and stormed the walls. The city was sacked and burned, King Ekkathat died, and between 30,000 people (by Thai chronicles) and 100,000 (by Burmese) were carried off to Burma. Siam broke up among rival regimes until Taksin, who had broken out of the siege, reunited it."
countries: [th, mm, la]
sides:
  - id: kb
    name: Konbaung Burma (with Lan Na and Lao levies)
    polities: [konbaung]
    ink: brown
    moves: Burmese moves
    success: Burmese success
  - id: ay
    name: Ayutthaya (Siam)
    polities: [ayutthaya]
    ink: blue
    moves: Siamese moves
    success: Siamese success
notes:
  - "Dates are those of the Burmese chronicles (the Konbaung Hset) and of Dutch and French records, as given in the sources cited. Harvey dates the fall of Ayutthaya to 28 March 1767; the chronicle date is 7 April. Thai chronicles were rewritten after 1767, since Ayutthaya’s records were lost in the fire, and give numbers and episodes of their own."
  - "Losses: one modern estimate puts the dead of the war, soldiers and civilians, at about 200,000. Burmese chronicles count 100,000 captives taken to Burma, Thai chronicles 30,000. Bang Rachan, a village camp that held out for five months, is known from Thai chronicles of 1795 and later and became a central story of Thai patriotism."
  - "The base map shows Burma holding the lower Chao Phraya plain from the fall of Ayutthaya and the rest of Siam without an overall ruler, divided among the regimes of Phitsanulok, Fang, Phimai and Nakhon Si Thammarat and Taksin’s base in the east; their wars are told in Taksin’s reunification of Siam."
