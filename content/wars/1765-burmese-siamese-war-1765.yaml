  - title: The fall of Ayutthaya
    date: February – April 1767
    when: "1767-03"
    borders: "1767-04-07"
    countries: [th]
    body:
      - "In February 1767 Ekkathat offered terms, which the Burmese rejected; Maha Nawrahta died of illness soon after, and Ne Myo Thihapate took sole command. The last defences outside the walls were to the south: a stockade of Chinese volunteers at Khlong Suan Phlu, which attacked the Burmese towers with war junks in February, and the Portuguese quarter of Ban Portuket with the Catholic churches. The Chinese camp fell in mid-March and the Portuguese quarter on 21 March; on 23 March the Burmese burned the churches of St Joseph, St Dominic and St Paul after the bishop, Pierre Brigot, had surrendered to them."
      - "Ne Myo Thihapate had five tunnels dug under the north-eastern corner of the walls at Huaraw. At 4 pm on 7 April 1767 his men set fire to logs packed under the wall’s foundations; at 8 pm the wall collapsed, and the Burmese stormed in under artillery fire. About 10,000 Siamese fought on inside and were overwhelmed. The city was put to the torch and its people killed or seized; Thai chronicles say the fires lit the night like day, and that the conquerors tortured inhabitants to find their wealth. The Burmese chronicles say Ekkathat was killed by a stray shot at a western gate; the Thai chronicles that he fled and died of hunger near Wat Sangkhawat."
      - "The palaces and temples of a city that European visitors had compared with London and Paris were burned. The Phra Si Sanphet Buddha, sixteen metres tall, was melted for its gold, Buddha images were hacked for their gilding, and books, archives and chronicles were lost. In the armoury the Burmese found more than 10,000 muskets that had never been used."
    facts:
      - ["Chinese and Portuguese quarters fall", "mid-March and 21 March 1767"]
      - ["Walls breached", "evening of 7 April 1767"]
      - ["Unused muskets found", "over 10,000"]
    markers:
      - kind: siege
        side: kb
        name: Ayutthaya
        date: 7 April 1767
        text: The Chinese stockade at Khlong Suan Phlu and the Portuguese quarter south of the city fell in March. On 7 April the wall at Huaraw, in the north-east, was undermined by fire and stormed; the city was sacked and burned and King Ekkathat died.
        lonlat: [100.568, 14.357]
  - title: The withdrawal, and Siam in pieces
    date: April – August 1767
    when: "1767-06"
    borders: "1767-07"
    countries: [th, mm]
    body:
      - "Ne Myo Thihapate held Ayutthaya for two months, had its walls pulled down, and on 6 June 1767 left for Burma with the captives and loot, needed against the Qing. Uthumphon, the royal family and the nobility went north by Uthai Thani and Umphang to Martaban; commoners, guns and goods went west by Kanchanaburi and the Three Pagodas Pass. The Burmese chronicles count 100,000 captives, the Thai chronicles 30,000. The captives were settled around Ava and Sagaing; Uthumphon lived as a monk at Amarapura until his death in 1796. A Mon officer, Thugyi, stayed at Phosamton with a garrison, and a Siamese, Thong-in, governed Thonburi for the Burmese."
      - "Burma kept the Tenasserim coast, but the rest of Siam had no king. Rival leaders set themselves up at Phitsanulok, at Sawangkhaburi under a monk known as Chao Phra Fang, at Phimai under Prince Thepphiphit and at Nakhon Si Thammarat, while Phraya Tak built up his strength on the east coast. Within a few months Phraya Tak, soon King Taksin, attacked the Burmese garrisons; his reunification of the country is told in its own entry."
    facts:
      - ["Burmese leave Ayutthaya", "6 June 1767"]
      - ["Captives taken to Burma", "30,000 (Thai chronicles) to 100,000 (Burmese chronicles)"]
      - ["Territory", "Tenasserim coast kept by Burma"]
    markers:
      - kind: event
        side: kb
        name: Phosamton
        date: June – November 1767
        text: Thugyi’s Burmese garrison north of the ruined city, taken by Taksin in November 1767.
        lonlat: [100.560, 14.420]
      - kind: event
        side: kb
        name: Three Pagodas Pass
