  - title: Fuheng’s invasion and the truce of Kaungton
    date: April 1768 – December 1769
    when: "1769-10"
    borders: "1769-12"
    countries: [mm, cn, th]
    body:
      - "On 14 April 1768 the court announced Ming Rui’s death and gave the command to the chief grand councillor Fuheng, with the Manchu generals Agui, Aligun and Suhede. The emperor demanded Burma’s full submission and sent envoys to Siam and the Lao states seeking allies. Hsinbyushin brought most of his troops home from Siam, which allowed the Siamese under Taksin to drive the Burmese out of their country in 1768–1769. Fuheng arrived in Yunnan in April 1769 with about 60,000 men and a plan modelled on Ming and Mongol campaigns: one army would attack Bhamo and Kaungton while two others marched down both banks of the Irrawaddy, escorted by war boats built on the spot and manned by sailors of the Fujian navy."
      - "Fuheng struck in October 1769, before the rains had ended. His armies took Bhamo and built a great fort near Shwenyaungbin, twelve miles east of Kaungton. But the army that crossed to the west bank fell back when a Burmese army approached, the army on the east bank did not advance, and the Burmese flotilla sank the Qing boats. For four weeks the Bannermen assaulted Kaungton in vain. Disease spread, Fuheng himself fell ill, and a Burmese army sent round to cut his communications closed in from the rear; by early December the Qing forces, having lost some 20,000 men, were surrounded between Shwenyaungbin, which fell, and Kaungton."
      - "The Qing commanders asked for terms. Maha Thiha Thura, against the wishes of his officers and without asking the king, granted them, arguing that another annihilation would only bring another invasion. On 13 (or 22) December 1769, by Htin Aung’s account, 14 Burmese and 13 Chinese officers agreed at Kaungton that the fugitive sawbwas would be handed over, Burma’s rule over its historic Shan states respected, prisoners released and embassies exchanged. The Qing burned their boats, melted their cannon and marched away up the Taping valley, where thousands more died of hunger in the passes."
    facts:
      - ["Qing army", "about 60,000 men with a river flotilla"]
      - ["Siege of Kaungton", "November 1769, four weeks, held"]
      - ["Truce of Kaungton", "13 or 22 December 1769"]
    markers:
