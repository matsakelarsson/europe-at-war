  - title: Maymyo
    date: February – March 1768
    when: "1768-03"
    borders: "1768-03"
    countries: [mm, cn]
    body:
      - "Ming Rui had gone too far. His base at Hsenwi lay hundreds of miles back across the Shan hills, and Burmese raiders under Teingya Minkhaung harried his supply lines. With E’erdeng’e gone, he went over to the defensive. Troops recalled from Siam began to arrive, and Maha Thiha Thura and Ne Myo Sithu retook Hsenwi, whose Qing commander killed himself. By March 1768 the Bannermen, cut off and dying of malaria in the heat of the dry zone, gave up the march on Ava and turned back towards Yunnan."
      - "A Burmese army of 10,000 infantry and 2,000 horse followed. Maha Thiha Thura, now in overall command, sent Maha Sithu after the Qing army while he led the larger force through the hills to come out ahead of it, and the Burmese encircled it near Maymyo, about 50 miles north-east of Ava. In three days of fighting the army was destroyed. Of about 30,000 men of the main army, only some 2,500 survived, as prisoners; the rest were killed in battle or died of their wounds and of disease. Ming Rui, badly wounded, cut off his queue to send to the emperor as a sign of loyalty and hanged himself from a tree."
    facts:
      - ["Battle of Maymyo", "March 1768, Burmese victory"]
      - ["Qing losses", "about 30,000 men of the main army; about 2,500 captured"]
    markers:
