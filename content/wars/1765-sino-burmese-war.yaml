steps:
  - title: The border states and the first invasion
    date: 1730s – April 1766
    when: "1765-12"
    borders: "1766-01"
    countries: [mm, cn]
    body:
      - "The Shan and Tai states of the hills between Burma and Yunnan had long paid tribute to both courts. In the 1730s, while Toungoo Burma was falling apart, the Qing tightened their hold on the frontier and drew the chiefs (sawbwas) of states from Mogaung and Bhamo to Hsenwi, Kengtung and Sipsongpanna to their side. In 1758–1759 Alaungpaya sent armies to bring them back under Burma; the sawbwas of Mogaung, Bhamo and Hsenwi fled to Yunnan and urged the Qing to intervene. As Burmese armies passed through the hills on their way to Siam in 1764, the complaints grew, and the Qianlong Emperor sent the scholar-official Liu Zao to Yunnan."
      - "In early 1765 the Burmese army at Kengtung left for Siam. Using trade disputes as a pretext, Liu Zao sent 3,500 Green Standard troops with Tai militias against Kengtung in December 1765. They laid siege to the town but were beaten by its garrison under Ne Myo Sithu, who pursued them into Pu’er prefecture in Yunnan and defeated them there before returning to Ava in April 1766. Liu Zao tried to hide the defeat, was ordered recalled and demoted, and cut his own throat. The emperor, now treating Burma as a matter of imperial prestige, appointed Yang Yingju, a veteran frontier officer."
    facts:
      - ["Qing force", "3,500 Green Standard troops and Tai militias"]
      - ["Siege of Kengtung", "December 1765, Burmese victory"]
    markers:
