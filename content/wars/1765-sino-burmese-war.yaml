id: sino-burmese-war
name: Sino-Burmese War
start: "1765-12"
end: "1769-12-22"
tier: A
summary: "Four invasions of Konbaung Burma by Qing China, fought over the Shan and Tai states of the border hills that both empires claimed. After Burma’s new Konbaung kings reasserted their rule over states the Qing had drawn into their orbit in the 1730s, the governor of Yunnan sent Green Standard troops against Kengtung in December 1765; they were beaten back. A second, larger invasion by Bhamo in 1766–1767 was trapped between the Burmese fort at Kaungton and armies closing in from the hills, and destroyed by battle and disease. The Qianlong Emperor then sent Manchu Bannermen under his son-in-law Ming Rui, who broke through the Shan hills at the Goteik gorge late in 1767 and came within 30 miles of Ava; cut off from his supplies, he was surrounded and destroyed at Maymyo in March 1768 and hanged himself. In 1769 Fuheng led about 60,000 men down the Irrawaddy, but his flotilla was sunk and his army, sick and surrounded near Kaungton, accepted a truce on 13 (or 22) December 1769. Neither court ratified the terms, and Qing trade was banned for twenty years; but Burma had kept its independence and its border states, at the price of losing its conquests in Siam, which used the respite to recover."
countries: [mm, cn]
sides:
  - id: kb
    name: Konbaung Burma (Hsinbyushin)
    polities: [konbaung]
    ink: brown
    moves: Burmese moves
    success: Burmese success
  - id: qg
    name: Qing China (Qianlong Emperor)
    polities: [qing]
    ink: gold
    moves: Qing moves
    success: Qing success
notes:
  - "Dates and numbers come from Burmese chronicles and Qing records as used by modern historians (Htin Aung, Dai Yingcong, Myint-U, Zhou and Grabowsky). The Kaungton agreement is dated 13 or 22 December 1769 in different sources. Qing losses are estimated at more than 70,000 dead over the four invasions, most of them from disease."
  - "How the war ended is still told differently. Burmese and most Western historians count it a Burmese victory. The Qing court, after relations were restored in 1788, treated Burma’s missions as tribute and the Qianlong Emperor counted the campaign among his Ten Great Campaigns; the historian Dai Yingcong has called it “a disguised defeat” for the Qing. Both sides claimed the border states, which kept looking to both."
  - "Names: Ava is today’s Inwa, Maymyo Pyin Oo Lwin, Hsenwi Theinni, Kengtung Kyaingtong and Kenghung Jinghong; Kaungton is also written Kawng Ton. Chinese names are in pinyin (Liu Zao, Yang Yingju, Ming Rui, E’erdeng’e, Fuheng)."
