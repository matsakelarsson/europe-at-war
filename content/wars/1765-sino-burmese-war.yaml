  - title: The trap at Bhamo and Kaungton
    date: summer 1766 – May 1767
    when: "1766-12"
    borders: "1767-01"
    countries: [mm, cn]
    body:
      - "Yang Yingju planned to strike at the Burmese heartland down the Irrawaddy from Bhamo, and reportedly to put a Qing candidate on the Burmese throne. Hsinbyushin, though his main armies were besieging Ayutthaya, prepared a trap. His commander Balamindin gave up Bhamo and held the stockade of Kaungton a few miles downriver, with a corps of French gunners captured at Syriam in 1756; a second army under Maha Thiha Thura marched from Kenghung, in the far east, across the Shan hills. In December 1766 the Qing army took Bhamo and laid siege to Kaungton, which held."
      - "Two Burmese armies under Maha Sithu and Ne Myo Sithu closed in, while Maha Thiha Thura blocked the road back to Yunnan. The Qing troops, unused to the climate, were struck down by cholera, dysentery and malaria; one report told of 800 dead out of 1,000 men in a single garrison. In January 1767 Ne Myo Sithu retook Bhamo, and the Burmese attacked the trapped army from both sides; it fled east and north into Maha Thiha Thura’s army and was destroyed. The Burmese went on to occupy eight Tai states inside Yunnan. Yang Yingju reported to Beijing that Bhamo had been taken and the Burmese had sued for peace; the emperor saw through the reports, recalled him and ordered him to take his own life. Hsinbyushin, on 9 January 1767, ordered his generals in Siam to finish quickly."
    facts:
      - ["Bhamo taken by the Qing", "December 1766"]
      - ["Bhamo retaken", "January 1767"]
    markers:
