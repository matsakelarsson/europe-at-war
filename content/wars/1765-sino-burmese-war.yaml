  - title: Ming Rui’s march on Ava
    date: November 1767 – February 1768
    when: "1767-12"
    borders: "1768-01"
    countries: [mm, cn]
    body:
      - "Convinced that the Chinese Green Standard troops were to blame, the emperor sent Manchu and Mongol Bannermen under Ming Rui, his son-in-law and a veteran of the wars in Xinjiang. With Green Standard troops and Tai militias the army counted about 50,000 men. Ming Rui planned a pincer: his main army would take the road through Hsenwi, Hsipaw and down the Namtu towards Ava, the route of the Manchus who had pursued the Southern Ming emperor a century before, while E’erdeng’e attacked again by Bhamo. Hsinbyushin had kept his main armies in Siam after Ayutthaya fell, and had perhaps 20,000 men to meet them."
      - "The invasion began in November 1767. Within eight days Ming Rui held Hsenwi and Hsipaw; leaving 5,000 men at Hsenwi as his base, he marched on with 15,000. In late December, at the Goteik gorge south of Hsipaw, he routed Maha Sithu’s army, and Maha Thiha Thura was beaten back at Hsenwi. Hsinbyushin at last recalled his armies from Siam. Ming Rui pushed on through the hills and early in 1768 reached Singu on the Irrawaddy, 30 miles north of Ava. The court urged the king to flee; Hsinbyushin refused, and led an army out to face him. In the north, E’erdeng’e’s army was held at Kaungton and, against Ming Rui’s orders, retreated to Yunnan; the emperor later had him executed."
    facts:
      - ["Qing army", "about 50,000 men, including Manchu and Mongol Bannermen"]
      - ["Battle of the Goteik gorge", "late December 1767, Qing victory"]
      - ["Qing advance reaches", "Singu, 30 miles north of Ava"]
