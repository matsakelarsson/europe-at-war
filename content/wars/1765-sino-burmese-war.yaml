  - title: An uneasy peace
    date: 1770–1790
    when: "1770"
    borders: "1770"
    countries: [mm, cn, th]
    body:
      - "Neither court accepted the agreement. The Qianlong Emperor refused to hand over the sawbwas and banned all trade across the border; Hsinbyushin, furious that his generals had made peace without him, tore up his copy, and Maha Thiha Thura and the other commanders, after putting down a rising in Manipur in January 1770, were sent into exile in the Shan states. Burma kept the 2,500 Chinese prisoners, who were settled in the country. The war had cost the Qing more than 70,000 dead, by modern estimates, and 9.8 million taels of silver; Fuheng died of malaria in 1770. For a decade the emperor kept large forces on the Yunnan frontier, and for two decades the trade ban held."
      - "For Burma, the cost in men was heavy for its population, and the need to guard the north kept its armies out of Siam, which under Taksin recovered all its old lands but Tenasserim. Relations were restored in 1788, brokered by Tai nobles and Yunnan officials who wanted trade. King Bodawpaya treated the exchange of missions as one between equals; the Qing court recorded it as tribute, the emperor sent Bodawpaya the seals of Hsenwi and Bhamo in 1788 and invested him as king of Burma in 1790, and the Burma campaign was counted among the Ten Great Campaigns of his reign. The border, never demarcated, ran roughly where it had before the 1730s."
    facts:
      - ["Qing losses", "more than 70,000 dead (modern estimates), mostly from disease"]
      - ["Cost to the Qing treasury", "9.8 million taels of silver"]
      - ["Relations restored", "1788"]
    markers:
      - kind: capital
        side: kb
        name: Ava
        date: 1770
        text: Hsinbyushin repudiated the Kaungton agreement and exiled the generals who had made it.
        lonlat: [95.985, 21.858]
