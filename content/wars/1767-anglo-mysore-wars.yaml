  - title: Bednur, Mangalore and the Treaty of Mangalore
    date: January 1783 – March 1784
    when: "1783-01"
    borders: "1784-03-11"
    countries: [in, fr]
    body:
      - At the end of 1782 the Bombay government sent Brigadier Richard Matthews to strike at Mysore from the west. He landed on the Kanara coast, took Honnavar and in January 1783 Bednur, whose governor surrendered, and Mangalore in March. Tipu came across from the Carnatic with his main army, retook Bednur at the end of April and made Matthews and his garrison prisoners; Matthews and a number of his officers died in captivity, by poison it was said. On 20 May Tipu laid siege to Mangalore, held by Colonel John Campbell.
      - On the east coast the French general Bussy arrived with reinforcements, and in June General James Stuart besieged him in Cuddalore, while Suffren fought the British fleet offshore on 20 June. Fighting stopped at the end of the month, when news came that Britain and France had agreed a preliminary peace in Europe. The French withdrew from the war, leaving Tipu alone. In the south Colonel William Fullarton marched from Trichinopoly into Mysore’s lowlands, took the fortress of Palghat on 15 November and entered Coimbatore, but he was ordered to halt while the Madras government sought peace.
      - Mangalore’s starving garrison surrendered on 30 January 1784 after an eight-month siege. The Treaty of Mangalore, signed on 11 March 1784, restored all conquests on both sides and freed the prisoners, among them the survivors of Pollilur. Tipu treated it as a victory, and it was the last treaty in which an Indian ruler dealt with the Company on equal terms.
    facts:
      - [Bednur retaken by Tipu, "April 1783"]
      - [Siege of Mangalore, "20 May 1783 – 30 January 1784"]
      - [Siege of Cuddalore, "June 1783, ended by the news of peace in Europe"]
      - [Treaty of Mangalore, "11 March 1784, conquests restored on both sides"]
