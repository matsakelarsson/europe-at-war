  - title: Coote against Hyder
    date: 1781 – December 1782
    when: "1781-07-01"
    borders: "1781-07-01"
    countries: [in, fr]
    body:
      - Coote, now in his fifties and in poor health, had far fewer men than Hyder and was always short of transport and food. In January 1781 he relieved Wandiwash and then marched down the coast. On 1 July 1781 he attacked Hyder’s entrenched army at Porto Novo with about 8,000 men and drove it off the field, the battle that saved the Carnatic. He fought Hyder again on the old battlefield of Pollilur on 27 August, without a clear result, and beat him at Sholinghur on 27 September, which allowed him to supply the besieged fortress of Vellore. Britain was now at war with the Dutch Republic too, and in November a force from Madras took the Dutch port of Negapatam, defended partly by Hyder’s men.
      - Mysore still held most of the open country. On 18 February 1782 Tipu, with French officers in his army, surrounded and captured a Company detachment of some 1,800 men under Colonel John Braithwaite near Thanjavur. That spring a French squadron under the Bailli de Suffren fought the British fleet off the coast, and French troops landed at Porto Novo and took Cuddalore with Mysore’s help in April 1782.
      - Hyder Ali died in his camp near Chittoor on 7 December 1782, probably of cancer. His ministers kept his death secret until Tipu, who was fighting a Bombay force in Malabar, could hurry back and take command. Tipu, now about 32, was proclaimed sultan at the end of December.
    facts:
      - [Battle of Porto Novo, "1 July 1781, Company victory"]
      - [Battle of Sholinghur, "27 September 1781, Company victory"]
      - [Negapatam taken from the Dutch, "November 1781"]
      - [Braithwaite’s detachment captured, "18 February 1782"]
      - [Death of Hyder Ali, "7 December 1782"]
