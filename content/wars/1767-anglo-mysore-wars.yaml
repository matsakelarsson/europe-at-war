  - title: Srirangapatna and the loss of half the kingdom
    date: October 1791 – March 1792
    when: "1792-02-06"
    borders: "1792-03-18"
    countries: [in]
    body:
      - Cornwallis spent the second half of 1791 securing his road to Bangalore and taking the hill forts around it, Nandidurg on 19 October and Savandurga on 21 December, which the Mysoreans had thought impregnable. The Nizam’s army under his son Sikandar Jah and the Maratha armies joined him, and in February 1792 the allies marched on Srirangapatna, while a Bombay army under General Robert Abercromby came up through Coorg from the west.
      - On the night of 6–7 February Cornwallis attacked Tipu’s fortified camp on the north bank of the Kaveri in three columns, drove his army into the fortress and gained a foothold on the island. With the city about to be besieged, Tipu asked for terms. On 26 February his sons Abdul Khaliq and Muizuddin, aged about ten and eight, were handed over as hostages, and the Treaty of Seringapatam was signed on 18 March 1792.
      - Tipu gave up about half of his kingdom and agreed to pay 330 lakh rupees. The Company took Malabar, the Baramahal and Salem, and Dindigul, and the Raja of Coorg came under its protection. The Marathas regained the lands up to the Tungabhadra, and the Nizam took the lands between the Krishna and the Penner with the forts of Cuddapah and Gandikota. The boys were returned in 1794, when the money had been paid.
    facts:
      - [Nandidurg stormed, "19 October 1791"]
      - [Savandurga taken, "21 December 1791"]
      - [Attack on Tipu’s camp, "6–7 February 1792"]
      - [Treaty of Seringapatam, "18 March 1792, half of Mysore ceded"]
