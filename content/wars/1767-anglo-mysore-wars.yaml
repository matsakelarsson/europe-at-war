steps:
  - title: Hyder Ali and the first war
    date: 1767
    when: "1767-09-03"
    borders: "1767-09-03"
    countries: [in]
    body:
      - Hyder Ali, a cavalry officer of Muslim family in the service of the Hindu Wodeyar kings of Mysore, had made himself master of the kingdom by 1761, keeping the king as a figurehead. He conquered Bednur (the old Keladi kingdom) in 1763 and the Malabar coast in 1766, built up an army trained partly on European lines and made Mysore the strongest state in the south. His neighbours took fright. In November 1766 the Company, which had just been granted the Northern Circars on the east coast, agreed to lend troops to the Nizam of Hyderabad, Nizam Ali Khan, and the Marathas planned their own invasion.
      - Early in 1767 the Maratha army of Peshwa Madhavrao entered northern Mysore, and Hyder paid it about 30 lakh rupees to withdraw. The Nizam advanced as far as Bangalore with two Company battalions under Colonel Joseph Smith, but in secret he came to terms with Hyder, and Smith pulled his men back to the Carnatic frontier. In August the allied armies of Mysore and Hyderabad, perhaps 70,000 men by British estimates, came down the passes against Smith’s 7,000.
      - Smith fought them off at Chengam on 3 September but, short of supplies, fell back to Tiruvannamalai while Hyder took Kaveripattinam. On 26 September the allies attacked him there and were driven off with heavy losses. Hyder’s son Tipu, then sixteen, led a cavalry raid that reached the country houses outside Madras (Chennai). In November Hyder failed to take Ambur, and in February 1768 the Nizam made a separate peace with the Company.
    facts:
      - [Battle of Chengam, "3 September 1767"]
      - [Battle of Tiruvannamalai, "26 September 1767, Company victory"]
      - [Strengths at Tiruvannamalai, "about 7,000 Company troops against perhaps 70,000 (British estimate)"]
