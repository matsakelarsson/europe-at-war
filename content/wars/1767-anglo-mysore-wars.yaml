id: anglo-mysore-wars
name: Anglo-Mysore Wars
start: "1767-08"
end: "1799-05-04"
tier: A
summary: "Four wars between the Kingdom of Mysore, ruled by Hyder Ali and then his son Tipu Sultan, and the British East India Company, with the Marathas and the Nizam of Hyderabad as allies of one side or the other. In the first (1767–1769) Hyder rode to the gates of Madras and made the Company accept a defensive treaty. In the second (1780–1784) Mysore destroyed a British column at Pollilur, overran the Carnatic with French help and ended the war on equal terms at Mangalore. In the third (1790–1792) Lord Cornwallis, allied with the Marathas and the Nizam, besieged Srirangapatna and took half of Tipu’s kingdom. In the fourth (1799) a British and Hyderabadi army stormed Srirangapatna; Tipu was killed in the breach, his kingdom was partitioned and a child of the old Wodeyar dynasty was set on the throne of a smaller Mysore under Company protection."
countries: [in]
