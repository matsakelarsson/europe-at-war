  - title: The last war begins
    date: February – April 1799
    when: "1799-03-06"
    borders: "1799-03-27"
    countries: [in, fr]
    body:
      - The new Governor-General, Lord Mornington (later Marquess Wellesley), arrived in 1798 determined to make the Company supreme in India. Tipu had sent envoys to the French governor of Île de France (Mauritius), whose proclamation of January 1798 called for volunteers to fight for him; about a hundred came. In July Bonaparte landed in Egypt. Mornington made the Nizam disband his French-trained corps and accept a subsidiary alliance, then demanded that Tipu receive a British envoy. Tipu delayed, and in February 1799 two armies invaded Mysore.
      - The main army under General George Harris, about 26,000 Company troops, marched from Vellore with the Nizam’s contingent of some 8,000 infantry and 16,000 cavalry, to which Colonel Arthur Wellesley, Mornington’s brother, was attached with his regiment. The Bombay army of about 6,400 men under General James Stuart came up from Cannanore through Coorg. On 6 March Tipu attacked Stuart’s leading brigade at Seedaseer, near Periyapatna, and was beaten off after a six-hour fight in the forest. He then turned east and met Harris at Malavalli on 27 March, where his attack was repulsed.
      - Instead of taking the road Tipu expected, Harris crossed the Kaveri at Sosale and approached Srirangapatna from the south-west. The siege began on 5 April. Stuart’s army joined on 14 April, and British batteries were raised on the north bank to fire across the river at the north-west corner of the fortress. Tipu’s offers to negotiate were met with demands for half his remaining lands and two crore rupees.
    facts:
      - [Battle of Seedaseer, "6 March 1799, Company victory"]
      - [Battle of Malavalli, "27 March 1799, Company victory"]
      - [Siege of Srirangapatna begins, "5 April 1799"]
      - [Invading armies, "about 50,000 men with Harris (including the Nizam’s contingent) and 6,400 with Stuart"]
