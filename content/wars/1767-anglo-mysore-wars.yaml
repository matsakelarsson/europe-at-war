  - title: Pollilur
    date: July – November 1780
    when: "1780-09-10"
    borders: "1780-09-10"
    countries: [in]
    body:
      - The second war grew out of the Anglo-French war that began in 1778. The Company took the French settlements in India, among them Mahé on the Malabar coast in March 1779, a port Hyder regarded as under his protection and through which he received arms. Company troops had also marched through his lands without leave. In 1779 Hyder joined the Maratha minister Nana Phadnavis and the Nizam in a league against the British, who were already at war with the Marathas in the west. In July 1780 he came down the Chengam pass with an army of about 80,000 men and a hundred guns, burnt the country to within sight of Madras and laid siege to Arcot.
      - The Madras army under Sir Hector Munro gathered at Kanchipuram, and a detachment of about 3,800 men under Colonel William Baillie marched south from Guntur to join it. On 6 September Tipu caught Baillie at Pollilur, less than 20 km short of Munro’s camp, and held him there. On 10 September, as Baillie tried to break through, Hyder’s main army surrounded his square. Two of his ammunition wagons blew up, the square was broken by cavalry, and Baillie surrendered. Most of his force was killed, wounded or captured; estimates of the dead range from about 2,000 to 3,000. He and some 200 Europeans, among them the young David Baird, were taken to Srirangapatna, where many spent four years in captivity.
      - Munro threw his heavy guns into the great tank at Kanchipuram and retreated to Madras. Arcot, the Nawab’s capital, fell to Hyder on 3 November 1780. It was the worst defeat the British had yet suffered in India, and the Governor-General, Warren Hastings, sent the commander-in-chief, Sir Eyre Coote, from Calcutta by sea with troops and money.
    facts:
