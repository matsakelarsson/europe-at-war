  - title: The fall of Srirangapatna
    date: 4 May – July 1799
    when: "1799-05-04"
    borders: "1799-06-22"
    countries: [in]
    body:
      - By 3 May the batteries had opened a breach in the north-west wall. At one in the afternoon of 4 May, in the heat of the day when the defenders were resting, about 4,000 European and Indian troops under General David Baird, who had spent four years as Tipu’s prisoner, waded across the river and stormed the breach. Within hours the city was taken. Tipu fought at the north wall and was killed near the Water Gate; his body was found among the dead that evening and buried beside his father’s with military honours the next day. British losses in the siege were about 1,400 killed and wounded; estimates of the defenders killed range from 6,000 to 10,000.
      - The city was plundered through the night, and Arthur Wellesley, made its commander, restored order by hanging looters. Tipu’s treasury, library and throne were divided as prize, and his family was sent to the fortress of Vellore. In the Partition Treaty of Mysore of 22 June 1799 the Company took Kanara, Coimbatore, the Wynad and Srirangapatna itself, and the Nizam took Gooty, Gurramkonda and the lands adjoining his own; a share offered to the Marathas was refused and later divided between the other two.
      - What was left became a smaller Kingdom of Mysore under the Wodeyar dynasty that Hyder had pushed aside. On 30 June 1799 the five-year-old Krishnaraja Wodeyar III was installed at Mysore, with Tipu’s former minister Purnaiya as dewan, and on 8 July a subsidiary treaty put the kingdom under Company protection. In 1800 the Nizam handed the lands he had gained from Mysore in 1792 and 1799 to the Company to pay for its troops, and the Company now ruled or controlled almost all of the south.
    facts:
      - [Storming of Srirangapatna, "4 May 1799"]
      - [Death of Tipu Sultan, "4 May 1799"]
      - [Losses in the siege, "about 1,400 British killed and wounded; 6,000–10,000 defenders killed (estimates)"]
      - [Partition Treaty of Mysore, "22 June 1799"]
      - [Krishnaraja Wodeyar III installed, "30 June 1799"]
    markers:
      - kind: taken
        side: eic
