  - title: Hyder at the gates of Madras
    date: 1768 – March 1769
    when: "1768-02"
    borders: "1769-03-29"
    countries: [in]
    body:
      - The Company now carried the war into Mysore. A Bombay expedition took Mangalore and other ports on Hyder’s west coast in February 1768, helped by the desertion of his fleet’s captains, but Hyder hurried across with Tipu and retook them by May. In the east Smith and Colonel John Wood captured forts in the Baramahal and around Kolar, and in August a Maratha force under Murari Rao of Gooty joined Smith at Hoskote, on the road to Bangalore. Hyder attacked their camp on 22 August and was beaten off, and on 3–4 October he came close to destroying a detachment of Wood’s army at Mulbagal.
      - The campaign was directed by field deputies from the Madras council, who interfered with the generals and could not find supplies; Smith was recalled and Wood dismissed. In November Hyder split his army and came down the ghats into the Carnatic, retaking one post after another and plundering the lands of the Company’s ally, the Nawab of Arcot.
      - In March 1769 he left his infantry behind and rode with about 6,000 horsemen some 210 km in three days to the outskirts of Madras, where he camped near St Thomas Mount. The frightened council agreed to his terms. The Treaty of Madras, signed on 29 March 1769, restored each side’s conquests and bound each to help the other if it were attacked. When the Marathas invaded Mysore again in 1770–1771 and Hyder asked for help, the Company did not send it, which he did not forget.
    facts:
      - [Mangalore taken by the Bombay expedition, "February 1768"]
      - [Hoskote, "22 August 1768, Company and Maratha victory"]
      - [Treaty of Madras, "29 March 1769"]
