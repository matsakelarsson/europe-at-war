  - title: The Travancore Lines and Bangalore
    date: December 1789 – May 1791
    when: "1789-12-29"
    borders: "1791-03-21"
    countries: [in]
    body:
      - Tipu used the peace to strengthen his state. He reformed its revenue, coinage and calendar, sent embassies to Constantinople and France, and in Malabar put down revolts by Hindu Nair chiefs with great harshness, including forced conversions to Islam, whose extent historians still debate; thousands of refugees fled south to Travancore. Travancore, a Company ally, guarded its frontier with a line of earthworks, the Nedumkotta or Travancore Lines, and in 1789 bought the forts of Cranganore and Ayikottai from the Dutch, which Tipu claimed through his vassal, the Raja of Cochin. On 29 December 1789 he attacked the Lines and was beaten back; in April 1790 he broke through and took Cranganore before the monsoon and the news of war drew him home.
      - The Governor-General, Lord Cornwallis, treated the attack as war on the Company. In mid-1790 he made a triple alliance with the Peshwa’s government and the Nizam, who were each to invade Mysore from the north. General William Medows advanced from Trichinopoly into Coimbatore and took its forts, but in September Tipu came down the Gajalhatti pass, struck Medows’s detachments at Sathyamangalam and outmanoeuvred him, then raided the Carnatic as far as Pondicherry.
      - Cornwallis took command himself. Marching from Vellore in February 1791, he climbed the Mugli pass, besieged Bangalore and stormed its fort on the night of 21 March. On 15 May he defeated Tipu at Arakere within sight of Srirangapatna, but with his bullocks dying and the rains coming he had to destroy his siege guns and retreat. A few days later he met the Maratha armies of Parashuram Bhau and Haripant Phadke, who brought supplies; they had just taken Dharwar with help from a Bombay detachment after a long siege.
    facts:
      - [Attack on the Travancore Lines, "29 December 1789"]
      - [Triple alliance with the Marathas and the Nizam, "June – July 1790"]
      - [Storming of Bangalore, "21 March 1791"]
      - [Battle of Arakere, "15 May 1791, Company victory, followed by retreat"]
