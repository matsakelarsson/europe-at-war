notes:
  - The Company’s armies were mostly Indian sepoys under British officers, with some British Army regiments. The Madras army fought in all four wars; the Bombay army landed on the west coast in 1768, 1783, 1791–1792 and 1799, and Bengal sent troops and money from Calcutta.
  - The allies changed. In 1767 the Nizam fought beside Hyder Ali and the Marathas had just been bought off by him; in 1780–1784 the Marathas and the Nizam were in a league with Mysore against the British, though only Mysore fought for long; in 1790–1792 both were British allies, and in 1799 the Nizam sent a large army while the Marathas stayed neutral. France helped Mysore with troops in 1782–1783 and with a few hundred volunteers in 1799.
  - Much of the record is British, including the memoirs of officers who had been prisoners at Srirangapatna, and it has shaped the image of Tipu as a tyrant. Mysorean and other Indian sources, and many modern historians, stress his administration, his modernised army and his long resistance to the Company. Casualty figures for the Mysore armies are rarely known.
  - Names are given in today’s forms where they are well known (Srirangapatna for Seringapatam, Bangalore for Bengaluru’s older spelling, Bednur for Nagar, Chengam for Changama).
