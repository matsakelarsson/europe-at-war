id: taksin-reunification
name: Taksin’s reunification of Siam
start: "1767-06-15"
end: "1771"
tier: B
summary: "The wars in which Phraya Tak, the later King Taksin, rebuilt the Siamese kingdom after the Burmese destroyed Ayutthaya in April 1767. A provincial governor of Teochew Chinese descent who had broken out of the siege in January 1767, he took Chanthaburi on the east coast on 15 June 1767, sailed up the Chao Phraya with about 5,000 men in October, took Thonburi on 6 November and destroyed the Burmese garrison at Phosamton, and was crowned king at Thonburi on 28 December 1767. Four rival regimes had divided the rest of the country: the governor of Phitsanulok and the monk Chao Phra Fang at Sawangkhaburi in the north, Prince Thepphiphit at Phimai on the Khorat plateau, and the acting governor of Nakhon Si Thammarat in the south. Taksin beat back a Burmese force at Bang Kung in 1768, was defeated and wounded at Koeichai by the Phitsanulok forces, but took Phimai in 1768 and Nakhon Si Thammarat in 1769. Chao Phra Fang, who had absorbed Phitsanulok, was overthrown in 1770. With Siam united again, Taksin turned to Lan Na, Cambodia and the Lao kingdoms."
