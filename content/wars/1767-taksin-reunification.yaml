notes:
  - "Most of what is known comes from Thai chronicles written under the Chakri kings who overthrew Taksin in 1782, and from Chinese, French and Dutch reports. Dates differ by a day or a year between sources; Taksin’s breakout from Ayutthaya is dated 3 or 4 January 1767."
  - "Thai histories have called these wars the recovery of independence; the rival leaders are often called warlords or factions (chum). Each claimed to continue the old kingdom: Thepphiphit was a son of King Borommakot, and Chao Phra Fang a monk who ruled in robes. Taksin’s Chinese origins helped him win the support of the Chinese merchant communities on the east coast."
  - "Names: Thonburi is opposite today’s Bangkok, on the west bank of the Chao Phraya. Sawangkhaburi, the seat of Chao Phra Fang, stood near today’s Uttaradit. Nakhon Si Thammarat is the Ligor of European sources."
