  - title: The fall of Chao Phra Fang, and Siam reunited
    date: 1770–1771
    when: "1770-08"
    borders: "1770-12"
    countries: [th, kh, vn]
    body:
      - "In 1770 the forces of Chao Phra Fang raided south as far as Chai Nat. Taksin answered with a campaign by river and land, and in August 1770 took Phitsanulok and then Sawangkhaburi; Chao Phra Fang fled and disappeared. Taksin put his own early followers in charge of the northern towns and had the northern monks, suspected of following the monk-ruler, examined and disciplined. Siam was a single kingdom again, except for the Tenasserim coast, which Burma kept. A first attempt on Burmese-held Chiang Mai, in 1770 or 1771, failed."
      - "Taksin’s new kingdom faced outward at once. In 1771 his army and fleet attacked Hà Tiên, ruled by the Mạc family as vassals of the Nguyễn lords, and Cambodia, to install the pro-Siamese prince Ang Non on the throne; Hà Tiên fell in November 1771. The Burmese governor of Chiang Mai raided Sawankhalok and Phichai, and the war with Burma resumed in 1774–1776 after Lan Na went over to Siam."
    facts:
      - ["Phitsanulok and Sawangkhaburi taken", "August 1770"]
      - ["Hà Tiên taken", "November 1771"]
