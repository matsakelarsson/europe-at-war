steps:
  - title: From Chanthaburi to Thonburi
    date: January – December 1767
    when: "1767-06"
    borders: "1767-12"
    countries: [th]
    body:
      - "Phraya Tak, born Sin to a Teochew Chinese father and a Siamese mother, had risen to be governor of Tak and was called to the defence of Ayutthaya. In early January 1767 he broke through the Burmese lines with about 500 followers and went east and down the coast by Chonburi to Rayong. After Ayutthaya fell he gathered men and ships along the east coast, which the Burmese had not reached. When the governor of Chanthaburi refused to join him, he attacked the town by night and took it on 15 June 1767; by Thai tradition he had his men break their cooking pots, so that they would eat their next meal in the town or die. He then brought the coast from Chonburi to Trat under his control and built a fleet."
      - "In October 1767 he sailed for the Chao Phraya with about 5,000 men and 100 ships. On 6 November he took Thonburi, executing Thong-in, the Siamese whom the Burmese had left in charge, and then stormed the Burmese camp at Phosamton north of Ayutthaya, where its Mon commander, Thugyi, was killed. The ruins of Ayutthaya could not be defended or rebuilt quickly, and Taksin made Thonburi, nearer the sea and its trade, his capital. He was crowned king there on 28 December 1767 and sent envoys to Guangzhou to seek recognition from the Qing."
    facts:
      - ["Chanthaburi taken", "15 June 1767"]
      - ["Thonburi taken", "6 November 1767"]
      - ["Taksin crowned", "28 December 1767, at Thonburi"]
