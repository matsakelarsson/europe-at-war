  - title: The rival regimes
    date: 1768–1769
    when: "1768"
    borders: "1768-01"
    countries: [th, mm, kh]
    body:
      - "The rest of Siam was in other hands. Chaophraya Phitsanulok Rueang, the governor of Phitsanulok, ruled the north and crowned himself; upriver at Sawangkhaburi a monk named Ruean, known as Chao Phra Fang, gathered followers who believed him to have supernatural powers and ruled them in his robes. On the Khorat plateau Prince Thepphiphit, a son of King Borommakot, set himself up at Phimai. In the south the acting governor of Nakhon Si Thammarat, Phra Palat Nu, ruled the peninsula as Chao Nakhon."
      - "A Burmese force sent from Tavoy attacked the Siamese camp at Bang Kung, west of Thonburi, and was routed by Taksin (in late 1767 or 1768; the sources differ). Taksin then marched on Phitsanulok but was beaten at Koeichai, where he was shot in the leg. He turned east and in 1768 took Phimai; Thepphiphit was captured and executed. In the same year Chao Phra Fang took Phitsanulok after its ruler’s death and made himself master of the whole north. In October 1769 Taksin took Nakhon Si Thammarat; Chao Nakhon was captured but spared, and in 1776 Taksin made him ruler of Nakhon Si Thammarat again. An attempt the same year to force Cambodia to send tribute failed."
    facts:
      - ["Battle of Bang Kung", "1767 or 1768, Thonburi victory over a Burmese force"]
      - ["Battle of Koeichai", "1768, Phitsanulok victory; Taksin wounded"]
      - ["Phimai taken", "1768"]
      - ["Nakhon Si Thammarat taken", "October 1769"]
