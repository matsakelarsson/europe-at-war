id: bar-confederation
name: Bar Confederation
start: "1768"
end: "1772"
tier: C
summary: In February 1768 Polish nobles formed a confederation at Bar in Podolia against Russian domination, King Stanisław August and the rights for Protestants and Orthodox that Russia had forced on the Sejm. Four years of guerrilla war against Russian troops followed, during which Cossacks in Russian service, chasing confederates, raided the Ottoman border town of Balta, which helped start the Russo-Turkish War of 1768–1774. The last strongholds, among them Częstochowa, fell in 1772, the year Russia, Prussia and Austria took almost a third of Poland–Lithuania in the First Partition.
