notes:
  - The Corsican Republic, proclaimed in 1755, was never recognised by the European powers, so the base map shows Corsica as Genoese until the Treaty of Versailles and French after it.
  - Places are given in their Italian or French forms of the time; Ponte Novu is Corsican for “new bridge” (Ponte Nuovo in Italian).
