id: french-conquest-of-corsica
name: French conquest of Corsica
start: "1768-05-15"
end: "1769-06"
tier: B
summary: The war in which France, having acquired Genoa’s rights to Corsica in 1768, conquered the island from Pasquale Paoli’s Corsican Republic. The Corsicans beat a French force at Borgo in October 1768, but a much larger French army under the Comte de Vaux broke their resistance at Ponte Novu in May 1769, and Paoli went into exile in Britain.
