steps:
  - title: Borgo and Ponte Novu
    date: May 1768 – June 1769
    when: "1768-05-15"
    borders: "1769-05-09"
    countries: [fr]
    body:
      - Genoa had ruled Corsica since the Middle Ages, but from 1729 the islanders were in almost constant revolt, and in 1755 Pasquale Paoli set up an independent republic with its own constitution, written in Italian, and a capital and later a university at Corte. By the 1760s the Genoese held only a few walled coastal towns, garrisoned by French troops. Unable to subdue the island or to repay its debts to France, Genoa handed Corsica over by the Treaty of Versailles of 15 May 1768, and French troops began to occupy the interior. Paoli called the Corsicans to resist. On 8 October 1768 at Borgo, south of Bastia, his men surrounded a French garrison of some 700 men, beat off the troops sent from Bastia to relieve it, and forced it to surrender.
      - Louis XV briefly considered giving up, but his minister Choiseul sent reinforcements that raised the French army on the island to about 24,000 men, under the Comte de Vaux. In May 1769 de Vaux advanced up the Golo valley towards Corte. On 8–9 May the Corsicans tried to hold the river crossing at Ponte Novu; caught between the French and the fire of foreign mercenaries holding the bridge behind them, they were cut down in large numbers. Resistance collapsed, and in June Paoli sailed into exile in Britain. France made Corsica a province in 1770, though guerrilla resistance went on for years. Napoleon Bonaparte was born at Ajaccio on 15 August 1769, to parents who had fought with Paoli.
    facts:
      - [Treaty of Versailles, "15 May 1768: Genoa cedes its rights to France"]
      - [Battle of Borgo, "8 October 1768, Corsican victory"]
      - [Battle of Ponte Novu, "8–9 May 1769, French victory"]
