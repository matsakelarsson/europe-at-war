  - title: Larga and Kagul
    date: June – November 1770
    when: "1770-06"
    borders: "1770-08-01"
    countries: [md, ua, ro, ru, tr]
    body:
      - In 1770 Field Marshal Pyotr Rumyantsev, now in command of the First Army, marched south along the Pruth with fewer than 40,000 men. He drove back the khan’s Tatars at Ryabaya Mogila in June, and on 18 July he routed an army of some 65,000 Tatars and 15,000 Ottomans under Qaplan II Giray on the Larga, a tributary of the Pruth. The grand vizier, Ivazzade Halil Pasha, then crossed the Danube with the main Ottoman army, put at 100,000–150,000 men, and advanced to the Kagul, near today’s Cahul, to attack him.
      - Rumyantsev struck first. On 1 August he advanced with about 17,000 men in squares, while the rest of his army guarded his supplies and his rear against the Tatars. His artillery broke up the Ottoman attacks, and his infantry stormed the Ottoman camp. The Ottoman army fled to the Danube, where many men drowned trying to escape. In the following months the Russians took the Danube fortresses of Izmail, Kiliya and Brăila and the port of Akkerman, and on 27 September Count Pyotr Panin’s Second Army stormed Bender on the Dniester after a two-month siege. About 7,000 of its defenders were killed, and the Russians lost some 6,000 dead and wounded.
    facts:
      - [Battle of Larga, "18 July 1770, Russian victory"]
      - [Battle of Kagul, "1 August 1770, Russian victory"]
      - [Bender stormed, 27 September 1770]
    markers:
      - kind: battle
        side: ru
        name: Battle of Larga
        date: 18 July 1770
        text: Rumyantsev’s squares stormed the Tatar and Ottoman camp after eight hours of fighting and took its guns.
        lonlat: [28.24, 46.07]
      - kind: battle
        side: ru
        name: Battle of Kagul
        date: 1 August 1770
        text: One of the largest battles of the century. A Russian army many times smaller routed the grand vizier’s army and took its camp.
        lonlat: [28.18, 45.92]
        lp: l
      - kind: taken
        side: ru
        name: Izmail
        date: August 1770
        text: The Danube fortress surrendered to a Russian corps soon after Kagul.
        lonlat: [28.83, 45.35]
      - kind: taken
        side: ru
        name: Kiliya
        date: September 1770
        text: Taken after a short siege, giving the Russians the mouth of the Danube.
        lonlat: [29.27, 45.45]
      - kind: taken
        side: ru
        name: Akkerman
        date: Autumn 1770
        text: The Ottoman fortress at the mouth of the Dniester surrendered to the Russians.
        lonlat: [30.35, 46.18]
      - kind: taken
        side: ru
        name: Bender
        date: 27 September 1770
        text: Panin’s army stormed the fortress at night after a mine brought down part of the wall. Thousands of defenders were killed and the rest captured.
        lonlat: [29.47, 46.83]
      - kind: taken
        side: ru
        name: Brăila
        date: November 1770
        text: The last of the lower Danube fortresses north of the river to fall to the Russians that year.
        lonlat: [27.96, 45.27]
    arrows:
