id: russo-turkish-war-1768
name: Russo-Turkish War of 1768–1774
start: "1768-10-06"
end: "1774-07-21"
tier: A
summary: A war between the Russian Empire and the Ottoman Empire, with its vassal the Crimean Khanate, that grew out of Russia’s intervention in Poland–Lithuania. Russian armies overran Moldavia, Wallachia and the Crimea, and a Russian fleet sent from the Baltic destroyed the Ottoman fleet at Chesma. At Küçük Kaynarca in 1774 the Ottomans gave up the Crimean Khanate, which became independent, and ceded Kerch, Kinburn and Kabarda to Russia.
