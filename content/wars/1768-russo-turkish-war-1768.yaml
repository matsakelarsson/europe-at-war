notes:
  - Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date the battle of Kagul, for example, 21 July 1770 and the Treaty of Küçük Kaynarca 10 July 1774.
  - Russia’s parallel campaigns in Georgia (1769–1772) and the Russian fleet’s actions off Syria and Lebanon are not followed here.
  - Place names are given in their present-day forms, except for a few towns better known by their historical names, such as Kefe (Feodosia), Kiliya (Kiliia) and Akkerman (Bilhorod-Dnistrovskyi).
