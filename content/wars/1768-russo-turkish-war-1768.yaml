  - title: Kozludzha and Küçük Kaynarca
    date: 1773–1774
    when: "1773-06"
    borders: "1774-07-21"
    countries: [bg, ro, ua, ru, tr]
    body:
      - In 1773 Rumyantsev crossed the Danube but failed before Silistra and withdrew, and that autumn Pugachev’s rebellion broke out in the east of Russia. The new sultan, Abdul Hamid I, decided to fight on. In June 1774 Rumyantsev crossed the river again. On 20 June Alexander Suvorov and Mikhail Kamensky met an Ottoman army of about 40,000 at Kozludzha. Suvorov attacked at once and routed it, though only some 8,000 Russians were engaged, and the Ottomans fled to Shumen, where Rumyantsev blockaded the grand vizier, Muhsinzade Mehmed Pasha.
      - On 21 July 1774 the two sides made peace at the village of Küçük Kaynarca near Silistra. The Crimean Khanate became independent of the Ottoman Empire, though the sultan kept religious authority over its Muslims as caliph. Russia gained Kerch and Yenikale on the strait into the Sea of Azov, Kinburn at the mouth of the Dnieper with a strip of steppe between the Dnieper and the Bug, full possession of Azov, and Kabarda in the North Caucasus. Its merchant ships won the right to sail through the Straits, it was paid 4.5 million rubles, and it gained a voice in the affairs of the sultan’s Orthodox subjects. Moldavia and Wallachia were returned.
    facts:
      - [Battle of Kozludzha, "20 June 1774, Russian victory"]
      - [Treaty of Küçük Kaynarca, 21 July 1774]
      - [Russia gained, "Kerch and Yenikale, Kinburn, Azov and Kabarda"]
    markers:
      - kind: held
        side: ot
        name: Silistra
        date: June 1773
        text: Rumyantsev’s first attempt to carry the war south of the Danube failed before this fortress.
        lonlat: [27.26, 44.12]
      - kind: battle
        side: ru
        name: Battle of Kozludzha
        date: 20 June 1774
        text: Suvorov’s smaller force routed the Ottomans and took their camp and artillery.
        lonlat: [27.59, 43.33]
      - kind: event
        side: ru
        name: Shumen
        date: Late June – July 1774
        text: The grand vizier’s army was blockaded here until the Ottomans agreed to make peace.
        lonlat: [26.93, 43.28]
        lp: l
      - kind: treaty
        name: Treaty of Küçük Kaynarca
        date: 21 July 1774
        text: Signed in Rumyantsev’s camp at this village, today’s Kaynardzha in Bulgaria.
        lonlat: [27.5, 43.98]
      - kind: event
        side: ru
        name: Kinburn
        date: 1774
        text: The fort at the mouth of the Dnieper, facing Ottoman Ochakov across the estuary, became Russian.
        lonlat: [31.54, 46.55]
      - kind: event
