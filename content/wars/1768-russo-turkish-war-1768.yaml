steps:
  - title: Balta and the last Tatar raid
    date: 1768–1769
    when: "1768-06"
    borders: "1769-10-07"
    countries: [ua, md, ro, pl, ru, tr]
    body:
      - In 1768 Russian troops in Poland–Lithuania were fighting the Bar Confederation, nobles in arms against Russian domination, while a Cossack and peasant rising, the Koliivshchyna, swept right-bank Ukraine with massacres of Poles and Jews, above all at Uman. That summer Cossacks pursuing confederates crossed into the Ottoman border town of Balta and, according to Ottoman reports, sacked it and killed many of its people. Russia denied responsibility, but the confederates and the French ambassador were urging war, and on 6 October Sultan Mustafa III had the Russian envoy, Aleksei Obreskov, imprisoned. It amounted to a declaration of war.
      - In January 1769 the Crimean khan, Qırım Giray, led some 70,000 Tatars, Nogais and Ottoman troops into New Serbia, the Russian frontier province on the steppe of central Ukraine, burning villages and carrying off many captives. It proved to be the last great Tatar raid. That year Russian armies moved south. After a long struggle the Ottomans abandoned Khotyn in September, and Russian troops entered Iași in October and Bucharest in November, while a second army took over Azov and Taganrog. In both Moldavia and Wallachia many boyars swore allegiance to Catherine II.
    facts:
      - [War begins, "6 October 1768, the Russian envoy imprisoned in Constantinople"]
      - [Tatar raid on New Serbia, January 1769]
      - [Russian armies take, "Khotyn, Iași and Bucharest, autumn 1769"]
    markers:
      - kind: event
        name: Uman
        date: June 1768
        text: Haidamak rebels took the town and killed thousands of its Polish and Jewish inhabitants, one of the worst massacres of the Koliivshchyna.
        lonlat: [30.22, 48.75]
      - kind: event
        name: Balta
        date: Summer 1768
        text: Cossacks chasing Bar confederates over the border attacked this Ottoman town, giving the sultan his reason for war.
        lonlat: [29.62, 47.94]
      - kind: event
        side: ct
        name: New Serbia
        date: January 1769
        text: The Tatars ravaged the settlements around the Russian fortress of St Elizabeth, today’s Kropyvnytskyi, and drove off captives and livestock.
        lonlat: [32.27, 48.5]
      - kind: taken
        side: ru
        name: Khotyn
        date: September 1769
        text: After months of fighting around the fortress, its garrison abandoned it to the Russians.
        lonlat: [26.49, 48.51]
      - kind: taken
        side: ru
        name: Iași
        date: October 1769
        text: The Russians occupied the Moldavian capital, and many boyars swore allegiance to the empress.
        lonlat: [27.59, 47.16]
      - kind: taken
        side: ru
        name: Bucharest
        date: November 1769
        text: Russian troops entered the Wallachian capital and spread out across the principality.
        lonlat: [26.1, 44.43]
