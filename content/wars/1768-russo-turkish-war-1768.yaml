  - title: Chesma
    date: 1769–1770
    when: "1769-08"
    borders: "1770-07-07"
    countries: [gr, tr, ru]
    body:
      - To strike the Ottomans from another side, Catherine sent squadrons of the Baltic Fleet around Europe to the Mediterranean, the first Russian fleet ever to sail there. Count Alexei Orlov was to raise the Greeks against the sultan, and British officers served in the fleet. In February 1770 Russian ships landed troops in the Mani, and Greeks rose across the Peloponnese. But the Russians were too few, the siege of Methoni failed, and the rising collapsed. Albanian irregulars brought in by the Ottomans took savage revenge on the Greek population.
      - On 5 July the fleet, under Orlov with Admiral Grigory Spiridov and Rear Admiral John Elphinstone, attacked the Ottoman fleet in the strait between Chios and the Anatolian coast. In the fighting the Russian Sviatoi Evstafii and the Ottoman flagship blew up, and the Ottomans withdrew into the crowded bay of Çeşme. In the night of 6–7 July Russian ships bombarded them and sent in fire ships. Almost the entire Ottoman fleet burned, and thousands of sailors died. The victory gave Russia control of the Aegean, but it could not force the Dardanelles, and its fleet stayed in the islands, based on Paros, until the end of the war.
    facts:
      - [Russian commanders, "Alexei Orlov, Grigory Spiridov, John Elphinstone"]
      - [Battle of Chesma, "5–7 July 1770, Russian victory"]
    markers:
      - kind: event
        side: ru
        name: Mani
        date: February 1770
        text: Russian troops landed here to support a Greek rising that spread across the Peloponnese before it was crushed.
        lonlat: [22.39, 36.71]
      - kind: held
        side: ot
        name: Methoni
        date: April – May 1770
        text: Russian and Greek forces besieged the fortress but gave up as an Ottoman relief army approached.
        lonlat: [21.71, 36.82]
        lp: l
      - kind: naval
        side: ru
        name: Battle of Chios Strait
        date: 5 July 1770
        text: A hard-fought battle in which both sides lost a ship of the line, after which the Ottoman fleet took refuge in Çeşme bay.
        lonlat: [26.18, 38.42]
        lp: l
      - kind: naval
        side: ru
        name: Battle of Chesma
        date: 6–7 July 1770
        text: Fire ships and gunfire destroyed almost the whole Ottoman fleet at anchor.
        lonlat: [26.29, 38.33]
        lp: b
      - kind: event
        side: ru
        name: Paros
        date: 1770–1774
        text: The Russian fleet’s main base in the Aegean for the rest of the war.
        lonlat: [25.24, 37.12]
    arrows:
      - side: ru
        label: Orlov’s fleet
        via: [[22.6, 36.4], [24.4, 37.0], [25.9, 38.2], [26.2, 38.38]]
  - title: The conquest of the Crimea
    date: 1771–1772
    when: "1771-06"
    borders: "1771-07-10"
    countries: [ua, ru, tr]
    body:
      - In June 1771 the Second Army, now under Prince Vasily Dolgorukov, stormed the Perekop lines and entered the Crimea, while another column came down the Arabat Spit from the north-east. On 10 July it beat an Ottoman and Tatar army outside Kefe (Feodosia), the main Ottoman stronghold, and the Ottomans then abandoned Kerch, Yenikale, Arabat and Balaklava. Khan Selim III Giray fled to Constantinople, and the Ottoman garrisons were driven out of the peninsula. Dolgorukov was later given the honorary surname Krymsky, “of the Crimea”.
      - Crimean notables chose a new khan acceptable to Russia, Sahib II Giray, and in November 1772 at Karasubazar he signed a treaty that made the khanate independent of the Ottomans under Russian protection, with Russian garrisons in Kerch and Yenikale. Meanwhile plague, brought from the Danube front, spread to Moscow and killed tens of thousands there in 1770–1772; in September 1771 it set off a riot in which the city’s archbishop was killed. A truce was agreed in May 1772, but peace talks at Focșani and Bucharest broke down over the Crimea.
    facts:
      - [Perekop stormed, 25 June 1771]
      - [Treaty of Karasubazar, "November 1772, the khanate under Russian protection"]
      - [Truce and talks, May 1772 – March 1773]
    markers:
      - kind: taken
        side: ru
        name: Perekop
        date: June 1771
        text: Dolgorukov’s army stormed the lines across the isthmus and the fort of Or Qapı behind them.
        lonlat: [33.69, 46.16]
      - kind: taken
        side: ru
        name: Kefe
        date: 10 July 1771
        text: The main Ottoman fortress and slave market of the Crimea fell after Dolgorukov beat an Ottoman and Tatar army outside the town.
        lonlat: [35.38, 45.03]
      - kind: taken
        side: ru
        name: Kerch and Yenikale
        date: July 1771
        text: The forts commanding the strait into the Sea of Azov were taken and kept by Russia at the peace.
        lonlat: [36.47, 45.36]
      - kind: treaty
        name: Treaty of Karasubazar
        date: November 1772
        text: Khan Sahib II Giray accepted Russian protection and declared the khanate independent of the Ottomans.
        lonlat: [34.6, 45.05]
    arrows:
      - side: ru
        label: Dolgorukov
        via: [[33.9, 46.75], [33.72, 46.2], [34.4, 45.45], [35.3, 45.08]]
      - side: ru
        via: [[34.85, 46.2], [35.25, 45.6], [35.4, 45.15]]
