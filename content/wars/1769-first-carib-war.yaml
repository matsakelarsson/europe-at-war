steps:
  - title: Surveyors and hostages
    date: "1763–1771"
    when: "1769"
    borders: "1769"
    countries: [vc, gb]
    body:
      - "By the Treaty of Paris of 1763 France gave up its claims to Saint Vincent, which had been declared a neutral island in 1748 and where French colonists grew coffee and cocoa on the leeward coast alongside the Garifuna and Kalinago. The British government appointed commissioners, led by Sir William Young, to survey the island and sell its land to British planters to grow sugar. Most of the best land lay on the windward side, which the Garifuna held and farmed, and they refused to sell it or to move to a reserve."
      - "In 1769 the commissioners sent surveyors with an escort of the 32nd Regiment to cut a road into the Garifuna lands. Garifuna warriors stopped them and held them hostage before letting them go. The chiefs, among them Joseph Chatoyer, turned to the French governor of Martinique, who supplied them with arms, and the Garifuna refused British demands to give up their land and their French contacts. Planters and officials in Kingstown pressed London for troops; three regiments were sent to the Windward Islands in 1770, and in 1771 a letter was intercepted that confirmed the Garifuna’s ties with Martinique."
    facts:
      - [Saint Vincent ceded to Britain, "10 February 1763"]
      - [Survey party taken hostage, "1769"]
