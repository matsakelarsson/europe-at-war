id: first-carib-war
name: First Carib War
start: "1769"
end: "1773-02-17"
tier: B
summary: "The war in which the Garifuna (the “Black Caribs”) and Kalinago of Saint Vincent defended their lands against British settlement. When France ceded Saint Vincent to Britain in 1763, most of the island, above all the fertile windward side, was held by the Garifuna, a people of Kalinago and African descent, and the British commissioners set out to survey it and sell it to planters. In 1769 the Garifuna under their chiefs, among them Joseph Chatoyer, stopped a road-building party escorted by the 32nd Regiment and held it hostage, and they obtained arms from French Martinique. In 1772 the British government sent regiments from North America and the other islands, and Major-General William Dalrymple advanced north from Kingstown and landed troops at Grand Sable; but the Garifuna, some 1,500 to 3,000 fighters, ambushed the columns in the forested mountains, and fever killed many soldiers. With the war unpopular in Parliament, Dalrymple and the Garifuna chiefs signed a treaty on 17 February 1773: the Garifuna acknowledged the British king and kept the northern third of the island, from the Wallilabou River in the west to the Byera River in the east. It was the first treaty Britain had signed with a non-European people in the Caribbean since the Jamaican Maroon treaties of 1739."
countries: [vc, gb]
sides:
  - id: gb
    name: Great Britain (the government of Saint Vincent and the regiments sent by the North ministry)
    polities: [united-kingdom, british-west-indies]
    ink: red
    moves: British moves
    success: British success
  - id: gar
    name: Garifuna and Kalinago of Saint Vincent (Joseph Chatoyer and other chiefs)
    polities: [garifuna, kalinago]
    ink: teal
    moves: Garifuna moves
    success: Garifuna success
notes:
  - "The British called the Garifuna “Black Caribs” and the Kalinago “Yellow” or “Red Caribs”; the main contemporary account, Sir William Young’s Account of the Black Charaibs (1795), was written by the son of the commissioner who sold their land and served to justify their later deportation."
  - "The Garifuna trace their origin to Kalinago and to Africans who reached Saint Vincent from shipwrecked slave ships and by escaping from other islands from the seventeenth century onwards."
