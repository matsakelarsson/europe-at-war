  - title: Dalrymple’s campaign and the treaty of 1773
    date: "September 1772 – February 1773"
    when: "1772-10"
    borders: "1773-02-17"
    countries: [vc, gb]
    body:
      - "In 1772 the North ministry, urged on by Governor William Leyborne, decided to crush the Garifuna before France could intervene. Companies of the 31st, 32nd, 68th and 70th Regiments were brought from the neighbouring islands and the 6th and 14th Regiments from Massachusetts, and a naval squadron watched the channel to Martinique. In September Major-General William Dalrymple advanced north from Kingstown along the windward coast while other troops landed at Grand Sable, now Georgetown, aiming to take the mountains in the centre of the island."
      - "The campaign bogged down in the rainy season. The Garifuna, perhaps 1,500 to 3,000 fighters, fell back into the forested ridges, ambushed columns and raided plantations; in January 1773 a party of the 31st Regiment under Ralph Walsh was ambushed and killed. Fever and dysentery killed far more soldiers than the fighting: half of the 14th Regiment died before it saw action, and the troops depended on food shipped from North America. In London, members of Parliament such as Thomas Townshend and Isaac Barré attacked the war as an unjust attack on a people defending their own land."
      - "On 17 February 1773 Dalrymple and the chiefs of Grand Sable, Masiraca, Rabacca and the other Garifuna districts signed a peace treaty. The Garifuna acknowledged King George III as their sovereign, promised to return runaways and to help against his enemies, and gave up their lands in the south and centre; in return they kept the northern third of the island, from the Wallilabou River on the west coast to the Byera River on the east, as their own. Many planters and officials never accepted the line, and Chatoyer and his people would side with the French when they took the island in 1779."
    facts:
