id: moamoria-rebellion
name: Moamoria rebellion
start: "1769-09"
end: "1805"
tier: C
summary: "A series of risings in the Ahom kingdom of Assam by the Moamorias, the followers of the Mayamara Vaishnava monastery (satra), most of them Morans and other peasant groups who resented the forced-labour (paik) system and the court’s persecution of their sect. In November 1769 rebels led by Ragha Neog took the capital, Rangpur, and captured King Lakshmi Singha, ruling in his name until royalists retook the city in April 1770 and executed the leaders. A second rising was put down in 1782 with mass killings. In 1786–1788 the rebels rose again, King Gaurinath Singha fled from Rangpur to Guwahati, and rebel leaders held much of Upper Assam. At Gaurinath’s request the East India Company sent Captain Thomas Welsh with a small force, which retook Guwahati in November 1792 and Rangpur in March 1794 before it was recalled. The prime minister Purnananda Burhagohain fought on until a settlement in 1805 left the Moran country around Bengmara self-governing under its own chief, the Barsenapati, who paid tribute. The kingdom is estimated to have lost as much as half of its people to war, famine and flight, which left it open to the Burmese invasions of 1817–1826."
countries: [in]
