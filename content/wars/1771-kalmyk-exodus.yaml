id: kalmyk-exodus
name: Kalmyk (Torghut) exodus
start: "1771-01"
end: "1771-07"
tier: C
summary: "The flight of most of the Kalmyks of the lower Volga, led by Ubashi Khan, across the Kazakh steppe to Dzungaria, then under the Qing. The Kalmyks, Oirat Mongols who had come to the Volga in the 1630s, saw their pastures taken by Russian and German settlers and Cossack lines, their khan’s power curbed by a council the Russian government imposed, their horsemen called up for Russia’s wars and their people pressed to convert to Orthodoxy. With the blessing of the Dalai Lama, who chose the date, the uluses on the left (eastern) bank of the Volga set out in January 1771; the ice on the Volga was too weak for those on the right bank, mostly Dörbets, to cross, and they stayed in Russia. Estimates of the number who left range from about 140,000 to 200,000 people, with millions of animals. They crossed the Ural, where they killed Cossacks at Vetlyaninskaya, and were harried across the steppe by Kazakhs of the Junior Zhuz under Nurali Khan and later by Ablai Khan’s men, while a Russian corps under Traubenberg set out from Orsk and gave up the pursuit. Fighting, cold, thirst and hunger killed tens of thousands; estimates of those who reached the Ili valley in July 1771 range from about 70,000–85,000 to, in some Kazakh accounts, only 15,000–20,000. The Qianlong emperor received them as subjects, gave Ubashi the title of khan and settled the Torghuts in separate banners across Dzungaria. In October 1771 Catherine II abolished the Kalmyk Khanate; the Kalmyks who remained on the Volga came under the governor of Astrakhan."
