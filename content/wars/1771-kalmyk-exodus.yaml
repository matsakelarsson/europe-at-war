notes:
  - Russian dates are Old Style (Julian); the departure, given as 5 January 1771, was on 16 January in the Gregorian calendar. The Torghuts were accepted as Qing subjects on 24 July 1771.
  - Numbers vary widely between Russian, Kalmyk, Qing and Kazakh sources, both for those who left and for those who arrived. Chinese tradition calls the migration the Torghuts’ “return to the east”; Kalmyk songs and oral history remember it as a parting, in which the rich followed the khan and the poor stayed, and many men were killed and women taken captive on the way.
  - The Qing settled the Torghuts in Dzungaria, whose Dzungar people had been almost destroyed in 1755–1758. The Kalmyks who stayed on the Volga are the ancestors of today’s Kalmyks of Russia.
