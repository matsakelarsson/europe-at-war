  - title: Two fronts
    date: 1774–1775
    when: "1775-02"
    borders: "1775-03-01"
    countries: [vn]
    body:
      - In late 1774 the Trịnh lord Trịnh Sâm broke the hundred-year truce and sent his general Hoàng Ngũ Phúc south with some 30,000 men, ostensibly to help the Nguyễn against the regent and the rebels. The Nguyễn court handed Trương Phúc Loan over, but the Trịnh army marched on, and in early 1775 took Phú Xuân. Nguyễn Phúc Thuần fled to Quảng Nam, and then by sea to Gia Định, with his nephew Nguyễn Phúc Ánh; another nephew, Nguyễn Phúc Dương, fell into Tây Sơn hands.
      - A Nguyễn army from Gia Định under Tống Phước Hiệp retook the southern coast as far as Phú Yên, while the Trịnh crossed the Hải Vân pass and defeated the Tây Sơn at Cẩm Sa in Quảng Nam. Caught between the two, Nguyễn Nhạc submitted to the Trịnh in May 1775 and was given a Trịnh title. The Trịnh army turned back to Phú Xuân, where an epidemic almost destroyed it, and left the Tây Sơn free to deal with the Nguyễn in the south.
    facts:
      - [Phú Xuân taken by the Trịnh, "early 1775"]
      - [Trịnh army, "about 30,000"]
      - [Nguyễn Nhạc submits to the Trịnh, "May 1775"]
