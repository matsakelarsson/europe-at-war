steps:
  - title: The rising in Bình Định
    date: 1771–1773
    when: "1773-09"
    borders: "1773-10-01"
    countries: [vn]
    body:
      - In the 1760s the Nguyễn domain was in crisis. Wars with Siam over Cambodia had drained its treasury, harvests failed, taxes rose, and after the death of Lord Nguyễn Phúc Khoát in 1765 the regent Trương Phúc Loan ruled in the name of the young Nguyễn Phúc Thuần. In 1771 Nguyễn Nhạc, a tax collector and betel trader from the village of Tây Sơn in the hills of Quy Nhơn prefecture, rose with his brothers Nguyễn Huệ and Nguyễn Lữ against the regent, promising to restore the rightful heir. They drew upland peoples, Cham, poor Vietnamese peasants and merchants, and Chinese traders and their armed bands, led by Lý Tài and Tập Đình, who were hurt by the decline of trade.
      - For two years the brothers built up their forces in the remote highland of An Khê. In mid-September 1773 Nguyễn Nhạc had himself carried into the walled town of Quy Nhơn in a cage, as if captured, and at night broke out and opened the gates to his men; the governor fled. With the port of Quy Nhơn as their base, the Tây Sơn took the neighbouring prefectures, and by 1774 they had more than 25,000 men.
    facts:
      - [Rising begins, "1771"]
      - [Quy Nhơn taken, "September 1773"]
      - [Tây Sơn army, "more than 25,000 (1774)"]
