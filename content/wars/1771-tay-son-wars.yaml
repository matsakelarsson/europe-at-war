  - title: Rạch Gầm–Xoài Mút
    date: July 1784 – January 1785
    when: "1785-01"
    borders: "1785-01-20"
    countries: [vn, kh, th]
    body:
      - In mid-1784 Siam sent an army through Cambodia and a fleet by sea to restore Nguyễn Ánh; Vietnamese records give 20,000 men and 300 ships for the fleet and 30,000 for the land army, while the Thai chronicles give much smaller numbers. By the end of the year the Siamese held much of the western Mekong delta, from Rạch Giá to Sa Đéc and Trà Ôn, but the Tây Sơn still held Mỹ Tho and Saigon. Nguyễn Ánh complained in a letter to a French priest that the Siamese troops robbed, raped and killed the people, who turned to the Tây Sơn.
      - Nguyễn Huệ came south with reinforcements, feigned weakness and negotiated, and set an ambush on the Mekong between the Rạch Gầm and Xoài Mút creeks, west of Mỹ Tho. On the morning of 20 January 1785 the Siamese fleet sailed into it and was destroyed. Vietnamese accounts claim 40,000 Siamese killed; another account says only about a thousand survived. The Siamese commander and Nguyễn Ánh fled back to Bangkok, and Nguyễn Ánh sent Pigneau de Behaine, with his young son, to seek help from France.
    facts:
      - [Battle of Rạch Gầm–Xoài Mút, "20 January 1785, Tây Sơn victory"]
      - [Siamese force (Vietnamese records), "about 50,000 men, 300 ships"]
      - [Siamese dead (Vietnamese claim), "40,000"]
