  - title: The brothers divided
    date: 1787–1788
    when: "1788-09"
    borders: "1788-10-01"
    countries: [vn, th]
    body:
      - Nguyễn Nhạc divided the conquests. Nguyễn Lữ was to rule Gia Định, Nhạc kept the centre as emperor at Quy Nhơn, and Nguyễn Huệ, with the title Bắc Bình vương, ruled from Phú Xuân over Thuận Hóa and Nghệ An. Distrust between the two elder brothers turned into war from February to June 1787, when Huệ besieged Nhạc in his citadel and forced him to give up more land. In the north Nguyễn Hữu Chỉnh made himself master of Lê Chiêu Thống’s court; Huệ sent Vũ Văn Nhậm, who took Thăng Long in late 1787 and killed Chỉnh, and when Nhậm in turn seemed to aim at power, Huệ came north in 1788 and had him executed. Lê Chiêu Thống fled and appealed to the Qing for help.
      - Nguyễn Ánh left Siam secretly in August 1787 with his followers, landed in the Mekong delta and, while the Tây Sơn were busy in the north, took Saigon in September 1788. Nguyễn Lữ fled to Quy Nhơn and died soon after. This time Nguyễn Ánh kept Saigon for good.
    facts:
      - [War between Nguyễn Nhạc and Nguyễn Huệ, "February–June 1787"]
      - [Nguyễn Hữu Chỉnh killed, "late 1787"]
      - [Saigon retaken by Nguyễn Ánh, "September 1788"]
