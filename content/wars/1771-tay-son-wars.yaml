notes:
  - The history of the war was written by the victors. The chronicles of the Nguyễn dynasty treat the Tây Sơn as rebels and usurpers; Vietnamese historians of the 20th century, especially in the north, described the Tây Sơn as a peasant revolution and Nguyễn Huệ as a national hero, and condemned Nguyễn Ánh for bringing in Siamese and French help. Western historians such as George Dutton stress the mixed coalition behind the rising and the suffering of the population under all sides. The war as a whole is said to have cost more than a million lives.
  - Dates are those of the English sources cited, which sometimes differ by days (Gia Long’s entry into Thăng Long is given as 20 and as 22 July 1802). The French help to Nguyễn Ánh came from volunteers recruited by Bishop Pigneau de Behaine, fewer than a hundred at most, since the French crown never carried out its treaty of 1787. The Qing invasion of 1788–1789 has its own entry.
