  - title: The monsoon campaigns
    date: 1793–1800
    when: "1799-06"
    borders: "1799-07-01"
    countries: [vn]
    body:
      - The war became a contest of yearly offensives timed by the monsoon. Each summer the Nguyễn fleet sailed north on the south-west wind, landed armies on the coast and returned when the wind turned. In 1793 the Nguyễn besieged Nguyễn Nhạc in Quy Nhơn until an army from Phú Xuân relieved him; Nhạc died soon afterwards and his lands passed under Cảnh Thịnh’s control. In 1794 Nguyễn Ánh left a garrison under his son Nguyễn Phúc Cảnh, with Pigneau de Behaine, in a new citadel at Diên Khánh near Nha Trang, which held out against a Tây Sơn siege; it was the first time the Nguyễn could stay in Tây Sơn country out of season.
      - The Tây Sơn counter-attacked towards Bà Rịa in 1795, and the Nguyễn held Da Nang for two months in 1797. In 1799 Nguyễn Ánh struck at Quy Nhơn with a fleet of three French-commanded ships, 100 galleys and hundreds of smaller craft and an army including Siamese troops, and took the city after a siege; he renamed it Bình Định and left Võ Tánh to hold it. Pigneau de Behaine died during the campaign in October 1799.
    facts:
      - [Siege of Diên Khánh, "1794"]
      - [Quy Nhơn taken by the Nguyễn, "1799"]
      - [Death of Pigneau de Behaine, "October 1799"]
