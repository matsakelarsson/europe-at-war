  - title: The Qing invasion and Ngọc Hồi–Đống Đa
    date: November 1788 – January 1789
    when: "1789-01"
    borders: "1789-01-30"
    countries: [vn, cn]
    body:
      - In November 1788 Qing armies under Sun Shiyi crossed the border to restore Lê Chiêu Thống and took Thăng Long without a fight, while the Tây Sơn garrison fell back to Tam Điệp. On 22 December Nguyễn Huệ proclaimed himself emperor as Quang Trung at Phú Xuân, abolishing the Lê dynasty, and marched north, recruiting on the way. At the turn of the lunar year, on 30 January 1789, his army stormed the Qing positions at Ngọc Hồi and Đống Đa and drove the Qing army out of Thăng Long; Sun Shiyi and Lê Chiêu Thống fled to China. The Qing then recognised Quang Trung as king of Annam. The campaign is described in its own entry.
    facts:
      - [Quang Trung proclaimed emperor, "22 December 1788"]
      - [Battle of Ngọc Hồi–Đống Đa, "30 January 1789, Tây Sơn victory"]
    markers:
