  - title: Phú Xuân, Thăng Long and the Nguyễn dynasty
    date: 1801–1802
    when: "1802-07"
    borders: "1802-07-22"
    countries: [vn]
    body:
      - In 1800 the Tây Sơn generals Trần Quang Diệu and his wife Bùi Thị Xuân besieged Võ Tánh in Quy Nhơn. In February 1801 the Nguyễn fleet destroyed the Tây Sơn fleet at Thị Nại, capturing, by Nguyễn accounts, 13,700 men. Nguyễn Ánh then sailed north past the besiegers, landed in Quảng Nam, and in June 1801 took Phú Xuân almost unopposed, while Cảnh Thịnh fled north. The besieged garrison of Quy Nhơn could not hold out; Võ Tánh killed himself and the Tây Sơn took the city in the summer of 1801, a victory that changed nothing. A European observer put the casualties of both sides at Quy Nhơn at more than 54,000.
      - In June 1802 Nguyễn Ánh proclaimed himself emperor at Phú Xuân as Gia Long, and in the spring and summer his forces sailed north, landed in the delta and marched on Thăng Long, which he entered on 20 or 22 July 1802. Cảnh Thịnh was captured. The Tây Sơn leaders, among them Cảnh Thịnh and Bùi Thị Xuân, were executed by being pulled apart, and the remains of Nguyễn Nhạc and Nguyễn Huệ were dug up and desecrated. Gia Long ruled a country stretching for the first time from the Chinese border to the Gulf of Siam, and in 1804 the Qing recognised it under the name Việt Nam.
    facts:
      - [Naval battle of Thị Nại, "February 1801, Nguyễn victory"]
      - [Phú Xuân taken by the Nguyễn, "June 1801"]
      - [Gia Long proclaimed emperor, "June 1802"]
      - [Thăng Long entered, "20 or 22 July 1802"]
