  - title: Saigon changes hands
    date: 1778–1784
    when: "1782-05"
    borders: "1782-06-01"
    countries: [vn, kh, th]
    body:
      - When the Tây Sơn army left, Nguyễn Ánh returned with the general Đỗ Thanh Nhơn and his Đông Sơn army and retook Saigon in early 1778. In 1780 he proclaimed himself Nguyễn vương (king), and in 1781 he had Đỗ Thanh Nhơn, whose power overshadowed his own, killed. A Nguyễn attack on Nha Trang failed in 1781. In May 1782 Nguyễn Nhạc and Nguyễn Huệ came south with about 100 warships, forced their way up the Saigon River and took the city. After a Chinese general in Nguyễn service killed one of Nhạc’s officers, the Tây Sơn troops burned the Chinese shops and killed Chinese residents of Saigon; estimates of the dead range from 4,000 to 20,000.
      - The brothers went home in June, and the Nguyễn retook Saigon a few months later. In March 1783 Nguyễn Huệ and Nguyễn Lữ took it once more and destroyed the Nguyễn army; Nguyễn Ánh’s brother was killed. Pursued by the Tây Sơn fleet, Nguyễn Ánh escaped to Phú Quốc and the islands off Cambodia, where a storm scattered his pursuers, and in February 1784 he went to Bangkok to ask King Rama I for help.
    facts:
      - [Saigon retaken by the Nguyễn, "1778"]
      - [Saigon taken by the Tây Sơn, "May 1782 and March 1783"]
      - [Chinese killed in Saigon, "4,000–20,000 (estimates)"]
