  - title: Gia Định builds up
    date: 1788–1792
    when: "1792-07"
    borders: "1792-09-16"
    countries: [vn]
    body:
      - Nguyễn Ánh made Gia Định into a state that could outlast the Tây Sơn. He conscripted half the men of the region, collected rice taxes and sold the surplus for iron, sulphur and arms. In 1789 Pigneau de Behaine came back from France, where Louis XVI had signed a treaty of alliance in 1787 that was never carried out, with two ships and a few dozen volunteers he had raised himself. French officers built a citadel at Saigon on the Vauban model in 1790, with 30,000 labourers, trained infantry in European drill and helped to build a navy of European-style ships alongside the traditional galleys.
      - Quang Trung, after his victory over the Qing, secured Qing recognition, reorganised his government and sent armies into Laos, and in 1792 prepared a great attack on Gia Định. In the summer of 1792 a Nguyễn fleet led by Jean-Marie Dayot attacked the Tây Sơn fleet at Thị Nại, the port of Quy Nhơn, and destroyed it. On 16 September 1792 Quang Trung died suddenly at the age of 40, and his ten-year-old son Nguyễn Quang Toản succeeded as Emperor Cảnh Thịnh, under a regent whose purges divided the Tây Sơn leadership.
    facts:
