id: tay-son-wars
name: Tây Sơn wars
start: "1771"
end: "1802-07"
tier: A
summary: "Three decades of war that began with a rising of three brothers from Tây Sơn in Bình Định, Nguyễn Nhạc, Nguyễn Huệ and Nguyễn Lữ, against the Nguyễn lords of southern Đại Việt and ended with the unification of Vietnam under the last surviving Nguyễn prince. Drawing on peasants, upland peoples, Chinese merchants and Vietnamese traders, the Tây Sơn took Quy Nhơn in 1773, and while the Trịnh lords of the north invaded and took the Nguyễn capital Phú Xuân, they drove the Nguyễn south and in 1777 took Saigon and killed nearly the whole ruling family. Nguyễn Ánh, who escaped, fought back from the Mekong delta with Siamese, French and Chinese help. Nguyễn Huệ destroyed a Siamese fleet at Rạch Gầm–Xoài Mút in 1785, ended the rule of the Trịnh in 1786, routed a Qing army sent to restore the Lê emperor at Ngọc Hồi–Đống Đa in 1789 and reigned as Emperor Quang Trung until his death in 1792. From his base at Gia Định, Nguyễn Ánh advanced up the coast in yearly monsoon campaigns, took the Tây Sơn heartland at Quy Nhơn and Phú Xuân in 1799–1801, and in July 1802 entered Thăng Long as the Gia Long Emperor."
countries: [vn, kh, th, cn]
