  - title: The end of the Trịnh
    date: June – August 1786
    when: "1786-07"
    borders: "1786-07-21"
    countries: [vn]
    body:
      - The north had been weakened by famines and floods and by infighting after the death of Trịnh Sâm in 1782. Encouraged by Nguyễn Hữu Chỉnh, a Trịnh officer who had gone over to him, Nguyễn Nhạc sent Nguyễn Huệ in June 1786 to take back the former Nguyễn lands held by the Trịnh. Huệ sailed up the Hương River while Chỉnh crossed the Hải Vân pass, and Phú Xuân surrendered after brief resistance; many of its Trịnh defenders were killed. In days the Tây Sơn held everything to the Gianh River.
      - Against his brother’s orders, and urged on by Chỉnh, Nguyễn Huệ pressed north with some 400 ships, taking the public granaries on the way. The Trịnh resistance collapsed, the lord Trịnh Khải fled, was captured and killed himself, and on 21 July 1786 Nguyễn Huệ entered Thăng Long. He presented himself to the old Lê emperor Lê Hiển Tông as the restorer of Lê authority and married his daughter, Princess Lê Ngọc Hân. When the emperor died a few days later, his grandson Lê Chiêu Thống succeeded him. Nguyễn Nhạc came north, and in August the brothers went home with their armies, leaving the north to the Lê.
    facts:
      - [Phú Xuân taken by the Tây Sơn, "June 1786"]
      - [Thăng Long entered, "21 July 1786"]
      - [Trịnh Khải dies, "1786"]
