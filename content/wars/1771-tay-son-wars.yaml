  - title: The fall of the Nguyễn lords
    date: 1776–1777
    when: "1777-10"
    borders: "1777-12-01"
    countries: [vn]
    body:
      - In 1776 Nguyễn Nhạc took the title of king and made the old Cham citadel of Chà Bàn (Vijaya), near Quy Nhơn, his capital; two years later he proclaimed himself emperor as Thái Đức. Lý Tài and his Chinese troops went over to the Nguyễn in late 1775. Nguyễn Lữ took Saigon by sea in the spring of 1776 but was driven out again.
      - In the spring of 1777 Nguyễn Huệ and Nguyễn Lữ sailed south again, destroyed the main Nguyễn army and took Saigon. They captured and killed nearly every member of the ruling family, among them the lord Nguyễn Phúc Thuần and the prince Nguyễn Phúc Dương. The fifteen-year-old Nguyễn Phúc Ánh escaped through the swamps of Cà Mau to the island of Pulau Panjang in the Gulf of Siam, helped by the French missionary bishop Pierre Pigneau de Behaine. Nguyễn Huệ then returned to Quy Nhơn, leaving a garrison in Saigon.
    facts:
      - [Nguyễn Nhạc takes the title of king, "1776"]
      - [Saigon taken by Nguyễn Huệ, "1777"]
      - [Nguyễn Phúc Thuần killed, "1777"]
