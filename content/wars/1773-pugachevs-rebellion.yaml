steps:
  - title: The false Peter III
    date: September 1773 – April 1774
    when: "1773-09-28"
    borders: "1774-04-02"
    countries: [kz, ru]
    body:
      - Yemelyan Pugachev, a Don Cossack who had deserted from the army, appeared among the Yaik Cossacks in 1773 claiming to be Peter III, Catherine II’s husband, who had been overthrown and killed in 1762. The Yaik Cossacks, many of them Old Believers, had risen in 1772 against the government’s inroads on their freedoms and been harshly punished. In September 1773 a small band of them followed Pugachev against Yaitsk. He could not take its fortress, but he swept up the line of small forts along the Yaik, whose garrisons often went over to him. Officers who resisted were hanged.
      - In October he laid siege to Orenburg, the seat of government in the region, and set up his camp and his own “War College” at nearby Berda. Bashkirs under Salawat Yulayev, Tatars, Kalmyks and serfs from the Ural ironworks joined him, his bands besieged Ufa, and the revolt spread into the Urals and western Siberia. A government force was beaten in November. Orenburg went hungry for six months, until a larger army under General Aleksandr Bibikov arrived. On 2 April 1774 Prince Pyotr Golitsyn crushed Pugachev at the Tatishchev fortress, Orenburg and Ufa were relieved, and Pugachev fled into the southern Urals.
    facts:
      - [Rising begins, "28 September 1773, on the Yaik"]
      - [Siege of Orenburg, "October 1773 – April 1774"]
      - [Battle of Tatishchev fortress, "2 April 1774, government victory"]
