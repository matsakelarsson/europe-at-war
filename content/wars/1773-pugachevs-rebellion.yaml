    polities: [russia]
    ink: green
    moves: Government moves
    success: Government success
notes:
  - Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, and Russian accounts give the Old Style dates, such as 17 September 1773 for the start of the rising and 10 January 1775 for Pugachev’s execution.
  - Also called the Peasants’ War of 1773–1775. Yaitsk is today’s Oral in Kazakhstan, and Tsaritsyn is Volgograd.
