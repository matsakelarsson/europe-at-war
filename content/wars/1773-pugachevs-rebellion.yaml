  - title: Down the Volga
    date: July 1774 – January 1775
    when: "1774-07-26"
    borders: "1774-09-05"
    countries: [ru, kz]
    body:
      - On the right bank of the Volga, among the serf villages, the rising became a peasant war. On 11 August Pugachev issued a manifesto granting the serfs their freedom and calling on them to deal with their landlords, and hundreds of manor houses were burned and many noble families killed. Penza and Saratov fell as he swept south along the river, and there was alarm in Moscow. But the Treaty of Küçük Kaynarca had ended the Turkish war in July, and regular troops were coming back to deal with him, among them Alexander Suvorov.
      - On 1 September Pugachev failed to take Tsaritsyn, and on 5 September Mikhelson caught and destroyed his army at Solenikova Vataga, downstream from the town. Pugachev fled into the steppe east of the Volga, where his own Cossack lieutenants seized him and handed him over at Yaitsk later that month. He was taken to Moscow in a cage and executed on Bolotnaya Square on 21 January 1775. Troops under Count Pyotr Panin hanged rebels across the Volga lands. The Yaik was renamed the Ural, and Yaitsk became Uralsk.
    facts:
      - [Manifesto freeing the serfs, "11 August 1774 (31 July Old Style)"]
      - [Last battle, "Solenikova Vataga, 5 September 1774"]
      - [Pugachev executed, "21 January 1775, Moscow"]
