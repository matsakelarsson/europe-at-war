  - title: Kazan
    date: April – July 1774
    when: "1774-04"
    borders: "1774-07-23"
    countries: [ru]
    body:
      - In the Urals and Bashkiria Pugachev raised a new army. Bibikov died of fever in April, and the government’s troops were spread thin over a vast country. The rebels, joined by Bashkirs and ironworkers, burned factories and took towns and works such as Krasnoufimsk, Osa and Izhevsk, and Pugachev turned west towards the Volga with a large but poorly armed host. On 23 July he stormed Kazan, one of the empire’s largest cities, and burned much of it, though the garrison held out in the kremlin.
      - Ivan Mikhelson, who had chased Pugachev through the Urals, arrived the same day and beat the rebels in three days of fighting outside the city. Pugachev’s army was killed, captured or scattered, but he escaped and crossed the Volga with a few hundred men on 28 July. Across the river, in the lands of the serf-owning nobility, he found a new following.
    facts:
      - [Kazan stormed, "23 July 1774 (12 July Old Style)"]
      - [Government commander, Ivan Mikhelson]
