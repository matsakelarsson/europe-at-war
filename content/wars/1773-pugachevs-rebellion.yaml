id: pugachevs-rebellion
name: Pugachev’s Rebellion
start: "1773-09-28"
end: "1775-01-21"
tier: B
summary: The largest popular rising in the history of the Russian Empire, led by the Don Cossack Yemelyan Pugachev, who claimed to be the overthrown emperor Peter III. Begun by the Yaik Cossacks in 1773 and joined by Bashkirs, Tatars, Ural factory serfs and finally peasants of the Volga lands, it besieged Orenburg, burned Kazan and killed many landowners before it was crushed in 1774. Pugachev was executed in Moscow in January 1775.
