notes:
  - Also called the First Rohilla War. The Company’s brigade was made up mostly of Indian sepoys under British officers.
  - Losses are poorly recorded. One count gives about 130 Company and 250 Awadh soldiers killed and wounded at Miranpur Katra, and about 2,000 Rohilla dead.
