id: rohilla-war
name: Rohilla War
start: "1773"
end: "1774-10-07"
tier: C
summary: "A war in which Shuja-ud-Daula, Nawab of Awadh, with a brigade of East India Company troops, conquered Rohilkhand, the land east of the upper Ganges ruled by Afghan Rohilla chiefs. In 1772 the Rohilla regent Hafiz Rahmat Khan had promised Shuja 40 lakh rupees for help against a Maratha invasion; when the Marathas withdrew in 1773 the money was not paid. By the Treaty of Benares (September 1773) the Governor of Bengal, Warren Hastings, agreed to lend Company troops for the conquest in return for a subsidy. On 23 April 1774 the Company brigade under Colonel Alexander Champion defeated the Rohillas at Miranpur Katra, where Hafiz Rahmat Khan was killed. Awadh annexed Rohilkhand, and many Rohillas were driven across the Ganges or left the country. Faizullah Khan, holding out in the hills at Lal Dang, kept the small state of Rampur by the Treaty of Lal Dang of 7 October 1774. Reports of plunder and cruelty by Awadh’s troops made the war a charge against Hastings in his impeachment (1787–1795), at which he was acquitted."
countries: [in]
sides:
