id: lord-dunmores-war
name: Lord Dunmore’s War
start: "1774-05"
end: "1774-10-19"
tier: C
summary: "A war between the colony of Virginia and the Shawnee and Mingo of the Ohio country. At the Treaty of Fort Stanwix in 1768 the Haudenosaunee sold Britain the land south of the Ohio River, which the Shawnee, Lenape and Mingo who hunted there had never agreed to give up, and Virginian surveyors and settlers moved into Kentucky and the upper Ohio valley. After years of killings on both sides, a party of frontiersmen under Daniel Greathouse murdered a group of Mingo at Yellow Creek on 30 April 1774, among them relatives of the Mingo leader Logan, who took revenge on the settlements with Shawnee and Mingo war parties. Virginia’s governor, John Murray, Earl of Dunmore, sent two armies: about 1,700 men under his own command down the Ohio from Fort Pitt, and about 1,100 under Andrew Lewis down the Kanawha. On 10 October 1774 the Shawnee leader Cornstalk attacked Lewis’s camp at Point Pleasant, where the Kanawha joins the Ohio; after a day of fighting the Shawnee withdrew across the Ohio, having lost about 40 men against some 75 Virginians killed and 140 wounded. At Camp Charlotte on 19 October the Shawnee agreed to stop hunting south of the Ohio and to leave travellers on the river alone. Logan refused to attend; the speech sent in his name, “Logan’s Lament”, became famous. The peace opened Kentucky to settlement and lasted only until the Shawnee joined the wars of the American Revolution."
