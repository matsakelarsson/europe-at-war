steps:
  - title: Lexington and Concord
    date: 1763 – April 1775
    when: "1775-04-19"
    borders: "1775-04-19"
    countries: [us, gb]
    view:
      center: [-71.20, 42.41]
      size: [70, 50]
    body:
      - "Britain came out of the Seven Years’ War in 1763 with North America east of the Mississippi and a heavy debt. Its government kept an army in America and tried to make the colonies pay part of the cost: the Stamp Act of 1765, repealed after riots and a boycott, the Townshend duties of 1767 and the tea tax that the Boston Tea Party of 16 December 1773 defied. The colonists argued that only their own assemblies could tax them. The Royal Proclamation of 1763, which closed the lands west of the Appalachians to colonial settlement and reserved them for the Native nations, angered land speculators and settlers. Troops in Boston killed five people in a crowd on 5 March 1770, among them Crispus Attucks, a sailor of African and Native descent. After the Tea Party Parliament closed the port of Boston and curtailed self-government in Massachusetts by acts that colonists called the Intolerable Acts, and the First Continental Congress met in Philadelphia in September 1774 and called for a boycott of British goods. Towns drilled militia companies, some of them “minutemen” ready to turn out at once."
      - "General Thomas Gage, the military governor of Massachusetts, sent about 700 regulars under Lieutenant Colonel Francis Smith on the night of 18 April 1775 to seize and destroy military stores at Concord. Paul Revere, William Dawes and others rode ahead to raise the alarm. At dawn on 19 April about 77 militiamen under Captain John Parker stood on the green at Lexington; a shot of unknown origin was followed by British volleys that killed eight of them. Prince Estabrook, an enslaved man in the company, was among the wounded. At Concord militia drove a British company back from the North Bridge."
      - "On the 30 km march back to Boston thousands of militiamen from the surrounding towns fired on the column from cover, and only the arrival of a relief brigade under Lord Percy at Lexington saved it. The British lost 73 killed, 174 wounded and 26 missing; the Americans 49 killed, 39 wounded and 5 missing. By nightfall militia from all over New England were gathering around Boston, and the siege of the town began."
    facts:
      - [Battles of Lexington and Concord, "19 April 1775"]
      - [British losses, "73 killed, 174 wounded, 26 missing"]
      - [American losses, "49 killed, 39 wounded, 5 missing"]
