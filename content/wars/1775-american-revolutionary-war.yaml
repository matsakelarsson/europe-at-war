  - title: Spain on the Gulf Coast
    date: 1779–1781
    when: "1781-05-08"
    borders: "1781-05-10"
    countries: [us, es, gb, cu]
    body:
      - "Spain had secretly sent money, gunpowder and supplies to the Americans through New Orleans since 1776. When it declared war on Britain in June 1779, Bernardo de Gálvez, the young governor of Spanish Louisiana, moved at once against British West Florida. With about 1,400 men, Spanish regulars, Louisiana militia, Acadian and German settlers, companies of free Black and mixed-race militia, Native allies and a few Americans, he took Fort Bute at Manchac on 7 September 1779 and Baton Rouge on 21 September; its surrender included Fort Panmure at Natchez."
      - "In 1780 Gálvez sailed from New Orleans and took Fort Charlotte at Mobile on 14 March. On the upper Mississippi, a British-led force, most of them warriors of the Native nations of the upper Mississippi and the Great Lakes, attacked Spanish St. Louis on 26 May 1780 and was beaten off, and in early 1781 a small Spanish party raided Fort St. Joseph in Michigan."
      - "The great expedition against Pensacola, the capital of West Florida, sailed from Havana. When the naval commander hesitated to enter the bay under the guns of the British forts, Gálvez sailed in alone on his brig on 18 March 1781, and the fleet followed. More than 7,000 Spanish and French troops besieged General John Campbell’s garrison of British regulars, German troops, Loyalists and sailors, with Muscogee and Choctaw allies, until a shell blew up the magazine of the Queen’s Redoubt on 8 May; Campbell surrendered on 10 May 1781. West Florida was in Spanish hands, and Spain kept it at the peace and regained East Florida as well."
    facts:
      - [Baton Rouge taken, "21 September 1779"]
      - [Mobile taken, "14 March 1780"]
      - [Siege of Pensacola, "9 March – 10 May 1781"]
