notes:
  - The war is also called the American War of Independence, and in the United States the Revolutionary War. Fighting in the Caribbean is told in the West Indies campaign, the siege of Gibraltar and the war in Europe in the Anglo-Spanish War of 1779–1783, and the Cherokee war of 1776 and after in the Cherokee–American wars.
  - "Casualty figures are estimates. About 6,800 Americans are thought to have been killed in action; with deaths from disease and in British prisons, estimates of American military deaths range from about 25,000 to 70,000. British, German, Loyalist and Native losses were also heavy, and a smallpox epidemic that spread across North America in 1775–1782 killed far more people than the fighting."
  - Many Native nations tried at first to stay out of what they saw as a quarrel among the British. Most of those that fought sided with Britain, which had tried to limit colonial settlement west of the Appalachians since the Proclamation of 1763; others allied with the Americans. Their own aims, to keep their land and independence, were not settled by the peace.
  - "About 5,000 Black men, free and enslaved, served in the Continental Army and navy, many in integrated units; thousands more joined the British, who promised freedom to enslaved people of rebel owners. Estimates of the number of enslaved people who escaped to British lines during the war range from about 20,000 to as many as 100,000."
