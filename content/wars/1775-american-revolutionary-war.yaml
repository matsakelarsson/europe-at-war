  - title: Savannah, Charleston and Camden
    date: December 1778 – August 1780
    when: "1780-05-12"
    borders: "1780-05-12"
    countries: [us, gb, fr, ht]
    body:
      - "Stalemated in the north, the British turned south, where they expected many Loyalists to rise. An expedition from New York under Archibald Campbell took Savannah on 29 December 1778 and Augusta a month later, and royal government was restored in Georgia. On 30 June 1779 Clinton issued the Philipsburg Proclamation, promising freedom to any enslaved person who escaped from a rebel owner to the British lines, but not to those owned by Loyalists. Thousands of people fled to the British in the South; many worked as labourers, servants and soldiers, and many died of disease in the crowded camps."
      - "In September 1779 d’Estaing’s fleet came from the Caribbean with some 4,000 French troops, among them about 500 free men of colour from Saint-Domingue in the Chasseurs-Volontaires, and joined Benjamin Lincoln’s army in besieging Savannah. Their assault on 9 October was beaten off with heavy losses; the Polish volunteer Casimir Pulaski was mortally wounded, and the French sailed away."
      - "Clinton and Cornwallis then landed near Charleston with an army that grew to more than 10,000 men, besieged the city from April 1780 and forced Lincoln to surrender on 12 May with about 5,000 men, the largest American surrender of the war. On 29 May Banastre Tarleton’s Loyalist cavalry destroyed a Virginia regiment at the Waxhaws, killing many men who were trying to surrender, and on 16 August Cornwallis routed the army of Horatio Gates at Camden. A brutal civil war broke out in the Carolina backcountry between Patriot and Loyalist militias, while partisan leaders such as Francis Marion, Thomas Sumter and Andrew Pickens harried British posts."
    facts:
      - [Savannah taken, "29 December 1778"]
      - [Philipsburg Proclamation, "30 June 1779"]
      - [Franco-American assault on Savannah, "9 October 1779"]
      - [Surrender of Charleston, "12 May 1780, about 5,000 men"]
      - [Battle of Camden, "16 August 1780"]
