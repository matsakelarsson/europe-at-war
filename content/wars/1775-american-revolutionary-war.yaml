id: american-revolutionary-war
name: American Revolutionary War
start: "1775-04-19"
end: "1783-09-03"
tier: A
summary: "The war in which thirteen of Britain’s North American colonies won their independence as the United States. Quarrels over taxation and self-government after the Seven Years’ War turned to fighting at Lexington and Concord on 19 April 1775. The Continental Congress made George Washington commander of a Continental Army, the colonies declared independence on 4 July 1776, and an American invasion of Canada failed. Britain took New York in 1776 and Philadelphia in 1777, but the surrender of John Burgoyne’s army at Saratoga in October 1777 brought France into the war in 1778, followed by Spain in 1779 and the Dutch Republic in 1780, which made it a world war fought from the Caribbean to India. The Haudenosaunee (Iroquois) Confederacy split, most of its nations fighting for Britain and the Oneida and Tuscarora for the Americans, and the war on the frontier destroyed towns on both sides. Britain then turned to the South, taking Savannah and Charleston, and promised freedom to enslaved people who escaped from rebel owners; tens of thousands did. After a hard campaign in the Carolinas, Charles Cornwallis was besieged at Yorktown by American and French armies and a French fleet and surrendered on 19 October 1781. The Treaty of Paris of 3 September 1783 recognised the United States, with a western boundary on the Mississippi, and in a treaty signed the same day Britain returned Florida to Spain; Britain’s Native allies were not mentioned in it, and some 60,000 Loyalists left the new republic."
countries: [us, gb, fr, es, ca]
