  - title: From Kings Mountain to Eutaw Springs
    date: October 1780 – September 1781
    when: "1781-03-15"
    borders: "1781-03-15"
    countries: [us, gb]
    body:
      - "As Cornwallis advanced into North Carolina, his left was covered by Patrick Ferguson’s Loyalist militia. Over-mountain men from the settlements beyond the Appalachians, with Carolina and Virginia militia, caught Ferguson on Kings Mountain on 7 October 1780 and destroyed his force: Ferguson, the only Briton in the battle, was killed, with between about 150 and 290 Loyalists by different counts, and about 670 were captured, several of whom were later hanged. Cornwallis fell back into South Carolina."
      - "Nathanael Greene took command of the southern army in December and divided it. On 17 January 1781, at Cowpens, Daniel Morgan destroyed Tarleton’s force, killing, wounding or capturing some 900 of its roughly 1,100 men. Cornwallis burned his baggage to chase Greene across North Carolina, but Greene escaped over the Dan River into Virginia in February. Reinforced, he came back and fought Cornwallis at Guilford Court House on 15 March; the British held the field but lost about a quarter of their 1,900 men. Cornwallis marched to Wilmington on the coast to refit and then, in April, north into Virginia."
      - "Greene turned south again. He lost the battles of Hobkirk’s Hill on 25 April and Eutaw Springs on 8 September, and failed to take the fort at Ninety Six, but each time the British had to give ground, while Marion, Sumter, Pickens and Henry Lee’s legion took their smaller posts. By the end of 1781 the British held little more than Charleston and Savannah. The fighting between neighbours in the backcountry was among the most brutal of the war; the Catawba Nation fought on the American side."
    facts:
      - [Battle of Kings Mountain, "7 October 1780"]
      - [Battle of Cowpens, "17 January 1781"]
      - [Battle of Guilford Court House, "15 March 1781"]
      - [Battle of Eutaw Springs, "8 September 1781"]
