  - title: Dunmore’s Proclamation and the South
    date: November 1775 – June 1776
    when: "1775-11-07"
    borders: "1776-02-27"
    countries: [us, gb]
    link: { href: "#/war/cherokee-american-wars", text: Cherokee–American wars }
    body:
      - "In the South the war turned at once on slavery. Lord Dunmore, the royal governor of Virginia, had fled Williamsburg to a warship in June 1775. On 7 November, in a proclamation published a week later, he declared martial law and promised freedom to enslaved men and indentured servants of rebel owners who would serve the king. Between about 800 and 2,000 people escaped to his ships; some 300 men formed an “Ethiopian Regiment” whose sashes bore the words “Liberty to Slaves”. The proclamation frightened slaveholders across the South, and many historians see it as one of the things that pushed Southern planters towards independence."
      - "On 9 December 1775 Virginia and North Carolina militia beat Dunmore’s regulars, Loyalists and Black soldiers at Great Bridge, south of Norfolk. Dunmore withdrew to his ships, and on 1 January 1776 Norfolk burned, set alight partly by British naval fire but mostly by Patriot troops who wanted to deny it to him. Smallpox and fever swept through the crowded camps on his ships and killed many of the people who had come to him; in August he sailed for New York with the survivors."
      - "In North Carolina a Loyalist force, mostly Scottish Highland settlers, marching to meet a British fleet on the coast, was routed at Moore’s Creek Bridge on 27 February 1776. The fleet, under Sir Peter Parker with troops under Henry Clinton, then attacked Charleston, but its bombardment of the palmetto-log fort on Sullivan’s Island on 28 June 1776 failed, and it sailed north to join Howe. That summer Cherokee warriors attacked the settlements on the western frontier, and militia from Virginia and the Carolinas burned more than fifty Cherokee towns in return. Apart from that frontier war, the South saw little fighting until the end of 1778."
    facts:
      - [Dunmore’s Proclamation, "7 November 1775"]
      - [Battle of Great Bridge, "9 December 1775"]
      - [Battle of Moore’s Creek Bridge, "27 February 1776"]
      - [Battle of Sullivan’s Island, "28 June 1776"]
