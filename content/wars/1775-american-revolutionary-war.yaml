  - title: Bunker Hill and the siege of Boston
    date: May 1775 – March 1776
    when: "1775-06-17"
    borders: "1775-06-17"
    countries: [us, gb]
    body:
      - "The Second Continental Congress met in Philadelphia on 10 May 1775. That same day Ethan Allen’s Green Mountain Boys and Benedict Arnold surprised the small British garrison of Fort Ticonderoga on Lake Champlain and took its cannon. On 14 June Congress adopted the militia around Boston as a Continental Army and the next day made George Washington of Virginia its commander. A last petition to George III was rejected, and in August the king declared the colonies in rebellion."
      - "On the night of 16 June the Americans fortified Breed’s Hill on the Charlestown peninsula, overlooking Boston. On 17 June General William Howe sent some 2,400 to 3,000 men across the harbour, by different counts; two frontal assaults were thrown back with heavy losses, and a third took the redoubt when the defenders ran out of powder. The British lost 226 killed and 828 wounded, more than a third of those engaged; the Americans about 115 to 140 killed, 305 wounded and 30 captured, among the dead Dr Joseph Warren. Black soldiers such as Peter Salem and Salem Poor fought in the American lines. The battle, named after the nearby Bunker Hill, showed that militia could stand against regulars."
      - "Washington took command at Cambridge on 3 July and kept Boston besieged through the winter. At first he and Congress barred Black men from enlisting; after Lord Dunmore’s offer of freedom to enslaved men who joined the British, free Black veterans were allowed to re-enlist. Henry Knox brought some sixty tons of cannon from Ticonderoga by ox-drawn sledges across the snow, and on the night of 4–5 March 1776 they were mounted on Dorchester Heights, commanding the town and harbour. Howe evacuated Boston on 17 March 1776 and sailed for Halifax with his army and about 1,000 Loyalists."
    facts:
      - [Capture of Fort Ticonderoga, "10 May 1775"]
      - [Battle of Bunker Hill, "17 June 1775"]
      - [British losses at Bunker Hill, "226 killed, 828 wounded"]
      - [British evacuation of Boston, "17 March 1776"]
    markers:
