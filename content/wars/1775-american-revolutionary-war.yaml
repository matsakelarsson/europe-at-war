  - title: The last battles and the peace
    date: 1782–1783
    when: "1783-09-03"
    borders: "1783-09-03"
    countries: [us, gb, ca, es, fr]
    link: { href: "#/war/northwest-indian-war", text: Northwest Indian War }
    body:
      - "The war went on in the west after Yorktown. On 8 March 1782 Pennsylvania militia under David Williamson killed 96 Christian Lenape and Mohican, 28 men, 29 women and 39 children, who had come back to Gnadenhutten on the Tuscarawas to harvest their fields, a killing known as the Gnadenhutten massacre. In June, near the Sandusky towns, Lenape, Wyandot and Shawnee warriors with Butler’s Rangers defeated William Crawford’s expedition, and Crawford was captured and put to death by torture in revenge for Gnadenhutten. On 19 August Wyandot, Shawnee and other warriors with Loyalist rangers routed the Kentucky militia at Blue Licks, killing more than 70, among them a son of Daniel Boone. In November Clark burned the Shawnee towns on the Great Miami."
      - "Peace talks in Paris between Britain and the American commissioners, Franklin, John Adams, John Jay and Henry Laurens, led to preliminary articles in November 1782 and the Treaty of Paris on 3 September 1783. Britain recognised the independence of the United States, with a boundary running through the Great Lakes and west to the Mississippi, and fishing rights off Newfoundland; in separate treaties with France and Spain it returned Florida and Minorca to Spain. Britain’s Native allies were not mentioned. They had not been defeated and rejected the idea that their lands had passed to the United States, and Britain kept its posts at Detroit, Niagara and elsewhere on the American side of the line until 1796."
      - "The British left Savannah in July 1782, Charleston in December and New York on 25 November 1783. Some 60,000 Loyalists left the United States, taking about 15,000 enslaved people with them; most went to Nova Scotia, where New Brunswick was made a separate colony for them in 1784, and to Quebec, others to Britain, the Bahamas and Jamaica. About 3,000 Black Loyalists, listed by name in the “Book of Negroes”, were evacuated from New York to Nova Scotia, where many settled at Birchtown; in 1792 some 1,200 of them sailed for Sierra Leone. In 1784 the Haldimand Proclamation gave the Mohawk and other Haudenosaunee allies of Britain land on the Grand River, where Brant led them. Slavery remained legal in most of the new states, while Vermont, Pennsylvania and Massachusetts began to abolish it."
    facts:
      - [Gnadenhutten, "8 March 1782, 96 Christian Lenape and Mohican killed"]
      - [Battle of Blue Licks, "19 August 1782"]
      - [Treaty of Paris, "3 September 1783"]
      - [British evacuation of New York, "25 November 1783"]
      - [Loyalists who left, "about 60,000, with some 15,000 enslaved people"]
