  - title: The war on the northern frontier
    date: 1778–1779
    when: "1779-08-29"
    borders: "1779-08-29"
    countries: [us, gb]
    body:
      - "From Fort Niagara Loyalist rangers under John Butler and Haudenosaunee warriors carried the war to the frontier settlements of New York and Pennsylvania. On 3 July 1778 Butler’s Rangers and Seneca and Cayuga warriors under Sayenqueraghta and Cornplanter defeated the militia of the Wyoming valley, killing about 300 men in the battle and the rout; American accounts called it the Wyoming massacre. American troops burned the Mohawk town of Onaquaga, Joseph Brant’s base, in October. On 11 November Rangers under Walter Butler, with Seneca and Mohawk warriors, attacked Cherry Valley and killed about 30 non-combatants as well as 14 to 16 soldiers, an attack remembered as the Cherry Valley massacre; Brant is said to have tried to restrain the killing."
      - "In 1779 Washington ordered the “total destruction and devastation” of the Haudenosaunee settlements. John Sullivan and James Clinton led some 4,000 Continental soldiers into Cayuga and Seneca country, beat Butler’s and Brant’s smaller force at Newtown on 29 August and burned at least 40 towns, with their houses, fields of corn and orchards, as far as the great Seneca town of Genesee Castle. Daniel Brodhead burned Seneca and Lenape towns on the Allegheny. About 5,000 refugees spent the hard winter of 1779–1780 around Fort Niagara, where many died; the Seneca remembered Washington as Hanödaga:nyas, Town Destroyer. The raids on the frontier grew fiercer in the following years, and the Oneida’s own towns were destroyed by pro-British Haudenosaunee in 1780."
      - "Further west the Shawnee, Lenape, Wyandot and other nations of the Ohio country raided the Kentucky settlements, which they had never accepted, and besieged Boonesborough in 1778; the murder of the Shawnee leader Cornstalk by militiamen while he was held at Fort Randolph in 1777 had driven many Shawnee to war. The Lenape signed the first treaty of the United States with a Native nation at Fort Pitt in 1778, but its leader White Eyes died that year, killed, by later accounts, by American militiamen. George Rogers Clark, with Virginia militia, took the French villages of Kaskaskia and Cahokia in July 1778; when Henry Hamilton came from Detroit and retook Vincennes, Clark marched across the flooded Illinois country in February 1779 and forced him to surrender on 25 February. Detroit, the British base, was never taken."
    facts:
      - [Battle of Wyoming, "3 July 1778"]
      - [Attack on Cherry Valley, "11 November 1778"]
      - [Sullivan–Clinton expedition, "summer 1779, at least 40 towns burned"]
      - [Vincennes surrenders to Clark, "25 February 1779"]
