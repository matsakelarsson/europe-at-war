  - title: Philadelphia and Valley Forge
    date: July 1777 – June 1778
    when: "1777-09-26"
    borders: "1777-09-26"
    countries: [us, gb]
    body:
      - "Howe sailed from New York in July 1777 with about 15,000 men and, after a long voyage round to Chesapeake Bay, landed at Head of Elk on 25 August. At Brandywine Creek on 11 September he outflanked Washington’s army and drove it back; the young Marquis de Lafayette, a French volunteer, was wounded there. A night attack on Anthony Wayne’s camp at Paoli followed on 20–21 September. Congress fled to Lancaster and then to York, and Cornwallis marched into Philadelphia, the American capital, on 26 September 1777."
      - "Washington attacked the main British camp at Germantown on 4 October; the plan was too complicated for his army, and in the fog the attack failed. American forts on the Delaware below the city held out into November, when the British cleared the river and could supply Philadelphia by sea. The city spent the winter under British occupation, with many Loyalists among its people."
      - "The Continental Army spent the winter of 1777–1778 at Valley Forge, some 30 km to the north-west, from 19 December to 19 June. Short of food, clothing and shelter, between about 1,700 and 2,000 of its roughly 12,000 soldiers died there, most of typhus, typhoid and dysentery. The Prussian officer Friedrich Wilhelm von Steuben drilled the army into a more disciplined force. Short of men, Rhode Island in 1778 enlisted enslaved men who were promised their freedom, and Black and Native soldiers served in many regiments. Howe had asked to be recalled, and in May 1778 Henry Clinton took over the command."
    facts:
      - [Battle of Brandywine, "11 September 1777"]
      - [Philadelphia occupied, "26 September 1777 – 18 June 1778"]
      - [Battle of Germantown, "4 October 1777"]
      - [Deaths at Valley Forge, "about 1,700–2,000, mostly from disease"]
