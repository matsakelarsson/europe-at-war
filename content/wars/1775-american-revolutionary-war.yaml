  - title: Independence, New York and Trenton
    date: July 1776 – January 1777
    when: "1776-07-04"
    borders: "1776-11-16"
    countries: [us, gb, de]
    body:
      - "Thomas Paine’s pamphlet Common Sense, published in January 1776, argued for independence, and colony after colony instructed its delegates to vote for it. Congress voted to separate from Britain on 2 July and adopted the Declaration of Independence, drafted by Thomas Jefferson, on 4 July 1776. It accused the king of stirring up slave risings and Native attacks on the frontier; a passage in Jefferson’s draft condemning the slave trade was struck out to satisfy delegates from South Carolina and Georgia."
      - "Britain sent the largest expeditionary force it had yet sent overseas, some 32,000 soldiers, about 9,000 of them German troops hired from Hesse-Kassel and other princes, under General Howe and his brother Admiral Richard Howe. Landing on Staten Island in July, Howe crossed to Long Island and outflanked Washington’s army on 27 August, capturing about 1,000 men; Washington escaped across the East River on the night of 29–30 August. The British landed on Manhattan at Kip’s Bay on 15 September, took the city, fought at Harlem Heights and White Plains, and on 16 November stormed Fort Washington, taking about 2,800 prisoners. Thousands of captured Americans died in the prison ships and makeshift prisons of New York; more Americans died in British captivity during the war than in battle."
      - "Washington retreated across New Jersey with an army that shrank to a few thousand men as enlistments ran out. On the night of 25–26 December 1776 he recrossed the icy Delaware and surprised the Hessian garrison of Trenton, taking about 900 prisoners, and on 3 January 1777 he beat a British force at Princeton before going into winter quarters at Morristown. New York remained the British headquarters until November 1783, and a refuge for Loyalists and for enslaved people who escaped to British lines."
    facts:
      - [Declaration of Independence, "4 July 1776"]
      - [Battle of Long Island, "27 August 1776"]
      - [Fall of Fort Washington, "16 November 1776, about 2,800 prisoners"]
      - [Battles of Trenton and Princeton, "26 December 1776 and 3 January 1777"]
