  - title: The French alliance and Monmouth
    date: February 1778 – July 1779
    when: "1778-06-28"
    borders: "1778-06-28"
    countries: [us, fr, gb]
    body:
      - "In Paris Benjamin Franklin and his fellow commissioners had obtained secret French loans and arms. After Saratoga, France signed a treaty of commerce and a treaty of alliance with the United States on 6 February 1778, and by June France and Britain were at war. Spain joined France in 1779 to win back Gibraltar, Minorca and Florida, though it did not ally itself with the United States, and Britain went to war with the Dutch Republic in December 1780. The war became a world war, fought at sea, in the Caribbean, at Gibraltar and in India, and Britain had to spread its forces thin. A British peace commission offered Congress everything short of independence and was turned away."
      - "Ordered to send troops to the Caribbean, Clinton evacuated Philadelphia on 18 June 1778 and marched his army of about 10,000 men across New Jersey towards New York. Washington’s army, leaving Valley Forge, caught up with it at Monmouth Court House on 28 June, on one of the hottest days of the year. Charles Lee’s first attack ended in retreat, Washington rallied the army, and the battle ended at nightfall with both sides holding their ground; the British went on to Sandy Hook and New York."
      - "A French fleet of twelve ships of the line under the Comte d’Estaing arrived off New York in July but could not cross the bar into the harbour. In August it joined John Sullivan’s attack on the British garrison of Newport, Rhode Island, but a storm scattered the fleets and the French sailed for Boston. On 29 August, in the Battle of Rhode Island, the 1st Rhode Island Regiment, many of its soldiers formerly enslaved Black and Native men, helped hold off the British as Sullivan withdrew. In the north the war settled into a standoff around New York, broken by raids such as Anthony Wayne’s storming of Stony Point on the Hudson on 16 July 1779."
    facts:
      - [Treaty of Alliance with France, "6 February 1778"]
      - [Battle of Monmouth, "28 June 1778"]
      - [Battle of Rhode Island, "29 August 1778"]
      - [Spain at war with Britain, "June 1779"]
