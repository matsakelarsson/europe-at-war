        polygon: [[-74.260, 40.500], [-74.050, 40.560], [-73.940, 40.570], [-73.760, 40.590], [-73.710, 40.750], [-73.800, 40.800], [-73.930, 40.880], [-74.010, 40.760], [-74.070, 40.650], [-74.250, 40.640]]
  - title: Saratoga
    date: June – October 1777
    when: "1777-10-17"
    borders: "1777-10-17"
    countries: [us, gb, ca, de]
    body:
      - "For 1777 the British planned to cut New England off from the other states. John Burgoyne would come south from Canada by Lake Champlain and the Hudson with some 7,000 British and German troops, with Canadiens, Loyalists and several hundred Native allies, while Barry St. Leger came east along the Mohawk valley; Howe, however, chose to take Philadelphia instead of moving up the Hudson to meet them. The Americans abandoned Fort Ticonderoga on 6 July without a fight."
      - "The war divided the Haudenosaunee Confederacy. In early 1777, after an epidemic killed several of its leaders, the council fire at Onondaga was covered and each nation was left to choose its course. The Mohawk under Joseph Brant (Thayendanegea) and the Seneca under Sayenqueraghta and Cornplanter joined St. Leger’s siege of Fort Stanwix, while the Oneida and Tuscarora sided with the Americans. On 6 August Loyalists and Seneca and Mohawk warriors ambushed Nicholas Herkimer’s 800 Tryon County militia and 60 to 100 Oneida allies at Oriskany; both sides lost heavily, the Seneca among them, and Herkimer died of his wounds. It was the beginning of a war among the nations of the Confederacy themselves. St. Leger’s Native allies left as Arnold approached with a relief force, and he lifted the siege on 22 August."
      - "On 16 August John Stark’s New Hampshire and Vermont militia destroyed a German detachment sent to seize supplies at Bennington. Burgoyne pressed on across the Hudson and was stopped by Horatio Gates’s army, with Daniel Morgan’s riflemen and Benedict Arnold, at Freeman’s Farm on 19 September and Bemis Heights on 7 October. Surrounded at Saratoga, he surrendered on 17 October 1777 with about 5,900 men. The victory persuaded France that the Americans could win and that an alliance was worth the risk."
    facts:
      - [Battle of Oriskany, "6 August 1777"]
      - [Battle of Bennington, "16 August 1777"]
      - [Battles of Saratoga, "19 September and 7 October 1777"]
      - [Burgoyne’s surrender, "17 October 1777, about 5,900 men"]
