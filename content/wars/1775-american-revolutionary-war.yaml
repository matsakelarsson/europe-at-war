        polygon: [[-71.075, 42.390], [-71.055, 42.380], [-71.045, 42.360], [-71.055, 42.345], [-71.075, 42.340], [-71.080, 42.360], [-71.072, 42.372]]
  - title: The invasion of Canada
    date: August 1775 – October 1776
    when: "1775-12-31"
    borders: "1775-12-31"
    countries: [ca, us, gb]
    body:
      - "Congress hoped that the Canadiens of the Province of Quebec, conquered by Britain only in 1760, would join the rebellion, and wanted to forestall a British attack from the north. But the Quebec Act of 1774 had guaranteed the Catholic Church and French civil law, and the clergy and seigneurs stood by Britain; most habitants stayed neutral, and only a few hundred enlisted with the Americans. Richard Montgomery led an army of New York and New England troops down Lake Champlain and besieged Fort Saint-Jean on the Richelieu from September until it surrendered on 2 November 1775. He entered Montreal on 13 November, while the governor, Guy Carleton, escaped to Quebec."
      - "Benedict Arnold led about 1,100 volunteers from Cambridge up the Kennebec and Dead rivers and down the Chaudière, through wilderness and early snow; hunger and desertion cut his force to about 600 by the time it reached the St. Lawrence in November. Montgomery joined him before Quebec in December. In a snowstorm on 31 December 1775 they assaulted the fortified city: Montgomery was killed in the first volley, Arnold wounded, and Daniel Morgan and some 400 men captured by Carleton’s garrison of British regulars, sailors and British and Canadien militia."
      - "The Americans kept up a thin blockade through the winter while smallpox spread in their camp. When a British fleet arrived in May 1776 with troops, among them German regiments from Brunswick, they fell back up the St. Lawrence, were beaten at Trois-Rivières on 8 June and withdrew to Lake Champlain. Arnold’s hastily built fleet was destroyed at Valcour Island on 11 October 1776, but it had delayed Carleton until it was too late in the year to march on Albany. Canada stayed British for the rest of the war and became a refuge for Loyalists."
    facts:
      - [Fort Saint-Jean surrenders, "2 November 1775"]
      - [Montreal occupied, "13 November 1775"]
      - [Assault on Quebec, "31 December 1775"]
      - [Battle of Valcour Island, "11 October 1776"]
