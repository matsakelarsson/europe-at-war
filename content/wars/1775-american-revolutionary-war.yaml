  - title: Yorktown
    date: May – October 1781
    when: "1781-10-19"
    borders: "1781-10-19"
    countries: [us, fr, gb, ht, cu]
    body:
      - "Cornwallis entered Virginia in May 1781 and joined the troops of Benedict Arnold, who had changed sides in 1780 after plotting to hand over West Point and had raided Richmond in January. A small American army under Lafayette shadowed them. Ordered to hold a deep-water port for the navy, Cornwallis fortified Yorktown and Gloucester on the York River in August. Thousands of enslaved people from the Virginia plantations had joined his army."
      - "A French army of about 5,500 men under the Comte de Rochambeau had been at Newport since July 1780. When word came that Admiral de Grasse would bring the French West Indies fleet to the Chesapeake, Washington and Rochambeau left the lines around New York on 19 August and marched south, some 700 km, leaving Clinton believing that New York was their target. De Grasse sailed from Cap-Français in Saint-Domingue with 28 ships of the line and some 3,200 troops, and with money raised in Havana to pay the armies. On 5 September his fleet fought Admiral Thomas Graves’s British fleet off the Virginia Capes; no ship was sunk, though the damaged British HMS Terrible was later scuttled, and Graves returned to New York and left Cornwallis cut off by sea."
      - "Some 19,000 American and French troops besieged about 9,000 British and German soldiers at Yorktown from 28 September. On 14 October French and American columns, the Americans led by Alexander Hamilton, stormed the two redoubts on the British left; an attempt to escape across the river failed in a storm. As food ran short Cornwallis drove the Black refugees out of his lines, many of them sick with smallpox, and many were re-enslaved. On 19 October 1781 his army, some 7,000 to 8,000 men, surrendered. James Armistead, an enslaved man who had spied in Cornwallis’s camp for Lafayette, later won his freedom for it. When the news reached London, Lord North’s government fell in March 1782."
    facts:
      - [Battle of the Chesapeake, "5 September 1781"]
      - [Siege of Yorktown, "28 September – 19 October 1781"]
      - [Allied army, "about 19,000 American and French troops"]
      - [Surrendered, "about 7,000–8,000 British and German soldiers"]
