notes:
  - "Dates are those given in the sources cited, mostly from Thai chronicles and the Burmese chronicles. The Burmese strength is given as 35,000 in the main army, with a diversionary force from Chiang Saen against Chiang Mai."
  - "Names: Athi Wungyi (อะแซหวุ่นกี้) is the Thai rendering of the title of Maha Thiha Thura, the Burmese minister and general. The Mon leader Binnya Sein, a nephew of the last Hanthawaddy king, fought for Siam and is known in Thai as Phraya Cheng."
