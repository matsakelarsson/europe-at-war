id: burmese-siamese-war-1775
name: Burmese–Siamese War (1775–1776)
start: "1775-10"
end: "1776-08"
tier: C
summary: "The largest Burmese invasion of Taksin’s Siam, known in Thailand as the war of Athi Wungyi, the Thai name for the Burmese commander Maha Thiha Thura. In 1774 a Mon rising against Burmese rule at Martaban failed and thousands of Mon fled to Siam; in January 1775 Taksin’s army, with the Lan Na lords Kawila of Lampang and Phaya Chaban, who had turned against the Burmese, took Chiang Mai, and Lan Na became a Siamese vassal. A Burmese force of 8,000 that followed the Mon through the Three Pagodas Pass was surrounded at Bangkaeo near Ratchaburi and surrendered on 31 March 1775. In October 1775 Maha Thiha Thura, victor over the Qing at Maymyo, crossed the Mae Lamao pass with about 35,000 men, took Sukhothai and in December besieged Phitsanulok, defended by the brothers Chaophraya Chakri (the later King Rama I) and Chaophraya Surasi. Taksin came north with a river fleet but could not break through; when the Burmese cut his supply lines he fell back from Pakphing to Phichit, and on 15 March 1776 the defenders broke out of Phitsanulok, which the Burmese burned. King Hsinbyushin’s death in June 1776 made Maha Thiha Thura hurry home, and the remaining Burmese troops withdrew in disorder; by September they had left Siam. The war left the northern cities depopulated, but Burma did not regain Lan Na."
