  - title: Wadgaon and Goddard’s march
    date: 1778–1779
    when: "1778-11"
    borders: "1779-01-16"
    countries: [in]
    body:
      - The war revived when a French envoy, the Chevalier de Saint-Lubin, was received at Pune in 1777 and Britain and France went to war in 1778. Bombay again took up Raghunathrao’s cause, and in November 1778 an army of about 3,900 men under Colonel Egerton, with Raghunathrao and two civilian commissioners, set out for Pune. It climbed the Bhor Ghat slowly, under constant attack, and reached Talegaon on 9 January 1779 to find the town burnt and the Maratha armies of Mahadji Scindia and Tukoji Holkar gathering around it.
      - The commissioners ordered a retreat. The army fell back by night, was surrounded at Wadgaon, and on 16 January 1779 signed a convention that gave up all lands Bombay had won since 1773 and handed Raghunathrao over to Scindia. Warren Hastings, the Governor-General, repudiated it, since Bombay’s officers had no authority to sign. He had already sent an army of about 6,000 men from Bengal across central India under Colonel Thomas Goddard. Marching from Kalpi through Bundelkhand, Bhopal and Burhanpur, it reached Surat in February 1779, too late to save the Bombay army but in time to restart the war.
    facts:
      - [Bombay army reaches Talegaon, "9 January 1779"]
      - [Convention of Wadgaon, "16 January 1779"]
      - [Goddard reaches Surat, "February 1779"]
