steps:
  - title: Raghunathrao and the Treaty of Surat
    date: 1773–1776
    when: "1775-03-06"
    borders: "1776-03-01"
    countries: [in]
    body:
      - In August 1773 the young Peshwa Narayanrao was murdered by palace guards in Pune (Poona), and suspicion fell on his uncle Raghunathrao, who took the office. A council of Maratha ministers and chiefs led by Nana Phadnavis, the Barbhai, opposed him, and when Narayanrao’s widow bore a son in April 1774 they proclaimed the child Peshwa as Madhavrao II. Raghunathrao, losing support, turned to the British. The Bombay government had long wanted the island of Salsette and the port of Bassein to secure Bombay, and in December 1774 it seized the fort of Thane on Salsette. On 6 March 1775 it signed the Treaty of Surat with Raghunathrao, promising troops to restore him in return for Salsette, Bassein and revenues in Gujarat.
      - A small Company force under Colonel Thomas Keating joined Raghunathrao’s army in Gujarat, and on 18 May 1775 met the regency’s army under Haripant Phadke at Adas, near Anand. The fighting was costly for both sides; British accounts claim a victory, Maratha ones a check to the invaders, and the campaign did not reach Pune. The Supreme Council in Calcutta, which under the new Regulating Act now oversaw Bombay, condemned the war, and its envoy, Colonel John Upton, made peace with the regency in the Treaty of Purandar on 1 March 1776. The Company dropped Raghunathrao but kept Salsette.
    facts:
      - [Thane fort taken, "December 1774"]
      - [Treaty of Surat, "6 March 1775"]
      - [Battle of Adas, "18 May 1775, indecisive"]
      - [Treaty of Purandar, "1 March 1776"]
