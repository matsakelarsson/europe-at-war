  - title: Gwalior, Bassein and the Treaty of Salbai
    date: 1780–1782
    when: "1780-02-15"
    borders: "1782-05-17"
    countries: [in]
    body:
      - Goddard took Ahmedabad by storm on 15 February 1780 and campaigned in Gujarat with the support of the Gaekwad. In the north Hastings sent a force under Captain William Popham into Scindia’s country, and with the help of the Rana of Gohad it took the fortress of Gwalior by a night escalade on 3–4 August 1780. On 11 December Goddard captured Bassein. In 1781 a Bengal force under Colonel Camac defeated Scindia near Sipri, but when Goddard advanced up the Bhor Ghat towards Pune in April 1781 the Maratha armies under Haripant Phadke, Parshurambhau and Holkar drove him back to the coast with heavy losses.
      - By then the Company was also at war with Hyder Ali of Mysore, who had overrun the Carnatic, and with France. Hastings looked for a way out through Mahadji Scindia, the most powerful of the Maratha chiefs. The Treaty of Salbai, agreed with Scindia on 17 May 1782 and ratified by Nana Phadnavis for the Peshwa in 1783, restored the conquests on both sides except Salsette and the islands near Bombay, which the Company kept. Bassein and the Gujarat lands went back to the Marathas, Broach passed to Scindia, Raghunathrao was given a pension, and Madhavrao II was recognised as Peshwa. The peace made Scindia the leading power in Hindustan for the next twenty years.
    facts:
      - [Ahmedabad stormed, "15 February 1780"]
      - [Gwalior taken by escalade, "3–4 August 1780"]
      - [Bassein taken, "11 December 1780"]
      - [Goddard repulsed at the Bhor Ghat, "April 1781"]
      - [Treaty of Salbai, "17 May 1782"]
