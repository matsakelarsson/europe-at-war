id: first-anglo-maratha-war
name: First Anglo-Maratha War
start: "1775-03-06"
end: "1782-05-17"
tier: B
summary: "The first war between the British East India Company and the Maratha state. After the murder of the Peshwa Narayanrao in 1773, the Company’s Bombay government backed his uncle Raghunathrao against the regency council of Nana Phadnavis, which ruled in the name of the infant Peshwa Madhavrao II. Bombay’s first intervention was disowned by Calcutta in the Treaty of Purandar (1776), and its second ended in the surrender of its army at Wadgaon in January 1779. Warren Hastings then sent an army across India under Thomas Goddard, which took Ahmedabad and Bassein, while another force stormed Gwalior. Neither side could win, and with Hyder Ali of Mysore at war with the Company, Mahadji Scindia mediated the Treaty of Salbai (1782). The Company kept Salsette, gave up Raghunathrao and returned its other conquests, and peace held for twenty years."
countries: [in]
sides:
  - id: eic
    name: East India Company and Raghunathrao
    polities: [british-india]
    ink: red
    moves: Company and allied moves
    success: Company success
  - id: mar
    name: Maratha regency, Scindia and Holkar
    polities: [marathas, gwalior-state, indore-state]
    ink: orange
    moves: Maratha moves
    success: Maratha success
notes:
  - The Company’s armies were mostly Indian sepoys under British officers, with some British Army regiments.
  - The Company’s three presidencies (Bengal, Madras and Bombay) still largely made their own policy. The Regulating Act of 1773 put Bombay under the Governor-General in Calcutta, and the quarrels between them shaped the war.
  - Hyder Ali’s war with the Company from 1780 is told in the Anglo-Mysore Wars.
