id: ottoman-persian-war-1775
name: Ottoman–Persian War of 1775–1779
start: "1775-04-06"
end: "1779"
tier: C
summary: "A war between Zand Iran under Karim Khan and the Ottoman Empire, whose province of Iraq was ruled by Mamluk pashas in Baghdad. Karim Khan’s grievances were the pasha’s treatment of Iranian pilgrims to the Shia shrines of Najaf and Karbala, his interference in the Kurdish emirate of Baban, and the trade of Basra, which had drawn the East India Company away from Iran’s port of Bushehr. After a Zand force was beaten in Kurdistan in 1774, Karim Khan’s brother Sadeq Khan crossed the Shatt al-Arab with about 30,000 men and besieged Basra from 6 April 1775. The garrison under Sulayman Agha held out for a year, helped for a time by an Omani fleet, until hunger forced it to surrender in April 1776 (on 16 or 20 April, by different accounts). Fighting went on in Kurdistan, where an Ottoman–Baban army defeated the Zands at Marivan in 1777. Basra stayed under Zand rule until Karim Khan’s death in 1779, when its garrison withdrew and Sulayman Agha, released from Shiraz, went on to rule Baghdad as Büyük Süleyman Pasha. The borders of the Treaty of Zuhab (1639) were left unchanged; Basra never fully recovered."
countries: [iq, ir]
