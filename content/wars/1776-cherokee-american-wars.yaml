steps:
  - title: The war of 1776 and the move to Chickamauga
    date: 1775–1777
    when: "1776-07-20"
    borders: "1776-07-20"
    countries: [us]
    body:
      - "The Cherokee had lost land after their war with the British in 1758–1761 and by treaties in 1768 and 1770, and settlers had moved beyond the treaty lines onto the Watauga and Nolichucky rivers. In March 1775, at Sycamore Shoals, the land company of Richard Henderson bought most of Kentucky and the Cumberland valley from older Cherokee leaders. Dragging Canoe (Tsiyu Gansini), son of Attakullakulla, opposed the sale and is said to have warned that the land would be “dark and bloody”. When the Revolution began, British agents supplied the Cherokee with ammunition, and in May 1776 a delegation of northern nations led by the Shawnee brought war belts to Chota, the Overhill capital. Many young men took them up against the advice of older leaders such as Attakullakulla and Oconostota."
      - "In July 1776 Cherokee war parties, some with Loyalists, attacked settlements from Virginia to Georgia. On 20 July Dragging Canoe was wounded at Island Flats on the Holston, and the next day Abraham of Chilhowee began a siege of Fort Watauga that lasted about two weeks. The states answered together: Griffith Rutherford led some 2,400 North Carolina militia, with Catawba warriors, over the Blue Ridge, Andrew Williamson and Andrew Pickens attacked the Lower Towns from South Carolina, Georgia sent its militia, and William Christian brought Virginians and North Carolinians to the Overhill country. They burned more than fifty towns with their houses, crops and stores, and many families fled into the mountains or to the Muscogee and faced a hungry winter."
      - "The older leaders made peace. By the treaties of DeWitt’s Corner (20 May 1777) with South Carolina and Georgia and of Fort Henry, at the Long Island of the Holston (20 July 1777), with Virginia and North Carolina, they gave up nearly all their land in South Carolina and the land of the Watauga and Nolichucky settlements. Dragging Canoe and those who refused to accept the cessions moved down the Tennessee River and built new towns on Chickamauga Creek, near present-day Chattanooga."
    facts:
      - [Henderson’s purchase at Sycamore Shoals, "17 March 1775"]
      - [Battle of Island Flats, "20 July 1776"]
      - [Cherokee towns burned in 1776, "more than fifty"]
      - [Treaties of DeWitt’s Corner and Fort Henry, "May and July 1777"]
