  - title: Dragging Canoe’s war
    date: 1779–1788
    when: "1781-04-02"
    borders: "1781-04-02"
    countries: [us]
    body:
      - "The Chickamauga towns took in Cherokee from other towns, Loyalists, Muscogee, Shawnee and some people who had escaped from slavery, and with British supplies they raided the frontier. In April 1779 Evan Shelby came down the Tennessee by canoe with about 1,000 militia and burned eleven towns while most of the warriors were away. Dragging Canoe moved further downriver and built the Five Lower Towns below Lookout Mountain, among them Running Water, his headquarters, and Nickajack. The war spread to the Cumberland, where James Robertson and John Donelson founded Fort Nashborough (Nashville) in 1779–1780 on hunting grounds claimed by the Cherokee, Chickasaw and Shawnee; on 2 April 1781 Dragging Canoe’s warriors attacked it in the Battle of the Bluff, and the fort held. John Sevier’s militia beat a Cherokee war party at Boyd’s Creek in December 1780 and then burned the Overhill towns, Chota among them, although most of their people wanted peace."
      - "The peace of 1783 did not end the war. Dragging Canoe now traded through Spanish Pensacola and Mobile and allied with Alexander McGillivray’s Muscogee. At Hopewell on 28 November 1785 the United States recognised the Cherokee boundaries, but North Carolina’s settlers and the breakaway State of Franklin (1784–1788) forced further cessions and went on settling Cherokee land. In 1788, after Cherokee killed the Kirk family, militia under John Sevier’s command burned towns; at Chilhowee in June men under James Hubbard brought Old Tassel (Utsidsata), the leading Overhill advocate of peace, and other chiefs to talk under a flag of truce, and John Kirk, a son of the murdered family, killed them. Many Overhill Cherokee then joined the war, now led by John Watts, Old Tassel’s nephew, Doublehead and Bloody Fellow beside Dragging Canoe."
    facts:
      - [Shelby burns the Chickamauga towns, "April 1779"]
      - [Battle of the Bluff (Nashville), "2 April 1781"]
      - [Treaty of Hopewell, "28 November 1785"]
      - [Killing of Old Tassel, "June 1788"]
