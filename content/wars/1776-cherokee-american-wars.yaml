id: cherokee-american-wars
name: Cherokee–American wars
start: "1776-07"
end: "1794-11-07"
tier: B
summary: "Nearly twenty years of war between the Cherokee and the American frontier settlements of Virginia, the Carolinas, Georgia and Tennessee. Settlers had pushed onto Cherokee land beyond the Appalachians, and in 1775 a land company bought Kentucky and much of the Cumberland valley from some Cherokee leaders. In the summer of 1776, encouraged by the British and by the Shawnee, Cherokee warriors attacked the frontier; militia from four states answered by burning more than fifty Cherokee towns, and in 1777 the older leaders made peace and gave up land. Dragging Canoe (Tsiyu Gansini) and those who refused to accept the cessions moved down the Tennessee River and founded new towns, first on Chickamauga Creek and later below Lookout Mountain; the Americans called them the Chickamauga, and later the Lower Cherokee. With British and then Spanish supplies, and with Muscogee, Shawnee and Loyalist allies, they fought on after the Revolution against the settlements on the Holston and the Cumberland. American raids repeatedly destroyed their towns and those of the Cherokee who had made peace, and in 1788 militiamen killed the peace chief Old Tassel under a flag of truce. After Dragging Canoe’s death in 1792 John Watts led the war, until the destruction of Nickajack and Running Water and the defeat of the Western Confederacy in the north led him to make peace at Tellico Blockhouse on 7 November 1794."
countries: [us]
sides:
  - id: ch
    name: Cherokee (from 1777 chiefly the Chickamauga or Lower Cherokee of Dragging Canoe and John Watts), with Muscogee, Shawnee and Loyalist allies
    polities: [cherokee]
    ink: green
