  - title: John Watts and the peace of Tellico
    date: 1791 – November 1794
    when: "1794-09-13"
    borders: "1794-11-07"
    countries: [us]
    body:
      - "By the Treaty of Holston of 2 July 1791 the Cherokee ceded more land, including the site of Knoxville, to the United States in return for a guarantee of the rest and a yearly payment; Lower Cherokee leaders signed too, but the fighting went on. Dragging Canoe, back from a mission to win over the Muscogee, Choctaw and Chickasaw, died on 1 March 1792 after a night of celebration (at Stecoyee or at Running Water, where he was buried; accounts differ), and John Watts took his place. On 30 September 1792 Watts led several hundred Cherokee, Muscogee and Shawnee warriors against Buchanan’s Station near Nashville; the station held and Watts was badly wounded. On 25 September 1793 a force under Watts and Doublehead attacked Cavett’s Station near Knoxville, and Doublehead’s men killed the family after they had surrendered. John Sevier pursued them to Etowah (Hightower) and defeated them on 17 October 1793, then burned Cherokee towns."
      - "In September 1794 James Ore led some 550 Cumberland militia, against orders from the federal government, down the Tennessee guided by a former captive, Joseph Brown. On 13 September they attacked Nickajack and Running Water, killing many of the people there and burning both towns; most of their inhabitants were away at a ball game at Willstown, which kept the toll lower than it might have been. With their towns destroyed, Spanish help fading and the Western Confederacy beaten at Fallen Timbers in August, Watts and the Lower Cherokee made peace with the United States at Tellico Blockhouse on 7 November 1794, without new cessions. The Muscogee fought on into 1795. The Cherokee Nation rebuilt in the following decades, but lost more land by treaty and was forced west on the Trail of Tears in 1838–1839."
    facts:
      - [Treaty of Holston, "2 July 1791"]
      - [Death of Dragging Canoe, "1 March 1792"]
      - [Destruction of Nickajack and Running Water, "13 September 1794"]
      - [Peace of Tellico Blockhouse, "7 November 1794"]
