    success: Cherokee success
  - id: us
    name: Virginia, the Carolinas, Georgia, the State of Franklin and the United States (frontier militia)
    polities: [united-states]
    ink: blue
    moves: American moves
    success: American success
notes:
  - The name Chickamauga for the followers of Dragging Canoe was given by the Americans, after the creek where they first settled; the Cherokee themselves spoke of Lower Towns. Many Cherokee, especially in the Overhill towns, tried to keep the peace through most of the war and suffered from the raids of both sides.
  - The war in 1776 was part of the American Revolutionary War, and the Cherokee who fought on in the 1780s and 1790s were allied with the Western Confederacy of the Northwest Indian War. Numbers of dead on both sides are not known with any precision.
