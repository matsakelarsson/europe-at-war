id: torodbe-revolution
name: Torodbe revolution in Futa Toro
start: "1776"
end: "1797"
tier: C
summary: "The Islamic revolution that overthrew the Denianke kings of Futa Toro, in the middle Senegal valley, set up an imamate ruled by elected clerics of the Torodbe class, and carried its wars to the neighbouring Moorish emirates and Wolof kingdoms. The Denianke had lost the support of the farmers of the valley by failing to protect them from raids by the nomads north of the river. From about 1769 the cleric Sulayman Bal led a movement against them, and in 1776 the Torodbe drove them from power; Sulayman Bal was killed in battle that year, and the Torodbe chose as first almami (imam) Abdul Kader Kan, a teacher and judge who had studied in Cayor and Mauritania. Ruling from Thilogne, he defeated the Brakna Moors, fought the last Denianke satigi, Sule Bubu Gayssiri, in western Futa until Sule’s death, defeated the buurba of Jolof in 1785 and, allied with the Brakna, defeated the Trarza near Dagana in 1786, killing their emir Ali Kouri. The new state banned the slave trade on its stretch of the river, and in 1785 the French at Saint-Louis agreed to stop buying Muslim slaves and to pay customs to Futa. Cayor and Waalo at first accepted Abdul Kader’s authority, but Amari Ngoone Ndella, damel of Cayor from 1790, broke with him and crushed a rising of Cayor’s clerics, selling many into slavery. In 1796 Abdul Kader, allied with Jolof, invaded Cayor with what was said to be the largest army ever seen in Senegambia; the damel poisoned the wells of his eastern provinces, and at Bungoy (Bunxoy) the exhausted Futa army was routed and Abdul Kader captured. Amari Ngoone treated him with honour and sent him home once Futa had chosen a new almami. The revolution’s expansion ended there; Abdul Kader was killed in 1806 in a war with Bundu and Kaarta."
