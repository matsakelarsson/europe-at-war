notes:
  - "The sources disagree on dates: some give the war as December 1778 – March 1779, others date the fall of Vientiane to 28 September 1779 after a siege begun in April. Numbers are those of Thai chronicles."
  - "The Emerald Buddha, taken from Chiang Mai to Luang Prabang in 1552 and to Vientiane in 1564, stood in a shrine beside Wat Arun in Thonburi and from 1784 in the Temple of the Emerald Buddha in Bangkok, where it remains. Lao historians remember the war as the beginning of Siamese domination; Thai histories as the extension of Siam’s protection over the Lao kingdoms. The base map keeps the three Lao kingdoms as their own polities, as Siamese vassals."
