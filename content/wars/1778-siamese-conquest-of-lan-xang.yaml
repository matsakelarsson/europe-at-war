id: siamese-conquest-of-lan-xang
name: Siamese conquest of Vientiane and Champasak (Lao–Siamese War)
start: "1778-12"
end: "1779-09-28"
tier: C
summary: "The campaign in which Taksin’s Siam brought the three Lao kingdoms that had succeeded Lan Xang under its overlordship. King Ong Boun of Vientiane had invited the Burmese against his rival Luang Prabang in 1764–1765 and was suspected of siding with Burma; in 1777–1778 his troops killed Phra Vo, a Lao noble who had broken away and put himself under Siamese protection. In December 1778 Chaophraya Chakri (the later King Rama I) marched from Nakhon Ratchasima with about 20,000 men and beat the Lao at Nong Bua Lamphu, while his brother Chaophraya Surasi raised some 10,000 Cambodian troops at Oudong, took a fleet up the Mekong, dug a channel round the Liphi falls and took Champasak, whose king Sayakumane was captured and sent to Thonburi. Nakhon Phanom fell in March 1779. King Surinyavong of Luang Prabang, Vientiane’s enemy, joined the Siamese. Chakri and Surasi besieged Vientiane from April 1779; Ong Boun escaped by boat to Khamkeut, and the city fell after a siege of several months, on 28 September 1779 by one account. The Siamese carried off the Emerald Buddha and the Phra Bang image and deported tens of thousands of Lao to central Siam. Vientiane, Luang Prabang and Champasak remained Siamese tributaries until the French took most of Laos in 1893."
