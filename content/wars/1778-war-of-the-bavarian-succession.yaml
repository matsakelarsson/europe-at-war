id: war-of-the-bavarian-succession
name: War of the Bavarian Succession
start: "1778-07-03"
end: "1779-05-13"
tier: B
summary: A war between Austria and Prussia, allied with Saxony, over Joseph II’s attempt to acquire much of Bavaria when its ruling line died out in 1777. The armies faced each other in Bohemia without fighting a major battle, and the Peace of Teschen in 1779 left Austria only the Innviertel.
countries: [at, de, cz, pl]
sides:
  - id: at
    name: Austria
    polities: [habsburg]
    ink: purple
    moves: Austrian moves
    success: Austrian success
  - id: pr
    name: Prussia and Saxony
    polities: [prussia, saxony]
    ink: slate
    moves: Prussian and Saxon moves
    success: Prussian success
notes:
  - Known in Prussia and Saxony as the Potato War (Kartoffelkrieg) and in Austria as the Plum Fuss (Zwetschgenrummel).
  - Places in Bohemia and Silesia are named in their German forms of the time; the markers give today’s names.
