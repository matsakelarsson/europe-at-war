notes:
  - "The islands taken during the war are shown as occupied areas in the steps; the base map changes hands only with the peace of 1783."
  - "The Spanish campaigns of Bernardo de Gálvez on the Gulf coast (Baton Rouge, Mobile and Pensacola) and in Central America belong to other stories; the war at sea and on land in North America is told in the American Revolutionary War."
  - "On 16 November 1776 the fort of Sint Eustatius returned the salute of the American warship Andrew Doria, the first salute by a foreign power to the flag of the United States."
