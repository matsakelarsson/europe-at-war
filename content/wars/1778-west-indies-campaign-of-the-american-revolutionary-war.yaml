  - title: Brimstone Hill and the Saintes
    date: "January 1782 – April 1783"
    when: "1782"
    borders: "1782-04-12"
    countries: [kn, ms, dm, fr, bs, gb, es]
    body:
      - "De Grasse returned to the Caribbean in late 1781, and with Bouillé’s troops he landed on St Kitts in January 1782. The British garrison and militia withdrew into the fortress of Brimstone Hill, which the French besieged from 19 January. Admiral Hood, outnumbered, lured de Grasse out of the anchorage off Basseterre on 25 January, slipped in behind him and beat off his attacks over the next two days, but he could not relieve the fortress, which surrendered on 13 February. Nevis and Montserrat fell the same month, and Hood slipped away by night."
      - "France and Spain now planned to join their fleets and land some 15,000 troops on Jamaica, Britain’s richest island. De Grasse sailed from Martinique on 8 April 1782 with 35 ships of the line and a large convoy to meet the Spanish at Saint-Domingue. Rodney, back from England with reinforcements, followed from Saint Lucia with 36. After skirmishes on 9 April, the fleets met off the Saintes, the islets between Dominica and Guadeloupe, on 12 April. A shift in the wind opened gaps in the French line, British ships broke through, and by evening four French ships of the line, de Grasse’s flagship Ville de Paris among them, had been taken and another destroyed; de Grasse himself was captured. The invasion of Jamaica was abandoned."
      - "In the Bahamas, a Spanish force of about 2,500 men from Havana under Juan Manuel Cagigal took Nassau in May 1782, and its governor surrendered the islands. In April 1783, after the war had ended, the Loyalist Andrew Deveaux led a small force from Florida that retook Nassau. In the Peace of Versailles of 3 September 1783 France kept Tobago and returned Dominica, Grenada, Saint Vincent, St Kitts, Nevis and Montserrat, and Britain returned Saint Lucia; Spain returned the Bahamas and kept Florida."
    facts:
      - [Siege of Brimstone Hill, "19 January – 13 February 1782"]
      - [Battle of the Saintes, "12 April 1782"]
      - [Spanish capture of Nassau, "May 1782"]
      - [Peace of Versailles, "3 September 1783"]
