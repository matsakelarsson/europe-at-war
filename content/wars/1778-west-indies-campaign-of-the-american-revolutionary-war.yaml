  - title: Sint Eustatius and Tobago
    date: "February – November 1781"
    when: "1781"
    borders: "1781-06-02"
    countries: [nl, tt, fr, gb, us]
    body:
      - "Sint Eustatius, a tiny Dutch free port, had grown rich by selling arms, powder and goods to the American rebels and the French. When Britain declared war on the Dutch Republic in December 1780, Rodney sailed from Saint Lucia with General John Vaughan and some 3,000 troops; on 3 February 1781 the Dutch governor, Johannes de Graaff, who had not been told of the war, surrendered after a token shot. Rodney seized some 130 merchant ships and goods worth an estimated £3 million, and deported many of the island’s merchants, treating its Jewish community with particular harshness. He spent months selling the booty, and his conduct was attacked in Parliament."
      - "A French fleet under the Comte de Grasse reached Martinique in April 1781 and fought Admiral Samuel Hood off Fort-Royal on 29 April. After a failed raid on Saint Lucia in May, French troops landed on Tobago on 24 May; Governor George Ferguson withdrew to the hills and capitulated on 2 June, before Rodney could relieve the island. De Grasse then sailed north with most of his fleet, and in September 1781 his victory off the Chesapeake trapped Cornwallis’s army at Yorktown. On 26 November Bouillé surprised the British garrison of Sint Eustatius and returned the island to the Dutch."
    facts:
      - [Sint Eustatius taken by Britain, "3 February 1781"]
      - [Battle of Fort Royal, "29 April 1781"]
      - [Tobago capitulates, "2 June 1781"]
      - [Sint Eustatius retaken by France, "26 November 1781"]
    markers:
