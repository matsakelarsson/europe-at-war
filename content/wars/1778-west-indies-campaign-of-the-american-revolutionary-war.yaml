id: west-indies-campaign-of-the-american-revolutionary-war
name: West Indies campaign of the American Revolutionary War
start: "1778-09-07"
end: "1783-04"
tier: B
summary: "The war for the sugar islands fought by Britain against France, Spain and the Dutch Republic after France allied itself with the United States in 1778. The French governor of Martinique, the Marquis de Bouillé, opened it by taking Dominica in September 1778; a British force answered by seizing Saint Lucia in December, beating off Admiral d’Estaing’s attempts to retake it. In 1779 the French took Saint Vincent, with the help of the Garifuna of Joseph Chatoyer, and Grenada, and d’Estaing mauled Admiral John Byron’s fleet off Grenada. When Britain went to war with the Dutch, Admiral George Rodney took Sint Eustatius, the free port that had supplied the American rebels, in February 1781 and plundered it; the French took Tobago that summer and retook Sint Eustatius in November, after Admiral de Grasse’s fleet had sailed north to seal the British defeat at Yorktown. In early 1782 de Grasse and Bouillé took St Kitts, Nevis and Montserrat, and France and Spain prepared to invade Jamaica, but on 12 April 1782 Rodney defeated and captured de Grasse at the Battle of the Saintes, and the invasion was abandoned. A Spanish force from Havana took Nassau in the Bahamas in May 1782; Loyalists retook it in April 1783. In the Peace of Versailles of 1783 France kept Tobago and the other islands were returned."
countries: [dm, lc, vc, gd, nl, tt, kn, ms, fr, bs, gb, es, us]
