steps:
  - title: Dominica, Saint Lucia, Saint Vincent and Grenada
    date: "September 1778 – July 1779"
    when: "1779"
    borders: "1779-07-06"
    countries: [dm, lc, vc, gd, fr, gb]
    body:
      - "France signed its alliance with the United States in February 1778, and news that the two kingdoms were at war reached the Caribbean in August. Bouillé, governor of Martinique, struck first: on 7 September 1778 some 1,800 French soldiers and 1,000 volunteers landed on Dominica, the island between Martinique and Guadeloupe, took the heights above Roseau, and Lieutenant Governor William Stuart surrendered the same day. In December a British force of about 5,000 men from New York under General James Grant, escorted by Admiral Samuel Barrington, landed on Saint Lucia at the Grand Cul de Sac on 13 December and took the Vigie peninsula. D’Estaing arrived from America with twelve ships of the line and 9,000 troops, but Barrington’s squadron beat off his attack in the bay on 15 December, and his assault on the Vigie on 18 December was repulsed with heavy losses. He sailed away on 29 December, and the French garrison surrendered."
      - "In June 1779 a small French force under Charles-Marie de Trolong du Rumain landed on Saint Vincent, where Joseph Chatoyer and the Garifuna, who had not forgotten the war of 1772–1773, joined it; Governor Valentine Morris surrendered on 18 June. D’Estaing then landed on Grenada, stormed the Hospital Hill above St George’s on the night of 3–4 July, and Governor Lord Macartney, refusing d’Estaing’s terms, surrendered unconditionally. On 6 July Byron’s fleet, arriving too late, attacked d’Estaing’s larger fleet off Grenada in disorder and was badly damaged; d’Estaing did not follow up his success."
    facts:
      - [Dominica taken, "7 September 1778"]
      - [Saint Lucia taken by Britain, "December 1778"]
      - [Saint Vincent surrenders, "18 June 1779"]
      - [Battle of Grenada, "6 July 1779"]
