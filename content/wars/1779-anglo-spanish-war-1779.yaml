id: anglo-spanish-war-1779
name: Anglo-Spanish War of 1779–1783
start: "1779-06-16"
end: "1783-09-03"
tier: B
summary: Spain’s war with Britain as France’s ally during the American War of Independence, fought above all to win back Gibraltar and Minorca. A Franco-Spanish force took Minorca in February 1782, but Gibraltar held out through a siege of three and a half years, the Great Siege, and remained British at the peace of 1783, while Spain kept Minorca and regained Florida.
countries: [gb, es, fr]
sides:
  - id: es
    name: Spain and France
    polities: [spain, france]
    ink: gold
    moves: Spanish and French moves
    success: Spanish and French success
  - id: gb
    name: Great Britain
    polities: [united-kingdom]
    ink: red
    moves: British moves
    success: British success
notes:
  - Spain fought as an ally of France, which had been at war with Britain since 1778, and not formally of the United States. The fighting in the Americas, where Spanish forces took West Florida, and the Franco-Spanish attempt to invade England in the summer of 1779 are only mentioned here.
  - The peace was signed at Versailles on 3 September 1783, the same day as the Treaty of Paris between Britain and the United States; together they are often called the Peace of Paris.
