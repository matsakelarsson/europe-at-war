  - title: Amalinde, Makhanda and Grahamstown
    date: 1817–1819
    when: "1819-04-22"
    borders: "1819-04-22"
    countries: [za, gb]
    body:
      - In 1817 Governor Lord Charles Somerset made an agreement with Ngqika, the young chief of the Rharhabe Xhosa, treating him as the ruler of all the Xhosa west of the Kei and holding him responsible for every cattle theft. Most chiefs did not accept Ngqika’s authority. His uncle Ndlambe, backed by the Gcaleka king Hintsa and by the prophet Makhanda (also called Nxele), who preached a Xhosa faith of his own that drew on Christian teaching, defeated Ngqika at the battle of Amalinde in 1818. Ngqika appealed to the colony, and in December a British force under Colonel Thomas Brereton raided Ndlambe’s people and took some 23,000 cattle.
      - Makhanda, telling his followers that the British bullets would turn to water, gathered an army of perhaps 6,000 to 10,000 men and, with Ndlambe’s son Mdushane in command, attacked Grahamstown in daylight on 22 April 1819. Lieutenant-Colonel Thomas Willshire had about 350 soldiers, and at the height of the battle a party of about 130 Khoikhoi hunters under Jan Boesak arrived to help. Musket and cannon fire broke the attack; about 1,000 Xhosa were killed and three of the garrison. The Xhosa remember the place as Egazini, “the place of blood”.
      - British and colonial columns then crossed the Fish and drove Ndlambe’s people back to the Kei. In August 1819 Makhanda gave himself up, hoping to end the suffering of his people; he was sent to Robben Island and drowned in 1820 trying to escape. In October 1819 Somerset made Ngqika give up the land between the Fish and the Keiskamma as a neutral belt to be kept empty of people, the “Ceded Territory”. It was soon settled by colonial farmers and, from 1829, by Khoikhoi at the Kat River settlement.
    facts:
