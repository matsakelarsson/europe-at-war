  - title: Mlanjeni’s War and the Kat River rising
    date: 1850–1853
    when: "1850-12-24"
    borders: "1851-06-01"
    countries: [za, gb]
    view:
      center: [26.95, -32.75]
      size: [150, 110]
    body:
      - The Ngqika resented the magistrates and the loss of their land, and a young prophet, Mlanjeni, promised that the colonists would be driven out if the people purified themselves. In October 1850 Smith declared Sandile deposed. On 24 December 1850 a column of about 650 men under Colonel George Mackinnon, sent to arrest him, was ambushed in the Boomah Pass and suffered about 40 casualties; on Christmas Day the Ngqika destroyed the military villages of Woburn, Auckland and Juanasburg in the Tyumie valley, killing the settled ex-soldiers. Smith himself was cut off in Fort Cox for some days.
      - The war drew in the colony’s own subjects. Many Khoikhoi of the Kat River settlement, embittered by land losses, a vagrancy law they feared and their treatment in earlier wars, rose under Hermanus Matroos and Willem Uithaalder and took Fort Armstrong; some men of the Cape Mounted Rifles deserted to them. Hermanus was killed attacking Fort Beaufort on 7 January 1851. Maqoma made the forested ravines of the Waterkloof, north of Fort Beaufort, a stronghold that British troops failed to take for more than a year. Reinforcements were sent from Britain; the troopship Birkenhead, carrying some of them, sank off the Cape in February 1852 with heavy loss of life.
      - General Sir George Cathcart, who replaced Smith in March 1852, fought a war of destruction, burning crops and homesteads and taking cattle. The Waterkloof was cleared in September 1852, and he carried the war across the Kei against Sarhili, Hintsa’s son and successor, whom he accused of helping the Ngqika. Starving, the Ngqika chiefs submitted in early 1853. It was the longest and most costly of the frontier wars. The Ngqika were expelled from the Amatola mountains, which were given to Mfengu and white settlers, and the Kat River settlement was broken up.
    facts:
      - [Boomah Pass, "24 December 1850"]
      - [Attack on Fort Beaufort, "7 January 1851"]
      - [Ngqika submission, "early 1853"]
