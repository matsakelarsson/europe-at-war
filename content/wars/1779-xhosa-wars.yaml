  - title: The cattle-killing
    date: 1856–1858
    when: "1856-04"
    borders: "1857-02-18"
    countries: [za]
    body:
      - In 1854 lungsickness, a cattle disease brought with imported cattle, began killing Xhosa herds. In April 1856 Nongqawuse, a girl of about fifteen living near the mouth of the Gxarha River in Gcalekaland, told her uncle Mhlakaza that strangers at a pool had told her the dead would rise, the colonists would be driven into the sea and new herds and harvests would come, if the people killed their cattle and destroyed their grain. Sarhili, the Gcaleka paramount, accepted the prophecy, and it spread among the Gcaleka and the Ngqika of British Kaffraria. Many chiefs and people refused, and the movement split communities between believers and unbelievers.
      - The killing went on through 1856, and the great day was finally set for 18 February 1857. When the sun rose and set as usual and the dead did not return, famine followed. More than 400,000 cattle had been killed; about 40,000 people died of hunger, and some 50,000 went into the colony looking for food and work. The Xhosa population of British Kaffraria fell from about 105,000 to fewer than 40,000; some counts give fewer than 27,000.
      - The governor, Sir George Grey, refused relief to those who would not sign labour contracts, blamed the movement on a plot of the chiefs, imprisoned many of them on Robben Island and confiscated large areas of their land, which were opened to white settlers. In 1858 colonial police drove Sarhili and the Gcaleka across the Mbhashe. Peires concluded that Grey encouraged the movement and then exploited its failure; the long Xhosa resistance was broken.
    facts:
      - [Nongqawuse’s prophecy, "April 1856"]
      - [Day of the prophecy, "18 February 1857"]
      - [Cattle killed, "over 400,000"]
      - [Deaths from hunger, "about 40,000"]
