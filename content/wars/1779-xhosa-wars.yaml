id: xhosa-wars
name: Xhosa Wars (Cape Frontier Wars)
start: "1779-12"
end: "1879"
tier: A
summary: "A century of intermittent war on the eastern frontier of the Cape Colony, between the Xhosa chiefdoms and the Dutch and then British colonial state, in which the Xhosa lost their independence and most of their land west of the Mbhashe. Nine wars are usually counted. In the first three (1779–1803) Boer commandos and Xhosa chiefdoms fought over the grazing of the Zuurveld, between the Bushmans and Great Fish rivers, and in 1799 Khoikhoi servants rose and joined the Xhosa. In 1811–1812 British troops drove the Xhosa of the Zuurveld across the Fish. In 1819 the prophet Makhanda led an attack on Grahamstown, and after its defeat the colony took the land up to the Keiskamma. The wars of 1834–1836 (in which the Gcaleka king Hintsa was killed while in British custody), 1846–1847 (the War of the Axe) and 1850–1853 (Mlanjeni’s War, with a rising of Khoikhoi in the Kat River settlement) ended with the land between the Keiskamma and the Kei annexed as British Kaffraria and the Ngqika driven from the Amatola mountains. In 1856–1857, after years of defeat, drought and cattle disease, the Xhosa followed the prophecies of Nongqawuse and killed their cattle; some 40,000 people died of hunger and the colony took much of their remaining land. The last war, in 1877–1878, brought Gcalekaland under colonial rule, and the Cape took over the rest of the Transkei by 1894."
countries: [za, gb]
