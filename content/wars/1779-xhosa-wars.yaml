  - title: The War of the Axe
    date: 1846–1847
    when: "1846-03"
    borders: "1847-12-24"
    countries: [za, gb]
    body:
      - Stockenström’s treaties kept an uneasy peace for nearly ten years, until Governor Sir Peregrine Maitland replaced them with harsher terms in 1844, and drought in 1845–1846 sharpened the struggle for land and cattle. In March 1846 a Xhosa man accused of stealing an axe at Fort Beaufort was being taken to Grahamstown for trial, handcuffed to a Khoikhoi prisoner, when a party of his kinsmen freed him, cutting off the other prisoner’s hand and killing him. The Ngqika chief Sandile, Ngqika’s son and heir, refused to hand over the killers, and the colony declared war.
      - In April 1846 a British column entered the Amatola mountains towards Sandile’s homestead near Burnshill mission and was ambushed; the Ngqika captured a large part of its wagon train. Xhosa forces then invaded the colony again. On 28 May about 8,000 men attacked Fort Peddie, held by British troops and Mfengu, and were driven off after a long exchange of fire, and on 7 June Colonel Henry Somerset’s cavalry caught a large Ndlambe force in the open by the Gwangqa River near the fort and killed several hundred. The war then became one of attrition in the mountains and bush, with colonial columns burning crops and seizing cattle; hunger forced the chiefs to submit one by one, and Sandile was taken during negotiations in late 1847.
      - Sir Harry Smith, back as governor, met the chiefs at King William’s Town on 23 December 1847, publicly humiliated them, and proclaimed the land between the Keiskamma and the Kei a separate British crown territory, British Kaffraria, ruled by magistrates through the chiefs; the Ceded Territory was annexed to the Cape. Smith also took the land between the Orange and the Vaal in 1848, and the Xhosa chiefs lost much of their authority to colonial officials.
    facts:
      - [Outbreak, "March 1846"]
      - [Attack on Fort Peddie, "28 May 1846"]
      - [Battle of the Gwangqa, "7 June 1846"]
      - [British Kaffraria proclaimed, "23 December 1847"]
