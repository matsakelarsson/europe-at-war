  - title: The last frontier war
    date: 1877–1878
    when: "1877-09-29"
    borders: "1878-06-01"
    countries: [za, gb]
    body:
      - After 1858 Sarhili was allowed back to part of Gcalekaland, and the Mfengu were settled on much of his former land, in Fingoland. Drought in 1875–1877 sharpened rivalry over grazing. In August 1877 a brawl at a Mfengu beer party attended by Gcaleka guests turned into fighting between the two peoples. The Cape’s Frontier Armed and Mounted Police came to the Mfengu’s aid, and on 29 September 1877 about 8,000 Gcaleka attacked the police post at Ibeka and were beaten off by rifle and artillery fire.
      - The governor and high commissioner, Sir Bartle Frere, who wanted to bring all of southern Africa under British control in a confederation, declared Sarhili deposed and sent colonial police, volunteers and Mfengu levies under Commandant Charles Griffith into Gcalekaland. In December the Ngqika under Sandile, living within the colony, rose as well, and British regulars were brought in. On 7 February 1878 a combined Gcaleka and Ngqika force attacked the fortified British camp at Centane (Kentani) and was driven off with heavy losses.
      - The war then became a pursuit through the Amatola forests. On 29 May 1878 Sandile was mortally wounded in a skirmish with Mfengu levies, and by mid-1878 the last fighters had surrendered or been killed; Sarhili escaped across the Mbhashe and lived in exile among the Bomvana. Gcalekaland was put under colonial magistrates, the Ngqika were removed from the Amatolas, and between 1879 and 1894 the Cape annexed the remaining independent territories of the Transkei, Pondoland last. Frere’s dismissal of the Cape ministry during the war, and his war against the Zulu kingdom that followed, led to his recall in 1880.
    facts:
      - [Battle of Ibeka, "29 September 1877"]
      - [Battle of Centane, "7 February 1878"]
      - [Death of Sandile, "wounded 29 May 1878"]
