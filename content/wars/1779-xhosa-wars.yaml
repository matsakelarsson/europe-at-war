  - title: The Khoikhoi rising and the expulsion from the Zuurveld
    date: 1799–1812
    when: "1799-01"
    borders: "1812-03-01"
    countries: [za, gb]
    body:
      - The British, who had taken the Cape in 1795, faced a second rising of the Graaff-Reinet burghers in January 1799 and sent troops under General Thomas Vandeleur to the frontier. While they put it down, many Khoikhoi servants left the frontier farms with guns and horses and joined the Zuurveld Xhosa. Led by Klaas Stuurman, Hans Trompetter and Boesak, they demanded land of their own and wages for their work, and together with the Gqunukhwebe of Chungwa they drove Vandeleur’s patrols back and raided farms as far west as the Langkloof and the Oudtshoorn district. This third war dragged on until a peace was arranged in February 1803, as the Cape was handed over to the Batavian Republic; the Xhosa stayed in the Zuurveld, and some Khoikhoi were given land, among them at the London Missionary Society’s station of Bethelsdorp near Algoa Bay.
      - In 1811 Governor John Cradock decided to clear the Zuurveld. Colonel John Graham, with British regulars, the Khoikhoi soldiers of the Cape Regiment and burgher commandos, swept through it from December 1811 to February 1812, burning homesteads and crops and driving some 20,000 people of Ndlambe’s and the Zuurveld chiefdoms across the Fish. The aged chief Chungwa was shot dead as he lay ill. Cradock reported that no more blood had been shed than was needed to instil “a proper degree of terror and respect”.
      - Graham’s headquarters became the town of Grahamstown, and a line of military posts was built along the Fish. In 1820 the British government settled about 4,000 emigrants from Britain, the “1820 Settlers”, on the cleared Zuurveld, now called Albany, to hold the frontier.
