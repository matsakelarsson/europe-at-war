notes:
  - "The Xhosa were not one state: the Gcaleka paramounts east of the Kei (Khawuta, Hintsa, Sarhili) were senior, but the western or Rharhabe Xhosa (the chiefdoms of Ngqika, Ndlambe and their sons) and the smaller chiefdoms of the Zuurveld acted on their own, and often fought one another. Colonial writers called the wars the “Kaffir Wars”, using a term that is now a grave insult; South African historians call them the Frontier Wars or the wars of dispossession."
  - "The Mfengu (Fingo), refugees who had settled among the Gcaleka and moved into the colony in 1835, fought on the colonial side in the later wars, as did many Khoikhoi soldiers of the Cape Regiment and Cape Mounted Rifles; Thembu and Khoikhoi groups fought on both sides. Casualty figures are mostly unknown; colonial sources counted settler losses and captured cattle far more carefully than Xhosa dead."
