  - title: The Sixth War and the death of Hintsa
    date: 1834–1836
    when: "1834-12-21"
    borders: "1835-05-12"
    countries: [za, gb]
    body:
      - The Rharhabe chiefs Maqoma and Tyhali, sons of Ngqika, had been driven out of the Kat River valley in 1829, and colonial patrols that seized cattle in reprisal for thefts kept their people in constant fear. In early December 1834 a patrol wounded Tyhali’s brother Xhoxho. On 21 December some 10,000 to 12,000 Xhosa crossed into the colony, overran the Albany district and reached the outskirts of Uitenhage. In a few weeks about 40 colonists were killed, 416 farmhouses burned and tens of thousands of cattle, sheep and horses carried off; the farmers took refuge in the towns.
      - Colonel Harry Smith rode from Cape Town to Grahamstown in six days and arrived on 6 January 1835. British troops, burghers and Khoikhoi levies cleared the colony and in April 1835 Governor Sir Benjamin D’Urban, holding the Gcaleka king Hintsa responsible for the raids, crossed the Kei to his great place near present-day Butterworth. Hintsa came into the British camp to negotiate and was held there while D’Urban demanded 50,000 cattle. On 10 May D’Urban proclaimed the land between the Keiskamma and the Kei a British territory, the Province of Queen Adelaide. On 12 May, while guiding a British patrol to collect cattle, Hintsa tried to escape; he was shot dead on the banks of the Nqabara River by George Southey, and his ears were cut off. Colonial accounts of his death were disputed even at the time.
      - As D’Urban’s army withdrew from Gcalekaland it took with it about 17,000 Mfengu, refugees from the wars in Natal who had lived among the Gcaleka, with their cattle. They were settled near Fort Peddie and became the colony’s allies. Fighting in the Amatola mountains went on until September 1836, when Andries Stockenström, the new lieutenant-governor, made treaties with the chiefs. The British government, persuaded that the war had been provoked, ordered Queen Adelaide Province abandoned in December 1836.
