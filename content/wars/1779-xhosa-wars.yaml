steps:
  - title: The Zuurveld frontier
    date: 1779–1793
    when: "1779-12"
    borders: "1781-01-01"
    countries: [za]
    body:
      - By the 1770s the stock farmers of the Cape Colony, the trekboers, had moved east with their herds into the country between the Sundays and Great Fish rivers. The western Xhosa chiefdoms, among them the Gqunukhwebe, Ntinde, Mbalu, Dange and Gwali, already grazed their cattle there, in the Zuurveld (“sour grassland”) near the coast. Both sides raided and traded cattle, hunted the same game and hired each other’s men; neither recognised a fixed border. In 1778 Governor Joachim van Plettenberg agreed with some minor chiefs that the Fish River should divide them.
      - The first war began with clashes over cattle in December 1779. In 1780 the Company proclaimed the Fish River the colony’s eastern boundary, and in 1781 the frontier commandant Adriaan van Jaarsveld led commandos into the Zuurveld. At one meeting he scattered tobacco on the ground and, as the Xhosa stooped to pick it up, his men opened fire, killing between 100 and 200 people, among them the Dange chief Jalamba. The commandos seized thousands of cattle and drove the chiefdoms across the Fish, but many soon returned.
      - In 1786 the Company founded Graaff-Reinet as the seat of a new frontier district. The second war (1789–1793) began when the Gqunukhwebe moved back into the Zuurveld. The frontier farmers allied with Ndlambe, the regent of the Rharhabe Xhosa east of the Fish, who had his own quarrels with the Zuurveld chiefdoms; their commando achieved little, many farms were abandoned, and a peace was patched up in 1793 that left the Xhosa where they were.
