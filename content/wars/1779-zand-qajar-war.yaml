id: zand-qajar-war
name: Zand–Qajar war
start: "1779-03"
end: "1794-10-24"
tier: B
summary: The struggle for Iran after the death of Karim Khan Zand in 1779. Agha Mohammad Khan, chief of the Qajar tribe and for sixteen years a hostage at the Zand court in Shiraz, escaped to the Caspian provinces, fought off his own brothers and several Zand armies, and made Tehran his capital in 1786, while the Zand princes fought each other for the throne. He took Shiraz in 1792 and in 1794 captured Kerman, where the last Zand ruler, Lotf Ali Khan, had made his stand, punishing its people with mass blinding and enslavement. Lotf Ali Khan was handed over at Bam and put to death, and the Qajars ruled Iran until 1925.
countries: [ir]
