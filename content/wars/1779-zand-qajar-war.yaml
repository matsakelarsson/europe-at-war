steps:
  - title: Agha Mohammad Khan takes the north
    date: 1779–1786
    when: "1779-03-01"
    borders: "1786-03-12"
    countries: [ir]
    body:
      - Karim Khan Zand died in Shiraz on 1 March 1779. On the same day Agha Mohammad Khan, the Qajar chief whom he had kept at his court since 1763, slipped away on a hunting trip and rode north to Mazandaran, the Qajar homeland on the Caspian. While the Zand princes fought over the succession in Shiraz, he spent the next years subduing his own half-brothers, who captured him at Babol in 1780 before another brother freed him, and bringing Gilan, Qumis and the towns along the road to Khorasan under his rule.
      - Ali-Morad Khan Zand, who had made himself master of Isfahan and then of most of Zand Iran by 1782, sent army after army north. In June 1784 a large Zand force under his fifteen-year-old son Sheikh Veis Khan, said to number 60,000, overran Mazandaran, and some 8,000 men besieged Agha Mohammad Khan in Astarabad. The Qajars stripped the countryside until the besiegers ran out of food, then broke out; the Zand commander was caught and killed by Agha Mohammad Khan’s Yomut Turkmen allies, and by late November the Qajars had retaken Mazandaran. Ali-Morad died on 11 February 1785. Agha Mohammad Khan defeated a Zand army near Kashan and entered Isfahan on 2 May 1785, and when Tehran at last opened its gates to him he made the small town his capital on 12 March 1786. Isfahan changed hands twice more, but the Zand state was now essentially reduced to Fars, Kerman and the south.
    facts:
      - [Death of Karim Khan Zand, "1 March 1779"]
      - [Zand siege of Astarabad, "summer 1784, Zand army routed"]
      - [Tehran made the Qajar capital, "12 March 1786"]
