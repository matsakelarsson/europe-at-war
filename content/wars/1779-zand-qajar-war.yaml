      - kind: taken
        side: qaj
        name: Shiraz
        date: 21 July 1792
        text: Handed over by Hajji Ebrahim, who became Agha Mohammad Khan’s chief minister. The Qajars razed the city walls and moved Karim Khan’s remains to Tehran.
        lonlat: [52.542, 29.610]
        lp: l
      - kind: battle
        side: qaj
        name: Persepolis
        date: 5 June 1792
