        side: qaj
        name: Kerman
        date: summer – 24 October 1794
        text: Lotf Ali Khan held the city for about four months. After it fell, its people were massacred, blinded and enslaved, and much of the city was destroyed.
        lonlat: [57.068, 30.291]
      - kind: event
