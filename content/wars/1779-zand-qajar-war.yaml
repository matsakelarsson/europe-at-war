  - id: zand
    name: Zand dynasty
    polities: [persia]
    ink: orange
    moves: Zand moves
    success: Zand success
  - id: qaj
    name: Agha Mohammad Khan Qajar
    polities: [qajars]
    ink: navy
    moves: Qajar moves
    success: Qajar success
notes:
  - The Zand rulers called themselves vakil (regent) rather than shah; Agha Mohammad Khan was enthroned in 1789 but crowned only in 1796. The base map shows Zand Iran and the Qajar north as separate states from 1779 to 1794.
  - The numbers in the Persian chronicles are often round and large. The figure of 20,000 eyes demanded at Kerman comes from Qajar-era and European accounts; others speak of about 7,000 people blinded.
