  - title: Shiraz, Kerman and the end of the Zands
    date: 1789–1794
    when: "1789-06-25"
    borders: "1794-11-01"
    countries: [ir]
    body:
      - Jafar Khan Zand was poisoned in January 1789, and his son Lotf Ali Khan, about twenty years old, won the throne in Shiraz. Agha Mohammad Khan beat him outside the city on 25 June 1789 and besieged it until September without success. Lotf Ali Khan’s fortunes turned in 1791, when the mayor of Shiraz, Hajji Ebrahim, shut the gates on him while he was away on campaign and went over to the Qajars. Lotf Ali Khan defeated the Qajar reinforcements and besieged his own capital, and on 5 June 1792 he led a night raid on Agha Mohammad Khan’s camp near Persepolis. His men scattered to plunder, believing the Qajars routed, and at daybreak found the shah’s tent still standing. Lotf Ali Khan fled east, and Agha Mohammad Khan entered Shiraz on 21 July 1792.
      - With the backing of the chiefs of Bam and Narmashir, Lotf Ali Khan took Kerman on 30 March 1794. Agha Mohammad Khan besieged the city from early summer, and on 24 October 1794 it fell through treachery. He took terrible revenge on its people. Contemporary accounts say that the men were killed or blinded, with figures that range from about 7,000 blinded to a demand for 20,000 eyes, and that thousands of women and children were enslaved. Lotf Ali Khan escaped to Bam, where its governor seized him and handed him over. He was blinded, tortured and killed in Tehran late in 1794. Agha Mohammad Khan was crowned shah in 1796, and his nephew Fath-Ali Shah succeeded him in 1797.
    facts:
      - [Battle outside Shiraz, "25 June 1789, Qajar victory"]
      - [Night raid near Persepolis, "5 June 1792"]
      - [Shiraz entered by the Qajars, "21 July 1792"]
      - [Fall of Kerman, "24 October 1794"]
