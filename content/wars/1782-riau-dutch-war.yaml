id: riau-dutch-war
name: Riau War
start: "1782"
end: "1784-10-31"
tier: C
summary: "A war between the Dutch East India Company (VOC) and the Johor-Riau sultanate, led by its Bugis viceroy (Yang Dipertuan Muda) Raja Haji, with Selangor and Rembau as allies. Riau, on the island of Bintan near today’s Tanjungpinang, had grown into a busy free port that drew trade away from Dutch Malacca. During the Fourth Anglo-Dutch War, in 1782, Raja Haji helped the VOC seize the British ship Betsy and its cargo of opium in Riau’s harbour, but the Company refused him a share of the prize; he made a show of force with a large fleet off Muar, and the governor of Malacca, Pieter Gerardus de Bruijn, pressed for war. In June 1783 a VOC squadron declared war and blockaded Riau. On 6 January 1784 an attempt to land troops failed when the flagship Malakka’s Welvaaren ran aground on the defenders’ stone barriers and blew up, killing its commander, Arnoldus Lemker, and hundreds of men. Selangor and Rembau forces then landed near Malacca, and from February Raja Haji besieged the town, taking its suburbs. On 18 June 1784 a fleet from the Netherlands under Jacob Pieter van Braam, with about 1,400 European soldiers, landed and attacked the besiegers’ camp at Teluk Ketapang; Raja Haji was killed and the siege collapsed. Van Braam took Kuala Selangor and installed a ruler from Siak, then attacked Riau; after the fort on Penyengat fell, Raja Haji’s successor Raja Ali left for Borneo on 31 October 1784. The sultan of Johor had to banish the Bugis leaders and accept a VOC resident and garrison at Riau, but a rising in 1787 drove them out, Sultan Ibrahim of Selangor retook his capital in 1785 and made peace in 1786, and the war hastened the decline of Dutch power in the Strait of Malacca. Raja Haji was buried on Penyengat and is a National Hero of Indonesia."
