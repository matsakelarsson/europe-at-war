notes:
  - The Malay side of the war is told in the Tuhfat al-Nafis, a history of the Bugis in the Malay world written in Riau in the 19th century by Raja Haji’s grandson Raja Ali Haji; the Dutch side in the VOC records. Casualty figures for the explosion of 6 January 1784 range from about 500 to 800 in the Tuhfat al-Nafis.
  - The quarrel began in 1782, but open war began with the Dutch declaration of June 1783; some accounts date the war 1783–1784 or 1784 alone.
