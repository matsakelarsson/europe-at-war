id: syrym-datov-rebellion
name: Syrym Datov’s rebellion
start: "1783"
end: "1797"
tier: C
summary: "A rising of the Kazakhs of the Junior Zhuz (Little Horde), in the steppe east of the lower Ural river, against the Russian frontier administration, the Ural Cossacks and their own khans. After Pugachev’s rebellion the government let the Kazakhs graze between the Volga and the Ural only for payment, the Cossacks demanded hostages and barred them from crossing the river, and Cossack raids and the exactions of Khan Nurali and his sultans weighed on the herders. In 1783 Syrym Datov (Syrym Datuly), an elder of the Baiuly clans who had probably fought with Pugachev, led raids on the Cossack outposts and forts of the Ural line, which brought punitive expeditions in return. Captured by the Cossacks in 1783 and ransomed in 1784, he helped drive Nurali out in 1786; the khan fled to the Russians and was sent to Ufa. The governor-general in Ufa, Osip (Iosif) Igelström, then tried a reform that set aside the khan’s power in favour of a council of elders and frontier courts, with Syrym at its head, but in 1789–1791 St Petersburg chose to restore the khanate, and the election of Nurali’s brother Yeraly as khan renewed the fighting. Raids on the line and on caravans cut off trade with Central Asia; in 1797 the rebels killed Yeraly’s successor, Khan Yesim. Talks with the elders and sultans then brought most of the clans to terms, and Syrym moved south to the Khanate of Khiva with his followers. He died there in 1802."
