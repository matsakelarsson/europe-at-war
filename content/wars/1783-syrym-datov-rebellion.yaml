notes:
  - Dates of the reforms and of the khans’ elections differ between sources. Syrym’s birth year is given as 1712 or 1753.
  - Soviet and Kazakh historians describe the rising as both anti-colonial and anti-feudal, aimed at the Russian frontier and at the khans and sultans who governed for Russia.
  - Pugachev’s rebellion (1773–1775), in which Kazakhs of the Junior Zhuz took part, has its own entry.
