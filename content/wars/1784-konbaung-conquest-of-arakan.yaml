notes:
  - "Sources give the fall of Mrauk U as 31 December 1784, 1 January or 2 January 1785. The numbers of the Burmese army and of the deported come from Burmese chronicles and later British reports; the refugee figure of about 35,000 is a British estimate."
  - "Burmese accounts presented the conquest as the restoration of Buddhist order in a declining kingdom and the Mahamuni as rescued; for Arakanese tradition the removal of the image, still venerated in Mandalay, marks the loss of the kingdom’s independence. The deported were given as slaves to pagodas and monasteries and as labourers on the king’s works."
