steps:
  - title: Across the Arakan Yoma
    date: December 1784 – January 1785
    when: "1784-12-31"
    borders: "1784-12"
    countries: [mm]
    body:
      - "Bodawpaya, who had taken the throne in 1782 and moved his capital to Amarapura, wanted to extend his rule west to the Bay of Bengal, and saw in Arakan a Buddhist kingdom in decline. Its last king, Maha Thammada, ruled over elites so divided by faction that they could not unite against an invader. The invasion began on 2 December 1784. Three divisions crossed the Arakan Yoma by three different passes, the crown prince Thado Minsaw’s from his base at Minbu on the Irrawaddy, while a fourth, a flotilla, came up the coast from Negrais. The Burmese met little resistance. They secured the south, landed on Ramree island, where the local prince was defeated and fled into the jungle, and marched north on the capital."
      - "On 31 December 1784 the Burmese set up camp at Laungkyet, south-east of Mrauk U. The king’s brother-in-law advised him to make peace by offering his daughter to Bodawpaya; Maha Thammada refused, led his land and naval forces out the same day to attack the camp, and was soundly defeated. Mrauk U was taken within two days, ending a kingdom that had ruled Arakan since 1429. Maha Thammada was captured and taken to Amarapura with his family."
    facts:
      - ["Burmese army", "over 20,000 men, 2,500 horse and 200 elephants"]
      - ["Battle of Laungkyet", "31 December 1784, Burmese victory"]
      - ["Mrauk U taken", "1 or 2 January 1785"]
