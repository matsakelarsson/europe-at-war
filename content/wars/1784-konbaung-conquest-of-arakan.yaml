  - title: Arakan under Burmese rule
    date: 1785–1815
    when: "1785"
    borders: "1785-01-02"
    countries: [mm, bd]
    body:
      - "Arakan was annexed as a province of Burma under four governors, at Mrauk U, Ramree, Man Aung (Cheduba) and Thandwe, each with a garrison. Thado Minsaw took the Mahamuni image, a great bronze Buddha long regarded as the guardian of the kingdom, across the mountains to Amarapura in 1785, together with other bronzes the Arakanese had once taken as booty; it remains in Mandalay’s Mahamuni temple. Burmese and British sources speak of more than 20,000 people deported to Burma, given to pagodas and monasteries or set to work on the king’s projects. Maha Thammada died a captive at Amarapura two years later."
      - "Burmese rule was resisted from the start. About 35,000 Arakanese fled to the Chittagong region of British Bengal, by a British estimate, and Arakanese rebels used it as a base. A revolt broke out in 1794; Burmese troops followed the rebels into Company territory, and the Governor-General sent Michael Symes on an embassy to Ava in 1795. In 1811 the rebel leader Chin Byan gathered a force among the refugees in British territory, crossed the border and took Mrauk U before Burmese troops drove him back; he kept up his raids until his death in 1815. Disputes over the border and the refugees were among the causes of the First Anglo-Burmese War of 1824–1826, after which Arakan passed to British rule."
    facts:
      - ["Deported to Burma", "more than 20,000 (Burmese and British sources)"]
      - ["Refugees to Chittagong", "about 35,000 (British estimate)"]
      - ["Revolts", "1794; Chin Byan 1811–1815"]
