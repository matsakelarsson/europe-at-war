id: konbaung-conquest-of-arakan
name: Konbaung conquest of Arakan
start: "1784-12-02"
end: "1785-01-02"
tier: B
summary: "The campaign in which King Bodawpaya of Burma ended the independence of Arakan, the coastal kingdom of Mrauk U on the Bay of Bengal, which had been weakened by decades of factional strife between its kings and nobles. On 2 December 1784 the crown prince Thado Minsaw led more than 20,000 men, with 2,500 horse and 200 elephants, across the Arakan Yoma by three passes, while a flotilla sailed up the coast from Negrais and landed on Ramree island. On 31 December the Arakanese king attacked the Burmese camp at Laungkyet, near his capital, and was defeated; Mrauk U fell on 1 or 2 January 1785 (some sources say 31 December 1784). Maha Thammada was taken to Amarapura with his family and died there a captive. The Burmese carried off the Mahamuni image, the palladium of Arakan, to Amarapura, along with other bronzes, and deported more than 20,000 people. Arakan became a Burmese province under four governors. Burmese rule was harsh and resisted: some 35,000 Arakanese fled to British-ruled Chittagong, revolts broke out in 1794 and under Chin Byan from 1811, and the border with British Bengal became one of the grievances that led to the First Anglo-Burmese War in 1824."
countries: [mm, bd]
