id: maratha-mysore-war
name: Maratha–Mysore War
start: "1785-02"
end: "1787-04"
tier: C
summary: "A war between Tipu Sultan’s Mysore and the Maratha state, allied with the Nizam of Hyderabad, over the lands between the Krishna and the Tungabhadra that Hyder Ali had taken from the Marathas in the 1770s. It began in 1785, when Tipu besieged and took Nargund, whose chief, a tributary of Mysore since Hyder’s conquest of 1778, had refused a higher tribute and turned to the Marathas, and occupied Kittur. Nana Phadnavis, the leading minister at Pune (Poona), allied with the Nizam, and in May 1786 their armies stormed Badami. Tipu answered by taking the Nizam’s fortress of Adoni after the allied relief army withdrew, crossing the flooded Tungabhadra and defeating the Maratha army of Haripant Phadke at Savanur in October 1786; in January 1787 he took Bahadur Benda. Both sides feared the British more than each other, and in April 1787 they made peace at Gajendragad. Tipu agreed to pay the Marathas tribute, gave up Badami, and returned Nargund, Kittur and Adoni to their former holders, but kept most of his other conquests. Three years later the Marathas and the Nizam joined the British against him."
countries: [in]
