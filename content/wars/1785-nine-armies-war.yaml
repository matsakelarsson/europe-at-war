  - title: Tha Din Daeng
    date: late 1786 – early 1787
    when: "1787-02"
    borders: "1787"
    countries: [th, mm]
    body:
      - "Bodawpaya returned to Ava, leaving armies at Martaban and Tavoy to wait out the rains. Late in 1786 the crown prince Thado Minsaw led a single army back through the Three Pagodas Pass, and its vanguard built fortified camps at Tha Din Daeng and Samsop, in today’s Sangkhlaburi, to serve as a base for a deeper push. Rama I and Maha Sura Singhanat came up with two armies; the Siamese surrounded and stormed the camps, and Thado Minsaw fell back to Martaban. The Siamese pursued as far as his camp on the Mae Kasat river, and Rama I had the Burmese granaries and depots destroyed before returning to Bangkok."
      - "It was the last time a Burmese king sent a full army against Siam. Bodawpaya turned to Tenasserim, where Siam backed a rising in Tavoy in 1791–1793, and later to Assam and Manipur; the Burmese raids on the Andaman coast in 1809–1812 were the last invasion. The fighting had emptied much of western Siam, whose borderlands stayed thinly peopled until the later nineteenth century."
    facts:
      - ["Siamese armies", "about 30,000 in the vanguard and 30,000 with the king"]
      - ["Battle of Tha Din Daeng and Samsop", "early 1787, Siamese victory"]
