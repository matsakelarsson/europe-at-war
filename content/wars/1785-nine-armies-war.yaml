steps:
  - title: Nine armies and the battle of Lat Ya
    date: July 1785 – February 1786
    when: "1786-02-18"
    borders: "1786-01"
    countries: [th, mm]
    body:
      - "Bodawpaya began preparing in July 1785 and left Ava with his court on 11 November. At Martaban he found the supplies far short of what was needed and had the commander responsible brought to him in chains. His plan sent armies along every route into Siam at once: the main royal army through the Three Pagodas Pass towards Kanchanaburi and Bangkok, an army from Tavoy through the Bong Ti pass to Ratchaburi, an army from Chiang Saen against Lan Na, another through Tak, and a force from Mergui by sea down the peninsula. The Siamese learned of the plan from captured Burmese and decided to meet the main army with the bulk of their forces and hold elsewhere."
      - "In December 1785 Maha Sura Singhanat led 30,000 men to Lat Ya, at the foot of the hills on the road from the Three Pagodas Pass, and dug in opposite the Burmese vanguard, which had beaten a Mon force on the way. Burmese columns under Bodawpaya’s sons stayed behind at Tha Din Daeng and Samsop, and the king himself on the Ranti river beyond the pass. While Siamese raiders cut the Burmese supply lines through the hills, the prince marched troops out of his camp at night and back in by day to suggest that he was being reinforced. Starving, the Burmese were reduced to eating their horses. On 18 February 1786 the Siamese attacked all along the line and broke them; the survivors fled back to the pass, and on 21 February Bodawpaya ordered the general retreat. The prince then turned south and beat the army from Tavoy at Khao Ngu near Ratchaburi."
    facts:
      - ["Burmese armies", "nine, about 144,000 men (Thai chronicles)"]
      - ["Siamese at Lat Ya", "about 30,000 men"]
      - ["Battle of Lat Ya", "December 1785 – 18 February 1786, Siamese victory"]
