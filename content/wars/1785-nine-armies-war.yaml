id: nine-armies-war
name: Nine Armies War (Burmese–Siamese War of 1785–1787)
start: "1785-07"
end: "1787-03"
tier: B
summary: "King Bodawpaya’s attempt to conquer Siam, three years after Rama I had founded Bangkok and the Chakri dynasty. Fresh from the conquest of Arakan, Bodawpaya sent nine armies, about 144,000 men by the count of the Thai chronicles, against Siam from five directions in the dry season of 1785–1786: through the Three Pagodas Pass to Kanchanaburi, by the Bong Ti pass to Ratchaburi, from Chiang Saen against Lampang, through Tak into the upper Chao Phraya valley, and by sea against Thalang and the peninsula. The Siamese, outnumbered, concentrated their forces against the main army. Rama I’s brother, the Front Palace prince Maha Sura Singhanat, held the Burmese at Lat Ya, the old site of Kanchanaburi, cut their supply lines and broke them on 18 February 1786; on 21 February Bodawpaya ordered a general retreat. Lampang held under Kawila until relieved, the Burmese were beaten at Pakphing in March, and on Phuket the widow Chan and her sister Muk led the defence of Thalang until the Burmese withdrew on 13 March 1786. A second, smaller invasion under the crown prince Thado Minsaw was defeated at Tha Din Daeng and Samsop near the Three Pagodas Pass in early 1787. These were the last full-scale Burmese invasions of Siam, though the war left the western borderlands depopulated for decades."
countries: [th, mm]
