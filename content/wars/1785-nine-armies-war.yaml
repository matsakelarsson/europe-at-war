notes:
  - "The figure of 144,000 men in nine armies comes from the Thai chronicles; other accounts give 134,000. Burmese and Thai chronicles differ on dates, partly because the Thai year then began in April: the relief of Thalang on 13 March 1786 is often given as 1785, and the Tha Din Daeng campaign is dated to 1786 in some sources and to February–March 1787 in others."
  - "Chan and Muk were honoured by Rama I with the titles Thao Thep Kasattri and Thao Si Sunthon, and are commemorated by a monument on Phuket. Francis Light, the English trader who founded Penang in 1786, supplied the defenders of Thalang with muskets."
  - "Names: Lat Ya is about 15 km north-west of modern Kanchanaburi. Thalang, then the main town of Phuket island, is the Junkceylon of European sources. Nakhon Si Thammarat is Ligor."
