  - title: Lampang, Thalang and the south
    date: December 1785 – 1786
    when: "1786-03"
    borders: "1786-03"
    countries: [th, mm, my]
    body:
      - "In the north an army of 30,000 raised in the Shan states marched from Chiang Saen and laid siege to Lampang in December 1785; Chiang Mai had been abandoned since 1776, and Kawila held Lampang for four months until a Siamese relief force arrived in March. A Burmese force of 3,000 sent south from the Lampang front camped at Pakphing, twenty kilometres south of Phitsanulok, and was beaten there on 18 March 1786 by an army sent north from Bangkok; the army that had come in through Tak then withdrew without a fight."
      - "The Burmese fleet from Mergui landed an army at Ranong, which crossed the hills to Chumphon. The governors of Chumphon and Chaiya, without the men to fight, abandoned their towns, which were sacked, and Nakhon Si Thammarat was taken and plundered after the Burmese spread word that Bangkok had fallen. A second force attacked Thalang on Phuket, whose governor had just died. His widow Chan and her sister Muk, with the vice-governor, organised the defence, and the town held through about a month of assaults until the Burmese withdrew on 13 March 1786. Maha Sura Singhanat sailed south with 20,000 men on 4 March, defeated the Burmese at Chaiya and drove them out of the peninsula; the Siamese then marched on Pattani, which had refused to send help, took it and made it a vassal of Bangkok, carrying its great bronze cannon to the capital."
    facts:
      - ["Siege of Lampang", "December 1785 – March 1786, relieved"]
      - ["Battle of Pakphing", "18 March 1786, Siamese victory"]
      - ["Siege of Thalang", "February – 13 March 1786, held"]
