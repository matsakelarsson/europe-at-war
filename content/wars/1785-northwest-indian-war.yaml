  - title: Talks, the Legion and Fort Recovery
    date: 1792 – July 1794
    when: "1794-06-30"
    borders: "1794-06-30"
    countries: [us, ca, gb]
    body:
      - "Washington tried to talk as well as fight. Two American envoys, John Hardin and Alexander Trueman, were killed on their way to the nations in 1792. That autumn the largest Native council in decades met at the Glaize, where the Auglaize joins the Maumee; Haudenosaunee envoys, among them the Seneca orator Red Jacket, brought the American peace offer and urged a compromise boundary on the Muskingum, but the Shawnee, Miami and Lenape held to the Ohio. In 1793 American commissioners waited near the Detroit River for talks; the confederacy’s message to them suggested that the United States pay the settlers to leave the land rather than pay the nations to give it up, and the talks never began."
      - "Meanwhile Anthony Wayne, a veteran of the Revolution, trained a new army, the Legion of the United States, first at Legionville near Pittsburgh and then near Cincinnati. In late 1793 he advanced and built Fort Greene Ville, and on the site of St. Clair’s defeat he built Fort Recovery, burying the bones of the dead. British policy hardened: in February 1794 the governor of Canada, Lord Dorchester, told Native delegates that he expected war with the United States within a year, and in April the lieutenant governor of Upper Canada, John Graves Simcoe, built Fort Miamis at the rapids of the Maumee, well inside the United States."
      - "On 30 June 1794 about 1,200 warriors, among them many Odawa, Ojibwe and Potawatomi from the upper Great Lakes, attacked a supply train outside Fort Recovery and then the fort itself. After two days they gave up, and many of the northern warriors went home after quarrels with the Shawnee and others, which weakened the confederacy. In July Wayne marched north with about 3,000 men, regulars and Kentucky mounted volunteers under Charles Scott, and in August built Fort Defiance at the Glaize, whose towns had been abandoned."
    facts:
      - [Council at the Glaize, "autumn 1792"]
      - [Fort Miamis built, "April 1794"]
      - [Battle of Fort Recovery, "30 June – 1 July 1794"]
