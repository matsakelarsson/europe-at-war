  - title: Harmar’s campaign
    date: September – October 1790
    when: "1790-10-22"
    borders: "1790-10-22"
    countries: [us]
    body:
      - "When talks failed, President George Washington and his Secretary of War, Henry Knox, sent an expedition against Kekionga. General Josiah Harmar left Fort Washington, at Cincinnati, at the end of September 1790 with about 320 regulars and 1,100 militia from Kentucky and Pennsylvania, many of them untrained and poorly armed. The Miami and their neighbours abandoned and burned their towns as he approached, and his men destroyed the houses and some 20,000 bushels of corn that remained. A smaller column under Jean François Hamtramck moved up the Wabash from Vincennes."
      - "On 19 October Little Turtle ambushed a detachment of about 180 men under Colonel John Hardin near the Eel River; most of the militia fled. On 22 October, as Harmar’s army began to withdraw, Hardin went back to Kekionga with a stronger force, and Miami and Shawnee warriors under Little Turtle and Blue Jacket defeated it at the confluence of the rivers in what is called the Battle of the Pumpkin Fields. The Americans lost about 180 killed and missing in the campaign. Harmar reported a success, but a court of inquiry was held, and the defeat made the confederacy bolder."
    facts:
      - [American force, "about 320 regulars and 1,100 militia"]
      - [Hardin’s defeat, "19 October 1790"]
      - [Battle of the Pumpkin Fields, "22 October 1790"]
      - [American losses, "about 180 killed and missing"]
