  - title: St. Clair’s defeat
    date: May – November 1791
    when: "1791-11-04"
    borders: "1791-11-04"
    countries: [us]
    body:
      - "For 1791 Washington ordered a larger expedition, and meanwhile Kentucky mounted volunteers raided the towns on the Wabash. In June Charles Scott’s 750 horsemen burned the Wea and Kickapoo towns of Ouiatenon and Kethtippecanunk, and in August James Wilkinson’s 500 burned a Miami town on the Eel River; both took women and children captive to press the nations into peace."
      - "Arthur St. Clair, governor of the Northwest Territory, marched north from Fort Washington in September with about 2,000 men, some 600 regulars and the rest six-month levies and militia, followed by camp followers, among them women and children, building Fort Hamilton and Fort Jefferson as he went. Short of supplies, sick and losing men to desertion, the army had shrunk to about 1,000 soldiers when it camped by a branch of the Wabash on 3 November. At dawn on 4 November 1791 more than 1,000 warriors under Little Turtle, Blue Jacket and Buckongahelas, Miami, Shawnee, Lenape, Wyandot, Odawa, Ojibwe, Potawatomi, Mingo and some Cherokee, attacked. They surrounded the camp, shot down the gunners and officers, and after about three hours the survivors broke out and fled, leaving the wounded behind."
      - "Of the roughly 920 soldiers engaged, 632 were killed and some 260 wounded; with the camp followers, some 800 Americans died, though estimates differ. The confederacy lost about 21 killed and 40 wounded. It was the worst defeat the United States Army ever suffered at the hands of Native American forces: about a quarter of the whole army was killed. The House of Representatives held its first investigation into the conduct of the executive, St. Clair gave up his command, and Congress agreed to raise a larger regular army."
    facts:
      - [Scott’s raid on the Wabash towns, "June 1791"]
      - [St. Clair’s defeat (Battle of the Wabash), "4 November 1791"]
      - [American soldiers killed, "632 of about 920 engaged; some 800 dead with camp followers"]
      - [Confederacy losses, "about 21 killed, 40 wounded"]
