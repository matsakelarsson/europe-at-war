  - title: Fallen Timbers
    date: August – October 1794
    when: "1794-08-20"
    borders: "1794-08-20"
    countries: [us, gb]
    body:
      - "Wayne marched down the Maumee towards the British fort. The confederacy’s warriors, perhaps 1,000 to 1,500 Shawnee, Lenape, Wyandot, Odawa, Miami and others, with some Canadian militia under William Caldwell, waited for him under Blue Jacket’s command among trees felled by a storm near the rapids, the fallen timbers that gave the battle its name. Little Turtle had advised making peace and gave up his command. Many warriors had fasted before the expected battle and some had left to fetch food from the fort when the Legion arrived on the morning of 20 August 1794."
      - "A bayonet charge by the Legion and attacks by the mounted volunteers on the flanks broke the confederacy’s line in about an hour. The Americans lost 33 killed and some 100 wounded; the confederacy’s losses are estimated at 19 to 40 killed, among them several Wyandot leaders and the Odawa leader Turkey Foot. The warriors who fled to Fort Miamis found its gates shut: its commander, Major William Campbell, would not risk a war with the United States. Wayne camped in sight of the fort for three days, exchanged angry notes with Campbell, burned the towns, cornfields and British trading posts along the Maumee and the Auglaize, and in October built Fort Wayne at Kekionga."
      - "In London, John Jay was negotiating with the British government, and in the Jay Treaty of November 1794 Britain agreed to give up Detroit and its other posts on American soil by 1796. Left without British support, their towns and harvest destroyed, the nations of the confederacy faced a hungry winter, and their leaders began to come to Greenville to talk peace."
    facts:
      - [Battle of Fallen Timbers, "20 August 1794"]
      - [Forces, "Legion and volunteers about 3,000; confederacy about 1,000–1,500"]
      - [Losses, "Americans 33 killed; confederacy 19–40 killed"]
      - [Jay Treaty signed, "19 November 1794"]
