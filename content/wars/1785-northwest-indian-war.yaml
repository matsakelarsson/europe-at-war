  - title: The Treaty of Greenville
    date: June 1795 – 1796
    when: "1795-08-03"
    borders: "1795-08-03"
    countries: [us]
    link: { href: "#/war/tecumsehs-war", text: Tecumseh’s War }
    body:
      - "Through the summer of 1795 more than a thousand people of twelve nations gathered at Fort Greene Ville. On 3 August 1795 Wayne and some ninety leaders signed the Treaty of Greenville, among them Tarhe of the Wyandot, Buckongahelas of the Lenape, Blue Jacket and Black Hoof of the Shawnee, and Little Turtle of the Miami, who had argued longest against the terms."
      - "The nations ceded about two-thirds of present-day Ohio, the land south and east of a line running from the mouth of the Cuyahoga River to Fort Recovery and from there south to the Ohio opposite the mouth of the Kentucky River, and sixteen tracts around forts and portages, among them Detroit, Fort Wayne and the mouth of the Chicago River. In return they received goods worth $20,000 and yearly payments in goods, the start of the annuity system; the United States acknowledged their right to the rest of their lands and promised to keep settlers off them."
      - "The British handed over Detroit and their other posts in 1796, and settlers poured into Ohio, which became a state in 1803. The promise of the boundary did not last: in a series of treaties between 1803 and 1809 William Henry Harrison, governor of Indiana Territory, bought much of the rest of the nations’ land. The young Shawnee leader Tecumseh refused to come to Greenville, and his brother Tenskwatawa’s religious movement and his own confederacy later took up the fight. Little Turtle, who visited Washington in Philadelphia, worked for peace until his death in 1812."
    facts:
      - [Treaty of Greenville, "3 August 1795"]
      - [Land ceded, "about two-thirds of present-day Ohio and sixteen tracts"]
      - [Payment, "goods worth $20,000 and yearly annuities"]
      - [British leave Detroit, "July 1796"]
