id: northwest-indian-war
name: Northwest Indian War
start: "1785"
end: "1795-08-03"
tier: A
summary: "The war between the United States and a confederacy of Native nations of the Great Lakes and the Ohio country for the land north-west of the Ohio River. At the peace of 1783 Britain gave the United States a claim to the region, but the Shawnee, Miami (Myaamia), Lenape, Wyandot, Odawa, Ojibwe, Potawatomi and others who lived there had not been defeated. They rejected the land cessions that American commissioners dictated to a few of their leaders in 1784–1786, insisted that the Ohio River was the boundary, and, supplied from the British posts that Britain kept on American soil, fought the settlers who crossed it. Under the Miami leader Little Turtle and the Shawnee leader Blue Jacket the Western Confederacy defeated Josiah Harmar’s expedition in 1790 and destroyed Arthur St. Clair’s army on 4 November 1791, killing more than 600 soldiers, the heaviest defeat the United States Army ever suffered at the hands of Native forces. Anthony Wayne then built a new, trained army, the Legion of the United States, held off an attack on Fort Recovery and on 20 August 1794 broke the confederacy’s forces at Fallen Timbers, near a British fort whose gates stayed shut. By the Treaty of Greenville of 3 August 1795 the nations ceded most of present-day Ohio."
countries: [us]
sides:
  - id: wc
    name: Western Confederacy (Shawnee, Miami, Lenape, Wyandot, Odawa, Ojibwe, Potawatomi, Mingo, Kickapoo and others)
    polities: [western-confederacy]
    ink: orange
    moves: Confederacy moves
    success: Confederacy success
  - id: us
    name: United States (the Army, the Legion of the United States and Kentucky militia, with Chickasaw and Choctaw scouts)
    polities: [united-states]
    ink: blue
    moves: American moves
    success: American success
  - id: gb
    name: Great Britain (posts on American soil, supplies and agents; not at war)
    polities: [united-kingdom, upper-canada, province-of-quebec]
    ink: red
    moves: British moves
    success: British
notes:
  - The war is also called the Ohio War, Little Turtle’s War or the Miami War. The confederacy called itself the United Indian Nations; Americans called it the Western or Northwestern Confederacy. Its nations did not always act together, and its leaders disagreed on how much land, if any, to give up.
  - "Most accounts of the war come from American and British records; Native views survive in the speeches and messages recorded at councils, and in later oral histories. Casualty figures are estimates, and those for the confederacy are particularly uncertain."
  - Hundreds of settlers and travellers on the Ohio were killed or captured in raids from 1783 onwards, and Kentucky militia raids killed Native people and burned their towns; the numbers are not known with any precision.
