steps:
  - title: The Ohio country after the Revolution
    date: 1783–1789
    when: "1786-11"
    borders: "1787-07-13"
    countries: [us]
    body:
      - "The Treaty of Paris of 1783 gave the United States Britain’s claim to the land between the Ohio River, the Great Lakes and the Mississippi. Congress, deep in debt from the war, wanted to sell that land, and treated the Native nations as defeated peoples who had forfeited it. At Fort Stanwix in October 1784 American commissioners made the Haudenosaunee give up their claims in the Ohio country; at Fort McIntosh in January 1785 a few Wyandot, Lenape, Odawa and Ojibwe leaders signed away most of present-day Ohio, and at Fort Finney in January 1786 some Shawnee leaders did the same. Most of the nations rejected treaties made under such pressure by people who had no authority to sell common land. The Northwest Ordinance of 13 July 1787 organised the region as a territory, banned slavery in it and promised that Native lands would never be taken without consent “unless in just and lawful wars authorized by Congress”."
      - "The nations of the region drew together. Joseph Brant had urged a common front at a council near Sandusky in 1783, and at a great council at Brownstown, near Detroit, in late 1786 the nations declared that land could only be ceded by all of them together and that the Ohio River must remain the boundary. The Miami towns of Kekionga, at the head of the Maumee, became a centre of the resistance. Its leaders included Little Turtle (Mihšihkinaahkwa) of the Miami, Blue Jacket (Weyapiersenwah) of the Shawnee, Buckongahelas of the Lenape and Egushawa of the Odawa. British officials at Detroit, which Britain refused to hand over while Americans failed to pay their pre-war debts and compensate Loyalists, kept them supplied with arms."
      - "Settlers and land companies crossed the Ohio, and war parties attacked them and the flatboats on the river, while Kentucky militia raided across it. In October 1786 Benjamin Logan’s Kentuckians burned the Shawnee towns on the Mad River; the elderly chief Moluntha, who had signed at Fort Finney and came out to meet them under an American flag, was killed by one of the officers. The Ohio Company founded Marietta in April 1788 and settlers founded Cincinnati that winter. A new treaty at Fort Harmar in January 1789 confirmed the cessions, but the Shawnee and Miami stayed away."
