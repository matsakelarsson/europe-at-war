id: patriot-revolt
name: Patriot revolt and the Prussian invasion of Holland
start: "1785"
end: "1787-10-10"
tier: C
summary: A struggle in the Dutch Republic between the Patriots, who wanted to curb the power of the stadtholder William V of Orange and his court, and the Orangists, which became a low-level civil war and ended with a Prussian invasion. From 1785 armed Patriot free corps took power in a number of towns and won majorities in the States of Holland, Groningen and Utrecht; William V left The Hague in September 1785, and in 1786 his troops occupied the Patriot towns of Hattem and Elburg in Guelders. On 9 May 1787 Patriot volunteers beat off troops loyal to the stadtholder at Jutphaas near Utrecht. When a Patriot free corps stopped William’s wife, Wilhelmina of Prussia, at Goejanverwellesluis on her way to The Hague on 28 June 1787, her brother, Frederick William II of Prussia, demanded satisfaction. With British backing, some 26,000 Prussian troops under the Duke of Brunswick invaded on 13 September; France, which had encouraged the Patriots, did nothing. Utrecht was abandoned without a fight, Amsterdam surrendered on 10 October, and William V was restored. Thousands of Patriots fled to France and the Austrian Netherlands, and many returned with the French armies in 1795.
