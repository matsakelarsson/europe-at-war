id: shays-rebellion
name: Shays’ Rebellion
start: "1786-08-29"
end: "1787-06"
tier: C
summary: "An armed uprising of farmers in western and central Massachusetts against debt collection and taxes after the American Revolution. Many farmers, a large number of them veterans of the war, were deep in debt, and the state, paying off its war debts to creditors in Boston and abroad, levied heavy taxes payable in hard money; courts seized farms and jailed debtors. After petitions failed, armed crowds who called themselves Regulators closed the county courts to stop the foreclosures, beginning at Northampton on 29 August 1786. Governor James Bowdoin raised an army of some 3,000 men under Benjamin Lincoln, paid for largely by Boston merchants. On 25 January 1787 rebels led by Daniel Shays, a former Continental Army captain, and Eli Parsons marched on the federal arsenal at Springfield; the state militia under William Shepard fired cannon into their column, killing four, and they fled. Lincoln surprised and scattered the main rebel force at Petersham on 4 February after a night march through a snowstorm, and a last clash near Sheffield on 27 February left two to four dead, by different counts. About 4,000 men accepted an amnesty; of those condemned to death, two were hanged for robbery in December 1787, and the rest, Shays among them, were pardoned. The voters replaced Bowdoin with John Hancock, and the legislature eased the burden of debt and taxes. The rising alarmed national leaders about the weakness of the government under the Articles of Confederation and added urgency to the Constitutional Convention that met in Philadelphia in May 1787."
