  - title: Fuk’anggan’s campaign
    date: December 1787 – March 1788
    when: "1787-12-10"
    borders: "1788-03-12"
    countries: [tw]
    body:
      - In the autumn of 1787 the Qianlong emperor put Fuk’anggan, one of his most trusted Manchu commanders, in charge, with Hailancha as his deputy, and gave them seasoned troops, Manchu bannermen and soldiers of the Green Standard from Sichuan, Guizhou, Hunan and Guangxi, about 8,000 or 9,000 men by most accounts. They landed at Lugang on 10 December. Moving south with the loyalist militias, Fuk’anggan broke the rebel lines and relieved Jiayi on 16 December, then turned north and stormed Lin’s base at Dali, fortified with palisades and bamboo, around the turn of the year.
      - Lin fled into the hills and was hunted through the foothills. He was taken at Laoqudi in the hills of Miaoli on 10 February 1788. Fuk’anggan then marched south against Zhuang Datian, who was cornered on the coast of the Hengchun peninsula at Langqiao and captured on 12 March. Lin Shuangwen was sent to Beijing and executed by slicing; Zhuang Datian, badly wounded, was executed in Taiwan. Relatives of the leaders were put to death or enslaved, and boys were castrated for service in the palace. Chai Daji, rewarded with a title for holding Jiayi, was later charged with misconduct after a quarrel with Fuk’anggan and beheaded in Beijing in August 1788.
      - After the war the Qing strengthened the garrison, rewarded the loyalist communities and the plains villages that had fought for them, and tightened control of the boundary with the mountain peoples. The rebellion, the largest of the many risings of Qing Taiwan, was commemorated in temples to Fuk’anggan and among the Ten Great Campaigns.
    facts:
      - [Fuk’anggan lands at Lugang, "10 December 1787"]
      - [Jiayi relieved, "16 December 1787"]
      - [Lin Shuangwen captured, "10 February 1788"]
      - [Zhuang Datian captured, "12 March 1788"]
