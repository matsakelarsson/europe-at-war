steps:
  - title: The rising of the Heaven and Earth Society
    date: January – November 1787
    when: "1787-01-16"
    borders: "1787-02-01"
    countries: [tw]
    body:
      - A century after the Qing conquest, Taiwan’s western plains were filling with settlers from Fujian and Guangdong, living in villages grouped by their home districts — Zhangzhou, Quanzhou or the Hakka districts of Guangdong — and often feuding with each other and with the plains peoples whose land they took. Government was thin and its garrison troops poorly paid. The Heaven and Earth Society, a sworn brotherhood for mutual protection that had spread from Fujian, gave settlers a network outside the state and talked of restoring the Ming. Lin Shuangwen, a farmer and carter at Dali (Dalidun) in Changhua county, became its leader in the district. In 1786 the authorities began arresting its members, and on 16 January 1787, when troops burned villages near Dali searching for them, Lin led the society into open revolt.
      - The rebels took the county seat of Changhua within days, killing Sun Jingsui, the prefect of Taiwan, who was there, and other officials. Allies took Zhuqian (Hsinchu) in the north, and Lin took Zhuluo on 24 January and proclaimed a reign, Shuntian (“obeying Heaven”), with himself as leader of the alliance. In the south Zhuang Datian rose and took the county seat of Fengshan on 31 January. By February the rebels held most of the western plains, except the prefectural city at Tainan and the port of Lugang. Many settlers of Quanzhou origin, the Hakka of the Liudui settlements in the south and of the Hsinchu hills, and many villages of the plains peoples formed militias, called yimin (“righteous people”), to fight them, and both sides burned the villages of the other.
      - Troops from Fujian under Huang Shijian and Ren Chengen arrived in the spring and recovered Fengshan and Zhuluo, but could not break the rebels; the governor-general of Fujian and Zhejiang, Changqing, came over in person and fared no better. Zhuluo, held by the Taiwan brigade commander Chai Daji, was besieged again and again through the year and most closely from the autumn, and Chai refused orders to give it up. In the autumn the emperor renamed it Jiayi (Chiayi), “commended for loyalty”.
