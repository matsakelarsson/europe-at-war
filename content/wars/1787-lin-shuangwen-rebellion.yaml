id: lin-shuangwen-rebellion
name: Lin Shuangwen rebellion
start: "1787-01-16"
end: "1788-03-12"
tier: B
summary: "The largest rising in Taiwan under Qing rule, led by Lin Shuangwen, a settler of Zhangzhou origin and a leader of the Heaven and Earth Society (Tiandihui), a sworn brotherhood that the authorities had begun to hunt down. When troops moved against the society around Dali in central Taiwan in January 1787, Lin rose, took the county seats of Changhua and Zhuluo and the town of Zhuqian, and proclaimed a reign of his own; in the south Zhuang Datian took Fengshan. Tens of thousands joined them, while settlers of Quanzhou origin, the Hakka and many villages of the plains peoples raised militias on the Qing side, and the war became in part a feud between communities. Qing reinforcements held the prefectural city, the port of Lugang and, after months of siege, Zhuluo, which the Qianlong emperor renamed Jiayi (“commended for loyalty”). Fuk’anggan landed at Lugang in December 1787 with fresh troops, relieved Jiayi, took Lin’s base at Dali and captured Lin in February 1788 and Zhuang in March. The leaders were executed. The court counted the campaign among the Ten Great Campaigns of the Qianlong reign; it is the rising dated 1786 in many lists, from the year in the Chinese calendar in which it began (the 51st year of Qianlong)."
