notes:
  - The rising began late in the 51st year of the Qianlong reign, in the 11th lunar month, which fell in January 1787; it is therefore often dated 1786–1788. Dates here are Gregorian, converted from the lunar dates of the Qing records, and some differ by a day or two between sources.
  - Numbers are uncertain. The Qing sent fewer than 40,000 soldiers to the island over the whole campaign; figures for the rebels range from the 30,000 or so who faced Fuk’anggan to claims of several hundred thousand supporters.
  - The Qing court celebrated the victory with a set of twelve copper engravings, “The Pacification of Taiwan”, made from paintings by court artists.
