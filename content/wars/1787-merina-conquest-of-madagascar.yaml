  - title: Radama I, Britain and the east coast
    date: 1810–1822
    when: "1817"
    borders: "1822-12-31"
    countries: [mg, mu]
    body:
      - "Radama I was about 17 when he succeeded his father. Britain had taken Mauritius from France in 1810, and its governor, Robert Farquhar, wanted to end the slave trade from Madagascar and to gain influence there. His envoy James Hastie negotiated a treaty, signed on 23 October 1817, by which Radama banned the export of slaves; in return Britain sent him each year money, arms, powder and uniforms, trained his soldiers and recognised him as King of Madagascar. The treaty lapsed when Farquhar’s deputy stopped the payments in 1818 and was renewed in 1820, when missionaries of the London Missionary Society came to Antananarivo to open schools and write down the Malagasy language."
      - "Radama built a standing army of musketeers drilled in the British manner. In 1817 he marched to the east coast, where the Betsimisaraka confederation founded by Ratsimilaho a century before had broken up into quarrelling chiefdoms. He took Toamasina, whose leading trader, Jean René, accepted his rule and became his governor, and Merina garrisons were posted along the coast. Revolts there were put down in the years that followed."
      - "In 1820, 1821 and 1822 Radama led large armies west against the Sakalava kingdom of Menabe. His troops suffered from hunger and disease in the dry country, and the Sakalava avoided pitched battle. King Ramitraho gave Radama his daughter Rasalimo in marriage to seal a peace, but Menabe was never conquered in his lifetime; its southern part fell to the Merina only in the 1830s."
    facts:
      - [Anglo-Merina treaty, "23 October 1817, renewed 1820"]
      - [Toamasina taken, "1817"]
      - [Campaigns against Menabe, "1820, 1821 and 1822"]
