notes:
  - "The history of Andrianampoinimerina’s reign rests mostly on Merina royal traditions written down in the nineteenth century (the Tantara ny Andriana), and its dates are approximate; his accession is usually dated 1787, sometimes 1785 or earlier. Radama I’s reign is also known from British and missionary records."
  - "Europeans of the time often called the Merina “Hova”, after the free commoner class of Merina society."
