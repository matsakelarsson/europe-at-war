  - title: Mahajanga, Fort Dauphin and Radama’s death
    date: 1823–1828
    when: "1824"
    borders: "1828-07-27"
    countries: [mg]
    body:
      - "Radama then turned on Boina, the northern Sakalava kingdom, which controlled the great north-western port of Mahajanga (Majunga) and its trade with Arab, Swahili and Indian merchants. In 1824 his army occupied Mahajanga and King Andriantsoly submitted; he later fled and in 1832 settled on Mayotte in the Comoros. The same year Merina posts were set up in the far north at Vohemar and Diego Suarez, and in 1825 Radama’s troops took the small French post at Fort Dauphin in the far south-east and set up posts at Farafangana on the south-east coast. His last campaign, in 1827, was against the Antaisaka of the south-east."
      - "Radama died on 27 July 1828, still in his thirties. He left a kingdom that held about two thirds of Madagascar, governed through Merina garrisons and officers in the conquered provinces, with an army fed by forced labour (fanompoana) and an economy that relied increasingly on slave labour as the wars brought captives to Imerina. The Sakalava of the west, the peoples of the south and parts of the east coast were still independent. His widow Ranavalona I continued the wars, and she broke with the British and the missionaries."
    facts:
      - [Mahajanga occupied, "1824"]
      - [Fort Dauphin taken from the French, "1825"]
      - [Death of Radama I, "27 July 1828"]
