steps:
  - title: Andrianampoinimerina unites Imerina
    date: about 1787–1810
    when: "1787"
    borders: "1810-07-06"
    countries: [mg]
    body:
      - "In the eighteenth century the Merina kingdom of the highlands around Antananarivo had split among the heirs of King Andriamasinavalona into four rival states, which fought each other for land, rice fields and captives. In about 1787 a prince of Ambohimanga, Ramboasalama, deposed his uncle Andrianjafy and took the throne under the name Andrianampoinimerina, “the prince in the heart of Imerina”."
      - "From his fortified hill town of Ambohimanga he won over or defeated the other Merina rulers one by one, through marriages, oaths and treaties as well as war. He took Antananarivo in 1793, and by about 1795 all of Imerina recognised him; he later moved his court to Antananarivo. He organised the drainage of the Betsimitatatra marshes for rice and drafted his subjects into public works, and pushed his rule south into Vakinankaratra and the Betsileo highlands and east over the Bezanozano, though his campaigns against the Sakalava failed."
      - "The wars produced captives, and the king sold many of them, perhaps about 1,800 a year, to slave traders, mainly French merchants who carried them to the plantations of Mauritius and Réunion, in return for muskets and powder. He died on 6 July 1810, leaving his son Radama, according to tradition, the charge that “the sea is the limit of my rice field”: all Madagascar should be Merina."
    facts:
      - [Accession at Ambohimanga, "about 1787"]
      - [Antananarivo taken, "1793"]
      - [Death of Andrianampoinimerina, "6 July 1810"]
