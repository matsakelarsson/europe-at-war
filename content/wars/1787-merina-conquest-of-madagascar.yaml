id: merina-conquest-of-madagascar
name: Merina conquest of Madagascar
start: "1787"
end: "1828-07-27"
tier: B
summary: "The wars in which the Merina kingdom of the central highlands united Imerina and conquered much of Madagascar. In about 1787 Andrianampoinimerina took power at Ambohimanga, one of four rival Merina kingdoms, and by diplomacy and war reunited Imerina, taking Antananarivo in 1793 and pushing south into the Betsileo country; he paid for firearms by selling captives to French slave traders for Mauritius and Réunion. His son Radama I (1810–1828) made Madagascar an ally of Britain: by the treaty of 23 October 1817 he banned the export of slaves in return for arms, money and military instructors, and Britain recognised him as King of Madagascar. With his new army he took the Betsimisaraka east coast and Toamasina (1817), fought the Sakalava of Menabe (1820–1822), took Mahajanga, the port of the Sakalava kingdom of Boina (1824), and Fort Dauphin in the far south (1825). When he died in 1828 the Merina ruled about two thirds of the island, though the Sakalava and the peoples of the south and west remained unconquered."
countries: [mg, mu]
sides:
