id: russo-turkish-war-1787
name: Russo-Turkish War of 1787–1792
start: "1787-08"
end: "1792-01-09"
tier: B
summary: An attempt by the Ottoman Empire to win back the Crimea, annexed by Russia in 1783, against Russia and, from 1788 to 1791, the Habsburg Monarchy. Russian armies and the new Black Sea Fleet won at Kinburn, Ochakov, Focșani, Rymnik, Izmail and at sea, and at Jassy in 1792 the Ottomans recognised the annexation and ceded the land between the Southern Bug and the Dniester.
