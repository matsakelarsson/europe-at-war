steps:
  - title: Kinburn and Ochakov
    date: 1787–1788
    when: "1787-08"
    borders: "1788-12-17"
    countries: [ua, ru, tr]
    body:
      - Russia had annexed the Crimean Khanate in 1783, and in the summer of 1787 Catherine II toured her new southern lands and the Crimea with her ally, Emperor Joseph II. In Constantinople the war party, encouraged by the British and French ambassadors, demanded that Russia give up the Crimea, and in August the Porte imprisoned the Russian ambassador, Yakov Bulgakov. On 12 October about 6,000 Ottoman troops landed on the Kinburn spit opposite Ochakov, at the mouth of the Dnieper. Alexander Suvorov, wounded twice in the fighting, drove them back into the sea.
      - Austria entered the war in February 1788. That summer Prince Grigory Potemkin laid siege to Ochakov. In June Russian oared ships under the Prince of Nassau-Siegen, with John Paul Jones commanding the sailing squadron, beat the Ottoman flotilla in the Dnieper estuary, and on 14 July the young Sevastopol squadron under Marko Voinovich and Fyodor Ushakov beat the Ottoman fleet off Fidonisi (Snake Island). Potemkin put off the assault for months while his troops suffered from disease and cold, and Ochakov was finally stormed on 17 December. Most of the garrison and many of the townspeople were killed. In the west, Russian and Austrian troops took Khotyn in September.
    facts:
      - [Battle of Kinburn, "12 October 1787, Russian victory"]
      - [Battle of Fidonisi, "14 July 1788, Russian naval victory"]
      - [Ochakov stormed, 17 December 1788]
    markers:
      - kind: battle
        side: ru
        name: Battle of Kinburn
        date: 12 October 1787
        text: Suvorov’s garrison and reserves destroyed an Ottoman landing force on the narrow spit after a day of hand-to-hand fighting.
        lonlat: [31.56, 46.57]
        lp: b
      - kind: taken
        side: ru
        name: Ochakov
        date: 17 December 1788
        text: Stormed after a six-month siege. The garrison commander was captured, and thousands of soldiers and civilians were killed.
        lonlat: [31.54, 46.62]
        lp: l
      - kind: naval
        side: ru
        name: Battles of the Liman
        date: June 1788
        text: Russian oared flotillas and Suvorov’s shore batteries destroyed much of the Ottoman flotilla in the Dnieper estuary.
        lonlat: [31.85, 46.6]
      - kind: naval
        side: ru
        name: Battle of Fidonisi
        date: 14 July 1788
        text: The first victory of the new Black Sea Fleet, won against a stronger Ottoman fleet.
        lonlat: [30.2, 45.26]
      - kind: taken
        side: ru
        name: Khotyn
        date: September 1788
        text: The Ottoman fortress on the Dniester surrendered to Austrian and Russian troops after a siege.
        lonlat: [26.49, 48.51]
    arrows:
      - side: ru
        label: Potemkin
        via: [[32.27, 48.5], [32.0, 47.5], [31.65, 46.72]]
  - title: Focșani and Rymnik
    date: 1789
    when: "1789-07"
    borders: "1789-11-15"
    countries: [ro, md, ua, at, ru, tr]
    body:
      - In 1789 the Ottomans, under a new sultan, Selim III, struck at the Austrians in Moldavia. Their commander, Prince Josias of Saxe-Coburg, called on Suvorov, whose corps lay at Bârlad. Suvorov marched about 60 km in little more than a day with 7,000 men, and on 1 August the allies routed some 30,000 Ottomans under Osman Pasha at Focșani. In September the grand vizier, Cenaze Hasan Pasha, advanced against Coburg with up to 100,000 men. Suvorov came again, and on 22 September about 25,000 Russians and Austrians attacked and broke the Ottoman army on the Râmnic river. Suvorov was made a count, with the title Rymniksky.
      - The Austrians went on to take Belgrade and occupy Wallachia, entering Bucharest in November. Potemkin’s army cleared the Ottomans from the Dniester. On 25 September a detachment under José de Ribas took the castle of Hajibey on the coast, where the city of Odesa was founded in 1794, Akkerman surrendered in October, and Bender gave up without a fight in November.
    facts:
      - [Battle of Focșani, "1 August 1789, allied victory"]
      - [Battle of Rymnik, "22 September 1789, allied victory"]
      - [Bender surrendered, November 1789]
    markers:
      - kind: battle
        side: ru
        name: Battle of Focșani
        date: 1 August 1789
        text: Suvorov and Coburg attacked together and drove the Ottomans from their entrenched camp.
        lonlat: [27.18, 45.7]
      - kind: battle
        side: ru
        name: Battle of Rymnik
        date: 22 September 1789
        text: Outnumbered about four to one, the allies attacked in squares and routed the grand vizier’s army.
        lonlat: [27.06, 45.39]
      - kind: taken
        side: hb
        name: Bucharest
        date: November 1789
        text: Austrian troops occupied the Wallachian capital and held it until the peace of 1791.
        lonlat: [26.1, 44.43]
      - kind: taken
        side: ru
        name: Hajibey
        date: 25 September 1789
        text: De Ribas took the small Ottoman castle by surprise. Odesa was built on the site.
        lonlat: [30.73, 46.48]
      - kind: taken
        side: ru
        name: Akkerman
        date: October 1789
        text: The fortress at the mouth of the Dniester surrendered to Potemkin’s army.
        lonlat: [30.35, 46.18]
        lp: l
      - kind: taken
        side: ru
        name: Bender
        date: November 1789
        text: The garrison surrendered without a fight as Potemkin’s army approached.
        lonlat: [29.47, 46.83]
    arrows:
      - side: ru
        label: Suvorov
        via: [[27.67, 46.23], [27.4, 45.95], [27.22, 45.73]]
      - side: ru
        via: [[27.67, 46.2], [27.3, 45.7], [27.08, 45.43]]
      - side: hb
        label: Coburg
        via: [[26.95, 46.1], [27.05, 45.85], [27.15, 45.73]]
  - title: Izmail and the Peace of Jassy
    date: 1790–1792
    when: "1790-07"
    borders: "1792-01-09"
    countries: [ua, ro, bg, ru, tr]
    body:
      - After Joseph II died in 1790, Austria agreed a truce and left the war at Sistova in 1791. At sea Ushakov beat the Ottoman fleet in the Kerch Strait in July 1790 and off Tendra in September. In December Potemkin sent Suvorov to Izmail, the great Ottoman fortress on the Danube, which had held out against a Russian siege. Suvorov drilled his troops on mock ramparts, sent the commander an ultimatum, and on 22 December stormed the walls. Almost the whole garrison, more than 26,000 men, was killed or wounded, and many townspeople died in the sack that followed. Russian losses were at least 4,000.
      - In 1791 Prince Nikolai Repnin beat the grand vizier at Măcin on 9 July, Ushakov beat the Ottoman fleet off Cape Kaliakra on 11 August, and in the Kuban Ivan Gudovich stormed Anapa. Britain threatened war to make Russia give up Ochakov, but backed down. Potemkin died near Iași in October, and Alexander Bezborodko signed the Treaty of Jassy on 9 January 1792. The Ottomans recognised the annexation of the Crimea and ceded Yedisan, the land between the Bug and the Dniester with Ochakov, making the Dniester the border. Russia gave back its other conquests, including Bender, Akkerman and Izmail.
    facts:
      - [Storming of Izmail, "22 December 1790, Russian victory"]
      - [Battle of Măcin, "9 July 1791, Russian victory"]
      - [Treaty of Jassy, "9 January 1792; Russia gains Yedisan"]
    markers:
      - kind: naval
        side: ru
        name: Battle of Tendra
        date: 8–9 September 1790
        text: Ushakov attacked the Ottoman fleet at anchor off the Tendra spit and took or destroyed several ships.
        lonlat: [31.83, 46.2]
      - kind: taken
        side: ru
        name: Izmail
        date: 22 December 1790
        text: Suvorov’s columns stormed the walls before dawn. The fighting went on in the streets for hours, and few of the defenders survived.
        lonlat: [28.83, 45.35]
      - kind: battle
        side: ru
        name: Battle of Măcin
        date: 9 July 1791
        text: Repnin crossed the Danube and beat a much larger Ottoman army under the grand vizier, Koca Yusuf Pasha.
        lonlat: [28.12, 45.25]
        lp: b
      - kind: naval
        side: ru
        name: Battle of Cape Kaliakra
        date: 11 August 1791
        text: Ushakov’s last battle of the war, fought against the Ottoman fleet off the Bulgarian coast.
        lonlat: [28.6, 43.37]
      - kind: taken
        side: ru
        name: Anapa
        date: 3 July 1791
        text: Gudovich stormed the Ottoman fortress on the Circassian coast. It was given back at the peace.
        lonlat: [37.32, 44.89]
      - kind: treaty
        name: Treaty of Jassy
        date: 9 January 1792
        text: Signed in the Moldavian capital after Potemkin’s death, confirming Russia’s hold on the Crimea and the northern Black Sea coast.
        lonlat: [27.59, 47.16]
