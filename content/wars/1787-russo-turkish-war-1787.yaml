notes:
  - Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date the storming of Izmail 11 December 1790 and the Treaty of Jassy 29 December 1791.
  - Austria’s campaigns against the Ottomans in Serbia and Bosnia are not followed here. Sweden’s attack on Russia in 1788 is told in the Russo-Swedish War of 1788–1790.
