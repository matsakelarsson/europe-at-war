  - title: Belgrade and the Peace of Sistova
    date: 1789–1791
    when: "1789-08-01"
    borders: "1791-08-04"
    countries: [rs, ro, bg, at, hu, tr]
    body:
      - Joseph, ill since the campaign of 1788, gave the main army to the 72-year-old Laudon in July 1789. On 1 August Austrian troops under Prince Josias of Saxe-Coburg and Russians under Alexander Suvorov beat the Ottomans at Focșani in Moldavia, and on 22 September they routed the grand vizier’s army on the Rymnik. Laudon crossed the Sava in mid-September and besieged Belgrade with more than 200 guns. After three weeks of bombardment Osman Pasha surrendered on 8 October in return for free passage for his garrison. Habsburg troops occupied much of Serbia, and in November Coburg entered Bucharest and occupied Wallachia.
      - Joseph II died on 20 February 1790. His brother Leopold II faced revolt in the Austrian Netherlands, unrest in Hungary and a Prussian army gathered on the Silesian border, and Prussia had allied with the Ottomans. At Reichenbach on 27 July 1790 he agreed to make peace on the basis of the pre-war borders, and an armistice followed at Giurgiu in September. By the Treaty of Sistova, signed on 4 August 1791 under British, Prussian and Dutch mediation, Austria gave back Belgrade, Serbia and Wallachia, keeping only Old Orsova and a strip of the Croatian border. The Serbs who had fought for Austria were left to the Ottomans, and many turned their hopes to Russia.
    facts:
      - [Siege of Belgrade, "15 September – 8 October 1789, Habsburg victory"]
      - [Convention of Reichenbach, "27 July 1790"]
      - [Treaty of Sistova, "4 August 1791"]
    markers:
      - kind: battle
        side: hb
        name: Focșani
        date: 1 August 1789
        text: Coburg’s Austrians and Suvorov’s Russians, joined just in time, defeated an Ottoman army in southern Moldavia.
        lonlat: [27.18, 45.7]
      - kind: battle
        side: hb
        name: Rymnik
        date: 22 September 1789
        text: Suvorov and Coburg routed Koca Yusuf Pasha’s much larger army, opening Wallachia to the Austrians.
        lonlat: [27.061, 45.392]
        lp: l
      - kind: taken
        side: hb
        name: Belgrade
        date: 8 October 1789
        text: Laudon’s army took the suburbs at the end of September, and the fortress surrendered after a heavy bombardment. It was handed back in 1791.
        lonlat: [20.457, 44.818]
      - kind: taken
        side: hb
        name: Bucharest
        date: November 1789
        text: Coburg’s troops occupied the Wallachian capital and held the principality until the peace.
        lonlat: [26.104, 44.432]
      - kind: treaty
        name: Treaty of Sistova
        date: 4 August 1791
        text: Restored the pre-war border apart from Old Orsova and a few small districts on the Croatian–Bosnian border. It was the last Habsburg–Ottoman peace treaty.
        lonlat: [25.35, 43.617]
