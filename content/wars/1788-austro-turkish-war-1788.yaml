notes:
  - Dates are New Style (Gregorian).
  - Russia’s war with the Ottomans in 1787–1792 is told in the Russo-Turkish War of 1787–1792; the battles of Focșani and Rymnik, won jointly by Austrian and Russian troops, appear in both.
  - Karánsebes is today’s Caransebeș in Romania, and Sistova is Svishtov in Bulgaria.
