steps:
  - title: Šabac, the Banat and Karánsebes
    date: February – December 1788
    when: "1788-02-09"
    borders: "1788-10-03"
    countries: [rs, ro, ba, hr, at, hu, tr]
    body:
      - Joseph II had allied with Catherine II of Russia in 1781, and when the Ottomans declared war on Russia in August 1787 he was bound to join in. Austria declared war on 9 February 1788. Joseph went to the front himself and spread his armies along the whole border from Croatia to Galicia, waiting for the Russians to draw off the Ottoman forces. He took Šabac on the Sava in April but went no further, and through the summer malaria and dysentery spread in the camps on the marshy banks of the Danube; by some accounts half the army was sick, and thousands died. Serbian refugees and volunteers formed a Free Corps, whose captains, among them Koča Anđelković, raised much of the country around Smederevo.
      - In August the grand vizier, Koca Yusuf Pasha, crossed the Danube into the Banat, took Mehadia and burned villages, and tens of thousands of Serbs and Romanians fled north. Joseph marched against him, but on the night of 21–22 September, near Karánsebes, his retreating columns panicked and fired on each other in the dark. Later accounts of thousands killed by their own side are not borne out by contemporary reports, but the Ottomans took Karánsebes and ravaged the Banat before the winter. In Croatia, Field Marshal Ernst Gideon von Laudon did better, taking the Bosnian border forts of Dubica and Novi on the Una.
    facts:
      - [Austria declares war, "9 February 1788"]
      - [Šabac taken, "April 1788"]
      - [Panic at Karánsebes, "night of 21–22 September 1788"]
