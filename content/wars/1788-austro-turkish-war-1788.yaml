id: austro-turkish-war-1788
name: Austro-Turkish War of 1788–1791
start: "1788-02-09"
end: "1791-08-04"
tier: B
summary: The last war between the Habsburg Monarchy and the Ottoman Empire, fought by Joseph II as Russia’s ally. After a disastrous first year, in which disease swept the Habsburg camps and an Ottoman army invaded the Banat, Field Marshal Laudon took Belgrade in 1789 and Austrian troops helped the Russians win at Focșani and Rymnik; but under Prussian pressure Leopold II made peace at Sistova in 1791 and gave back almost everything.
