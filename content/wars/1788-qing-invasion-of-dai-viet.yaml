notes:
  - The size of the Qing army is disputed. Estimates in the sources range from 10,000 Qing soldiers with 100,000 Vietnamese Lê loyalists (Peter Perdue) and about 36,000 (a French missionary in 1789) to 200,000 (the Nguyễn chronicle) and 300,000 (another missionary); Sun Shiyi is said to have boasted of 500,000. Losses are equally uncertain. Dates are the Gregorian equivalents of the lunar dates in the English sources cited.
  - Chinese historians have described the Qing aim as the restoration of a legitimate tributary king; Vietnamese historians argue that the Qianlong Emperor meant to make Đại Việt a dependency with Qing garrisons and Lê Chiêu Thống as a puppet king.
