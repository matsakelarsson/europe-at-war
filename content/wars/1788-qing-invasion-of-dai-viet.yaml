  - title: Ngọc Hồi and Đống Đa
    date: December 1788 – February 1789
    when: "1789-01"
    borders: "1789-01-30"
    countries: [vn, cn]
    body:
      - On 22 December 1788 Nguyễn Huệ had himself proclaimed emperor as Quang Trung on a hill south of Phú Xuân and marched north, raising more men in Nghệ An; the sources give him up to 100,000 men and about 100 war elephants. At Tam Điệp on 15 January 1789 he divided his army into five columns, two of them by water through the delta. The army celebrated the New Year early, crossed the Hoàng Long River on New Year’s Eve and on the night of 28 January took the Qing post at Hà Hồi. At dawn on 30 January Quang Trung, riding an elephant, led the assault on the fortified Qing camp at Ngọc Hồi, with soldiers shielded by bundles of wet wood; the camp was overrun, and another column took the camp at Đống Đa on the south-western edge of the city.
      - The Qing army broke and fled across the Red River, where many drowned. The generals Xu Shiheng, Shang Weisheng, Zhang Chaolong and Cen Yidong were killed; Sun Shiyi fled with a few men, losing his seal of office, and Lê Chiêu Thống fled with him to China. Wu Dajing’s army from Yunnan, at Sơn Tây, withdrew in good order. The missionary Charles La Mothe put the Qing dead at 40,000 to 50,000, and the Draft History of Qing says more than half the army died; the Tây Sơn lost more than 8,000 killed. Quang Trung at once wrote in submissive terms to the Qianlong Emperor, who in 1789 recognised him as king of Annam and abandoned Lê Chiêu Thống, who died in China in 1793.
    facts:
