id: qing-invasion-of-dai-viet
name: Qing invasion of Đại Việt
start: "1788-11"
end: "1789-02"
tier: B
summary: "The Qing intervention to restore the last Lê emperor, Lê Chiêu Thống, who had fled from the Tây Sơn and appealed to the Qianlong Emperor. In November 1788 armies from Guangxi under the governor-general Sun Shiyi and from Yunnan under Wu Dajing crossed the border, and the Tây Sơn garrison of the north fell back to the Tam Điệp pass; on 17 December the Qing entered Thăng Long and installed Lê Chiêu Thống as king. Nguyễn Huệ answered by proclaiming himself Emperor Quang Trung at Phú Xuân on 22 December and marching north, gathering troops on the way. Over the Lunar New Year his army stormed the Qing forts south of the capital, at Hà Hồi, Ngọc Hồi and Đống Đa, and on 30 January 1789 retook Thăng Long. Several Qing generals were killed, and Sun Shiyi and Lê Chiêu Thống fled to China. Quang Trung then sought peace, and the Qianlong Emperor recognised him as king of Annam later in 1789. Vietnam remembers the battle as one of its greatest victories; in China the campaign was counted among Qianlong’s Ten Great Campaigns."
countries: [vn, cn]
