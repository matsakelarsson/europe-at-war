      - [Battle of Ngọc Hồi–Đống Đa, "30 January 1789, Tây Sơn victory"]
      - [Qing dead, "more than half the army (Qing history); 40,000–50,000 (La Mothe)"]
      - [Tây Sơn dead, "more than 8,000"]
