steps:
  - title: The Qing take Thăng Long
    date: November – December 1788
    when: "1788-12"
    borders: "1788-12-17"
    countries: [vn, cn]
    body:
      - After the Tây Sơn general Vũ Văn Nhậm took Thăng Long in late 1787, Lê Chiêu Thống hid in the hills, and his mother and son fled to Longzhou in Guangxi to ask the Qing for help. Sun Shiyi, governor-general of Guangdong and Guangxi, persuaded the Qianlong Emperor that restoring the Lê would be easy. In November 1788 the Guangxi army under Sun Shiyi and Xu Shiheng crossed the Nam Quan pass and the Yunnan army under Wu Dajing came down from the Horse Pass (Maguan). Sun proclaimed that a much larger army was following and promised office to those who helped him, and Lê loyalists rose against the Tây Sơn.
      - The Qing defeated the Tây Sơn at Lạng Sơn and pushed south. The Tây Sơn commander in the north, Ngô Văn Sở, on the advice of the scholar Ngô Thì Nhậm, abandoned Thăng Long and withdrew in good order to the Tam Điệp pass on the border of Thanh Hóa, after his general Phan Văn Lân was beaten on the Cầu River. The Qing crossed the Red River on 16 December and entered the capital unopposed the next morning, and Sun Shiyi invested Lê Chiêu Thống as king of Annam. The Qing generals settled in for the New Year, planning to march on Phú Xuân afterwards.
    facts:
      - [Qing armies cross the border, "November 1788"]
      - [Thăng Long entered, "17 December 1788"]
      - [Qing army, "10,000 to 300,000 or more (estimates)"]
