id: russo-swedish-war-1788
name: Gustav III’s Russian War
start: "1788"
end: "1790"
tier: B
summary: Gustav III’s attempt to win back land from Russia while it was fighting the Ottomans, which briefly brought Denmark–Norway into the war as Russia’s ally. After sea battles in the Gulf of Finland, including the great Swedish victory at Svensksund, the Treaty of Värälä in 1790 restored the pre-war borders.
