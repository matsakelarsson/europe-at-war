    body:
      - Gustav III attacked Russia in June 1788 while it was busy fighting the Ottomans, hoping for a quick success. On 17 July the Swedish and Russian battle fleets fought an indecisive battle off Hogland in the Gulf of Finland, and the plan to land near St Petersburg came to nothing. In August officers of the army in Finland signed the Anjala declaration and wrote to Catherine II behind the king’s back.
      - Denmark–Norway, Russia’s ally, then invaded western Sweden from Norway in September 1788. Within a week the invaders took Uddevalla, Vänersborg and Åmål, but they were stopped at Gothenburg and soon withdrew under British and Prussian pressure. Swedes call it the Theatre War. In 1789 a Russian galley fleet beat the Swedish one at the first Battle of Svensksund on 24 August.
    facts:
      - - Battle of Hogland
        - 17 July 1788, indecisive
      - - Theatre War
        - Danish–Norwegian invasion, autumn 1788
