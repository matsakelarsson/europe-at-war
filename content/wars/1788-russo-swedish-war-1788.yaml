  - title: Vyborg Bay and Svensksund
    date: "1790"
    when: "1790"
    borders: "1788"
    countries:
      - se
      - dk
      - no
      - fi
      - ru
    view:
      center:
        - 27.0767
        - 60.5257
      size:
        - 345
        - 228
    body:
      - In 1790 Gustav III tried again to strike at St Petersburg by sea. The Swedish battle fleet and galley fleet, with the king aboard, were trapped by the Russians in the Bay of Viborg for a month. On 3–4 July they broke out through the Russian lines, but lost six ships of the line and four frigates.
      - Days later, on 9–10 July 1790, the Swedish galley fleet turned on its pursuers at Svensksund and won the biggest naval victory in Swedish history, the largest naval battle ever fought in the Baltic. Russia agreed to talk, and the Treaty of Värälä on 14 August 1790 ended the war without any change of borders.
    facts:
      - - Second Battle of Svensksund
        - 9–10 July 1790
      - - Treaty of Värälä
        - 14 August 1790, no border changes
