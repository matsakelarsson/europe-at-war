id: sino-nepalese-war
name: Sino-Nepalese War
start: "1788"
end: "1792-10"
tier: B
summary: "Two Nepalese invasions of Tibet and a Qing counter-invasion of Nepal. Disputes over the silver coins Nepal minted for Tibet, over trade and salt, and over the refuge Nepal gave to the Tenth Shamarpa led the Gorkha kingdom to send armies over the Himalayan passes in 1788. Tibet bought peace in 1789 with a promise of yearly payments, and when it stopped paying the Nepalese invaded again in 1791 and plundered Tashilhunpo, the monastery of the Panchen Lamas at Shigatse. The Qianlong emperor sent an army under Fuk’anggan, which drove the Nepalese out of Tibet in 1792 and advanced down the Trishuli valley to within about 35 km of Kathmandu. After heavy fighting near Betrawati both sides made peace in October 1792: Nepal returned plunder from Tashilhunpo and sent tribute missions to Beijing every five years until 1908, and the Qing tightened their hold on Tibet."
countries: [np, cn]
sides:
  - id: np
    name: Kingdom of Nepal (Gorkha)
    polities: [nepal]
    ink: purple
    moves: Nepalese moves
    success: Nepalese success
  - id: tib
    name: Tibet
    polities: [tibet]
    ink: slate
    moves: Tibetan moves
    success: Tibetan success
  - id: qing
    name: Qing China
    polities: [china]
    ink: gold
    moves: Qing moves
    success: Qing success
notes:
  - Nepalese, Tibetan and Chinese sources date the events in different calendars and often disagree on numbers and on the exact dates of the battles and the peace; the dates here are approximate.
  - The Qing court counted the war among the Ten Great Campaigns of the Qianlong emperor. Tibet was then governed by the Dalai Lama’s government under the supervision of two Qing residents (ambans) in Lhasa.
  - The towns on the passes are given by their Tibetan names, with the Nepalese names in brackets (Nyalam for Kuti, Kyirong for Kerung, Shigatse for Digarcha).
