  - title: The sack of Tashilhunpo
    date: August – October 1791
    when: "1791-08"
    borders: "1791-10-01"
    countries: [np, cn]
    body:
      - When Tibet stopped paying, talks were held again at the border in 1791. They broke down, and the Nepalese seized Tibetan officials. In August 1791 Nepalese armies under Abhiman Singh Basnyat and Damodar Pande crossed the passes once more. One column marched across the plateau, reached Shigatse in late September and plundered Tashilhunpo, the great monastery of the Panchen Lamas, carrying off its treasures. The young Seventh Panchen Lama had been taken to safety before they arrived.
      - The plunder of the monastery of a lama the emperor honoured, and Tibet’s appeal for help, brought a quick response from Beijing, where the Qianlong emperor now learned how the 1789 settlement had been reached. He gave command of a new expedition to Fuk’anggan, one of his most trusted generals, with Hailancha as his deputy. The Nepalese, laden with loot and facing the Tibetan winter, fell back to the passes of Nyalam and Kyirong.
    facts:
      - [Second invasion, "August 1791"]
      - [Tashilhunpo plundered, "September–October 1791"]
