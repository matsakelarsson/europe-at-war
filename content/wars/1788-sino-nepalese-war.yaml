  - title: Fuk’anggan’s march on Kathmandu
    date: January – October 1792
    when: "1792-06"
    borders: "1792-10-01"
    countries: [np, cn]
    body:
      - Fuk’anggan’s army, about 10,000 Manchu bannermen and troops from Sichuan and elsewhere, with Tibetan levies, crossed the plateau in the winter of 1791–1792 and reached Lhasa in about sixty days. Some accounts give larger numbers. In the spring it gathered near Shigatse, and in June 1792 it attacked the Nepalese at the passes and drove them out of Kyirong and Nyalam.
      - Fuk’anggan then crossed into Nepal by the Rasuwa route and fought his way down the Trishuli valley, storming one Nepalese stockade after another. By August his army had reached Dhaibung and the Betrawati river, a short march from the old Gorkha stronghold of Nuwakot and about 35 km from Kathmandu. Nepal was fighting on other fronts at the same time, against Sikkim in the east and Garhwal in the west, and its appeal to the East India Company brought only an offer to mediate; the Company’s envoy, Captain William Kirkpatrick, reached Kathmandu in 1793, after the war was over.
      - In September Nepalese counter-attacks near Betrawati inflicted heavy losses on the Qing army, which was far from its bases, short of supplies and facing the monsoon. Both sides wanted peace, and a settlement was reached at Betrawati in October 1792. Nepal returned plunder from Tashilhunpo, gave up the 1789 payments and agreed to send a tribute mission to Beijing every five years; the Qing army withdrew without taking Nepalese land. In 1793 an imperial ordinance strengthened the ambans in Lhasa, took the minting of Tibet’s coins out of Nepalese hands and introduced the Golden Urn for choosing high reincarnations. Nepal sent its missions until 1908, and fought Tibet again in 1855–1856.
    facts:
      - [Qing army, "about 10,000 men, with Tibetan levies"]
      - [Nepalese driven from Tibet, "June 1792"]
      - [Farthest Qing advance, "Betrawati, August–September 1792"]
      - [Peace of Betrawati, "October 1792"]
