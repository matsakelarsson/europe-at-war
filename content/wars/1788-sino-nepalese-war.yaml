steps:
  - title: Coins, salt and the first invasion
    date: 1788–1789
    when: "1788"
    borders: "1788-12-01"
    countries: [np, cn]
    body:
      - For two centuries the Malla kings of the Kathmandu valley had minted the silver coins used in Tibet, and Newar merchants dominated the trade between Tibet and India over the passes of Nyalam (Kuti) and Kyirong (Kerung). After the Gorkha conquest of the valley, the new government struck coins of purer silver and asked Tibet to exchange the old, debased Malla coins at a rate Tibet would not accept. Nepal also complained that Tibet sold it adulterated salt. A further quarrel came when the Tenth Shamarpa, Mipham Chödrup Gyatso, a brother of the late Sixth Panchen Lama, fell out with the Tibetan authorities over the Panchen Lama’s wealth, fled to Kathmandu and urged the Gorkhalis to act.
      - In the summer of 1788 the regent Bahadur Shah sent armies over both passes. They took Nyalam, Kyirong and Dzongka and pushed on towards Shigatse, defeating a Tibetan force at Shelkar (Shikarjong). The Qianlong emperor sent troops from Sichuan, but his officials in Tibet preferred to buy peace. At talks in Kyirong in 1789, Tibetan representatives promised Nepal a yearly payment of 50,001 rupees in return for the Gorkhalis’ withdrawal, while the Qing commanders reported to Beijing that Nepal had submitted. Tibet paid the first year’s sum and then stopped.
    facts:
      - [First invasion, "summer 1788"]
      - [Settlement of Kyirong (Kerung), "1789"]
      - [Tibetan payment promised, "50,001 rupees a year"]
