id: brabant-revolution
name: Brabant Revolution
start: "1789-10"
end: "1790-12"
tier: C
summary: A revolt in the Austrian Netherlands against the reforms of the Emperor Joseph II, which many saw as an attack on the Catholic Church and on the provinces’ old privileges. Exiles gathered a small army in the Dutch Republic, which crossed the border and beat the Austrians at Turnhout on 27 October 1789. Risings followed across the country, and by the end of the year the Austrian troops had withdrawn to Luxembourg. On 11 January 1790 the rebel provinces declared independence as the United Belgian States, but no power recognised them, and the conservative Statists of Henri Van der Noot, backed by the Church, drove out the liberal Vonckists of Jan Frans Vonck. Joseph’s successor, Leopold II, stopped fighting the Ottomans and came to terms with Prussia at Reichenbach in July 1790; his troops beat the Belgian army at Falmagne in September and reoccupied the country, entering Brussels in early December 1790.
