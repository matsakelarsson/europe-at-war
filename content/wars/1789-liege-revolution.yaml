id: liege-revolution
name: Liège Revolution
start: "1789-08-18"
end: "1791-01"
tier: C
summary: A revolution in the Prince-Bishopric of Liège, an ecclesiastical state of the Holy Roman Empire, which began on 18 August 1789, five weeks after the fall of the Bastille. Townspeople took over the city hall and installed new burgomasters, and the prince-bishop, César-Constantin-François de Hoensbroeck, fled to Trier. The Imperial Chamber Court at Wetzlar ordered his restoration and called on neighbouring princes to enforce it. Prussian troops occupied Liège at the end of 1789 but showed sympathy for the revolutionaries and withdrew in 1790, and the Liégeois held off the troops of other imperial princes through that year. After Leopold II had crushed the Brabant Revolution, Austrian troops entered Liège in January 1791 and restored the prince-bishop. French armies overran the country in 1792 and again in 1794, and France annexed it in 1795.
