id: menashi-kunashir-rebellion
name: Menashi–Kunashir rebellion
start: "1789"
end: "1789"
tier: C
summary: "An Ainu rising on Kunashir and in the Menashi district on the facing coast of eastern Ezo (Hokkaido). By the 18th century the Matsumae domain let Japanese merchants run its trading posts in return for a fee, and in 1788 the merchant Hidaya Kyūbei began fishing for salmon and trout in the Menashi–Kunashir area with Ainu labour. Ainu workers were driven so hard that they could not lay up food for the winter, supervisors took Ainu wives as mistresses, and rumours spread that Ainu had been poisoned. In the fifth month of 1789 (May–June), while the Kunashir chief Tsukinoe was away hunting sea otters on Urup, young Ainu killed 71 Japanese, 22 on Kunashir and the rest in Menashi and on ships, all of them Hidaya’s employees except one Matsumae soldier. The daimyo Matsumae Michihiro sent about 260 men with firearms, who reached Nokkamappu near Nemuro on 8 July 1789. There was no battle: Tsukinoe, Ikotoi of Akkeshi and Shonko of Nokkamappu persuaded the rebels to lay down their arms, 314 Ainu came in, and 37 men named as leaders were put to death at Nokkamappu. The Matsumae had portraits painted of twelve chiefs who had helped them (the Ishūretsuzō of Kakizaki Hakyō). It was the last large armed rising of the Ainu. Concern that Russian traders were reaching the Ainu of the Kurils was one of the reasons the shogunate took eastern Ezo under its own rule in 1799."
