steps:
  - title: The richest colony and the free people of colour
    date: 1789 – February 1791
    when: "1790-10"
    borders: "1790-10-28"
    countries: [ht, fr]
    body:
      - In 1789 Saint-Domingue, the western third of Hispaniola, which Spain had ceded to France in 1697, was the most profitable colony in the Americas. Its plantations produced about 40 per cent of the sugar imported by France and Britain and about 60 per cent of the world’s coffee. The colonial censuses counted about 40,000 white people, about 28,000 free people of colour and about 450,000 enslaved people, two-thirds of them born in Africa; every year tens of thousands more captives were brought from West and Central Africa to replace those who died of overwork, disease and punishment. The colony had three provinces, the North around the port of Cap-Français (Le Cap), with the largest sugar plantations, the West with the capital Port-au-Prince, and the South around Les Cayes. The enslaved resisted by running away (marronage), and the maroon leader François Mackandal was burned at Le Cap in 1758.
      - The French Revolution split colonial society. The great planters wanted self-government and free trade, the poorer whites (petits blancs) wanted power over the royal officials, and the free people of colour, many of them landowners and some of them slave owners themselves, wanted the equal rights that the Declaration of the Rights of Man seemed to promise. A colonial assembly that met at Saint-Marc in 1790 claimed to govern the colony until the governor dispersed it, while the National Assembly in Paris left the rights of the free people of colour unclear.
      - In October 1790 Vincent Ogé, a merchant of colour who had campaigned in Paris with Julien Raimond, returned to the colony and with Jean-Baptiste Chavannes gathered about 300 free men of colour near Grande-Rivière, south of Le Cap, to demand the vote. After beating off a first force they were routed by about 1,500 colonial troops and fled into Spanish Santo Domingo, where they were arrested at Hinche and handed over. Ogé and Chavannes were broken on the wheel at Le Cap in February 1791. On 15 May 1791 the National Assembly gave political rights to free men of colour born of free parents; the colonists refused to apply the decree, and that summer free men of colour in the West, among them André Rigaud and Louis-Jacques Beauvais, took up arms.
    facts:
      - [Enslaved people in 1789, "about 450,000 (colonial census)"]
      - [Ogé’s rising, "October–November 1790"]
      - [Rights for some free men of colour, "decree of 15 May 1791"]
