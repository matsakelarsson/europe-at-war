  - title: The war of independence
    date: July 1802 – October 1803
    when: "1802-10-13"
    borders: "1803-05-18"
    countries: [ht, fr, gb]
    body:
      - In the summer of 1802 news reached Saint-Domingue that the French had restored slavery in Guadeloupe after crushing the resistance there, and that a law of 20 May had kept it in the colonies where it had never been abolished. Leclerc’s campaign to disarm the cultivators drove more of them to join the bands that had never surrendered, led by African-born commanders such as Sans-Souci, Macaya and Petit-Noël Prière and, in the West, Lamour Dérance. Yellow fever was destroying Leclerc’s army; by the autumn only some 8,000 to 10,000 of his men were fit to serve. From August Black and colonial troops deserted, and on 13 October 1802 Pétion and Clervaux went over to the revolutionaries at Haut-du-Cap, followed by Christophe and Dessalines. Leclerc died of yellow fever on the night of 1–2 November 1802.
      - His successor, Donatien de Rochambeau, waged a war of terror. Black soldiers and civilians were shot, hanged and drowned by the hundreds in the harbour of Le Cap, and dogs bought in Cuba were set on prisoners. The revolutionaries answered in kind, killing white prisoners and colonists, and the war became one of extermination on both sides. France kept sending reinforcements, among them some 5,000 Polish legionnaires, some of whom went over to the revolutionaries.
      - In May 1803 the revolutionary leaders met at Arcahaie and recognised Dessalines as commander-in-chief of what they called the Armée indigène; by tradition the red and blue flag was made there on 18 May by tearing the white out of the French tricolour. On the same day Britain declared war on France again, and the Royal Navy blockaded the French ports and traded arms to the revolutionaries. The Armée indigène took Les Cayes and, in October, Port-au-Prince; by November the French held only Le Cap and Môle Saint-Nicolas.
    facts:
      - [Pétion and Clervaux go over, "13 October 1802"]
      - [Leclerc dies, "1–2 November 1802"]
      - [Congress of Arcahaie, "May 1803"]
