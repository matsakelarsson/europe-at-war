id: haitian-revolution
name: Haitian Revolution
start: "1791-08-22"
end: "1804-01-01"
tier: A
summary: "The revolution in which the enslaved people of Saint-Domingue, the French colony in the western third of Hispaniola and the richest colony in the Americas, overthrew slavery and French rule and founded Haiti, the first independent state in the Americas created by formerly enslaved people. Free people of colour led by Vincent Ogé took up arms for equal rights in 1790; on the night of 22–23 August 1791, about a week after the gathering at Bois Caïman, the enslaved people of the Northern Plain rose. In 1793, with Spain and Britain at war with the French Republic and invading the colony, the French commissioners Léger-Félicité Sonthonax and Étienne Polverel proclaimed the end of slavery, and on 4 February 1794 the National Convention abolished it in all French colonies. Toussaint Louverture, who had fought for Spain, joined the Republic in 1794, drove out the Spanish and, with André Rigaud, the British (1798), defeated Rigaud in the War of the South (1799–1800), took over Spanish Santo Domingo (1801) and gave the colony a constitution that made him governor for life. Napoleon Bonaparte sent an army under Charles Leclerc in 1802; Toussaint was captured and deported and died in a French prison, but when it became clear that France meant to restore slavery, the former slaves and the free people of colour rose again under Jean-Jacques Dessalines, Henri Christophe and Alexandre Pétion. War and yellow fever destroyed the French army, which was defeated at Vertières on 18 November 1803, and Dessalines declared Haiti’s independence on 1 January 1804. In the following months most of the French who remained were killed on his orders. Estimates of the dead range from about 200,000 to 350,000 people of the colony, with tens of thousands of French and British soldiers, most of whom died of disease."
countries: [ht, fr, gb, es, do]
sides:
