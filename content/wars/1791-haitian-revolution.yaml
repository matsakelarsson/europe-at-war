notes:
  - "The sides changed during the war. The insurgent leaders of 1791 fought as auxiliaries of Spain in 1793–1795; Toussaint Louverture went over to the French Republic in 1794 and commanded its army in Saint-Domingue until 1802, when he fought Leclerc’s expedition. The free people of colour fought for their rights against the white colonists in 1790–1792, for the Republic against the British under Rigaud, against Toussaint in the War of the South, with Leclerc in 1802 and, from October 1802, in the Armée indigène. The revolutionary armies are shown here as one side throughout; the steps say whose flag they fought under."
  - "Numbers are uncertain. The colonial censuses undercounted the enslaved, the figures for the dead of the rising of 1791 and of the reprisals come from partisan accounts, and estimates of the total dead vary widely; the text gives ranges where sources differ."
  - "Cap-Français (Le Cap, today Cap-Haïtien) was the largest port of the colony; Port-au-Prince was its capital. Fort-Dauphin is today Fort-Liberté, and San Rafael, then a Spanish border town, is Saint-Raphaël."
  - The Spanish east of the island, ceded to France in 1795 and taken over in 1801–1802, stayed in French hands until 1809; Haiti’s wars with it after 1804 are told in the Haitian occupation of Santo Domingo and the Dominican War of Independence.
