  - title: Bois Caïman and the rising in the North
    date: August – December 1791
    when: "1791-08-22"
    borders: "1791-08-22"
    countries: [ht]
    body:
      - On 14 August 1791 enslaved drivers and other trusted men from many plantations of the Northern Plain met on the Lenormand de Mézy estate at Morne-Rouge to plan a rising. By tradition a Vodou ceremony in the woods of Bois Caïman, led by Dutty Boukman, a coachman and driver, and the priestess Cécile Fatiman, sealed the plan; the few accounts of it were written years later, and historians disagree about its date, given as 14 or 21 August, and its details. On the night of 22–23 August the enslaved people of Acul and Limbé rose, killed managers and owners and set fire to the cane fields and sugar mills, and within days the rising had spread across the plain. An attack on Le Cap failed, and the colonists held the town and a ring of fortified camps.
      - Accounts of the first months differ widely. Within two months perhaps 180 sugar and some 900 coffee plantations had been burned; the number of white people killed is put at anything from several hundred to 4,000, and the colonial militias’ reprisals killed thousands of prisoners and of Black people suspected of sympathy with the rising. The insurgents, soon tens of thousands, formed bands under leaders such as Boukman, Jean-François Papillon, Georges Biassou and Jeannot Bullet, and many said they were fighting for the king, who they claimed had granted them three free days a week. Boukman was killed in November and his head displayed at Le Cap. In December Jean-François and Biassou offered to send their followers back to work in exchange for freedom for a few hundred leaders, but the colonial assembly refused. Toussaint Bréda, a freed former coachman in his late forties who later took the name Louverture, served with Biassou.
      - In the West, free men of colour beat colonial troops at Pernier, near Croix-des-Bouquets, in early September 1791 and forced the white colonists to recognise their rights. When the National Assembly revoked its May decree in September, fighting broke out again; much of Port-au-Prince burned in November, and the West became a war between white colonists, free people of colour and armed enslaved people. In the hills behind Léogâne a free Black man who called himself Romaine-la-Prophétesse led thousands of insurgents from his camp at Trou Coffy, occupied Léogâne and Jacmel; colonial troops destroyed the camp in March 1792, though Romaine escaped.
    facts:
      - [Ceremony at Bois Caïman, "14 or 21 August 1791 (sources differ)"]
      - [Rising begins, "night of 22–23 August 1791"]
      - [Port-au-Prince burned, "November 1791"]
