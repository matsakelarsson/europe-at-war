  - title: War with Spain and Britain, and the end of slavery
    date: 1792 – June 1794
    when: "1793-08-29"
    borders: "1794-06-04"
    countries: [ht, do, fr, es, gb]
    body:
      - On 4 April 1792 the Legislative Assembly granted full rights to all free people of colour and sent three civil commissioners, among them Léger-Félicité Sonthonax and Étienne Polverel, with about 6,000 soldiers. They arrived in September 1792, deported royalist officials and relied on the free men of colour of the West and South. In 1793 France went to war with Britain (1 February) and Spain (7 March). The governor of Spanish Santo Domingo, Joaquín García, offered the insurgent leaders freedom, land and rank, and from May 1793 Jean-François, Biassou and Toussaint, who took the name Louverture that summer, fought as auxiliaries of the Spanish king. With them Spanish forces took much of the North and the upper Artibonite, and in December 1793 Toussaint took Gonaïves.
      - In June 1793 the new governor, François-Thomas Galbaud, tried to overthrow the commissioners in Le Cap. To defeat him Sonthonax and Polverel promised freedom to the insurgents who would fight for the Republic; thousands of them, under leaders such as Pierrot and Macaya, entered the town on 21 June, much of Le Cap burned, and thousands of colonists fled with Galbaud’s fleet, most of them to the United States. On 29 August 1793 Sonthonax proclaimed the abolition of slavery in the North, and Polverel followed in the West and South in September and October. Three deputies elected in the colony, Jean-Baptiste Belley, Jean-Baptiste Mills and Louis Dufay, reached Paris, and on 4 February 1794 the National Convention abolished slavery in all French colonies and made all their men citizens.
      - Colonists who wanted to keep slavery turned to Britain. On 20 September 1793 a small force from Jamaica landed at Jérémie at the invitation of the planters of the Grand’Anse, and on 22 September the naval base of Môle Saint-Nicolas surrendered. Saint-Marc, Arcahaie and Léogâne went over to the British, and on 4 June 1794 they took Port-au-Prince, from which the commissioners withdrew. Slavery was kept where the British ruled, though they also recruited Black soldiers. By mid-1794 the Republic held only parts of the colony, with General Étienne Laveaux at Port-de-Paix and Le Cap in the North and Rigaud’s free men of colour in the South.
    facts:
      - [Abolition proclaimed by Sonthonax, "29 August 1793 (the North)"]
      - [Slavery abolished by the National Convention, "4 February 1794"]
      - [British landing at Jérémie, "20 September 1793"]
