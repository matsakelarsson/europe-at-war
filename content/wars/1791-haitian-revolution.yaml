  - title: Vertières and independence
    date: November 1803 – 1804
    when: "1803-11-18"
    borders: "1804-01-01"
    countries: [ht, fr, gb, do]
    body:
      - On 18 November 1803 the Armée indigène attacked the forts that guarded Le Cap. At Vertières François Capois led his half-brigade forward under heavy fire even after his horse was shot under him, and by tradition the French paused the fighting to salute him. That night Rochambeau asked for terms, and on 19 November he agreed to leave within ten days. Rather than surrender to Dessalines he gave himself up to the British squadron blockading the port, and on 30 November about 8,000 French soldiers and civilians were taken off as prisoners of war. General Noailles abandoned Môle Saint-Nicolas in early December. In the east, French troops under General Ferrand kept Santo Domingo, and Dessalines’s attempt to take it in 1805 failed.
      - On 1 January 1804 at Gonaïves the generals declared independence and gave the country the name Haiti, from Ayiti, the Taíno name of the island. Dessalines became governor-general for life and, in the autumn of 1804, Emperor Jacques I. Between February and April 1804 most of the French who remained, men, women and children, were killed on his orders; estimates range from about 3,000 to 7,000 dead. Polish and German soldiers who had joined the revolution, some doctors and priests and some others were spared. Dessalines justified the killings as revenge for slavery and the war and as protection against a French return; historians call them a massacre, and some a genocide.
      - The war cost the colony a large part of its people. Estimates of the Haitian dead between 1791 and 1803 range from about 200,000 to 350,000, most of them killed by violence, hunger and disease in the war; of the more than 31,000 French soldiers landed in 1802–1803 only about 7,000 to 8,000 survived, and more than 20 French generals died, most of them of yellow fever. France recognised Haiti only in 1825, in return for an indemnity of 150 million francs, later reduced to 90 million, which with the loans taken to pay it burdened Haiti into the 20th century; the United States recognised it in 1862. The revolution ended slavery in the richest colony in the Americas, alarmed slaveholders and inspired the enslaved and abolitionists across the hemisphere, and the loss of Saint-Domingue led Bonaparte to sell Louisiana to the United States in 1803.
    facts:
      - [Battle of Vertières, "18 November 1803"]
      - [French evacuate Le Cap, "30 November 1803"]
      - [Declaration of independence, "1 January 1804, Gonaïves"]
    markers:
