  - title: The Leclerc expedition
    date: February – June 1802
    when: "1802-02-04"
    borders: "1802-02-04"
    countries: [ht, do, fr]
    body:
      - After the preliminary peace with Britain in October 1801, Bonaparte sent his brother-in-law, General Charles Leclerc, with a fleet and an army to restore French authority. His secret instructions were to win over or deceive Toussaint’s generals, then disarm them and deport them to France; the restoration of slavery was kept out of the public orders but widely feared. Over 1802 and 1803 more than 31,000 soldiers landed, among them Dutch and Polish units, and André Rigaud and Alexandre Pétion, exiled after the War of the South, came with them.
      - The fleets met in the Bay of Samaná at the end of January 1802. When Christophe refused to let Leclerc land, Le Cap was set on fire on 4 February as the French came ashore; Rochambeau took Fort-Dauphin, General Jean Boudet took Port-au-Prince, and General Kerverseau took over Santo Domingo, where Toussaint’s brother Paul was misled into giving way. Toussaint withdrew to the mountains and ordered the towns and plantations burned. Leclerc’s columns converged on Gonaïves; Toussaint fought them at Ravine-à-Couleuvres on 23 February, and from early March until 24 March Dessalines’s troops held the fort of Crête-à-Pierrot on the Artibonite against repeated French assaults, until the survivors broke out at night. Both sides killed prisoners and civilians; retreating revolutionary troops killed hundreds of white colonists at Verrettes, and Rochambeau had hundreds of prisoners shot.
      - Short of men and supplies, Christophe went over to the French in late April, and Toussaint accepted Leclerc’s terms on 6 May 1802 and retired to his plantation at Ennery; Dessalines also submitted. On 7 June Toussaint was lured to a meeting with General Jean-Baptiste Brunet, arrested and shipped to France with his family. He told his captors that they had cut down only the trunk of the tree of liberty, which would spring up again from its roots, “for they are numerous and deep”. He died in the Fort de Joux, in the Jura mountains, on 7 April 1803. Meanwhile yellow fever was killing thousands of Leclerc’s soldiers.
    facts:
      - [French soldiers landed in 1802–1803, "more than 31,000"]
      - [Crête-à-Pierrot, "March 1802"]
      - [Toussaint arrested, "7 June 1802; died 7 April 1803"]
