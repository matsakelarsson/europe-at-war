  - title: Toussaint Louverture joins the Republic
    date: May 1794 – 1795
    when: "1794-05-06"
    borders: "1795-07-22"
    countries: [ht, do, fr, es, gb]
    body:
      - In the spring of 1794 Toussaint Louverture, whose army of about 4,000 men had won much of Spain’s gains north of the Artibonite, broke with Spain and joined the French Republic, which had now abolished slavery. When and why he changed sides is debated. Some historians date the break to early May, when he raised the Republic’s flag at Gonaïves and, in some accounts, turned on the Spanish at San Rafael on 6 May; by 18 May he was writing to General Laveaux as a French officer. His motives have been explained by the news of abolition, by his quarrels with Biassou and the Spanish commanders, and by ambition. Within weeks he had taken the posts between Gonaïves and the mountains of the North from his former allies.
      - Jean-François and Biassou stayed with Spain. On 7 July 1794 Jean-François’s troops killed several hundred French colonists who had returned to Fort-Dauphin under Spanish protection, while the Spanish garrison stood by. In the South, Rigaud’s free men of colour fought the British, storming Léogâne in October 1794 and retaking Tiburon on 25–26 December. The British, who had lost hundreds of men to yellow fever within weeks of landing, held on to the coast. Sonthonax and Polverel, recalled to France to answer the colonists’ charges, left in June 1794; Laveaux governed in their place, and in 1795 the Convention made both Toussaint and Rigaud generals.
      - By the Peace of Basel of 22 July 1795 Spain made peace with France and ceded its part of Hispaniola, Santo Domingo, although France had no means to take it over and Spanish officials stayed until 1801. Jean-François left for Spain and Biassou for Spanish Florida at the end of 1795, and most of their soldiers joined Toussaint.
    facts:
      - [Toussaint joins the Republic, "May 1794 (date debated)"]
      - [Killings at Fort-Dauphin, "7 July 1794"]
      - [Peace of Basel, "22 July 1795; Spain cedes Santo Domingo"]
