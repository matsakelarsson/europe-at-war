  - title: Toussaint against the British
    date: 1796 – October 1798
    when: "1798-05-18"
    borders: "1798-05-18"
    countries: [ht, gb, fr]
    body:
      - On 20 March 1796 officers of colour under Jean-Louis Villatte seized Governor Laveaux in Le Cap; Toussaint’s troops freed him, and Laveaux named Toussaint lieutenant governor. A new commission with Sonthonax arrived in May 1796 and promoted Toussaint, and in 1797 he became commander-in-chief of the colony’s army. In August 1797 he forced Sonthonax to leave for France, and when the Directory sent General Théodore d’Hédouville in 1798 to restore its authority, a rising of cultivators and of the troops of Toussaint’s nephew Moïse drove him out in October. In the South, Rigaud governed on his own.
      - Britain sent more troops in 1796 as part of its largest overseas expedition yet, which went to the Windward Islands as well as to Saint-Domingue. In March 1796 a British attack on Léogâne failed against the guns of Alexandre Pétion. With French planters, Black troops they had recruited and German mercenaries, the British held the coast from Saint-Marc to Port-au-Prince, the plain of Mirebalais, Jérémie and the Môle. Toussaint took Mirebalais in 1797 and pressed the posts around Port-au-Prince, while yellow fever killed the newly arrived regiments. Of the British soldiers sent to Saint-Domingue, at least three in five died there, most of them of yellow fever, according to the historian David Geggus.
      - In 1798 Brigadier General Thomas Maitland was ordered to cut Britain’s losses. He agreed an armistice with Toussaint and evacuated Port-au-Prince, Saint-Marc and Arcahaie in May 1798, Jérémie in August and Môle Saint-Nicolas in October. Agreements with Maitland in 1798 and 1799, the second together with the United States, opened the colony’s ports to British and American ships in return for Toussaint’s promise not to attack Jamaica.
    facts:
      - [Toussaint commander-in-chief, "1797"]
      - [British evacuate Port-au-Prince, "May 1798"]
      - [British soldiers who died in Saint-Domingue, "at least three in five (Geggus), most of yellow fever"]
