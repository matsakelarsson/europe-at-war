  - title: The War of the South
    date: June 1799 – August 1800
    when: "1799-06-16"
    borders: "1799-06-16"
    countries: [ht]
    body:
      - With the British gone, Toussaint, who governed the North and the West, and Rigaud, who governed the South from Les Cayes, were rivals for the colony, and before leaving Hédouville had released Rigaud from Toussaint’s command. The war has often been described as one between Black people and people of colour, and both leaders appealed to colour, but historians also stress the struggle for power and the resistance in the South and in parts of the North to Toussaint’s labour policies. On 16–18 June 1799 Rigaud’s troops took the border towns of Petit-Goâve and Grand-Goâve, and his supporters raised revolts in the North, around Môle Saint-Nicolas, Port-de-Paix and Le Cap, which Henri Christophe and Jean-Jacques Dessalines put down with mass executions.
      - Toussaint, with an army of perhaps 45,000 men against Rigaud’s 15,000, invaded the South in November 1799. The United States, then fighting an undeclared naval war with France, backed him; its warships blockaded Rigaud’s ports and the frigate General Greene bombarded his positions. Pétion held Jacmel through a siege of four months, until on the night of 11–12 March 1800 the starving garrison broke out, losing many men.
      - Dessalines then advanced along the southern peninsula. Rigaud left for France at the end of July 1800, and Toussaint entered Les Cayes on 1 August. Many of Rigaud’s officers and soldiers and civilians of colour were killed in the reprisals that followed; the numbers are disputed. Toussaint was now master of all French Saint-Domingue.
    facts:
      - [Rigaud takes Petit-Goâve, "16–18 June 1799"]
      - [Siege of Jacmel, "November 1799 – 12 March 1800"]
      - [Toussaint enters Les Cayes, "1 August 1800"]
