  - title: Toussaint’s rule and Santo Domingo
    date: 1800–1801
    when: "1801-01-26"
    borders: "1801-01-27"
    countries: [ht, do, fr, es]
    body:
      - Toussaint set out to restore the plantation economy, which he believed was the only way to pay for an army and keep freedom secure. A decree of October 1800 bound the former slaves, now called cultivators, to the plantations under military supervision in return for a share of the crop; many estates were leased to officers or returned to white owners. He traded with the United States and Britain and kept a large army.
      - Bonaparte, who had taken power in France in November 1799, confirmed Toussaint as commander-in-chief but forbade him to take over Spanish Santo Domingo. Toussaint went ahead. In January 1801 two columns, one under his nephew Moïse through Santiago in the north and one under Toussaint himself in the south, marched into the Spanish part, meeting little resistance, and at the end of the month Governor Joaquín García handed over Santo Domingo. Toussaint abolished slavery in the east, and many Spanish colonists left for Cuba, Puerto Rico and Venezuela.
      - An assembly chosen by Toussaint, mostly white planters, drew up a constitution for the whole island, proclaimed in July 1801. It declared that slavery was abolished for ever and that all men were born free and French, made Catholicism the state religion, kept the plantation labour regime and the right to bring in workers from Africa, and made Toussaint governor for life with the right to choose his successor. In October 1801 cultivators in the plain around Le Cap rose against the labour regime and killed a number of white people; Toussaint crushed the rising and had Moïse, accused of encouraging it, shot in November.
    facts:
      - [Labour decree, "October 1800"]
      - [Santo Domingo handed over, "end of January 1801"]
      - [Constitution proclaimed, "July 1801"]
