id: whiskey-rebellion
name: Whiskey Rebellion
start: "1791"
end: "1794-11"
tier: C
summary: "Resistance by farmers on the western frontier, above all in western Pennsylvania, to the federal excise tax on distilled spirits. Treasury Secretary Alexander Hamilton’s tax of March 1791, meant to help pay the state war debts the federal government had taken over, fell hard on farmers west of the Appalachians, who turned their grain into whiskey to carry it over the mountains and used it as money, and who had to pay the tax in cash; large distillers in the East could pay less per gallon. Tax collectors were threatened and tarred and feathered from 1791 on. In July 1794, when a federal marshal came to serve writs, armed men besieged the house of the regional tax inspector, John Neville, at Bower Hill near Pittsburgh on 16–17 July; soldiers from Fort Pitt defended it, a rebel leader, James McFarlane, was killed, and the house was burned. On 1 August some 7,000 people gathered at Braddock’s Field and marched through Pittsburgh. Moderates such as Albert Gallatin and Hugh Henry Brackenridge urged restraint at a meeting at Parkinson’s Ferry, while President George Washington called out about 12,950 militia from Pennsylvania, New Jersey, Maryland and Virginia under Henry Lee, with Hamilton accompanying them; Washington rode with the army as far as Carlisle and Bedford in October, often described as the only time a sitting president has led troops in the field. The resistance melted away before the army arrived. About 20 men were taken to Philadelphia for trial; two were convicted of treason and pardoned by Washington. The rising was the first great test of the new federal government’s power to enforce its laws, and it deepened the divide between Federalists and Jefferson’s Republicans, who repealed the tax in 1802."
