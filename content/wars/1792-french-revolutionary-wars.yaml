  - title: The Batavian Republic and the Peace of Basel
    date: January – October 1795
    when: "1795-01"
    borders: "1795-10-01"
    countries: [nl, be, lu, fr, de, es, gb]
    body:
      - In the hard winter of 1794–1795 the rivers froze, and Pichegru’s army crossed them on the ice into the Dutch Republic. The British retreated through the eastern provinces to Germany in bitter cold, losing thousands of men, and the stadtholder William V fled to England on 18 January. Dutch Patriots, many back from exile in France, took over the towns and proclaimed the Batavian Republic on 19 January. On 23 January French hussars captured the Dutch fleet, frozen into the ice off Den Helder. By the Treaty of The Hague on 16 May the new republic became France’s ally, ceded Maastricht, Venlo and Zeelandic Flanders, and agreed to pay 100 million guilders and to keep a French army.
      - The coalition fell apart. Prussia, more interested in its share of Poland, made peace at Basel on 5 April, accepting in a secret article that France would keep the left bank of the Rhine until a general peace, and northern Germany became neutral behind a demarcation line. Spain made peace on 22 July, ceding its half of Hispaniola, and Hesse-Kassel in August. The fortress of Luxembourg surrendered on 7 June after a long blockade, and in July General Hoche crushed a British-backed landing of émigrés at Quiberon in Brittany. On 1 October the Convention annexed the Austrian Netherlands and Liège to France, and at the end of the month it handed power to a new government, the Directory. Austria and Britain fought on.
    facts:
      - [Batavian Republic proclaimed, "19 January 1795"]
      - [Peace of Basel, "5 April 1795 (Prussia), 22 July 1795 (Spain)"]
      - [Belgium annexed, "1 October 1795"]
    markers:
      - kind: event
        side: fr
        name: Crossing the frozen rivers
        date: January 1795
        text: The French crossed the frozen Waal, the last great river barrier, and the allied defence of the Dutch Republic collapsed.
        lonlat: [5.862, 51.847]
      - kind: event
        side: fr
        name: Batavian Republic
        date: 19 January 1795
        text: Patriots took over the government of Amsterdam as French troops arrived and proclaimed the Batavian Republic.
        lonlat: [4.894, 52.373]
      - kind: taken
        side: fr
        name: Den Helder
        date: 23 January 1795
        text: French hussars rode out over the ice and took the Dutch warships frozen in at anchor.
        lonlat: [4.759, 52.958]
      - kind: treaty
        side: fr
        name: Treaty of The Hague
        date: 16 May 1795
        text: The Batavian Republic became France’s ally and paid heavily for the privilege.
        lonlat: [4.31, 52.08]
        lp: l
      - kind: siege
        side: fr
        name: Luxembourg
        date: November 1794 – 7 June 1795
        text: One of the strongest fortresses in Europe, it surrendered after a blockade of seven months.
        lonlat: [6.133, 49.611]
      - kind: treaty
        name: Peace of Basel
        date: 5 April and 22 July 1795
        text: France made peace with Prussia here in April and with Spain in July.
        lonlat: [7.588, 47.558]
    arrows:
      - side: fr
        label: Pichegru
        phase: 1
        via: [[5.3, 51.69], [5.86, 51.84], [5.12, 52.09], [4.89, 52.37]]
      - side: fr
        phase: 2
        via: [[4.89, 52.4], [4.75, 52.65], [4.76, 52.93]]
      - side: gb
        label: British retreat
        phase: 1
        via: [[5.9, 52.0], [6.4, 52.45], [7.3, 52.7], [8.8, 53.08]]
    areas:
      - style: gained
        label: Annexed by France, 1795
        atoms: [BE-BRU, BE-VBR, BE-VAN, BE-VOV, BE-VWV, BE-WBR, BE-WHT, BE-WNA, BE-WLX, BE-VLI, BE-WLG, LU-L, LU-D, LU-G, NL-LI, NL-ZE~vlaanderen]
      - style: occupied
        side: fr
        label: Occupied by France, the left bank of the Rhine
        atoms: [DE-NW~lb, DE-RP!]
  - title: The Rhine and Bonaparte in Italy
    date: 1796–1797
    when: "1796-03"
    borders: "1797-10-17"
    countries: [it, de, at, fr, hr]
    body:
      - In 1796 the Directory sent two armies across the Rhine into Germany, under Jourdan and Moreau, and gave a third, the small and ragged Army of Italy, to the 26-year-old Napoleon Bonaparte. In Germany the Archduke Charles, the Emperor’s brother, used his central position to beat Jourdan at Amberg in August and Würzburg in September, and both French armies fell back across the Rhine. In Italy Bonaparte split the Austrians from the Piedmontese at Montenotte in April, forced Sardinia out of the war within a month, and then beat the Austrians at Lodi on 10 May and entered Milan.
      - He besieged Mantua, Austria’s great fortress in Italy, and beat four Austrian attempts to relieve it, at Castiglione in August, Bassano in September, Arcole in November and Rivoli in January 1797; Mantua surrendered on 2 February. He then crossed the Alps towards Vienna, and on 18 April the Austrians agreed to preliminaries of peace at Leoben. In May Bonaparte put an end to the Republic of Venice, and he made Lombardy the core of a new Cisalpine Republic. By the Treaty of Campo Formio on 17 October 1797 Austria gave up Belgium and Lombardy and recognised the Cisalpine Republic, and received Venice, Istria and Dalmatia; secretly it agreed that France should have most of the left bank of the Rhine.
    facts:
      - [Battle of Rivoli, "14–15 January 1797, French victory"]
      - [Mantua surrenders, "2 February 1797"]
      - [Treaty of Campo Formio, "17 October 1797"]
    markers:
      - kind: battle
        side: fr
        name: Battle of Montenotte
        date: 12 April 1796
        text: Bonaparte’s first victory as an army commander. Within two weeks the King of Sardinia asked for an armistice, and in May he ceded Savoy and Nice.
        lonlat: [8.276, 44.398]
      - kind: battle
        side: fr
        name: Battle of Lodi
        date: 10 May 1796
        text: French troops stormed the bridge over the Adda under fire. Milan opened its gates five days later.
        lonlat: [9.509, 45.319]
      - kind: siege
        side: fr
        name: Mantua
        date: July 1796 – 2 February 1797
        text: The siege drew one Austrian relief army after another into Italy. Wurmser held out with his garrison until hunger and disease forced him to surrender.
        lonlat: [10.792, 45.156]
        lp: b
      - kind: battle
        side: fr
        name: Battle of Arcole
        date: 15–17 November 1796
        text: Three days of fighting in the marshes by the Alpone. Bonaparte himself led a charge on the bridge, according to legend with a flag in his hand.
        lonlat: [11.277, 45.357]
