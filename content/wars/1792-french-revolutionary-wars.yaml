id: french-revolutionary-wars
name: French Revolutionary Wars
start: "1792-04-20"
end: "1802-03-25"
tier: A
summary: The wars between Revolutionary France and two coalitions of European monarchies, led by Austria, Prussia, Britain and Russia. Saved at Valmy in 1792 and by mass conscription in 1793, the Republic conquered Belgium, the Dutch Republic, the left bank of the Rhine and northern Italy, ringing itself with sister republics, and after Bonaparte’s victories at Marengo and Hohenlinden the treaties of Lunéville and Amiens in 1801–1802 left France the dominant power on the Continent.
countries: [fr, be, nl, lu, de, at, it, ch, gb, es, ru]
sides:
  - id: fr
    name: France and its sister republics
    polities: [france, netherlands, napoleonic-italy]
    ink: navy
    moves: French moves
    success: French success
  - id: at
    name: Austria and the Empire
    polities: [habsburg, austrian-netherlands, hre]
    ink: purple
    moves: Austrian and imperial moves
    success: Austrian success
  - id: pr
    name: Prussia
    polities: [prussia]
    ink: slate
    moves: Prussian moves
    success: Prussian success
  - id: gb
    name: Britain and the Dutch Republic
    polities: [united-kingdom, hanover, dutch-republic]
    ink: red
    moves: British and allied moves
    success: British and allied success
  - id: ru
    name: Russia
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian and allied success
  - id: sa
    name: Sardinia and Naples
    polities: [savoy, naples]
    ink: teal
    moves: Sardinian and Neapolitan moves
    success: Sardinian and Neapolitan success
notes:
  - Dates are given by the Gregorian calendar. From late 1793 to 1805 the French Republic used its own Revolutionary calendar, so French sources date Bonaparte’s seizure of power 18 Brumaire Year VIII (9 November 1799).
  - The wars are usually divided into the War of the First Coalition (1792–1797) and the War of the Second Coalition (1798–1802). Spain fought France in 1793–1795 and was its ally from 1796; Prussia left the war in 1795, and Russia fought only in 1799. The war in the Pyrenees, at sea, in the colonies and in Egypt is only outlined here; the War in the Vendée and the Irish Rebellion of 1798 have their own stories.
  - “Belgium” here means the Austrian Netherlands and the Prince-Bishopric of Liège, which France annexed in 1795.
