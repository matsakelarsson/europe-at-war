  - title: The Second Coalition, Zürich and Holland
    date: 1798–1799
    when: "1798"
    borders: "1799-10-18"
    countries: [ch, it, nl, de, fr, at, ru, gb]
    body:
      - In 1798 France set up a Roman Republic, occupied Switzerland, which became the Helvetic Republic, and sent Bonaparte with an army to Egypt. He took Malta on the way and Cairo in July, but on 1 August Nelson destroyed his fleet in Aboukir Bay, in the Battle of the Nile. Britain, Russia, Austria, Naples, Portugal and the Ottoman Empire formed a Second Coalition. Naples attacked first and lost its own capital, where the French set up a Parthenopean Republic in January 1799. In the spring the Archduke Charles beat Jourdan at Ostrach and Stockach, and an Austrian and Russian army under Alexander Suvorov drove the French out of most of Italy, winning at Cassano, on the Trebbia and at Novi.
      - Switzerland became a battlefield. The Archduke pushed Masséna out of Zürich in June, but when he was sent north to the Rhine, Masséna attacked the Russians under Alexander Korsakov at Zürich on 25–26 September and routed them. Suvorov, marching north from Italy over the St Gotthard Pass to join Korsakov, arrived too late and had to lead his army out over high Alpine passes in October. In Holland a British and Russian army under the Duke of York landed on 27 August, and the Dutch fleet surrendered to the British, but after battles around Bergen and Castricum York agreed at Alkmaar on 18 October to withdraw. Russia left the coalition, and on 9 November Bonaparte, back from Egypt, seized power in Paris.
    facts:
      - [Battle of the Nile, "1–3 August 1798, British victory"]
      - [Second Battle of Zürich, "25–26 September 1799, French victory"]
      - [Convention of Alkmaar, "18 October 1799"]
    markers:
      - kind: battle
        side: at
        name: Battle of Stockach
        date: 25 March 1799
        text: Archduke Charles beat Jourdan’s Army of the Danube, which fell back across the Rhine.
        lonlat: [9.0, 47.85]
      - kind: battle
        side: ru
        name: Battle of the Trebbia
        date: 17–19 June 1799
        text: Suvorov’s Austrians and Russians beat Macdonald’s army, marching north from Naples, in three days of fighting west of Piacenza.
        lonlat: [9.62, 45.04]
      - kind: battle
        side: ru
        name: Battle of Novi
        date: 15 August 1799
        text: The French commander, Barthélemy Joubert, was killed early in the battle, and his army was driven back into the Ligurian mountains.
        lonlat: [8.791, 44.762]
      - kind: battle
        side: fr
        name: Second Battle of Zürich
        date: 25–26 September 1799
        text: Masséna crossed the Limmat by surprise and broke Korsakov’s army, which fled north across the Rhine.
        lonlat: [8.541, 47.374]
      - kind: event
        side: ru
        name: St Gotthard Pass
        date: 24 September 1799
        text: Suvorov forced the pass and the Devil’s Bridge beyond it, but by the time he came down from the mountains Korsakov had been beaten.
        lonlat: [8.568, 46.556]
      - kind: event
        side: gb
        name: Anglo-Russian landing
        date: 27 August 1799
        text: British troops came ashore near Callantsoog in North Holland; three days later the Dutch fleet surrendered without a fight.
        lonlat: [4.697, 52.85]
      - kind: battle
        side: fr
        name: Battle of Bergen
        date: 19 September 1799
        text: General Brune’s French and Batavian troops threw back the allied attack, and the Russian columns suffered heavily.
        lonlat: [4.717, 52.667]
      - kind: battle
        side: fr
        name: Battle of Castricum
        date: 6 October 1799
        text: The last battle of the campaign. Days later York agreed at Alkmaar to evacuate his army.
        lonlat: [4.667, 52.55]
        lp: l
