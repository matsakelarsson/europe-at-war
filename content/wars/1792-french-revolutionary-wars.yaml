  - title: The levée en masse
    date: 1793
    when: "1793-02-01"
    borders: "1793-12-19"
    countries: [fr, be, nl, de, gb, at]
    body:
      - After the execution of Louis XVI on 21 January 1793 France declared war on Britain and the Dutch Republic, and soon Spain, Portugal, Naples and the Holy Roman Empire were at war with it too, in what became known as the First Coalition. Dumouriez invaded the Dutch Republic in February, but an Austrian army under the Prince of Saxe-Coburg drove the French back and beat them at Neerwinden on 18 March. Belgium was lost, and in April Dumouriez, having failed to turn his army against the Convention, went over to the Austrians. The allies besieged and took the frontier fortresses of Condé and Valenciennes, and the Prussians retook Mainz in July. Inside France revolts broke out in the Vendée, Lyon, Marseille and Toulon.
      - The Republic answered with the Terror and with mass mobilisation. The levée en masse of 23 August 1793 put the whole nation at the service of the war and called up all unmarried men aged 18 to 25; by 1794 the armies, organised by Lazare Carnot, numbered some 750,000 men. Generals who failed were guillotined, among them Houchard, who beat the Duke of York’s Hanoverians at Hondschoote in September, saving Dunkirk, but did not follow up. Jourdan beat Coburg at Wattignies in October. At Toulon, which royalists had handed to an Anglo-Spanish fleet in August, a young artillery officer, Napoleon Bonaparte, helped plan the attack that forced the allies out on 19 December; hundreds of Toulonnais were shot in reprisal.
    facts:
      - [Battle of Neerwinden, "18 March 1793, Austrian victory"]
      - [Levée en masse, "23 August 1793"]
      - [Siege of Toulon, "September – 19 December 1793, republican victory"]
    markers:
      - kind: battle
        side: at
        name: Battle of Neerwinden
        date: 18 March 1793
        text: Coburg’s Austrians beat Dumouriez east of Brussels, and the French gave up Belgium within weeks.
        lonlat: [5.05, 50.767]
      - kind: siege
        side: gb
        name: Valenciennes
        date: May – July 1793
        text: The fortress surrendered on 28 July to an allied army of British, Hanoverian and Austrian troops under the Duke of York.
        lonlat: [3.523, 50.358]
      - kind: siege
        side: pr
        name: Mainz
        date: April – July 1793
        text: The French garrison surrendered on 23 July and was allowed to leave on condition that it did not fight the allies for a year; it was sent against the Vendée.
        lonlat: [8.271, 50.0]
      - kind: event
        side: fr
        name: Levée en masse
        date: 23 August 1793
        text: The Convention declared that until the enemy had been driven from the Republic’s territory, all French people were permanently requisitioned for the service of the armies.
        lonlat: [2.352, 48.857]
      - kind: battle
        side: fr
        name: Battle of Hondschoote
        date: 6–8 September 1793
        text: Houchard’s army beat the Hanoverian and Hessian covering force, and the Duke of York gave up his siege of Dunkirk.
        lonlat: [2.586, 50.98]
      - kind: battle
        side: fr
        name: Battle of Wattignies
        date: 15–16 October 1793
        text: Jourdan, with Carnot at his side, forced Coburg to lift the siege of Maubeuge.
        lonlat: [4.013, 50.201]
      - kind: siege
        side: fr
        name: Siege of Toulon
        date: September – 19 December 1793
        text: The great naval base had been handed to Admiral Hood’s fleet by its royalists. Republican batteries above the harbour made it untenable, and the allies left, burning part of the French fleet.
        lonlat: [5.931, 43.126]
    arrows:
      - side: fr
        label: Dumouriez, February
        phase: 1
        via: [[4.4, 51.2], [4.6, 51.45], [4.78, 51.59]]
      - side: at
