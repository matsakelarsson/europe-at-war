  - title: Lunéville and Amiens
    date: 1801–1802
    when: "1801-02-09"
    borders: "1802-03-25"
    countries: [fr, de, at, gb, it, nl, es]
    body:
      - By the Treaty of Lunéville on 9 February 1801 Austria, signing also for the Holy Roman Empire, confirmed the terms of Campo Formio. France gained the whole left bank of the Rhine, and Austria recognised the Batavian, Helvetic, Cisalpine and Ligurian republics. The German princes who lost land on the left bank were to be compensated with church lands and free cities on the right bank, which led to the great redrawing of the German map in 1803. Naples made peace at Florence in March. Britain fought on alone; in Egypt a British army landed at Aboukir in March 1801 and forced the French army, which Bonaparte had left behind in 1799, to surrender at Cairo and Alexandria by September.
      - Exhausted by nine years of war, Britain and France made peace at Amiens on 25 March 1802, together with Spain and the Batavian Republic. Britain returned most of its conquests overseas except Trinidad, taken from Spain, and Ceylon, taken from the Dutch, and promised to give Malta back to the Knights of St John; France agreed to leave southern Italy, and Egypt went back to the Ottoman Empire. In August Bonaparte was made First Consul for life. The peace lasted only fourteen months. Quarrels over Malta and French expansion in Switzerland, Italy and the Netherlands led Britain to declare war again in May 1803, the beginning of the Napoleonic Wars.
    facts:
      - [Treaty of Lunéville, "9 February 1801, France and Austria"]
      - [Treaty of Amiens, "25 March 1802, France and Britain"]
      - [French surrender in Egypt, "Cairo, June 1801; Alexandria, September 1801"]
    markers:
      - kind: treaty
        side: fr
        name: Treaty of Lunéville
        date: 9 February 1801
        text: Joseph Bonaparte and the Austrian envoy Ludwig von Cobenzl signed the peace, which made the Rhine the border of France.
        lonlat: [6.502, 48.589]
      - kind: treaty
        name: Treaty of Amiens
        date: 25 March 1802
        text: Joseph Bonaparte and Lord Cornwallis signed the peace that ended almost ten years of war between France and Britain.
        lonlat: [2.299, 49.892]
    areas:
      - style: gained
        label: Ceded to France at Lunéville, the left bank of the Rhine
        atoms: [DE-NW~lb, DE-RP!, DE-RP~pfalz, DE-RP~hd, DE-SL]
