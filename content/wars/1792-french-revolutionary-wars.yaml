steps:
  - title: Valmy and Jemappes
    date: April – December 1792
    when: "1792-04-20"
    borders: "1792-12-01"
    countries: [fr, be, de, at]
    body:
      - Revolutionary France declared war on Austria on 20 April 1792, and Prussia joined Austria. An early French advance into the Austrian Netherlands collapsed in panic. In July the allied commander, the Duke of Brunswick, threatened Paris with destruction if the royal family were harmed, which helped bring down the monarchy on 10 August. His Prussian, Austrian and Hessian army, with French émigrés, crossed the border, took Longwy and Verdun and advanced into Champagne. On 20 September at Valmy the armies of Dumouriez and Kellermann stood firm under Prussian cannon fire, and Brunswick, his army sick with dysentery and short of supplies, broke off and retreated. The next day the National Convention abolished the monarchy.
      - The French now went over to the attack everywhere. An Austrian bombardment of Lille failed in October. In the south French armies occupied Savoy and Nice, lands of the King of Sardinia, and on the Rhine General Custine took Speyer, Worms and Mainz. In the north Dumouriez beat the Austrians at Jemappes, near Mons, on 6 November, the first great battle won by the Republic’s new armies, and by the end of the year the French held almost all of the Austrian Netherlands and Liège. On 19 November the Convention offered help to all peoples who wished to recover their liberty, and in December it ordered revolutionary government in the lands it occupied.
    facts:
      - [War declared on Austria, "20 April 1792"]
      - [Battle of Valmy, "20 September 1792, French victory"]
      - [Battle of Jemappes, "6 November 1792, French victory"]
    markers:
      - kind: taken
        side: pr
        name: Verdun
        date: 2 September 1792
        text: The fortress surrendered to the Prussians after a brief bombardment, opening the road to Paris. Fear of the advancing enemy helped set off the September massacres of prisoners in Paris.
        lonlat: [5.388, 49.162]
      - kind: battle
        side: fr
        name: Battle of Valmy
        date: 20 September 1792
        text: Little more than a cannonade, but the Prussian retreat saved the Revolution. Goethe, who was there, later wrote that it began a new era in the history of the world.
        lonlat: [4.767, 49.08]
      - kind: held
        side: fr
        name: Lille
        date: 29 September – 8 October 1792
        text: The Austrians bombarded the city for more than a week but could not take it.
        lonlat: [3.058, 50.628]
        lp: l
      - kind: taken
        side: fr
        name: Mainz
        date: 21 October 1792
        text: Custine’s army took the fortress without a fight. In 1793 the Republic of Mainz, the first republic on German soil, was set up here under French protection.
        lonlat: [8.271, 50.0]
      - kind: battle
        side: fr
        name: Battle of Jemappes
        date: 6 November 1792
        text: Dumouriez’s larger army stormed the Austrian positions on the heights west of Mons.
        lonlat: [3.889, 50.456]
      - kind: taken
        side: fr
        name: Brussels
        date: 14 November 1792
        text: The French entered the capital of the Austrian Netherlands; Liège followed on 28 November.
        lonlat: [4.353, 50.847]
      - kind: taken
        side: fr
        name: Nice
        date: 29 September 1792
        text: Sardinian troops withdrew without a fight, as they had from Savoy a week before. France annexed Savoy in November and Nice in January 1793.
        lonlat: [7.27, 43.7]
        lp: l
