  - title: Marengo and Hohenlinden
    date: 1800
    when: "1800"
    borders: "1800-12-03"
    countries: [it, de, at, fr, ch]
    body:
      - Bonaparte, now First Consul, offered peace, which Austria and Britain refused. In the spring of 1800 the Austrians under Michael von Melas besieged Masséna in Genoa, while Moreau crossed the upper Rhine and pushed the Austrians in Swabia back to Ulm. Bonaparte led a new Reserve Army over the Great St Bernard Pass in May and came down into Lombardy behind Melas, entering Milan on 2 June. Genoa, starving, surrendered two days later.
      - On 14 June Melas attacked Bonaparte’s army at Marengo, near Alessandria, and by the afternoon the French were retreating. Then General Desaix arrived with fresh troops; he was killed leading the counter-attack that, with a cavalry charge by Kellermann, broke the Austrians. The next day Melas agreed to withdraw east of the Mincio, leaving northern Italy to the French and Bonaparte more secure in power at home. Austria still would not make peace. On 3 December, in snowy forests east of Munich, Moreau destroyed the army of Archduke John at Hohenlinden and advanced towards Vienna, and on 25 December Austria agreed an armistice at Steyr.
    facts:
      - [Battle of Marengo, "14 June 1800, French victory"]
      - [Battle of Hohenlinden, "3 December 1800, French victory"]
      - [Armistice of Steyr, "25 December 1800"]
    markers:
      - kind: siege
        side: at
        name: Genoa
        date: April – 4 June 1800
        text: Masséna held out for two months against the Austrians and a British naval blockade, until hunger forced him to surrender; his men marched out with the honours of war.
        lonlat: [8.93, 44.411]
      - kind: event
        side: fr
        name: Great St Bernard Pass
        date: May 1800
        text: The Reserve Army crossed the pass, hauling its guns over the snow in hollowed-out tree trunks.
        lonlat: [7.171, 45.869]
      - kind: taken
        side: fr
        name: Milan
        date: 2 June 1800
        text: Bonaparte entered the city and restored the Cisalpine Republic.
        lonlat: [9.19, 45.467]
      - kind: battle
        side: fr
        name: Battle of Marengo
        date: 14 June 1800
        text: A near-defeat turned into victory by Desaix’s arrival. The French bulletins later improved the story.
        lonlat: [8.678, 44.886]
      - kind: battle
        side: fr
        name: Engen and Stockach
        date: 3 May 1800
        text: Moreau beat Paul Kray’s Austrians in two battles on the same day, opening the way to the Danube.
        lonlat: [8.775, 47.856]
      - kind: battle
