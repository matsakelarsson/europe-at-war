        polygon: [[5.72, 43.05], [5.75, 43.2], [6.06, 43.2], [6.1, 43.05]]
  - title: Fleurus and the conquest of Belgium
    date: 1794
    when: "1794-04"
    borders: "1794-11-04"
    countries: [be, fr, nl, de, gb, at]
    body:
      - In the spring of 1794 the allies tried once more to break into France from Flanders, but at Tourcoing on 18 May the French under Joseph Souham beat a poorly coordinated attack by the Austrians and the Duke of York. On the Sambre the French crossed the river and were thrown back four times before Jourdan, with the new Army of the Sambre-and-Meuse, took Charleroi on 25 June. The next day Coburg attacked him at Fleurus, where the French watched his movements from an observation balloon, and after a long struggle the Austrians withdrew. At sea the British won the battle of the Glorious First of June, but the grain convoy from America that the French fleet had sailed out to protect reached France.
      - The Austrians gave up the Netherlands. The French entered Brussels on 10 July, and Antwerp and Liège later that month. Jourdan beat the Austrians on the Ourthe in September and on the Roer in early October and reached the Rhine at Cologne and Koblenz, and Maastricht surrendered on 4 November. In the north Pichegru drove the British, Hanoverians and Dutch back across the great rivers. In Paris Robespierre fell on 27 July, and the Terror came to an end, but the occupied lands were stripped of food, money and works of art to pay for the war.
    facts:
      - [Battle of Fleurus, "26 June 1794, French victory"]
      - [Brussels taken, "10 July 1794"]
      - [Maastricht surrenders, "4 November 1794"]
    markers:
      - kind: battle
        side: fr
        name: Battle of Tourcoing
        date: 18 May 1794
        text: The allied columns, advancing separately, were beaten one after another. The Duke of York barely escaped capture.
        lonlat: [3.155, 50.732]
      - kind: siege
        side: fr
        name: Charleroi
        date: 25 June 1794
        text: The fortress surrendered to Jourdan the day before Coburg arrived to relieve it.
        lonlat: [4.447, 50.408]
        lp: l
      - kind: battle
        side: fr
        name: Battle of Fleurus
        date: 26 June 1794
        text: Coburg’s attack on the French arc around Charleroi failed after hours of fighting. The balloon L’Entreprenant was one of the first aircraft used in war.
        lonlat: [4.533, 50.483]
      - kind: taken
        side: fr
        name: Brussels
        date: 10 July 1794
        text: The French entered Brussels for the second time, and this time stayed for twenty years.
        lonlat: [4.353, 50.847]
      - kind: battle
        side: fr
        name: Battle of Sprimont
        date: 18 September 1794
        text: Also called the Battle of the Ourthe. Jourdan drove the Austrians from their positions south-east of Liège.
        lonlat: [5.705, 50.491]
      - kind: battle
        side: fr
        name: Battle of the Roer
        date: 2 October 1794
        text: Fought around Aldenhoven. The Austrians fell back across the Rhine, and the French entered Cologne four days later.
        lonlat: [6.283, 50.896]
      - kind: siege
        side: fr
        name: Maastricht
        date: 4 November 1794
        text: The Dutch fortress on the Meuse surrendered after a siege of six weeks.
        lonlat: [5.683, 50.85]
        lp: l
    arrows:
