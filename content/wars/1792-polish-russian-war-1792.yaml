id: polish-russian-war-1792
name: War in Defence of the Constitution
start: "1792"
end: "1792"
tier: B
summary: Also called the Polish–Russian War of 1792. Catherine II sent her armies into Poland–Lithuania in support of the Confederation of Targowica, magnates opposed to the reforming Constitution of 3 May 1791. After three months the king gave in, and in 1793 Russia and Prussia carried out the Second Partition.
