steps:
  - title: The Constitution and Targowica
    date: 1788 – May 1792
    when: "1791-05-03"
    borders: "1792-05-18"
    countries: [pl, lt, ua, by, ru]
    body:
      - While Russia was busy fighting the Ottomans and Sweden, the Great Sejm that met in Warsaw from 1788 set out to rebuild the state left weak after the First Partition of 1772. It allied with Prussia in 1790, and on 3 May 1791 it passed a new constitution, the first of its kind in Europe. It made the throne hereditary, abolished the liberum veto that let one deputy block the Sejm, gave townspeople new rights, placed peasants under the protection of the law and planned an army of 100,000.
      - Catherine II saw the reforms as a threat to Russian control. Once peace with the Ottomans was signed in January 1792, she backed a group of magnates led by Stanisław Szczęsny Potocki, Franciszek Ksawery Branicki and Seweryn Rzewuski. Their act of confederation, drawn up in St Petersburg in April, was proclaimed in the border town of Targowica on 14 May, and on 18 May nearly 100,000 Russian troops crossed into Poland and Lithuania. Prussia refused to honour its alliance.
    facts:
      - [Constitution of 3 May, "Adopted 3 May 1791 by the Great Sejm"]
      - [Russian invasion, "18 May 1792, nearly 98,000 men"]
      - [Polish–Lithuanian field army, "About 37,000 men"]
    markers:
      - kind: event
        side: pl
        name: Constitution of 3 May
        date: 3 May 1791
        text: The Sejm adopted the constitution in the Royal Castle in Warsaw, passing it quickly while many opponents were away for Easter.
        lonlat: [21.01, 52.25]
      - kind: event
        side: tg
        name: Targowica
        date: 14 May 1792
        text: The confederates proclaimed their act here, on the Russian border, claiming to defend the old liberties of the nobility.
        lonlat: [30.79, 48.66]
    arrows:
