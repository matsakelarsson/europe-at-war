  - title: Zieleńce, Dubienka and the Second Partition
    date: June 1792 – 1793
    when: "1792-06"
    borders: "1793-09-25"
    countries: [pl, lt, ua, by, ru, de]
    body:
      - The smaller Polish army fell back in Ukraine. On 18 June Prince Józef Poniatowski, the king’s nephew, turned on a Russian column at Zieleńce and beat it, and the king founded the Virtuti Militari order to reward the victors. On 18 July Tadeusz Kościuszko held the line of the Bug at Dubienka against a Russian force several times larger before withdrawing. In Lithuania the Russians beat the defenders at Mir and took Vilnius. In late July King Stanisław August, believing the war lost, joined the Confederation of Targowica, and the army was ordered to stop fighting.
      - The Targowica leaders had expected to rule under Russian protection. Instead, Prussia sent troops into Greater Poland in January 1793 and agreed a second partition with Russia. Surrounded by Russian soldiers, the last Sejm of the Commonwealth, at Grodno, approved it that summer and autumn. Russia took about 250,000 km² in Belarus and Ukraine, and Prussia about 58,000 km² with Poznań, Danzig and Toruń. The constitution was annulled.
    facts:
      - [Battle of Zieleńce, "18 June 1792, Polish victory"]
      - [Battle of Dubienka, "18 July 1792, Polish withdrawal after a day’s fighting"]
      - [Second Partition, "Russian–Prussian convention 23 January 1793, ratified at Grodno July–September 1793"]
    markers:
      - kind: battle
        side: pl
        name: Battle of Zieleńce
        date: 18 June 1792
        text: Poniatowski’s counterattack beat a Russian division under Irakly Morkov, the greatest Polish success of the war.
        lonlat: [26.87, 49.53]
      - kind: battle
        side: pl
        name: Battle of Dubienka
        date: 18 July 1792
        text: About 5,300 men under Kościuszko held off some 25,000 Russians under Mikhail Kakhovsky, then withdrew when outflanked.
        lonlat: [23.87, 51.08]
      - kind: battle
        side: ru
        name: Battle of Mir
        date: 11 June 1792
        text: The Russians beat the Lithuanian army, which fell back towards Grodno and Brest.
        lonlat: [26.47, 53.45]
      - kind: treaty
        side: ru
        name: Grodno Sejm
        date: July – September 1793
        text: Deputies who protested were arrested. The final vote on the treaty with Prussia passed by silence and is remembered as the “dumb sejm”.
        lonlat: [23.83, 53.68]
    arrows:
