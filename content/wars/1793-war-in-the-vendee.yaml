  - title: Terror and pacification
    date: December 1793 – July 1796
    when: "1793-12-24"
    borders: "1796-03-29"
    countries: [fr, gb]
    body:
      - The Republic’s revenge fell on prisoners and civilians alike. In Nantes the representative on mission Jean-Baptiste Carrier had prisoners, among them priests, women and children, drowned in the Loire from November 1793 to February 1794, perhaps 4,000 or more, and thousands more were shot or guillotined there and at Angers. From January 1794 General Louis-Marie Turreau sent twelve “infernal columns” across the region with orders to burn villages and kill the rebels, and they killed tens of thousands of people, many of them not rebels at all; at Les Lucs-sur-Boulogne in February some hundreds of villagers were massacred. The killing revived the revolt, and Charette and Stofflet fought on in the bocage.
      - After the fall of Robespierre in July 1794 the Republic changed course. By the Treaty of La Jaunaye on 17 February 1795 Charette made peace in return for an amnesty, freedom of worship and exemption from conscription, and Stofflet followed in May. But in June 1795 British ships landed émigré regiments on the Quiberon peninsula in Brittany, and Charette took up arms again. General Lazare Hoche crushed the landing in July and set about pacifying the west with both force and concessions. Stofflet was captured and shot at Angers on 25 February 1796, and Charette, taken in the woods near La Chabotterie, was shot at Nantes on 29 March. By the summer the west was at peace.
    facts:
      - [Drownings at Nantes, "November 1793 – February 1794"]
      - [Treaty of La Jaunaye, "17 February 1795"]
      - [Charette shot at Nantes, "29 March 1796"]
