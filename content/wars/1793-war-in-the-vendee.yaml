id: war-in-the-vendee
name: War in the Vendée
start: "1793-03"
end: "1796-07"
tier: B
summary: A royalist and Catholic rising in western France, south of the lower Loire, against the French Republic. Sparked by conscription in March 1793, the Catholic and Royal Army won a string of victories that summer but was destroyed after crossing the Loire, and the Republic’s repression killed tens of thousands of prisoners and civilians before the last leaders were captured and shot in 1796.
countries: [fr, gb]
sides:
  - id: ve
    name: Vendéans and royalists
    polities: []
    ink: red
    moves: Vendéan moves
    success: Vendéan success
  - id: fr
    name: The French Republic
    polities: [france]
    ink: navy
    moves: Republican moves
    success: Republican success
notes:
  - The insurgent region, the “Vendée militaire”, took in parts of four départements, Vendée, Maine-et-Loire, Loire-Inférieure (today Loire-Atlantique) and Deux-Sèvres. North of the Loire a related guerrilla war, the Chouannerie, went on in Brittany, Maine and Normandy until 1800, and smaller risings followed in the Vendée in 1799, 1815 and 1832.
  - Estimates of the dead have varied widely and are still debated. One recent estimate is about 200,000 in all, some 170,000 of them people of the insurgent region, a fifth or more of its population.
