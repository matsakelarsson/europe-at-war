steps:
  - title: The Catholic and Royal Army
    date: March – December 1793
    when: "1793-03-10"
    borders: "1793-12-23"
    countries: [fr]
    body:
      - In March 1793, when the Republic ordered a levy of 300,000 men for its armies, the countryside south of the lower Loire rose in revolt. Its peasants already resented the Revolution’s treatment of the Church, which had driven out the priests who refused to swear the oath to the new constitution. At Machecoul insurgents killed well over a hundred republicans in the first weeks. The rebels chose leaders from among themselves, such as the carter Jacques Cathelineau and the gamekeeper Jean-Nicolas Stofflet, and from the local nobles, such as Charette, Bonchamps, d’Elbée and Henri de La Rochejaquelein. Their Catholic and Royal Army took Thouars, Fontenay, Saumur and Angers in May and June, but its attack on Nantes on 29 June failed, and Cathelineau was mortally wounded.
      - The Convention ordered the Vendée to be destroyed and sent in the veteran Army of Mainz, freed by that city’s surrender. The Vendéans won at Torfou in September but were beaten at Cholet on 17 October, where d’Elbée and Bonchamps were mortally wounded; Bonchamps, dying, ordered his men to spare some 5,000 republican prisoners. Perhaps 60,000 to 100,000 people, soldiers with women, children and old people, then crossed the Loire at Saint-Florent-le-Vieil, hoping to meet a British fleet. They failed to take the port of Granville in November and turned back, and were destroyed at Le Mans on 12–13 December and at Savenay on 23 December, where thousands were killed in the fighting and the massacres that followed.
    facts:
      - [Battle of Saumur, "9 June 1793, Vendéan victory"]
      - [Battle of Cholet, "17 October 1793, republican victory"]
      - [Battle of Savenay, "23 December 1793, the Catholic and Royal Army destroyed"]
