        lonlat: [2.895, 42.699]
      - kind: battle
        side: es
        name: Battle of Truillas
        date: 22 September 1793
        text: Ricardos beat General Dagobert’s attack in a hard fight, his last great success.
        lonlat: [2.84, 42.62]
        lp: b
      - kind: taken
        side: es
        name: Collioure
        date: 20 December 1793
        text: Cuesta’s troops took Collioure, Port-Vendres and Fort Saint-Elme, giving the Spanish ports on the coast of Roussillon.
        lonlat: [3.083, 42.526]
