id: war-of-the-pyrenees
name: War of the Pyrenees
start: "1793-03-07"
end: "1795-07-22"
tier: B
summary: The war between Revolutionary France and Spain, with a Portuguese contingent, fought on both ends of the Pyrenees in 1793–1795 as part of the War of the First Coalition. A Spanish army under Antonio Ricardos invaded Roussillon in 1793, but in 1794 the French drove it out, won the Battle of the Black Mountain and took Figueres, while in the west they overran the Basque provinces. Spain made peace at Basel in July 1795, giving up its half of Hispaniola.
countries: [fr, es, pt]
sides:
  - id: fr
    name: France
    polities: [france]
    ink: navy
    moves: French moves
    success: French success
  - id: es
    name: Spain and Portugal
    polities: [spain, portugal]
    ink: gold
    moves: Spanish and Portuguese moves
    success: Spanish success
notes:
  - Also called the War of Roussillon or the War of the Convention (in Spanish Guerra del Rosellón or Guerra de la Convención, in Catalan Guerra Gran). Spanish ships and troops also helped defend Toulon in 1793; that siege is told with the French Revolutionary Wars.
  - Dates are Gregorian. French sources of the time use the Revolutionary calendar from late 1793.
