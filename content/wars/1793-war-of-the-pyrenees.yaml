        polygon: [[2.53, 42.39], [2.62, 42.5], [2.85, 42.6], [3.05, 42.56], [3.17, 42.46], [3.0, 42.43], [2.86, 42.43], [2.7, 42.37]]
  - title: Boulou, the Black Mountain and Basel
    date: April 1794 – July 1795
    when: "1794-04-29"
    borders: "1795-07-22"
    countries: [fr, es, pt]
    body:
      - The Republic, its internal revolts crushed, now sent larger armies south. General Dugommier, who had retaken Toulon, broke the Spanish lines on the Tech at Boulou on 29 April – 1 May 1794, and the Spanish fled over the border leaving their guns and baggage. Collioure fell in May with its 7,000-strong garrison, and Bellegarde was starved into surrender in September. From 17 to 20 November Dugommier attacked the Spanish entrenchments around the Black Mountain north of Figueres. Both commanders were killed, Dugommier and the Count of La Unión, and the Spanish army broke. The great fortress of Sant Ferran at Figueres surrendered within days with some 9,000 men, and Roses fell in February 1795.
      - In the west General Moncey seized the Baztan valley in July 1794, then Fuenterrabía on 1 August and San Sebastián two days later, both with little resistance. In 1795 he pushed into Álava and Biscay, taking Vitoria on 17 July and Bilbao two days later, and crossed the Ebro. Spain, with its armies beaten and its treasury empty, made peace at Basel on 22 July 1795. France gave back all it had taken in Spain and received the Spanish half of the island of Hispaniola. Charles IV gave his minister Manuel Godoy the title “Prince of the Peace”, and in 1796 Spain allied itself with France against Britain.
    facts:
      - [Battle of the Black Mountain, "17–20 November 1794, French victory"]
      - [Peace of Basel, "22 July 1795"]
      - [Ceded by Spain, Santo Domingo (the eastern part of Hispaniola)]
