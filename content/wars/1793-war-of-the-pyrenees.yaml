steps:
  - title: Ricardos in Roussillon
    date: March 1793 – March 1794
    when: "1793-03-07"
    borders: "1793-12-20"
    countries: [fr, es, pt]
    body:
      - France declared war on Spain on 7 March 1793, six weeks after guillotining Louis XVI, a Bourbon cousin of Charles IV. In April Captain General Antonio Ricardos crossed the eastern Pyrenees into Roussillon with a small but well-led army. He beat the French at Mas Deu on 19 May and besieged the frontier fort of Bellegarde, which surrendered on 24 June. In September he sent two divisions to cut off Perpignan, the provincial capital, but they were stopped at Peyrestortes on 17 September; five days later Ricardos beat the main French army at Truillas and fell back to a strong position on the River Tech.
      - "French attacks on his lines failed through the autumn. A Portuguese division of some 5,000 men under John Forbes joined the Spanish, and on 20 December General Cuesta took the ports of Collioure and Port-Vendres, so that the Spanish wintered on French soil. On the Basque frontier the war was a matter of raids and outposts along the Bidasoa. The French Republic was harsh with its own people as well as its enemies: generals who lost battles risked the guillotine, royalist prisoners were shot, and in March 1794, after some of their young men fled across the border, the people of Sare and other French Basque villages were deported to the Landes, where some 1,600 died. Ricardos died in Madrid on 6 March 1794."
    facts:
      - [Battle of Mas Deu, "19 May 1793, Spanish victory"]
      - [Battle of Truillas, "22 September 1793, Spanish victory"]
      - [Collioure taken, "20 December 1793"]
    markers:
      - kind: battle
        side: es
        name: Battle of Mas Deu
        date: 19 May 1793
        text: Ricardos routed General de Flers’s army near Trouillas, opening the way to the frontier forts.
        lonlat: [2.78, 42.6]
        lp: l
      - kind: siege
        side: es
        name: Bellegarde
        date: 23 May – 24 June 1793
