  - title: Praga and the Third Partition
    date: November 1794 – 1795
    when: "1794-11"
    borders: "1795-10-24"
    countries: [pl, lt, by, ua, ru, de, at]
    body:
      - Suvorov joined Fersen and on 4 November stormed Praga, the fortified suburb of Warsaw on the east bank of the Vistula. Russian troops then killed defenders and inhabitants alike; some estimates put the dead, soldiers and civilians together, at up to 20,000. Warsaw capitulated the next day to avoid the same fate. The last insurgent army, under Tomasz Wawrzecki, surrendered near Radoszyce on 16 November.
      - Russia, Prussia and Austria divided what remained. Russia and Austria agreed terms in January 1795, and the final convention was signed on 24 October. Russia took Lithuania, western Belarus, western Volhynia and Courland; Prussia took Warsaw, Masovia and Podlasie; Austria took Kraków, Lublin and the lands between. Stanisław August abdicated at Grodno on 25 November 1795. Poland–Lithuania disappeared from the map, and no Polish state existed again until 1807.
    facts:
      - [Storming of Praga, "4 November 1794"]
      - [Third Partition, "Final convention 24 October 1795"]
      - [Abdication of the last king, "25 November 1795"]
    markers:
      - kind: battle
        side: ru
        name: Storming of Praga
        date: 4 November 1794
        text: The assault took a few hours. The killing that followed, of civilians as well as soldiers, became notorious across Europe.
        lonlat: [21.04, 52.25]
      - kind: event
        side: ru
        name: Radoszyce
        date: 16 November 1794
        text: Wawrzecki’s remaining troops laid down their arms, ending the rising.
        lonlat: [20.25, 51.07]
      - kind: event
        name: The king abdicates
        date: 25 November 1795
        text: Stanisław August, living under Russian supervision in Grodno, signed his abdication. He died in St Petersburg in 1798.
        lonlat: [23.83, 53.68]
