id: kosciuszko-uprising
name: Kościuszko Uprising
start: "1794"
end: "1794"
tier: A
summary: A national rising led by Tadeusz Kościuszko against Russian control after the Second Partition. It won at Racławice and drove the Russians out of Warsaw and Vilnius, but Russian and Prussian armies crushed it by November 1794, and in 1795 the Third Partition divided what was left of Poland–Lithuania between Russia, Prussia and Austria.
