notes:
  - "“White Lotus” was a name officials used for many sects; historians such as Barend ter Haar argue that the rebels did not call themselves by it. Some sources date the rebellion from the persecution of 1794, others from the rising of 1796."
  - "The cost figure is the state’s own: Yingcong Dai gives about 120 million taels, roughly twice the cost of the second Jinchuan war; older works give 200 million. Rebel losses are rough estimates, and civilian deaths from fighting, famine and flight were not counted."
