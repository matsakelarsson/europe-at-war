  - title: Stockades and militia
    date: 1799–1804
    when: "1801"
    borders: "1804-09-01"
    countries: [cn]
    body:
      - "The new commanders changed the way the war was fought. Following a policy known as “strengthen the walls and clear the countryside”, officials gathered the villagers of the highlands into hundreds of walled stockades with their grain, organised them into militias led by local gentry, and left the open country empty of food. Rebels who surrendered were promised pardon, and many joined the militias. The bands, unable to feed themselves, broke into ever smaller groups and were hunted down."
      - "Most of the leaders of 1796 were dead or captured by 1801, and the court declared the war over in 1804, although mopping up and unrest among the disbanded militiamen went on into 1805. The cost, about 120 million taels by the state’s own figures, drained the treasury the Qianlong Emperor had filled. The war showed that the banners and the Green Standard army could no longer defend the dynasty alone; the gentry-led militia that had won it became the model for the regional armies that fought the Taiping half a century later."
    facts:
      - [Policy, "fortified villages, local militia and amnesty"]
      - [War declared over, "1804"]
      - [Cost to the state, "about 120 million taels"]
      - [Rebels killed, "about 100,000 (estimate)"]
