  - title: The long war in the mountains
    date: 1797–1799
    when: "1798-04"
    borders: "1799-02-22"
    countries: [cn]
    body:
      - "The Qing armies, Green Standard troops, bannermen brought from as far as Manchuria and hired local braves, chased the bands through the mountains without catching them. Commanders sent in reports of victories that had not happened, padded their musters and embezzled the war funds, and officers and their patrons at court, above all the Qianlong Emperor’s favourite Heshen, profited from the war. Soldiers plundered the villages as freely as the rebels, and many villagers joined the bands."
      - "In the spring of 1798 Qing troops trapped Wang Cong’er’s band in the mountains near Yunxi in north-western Hubei, and she and Yao Zhifu threw themselves from a cliff rather than be captured. Wang Sanhuai was captured the same year. The rising went on under other leaders. The Qianlong Emperor, who had abdicated in 1796 but kept power, died on 7 February 1799. Within days the Jiaqing Emperor had Heshen arrested, and on 22 February he ordered him to kill himself. He put new men in charge of the war, Lebao and then the Manchu general Eldemboo."
    facts:
      - [Death of Wang Cong’er, "1798, near Yunxi"]
      - [Death of the Qianlong Emperor, "7 February 1799"]
      - [Fall of Heshen, "February 1799"]
