steps:
  - title: Sects and settlers
    date: 1794–1797
    when: "1796-02"
    borders: "1796-12-01"
    countries: [cn]
    body:
      - "In the 18th century hundreds of thousands of poor migrants from the crowded lowlands had moved into the forested highlands between the Han and the Yangtze, on the borders of Hubei, Sichuan and Shaanxi, clearing hillsides for maize and working in mines, ironworks and timber camps. Government was thin, and the teachings of the sects spread quickly. In 1794 the court ordered a hunt for the sect leaders; the teacher Liu Zhixie escaped, and local runners and clerks used the search to extort money from anyone they could accuse."
      - "Early in 1796, the first year of the Jiaqing reign, sect followers rose at Zhijiang and Yidu on the Yangtze in western Hubei, and soon after around Xiangyang, where Wang Cong’er, the young widow of the executed sect leader Qi Lin, led a band with Yao Zhifu. In the autumn the sects of eastern Sichuan rose at Dazhou and Dongxiang under Xu Tianzhi, Wang Sanhuai and Leng Tianlu. Rather than hold towns, the rebels formed mobile bands of thousands that lived off the land and moved through the mountains, and in 1797 the Xiangyang bands marched through Henan and Shaanxi into Sichuan."
    facts:
      - [Campaign against the sects, "from 1794"]
      - [Rising in western Hubei, "early 1796"]
      - [Rising in eastern Sichuan, "autumn 1796"]
