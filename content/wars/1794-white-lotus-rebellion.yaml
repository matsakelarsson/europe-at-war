id: white-lotus-rebellion
name: White Lotus Rebellion
start: "1794"
end: "1804-09"
tier: B
summary: "A rebellion in the mountains where Hubei, Sichuan and Shaanxi meet, led by followers of the millenarian sects the Qing called the White Lotus, who taught that the Eternal Venerable Mother would send the Buddha Maitreya to save the faithful at the end of the age. The highlands of the upper Han River had filled with poor settlers in the 18th century, and the sects spread among them. A government campaign against the sects from 1794, carried out by extortionate local officials, drove them to revolt in 1796 in western Hubei and then in eastern Sichuan. Mobile rebel bands, among them one led by the young widow Wang Cong’er, moved through five provinces for years while badly led and corrupt Qing armies failed to catch them. After the death of the Qianlong Emperor and the fall of his favourite Heshen in 1799, the Jiaqing Emperor’s commanders moved the people into fortified villages, raised local militias and offered amnesty, and starved the bands out. The war was declared over in 1804. It cost the state, by its own reckoning, about 120 million taels, and some 100,000 rebels are thought to have been killed; civilian losses are unknown."
countries: [cn]
sides:
  - id: qing
    name: Qing dynasty
    polities: [qing]
