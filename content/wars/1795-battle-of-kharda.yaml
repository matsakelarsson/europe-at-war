id: battle-of-kharda
name: Battle of Kharda
start: "1795-03-11"
end: "1795-04"
tier: C
summary: "The last campaign in which all the Maratha chiefs fought together under the Peshwa’s government at Pune (Poona). The Nizam of Hyderabad, Nizam Ali Khan, owed the Marathas arrears of chauth (a share of revenue) and refused to pay, and his minister Azim-ul-Umara insulted the Peshwa’s envoys. Under the direction of Nana Phadnavis, the armies of the Peshwa, Daulat Rao Scindia, Tukoji Holkar and Raghuji Bhonsle of Nagpur, led in the field by Parashuram Bhau Patwardhan, met the Nizam’s army near Kharda, south-east of Ahmednagar, on 11 March 1795. After a short fight, in which a Scindia counter-attack drove back the French-trained infantry of Michel Raymond, the Nizam took refuge in the small fort of Kharda, where the Marathas cut off his supplies. After some three weeks of hunger and thirst he came to terms. He ceded lands including the fortress of Daulatabad, promised a large indemnity and surrendered Azim-ul-Umara, who was held at Pune. The British, although the Nizam’s allies, did not intervene, and he responded by enlarging Raymond’s French-officered corps. Most of what he lost was returned in 1796, when Nana Phadnavis needed his support in the succession crisis that followed the death of the young Peshwa Sawai Madhavrao in October 1795."
