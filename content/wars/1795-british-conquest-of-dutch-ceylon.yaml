id: british-conquest-of-dutch-ceylon
name: British Conquest of Dutch Ceylon
start: "1795-08-01"
end: "1796-02-25"
tier: C
summary: "The British capture of the Dutch East India Company’s coastal provinces of Ceylon during the French Revolutionary Wars. After France overran the Dutch Republic and set up the Batavian Republic in January 1795, the exiled Prince of Orange told Dutch colonial governors in the Kew Letters to admit British troops. An expedition from Madras of about 2,700 men under Colonel James Stuart, with Rear-Admiral Peter Rainier’s squadron, landed near Trincomalee in August 1795; the town surrendered on 26 August after a short bombardment and Fort Ostenburg on 31 August. Batticaloa, Jaffna, Mullaitivu and Mannar followed in September and October. The Swiss Regiment de Meuron, the backbone of the Dutch garrison, had already been bought into British service. Stuart landed at Negombo in February 1796, and Governor Johan van Angelbeek surrendered Colombo without a fight on 15–16 February; Galle followed a few days later. The Dutch formally ceded Ceylon at the Peace of Amiens in 1802, when it became a British Crown colony."
