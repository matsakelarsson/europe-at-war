  - title: Blaauwberg
    date: January 1806
    when: "1806-01-08"
    borders: "1806-01-08"
    countries: [za, gb, nl]
    view:
      center: [18.63, -33.91]
      size: [80, 75]
    body:
      - When war between Britain and France resumed in 1803, the Batavian Cape became a target again. A fleet under Commodore Sir Home Popham carried about 6,600 troops under Major-General Sir David Baird into Table Bay on 4 January 1806. Heavy surf delayed the landing, and on 6 January the troops began coming ashore at Melkbosstrand, north of the town, where a merchant ship was run aground to break the waves; one boat capsized and 36 Highlanders drowned.
      - Governor Janssens marched out with about 2,000 men, a mixed force of Batavian regulars, German mercenaries of the Waldeck battalion, French sailors and marines from wrecked ships, burgher cavalry, Khoikhoi light infantry, and Javanese artillerymen and enslaved Mozambicans serving the guns. On 8 January 1806 the two armies met on the plain below the Blaauwberg. The Waldeck battalion broke at the first British bayonet charge, and Janssens withdrew; the British lost 15 killed and 189 wounded, the Batavians and their allies about 340 killed, wounded and missing.
      - Cape Town capitulated on 10 January. Janssens had retreated with his remaining troops to the Hottentots-Holland mountains, hoping to hold out in the interior, but with the colony’s capital lost and no help coming he capitulated on 18 January, and he and his soldiers were shipped back to the Netherlands. In the Convention of London of 13 August 1814 the Netherlands ceded the Cape to Britain, which ruled it as a colony until the Union of South Africa in 1910.
