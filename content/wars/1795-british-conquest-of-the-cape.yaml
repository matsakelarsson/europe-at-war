steps:
  - title: Muizenberg
    date: June – September 1795
    when: "1795-08-07"
    borders: "1795-08-07"
    countries: [za, gb, nl]
    view:
      center: [18.47, -34.04]
      size: [60, 60]
    body:
      - In January 1795 French armies overran the Dutch Republic and local revolutionaries proclaimed the Batavian Republic. The stadtholder, William V, fled to England and from Kew wrote to the governors of the Dutch colonies telling them to admit British troops to protect them from the French. A British squadron under Vice-Admiral Sir George Elphinstone, with about 1,800 soldiers under Major-General James Craig, anchored in Simon’s Bay, in False Bay, on 11 June 1795. The Company’s commissioner-governor, Abraham Sluysken, and the garrison commander, Colonel Robert Jacob Gordon, played for time, uncertain whom to obey; many burghers favoured the new republic, and the colony itself was in turmoil, as the frontier districts had just thrown out the Company’s officials.
      - Craig landed at Simon’s Town on 14 July. The road to Cape Town ran along the shore under the mountains at Muizenberg, where the Dutch held a fortified camp with Company regulars, burgher militia and the Pandour corps of Khoikhoi and free black soldiers, about 3,600 men in all across the colony. On 7 August 1795 Craig attacked with soldiers and about 1,000 seamen while ships’ guns bombarded the camp from the bay, and the defenders fell back to Wynberg. Through August the British held Muizenberg against Dutch counter-attacks and burgher raids.
      - On 3 September a fleet of East India Company ships brought about 4,000 more troops under General Alured Clarke. They advanced on Cape Town, brushing aside the Dutch at Wynberg on 14 September, and Sluysken, given a 24-hour ultimatum, surrendered the colony on 15 September; the articles of capitulation were signed the next day. British losses in the campaign were a few killed and some 70 wounded.
