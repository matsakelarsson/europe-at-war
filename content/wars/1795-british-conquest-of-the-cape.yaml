  - title: The frontier, Saldanha Bay and the Batavian interlude
    date: 1795–1803
    when: "1796-08-17"
    borders: "1803-03-01"
    countries: [za, gb, nl]
    body:
      - The colony the British took was not at peace. In February 1795 the burghers of Graaff-Reinet, angry at Company taxes and at a landdrost who tried to restrain their commandos against the Xhosa and the San, had expelled him and proclaimed themselves independent; Swellendam followed in June. Both were made to submit to the British, Graaff-Reinet in 1796, but the frontier burghers rose again in 1799 under Marthinus Prinsloo, and in the same year Khoikhoi servants and Xhosa chiefdoms began the long fighting on the eastern frontier known as the Third Frontier War.
      - In August 1796 a Batavian squadron of three ships of the line and several frigates under Rear-Admiral Engelbertus Lucas arrived to retake the Cape. It anchored in Saldanha Bay, where Elphinstone’s much stronger fleet trapped it, and on 17 August Lucas surrendered without a fight; many of his crews had no wish to fight for the new republic.
      - By the Peace of Amiens (1802) Britain returned the Cape to the Batavian Republic, which took it over on 21 February 1803. Its commissioner-general, Jacob Abraham de Mist, and governor, Jan Willem Janssens, began reforms of local government, the church and schools, and Janssens travelled to the eastern frontier to make peace with the Xhosa chiefs. The Batavian administration lasted less than three years.
