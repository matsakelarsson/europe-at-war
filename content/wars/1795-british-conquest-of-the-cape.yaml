notes:
  - The Cape was governed by the Dutch East India Company (VOC) until 1795. The Batavian Republic, which succeeded the Dutch Republic, governed it directly from 1803 to 1806.
  - The capitulation of 1795 is dated 15 September in some accounts and 16 September in others; the governor accepted the British terms on the first day and the articles were signed on the second.
