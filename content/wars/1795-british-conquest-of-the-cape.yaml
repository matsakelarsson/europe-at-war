id: british-conquest-of-the-cape
name: British conquest of the Cape
start: "1795-06-11"
end: "1806-01-18"
tier: B
summary: "The two British invasions that took the Cape of Good Hope from the Dutch, an outcome of the French Revolutionary and Napoleonic Wars. When French armies overran the Dutch Republic in 1795 and the Batavian Republic was proclaimed, Britain moved to keep the Cape, the half-way station on the sea route to India, out of French hands. A squadron under Vice-Admiral George Elphinstone, with troops under Major-General James Craig, anchored in False Bay in June 1795, bearing letters from the exiled stadtholder William V asking the Dutch East India Company’s governor, Abraham Sluysken, to admit them. He refused; the British forced the Muizenberg pass on 7 August, and when reinforcements under General Alured Clarke arrived in September the colony capitulated. A Batavian squadron sent to retake it surrendered in Saldanha Bay in August 1796. The Peace of Amiens returned the Cape to the Batavian Republic, which took it over in February 1803, but when war resumed Britain sent a second expedition: Sir David Baird’s army landed north of Cape Town, defeated Governor Jan Willem Janssens’s smaller and mixed force at Blaauwberg on 8 January 1806, took Cape Town on 10 January and received Janssens’s capitulation on 18 January. The Netherlands ceded the colony to Britain in 1814."
countries: [za, gb, nl]
sides:
  - id: gb
    name: Great Britain
    polities: [united-kingdom]
    ink: red
