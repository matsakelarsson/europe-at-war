  - title: Camp Liberté falls
    date: January – June 1796
    when: "1796-06-19"
    borders: "1796-06-19"
    countries: [gd, gb, fr]
    view:
      center: [-61.69, 12.12]
      size: [60, 60]
    body:
      - Through 1795 yellow fever killed British soldiers faster than reinforcements arrived, and a night attack on Belvidere in May failed. Early in 1796 the insurgents, with officers and men sent from Guadeloupe, besieged Grenville and took the British posts on the east coast; in late February the garrison of Pilot Hill, cut off from water and supplies, slipped away past their lines. In March Brigadier-General Oliver Nicolls, with fresh regiments, attacked around Grenville and Marquis and drove the insurgents back into the mountains around Grand Étang and Belvidere, and in May he retook Pilot Hill and Post Royal.
      - In June Sir Ralph Abercromby’s expedition gave the British a great superiority in numbers. About 200 French republican soldiers surrendered at Gouyave on 10 June, and Abercromby refused Fédon’s offer to give up if he and his officers could go to Guadeloupe. On the night of 18–19 June British troops climbed the mountain and stormed the redoubts of Camp Liberté, and the insurgent army broke up; Fédon’s wife, Marie Rose, was probably killed. Fédon was last seen on 27 June. A reward for his capture was never claimed, and his fate is unknown.
      - The colonial government condemned some 400 people by an act of attainder. Dozens of leaders and free men of colour were hanged after summary trials, many enslaved rebels were executed without trial, and about 500 were sold off the island. About 7,000 enslaved people died in the revolt, and Candlin estimates that some 1,000 whites and free people of colour died. Fédon’s estates were confiscated, and the French-speaking planter class lost what was left of its influence.
