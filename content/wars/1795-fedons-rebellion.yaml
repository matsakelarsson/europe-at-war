steps:
  - title: The rising of 2 March 1795
    date: March – April 1795
    when: "1795-03-02"
    borders: "1795-03-03"
    countries: [gd, gb, fr]
    view:
      center: [-61.69, 12.12]
      size: [60, 60]
    body:
      - "After the British took Grenada from France in 1763, and again after it was returned to Britain in 1783, the island’s French Catholic planters and its many free people of colour lost much of their land and their rights to British settlers and laws. The French Revolution and the abolition of slavery by the National Convention in 1794 gave them a new ally: Victor Hugues, who retook Guadeloupe from the British in 1794, sent arms, officers and commissions to rebels in Grenada, Saint Vincent and Saint Lucia. In Grenada he named Julien Fédon commander of the insurgents."
      - On the night of 2 March 1795 Fédon’s men struck two towns at once. At Grenville (La Baye) on the east coast they killed about 20 British inhabitants in the market place; at Gouyave (Charlotte Town) on the west coast no one died. The lieutenant governor, Ninian Home, was captured with others on his way back to St George’s, and within days some forty prisoners were held at Belvidere. Enslaved people left the estates in large numbers to join the insurgents, who promised them freedom, and the British held little outside St George’s.
      - Fédon fortified Belvidere, high on a steep mountain in the centre of the island, in a series of redoubts called Camp Liberté. The British failed to take it in March, and on 8 April another attack, in which a free coloured militia under Louis La Grenade fought on the British side, was beaten off; Fédon’s brother was killed. That day Fédon had his hostages killed, 44 of 47 according to one count, Home among them.
