id: fedons-rebellion
name: Fédon’s Rebellion
start: "1795-03-02"
end: "1796-06-19"
tier: B
summary: "The rising of 1795–1796 against British rule in Grenada, led by Julien Fédon, a planter of mixed African and French descent who owned the Belvidere estate in the mountains of the interior. Grenada had been French until 1763 and again in 1779–1783, and its French-speaking Catholic and free coloured inhabitants suffered under British laws that excluded them from office and restricted their rights. Encouraged and armed by Victor Hugues, the commissioner of the French Republic in Guadeloupe, which had abolished slavery in 1794, Fédon and his followers attacked Grenville and Gouyave on the night of 2 March 1795 and captured the lieutenant governor, Ninian Home. Thousands of enslaved people joined them; the historian Kit Candlin estimates about 12,500, half of the enslaved population. After a failed British attack on his fortified camp on 8 April, Fédon had most of his hostages killed, among them Home. For more than a year the insurgents held almost all the island except St George’s, beating off attacks on Belvidere and taking the British posts on the east coast in early 1796. British reinforcements under Brigadier-General Oliver Nicolls began to turn the war in March 1796, and when Sir Ralph Abercromby’s expedition arrived in June, British troops stormed Fédon’s camp on 19 June 1796. Fédon was never found. Dozens of leaders were executed after summary trials, and hundreds more were condemned; about 7,000 enslaved people, a quarter of the island’s enslaved population, died in the revolt, and damage was put at £2.5 million."
countries: [gd, gb, fr]
