notes:
  - Fédon held a commission as a general of the French Republic, and the insurgents fought under the French tricolour, but most of them were Grenadians, free people of colour and enslaved and formerly enslaved people. Historians differ on whether Fédon aimed at a French Grenada, at a republic ruled by its free coloured people or at general emancipation.
  - The number of hostages killed on 8 April 1795 is given as 44 of 47 in the modern account summarised by Wikipedia, and as about 48 to 51 in older ones. Figures for the dead of the whole revolt are estimates.
