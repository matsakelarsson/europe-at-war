id: miao-rebellion-1795
name: Miao rebellion (1795–1806)
start: "1795"
end: "1806"
tier: C
summary: "A rising of the Miao (Hmong and related peoples) of the mountains where western Hunan meets north-eastern Guizhou, around Songtao, Yongsui, Qianzhou and Fenghuang. Through the 18th century the Qing had replaced the hereditary native chiefs of the region with regular officials, and Han Chinese settlers and moneylenders had taken much of the best land, often with the help of officials who extorted and over-taxed the Miao. Early in 1795 Miao villages rose under leaders such as Shi Liudeng in Guizhou and Shi Sanbao and Wu Bayue in Hunan, killed settlers and besieged towns. The Qianlong Emperor sent two of his leading commanders, Fuk’anggan and Helin, with banner troops, Green Standard battalions from neighbouring provinces and local militia; both died in camp in 1796, and the withdrawal of troops from Hubei to fight the Miao is thought to have helped the White Lotus rising there. The main Miao forces were broken by 1797 and their leaders killed or captured, but resistance went on in the hills for years. Under the official Fu Nai, the Qing confiscated rebel land for military colonies, built forts and watchtowers and rebuilt the old Ming frontier wall, the Southern Great Wall, to separate Miao and Han villages, and the region was declared settled in 1806. Losses on both sides are not known."
