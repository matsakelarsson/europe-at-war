notes:
  - The Battle of Krtsanisi was fought on 8–11 September 1795, with the decisive attack and the fall of Tbilisi on 11 September. Numbers for the armies and the dead differ between Georgian, Persian and Russian sources.
  - Zubov’s army set out from Kizlyar in April 1796 and had reached the junction of the Kura and the Aras by November, when Paul ordered it home.
