id: persian-expedition-1796
name: Persian Expedition of 1796
start: "1795"
end: "1796"
tier: C
summary: In September 1795 Agha Mohammad Khan Qajar, who was restoring Persian rule over the Caucasus, defeated King Erekle II of Kartli-Kakheti at Krtsanisi and sacked Tbilisi, because Erekle had placed eastern Georgia under Russian protection in the Treaty of Georgievsk (1783). The city was burned, many of its people were massacred and some 15,000 captives were carried off to Persia, while Russia sent no help. In 1796 Catherine the Great sent an army under Count Valerian Zubov, which stormed Derbent in May and occupied Baku, Shamakhi and Ganja without a fight, but after Catherine’s death in November Emperor Paul recalled it. Agha Mohammad Khan was murdered at Shusha in 1797, and Russia annexed eastern Georgia in 1801.
