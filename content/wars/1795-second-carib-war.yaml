  - title: French reinforcements and Abercromby’s campaign
    date: "1795 – October 1796"
    when: "1796-06"
    borders: "1796-06-11"
    countries: [vc, lc, gb, fr]
    body:
      - "For more than a year the British held little more than Kingstown and a few posts, while the Garifuna and the French, reinforced by Republican troops from Guadeloupe and Saint Lucia, many of them formerly enslaved men freed by the Republic, fortified camps on the heights, among them the Vigie east of the town. British attempts to push into the interior failed, with heavy losses to fever as well as to the enemy. Saint Lucia and Grenada were also in revolt."
      - "In 1796 Britain sent a large army to the Caribbean under General Sir Ralph Abercromby. After retaking Saint Lucia in May, he landed on Saint Vincent in June and on 10 June attacked the Vigie; the French surrendered the next day. Some 2,500 French prisoners, most of them Black and mulatto soldiers, were shipped to Britain and held at Portchester Castle; a plaque honouring them was unveiled there in October 2026. The Garifuna would not surrender, and British troops spent the summer burning their villages and provision grounds on the windward side, until hunger forced most of them to give themselves up by October 1796."
    facts:
      - [French surrender at the Vigie, "11 June 1796"]
      - [French prisoners shipped to Britain, "about 2,800"]
      - [Last Garifuna surrender, "October 1796"]
