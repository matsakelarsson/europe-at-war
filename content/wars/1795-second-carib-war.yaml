id: second-carib-war
name: Second Carib War
start: "1795-03-09"
end: "1797-04-12"
tier: B
summary: "The last war of the Garifuna (the “Black Caribs”) for their land on Saint Vincent, fought in alliance with Revolutionary France, which ended in the deportation of almost the whole people. British planters had pressed ever further into the lands left to the Garifuna in 1773, and in March 1795, with the encouragement of Victor Hugues, the Republican commissioner on Guadeloupe, the Garifuna rose under Joseph Chatoyer and his brother Duvallé, joined by many of the island’s French inhabitants. They burned estates on both coasts and advanced on Kingstown, but on the night of 14 March 1795 Chatoyer was killed in a British attack on his camp on Dorsetshire Hill. The Garifuna and the French, reinforced from Guadeloupe, still held most of the island for more than a year, until General Sir Ralph Abercromby landed with a large army, stormed the Vigie and received the French surrender on 11 June 1796. The Garifuna fought on until October 1796. The British then shipped 4,195 Garifuna (by some counts about 5,000) to the small, dry island of Baliceaux, where about half of them died of disease and hunger; in 1797 the 2,248 survivors were carried to the island of Roatán off the coast of Central America, where they landed on 12 April 1797. A few hundred Kalinago and Garifuna remained on Saint Vincent, and in 1804 the colony took their remaining land. Historians such as Hilary Beckles describe the deportation as ethnic cleansing and genocide; Chatoyer is the national hero of Saint Vincent and the Grenadines."
countries: [vc, gb, fr]
sides:
  - id: gb
    name: Great Britain (the colony of Saint Vincent and the army of Sir Ralph Abercromby)
    polities: [united-kingdom, british-west-indies]
    ink: red
    moves: British moves
    success: British success
  - id: gar
    name: Garifuna and Kalinago of Saint Vincent (Joseph Chatoyer, Duvallé)
    polities: [garifuna, kalinago]
