    polities: [france, french-west-indies]
    ink: blue
    moves: French moves
    success: French success
notes:
  - "The British side of the story was told by Sir William Young, the colony’s largest landowner, whose Account of the Black Charaibs (1795) was written to justify the deportation; Garifuna memory of the war and the exile is kept in oral tradition, songs and the annual pilgrimage to Baliceaux on National Heroes’ Day, 14 March."
  - "Accounts differ on how Chatoyer died: by most he was killed by Major Alexander Leith in the night attack on Dorsetshire Hill, by others in a duel or by a shot in the fighting."
  - The Garifuna’s life in Central America after 1797, on Roatán and along the coasts of Honduras, Guatemala, Belize and Nicaragua, belongs to the history of Central America.
