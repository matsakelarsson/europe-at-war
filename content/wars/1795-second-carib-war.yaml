steps:
  - title: The rising and the death of Chatoyer
    date: "March 1795"
    when: "1795-03"
    borders: "1795-03-14"
    countries: [vc, gb, fr]
    body:
      - "After the treaty of 1773, and again after the island returned to Britain in 1783, planters pushed into the lands promised to the Garifuna, and officials talked openly of removing them. The French Revolution gave them an ally: from 1794 Victor Hugues, the Republican commissioner who had driven the British out of Guadeloupe and abolished slavery there, sent agents, arms and proclamations to the British islands, and in March 1795 risings broke out on Grenada and Saint Vincent almost together."
      - "On 9–10 March 1795 the Garifuna rose on the windward side under Duvallé and in the north-west under Chatoyer, burning estates and killing planters, and were joined by many French inhabitants. On 12 March Chatoyer issued a proclamation calling on the French of the island to join them and threatening those who sided with the British. The two forces converged on Dorsetshire Hill, which overlooks Kingstown, and the colonists braced for an attack on the town. On the night of 14 March a party of soldiers, militia and armed sailors climbed the hill and surprised the camp; Chatoyer was killed, by most accounts by Major Alexander Leith. The attack on Kingstown did not come, but the Garifuna and their French allies held almost the whole island outside the town."
    facts:
      - [Rising begins, "9–10 March 1795"]
      - [Chatoyer’s proclamation, "12 March 1795"]
      - [Chatoyer killed on Dorsetshire Hill, "night of 14 March 1795"]
