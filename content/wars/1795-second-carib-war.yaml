  - title: Baliceaux and the deportation
    date: "1796 – April 1797"
    when: "1797"
    borders: "1797-04-12"
    countries: [vc, gb]
    body:
      - "The colonial authorities decided to remove the Garifuna from Saint Vincent altogether, separating those they classed as “Black Caribs” from the smaller number of “Yellow” Kalinago, who were allowed to stay. From the second half of 1796 the prisoners, 4,195 people by the British count, were taken to Baliceaux, a small, almost waterless island in the Grenadines south of Saint Vincent. Crowded in the open and short of food and water, they were struck by an epidemic; Garifuna tradition holds that the flour they were given had been poisoned. About half of them died there."
      - "In March 1797 the 2,248 survivors were put aboard a convoy that sailed for Roatán, an island in the Bay of Honduras, where they landed on 12 April 1797. From there most of them soon crossed to the mainland, and their descendants live along the Caribbean coast of Honduras, Guatemala, Belize and Nicaragua and in the United States. On Saint Vincent, an act of 1804 took the remaining Carib lands for sale to planters, leaving the small Kalinago and Garifuna community at Sandy Bay and Morne Ronde in the north. Saint Vincent and the Grenadines made Chatoyer its first National Hero in 2002, and in 2025 the government acquired Baliceaux as a place of memory."
    facts:
      - [Deported to Baliceaux, "4,195 (some counts about 5,000)"]
      - [Survivors carried to Roatán, "2,248"]
      - [Landing on Roatán, "12 April 1797"]
