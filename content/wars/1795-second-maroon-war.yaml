steps:
  - title: Trelawny Town takes up arms
    date: July – November 1795
    when: "1795-08"
    borders: "1795-08-15"
    countries: [jm, gb]
    view:
      center: [-77.80, 18.35]
      size: [60, 50]
    body:
      - The Maroons of Trelawny Town descended from Africans who had escaped slavery and fought the colonists of Jamaica until 1739, when their leader Cudjoe made peace with the British. The treaty gave them their own town and land and the right to govern themselves, under a white superintendent appointed by the colony, in return for returning people who escaped slavery and helping to put down revolts. By 1795 the town’s population had grown, its land no longer fed it, and the Maroons resented the dismissal of their superintendent John James in favour of a man they did not accept. In July 1795 two Trelawny men convicted of stealing pigs were flogged at Montego Bay by an enslaved man, which the Maroons took as an attack on their status as free people.
      - "The new governor, Alexander Lindsay, Earl of Balcarres, was convinced that agents of the French Republic were stirring up the Maroons, as revolution and war spread through the Caribbean after the rising in Saint-Domingue. When six Trelawny leaders, among them Montague James, came to Montego Bay to negotiate, he had them arrested and declared martial law. In August his troops marched on Trelawny Town; the Maroons burned their houses and withdrew into the Cockpit Country, a maze of steep wooded hills and sinkholes that they knew far better than their enemies."
      - The Maroons, probably no more than a few hundred fighting men, joined by some enslaved people who escaped to them, fought from ambush, and colonial columns that followed them into the hills lost heavily. Among the dead were three colonels, Sandford, Gallimore and William Fitch; Fitch was killed with many of his men after ignoring the warnings of his Accompong trackers. The colony brought some 5,000 regular soldiers and militia against them, together with the Maroons of Accompong Town, who kept their treaty with the British, while the Windward Maroon towns in the east stayed out of the war.
