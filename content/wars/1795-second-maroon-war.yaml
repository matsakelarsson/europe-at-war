notes:
  - Most of what is known of the war comes from the papers of Balcarres, Walpole and the Jamaican Assembly and from the history the planter Robert Charles Dallas published in 1803; the Maroons’ own accounts survive mainly in their petitions and in traditions in Jamaica and Sierra Leone. Numbers on the Maroon side are uncertain.
  - The figures for the deportation differ between sources, from about 550 to about 600 people; the Canadian Encyclopedia gives 550 to 600.
