id: second-maroon-war
name: Second Maroon War
start: "1795-08"
end: "1796-03"
tier: B
summary: "The war of 1795–1796 between the Maroons of Trelawny Town and the colonial government of Jamaica. Trelawny Town (formerly Cudjoe’s Town), in the hills south of Montego Bay, was the largest of the Leeward Maroon towns whose independence the British had recognised in the treaties of 1739 that ended the First Maroon War. In July 1795 two of its men, convicted of stealing pigs, were flogged at Montego Bay by an enslaved man, an insult that brought long grievances over land and over the town’s white superintendent to a head. The governor, Lord Balcarres, who feared that revolutionary ideas from Saint-Domingue and France would spread among the island’s enslaved people, seized six Maroon leaders who came to negotiate, among them Montague James, and in August sent troops against the town. The Maroons burned it and fought from the Cockpit Country, where a few hundred fighters held off some 5,000 soldiers and militia for five months, killing three colonels in ambushes, while the Accompong Maroons fought for the colony and the Windward towns stayed neutral. Major-General George Walpole’s destruction of their provision grounds and the arrival of about 100 hunting dogs and their handlers from Cuba led the Maroons to accept peace in December 1795, on Walpole’s private promise that they would not be sent off the island. Most came in only by March 1796, and Balcarres and the Assembly used the delay to deport them: in June 1796 between 550 and 600 Trelawny Town Maroons were shipped to Nova Scotia, and in 1800 most of them went on to Sierra Leone. Walpole resigned in protest."
