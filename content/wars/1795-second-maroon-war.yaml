  - title: Dogs from Cuba, the treaty and the deportation
    date: December 1795 – July 1796
    when: "1795-12"
    borders: "1795-12-22"
    countries: [jm, gb]
    view:
      center: [-77.80, 18.38]
      size: [60, 50]
    body:
      - Major-General George Walpole, who took command in the autumn, ringed the Cockpits with posts, cut off the Maroons’ water and destroyed their provision grounds. The Assembly also sent to Cuba for hunting dogs; about 100 of them arrived at Montego Bay in December 1795 with their Cuban handlers. With their families starving and the dogs in the field, Montague James’s people agreed to Walpole’s terms in late December 1795. They were to ask the king’s pardon, give up the people who had escaped slavery to join them and settle wherever the government chose in Jamaica, and Walpole promised in private that they would not be sent off the island.
      - The terms set a deadline of 1 January 1796, but most Maroons came in only in the following weeks, the last in mid-March. Balcarres and the Assembly declared that the Maroons had broken the treaty and voted to deport them. Walpole protested that his word had been broken, refused the sword of honour the Assembly voted him and resigned. The town’s land was confiscated, and soldiers’ barracks were built on it.
      - In June 1796 between 550 and 600 Maroon men, women and children were shipped to Nova Scotia in the Dover, the Mary and the Ann, landing at Halifax on 21–22 July. They worked on the fortifications of Halifax and settled at Preston, but many died in the harsh winters, and in 1800 most of them sailed to Sierra Leone, where the Sierra Leone Company used them against a rising of the Black Loyalist settlers from Nova Scotia. Some of their descendants returned to Jamaica after 1838; Accompong and the Windward towns kept their treaties.
    facts:
      - [Dogs from Cuba, "about 100, December 1795"]
      - [Walpole’s terms, "December 1795"]
      - [Maroons deported to Nova Scotia, "550 to 600, June 1796"]
