id: irish-rebellion-of-1798
name: Irish Rebellion of 1798
start: "1798-05-23"
end: "1798-10-12"
tier: B
summary: A rising led by the Society of United Irishmen against British rule in the Kingdom of Ireland, aiming at an independent republic with French help. Risings in Leinster and Ulster in May and June 1798 were crushed, most bloodily in County Wexford, and a small French force that landed in Mayo in August surrendered at Ballinamuck. Tens of thousands died, and the rebellion led to the union of Ireland with Great Britain in 1801.
countries: [ie, gb, fr]
sides:
  - id: ui
    name: United Irishmen
    polities: []
    ink: green
    moves: Rebel moves
    success: Rebel success
  - id: gb
    name: The government
    polities: [ireland, united-kingdom]
    ink: red
    moves: Government moves
    success: Government success
  - id: fr
    name: France
    polities: [france]
    ink: navy
    moves: French moves
    success: French and rebel success
notes:
  - The government forces were mostly Irish militia and yeomanry, with British regular and fencible regiments and German mercenaries. The rebels were mostly Catholic in Leinster and Connacht and mostly Presbyterian in Ulster; sectarian killings took place on both sides.
  - Estimates of the dead range from about 10,000 to 50,000, most of them rebels and civilians.
