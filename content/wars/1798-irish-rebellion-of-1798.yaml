steps:
  - title: Leinster and Ulster rise
    date: May – July 1798
    when: "1798-05-23"
    borders: "1798-06-21"
    countries: [ie, gb]
    body:
      - The Society of United Irishmen, founded in Belfast in 1791 mainly by Presbyterian radicals, had turned from reform to republican revolution and sought help from France; a French fleet with Wolfe Tone on board reached Bantry Bay in December 1796 but could not land in the storms. In 1797 and 1798 the government broke up the movement in Ulster and Leinster under martial law, with house-burnings, floggings and pitch-capping, and in March 1798 it arrested most of the Leinster leaders. The rising began on the night of 23 May with attacks around Dublin and in Kildare, Meath and Carlow, which were quickly crushed; prisoners were shot at Dunlavin and Carnew, and the rebels were routed at Tara Hill on 26 May.
      - In County Wexford, where Catholic priests such as Father John Murphy led many of them, the rising became a mass revolt. The rebels destroyed a militia detachment at Oulart Hill on 27 May, took Enniscorthy and Wexford town and held most of the county for three weeks. Their attacks on New Ross and Arklow failed with heavy losses. On the day of New Ross rebels killed at least 100 loyalist prisoners, most of them Protestants, at Scullabogue, and more on Wexford bridge on 20 June. In Ulster the rebels of Antrim and Down were beaten at Antrim on 7 June and Ballynahinch on 13 June. On 21 June General Gerard Lake’s army stormed the main rebel camp on Vinegar Hill above Enniscorthy, and government troops killed rebels and civilians in great numbers in the weeks that followed.
    facts:
      - [Rising begins, "23–24 May 1798"]
      - [Battle of New Ross, "5 June 1798, government victory"]
      - [Battle of Vinegar Hill, "21 June 1798, government victory"]
