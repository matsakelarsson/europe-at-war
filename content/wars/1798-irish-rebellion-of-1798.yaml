  - title: The French at Killala
    date: August – November 1798
    when: "1798-08-22"
    borders: "1798-10-12"
    countries: [ie, fr, gb]
    body:
      - The French Directory sent help too late. On 22 August 1798 General Jean Humbert landed about 1,000 French soldiers at Kilcummin near Killala in County Mayo, and some thousands of local men joined him. On 27 August he routed a larger force of militia and regulars under General Lake at Castlebar, where the government troops fled so fast that the battle became known as the “Races of Castlebar”. A Republic of Connacht was proclaimed, with John Moore as its president. Humbert then marched north-east through County Sligo and turned towards the midlands, where new risings broke out in Longford and Westmeath.
      - The new Lord Lieutenant, Lord Cornwallis, closed in with much larger forces. Humbert fought his way past a militia force at Collooney on 5 September, but on 8 September, surrounded at Ballinamuck in County Longford, he surrendered. The French were treated as prisoners of war and sent home; the Irish who had joined them were cut down or hanged. On 12 October a British squadron defeated a second French expedition off Tory Island, and Wolfe Tone, captured on board, was sentenced to death in Dublin and died of a self-inflicted wound on 19 November. The British government now pressed for union, and under the Acts of Union Ireland and Great Britain became the United Kingdom on 1 January 1801.
    facts:
      - [French landing, "22 August 1798, about 1,000 men under General Humbert"]
      - [Battle of Castlebar, "27 August 1798, French and rebel victory"]
      - [Battle of Ballinamuck, "8 September 1798, French surrender"]
    markers:
      - kind: event
        side: fr
        name: French landing
        date: 22 August 1798
        text: Humbert’s three frigates put his troops ashore at Kilcummin strand, and they took Killala the same day.
        lonlat: [-9.2, 54.26]
      - kind: battle
        side: fr
        name: Battle of Castlebar
        date: 27 August 1798
        text: Humbert’s French and Irish attacked by an unexpected mountain road, and Lake’s army broke and fled, leaving its guns.
        lonlat: [-9.299, 53.861]
      - kind: battle
        side: fr
        name: Battle of Collooney
        date: 5 September 1798
        text: Humbert pushed aside a force of militia trying to block his way through County Sligo.
        lonlat: [-8.489, 54.187]
      - kind: battle
        side: gb
        name: Battle of Ballinamuck
        date: 8 September 1798
        text: After a short fight Humbert surrendered to Cornwallis. Several hundred Irish rebels were killed in the battle and after it.
        lonlat: [-7.717, 53.867]
      - kind: battle
        side: gb
        name: Killala retaken
        date: 23 September 1798
        text: The last open battle of the rising. Government troops stormed the town held by rebels and a few French officers.
        lonlat: [-9.221, 54.212]
        lp: l
