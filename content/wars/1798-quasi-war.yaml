steps:
  - title: Seizures, the XYZ affair and a new navy
    date: 1796 – July 1798
    when: "1798-07-07"
    borders: "1798-07-07"
    countries: [us, fr]
    body:
      - "In 1795 the United States made the Jay Treaty with Britain, settling the quarrels left over from the Revolution and accepting British rules on neutral trade. France, which was at war with Britain, took this as a betrayal of the treaties of 1778 and began to seize American ships trading with the British. From October 1796 to June 1797 French warships and privateers took 316 American merchant ships, about six per cent of the merchant fleet, many of them carried into Guadeloupe and the ports of Saint-Domingue; a decree of March 1797 allowed the seizure of any neutral ship without a proper crew list."
      - "President John Adams sent Charles Cotesworth Pinckney, John Marshall and Elbridge Gerry to Paris in 1797. Agents of the foreign minister, Talleyrand, called X, Y and Z in the dispatches Adams later made public, told them that talks could only begin after a large bribe and a loan to France. When the dispatches were published in April 1798, Americans were outraged. Congress created a Navy Department on 30 April 1798, ordered new frigates, revived the Marine Corps, raised a new army with George Washington at its head and cancelled the treaties with France on 7 July; it also passed the Alien and Sedition Acts, which the Federalists used against Republican critics. On 7 July the sloop USS Delaware captured the French privateer La Croyable off Egg Harbor, New Jersey, the first capture of the war, and the navy sent squadrons to the Caribbean, where most of the privateers operated."
    facts:
      - [American ships taken, "316 between October 1796 and June 1797"]
      - [XYZ dispatches published, "April 1798"]
      - [Navy Department created, "30 April 1798"]
      - [Treaties with France cancelled, "7 July 1798"]
