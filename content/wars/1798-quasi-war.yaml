  - title: The war in the Caribbean and the Convention of 1800
    date: 1799 – September 1800
    when: "1799-02-09"
    borders: "1800-01-01"
    countries: [us, fr, kn, ht, do, cw]
    link: { href: "#/war/first-barbary-war", text: First Barbary War }
    body:
      - "The new navy grew quickly, with converted merchant ships and revenue cutters as well as new frigates such as Constitution, United States and Constellation, and worked alongside the Royal Navy, sharing signals and escorting merchant convoys. On 9 February 1799 Thomas Truxtun’s Constellation captured the French frigate L’Insurgente off Nevis, the first major victory of a warship built for the new United States Navy. On 1–2 February 1800 Constellation fought the larger frigate La Vengeance in a night action in the waters between Saint Kitts and Guadeloupe; La Vengeance escaped, badly damaged. Over the war the Americans captured or sank more than a hundred French privateers and retook many merchant ships, and lost one small warship, the schooner Retaliation, captured in 1798 and later retaken."
      - "In Saint-Domingue the Adams government dealt with Toussaint Louverture, who governed the colony in France’s name but followed his own policy. In 1799 Congress allowed trade with the ports he controlled, and in the civil war between Toussaint and André Rigaud, the War of Knives, American warships blockaded Rigaud’s ports, and USS General Greene supported Toussaint’s siege of Jacmel early in 1800. In May 1800 sailors and marines from USS Constitution landed at Puerto Plata in Santo Domingo, ceded to France in 1795 but still held by Spanish officials, spiked the guns of its fort and cut out a French privateer."
      - "Napoleon, who seized power in November 1799, wanted peace with the United States, and Adams, against the wishes of many in his own party, had sent new envoys to Paris. The Convention of 1800, signed at Mortefontaine on 30 September 1800, ended the fighting and released both countries from the alliance of 1778, while the United States dropped its claims for some $20 million of shipping losses. The navy kept its new frigates, which were soon sent against Tripoli, and the split among the Federalists helped Thomas Jefferson defeat Adams in the election of 1800."
    facts:
      - [Constellation captures L’Insurgente, "9 February 1799"]
      - [Constellation and La Vengeance, "1–2 February 1800"]
      - [Convention of 1800 (Mortefontaine), "30 September 1800"]
