id: quasi-war
name: Quasi-War
start: "1798-07-07"
end: "1800-09-30"
tier: B
summary: "An undeclared naval war between the United States and the French Republic, fought mostly in the Caribbean. France, at war with Britain, saw the Jay Treaty of 1795 between the United States and Britain as a betrayal of the alliance of 1778, and French warships and privateers, many of them based on Guadeloupe and in Saint-Domingue, seized hundreds of American merchant ships. When the French foreign minister Talleyrand’s agents demanded a bribe before they would even talk with American envoys, the “XYZ affair”, Congress in 1798 created a Navy Department, cancelled the treaties with France and authorised the navy and privateers to capture armed French ships. The small new navy, working alongside the Royal Navy, captured or sank many French privateers, captured the frigate L’Insurgente in 1799 and badly damaged La Vengeance in 1800, and the United States supported Toussaint Louverture in Saint-Domingue. President John Adams, against much of his own Federalist party, sent new envoys to Paris, and Napoleon’s government agreed to the Convention of 1800 at Mortefontaine on 30 September 1800, which ended the war and the old alliance."
countries: [us, fr]
sides:
  - id: us
    name: United States (US Navy, revenue cutters and privateers)
    polities: [united-states]
    ink: blue
    moves: American moves
    success: American success
  - id: fr
    name: French Republic (navy and privateers, chiefly from Guadeloupe and Saint-Domingue)
    polities: [france, french-west-indies, saint-domingue]
    ink: purple
    moves: French moves
    success: French success
notes:
  - The name Quasi-War was given later; neither side declared war. Britain and the United States did not ally, but their navies shared signals and convoys in the Caribbean.
  - Estimates of the number of American merchant ships taken by the French over the whole period run from several hundred to as many as 2,000; between October 1796 and June 1797 alone the French took 316.
