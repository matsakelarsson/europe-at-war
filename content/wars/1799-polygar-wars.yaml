id: polygar-wars
name: Polygar Wars
start: "1799"
end: "1805-07"
tier: C
summary: "Wars between the East India Company and the palayakkarars (polygars), the hereditary chiefs of fortified domains in the Tamil south, who resisted the Company’s collection of the revenues of the Nawab of Arcot. In 1799 Veerapandiya Kattabomman, chief of Panchalankurichi, who had refused to pay tribute and whose men had killed a British officer at a meeting in Ramanathapuram, was besieged by Major John Bannerman. The fort held out against the first assault in September, but Kattabomman fled, was handed over by the Raja of Pudukkottai and was hanged at Kayathar on 16 October 1799. In 1800–1801 a wider league led by the Marudu brothers of Sivaganga, with Kattabomman’s brother Oomaithurai, chiefs in Dindigul and the Kongu country, and contacts as far as Malabar, rose again; in June 1801 the Marudu brothers issued a proclamation at Tiruchirappalli calling on all the people of the south to drive out the Company. After months of jungle fighting the Company took the rebuilt fort of Panchalankurichi in May 1801 and Kalayarkoil in October. The Marudu brothers were hanged at Tiruppattur on 24 October 1801 and Oomaithurai soon after. In the west Dheeran Chinnamalai fought on until he was captured and hanged at Sankagiri in July 1805. In July 1801 the Nawab of Arcot ceded the Carnatic to the Company, the polygars’ forts were pulled down and their armed retainers disbanded, and the palayams became zamindari estates. In Tamil Nadu these leaders are remembered as early fighters against British rule."
