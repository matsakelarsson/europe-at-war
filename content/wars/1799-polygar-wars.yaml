notes:
  - Numbering differs. Many Tamil histories count the wars of Puli Thevar against the Nawab and the Company in the 1750s and 1760s as the first Polygar War, Kattabomman’s war of 1799 as the second and the rising of 1800–1801 as the third.
  - Some polygars, such as the chief of Ettayapuram, and the Raja of Pudukkottai sided with the Company.
