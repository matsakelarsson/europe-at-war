notes:
  - The French conquest of Naples and the proclamation of the Parthenopean Republic in January 1799 are told with the French Revolutionary Wars. The republic was a French client state and is not drawn as a separate polity.
  - Ferdinand rewarded Nelson with the Sicilian dukedom of Bronte. Nelson’s part in breaking the capitulation has been debated ever since.
