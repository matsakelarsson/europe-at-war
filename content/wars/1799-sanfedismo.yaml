id: sanfedismo
name: Sanfedist campaign of 1799
start: "1799-02-07"
end: "1799-07"
tier: C
summary: The royalist peasant rising that destroyed the Parthenopean Republic, set up in Naples under French protection in January 1799. On 7 February Cardinal Fabrizio Ruffo, named vicar-general by the exiled King Ferdinand IV, landed in Calabria with eight companions and a banner bearing the royal arms and the cross. Within a month his Army of the Holy Faith (Armata della Santa Fede) had grown to some 17,000 men – peasants, priests, brigands and adventurers – and as the French withdrew most of their troops north to face the Austrians and Russians, it took Catanzaro, Crotone and Cosenza, sacked Altamura and by the end of April held Calabria, Basilicata and most of Apulia. Suspected republicans were killed in many of the towns it took. Supported by British ships and by Russian and Ottoman troops, the Sanfedisti fought their way into Naples on 13 June, and for weeks they and the city’s poor, the lazzaroni, pillaged and massacred. The republicans in the castles surrendered on terms that let them sail to Toulon, but Nelson, arriving on 24 June, refused to honour the capitulation and had them seized. The republican admiral Francesco Caracciolo was hanged from the yardarm of a Neapolitan frigate on 29 June. Of some 8,000 political prisoners, 99 were executed, among them the jurist Mario Pagano, the physician Domenico Cirillo and the journalist Eleonora Fonseca Pimentel, and hundreds more were imprisoned, deported or exiled.
