id: armed-neutrality-1801
name: War of the Second Armed Neutrality
start: "1801-03-12"
end: "1801-04-09"
tier: B
summary: A brief war in 1801 in which Britain sent a fleet to break up the Russian-led League of Armed Neutrality, which Denmark–Norway had joined. Nelson’s attack on the Danish defence line at Copenhagen on 2 April forced Denmark to suspend its part in the league, which collapsed after the murder of Tsar Paul I.
