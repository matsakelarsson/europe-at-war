  - title: The march to Derna and the peace
    date: March – June 1805
    when: "1805-03"
    borders: "1805-06-04"
    countries: [ly, us, eg]
    body:
      - William Eaton, the former American consul in Tunis, proposed to restore Hamet Karamanli, Yusuf’s elder brother, who was living in exile in Egypt. In early March 1805 Eaton and Hamet set out from near Alexandria with about 400–500 men, Greek, Arab and Berber soldiers and Hamet’s followers, with eight or nine US Marines under Lieutenant Presley O’Bannon. They marched about 800 km along the coast, through desert where water was scarce and amid quarrels over pay and supplies, and met American ships with provisions at the Gulf of Bomba.
      - On 27 April, with the brig Argus, the sloop Hornet and the schooner Nautilus firing from the sea, they stormed Derna, defended by about 800 men under its governor Mustafa Bey, in a few hours; it was the first time the American flag was raised in victory on foreign soil. A relief army of some 1,200 men sent by Yusuf under Hassan Bey attacked on 13 May and 10 June and was beaten off both times.
      - Meanwhile the American envoy Tobias Lear negotiated with Yusuf, who was alarmed by the loss of Derna. By the treaty signed on 4 June 1805 the prisoners were exchanged, the United States paid $60,000 for the release of the Philadelphia’s crew, about 300 men, and the treaty provided for no tribute. It made no provision for Hamet. On the night of 12 June Eaton’s force, with Hamet, left Derna on the frigate Constellation; Eaton accused the government of betraying its ally. Algiers went on receiving American tribute until 1815.
    facts:
      - [Derna taken, "27 April 1805"]
      - [Treaty of peace, "4 June 1805"]
      - [Ransom for the prisoners, "$60,000"]
