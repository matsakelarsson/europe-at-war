id: first-barbary-war
name: First Barbary War
start: "1801-05-10"
end: "1805-06-10"
tier: B
summary: "The war between the United States and the Regency of Tripoli under Yusuf Karamanli. Like the European powers, the United States had paid the North African regencies for safe passage for its ships; when President Jefferson refused Yusuf’s demand for more money, Yusuf declared war in May 1801 by having the flagstaff of the American consulate cut down. American squadrons, at first alongside a Swedish one, blockaded Tripoli with mixed success. In October 1803 the frigate Philadelphia ran aground off Tripoli and her crew of about 300 were taken captive; in February 1804 Stephen Decatur burned her in the harbour, and Edward Preble’s squadron bombarded the town through the summer of 1804. In 1805 the former consul William Eaton led a small force of Greek, Arab and Berber soldiers and a handful of US Marines from Egypt across the desert to take Derna for Yusuf’s exiled brother Hamet. Yusuf made peace on 4 June 1805; the United States paid $60,000 to ransom the prisoners and abandoned Hamet. Tribute to Algiers went on until the Second Barbary War of 1815."
