  - title: The Philadelphia
    date: October 1803 – September 1804
    when: "1803-10-31"
    borders: "1804-09-04"
    countries: [ly, us, it, mt]
    body:
      - On 31 October 1803 the frigate Philadelphia, chasing a Tripolitan ship close inshore, ran onto an uncharted reef about 3 km off Tripoli harbour. Her captain, William Bainbridge, threw guns overboard but could not get her off, and surrendered; he and about 300 officers and men spent the rest of the war as captives in Tripoli, and the Tripolitans refloated the ship and brought her into the harbour. To keep her from serving Yusuf, Lieutenant Stephen Decatur sailed from Syracuse with some seventy to eighty-five volunteers in a captured Tripolitan ketch, the Mastico, renamed Intrepid and rigged to look like a local trading vessel. On the night of 16 February 1804 they slipped into the harbour, boarded the Philadelphia, set her on fire and escaped under the guns of the batteries.
      - In the summer of 1804 Preble, with gunboats and bomb vessels lent by the Kingdom of Naples, attacked Tripoli repeatedly from 14 July onwards. In the gunboat fight of 3 August American boarding parties took several Tripolitan gunboats, but the bombardments did little damage to the town. On the night of 4 September the Intrepid, packed with explosives as a fire ship, blew up at the harbour entrance before reaching the Tripolitan ships, killing Lieutenant Richard Somers and all twelve of her crew. A few days later Commodore Samuel Barron arrived to take over from Preble.
    facts:
      - [Philadelphia captured, "31 October 1803"]
      - [Philadelphia burned, "16 February 1804"]
      - [Attacks on Tripoli, "July–September 1804"]
