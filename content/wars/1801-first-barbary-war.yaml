notes:
  - Americans and Europeans of the time called the ships of the North African regencies pirates. The regencies saw them as privateers (corsairs), licensed by the state to take the ships of nations that had not bought a treaty of peace; captured crews were held for ransom or put to work.
  - Tripoli was an Ottoman regency ruled by the hereditary Karamanli pashas from 1711 to 1835. Sources give 10 or 14 May 1801 for the declaration of war. The Kingdom of Naples lent the Americans gunboats and the use of its ports in 1804.
  - The march to Derna and the “shores of Tripoli” in the Marines’ Hymn made the war part of American naval and Marine Corps tradition.
