steps:
  - title: War with Tripoli and the blockade
    date: 1801–1803
    when: "1801-05"
    borders: "1802-12-31"
    countries: [ly, us, se, mt, ma]
    body:
      - Since the 1780s the North African regencies had taken American merchant ships and held their crews for ransom, and the United States, like many European states, had made treaties that paid them money and gifts. Yusuf Karamanli, who had made himself pasha of Tripoli in 1795 and sent his elder brother Hamet into exile in Egypt, complained that the gifts promised in the treaty of 1796 had not come and demanded $225,000. Jefferson, who had long argued that paying tribute only invited new demands, refused, and on 10 May 1801 Yusuf declared war in the customary way, by having the flagstaff of the American consulate cut down.
      - Commodore Richard Dale’s squadron of three frigates and a schooner, already sailing for the Mediterranean, joined a Swedish squadron under Rudolf Cederström off Tripoli, for Sweden had been at war with Yusuf since 1800. On 1 August 1801 the schooner Enterprise defeated the Tripolitan corsair Tripoli after a long fight west of Malta. But the blockade of a coast with many small harbours was hard to keep, Sweden made peace in 1802, and Dale’s successor Richard Morris achieved little; a brief quarrel with Morocco, begun when the governor of Tangier sent out corsairs without the sultan’s leave, was settled in October 1803 while the new commodore, Edward Preble, lay off Tangier with his squadron. Preble then tightened the blockade of Tripoli.
    facts:
      - [Tripoli declares war, "10 May 1801"]
      - [Enterprise takes the Tripoli, "1 August 1801"]
      - [Sweden makes peace with Tripoli, "1802"]
