  - id: es
    name: Spain and France
    polities: [spain, france]
    ink: gold
    moves: Spanish moves
    success: Spanish success
  - id: pt
    name: Portugal
    polities: [portugal]
    ink: green
    moves: Portuguese moves
    success: Portuguese success
notes:
  - The fighting lasted less than three weeks. The name comes from the oranges Godoy picked under the walls of Elvas and sent to Queen Maria Luisa.
  - Portugal later declared the Treaty of Badajoz void, and has never formally recognised Spanish sovereignty over Olivenza (Olivença in Portuguese).
