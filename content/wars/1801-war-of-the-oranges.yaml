id: war-of-the-oranges
name: War of the Oranges
start: "1801-05-20"
end: "1801-06-06"
tier: B
summary: A brief war in 1801 in which Spain, urged on by Napoleon, invaded Portugal to force it to break with Britain. Olivenza and Juromenha surrendered at once and Campo Maior after a siege, but Elvas held out, and by the Treaty of Badajoz Portugal closed its ports to British ships, paid an indemnity and ceded Olivenza to Spain.
countries: [pt, es, fr]
