steps:
  - title: Olivenza and the oranges of Elvas
    date: May – June 1801
    when: "1801-05-20"
    borders: "1801-06-06"
    countries: [pt, es, fr]
    body:
      - In 1800 and 1801 Napoleon, then First Consul, and Manuel Godoy, the chief minister of Charles IV of Spain, demanded that Portugal, Britain’s last ally on the Continent, break its alliance and close its ports to British ships. Portugal refused. At dawn on 20 May 1801 Godoy’s Spanish army of Extremadura crossed the border on the Guadiana. Olivenza and nearby Juromenha, their walls unfinished and held by a few hundred men, mostly militia, surrendered at once. The garrison of Campo Maior held two Spanish divisions for 17 days, and at Elvas the Portuguese threw back Godoy’s assault.
      - The war then stalled, with the Spanish tied down in sieges and a French corps waiting in Spain. Godoy picked oranges outside Elvas and sent them to Queen Maria Luisa, with word that he would go on to Lisbon. Portugal, with no help from Britain, gave way. By the Treaty of Badajoz of 6 June it agreed to close its ports to the British, give trade concessions to France and pay an indemnity, and it ceded Olivenza and its district east of the Guadiana; Spain returned the other towns it had taken. Napoleon, who wanted more, imposed a harsher Treaty of Madrid on 29 September. Meanwhile in South America the Portuguese seized the Spanish missions east of the Uruguay River, and kept them.
