steps:
  - title: The destruction of Redoubt Saint Michael
    date: 1799–1802
    when: "1802-06"
    borders: "1802-06-20"
    countries: [us, ru]
    body:
      - "The Russian-American Company, chartered by the tsar in 1799, hunted sea otters for the China trade along the Alaskan coast with fleets of Alutiiq and Aleut hunters in skin boats (baidarkas), many of them working under compulsion. In 1799 its manager, Alexander Baranov, built Redoubt Saint Michael (Mikhailovsky) on Sitka Sound, about 10 km north of the main town of the Kiks.ádi clan of the Tlingit. The Tlingit traded furs with British and American ships for guns and goods, and resented the Russians hunting in their waters, demanding labour and taking Tlingit women."
      - "In June 1802 Tlingit warriors, led by the Kiks.ádi with K’alyáan among them, attacked the post, burned its buildings and carried off its store of furs. They killed most of the people there, some 20 Russians and well over 100 Alutiiq and Aleut workers by most counts; accounts differ on the numbers and on the exact day. Russian-led hunting parties on the coast were also attacked that year. A few survivors, most of them women and children, were taken aboard the British trading ship Unicorn, whose captain, Henry Barber, carried them to Kodiak and made Baranov pay a ransom in furs. K’alyáan was chosen as war leader for the fight that the Tlingit expected would follow."
