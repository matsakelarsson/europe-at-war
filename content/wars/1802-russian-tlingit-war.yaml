  - title: The Battle of Sitka and the Survival March
    date: September 1804 – 1805
    when: "1804-10-01"
    borders: "1804-10-04"
    countries: [us, ru]
    body:
      - "Baranov returned in September 1804 with some 120 to 150 Russians and, by different accounts, 400 to 800 Alutiiq and Aleut hunters in baidarkas, and met the Neva, a sloop of the Russian Navy’s first voyage around the world under Yuri Lisyansky. They occupied Noow Tlein, the hill of the abandoned Kiks.ádi town. The Kiks.ádi had built a new fort, Shís’gi Noow, the Sapling Fort, of thick logs at the mouth of the Indian River, where shallow tide flats kept the ships’ guns at a distance. Shortly before the battle a canoe carrying their reserve of gunpowder exploded on its way to the fort."
      - "On 1 October the Russians and nearly 400 Alutiiq and Aleut hunters landed before the fort. The Tlingit held their fire until the attackers were close, and K’alyáan and his warriors broke the Russian right flank; Baranov was shot and carried back to the Neva, whose guns saved the landing party from destruction. For the next days the ships bombarded the fort, which the shot could not breach, while the two sides talked. Short of powder, the Kiks.ádi left the fort secretly at night and walked north across Baranof Island to Point Craven on Chichagof Island, where they occupied the fort of Chaatlk’aanoow; their descendants remember it as the Kiks.ádi Survival March. The Russians found the fort empty and burned it, and built New Archangel (Novo-Arkhangelsk) on Noow Tlein. Accounts of the losses differ."
      - "From Chaatlk’aanoow the Kiks.ádi watched the approaches to Sitka and traded with American ships for guns, and in 1805 Tlingit and Eyak warriors destroyed the Russian settlement at Yakutat. New Archangel became the capital of Russian America in 1808, but the company never controlled the Tlingit country beyond its stockades. The Kiks.ádi came back to Sitka in 1822 and lived outside the Russian walls as wary neighbours and trading partners, until Russia sold Alaska to the United States in 1867. The site of Shís’gi Noow, now in Sitka National Historical Park, was confirmed by archaeologists in 2021."
