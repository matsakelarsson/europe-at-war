id: russian-tlingit-war
name: Russian–Tlingit War
start: "1802-06"
end: "1805"
tier: B
summary: "The war between the Tlingit (Lingít) of south-eastern Alaska and the Russian-American Company, which hunted sea otters along their coast with Alutiiq and Aleut hunters. In 1799 Alexander Baranov built Redoubt Saint Michael on Sitka Sound, in the country of the Sitka Kiks.ádi clan. Angered by Russian hunting in their waters, by demands for labour and by the treatment of Tlingit women, Tlingit warriors destroyed the post in June 1802, killing most of the people there, and attacked Russian hunting parties. In 1804 Baranov returned with a fleet of baidarkas and the Russian Navy sloop Neva. The Kiks.ádi, led in war by K’alyáan, held their new fort, Shís’gi Noow, at the mouth of the Indian River against the first assault on 1 October 1804, but had lost their reserve of gunpowder, and after days of bombardment and talks they left it by night and walked across Baranof Island to Point Craven, the “Survival March”. The Russians founded New Archangel (Novo-Arkhangelsk, today’s Sitka), from 1808 the capital of Russian America; in 1805 Tlingit and Eyak warriors destroyed the Russian post at Yakutat. The Kiks.ádi returned to Sitka in 1822."
countries: [us, ru]
sides:
  - id: tl
    name: Tlingit (the Sitka Kiks.ádi and allied clans)
    polities: [tlingit]
    ink: teal
    moves: Tlingit moves
    success: Tlingit success
  - id: ru
    name: Russian-American Company (Russians, with Alutiiq and Aleut hunters) and the Russian Navy
    polities: [russian-america, russia]
    ink: slate
    moves: Russian moves
    success: Russian success
notes:
  - "The story is known from Russian accounts, from the journals of the Neva’s captain, Yuri Lisyansky, and from Tlingit oral history, which the Kiks.ádi have kept and which the National Park Service at Sitka has recorded. They differ on numbers and on many details, including the exact days of the 1802 attack and the losses in 1804."
  - The Tlingit were a people of many clans and towns rather than one state; the war was fought by the Kiks.ádi of Sitka and allies from other clans. The Alutiiq (Koniag) and Aleut hunters who made up most of the Russian forces were themselves subjects of the company, many of them working under compulsion.
