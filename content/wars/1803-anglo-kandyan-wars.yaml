id: anglo-kandyan-wars
name: Anglo-Kandyan Wars
start: "1803-01"
end: "1818-11-26"
tier: B
summary: "The wars in which Britain conquered the Kingdom of Kandy, the last independent kingdom of Sri Lanka, in the island’s central highlands. A British invasion in 1803 took the abandoned capital but ended in disaster when the garrison left behind surrendered and was killed. In 1815, after King Sri Vikrama Rajasinha had turned his chief nobles against him, a second invasion met almost no resistance; the king was captured and exiled, and by the Kandyan Convention the chiefs gave the kingdom to the British Crown. Within two years many of the same chiefs led the Uva rebellion of 1817–1818, which was crushed with great destruction and loss of life, after which the British ruled the highlands directly."
countries: [lk]
