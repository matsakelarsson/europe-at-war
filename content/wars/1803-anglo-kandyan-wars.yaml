steps:
  - title: The war of 1803
    date: 1803–1805
    when: "1803-02-21"
    borders: "1803-02-21"
    countries: [lk]
    body:
      - When Britain took the Dutch coastal provinces of Ceylon in 1795–1796, the Kingdom of Kandy still held the hill country and much of the interior. Its young king, Sri Vikrama Rajasinha, had been placed on the throne in 1798 by the first minister (adigar), Pilima Talawe, who then intrigued with the British governor, Frederick North, to replace him. After Kandyan officials seized goods from traders from the British provinces, North declared war. Two columns, from Colombo under General Hay Macdowall and from Trincomalee under Colonel Barbut, reached Kandy on 21 February 1803 and found it abandoned and partly burnt. They crowned a rival claimant, Muttusamy, as king.
      - The Kandyans would not fight a pitched battle. Malaria and dysentery swept through the garrison, and most of the troops were withdrawn, leaving Major Adam Davie in Kandy with a few hundred men, many of them sick. In June the Kandyans attacked. On 24 June Davie surrendered in return for a safe passage to Trincomalee, but the Mahaweli river was in flood; Muttusamy was taken by the Kandyans and put to death, and most of the soldiers were killed at the river, while the sick left behind in Kandy were also killed. Davie was held prisoner and died in captivity years later. Accounts of the killings come mainly from a few survivors, and some recent historians question how they happened.
      - The Kandyans then raided the British provinces, but in September 1803 the king’s army was beaten at Hanwella, about 30 km from Colombo. In 1804 a small force under Captain Arthur Johnston marched from Batticaloa to Kandy and fought its way out to Trincomalee. Raids went on into 1805; no treaty was signed, and the new governor, Thomas Maitland, kept the peace for the next ten years.
