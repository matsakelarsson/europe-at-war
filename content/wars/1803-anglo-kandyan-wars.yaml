  - title: The fall of Kandy
    date: 1814–1815
    when: "1815-02-14"
    borders: "1815-03-02"
    countries: [lk]
    body:
      - Sri Vikrama Rajasinha came to distrust his chiefs, and they him. In 1814 the first adigar, Ehelepola, was accused of plotting, rose in revolt in Sabaragamuwa, failed and fled to the British. The king had Ehelepola’s wife and children put to death in Kandy, and executed other chiefs and monks; much of the nobility turned against him. In late 1814 a group of traders from the British provinces were mutilated as spies, and in January 1815 Kandyan troops crossed the border near Sitawaka. The governor, Sir Robert Brownrigg, advised by his interpreter John D’Oyly, who had built up contacts among the discontented chiefs, ordered an invasion.
      - Several columns entered the kingdom in January and February 1815, with Ehelepola accompanying the British, and met almost no resistance as the chiefs went over to them. Brownrigg entered Kandy on 14 February. The king had fled east into Dumbara, where on 18 February he and two of his queens were found in a village house by Kandyan chiefs’ men and handed over. He was exiled to Vellore in South India, where he died in 1832.
      - On 2 March 1815 the Kandyan chiefs and the governor signed the Kandyan Convention in the audience hall at Kandy. It deposed the king, gave sovereignty over the kingdom to the British Crown, and promised to protect Buddhism and to keep the chiefs’ powers and the Kandyan laws and customs. For the first time, the whole island came under a single foreign power.
