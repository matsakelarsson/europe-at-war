  - title: The Uva rebellion
    date: 1817–1818
    when: "1817-10-16"
    borders: "1818-11-26"
    countries: [lk]
    side_names: { kandy: Kandyan rebels }
    body:
      - The chiefs soon found that British agents, not they, held power, and that the new rulers paid little heed to the customs they had promised to respect. In 1817 a pretender, Wilbawe, who claimed to be Doraisamy, a kinsman of the exiled king, appeared in Wellassa in the east. On 16 October the Assistant Resident at Badulla, Major Sylvester Wilson, went to investigate and was killed near Bibile. Keppetipola, the chief sent to put down the rising, went over to it and became its leader, and in 1818 it spread to most of the Kandyan provinces. Many of the chiefs who had signed the Convention joined it; Ehelepola was suspected and later exiled to Mauritius.
      - Brownrigg, reinforced from India, answered with martial law and a scorched-earth campaign in Uva and Wellassa. Villages, granaries and paddy fields were burnt, cattle killed and irrigation works destroyed, and famine and disease followed. By October 1818 the rebel leaders were being captured; Keppetipola and Madugalle were beheaded in Kandy on 26 November, while Wilbawe escaped. More than 10,000 Kandyans are thought to have died; the British lost about 1,000 men, mostly to disease. A proclamation of November 1818 took away much of what the Convention had guaranteed and placed the Kandyan provinces under direct British rule, and Uva took decades to recover.
    facts:
      - [Wilson killed near Bibile, "16 October 1817"]
      - [Keppetipola and Madugalle executed, "26 November 1818"]
      - [Deaths, "more than 10,000 Kandyans; about 1,000 British troops, mostly from disease"]
