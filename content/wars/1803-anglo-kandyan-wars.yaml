notes:
  - Ceylon’s coastal provinces, taken from the Dutch in 1795–1796, became a British Crown colony in 1802. Its troops included British regiments, Malay, Indian and African soldiers of the Ceylon regiments, and sepoys sent from Madras.
  - The kings of Kandy from 1739 were of the Nayak dynasty, of South Indian origin, but ruled as Sinhalese Buddhist kings. The last king is called Sri Vikrama Rajasinha.
  - In 2017 the government of Sri Lanka revoked the 1818 gazette notice that had declared the leaders of the Uva rebellion traitors, and named them national heroes.
