id: napoleonic-wars
name: Napoleonic Wars
start: "1803"
end: "1815"
tier: A
summary: The wars between Napoleon’s France and its allies and changing coalitions of Britain, Austria, Prussia, Russia, Sweden and others. Napoleon’s victories over Austria and Prussia ended the Holy Roman Empire and remade the map of Germany until the allies drove him back across the Rhine in 1813; Sweden lost Swedish Pomerania in 1807 and, after the campaign of 1813, gained Norway from Denmark at Kiel in 1814.
