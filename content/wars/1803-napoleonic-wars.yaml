  - title: Trafalgar
    date: March – November 1805
    when: "1805-10-21"
    borders: "1805-10-21"
    countries: [gb, es, fr]
    side_names:
      fr: French and Spanish success
      gb: British success
    move_names:
      fr: French and Spanish moves
      gb: British moves
    body:
      - To invade Britain, Napoleon gathered his Army of England in camps around Boulogne, but he needed command of the Channel to get it across. Spain, at war with Britain again from December 1804, added its fleet to his. In March 1805 Admiral Pierre-Charles Villeneuve slipped out of Toulon and sailed for the West Indies to draw the British fleets away, with Horatio Nelson in pursuit. On his way back Villeneuve fought an indecisive action with Admiral Robert Calder off Cape Finisterre on 22 July, then put into Ferrol and, in August, into Cádiz. Soon afterwards Napoleon gave up the invasion and turned his army against Austria.
      - Ordered to sail for Naples, Villeneuve led 33 French and Spanish ships of the line out of Cádiz in mid-October, and on 21 October Nelson, with 27, met him off Cape Trafalgar. Instead of fighting line against line, the British attacked in two columns that broke through the allied line. In about five hours of close fighting they captured 17 ships and destroyed one without losing any of their own, though a storm in the following days wrecked most of the prizes. Nelson was shot by a marksman on the French Redoutable and died as the battle ended. Britain kept command of the sea for the rest of the war, and Napoleon turned to economic warfare against it.
    facts:
      - [Battle of Trafalgar, "21 October 1805, British victory"]
      - [Ships of the line, "27 British, 33 French and Spanish"]
      - [Losses, "About 1,700 British and some 14,000 French and Spanish killed, wounded or captured"]
    markers:
      - kind: event
        side: fr
        name: Boulogne
        date: 1803 – August 1805
        text: Napoleon’s Army of England waited in camps along the Channel coast. In late August 1805 he marched it to the Rhine against Austria.
        lonlat: [1.614, 50.726]
      - kind: event
