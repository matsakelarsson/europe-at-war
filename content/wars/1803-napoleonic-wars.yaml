  - title: Prussia rises, Lützen and Bautzen
    date: December 1812 – August 1813
    when: "1812-12-30"
    borders: "1813-06-04"
    countries: [de, pl, ru, fr]
    side_names:
      ru: Russian and Prussian success
    move_names:
      ru: Russian and Prussian moves
    body:
      - Napoleon’s Grande Armée was destroyed in Russia in 1812. On 30 December General Ludwig Yorck, commanding the Prussian corps that had marched with it, agreed at Tauroggen to stand aside, without his king’s permission. Frederick William III hesitated, then allied with Russia at Kalisz on 28 February 1813 and declared war on France in March. Prussia called up volunteers and a militia, the Landwehr, and many young men joined free corps such as Lützow’s. Russian and Prussian troops entered Berlin, Dresden and Hamburg. Napoleon raised a new army, made up largely of young conscripts and short of cavalry, and marched into Saxony.
      - On 2 May he beat the Russians and Prussians under Wittgenstein and Blücher at Lützen and retook Dresden, and the King of Saxony rejoined him. On 20–21 May he won again at Bautzen, but the allies escaped into Silesia in good order, and his army had lost more men than theirs. On 4 June both sides agreed an armistice at Pläswitz and used it, until August, to rebuild their armies. Austria, which had offered to mediate, promised at Reichenbach to join the allies if Napoleon refused its terms. He did, and Austria declared war on 12 August; the autumn campaign ended with his defeat at Leipzig in October.
    facts:
      - [Treaty of Kalisz, "28 February 1813, Prussia allies with Russia"]
      - [Battle of Lützen, "2 May 1813, French victory"]
      - [Battle of Bautzen, "20–21 May 1813, French victory"]
    markers:
      - kind: treaty
        side: ru
        name: Treaty of Kalisz
        date: 28 February 1813
        text: Russia and Prussia allied against Napoleon. Russia promised to help Prussia regain its strength of 1806.
        lonlat: [18.08, 51.758]
      - kind: taken
        side: ru
        name: Berlin
        date: 4 March 1813
        text: The French garrison left, and Russian Cossacks rode into the Prussian capital, followed by Wittgenstein’s army.
        lonlat: [13.4, 52.52]
      - kind: taken
        side: fr
        name: Hamburg
        date: 30 May 1813
        text: Russian troops under Friedrich Karl von Tettenborn entered the city in March, but Marshal Davout retook it in May and held it until 1814.
        lonlat: [10.0, 53.55]
      - kind: battle
        side: fr
        name: Battle of Lützen
        date: 2 May 1813
        text: Fought around Grossgörschen. Napoleon’s young conscripts held, and the allies withdrew. Gerhard von Scharnhorst, the reformer of the Prussian army, died of his wounds weeks later.
        lonlat: [12.183, 51.217]
      - kind: battle
        side: fr
        name: Battle of Bautzen
        date: 20–21 May 1813
        text: Napoleon forced the allies from their positions on the Spree, but a slow flank attack let them get away.
        lonlat: [14.42, 51.18]
      - kind: treaty
