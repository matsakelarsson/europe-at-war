  - title: Jena, Auerstedt and the end of the Empire
    date: July 1806 – July 1807
    when: "1806-07-12"
    borders: "1807-08-18"
    countries: [de, at, fr, pl, ru]
    body:
      - After Austerlitz Napoleon reshaped Germany. On 12 July 1806 sixteen princes, led by the new kings of Bavaria and Württemberg, formed the Confederation of the Rhine under his protection and left the Holy Roman Empire. Under a French ultimatum Francis II laid down the imperial crown on 6 August, ending an empire that had lasted, in some form, for a thousand years; he kept the title of Emperor of Austria he had taken in 1804. Prussia, neutral in 1805, was angered by Napoleon’s offer to return Hanover to Britain, and in October it went to war with Saxony at its side.
      - On 14 October Napoleon beat Prince Hohenlohe’s Prussians and Saxons at Jena, while 20 km to the north Marshal Davout’s corps of 26,000 routed the main Prussian army, twice its size, at Auerstedt. Napoleon entered Berlin on 27 October, and Hohenlohe surrendered at Prenzlau the next day. Saxony changed sides and became a kingdom. After further fighting in Poland, Russia and Prussia made peace with Napoleon at Tilsit in July 1807. Prussia lost about half its land and people. Its lands west of the Elbe went to the new Kingdom of Westphalia and other French clients, and most of its Polish lands to the Duchy of Warsaw.
    facts:
      - [Confederation of the Rhine, "12 July 1806, 16 founding states"]
      - [End of the Holy Roman Empire, 6 August 1806]
      - [Prussian and Saxon losses, "About 41,000 at Jena and Auerstedt"]
    markers:
      - kind: event
        name: Imperial Diet at Regensburg
        date: 1 August 1806
        text: The members of the Confederation of the Rhine told the Imperial Diet that they had left the Empire. Francis II abdicated in Vienna five days later.
        lonlat: [12.083, 49.017]
      - kind: battle
        side: fr
        name: Battle of Saalfeld
        date: 10 October 1806
        text: Marshal Lannes beat a Prussian and Saxon advance guard. Its commander, Prince Louis Ferdinand of Prussia, was killed.
        lonlat: [11.36, 50.65]
      - kind: battle
        side: fr
        name: Battle of Jena
        date: 14 October 1806
        text: Napoleon, who thought he faced the main Prussian army, beat Hohenlohe’s Prussians and Saxons on the plateau west of the town.
        lonlat: [11.51, 50.95]
        lp: l
      - kind: battle
        side: fr
        name: Battle of Auerstedt
        date: 14 October 1806
        text: Davout’s corps held off and then routed the main Prussian army. Its commander, the Duke of Brunswick, was mortally wounded.
        lonlat: [11.62, 51.115]
        lp: t
      - kind: taken
        side: fr
        name: Berlin
        date: 27 October 1806
        text: Napoleon entered the Prussian capital. Here in November he decreed a blockade of Britain, the Continental System.
        lonlat: [13.4, 52.52]
      - kind: battle
        side: fr
        name: Battle of Prenzlau
        date: 28 October 1806
        text: Hohenlohe surrendered the remains of his army, some 10,000 men, to Murat’s cavalry.
        lonlat: [13.867, 53.317]
      - kind: siege
        side: fr
        name: Magdeburg
        date: 8 November 1806
        text: Prussia’s greatest fortress surrendered to Marshal Ney with a garrison of some 25,000 men after a two-week siege.
        lonlat: [11.627, 52.131]
