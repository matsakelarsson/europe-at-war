        text: The Kingdom of Poland, known as Congress Poland, was joined to Russia with the tsar as its king and its own constitution and army.
        lonlat: [21.012, 52.23]
      - kind: event
        side: pr
        name: Saxony
        date: 1815
        text: The King of Saxony, who had stood by Napoleon, kept his throne and Dresden but lost the north of his kingdom to Prussia.
        lonlat: [13.738, 51.05]
      - kind: event
        side: pr
        name: Cologne
        date: 1815
        text: Prussia’s new lands on the Rhine and in Westphalia made it the guardian of Germany’s western border.
        lonlat: [6.958, 50.938]
      - kind: event
        side: gb
