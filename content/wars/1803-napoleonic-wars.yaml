  - title: Aspern-Essling and Wagram
    date: April – October 1809
    when: "1809-04-10"
    borders: "1809-10-14"
    countries: [at, de, fr, si, hr, it]
    body:
      - Hoping to rouse the Germans while Napoleon’s best troops were in Spain, Austria went to war again in April 1809. Archduke Charles invaded Bavaria on 10 April, but Napoleon hurried from Paris and beat him in five days of fighting around Abensberg, Landshut, Eckmühl and Regensburg, and Charles withdrew into Bohemia. Napoleon took Vienna on 13 May. On 21 May he crossed the Danube below the city by the island of Lobau, but Charles attacked the bridgehead at Aspern and Essling, and the swollen river broke the French bridges. Napoleon had to fall back to the island, his first major defeat in more than ten years.
      - Six weeks later, reinforced from Italy, he crossed again and on 5–6 July beat Charles at Wagram, on the Marchfeld plain north-east of Vienna, in one of the largest battles yet fought in Europe, with some 300,000 men engaged. Charles agreed an armistice at Znaim on 12 July. By the Peace of Schönbrunn on 14 October Austria lost about 3.5 million subjects. Salzburg, Berchtesgaden and the Innviertel went to Bavaria. Carniola, western Carinthia, Trieste and Croatia south of the Sava went to France as the Illyrian Provinces, cutting Austria off from the sea, and Galician lands went to the Duchy of Warsaw and Russia.
    facts:
      - [Battle of Aspern-Essling, "21–22 May 1809, Austrian victory"]
      - [Battle of Wagram, "5–6 July 1809, French victory"]
      - [Peace of Schönbrunn, 14 October 1809]
    markers:
      - kind: battle
        side: fr
        name: Battle of Eckmühl
        date: 22 April 1809
        text: The climax of Napoleon’s counter-attack in Bavaria. Charles retreated across the Danube at Regensburg into Bohemia.
        lonlat: [12.182, 48.844]
      - kind: battle
        side: at
        name: Battle of Aspern-Essling
        date: 21–22 May 1809
        text: The Austrians drove the French back across the Danube to the island of Lobau. Marshal Lannes was mortally wounded.
        lonlat: [16.503, 48.213]
        lp: b
      - kind: battle
        side: fr
        name: Battle of Wagram
        date: 5–6 July 1809
        text: After two days of fighting on the Marchfeld, Charles withdrew his beaten army in good order towards Moravia.
        lonlat: [16.558, 48.296]
        lp: t
      - kind: treaty
        name: Armistice of Znaim
        date: 12 July 1809
        text: The armistice agreed at today’s Znojmo ended the fighting between France and Austria.
        lonlat: [16.049, 48.856]
      - kind: treaty
        side: fr
        name: Peace of Schönbrunn
        date: 14 October 1809
        text: Napoleon, who had made the Habsburg palace his headquarters, imposed the peace there. Austria also paid a heavy indemnity and joined the blockade of Britain.
        lonlat: [16.312, 48.185]
        lp: l
