      ru: Army of Poland (Russians)
    body:
      - When the armistice ended in August 1813, Austria joined Russia, Prussia and Sweden against Napoleon, with Britain paying subsidies. Three allied armies closed on him in Saxony, Schwarzenberg’s Army of Bohemia from the south, Blücher’s Army of Silesia from the east and Crown Prince Charles John’s Army of the North from Berlin. Under the Trachenberg plan they avoided battle with Napoleon himself and struck at his marshals. Napoleon beat Schwarzenberg at Dresden on 26–27 August, his last great victory in Germany, but in the same days Blücher routed Macdonald on the Katzbach, the allies trapped Vandamme’s pursuing corps at Kulm, and the French drives on Berlin failed. On 8 October Bavaria changed sides.
      - In October the allies converged on Leipzig. On 16–19 October more than half a million men fought the largest battle of the Napoleonic Wars there, Napoleon’s army of fewer than 200,000, with Germans, Poles and Italians in its ranks, against more than 300,000 Austrians, Russians, Prussians and Swedes. Schwarzenberg attacked from the south and Blücher from the north, and on 18 October Bennigsen’s Army of Poland and the Army of the North closed the ring from the east as Saxon troops went over to the allies. As Napoleon retreated on the 19th, the bridge over the Elster was blown too early, trapping his rearguard, and Marshal Józef Poniatowski drowned. Napoleon fell back to the Rhine, and the Confederation of the Rhine fell apart.
    facts:
      - [Battle of Dresden, "26–27 August 1813, French victory"]
      - [Battle of Leipzig, "16–19 October 1813, allied victory"]
      - [Losses at Leipzig, "Some 60,000–80,000 on each side killed, wounded or captured"]
