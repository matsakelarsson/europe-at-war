  - title: The Continental System and Napoleon’s Europe
    date: 1806–1811
    when: "1810"
    borders: "1811-12-31"
    countries: [fr, nl, be, lu, de, it, ch, pl, si, hr, es, pt, gb, ru, at]
    body:
      - With no fleet left to challenge Britain after Trafalgar, Napoleon set out to ruin its trade. The Berlin Decree of 21 November 1806 closed the ports of France and its allies to British ships and goods, and the Milan Decree of December 1807 extended the ban to neutral ships that obeyed British rules; Britain answered with Orders in Council. Enforcing this Continental System drew Napoleon ever further. He sent an army into Portugal in 1807 and in 1808 made his brother Joseph King of Spain, starting a long war there. He annexed the Papal States in 1809, Holland in 1810 after his brother Louis, its king, refused to enforce the blockade, and in December 1810 the North Sea coast to Hamburg and Lübeck.
      - At the end of 1811 Napoleon’s power was at its height. The French Empire, with about 130 departments, reached from Lübeck to Rome and across the Adriatic to the Illyrian Provinces. Around it lay dependent states, the Kingdom of Italy, Naples under Joachim Murat, Spain under Joseph, Westphalia under Jérôme, the rest of the Confederation of the Rhine, Switzerland and the Duchy of Warsaw. In 1810 he married Marie Louise, daughter of the Austrian emperor, who bore him a son in March 1811. But smuggling and hardship eroded the blockade, the war in Spain drained his armies, and when Russia opened its ports to neutral ships at the end of 1810, the quarrel led to war.
    facts:
      - [Berlin Decree, "21 November 1806"]
      - [Milan Decree, "17 December 1807"]
      - [French Empire at its largest, "about 130 departments, 1811–1812"]
    link: { href: "#/war/peninsular-war", text: The Peninsular War }
    markers:
      - kind: event
        side: fr
        name: Berlin Decree
        date: 21 November 1806
        text: From the captured Prussian capital Napoleon declared the British Isles under blockade and banned all trade with them.
        lonlat: [13.4, 52.52]
      - kind: taken
