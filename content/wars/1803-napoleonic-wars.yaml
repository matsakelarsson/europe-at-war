      - kind: taken
        side: fr
        name: Rome
        date: May – July 1809
        text: The Papal States were annexed to France. Pope Pius VII excommunicated Napoleon and was arrested and held in Savona and Fontainebleau until 1814.
        lonlat: [12.483, 41.893]
      - kind: event
        side: fr
        name: Amsterdam
        date: 9 July 1810
        text: King Louis abdicated rather than enforce the blockade, and Napoleon annexed the Kingdom of Holland.
        lonlat: [4.9, 52.37]
      - kind: taken
