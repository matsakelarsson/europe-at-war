    body:
      - In 1810 Sweden chose the French marshal Jean-Baptiste Bernadotte as crown prince, and as Charles John he soon ran the country. When Napoleon occupied Swedish Pomerania again in 1812, Charles John allied with Russia, which agreed to help Sweden take Norway from Denmark.
      - In 1813 he commanded the allied Army of the North, made up of Swedes, Prussians and Russians, against his old master. It beat the French at Grossbeeren on 23 August and Dennewitz on 6 September, protecting Berlin, and took part in the decisive Battle of Leipzig on 16–19 October 1813.
    facts:
