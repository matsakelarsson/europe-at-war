notes:
  - Dates are New Style.
  - Migrated from Sweden at War, so the story is told from Sweden’s side.
  - The steps on the war in Germany and Austria were added for Europe at War. Bavaria, Württemberg, Baden and, from December 1806, Saxony fought on France’s side until 1813.
  - The steps on the campaign of 1814 and the Hundred Days were also added for Europe at War. The war in Spain and Portugal, at sea and in Italy is only outlined.
