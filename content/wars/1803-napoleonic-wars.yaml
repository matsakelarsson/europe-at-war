  - title: War with Napoleon in Pomerania
    date: 1805–1807
    when: "1805"
    borders: "1795"
    countries:
      - se
      - de
    view:
      center:
        - 12.0983
        - 53.928
      size:
        - 452
        - 340
    body:
      - Gustav IV Adolf, who loathed Napoleon, joined the Third Coalition in 1805. A British, Russian and Swedish force marched from Swedish Pomerania toward French-held Hanover, but the coalition fell apart after Austerlitz, and in November 1806 Swedish troops were caught up in the French storming of Lübeck.
      - In January 1807 Marshal Mortier’s French army blockaded Stralsund. The garrison made a great sortie in April, but after the Peace of Tilsit the French returned in strength. Stralsund fell in August 1807, and Swedish Pomerania stayed under French occupation until 1810.
    facts:
      - - Siege of Stralsund
        - January – August 1807
      - - French occupation
        - Until the Treaty of Paris, January 1810
