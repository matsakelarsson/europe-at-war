        - 57.346
      size:
        - 550
        - 908
    body:
      - After Leipzig, Charles John turned north against Denmark–Norway, Napoleon’s last ally, and invaded Holstein in December 1813. Swedish cavalry won a clash at Bornhöved on 7 December, but the Danes fought their way past the allies at Sehested on 10 December and reached the fortress of Rendsburg.
      - Denmark could not hold out. By the Treaty of Kiel on 14 January 1814, King Frederick VI gave Norway to the king of Sweden, and Sweden handed Swedish Pomerania and Rügen to Denmark. It was the last war between Sweden and Denmark. The Norwegians, though, refused to be handed over.
    facts:
      - - Treaty of Kiel
        - 14 January 1814
      - - Exchange
        - Norway to Sweden, Swedish Pomerania to Denmark
