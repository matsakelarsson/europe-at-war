  - title: The invasion of Russia
    date: June – December 1812
    when: "1812-06-24"
    borders: "1812-06-24"
    countries: [ru, by, lt, pl, fr, de, at]
    body:
      - Napoleon and Alexander had fallen out over the blockade, over Poland and over the annexation of Oldenburg, whose ruling family was related to the tsar’s. On 24 June 1812 Napoleon crossed the Niemen with the largest army Europe had yet seen, more than 600,000 men in all. It was drawn from all over his empire and his allies, with Germans, Poles, Italians and others beside the French, while Austrian and Prussian corps guarded its flanks. The Russian armies fell back, fought at Smolensk in August and at Borodino on 7 September, and gave up Moscow, which burned after the French entered it on 14 September.
      - Alexander refused to make peace, and on 19 October Napoleon left Moscow. Hunger, cold, disease and constant attacks by Cossacks, peasant partisans and the pursuing Russian armies destroyed most of his army on the retreat, and after the crossing of the Berezina in late November only a small fraction of the men who had entered Russia came back across the Niemen in December. The disaster broke Napoleon’s hold on Germany. Within weeks the Prussian corps had stood aside, and in 1813 Prussia changed sides.
    facts:
      - [Crossing of the Niemen, "24 June 1812"]
      - [Battle of Borodino, "7 September 1812"]
      - [Grande Armée, "more than 600,000 men; only a small fraction came back"]
    link: { href: "#/war/french-invasion-of-russia", text: The French invasion of Russia }
    markers:
      - kind: event
        side: fr
        name: Crossing of the Niemen
        date: 24 June 1812
        text: The Grande Armée crossed the river near Kovno, today’s Kaunas, on pontoon bridges.
        lonlat: [23.933, 54.9]
      - kind: taken
        side: fr
        name: Smolensk
        date: 16–18 August 1812
        text: The French stormed the burning city, but the Russian armies, now united, got away east.
        lonlat: [32.045, 54.783]
      - kind: battle
        name: Battle of Borodino
        date: 7 September 1812
        text: The bloodiest day of the war. Kutuzov’s army withdrew after the battle, leaving the road to Moscow open.
        lonlat: [35.817, 55.517]
      - kind: taken
        side: fr
        name: Moscow
        date: 14 September 1812
        text: Napoleon entered a city its people had largely abandoned. Fires destroyed most of it in the following days.
        lonlat: [37.618, 55.756]
      - kind: battle
        name: Berezina
        date: 26–29 November 1812
        text: The remains of the Grande Armée escaped over two improvised bridges, at a terrible cost in lives.
        lonlat: [28.355, 54.325]
