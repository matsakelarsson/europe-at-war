  - title: The Congress of Vienna
    date: September 1814 – June 1815
    when: "1814-09"
    borders: "1815-06-09"
    countries: [at, de, pl, ru, nl, be, lu, it, fr, gb, dk, si, hr]
    side_names:
      at: Austrian gains
      pr: Prussian gains
      ru: Russian gains
      gb: Gains for the Netherlands
    body:
      - After Napoleon’s first abdication the victors met in Vienna to remake the map of Europe. From September 1814 the four great powers, Austria, Britain, Prussia and Russia, represented by Metternich, Castlereagh, Hardenberg and Tsar Alexander himself, decided the main questions, and France’s foreign minister Talleyrand soon won a place beside them. Amid balls and receptions the Congress nearly broke up over Poland and Saxony, for Russia wanted the whole Duchy of Warsaw and Prussia the whole of Saxony. On 3 January 1815 Austria, Britain and France signed a secret alliance against them. In the compromise Russia took most of the duchy as a Kingdom of Poland under the tsar, Kraków became a free city, and Prussia received about two-fifths of Saxony.
      - The Final Act was signed on 9 June 1815, nine days before Waterloo. Prussia also gained Westphalia and the Rhineland, which made it France’s neighbour on the Rhine, and Austria took Lombardy and Venetia and recovered its Alpine and Illyrian lands. The southern Netherlands, today’s Belgium, were joined to the Dutch provinces as a barrier against France, Sardinia received Genoa, and the Pope and the Bourbon king of Naples returned. In place of the Holy Roman Empire a German Confederation of 39 states was formed under Austrian presidency. The settlement paid little heed to national feeling, but no war between the great powers broke out again until the Crimean War of 1853.
    facts:
      - [Congress of Vienna, "September 1814 – June 1815"]
      - [Final Act, "9 June 1815"]
      - [German Confederation, "39 states under Austrian presidency"]
    link: { href: "#/war/neapolitan-war", text: "Murat’s war for Naples, 1815" }
    markers:
      - kind: treaty
        name: Final Act of the Congress of Vienna
