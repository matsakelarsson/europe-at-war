  - title: Ulm and Austerlitz
    date: September – December 1805
    when: "1805-09-10"
    borders: "1805-12-26"
    countries: [de, at, cz, sk, fr, ru]
    body:
      - In 1805 Austria joined Britain, Russia and Sweden in the Third Coalition against Napoleon, who had crowned himself Emperor of the French the year before. On 10 September an Austrian army under Karl Mack crossed the Inn into Bavaria, whose elector sided with France, and advanced to Ulm to wait for the Russians. Napoleon marched his Grande Armée from the Channel coast to the Rhine and in early October swung it across Württemberg to the Danube behind Mack, while Bavaria, Württemberg and Baden joined him. Surrounded, Mack surrendered at Ulm on 20 October; in all the campaign cost Austria some 60,000 men taken prisoner.
      - The French entered Vienna on 13 November, and Kutuzov’s Russians and the remaining Austrians fell back into Moravia, where Tsar Alexander I and Emperor Francis II joined them. On 2 December near Austerlitz the allies attacked Napoleon’s right, which he had left weak on purpose, and he broke through their centre on the Pratzen heights. The allies lost at least 27,000 men, about a third of their army, against some 9,000 French. At Pressburg on 26 December Austria gave up Venetia, Istria and Dalmatia to Napoleon’s Kingdom of Italy, and Tyrol, Vorarlberg and its Swabian lands to Bavaria, Württemberg and Baden. It received Salzburg in return.
    facts:
      - [Capitulation of Ulm, 20 October 1805]
      - [Battle of Austerlitz, "2 December 1805, French victory"]
      - [Peace of Pressburg, "26 December 1805; the electors of Bavaria and Württemberg became kings"]
    markers:
