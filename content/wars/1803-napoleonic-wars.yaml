        text: Napoleon walked up to the infantry sent to stop him and invited them to shoot their emperor. They joined him instead.
        lonlat: [5.773, 45.025]
      - kind: event
        side: fr
        name: Paris
        date: 20 March 1815
        text: Napoleon returned to the Tuileries the night after Louis XVIII had fled.
        lonlat: [2.352, 48.857]
      - kind: battle
        side: fr
        name: Battle of Ligny
        date: 16 June 1815
        text: Napoleon’s last victory. Blücher, unhorsed and nearly captured, rallied his army and led it north towards Wavre.
        lonlat: [4.574, 50.511]
      - kind: held
        side: gb
        name: Quatre Bras
        date: 16 June 1815
        text: Ney failed to take the crossroads from Wellington’s gathering army, which fell back to Mont-Saint-Jean the next day.
        lonlat: [4.453, 50.571]
        lp: l
      - kind: battle
        side: gb
        name: Battle of Waterloo
        date: 18 June 1815
        text: Wellington’s British, Dutch, Belgian, Hanoverian, Brunswick and Nassau troops held their ridge all day; Blücher’s Prussians, attacking at Plancenoit, decided the battle.
        lonlat: [4.412, 50.678]
        lp: l
      - kind: battle
        side: fr
        name: Battle of Wavre
        date: 18–19 June 1815
        text: Marshal Grouchy’s wing pushed back the Prussian rearguard but was too far away to help Napoleon.
        lonlat: [4.607, 50.717]
      - kind: event
        side: gb
        name: Rochefort
        date: 15 July 1815
        text: Unable to escape to America past the British blockade, Napoleon surrendered to Captain Maitland of HMS Bellerophon off the Île d’Aix.
        lonlat: [-1.175, 46.012]
