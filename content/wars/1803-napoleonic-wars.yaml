  - title: Eylau, Friedland and Tilsit
    date: November 1806 – July 1807
    when: "1806-11-28"
    borders: "1807-07-09"
    countries: [pl, ru, de, fr]
    body:
      - After Jena the war moved east. Russia came to Prussia’s aid, and on 28 November 1806 French troops entered Warsaw, welcomed by Poles who hoped Napoleon would restore their state. A winter campaign followed in mud and snow. At Pułtusk on 26 December Marshal Lannes failed to break General Levin von Bennigsen’s Russians, and on 7–8 February 1807 Napoleon attacked Bennigsen at Eylau, today’s Bagrationovsk, in a snowstorm. Augereau’s corps was cut to pieces, and Murat saved the French centre with a mass charge of more than 10,000 cavalry. When the Russians and a Prussian corps withdrew in the night, each side had lost at least 15,000 men, and nothing had been decided.
      - "In the spring the French took Danzig after a two-month siege. On 14 June Napoleon caught Bennigsen’s army with its back to the River Alle at Friedland and routed it; the Russians lost at least 20,000 men. Alexander I asked for an armistice, and on 25 June he and Napoleon met on a raft moored in the Niemen at Tilsit. By the treaties of 7 and 9 July Russia recognised Napoleon’s new states, secretly promised to join his blockade of Britain if Britain refused peace, and gained a free hand against Sweden. Prussia paid the price: its Polish lands became the Duchy of Warsaw under the King of Saxony, and Danzig a free city under French protection."
    facts:
      - [Battle of Eylau, "7–8 February 1807, inconclusive"]
      - [Battle of Friedland, "14 June 1807, French victory"]
      - [Treaties of Tilsit, "7 July (Russia) and 9 July 1807 (Prussia)"]
    link: { href: "#/war/finnish-war", text: "The Finnish War, 1808–1809" }
    markers:
      - kind: taken
        side: fr
        name: Warsaw
        date: 28 November 1806
        text: Murat’s cavalry entered the city as the Prussians and Russians withdrew. Napoleon arrived in December and spent much of the winter there.
        lonlat: [21.012, 52.23]
      - kind: battle
        name: Battle of Pułtusk
        date: 26 December 1806
        text: Lannes attacked Bennigsen’s army in deep mud. Both sides claimed victory, and the Russians withdrew north.
        lonlat: [21.08, 52.70]
      - kind: battle
        name: Battle of Eylau
        date: 7–8 February 1807
        text: One of the bloodiest battles of the age, fought in snow. The French held the field, but the Russian army escaped intact.
