summary: Sweden’s part in the coalitions against Napoleon, from the loss of Swedish Pomerania in 1807 to Crown Prince Charles John’s Army of the North in 1813 and his campaign against Denmark–Norway, which ended with the Treaty of Kiel in 1814 and the cession of Norway to the Swedish king.
