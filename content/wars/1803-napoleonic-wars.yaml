  - title: The Hundred Days and Waterloo
    date: March – November 1815
    when: "1815-03-01"
    borders: "1815-11-20"
    countries: [fr, be, nl, de, gb]
    side_names:
      gb: Success for Wellington’s allied army
    move_names:
      gb: Moves of Wellington’s allied army
    body:
      - Napoleon left Elba with about 1,000 men and landed at Golfe-Juan near Cannes on 1 March 1815. He marched north through the Alps, avoiding royalist Provence, and at Laffrey, near Grenoble, the troops sent to stop him went over to him. Marshal Ney, who had promised Louis XVIII to bring him back in an iron cage, joined him too, and Napoleon entered Paris on 20 March as the king fled to Ghent. The powers meeting at the Congress of Vienna declared him an outlaw and each promised 150,000 men. Napoleon decided to strike first, at the two allied armies in Belgium, the British, Dutch and German army of the Duke of Wellington and the Prussian army of Blücher, before the Austrians and Russians could arrive.
      - On 15 June the French crossed the Sambre at Charleroi. The next day Napoleon beat Blücher at Ligny while Ney held Wellington at Quatre Bras, but the Prussians fell back north to Wavre, staying within reach of Wellington. On 18 June Wellington’s army of about 68,000 held the ridge of Mont-Saint-Jean, south of Waterloo, against Napoleon’s 73,000 until the Prussians struck the French right in the afternoon; when the Imperial Guard’s last attack failed that evening, the French army broke. Napoleon abdicated again on 22 June, surrendered to the British on 15 July and was exiled to Saint Helena, where he died in 1821. The second Treaty of Paris on 20 November 1815 cut France back to its borders of 1790 and imposed an indemnity and an allied occupation.
    facts:
      - [Battle of Waterloo, "18 June 1815, allied victory"]
      - [Losses at Waterloo, "About 24,000 allied and Prussian and some 30,000 or more French killed, wounded or captured (estimates vary)"]
      - [Second Treaty of Paris, "20 November 1815"]
    markers:
      - kind: event
        side: fr
        name: Golfe-Juan
        date: 1 March 1815
        text: Napoleon came ashore with the soldiers of his guard from Elba and set off north on the mountain road through Digne and Gap.
        lonlat: [7.074, 43.567]
      - kind: event
        side: fr
        name: Laffrey
