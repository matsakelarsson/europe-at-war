  - title: The campaign of France and the first abdication
    date: December 1813 – May 1814
    when: "1814-01-25"
    borders: "1814-05-30"
    countries: [fr, de, at, ru, gb, es, pt]
    side_names:
      at: Success for Schwarzenberg’s Army of Bohemia
      pr: Success for Blücher’s Army of Silesia
    move_names:
      at: Moves of the Army of Bohemia (Austrians, Russians and Germans)
      pr: Moves of the Army of Silesia (Prussians and Russians)
    body:
      - After Leipzig the allies reached the Rhine, and Napoleon let slip their offer of peace with France’s “natural frontiers”. From late December 1813 Schwarzenberg’s Army of Bohemia crossed the upper Rhine through Switzerland and Blücher’s Army of Silesia crossed the middle Rhine, while Wellington, coming from Spain, had already crossed the Pyrenees into south-western France. Napoleon, with perhaps 70,000 men in the field, many of them young conscripts, struck at the allied armies in turn. He was beaten at La Rothière on 1 February 1814, but between 10 and 14 February he defeated Blücher’s scattered corps four times in five days, at Champaubert, Montmirail, Château-Thierry and Vauchamps, and on 18 February he drove Schwarzenberg back at Montereau.
      - The allies held together, binding themselves in the Treaty of Chaumont in March not to make a separate peace. Blücher checked Napoleon at Laon on 9–10 March and Schwarzenberg at Arcis-sur-Aube on 20–21 March, and when Napoleon moved east to threaten their communications, they marched on Paris instead. After a day’s fighting on 30 March Marshal Marmont surrendered the city, and the allied monarchs rode in the next day. The Senate deposed Napoleon, his marshals refused to fight on, and on 6 April at Fontainebleau he abdicated. Napoleon was given the island of Elba, and Louis XVIII, a brother of Louis XVI, returned as king. By the Treaty of Paris on 30 May France kept its borders of 1792, with small additions.
    facts:
      - [Six Days’ Campaign, "10–14 February 1814, four French victories"]
      - [Paris surrenders, "31 March 1814"]
      - [Napoleon abdicates, "6 April 1814; Treaty of Paris, 30 May 1814"]
    markers:
      - kind: battle
        side: pr
        name: Battle of La Rothière
        date: 1 February 1814
        text: Blücher, with Austrian, Russian and Württemberg corps, attacked Napoleon in snowstorms near Brienne and forced him to retreat.
        lonlat: [4.55, 48.33]
      - kind: battle
        side: fr
        name: Champaubert, Montmirail and Vauchamps
        date: 10–14 February 1814
        text: The Six Days’ Campaign. Napoleon caught Blücher’s corps strung out along the Marne valley and beat them one by one, inflicting far heavier losses than he suffered.
        lonlat: [3.65, 48.88]
      - kind: battle
        side: fr
        name: Château-Thierry
        date: 12 February 1814
        text: The third victory of the Six Days, over the retreating Prussian corps of Yorck and the Russians of Sacken.
        lonlat: [3.403, 49.046]
        lp: t
      - kind: battle
        side: fr
        name: Battle of Montereau
        date: 18 February 1814
        text: Napoleon stormed the bridges over the Seine and the Yonne, and Schwarzenberg fell back towards Troyes.
        lonlat: [2.95, 48.4]
        lp: l
      - kind: battle
        side: pr
        name: Battle of Laon
        date: 9–10 March 1814
        text: Napoleon attacked Blücher’s much larger army on its hilltop and was repulsed; a night attack routed Marmont’s corps.
        lonlat: [3.624, 49.564]
      - kind: battle
        side: at
        name: Battle of Arcis-sur-Aube
        date: 20–21 March 1814
        text: Napoleon, expecting only a rearguard, ran into Schwarzenberg’s whole army and had to withdraw across the Aube.
        lonlat: [4.142, 48.538]
      - kind: taken
        side: ru
        name: Paris
        date: 30–31 March 1814
        text: After fighting on the heights of Montmartre and Belleville, Marmont signed the capitulation. Tsar Alexander I and King Frederick William III entered Paris on 31 March.
        lonlat: [2.352, 48.857]
        lp: l
      - kind: event
        name: Fontainebleau
        date: 6 April 1814
        text: Napoleon abdicated in the palace. By the Treaty of Fontainebleau he kept the title of emperor and received Elba.
        lonlat: [2.701, 48.402]
        lp: b
      - kind: battle
        side: gb
        name: Battle of Toulouse
        date: 10 April 1814
        text: Wellington’s British, Portuguese and Spanish troops drove Soult out of the city, in a battle fought after the abdication.
        lonlat: [1.444, 43.605]
