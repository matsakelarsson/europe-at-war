        date: 10 October 1806
        text: Marshal Lannes beat a Prussian and Saxon advance guard. Its commander, Prince Louis Ferdinand of Prussia, was killed.
        lonlat: [11.36, 50.65]
      - kind: battle
        side: fr
        name: Battle of Jena
        date: 14 October 1806
        text: Napoleon, who thought he faced the main Prussian army, beat Hohenlohe’s Prussians and Saxons on the plateau west of the town.
        lonlat: [11.51, 50.95]
        lp: l
      - kind: battle
        side: fr
        name: Battle of Auerstedt
        date: 14 October 1806
        text: Davout’s corps held off and then routed the main Prussian army. Its commander, the Duke of Brunswick, was mortally wounded.
        lonlat: [11.62, 51.115]
        lp: t
      - kind: taken
        side: fr
        name: Berlin
        date: 27 October 1806
        text: Napoleon entered the Prussian capital. Here in November he decreed a blockade of Britain, the Continental System.
        lonlat: [13.4, 52.52]
      - kind: battle
        side: fr
        name: Battle of Prenzlau
        date: 28 October 1806
        text: Hohenlohe surrendered the remains of his army, some 10,000 men, to Murat’s cavalry.
        lonlat: [13.867, 53.317]
      - kind: siege
        side: fr
        name: Magdeburg
        date: 8 November 1806
        text: Prussia’s greatest fortress surrendered to Marshal Ney with a garrison of some 25,000 men after a two-week siege.
        lonlat: [11.627, 52.131]
