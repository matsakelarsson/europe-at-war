  - title: The end of the Padri
    date: October 1837 – December 1838
    when: "1838-12-28"
    borders: "1838-12-28"
    countries: [id, nl]
    body:
      - In October 1837 Tuanku Imam Bonjol was invited to talks at Palupuh and arrested there. He was exiled first to Cianjur in West Java, then to Ambon and finally to Minahasa in northern Sulawesi, where he died on 6 November 1864.
      - The last Padri leader in the field was Tuanku Tambusai, whose campaigns had ranged from Rokan to Mandailing and the west coast at Natal, and whom the Dutch called “the Padri tiger of Rokan”. On 28 December 1838 Dutch troops and their allies took his fortress at Dalu-Dalu on the upper Rokan; he escaped by a secret door, travelled down the river to the Strait of Malacca and settled at Rasah in Negeri Sembilan on the Malay peninsula, where he died in 1882.
      - West Sumatra was now under Dutch rule, and the coffee its villages had to grow for the government made it one of the most profitable regions of the colony. In the aftermath adat chiefs and religious leaders reached an accommodation summed up in the saying adat basandi syarak, syarak basandi Kitabullah, “custom rests on Islamic law, Islamic law rests on the Book of God”, which still defines Minangkabau identity.
    facts:
      - [Tuanku Imam Bonjol arrested, "October 1837"]
      - [Dalu-Dalu taken, "28 December 1838"]
