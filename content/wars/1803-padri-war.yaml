steps:
  - title: The Padri and the civil war in the highlands
    date: 1803–1820
    when: "1815"
    borders: "1815"
    countries: [id]
    body:
      - The Minangkabau highlands, the old kingdom of Pagaruyung, were a land of self-governing villages (nagari) ruled by their adat, the customary law under which land and houses passed through the female line, with a king at Pagaruyung whose power was mostly ceremonial. Islam had long been taught there through Sufi schools, and the reformer Tuanku Nan Tuo of Koto Tuo had campaigned by preaching against cockfighting, gambling and opium. Around 1803 three pilgrims, Haji Miskin, Haji Sumanik and Haji Piobang, returned from Mecca, then falling to the Wahhabis, determined to enforce Islamic law. With Tuanku Nan Renceh and others they formed a council of eight leaders, the Harimau nan Salapan (eight tigers), and began to impose their rule by force.
      - The Padri banned cockfighting, gambling, betel, tobacco and drink, made men wear white and grow beards and women cover themselves, and killed or enslaved those who resisted. Many villages joined them and others resisted, and the highlands fell into years of raids and village wars. Tuanku Nan Tuo, who rejected their violence, saw his village besieged from 1815, and his sons were killed.
      - In 1815 Padri forces under Tuanku Lintau attacked the royal family at Koto Tangah near Pagaruyung. Many of its members were killed, and Sultan Arifin Muningsyah fled; when Raffles visited in 1818 he found only the burned remains of the palace. In the north, Peto Syarif, later known as Tuanku Imam Bonjol, built the fortified town of Bonjol in the Alahan Panjang valley.
    facts:
      - [Return of the three hajis, "about 1803"]
      - [Attack on the royal family, "1815"]
