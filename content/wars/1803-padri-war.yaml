  - title: The siege of Bonjol
    date: 1834 – August 1837
    when: "1837-08-16"
    borders: "1837-08-16"
    countries: [id, nl]
    body:
      - In 1834 the Dutch used thousands of forced labourers to build roads and bridges towards Bonjol, and in June 1835 their troops pushed into the Alahan Panjang valley and began to bombard the town from 250 paces. Bonjol lay beneath Bukit Tajadi, a steep hill fortified with two stone walls about three metres high, a deep ditch and hedges of thorny bamboo, from which Padri cannon answered the Dutch guns. Padri fighters from the conquered districts streamed in to defend it.
      - A blockade failed as the Padri raided the besiegers’ posts and supplies. Bugis troops led an attack in August 1835, but on 5 September the defenders sallied out and destroyed the Dutch works, and in December the villagers of Simpang and Alahan Mati rose behind the Dutch lines until Madurese troops put them down. On 3 December 1836 a great assault broke into the town and killed members of Imam Bonjol’s family, but the Padri drove the attackers out.
      - In 1837 Major-General Cochius took command and encircled Bonjol from all sides, from 16 March to 17 August, with an army of 148 European and 36 Indonesian officers, 1,103 European and 4,130 Indonesian soldiers, Javanese, Madurese, Bugis and Ambonese, and a company of African soldiers recruited on the Gold Coast. Under Lieutenant-Colonel Michiels the besiegers closed in; Bukit Tajadi fell on 15 August and Bonjol on 16 August 1837. Tuanku Imam Bonjol escaped with a few followers.
    facts:
      - [Failed assault, "3 December 1836"]
      - [Cochius’s army, "about 5,400 men"]
      - [Bonjol taken, "16 August 1837"]
