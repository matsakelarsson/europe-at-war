  - title: The rising of 1833 and the Long Declaration
    date: "1833"
    when: "1833-01-11"
    borders: "1833"
    countries: [id, nl]
    body:
      - The adat chiefs had come to fear Dutch rule as much as the Padri, and Padri and adat leaders began to make common cause. On 11 January 1833 Dutch posts across the highlands were attacked at once; about 139 European soldiers and hundreds of Indonesian soldiers were killed. The Dutch accused Sultan Tangkal Alam Bagagar, the Pagaruyung prince they had made regent of Tanah Datar, of treason, arrested him at Batusangkar on 2 May and exiled him to Batavia, though he denied any part in the attacks.
      - In the north Tuanku Rao attacked a new Dutch fort at Padang Matinggi, but on 29 January he was badly wounded in a fight at Air Bangis and died on the ship taking him into exile. Tuanku Tambusai stormed Fort Amerongen, near Bonjol. Governor-General Johannes van den Bosch came to Padang in August 1833 and ordered Bonjol taken by mid-September, but the attack failed.
      - Late in 1833 the government issued the Plakat Panjang (Long Declaration), promising the Minangkabau that it had come only to trade and keep the peace, that their own chiefs would govern them and that they would pay no taxes. Instead they were to grow coffee and sell it to the government at fixed prices, the beginning of forced coffee cultivation in West Sumatra.
    facts:
