  - title: The Dutch conquer the heartland
    date: 1831–1832
    when: "1832-10"
    borders: "1832-12"
    countries: [id, nl]
    body:
      - After the Java War the Dutch turned on the Padri again, wanting the coffee trade of the interior for themselves. Breaking the truce, they attacked Pandai Sikek, a centre of gunpowder and firearms making, and in early August 1831 they took Lintau and brought Tanah Datar under their control; Tuanku Lintau fought on from Limapuluh Kota. Lieutenant-Colonel Elout was reinforced by the Javanese legion of Sentot Prawirodirjo, the former commander of Diponegoro, but the Dutch came to suspect Sentot of dealings with the Padri, sent his men back to Java and later exiled him to Bengkulu.
      - In July 1832 more infantry arrived from Batavia under Lieutenant-Colonel Ferdinand Vermeulen Krieger. In October Limapuluh Kota fell, and Tuanku Lintau died; at the end of the year the Dutch took Kamang, the last Padri stronghold in Agam, and the Padri withdrew north to Bonjol. The three luhak, the core lands of the Minangkabau, were in Dutch hands.
    facts:
      - [Lintau taken, "early August 1831"]
      - [Limapuluh Kota taken, "October 1832"]
      - [Kamang taken, "end of 1832"]
