notes:
  - Historians date the war differently. The fighting among the Minangkabau began soon after 1803; Dutch involvement began with the treaty of February 1821 (sources give 10 or 21 February), and Dutch accounts often divide the war into a first war (1821–1825) and a second (1831–1837 or 1838). The historian Christine Dobbin has stressed the role of the coffee trade on both sides.
  - The Padri were feared in their time, and their campaigns, including raids into the Mandailing and Batak lands to the north, killed and enslaved many people; some Batak historians have objected to Tuanku Imam Bonjol’s status as a National Hero of Indonesia, which he received in 1973. Indonesian national history honours him and Tuanku Tambusai as leaders of resistance to colonial rule.
  - “Padri” probably comes from Pedir in Aceh, where pilgrims embarked for Mecca, or from the Portuguese padre; the Padri leaders were known by the title Tuanku.
