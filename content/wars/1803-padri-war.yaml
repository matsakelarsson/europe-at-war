  - title: The Dutch intervene
    date: 1821–1825
    when: "1822-03-04"
    borders: "1822-03"
    countries: [id, nl]
    body:
      - The Dutch, back in Padang on the coast after the British occupation, were approached by adat chiefs and members of the royal house who had fled the Padri. On 10 February 1821 (some accounts say 21 February) they signed a treaty in Padang ceding the Pagaruyung lands to the Netherlands in return for help. In April 1821, on the orders of the resident, James du Puy, Dutch troops under Captains Goffinet and Dienema occupied Simawang and Sulit Air, and in December reinforcements arrived under Lieutenant-Colonel Raaff.
      - On 4 March 1822 Raaff drove the Padri out of Pagaruyung, and the Dutch built Fort Van der Capellen at nearby Batusangkar. The Padri fell back to Lintau and fought on. On 14 August 1822 they defeated a Dutch force at Baso, wounding its commander, and in 1823 a Dutch attack on Lintau was beaten back. The adat chiefs found that the Dutch, in practice, meant to rule.
      - With most of its troops needed in Java, the government made peace with the Padri of the north by the Treaty of Masang in 1824 (some accounts say 1825). For six years the highlands were largely quiet while the Java War lasted, and coffee growing spread in the highland villages, sold to traders on both coasts.
    facts:
