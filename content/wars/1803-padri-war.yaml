id: padri-war
name: Padri War
start: "1803"
end: "1838-12-28"
tier: A
summary: "A war in the Minangkabau highlands of West Sumatra that began as a struggle within Minangkabau society and ended in Dutch conquest. From about 1803 the Padri, Islamic reformers inspired by pilgrims returning from Mecca, set out to impose Islamic law and stamp out customs they held un-Islamic, such as cockfighting, gambling, opium, drink and parts of the matrilineal adat (customary law). Their war against the adat chiefs and the royal house of Pagaruyung, which they largely destroyed in 1815, turned many villages against each other. In 1821 adat leaders who had fled to Padang ceded their lands to the Dutch in return for help, and Dutch troops took Pagaruyung in 1822, but the Padri held them off, and the Treaty of Masang of 1824 left the war in abeyance during the Java War. From 1831 the Dutch, eager for the highlands’ coffee, conquered the Minangkabau heartland. A general rising of Padri and adat villages in January 1833 showed that the adat chiefs, too, had turned against Dutch rule. The Padri centre, Bonjol, fell on 16 August 1837 after a long siege; its leader, Tuanku Imam Bonjol, was seized during talks in October and exiled, and the last Padri stronghold, Tuanku Tambusai’s fort at Dalu-Dalu, fell in December 1838. The war left West Sumatra under Dutch rule and forced coffee cultivation, and produced the reconciliation of adat and Islam summed up in the saying that custom rests on Islamic law and Islamic law on the Qur’an."
