  - title: Cuttack, Broach and the peace of December 1803
    date: August – December 1803
    when: "1803-12-17"
    borders: "1803-12-30"
    countries: [in]
    body:
      - Smaller Company forces had seized the outlying Maratha lands. In Gujarat, Colonel Woodington stormed Scindia’s port of Broach (Bharuch) on 29 August and took the hill fort of Pavagadh above Champaner on 17 September. In the east a force from Madras under Colonel George Harcourt marched up the coast from Ganjam into the Bhonsle’s province of Odisha, occupied Puri and its great temple on 18 September without resistance, and stormed the Barabati fort at Cuttack on 14 October. A seaborne force from Bengal took Balasore.
      - By the Treaty of Deogaon of 17 December 1803 Raghoji Bhonsle ceded the province of Cuttack, which joined the Company’s lands in Bengal and Madras, and his part of Berar west of the Wardha river, which was given to the Nizam. By the Treaty of Surji-Anjangaon of 30 December Scindia ceded the upper Ganges–Yamuna Doab, Delhi, Agra and the lands to the north-west of them, Ahmednagar, Broach and his lands south of the Ajanta hills, and gave up his claims on the Mughal emperor. Both rulers had to accept British residents at their courts, and in February 1804 Scindia accepted a subsidiary alliance.
      - The Company was now the strongest power in India and the guardian of the Mughal emperor in Delhi. But Wellesley’s wars had cost far more than the Company’s directors in London wished to pay, and Holkar, who had stayed out of the war of 1803, remained in arms.
    facts:
      - [Broach stormed, "29 August 1803"]
      - [Cuttack (Barabati fort) stormed, "14 October 1803"]
      - [Treaty of Deogaon, "17 December 1803, with Raghoji II Bhonsle"]
      - [Treaty of Surji-Anjangaon, "30 December 1803, with Daulat Rao Scindia"]
