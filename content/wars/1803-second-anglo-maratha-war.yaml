  - title: "Holkar’s war: Monson’s retreat and the siege of Delhi"
    date: April – October 1804
    when: "1804-07-08"
    borders: "1804-10-15"
    countries: [in]
    body:
      - Yashwantrao Holkar had kept his army out of the war of 1803, hoping to gain from Scindia’s defeat. In 1804 he demanded tribute from the Rajput states and lands from the Company, and in April Lord Wellesley declared war on him. Holkar fought differently from Scindia. He relied on swift cavalry, which raided and cut supply lines, and avoided pitched battles unless he could choose the ground.
      - Lake sent Colonel William Monson south through Rajputana with five sepoy battalions and irregular horse. Monson advanced through Kota beyond the Mukundara pass into Holkar’s lands, ran short of supplies and, when Holkar came at him in force, began to retreat on 8 July. His rearguard was destroyed at the pass on 10 July, the Kota garrison shut its gates on him, and he abandoned his guns in the mud of the monsoon rivers. Harried all the way, his column lost men at every river crossing, and only a fraction of it reached Agra at the end of August.
      - Holkar followed into Hindustan, took Mathura and in October laid siege to Delhi. The city’s walls were long and in poor repair, but Lieutenant-Colonel David Ochterlony, the Resident, and Lieutenant-Colonel William Burn held them with a garrison of a few thousand men for about a week, beating off an assault, until Holkar withdrew on Lake’s approach.
    facts:
      - [War declared on Holkar, "April 1804"]
      - [Mukundara pass, "8–10 July 1804, Holkar’s victory"]
      - [Monson’s survivors reach Agra, "end of August 1804"]
      - [Siege of Delhi, "8–15 October 1804, Company defence"]
    markers:
