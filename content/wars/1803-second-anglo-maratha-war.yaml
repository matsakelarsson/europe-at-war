steps:
  - title: Holkar, the Peshwa and the Treaty of Bassein
    date: October 1802 – May 1803
    when: "1802-10-25"
    borders: "1803-05-13"
    countries: [in]
    body:
      - By 1800 the Maratha confederacy was held together only loosely by the Peshwa at Pune (Poona). Its great chiefs, Daulat Rao Scindia, Yashwantrao Holkar and Raghoji II Bhonsle of Nagpur, ruled their own lands and fought each other for control of the Peshwa’s court. The young Peshwa, Baji Rao II, sided with Scindia and in 1801 had Holkar’s brother Vithoji put to death. Holkar marched on Pune, and on 25 October 1802 he routed the combined armies of the Peshwa and Scindia at Hadapsar, outside the city.
      - Baji Rao fled to the coast and took refuge with the British at Bassein (Vasai), north of Bombay. There, on 31 December 1802, he signed the Treaty of Bassein, which the Governor-General, Lord Wellesley, had pressed on the Marathas for years. The Peshwa accepted a subsidiary force of 6,000 Company troops, paid for by ceding lands, and agreed to deal with other powers only through the Company. In effect he gave up the independence of the Peshwa’s state.
      - In March 1803 Arthur Wellesley, the Governor-General’s brother, marched north from Mysore with a Company army and a force from Hyderabad. Holkar withdrew to Malwa without a fight, and on 13 May 1803 Baji Rao was reinstalled in Pune. Scindia and the Bhonsle saw the treaty as the end of Maratha independence and gathered their armies on the Nizam’s border. When they refused to withdraw, the Company went to war with them in early August.
    facts:
      - [Battle of Poona (Hadapsar), "25 October 1802, Holkar’s victory"]
      - [Treaty of Bassein, "31 December 1802"]
      - [Baji Rao II restored at Pune, "13 May 1803"]
