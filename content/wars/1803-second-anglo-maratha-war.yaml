id: second-anglo-maratha-war
name: Second Anglo-Maratha War
start: "1803-08-06"
end: "1805-12-24"
tier: A
summary: "A war between the British East India Company and the Maratha chiefs Daulat Rao Scindia of Gwalior and Raghoji II Bhonsle of Nagpur, and from 1804 Yashwantrao Holkar of Indore. It began after the Peshwa, Baji Rao II, driven from Pune by Holkar, accepted Company protection in the Treaty of Bassein (1802). In 1803 Arthur Wellesley won at Assaye and Argaon in the Deccan, Gerard Lake took Aligarh, Delhi and Agra and destroyed Scindia’s European-trained brigades at Laswari, and other columns took Cuttack and Broach. By the treaties of Deogaon and Surji-Anjangaon the Company gained Odisha, the upper Ganges–Yamuna Doab, Delhi and Agra, and became protector of the Mughal emperor. Holkar’s war of 1804–1805 went less well for the Company: Monson’s column was routed in Rajputana and Lake failed four times to storm Bharatpur. The Treaty of Rajghat (December 1805) ended the war with Holkar’s power reduced but intact."
countries: [in]
sides:
