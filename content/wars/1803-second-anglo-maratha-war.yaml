  - title: Ahmednagar and Assaye
    date: August – September 1803
    when: "1803-08-08"
    borders: "1803-09-23"
    countries: [in]
    body:
      - Wellesley opened the war in the Deccan at once. On 8 August 1803 his troops took the walled town of Ahmednagar by escalade, and on 12 August its fort, one of Scindia’s main strongholds, surrendered after a short bombardment. Wellesley crossed the Godavari and reached Aurangabad on 29 August. A second Company division under Colonel James Stevenson, based on the Nizam’s territory, moved in parallel. Scindia and the Bhonsle had come down through the Ajanta hills to threaten Hyderabad, but turned back towards the north.
      - On 23 September Wellesley, with about 4,500 Company infantry and cavalry and some 5,000 Mysore and Maratha allied horse, came upon the combined armies of Scindia and the Bhonsle camped along the Kailna river near the village of Assaye. They numbered perhaps 40,000–50,000 men, including about 10,800 infantry trained and led by European officers, and more than 100 guns. Instead of waiting for Stevenson, Wellesley crossed the river at an unguarded ford and attacked their flank.
      - The Maratha regular infantry wheeled to face him and their artillery tore into the attacking lines; one Highland regiment lost most of its men. After hours of close fighting the Maratha infantry gave way and retreated across the Juah river, leaving 98 guns. Wellesley lost 1,584 killed, wounded and missing, more than a third of his engaged troops; Maratha losses are estimated at about 6,000. Wellington later called it the bloodiest battle, for the numbers, that he ever saw.
    facts:
      - [Ahmednagar fort surrenders, "12 August 1803"]
      - [Battle of Assaye, "23 September 1803, Company victory"]
      - [Company losses at Assaye, "428 killed, 1,138 wounded, 18 missing"]
      - [Maratha guns taken, "98"]
