notes:
  - The Company’s armies were mostly Indian sepoys under British officers, with some British Army regiments. The Nizam of Hyderabad, the Peshwa, the Gaekwad of Baroda and the restored Wodeyar state of Mysore were Company allies; Hyderabad and Mysore troops served with Wellesley.
  - Arthur Wellesley, later Duke of Wellington, was the younger brother of the Governor-General, Richard Wellesley, Marquess Wellesley (Lord Mornington until 1799).
  - Two rulers named Ranjit Singh appear in this war, the Jat raja of Bharatpur, who held his fortress against Lake in 1805, and the Sikh ruler of Lahore, who would not help Holkar later that year.
  - Maratha strengths and losses come mostly from British dispatches and are uncertain. Holkar did not fight in 1803; Scindia and the Bhonsle had made peace before he went to war in 1804.
