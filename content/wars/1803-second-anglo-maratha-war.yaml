  - title: Deeg, Farrukhabad and Bharatpur
    date: November 1804 – December 1805
    when: "1804-11-13"
    borders: "1805-04-17"
    countries: [in]
    body:
      - After Delhi Holkar split his forces. His infantry and guns moved south towards Deeg, a fortress of his new ally, the Jat raja Ranjit Singh of Bharatpur, while Holkar rode with his cavalry into the Doab to raid the Company’s lands. On 13 November 1804 General John Henry Fraser attacked Holkar’s infantry under the walls of Deeg and routed them, capturing most of their guns; Fraser was mortally wounded. Lake pursued Holkar with his cavalry and, after a long night march, surprised his camp at Farrukhabad at dawn on 17 November. Holkar escaped. Lake then stormed Deeg on 24 December.
      - Bharatpur, with its thick mud walls and a wide moat, proved much harder. Lake began the siege in early January 1805, and between 9 January and 21 February he sent four assaults against the walls. All failed, with about 3,200 Company soldiers killed and wounded. In April Ranjit Singh made peace, paying an indemnity of 20 lakh rupees and keeping his state; the fortress gained a name for being impregnable.
      - Wellesley was recalled for the cost of his wars, and his successors, Lord Cornwallis and then Sir George Barlow, wanted peace. In November 1805 Scindia, who had nearly gone to war again, got back Gwalior and Gohad by a new treaty. Holkar fled north into the Punjab, hoping for help from the Sikhs, but Ranjit Singh of Lahore would not give it. Lake followed him to the Beas river, and on 24 December 1805 Holkar signed the Treaty of Rajghat, giving up Tonk, Rampura and Bundi and his claims north of the Bundi hills, but keeping most of his other lands.
