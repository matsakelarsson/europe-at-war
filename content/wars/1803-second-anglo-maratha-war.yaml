  - title: Aligarh, Delhi and Agra
    date: August – October 1803
    when: "1803-08-29"
    borders: "1803-10-18"
    countries: [in]
    body:
      - In the north the Commander-in-Chief, General Gerard Lake, marched up the Doab from Kanpur (Cawnpore) in August 1803 with about 10,000 men. Scindia’s northern army and the lands between the Ganges and the Yamuna were run by his French commander, Pierre Cuillier-Perron, whose brigades of regular infantry and artillery were officered largely by Europeans. On 29 August Lake drove Perron’s cavalry away from Koil, and on 4 September his troops blew in the gate of Perron’s fortress at Aligarh and stormed it. Perron left Scindia’s service and passed into British territory, and several of his officers followed.
      - Lake pressed on to Delhi. On 11 September, at Patparganj on the east bank of the Yamuna, his outnumbered army attacked the brigades of Louis Bourquien and broke them after a costly frontal advance. The blind Mughal emperor, Shah Alam II, had lived under Maratha control since 1771. He received Lake in the Red Fort on 16 September, and the Company took over his protection and the government of Delhi in his name.
      - Lake then turned south. Agra, held by a garrison of Scindia’s regular infantry who had imprisoned their European officers, was besieged from 10 October and surrendered on 18 October with its treasury and many guns.
    facts:
      - [Storming of Aligarh, "4 September 1803"]
      - [Battle of Delhi, "11 September 1803, Company victory"]
      - [Lake meets Shah Alam II, "16 September 1803"]
      - [Agra surrenders, "18 October 1803"]
