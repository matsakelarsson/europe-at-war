  - title: Argaon and Gawilghur
    date: October – December 1803
    when: "1803-10-16"
    borders: "1803-12-15"
    countries: [in]
    body:
      - After Assaye the Maratha armies broke up into separate forces. While Wellesley covered the Nizam’s country, Stevenson marched north through the Ajanta hills, took Scindia’s city of Burhanpur on 16 October and the great hill fort of Asirgarh on 21 October. Scindia asked for a truce, which Wellesley granted in November for his own army only, and the Bhonsle’s army was left to fight alone.
      - Wellesley and Stevenson joined and on 29 November met the Bhonsle’s army, with some of Scindia’s cavalry, at Argaon (Adgaon) in Berar. Some of Wellesley’s sepoy battalions, which had suffered at Assaye, broke under artillery fire at the start, but Wellesley rallied them and the Maratha army was routed with the loss of its guns.
      - The survivors fell back on Gawilghur, a fortress on a ridge of the Satpura hills that was thought impregnable. Siege guns were dragged up the hills, and on 15 December 1803 the fort was stormed. Two days later Raghoji Bhonsle made peace.
    facts:
