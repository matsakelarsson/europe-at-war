  - title: Laswari
    date: 1 November 1803
    when: "1803-11-01"
    borders: "1803-11-01"
    countries: [in]
    body:
      - Scindia’s last regular brigades in the north, about 9,000 infantry with 5,000 cavalry and many guns, had come up from the Deccan and were moving west from the Agra region towards the hills of Alwar. Lake left Agra on 27 October in pursuit with his cavalry, rode through the night of 31 October, and caught them at dawn near the village of Laswari.
      - His cavalry charges against the Maratha lines failed under heavy cannon fire, and Lake had to wait for his infantry, which came up around midday after a forced march. In the afternoon the infantry, led by the 76th Foot, attacked the Maratha guns and the brigades were destroyed after hard fighting. Lake lost more than 800 killed and wounded; the Maratha losses were far heavier, and all their guns were taken. Scindia’s European-trained army in Hindustan had ceased to exist.
    facts:
      - [Battle of Laswari, "1 November 1803, Company victory"]
      - [Company losses, "more than 800 killed and wounded"]
    markers:
