steps:
  - title: Degel and the hijra
    date: 1774 – February 1804
    when: "1804-02-21"
    borders: "1804-02-21"
    countries: [ng, ne]
    body:
      - At the end of the 18th century the land between the Niger and Lake Chad was divided among the Hausa kingdoms, Gobir, Kebbi, Zamfara, Katsina, Kano, Zazzau and Daura among them, walled cities ruled by kings who were Muslims but kept older court rituals and the spirit cult of bori. They fought one another constantly, raided for slaves and taxed their subjects heavily; Gobir had destroyed the capital of Zamfara in the 1750s or 1760s and built its own new capital, Alkalawa, on Zamfara land. Fulani cattle herders lived among the Hausa farmers, and Fulani clerics, the Torodbe, ran Quranic schools in the countryside.
      - Usman dan Fodio, born on 15 December 1754 at Maratta in Gobir into a family of Torodbe scholars, began preaching in 1774 and toured Gobir, Kebbi and Zamfara for twenty years. He called on rulers to govern by Islamic law and denounced unjust taxes, the enslavement of Muslims and the mixing of Islam with older beliefs, and he insisted that women be taught as well as men. From his base at Degel he drew a large following of scholars, Fulani pastoralists and Hausa peasants. In about 1788 King Bawa of Gobir granted him the freedom to preach, but Bawa’s successor Nafata forbade conversions and the wearing of the turban that marked Usman’s community, and Yunfa, a former pupil of Usman who came to the throne in about 1801–1803, turned against his teacher; according to the jihad leaders’ accounts, he tried to kill him.
      - "Late in 1803 Gobir troops attacked the Muslim community of Gimbana and carried off captives, and Usman’s followers freed them as the column passed Degel. Yunfa ordered Usman to leave Degel with his family alone. Usman refused to abandon his people, and on 21 February 1804 he led them on a hijra, an emigration modelled on the Prophet’s, to Gudu on the western edge of Gobir, some 100 km away. Thousands followed, and Yunfa ordered their property seized. At Gudu the community swore allegiance to Usman as Amir al-Mu’minin, Commander of the Faithful; his brother Abdullahi gave the first pledge and his son Muhammad Bello the second. Usman, now nearly fifty, took no part in the fighting, which was led by Abdullahi, Bello and the army commander Ali Jedo."
    facts:
      - [Usman dan Fodio, "born 15 December 1754, died 20 April 1817"]
      - [Hijra to Gudu, "21 February 1804"]
      - [Usman’s title, "Amir al-Mu’minin (Hausa Sarkin Musulmi)"]
