    name: Usman dan Fodio’s jihad (the Sokoto Caliphate)
    polities: [sokoto-caliphate]
    ink: green
    moves: Jihadist moves
    success: Jihadist success
  - id: hau
    name: Gobir and the Hausa kingdoms
    polities: [gobir, kebbi, zamfara, katsina, kano, zazzau]
    ink: red
    moves: Hausa moves
    success: Hausa success
