  - title: Tabkin Kwatto
    date: March – June 1804
    when: "1804-06"
    borders: "1804-06-21"
    countries: [ng, ne]
    body:
      - The emigrants at Gudu were short of food and arms, with few horses and many bows. After beating off a small Gobir force, they seized Matankari and Konni, towns on their northern flank, and sought allies among the Tuareg of Adar and the Fulani clans who had suffered under Gobir. Yunfa gathered his army, heavy cavalry with Tuareg allies and men of the Sullubawa Fulani, and marched west to crush them before the movement spread.
      - In June 1804 the two armies met by the lake of Kwatto (Tabkin Kwatto), not far from Gudu. Abdullahi, who commanded the Muslim force, drew it up with a stream on one flank and thick bush in front; his archers held off the charges of the Gobir horsemen, and when the commander of Gobir’s armoured cavalry fell the Gobir army broke and Yunfa fled. To the jihadists the victory over a much larger army seemed a sign of God’s favour, and recruits poured into their camp.
      - The rains had started and the harvest was months away, and the camp moved from place to place in search of grain and pasture. Several Zamfara chiefs, old enemies of Gobir, sent traders with food; Muhammad Bello later wrote that they did so out of hostility to Gobir more than zeal for reform.
    facts:
      - [Battle of Tabkin Kwatto, "June 1804 (Rabi’ al-Awwal 1219), jihadist victory"]
      - [Jihadist commander, Abdullahi dan Fodio]
