    moves: Bornu moves
    success: Bornu success
notes:
  - "The jihad is usually dated 1804–1808, from the hijra to the fall of Alkalawa; the wars in Bornu and the founding of the southern emirates went on for years after, and this story follows them to the division of the caliphate in 1812."
  - "Most of what is known comes from the leaders of the jihad themselves, above all Abdullahi dan Fodio’s Tazyin al-waraqat and Muhammad Bello’s Infaq al-maysur, written in Arabic soon after the events, and from al-Kanemi’s letters on the Bornu side. The Hausa kings left no written account. Dates are given in the Islamic calendar in these sources and often differ by a year between modern histories, especially for Katsina, Kano and Zazzau."
  - "“Fulani War” is the British name. Historians now speak of the jihad of Usman dan Fodio or the Sokoto jihad, and of the Sokoto Caliphate, a term Murray Last brought into use in the 1960s; older books call the state the Fulani Empire. Its army was led mostly by Fulani scholars and clan heads, but Hausa peasants, Tuareg and others fought on both sides."
