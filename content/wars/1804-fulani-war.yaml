  - title: The flag-bearers
    date: 1805–1808
    when: "1807"
    borders: "1808-06-01"
    countries: [ng, ne]
    body:
      - The war against Gobir set off risings across Hausaland. Hausa kings, alarmed by the movement, turned on the Muslim communities in their own lands, and those communities sent their leaders to Usman, who gave each a flag and authority to wage the jihad in his own country. Most of the flag-bearers were Fulani clerics or clan heads; Yakubu of Bauchi was a Gerawa, the only one who was not. In the dry season of 1805–1806 Bello met leaders from Kano, Daura and Zamfara and took their oath of allegiance to Usman.
      - "Katsina fell between 1805 and 1807 (the sources differ); its king, Magajin Halidu, is said to have killed himself, and Umaru Dallaji became its first emir. The Fulani leaders of Kano, under Suleiman dan Abahama, defeated King Muhammad Alwali II, who fled and was later killed at Burum-Burum; Suleiman ruled Kano as emir from about 1805–1807. In Zazzau, Mallam Musa took Zaria in 1808, and its Hausa king, Muhammad Makau, fled south and founded Abuja (today’s Suleja), which kept its independence until the British conquest. Daura, Hadejia, Katagum, Gombe and Bauchi also became emirates."
      - The old dynasties did not disappear. Exiled kings of Katsina, Gobir, Kebbi and Zazzau carried on the fight from refuges at Maradi, Tibiri, Argungu and Abuja, and raided the new emirates for decades. Captives taken in the wars were enslaved, as captives had been under the Hausa kings; the jihad opened what historians call a new slaving frontier on the edges of the caliphate.
    facts:
      - [Katsina, "taken 1805–1807; Umaru Dallaji emir"]
      - [Kano, "taken about 1805–1807; Suleiman dan Abahama emir"]
      - [Zazzau, "Zaria taken 1808; Mallam Musa emir"]
