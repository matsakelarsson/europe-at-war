  - title: Tsuntua, Kebbi and Alwassa
    date: October 1804 – late 1805
    when: "1804-12"
    borders: "1805-06-01"
    countries: [ng]
    body:
      - After the harvest of October 1804 the jihadists marched east into the hinterland of Alkalawa, taking villages as they went. A mediator from Gummi in Zamfara failed; the Muslims demanded that Yunfa come to Usman in person. In December 1804, during Ramadan, with their camp a few kilometres from the capital and its men dispersed in search of food, the Gobir army and its Tuareg allies (the Kel Gress and others, who grazed their herds in the Rima valleys) attacked at Tsuntua. Bello was ill and Abdullahi wounded; by Bello’s own count about 2,000 Muslims were killed, 200 of them men who knew the Quran by heart.
      - The survivors spent the rest of Ramadan in the valley and in early 1805 moved up the Rima into Zamfara, where they found friends. From there Abdullahi and Ali Jedo marched against Kebbi, whose capital, Birnin Kebbi, fell in 1805, and the Kebbi king fled north. The community settled at Gwandu, which gave it at last a permanent base.
      - Late in 1805 a combined army of Gobir, the Tuareg and Kebbi attacked the jihadists at Alwassa, near Gwandu, and killed about a thousand of them, again by Bello’s count. But the attackers could not press home their advantage in the broken ground around Gwandu, where the Tuareg camels were of little use, and they withdrew. Gwandu remained the headquarters of the jihad until 1809.
    facts:
      - [Battle of Tsuntua, "December 1804 (Ramadan 1219), Gobir victory"]
      - [Jihadist losses at Tsuntua, "about 2,000 (Bello’s figure)"]
      - [Fall of Birnin Kebbi, "1805"]
      - [Battle of Alwassa, "late 1805, attack beaten off"]
