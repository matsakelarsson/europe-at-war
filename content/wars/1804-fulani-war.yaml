  - title: Bornu and al-Kanemi
    date: 1807–1812
    when: "1808"
    borders: "1809-01-01"
    countries: [ng]
    body:
      - The jihad spread east into the western provinces of Bornu, the ancient empire whose kings, the mais, had been Muslims for eight hundred years. Fulani leaders there, Ibrahim Zaki in the Katagum country, Goni Mukhtar near Deya and others, took up Usman’s cause, and in about 1807 a rising in Daura led Mai Ahmad Alimi to send troops against them. After early successes the Bornu army was routed and its western governor, the galadima, was killed. In 1808 Goni Mukhtar’s forces captured and sacked the capital, Ngazargamu, on the Yobe; the old and blind Ahmad fled and gave up the throne to his son Dunama IX Lefiami.
      - Muhammad al-Amin al-Kanemi, a Kanembu scholar born in Murzuk in 1776, had settled at Ngala south of Lake Chad. With a small band of students, Kanembu spearmen and Shuwa Arab horsemen he beat off a Fulani attack on Ngala, and Dunama called on his help. Later in 1808 the mai’s army retook Ngazargamu and Goni Mukhtar was killed. In 1809 Ibrahim Zaki raided the capital again; the mai abandoned it for good, and Bornu’s court moved east.
      - Al-Kanemi also fought with the pen. In letters to Usman and Bello he asked by what right they made war on a people who had been Muslims for centuries; Bello answered that Bornu’s rulers had helped the Hausa kings and tolerated pagan practices. The debate is still read in Nigeria today. Al-Kanemi, given a fief at Ngurno, built an army and became the real power in Bornu; in 1814 he founded Kukawa and took the title shehu. The western provinces became the emirates of Hadejia, Katagum, Jama’are and Misau, but Bornu survived, and the frontier between it and the caliphate remained a war zone for decades.
