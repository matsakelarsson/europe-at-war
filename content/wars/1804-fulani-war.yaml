  - title: Gwandu, Sokoto and the new emirates
    date: 1809–1817
    when: "1812"
    borders: "1812-06-01"
    countries: [ng, ne, cm]
    body:
      - The jihad went on in the south and east. In about 1809 (some sources say 1806) Modibo Adama, a scholar sent to Usman by the Fulani clan heads of Fombina, the “southlands” on the upper Benue, came back with a flag and began the conquest of the lands that became Adamawa, named after him; his lieutenants pushed into what is now northern Cameroon, and Yola became his capital in 1841. Buba Yero founded Gombe and Yakubu Bauchi. In Nupe a Fulani preacher, Mallam Dendo, took sides in the civil wars that followed the death of Etsu Ma’azu in 1818, and his sons came to rule the kingdom as an emirate. In Oyo, the great Yoruba empire to the south, the rebel general Afonja called in Fulani and Hausa Muslims in 1817, and by the 1820s Ilorin had become an emirate of the caliphate (see the Fall of the Oyo Empire).
      - In 1812 Usman divided the government. His brother Abdullahi took the western emirates from Gwandu, and his son Muhammad Bello the east from Sokoto; Usman went back to teaching and writing. When he died at Sokoto on 20 April 1817, Bello succeeded him as Commander of the Faithful, and Abdullahi, after a brief quarrel, accepted him.
      - The caliphate the jihad created was a confederation of more than thirty emirates whose emirs pledged allegiance to the caliph at Sokoto, with a population of perhaps ten million by the mid-century. It brought Islamic law and a flowering of Arabic, Hausa and Fulfulde scholarship, by Usman, Abdullahi, Bello and Usman’s daughter Nana Asma’u among others. It also rested on slavery. By 1900 the caliphate held at least one million and perhaps 2.5 million slaves, captured in raids on its frontiers, according to Paul Lovejoy and Jan Hogendorn. Its example inspired the jihads of Seku Amadu in Massina and Umar Tall in the western Sudan, and it lasted until the British conquest of 1903.
    facts:
