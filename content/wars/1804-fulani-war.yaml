  - title: The fall of Alkalawa
    date: October 1808
    when: "1808-10"
    borders: "1808-11-01"
    countries: [ng, ne]
    body:
      - By 1808 Gobir stood almost alone. Three earlier attacks on Alkalawa had failed, and the jihad leaders now planned a converging assault. Muhammad Bello and the army commander Ali Jedo marched from the west with the main army, Muhammadu Namoda led the Fulani of Zamfara and Umaru Dallaji the jihadists of Katsina. The city was surrounded, and on 3 October 1808, at the fourth assault, it was stormed. Yunfa was killed with many of his officials, and large parts of the town were destroyed.
      - With the fall of Alkalawa the main aims of the jihad had been achieved. In 1809 Bello turned his camp at Sokoto, on a ridge above the Rima, into a walled town that became the capital of the caliphate; Usman settled at nearby Sifawa and moved to Sokoto in 1815.
      - Gobir’s royal family fled north. Its kings went on fighting from the edge of the desert, and in 1836, with the exiled rulers of Katsina, they rose again; Bello crushed them at Gawakuke, and the Gobir kingdom survived only as a rump state at Tibiri, in what is now Niger.
    facts:
      - [Fall of Alkalawa, "3 October 1808, at the fourth assault"]
      - [Death of Yunfa, "October 1808"]
      - [Sokoto founded, "1809"]
