id: fulani-war
name: Fulani War
start: "1804-02-21"
end: "1812"
tier: A
summary: "The jihad of Usman dan Fodio, which overthrew the Hausa kingdoms of what is now northern Nigeria and created the Sokoto Caliphate, the largest state in West Africa in the 19th century. Usman, a Fulani scholar who had preached reform in Gobir and its neighbours for thirty years, was driven from his community at Degel by King Yunfa of Gobir, his former pupil, and on 21 February 1804 led his followers into exile at Gudu, where they swore allegiance to him as Commander of the Faithful. His army, Fulani, Hausa and Tuareg, beat Gobir’s cavalry at Tabkin Kwatto in June 1804, survived a heavy defeat at Tsuntua in December, took Kebbi in 1805 and made Gwandu its base. Leaders who received flags from Usman rose across Hausaland and took Katsina, Kano and Zazzau between 1805 and 1808, and the Gobir capital Alkalawa fell in October 1808. In Bornu the jihadists sacked the capital, Ngazargamu, in 1808, but the scholar Muhammad al-Amin al-Kanemi rallied the old empire, which survived under his family. By 1812 the new state was divided between Usman’s brother Abdullahi at Gwandu and his son Muhammad Bello at Sokoto, and new emirates were growing in the south and east, in Adamawa, Nupe and, from the 1820s, Ilorin. The wars enslaved many thousands of captives, and the caliphate became one of the largest slave societies of the century."
countries: [ng, ne, cm]
sides:
