  - title: Aslanduz and the Treaty of Gulistan
    date: 1812–1813
    when: "1812-10-31"
    borders: "1813-10-24"
    countries: [az, am, ge, ru]
    body:
      - For six years neither side could win. Abbas Mirza modernised his army with French and then British officers, a Russian assault on Erivan failed in 1808, and early in 1812 a Persian force captured a whole Russian battalion near Sultanabad in Karabakh. Peace with the Ottomans at Bucharest in May 1812 freed Russian troops. On the night of 31 October General Pyotr Kotlyarevsky, with about 2,000 men, crossed the Aras and routed Abbas Mirza’s much larger army at Aslanduz.
      - Kotlyarevsky then marched across the snow-covered Mughan steppe and on 13 January 1813 stormed the new Persian fort at Lankaran. Almost all of its garrison of about 4,000 were killed, and the Russians lost some two-thirds of their attacking force. With Napoleon in retreat, Britain urged its Persian ally to make peace. The Treaty of Gulistan, signed on 24 October 1813 with a British envoy as mediator, gave Russia Dagestan, eastern Georgia and the khanates north of the Aras, and the sole right to keep warships on the Caspian Sea.
    facts:
      - [Battle of Aslanduz, "31 October – 1 November 1812, Russian victory"]
      - [Storming of Lankaran, "13 January 1813"]
      - [Treaty of Gulistan, "24 October 1813"]
    markers:
      - kind: battle
        side: ru
        name: Battle of Aslanduz
        date: 31 October – 1 November 1812
        text: Kotlyarevsky’s small force crossed the Aras by night and scattered the Persian army in its camp.
        lonlat: [47.406, 39.444]
      - kind: siege
        side: ru
        name: Lankaran
        date: 7–13 January 1813
        text: After a short bombardment the fort was stormed and its defenders killed almost to a man. Kotlyarevsky was found badly wounded among the dead.
        lonlat: [48.851, 38.754]
      - kind: treaty
        name: Treaty of Gulistan
        date: 24 October 1813
        text: Signed in a village in Karabakh. Its vague borders, above all north of Erivan and in Talysh, led to a new war in 1826.
        lonlat: [46.579, 40.358]
      - kind: event
        side: ir
        name: Tabriz
        date: 1804–1813
        text: The seat of Abbas Mirza, governor of Persian Azerbaijan, where French and then British officers trained his new regular army.
        lonlat: [46.3, 38.067]
