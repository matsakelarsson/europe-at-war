id: russo-persian-war-1804
name: Russo-Persian War of 1804–1813
start: "1804"
end: "1813-10-24"
tier: B
summary: A war between the Russian Empire and Qajar Persia over eastern Georgia, which Russia had annexed in 1801, and the khanates of the eastern Caucasus. After a long and mostly indecisive struggle, Russian victories at Aslanduz and Lankaran forced Persia to accept the Treaty of Gulistan in 1813, which gave Russia Dagestan, eastern Georgia and most of today’s Azerbaijan.
countries: [az, am, ge, ru]
sides:
  - id: ru
    name: Russian Empire
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
  - id: ir
    name: Qajar Persia
    polities: [persia]
    ink: orange
    moves: Persian moves
    success: Persian success
notes:
  - Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so the storming of Ganja is 3 January 1804 and the Battle of Aslanduz 19–20 October 1812 in Russian sources.
  - The khanates were local Muslim principalities under Persian overlordship. Persia did not accept their loss until 1813, so the base map shows them as Persian until the Treaty of Gulistan.
  - Ganja, renamed Yelizavetpol by the Russians, is shown under its present name.
