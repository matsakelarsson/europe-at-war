steps:
  - title: Ganja and the khanates
    date: 1804–1806
    when: "1804-01-15"
    borders: "1806-10-01"
    countries: [az, am, ge, ru]
    body:
      - Russia annexed the eastern Georgian kingdom of Kartli-Kakheti in 1801, and its new commander in the Caucasus, the Georgian-born Prince Pavel Tsitsianov, set out to bring the neighbouring khanates under Russian rule. On 15 January 1804 he stormed Ganja after a month’s siege. Javad Khan died fighting on the walls, and between 1,500 and 3,000 of the defenders and townspeople were killed. Fath-Ali Shah demanded that the Russians leave the Caucasus, and in June his heir, Abbas Mirza, marched on Erivan with a large army.
      - Tsitsianov fought Abbas Mirza at Echmiadzin and besieged Erivan, but ran short of food and fell back to Tiflis in September, having lost about half his men. In 1805 the khans of Karabakh, Sheki and Shirvan accepted Russian overlordship, and small Russian detachments held off Persian attacks in Karabakh. In February 1806 Tsitsianov was shot dead outside Baku while receiving the keys of the city, but later that year Russian troops took Derbent, Quba and Baku. War with the Ottomans from December 1806 then drew Russian forces west.
    facts:
      - [Storming of Ganja, "15 January 1804"]
      - [Siege of Erivan, "July – September 1804, Russian withdrawal"]
      - [Under Russian rule by 1806, "Ganja, Karabakh, Sheki, Shirvan, Baku, Quba and Derbent"]
