        label: Bosnian army
        via: [[19.15, 44.62], [19.45, 44.74], [19.72, 44.73]]
      - side: ot
        label: Ibrahim Pasha
        via: [[22.32, 43.22], [21.9, 43.35], [21.62, 43.58]]
      - side: rs
        label: Karađorđe
        via: [[20.93, 44.67], [20.7, 44.78], [20.48, 44.82]]
    areas:
      - style: occupied
        side: rs
        label: Held by the Serbian rebels, 1807 (approximate)
        atoms: [RS-00, RS-08, RS-09, RS-10, RS-11, RS-12, RS-13, RS-14, RS-16!, RS-17, RS-18!]
  - title: Čegar and the Skull Tower
    date: 1809–1810
    when: "1809-05-31"
    borders: "1810-10-18"
    countries: [rs, tr, ru]
    body:
      - When the Russo-Turkish war flared again in 1809, Karađorđe struck south-west into the Sanjak of Novi Pazar, hoping to open a corridor to Montenegro and the Adriatic. His men took Sjenica in May and the town of Novi Pazar in June, but not its fortress. In the south-east some 10,000 rebels dug in around the Ottoman fortress of Niš, but their commanders quarrelled and their trenches were poorly supported. On 31 May, after Ottoman reinforcements arrived from Rumelia, the redoubt on Čegar hill was stormed. Its commander, Stevan Sinđelić, fired into the powder magazine, killing himself, his men and many of the attackers.
      - Hurshid Pasha had the skulls of the dead Serbs built into a tower beside the Constantinople road at Niš; 952 were set in its walls. His army advanced down the Morava towards Belgrade, and thousands of people fled across the Danube into Austria, until Russian attacks south of the Danube in September drew the Ottomans off. Karađorđe’s appeals to Napoleon and to Vienna came to nothing. In 1810 Russian troops came back to Serbia, and in September Serbs and Russians under General Joseph O’Rourke beat Hurshid at Varvarin. In October a Bosnian army that had crossed the Drina was thrown back at Loznica.
    facts:
      - [Battle of Čegar, "31 May 1809, Ottoman victory"]
      - [Skull Tower, "built with 952 skulls"]
      - [Battle of Varvarin, "September 1810, Serbian and Russian victory"]
    markers:
      - kind: taken
        side: rs
        name: Sjenica
        date: May 1809
        text: Karađorđe’s offensive into the Sanjak of Novi Pazar took the town on the way towards Montenegro.
        lonlat: [20.0, 43.267]
        lp: l
      - kind: siege
        name: Novi Pazar
        date: June 1809
        text: The rebels took the town but not its fortress, and fell back when the Ottomans advanced from Niš.
        lonlat: [20.516, 43.138]
      - kind: battle
        side: ot
        name: Battle of Čegar
        date: 31 May 1809
        text: Ottoman troops overran Stevan Sinđelić’s redoubt after a day of assaults; he blew up its powder magazine rather than be taken.
        lonlat: [21.948, 43.366]
      - kind: event
        side: ot
        name: Skull Tower
        date: 1809
        text: Built on Hurshid Pasha’s orders as a warning to rebels. Only 58 skulls remain, inside a chapel built around the tower in 1892–1894.
        lonlat: [21.924, 43.312]
        lp: b
      - kind: battle
        side: rs
        name: Battle of Varvarin
        date: September 1810
        text: A Russian square under Joseph O’Rourke held against Hurshid Pasha’s attacks until Karađorđe’s Serbs counter-attacked; the Ottomans withdrew to Niš.
        lonlat: [21.367, 43.717]
      - kind: battle
        side: rs
        name: Loznica
        date: 17–18 October 1810
        text: The garrison held its entrenchments against a large Bosnian army under Ali Pasha Vidajić until relief arrived from Šabac and Valjevo.
        lonlat: [19.226, 44.533]
        lp: l
    arrows:
      - side: rs
        label: Karađorđe
        via: [[20.35, 43.88], [20.22, 43.55], [20.02, 43.3], [20.45, 43.16]]
      - side: ot
        label: Hurshid Pasha
        via: [[21.9, 43.36], [21.65, 43.62], [21.4, 43.94], [21.1, 44.3]]
      - side: ot
        via: [[19.1, 44.4], [19.2, 44.5]]
  - title: The collapse of 1813
    date: 1812–1814
    when: "1813-07"
    borders: "1813-10-07"
    countries: [rs, tr, bg, ro]
    body:
      - By the Treaty of Bucharest of May 1812, signed weeks before Napoleon invaded Russia, Russia withdrew from the Balkans. Its eighth article promised the Serbs an amnesty and self-government, but the Ottomans were to reoccupy the fortresses and towns, and forts built since 1804 were to be razed. Karađorđe refused, and the rebels, weakened by feuds that had led him to exile his rivals Petar Dobrnjac and Milenko Stojković, stood alone. In the summer of 1813 Ottoman armies, largely Bosnian and Albanian, invaded from Niš, Vidin and Bosnia. At Negotin Hajduk Veljko held out against a much larger force until he was killed in July.
      - In early October Karađorđe and other leaders crossed into Austria with a great many refugees, as many as 100,000 by one estimate, and Belgrade fell. The reconquest brought burned villages, executions and enslavement; on one day in October 1813, 1,800 women and children were reportedly sold at Belgrade. Hurshid Pasha then proclaimed an amnesty, and some commanders submitted, among them Miloš Obrenović, who was made knez of the Rudnik district. A rising led by Hadži Prodan in the Požega district in September 1814 failed, and the Ottomans answered with more killings, impaling some 200 prisoners in Belgrade.
    facts:
      - [Treaty of Bucharest, "28 May 1812"]
      - [Fall of Belgrade, "October 1813"]
      - [Hadži Prodan’s revolt, "September 1814, suppressed"]
    markers:
      - kind: siege
        side: ot
        name: Negotin
        date: July 1813
        text: Hajduk Veljko defended the town with about 3,000 men against an Ottoman and Wallachian force, melting down tin for bullets, until he was killed by a cannonball.
        lonlat: [22.531, 44.229]
      - kind: taken
        side: ot
        name: Belgrade
        date: October 1813
        text: The Ottomans re-entered the city after the rebel leaders had fled across the river into Austria.
        lonlat: [20.45, 44.823]
        lp: t
      - kind: event
        name: Požega
        date: September 1814
        text: Hadži Prodan’s rising began here; Miloš Obrenović, then in Ottoman service, refused to join it, and it was put down within weeks.
        lonlat: [20.036, 43.846]
    arrows:
      - side: ot
        label: Hurshid Pasha
        via: [[21.9, 43.36], [21.4, 43.95], [21.0, 44.4], [20.55, 44.78]]
      - side: ot
        label: From Vidin
        via: [[22.87, 43.99], [22.7, 44.12], [22.55, 44.22]]
      - side: ot
        label: From Bosnia
        via: [[19.1, 44.4], [19.35, 44.6], [19.68, 44.74]]
  - title: The Second Uprising
    date: April – November 1815
    when: "1815-04-23"
    borders: "1815-11-30"
    countries: [rs, tr]
    body:
      - Ottoman rule brought new taxes and reprisals, and Serbian leaders feared another massacre of the knezes. On 23 April 1815, Palm Sunday, an assembly at Takovo near Gornji Milanovac proclaimed a new rising and chose Miloš Obrenović to lead it. The rebels took Rudnik and in May routed a force of some 7,000 under Imšir Pasha on Ljubić hill outside Čačak, killing its commander. Over the summer they won at Palež, Valjevo, Kragujevac, Jagodina and Požarevac, and in July they stormed the entrenched camp of a Bosnian army at Dublje in Mačva, the last battle of the rising.
      - Larger Ottoman armies were gathering in Bosnia under Hurshid Pasha and in Rumelia under Marashli Ali Pasha, but after Napoleon’s final defeat the Porte feared a new Russian intervention. Miloš, a cautious diplomat, avoided battle with the main armies and negotiated with both pashas. In the autumn of 1815 Marashli Ali Pasha, the new governor of Belgrade, accepted an unwritten settlement under which Serbian knezes would collect the taxes and a Serbian national chancery would sit beside the pasha’s court. Ottoman garrisons stayed in Belgrade and other towns. The terms were close to those Karađorđe had refused in 1807.
    facts:
      - [Takovo assembly, "23 April 1815"]
      - [Battle of Ljubić, "May 1815, Serbian victory"]
      - [Battle of Dublje, "July 1815, Serbian victory"]
    markers:
      - kind: event
        side: rs
        name: Takovo
        date: 23 April 1815
        text: Miloš Obrenović raised the standard of revolt before the assembled Serbs, telling them, “Here I am, here you are. War to the Turks!”
        lonlat: [20.387, 44.043]
      - kind: battle
        side: rs
        name: Battle of Ljubić
        date: May 1815
        text: The largest battle of the rising. Imšir Pasha was killed and his army destroyed, and the rebels took Čačak.
        lonlat: [20.367, 43.914]
        lp: b
      - kind: battle
        side: rs
        name: Palež
        date: 1815
        text: The rebels drove the Ottomans from the town on the Sava, today’s Obrenovac.
        lonlat: [20.2, 44.65]
      - kind: taken
        side: rs
        name: Požarevac
        date: Summer 1815
        text: The Ottoman garrison surrendered to Miloš’s troops.
        lonlat: [21.183, 44.617]
      - kind: battle
        side: rs
        name: Battle of Dublje
        date: July 1815
        text: Miloš’s men, advancing behind wooden shields, stormed the Bosnian camp in Mačva with few losses.
        lonlat: [19.508, 44.801]
        lp: l
      - kind: treaty
        name: Belgrade
        date: Autumn 1815
        text: Miloš and Marashli Ali Pasha agreed the terms of Serbian self-government by word of mouth; the sultan’s decrees of 1816 confirmed parts of them.
        lonlat: [20.45, 44.823]
        lp: t
    arrows:
      - side: rs
        label: Miloš Obrenović
        via: [[20.39, 44.04], [20.0, 44.2], [19.85, 44.4], [19.53, 44.78]]
      - side: rs
        via: [[20.46, 44.1], [20.9, 44.05], [21.2, 44.3], [21.18, 44.58]]
    areas:
      - style: occupied
        side: rs
        label: Held by the Serbian rebels, summer 1815 (approximate)
        atoms: [RS-08, RS-09, RS-10, RS-11, RS-12, RS-13, RS-16!, RS-17, RS-18!]
  - title: Autonomy
    date: 1817–1833
    when: "1817-07-25"
    borders: "1833-12-31"
    countries: [rs, tr, ru]
    body:
      - In July 1817 Karađorđe slipped back into Serbia from Bessarabia, having joined the Greek secret society Filiki Eteria, which was planning a wider Balkan rising. Miloš, anxious to keep both the Porte’s trust and his own power, had him killed in his sleep near Velika Plana on 25 July and sent his head to Constantinople. In November an assembly proclaimed Miloš hereditary prince. The murder began a feud between the Obrenović and Karađorđević families that shaped Serbian politics until 1903. Miloš ruled autocratically from Kragujevac, steadily edging Ottoman officials out of the running of the country.
      - Russia took up the Serbian cause. The Akkerman Convention of 1826 and the Treaty of Adrianople of 1829, which ended a Russo-Turkish war, bound the Porte to grant Serbian self-government. A hatt-i sharif of 1830 recognised Miloš as hereditary prince of an autonomous principality paying a yearly tribute; Muslims living outside the garrison towns were to sell their land and leave. Another, in 1833, added six districts that had belonged to Karađorđe’s Serbia, from Krajina and Crna Reka in the east to Jadar in the west. Ottoman garrisons stayed in Belgrade and a few other fortresses until 1867, and full independence came in 1878.
    facts:
      - [Murder of Karađorđe, "25 July 1817"]
      - [Hatt-i sharif recognising Miloš as hereditary prince, "1830"]
      - [Six districts added, "1833"]
    markers:
      - kind: event
        name: Radovanje
        date: 25 July 1817
        text: Karađorđe was murdered in the woods by this village on orders passed on by Miloš Obrenović.
        lonlat: [21.022, 44.284]
      - kind: event
        side: rs
        name: Kragujevac
        date: 1818–1841
        text: Miloš Obrenović’s capital, where Serbia’s first constitution was proclaimed in February 1835.
        lonlat: [20.917, 44.01]
      - kind: held
        side: ot
        name: Belgrade
        date: until 1867
        text: An Ottoman garrison held the fortress, the last sign of the sultan’s rule in Serbia, until it withdrew in 1867.
        lonlat: [20.45, 44.823]
        lp: t
      - kind: event
        side: rs
        name: Negotin
        date: 1833
        text: Chief town of the Krajina district, one of the six districts handed to Serbia in 1833.
        lonlat: [22.531, 44.229]
    areas:
      - style: gained
        side: rs
        label: Added to the principality, 1833 (with Jadar, Paraćin and Stari Vlah)
        atoms: [RS-14, RS-15, RS-19]
