  - title: Mišar, Deligrad and Belgrade
    date: 1806–1807
    when: "1806-08-13"
    borders: "1807-07-31"
    countries: [rs, tr, ru]
    body:
      - In 1806 the Porte sent armies against the rebels from two sides. From Bosnia came sipahi cavalry and Bosnian levies, which Karađorđe met at Mišar near Šabac. From 13 to 15 August his infantry held a square earthwork on the hill against repeated charges, until the Serbian cavalry under Luka Lazarević and Miloš Obrenović struck the attackers in the flank and routed them. In the south a larger army under Ibrahim Pasha of Scutari was beaten at Deligrad on the Morava in early September and agreed to a truce. Meanwhile the envoy Petar Ičko won the Porte’s agreement to wide Serbian autonomy.
      - In December the rebels broke into the town of Belgrade, and Russia went to war with the Ottomans. Promised Russian help, Karađorđe rejected Ičko’s Peace and fought on for independence. The capture of Belgrade was followed by a massacre of its Muslim inhabitants, among them the garrison of the citadel, attacked as it left under a promise of safe conduct in early 1807; women and children were forcibly baptised. In July 1807 Russian troops joined the Serbs to beat the Ottomans at Malajnica near Negotin. The rebel state abolished the Ottoman landholders’ feudal dues.
    facts:
      - [Battle of Mišar, "13–15 August 1806, Serbian victory"]
      - [Battle of Deligrad, "September 1806, Serbian victory"]
      - [Belgrade taken, "December 1806 – early 1807"]
    markers:
      - kind: battle
        side: rs
        name: Battle of Mišar
        date: 13–15 August 1806
        text: Karađorđe’s entrenched infantry wore down the Bosnian attacks for two days before his cavalry charged; Mehmed-beg Kulenović of Zvornik was among the Ottoman commanders.
        lonlat: [19.761, 44.729]
        lp: b
      - kind: taken
        side: rs
        name: Šabac
        date: 1806–1807
        text: After Mišar the fortress on the Sava fell to the rebels.
        lonlat: [19.7, 44.75]
        lp: l
      - kind: battle
        side: rs
        name: Battle of Deligrad
        date: September 1806
        text: The Serbian lines on the Morava held against the army of Ibrahim Pasha of Scutari, which lost heavily and agreed to a six-week truce.
        lonlat: [21.579, 43.615]
      - kind: taken
        side: rs
        name: Belgrade
        date: December 1806 – early 1807
        text: Rebel volunteers seized the Sava Gate by night, and the town fell; the citadel’s garrison gave up early in 1807. Karađorđe made Belgrade his capital.
        lonlat: [20.45, 44.823]
        lp: t
      - kind: battle
        side: ru
        name: Malajnica
        date: July 1807
        text: Russian troops under General Isayev and Serbian rebels beat an Ottoman force, opening the Timok valley to the rebels.
        lonlat: [22.386, 44.295]
    arrows:
