steps:
  - title: The rising against the Dahije
    date: 1804–1805
    when: "1804-02-14"
    borders: "1805-11-30"
    countries: [rs, ro, tr]
    body:
      - In December 1801 four janissary commanders, the Dahije, murdered Hadži Mustafa Pasha, the sultan’s governor of Belgrade, and divided the pashalik between them in defiance of Selim III. Their rule brought heavy taxes, forced labour and violence. Fearing that the sultan would use the Serbs against them, in January and February 1804 they killed between 70 and 150 village headmen (knezes), priests and traders, the “Slaughter of the Knezes”. On 14 February the survivors met at Orašac in Šumadija and chose Đorđe Petrović, a livestock trader and former Habsburg Free Corps soldier known as Karađorđe (“Black George”), to lead a rising.
      - Claiming at first to fight for the sultan against the renegades, the rebels took Šumadija, Požarevac and Šabac within months, leaving the Dahije only Belgrade. The four fled down the Danube to the island of Ada Kaleh, where Milenko Stojković’s men caught and beheaded them in August. But the Serbs, meeting at Ostružnica, would not disarm without guarantees and sought Russian and Austrian protection. In 1805 Selim ordered Hafiz Pasha of Niš to crush them. On 18 August Stojković and Karađorđe beat his army at Ivankovac, the first Serbian victory over regular Ottoman troops, and in November the rebels took Smederevo, their first capital.
    facts:
      - [Orašac assembly, "14 February 1804"]
      - [Battle of Ivankovac, "18 August 1805, Serbian victory"]
      - [Smederevo taken, "November 1805"]
    markers:
      - kind: event
        side: rs
        name: Orašac
        date: 14 February 1804
        text: Serbian leaders who had escaped the Slaughter of the Knezes met in a gully by the village and elected Karađorđe to lead the rising.
        lonlat: [20.585, 44.329]
      - kind: event
        side: rs
        name: Ostružnica
        date: May 1804
        text: An assembly of rebel leaders resolved to fight on and to ask Russia and Austria for protection.
        lonlat: [20.318, 44.724]
        lp: l
      - kind: event
        side: rs
        name: Ada Kaleh
        date: August 1804
        text: The four Dahije had fled to this Danube island, now drowned by the Iron Gate dam. Rebels under Milenko Stojković caught and beheaded them.
        lonlat: [22.456, 44.716]
      - kind: taken
        side: rs
        name: Požarevac
        date: 1804
        text: One of the first towns the rebels took from the janissaries.
        lonlat: [21.183, 44.617]
      - kind: taken
        side: rs
        name: Šabac
        date: 1804
        text: The rebels took the town on the Sava; its fortress held out until after Mišar.
        lonlat: [19.7, 44.75]
        lp: l
      - kind: held
        side: ot
        name: Belgrade
        date: 1804–1806
        text: The janissaries, and from the summer of 1804 the sultan’s governor Bekir Pasha, kept the town and fortress while the rebels held the countryside.
        lonlat: [20.45, 44.823]
        lp: t
      - kind: battle
        side: rs
        name: Battle of Ivankovac
        date: 18 August 1805
        text: Serbs dug in behind earthworks near Ćuprija held off Hafiz Pasha’s army from Niš until Karađorđe arrived with guns and reinforcements. The wounded pasha died after the retreat.
        lonlat: [21.435, 43.974]
      - kind: taken
        side: rs
        name: Smederevo
        date: November 1805
        text: The Danube fortress fell to the rebels and became the seat of their government.
        lonlat: [20.928, 44.669]
    arrows:
