id: serbian-revolution
name: Serbian Revolution
start: "1804-02-14"
end: "1833"
tier: A
summary: Two risings of the Serbs of the Pashalik of Belgrade against Ottoman rule. The First Serbian Uprising under Karađorđe (1804–1813) began against renegade janissaries, won battles at Ivankovac, Mišar and Deligrad and built a de facto independent state, but collapsed when Russia made peace in 1812; the Second Uprising under Miloš Obrenović (1815) won self-government, recognised by the sultan’s decrees of 1830 and 1833 as an autonomous Principality of Serbia.
countries: [rs, tr, ru, ro, bg]
sides:
  - id: rs
    name: Serbian rebels, later the Principality of Serbia
    polities: [serbia]
    ink: red
    moves: Serbian moves
    success: Serbian success
  - id: ru
    name: Russian Empire
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
  - id: ot
    name: Ottoman Empire and the Dahije
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Dates are New Style (Gregorian). The Serbs used the Julian calendar, then 12 days behind, so Serbian accounts date the Orašac assembly 2 February 1804 and the Takovo rising 11 April 1815. Some battle dates are given in either style in the literature; uncertain ones are given here only by month.
  - The Russo-Turkish War of 1806–1812, in which Russian troops fought beside the rebels, has its own entry. Numbers of fighters, dead and refugees come from contemporary and national accounts and are often uncertain.
  - The term “Serbian Revolution” was coined by the German historian Leopold von Ranke in 1829. Here it covers the two risings and the road to recognised autonomy in 1830–1833.
