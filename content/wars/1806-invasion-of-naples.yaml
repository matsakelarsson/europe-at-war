steps:
  - title: Campo Tenese, Gaeta and Maida
    date: February – November 1806
    when: "1806-02-08"
    borders: "1806-07-18"
    countries: [it, fr, gb]
    body:
      - In 1805 Ferdinand IV of Naples promised Napoleon to stay neutral, and then let some 20,000 British and Russian troops land at Naples. After Austerlitz the Russians sailed away and the British withdrew to Sicily, and on 27 December Napoleon declared that the Bourbon dynasty of Naples had ceased to reign. On 8 February 1806 a French army of more than 40,000 men under Marshal Masséna crossed the border. Ferdinand had already left for Palermo. Masséna entered Naples on 14 February, and on 9 March General Reynier routed the remains of the Neapolitan army in driving snow at Campo Tenese in the Calabrian mountains. Napoleon proclaimed his brother Joseph king of Naples on 30 March. But the fortress of Gaeta, under the hard-drinking Prince Louis of Hesse-Philippsthal, refused to surrender, and in Calabria, plunder and rape by French troops set off a peasant rising.
      - On 1 July a British force of about 5,200 men under General John Stuart landed in the Gulf of Sant’Eufemia, and on 4 July it beat Reynier’s slightly larger force on the plain below Maida, with heavy French losses. But on 18 July Gaeta, its commander wounded and its walls breached, surrendered after a siege of nearly five months, freeing some 10,000 French troops. Stuart’s men took the French posts on the coast and went back to Sicily, leaving garrisons at Reggio and Scilla that held out until 1808. The French burned villages that resisted, and the guerrillas tortured and killed prisoners. On 8 August Masséna stormed Lauria, a guerrilla stronghold, and gave no quarter. The guerrilla leader Michele Pezza, known as Fra Diavolo, was caught and hanged in Naples in November 1806.
    facts:
      - [French enter Naples, "14 February 1806"]
      - [Battle of Maida, "4 July 1806, British victory"]
      - [Gaeta surrenders, "18 July 1806"]
