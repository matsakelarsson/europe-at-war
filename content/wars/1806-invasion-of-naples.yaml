id: invasion-of-naples
name: French invasion of Naples
start: "1806-02-08"
end: "1806-11"
tier: B
summary: The French conquest of the mainland Kingdom of Naples in 1806, after King Ferdinand IV had broken his neutrality and let British and Russian troops land. Marshal Masséna’s army took Naples in February and crushed the Neapolitan army at Campo Tenese, and Napoleon’s brother Joseph became king. Gaeta held out until July, a British force won at Maida, and a savage peasant war in Calabria went on for years, but Ferdinand kept only Sicily.
countries: [it, fr, gb]
