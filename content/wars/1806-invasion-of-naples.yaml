  - id: fr
    name: France
    polities: [france]
    ink: navy
    moves: French moves
    success: French success
  - id: bn
    name: Bourbon Naples and Britain
    polities: [naples, sicily, united-kingdom]
    ink: red
    moves: Neapolitan and British moves
    success: Neapolitan and British success
notes:
  - Part of the War of the Third Coalition, told with the Napoleonic Wars. Ferdinand ruled Naples and Sicily as two kingdoms until 1816; the map keeps the Kingdom of Naples as one polity under its Bourbon and then its Napoleonic kings.
  - The guerrilla war in Calabria lasted until about 1811. Atrocities on both sides were common, and numbers of dead are unknown.
