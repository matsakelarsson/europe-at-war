        side: fr
        name: Naples
        date: 14 February 1806
        text: Masséna’s troops entered the city without a fight, and Joseph made his entry the next day. Ferdinand had left behind some 200 cannon and large stores of powder.
        lonlat: [14.25, 40.85]
      - kind: siege
        side: fr
        name: Gaeta
        date: 26 February – 18 July 1806
        text: Hesse shouted to the besiegers that Gaeta was not Ulm. The garrison, supplied by sea, held out until heavy French guns breached the walls, and was allowed to sail to Sicily.
        lonlat: [13.57, 41.21]
        lp: l
      - kind: battle
        side: fr
        name: Battle of Campo Tenese
        date: 9 March 1806
        text: French light infantry climbed the cliffs on the Neapolitan flank. Some 2,000 Neapolitans were captured, and the army broke up.
        lonlat: [16.06, 39.875]
      - kind: battle
        side: bn
        name: Battle of Maida
        date: 4 July 1806
        text: Stuart’s infantry, in lines two deep, broke Reynier’s attack. The victory gave its name to Maida Vale in London.
        lonlat: [16.3, 38.87]
      - kind: taken
        side: fr
        name: Lauria
        date: 8 August 1806
        text: The guerrilla bands that had gathered here were almost wiped out in a fight without quarter, and the town was sacked.
        lonlat: [15.836, 40.047]
      - kind: held
        side: bn
        name: Scilla and Reggio
        date: July 1806 – February 1808
        text: Taken from the French in July 1806, these two places on the Strait of Messina were held by British garrisons for a year and a half.
        lonlat: [15.716, 38.254]
        lp: l
