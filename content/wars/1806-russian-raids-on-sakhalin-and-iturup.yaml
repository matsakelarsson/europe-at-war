id: russian-raids-on-sakhalin-and-iturup
name: Russian raids on Sakhalin and Iturup
start: "1806-10"
end: "1813"
tier: C
summary: "Raids by two Russian naval officers in the service of the Russian-American Company on Japanese posts in Sakhalin, the Kurils and northern Ezo in 1806–1807, known in Japan as the Bunka Russian incursion (Bunka rokō), and the capture of the Russian captain Vasily Golovnin that followed in 1811–1813. In 1804–1805 the envoy Nikolai Rezanov waited six months at Nagasaki for permission to open trade, and the shogunate refused. On his way back he ordered Lieutenant Nikolai Khvostov to strike at the Japanese in the north, then tried to take the order back. In October 1806 Khvostov in the Yunona landed at Kushunkotan on Aniva Bay in southern Sakhalin, seized four guards, carried off rice and burned the post. In 1807 he returned with Midshipman Gavriil Davydov in the Yunona and the Avos, looted and burned Naibo on Iturup (Etorofu), and in June drove off some 200–300 shogunate, Nanbu and Tsugaru men from Shana, Iturup’s main post; the officer Toda Matadayū killed himself during the retreat, and the young surveyor Mamiya Rinzō was among the defenders. The raiders burned ships and stores on Rishiri and Rebun and left a letter threatening more attacks if Japan refused trade. In Okhotsk Khvostov and Davydov were arrested for acting without the emperor’s authority, but the shogunate, which had taken all of Ezo under its direct rule in 1807, mobilised about 3,000 men from the northern domains and ordered Russian ships driven away. In July 1811 the garrison of Kunashir seized Golovnin of the sloop Diana, who had come ashore for supplies, and held him and seven companions in Hakodate and Matsumae. His deputy Pyotr Rikord took the Japanese merchant Takadaya Kahei hostage in 1812; Takadaya helped arrange an exchange, and once Russian officials had assured the Japanese in writing that Khvostov had acted without authority, Golovnin and his men were released at Hakodate in the autumn of 1813."
