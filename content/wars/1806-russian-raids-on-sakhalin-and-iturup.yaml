notes:
  - The Japanese records date the raids by the lunar calendar; the Gregorian dates here are those of the converted Japanese accounts, and some English accounts give the lunar month and day as if they were Gregorian.
  - Whether Rezanov meant his order to be carried out is disputed; he sent Khvostov a second, ambiguous instruction, and the Russian government later disowned the raids.
  - Golovnin’s account of his captivity, published in 1816, was one of the first detailed descriptions of Japan by a European in the Edo period and was translated into several languages.
