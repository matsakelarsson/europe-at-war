notes:
  - Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so the Treaty of Bucharest is dated 16 May 1812 in Russian sources. Some dates of the Danube campaigns are given in either style in the literature; uncertain ones are given here only by month.
  - The Serbian rising of 1804–1813 under Karađorđe is a war of its own; it appears here only where it joined the Russian war.
