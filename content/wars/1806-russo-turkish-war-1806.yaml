id: russo-turkish-war-1806
name: Russo-Turkish War of 1806–1812
start: "1806"
end: "1812-05-28"
tier: B
summary: A war between the Russian Empire and the Ottoman Empire, fought mainly on the lower Danube, at sea in the Aegean and in the Caucasus, in which Russia occupied Moldavia and Wallachia. Kutuzov’s victory at Ruse and Slobozia in 1811 led to the Treaty of Bucharest, signed weeks before Napoleon’s invasion of Russia, which gave Russia Bessarabia, the land between the Prut and the Dniester.
