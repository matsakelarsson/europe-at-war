  - title: Kutuzov and the Treaty of Bucharest
    date: 1810–1812
    when: "1810"
    borders: "1812-05-28"
    countries: [bg, ro, md, ua, ge, tr, ru]
    body:
      - In 1810 General Nikolay Kamensky crossed into Bulgaria and took Silistra, but his assaults on Shumla and Ruse failed with heavy losses. After he routed an Ottoman force at Batin in September, Ruse surrendered. In the Caucasus Russian forces took Sukhum on the Abkhazian coast, and Russia deposed King Solomon II of Imereti and annexed his kingdom. Kamensky fell ill and died early in 1811. With war against Napoleon looming, Alexander I gave the command to Mikhail Kutuzov and told him to make peace quickly.
      - Kutuzov beat the grand vizier, Ahmed Pasha, outside Ruse on 4 July 1811, then gave up the fortress and drew back across the Danube. When some 36,000 Ottoman troops followed him over the river, a Russian force crossed behind them, took their camp and cut them off at Slobozia. Hungry and sick, the survivors surrendered at the end of the year. By the Treaty of Bucharest, signed on 28 May 1812, Russia handed back Wallachia, western Moldavia and its gains in the Caucasus except Sukhum, but kept the eastern half of Moldavia, which it named Bessarabia. The Serbs were promised self-government, but in 1813 Ottoman forces reconquered Serbia.
    facts:
      - [Battle of Ruse, "4 July 1811, Russian victory"]
      - [Slobozia, "Ottoman army trapped and starved into surrender, autumn 1811"]
      - [Treaty of Bucharest, "28 May 1812, Bessarabia to Russia"]
