steps:
  - title: Into the Principalities and the Dardanelles
    date: 1806–1809
    when: "1806-11"
    borders: "1807-07-01"
    countries: [ro, md, ua, rs, tr, gr, am, ru]
    body:
      - In August 1806 Sultan Selim III, encouraged by France after Napoleon’s victory at Austerlitz, deposed the pro-Russian princes of Moldavia and Wallachia. In November a Russian army under General Ivan Michelson crossed the Dniester, took Khotyn and Bender and occupied both principalities, and in December the Ottomans declared war. In Serbia, where rebels led by Karađorđe had been fighting Ottoman forces since 1804, Russia found an ally. The rebels took Belgrade that winter, and Russian troops fought beside them from 1807.
      - In June 1807 a small Russian force under Mikhail Miloradovich stopped an Ottoman army marching on Bucharest at Obilești, and in the Caucasus Count Ivan Gudovich routed a much larger Ottoman army on the Arpachay. At sea, Vice-Admiral Dmitry Senyavin’s squadron blockaded the Dardanelles and beat the Ottoman fleet off the straits in May and near Mount Athos in July. After making peace with Napoleon at Tilsit, Russia agreed to an armistice in August 1807. When fighting resumed in 1809, Prince Pyotr Bagration took Izmail but failed before Silistra.
    facts:
      - [Russian occupation of Moldavia and Wallachia, "from November 1806"]
      - [Battle of Athos, "1–2 July 1807, Russian victory"]
      - [Armistice of Slobozia, "August 1807 – 1809"]
