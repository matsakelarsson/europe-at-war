id: vellore-mutiny
name: Vellore Mutiny
start: "1806-07-10"
end: "1806-07-10"
tier: C
summary: "A rising of Indian sepoys of the Madras army in the fortress of Vellore, where the family of Tipu Sultan had been held since 1799. In November 1805 new regulations forbade Hindu soldiers to wear caste marks on duty, told Muslims to trim their beards, and introduced a new round turban with a leather cockade, which many saw as an attack on their religion and a step towards forced conversion. Protests were punished with floggings and dismissals. In the early hours of 10 July 1806 men of the 1st and 23rd Madras Native Infantry rose, killed or wounded about 200 soldiers of the British 69th Foot and many of their own officers, and raised the flag of Mysore over the fort, in the name of one of Tipu’s sons. Colonel Robert Gillespie rode in from Arcot, about 25 km away, with the 19th Light Dragoons and galloper guns, blew open the gate and retook the fort within hours. About 350 sepoys were killed, some 100 were executed on the spot and more after courts martial. The regulations were withdrawn, Tipu’s family was moved to Calcutta, and the Governor of Madras, Lord William Bentinck, and the commander-in-chief, Sir John Cradock, were recalled. It is also called the Vellore Revolt or Vellore Rebellion, and is often remembered as a forerunner of the rising of 1857."
