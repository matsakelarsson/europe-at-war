id: anglo-turkish-war
name: Anglo-Turkish War of 1807–1809
start: "1807-02-19"
end: "1809-01-05"
tier: C
summary: A war between Britain and the Ottoman Empire during the Napoleonic Wars, after Sultan Selim III, encouraged by the French ambassador Horace Sébastiani, drew closer to France and went to war with Russia. In February 1807 a British squadron under Vice-Admiral Sir John Duckworth forced the Dardanelles and anchored off Constantinople, but withdrew under fire from strengthened batteries; in March a British force of about 6,000 men landed at Alexandria, but after defeats at Rosetta by the troops of Muhammad Ali it left Egypt in September. The Treaty of the Dardanelles of 5 January 1809 restored peace.
