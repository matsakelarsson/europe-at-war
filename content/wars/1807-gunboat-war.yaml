id: gunboat-war
name: Gunboat War
start: "1807-08-16"
end: "1814-01-14"
tier: A
summary: A naval war between Denmark–Norway and Britain, begun by the British seizure of the Danish fleet at Copenhagen in 1807 and fought with gunboats, privateers and blockade until the Treaty of Kiel in 1814. It cut Norway off from Denmark, brought famine to Norway and ended with Norway ceded to the king of Sweden.
