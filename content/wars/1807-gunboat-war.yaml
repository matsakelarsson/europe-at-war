    name: Denmark–Norway
    polities: [denmark-norway, danish-duchies]
    ink: red
    moves: Danish–Norwegian moves
    success: Danish–Norwegian success
  - id: gb
    name: Britain
    polities: [united-kingdom]
    ink: navy
    moves: British moves
    success: British success
  - id: se
    name: Sweden and its allies
    polities: [sweden]
    ink: blue
    moves: Swedish and allied moves
    success: Swedish and allied success
notes:
  - Dates are New Style.
  - In Denmark and Norway the years 1801–1814 are called the English Wars (Englandskrigene); the Gunboat War is their second, longer part.
