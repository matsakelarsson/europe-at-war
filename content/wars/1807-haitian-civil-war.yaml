id: haitian-civil-war
name: Haitian civil war (1807–1820)
start: "1807-01-01"
end: "1820-10"
tier: C
summary: "The war between the north and the south of Haiti after the assassination of Emperor Jean-Jacques Dessalines on 17 October 1806. The constitution drawn up in Port-au-Prince in December 1806 left the elected president, Henri Christophe, with little power and the Senate, led by Alexandre Pétion and the officers of colour of the West and South, with most of it. Christophe marched on Port-au-Prince and beat Pétion at Sibert on 1 January 1807 but could not take the city; he then made the north and the Artibonite a separate State of Haiti, which he proclaimed a kingdom with himself as King Henri I in March 1811, while the Senate made Pétion president of the Republic of Haiti in the West and South. Christophe besieged Port-au-Prince again in 1812 without success, André Rigaud set up a breakaway state in the South in 1810–1812, and in the mountains of the Grand’Anse an insurgent leader called Goman held out against the republic from 1807 to 1820. After 1812 the war settled into a standoff along a front near Saint-Marc. Christophe ruled by forced plantation labour and built the Citadelle Laferrière and the palace of Sans-Souci; Pétion divided state land among soldiers and peasants and gave help to Simón Bolívar in 1815–1816. Pétion died in 1818 and was succeeded by Jean-Pierre Boyer, who crushed Goman in 1820. When Christophe, partly paralysed by a stroke, faced mutinies in his army, he shot himself on 8 October 1820, and in October Boyer reunited Haiti."
