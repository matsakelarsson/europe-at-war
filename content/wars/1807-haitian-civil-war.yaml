notes:
  - "Haitian historians of the 19th century, most of them from the south, long described Christophe as a tyrant and Pétion as a liberal; later historians also stress the colour divide between the mostly Black leaders of the north and the officers of colour who dominated the south, and Christophe’s attempt to rebuild the export economy."
