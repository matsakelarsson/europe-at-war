  - title: Into France
    date: October 1813 – April 1814
    when: "1813-10-07"
    borders: "1814-04-17"
    countries: [fr, es, pt, gb]
    body:
      - On 7 October Wellington crossed the Bidasoa into France, and on 31 October the starving French garrison of Pamplona surrendered. Soult was driven from his lines on the Nivelle on 10 November and from those south of Bayonne on the Nive in December. Napoleon, losing in Germany, released Ferdinand VII by the Treaty of Valençay in December, hoping to make peace with Spain, but the Regency refused to ratify it. In February 1814 Wellington left a corps to besiege Bayonne and pushed east, beating Soult at Orthez on 27 February, and on 12 March a British force entered Bordeaux, whose mayor declared for Louis XVIII.
      - Soult made his last stand at Toulouse. On 10 April Wellington took the heights east of the city after a bloody fight, and Soult withdrew. Napoleon had already abdicated on 6 April, but the news reached the armies only on 12 April. Two days later the garrison of Bayonne made a sortie that cost both sides hundreds of men. Soult accepted an armistice on 17 April. Ferdinand came back to Spain in March and on 4 May annulled the constitution of Cádiz, restored absolute rule and had the leading liberals arrested.
    facts:
      - [Battle of the Nivelle, "10 November 1813, allied victory"]
      - [Battle of Orthez, "27 February 1814, allied victory"]
      - [Battle of Toulouse, "10 April 1814"]
    markers:
      - kind: battle
        side: gb
        name: Battle of the Bidasoa
        date: 7 October 1813
        text: Wellington’s army forded the river near its mouth at low tide and took the French positions on the heights beyond, setting foot on French soil.
        lonlat: [-1.77, 43.36]
        lp: l
      - kind: taken
        side: es
        name: Pamplona
        date: 31 October 1813
        text: A Spanish army had blockaded the city since June. Its French garrison surrendered when its food ran out.
        lonlat: [-1.645, 42.817]
      - kind: battle
        side: gb
        name: Battle of the Nivelle
        date: 10 November 1813
        text: The allies broke through Soult’s fortified line between the mountains and the sea.
        lonlat: [-1.6, 43.36]
        lp: b
      - kind: battle
        side: gb
        name: Battle of Orthez
        date: 27 February 1814
        text: Soult’s centre and left gave way, and his retreat ended in a rush in which many French soldiers were captured.
        lonlat: [-0.77, 43.49]
      - kind: battle
        name: Battle of Toulouse
        date: 10 April 1814
        text: Fought four days after Napoleon’s abdication. The allies lost almost 3,000 more men than the French, but Soult left the city to them.
        lonlat: [1.444, 43.604]
      - kind: siege
        side: gb
