  - title: Vitoria and San Sebastián
    date: May – September 1813
    when: "1813-05-22"
    borders: "1813-09-08"
    countries: [es, pt, gb, fr]
    body:
      - In the spring of 1813 Napoleon, rebuilding his armies after Russia, drew men out of Spain. On 22 May Wellington, now commanding Spanish as well as British and Portuguese troops, advanced again. While he marched on Salamanca, the left wing under Sir Thomas Graham crossed the mountains of Trás-os-Montes, and the allies turned the French out of every line they tried to hold. On 21 June they caught King Joseph’s armies at Vitoria and broke them. The French lost 151 of their guns and their whole baggage train, “the loot of a kingdom”, which many British soldiers stopped to plunder instead of pursuing.
      - The French fell back over the Pyrenees, leaving garrisons in San Sebastián and Pamplona. At the end of July Marshal Soult, sent to restore the situation, struck through the passes of Maya and Roncesvalles to relieve Pamplona, but was beaten back at Sorauren on 28 and 30 July. On 31 August, the day Spanish troops beat off a last French relief attempt at San Marcial, the British and Portuguese stormed San Sebastián. They then sacked and burned the town, killing perhaps 1,000 of its people. The castle held out until 8 September.
    facts:
      - [Battle of Vitoria, "21 June 1813, allied victory"]
      - [Battle of Sorauren, "28 and 30 July 1813, allied victory"]
      - [San Sebastián stormed, "31 August 1813"]
    markers:
      - kind: battle
        side: gb
        name: Battle of Vitoria
        date: 21 June 1813
        text: The allies attacked in four columns across the Zadorra. Joseph barely escaped, and the French lost some 8,000 men and almost all their artillery.
        lonlat: [-2.67, 42.85]
      - kind: battle
        side: gb
        name: Battle of Sorauren
        date: 28 and 30 July 1813
        text: The French attacked uphill against Wellington’s position on the Oricain ridge, a few miles from Pamplona, and failed.
        lonlat: [-1.6, 42.87]
        lp: l
      - kind: siege
        side: gb
        name: San Sebastián
        date: 7 July – 8 September 1813
        text: The breach was stormed at low tide. In the sack that followed almost the whole town burned.
        lonlat: [-1.984, 43.318]
      - kind: battle
        side: es
        name: Battle of San Marcial
        date: 31 August 1813
        text: Spanish troops under General Freire threw back Soult’s last attempt to relieve San Sebastián.
        lonlat: [-1.77, 43.33]
        lp: t
