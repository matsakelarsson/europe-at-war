steps:
  - title: Portugal occupied and Madrid rises
    date: October 1807 – May 1808
    when: "1807-10-27"
    borders: "1808-05-02"
    countries: [pt, es, fr]
    body:
      - Portugal, Britain’s oldest ally, would not join Napoleon’s blockade of British trade. On 27 October 1807, by the secret Treaty of Fontainebleau, France and Spain agreed to conquer it and divide it into three parts, one of them a principality for Charles IV’s chief minister, Manuel Godoy. General Junot marched across Spain and invaded Portugal on 19 November with three Spanish divisions in support. The Portuguese did not resist. On 29 November the Prince Regent John, his mentally ill mother, Queen Maria, and much of the court sailed for Brazil under British escort, and the next day Junot’s exhausted advance guard entered Lisbon.
      - Meanwhile French troops poured into Spain, Napoleon’s ally, and in February and March 1808 seized the frontier fortresses of Pamplona, Barcelona, Figueres and San Sebastián by trickery. On 17–19 March a riot at the palace of Aranjuez toppled Godoy and forced Charles IV to abdicate in favour of his son Ferdinand VII. Napoleon summoned both to Bayonne, where in early May he made them give up the crown, which he handed to his brother Joseph. On 2 May, as the last members of the royal family were being taken from Madrid, the people of the city rose against Marshal Murat’s troops. The rising was crushed, and through the night and the next day the French shot hundreds of prisoners.
    facts:
      - [Treaty of Fontainebleau, "27 October 1807"]
      - [Lisbon occupied, "30 November 1807"]
      - [Dos de Mayo, "2–3 May 1808"]
    markers:
      - kind: taken
        side: fr
        name: Lisbon
        date: 30 November 1807
        text: Junot arrived to see the Portuguese fleet, with the court, the treasury and thousands of courtiers aboard, sailing away down the Tagus.
        lonlat: [-9.14, 38.72]
      - kind: event
        name: Tumult of Aranjuez
        date: 17–19 March 1808
        text: Soldiers and townspeople, stirred up by Ferdinand’s supporters, stormed Godoy’s house. Charles IV abdicated two days later.
        lonlat: [-3.6, 40.03]
        lp: b
      - kind: event
        name: Abdications of Bayonne
        date: 5–7 May 1808
        text: At the château of Marracq both Spanish kings renounced the throne in Napoleon’s favour. They spent the war as his prisoners in France.
        lonlat: [-1.475, 43.49]
      - kind: event
        side: es
        name: Dos de Mayo
        date: 2–3 May 1808
        text: Townspeople fought the French in the streets, and two artillery officers, Daoíz and Velarde, died defending the Monteleón barracks. Goya painted the executions of the third of May in 1814.
        lonlat: [-3.7, 40.42]
      - kind: taken
        side: fr
        name: Pamplona and Barcelona
        date: February 1808
        text: French troops took over the citadels of Pamplona and Barcelona by ruse, while still officially Spain’s allies.
        lonlat: [-1.645, 42.817]
    arrows:
      - side: fr
        label: Junot
        via: [[-6.6, 40.6], [-7.5, 39.8], [-8.4, 39.4], [-9.1, 38.75]]
      - side: fr
