id: peninsular-war
name: Peninsular War
start: "1807-10-27"
end: "1814-04-17"
tier: A
summary: The war for the Iberian Peninsula between Napoleonic France and the allied armies of Spain, Portugal and Britain. It began with the French occupation of Portugal in 1807 and grew into a national war in Spain when Napoleon put his brother Joseph on the Spanish throne in 1808. Spanish armies, guerrillas and sieges tied down hundreds of thousands of French troops, while Wellington’s British and Portuguese army, safe behind the Lines of Torres Vedras, wore the French down and then drove them out of Spain, winning at Salamanca in 1812 and Vitoria in 1813 and ending the war at Toulouse in April 1814.
countries: [es, pt, fr, gb]
sides:
  - id: fr
    name: France
    polities: [france]
    ink: navy
    moves: French moves
    success: French success
  - id: es
    name: Spain
    polities: [spain]
    ink: gold
    moves: Spanish moves
    success: Spanish success
  - id: gb
    name: Britain and Portugal
    polities: [united-kingdom, portugal]
    ink: red
    moves: British and Portuguese moves
    success: British and Portuguese success
notes:
  - In Spain the war is called the War of Independence (Guerra de la Independencia), in Portugal the French Invasions, and in Catalonia the War of the French. The wider Napoleonic Wars are told separately.
  - The Spain side stands for the patriot juntas, the Regency and the Cortes that fought in Ferdinand VII’s name. Joseph Bonaparte’s Kingdom of Spain, recognised only by France and its allies, is counted with France.
  - The war killed hundreds of thousands of soldiers and civilians, through battle, sieges, reprisals, famine and disease. Estimates vary widely.
