        side: fr
        label: Annexed to France, 1812–1814
        atoms: [ES-B, ES-GI, ES-L, ES-T]
  - title: Salamanca and Madrid
    date: March – November 1812
    when: "1812-03-19"
    borders: "1812-11-19"
    countries: [es, pt, gb, fr]
    body:
      - On 19 March 1812 the Cortes at Cádiz proclaimed a constitution, nicknamed “La Pepa” after the feast of St Joseph. It declared the sovereignty of the nation, divided the powers of government, freed the press and gave the vote to most men, though it kept Catholicism as the only lawful religion. In the summer, with Napoleon’s best troops gone to Russia, Wellington advanced into León. At the Arapiles south of Salamanca on 22 July he caught Marshal Marmont’s army strung out on the march and broke it in a few hours, the victory that made his reputation as an attacking general.
      - Joseph fled Madrid, and Wellington entered the capital on 12 August to wild celebrations. The French gave up the siege of Cádiz on 24 August and evacuated Andalusia. But Wellington then failed to take the castle of Burgos in a month-long siege, and with French armies converging on him from north and south he had to abandon Madrid and retreat to the Portuguese border in November. The retreat in the autumn rain cost him thousands of men. Still, the year had cleared the French from southern Spain for good.
    facts:
      - [Constitution of Cádiz, "19 March 1812"]
      - [Battle of Salamanca, "22 July 1812, Anglo-Portuguese victory"]
      - [Siege of Burgos, "19 September – 21 October 1812, failed"]
    markers:
      - kind: event
        side: es
        name: Constitution of Cádiz
        date: 19 March 1812
        text: One of the most liberal constitutions of its time, and a model for liberals across Europe and Latin America.
        lonlat: [-6.29, 36.53]
      - kind: battle
        side: gb
        name: Battle of Salamanca
        date: 22 July 1812
        text: Known in Spain and France as the Battle of the Arapiles, after two hills on the battlefield. Marmont was wounded early in the battle.
        lonlat: [-5.64, 40.9]
      - kind: taken
        side: gb
        name: Madrid
        date: 12 August 1812
        text: The allies were greeted with flowers and cheering crowds. They held the city for less than three months.
        lonlat: [-3.7, 40.42]
      - kind: siege
        side: fr
        name: Burgos
        date: 19 September – 21 October 1812
        text: General Dubreton’s small garrison beat off every assault on the castle. Wellington lacked heavy guns.
        lonlat: [-3.7, 42.34]
    arrows:
      - side: gb
        label: Wellington
        phase: 1
