    body:
      - After the Peace of Tilsit, Russia, now Napoleon’s ally, invaded Finland on 21 February 1808 to force Sweden into his blockade of Britain. The Swedish army fell back north, and in May the great sea fortress of Sveaborg outside Helsingfors surrendered after a short siege. Its commander, Carl Olof Cronstedt, was branded a traitor.
      - In the north the Swedish-Finnish army struck back, winning at Siikajoki and Revolax in April and at Lapua in July, but on 14 September 1808 the Russians won the war’s bloodiest battle at Oravais. Denmark–Norway had also declared war on Sweden in March. On the Norwegian border the Swedes won at Lier in April but lost at Prestebakke in June.
    facts:
