id: finnish-war
name: Finnish War
start: "1808"
end: "1809"
tier: B
summary: A war in which Russia, then allied with Napoleon, conquered Finland from Sweden, while Denmark–Norway attacked Sweden from the west. By the Treaty of Fredrikshamn in 1809 Sweden lost Finland and Åland, which became a grand duchy under the Russian tsar.
