  - title: Finland lost
    date: "1809"
    when: "1809"
    borders: "1809"
    countries:
      - se
      - dk
      - no
      - fi
      - ru
    view:
      center:
        - 21.2803
        - 62.7752
      size:
        - 715
        - 842
    body:
      - "In March 1809 Russian armies crossed the frozen Gulf of Bothnia: to Åland, across the Kvarken to Umeå under Barclay de Tolly, and around the north of the gulf at Torneå. In Stockholm, officers overthrew Gustav IV Adolf on 7 March, and his uncle became king as Charles XIII."
      - A last Swedish counterstroke landed at Ratan north of Umeå, but after hard fighting at Sävar and Ratan on 19–20 August, the last battles fought in Sweden, the Swedes withdrew. By the Treaty of Fredrikshamn on 17 September 1809 Sweden gave up all of Finland and Åland, about a third of its territory. Peace with Denmark followed at Jönköping in December.
    facts:
      - - Treaty of Fredrikshamn
        - 17 September 1809
      - - Lost
        - Finland, Åland and the land east of the Torne river
