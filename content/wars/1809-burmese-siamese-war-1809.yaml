notes:
  - "The course of the war is known mainly from the Thai chronicles of the Second Reign and Burmese records; dates for the later Burmese expeditions of 1810–1811 are less certain. Burmese losses over the whole war are given as more than 10,000 men and 40 war boats."
  - "Kedah was then a Siamese tributary and kept a Siamese garrison at Alor Setar; the Burmese tried to win over its sultan, Ahmad Tajuddin Halim Shah II, who answered that they should defeat the Siamese first."
