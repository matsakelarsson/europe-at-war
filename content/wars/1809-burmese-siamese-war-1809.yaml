id: burmese-siamese-war-1809
name: Burmese–Siamese War (1809–1812)
start: "1809-06"
end: "1812-01"
tier: C
summary: "The last Burmese invasion of Siam, fought over Phuket island, known as Thalang or Junkceylon, and the tin-rich Andaman coast. In 1809, as King Rama I lay dying (he died in September), Bodawpaya’s commander at Tavoy, the Atwinwun, sent a fleet down the coast: Takua Pa surrendered without a fight, the Burmese crossed from the mainland to Phuket in November 1809 and besieged Thalang, and another army crossed the hills and took Chumphon. The Thalang garrison beat off an assault on the night of 18 November, while the new king, Rama II, sent armies south under his brother, the Front Palace prince Maha Senanurak. The Siamese retook Chumphon in January 1810 and drove that army back towards Takua Pa, but a renewed Burmese assault took Thalang on 13 January 1810; the town was plundered and burnt to the ground and its people fled to the mainland. In March 1810 a Siamese and Malay fleet from Trang and Pak Phra, with the navy of Kedah, whose sultan was compelled to send it, moved against Phuket, and the Burmese abandoned the island. Later Burmese expeditions in May 1810 and at the end of 1811 were wrecked by the monsoon or ran out of supplies, and the war was over by January 1812. Phuket and much of the southern coast were left depopulated for decades; when Burma lost Tenasserim to the British in 1826, the base for these invasions was gone."
