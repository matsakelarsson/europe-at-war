notes:
  - The British name for the coast, the “Pirate Coast”, and for the Qawasim (“Joasmees”) come from the Company’s records, which are the main written sources. Sultan bin Muhammad Al Qasimi’s The Myth of Arab Piracy in the Gulf (1986) argues from the same archives that many of the charges were exaggerated or false.
  - Casualty figures for the Arab side are British estimates.
