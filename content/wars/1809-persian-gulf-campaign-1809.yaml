  - title: Ras al-Khaimah and the treaty of 1820
    date: December 1819 – March 1820
    when: "1819-12-09"
    borders: "1820-03-01"
    countries: [ae, om, ir, bh]
    body:
      - Attacks on shipping went on after 1812, and once the Egyptian conquest of Diriyah in 1818 had removed the Qawasim’s Saudi allies, Bombay sent a far larger force. Major-General Sir William Keir Grant sailed in November 1819 with about 3,000 troops, some 1,645 European soldiers and marines and 1,424 Indian sepoys, supported by HMS Liverpool, the Company’s cruisers and 600 men and two ships from Muscat. The troops landed south of Ras al-Khaimah on 2–3 December, built batteries, and after several days of bombardment took the town on 9 December. The Qawasim lost between 400 and 1,000 men by British estimates; British losses were light.
      - Dhayah fort, in the date groves north of the town, held out for three days until two of Liverpool’s 24-pounders breached its walls, and its 400 defenders, many of them farmers of the Tunaij tribe who had taken refuge there, surrendered on 22 December. The British blew up Ras al-Khaimah’s fortifications, left a garrison of 800 sepoys, and destroyed the forts and larger boats of Umm al-Quwain, Ajman, Sharjah and Dubai; Lingeh was burnt. Between January and March 1820 the rulers of the coast, and of Bahrain, signed the General Maritime Treaty, which bound them to give up raiding at sea and to fly a red-and-white flag, the origin of the flags of the emirates.
    facts:
      - [Fall of Ras al-Khaimah, "9 December 1819"]
      - [Surrender of Dhayah, "22 December 1819"]
      - [General Maritime Treaty, "signed January – March 1820"]
