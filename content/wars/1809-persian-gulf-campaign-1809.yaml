id: persian-gulf-campaign-1809
name: British campaigns against the Qawasim
start: "1809-09-17"
end: "1820-03"
tier: B
summary: "Two expeditions sent by the East India Company’s government in Bombay, with Royal Navy ships, against the Qawasim (Al Qasimi), the maritime power of Ras al-Khaimah and Sharjah on the Arabian side of the Strait of Hormuz, with branches at Lingeh and on Qeshm on the Persian side. The British accused the Qawasim of piracy against Indian and British shipping, a charge that the historian and ruler of Sharjah Sultan bin Muhammad Al Qasimi has disputed as a pretext to end Arab competition in the India trade. The 1809 expedition burnt Ras al-Khaimah, Lingeh and Laft but did not end the conflict. In 1819 a much larger force took Ras al-Khaimah and Dhayah and destroyed the forts and larger ships along the coast, and in 1820 the sheikhs signed the General Maritime Treaty, the beginning of the British protectorate over what became known as the Trucial States, today’s United Arab Emirates."
countries: [ae, om, ir]
