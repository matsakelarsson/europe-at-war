steps:
  - title: The expedition of 1809
    date: November 1809 – January 1810
    when: "1809-11-13"
    borders: "1809-11-13"
    countries: [ae, om, ir]
    body:
      - In the early 1800s the Qawasim were the strongest sea power in the lower Gulf, with dozens of large ships and, by British estimates, many thousands of seamen. They were allied with the Saudi emirs of Diriyah and at war with the Sultan of Muscat, Britain’s ally since 1798, and from 1805 their ships attacked British-flagged and Indian vessels, including the Company’s cruiser Sylph in 1808. In September 1809 an expedition under Captain John Wainwright of the frigate HMS Chiffonne, with troops from Bombay under Lieutenant Colonel Lionel Smith, sailed for the Gulf.
      - On 13 November 1809 Smith’s troops landed at Ras al-Khaimah, stormed the town house by house and burnt it, while the ships destroyed more than 50 vessels in the harbour; the British lost five killed and 34 wounded. Lingeh on the Persian coast was abandoned at their approach and its boats burnt, and on 27 November the fort of Laft on Qeshm surrendered after an assault that cost the British some 70 casualties. In January 1810 Wainwright bombarded the fort of Shinas, which the Qawasim had taken from Muscat, until it was reduced to ruins; British accounts put the dead at about 1,000. Over 80 Qasimi vessels were destroyed in all, but within two years the attacks had resumed.
    facts:
      - [Ras al-Khaimah burnt, "13 November 1809"]
      - [Laft taken, "27 November 1809"]
      - [Shinas destroyed, "2–3 January 1810"]
