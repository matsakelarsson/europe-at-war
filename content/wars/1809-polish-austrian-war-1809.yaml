  - id: pl
    name: Duchy of Warsaw
    polities: [duchy-of-warsaw]
    ink: magenta
    moves: Polish and Saxon moves
    success: Polish success
  - id: at
    name: Austrian Empire
    polities: [habsburg]
    ink: purple
    moves: Austrian moves
    success: Austrian success
  - id: ru
    name: Russian Empire
    polities: [russia]
    ink: green
    moves: Russian moves
