  - title: Into Galicia and the Peace of Schönbrunn
    date: May – October 1809
    when: "1809-05-14"
    borders: "1809-10-14"
    countries: [pl, ua]
    body:
      - Instead of retaking Warsaw, Poniatowski marched south-east into Austrian Galicia, the lands Austria had taken in the partitions. His troops took Lublin on 14 May, Sandomierz on 18 May and the fortress of Zamość on 20 May, and a cavalry force reached Lwów on 27 May. Archduke Ferdinand left Warsaw on 1 June and came south. He beat General Józef Zajączek at Jedlińsk on 11 June and retook Sandomierz and Lwów.
      - On 3 June a Russian army entered Galicia as France’s ally, though its commander, Prince Sergei Golitsyn, did little to help the Poles. After Napoleon’s victory at Wagram in early July Austria sought an armistice, and on 15 July Poniatowski entered Kraków. By the Peace of Schönbrunn on 14 October, Austria ceded West Galicia with Kraków to the Duchy of Warsaw and the Tarnopol district to Russia. The two states also shared the income of the Wieliczka salt mines.
    facts:
      - [Peace of Schönbrunn, "14 October 1809"]
      - [Gained by the Duchy, "West Galicia, Kraków and Zamość"]
      - [Duchy’s area, "about 104,000 to 155,000 km²"]
