steps:
  - title: Raszyn and the fall of Warsaw
    date: April – May 1809
    when: "1809-04-14"
    borders: "1809-04-14"
    countries: [pl]
    body:
      - When Austria went to war with Napoleon in April 1809, it sent Archduke Ferdinand of Austria-Este with an army corps into the Duchy of Warsaw, the Polish state Napoleon had created two years earlier. On 19 April Prince Józef Poniatowski met him at Raszyn, just south-west of Warsaw, with Polish and Saxon troops numbering about half as many. The Poles held their positions along the marshy Utrata until nightfall, then withdrew, and neither side was decisively beaten.
      - Poniatowski judged Warsaw too hard to defend. He let the Austrians occupy the capital and took his army across the Vistula, keeping it whole. On the east bank General Michał Sokolnicki beat the Austrians besieging the suburb of Praga at Grochów on 26 April, and on 2–3 May routed them at Góra Kalwaria, destroying their half-built bridge. An Austrian thrust down the Vistula towards the fortress of Toruń also came to nothing.
    facts:
      - [Battle of Raszyn, "19 April 1809, indecisive"]
      - [Warsaw, "Austrian-held, April – 1 June 1809"]
      - [Góra Kalwaria, "2–3 May 1809, Polish victory"]
    markers:
