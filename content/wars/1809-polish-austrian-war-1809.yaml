notes:
  - The result of Raszyn is disputed. The Austrians took Warsaw, which was their aim; Polish historians stress that the Polish army escaped intact and went on to win the campaign.
  - Russia entered the war in June 1809 as France’s ally under the Treaty of Tilsit, but its commander in Galicia had orders to help the Poles as little as possible.
