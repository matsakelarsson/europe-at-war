id: polish-austrian-war-1809
name: Polish–Austrian War
start: "1809-04-14"
end: "1809-10-14"
tier: B
summary: A campaign of the War of the Fifth Coalition in which an Austrian corps invaded the Duchy of Warsaw and took its capital, while the Polish army under Prince Józef Poniatowski struck south into Austrian Galicia. At the Peace of Schönbrunn the Duchy gained West Galicia with Kraków, and Russia, nominally France’s ally, took the Tarnopol district.
countries: [pl, ua, at]
