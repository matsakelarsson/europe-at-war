id: tyrolean-rebellion
name: Tyrolean Rebellion
start: "1809-04-09"
end: "1809-11"
tier: C
summary: A rising of the people of Tyrol, ceded to Bavaria in 1805, against Bavarian and French rule during Austria’s war with Napoleon in 1809. Led by the innkeeper Andreas Hofer and helped at first by Austrian troops, the insurgents won battles on the Bergisel above Innsbruck and held most of Tyrol for months, but after the Peace of Schönbrunn left Tyrol to Bavaria they were defeated in November; Hofer was captured and shot at Mantua in February 1810, and Tyrol was divided between Bavaria, Napoleon’s Kingdom of Italy and the Illyrian Provinces.
