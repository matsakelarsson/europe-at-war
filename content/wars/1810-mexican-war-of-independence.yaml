  - title: Morelos in the south and the siege of Cuautla
    date: October 1810 – May 1812
    when: "1812-02-19"
    borders: "1812-02-19"
    countries: [mx, es]
    body:
      - "In October 1810 Hidalgo had sent José María Morelos, priest of Carácuaro and a former student of his, to raise the south and take Acapulco. Morelos built a smaller, disciplined army that lived off the land without plunder and fought where it could win. Local leaders joined him with their followers: Hermenegildo Galeana, the Bravo family of Chilpancingo, the muleteer Vicente Guerrero, and in December 1811 the priest Mariano Matamoros at Izúcar. By early 1812 he held most of the hot country between the Pacific and the valleys south of Mexico City."
      - "In February 1812 Morelos fortified Cuautla, two days’ march from the capital, and Calleja besieged it with the best royalist army. The town held from 19 February to 2 May 1812 against assaults, bombardment and hunger, until Morelos broke out at night with most of his men. Calleja took the town but the insurgent army survived, and the 72-day defence made Morelos famous."
      - "Both sides now waged a war of reprisals. In September 1812 the viceroy had Leonardo Bravo garrotted in Mexico City; his son Nicolás, offered the lives of some 300 Spanish prisoners to avenge him, set them free instead. On Lake Chapala, west of Guadalajara, the Indigenous people of the island of Mezcala held out against royalist fleets and sieges from 1812 until they won an honourable surrender in November 1816."
    facts:
      - [Siege of Cuautla, "19 February – 2 May 1812 (72 days)"]
      - [Leonardo Bravo executed, "September 1812"]
