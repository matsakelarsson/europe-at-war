  - title: Acatita de Baján and Chihuahua
    date: January – July 1811
    when: "1811-03-21"
    borders: "1811-03-21"
    countries: [mx, es]
    body:
      - "After Calderón the insurgent leaders took Hidalgo’s command from him and gave it to Allende. With a few thousand men and their remaining treasure they retreated north through Zacatecas to Saltillo, meaning to reach the United States to buy arms. On 21 March 1811, at the wells of Acatita de Baján in Coahuila, Ignacio Elizondo, a militia officer who had joined the insurgents and then secretly gone back to the royalists, ambushed the column and captured Hidalgo, Allende, Aldama, Mariano Jiménez and most of the leadership."
      - "They were taken to Chihuahua and tried. Allende, Aldama and Jiménez were shot on 26 June 1811. Hidalgo was stripped of his priesthood by a church court and shot on 30 July 1811. The four leaders’ heads were hung in iron cages at the corners of the Alhóndiga in Guanajuato, where they stayed until 1821."
      - "The rising did not end with them. Ignacio López Rayón, Hidalgo’s secretary, led the survivors south and in August 1811 formed the Supreme National American Junta at Zitácuaro, which still claimed to govern in Ferdinand VII’s name; Calleja took the town in January 1812. In Texas, at the northern edge of the viceroyalty, a militia captain, Juan Bautista de las Casas, had seized San Antonio for the insurgents in January 1811, but royalists overthrew him in March."
    facts:
      - [Capture at Acatita de Baján, "21 March 1811"]
      - [Allende, Aldama and Jiménez shot, "26 June 1811"]
      - [Hidalgo shot, "30 July 1811, Chihuahua"]
      - [Junta of Zitácuaro, "August 1811"]
