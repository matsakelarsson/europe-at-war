  - title: Iguala and the Army of the Three Guarantees
    date: February – September 1821
    when: "1821-02-24"
    borders: "1821-09-28"
    countries: [mx, es]
    side_names:
      ins: Army of the Three Guarantees (Iturbide and Guerrero)
    body:
      - "In January 1820 an army revolt in Spain forced Ferdinand VII to restore the Constitution of Cádiz. In New Spain conservatives, the higher clergy and many officers feared the Spanish liberals’ attacks on church property and privileges, while criollos saw a chance to rule themselves. Agustín de Iturbide, the royalist officer who had fought Morelos, was given command of the army against Guerrero in November 1820. After defeats in the south he opened talks with him."
      - "On 24 February 1821 Iturbide proclaimed the Plan of Iguala, with three guarantees: independence under a constitutional monarchy, offered to Ferdinand VII or another European prince; the Catholic religion; and the union of Americans and Europeans. Guerrero accepted it and put his men under Iturbide’s command, and their armies became the Army of the Three Guarantees. Through the spring and summer royalist garrisons and commanders went over town by town; in July royalist officers in Mexico City deposed Apodaca."
      - "The new captain general, Juan O’Donojú, landed at Veracruz at the end of July with no army to command, and on 24 August 1821 he signed the Treaty of Córdoba with Iturbide, recognising the Mexican Empire as independent. The Army of the Three Guarantees, about 16,000 men, entered Mexico City on 27 September 1821, and the next day a junta signed the Act of Independence of the Mexican Empire. The Spanish Cortes rejected the treaty; a Spanish garrison held the fortress of San Juan de Ulúa off Veracruz until November 1825, and Spain recognised Mexico only in 1836. Iturbide was proclaimed emperor in May 1822."
    facts:
      - [Plan of Iguala, "24 February 1821"]
      - [Treaty of Córdoba, "24 August 1821"]
      - [Entry into Mexico City, "27 September 1821"]
      - [Act of Independence, "28 September 1821"]
