  - title: Oaxaca, Acapulco and the Congress of Chilpancingo
    date: November 1812 – January 1814
    when: "1813-09-13"
    borders: "1813-11-06"
    countries: [mx, es]
    body:
      - "Morelos was at the height of his power in 1813. On 25 November 1812 his army stormed Oaxaca, the richest city of the south. In April 1813 he took the town of Acapulco, and after a long siege the fort of San Diego surrendered on 20 August, giving the insurgents a Pacific port. Calleja, who became viceroy in March 1813, reorganised the royalist army and put the provinces under military commanders."
      - "On 13 September 1813 Morelos opened a congress at Chilpancingo, with delegates for the provinces the insurgents held and others named for those they did not. He read to it his Sentiments of the Nation: sovereignty came from the people, America was independent of Spain and of any other nation, slavery and the distinction of castes were abolished forever, and the Catholic faith was the only religion. On 6 November 1813 the congress declared the independence of “Northern America” from Spain."
      - "Morelos then marched on Valladolid, but on 23–24 December 1813 the royalists under Ciriaco del Llano and Agustín de Iturbide, a criollo officer, beat his army outside the city. At Puruarán on 5 January 1814 they routed it again and captured Matamoros, who was shot at Valladolid in February. Galeana was killed in June. The congress, now a government on the run, took over the direction of the war from Morelos."
    facts:
      - [Oaxaca stormed, "25 November 1812"]
      - [Fort San Diego at Acapulco surrenders, "20 August 1813"]
      - [Congress of Chilpancingo opens, "13 September 1813"]
      - [Declaration of independence, "6 November 1813"]
      - [Defeat at Valladolid, "23–24 December 1813"]
    markers:
      - kind: taken
        side: ins
        name: Oaxaca
