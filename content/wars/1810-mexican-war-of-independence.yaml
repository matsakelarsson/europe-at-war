  - title: Mina and the guerrillas
    date: 1816–1820
    when: "1817-04-15"
    borders: "1817-04-15"
    countries: [mx, es]
    body:
      - "Viceroy Juan Ruiz de Apodaca, who succeeded Calleja in 1816, offered pardons, and thousands of insurgents accepted them; the fortified posts of the insurgent leaders fell one after another. The war became a guerrilla war in the mountains. Vicente Guerrero held out with a few hundred men in the Sierra Madre del Sur, with the Indigenous leader Pedro Ascencio, and Guadalupe Victoria fought on in Veracruz until, his men gone, he hid alone in the forests for more than two years."
      - "In April 1817 the Spanish liberal Francisco Xavier Mina, a hero of the guerrilla war against Napoleon who had fled Ferdinand VII’s absolutism, landed at Soto la Marina on the Gulf coast with about 300 men recruited in Britain and the United States. He marched across the country to the insurgent fort of El Sombrero in the Guanajuato highlands, held by Pedro Moreno, and won several fights. But royalist armies besieged the forts, and on 27 October 1817 Mina and Moreno were surprised at the ranch of El Venadito; Moreno was killed, and Mina was shot on 11 November near the fort of Los Remedios."
    facts:
      - [Mina lands at Soto la Marina, "15 April 1817"]
      - [Mina shot, "11 November 1817"]
