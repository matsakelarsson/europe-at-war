id: mexican-war-of-independence
name: Mexican War of Independence
start: "1810-09-16"
end: "1821-09-28"
tier: A
summary: "The eleven-year war that ended Spanish rule in New Spain. Napoleon’s invasion of Spain in 1808 left the viceroyalty without a legitimate king and set American-born criollos against the Spanish-born officials and merchants who ruled it. On 16 September 1810 the priest Miguel Hidalgo called his parishioners at Dolores to rise (the Grito de Dolores), and a mass army of Indigenous and mestizo farmworkers, miners and townspeople took Guanajuato and marched on Mexico City before royalist troops under Félix María Calleja broke it at Puente de Calderón in January 1811; Hidalgo and the other first leaders were captured and shot. The priest José María Morelos then led a disciplined insurgent army in the south, called a congress that declared independence in 1813 and wrote the Constitution of Apatzingán, but he was captured and executed in 1815. Guerrillas under Vicente Guerrero and others held out in the mountains. In 1821 the royalist officer Agustín de Iturbide made common cause with Guerrero in the Plan of Iguala, most of the army went over to him, and the Army of the Three Guarantees entered Mexico City on 27 September 1821. Estimates of the dead range from about 250,000 to 600,000 in a population of about six million."
countries: [mx, us, es]
sides:
  - id: ins
    name: Insurgents (Hidalgo, Morelos, Guerrero; in 1821 the Army of the Three Guarantees)
    polities: [mexican-insurgents, mexico]
    ink: green
    moves: Insurgent moves
    success: Insurgent success
  - id: roy
    name: Royalists (the Viceroyalty of New Spain and Spain)
    polities: [new-spain, spain]
    ink: gold
    moves: Royalist moves
    success: Royalist success
notes:
  - "Most royalist soldiers were born in New Spain: criollo officers and mestizo, mulatto and Indigenous soldiers and militiamen, with some 8,000 to 10,000 troops sent from Spain after 1812. Many insurgents, Iturbide among their opponents and some of their own leaders, changed sides at least once."
  - "Numbers for the insurgent armies of 1810–1811 are rough guesses by contemporaries; modern estimates for Hidalgo’s army at its largest range from 35,000 to about 100,000, most of them armed with machetes, slings and lances. The death toll of the war is uncertain, and estimates range from about 250,000 to 600,000, many of them from hunger and epidemics."
  - "Dates follow most Mexican and English references; some sources give 18 January 1811 for Puente de Calderón, 19 March for the capture at Acatita de Baján and 31 July for Hidalgo’s execution."
  - Places are given by their modern names, with the colonial name in brackets where it differs (Morelia was Valladolid until 1828).
