  - title: Apatzingán and the death of Morelos
    date: October 1814 – December 1815
    when: "1814-10-22"
    borders: "1814-10-22"
    countries: [mx, es]
    body:
      - "Ferdinand VII returned to the Spanish throne in 1814, abolished the liberal Constitution of Cádiz of 1812 and restored absolute rule, which ended any hope of a settlement with the insurgents. Hunted from town to town, the congress met in the hills of Michoacán and on 22 October 1814 at Apatzingán adopted the Constitutional Decree for the Liberty of Mexican America, a republican constitution with a weak executive of three and a strong legislature."
      - "Without Galeana and Matamoros and with his army reduced to bands, Morelos spent 1815 escorting the congress across the south towards Tehuacán. On 5 November 1815, at Temalaca on the borders of Puebla and Guerrero, he held off a royalist column under Manuel de la Concha long enough for the deputies to escape and was captured. The deputies reached Tehuacán, where in December one of the congress’s own generals, Manuel Mier y Terán, dissolved it. Morelos was tried by the Inquisition and a military court in Mexico City and shot at San Cristóbal Ecatepec, north of the capital, on 22 December 1815."
    facts:
      - [Constitution of Apatzingán, "22 October 1814"]
      - [Morelos captured, "5 November 1815, Temalaca"]
      - [Morelos shot, "22 December 1815, San Cristóbal Ecatepec"]
