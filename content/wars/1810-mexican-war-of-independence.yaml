steps:
  - title: The Grito de Dolores and Guanajuato
    date: September – October 1810
    when: "1810-09-16"
    borders: "1810-09-16"
    countries: [mx, es]
    body:
      - "When Napoleon forced the Spanish Bourbons to abdicate in 1808 and made his brother Joseph king of Spain, New Spain had to decide in whose name it was governed. The Mexico City council, dominated by criollos, proposed a junta to rule until Ferdinand VII returned; in September 1808 Spanish-born merchants answered with a coup that deposed the viceroy, José de Iturrigaray, and jailed the criollo leaders. Old grievances sharpened: criollos were largely shut out of the highest offices, the Crown’s seizure of church loans in 1804 had ruined many landowners, and the harvests of 1808–1810 failed, leaving maize prices high and the poor of the Bajío, the rich farming and mining region north-west of the capital, hungry."
      - "In Querétaro a circle of criollos around the militia captain Ignacio Allende and Juan Aldama planned a rising for later in 1810 (sources give October or December), with Miguel Hidalgo y Costilla, the parish priest of Dolores, among them. When the plot was betrayed, Josefa Ortiz de Domínguez, wife of Querétaro’s corregidor, sent them a warning. Before dawn on 16 September 1810 Hidalgo rang his church bell and called on his parishioners to rise against the “bad government” of the Spanish-born, in the name of Ferdinand VII and under a banner of the Virgin of Guadalupe. Thousands joined within days, most of them Indigenous and mestizo farmworkers, miners and labourers, as the rising passed through San Miguel and Celaya."
      - "On 28 September Hidalgo’s host, by then tens of thousands strong, reached Guanajuato, where the intendant Juan Antonio Riaño had shut himself, his soldiers and the town’s Spanish-born families and their silver into the Alhóndiga de Granaditas, the stone granary. The insurgents stormed it, by tradition after a miner known as El Pípila burned its door; Riaño was killed and most of the defenders and the Spaniards inside were killed, and the town was sacked. The killing frightened many criollos who had sympathised with the cause. On 17 October the insurgents entered Valladolid (Morelia) without a fight."
    facts:
      - [Grito de Dolores, "16 September 1810"]
      - [Storming of the Alhóndiga, "28 September 1810"]
      - [Valladolid taken, "17 October 1810"]
