  - title: The Republican Army of the North in Texas
    date: August 1812 – August 1813
    when: "1813-04-06"
    borders: "1813-04-06"
    countries: [us, mx, es]
    body:
      - "Bernardo Gutiérrez de Lara, a merchant from Revilla on the Rio Grande who had gone to Washington to seek support for the insurgents, raised a small army in Louisiana with Augustus Magee, a former US Army lieutenant. The Republican Army of the North, Mexican insurgents and US volunteers who were promised land and pay, crossed the Sabine River in August 1812 and took Nacogdoches. In November it took the presidio of La Bahía (Goliad) and held it through a royalist siege, and on 29 March 1813 it defeated the governor of Texas, Manuel María de Salcedo, at Rosillo Creek. San Antonio surrendered on 1 April."
      - "Days later Salcedo and more than a dozen captured royalist officers were taken out of the town and killed with Gutiérrez’s consent, which drove away many of the US volunteers. On 6 April 1813 Gutiérrez declared Texas independent of Spain. The republicans beat a royalist relief force at Alazán Creek in June, but the expedition split between Gutiérrez and the Cuban adventurer José Álvarez de Toledo, who replaced him."
      - "On 18 August 1813 the royalist commandant of the eastern provinces, Joaquín de Arredondo, with about 1,830 men, lured Toledo’s army of about 1,400 into an ambush in the oak woods south of the Medina River. It was the deadliest battle ever fought in Texas: about 1,300 republicans died, many shot after they surrendered, against 55 royalists. Arredondo’s men executed suspected rebels in San Antonio and along the road to Louisiana, and much of Texas’s Spanish-speaking population fled or was killed. Among Arredondo’s young officers was Antonio López de Santa Anna."
    facts:
      - [Battle of Rosillo, "29 March 1813"]
      - [Texas declared independent, "6 April 1813"]
      - [Battle of Medina, "18 August 1813"]
      - [Republicans killed at Medina, "about 1,300"]
    markers:
