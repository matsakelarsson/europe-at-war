  - title: Monte de las Cruces, Aculco and Puente de Calderón
    date: October 1810 – January 1811
    when: "1810-10-30"
    borders: "1810-11-07"
    countries: [mx, es]
    body:
      - "From Valladolid Hidalgo marched on the capital with an army that contemporaries put at 60,000 to 80,000. On 30 October 1810, in the wooded pass of Monte de las Cruces west of Mexico City, it overwhelmed a royalist force of a few thousand under Torcuato Trujillo, at a heavy cost. The capital lay open, but Hidalgo, short of ammunition, unsure of support in the city and with the army of Félix María Calleja coming down from San Luis Potosí, turned back. On 7 November Calleja caught the retreating host at Aculco and scattered it."
      - "Allende fell back on Guanajuato and Hidalgo went to Guadalajara, which the insurgent José Antonio Torres had taken. Calleja retook Guanajuato on 25 November; before he arrived a crowd killed Spanish prisoners held in the Alhóndiga, and he answered with executions in the town. In Guadalajara Hidalgo set up a government, published the first insurgent newspaper, El Despertador Americano, and on 6 December decreed the end of slavery and of the tribute paid by Indigenous people and castas. In December and January, on his orders, several hundred Spanish-born prisoners were killed in secret in Guadalajara and Valladolid."
      - "Calleja and José de la Cruz converged on Guadalajara with some 6,000 trained soldiers. Against Allende’s advice Hidalgo gave battle at the bridge of Calderón east of the city on 17 January 1811 with a host of perhaps 35,000 to 100,000 and about 95 cannon. For hours the insurgents held, until a royalist shell blew up an ammunition wagon, the dry grass caught fire and the army broke and fled."
    facts:
      - [Battle of Monte de las Cruces, "30 October 1810"]
      - [Battle of Aculco, "7 November 1810"]
      - [Hidalgo’s decree abolishing slavery, "6 December 1810, Guadalajara"]
      - [Battle of Puente de Calderón, "17 January 1811"]
