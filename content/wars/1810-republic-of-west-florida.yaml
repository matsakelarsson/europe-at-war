id: republic-of-west-florida
name: Republic of West Florida
start: "1810-09-23"
end: "1810-12-10"
tier: C
summary: "A short-lived revolt in the westernmost part of Spanish West Florida, between the Mississippi and the Pearl River, and its annexation by the United States. The district of Baton Rouge had been settled mostly by English-speaking Americans and Britons since the 1780s, many of them planters who held enslaved people, and the United States claimed it as part of the Louisiana Purchase, which Spain denied. After Napoleon’s invasion of Spain in 1808 weakened Spanish rule, the settlers held conventions from June 1810 under the governor, Carlos de Hault de Lassus, while some of them plotted rebellion. Early on 23 September 1810 a force of mounted militia under Philemon Thomas took the Spanish fort of San Carlos at Baton Rouge, killing two Spanish soldiers and capturing de Lassus. On 26 September the convention declared the Republic of West Florida independent; it adopted a constitution, made St. Francisville its capital and elected Fulwar Skipwith governor, under a flag with a white star on a blue field, a design revived in 1861 as the Bonnie Blue Flag. An expedition under Reuben Kemper failed to take Mobile. On 27 October President James Madison proclaimed that the United States would take possession of the region as part of the Territory of Orleans, and American officials and troops under Governor William C. C. Claiborne of the Territory of Orleans and David Holmes of the Mississippi Territory took over St. Francisville on 6 December and Baton Rouge on 10 December 1810; the republic, which had hoped to join the United States on its own terms, gave way after about 74 days. Spain protested, but its remaining West Florida, with Mobile, was occupied by American troops in 1813, and it ceded the Floridas by the Adams–Onís Treaty of 1819. The republic’s territory is today’s Florida Parishes of Louisiana."
