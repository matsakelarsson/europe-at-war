steps:
  - title: The landing, Batavia and Meester Cornelis
    date: August 1811
    when: "1811-08-26"
    borders: "1811-08-26"
    countries: [id, gb, nl, fr]
    body:
      - After the Netherlands became part of France in 1810, Lord Minto, the governor-general of India, took up Thomas Stamford Raffles’s proposal to seize Java, the last base from which French ships could raid British trade in the East; the Moluccas had been taken in 1810. The expedition sailed from Madras and Bengal in April 1811 and gathered at Penang and Malacca, about 11,960 men under General Sir Samuel Auchmuty with a fleet under Commodore William Robert Broughton, later Rear-Admiral Robert Stopford. On 4 August it landed unopposed at the fishing village of Cilincing, about 20 km east of Batavia.
      - Janssens, who meant to let the climate wear down the invaders, abandoned Batavia, which surrendered on 8 August, and withdrew with 8,000 to 10,000 men into the lines of Meester Cornelis, a fortified camp south of the town that Daendels had built, with 280 guns on its walls. The British took the cantonment of Weltevreeden on 10 August and dug batteries before the lines. After a sortie on 22 August was driven back, Colonel Rollo Gillespie, guided by a deserter, seized the key redoubts, and at midnight on 25 August the British stormed the lines. The siege cost them 630 killed and wounded; about 5,000 defenders were captured and about 1,000 found dead in the works. Janssens escaped to Buitenzorg with a few survivors.
    facts:
      - [British force, "about 12,000 men, half of them Indian sepoys"]
      - [Landing at Cilincing, "4 August 1811"]
      - [Batavia surrenders, "8 August 1811"]
      - [Meester Cornelis stormed, "25–26 August 1811"]
