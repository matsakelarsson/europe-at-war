  - title: The sack of Yogyakarta
    date: June 1812
    when: "1812-06-20"
    borders: "1812-06-20"
    countries: [id, gb]
    body:
      - Sultan Hamengkubuwono II of Yogyakarta, whom Daendels had forced aside in 1810 and who took back power after the fall of the Franco-Dutch government, refused to accept British overlordship, and Raffles suspected him of plotting with Surakarta against the British. In June 1812 more than 1,000 British and sepoy troops under Gillespie, with the Mangkunegaran Legion, marched on Yogyakarta. After a bombardment they stormed the walled palace on 20 June; sepoys lowered a drawbridge for the assault column, and the sultan surrendered in the inner court. The British lost 23 killed and 76 wounded, the defenders hundreds.
      - The palace was plundered of its treasure, worth more than 850,000 rixdollars, and of its library and archives. Hamengkubuwono II was exiled to Penang, his son was installed as Hamengkubuwono III, and the sultan’s half-brother Natakusuma, who had sided with the British, received his own principality as Paku Alam I. Yogyakarta had to cede Kedu and other lands to the British government. It was the first time a European army had stormed a central Javanese court, and the humiliation helped prepare the ground for the Java War of 1825, led by the new sultan’s eldest son, Diponegoro.
    facts:
      - [British force, "more than 1,000 British and sepoy troops"]
      - [Palace stormed, "20 June 1812"]
      - [Losses, "23 British killed and 76 wounded; hundreds of defenders"]
    markers:
