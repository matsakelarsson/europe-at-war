notes:
  - The storming of the Yogyakarta palace is remembered in Java as Geger Sepehi, “the sepoy tumult”, after the Indian troops who did most of the fighting. The British carried off the palace treasury and its library and archives; some of the manuscripts, now in the British Library, were returned in digital form in 2019.
  - The defenders of Java were Dutch, French and Javanese troops; many Dutch soldiers and Javanese auxiliaries deserted the French cause during the campaign.
