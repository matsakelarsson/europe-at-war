  - title: The pursuit and the capitulation of Tuntang
    date: September 1811
    when: "1811-09-16"
    borders: "1811-09-18"
    countries: [id, gb, nl, fr]
    body:
      - Janssens tried to rally an army in Central Java, reinforced on 3 September by 1,200 horsemen of the Mangkunegaran under Prince Prangwedana and by other Javanese levies. Meanwhile British ships took the coast. Sailors and marines captured Sumenep on Madura on 31 August, after which the rest of Madura went over to the British, and landed at Cirebon in early September, while Auchmuty shipped troops east to Semarang.
      - On 16 September a British force under Colonel Samuel Gibbs beat off Janssens’s attack on the heights of Jatingaleh south of Semarang; in the rout many of the Javanese auxiliaries killed their Dutch officers. With only a handful of men left, Janssens signed the capitulation of Java and its dependencies at Tuntang, near Salatiga, on 18 September 1811. Raffles became lieutenant-governor and abolished much of the Dutch system of forced deliveries, replacing it with a land tax.
    facts:
      - [Sumenep taken, "31 August 1811"]
      - [Janssens’s last battle, "16 September 1811"]
      - [Capitulation of Tuntang, "18 September 1811"]
