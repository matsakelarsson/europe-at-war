id: british-invasion-of-java
name: British invasion of Java
start: "1811-08-04"
end: "1812-06-20"
tier: B
summary: "The British conquest of Java from its Franco-Dutch government during the Napoleonic Wars, and the storming of the court of Yogyakarta that followed. The Netherlands had been annexed by France in 1810, and Java, governed since 1808 by the marshal Herman Willem Daendels and from 1811 by General Jan Willem Janssens, was the last French-ruled base in the East. An expedition of about 12,000 men, half of them Indian sepoys of the East India Company, sailed from India under General Sir Samuel Auchmuty and landed at Cilincing east of Batavia on 4 August 1811. Batavia surrendered without a fight on 8 August, and on the night of 25–26 August the British stormed the fortified lines of Meester Cornelis, where about 5,000 defenders were captured and about 1,000 found dead. Janssens retreated east, and after his last force broke up he capitulated at Tuntang near Salatiga on 18 September. Thomas Stamford Raffles governed Java for the East India Company. On 20 June 1812 British and sepoy troops, with the Mangkunegaran Legion, stormed and plundered the palace of Sultan Hamengkubuwono II of Yogyakarta, who was deposed and exiled to Penang. Java was returned to the Netherlands in 1816."
countries: [id, gb, nl, fr]
