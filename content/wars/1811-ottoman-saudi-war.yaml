  - title: Mecca, and war in the mountains
    date: 1813–1814
    when: "1813-01"
    borders: "1813-06-01"
    countries: [sa, eg]
    body:
      - Sharif Ghalib of Mecca, who had ruled under Saudi overlordship since 1806, now went over to the Egyptians. In January 1813 an Egyptian force entered Jeddah and Mecca without a fight, and Taif soon followed, so that by early 1813 all the towns of the Hejaz were again under Ottoman rule. Muhammad Ali came to Jeddah himself in September 1813 with some 2,000 infantry, 2,000 cavalry and 8,000 camels. Distrusting Ghalib, he had him arrested late in 1813 and sent into exile.
      - The Saudi heartland was untouched, and the tribes of the mountains east and south of Mecca fought on. An Egyptian attack on the oasis of Turubah, defended by the tribe of Buqum under a woman leader, Ghaliya, failed in 1813, and in 1814 Egyptian columns were driven back in the Zahran and Ghamid country, besieged in Taif and forced out of the port of Qunfudhah. Emir Saud died at Diriyah on 1 May 1814 and was succeeded by his son Abdullah.
    facts:
      - [Mecca and Jeddah retaken, "January 1813"]
      - [Muhammad Ali in the Hejaz, "September 1813 – June 1815"]
      - [Death of Emir Saud, "1 May 1814"]
    markers:
      - kind: taken
        side: ott
        name: Mecca
        date: January 1813
        text: Entered without fighting, with the support of Sharif Ghalib. Ottoman prayers for the sultan were restored and the pilgrimage reopened.
        lonlat: [39.823, 21.422]
        lp: l
      - kind: event
        side: ott
        name: Jeddah
        date: September 1813
        text: Muhammad Ali landed here to take command in person. He stayed in the Hejaz for almost two years.
        lonlat: [39.173, 21.543]
        lp: l
      - kind: held
        side: saud
        name: Turubah
        date: 1813–1814
        text: Defended by the Buqum under Ghaliya, whom Egyptian soldiers believed to be a sorceress. The first Egyptian attacks failed.
        lonlat: [41.633, 21.214]
      - kind: taken
        side: saud
        name: Qunfudhah
        date: 1814
        text: The Egyptians took this Red Sea port but were driven out after about a month by tribal forces from Asir.
        lonlat: [41.079, 19.126]
        lp: l
