  - title: Ibrahim Pasha in Najd
    date: 1816–1818
    when: "1816-09"
    borders: "1818-03-01"
    countries: [sa, eg]
    body:
      - The war resumed in 1816 under Muhammad Ali’s eldest son, Ibrahim Pasha, who landed at Yanbu in the autumn with infantry, Bedouin cavalry, artillery and French instructors. Using the wells of al-Hanakiyah as his forward base, he won over the tribes of the northern steppe with money and reached the Qassim early in 1817, where he defeated Abdullah’s field army.
      - The town of ar-Rass held out against him for more than three months in 1817 and was given terms rather than taken. Unayzah and Buraydah then submitted, and early in 1818 Ibrahim marched on into the Washm district, taking Shaqra after a siege. At Dhurma, which resisted, his troops are reported to have killed all the men they found. Abdullah fell back to Diriyah to make his stand.
    facts:
      - [Siege of ar-Rass, "1817, more than three months"]
      - [Unayzah and Buraydah submit, "late 1817"]
      - [Shaqra and Dhurma taken, "early 1818"]
