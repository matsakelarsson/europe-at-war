  - title: The fall of Diriyah
    date: April – September 1818
    when: "1818-04"
    borders: "1818-09-11"
    countries: [sa, eg, tr]
    body:
      - Ibrahim reached Diriyah on 22 April 1818 with between 5,500 and 7,600 men and a dozen guns. The town was a string of walled quarters and palm groves along the steep valley of Wadi Hanifa, and its defenders fought for every barricade. On 21 June a fire blew up the Egyptian powder store, destroying about half of Ibrahim’s ammunition, and he had to send for supplies and reinforcements from the Qassim and the Hejaz. The siege lasted about five months, and each side lost well over a thousand dead. One by one the outer quarters fell, and on 11 September 1818 Abdullah ibn Saud, holding out in the citadel quarter of at-Turaif, surrendered in return for a promise to spare the town.
      - Abdullah was sent to Cairo and then to Istanbul, where he was beheaded in December 1818. Diriyah was nevertheless razed on Muhammad Ali’s orders, and members of the Saud family and of the family of Muhammad ibn Abd al-Wahhab were deported to Egypt; a grandson of the reformer, the judge Sulayman ibn Abdullah, was executed. Ibrahim’s troops went on to occupy al-Hasa and Qatif and pulled down the walls of the Najdi towns before he returned to Egypt in 1819. Egyptian garrisons could not hold the interior, and in 1824 Turki ibn Abdullah took Riyadh and founded the second Saudi state.
    facts:
      - [Siege of Diriyah, "April – September 1818"]
      - [Surrender of Abdullah ibn Saud, "11 September 1818"]
      - [Abdullah executed in Istanbul, "December 1818"]
    markers:
