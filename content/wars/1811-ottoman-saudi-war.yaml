steps:
  - title: Tusun Pasha lands at Yanbu
    date: 1811–1812
    when: "1811-10"
    borders: "1811-10-01"
    countries: [sa, eg]
    body:
      - By 1805 the Saudi emir Saud ibn Abd al-Aziz ruled from Diriyah over Najd, al-Hasa and the Hejaz, and his forces raided Iraq and Syria; in 1802 they had sacked the Shia shrine city of Karbala. After 1806 the Ottoman pilgrim caravans from Damascus and Cairo were turned away from Mecca, a blow to the sultan’s standing as protector of the holy cities. Sultan Mahmud II ordered Muhammad Ali, the governor of Egypt, to march against Diriyah in 1807, but troubles at home held him back until 1811, when he had the Mamluk beys massacred in the Cairo citadel.
      - In October 1811 his seventeen-year-old son Tusun Pasha landed at Yanbu, whose small garrison surrendered. His army, about 8,000 regulars and perhaps 14,000 men with irregulars, took Badr and marched up the Wadi al-Safra towards Medina. There a larger Saudi force under Saud’s sons Abdullah and Faisal held the heights, and after three days of fighting the Egyptians broke and were cut down as they fled, losing 4,000 to 5,000 men by the Saudi chroniclers’ count and seven guns. Tusun fell back to Yanbu with some 3,000 men. Reinforced from Egypt and helped by gifts to the Harb and Juhayna tribes along the road, he advanced again in the autumn of 1812. In November his engineers blew a breach in the walls of Medina and his troops stormed the town; the garrison of the citadel surrendered three weeks later on a promise of safe passage, and many of them were killed as they came out.
    facts:
      - [Landing at Yanbu, "October 1811"]
      - [Battle of al-Safra, "late 1811 or January 1812, Saudi victory"]
      - [Medina taken, "November 1812"]
