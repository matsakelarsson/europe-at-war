  - title: Bisil and the truce of 1815
    date: 1815
    when: "1815-01"
    borders: "1815-06-01"
    countries: [sa, eg]
    body:
      - In January 1815 Muhammad Ali met the main Saudi army, led by Abdullah’s brother Faisal and the tribes of the south, at Bisil near Taif. Using his cavalry to draw the Saudis out of their positions into the open plain, he won a clear victory and killed or captured many of them. He then took Turubah and marched south through Bisha into Asir, before going back to the coast.
      - In the north, Tusun crossed into the Qassim, the northern gate of Najd, and occupied ar-Rass in the spring of 1815. Neither side felt able to win outright, and Tusun and Abdullah ibn Saud agreed a truce under which the Saudis gave up the Hejaz and acknowledged the sultan’s authority. Muhammad Ali, worried by Napoleon’s return from Elba and by unrest in Egypt, sailed home in June 1815. Neither he nor the sultan confirmed the truce, and in Cairo it was taken only as a pause.
    facts:
      - [Battle of Bisil, "January 1815, Egyptian victory"]
      - [Tusun in the Qassim, "spring 1815"]
      - [Truce with Abdullah ibn Saud, "1815, not ratified"]
    markers:
