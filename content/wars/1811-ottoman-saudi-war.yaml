id: ottoman-saudi-war
name: Ottoman–Saudi War
start: "1811-10"
end: "1818-09-11"
tier: A
summary: The war in which the Ottoman Empire, through its governor of Egypt, Muhammad Ali Pasha, destroyed the first Saudi state, the Emirate of Diriyah. Allied with the reformer Muhammad ibn Abd al-Wahhab, the Saudi emirs had united most of Arabia and in 1803–1805 taken Mecca and Medina, ending the Ottoman sultan’s role as protector of the holy cities. Egyptian armies under Muhammad Ali’s sons retook the Hejaz in 1812–1813 after an early defeat, fought the Saudis and their tribal allies in the mountains east of Mecca, and in 1816–1818, under Ibrahim Pasha, marched across Najd and besieged Diriyah. Abdullah ibn Saud surrendered on 11 September 1818 and was beheaded in Istanbul; Diriyah was razed. A second Saudi state rose at Riyadh in 1824.
countries: [sa, eg]
sides:
  - id: ott
    name: Ottoman Empire and Egypt
    polities: [ottoman, egypt]
    ink: purple
    moves: Ottoman–Egyptian moves
    success: Ottoman–Egyptian success
  - id: saud
    name: Emirate of Diriyah
    polities: [saudi-arabia]
    ink: green
    moves: Saudi moves
    success: Saudi success
notes:
  - The war is also called the Ottoman–Wahhabi or Egyptian–Wahhabi war. The Saudis called themselves al-Muwahhidun; "Wahhabi" was the name used by their opponents.
  - Muhammad Ali governed Egypt in the sultan’s name. His army was raised and paid in Egypt and included Albanian and Turkish soldiers, Bedouin auxiliaries and, from 1816, French instructors.
  - Numbers in the sources are uncertain, especially for the Saudi and tribal forces.
