notes:
  - Historians differ on how far Tecumseh and Tenskwatawa led one movement; American accounts of the time gave the Prophet more weight in its early years, and later histories often make Tecumseh the leader. Many leaders of the nations, such as Little Turtle of the Miami and Black Hoof of the Shawnee, opposed the brothers and kept to their treaties with the United States.
  - The war from June 1812 is told in the War of 1812.
