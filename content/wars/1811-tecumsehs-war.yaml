steps:
  - title: Prophetstown and the Treaty of Fort Wayne
    date: 1805–1811
    when: "1811-07"
    borders: "1810-08-12"
    countries: [us]
    body:
      - "In 1805 Lalawethika, a younger brother of the Shawnee war leader Tecumseh, had visions and took the name Tenskwatawa, the Open Door. Known to Americans as the Prophet, he preached that the nations should give up alcohol, American goods and ways and quarrels among themselves, and return to the ways given them by the Creator. Followers from many nations came to his village at Greenville, Ohio, and in 1808 the brothers moved to Prophetstown, where the Tippecanoe joins the Wabash. Tecumseh made the movement into a confederacy: the land, he said, belonged to all the nations in common, and no single nation or chief could sell any of it."
      - "Harrison, governor of Indiana Territory, had meanwhile bought millions of acres in a series of treaties with leaders of single nations. By the Treaty of Fort Wayne of 30 September 1809 Lenape, Potawatomi, Miami and Eel River leaders sold about 2.5 to 3 million acres along the Wabash. At Grouseland, Harrison’s house in Vincennes, Tecumseh told him in August 1810 that the sale was void and warned the chiefs who had signed it; the meeting nearly ended in a fight. After a second meeting in July 1811 Tecumseh travelled south to the Chickasaw, Choctaw and Muscogee. He spoke to the Muscogee council at Tukabatchee that autumn, inspiring the movement that became the Red Sticks, but the Choctaw under Pushmataha refused to join him."
