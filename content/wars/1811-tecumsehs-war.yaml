  - title: Tippecanoe
    date: September 1811 – October 1813
    when: "1811-11-07"
    borders: "1811-11-07"
    countries: [us]
    link: { href: "#/war/war-of-1812", text: War of 1812 }
    body:
      - "While Tecumseh was in the south, Harrison marched up the Wabash from Vincennes on 26 September 1811 with about 1,000 men: regulars of the 4th Infantry, Indiana militia and Kentucky volunteers. He built Fort Harrison near present-day Terre Haute and on 6 November camped within sight of Prophetstown. Before dawn on 7 November several hundred warriors, Kickapoo, Shawnee, Potawatomi, Ho-Chunk, Wyandot and others, attacked the camp; Tenskwatawa is said to have told them that his power would protect them. After two hours of fighting they were driven off. Harrison lost 62 killed and 126 wounded; the warriors left 36 known dead, and estimates of their losses run to some 50 to 65 killed. The next day his men burned the abandoned town and its stores of food."
      - "The battle hurt Tenskwatawa’s standing, but it did not end the confederacy. Tecumseh came back early in 1812 to find Prophetstown in ashes and rebuilt his alliance, and war parties raided the settlements in Indiana and Illinois that spring; Americans blamed the British, who had supplied the nations from Amherstburg. When the United States declared war on Britain in June 1812, Tecumseh joined the British, and his warriors helped take Detroit in August. His war became part of the War of 1812, and it ended with his death at the Battle of the Thames on 5 October 1813. Harrison won the presidency in 1840 with the slogan “Tippecanoe and Tyler too”."
