id: tecumsehs-war
name: Tecumseh’s War
start: "1811"
end: "1813-10-05"
tier: B
summary: "The struggle of the confederacy led by the Shawnee brothers Tecumseh and Tenskwatawa against the expansion of the United States in the Northwest. After the Treaty of Greenville, William Henry Harrison, governor of Indiana Territory, bought millions of acres from individual nations by treaty. Tenskwatawa, known as the Prophet, led a religious revival that drew followers from many nations to Prophetstown on the Wabash, and Tecumseh turned it into a political and military alliance, holding that the land belonged to all the nations in common and that none could sell it alone. He rejected the Treaty of Fort Wayne of 1809 to Harrison’s face at Vincennes in 1810 and travelled south in 1811 to win over the Muscogee and others. While he was away Harrison marched on Prophetstown with about 1,000 men; on 7 November 1811 warriors attacked his camp at Tippecanoe and were beaten off, and Harrison burned the town. Raids on the frontier followed, and when the War of 1812 began Tecumseh joined the British; his war merged into the larger one, and he was killed at the Battle of the Thames on 5 October 1813."
countries: [us]
