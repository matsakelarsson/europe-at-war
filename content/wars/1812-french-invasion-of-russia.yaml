  - title: Borodino
    date: 7 September 1812
    when: "1812-09-07"
    borders: "1812-09-07"
    countries: [ru, fr]
    body:
      - Kutuzov made his stand near the village of Borodino, about 110 km west of Moscow, with roughly 120,000 men, including militia and Cossacks, against some 130,000 under Napoleon. On 5 September the French took the Shevardino redoubt in front of the Russian left. At dawn on 7 September they attacked the earthworks known as the Bagration flèches, which changed hands several times before they fell. Bagration was mortally wounded. In the afternoon French cavalry and infantry took the Great Redoubt in the centre, held by Raevsky’s corps.
      - The Russians fell back a short way to a new line, but their army was not broken, and Napoleon refused to send in his Imperial Guard. Some 70,000 or more men were killed or wounded in one day, about 30,000–35,000 of them French and allied and 40,000–45,000 Russian by most estimates, the bloodiest single day of the Napoleonic Wars. Kutuzov withdrew towards Moscow. At a council of war in the village of Fili on 13 September he decided to give up the city rather than risk the army.
    facts:
      - [Battle of Borodino, "7 September 1812"]
      - [Armies, "about 130,000 French and allied, about 120,000 Russian"]
      - [Killed and wounded, "some 70,000 or more"]
    markers:
      - kind: battle
        name: Battle of Borodino
        date: 7 September 1812
        text: The French took the Russian earthworks at great cost but did not destroy Kutuzov’s army, which withdrew in good order.
        lonlat: [35.817, 55.517]
      - kind: event
        side: ru
        name: Mozhaysk
        date: 8 September 1812
        text: The Russian army retreated through the town towards Moscow, leaving thousands of its wounded behind.
        lonlat: [36.033, 55.517]
        lp: b
      - kind: event
        name: Council at Fili
        date: 13 September 1812
        text: Kutuzov told his generals that losing Moscow did not mean losing Russia, and ordered the army to march through the city and out.
        lonlat: [37.48, 55.745]
    arrows:
      - side: fr
        label: Napoleon
        phase: 1
        via: [[34.3, 55.25], [35.0, 55.55], [35.75, 55.53]]
      - side: ru
        label: Kutuzov
        phase: 2
        via: [[35.9, 55.52], [36.6, 55.55], [37.4, 55.72]]
  - title: Moscow burns
    date: 14 September – 19 October 1812
    when: "1812-09-14"
    borders: "1812-09-14"
    countries: [ru, fr]
    body:
      - Napoleon entered Moscow on 14 September, but most of its roughly 270,000 people had left with the army. That night fires broke out across the city and burned until 18 September, destroying about three-quarters of it. The governor, Fyodor Rostopchin, had taken away the fire pumps, and many historians believe he ordered the city burned, though looting soldiers and accidents also played a part. Napoleon settled in the Kremlin and sent three offers of peace to Alexander, who did not reply.
      - Kutuzov’s army slipped away south-west to a camp at Tarutino, where it rested and grew while it covered the arsenal at Tula and the grain lands of the south. Cossacks, army raiders and armed peasants attacked French foragers and killed stragglers. On 18 October the Russians surprised Murat’s advance guard at Tarutino. The next day Napoleon left Moscow with about 100,000 men and a long train of loot, heading south-west for Kaluga, and the troops left behind blew up part of the Kremlin as they followed.
    facts:
      - [Napoleon in Moscow, "14 September – 19 October 1812"]
      - [Fire of Moscow, "14–18 September, about three-quarters of the city destroyed"]
      - [Battle of Tarutino, "18 October 1812, Russian success"]
    markers:
      - kind: taken
        side: fr
        name: Moscow
        date: 14 September 1812
        text: The French entered a nearly empty city. Fires that broke out the same night destroyed most of its wooden houses.
        lonlat: [37.618, 55.756]
      - kind: battle
        side: ru
        name: Battle of Tarutino
        date: 18 October 1812
        text: Kutuzov’s attack on Murat’s camp on the Chernishnya river showed that the Russian army was ready to fight again.
        lonlat: [36.941, 55.122]
    arrows:
      - side: ru
        label: Kutuzov
        phase: 1
        via: [[37.75, 55.68], [37.85, 55.42], [37.3, 55.25], [36.98, 55.15]]
      - side: fr
