        phase: 2
        via: [[37.5, 55.7], [37.0, 55.4], [36.55, 55.08]]
  - title: The retreat begins
    date: 24 October – 18 November 1812
    when: "1812-10-24"
    borders: "1812-11-03"
    countries: [ru, fr]
    body:
      - Napoleon hoped to reach the stores at Kaluga by the unravaged southern road. On 24 October his Italian corps under Prince Eugène met Dokhturov’s troops at Maloyaroslavets, and the town changed hands several times and burned. The French held it, but Kutuzov blocked the road south. After a narrow escape from Cossacks the next morning, Napoleon turned north to the Smolensk road, along which his army had stripped the country bare on its way east, and passed the unburied dead of Borodino.
      - Kutuzov followed on a parallel road to the south while Cossacks and partisans attacked the columns. At Vyazma on 3 November Miloradovich mauled the rearguard. Hard frosts came in early November, horses died in thousands, guns and wagons were abandoned and discipline broke down. At Smolensk the stores were too small and were looted. At Krasnoi on 15–18 November Russian attacks cut the strung-out army into pieces; Ney’s rearguard was cut off and escaped across the frozen Dnieper with only a few hundred men.
    facts:
      - [Battle of Maloyaroslavets, "24 October 1812"]
      - [Battle of Vyazma, "3 November 1812"]
      - [Battles of Krasnoi, "15–18 November 1812"]
    markers:
      - kind: battle
        side: ru
        name: Battle of Maloyaroslavets
        date: 24 October 1812
        text: The French kept the burned-out town, but Kutuzov’s army barred the road to Kaluga, forcing Napoleon back onto the devastated Smolensk road.
        lonlat: [36.458, 55.022]
      - kind: battle
        side: ru
        name: Battle of Vyazma
        date: 3 November 1812
        text: Miloradovich attacked the French rearguard under Davout, which lost heavily before it got through the town.
        lonlat: [34.3, 55.2]
      - kind: event
        name: Smolensk
        date: 9–14 November 1812
        text: The starving army found too little food and looted the stores. Many units no longer existed except on paper.
        lonlat: [32.045, 54.783]
        lp: t
      - kind: battle
        side: ru
        name: Battles of Krasnoi
        date: 15–18 November 1812
        text: Kutuzov’s attacks cost the Grande Armée tens of thousands of men killed, captured or scattered.
        lonlat: [31.43, 54.56]
        lp: b
    arrows:
