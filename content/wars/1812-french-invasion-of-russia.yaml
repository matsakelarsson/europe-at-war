  - title: The Berezina and the end
    date: November – December 1812
    when: "1812-11-26"
    borders: "1812-12-14"
    countries: [by, lt, ru, pl, fr, de]
    body:
      - Two more Russian armies closed in on the Berezina, Admiral Pavel Chichagov’s from the south and Wittgenstein’s from the north, and on 21 November Chichagov took the bridge at Borisov. Napoleon feinted downstream while his engineers under General Jean-Baptiste Éblé, working in the icy river, built two trestle bridges near the village of Studzianka. From 26 to 29 November the army crossed under attack from both banks. When the bridges were burned on the morning of 29 November, thousands of stragglers and camp followers were still on the eastern bank. Tens of thousands were killed, drowned or captured, but most of the remaining fighting troops got across.
      - On 5 December Napoleon left the army at Smorgon and hurried to Paris to raise a new one. Temperatures fell to about −30 °C, and thousands more died on the road to Vilnius and in the city itself. Around 14 December the last of the main army, with Ney’s rearguard, crossed the Niemen at Kaunas. Of the more than 600,000 men who had entered Russia, only a small fraction came back. Russian losses were also enormous, and many civilians died. On 30 December the Prussian general Ludwig Yorck agreed at Tauroggen to take his corps out of the war, and Prussia soon changed sides.
    facts:
      - [Crossing of the Berezina, "26–29 November 1812"]
      - [Napoleon leaves the army, "Smorgon, 5 December 1812"]
      - [Convention of Tauroggen, "30 December 1812"]
    markers:
      - kind: taken
        side: ru
        name: Polotsk
        date: 20 October 1812
        text: Wittgenstein retook the town in the second battle there, then marched south towards the Berezina.
        lonlat: [28.776, 55.486]
      - kind: taken
        side: ru
        name: Borisov
        date: 21 November 1812
        text: Chichagov’s army took the town and its bridge, cutting the main road west.
        lonlat: [28.5, 54.233]
        lp: b
      - kind: battle
        name: Battle of Berezina
        date: 26–29 November 1812
        text: The Grande Armée escaped the trap over Éblé’s bridges, but at a terrible cost in lives.
        lonlat: [28.355, 54.325]
        lp: l
      - kind: event
        name: Smorgon
        date: 5 December 1812
        text: Napoleon handed command to Murat and left for Paris by sledge.
        lonlat: [26.4, 54.484]
      - kind: event
        name: Vilnius
        date: 8–10 December 1812
        text: Thousands of men died in the cold and the disorder as the remnants of the army passed through.
        lonlat: [25.28, 54.687]
      - kind: event
        name: Kaunas
        date: about 14 December 1812
        text: Ney’s rearguard fought its way out, and the last organised troops recrossed the Niemen.
        lonlat: [23.933, 54.9]
      - kind: treaty
        name: Convention of Tauroggen
        date: 30 December 1812
        text: Yorck agreed with the Russian general Diebitsch to keep his Prussian corps neutral, without his king’s approval.
        lonlat: [22.29, 55.252]
