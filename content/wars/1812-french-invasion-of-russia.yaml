steps:
  - title: Across the Niemen
    date: June – July 1812
    when: "1812-06-24"
    borders: "1812-06-24"
    countries: [lt, by, pl, ru, fr]
    body:
      - The alliance that Napoleon and Alexander I had made at Tilsit in 1807 broke down over the Continental System, his blockade of British trade, which Russia had given up, and over Poland. Napoleon gathered the largest army Europe had yet seen, roughly 450,000 men in the first wave and more than 600,000 in all. On 24 June 1812 its main body began crossing the Niemen from the Duchy of Warsaw on pontoon bridges near Kaunas. The two Russian armies in the west, under Mikhail Barclay de Tolly and Pyotr Bagration, had together some 180,000–220,000 men, and they fell back rather than be destroyed one at a time.
      - Napoleon entered Vilnius on 28 June and stayed there for more than two weeks. A provisional government of Lithuania was set up, and in Warsaw a confederation proclaimed the restoration of the Kingdom of Poland. Heat, storms, bad roads and the failure of the supply trains cost the Grande Armée tens of thousands of men and horses before any great battle. Bagration escaped Marshal Davout after a fight at Saltanovka near Mogilev, Barclay’s rearguard fought at Ostrovno near Vitebsk, and in early August the two Russian armies joined at Smolensk.
    facts:
      - [Crossing of the Niemen, "24 June 1812"]
      - [Grande Armée, "about 450,000 in the first wave, more than 600,000 in all"]
      - [Russian armies in the west, "about 180,000–220,000"]
