  - title: Smolensk
    date: August 1812
    when: "1812-08-16"
    borders: "1812-08-18"
    countries: [ru, fr]
    body:
      - Napoleon tried to swing south of the Russians and seize Smolensk behind them. On 14 August at Krasnoi, General Dmitry Neverovsky’s division of about 7,000 men held off Murat’s cavalry in a fighting retreat, buying a day for the city to be reinforced. On 16 and 17 August the French attacked Smolensk, whose old walls were held first by Nikolay Raevsky’s corps and then by Dmitry Dokhturov’s. The city caught fire, and on the night of 17–18 August Barclay ordered it abandoned, blew up the powder stores and burned the bridge over the Dnieper.
      - Both sides lost many thousands of men, and much of the city was destroyed. On 19 August at Valutino the Russian rearguard held off Ney and Murat while the army escaped along the Moscow road. The long retreat had made Barclay, a general of Baltic German descent, deeply unpopular, and on 20 August Alexander gave the supreme command to the 67-year-old Mikhail Kutuzov. He joined the army at the end of the month and kept falling back towards Moscow while looking for a place to fight.
    facts:
      - [Battle of Smolensk, "16–18 August 1812"]
      - [Battle of Valutino, "19 August 1812"]
      - [Kutuzov appointed, "20 August 1812"]
    markers:
      - kind: battle
        name: Krasnoi
        date: 14 August 1812
        text: Neverovsky’s infantry formed squares and retreated for miles under repeated cavalry charges, delaying the French advance on Smolensk.
        lonlat: [31.43, 54.56]
      - kind: battle
        side: fr
        name: Battle of Smolensk
        date: 16–18 August 1812
        text: The French stormed the suburbs but not the walls. The Russians left the burning city on the third night.
        lonlat: [32.05, 54.783]
        lp: l
      - kind: battle
        name: Battle of Valutino
        date: 19 August 1812
        text: A hard rearguard fight east of Smolensk. The French held the field, but the Russian army got away.
        lonlat: [32.37, 54.84]
    arrows:
      - side: fr
        label: Napoleon
        phase: 1
        via: [[30.4, 54.55], [31.2, 54.6], [31.95, 54.75]]
      - side: ru
