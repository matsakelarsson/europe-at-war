id: french-invasion-of-russia
name: French Invasion of Russia
start: "1812-06-24"
end: "1812-12-14"
tier: A
summary: Napoleon’s invasion of the Russian Empire in 1812 with a multinational Grande Armée of more than 600,000 men, known in Russia as the Patriotic War of 1812. The Russian armies retreated, fought at Smolensk and Borodino and gave up Moscow, which burned; after five weeks Napoleon turned back, and hunger, cold, disease and Russian attacks destroyed most of his army before the survivors recrossed the Niemen in December.
countries: [ru, by, lt, pl, fr]
sides:
  - id: fr
    name: France and its allies
    polities: [france, duchy-of-warsaw]
    ink: navy
    moves: French and allied moves
    success: French success
  - id: ru
    name: Russian Empire
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
notes:
  - Dates are New Style (Gregorian). Russia used the Julian calendar, then 12 days behind, so Russian sources date the crossing of the Niemen to 12 June and the Battle of Borodino to 26 August 1812.
  - The size of the Grande Armée and its losses are estimates, and sources differ widely. Only about half of it was French; the rest came from the Duchy of Warsaw, the German states, Italy, Austria, Prussia, Switzerland and elsewhere. Napoleon called the campaign the Second Polish War.
  - The Napoleonic Wars as a whole are told in another story; this one covers only the Russian campaign of 1812. Places are named in their present-day forms.
