notes:
  - Korean records date the rising by the lunar calendar (it began on the 18th day of the twelfth month of 1811). The dates here are the Gregorian equivalents given in the English and Korean Wikipedia articles.
  - Old Gasan county, where the rising began, is now part of North Pyongan’s Pakchon and Unjon counties. Jeongju is today’s Chongju, North Pyongan (not the Cheongju of North Chungcheong).
