steps:
  - title: The rising north of the Cheongcheon
    date: January – February 1812
    when: "1812-01"
    borders: "1812-02-11"
    countries: [kp]
    body:
      - Pyongan, on the road to China, had grown rich on trade and gold mining, but its men were barred in practice from high office in Hanseong. The rebels’ manifesto complained that the court treated the province like “rotten earth”. Hong Gyeong-nae spent about ten years building a network with the geomancer U Gun-chik, the scholar Kim Chang-si, the gentleman Kim Sa-yong and merchants such as Yi Hui-jeo, who paid for the rising. At Dabokdong, near the Daeryeong River in Gasan, they gathered landless peasants and labourers on the pretext of working a gold mine. The disastrous harvest of 1811 gave them their moment.
      - On the night of 31 January 1812 Yi Hui-jeo’s band seized the county office at Gasan and killed the magistrate. Hong, who took the title Pyeongseo Daewonsu, grand marshal of the west, led the southern army, which took Gasan, Bakcheon and Taecheon without resistance; Kim Sa-yong’s northern army took Gwaksan and Jeongju and went on through Seoncheon and Cheolsan to Yongcheon, threatening Uiju. In each town the rebels appointed local notables to govern in their name and distributed government grain.
      - The rising lost momentum when its supporters in Yeongbyeon were discovered and executed, and an internal quarrel delayed the attack on Anju, the seat of the provincial army command. On 11 February the provincial army commander Yi Hae-u and the magistrate of Anju, with troops brought by Yi Yeong-sik, the magistrate of Gwaksan who had escaped from the rebels, attacked Hong’s army at Songnim, across the Cheongcheon from Anju, and routed it.
    facts:
      - [Rising at Gasan, "31 January 1812"]
      - [Towns taken, "eight, north of the Cheongcheon River"]
      - [Battle of Songnim, "11 February 1812, government victory"]
