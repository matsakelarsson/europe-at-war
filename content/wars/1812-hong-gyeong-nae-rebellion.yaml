id: hong-gyeong-nae-rebellion
name: Hong Gyeong-nae’s rebellion
start: "1812-01-31"
end: "1812-05-29"
tier: B
summary: "A rising in Pyongan province, in north-western Korea, led by Hong Gyeong-nae, an impoverished yangban and geomancer, with discontented local gentry, merchants and miners, after a year of famine. They resented the discrimination of the court in Hanseong against men of the north-west and the burden of compulsory grain loans and taxes, and drew on prophecies of the fall of the Yi dynasty. Rising at Gasan on the night of 31 January 1812, they took eight towns north of the Cheongcheon River within days and opened the government granaries, but were beaten at Songnim near Bakcheon on 11 February and soon after near Gwaksan, and fell back into the walled town of Jeongju. There the rebels and the peasants who had fled to them held out against the government army for about a hundred days, until the wall was blown open by a mine on 29 May 1812. Hong was killed; of 2,983 people taken, 1,917 were executed. The rising is also called the Pyeongan or Gwanseo peasant war."
countries: [kp]
sides:
