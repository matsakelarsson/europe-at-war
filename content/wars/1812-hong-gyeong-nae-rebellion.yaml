  - title: The siege of Jeongju
    date: February – May 1812
    when: "1812-02"
    borders: "1812-05-29"
    countries: [kp]
    body:
      - After Songnim the government troops retook Bakcheon and Gasan, looting and killing as they went, and the northern rebel army, attacked by a militia from Uiju, was defeated at Sasongpyeong near Gwaksan. The rebel leaders and thousands of peasants from Gasan and Bakcheon, who feared the government troops more than a siege, shut themselves up in Jeongju. A punitive army sent from Hanseong under Yi Yo-heon arrived outside the town in mid-February. By then every other town had been retaken.
      - For about a hundred days the defenders beat off assaults and made sorties, while their hopes of help from the hunters of the northern frontier towns, from a rising in Hanseong or even from Qing troops came to nothing. The besiegers dug a tunnel under the wall and on 29 May 1812 blew a breach in it with gunpowder. Hong Gyeong-nae was killed by a bullet in the fighting; U Gun-chik, Hong Chong-gak and other leaders were taken to Hanseong and beheaded. Of the 2,983 people captured in the town, the 842 women and the boys under ten were spared, and the remaining 1,917 were executed.
      - The rising failed, but it showed how deep the discontent ran in the provinces. It was followed by the peasant risings of 1862 in the south and, in 1894, by the Donghak revolution.
