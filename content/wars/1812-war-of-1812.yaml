  - title: York, Fort George and Beaver Dams
    date: April – June 1813
    when: "1813-04-27"
    borders: "1813-04-27"
    countries: [ca, us, gb]
    body:
      - "Whoever controlled the Great Lakes could move armies and supplies, and both sides built fleets: the Americans under Isaac Chauncey at Sackets Harbor, the British at Kingston, under James Lucas Yeo from May 1813. On 27 April 1813 some 1,700 American troops under Henry Dearborn and Zebulon Pike landed at York, the small capital of Upper Canada. The retreating British blew up their powder magazine, killing Pike and many of his men. The Americans looted the town and burned the parliament buildings, which the British later cited as a reason for burning Washington."
      - "On 27 May an amphibious assault led by Winfield Scott and Oliver Hazard Perry took Fort George at the mouth of the Niagara, and the British fell back. Two days later Governor General Sir George Prevost’s attack on Sackets Harbor was beaten off. As the Americans followed the British towards Burlington Heights, John Harvey’s night attack at Stoney Creek on 6 June routed them and captured both their generals."
      - "On 24 June several hundred warriors, most of them Mohawk from Kahnawake in Lower Canada, with others from the Grand River, ambushed an American column of about 600 men under Charles Boerstler near Beaver Dams; Boerstler surrendered to the British officer James FitzGibbon, who had been warned of the column’s approach by Laura Secord, a settler who walked some 30 km to bring the news. The Americans were left holding little more than Fort George."
    facts:
      - [Battle of York, "27 April 1813"]
      - [Capture of Fort George, "27 May 1813"]
      - [Battle of Stoney Creek, "6 June 1813"]
      - [Battle of Beaver Dams, "24 June 1813"]
