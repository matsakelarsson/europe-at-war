  - title: The blockade and the Chesapeake
    date: 1813–1814
    when: "1813-06-01"
    borders: "1813-06-01"
    countries: [us, gb]
    body:
      - "The Royal Navy tightened its blockade from the Chesapeake and the Delaware to the whole coast; New England, whose merchants traded with the British, was spared until 1814. American overseas trade collapsed, customs revenue fell and the government came close to bankruptcy. On 1 June 1813 HMS Shannon captured the frigate USS Chesapeake outside Boston in a fight of ten to fifteen minutes; the dying American captain, James Lawrence, called out “Don’t give up the ship,” words Perry later flew on his flag on Lake Erie."
      - "Rear Admiral George Cockburn raided the shores of the Chesapeake. In the spring of 1813 his men burned Havre de Grace and other towns at the head of the bay. An attack on Craney Island, guarding Norfolk, was beaten off on 22 June, and three days later British troops took Hampton, where some of them plundered the town and assaulted its inhabitants, as British officers admitted."
      - "Enslaved people rowed out to the British ships in their thousands. In April 1814 Vice Admiral Sir Alexander Cochrane proclaimed that anyone who wished to leave the United States would be received as a free settler in a British colony or could join British service. Cockburn built Fort Albion on Tangier Island and raised a Corps of Colonial Marines from formerly enslaved men, who fought in the raids of 1814 and at Bladensburg. About 4,000 people won their freedom with the British during the war; after it some 2,000 settled in Nova Scotia and New Brunswick as the Black Refugees, and several hundred former Colonial Marines and their families in Trinidad."
    facts:
      - [HMS Shannon captures USS Chesapeake, "1 June 1813"]
      - [Havre de Grace burned, "3 May 1813"]
      - [Cochrane’s proclamation, "2 April 1814"]
      - [People freed with the British, "about 4,000"]
