  - title: Chippawa, Lundy’s Lane and Fort Erie
    date: July – November 1814
    when: "1814-07-25"
    borders: "1814-07-25"
    countries: [ca, us, gb]
    view:
      center: [-79.000, 43.070]
      size: [80, 70]
    body:
      - "By 1814 the United States Army had better generals, such as Jacob Brown and Winfield Scott, while Napoleon’s abdication in April freed British veterans to sail for America. On 3 July Brown crossed the Niagara and took Fort Erie. On 5 July at Chippawa, Scott’s well-drilled brigade beat Phineas Riall’s British regulars. In the woods beside the battle Seneca and other New York Haudenosaunee fighting for the United States clashed with the Grand River Haudenosaunee and other warriors on the British side; the losses among relatives on both sides led the Haudenosaunee on both banks to withdraw from the campaign."
      - "On the evening of 25 July the armies met again at Lundy’s Lane, near Niagara Falls, and fought into the night. Each side lost about 850 to 880 killed, wounded or captured, making it one of the bloodiest battles of the war; Brown, Scott and the British commander Gordon Drummond were wounded and Riall captured. The Americans held part of the field at midnight, then withdrew to Fort Erie."
      - "Drummond besieged Fort Erie from early August. His night assault on 15 August failed when a magazine exploded under his attacking columns, and he lost some 900 men; an American sortie on 17 September destroyed some of his batteries, and he lifted the siege. On 5 November the Americans blew up Fort Erie and withdrew across the river. The last invasion of Upper Canada had ended where it began."
    facts:
      - [Battle of Chippawa, "5 July 1814"]
      - [Battle of Lundy’s Lane, "25 July 1814"]
      - [Siege of Fort Erie, "4 August – 21 September 1814"]
