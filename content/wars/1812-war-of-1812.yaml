  - title: Queenston Heights
    date: October – December 1812
    when: "1812-10-13"
    borders: "1812-10-13"
    countries: [ca, us, gb]
    view:
      center: [-79.000, 43.070]
      size: [80, 70]
    body:
      - "On the Niagara River Major General Stephen Van Rensselaer, a New York militia general, gathered some 6,000 regulars and militia. Before dawn on 13 October 1812 his troops began crossing from Lewiston to Queenston. Regulars under Captain John Wool climbed the heights by a fishermen’s path and took the British battery, and Brock was killed leading a counter-attack up the slope."
      - "His successor, Roger Sheaffe, gathered troops from Fort George and Chippawa and climbed the heights from behind. Haudenosaunee warriors from the Grand River under John Norton (Teyoninhokarawen) and John Brant pinned the Americans down, and a company of Black volunteers raised by Robert Runchey, among them the veteran Richard Pierpoint, fought in Sheaffe’s line. On the American bank many New York militiamen refused to cross, saying they were bound to serve only in their own state. Lieutenant Colonel Winfield Scott surrendered on the heights with nearly 1,000 men; the British lost 14 killed and Norton’s warriors 5."
      - "A second invasion attempt across the upper Niagara in November and an advance on Montreal that stopped at Lacolle the same month achieved nothing. At sea the small United States Navy won a string of single-ship fights: USS Constitution destroyed HMS Guerriere off Nova Scotia on 19 August, USS United States captured HMS Macedonian in October, and Constitution destroyed HMS Java off Brazil in December, while American privateers took hundreds of British merchant ships. The Royal Navy answered with a blockade of the Chesapeake and the Delaware that it extended along the coast in 1813 and 1814."
    facts:
      - [Battle of Queenston Heights, "13 October 1812"]
      - [Americans captured, "nearly 1,000"]
      - [Constitution and Guerriere, "19 August 1812"]
