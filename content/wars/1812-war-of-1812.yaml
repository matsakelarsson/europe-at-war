  - title: Washington and Baltimore
    date: August – September 1814
    when: "1814-08-24"
    borders: "1814-08-24"
    countries: [us, gb]
    body:
      - "To draw American troops away from Canada and to avenge York and Newark, the British struck at the Chesapeake. Major General Robert Ross landed about 4,500 men, veterans of Wellington’s army, Royal Marines and Colonial Marines, at Benedict on the Patuxent on 19–20 August 1814; Joshua Barney had to burn his gunboat flotilla upriver. On 24 August at Bladensburg the American militia under William Winder broke and fled, a rout mocked as the “Bladensburg races”; Barney’s sailors and marines, among them Black seamen such as Charles Ball, held their ground longest. President Madison and his government fled, and Dolley Madison and the household’s enslaved and free servants saved Gilbert Stuart’s portrait of Washington from the President’s House."
      - "That evening the British burned the Capitol with the Library of Congress, the President’s House, the Treasury and the War Office; the Americans burned their own Navy Yard. A violent storm the next day added to the damage, and the British withdrew to their ships. A squadron sailing up the Potomac forced Alexandria to surrender its shipping and goods on 29 August."
      - "Baltimore was next. On 12 September the British landed at North Point; Ross was killed by an American marksman before the battle, and his successor pushed back the Maryland militia but found some 10,000 men entrenched on Hampstead Hill before the city. From 13 to 14 September the fleet bombarded Fort McHenry for about 25 hours with mortar bombs and rockets, but the fort under Major George Armistead held, and the British withdrew. Francis Scott Key, who watched from a ship in the harbour, wrote the poem that became “The Star-Spangled Banner”, the national anthem from 1931; its rarely sung third verse mocks the “hireling and slave”, which many historians read as a reference to the Colonial Marines."
    facts:
      - [Battle of Bladensburg, "24 August 1814"]
      - [Washington burned, "24–25 August 1814"]
      - [Battle of North Point, "12 September 1814"]
      - [Bombardment of Fort McHenry, "13–14 September 1814"]
