  - title: The Treaty of Ghent
    date: December 1814 – 1818
    when: "1814-12-24"
    borders: "1815-02-17"
    countries: [us, ca, gb]
    body:
      - "Peace talks began at Ghent in August 1814 between British commissioners and an American delegation that included John Quincy Adams, Henry Clay and Albert Gallatin. Britain first demanded a Native buffer state in the Northwest and changes to the border. After Plattsburgh and Baltimore, and advised by the Duke of Wellington that without control of the lakes Britain could not claim territory, the British government settled for peace on the pre-war terms. The treaty, signed on 24 December 1814, returned all conquered land; it said nothing about impressment or neutral rights, which had lost their importance with Napoleon’s fall. The Senate approved it unanimously on 16 February 1815, and the war ended when ratifications were exchanged in Washington the next day."
      - "In the upper Mississippi valley the war had gone Britain’s way: British, Canadian, Menominee, Ho-Chunk and Meskwaki forces took Prairie du Chien in July 1814, Sauk, Meskwaki and Kickapoo warriors under Black Hawk turned back American boats at the Rock Island rapids, an American attack on Mackinac Island was beaten off in August, and some fighting went on there into 1815. Article IX of the treaty promised to restore to the Native nations the possessions, rights and privileges they had had in 1811, but the United States did not honour it and Britain did not press it; the Muscogee cession at Fort Jackson stood, and the nations of the Northwest had to make separate treaties with the United States from 1815 on. Britain paid American slaveholders $1,204,960 in 1826 for enslaved people it had carried away, but the people themselves stayed free."
      - "Both countries claimed success. For Canadians the defeat of the invasions became a founding story, with Brock, Tecumseh, de Salaberry and Laura Secord as its heroes; Americans gained an anthem and a new self-confidence, and some later called it a second war of independence, a label many historians question. For the Native nations of the Great Lakes it ended the hope of keeping their lands with British help. The Rush–Bagot Agreement of 1817 limited warships on the Great Lakes, and the treaty of 1818 drew the border along the 49th parallel from the Lake of the Woods to the Rocky Mountains."
    facts:
      - [Treaty of Ghent signed, "24 December 1814"]
      - [Senate approval, "16 February 1815"]
      - [Ratifications exchanged, "17 February 1815"]
      - [Terms, "pre-war borders restored (status quo ante bellum)"]
