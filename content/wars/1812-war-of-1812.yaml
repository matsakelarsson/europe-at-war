  - title: Lake Erie and the Thames
    date: September – October 1813
    when: "1813-10-05"
    borders: "1813-10-05"
    countries: [us, ca, gb]
    link: { href: "#/war/tecumsehs-war", text: Tecumseh’s War }
    body:
      - "At Presque Isle (Erie, Pennsylvania) Oliver Hazard Perry built a squadron, manned in part by Black sailors, as much of the US Navy then was. On 10 September 1813, near Put-in-Bay, he attacked Robert Barclay’s British squadron. Perry’s flagship Lawrence was shot to pieces, but he had himself rowed to the Niagara and broke the British line; all six British ships surrendered. “We have met the enemy and they are ours,” he wrote to Harrison."
      - "Cut off from supplies by water, Procter abandoned Detroit and Amherstburg and retreated up the Thames, over Tecumseh’s angry protests. Harrison landed in Upper Canada with some 3,000 men and caught up with him near Moraviantown on 5 October. Richard Mentor Johnson’s Kentucky mounted riflemen broke the British line at the first charge; Tecumseh and about 500 warriors fought on in the swamp beside it until he was killed. Harrison burned Moraviantown, a mission town of Christian Lenape, before withdrawing to Detroit."
      - "Tecumseh’s death broke up the confederacy he had built. Many of the nations of the Northwest made truces with Harrison, while others followed the British to Burlington. The Americans held Lake Erie and the Detroit frontier for the rest of the war, and Procter was court-martialled for the retreat."
    facts:
      - [Battle of Lake Erie, "10 September 1813"]
      - [Battle of the Thames (Moraviantown), "5 October 1813"]
      - [Forces at the Thames, "Harrison 2,500–3,000; Procter fewer than 1,000, about half of them Native warriors"]
      - [Death of Tecumseh, "5 October 1813"]
