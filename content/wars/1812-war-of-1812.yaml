id: war-of-1812
name: War of 1812
start: "1812-06-18"
end: "1815-02-17"
tier: A
summary: "The war between the United States and the United Kingdom, with its colonies in Canada and its Native allies, from 1812 to 1815. The United States declared war on 18 June 1812 over British restrictions on its trade with Napoleonic France, the impressment of American sailors into the Royal Navy and British support for the Native nations resisting American expansion in the Northwest, and many Americans hoped to conquer Canada. American invasions of Upper and Lower Canada failed in 1812 and 1813, against British regulars, Canadian militia and Native warriors, among them Tecumseh’s confederacy, whose leader was killed at the Thames in 1813 after the American naval victory on Lake Erie. York, the capital of Upper Canada, was burned in 1813, and after Napoleon’s fall British forces burned Washington in August 1814, but were beaten off at Baltimore and on Lake Champlain at Plattsburgh in September. The Treaty of Ghent, signed on 24 December 1814, restored the pre-war borders; before the news arrived, Andrew Jackson defeated the British attack on New Orleans on 8 January 1815. The war ended Native hopes of British-backed resistance south of the Great Lakes and became a founding story for Canadians; some Americans came to remember it as a “second war of independence”."
countries: [us, ca, gb]
sides:
  - id: us
    name: United States (with Seneca and other New York Haudenosaunee, Choctaw, Cherokee and Muscogee allies)
    polities: [united-states]
    ink: blue
    moves: American moves
    success: American success
  - id: gb
    name: United Kingdom, with Upper and Lower Canada, Nova Scotia and New Brunswick (British regulars, Canadian militia and the Colonial Marines)
    polities: [united-kingdom, upper-canada, lower-canada, nova-scotia, new-brunswick]
    ink: red
    moves: British and Canadian moves
    success: British and Canadian success
  - id: nat
    name: Tecumseh’s confederacy and other Native allies of Britain (Shawnee, Potawatomi, Wyandot, Odawa, Ojibwe, Sauk, Kickapoo, Grand River Haudenosaunee, Kahnawake Mohawk and others)
    polities: [western-confederacy]
    ink: orange
    moves: Native allies’ moves
    success: Native allies’ success
notes:
  - The war against the Red Sticks in present-day Alabama in 1813–1814 is told in the Creek War, and Tecumseh’s struggle before 1812 in Tecumseh’s War. British forces in America were small while the war against Napoleon went on in Europe; most of the fighting until 1814 was done by Canadian militia, British regulars and Native warriors on one side and American regulars and state militias on the other.
  - "Estimates of losses: about 2,200 Americans were killed in action and up to 15,000 died from all causes, most of them from disease; British and Canadian deaths from all causes are estimated at about 10,000. Native losses are uncertain; some estimates put Native deaths from all causes, warriors and civilians, at about 10,000."
  - About 4,000 enslaved people won their freedom by escaping to the British, most of them in the Chesapeake and on the Georgia coast; Black sailors and soldiers also served in the US Navy and in Jackson’s army at New Orleans.
