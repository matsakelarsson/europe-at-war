  - title: The River Raisin and Fort Meigs
    date: January – August 1813
    when: "1813-01-22"
    borders: "1813-01-22"
    countries: [us, ca, gb]
    body:
      - "William Henry Harrison, the governor of Indiana Territory, took command in the Northwest and planned to retake Detroit. In January 1813 part of his army under James Winchester, mostly Kentucky volunteers, pushed ahead to Frenchtown on the River Raisin and drove out its small Canadian and Native garrison on 18 January. Four days later Henry Procter crossed the frozen Detroit River with some 600 British and Canadian troops and 600 to 800 warriors led by the Wyandot chief Roundhead and others, and attacked at dawn on 22 January. Winchester was captured, and his army lost about 400 killed and more than 500 captured."
      - "Procter marched the prisoners who could walk to Amherstburg and left the badly wounded in the town’s houses, under a weak guard. On 23 January warriors returned, killed between about 30 and 100 of the wounded prisoners and burned the houses. American accounts called it the River Raisin massacre, and “Remember the Raisin” became the battle cry of Kentucky soldiers for the rest of the war."
      - "Harrison built Fort Meigs at the rapids of the Maumee, and Procter and Tecumseh besieged it from 28 April to 9 May. On 5 May Kentucky militia under William Dudley spiked the British guns across the river but then chased the warriors into the woods and were cut off; about 500 were captured and many killed, and warriors began killing prisoners until Tecumseh stopped them. A second siege in July failed, and on 2 August George Croghan’s 160 men at Fort Stephenson beat off Procter’s assault. Tecumseh, whose warriors bore much of the fighting, hoped that a British victory would secure a homeland for the Native nations."
    facts:
      - [Battle of Frenchtown, "22 January 1813"]
      - [American losses, "about 400 killed, more than 500 captured"]
      - [Siege of Fort Meigs, "28 April – 9 May 1813"]
      - [Fort Stephenson holds, "2 August 1813"]
