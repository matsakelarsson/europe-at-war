  - title: Plattsburgh and the occupation of Maine
    date: July 1814 – January 1815
    when: "1814-09-11"
    borders: "1814-09-11"
    countries: [us, ca, gb]
    body:
      - "Sir George Prevost marched south from Montreal along the west side of Lake Champlain with some 10,000 troops, many of them veterans of the Peninsular War. At Plattsburgh Alexander Macomb held the line of the Saranac River with about 3,400 men, many of them militia. On 11 September 1814 Thomas Macdonough’s American squadron, anchored in Plattsburgh Bay, defeated the British squadron of George Downie, who was killed. Without control of the lake Prevost called off his attack and retreated to Canada, to the fury of his officers; he was recalled to face a court martial and died before it met."
      - "In the east British forces from Halifax occupied Eastport on Moose Island in July 1814. In September Sir John Coape Sherbrooke took Castine at the mouth of the Penobscot, scattered the militia at Hampden and occupied Bangor and Machias. Maine east of the Penobscot was governed by Britain until April 1815, and the customs duties collected at Castine later helped to found Dalhousie University in Halifax."
      - "In New England, where the war and the embargo had ruined trade, Federalist delegates met at the Hartford Convention from 15 December 1814 to 5 January 1815 and demanded changes to the Constitution. Their envoys reached Washington just as the news of New Orleans and of peace arrived, and the party never recovered from the charge of disloyalty."
    facts:
