steps:
  - title: Declaration of war and the fall of Detroit
    date: June – August 1812
    when: "1812-08-16"
    borders: "1812-08-16"
    countries: [us, ca, gb]
    body:
      - "During the long war between Britain and Napoleon both sides seized American ships trading with the enemy. British Orders in Council closed European ports to neutral trade, and the Royal Navy stopped American ships to take off sailors it claimed as British subjects, impressing thousands of Americans; in 1807 HMS Leopard fired on the USS Chesapeake off Virginia. In the Northwest, Americans blamed British agents in Canada for the resistance of Tecumseh’s confederacy. Young “War Hawks” in Congress such as Henry Clay wanted to defend American honour and saw an easy conquest of Canada, whose largest province, Upper Canada, had only about 75,000 people, many of them recent arrivals from the United States. After President James Madison set out American grievances in a message to Congress, it declared war on 18 June 1812, by 79 votes to 49 in the House and 19 to 13 in the Senate; New England’s Federalists voted against. Five days later, unaware of the vote, Britain repealed the Orders in Council."
      - "In all of British North America there were only about 5,200 British regulars, but Upper Canada’s commander, Major General Isaac Brock, moved first. On 17 July a force of British soldiers, Canadian fur traders and some 400 Native warriors, most of them Odawa and Ojibwe, from St. Joseph Island surprised Fort Mackinac, whose garrison had not heard that war had been declared. General William Hull crossed from Detroit into Upper Canada on 12 July, but after Tecumseh’s warriors ambushed his supply columns at Brownstown he fell back to Detroit in early August."
      - "Brock sailed up Lake Erie with reinforcements and joined Tecumseh at Amherstburg. With about 1,300 men, regulars, militia and some 600 warriors, he crossed the Detroit River, and on 16 August 1812 Hull, fearing a massacre of the town’s civilians if it was stormed, surrendered Detroit and more than 2,000 soldiers. The day before, the garrison of Fort Dearborn at Chicago, ordered to leave, had been attacked by some 400 to 500 Potawatomi warriors as it marched out; its commander, Nathan Heald, reported 52 soldiers, militiamen, women and children killed, and the rest were taken prisoner. American power in the Northwest collapsed, and Hull was later court-martialled."
    facts:
      - [Declaration of war, "18 June 1812"]
      - [Fort Mackinac taken, "17 July 1812"]
      - [Battle of Fort Dearborn, "15 August 1812"]
      - [Surrender of Detroit, "16 August 1812"]
