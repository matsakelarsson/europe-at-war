  - title: Chateauguay, Crysler’s Farm and the burning of the Niagara frontier
    date: October – December 1813
    when: "1813-10-26"
    borders: "1813-10-26"
    countries: [ca, us, gb]
    body:
      - "In the autumn of 1813 the Americans sent two armies against Montreal. Wade Hampton advanced from Lake Champlain up the Chateauguay River with about 2,600 regulars. On 26 October some 1,500 Canadian Voltigeurs, fencibles, militia and Mohawk and other warriors under Lieutenant Colonel Charles-Michel de Salaberry, most of them French Canadians, stopped him at a line of felled trees, and he retreated."
      - "James Wilkinson’s army of some 8,000 men came down the St. Lawrence from Sackets Harbor in boats. At Crysler’s Farm on 11 November some 800 to 1,200 British regulars, Canadian militia and Mohawk warriors (counts differ) under Joseph Morrison defeated a much larger American force guarding the rear of the flotilla, and Wilkinson gave up the campaign and went into winter quarters. Lower Canada, whose French-speaking majority many Americans had expected to welcome them, had stood by Britain."
      - "On the Niagara the American militia left Fort George on 10 December and burned the town of Newark (Niagara-on-the-Lake), turning its people out into the winter. The British answered quickly: on 19 December they took Fort Niagara by a night bayonet attack, and in the following days British troops and their Native allies burned Lewiston, Black Rock and Buffalo. The war on the border had become a war on civilians."
    facts:
      - [Battle of the Chateauguay, "26 October 1813"]
      - [Battle of Crysler’s Farm, "11 November 1813"]
      - [Newark burned, "10 December 1813"]
      - [Fort Niagara taken, "19 December 1813"]
    markers:
      - kind: battle
        side: gb
        name: Chateauguay
        date: 26 October 1813
        text: De Salaberry’s Voltigeurs, militia and Mohawk warriors turned back Hampton’s army.
        lonlat: [-73.929, 45.159]
        lp: l
      - kind: battle
        side: gb
        name: Crysler’s Farm
        date: 11 November 1813
        text: Morrison’s small force beat the rear of Wilkinson’s army, ending the advance on Montreal.
        lonlat: [-75.130, 44.930]
        lp: b
      - kind: held
        side: gb
        name: Montreal
        date: "1813"
        text: The goal of both American armies.
        lonlat: [-73.554, 45.508]
      - kind: taken
        side: gb
