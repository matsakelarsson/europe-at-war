  - title: New Orleans
    date: September 1814 – February 1815
    when: "1815-01-08"
    borders: "1815-01-08"
    countries: [us, gb, es]
    link: { href: "#/war/creek-war", text: Creek War }
    body:
      - "After the Creek War, Andrew Jackson commanded on the Gulf coast. The British used Spanish Pensacola as a base; Royal Marines under Edward Nicolls landed there and armed Red Stick refugees and people who had escaped from slavery. A British attack on Fort Bowyer, guarding Mobile Bay, was beaten off on 15 September 1814, and on 7 November Jackson seized Pensacola from its Spanish garrison and drove the British out."
      - "In December a British fleet under Cochrane brought an army from Jamaica, commanded from Christmas Day by Sir Edward Pakenham. On 14 December the fleet’s boats captured the American gunboats on Lake Borgne, and on 23 December the British advance guard reached the Mississippi a few kilometres below New Orleans, where Jackson attacked it that night. Jackson’s army of some 4,000 to 5,000 men, US regulars, Tennessee and Kentucky militia, Louisiana militia including two battalions of free men of colour, Choctaw warriors and Jean Lafitte’s Baratarian privateers, dug in behind the Rodriguez Canal at Chalmette."
      - "On the morning of 8 January 1815 Pakenham sent his columns across open fields against the earthworks. In less than an hour about 2,000 British soldiers were killed, wounded or captured, Pakenham among the dead; the Americans lost 13 killed and some 60 wounded and missing on the main line that day. The battle was fought two weeks after the peace had been signed at Ghent, though before it took effect. The British withdrew and took Fort Bowyer on 12 February, just before the news of peace reached them. The victory made Jackson a national hero and, in 1828, president."
    facts:
      - [Jackson takes Pensacola, "7 November 1814"]
      - [Battle of Lake Borgne, "14 December 1814"]
      - [Battle of New Orleans, "8 January 1815"]
      - [British losses on 8 January, "about 2,000 killed, wounded and captured"]
