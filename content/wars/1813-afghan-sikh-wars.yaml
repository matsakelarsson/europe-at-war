  - title: Kashmir
    date: 1814 and 1819
    when: "1819-07-03"
    borders: "1819-07-15"
    countries: [in, pk]
    body:
      - Ranjit Singh had not given up Kashmir. In the summer of 1814 he sent two columns over the passes of the Pir Panjal range, one under Ram Dayal, Mokham Chand’s grandson, and one under his own command. Heavy rain, lack of food, cholera and the resistance of the governor, Muhammad Azim Khan, another of the Barakzai brothers, stopped them. Ram Dayal’s column, which had fought its way into the valley, had to negotiate its way out. It was one of Ranjit Singh’s worst failures.
      - Four years later the Durrani Empire fell apart. In 1817 Fateh Khan was blinded on the orders of Mahmud Shah’s son Kamran, and in 1818 he was put to death; his brothers rose against the Sadozai shahs, and Azim Khan left Kashmir for Kabul, leaving his brother Jabbar Khan as governor. Encouraged by Birbal Dhar, a Kashmiri revenue official who had fled to Lahore, Ranjit Singh sent an army of about 30,000 men in the spring of 1819. Its vanguard of about 12,000 under Misr Diwan Chand took Rajouri in May and crossed the Pir Panjal by several passes.
      - On 3 July 1819 (some accounts give 5 July) Diwan Chand’s troops met Jabbar Khan’s army near Shopian, at the southern edge of the valley, and after a hard fight drove it from the field; Jabbar Khan was wounded and fled to Afghanistan. Kharak Singh entered Srinagar in July and promised its people that the city would not be plundered. Kashmir, with its valuable shawl trade, remained part of the Sikh Empire until 1846, ruled by governors from Lahore.
