  - title: Nowshera
    date: 1818–1823
    when: "1823-03-14"
    borders: "1823-03-17"
    countries: [pk, af]
    body:
      - With Fateh Khan’s death the Durrani Empire broke into pieces. Mahmud Shah and Kamran kept Herat; in Kabul Azim Khan ruled through a Sadozai puppet king; other Barakzai brothers held Kandahar, and four of them, led by Yar Mohammad Khan, held Peshawar, the rich valley below the Khyber Pass. Ranjit Singh entered Peshawar briefly in November 1818. The Barakzai governor fled, but returned as soon as the Sikhs had gone and agreed to send Lahore a tribute.
      - Early in 1823 Azim Khan came down through the Khyber to win the valley back for Kabul, and called the Yusufzai and Khattak tribes to a holy war against the Sikhs. Ranjit Singh crossed the Indus at Attock on 13 March with an army of perhaps 20,000–25,000. On 14 March he attacked a tribal army of similar size that held the hill of Pir Sabak near Nowshera, while Azim Khan’s own troops stayed across the swollen Kabul River and took little part. The tribesmen threw back several attacks, and the Akali leader Phula Singh and the Gurkha commander Balbhadra Kunwar were killed before the Sikh infantry and artillery carried the hill. Estimates of the dead range from about 2,000 to 10,000, on both sides together.
      - Azim Khan withdrew to Jalalabad and died soon afterwards. The Sikhs entered Peshawar on 17 March and plundered it, but Ranjit Singh did not keep the city; he reinstated Yar Mohammad Khan as governor in return for a yearly tribute and hostages. Dost Mohammad Khan, one of the younger and ablest of the brothers, made himself master of Kabul in 1826.
