  - title: Peshawar annexed
    date: 1826–1835
    when: "1834-05-06"
    borders: "1835-05-15"
    countries: [pk, af]
    body:
      - In 1826 Sayyid Ahmad Barelvi, a reformist preacher from Rae Bareli in northern India, came to the Peshawar valley with several hundred followers and declared a holy war against the Sikhs. He won support among the Yusufzai and fought both the Sikhs and the Barakzai sardars of Peshawar, whose eldest brother, Yar Mohammad Khan, was killed in the fighting with his forces; in 1830 he briefly held Peshawar itself. His attempt to collect religious taxes and enforce his rules cost him the support of the tribal chiefs, and on 6 May 1831 a Sikh army under Prince Sher Singh killed him and Shah Ismail, with several hundred of their followers, at Balakot.
      - In 1834 the exiled Shah Shuja marched on Kandahar to win back his throne, with Ranjit Singh’s blessing, and was defeated by Dost Mohammad in July. Ranjit Singh used the moment. A Sikh army under Hari Singh Nalwa, with the young prince Nau Nihal Singh, came to Peshawar to collect the tribute and on 6 May 1834, after brief fighting, occupied the city. The sardar Sultan Mohammad Khan and his brothers withdrew, and Hari Singh Nalwa became governor, building forts to hold the valley.
      - Dost Mohammad, who had taken the title Amir al-Muminin (Commander of the Faithful), declared a holy war to recover Peshawar and in the spring of 1835 came through the Khyber with a large army of regulars and tribesmen. Ranjit Singh met him with a bigger one. There was no battle. Sikh envoys, among them the American adventurer Josiah Harlan, won over Sultan Mohammad Khan, who distrusted his half-brother, and in May Dost Mohammad, fearing that he would be surrounded, withdrew to Kabul.
    facts:
      - [Battle of Balakot, "6 May 1831, Sikh victory"]
      - [Sikhs occupy Peshawar, "6 May 1834"]
      - [Dost Mohammad withdraws, "May 1835, without a battle"]
