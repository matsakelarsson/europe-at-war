id: afghan-sikh-wars
name: Afghan–Sikh Wars
start: "1813-03"
end: "1837-05"
tier: A
summary: "The wars in which Maharaja Ranjit Singh’s Sikh Empire took the Durrani Empire’s provinces east of the Khyber Pass. As the Durrani state broke up in civil war, the Sikhs bought the fortress of Attock in 1813 and held it against the Afghan wazir Fateh Khan, stormed Multan in 1818 and conquered Kashmir in 1819. After a hard-fought victory over the Pashtun tribes and the Barakzai sardar Azim Khan at Nowshera in 1823, Peshawar became a Sikh tributary, and in 1834 it was annexed. Emir Dost Mohammad Khan of Kabul tried twice to win it back, in 1835 without a battle and in 1837 at Jamrud, where the Sikh general Hari Singh Nalwa was killed but the Afghans failed to take the fort. The loss of Peshawar shaped Afghan relations with Britain and led into the First Anglo-Afghan War."
countries: [pk, in, af]
sides:
  - id: sikh
    name: Sikh Empire
    polities: [sikh-empire]
    ink: orange
    moves: Sikh moves
    success: Sikh success
  - id: afg
    name: Durrani Empire, the Barakzai sardars and their allies
    polities: [afghanistan]
    ink: green
    moves: Afghan moves
    success: Afghan and Pashtun success
notes:
  - "The Afghan side changed during these wars. Until 1818 it was the Durrani Empire of Mahmud Shah and his wazir Fateh Khan, with governors in Attock, Multan and Kashmir. After Fateh Khan’s murder in 1818 his Barakzai brothers divided the country: Azim Khan and later Dost Mohammad Khan in Kabul, other brothers in Kandahar and Peshawar, while the Sadozai shahs kept only Herat."
  - Numbers and losses come from Sikh court chronicles, Afghan histories, European travellers and later historians, and differ widely. Ranges are given where the sources disagree.
  - The earlier wars between Ahmad Shah Durrani’s empire and the Sikh misls (1748–1800) are not part of this story.
