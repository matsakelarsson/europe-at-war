  - title: Multan
    date: February – June 1818
    when: "1818-02"
    borders: "1818-06-02"
    countries: [pk]
    body:
      - Multan, an old trading city between the Chenab and the Sutlej, was held for the Durranis by Nawab Muzaffar Khan, a Sadozai kinsman of the Afghan shahs. Ranjit Singh had marched against it again and again, in 1802, 1805, 1807, 1810, 1816 and 1817, and each time accepted tribute or presents and went home. After the death of his ablest general, Mokham Chand, in 1814, and the failure of a new attempt on Kashmir that summer, he turned to it once more.
      - Early in 1818 an army of perhaps 15,000–25,000 men, nominally under the Maharaja’s son Kharak Singh and led in the field by Misr Diwan Chand, took the nawab’s outlying forts at Khangarh and Muzaffargarh and laid siege to Multan. Ranjit Singh sent his heaviest guns, among them the great Zamzama cannon. When the walls had been breached, Akali troops under Sadhu Singh led the storm of the citadel at the beginning of June (2 June in most accounts). Muzaffar Khan died fighting at the gate with several of his sons, and the city was plundered and many of its people killed.
      - Multan gave the Sikhs a rich province and the road south towards Bahawalpur and Sindh. In the following years they also took the lands along the Indus known as the Derajat, Dera Ghazi Khan in 1819 and, after a siege, the fort of Mankera in 1821, whose nawab was left Dera Ismail Khan as a Sikh vassal.
