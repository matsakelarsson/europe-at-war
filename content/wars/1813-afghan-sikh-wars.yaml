  - title: Jamrud
    date: April – May 1837
    when: "1837-04-30"
    borders: "1837-04-30"
    countries: [pk, af]
    link: { href: "#/war/first-anglo-afghan-war", text: First Anglo-Afghan War }
    body:
      - To guard the mouth of the Khyber Pass, Hari Singh Nalwa built a fort at Jamrud, about 18 km west of Peshawar, in 1836. In the spring of 1837, while much of the Sikh army was at Lahore and Amritsar for the wedding of Nau Nihal Singh, Dost Mohammad sent an army under his sons Mohammad Akbar Khan and Mohammad Afzal Khan, with thousands of tribesmen from the Khyber. They besieged Jamrud, held by a garrison of perhaps 600–800 men under Mahan Singh.
      - Hari Singh Nalwa, who was ill, came out from Peshawar with a relief force. On 30 April 1837, in a confused battle around the fort, he was mortally wounded; Sikh accounts say he was struck by bullets, while an Afghan chronicle says he fell in single combat with Akbar Khan. He is said to have ordered that his death be kept secret until help arrived. The garrison held out, and when the main Sikh army arrived from Lahore the Afghans withdrew to Jalalabad. Estimates of the losses range from a few thousand to more than 10,000 on each side and are unreliable.
      - Both sides claimed the victory. The Afghans had killed the Sikh Empire’s most famous general, but they had taken neither Jamrud nor Peshawar. Dost Mohammad now hoped that Britain would help him regain Peshawar, and opened talks with the British envoy Alexander Burnes in Kabul in 1837–38. The Governor-General, Lord Auckland, chose Ranjit Singh instead, and the Tripartite Treaty of 1838 between Britain, Ranjit Singh and Shah Shuja led to the First Anglo-Afghan War. Peshawar remained Sikh until the British annexed the Punjab in 1849.
    facts:
      - [Battle of Jamrud, "30 April 1837"]
      - [Result, "Afghan withdrawal; Hari Singh Nalwa killed; outcome disputed"]
      - [Peshawar, "Sikh until 1849, then British"]
