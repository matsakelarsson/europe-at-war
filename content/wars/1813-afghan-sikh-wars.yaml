steps:
  - title: Kashmir and Attock
    date: 1812–1813
    when: "1813-03-09"
    borders: "1813-07-13"
    countries: [pk, in]
    body:
      - By 1812 Ranjit Singh, who had taken Lahore in 1799 and called himself Maharaja of the Punjab since 1801, had brought most of the Sikh chiefdoms (misls) between the Sutlej and the Jhelum under his rule. The British had stopped his expansion east of the Sutlej in the Treaty of Amritsar of 1809, so he looked west and north. There the Durrani Empire, founded by Ahmad Shah in 1747, was tearing itself apart. Shah Shuja had lost Kabul in 1809 to his half-brother Mahmud Shah, whose real power was his wazir Fateh Khan, eldest of the Barakzai brothers, and the Durrani governors of Attock, Multan and Kashmir paid Kabul as little as they could.
      - In 1812 Fateh Khan and Ranjit Singh agreed to take Kashmir together from its rebellious governor, Ata Muhammad Khan. About 12,000 Sikh troops under Dewan Mokham Chand joined the Afghan army, and the valley fell in February 1813. Fateh Khan then kept Kashmir and its revenue for Kabul; the Sikhs came home with Shah Shuja, who had been held prisoner there, and in June Ranjit Singh made the exiled shah give him the Koh-i-Noor diamond. Meanwhile the Durrani governor of Attock, Jahandad Khan, offered to sell his fortress, which guarded the main crossing of the Indus. Sikh troops took it over on 9 March 1813, for a sum of money and an estate in the Punjab for its governor.
      - Fateh Khan came down from Kashmir and besieged Attock in the spring. In July Mokham Chand arrived with about 10,000 men and guns, and on the plain of Chhachh near the village of Haidru the Sikh cavalry, with Hari Singh Nalwa among its leaders, routed the Afghans on 13 July 1813 (some historians give 9 July). Fateh Khan was wounded and his younger brother Dost Mohammad Khan badly hurt, and Afghan losses were put at 2,000–3,000 killed and wounded. It was the first defeat of a Durrani army by the Sikhs in the open field, and Attock stayed Sikh.
    facts:
      - [Kashmir taken by the joint expedition, "February 1813"]
      - [Attock handed over to the Sikhs, "9 March 1813"]
      - [Battle of Attock, "13 July 1813, Sikh victory"]
