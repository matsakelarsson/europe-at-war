id: creek-war
name: Creek War
start: "1813-07-22"
end: "1814-08-09"
tier: B
summary: "A civil war within the Muscogee (Creek) Confederacy that became a war with the United States, in present-day Alabama and Georgia. The Red Sticks, a movement strongest in the Upper Creek towns and inspired in part by Tecumseh’s visit in 1811 and by Muscogee prophets, rejected the American ways and land cessions that the Creek National Council and the United States agent Benjamin Hawkins promoted. After the council executed Red Stick warriors who had killed settlers, fighting broke out among the Creeks in 1813. Mississippi militia attacked a Red Stick party returning with Spanish arms at Burnt Corn Creek in July, and on 30 August 1813 the Red Sticks took Fort Mims, killing some 250 to 500 militiamen, settlers, Creeks of the council side and enslaved people. Armies from Tennessee, Georgia and Mississippi Territory invaded the Creek country, with Cherokee, Choctaw and allied Creek warriors; Andrew Jackson’s Tennessee army destroyed Red Stick towns and on 27 March 1814 broke the Red Sticks at Horseshoe Bend, where more than 800 of them died. By the Treaty of Fort Jackson of 9 August 1814 Jackson made the Creek Nation, including his own Creek allies, cede some 21 to 23 million acres, about half of present-day Alabama and part of southern Georgia. Many Red Sticks fled to Spanish Florida and joined the Seminole."
countries: [us]
