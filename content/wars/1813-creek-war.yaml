  - title: Jackson’s campaign and Horseshoe Bend
    date: October 1813 – March 1814
    when: "1814-03-27"
    borders: "1814-03-27"
    countries: [us]
    body:
      - "Andrew Jackson marched south from Tennessee in October 1813 with some 2,500 men and built Fort Strother on the Coosa. On 3 November John Coffee’s cavalry surrounded Tallushatchee and killed 186 Red Stick men by Coffee’s count, and women and children died with them. On 9 November Jackson relieved the allied Creek town of Talladega, besieged by Red Sticks, and reported some 300 of them killed. On 18 November East Tennessee troops under James White, who did not know that the Hillabee towns had just asked Jackson for peace, attacked Hillabee, killing some 60 to 70 people and taking about 250 prisoners, most of them women and children; Gideon Morgan’s Cherokee regiment, marching with White, did much of the killing. The attack is known as the Hillabee massacre; the Hillabees fought on with the Red Sticks after that. Georgia militia under John Floyd and allied Creeks burned Autossee on 29 November, and Mississippi troops under Ferdinand Claiborne, with Choctaw warriors under Pushmataha, burned the Red Stick holy town of Econochaca, the Holy Ground, on 23 December."
      - "Jackson’s army almost dissolved over the winter as enlistments ran out, and his raids at Emuckfaw and Enotachopco in January 1814 and Floyd’s battle at Calebee Creek were indecisive. Reinforced with new militia and the 39th US Infantry, Jackson marched on Tohopeka, the fortified Red Stick town in the Horseshoe Bend of the Tallapoosa, with about 2,700 soldiers and some 600 Cherokee and allied Creek warriors. On 27 March 1814 Coffee’s mounted men and the Native allies surrounded the bend across the river; Cherokee warriors swam the Tallapoosa, took the Red Sticks’ canoes and attacked from behind while Jackson’s infantry stormed the log breastwork. About 1,000 Red Sticks under Menawa defended the town, and more than 800 of them were killed, 557 bodies counted on the ground and many more shot in the river; Jackson’s army and its allies lost about 50 killed. Menawa, badly wounded, escaped."
    facts:
