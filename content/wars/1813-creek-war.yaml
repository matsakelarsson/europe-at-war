steps:
  - title: Civil war among the Muscogee and Fort Mims
    date: 1811 – August 1813
    when: "1813-08-30"
    borders: "1813-08-30"
    countries: [us, es]
    body:
      - "The Muscogee Confederacy was a union of the Upper Towns on the Coosa and Tallapoosa rivers and the Lower Towns on the Chattahoochee. Under the United States agent Benjamin Hawkins, the Creek National Council had taken up the American “plan of civilisation”, with ranching, cotton and, among some wealthy families, the ownership of enslaved Black people; it had ceded land and allowed a Federal Road to be cut through the nation, and it punished Creeks who attacked settlers. Many Creeks resented all of this. Tecumseh’s speech at Tukabatchee in 1811 and the teaching of Muscogee prophets such as Josiah Francis (Hillis Hadjo) gave the resistance a religious force, and its followers took up the red war club as their sign."
      - "In early 1813 a war party under Little Warrior, returning from the north, killed settler families near the Ohio. At Hawkins’s demand the council had Little Warrior and other warriors executed, and the Red Sticks rose against the council: in July 1813 they killed some of its leaders and besieged Tukabatchee, the council’s town, until allied Creeks relieved it. Peter McQueen led a party to Spanish Pensacola, whose governor gave them powder and lead. On 27 July Mississippi Territory militia attacked his pack train on its way home at Burnt Corn Creek; the Red Sticks counter-attacked and drove the militia off."
      - "Settlers, Creeks of mixed ancestry who sided with the council, and their enslaved workers crowded into stockades north of Mobile. On 30 August 1813 some 750 to 1,000 Red Sticks under Peter McQueen and William Weatherford (Red Eagle) rushed the open gate of Fort Mims, the stockade around Samuel Mims’s house near the Alabama River, held by Mississippi militia under Major Daniel Beasley. In a battle that lasted most of the day they took the fort and killed most of the more than 500 people inside, women and children among them; estimates of the dead range from about 250, the number of bodies counted, to 500. They spared many of the enslaved people and took them away as captives, and lost some 50 to 100 of their own. The news brought the United States into the war."
