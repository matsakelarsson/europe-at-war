  - title: The Treaty of Fort Jackson
    date: April – August 1814
    when: "1814-08-09"
    borders: "1814-08-09"
    countries: [us, es]
    link: { href: "#/war/first-seminole-war", text: First Seminole War }
    body:
      - "After Horseshoe Bend the Red Stick resistance collapsed. Jackson built Fort Jackson on the site of the old French Fort Toulouse, where the Coosa and Tallapoosa meet, and in April William Weatherford walked into his camp and surrendered; Jackson let him go. Many Red Sticks, among them Peter McQueen and Josiah Francis, fled with their families to Spanish Florida and joined the Seminole, and in 1814 British officers armed them at Pensacola and on the Apalachicola."
      - "On 9 August 1814 Jackson dictated the Treaty of Fort Jackson, not to the defeated Red Sticks, most of whom were gone, but to the chiefs of the Creek National Council, his own allies. The Creek Nation had to cede about 21 to 23 million acres, roughly half of present-day Alabama and a large part of southern Georgia, including the lands of Creeks who had fought for the United States; Big Warrior and others protested in vain, and the Cherokee also lost land they claimed. The Treaty of Ghent’s promise to restore the Native nations’ lands of 1811 was never applied to the cession. Settlers and cotton planters with enslaved workers poured into the new lands, Alabama became a state in 1819, and Jackson’s fame carried him to the presidency. The Red Sticks in Florida fought on in the Seminole wars, and the remaining Creeks were forced west to Indian Territory in the 1830s."
    facts:
      - [Treaty of Fort Jackson, "9 August 1814"]
      - [Land ceded, "about 21–23 million acres"]
