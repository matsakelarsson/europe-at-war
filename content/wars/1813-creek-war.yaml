notes:
  - The war was part of the War of 1812 in the eyes of the Americans and the British, who armed Red Stick refugees in Florida in 1814, but for the Muscogee it began as a war among themselves over their future. The name Red Sticks comes from the red war clubs that symbolised war.
  - "Numbers are estimates: about 1,600 Red Sticks are thought to have been killed in the war, and many Creek towns were destroyed or abandoned; losses of the Americans and their Native allies are put at about 600 killed. Hunger and refugee flight killed many more Creek people."
  - The killing of the people at Fort Mims, many of them civilians, is usually called the Fort Mims massacre in American histories; the attacks of the American armies on Tallushatchee, Hillabee and Horseshoe Bend also killed women and children.
