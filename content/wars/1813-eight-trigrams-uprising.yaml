id: eight-trigrams-uprising
name: Eight Trigrams uprising
start: "1813-09-30"
end: "1814-01-01"
tier: C
summary: "A millenarian rising in northern China by the Eight Trigrams, a network of sects of the Heavenly Principle (Tianli) teaching, related to the White Lotus tradition, whose followers expected the Eternal Venerable Mother to bring the end of the age. Its leaders, Lin Qing near Beijing and Li Wencheng in Hua county in northern Henan, planned simultaneous risings for the 15th day of the ninth lunar month of 1813 (8 October), when the Jiaqing Emperor was due back from his autumn hunt. Li Wencheng was arrested beforehand, and on 30 September his followers rose early, stormed Hua county town and freed him; sects in southern Zhili and Shandong took Caoxian and Dingtao. On 8 October some 80 of Lin Qing’s followers, guided by sympathetic palace eunuchs, broke into the Forbidden City in Beijing; they were driven back by guards and princes, among them the future Daoguang Emperor, Mianning, who shot two of them with a musket, and Lin Qing was captured and executed. Qing armies under Nayancheng retook the towns in Shandong and Zhili, Li Wencheng burned himself to death when surrounded at Sizhai in Hui county, and Hua county fell after a siege on 1 January 1814. More than 20,000 sect members were killed or executed, and some 70,000 people are estimated to have died in the disorder."
