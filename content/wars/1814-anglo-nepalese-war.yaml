  - title: Kumaon and Almora
    date: February – April 1815
    when: "1815-04-27"
    borders: "1815-04-27"
    countries: [in, np]
    body:
      - Nepal had held Kumaon for twenty-five years, but most of its troops had been sent west against Ochterlony. In February 1815 Moira sent Lieutenant-Colonel William Gardner into the hills with irregular levies, many of them Rohilla Pathans raised in Rohilkhand, while a civil officer, Edward Gardner, worked to win over the Kumaoni chiefs. The Nepalese governor, Bam Shah, fell back on Almora. In April Colonel Jasper Nicolls arrived with about 2,000 regular troops and took command.
      - In late April a Nepalese force of about 500 men under Hasti Dal Chautariya, coming to reinforce Almora, was intercepted near Gananath, north of the town, and Hasti Dal was killed. On 25 April Nicolls’s regulars and Gardner’s irregulars stormed the Sitoli ridge facing Almora, and on 27 April 1815 Bam Shah surrendered the town. Under the convention he signed, all the forts of Kumaon were given up, and his troops marched east across the Kali.
    facts:
      - [Company force, "about 2,000 regulars and many irregulars"]
      - [Hasti Dal Chautariya killed, "April 1815"]
      - [Almora surrendered, "27 April 1815"]
