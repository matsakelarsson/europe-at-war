id: anglo-nepalese-war
name: Anglo-Nepalese War
start: "1814-11-01"
end: "1816-03-04"
tier: A
summary: "A war between the East India Company and the Gorkha kingdom of Nepal, which in half a century had grown from a small hill state into a Himalayan empire stretching from the Teesta to the Sutlej. Border disputes in the Terai lowlands, above all over Butwal and Sheoraj, led the Governor-General, Lord Moira, to invade along the whole frontier in 1814. Nepalese garrisons beat off the first attacks at Kalunga and Jaithak and in the Terai, but in 1815 the Company took Kumaon and forced Amar Singh Thapa to give up the western hills at Malaun. When Kathmandu would not ratify the Treaty of Sugauli, Sir David Ochterlony marched to Makwanpur, and Nepal accepted the treaty on 4 March 1816. It lost Kumaon, Garhwal, the hill states to the Sutlej, the Sikkim lands and most of the Terai, part of which was soon returned, and took a British Resident, but kept its independence. The British began recruiting the soldiers they had fought, the origin of the Gurkha regiments."
countries: [np, in]
sides:
  - id: eic
    name: East India Company and Sikkim
    polities: [british-india, sikkim]
    ink: red
    moves: Company and allied moves
    success: Company success
  - id: np
    name: Kingdom of Nepal (Gorkha)
    polities: [nepal]
    ink: purple
    moves: Nepalese moves
    success: Nepalese success
notes:
  - The Company’s armies were mostly Bengal Army sepoys under British officers, with some British Army regiments, and irregular levies raised for the war. Nepal’s army drew on many hill peoples, among them Khas, Magars and Gurungs; the British called them all “Goorkhas”, after the ruling house’s home, Gorkha.
  - British accounts, above all the dispatches of the commanders, dominate the record. Nepalese losses are not known, and figures for the size of Nepal’s army range from about 11,000 to 22,000 men.
  - The Terai, the strip of plains and forest along Nepal’s southern edge, does not follow the provinces on the map; it is drawn as an outline in the steps.
