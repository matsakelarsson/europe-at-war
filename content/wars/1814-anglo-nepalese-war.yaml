  - title: Kalunga and Jaithak
    date: October – December 1814
    when: "1814-10-31"
    borders: "1814-11-30"
    countries: [in, np]
    body:
      - Gillespie’s advance guard entered the Dun valley in October and occupied Dehradun, but found the small hill fort of Kalunga (Nalapani), a few kilometres to the north-east, held by Captain Balbhadra Kunwar with about 600 people, women and children among them. On 31 October 1814 Gillespie led a hurried assault and was shot dead near the gate; the attack failed with some 260 killed and wounded. A second assault, after siege guns had arrived from Delhi, failed on 27 November with nearly 500 more.
      - The besiegers then cut off the fort’s water. On the night of 30 November Balbhadra broke out with about seventy survivors and joined other Nepalese forces. Two small obelisks still stand at Kalunga, one for Gillespie and one for the defenders, whom it calls “our gallant adversary”.
      - The column, now under Major-General Gabriel Martindell, marched west into Sirmur, occupied its capital Nahan in late December and attacked the ridge fort of Jaithak, held by Amar Singh Thapa’s son Ranajor Singh Thapa. On 27 December two detachments sent against the ridge from opposite sides were beaten back with heavy losses. Martindell made no further attack for months and settled down to a blockade. The Company had lost more than a thousand killed and wounded before two small hill forts, and Nepal’s soldiers had won a reputation they kept.
    facts:
      - [Gillespie killed at Kalunga, "31 October 1814"]
      - [Second assault fails, "27 November 1814"]
      - [Kalunga abandoned, "30 November 1814"]
      - [Company losses at Kalunga, "more than 700 killed and wounded"]
      - [Attack on Jaithak, "27 December 1814, Nepalese success"]
    markers:
