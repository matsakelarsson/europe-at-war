  - title: Setbacks in the Terai
    date: December 1814 – February 1815
    when: "1815-01-01"
    borders: "1815-01-01"
    countries: [np, in]
    body:
      - In the east the two largest columns achieved almost nothing. Marley moved slowly north from Bettiah and spread his outposts along the edge of the forest. On 1 January 1815 Nepalese troops surprised and overran the posts at Parsa and Samanpur, killing or scattering their garrisons and carrying off their guns. Marley halted and asked for reinforcements, and in February he rode away from his camp; his successor could do little before the hot season.
      - Wood, ordered to take Butwal and the hills of Palpa, attacked the Nepalese stockade at Jitgadh near Butwal in early January 1815. Ujir Singh Thapa’s troops beat him back, and Wood kept to the defensive along the Gorakhpur frontier for the rest of the season. In the east, Latter held the Purnea frontier and made an alliance with Sikkim.
      - By February the Company had lost several thousand men to fighting and disease with little to show for it. Nepal’s strategy of holding the hills and striking at isolated posts was working, and Moira’s hopes now rested on Ochterlony in the west and on a new venture into Kumaon.
    facts:
      - [Parsa and Samanpur posts overrun, "1 January 1815"]
      - [Wood repulsed at Jitgadh, "January 1815"]
