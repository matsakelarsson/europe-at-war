  - title: Sugauli and Makwanpur
    date: December 1815 – March 1816
    when: "1816-02-28"
    borders: "1816-03-04"
    countries: [np, in]
    body:
      - Peace talks began in mid-1815. The Company demanded the hills west of the Kali, most of the Terai and a British Resident in Kathmandu. Moira softened the loss of the Terai by offering 200,000 rupees a year to the Nepalese chiefs who held land there, and on 2 December 1815 the Nepalese envoys Gajraj Mishra and Chandra Shekhar Upadhyaya signed a treaty with Lieutenant-Colonel Paris Bradshaw at Sugauli in Bihar. The court in Kathmandu, where many believed the British could not fight in the inner hills, refused to ratify it.
      - Moira gave the command to Ochterlony, who gathered about 17,000 men, British regiments among them, on the Bihar frontier. In February 1816, rather than force the fortified Bichakori pass through the Churia hills, he led his main column by night along a little-used track shown to him by smugglers and came down to Hetauda behind the Nepalese defences. On 28 February Nepalese troops attacked a British force on a ridge near the fort of Makwanpur and were driven off after a day’s fighting with heavy losses. At the same time another column took the fort of Hariharpur further east.
      - With a British army some 45 km from Kathmandu, the court gave way. On 4 March 1816 Chandra Shekhar Upadhyaya brought the ratified treaty to Ochterlony’s camp at Makwanpur, and the army withdrew to the plains.
    facts:
      - [Treaty signed at Sugauli, "2 December 1815"]
      - [Battle of Makwanpur, "28 February 1816, Company victory"]
      - [Treaty ratified, "4 March 1816"]
