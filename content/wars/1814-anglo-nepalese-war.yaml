  - title: The peace and the Gurkhas
    date: 1816–1817
    when: "1816-03-04"
    borders: "1817-02-10"
    countries: [np, in]
    body:
      - The Treaty of Sugauli cost Nepal about a third of its territory. It gave up all its conquests west of the Kali (Mahakali), that is Kumaon, Garhwal and the hill states up to the Sutlej; the lands it had taken from Sikkim between the Mechi and the Teesta; and most of the Terai. It accepted a British Resident in Kathmandu, the first being Edward Gardner. The Kali and the Mechi became Nepal’s western and eastern borders, as they still are.
      - The Company kept Kumaon, Dehradun and eastern Garhwal, gave western Garhwal back to its raja Sudarshan Shah as the state of Tehri Garhwal, and returned most of the hill states between the Yamuna and the Sutlej to their rulers under its protection. By the Treaty of Titalia on 10 February 1817 it handed the Mechi–Teesta lands to Sikkim. The Terai proved hard to govern, and on 11 December 1816 the Company returned the lowlands from the Kosi to the Rapti in place of the yearly payment. The far-western Terai, the Naya Muluk, was returned in 1860, after Nepal had helped the British in the rising of 1857.
      - The war’s longest legacy was military. Impressed by the men they had fought, the British went on recruiting soldiers from the Nepalese hills. The “Gurkha” regiments of the Company’s army became regiments of the Indian Army, and after 1947 of both the British and Indian armies, which still recruit in Nepal. Nepal kept its independence, and Bhimsen Thapa, who held power until 1837, kept the British at arm’s length.
    facts:
      - [Treaty of Sugauli ratified, "4 March 1816"]
      - [Terai from the Kosi to the Rapti returned, "11 December 1816"]
      - [Treaty of Titalia with Sikkim, "10 February 1817"]
