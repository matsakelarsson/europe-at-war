  - title: Butwal and the declaration of war
    date: April – November 1814
    when: "1814-05-29"
    borders: "1814-11-01"
    countries: [np, in]
    body:
      - Francis Rawdon-Hastings, Earl of Moira (later Marquess of Hastings), became Governor-General in 1813. He demanded that Nepal give up Butwal and Sheoraj, and in April 1814 Company troops occupied them. When the malaria season came the troops withdrew, leaving police posts behind. On 29 May 1814 Nepalese soldiers attacked the posts in Butwal and killed eighteen of their men. The court in Kathmandu, where Bhimsen Thapa believed the hills would protect the kingdom, chose to fight, although some commanders, among them Amar Singh Thapa, warned against a war with the Company.
      - Moira prepared through the summer and declared war on 1 November 1814, by which time the first fighting had already begun. He sent four columns into the hills at once along a frontier of some 1,500 km. Major-General David Ochterlony was to march from Ludhiana with about 6,000 men against Amar Singh Thapa’s army between the Sutlej and the Yamuna. Major-General Robert Rollo Gillespie was to take about 3,500 from Meerut into the Dun valley around Dehradun. Major-General John Sullivan Wood had about 4,500 at Gorakhpur for Butwal and Palpa. The largest column, about 8,000 men under Major-General Bennet Marley, was to march from Dinapur (Danapur) on Makwanpur and Kathmandu itself.
      - A smaller force under Major Barré Latter held the frontier at Purnea in the east and sought the help of Sikkim, which hoped to win back the lands Nepal had taken from it. Nepal’s troops were spread in forts and stockades along the whole length of the hills; its commanders hoped that the steep ridges, the forests and the malarial Terai would wear the invaders down.
    facts:
      - [Butwal police posts attacked, "29 May 1814"]
      - [War declared, "1 November 1814"]
      - [Company columns, "four, about 22,000 men, with Latter’s force in the east"]
