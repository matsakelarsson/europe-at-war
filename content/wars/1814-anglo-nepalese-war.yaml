  - title: Malaun and Amar Singh Thapa
    date: November 1814 – May 1815
    when: "1815-04-16"
    borders: "1815-05-15"
    countries: [in, np]
    body:
      - Ochterlony, a cautious veteran of nearly forty years in India, advanced from Rupar (Rupnagar) into the hills in late October 1814 with about 6,000 men, building roads for his guns as he went, and took the forts of Nalagarh and Taragarh in November. Amar Singh Thapa, the most experienced Gorkhali commander, held a line of ridges and stockades around Ramgarh that Ochterlony would not attack head-on. Through the winter he outflanked it piece by piece, and in early 1815 Amar Singh fell back on the fortified ridge of Malaun, near the Sutlej, with his ally the raja of Bilaspur.
      - In April Ochterlony seized points along the Malaun ridge, among them Deothal, cutting the main fort off from its outworks. On 16 April 1815 the veteran commander Bhakti Thapa, said to be over seventy, led an attack on the British position at Deothal and was killed with many of his men; British accounts say his body was returned to the Nepalese with honours. Ochterlony then brought up heavy guns, and Amar Singh’s men, short of food, began to desert.
      - When news came that Almora had fallen, Amar Singh signed a convention with Ochterlony on 15 May 1815. Nepal gave up all its lands between the Kali and the Sutlej, and Amar Singh, his son Ranajor Singh at Jaithak and their soldiers were allowed to march home with their arms and property. Many of the soldiers, from Garhwal and Kumaon as well as Nepal, chose to enter Company service instead; they formed the Nasiri battalions at Subathu and the Sirmoor battalion at Dehradun, the first “Gurkha” units.
    facts:
      - [Bhakti Thapa killed at Deothal, "16 April 1815"]
      - [Convention of Malaun, "15 May 1815"]
      - [Ceded by the convention, "all of Nepal’s lands between the Kali and the Sutlej"]
