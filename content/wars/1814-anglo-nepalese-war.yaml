steps:
  - title: From the Teesta to the Sutlej
    date: 1768–1814
    when: "1768"
    borders: "1813-06-01"
    countries: [np, in]
    body:
      - In 1768–1769 Prithvi Narayan Shah, king of the small hill state of Gorkha, conquered the three Malla kingdoms of the Kathmandu valley and made Kathmandu his capital. His successors, ruling through regents and generals, carried the conquests along the Himalaya in both directions. In the east they took the Kirata lands and, in 1788–1789, the lands of Sikkim west of the Teesta. In the west they absorbed the Chaubisi and Baise states and went on into Kumaon, whose capital Almora fell in 1790, and Garhwal, conquered in 1803–1804, when its raja Pradyumna Shah was killed at Khurbura near Dehradun.
      - By 1806 Gorkhali armies under Amar Singh Thapa held the hill states as far as the Sutlej and were besieging Kangra, the fortress of the Katoch raja Sansar Chand. Ranjit Singh’s Sikh army relieved it in 1809, and the Sutlej became the limit of Nepal’s expansion.
      - In the plains, Nepal now bordered the East India Company, which had taken Gorakhpur and the land along the foot of the hills from Awadh in 1801. When Nepal annexed the kingdom of Palpa in 1806, it also claimed Palpa’s lowland districts of Butwal and Sheoraj, which the Company said belonged to Gorakhpur. Similar disputes ran along the whole frontier, and a joint commission in 1812–1813 settled none of them. In Kathmandu, Bhimsen Thapa had governed as chief minister (mukhtiyar) since 1806 for the young king Girvan Yuddha Bikram Shah.
    facts:
      - [Kathmandu valley conquered, "1768–1769"]
      - [Almora taken, "1790"]
      - [Garhwal conquered, "1803–1804"]
      - [Siege of Kangra, "1806–1809, relieved by the Sikhs"]
