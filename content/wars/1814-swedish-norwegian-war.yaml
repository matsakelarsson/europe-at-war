    body:
      - Norway declared independence, adopted a constitution at Eidsvoll on 17 May 1814 and chose the Danish prince Christian Frederick as king. At the end of July Charles John invaded with a much larger army, taking the Hvaler islands and the fortress town of Fredrikstad.
      - On the Kongsvinger front the Norwegians stopped the Swedes at Lier on 2 August and Matrand on 5 August, but on 14 August the Swedes forced the Kjølberg bridge and the road to Christiania lay open. That same day the Convention of Moss ended the fighting. Charles John accepted Norway’s constitution, and on 4 November 1814 the Storting elected Charles XIII king of Norway, joining the two kingdoms in a union. Sweden has not fought a war since.
