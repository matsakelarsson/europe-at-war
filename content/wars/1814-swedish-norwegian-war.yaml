id: swedish-norwegian-war
name: Swedish–Norwegian War
start: 1814-07-26
end: 1814-08-14
tier: B
summary: A short war in which Sweden forced Norway, which had declared independence and adopted its own constitution after the Treaty of Kiel, into a union under the Swedish king. The Convention of Moss ended the fighting after two weeks, and Norway kept its constitution and parliament.
