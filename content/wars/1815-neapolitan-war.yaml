    ink: purple
    moves: Austrian moves
    success: Austrian success
notes:
  - Also called the Austro-Neapolitan War. Britain, which protected the Bourbon court in Sicily and had never recognised Murat, declared war on him in April 1815.
  - Murat’s strength is uncertain; he claimed 82,000 men to encourage recruits, but the real figure was probably about 50,000.
