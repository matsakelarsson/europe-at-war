steps:
  - title: The Rimini Proclamation
    date: March – April 1815
    when: "1815-03-15"
    borders: "1815-04-12"
    countries: [it, at]
    body:
      - Joachim Murat, Napoleon’s brother-in-law and King of Naples since 1808, had deserted Napoleon in January 1814 by a treaty with Austria that let him keep his throne. But at the Congress of Vienna the Bourbons, and Britain, which had never recognised him, pressed for his removal. When Napoleon escaped from Elba, Murat sided with him again and declared war on Austria on 15 March 1815. He sent his two Guard divisions through the Papal States, and Pope Pius VII fled to Genoa, while he led his main army up the Adriatic coast from Ancona. At Rimini on 30 March he called on all Italians to rise and fight for an independent and united Italy.
      - Few answered. Murat’s troops took Bologna on 3 April and then beat the Austrian vanguard under General Bianchi on the Panaro near Modena, and his Guard divisions entered Florence. But the citadel of Ferrara held out against him, and when he tried to force a crossing of the Po at Occhiobello on 8–9 April, the main Austrian army under General Frimont threw him back with more than 2,000 casualties. Britain declared war and sent a fleet. On 12 April the Austrians drove the Neapolitans from their lines before Ferrara, and a few days later Murat ordered a general retreat.
    facts:
      - [Declaration of war, "15 March 1815"]
      - [Rimini Proclamation, "30 March 1815"]
      - [Battle of Occhiobello, "8–9 April 1815, Austrian victory"]
