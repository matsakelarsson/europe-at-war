  - title: Tolentino and Pizzo
    date: April – October 1815
    when: "1815-04-16"
    borders: "1815-05-20"
    countries: [it, at]
    body:
      - Murat fell back down the Adriatic coast, with Neipperg’s Austrian corps following, while Bianchi marched through Florence and over the Apennines to Foligno to cut off his retreat. Hoping to beat Bianchi before Neipperg arrived, Murat attacked him near Tolentino on 2 May. After two days of indecisive fighting he learned that Neipperg had beaten his rearguard at Scapezzano and was close, and he ordered a retreat that became a rout. With another Austrian force under Nugent coming down from Rome, and a British fleet off Naples, Murat fled in disguise. On 20 May his generals signed the Treaty of Casalanza near Capua, and on 23 May the Austrians entered Naples for King Ferdinand.
      - Murat escaped to France and then to Corsica. In October he sailed for Calabria with some 30 followers, hoping to repeat Napoleon’s return from Elba. He landed at Pizzo on 8 October, but the people did not rally to him; he was seized and handed to Bourbon troops, condemned by a military court, and shot in the castle of Pizzo on 13 October 1815. In December 1816 Ferdinand united his two kingdoms of Naples and Sicily as the Kingdom of the Two Sicilies and became Ferdinand I. Murat’s campaign had failed, but it was the first war fought, at least in name, for Italian unity.
    facts:
      - [Battle of Tolentino, "2–3 May 1815, Austrian victory"]
      - [Treaty of Casalanza, "20 May 1815"]
      - [Murat shot at Pizzo, "13 October 1815"]
    markers:
      - kind: battle
        side: at
        name: Battle of Tolentino
        date: 2–3 May 1815
        text: Bianchi’s Austrians held the hills east of the town against Murat’s attacks. The defeat broke the Neapolitan army’s morale.
        lonlat: [13.284, 43.21]
      - kind: battle
        side: at
        name: Battle of Scapezzano
        date: May 1815
        text: Neipperg outmanoeuvred and beat the Neapolitan division sent to hold him off near Senigallia.
        lonlat: [13.17, 43.69]
        lp: l
      - kind: siege
        side: at
        name: Ancona
        date: May 1815
        text: Blockaded by an Austrian and British fleet from 5 May, the Neapolitan garrison surrendered.
        lonlat: [13.519, 43.617]
      - kind: battle
        side: at
        name: San Germano
        date: mid-May 1815
        text: Murat’s last attempt to stop Nugent’s advance on Naples, at today’s Cassino, was called off as Bianchi’s army closed in.
        lonlat: [13.83, 41.49]
      - kind: treaty
        name: Treaty of Casalanza
        date: 20 May 1815
        text: Signed at the Lanza family’s villa near Capua by General Pietro Colletta for Naples, Count Neipperg for Austria and Lord Burghersh for Britain. Its terms were mild, but it handed the kingdom back to the Bourbons.
        lonlat: [14.21, 41.1]
      - kind: event
        name: Pizzo
        date: 8–13 October 1815
        text: Murat landed here with 28 men and was captured within hours. Five days later he was shot in the town’s castle.
        lonlat: [16.16, 38.735]
