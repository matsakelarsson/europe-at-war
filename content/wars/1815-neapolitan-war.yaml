id: neapolitan-war
name: Neapolitan War
start: "1815-03-15"
end: "1815-05-20"
tier: B
summary: The war of 1815 in which Joachim Murat, King of Naples, sided with Napoleon during the Hundred Days, attacked Austria and called on Italians to rise for a united Italy. Beaten at Occhiobello and Tolentino, he lost his kingdom to the restored Bourbon Ferdinand IV by the Treaty of Casalanza, and was shot after a failed landing in Calabria in October.
