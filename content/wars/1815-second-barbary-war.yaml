notes:
  - Americans called the Algerian corsairs pirates; the regency licensed them as privateers against nations without a treaty. The Anglo-Dutch bombardment of Algiers in 1816 has its own entry.
  - Sources differ on the date of the second treaty (signed in December 1816 and, by an oversight, ratified by the Senate only in 1822) and on the number of captives freed.
