id: second-barbary-war
name: Second Barbary War
start: "1815-03-03"
end: "1815-08"
tier: C
summary: "A short war between the United States and the Regency of Algiers that ended American tribute to the North African regencies. In 1812, as the United States went to war with Britain, the dey of Algiers rejected his treaty of 1795 and declared war, and Algerian corsairs took American ships and crews. After peace with Britain, Congress authorised force against Algiers on 3 March 1815, and Commodore Stephen Decatur sailed from New York on 20 May with a squadron of ten ships, the largest American fleet yet assembled. On 17 June, off the south-east coast of Spain, he took the Algerian flagship Meshouda, whose commander, Rais Hamidou, was killed, and two days later the brig Estedio. Arriving off Algiers at the end of June, he dictated a treaty to Dey Omar Agha, signed on 30 June and 3 July aboard the Guerriere: no more American tribute, the release of the American captives (about ten) in exchange for some 500 Algerian prisoners and the return of the two ships, and $10,000 in compensation. Decatur then sailed to Tunis and Tripoli and obtained compensation for American prizes lost in their ports during the War of 1812. The dey later repudiated the treaty, but after the Anglo-Dutch bombardment of 1816 the American consul William Shaler, backed by a second squadron, obtained a new treaty with the same terms in December 1816."
