notes:
  - British and Algerian figures for the forces and losses differ widely; the numbers here are those given in the sources cited. Europeans called the Algerian corsairs pirates; the regency licensed them as privateers against states without a treaty.
  - The American war with Algiers of 1815 has its own entry (Second Barbary War).
