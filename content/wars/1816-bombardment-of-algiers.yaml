id: bombardment-of-algiers
name: Bombardment of Algiers
start: "1816-08-27"
end: "1816-09-24"
tier: C
summary: "The bombardment of Algiers on 27 August 1816 by a British and Dutch fleet under Admiral Lord Exmouth, to force the dey to free his European captives and give up taking Christians as slaves. After the Napoleonic Wars, Britain no longer needed the regencies’ goodwill, and pressure was growing in Europe to end the enslavement of Christian captives. In the spring of 1816 Exmouth won agreements from Tunis and Tripoli and a partial one from Algiers, but soon afterwards Algerian troops at Bône (Annaba) killed some 200 Corsican, Sicilian and Sardinian coral fishermen under British protection. Exmouth returned with five ships of the line, frigates, sloops and bomb vessels, joined at Gibraltar by a Dutch squadron of five frigates under Vice-Admiral Theodorus van Capellen. When an Algerian battery opened fire at about 3 p.m., the fleet, anchored close to the mole, silenced the harbour batteries and burned the Algerian ships before withdrawing out of range that night. The British lost 141 killed and 742 wounded, the Dutch 13 killed and 52 wounded; estimates of the Algerian dead, soldiers and civilians, range from 300 to 2,000. Dey Omar Agha accepted Exmouth’s terms, and a treaty was signed on 24 September: he freed 1,083 Christian captives at once, and over 3,000 in all, returned the ransom money he had taken earlier in the year, and renounced the enslavement of Christians. Algiers rebuilt its defences, the taking of captives did not wholly stop under later deys, and a British fleet returned under threat in 1824; the corsair war ended with the French conquest of Algiers in 1830."
