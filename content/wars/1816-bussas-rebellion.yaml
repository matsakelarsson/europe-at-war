notes:
  - The names of the leaders and the numbers of the dead come from the trial records and reports of the colonial authorities; historians, among them Hilary Beckles, have reconstructed the plan from them. Jerome Handler has argued that the name “Bussa’s Rebellion”, which came into use in the twentieth century, gives one man more weight than the records do.
