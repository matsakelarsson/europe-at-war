id: zulu-wars-of-expansion
name: Zulu wars of expansion and the Mfecane
start: "1816"
end: "1828-09"
tier: A
summary: "The wars in which the Zulu kingdom was built under Shaka, and the wider upheaval among the peoples of south-eastern Africa known as the Mfecane (in Sotho the Difaqane or Lifaqane). Around 1800 larger states were forming between the Phongolo and Thukela rivers, led by the Mthethwa of Dingiswayo and the Ndwandwe of Zwide. Shaka, who became chief of the small Zulu chiefdom in 1816 with Dingiswayo’s help, took over the leadership of the Mthethwa alliance after Zwide killed Dingiswayo, defeated the Ndwandwe in 1818–1820 and made the Zulu kingdom the strongest power in the region, until his assassination in September 1828. The Ndwandwe dispersed: Soshangane founded the Gaza kingdom in southern Mozambique and Zwangendaba led the Ngoni north across the Zambezi. Mzilikazi broke away from Shaka and took his Ndebele onto the highveld; the Hlubi, the amaNgwane of Matiwane and the Tlokwa of MaNthatisi fought and raided across the Caledon valley; Moshoeshoe gathered the survivors into the Basotho kingdom at Thaba Bosiu; and Sebetwane led the Kololo to the upper Zambezi. Many communities were destroyed or uprooted, and the new kingdoms remade the map of the region. Historians disagree about the causes and scale of the upheaval: older accounts blamed Shaka for one or two million deaths, while since the 1980s historians have pointed to drought, competition for land and the ivory and cattle trade at Delagoa Bay, slave and cattle raiding by Griqua and colonial groups, and the self-serving exaggerations of colonial writers."
countries: [za, sz, ls, mz, zw, bw, zm, mw]
