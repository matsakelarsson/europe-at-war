  - title: Shaka against Zwide
    date: 1818–1820
    when: "1818-04"
    borders: "1819-06-01"
    countries: [za]
    body:
      - According to tradition, Zwide’s first army, led by his son Nomahlanjana, attacked the Zulu in 1818 and was beaten at Gqokli Hill near the White Mfolozi, where Shaka’s smaller force held the hilltop and Nomahlanjana was killed. The detailed accounts of the battle, with their numbers of about 5,000 Zulu against 12,000 Ndwandwe, go back to E. A. Ritter’s popular biography of 1955, and the historian Dan Wylie doubts that the battle took place as described; the South African History Online biography mentions only that a first Ndwandwe expedition was defeated at Gqokli.
      - Zwide then sent his whole army into Zululand. Shaka withdrew south across the Mfolozi and the Mhlatuze, driving off the cattle and hiding or destroying the grain, and drew the Ndwandwe into the broken, forested country of Nkandla. When the hungry invaders turned back, the Zulu attacked them as they crossed the Mhlatuze, in 1819 or 1820 (sources differ), and broke them in a running fight over two days. A Zulu force went on to Zwide’s capital near Nongoma, reaching it before news of the defeat, and destroyed it.
      - Zwide escaped north with part of his people and rebuilt his power beyond the Phongolo, near the Nkomati. Shaka absorbed the defeated chiefdoms and those that had sided with Zwide, among them the Qwabe, and built a new and much larger kwaBulawayo, named after his first royal homestead, in the former Qwabe country near present-day Eshowe. By about 1820 the Zulu kingdom held the country from the Phongolo to the Thukela, and its regiments were raiding beyond both rivers.
    facts:
      - [Gqokli Hill, "1818, by tradition"]
      - [Battle of the Mhlatuze, "1819 or 1820"]
