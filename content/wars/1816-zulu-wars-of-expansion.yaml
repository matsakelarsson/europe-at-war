steps:
  - title: Mthethwa, Ndwandwe and the rise of Shaka
    date: about 1800–1818
    when: "1816"
    borders: "1817-01-01"
    countries: [za, sz]
    body:
      - In the late 1700s the many small chiefdoms between the Phongolo and Thukela rivers began to be drawn into larger states. The Mthethwa, near the coast under Dingiswayo, and the Ndwandwe, in the north under Zwide, were the strongest; the Ngwane of Sobhuza (the later Swazi), the Qwabe and the Hlubi were others. Historians link the change to a growing population and competition for good grazing, to severe droughts, among them the famine remembered as Madlathule early in the 1800s, and to the trade in ivory and cattle at Delagoa Bay, whose profits went to the chiefs who controlled it. Chiefs organised young men into age-regiments (amabutho) that served them in war, hunting and work, and used them to bring weaker neighbours under their rule.
      - Shaka, a son of Senzangakhona, chief of the small Zulu chiefdom on the White Mfolozi, grew up away from his father’s court and served in Dingiswayo’s regiments. When Senzangakhona died in 1816, Dingiswayo helped Shaka take the chieftainship from his half-brother Sigujana, who was killed. Shaka drilled his regiments hard and fought in close order; later tradition credits him with the short stabbing spear and the “horns of the buffalo” encircling formation, though historians now see these as developments of existing practice.
      - Zwide drove Sobhuza’s Ngwane north of the Phongolo, into what became Swaziland, and fought the Mthethwa. In late 1817 or early 1818 Dingiswayo was captured by the Ndwandwe and put to death at Zwide’s homestead. The Mthethwa alliance broke up, and its members and their regiments turned to Shaka, who became the leader of the coalition against Zwide.
    facts:
      - [Shaka becomes Zulu chief, "1816"]
      - [Death of Dingiswayo, "late 1817 or early 1818"]
