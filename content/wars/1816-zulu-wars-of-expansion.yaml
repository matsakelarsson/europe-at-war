  - title: War on the highveld
    date: 1822–1828
    when: "1822"
    borders: "1824-07-01"
    countries: [za, ls, bw]
    body:
      - The wars east of the Drakensberg pushed several communities onto the highveld. In about 1821–1822 the amaNgwane of Matiwane, attacked by the Ndwandwe and the Zulu, fell on the amaHlubi, and the Hlubi under Mpangazitha crossed the mountains and attacked the Batlokwa near present-day Harrismith. The Tlokwa, led by MaNthatisi, regent for her son Sekonyela, in turn raided their way across the Caledon valley, living off the grain and cattle of Sotho communities. The Ngwane followed the Hlubi across the mountains, and the three fought each other for years; Matiwane’s Ngwane killed Mpangazitha in about 1825–1826 and dominated the Caledon valley. Fields went unplanted, and in some districts people were reduced to hunger and, by later accounts, to cannibalism.
      - Raiders also moved west. In June 1823 a large host of Fokeng under Sebetwane, with Phuting and Hlakwana, attacked Dithakong, the capital of the Tlhaping. The missionary Robert Moffat brought Griqua horsemen with guns from Griquatown, who with the Tlhaping beat off the attack with heavy losses. Sebetwane’s Fokeng moved north, became known as the Kololo, crossed the Kalahari and by about 1840 had conquered the Lozi kingdom on the upper Zambezi.
      - Moshoeshoe, a young Sotho chief at Butha-Buthe, survived a Tlokwa siege there and in July 1824 moved his people to Thaba Bosiu, a flat-topped mountain that could be defended from below. He paid tribute when he had to, to Matiwane and to Shaka, lent cattle to refugees who joined him and built the Basotho kingdom from the survivors. Matiwane, threatened by the Zulu and the Ndebele, moved south into the lands of the Thembu in 1827–1828. The Cape government, believing a Zulu army was approaching its frontier, sent troops under Lieutenant-Colonel Henry Somerset, and with Thembu, Gcaleka and Mpondo forces they destroyed the Ngwane at Mbholompo, near present-day Mthatha, in late August 1828. Many survivors were taken into the colony as labourers; Matiwane later went to Dingane, who had him killed.
    facts:
      - [Attack on Dithakong, "June 1823"]
      - [Moshoeshoe moves to Thaba Bosiu, "July 1824"]
      - [Battle of Mbholompo, "late August 1828"]
