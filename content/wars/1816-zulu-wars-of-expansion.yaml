notes:
  - "Almost everything known about Shaka and the wars between the Thukela and the Phongolo comes from Zulu oral tradition, recorded decades later (above all by the magistrate James Stuart around 1900), and from the writings of the Port Natal traders Henry Francis Fynn and Nathaniel Isaacs, who had reasons to portray Shaka as a tyrant. Many famous details, such as the invention of the short stabbing spear, come from later popular books. Dates before 1824 are approximate and differ between sources by a year or two."
  - "“Mfecane” (roughly “the crushing”) is a term of the twentieth century, not of the time. The historian Julian Cobbing argued in 1988 that the idea of a Zulu-caused catastrophe was an alibi for colonial land-taking and for slave raiding from Delagoa Bay and the Cape frontier; later work, notably by Elizabeth Eldredge, rejected much of his slave-trade argument, but she and others, among them Dan Wylie, agreed that the old picture of a single Zulu-driven explosion, and its death toll, cannot stand. No reliable count of the dead exists."
