  - title: Shaka’s kingdom at its height
    date: 1824–1828
    when: "1826"
    borders: "1827-01-01"
    countries: [za, mz]
    body:
      - In 1824 a party of British traders led by Francis Farewell and Henry Francis Fynn settled at Port Natal and visited Shaka at kwaBulawayo. He allowed them to stay, claimed them as subjects and used them as go-betweens with the Cape; they in turn claimed that he had granted them the land around the bay. In 1826 Shaka crushed Sikhunyane’s Ndwandwe, and in the same year he built a new royal homestead at kwaDukuza, south of the Thukela and some 80 km from kwaBulawayo, to be nearer the traders. The kingdom ruled perhaps a quarter of a million people, and chiefdoms as far south as the Mzimkhulu paid tribute.
      - When Shaka’s mother Nandi died in October 1827, the mourning he decreed was enforced with killings; Fynn put the dead at 7,000, a figure historians treat with caution. In 1828 Zulu regiments raided south against the Mpondo of Faku, as far as the Mzimvubu, which alarmed the Cape government. Shaka then sent them, without rest, on a long campaign north against Soshangane near Delagoa Bay, the Bhalule campaign, in which many died of hunger and fever.
      - While the army was away, on 22 or 24 September 1828 (sources differ), Shaka was stabbed to death at kwaDukuza by his half-brothers Dingane and Mhlangana and his servant Mbopha. Dingane then killed Mhlangana and became king. He built a new capital, uMgungundlovu, in the emaKhosini valley, and the kingdom his half-brother had made survived him by half a century, until the British invasion of 1879.
    facts:
      - [Traders settle at Port Natal, "1824"]
      - [Death of Nandi, "October 1827"]
      - [Shaka assassinated, "22 or 24 September 1828"]
