  - title: The Ndwandwe scatter, and Mzilikazi breaks away
    date: 1819–1835
    when: "1821"
    borders: "1823-01-01"
    countries: [za, mz, zw, sz, zm, mw]
    body:
      - The defeat broke the Ndwandwe into several groups that carried war and new kinds of state far to the north. Soshangane led his followers to the country behind Delagoa Bay, conquered the Tsonga-speaking communities there and founded the Gaza kingdom, which he moved to the lower Limpopo in about 1827. Zwangendaba and Nxaba led others north through Mozambique and onto the Zimbabwe plateau, where Zwangendaba’s people raided the Rozvi state and a related band killed its ruler. Zwangendaba’s Ngoni crossed the Zambezi in 1835 (tradition dates the crossing by an eclipse, which fell on 20 November 1835) and founded Ngoni kingdoms in what are now Malawi, Zambia and Tanzania. Zwide himself died in about 1825; in 1826 his son Sikhunyane attacked the Zulu and was crushed in the Izindololwane hills, and the Ndwandwe kingdom came to an end.
      - Mzilikazi, chief of the Khumalo and one of Shaka’s commanders, kept the cattle from a raid instead of sending them to the king, in about 1821–1823, and fled with his followers. They crossed the Drakensberg onto the highveld, where, joined by many local people, they became the Ndebele (to the Sotho-Tswana, the Matabele). Raiding Sotho-Tswana communities for cattle and captives, they settled first in the east, then from about 1827 north of the Magaliesberg near present-day Pretoria, and in 1832, after Zulu and Griqua attacks, in the Marico valley in the west.
    facts:
      - [Gaza kingdom moved to the lower Limpopo, "about 1827"]
      - [Ngoni cross the Zambezi, "1835"]
      - [Ndwandwe defeated at Izindololwane, "1826"]
