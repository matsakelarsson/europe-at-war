  - title: A new map of south-eastern Africa
    date: 1828–1840
    when: "1828-09"
    borders: "1836-01-01"
    countries: [za, ls, sz, mz, zw, zm, bw, mw]
    body:
      - By the time of Shaka’s death the region looked very different from a generation before. Where there had been many chiefdoms there were now a few large kingdoms built around regiments and royal capitals, each formed by conquest and by the absorption of refugees and captives. The Zulu kingdom held the land between the Phongolo and the Thukela; Sobhuza’s Swazi kingdom lay north of the Phongolo; Moshoeshoe’s Basotho held the mountains around Thaba Bosiu; Mzilikazi’s Ndebele dominated the western highveld until the Voortrekkers and the Zulu drove them across the Limpopo in 1837–1838; Soshangane’s Gaza ruled southern Mozambique; and the Ngoni and Kololo founded kingdoms far to the north. Large areas of the highveld and of Natal south of the Thukela were thinly peopled for a time.
      - Colonial writers later used these empty-looking lands as an argument that the Voortrekkers and British settlers who arrived in the 1830s and 1840s had taken land that belonged to no one, and they put the blame for the destruction on Shaka alone. Fynn wrote of a million dead, a claim with no basis in any count. The historian Julian Cobbing argued in 1988 that the whole idea of the Mfecane was a colonial myth that hid slave raiding from Delagoa Bay and labour raiding from the Cape frontier. Most historians now accept part of his critique, that colonial accounts exaggerated Zulu violence and the depopulation and ignored colonial and Griqua raiding, but reject his claim that slave raiding from Delagoa Bay set off the wars of the 1810s, and see the upheaval as the result of several causes working together.
    markers:
      - kind: capital
        side: zulu
