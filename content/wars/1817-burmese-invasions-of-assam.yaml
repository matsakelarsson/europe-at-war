notes:
  - Only the Assam front of the First Anglo-Burmese War (1824–1826) is told here. The rest of that war, fought mainly in Arakan and Lower Burma, will be told as a war of its own in a later wave.
  - The Company’s armies were mostly Indian sepoys under British officers, with some British Army regiments.
  - The Ahom court was divided throughout. Chandrakanta Singha was put back on the throne by the Burmese in 1819 and driven out by them in 1821, so the Ahom side here means whichever Ahom government was fighting the Burmese at the time.
  - The Ahom capital had moved from Rangpur (Rongpur, near today’s Sivasagar) to Jorhat in 1794. Assamese chronicles (buranjis) and British reports are the main sources; the size of the Burmese armies and the number of people killed or carried off are uncertain.
