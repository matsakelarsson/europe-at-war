  - title: The Company drives out the Burmese
    date: March 1824 – February 1826
    when: "1824-03-28"
    borders: "1826-02-24"
    countries: [in, mm]
    body:
      - Burmese advances into Cachar and Jaintia and on the Arakan frontier led the Governor-General, Lord Amherst, to declare war on 5 March 1824. In Assam a Company force, with the frontier agent David Scott, advanced up the Brahmaputra from Goalpara. The Burmese fell back, and on 28 March 1824 the British occupied Guwahati.
      - The rains halted operations. In the cold season Lieutenant-Colonel Richards moved up the valley, reached Jorhat on 17 January 1825 and closed in on the Burmese at Rangpur (Rongpur), the old Ahom capital. After an attack on their stockades and talks, the garrison capitulated at the end of January on condition that it could withdraw to Burma, and by mid-1825 Burmese troops had left Assam. In Manipur, Gambhir Singh’s Manipur Levy, raised with British support, drove out the Burmese the same year.
      - The war, fought mainly in Lower Burma, ended with the Treaty of Yandabo, signed on 24 February 1826. Burma renounced its claims to Assam, Manipur, Cachar and Jaintia, ceded Arakan and Tenasserim to the Company and agreed to pay an indemnity of one million pounds. The Company kept Lower Assam. In 1833 it made Purandar Singha tributary ruler of Upper Assam, and in 1838 it annexed his kingdom, ending six centuries of Ahom rule. Manipur became an independent kingdom under Gambhir Singh.
    facts:
      - [War declared, "5 March 1824"]
      - [Guwahati occupied, "28 March 1824"]
      - [Rangpur capitulates, "late January 1825 (sources give 27–31 January)"]
      - [Treaty of Yandabo, "24 February 1826"]
