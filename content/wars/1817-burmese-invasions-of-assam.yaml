id: burmese-invasions-of-assam
name: Burmese invasions of Assam
start: "1817-01"
end: "1826-02-24"
tier: B
summary: "Three Burmese invasions of the Ahom kingdom of Assam, and its conquest. Called in by the exiled Ahom viceroy Badan Chandra Borphukan, a Burmese army defeated the Ahoms at Ghiladhari in 1817 and put him in power. A second invasion in 1819 restored King Chandrakanta Singha against his rival Purandar Singha, and when Chandrakanta turned against his patrons, a third invasion in 1821–1822 under Mingimaha Tilowa and Maha Bandula drove him out and ended Ahom rule. Burmese rule, remembered in Assam for its violence, brought the Konbaung empire to the borders of British Bengal. In the First Anglo-Burmese War the East India Company occupied Guwahati in 1824 and took the surrender of Rangpur in January 1825, and in the Treaty of Yandabo (24 February 1826) Burma renounced its claims to Assam and Manipur. Assam passed to British rule."
countries: [in, mm]
