steps:
  - title: Badan Chandra and the first two invasions
    date: 1817–1819
    when: "1817-03-27"
    borders: "1817-03-27"
    countries: [in, mm]
    body:
      - The Ahom kingdom had ruled the Brahmaputra valley for nearly six centuries, but it never recovered from the Moamoria rebellion. Power lay with the prime minister (Burhagohain) Purnananda, who governed for the young kings. In 1815 he ordered the arrest of the viceroy of Lower Assam, Badan Chandra Borphukan, for abuses of power. Badan fled to Bengal, and when the British would not help him, he went on in 1816 to the court of the Burmese king Bodawpaya at Amarapura.
      - In January 1817 a Burmese army, with Badan Chandra, crossed the Patkai hills into Assam and on 27 March defeated the Ahom forces at Ghiladhari. Purnananda died at about this time, and Badan Chandra took power under the king, Chandrakanta Singha. The Burmese went home in April with a large payment and an Ahom princess, Hemo Aideo, for Bodawpaya’s household. Badan was murdered in 1818, and Purnananda’s son Ruchinath Burhagohain drove Chandrakanta out and in February 1818 set the boy Purandar Singha on the throne.
      - Chandrakanta’s supporters turned to Burma. In February 1819 a second Burmese army under Kiamingi (Alaminggi) defeated Ruchinath’s forces near the Janji river, occupied Jorhat and restored Chandrakanta on 9 March. Purandar and Ruchinath fled west, and after another defeat at Khagarijan (Nagaon) in June they escaped into British territory. Burmese troops stayed in Assam until early 1820.
    facts:
      - [Battle of Ghiladhari, "27 March 1817, Burmese victory"]
      - [Purandar Singha made king, "February 1818"]
      - [Chandrakanta restored by the Burmese, "9 March 1819"]
