  - title: Bandula and Burmese rule
    date: 1821–1824
    when: "1821-02"
    borders: "1822-06-21"
    countries: [in, mm]
    body:
      - Chandrakanta soon tried to free himself from Burmese control. In February 1821 the new king, Bagyidaw, sent Mingimaha Tilowa with another army; Chandrakanta fled to Guwahati, and the Burmese crowned Jogeswar Singha, a brother of Hemo Aideo, as their king. Chandrakanta fought back from the west with Sikh and Hindustani soldiers hired in Bengal, defeated a force raised in Bhutan for his rival Purandar, retook Guwahati in the winter of 1821–1822 and advanced up the valley.
      - In April 1822 Maha Bandula, Burma’s leading general, arrived with about 20,000 men and defeated Chandrakanta at Mahgarh near Jorhat. On 21 June Chandrakanta was beaten again at Hadira Chowki, the old frontier post near Goalpara, and fled into British territory. Mingimaha Tilowa was proclaimed raja of Assam, and Ahom rule was at an end. Burma had taken Manipur in 1819, and its armies now pressed on Cachar and Jaintia.
      - The Burmese years are remembered in Assam as a time of terror. Garrison soldiers and local marauders plundered villages, killed and carried off people, and thousands of Assamese fled to Bengal and the hills; how many died is not known. Bandula demanded that the British hand over Chandrakanta and the other refugees, and clashes on the frontier followed.
    facts:
      - [Third invasion, "February 1821"]
      - [Battle of Mahgarh, "April 1822, Burmese victory"]
      - [Hadira Chowki, "21 June 1822, Burmese victory"]
