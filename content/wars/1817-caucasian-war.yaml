  - title: Gunib
    date: 1854–1859
    when: "1854"
    borders: "1859-09-06"
    countries: [ru, ge]
    body:
      - During the Crimean War Shamil hoped for help from the Ottomans and the British, which never came in strength. In July 1854 his son Ghazi Muhammad raided the Georgian estate of Tsinandali and carried off two princesses and their children, who were later exchanged for Shamil’s eldest son, held by the Russians since Akhulgo. After the war Prince Aleksandr Baryatinsky, the new viceroy, brought some 200,000 troops to bear. Roads and clearings closed in on Chechnya, and in 1858 the Russians took the Argun gorge and cut it in two.
      - Many villages, worn out by war, hunger and Shamil’s harsh rule, now made their peace with the Russians. Vedeno fell in April 1859 and the imamate collapsed. Shamil retreated with some 400 followers to the mountain village of Gunib in Dagestan, where Russian troops surrounded and stormed it. On 6 September 1859 he surrendered to Baryatinsky. He was taken to Saint Petersburg, lived in honourable exile in Kaluga, and died on pilgrimage in Medina in 1871. Resistance went on in places, but the war in the eastern Caucasus was over.
    facts:
      - [Raid on Tsinandali, "July 1854"]
      - [Vedeno taken, "April 1859"]
      - [Shamil surrenders at Gunib, "6 September 1859"]
