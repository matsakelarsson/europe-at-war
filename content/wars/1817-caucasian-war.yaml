  - title: The conquest of Circassia and the expulsion
    date: 1859–1864
    when: "1860"
    borders: "1864-06-02"
    countries: [ru, ge, tr]
    body:
      - With the east subdued, the Russian army turned on the Circassians, Ubykhs and Abaza of the western Caucasus, who had fought it for decades and had never been ruled by the Ottomans, although the sultan had claimed their coast. In 1861 their leaders formed an assembly at Sochi and appealed to Britain and the Ottoman Empire, without result. Alexander II approved a plan to drive the highland peoples out of the mountains and the coast and settle Cossacks there. From 1862 Russian columns under Yevdokimov moved through the valleys, burning villages and crops, and told the people to move to the Kuban plain or leave for the Ottoman Empire.
      - On 2 June 1864 a parade at Kbaade, today’s Krasnaya Polyana, marked the end of the war. By then hundreds of thousands of people were crowded on the coast, waiting for ships. Thousands died there of hunger, cold and disease, on overloaded boats and after landing at Trabzon, Samsun and other ports. Estimates vary widely, but several hundred thousand to more than a million people were killed or driven out, and only a small part of the Circassian people remained. Many sources call this a genocide. Georgia recognised it as one in 2011; Russia rejects the term.
    facts:
      - [End of the war, "Kbaade, 2 June 1864"]
      - [Expelled to the Ottoman Empire, "several hundred thousand to more than a million (estimates)"]
      - [Ubykhs, "almost all expelled; their language died out in 1992"]
    markers:
      - kind: event
        side: ci
        name: Sochi
        date: 1861
        text: Circassian and Ubykh leaders set up an assembly to govern their lands and sought foreign help against Russia.
        lonlat: [39.72, 43.585]
      - kind: event
