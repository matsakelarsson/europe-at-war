        date: September 1843
        text: Shamil’s forces converged on the village and wiped out the Russian garrisons that came to its help, opening his campaign in Avaria.
        lonlat: [46.789, 42.709]
      - kind: event
        side: ru
        name: Andi
        date: June – July 1845
        text: Vorontsov’s army waited here for three weeks, eating its supplies almost as fast as they arrived.
        lonlat: [46.263, 42.785]
        lp: l
