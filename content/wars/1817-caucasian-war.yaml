  - title: Ghazi Muhammad and Shamil’s imamate
    date: 1829–1840
    when: "1829"
    borders: "1839-09-03"
    countries: [ru]
    body:
      - In the highlands of Dagestan, Naqshbandi Sufi teachers preached that Muslims should live by Islamic law, not local custom, and resist Russian rule. In 1829 the scholar Ghazi Muhammad of Gimry was proclaimed imam, and from 1830 he waged holy war. In 1831 he besieged Russian forts and sacked Kizlyar, carrying off some 200 captives. On 29 October 1832 Russian troops stormed Gimry and he was killed. His successor, Hamzat Bek, murdered the ruling family of the Avar khanate at Khunzakh in 1834 and was himself killed in revenge that year.
      - The next imam was Shamil, an Avar who had escaped from Gimry badly wounded. He built a state with its own law, taxes and standing army, ruling through deputies called naibs. In the summer of 1839 General Pavel Grabbe besieged him in the rock fortress of Akhulgo for 80 days. When it fell, most of the defenders were killed, along with many of the women and children sheltering there, but Shamil escaped with a few followers. In 1840 the Chechens, fearing that the Russians would disarm them, rose and accepted him as imam.
    facts:
      - [Ghazi Muhammad proclaimed imam, "1829"]
      - [Shamil imam, "1834–1859"]
      - [Siege of Akhulgo, "summer 1839, 80 days"]
    markers:
