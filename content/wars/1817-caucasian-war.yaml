id: caucasian-war
name: Caucasian War
start: "1817"
end: "1864-06-02"
tier: A
summary: The Russian Empire’s half-century war to conquer the peoples of the North Caucasus, from Yermolov’s fortified lines of 1817 to the surrender of Imam Shamil at Gunib in 1859 and the subjugation of Circassia in 1864. It ended with the killing and mass expulsion of the Circassians and other peoples of the western Caucasus to the Ottoman Empire, which many sources call a genocide.
countries: [ru, ge, tr]
sides:
  - id: ru
    name: Russian Empire
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
  - id: im
    name: Caucasian Imamate and its allies
    polities: [caucasian-imamate]
    ink: olive
    moves: Moves by the imams’ forces
    success: Success for the imams
  - id: ci
    name: Circassians, Ubykhs and Abaza
    polities: [circassia]
    ink: orange
    moves: Circassian moves
    success: Circassian success
notes:
  - Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so Shamil’s surrender at Gunib is 25 August 1859 and the ceremony at Kbaade that marked the end of the war 21 May 1864 in Russian sources. Circassians mark 21 May as their day of mourning.
  - Russian sources of the time called all the peoples of the North Caucasus “mountaineers”. They were many peoples, among them Chechens, Ingush, Avars, Dargins, Lezgins and Kumyks in the east, and in the west Kabardians, Circassians (Adyghe), Abaza, Ubykhs and Karachays.
  - Numbers of dead and expelled are estimates, and they differ very widely between sources, above all for the expulsion of the Circassians in the 1860s.
  - The base map does not show the shifting zones of Russian control in the mountains, which steps show with lines and areas drawn from general accounts.
