        text: One of the coastal camps where expelled families waited, often for weeks and without food or shelter, for ships to Ottoman ports.
        lonlat: [39.077, 44.104]
      - kind: event
        name: Trabzon
        date: 1864
        text: Tens of thousands of refugees landed here, and many died of typhus and smallpox in the camps outside the town.
        lonlat: [39.722, 41.005]
