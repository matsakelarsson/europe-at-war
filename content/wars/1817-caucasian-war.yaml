steps:
  - title: Yermolov’s line
    date: 1817–1827
    when: "1817"
    borders: "1825"
    countries: [ru]
    body:
      - By 1815 Russia ruled Georgia and the khanates south of the mountains, but the peoples of the North Caucasus had never accepted its rule, and the one road over the mountains to Tiflis ran past their lands. Cossack settlements along the Terek and the Kuban suffered raids, and the Russians answered with punitive expeditions. In 1816 General Aleksey Yermolov, a hero of Borodino, took command in the Caucasus, convinced that only fear would bring peace. In 1817 he began to push the line of forts forward from the Terek to the Sunzha, and in 1818 he founded the fortress of Groznaya, “the Menacing”, today’s Grozny.
      - Forts at Vnezapnaya and Burnaya followed in Dagestan, and a line of posts across Kabarda in the early 1820s. Yermolov’s troops burned villages that resisted, destroyed crops, took hostages and cut wide clearings through the Chechen forests, while families were driven from the lowlands into the mountains. In 1819 his soldiers stormed the Chechen village of Dadi-Yurt house by house and killed most of its people. A rising in Chechnya in 1825 was put down, and in 1827 Yermolov was dismissed, distrusted after the Decembrist revolt and blamed for setbacks against Persia.
    facts:
      - [Fortress of Groznaya, "founded 1818"]
      - [Destruction of Dadi-Yurt, "September 1819"]
      - [Yermolov in command, "1816–1827"]
