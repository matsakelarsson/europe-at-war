        date: July 1845
        text: Vorontsov took the burning capital, but the fighting in the forest on the way in and on the way out nearly destroyed his army.
        lonlat: [46.233, 42.95]
      - kind: event
        side: ru
        name: Gerzel
        date: 1 August 1845
        text: Relief troops from Grozny met the survivors of Vorontsov’s army in the forest south of this fort.
        lonlat: [46.396, 43.25]
      - kind: held
