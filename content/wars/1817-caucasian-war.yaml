  - title: Dargo
    date: 1843–1847
    when: "1843"
    borders: "1845-07-18"
    countries: [ru]
    body:
      - In 1843 Shamil struck in Dagestan. Moving his forces faster than the Russians could follow, he took almost every Russian post in Avaria within weeks and besieged the garrisons that were left. The campaign cost the Russians some 2,600 men and a dozen forts. Nicholas I sent large reinforcements and appointed Count Mikhail Vorontsov viceroy, with orders to destroy the imamate. In June 1845 Vorontsov marched south into the mountains with about 18,000 men, waited for weeks at Andi for supplies, and on 18 July took Shamil’s capital, Dargo, which the imam had set on fire.
      - In the forests around Dargo the Chechens felled trees across the paths and attacked the strung-out columns from cover. A column sent to fetch a supply convoy lost hundreds of men and General Passek. Starving and burdened with wounded, Vorontsov’s army fought its way north for a week until relief troops met it. The campaign cost about 3,600 killed and wounded, among them three generals. Afterwards the Russians turned to slower methods, building forts and roads and clearing the forests, while Shamil moved his capital to Vedeno and beat off a Russian assault on Gergebil in 1847.
    facts:
      - [Shamil’s offensive in Dagestan, "August – December 1843"]
      - [Dargo taken, "18 July 1845"]
      - [Russian losses in the Dargo campaign, "about 3,600 killed and wounded"]
    markers:
      - kind: taken
        side: im
