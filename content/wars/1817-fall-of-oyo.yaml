  - title: Eleduwe and the end of Oyo-Ile
    date: about 1835–1840
    when: "1835"
    borders: "1836-06-01"
    countries: [ng, bj]
    body:
      - Alaafin Oluewu refused to do homage to the emir of Ilorin and made a last attempt to restore Oyo. He raised troops from the towns still loyal to him and allied with the kings of Borgu to the north-west, led by Sero Kpera of Nikki, whom the Yoruba called Eleduwe, with the rulers of Kaiama and Bussa. In about 1835 (the dates in the sources range from 1831 to 1836) they marched on Ilorin, whose emir was reinforced from Gwandu and Sokoto. On the first day the allies drove the Ilorin army back to its walls; on the second its cavalry turned their flank. Sero Kpera was killed, and Oluewu died fighting with his eldest son and several of the Borgu chiefs.
      - When the news reached Oyo-Ile, most of its people fled south, and the capital that had ruled an empire for two centuries was abandoned. Atiba, a son of Alaafin Abiodun, became alaafin in about 1837 and set up his court at Ago-Oja, some 130 km to the south, which became the new Oyo. He gave the title of Are-Ona-Kakanfo to Kurunmi of Ijaye and that of basorun to Oluyole of Ibadan, charging them with defending the west against Dahomey and the north against Ilorin.
      - Ilorin pressed on south. In about 1840 its army besieged Osogbo, and an army from Ibadan routed it. The battle of Osogbo ended the advance of the jihad into the forest, where cavalry was of little use, and made Ibadan the leading Yoruba power. But the successor towns soon fought each other, in the Ijaye war of 1860–1865 and the Kiriji war of 1877–1893, until British rule ended the wars.
    facts:
      - [Eleduwe war (battle of Ilorin), "about 1835"]
      - [Oyo-Ile abandoned, "about 1835–1836"]
      - [Battle of Osogbo, "about 1840"]
