steps:
  - title: Afonja and Ilorin
    date: 1817 – about 1824
    when: "1817"
    borders: "1817-06-01"
    countries: [ng, bj]
    body:
      - At its height in the 18th century Oyo, ruled from Oyo-Ile in the savanna north of the forest, was the greatest power between the Volta and the Niger. Its cavalry made the Yoruba towns and Dahomey its tributaries, and captives from its wars were sold to European slave ships at Porto-Novo and Badagry. Power was shared uneasily between the alaafin and the Oyo Mesi, the council of chiefs; in the time of the basorun Gaha (1754–1774) several alaafins were forced to take their own lives, and after Alaafin Abiodun died in 1789 the throne was repeatedly disputed. In 1796 Alaafin Awole, ordered by his own army commander to die, did so, and for years afterwards the empire had no effective ruler.
      - The commander, the Are-Ona-Kakanfo, was Afonja, whose family held Ilorin, a town on the northern edge of Oyo’s heartland. In 1817 he broke openly with the capital. To strengthen himself he welcomed Muslims to Ilorin, among them a Fulani scholar, Salih Janta, known as Mallam Alimi, and a growing force of Hausa and Yoruba Muslims, the jama’a, many of them slaves who had fled their Oyo masters. With their help Afonja beat off the forces sent against him and raided Oyo’s towns. But the jama’a grew stronger than their host. In about 1823 they turned on Afonja and killed him, and Alimi’s son Abdulsalami became the first emir of Ilorin, which joined the Sokoto Caliphate under the emirs of Gwandu.
      - "Oyo’s outer empire fell away at the same time. In the early 1820s Gezo of Dahomey stopped paying the tribute his kingdom had paid since the 18th century and defeated the armies Oyo sent against him. When the British explorer Hugh Clapperton crossed Oyo in 1826, he passed villages burnt by Ilorin’s horsemen, and Alaafin Majotu asked him for British help against the rebels."
    facts:
