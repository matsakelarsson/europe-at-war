notes:
  - "The history of these years rests mostly on Yoruba oral tradition, written down later in the 19th century, above all in Samuel Johnson’s History of the Yorubas (finished in 1897), with a few European accounts such as Hugh Clapperton’s of 1826. Dates are uncertain and vary between sources; this story follows the chronology of Robin Law, who dates Afonja’s revolt to 1817, his death to about 1823 and the abandonment of Oyo-Ile to about 1835–1836."
