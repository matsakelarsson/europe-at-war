  - title: The Owu war and the new towns
    date: about 1817–1833
    when: "1822"
    borders: "1830-06-01"
    countries: [ng]
    body:
      - With Oyo’s authority gone, the southern Yoruba fought among themselves. A quarrel over kidnapping and slave dealing at the market of Apomu set Ife and Ijebu, whose armies had muskets bought on the coast, against the kingdom of Owu. Joined by bands of refugees and warriors from Oyo, they besieged Owu for several years and destroyed it in the early 1820s (dates in the sources range from 1817 to 1826). The victorious army then turned on the Egba towns of the forest to the south-west and destroyed them one after another.
      - The allied army settled at Ibadan, a deserted Egba village, in about 1829; led by Oyo war chiefs, it grew into a great military town that took in refugees from everywhere. The Egba survivors, under their leader Sodeke, founded Abeokuta beneath Olumo Rock in 1830, and the Owu joined them there in the 1830s. In 1833 Oyo warriors under Dado and Kurunmi seized the Egba town of Ijaye and made it their own.
      - "Tens of thousands of people were captured in these wars and sold to Atlantic slave traders through Lagos, Badagry and Porto-Novo, at a time when Britain was trying to suppress the trade at sea; most were taken to Brazil and Cuba, where Yoruba speakers were known as Nagô and Lucumí. One of them, a boy named Ajayi, was captured in 1821, sold at Lagos and freed by a British warship in 1822; as Samuel Ajayi Crowther he became the first African bishop of the Anglican Church."
    facts:
      - [Destruction of Owu, "early 1820s (dates vary)"]
      - [Ibadan settled, "about 1829"]
      - [Abeokuta founded, "1830"]
