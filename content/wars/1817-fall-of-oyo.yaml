id: fall-of-oyo
name: Fall of the Oyo Empire
start: "1817"
end: "1836"
tier: B
summary: "The collapse of Oyo, the Yoruba empire that had dominated the savanna and forest between the Niger and the coast of the Bight of Benin since the 17th century. Weakened by decades of conflict between its kings, the alaafins, and its chiefs, Oyo lost its northern stronghold of Ilorin in 1817, when Afonja, the commander of its army, rebelled and called in Muslim allies; by the 1820s Ilorin had become an emirate of the Sokoto Caliphate and was raiding the heart of the empire. Dahomey threw off Oyo’s overlordship, and in the south the Owu war and the destruction of the Egba towns uprooted whole populations. In about 1835 Alaafin Oluewu and his Borgu allies were defeated and killed outside Ilorin in the Eleduwe war, and the capital, Oyo-Ile, was abandoned. Refugees and war chiefs built new towns further south, Ibadan, Abeokuta, Ijaye and a new Oyo, whose rivalries shaped the Yoruba wars of the rest of the century. Captives taken in these wars were sold in great numbers into the Atlantic slave trade through Lagos and Porto-Novo, above all to Brazil and Cuba."
countries: [ng, bj]
