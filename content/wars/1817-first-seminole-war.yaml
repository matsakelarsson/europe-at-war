steps:
  - title: Prospect Bluff, Fowltown and the Apalachicola
    date: July 1816 – December 1817
    when: "1817-11-21"
    borders: "1817-11-30"
    countries: [us, es]
    body:
      - After the Creek War of 1813–1814 and the Treaty of Fort Jackson, which took some 23 million acres from the Creek Nation, many Red Stick refugees under leaders such as Peter McQueen and Josiah Francis (Hillis Hadjo) moved south into Spanish Florida. There they joined the Seminole towns of the Alachua and Suwannee country, led by Bolek (Bowlegs), and the Miccosukee towns near Lake Miccosukee. Black people who had escaped slavery in Georgia and the Carolinas lived beside them in their own towns, as the Black Seminoles. Spain held little more than St. Augustine, Pensacola and the fort of St. Marks.
      - During the War of 1812 the British built a fort at Prospect Bluff on the Apalachicola River and armed Black recruits and Native allies as Colonial Marines. When they left in 1815 they handed the fort over to some 300 maroons and Choctaw and Seminole allies, led by a former carpenter from Pensacola named Garçon. Georgia slaveholders saw a free Black community with cannon as a threat, and on 27 July 1816 a US expedition under Lieutenant Colonel Duncan Clinch, with Lower Creek warriors, besieged the fort. A heated shot from a navy gunboat struck its powder magazine, and the explosion destroyed it. Most accounts give more than 250 of about 320 occupants killed; the historian Claudio Saunt has argued that far fewer died. Garçon and a Choctaw leader were executed by the attackers, and most survivors were carried off into slavery.
      - "The US Army built Fort Scott on the Flint River just above the Florida line, on land the Miccosukee leader Neamathla of Fowltown said had never been ceded. When Neamathla warned the Americans not to cross the Flint, General Edmund Gaines sent 250 men against Fowltown on 21 November 1817; they were driven off, then burned the town the next day. On 30 November Seminole and Red Stick warriors attacked a supply boat carrying 40 to 50 people up the Apalachicola under Lieutenant Richard W. Scott, among them about 20 sick soldiers, seven soldiers’ wives and perhaps some children; most of those aboard were killed, one woman was taken captive and six men escaped. US sources called it the Scott Massacre. On 26 December the War Department gave Andrew Jackson command."
