notes:
  - "Sources date the war differently: the US Army has used 1814–1819 and 1817–1818, the Naval History and Heritage Command 1816–1818. The dates here run from the attack on Fowltown to the Spanish surrender of Pensacola; the destruction of the fort at Prospect Bluff in 1816 is often counted as its opening."
  - "“Seminole” was the name the Creeks and Europeans gave to the Muscogee- and Mikasuki-speaking towns that had moved into Florida during the 1700s; the Miccosukee towns under leaders such as Kinache and Neamathla were often counted with them. The Black Seminoles were allies, not slaves in the plantation sense: they lived in their own towns, bore arms and paid a share of their harvests to Seminole leaders."
  - The fort at Prospect Bluff is called the “Negro Fort” in US sources of the time and in most histories, and is also known as the British Post or Fort Blount.
