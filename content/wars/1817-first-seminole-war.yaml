  - title: Jackson’s invasion of Florida
    date: March – May 1818
    when: "1818-03-15"
    borders: "1818-05-28"
    countries: [us, es, gb]
    body:
      - "Jackson crossed into Spanish Florida from Fort Scott on 15 March 1818 with about 800 regulars, 1,000 Tennessee volunteers and 1,000 Georgia militia, joined by about 1,400 Lower Creek warriors under William McIntosh. He built Fort Gadsden on the ruins of the Prospect Bluff fort, then marched east. On 31 March and 1 April his army burned the Red Stick town at present-day Tallahassee and the Miccosukee towns by Lake Miccosukee, destroying more than 300 houses; their people had fled. On 7 April he seized the Spanish fort of St. Marks over its commandant’s protest. Josiah Francis and the Red Stick leader Homathlemico, lured aboard a US ship flying a British flag, were hanged without trial."
      - McIntosh’s warriors caught Peter McQueen’s Red Stick band on the Econfina River on 12 April, killing about 40 men and capturing about 100 women and children. Jackson then marched on Bowlegs Town on the Suwannee, the main Seminole and Black Seminole settlement. Warned in time, most of its people crossed the river; on 16 April a rear guard of some 200 to 300 Black Seminoles under Nero held off the Creek vanguard while the evacuation was completed, then retreated across the Suwannee, losing perhaps eleven dead. Jackson’s troops burned the deserted town.
      - At St. Marks Jackson had two British subjects tried by a military court for aiding the Seminoles. Alexander Arbuthnot, a Scottish trader who had written letters for Seminole leaders, was hanged from the yardarm of his own schooner, and Robert Ambrister, a former Royal Marine officer, was shot on 29 April, Jackson having overturned the court’s lighter sentence. Claiming that Spain was sheltering and arming the Seminoles, Jackson then marched west with about 1,000 men and entered Pensacola on 24 May; the Spanish governor withdrew to Fort Barrancas, which surrendered on 28 May after a short bombardment.
    facts:
