  - title: The Adams–Onís Treaty and the cession of Florida
    date: 1818–1823
    when: "1819-02-22"
    borders: "1821-07-18"
    countries: [us, es, gb]
    body:
      - Spain protested the seizure of its forts, and Britain the executions of Arbuthnot and Ambrister; in Washington several cabinet members wanted Jackson censured, and Congress debated the invasion for weeks before voting down motions to condemn him. Secretary of State John Quincy Adams instead defended it, agreed to return St. Marks and Pensacola to Spain and told the Spanish minister, Luis de Onís, that Spain must either control Florida or cede it. Britain did not press its protest.
      - By the Adams–Onís Treaty, signed on 22 February 1819, Spain ceded East Florida and its claim to West Florida, the United States assumed up to $5 million of its citizens’ claims against Spain and gave up its claim to Texas, and a boundary was drawn across the continent to the Pacific. After delays the treaty was ratified in February 1821, and the United States took possession of St. Augustine on 10 July and Pensacola on 17 July 1821, with Jackson as military governor.
      - For the Seminoles the war was the start of a long retreat. Their northern towns had been burned, and slave catchers raided the Black Seminole settlements. By the Treaty of Moultrie Creek, negotiated near St. Augustine in September 1823 with Neamathla as chief spokesman, they gave up their claims to most of Florida for a reservation of about four million acres in the centre of the peninsula, away from the coasts; six leaders kept their towns on the Apalachicola. Pressure to remove them west of the Mississippi led to the Second Seminole War in 1835.
    facts:
      - [Adams–Onís Treaty signed, "22 February 1819"]
      - [Florida handed over, "10 and 17 July 1821"]
      - [Treaty of Moultrie Creek, "September 1823"]
