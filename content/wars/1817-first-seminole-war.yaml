id: first-seminole-war
name: First Seminole War
start: "1817-11-21"
end: "1818-05-28"
tier: B
summary: "The first war between the United States and the Seminoles of Spanish Florida, in 1817–1818. After the Creek War of 1813–1814 thousands of Red Stick Creeks had fled into Florida and joined the Seminole and Miccosukee towns, and Black people who had escaped slavery in Georgia and the Carolinas lived beside them as free communities, the Black Seminoles. In July 1816 a US expedition destroyed the fort at Prospect Bluff on the Apalachicola that the British had left to former Colonial Marines and maroons. In November 1817 US troops attacked the Miccosukee town of Fowltown in Georgia, and Seminole warriors in turn attacked a US supply boat on the Apalachicola. In March 1818 Andrew Jackson invaded Florida with about 4,000 regulars, militia and Lower Creek warriors, burned the Miccosukee and Red Stick towns, seized the Spanish fort of St. Marks, attacked Bowlegs Town on the Suwannee, executed two British subjects and took Pensacola. Spain, unable to defend Florida, ceded it to the United States by the Adams–Onís Treaty of 1819, which took effect in 1821."
countries: [us, es]
