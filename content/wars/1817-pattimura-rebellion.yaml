id: pattimura-rebellion
name: Pattimura’s rebellion
start: "1817-05-15"
end: "1817-12-16"
tier: C
summary: "A rising in the islands of the central Moluccas against the return of Dutch rule after the British occupation of 1810–1817. Under the Convention of London of 1814 Britain handed the Moluccas back to the Netherlands, and the transfer took place at Ambon in March 1817. People on Saparua and the other Lease islands feared a return to the Company-era burdens of forced deliveries and forced labour, and the conscription of Ambonese men, many of them former soldiers of the British Amboina Corps, for service in Java. On 14 May 1817 village leaders meeting on Saparua chose Thomas Matulessy, a Protestant former sergeant-major of the Amboina Corps, as their captain, Kapitan Pattimura. On 15–16 May they took Fort Duurstede, the Dutch post on Saparua, and killed its garrison and the young Resident, Johannes Rudolph van den Berg, with his wife and children; one five-year-old son survived. A relief force of about 300 men under Major Beetjes landed on Saparua on 20 May and was destroyed; most of its men, Beetjes among them, were killed. The rising spread to Haruku, Nusalaut, parts of Ambon and the coast of Seram, Christian and Muslim villages fighting together, and on 1 June the rebels attacked Fort Nieuw Zeelandia on Haruku but were beaten off. Dutch warships with reinforcements, helped by fleets of the sultans of Ternate and Tidore, retook Fort Duurstede on 3 August, and by November the rising had been crushed. Pattimura was betrayed and captured at Booi on Saparua on 12 November, and on 16 December 1817 he was hanged with four other leaders in front of Fort Nieuw Victoria in Ambon; Kapitan Paulus Tiahahu of Nusalaut was executed, and his daughter Martha Christina Tiahahu, who had fought beside him, died on a Dutch ship taking her to forced labour in Java in January 1818. Pattimura was declared a National Hero of Indonesia in 1973, and both he and Martha Christina Tiahahu are commemorated in Maluku."
