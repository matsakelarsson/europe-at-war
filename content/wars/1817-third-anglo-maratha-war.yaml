id: third-anglo-maratha-war
name: Third Anglo-Maratha War
start: "1817-11-05"
end: "1819-04-09"
tier: B
summary: "The last war between the British East India Company and the Maratha powers, also called the Pindari War. In 1817 the Governor-General, Lord Hastings, gathered some 120,000 men to destroy the Pindaris, the mounted raiders of central India, and forced Scindia and Amir Khan to join him. The Peshwa Baji Rao II, the Bhonsle ruler of Nagpur and Holkar’s army rose against the Company and were beaten at Khadki, Sitabuldi and Mahidpur, and a small Company force held off the Peshwa’s army at Koregaon. Baji Rao surrendered in June 1818 and was pensioned off to Bithur; his lands were annexed, the Raja of Satara was given a small state, Nagpur and Holkar lost territory, and the Pindari bands were broken up. Asirgarh, the last fortress to hold out, fell in April 1819. The Company was now the paramount power in India south of the Sutlej."
