notes:
  - The Company’s armies were mostly Indian sepoys under British officers, with some British Army regiments.
  - The Pindaris were bands of irregular horsemen who had served the Maratha armies for plunder instead of pay. By 1817 their chiefs Chitu, Karim Khan and Wasil Muhammad led some 20,000–30,000 riders who raided far into Company territory.
  - Most of the soldiers who held Koregaon in 1818 were Mahars, and the victory obelisk there has become a place of Dalit commemoration every 1 January. The anniversary in 2018 was followed by clashes in Maharashtra.
