  - title: Sitabuldi, Mahidpur and Koregaon
    date: November 1817 – January 1818
    when: "1817-11-26"
    borders: "1818-01-06"
    countries: [in]
    body:
      - At Nagpur the Bhonsle ruler, Mudhoji II, known as Appa Saheb, accepted a title from the Peshwa and attacked the Company’s Residency on 26 November 1817. About 1,500 sepoys under Lieutenant-Colonel Hopetoun Scott held the twin hills of Sitabuldi for two days against some 18,000 men, among them Arab mercenaries, and a cavalry charge broke the attack. Reinforcements beat Appa Saheb’s army outside Nagpur on 16 December. Holkar’s army, whose commanders murdered the regent Tulsi Bai to keep the boy Malhar Rao Holkar from making peace, met Hislop and Sir John Malcolm at Mahidpur on the Shipra river on 21 December. It was defeated with about 3,000 killed and wounded against some 800 Company losses, and on 6 January 1818 Holkar’s government signed the Treaty of Mandsaur, ceding land and accepting a subsidiary alliance.
      - Meanwhile Baji Rao had doubled back towards Pune. On 1 January 1818 a Company detachment under Captain Francis Staunton, about 500 sepoys of the 2nd Battalion of the 1st Bombay Native Infantry, some 250 irregular horse and two guns, ran into the Peshwa’s army at the village of Koregaon on the Bhima river. Staunton’s men held the village all day against repeated attacks by Arab, Gosain and Maratha infantry, without food or water, losing about a third of their number, and the Peshwa’s army moved off that night as Smith approached.
    facts:
      - [Battle of Sitabuldi, "26–27 November 1817, Company victory"]
      - [Battle of Mahidpur, "21 December 1817, Company victory"]
      - [Battle of Koregaon, "1 January 1818"]
      - [Treaty of Mandsaur, "6 January 1818"]
    markers:
