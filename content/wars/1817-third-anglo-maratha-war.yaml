steps:
  - title: The Pindari campaign and the rising at Pune
    date: October – November 1817
    when: "1817-11-05"
    borders: "1817-11-17"
    countries: [in]
    body:
      - After years of Pindari raids into Company territory, the Governor-General, Lord Hastings, received leave from London to destroy them in 1817. He gathered about 120,000 men in two armies, the Grand Army from Bengal under his own command and the Army of the Deccan under Sir Thomas Hislop, to close on the Pindari country in Malwa and the Narmada valley from north and south. Hastings marched to the edge of Scindia’s lands, and on 5 November Scindia signed the Treaty of Gwalior, promising help against the Pindaris and handing over forts as surety. The Pathan commander Amir Khan disbanded his army in return for recognition as Nawab of Tonk.
      - The Peshwa, Baji Rao II, had been forced by the Treaty of Poona in June 1817 to give up lands and his rights over the other Maratha chiefs, and he had been building up his army. On 5 November 1817, the day Scindia signed, his army of perhaps 20,000 horse and 8,000 foot attacked the Company’s small force at Khadki (Kirkee), outside Pune, after the British Resident, Mountstuart Elphinstone, had withdrawn there from the burning Residency. The attack was beaten off. Company reinforcements under General Lionel Smith arrived, and on 17 November Pune was occupied; Baji Rao fled south with his army.
    facts:
      - [Company forces, "about 120,000 men"]
      - [Treaty of Gwalior, "5 November 1817"]
      - [Battle of Khadki, "5 November 1817, Company victory"]
      - [Pune occupied, "17 November 1817"]
