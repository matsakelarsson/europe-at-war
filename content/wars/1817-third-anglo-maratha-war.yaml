  - title: The end of the Peshwa
    date: February 1818 – April 1819
    when: "1818-02-19"
    borders: "1818-06-03"
    countries: [in]
    body:
      - Smith took Satara in February 1818 and proclaimed that the Peshwa’s government was at an end. On 19 February his cavalry caught Baji Rao’s army at Ashti, north of Pandharpur. The Peshwa’s commander, Bapu Gokhale, was killed covering his master’s escape, and Pratap Singh, the Raja of Satara and descendant of Shivaji, who had been kept by the Peshwa, fell into British hands. Baji Rao fled north through Khandesh, while the Pindari bands, hunted by Company columns, broke up; Karim Khan surrendered and was given land near Gorakhpur, and Chitu fled into the jungle near Asirgarh, where he was killed by a tiger.
      - On 3 June 1818 Baji Rao surrendered to Malcolm at Dhulkot, near Asirgarh. He gave up all claims to rule and was sent to live at Bithur, near Kanpur, on a pension of 8 lakh rupees a year. His lands were annexed to the Bombay Presidency, except a small state around Satara given to Pratap Singh. Appa Saheb was deposed and escaped, and Nagpur lost its lands in and north of the Narmada valley, which became part of the Saugor and Nerbudda Territories. The fortress of Asirgarh, held for Appa Saheb by Scindia’s commander, was the last to fall, on 9 April 1819.
    facts:
      - [Battle of Ashti, "19 February 1818, Company victory"]
      - [Peshwa surrenders, "3 June 1818"]
      - [Asirgarh falls, "9 April 1819"]
      - [Baji Rao’s pension, "8 lakh rupees a year"]
    markers:
      - kind: taken
        side: eic
        name: Satara
        date: February 1818
        text: Smith occupied the town of the Maratha kings. A small state was later recreated here for the Raja of Satara.
        lonlat: [74.000, 17.680]
      - kind: battle
        side: eic
        name: Ashti
        date: 19 February 1818
        text: Bapu Gokhale was killed in a cavalry action, and the Raja of Satara and his family were taken from the Peshwa’s camp.
        lonlat: [75.410, 17.840]
