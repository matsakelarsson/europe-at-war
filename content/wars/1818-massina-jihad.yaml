notes:
  - "The history of the Dina is known mainly from Fulbe traditions collected by Amadou Hampâté Bâ and Jacques Daget, from Arabic writings produced at Hamdullahi (among them the Tarikh al-Fattash in the form Seku Amadu’s scholars gave it) and from the reports of travellers such as René Caillié (1828) and Heinrich Barth (1853–1854). The size of the armies at Noukouma in the traditions, 100,000 or even 200,000 men against 1,000, cannot be taken literally, and dates in the sources differ by a year or two: Djenné is said to have fallen in 1818 or 1819, Hamdullahi to have been founded between 1819 and 1821, and Seku Amadu to have died in 1844 or 1845."
  - "Seku Amadu first sought the blessing of Usman dan Fodio of Sokoto and received a flag from him, but soon ruled as an independent caliph. He and his successors belonged to the Qadiriyya Sufi order, like the Kunta scholars of Timbuktu; Umar Tall led the rival Tijaniyya, which sharpened their quarrel."
