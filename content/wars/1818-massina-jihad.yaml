id: massina-jihad
name: Massina jihad
start: "1818"
end: "1862-05"
tier: B
summary: "The holy war by which the Fulbe scholar Seku Amadu (Ahmadu Lobbo) founded the Caliphate of Hamdullahi, also called the Dina or the Massina Empire, in the inland delta of the Niger. Massina’s Fulbe chiefs, the ardos, were tributaries of the Bamana kings of Ségou, and Seku Amadu, a preacher from a minor scholarly family, accused them of tolerating unbelief and of oppressing their people. When one of his followers killed the son of the leading ardo in 1816 or 1817, the ardos and Ségou sent an army against his small community at Noukouma, where on 21 March 1818 it was routed. Seku Amadu’s following grew quickly; Djenné opened its gates, the Fulbe of Massina rose against their ardos, and about 1820 he founded a new capital, Hamdullahi (“praise be to God”). The Dina was governed by a council of forty scholars under strict Maliki law, settled the pastoral Fulbe and fixed the rules for herders and farmers in the delta that are still remembered. In 1826 Timbuktu, where the descendants of the Moroccan conquerors, the Arma, still held a nominal authority under Tuareg protection, accepted Hamdullahi’s overlordship, and the Dina fought the Tuareg and the Arma for control of the city until 1846. Its third ruler, Amadu III, refused to join Umar Tall against Ségou and sent his army to help it; in May 1862 Umar defeated the Massina army at Cayawal, took Hamdullahi and had Amadu III executed. The Massina rising against Umar that followed is part of the story of Umar Tall’s jihad."
