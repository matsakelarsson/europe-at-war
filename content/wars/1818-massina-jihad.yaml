  - title: Timbuktu, the Arma and the Tuareg
    date: 1825–1846
    when: "1826"
    borders: "1840-01-01"
    countries: [ml, bf]
    body:
      - Timbuktu had been ruled since 1591 by the Arma, the descendants of the Moroccan soldiers who conquered the Songhai Empire; by the early 19th century their pasha was a figurehead, the city paid tribute to the Tuareg of the Niger bend, and real authority lay with the Kunta scholars led by Sidi Muhammad al-Kunti. After Sidi Muhammad’s death in 1825 or 1826, Seku Amadu sent an envoy with troops to demand that the Arma governor, al-Qa’id Uthman, give up his drums and other signs of sovereignty, and Uthman submitted. Hamdullahi also brought the Fulbe chiefdoms south-east of the delta, among them Djelgodji around Djibo and Barani, under its protection in the late 1820s, after costly battles; its attempts to expand westward against Kaarta failed with heavy losses, especially in 1843–1844.
      - Hamdullahi’s strict rule, its ban on tobacco and its demand that women be kept apart from men clashed with Tuareg custom, and its control of the river hurt Timbuktu’s trade. In 1833 Uthman threw off his allegiance and marched against Hamdullahi with the Tuareg, but was defeated; al-Mukhtar al-Saghir, the new head of the Kunta, arranged a truce under which Massina’s forces would stay out of the city, and Hamdullahi then appointed a Fulbe governor for the whole region up to Gao. The Tuareg drove out a Massina garrison in 1840, were expelled in 1841 and won again in 1842–1844; Massina then blockaded the river, and by 1846 Timbuktu, starved of grain, accepted its rule once more, with the Kunta as go-betweens. Seku Amadu had died in 1845, and was succeeded by his son Amadu II (1845–1853).
    facts:
      - [Timbuktu accepts Hamdullahi’s overlordship, "1826"]
      - [Uthman’s revolt defeated, "1833"]
      - [Tuareg hold Timbuktu, "1840–1841 and 1844–1846"]
      - [Death of Seku Amadu, "20 April 1845"]
