steps:
  - title: Noukouma and the founding of Hamdullahi
    date: 1816–1821
    when: "1818-03-21"
    borders: "1820-06-01"
    countries: [ml]
    body:
      - In the early 19th century the inland delta of the Niger, flooded every year and rich in pasture, fish and rice, was shared by Fulbe herders, Bozo fishermen, Marka traders and Bamana farmers. Its Fulbe chiefs, the ardos of the Dikko lineage, paid tribute to the Bamana kings of Ségou, who held the river with their war canoes. Seku Amadu, born about 1776 and taught by the Kunta scholars of the Sahara, preached a return to strict Islam, freedom for slaves who converted and an end to the cattle and market taxes; he was expelled from Djenné and from the Massina town of Sebera, and gathered his followers at Noukouma. In 1816 or 1817 one of them killed Ardo Guidado, son of the senior ardo, Ardo Amadu, at the village of Simay north of Djenné in a quarrel over a stolen blanket.
      - Ardo Amadu called on his overlord, Da Diarra of Ségou, and on the other ardos and chiefs of the region. Their army, under the Bamana general Jamogo Séri, came against Noukouma when the flood was falling in March 1818. On 21 March Seku Amadu’s followers, about a thousand Fulbe, Marka and Bozo with bows and spears, attacked in three bands; the Bamana army, which had firearms, fell into confusion, Jamogo Séri was killed and his men retreated. The victory was taken as a sign from God. Deserters, runaway slaves and Fulbe tired of the ardos joined the jihad, the Fulbe of Massina rose against the Dikko, and Djenné, whose scholars welcomed Seku Amadu, submitted in 1818 or 1819.
      - About 1820 Seku Amadu founded his own capital, Hamdullahi, east of the Bani on the edge of the Bandiagara plateau, a walled town of some 11,000 people around a plain mosque and his residence. He ruled as almami and commander of the faithful with a council of forty scholars, appointed his relatives as governors of five provinces, banned tobacco, alcohol, music and dancing, and had the great mosque of Djenné abandoned as too ornate. Chiefs who had joined him for their own ends, such as Gelaajo of Kunari, were removed; Gelaajo rebelled in 1824 and fled. The war with Ségou went on in raids along the river for decades.
