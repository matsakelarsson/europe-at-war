  - title: Umar Tall and the end of the Dina
    date: 1853 – May 1862
    when: "1862-05-15"
    borders: "1862-05-17"
    countries: [ml]
    body:
      - Amadu III, elected by the council in 1853 at the age of about 23 over his more experienced kinsman Ba Lobbo, a nephew of Seku Amadu, kept up the raids on Ségou until 1855 and quarrelled with the Kunta leader Ahmad al-Bakkay, who protected the German traveller Heinrich Barth in Timbuktu against Hamdullahi’s demand that he be handed over. When Umar Tall attacked Ségou in 1860, Amadu III, who regarded the Bamana as Massina’s to convert and Umar’s Tijaniyya as a rival to his own Qadiriyya order, offered the Bamana king Ali Diarra help on condition that he accept Islam. Ba Lobbo led a Massina army to Tio, across the Niger from Sansanding, where Umar crossed the river at night and routed the allies in February 1861; Ségou fell on 10 March, and Ali Diarra fled to Hamdullahi.
      - Umar wrote a treatise to justify a war against a Muslim state that sheltered unbelievers and set out from Ségou on 13 April 1862. His army, about 30,000 men, most with firearms, met the Massina army at Cayawal on 10 May and, after six days of fighting and skirmishing, broke it on 15 May; Massina’s losses are put at about 30,000 dead and Umar’s at 10,000, and the battles of the campaign together are said to have cost more than 70,000 lives. Umar entered Hamdullahi on 16 or 17 May. Amadu III fled, wounded, and was caught and executed; the sources give the date as 16 May or the end of June 1862. The Dina was at an end, but within a year Ba Lobbo and the Kunta led Massina into revolt against Umar.
    facts:
      - [Battle of Tio, "February 1861"]
      - [Battle of Cayawal, "10–15 May 1862"]
      - [Hamdullahi taken, "16 or 17 May 1862"]
