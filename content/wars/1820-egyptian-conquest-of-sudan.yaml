  - title: Sennar, Fazughli and Kordofan
    date: 1821
    when: "1821-06-14"
    borders: "1821-08-19"
    countries: [sd]
    body:
      - From Khartoum Ismail’s army crossed into the Gezira, the land between the two Niles. The Funj Sultanate of Sennar, which had ruled the middle Nile since about 1504, had long been divided by its regents, and on 14 June 1821 the last sultan, Badi VII, surrendered; the Egyptians entered Sennar the next day without a fight. Ismail went on up the Blue Nile to Fazughli in the hills near the Ethiopian border, the farthest point of the conquest. He found no gold worth mining, and the army turned to raiding the hill peoples of the south for slaves. Ibrahim Pasha, Muhammad Ali’s eldest son, joined him late in 1821 and organised boats to carry the captives north.
      - Meanwhile the defterdar Muhammad Bey Khusraw, Muhammad Ali’s son-in-law, crossed from the Nile at Al Dabbah to Kordofan, then a province of the Sultanate of Darfur, with 3,000–4,000 men and artillery. At Bara, north of El Obeid, his guns and muskets broke a Darfur army of more than 9,000 under the Fur governor, the maqdum Musallim, who was killed with about 1,500 of his men (on 19 August 1821 by one account, in April by another). The Egyptians sacked El Obeid. Kordofan stayed Egyptian, but Darfur kept its independence for another half-century.
      - The captives were marched or shipped north to camps at Aswan, where a French officer, Joseph Sève (Sulayman Pasha), trained the new army. Disease and hardship killed most of them; of an estimated 30,000 Sudanese brought to Aswan in 1822–1823, only about 3,000 are said to have survived.
    facts:
      - [Surrender of Sennar, "14 June 1821"]
      - [Battle of Bara, "1821"]
      - [Darfur army at Bara, "more than 9,000; about 1,500 killed"]
