notes:
  - "Sudanese call the period of Egyptian rule (1821–1885) the Turkiyya, “Turkish rule”, because the governors and officers were Turkish-speaking Ottoman subjects. Muhammad Ali governed Egypt in the Ottoman sultan’s name, and his army was made up of Turkish, Albanian and other Ottoman troops with Bedouin auxiliaries."
  - Some dates, among them the battle of Bara and the month of Ismail’s death, differ between the sources.
