id: egyptian-conquest-of-sudan
name: Egyptian conquest of Sudan
start: "1820-07"
end: "1824"
tier: B
summary: "The conquest of the Nile valley south of Egypt and of Kordofan by the armies of Muhammad Ali, the Ottoman governor of Egypt, which began sixty years of Turco-Egyptian rule, the Turkiyya. Muhammad Ali wanted slaves to build a new army and hoped to find gold. In 1820 his son Ismail Kamil Pasha led about 4,000 men up the Nile, defeated the Shayqiyya at Korti and received the submission of Berber and Shendi; on 14 June 1821 the last Funj sultan, Badi VII, surrendered Sennar. A second army under the defterdar Muhammad Bey Khusraw took Kordofan from the Sultanate of Darfur after a battle at Bara. Heavy taxes and demands for slaves provoked a rising: in late 1822 Mek Nimr of the Ja’aliyyin had Ismail and his staff burned to death at Shendi, and the defterdar’s reprisals killed some 30,000 people. Tens of thousands of Sudanese were marched north as slaves for the army, most of whom died. Khartoum, at the meeting of the Blue and White Niles, became the seat of the new government."
countries: [sd, eg]
sides:
  - id: eg
    name: Egypt (Muhammad Ali’s army)
    polities: [egypt]
    ink: purple
    moves: Egyptian moves
    success: Egyptian success
  - id: sud
