  - title: Shendi burns
    date: 1822–1824
    when: "1822-11"
    borders: "1823-06-01"
    countries: [sd]
    body:
      - By early 1822 the riverain Sudan and Kordofan were under four Egyptian governors, and the new taxes, levied in cash at so much a slave, a cow or a sheep, drove many people to flee. Ismail fell back from Sennar to Wad Madani. In October or November 1822 he came to Shendi and demanded from Mek Nimr 15,000 dollars and 6,000 slaves. When Nimr protested, Ismail struck him with his pipe. That night the Ja’aliyyin set fire to the house where Ismail and his staff were lodged; none of them escaped. The rising spread along the Nile, and the garrisons at Khartoum and elsewhere withdrew to Wad Madani.
      - The defterdar marched east from Kordofan, relieved the besieged garrison of Berber and spent months laying waste to the Ja’aliyyin country and the Gezira, killing rebels and civilians alike; an estimated 30,000 people died in the reprisals. Mek Nimr escaped east towards the Ethiopian borderlands and was never caught. In 1824 the defterdar was recalled, and Uthman Bey brought the first regiments of trained Sudanese slave soldiers, the jihadiyya, to garrison the country. Khartoum became the seat of the Egyptian governors, and Egyptian rule lasted until the Mahdist rising of 1881–1885.
    facts:
      - [Death of Ismail Kamil Pasha, "October or November 1822"]
      - [Killed in the defterdar’s reprisals, "about 30,000"]
    markers:
