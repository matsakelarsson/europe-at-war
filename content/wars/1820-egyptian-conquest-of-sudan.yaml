steps:
  - title: Up the Nile to Korti and Berber
    date: July 1820 – March 1821
    when: "1820-11-04"
    borders: "1820-11-04"
    countries: [sd, eg]
    body:
      - Muhammad Ali had destroyed the Mamluk beys in Egypt in 1811, and a remnant had fled south to Dongola. He wanted to finish them, to find the gold that Sudan was said to hold, and above all to capture men for a new army of slave soldiers that would free him from his unruly Albanian and Turkish troops. In July 1820 an army of about 4,000 men, with artillery, left Cairo; Ismail Kamil Pasha, Muhammad Ali’s 25-year-old third son, took command at Aswan on 20 July. Ababda camel-men carried its supplies, and the boats were hauled through the Second Cataract on the Nile flood.
      - The petty rulers of Lower Nubia submitted, and the Mamluks at Dongola gave up or fled south to Shendi. The first real resistance came from the Shayqiyya, a warlike confederation on the great bend of the Nile. On 4 November 1820 at Korti their cavalry, rallied by Mihera bint Abboud, a chief’s daughter who rode at their head, charged the Egyptian lines and was cut down by musket and cannon fire; a second attack in December failed in the same way. Ismail paid a bounty for the ears of the dead, which led his troops to mutilate and kill civilians.
      - After the defeat many Shayqiyya horsemen took service with the invaders. In February 1821 Ismail crossed the Bayuda desert to the Nile, Berber submitted without fighting on 5 March, and Mek Nimr of the Ja’aliyyin at Shendi made terms. In May the army set up its headquarters at Khartoum, then a village at the meeting of the Blue and White Niles.
    facts:
      - [Ismail takes command at Aswan, "20 July 1820"]
      - [Battle of Korti, "4 November 1820"]
      - [Berber submits, "5 March 1821"]
