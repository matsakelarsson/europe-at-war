steps:
  - title: Jahangir Khoja
    date: 1820–1828
    when: "1826-08-27"
    borders: "1826-09-01"
    countries: [cn, kg]
    body:
      - After 1759 the Qing ruled Kashgaria through local begs under a small number of Manchu officials and garrisons, and kept the region under tight control; when the town of Ush rose in 1765 against the abuses of its Qing governor and beg, it was destroyed after a siege, more than 2,000 men were executed and some 8,000 women deported. Burhan al-Din’s son Sarimsaq lived in exile in Kokand, whose rulers received Qing payments to keep him and his family in check. In 1820 Sarimsaq’s son Jahangir crossed the mountains with a few hundred Kyrgyz and raided the Kashgar region, but was driven off.
      - In the summer of 1826 he returned with Kyrgyz and Kokandi volunteers. The people of Kashgar’s old town rose for him, and the Qing garrison withdrew into its citadel, which held out until 27 August 1826; the defenders were killed, and the Qing commander took his own life. Yangi Hissar, Yarkand and Khotan fell soon after. Muhammad Ali (Madali) Khan of Kokand came with an army of about 10,000 men but went home after a few weeks, leaving some of his troops with Jahangir.
      - The Qing gathered more than 20,000 men at Aksu under the Ili general Changling, with Yang Yuchun and Yang Fang, and in the spring of 1827 they defeated Jahangir’s army in a series of battles east of Kashgar and retook all four cities by the end of March, followed by executions and reprisals. Jahangir fled to the Kyrgyz in the mountains. Lured back early in 1828, he was captured, carried to Beijing and executed there by slicing in 1828. The Qing banned trade with Kokand and moved about 12,000 Turkic Muslim families from the Tarim to farm in the Ili valley.
