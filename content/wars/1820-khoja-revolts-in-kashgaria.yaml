  - title: The Kokandi invasion and the settlement of 1832
    date: 1830–1832
    when: "1830-09"
    borders: "1830-10-01"
    countries: [cn, uz, kg]
    body:
      - The trade ban hit Kokand hard. In September 1830 a Kokandi army under its commander Haqq Quli, with Jahangir’s elder brother Yusuf Khoja, crossed the mountains and occupied Kashgar’s old town, besieging the Qing in their citadel. Yusuf’s attack on Yarkand failed, and the invaders made no further gains. When a large Qing relief army approached late in the year, the Kokandis withdrew at the end of December, taking with them many Kashgaris who feared Qing reprisals.
      - Rather than fight Kokand again, the Qing court negotiated. Under the settlement of 1832 the Qing reopened trade, let Kokand collect customs duties from foreign merchants in Kashgaria, and allowed it to station commercial agents in the cities under a senior agent (aksakal) at Kashgar. Some historians, following Joseph Fletcher, have called it the first of China’s unequal treaties. In return Kokand was to keep the khojas from crossing the border, which it did only when it suited it.
    facts:
      - [Kokandi occupation of Kashgar, "September – December 1830"]
      - [Settlement with Kokand, "1832"]
