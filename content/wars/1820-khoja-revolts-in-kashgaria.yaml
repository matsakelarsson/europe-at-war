notes:
  - "The sources disagree on many dates: Jahangir’s first raid is put in 1820 or 1825, the fall of Kashgar’s Qing citadel in August 1826 or early 1827, the Qing reconquest in 1827 or 1828, and the rising of the Seven Khojas in 1846 or 1847. This entry follows the most common dating. Numbers of troops and of the dead come mostly from Qing reports and travellers’ accounts and are uncertain."
  - Kashgaria is the western part of Altishahr (“six cities”), the oasis country south of the Tian Shan. The Afaqi (White Mountain) Khojas were opposed by the rival Ishaqi (Black Mountain) Khojas and by many of the local begs who served the Qing.
  - The Muslim revolt of 1864 and Yakub Beg’s state, which grew out of the last khoja invasion in 1865, are told in the Dungan Revolt.
