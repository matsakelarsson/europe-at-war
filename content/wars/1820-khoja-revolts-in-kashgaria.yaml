  - title: The Seven Khojas and Wali Khan
    date: 1847–1857
    when: "1857"
    borders: "1857-08-26"
    countries: [cn, uz]
    body:
      - In August 1847 a group of Jahangir’s sons, grandsons and kinsmen, remembered as the Seven Khojas, crossed from Kokand with Kyrgyz and Kokandi followers and took Kashgar’s old town in less than a month, while the Qing held their citadels at Kashgar and Yangi Hissar. In November a Qing army defeated them at Kök Rabat near Yarkand, and they fled back to Kokand, followed by thousands of Kashgari families. Smaller raids followed in the 1850s.
      - The last and most destructive invasion came in 1857, when Wali Khan, another descendant of the Afaqi Khojas, took the old town of Kashgar and held it for about four months, killing many of its people and suspected opponents. On 26 August 1857 he had the German scientist Adolf Schlagintweit, who had come over the Karakoram from India, beheaded as a suspected spy. A Qing relief army defeated Wali Khan in the autumn, and he fled back to Kokand.
      - In 1864 a far larger revolt of the Muslims of Xinjiang drove out Qing rule, and in 1865 a khoja of the same family, Buzurg Khan, came from Kokand with the officer Yakub Beg, who soon took power for himself.
