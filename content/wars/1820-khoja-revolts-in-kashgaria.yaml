id: khoja-revolts-in-kashgaria
name: Khoja revolts in Kashgaria
start: "1820"
end: "1857"
tier: B
summary: "A series of invasions of Qing Kashgaria (the western Tarim basin) by descendants of the Afaqi Khojas, the Sufi family the Qing had driven out in 1759, launched from the Khanate of Kokand with Kyrgyz and Kokandi support. Jahangir Khoja, a grandson of Burhan al-Din, raided Kashgar in 1820 and in 1826 took Kashgar, Yangi Hissar, Yarkand and Khotan, killing the Qing garrison of Kashgar. A Qing army of more than 20,000 men retook the cities in the spring of 1827, and Jahangir was captured and executed in Beijing in 1828. In 1830 a Kokandi army with his brother Yusuf occupied Kashgar for three months; the settlement of 1832 gave Kokand the right to tax foreign merchants in Kashgaria and to station its agents there. Further invasions followed, by the Seven Khojas in 1847 and by Wali Khan, who held Kashgar for about four months in 1857 and beheaded the German traveller Adolf Schlagintweit. Each brought destruction, reprisals and the flight of thousands of townspeople to Kokand, and weakened Qing rule before the great Muslim revolt of 1864."
