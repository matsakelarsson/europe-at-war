id: neapolitan-revolution
name: Neapolitan Revolution of 1820–1821
start: "1820-07-01"
end: "1821-03-23"
tier: C
summary: A constitutional revolution in the Kingdom of the Two Sicilies, ended by an Austrian army. On 1–2 July 1820 army officers and members of the secret society of the Carbonari rose at Nola, General Guglielmo Pepe joined them, and King Ferdinand I accepted a constitution modelled on the Spanish one of 1812. A separate rising in Palermo for Sicilian independence was put down by Neapolitan troops in the autumn. At the congresses of Troppau and Laibach the conservative powers of the Holy Alliance agreed to intervene, and Ferdinand, who had gone to Laibach, disowned the constitution. An Austrian army under General Johann Frimont marched south, routed Pepe’s forces near Rieti on 7 March 1821 and entered Naples on 23 March. Absolute rule was restored, the leaders of the rising were executed or exiled, and Austrian troops stayed in the kingdom until 1827.
