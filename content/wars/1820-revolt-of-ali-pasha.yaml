id: revolt-of-ali-pasha
name: Revolt of Ali Pasha
start: "1820-07"
end: "1822-01-24"
tier: C
summary: The war in which Sultan Mahmud II destroyed Ali Pasha of Yanina, the Albanian-born governor who had made Epirus, Albania and much of mainland Greece a virtually independent state. Declared a rebel in 1820, Ali was abandoned by his sons and commanders and besieged in Ioannina by an Ottoman army under Ismail Pashabey and then Hurshid Pasha; he allied briefly with the Souliotes and the Greek rebels, but was killed in January 1822 after leaving his citadel under a promise of safety. The siege tied down Ottoman troops just as the Greek War of Independence broke out.
