id: comanche-mexico-wars
name: Comanche–Mexico Wars
start: "1821"
end: "1870"
tier: C
summary: "The long war of raids that the Comanche, with their Kiowa and Plains Apache (Kiowa Apache) allies, carried hundreds of kilometres into northern Mexico between Mexican independence and about 1870. Spain had made peace with the Comanche in 1785–1786 and kept it with trade and gifts, which independent Mexico could not afford. From the 1830s, when peace with the United States, the eastern nations and the Cheyenne and Arapaho secured their other borders, Comanche bands gathered each summer on the Red River and its tributaries and rode south in autumn, under what Texans called the Comanche Moon, in war parties of 200 to 800 men. They crossed the Rio Grande near the Big Bend, wintered with their families in the Bolsón de Mapimí and raided Chihuahua, Coahuila, Nuevo León, Durango, Tamaulipas and as far as Zacatecas, San Luis Potosí, Jalisco and Querétaro, taking horses and mules for markets in New Mexico and the United States and captives who were ransomed or brought into Comanche families. A careful but incomplete count by the historian Brian DeLay finds 44 raids of more than 100 men from 1831 to 1848, which killed 2,649 Mexicans and carried off 852 captives and more than 100,000 animals; at least 702 Comanche were killed. Mexican states answered with militias, presidios and bounties for scalps, and accused Texas and the United States of buying the stolen herds and selling the raiders guns. The devastation of the north weakened Mexico against the American invasion of 1846, and in the Treaty of Guadalupe Hidalgo (1848) the United States undertook to stop the raids, an obligation it did not meet and was released from in the Gadsden Purchase of 1853. Cholera in 1849, the decline of the bison and American settlement and campaigns in Texas reduced the raids from the mid-1850s, and the last known Comanche raid into Mexico took place in 1870."
