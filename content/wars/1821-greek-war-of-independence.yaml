  - title: The Morea rises and Tripolitsa falls
    date: March – October 1821
    when: "1821-03-29"
    borders: "1821-10-05"
    countries: [gr]
    body:
      - The Peloponnese, the Morea, rose in late March 1821, while its governor, Hurshid Pasha, and many of his troops were away besieging Ali Pasha at Ioannina. The Maniots under Petros Mavromichalis declared war at Areopoli and, with Theodoros Kolokotronis and the priest Papaflessas, took Kalamata on 4 April; the story that Metropolitan Germanos raised the banner at Agia Lavra on 25 March (Julian) is doubted by historians. Within weeks the Greeks held the countryside. Muslims fled into the fortresses of Patras, Acrocorinth, Nafplio, Monemvasia, Navarino and Tripolitsa, and thousands who could not reach them were killed.
      - The rising spread to Central Greece and to the islands of Hydra, Spetses and Psara, whose merchant ships, fitted with light guns and fire ships, became the Greek navy. Athanasios Diakos was captured at Alamana and executed, but Odysseas Androutsos held up the Ottoman advance at the Gravia inn, and a relief army was destroyed at Vasilika in August. In the Morea Kolokotronis besieged Tripolitsa, the provincial capital, and beat off a sortie at Valtetsi in May. On 5 October the besiegers broke in and for days slaughtered the town’s Muslim and Jewish inhabitants; estimates of the dead range from about 6,000 to 8,000 or more.
    facts:
      - [Kalamata taken, "4 April 1821 (23 March Old Style)"]
      - [Battle of Valtetsi, "24–25 May 1821, Greek victory"]
      - [Fall of Tripolitsa, "5 October 1821 (23 September Old Style)"]
    markers:
