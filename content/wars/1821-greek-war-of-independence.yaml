        text: According to tradition, Metropolitan Germanos blessed the banner of the revolution at the monastery near Kalavryta.
        lonlat: [22.081, 38.013]
        lp: l
      - kind: taken
        side: gr
        name: Kalamata
        date: 4 April 1821
        text: The first town taken by the rebels. A local council, the Messenian Senate, met here soon after.
        lonlat: [22.111, 37.038]
      - kind: battle
        side: gr
        name: Valtetsi
        date: 24–25 May 1821
        text: Greek fighters in fortified houses beat off an attack from Tripolitsa, a victory that gave the irregulars confidence in the field.
        lonlat: [22.283, 37.483]
        lp: l
      - kind: taken
        side: gr
        name: Tripolitsa
        date: 5 October 1821
        text: The capital of the Ottoman Morea was stormed after a siege of several months, and most of its Muslim and Jewish inhabitants were massacred.
        lonlat: [22.383, 37.517]
      - kind: taken
        side: gr
        name: Monemvasia
        date: August 1821
        text: The starving garrison of the rock fortress surrendered; Navarino followed the same month.
        lonlat: [23.056, 36.688]
      - kind: held
        side: tr
        name: Patras
        date: 1821–1828
        text: The Ottoman garrison, relieved by sea in April 1821, held the citadel throughout the war.
        lonlat: [21.733, 38.25]
      - kind: battle
        side: gr
        name: Gravia inn
        date: May 1821
        text: Androutsos and about 120 men held the inn against Omer Vrioni’s army for a day before slipping away at night.
        lonlat: [22.417, 38.667]
        lp: l
      - kind: battle
        side: gr
        name: Vasilika
        date: August 1821
        text: Greek bands ambushed an Ottoman relief army in the passes, and Omer Vrioni soon withdrew from Attica.
        lonlat: [22.754, 38.708]
