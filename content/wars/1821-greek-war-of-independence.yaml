  - title: Navarino
    date: May – October 1827
    when: "1827-05-06"
    borders: "1827-10-20"
    countries: [gr, gb, fr, ru, tr, eg]
    body:
      - On 6 May 1827 a Greek army trying to relieve the Acropolis was routed at Phaleron, two days after Karaiskakis had been mortally wounded, and on 5 June the garrison surrendered on terms. The National Assembly at Troezen elected Ioannis Kapodistrias, a Corfiot who had been Russia’s foreign minister, as governor of Greece. By the Treaty of London of 6 July Britain, France and Russia agreed to demand an armistice and to impose one if either side refused. The Greeks accepted, but the Porte rejected the demand, and the allied admirals Edward Codrington, Henri de Rigny and Lodewijk van Heiden were sent to stop supplies reaching Ibrahim.
      - The Ottoman and Egyptian fleet lay at anchor in Navarino Bay. On 20 October the 22 allied ships sailed in, and when a boat was fired on near an Egyptian fire ship a general battle began. In about four hours the heavier allied gunnery destroyed the fleet at anchor; of 78 Ottoman and Egyptian vessels just eight remained seaworthy. By one count about 3,000 Ottoman and Egyptian sailors were killed, against 181 allied dead. It was the last great battle fought entirely by sailing ships. George IV called it an “untoward event”, but it ended any chance of crushing the revolt, and in April 1828 Russia went to war with the Ottomans.
    facts:
      - [Treaty of London, "6 July 1827, Britain, France and Russia"]
      - [Battle of Navarino, "20 October 1827 (8 October Old Style), allied victory"]
      - [Losses at Navarino, "70 of 78 Ottoman and Egyptian ships; 181 allied dead"]
    markers:
      - kind: battle
        side: tr
        name: Battle of Phaleron
        date: 6 May 1827
        text: Church and Cochrane’s night march on Athens fell apart, and Ottoman cavalry cut down the scattered Greek troops on the plain.
