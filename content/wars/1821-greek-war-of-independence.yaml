  - title: Missolonghi
    date: April 1825 – December 1826
    when: "1825-04-27"
    borders: "1826-04-23"
    countries: [gr]
    body:
      - In April 1825 Mehmed Reşid Pasha besieged Missolonghi, the rebels’ stronghold in western Greece, for the third time. Protected by its lagoon and earthworks and supplied by Miaoulis’s ships, the town held out until Ibrahim joined the siege and, in the spring of 1826, took the islets of the lagoon. Starving, the garrison and townspeople tried to break out together on the night of 22–23 April 1826. The besiegers had been warned; perhaps 1,800 got through, most of the rest were killed or enslaved, and some who stayed behind blew up the powder magazine with themselves and their attackers.
      - The fall of Missolonghi caused an outcry across Europe. Britain and Russia had already agreed, in the Protocol of St Petersburg of 4 April 1826, to mediate for an autonomous Greece. Ibrahim tried to break into the Mani that summer but was beaten back at Vergas and at Diros, where Maniot women helped repel a landing. Reşid marched east and by August besieged the Acropolis of Athens. Georgios Karaiskakis destroyed an Ottoman force at Arachova in November, but every attempt to relieve the Acropolis failed. The Greeks gave command of their army to the British general Sir Richard Church and of their fleet to Lord Cochrane.
    facts:
      - [Third siege of Missolonghi, "April 1825 – April 1826"]
      - [The exodus, "Night of 22–23 April 1826 (10–11 April Old Style)"]
      - [Protocol of St Petersburg, "4 April 1826, Britain and Russia"]
    markers:
      - kind: taken
        side: tr
        name: Missolonghi
        date: 22–23 April 1826
        text: After almost a year of siege, the defenders’ breakout ended in a massacre. The town became a symbol of the Greek cause in Europe.
        lonlat: [21.428, 38.369]
      - kind: battle
        side: gr
        name: Vergas
        date: June 1826
        text: Some 2,000 Maniots and refugees behind a wall across the coastal plain held off Ibrahim’s army until Kolokotronis attacked it from the rear.
        lonlat: [22.15, 36.98]
      - kind: battle
        side: gr
        name: Diros
