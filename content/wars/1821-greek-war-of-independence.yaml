        name: Acropolis of Athens
        date: from summer 1826
        text: Reşid Pasha besieged the Greek garrison on the Acropolis, which held out until June 1827.
        lonlat: [23.726, 37.972]
      - kind: battle
        side: gr
        name: Arachova
        date: November 1826
        text: Karaiskakis trapped an Ottoman column of about 2,000 men below Parnassus and destroyed most of it.
        lonlat: [22.583, 38.483]
