steps:
  - title: Ypsilantis in the Danubian principalities
    date: March – June 1821
    when: "1821-03-06"
    borders: "1821-06-19"
    countries: [ro, md, gr, tr]
    body:
      - The Filiki Eteria (Society of Friends), a secret society founded by three Greek merchants in Odessa in 1814, planned a rising of the Balkan Christians against Ottoman rule. In 1820 it chose as its leader Alexander Ypsilantis, a Phanariot Greek and general in the Russian army. On 6 March 1821 he crossed the Prut from Russian Bessarabia into Moldavia with a few hundred followers and at Iași called on Greeks and all Christians to rise, hinting at Russian support. Michael Soutzos, the prince of Moldavia and himself a member of the society, put his guard at Ypsilantis’s disposal, while Eterists killed Ottoman soldiers and merchants at Galați and elsewhere.
      - Tsar Alexander I disowned the rising and struck Ypsilantis off the army list, and the Patriarch in Constantinople excommunicated him. In Bucharest Ypsilantis fell out with Tudor Vladimirescu, leader of a rising of Wallachian peasants and Pandurs, whom Eterists seized and killed on 7 June. Ottoman troops had entered the principalities in May. At Drăgășani on 19 June they routed Ypsilantis’s army and destroyed the Sacred Band, a corps of young Greek volunteers. Ypsilantis fled to Austria and was held prisoner there until 1827. In Constantinople Patriarch Gregory V, though he had condemned the revolt, was hanged on Easter Sunday, 22 April, and many Greeks there and in Smyrna were killed.
    facts:
      - [Ypsilantis crosses the Prut, "6 March 1821 (22 February Old Style)"]
      - [Patriarch Gregory V hanged, 22 April 1821]
      - [Battle of Drăgășani, "19 June 1821, Ottoman victory"]
    markers:
      - kind: event
        side: gr
        name: Iași
        date: March 1821
        text: Ypsilantis issued his proclamation in the Moldavian capital two days after crossing the Prut, calling on the Greeks to fight “for Faith and Fatherland”.
        lonlat: [27.589, 47.162]
      - kind: event
        name: Galați
        date: March 1821
        text: Eterists under Vasileios Karavias killed the Ottoman soldiers and merchants of the Danube port, one of several killings of Muslims that opened the rising.
        lonlat: [28.055, 45.434]
      - kind: event
        side: gr
        name: Bucharest
        date: April – May 1821
        text: Ypsilantis reached the Wallachian capital, already held by Vladimirescu’s Pandurs; the two leaders soon quarrelled.
        lonlat: [26.104, 44.432]
      - kind: battle
        side: tr
        name: Battle of Drăgășani
        date: 19 June 1821
        text: The Ottomans routed Ypsilantis’s army and cut down the Sacred Band, many of whose several hundred volunteers were killed.
        lonlat: [24.261, 44.661]
      - kind: battle
        side: tr
        name: Sculeni
        date: 29 June 1821
        text: A last band of Eterists fighting with its back to the Prut was overwhelmed; many swam the river to Russian territory.
        lonlat: [27.633, 47.317]
        lp: l
      - kind: event
        side: tr
        name: Constantinople
        date: 22 April 1821
        text: Patriarch Gregory V was hanged at the gate of the Patriarchate on Easter Sunday. Tsar Alexander broke off relations with the Porte in protest.
        lonlat: [28.976, 41.012]
