  - title: Civil strife, Psara and Ibrahim’s landing
    date: 1823 – 1825
    when: "1823-03"
    borders: "1825-12-31"
    countries: [gr, eg, tr]
    body:
      - With the immediate danger past, the Greek leaders fell out. The captains and notables of the Peloponnese around Kolokotronis opposed the islanders and Roumeliots, and by early 1824 there were rival governments at Tripolitsa and Kranidi. The government of Georgios Kountouriotis won two short civil wars in 1824, helped by loans raised in London, and in early 1825 imprisoned Kolokotronis on Hydra. Lord Byron, who had come to Greece with money and supplies, died of fever at Missolonghi on 19 April 1824. Sultan Mahmud II, meanwhile, turned to Muhammad Ali of Egypt, whose French-trained army had already crushed the rising in Crete.
      - In June 1824 an Egyptian fleet took Kasos, and in the summer an Ottoman fleet stormed Psara; thousands of islanders were killed or enslaved, and the last defenders blew up the island’s fort with themselves and their attackers. A Greek victory at Gerontas in September saved Samos. In February 1825 Muhammad Ali’s son Ibrahim Pasha landed at Methoni. He took Sphacteria and Navarino in May, killed Papaflessas and his men at Maniaki on 1 June, and entered Tripolitsa and Argos, but was held at the mills of Lerna outside Nafplio. The government released Kolokotronis, but by the end of the year Ibrahim held much of the western Peloponnese and was burning the countryside.
    facts:
      - [Byron dies at Missolonghi, 19 April 1824]
      - [Ibrahim lands at Methoni, February 1825]
      - [Battle of Maniaki, "1 June 1825 (20 May Old Style), Egyptian victory"]
    markers:
      - kind: event
        side: gr
        name: Kranidi
        date: 1824
        text: Seat of the islanders’ and Roumeliots’ government, which defeated Kolokotronis’s faction in two civil wars.
        lonlat: [23.159, 37.38]
        lp: l
