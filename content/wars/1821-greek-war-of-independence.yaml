  - title: The French in the Morea and the London Protocol
    date: 1828 – February 1830
    when: "1828-01"
    borders: "1830-02-03"
    countries: [gr, fr, ru, tr, eg]
    body:
      - Kapodistrias arrived in January 1828 and set up his government on Aegina. With Russia now at war with the Ottomans, Codrington agreed with Muhammad Ali at Alexandria in August that the Egyptian army would leave the Peloponnese. A French expeditionary corps of about 15,000 men under General Nicolas-Joseph Maison landed at Petalidi on 29–30 August. Ibrahim embarked his army in September and October, and the French took over Navarino, Methoni, Koroni and Patras and stormed the Castle of the Morea at Rio on 30 October. The French lost about 1,500 men, mostly to fever and dysentery; a scientific commission came with them in 1829.
      - Kapodistrias built a regular army, which advanced into Central Greece, and in September 1829 Dimitrios Ypsilantis, Alexander’s brother, won at Petra in Boeotia, the last battle of the war. The Ottoman troops left the land south of the Spercheios. By the Treaty of Adrianople that month the Sultan accepted the powers’ plan for an autonomous Greece. Britain and France, wary of Russian influence, preferred full independence, and on 3 February 1830 the London Protocol recognised Greece as an independent state under the three powers’ protection, with a northern border from the mouth of the Achelous to the mouth of the Spercheios. Crete stayed outside it and was handed to Muhammad Ali.
    facts:
      - [French landing at Petalidi, "29–30 August 1828"]
      - [Battle of Petra, "September 1829, Greek victory"]
      - [London Protocol, "3 February 1830, Greek independence"]
    markers:
      - kind: event
        side: gr
        name: Aegina
        date: January 1828
        text: Kapodistrias took office here as governor and began building a state, a currency and a regular army.
        lonlat: [23.49, 37.73]
      - kind: event
        side: pw
        name: Petalidi
        date: 29–30 August 1828
        text: General Maison’s corps landed on the Gulf of Messenia, and Ibrahim agreed to leave.
        lonlat: [21.933, 36.95]
      - kind: taken
        side: pw
        name: Navarino, Methoni and Koroni
        date: October 1828
        text: The Egyptian and Ottoman garrisons handed the fortresses over to the French.
        lonlat: [21.704, 36.815]
        lp: l
      - kind: taken
        side: pw
        name: Castle of the Morea
        date: 30 October 1828
        text: The French bombarded and took the fortress at Rio, the last Ottoman stronghold in the Peloponnese.
        lonlat: [21.781, 38.311]
      - kind: battle
        side: gr
        name: Battle of Petra
        date: September 1829
        text: Ypsilantis’s regular troops defeated Aslan Bey’s force, which agreed to leave Central Greece in return for free passage.
        lonlat: [23.058, 38.371]
    arrows:
