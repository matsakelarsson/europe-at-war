id: greek-war-of-independence
name: Greek War of Independence
start: "1821-03-06"
end: "1832-07-21"
tier: A
summary: A war in which Greek revolutionaries rose against Ottoman rule in 1821 and, after years of fighting, massacres on both sides and the near collapse of the revolt under Egyptian attack, won independence through the intervention of Britain, France and Russia at Navarino in 1827 and in the Morea in 1828. The London Protocol recognised Greece in 1830, and in 1832 its border was fixed on the Arta–Volos line, with Otto of Bavaria as king.
countries: [gr, tr, eg, ro, md, gb, fr, ru]
sides:
  - id: gr
    name: Greek revolutionaries
    polities: [greek-revolutionaries, greece]
    ink: navy
    moves: Greek moves
    success: Greek success
  - id: tr
    name: Ottoman Empire and Egypt
    polities: [ottoman, egypt]
    ink: teal
    moves: Ottoman and Egyptian moves
    success: Ottoman and Egyptian success
  - id: pw
    name: Britain, France and Russia
    polities: [united-kingdom, france, russia]
    ink: red
    moves: Moves by the three powers
    success: Success for the three powers
notes:
  - Dates are New Style (Gregorian). The Greeks used the Julian calendar, then twelve days behind, so Greek accounts date the start of the rising in the Peloponnese to 25 March 1821 (6 April New Style), celebrated as Independence Day, and the exodus from Missolonghi to 10 April 1826. Some dates are given in both styles.
  - Numbers of dead in the massacres, Greek and Ottoman alike, are disputed; the figures given are estimates.
  - The Morea is the Peloponnese, Roumeli is Central Greece, Tripolitsa is today’s Tripoli, Navarino is Pylos and Missolonghi is Mesolongi.
  - Ali Pasha’s revolt of 1820–1822, Tudor Vladimirescu’s rising in Wallachia in 1821 and the Russo-Turkish War of 1828–1829 have their own entries.
