  - title: Chios and Dervenakia
    date: January – December 1822
    when: "1822-01"
    borders: "1822-08-08"
    countries: [gr, tr]
    body:
      - In January 1822 the First National Assembly at Epidaurus declared Greece independent and adopted a provisional constitution, with the Phanariot Alexandros Mavrokordatos at the head of the executive. In March armed men from Samos landed on Chios and roused part of the population. In April the Kapudan Pasha, Nasuhzade Ali Pasha, landed troops who over the following weeks killed or enslaved most of the island’s Greeks; estimates of the dead run from about 25,000 upwards, and tens of thousands more were sold as slaves. On the night of 18–19 June Konstantinos Kanaris steered a fire ship against the Ottoman flagship off Chios, and the Kapudan Pasha died with most of those on board.
      - In the west, Mavrokordatos’s army and its battalion of foreign volunteers were routed at Peta near Arta on 16 July. That month Mahmud Dramali Pasha marched south from Larissa with more than 20,000 men, took Corinth and reached Argos, but the Greeks had burned the crops and held the hills. Short of food and water, Dramali turned back, and on 6–8 August Kolokotronis’s men ambushed his army in the Dervenakia defile and the passes near it, destroying much of it and taking its baggage. The Acropolis of Athens had surrendered to the Greeks in June, Nafplio followed in December, and Missolonghi beat off a first siege.
    facts:
      - [First National Assembly, "Epidaurus, December 1821 – January 1822"]
      - [Chios massacre, "April–June 1822, tens of thousands killed or enslaved"]
      - [Battle of Dervenakia, "6–8 August 1822 (26–28 July Old Style), Greek victory"]
    markers:
