  - title: The 1832 borders and King Otto
    date: 1831 – 1833
    when: "1831-10-09"
    borders: "1832-07-21"
    countries: [gr, tr, de]
    body:
      - Kapodistrias ruled with a firm hand and made many enemies. In August 1831, during a revolt of the Hydriots, Miaoulis blew up the flagship Hellas and other ships at Poros rather than let them fall into government hands. On 9 October 1831 Kapodistrias was shot and stabbed at a church door in Nafplio by the brother and son of Petros Mavromichalis, whom he had imprisoned. Greece slid into civil war between the government of his brother Augustinos and the Roumeliot captains, while the powers looked for a king. Prince Leopold of Saxe-Coburg had turned the throne down in 1830, objecting among other things to the narrow frontier.
      - At the London Conference the powers chose Otto, the 17-year-old son of King Ludwig I of Bavaria, and by a treaty of 7 May 1832 made Greece a kingdom under their guarantee. By the Treaty of Constantinople of 21 July 1832 the Sultan accepted a wider border on the line from the Gulf of Arta to the Gulf of Volos, in return for an indemnity of 40 million piastres. Otto landed at Nafplio on 6 February 1833 with a Bavarian regency and some 3,500 Bavarian troops. The new kingdom had about 800,000 people, less than a third of the Greeks of the Ottoman Empire, and the hope of uniting the rest, the Megali Idea, long shaped its politics.
    facts:
      - [Kapodistrias assassinated, "9 October 1831 (27 September Old Style)"]
      - [Treaty of Constantinople, "21 July 1832, Arta–Volos border"]
      - [Otto lands at Nafplio, "6 February 1833 (25 January Old Style)"]
    markers:
      - kind: event
        name: Poros
        date: August 1831
        text: Miaoulis set fire to the frigate Hellas and other ships of the fleet to keep them from Kapodistrias’s government.
        lonlat: [23.483, 37.517]
      - kind: event
        name: Nafplio
        date: 1831–1833
        text: Kapodistrias was assassinated here on 9 October 1831. King Otto landed here on 6 February 1833, and the town was the capital until Athens took its place in 1834.
        lonlat: [22.8, 37.566]
      - kind: event
        name: Arta
        date: 1832
        text: The border of 1832 ran from the Gulf of Arta, leaving the town itself in Ottoman hands.
        lonlat: [20.988, 39.165]
      - kind: event
        name: Volos
        date: 1832
        text: The eastern end of the Arta–Volos line; Thessaly stayed Ottoman until 1881.
        lonlat: [22.933, 39.367]
      - kind: treaty
        name: Treaty of Constantinople
        date: 21 July 1832
        text: The ambassadors of Britain, France and Russia and the Ottoman government agreed the Arta–Volos border.
        lonlat: [28.976, 41.012]
