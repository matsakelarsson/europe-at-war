id: ottoman-persian-war-1821
name: Ottoman–Persian War of 1821–1823
start: "1821-09"
end: "1823-07-28"
tier: C
summary: "The last war between the Ottoman Empire and Iran. Border tribes such as the Kurdish Haydaranlu and Sipki had crossed into Ottoman territory and been given refuge, Iranian pilgrims complained of mistreatment, and the two sides competed for influence over the Kurdish emirate of Baban; after clashes in 1820, Russia, at odds with the Ottomans over the Greek revolt, encouraged Iran to fight. In the autumn of 1821 Crown Prince Abbas Mirza, governor of Azerbaijan, invaded eastern Anatolia from Tabriz and took Bayazid and Toprakkale, while his elder half-brother Mohammad Ali Mirza, governor of Kermanshah, overran Shahrizor, defeated the army of Dawud Pasha of Baghdad and advanced on Baghdad, until cholera broke out in his army and he died of it in November 1821. Abbas Mirza defeated a larger Ottoman army near Toprakkale in May 1822, but cholera and the lack of money stopped both sides. The Treaty of Erzurum of 28 July 1823 restored the frontier of the Treaty of Zuhab (1639), with no change of territory, and promised Iranian pilgrims protection."
countries: [ir, tr, iq]
sides:
  - id: ir
    name: Qajar Iran
    polities: [persia]
    ink: green
  - id: ott
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
notes:
  - The war is dated 1820–1823 or 1821–1823 in different works; the first fighting followed border raids in 1820, and the main Iranian invasions began in the autumn of 1821. Numbers for the armies (Abbas Mirza is said to have had about 30,000 men against some 50,000 Ottomans) come from late and partisan sources.
