id: piedmontese-revolution
name: Piedmontese Revolution of 1821
start: "1821-03-10"
end: "1821-04-10"
tier: C
summary: A short-lived liberal revolution in the Kingdom of Sardinia. On 10 March 1821 officers led by Count Santorre di Santarosa raised the garrison of Alessandria, demanding the Spanish constitution of 1812 and war with Austria, and Turin followed two days later. King Victor Emmanuel I abdicated in favour of his brother Charles Felix, who was away in Modena, and the young regent, Prince Charles Albert, proclaimed the constitution. Charles Felix disowned it and ordered Charles Albert to leave. Loyal troops under General Vittorio Sallier de La Tour, with an Austrian corps under Ferdinand von Bubna, defeated the constitutionalists near Novara on 8 April 1821, and Austrian troops occupied Alessandria until 1823. Santarosa and many others went into exile; he was killed fighting for Greek independence in 1825.
