  - title: Exile, the Burney Treaty and the rising of 1831
    date: 1822–1832
    when: "1831"
    borders: "1831-06-01"
    countries: [my, th]
    body:
      - From Penang the sultan sought help to recover his throne, and Kedahan exiles there kept up raids across the border. In 1825 Nakhon Noi prepared a fleet to bring Perak and Selangor under Siam as well; Robert Fullerton, the governor of Penang, blockaded the mouth of the Trang River, and the expedition was called off. In the Burney Treaty, signed in Bangkok on 20 June 1826, the East India Company recognised Siam’s claims over Kedah and the other northern Malay states, which were not consulted; Siam gave up its designs on Perak and Selangor, and the British undertook to keep the sultan away from Kedah. He was moved to Malacca.
      - In 1831 Tunku Kudin, a nephew of the sultan, led Kedahan fighters across the border and took Alor Setar; Phraya Aphaithibet fled. Nakhon Noi retook the town about four months later, and Tunku Kudin was killed and his head sent to Bangkok. The rising spread to Pattani, the old Malay kingdom on the east coast that Siam had divided into seven provinces after the rebellions of 1791 and 1808. Tuan Sulong, the ruler of Pattani province, joined the Kedahans with support from Kelantan and Terengganu. King Rama III sent the Phra Khlang with an army, and with Nakhon Noi he took Pattani in 1832. Tuan Sulong fled to Kelantan, whose sultan handed him over to the Siamese.
    facts:
