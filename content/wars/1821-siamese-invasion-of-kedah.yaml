steps:
  - title: The fall of Alor Setar
    date: November 1821
    when: "1821-11"
    borders: "1821-11-01"
    countries: [my, th]
    body:
      - Kedah, on the north-west coast of the Malay peninsula, had been a vassal of Siam since the 1780s, sending the bunga mas to Bangkok every three years. In 1786 Sultan Abdullah had leased Penang to Francis Light of the British East India Company in the hope of British protection against Siam and Burma, but none came. His successor, Sultan Ahmad Tajuddin Halim Shah II, served Siam loyally at first, sending troops against the Burmese in 1809 and occupying Perak on Bangkok’s orders in 1818. His quarrels with his brothers, some of whom sought the backing of Chaophraya Nakhon Noi, the Siamese governor of Nakhon Si Thammarat (Ligor), weakened him. In 1820, as Burma prepared a new invasion of Siam, one brother reported that Kedah was negotiating with the Burmese, and a merchant of Phuket seized a Burmese ship carrying a letter to the sultan. King Rama II summoned him to Bangkok to explain; he refused and stopped sending the bunga mas.
      - In November 1821 Nakhon Noi gathered a fleet of about 7,000 men at Trang and Satun, officially against a Burmese attack, asked Kedah for provisions and, when none came, sailed for Kedah. The Kedahans did not expect an attack, and the Bendahara received the Siamese party with ceremony at the fort; once inside, Nakhon Noi’s men turned on their hosts, captured the Bendahara and killed the Laksamana. The sultan escaped to Penang. Villages were burned and houses looted, and Malays fled in thousands to Penang and Province Wellesley, where the British counted about 10,000 refugees.
      - Siam now ruled Kedah directly. Nakhon Noi, raised by Rama II to the rank of Chaophraya, made his son Phraya Aphaithibet governor, a post he held until 1838. The East India Company protested the sultan’s treatment but would not go to war with Siam; its envoy John Crawfurd, who reached Bangkok in April 1822 with the sultan’s letter, came away without an agreement.
    facts:
      - [Siamese force, "about 7,000 men"]
      - [Alor Setar taken, "November 1821"]
      - [Refugees in British territory, "about 10,000"]
