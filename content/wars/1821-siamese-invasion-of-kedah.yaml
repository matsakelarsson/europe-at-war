id: siamese-invasion-of-kedah
name: Siamese invasion of Kedah
start: "1821-11"
end: "1842"
tier: B
summary: "Siam’s conquest of the Malay sultanate of Kedah in November 1821 and the twenty years of resistance that followed. Kedah had long sent Siam the bunga mas, the gold and silver flowers of submission, but Sultan Ahmad Tajuddin Halim Shah II was suspected of dealing with Siam’s enemy Burma and refused a summons to Bangkok. Chaophraya Nakhon Noi, the Siamese governor of Nakhon Si Thammarat (Ligor), took Kedah by surprise with about 7,000 men; the sultan fled to the British at Penang, and about 10,000 Kedahans followed him into British territory. Siam ruled Kedah directly through Nakhon Noi’s son, and the British, who had refused the sultan help, accepted Siam’s claim in the Burney Treaty of 1826. Kedah princes rose in 1831 and in 1838–1839, joined by risings in Pattani, the Malay kingdom Siam had divided into seven provinces; each time Siamese forces retook the country, in 1838 with a British blockade of the coast. In 1839–1843 Siam cut Perlis and Kubang Pasu out of Kedah under rulers of their own, and in 1842 it restored the old sultan to the rest of Kedah as its vassal."
countries: [my, th]
