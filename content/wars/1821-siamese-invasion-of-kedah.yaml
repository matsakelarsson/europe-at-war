  - title: The war of 1838 and the restoration
    date: 1838–1843
    when: "1838-02"
    borders: "1843-06-01"
    countries: [my, th]
    body:
      - In February 1838, while Nakhon Noi and most of the southern Siamese officials were in Bangkok for the funeral of the king’s mother, the sultan’s nephews Tunku Muhammad Saad and Tunku Muhammad Akib gathered a fleet in the Merbok River, joined by Malay seafarers under Wan Mali, whom the British and Siamese called pirates. They defeated a Siamese fleet, took the fort at Alor Setar and killed its garrison; Phraya Aphaithibet fled to Phatthalung. A Malay force of about 10,000 overran Perlis and Trang, sacking villages and Buddhist temples, and one column, joined by risings in Pattani, besieged Songkhla for three months until about 2,000 Siamese and 500 Chinese allies drove it back to Kedah.
      - King Rama III sent Phraya Si Phiphat south with an army. Nakhon Noi, though ill, returned to Nakhon Si Thammarat, and the Siamese retook Alor Setar with about 1,500 men while British ships, bound by the Burney Treaty, blockaded the Kedah coast against the Malays. Nakhon Noi died on 14 May 1838. Si Phiphat chose a Kedah prince, Tunku Anom, to govern Kedah for Siam, and Bangkok divided the country. Kubang Pasu became a separate state in 1839 (until 1864), and Perlis, separate from about 1839, received its own raja, Syed Hussain Jamalullail, in 1843. Satun (Setul) already had a ruler of its own under Siam.
      - After twenty years in exile Sultan Ahmad Tajuddin accepted Siamese terms and was restored in 1842 to the rest of Kedah, as a vassal sending the bunga mas; he died in 1845. Kedah and Perlis, with Kelantan and Terengganu, passed from Siamese to British overlordship under the Anglo-Siamese Treaty of 1909, while Satun and the seven provinces of Pattani stayed with Siam.
    facts:
