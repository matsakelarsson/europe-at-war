notes:
  - Thai sources call Sultan Ahmad Tajuddin Halim Shah II “Tuanku Pangeran” and the governor of Nakhon Si Thammarat, Noi na Nakhon, “Chao Phraya Nakhon”. Malay tradition calls the risings of the 1830s Perang Musuh Bisik, the war of the whispering enemy.
  - Numbers of dead were not recorded. British officials in Penang described killings and the burning of villages in 1821, but said the dead could not be counted.
