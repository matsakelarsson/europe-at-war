id: wallachian-uprising-of-1821
name: Wallachian Uprising of 1821
start: "1821-02"
end: "1821-08"
tier: C
summary: A rising in Wallachia, then an autonomous principality under Ottoman suzerainty, led by Tudor Vladimirescu and his Pandurs, irregular soldiers of Oltenia. Begun in early 1821 against the Greek Phanariote princes and the boyars, in uneasy partnership with the Filiki Eteria, whose army under Alexander Ypsilantis had crossed from Moldavia to start the Greek War of Independence, it took Bucharest in March. When Vladimirescu negotiated with the Ottomans, the Eterists seized and killed him; Ottoman troops then crushed the scattered Pandurs and routed Ypsilantis’s army, with its Sacred Band, at Drăgășani in June. The Porte then ended Phanariote rule and named native boyars as princes of Wallachia and Moldavia, and the rising is seen as the start of Romania’s national revival.
