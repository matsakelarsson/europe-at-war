notes:
  - Wallachia used the Julian calendar, then 12 days behind the Gregorian. Romanian accounts date Vladimirescu’s proclamation at Padeș 23 January 1821 and his entry into Bucharest 21 March (Old Style).
  - Ypsilantis’s campaign in the principalities is also the first step of the Greek War of Independence.
