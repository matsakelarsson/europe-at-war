id: haitian-occupation-of-santo-domingo
name: Haitian occupation of Santo Domingo
start: "1822-02-09"
end: "1844-02-27"
tier: C
summary: "The rule of Haiti over the whole of Hispaniola from 1822 to 1844, called in Dominican history the Haitian occupation and in Haitian history the unification of the island. Spain had regained its former colony of Santo Domingo from the French in 1809, but neglected it, and on 1 December 1821 José Núñez de Cáceres proclaimed the independent State of Spanish Haiti and sought to join Simón Bolívar’s Gran Colombia. Several frontier towns and many in the Cibao preferred union with Haiti, whose constitution declared the island one and indivisible, and President Jean-Pierre Boyer marched east with an army of about 10,000 to 12,000 men; Núñez de Cáceres handed over the keys of Santo Domingo without a fight on 9 February 1822. Boyer abolished slavery in the east, gave land to freedmen, took over church property and the estates of emigrants, and applied Haitian law, including restrictions on land ownership by whites, the Rural Code and the taxes needed to pay the indemnity that France imposed in 1825 in return for recognising Haiti. Many landowning families emigrated, the university closed, and opposition grew, from a pro-Spanish plot at Los Alcarrizos in 1824 to the secret society La Trinitaria, founded by Juan Pablo Duarte in 1838. After the revolution of 1843 overthrew Boyer, the separatists proclaimed the Dominican Republic on 27 February 1844, which began the Dominican War of Independence. Historians disagree over how far the period was an occupation and how far a union that many easterners at first welcomed."
