  - title: Katamanso and the peace of 1831
    date: 1826 – 1831
    when: "1826-08-07"
    borders: "1831-06-01"
    countries: [gh]
    body:
      - "In 1826 Osei Yaw Akoto marched south-east to punish the Ga of Accra and the Akyem and Akuapem, who had broken away from Asante, and to threaten the British and Danish forts. About 11,000 allies gathered on the open plain between Katamanso and Dodowa, north-east of Accra: British troops, Royal Marines and militia, a Danish contingent from Christiansborg, and the armies of the Ga under their king, Taki Kome, of the Akyem under their queen, Afia Dokuaa, and of the Fante, Akuapem and Denkyira."
      - "On 7 August 1826 the Asante attacked the centre of the allied line and nearly broke it, but the allies held on the flanks, and Congreve rockets, never seen before in the region, threw the Asante ranks into confusion. The Asantehene, himself wounded, withdrew with heavy losses; thousands of Asante soldiers were killed. The defeat ended Asante’s attempts to rule the coast by force for a generation."
      - "Peace took years. In 1828 the British government handed the forts back to a committee of London merchants, whose president at Cape Coast from 1830, George Maclean, made a treaty with Asante on 27 April 1831. Asante gave up its claims to Denkyira, Assin, the Fante and the other states south of the Pra, opened the roads to trade and deposited 600 ounces of gold and two young princes, Owusu Ansa and Owusu Nkwantabisa, as pledges of good conduct. The princes were educated in England. Under Maclean the states south of the Pra came under informal British protection, and the peace lasted for thirty years."
