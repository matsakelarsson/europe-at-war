steps:
  - title: Nsamankow
    date: 1823 – 1824
    when: "1824-01-21"
    borders: "1824-01-21"
    countries: [gh]
    body:
      - "Asante had invaded the coast several times since 1807 to punish Fante states that sheltered its enemies, and by 1816 the Fante paid it tribute. The British, Dutch and Danish forts on the coast paid rents to the Asantehene for their land. When the British crown took over the Gold Coast forts in 1821, MacCarthy treated the Fante as British protégés and rejected treaties that earlier envoys had made with Kumasi. Relations broke down, and in 1823, after an Asante war party seized and beheaded an African sergeant of the British garrison, Kujo Otetfo, who had insulted the Asantehene, both sides prepared for war."
      - MacCarthy planned to meet the Asante army with four columns of soldiers, militia and allied levies. Without waiting for the others, he advanced from Cape Coast into the Wassa country with about 500 men. On 21 January 1824 they met an Asante army of perhaps 10,000 by a tributary of the Pra. Most of the ammunition had been left behind by fleeing carriers, and when it ran out the Asante crossed the stream and overran the camp. MacCarthy was wounded and killed, and his skull was kept in Kumasi as a war trophy. Asante tradition holds that Osei Bonsu died in Kumasi the same day.
      - In mid-1824 an Asante army under the new king, Osei Yaw Akoto, advanced to the outskirts of Cape Coast, but after indecisive fighting in July smallpox and dysentery forced it to withdraw to the interior.
    facts:
