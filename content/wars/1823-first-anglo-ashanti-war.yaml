id: first-anglo-ashanti-war
name: First Anglo-Ashanti War
start: "1823"
end: "1831-04-27"
tier: B
summary: "The first war between the Asante Empire and Britain over the Gold Coast, now Ghana. Asante, the strongest state of the forest country, had conquered the Fante coast between 1807 and 1816 and claimed the rents of the European forts. In 1821 the British government took over its forts from the African Company of Merchants and put them under Sir Charles MacCarthy, the governor of Sierra Leone, who backed the Fante and refused to accept Asante’s claims. War broke out in 1823. On 21 January 1824 MacCarthy’s small army was destroyed at Nsamankow, and he was killed; on the same day the Asantehene Osei Bonsu died in Kumasi. Two years later, on 7 August 1826, a coalition of the British, the Danes at Christiansborg and the coastal and southern Akan states defeated the new Asantehene, Osei Yaw Akoto, at Katamanso near Dodowa, helped by the terror of Congreve rockets. In a treaty of 1831, negotiated by George Maclean, Asante gave up its claims to the states south of the Pra river, which became the core of a British sphere on the coast."
countries: [gh, gb]
sides:
  - id: as
    name: Asante Empire
    polities: [asante]
    ink: gold
    moves: Asante moves
    success: Asante success
  - id: gb
    name: Britain, the Fante, the Ga and their allies
    polities: [united-kingdom, ghana, fante]
    ink: red
    moves: British and allied moves
    success: British and allied success
notes:
  - "Most accounts of the war come from British officers and officials; the Asante side is known from oral history and from the work of historians such as Ivor Wilks. The size of the armies at Nsamankow and Katamanso is uncertain. Sources date Nsamankow to 21 or 22 January 1824. Its exact site, by a tributary of the Pra in the Wassa country, is not securely known, and its marker is placed approximately."
  - "The Ga and the British call the battle of 1826 Katamanso and Dodowa respectively, after two villages on the plain north-east of Accra."
