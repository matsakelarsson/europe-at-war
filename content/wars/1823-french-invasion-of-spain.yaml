steps:
  - title: The Hundred Thousand Sons of Saint Louis
    date: April – June 1823
    when: "1823-04-07"
    borders: "1823-06-15"
    countries: [es, fr]
    body:
      - In January 1820 an army revolt led by Lieutenant Colonel Rafael del Riego forced King Ferdinand VII to restore the liberal constitution of 1812, and for three years Spain was governed by liberal ministers and an elected Cortes. Royalist bands, calling themselves the Army of the Faith, rose in the north and in 1822 set up a regency at La Seu d’Urgell, and Ferdinand secretly appealed to the other monarchies. At the Congress of Verona the great powers, over British objections, agreed that France should intervene, and in January 1823 Louis XVIII announced that a hundred thousand Frenchmen were ready to march to save the throne of Spain.
      - On 7 April a French army under the king’s nephew, the Duke of Angoulême, crossed the Bidasoa together with Spanish royalist troops. Unlike in 1808, most Spaniards did not resist, and in many places they welcomed the French as defenders of the king and the Church. The French left the fortresses behind them under blockade and entered Madrid on 24 May, where a royalist regency was set up. The Cortes had already moved to Seville, taking the king with them. On 11 June, when he refused to go further, they declared him temporarily unfit to rule and carried him off to Cádiz.
    facts:
      - [French army crosses the Bidasoa, "7 April 1823"]
      - [Madrid entered, "24 May 1823"]
      - [Commander, "Louis Antoine, Duke of Angoulême"]
