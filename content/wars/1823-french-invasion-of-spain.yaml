  - title: Trocadero and Cádiz
    date: June – November 1823
    when: "1823-06-24"
    borders: "1823-11-02"
    countries: [es, fr]
    body:
      - French columns pursued the constitutional armies across the country. General Francisco Ballesteros surrendered in Andalusia on 4 August, and A Coruña, Pamplona and San Sebastián gave up in August and September. Cádiz, the refuge of the Cortes, was besieged from late June. On the night of 31 August French infantry waded across the channel in front of the Trocadero fort, which guarded the inner bay, and stormed it; the Place du Trocadéro in Paris is named after the victory. After the fort of Sancti Petri fell and the city was bombarded, the Cortes gave in and released the king, who crossed to the French camp at El Puerto de Santa María on 1 October.
      - Ferdinand at once annulled every act of the constitutional government since 1820, despite his promise of an amnesty, and began a decade of repression. Riego, captured in September, was hanged in Madrid on 7 November. Thousands of liberals were imprisoned or executed, or went into exile, many of them to Britain. In Catalonia General Francisco Espoz y Mina held Barcelona until 2 November. French troops stayed in Spain until 1828, partly to restrain the king’s ultra-royalist supporters.
    facts:
      - [Trocadero stormed, "31 August 1823"]
      - [Ferdinand VII released, "1 October 1823"]
      - [Riego hanged, "7 November 1823"]
