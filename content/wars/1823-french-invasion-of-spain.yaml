id: french-invasion-of-spain
name: French invasion of Spain (1823)
start: "1823-04-07"
end: "1823-11-02"
tier: B
summary: The French intervention of 1823, approved by the great powers at the Congress of Verona, which overthrew Spain’s liberal constitutional government and restored King Ferdinand VII as an absolute monarch. A French army under the Duke of Angoulême, popularly called the Hundred Thousand Sons of Saint Louis, met little resistance, took Madrid in May and forced the surrender of Cádiz, the last refuge of the Cortes, after storming the Trocadero fort in August.
