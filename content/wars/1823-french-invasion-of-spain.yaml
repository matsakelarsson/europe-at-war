notes:
  - In French the campaign is called l’expédition d’Espagne. Despite its popular name, the French army had between 60,000 and 95,000 men. The years of liberal rule it ended, 1820–1823, are known in Spain as the Trienio Liberal, and the years of absolutism that followed, to 1833, as the Ominous Decade.
