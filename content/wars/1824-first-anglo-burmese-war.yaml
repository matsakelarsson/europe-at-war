  - title: Bandula at Ramu
    date: May – August 1824
    when: "1824-05-17"
    borders: "1824-05-17"
    countries: [mm, bd]
    body:
      - Maha Bandula gathered the main Burmese army in Arakan, and in May 1824 it crossed the Naf into Chittagong. In mid-May a column of about 4,000 men under Maha Thiha Thura (U Sa) attacked a Company force of about 1,000 sepoys and local levies under Captain Noton at Ramu, east of Cox’s Bazar. On 17 May, after three days of fighting, the Company’s line broke; most of its officers were killed and many of the sepoys were killed or captured. The Burmese then took Cox’s Bazar.
      - The defeat caused panic in Chittagong, and rumours that Bandula would march on Calcutta reached the city. Bandula, however, did not push on towards Chittagong. Within days of Ramu a Company fleet had appeared off Rangoon, and in August the court recalled him with most of his army. He led it across the Arakan Yoma by the passes towards the Irrawaddy, leaving a smaller force under U Sa to hold Arakan.
    facts:
      - [Battle of Ramu, "17 May 1824, Burmese victory"]
      - [Company force at Ramu, "about 1,000 men"]
      - [Bandula recalled from Arakan, "August 1824"]
