id: first-anglo-burmese-war
name: First Anglo-Burmese War
start: "1824-03-05"
end: "1826-02-24"
tier: A
summary: "The first of three wars in which the British conquered Burma, and one of the longest and most expensive wars of British India. The Konbaung kingdom had conquered Arakan, Manipur and Assam, and its frontier with the East India Company’s Bengal ran from the Brahmaputra to the Naf river. After clashes on that frontier, in Cachar and on the island of Shahpuri, Governor-General Lord Amherst declared war on 5 March 1824. Burma’s leading general, Maha Bandula, won at Ramu near Chittagong in May, but a Company army under Sir Archibald Campbell had already landed at Rangoon (Yangon). Bandula’s great attack on it failed in December 1824, he was killed at Danubyu in April 1825, and another army took Arakan. After failed peace talks and a last Burmese attempt to retake Prome, Campbell advanced up the Irrawaddy to Yandabo, about 80 km from the capital Ava. By the Treaty of Yandabo (24 February 1826) Burma ceded Arakan and Tenasserim, gave up Assam and Manipur and paid an indemnity of one million pounds. Of some 40,000 British and Indian troops about 15,000 died, most of them of disease; Burmese losses are not known."
countries: [mm, in, bd]
sides:
  - id: bur
    name: Konbaung Burma
    polities: [konbaung]
    ink: brown
    moves: Burmese moves
    success: Burmese success
  - id: eic
    name: East India Company
    polities: [british-india]
    ink: red
    moves: Company moves
    success: Company success
notes:
  - In Burmese the war is called the First English War. The Company’s armies were mostly Indian sepoys of the Bengal and Madras armies under British officers, with regiments of the British Army and ships of the Royal Navy and the Company’s Bombay Marine.
  - Burmese places are given by their names of the time, with today’s names in brackets where they differ (Rangoon for Yangon, Prome for Pyay, Pagan for Bagan, Martaban for Mottama, Tavoy for Dawei, Mergui for Myeik). The capital moved from Amarapura back to Ava (Inwa) in 1823.
  - The sizes of the Burmese armies are uncertain. British officers gave much higher figures than the Burmese royal chronicles (for Bandula’s army at Rangoon, 30,000–60,000 against about 16,000); the text gives both where they are known.
  - The Assam front is told in the war Burmese invasions of Assam and is only summarised here.
