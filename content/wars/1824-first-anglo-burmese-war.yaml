steps:
  - title: A frontier from the Brahmaputra to the Naf
    date: September 1823 – March 1824
    when: "1823-09"
    borders: "1824-03-05"
    countries: [mm, in, bd]
    body:
      - In forty years the Konbaung kings had pushed Burma’s borders west to those of the East India Company. Bodawpaya conquered the kingdom of Arakan in 1784–1785, and tens of thousands of Arakanese fled into the Company’s district of Chittagong, from where some of them raided back across the Naf river; the court of Ava demanded that the Company hand over their leaders. Burmese armies then took Manipur (1814 and 1819) and Assam (1817–1822), and by 1822 they stood on the borders of Bengal, Cachar and Jaintia, small hill kingdoms that both sides counted as their own. Maha Bandula, the general who had completed the conquest of Assam, and Queen Me Nu’s party at court favoured war; the Company feared for its frontier and its trade.
      - In September 1823 Burmese troops from Arakan drove a sepoy post off Shahpuri, a small island in the mouth of the Naf that the Company regarded as part of Bengal. In January 1824 a Burmese army under Thado Thiri Maha Uzana marched from Manipur into Cachar, which the Company had declared under its protection, and fought Company troops there and in Jaintia. On 5 March 1824 the Governor-General, Lord Amherst, declared war.
      - The Company did not want to fight through the forested hills of the frontier. While its troops held Chittagong and advanced into Assam, where they occupied Guwahati on 28 March, it prepared an expedition by sea to Rangoon, Burma’s main port, from where an army could go up the Irrawaddy to Ava. King Bagyidaw’s court, which had beaten the Siamese and the Ahoms and had little knowledge of the Company’s strength, expected to fight on the frontier.
