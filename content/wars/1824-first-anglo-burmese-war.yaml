  - title: The Company at Rangoon
    date: May – October 1824
    when: "1824-05-11"
    borders: "1824-05-11"
    countries: [mm]
    body:
      - The expedition gathered at Port Cornwallis in the Andaman Islands, some 10,000 men, about half of them British soldiers and half sepoys, mostly from Madras, under Major-General Sir Archibald Campbell, with the warships of Commodore Charles Grant and the paddle steamer Diana, the first steam warship of the Company to see action. Detachments took the islands of Cheduba and Negrais off the coast, and on 11 May 1824 the fleet entered the Rangoon river.
      - The governor of Rangoon had moved the townspeople inland, and the British found the town almost empty, with no boats or cattle to carry an army up the river. Campbell made the great Shwedagon pagoda his fortress. The Burmese built a ring of stockades in the forest around the town; the Company stormed those at Kemmendine on 10 June and others in July, and Burmese attempts to retake the Shwedagon failed in September. But the rains had begun, and the army, short of fresh food, was soon losing far more men to fever and dysentery than to fighting.
      - Smaller expeditions went by sea to the south. Tavoy surrendered in September, Mergui was stormed on 6 October, and Lieutenant-Colonel Henry Godwin took Martaban on 30 October, after which Ye and the rest of the Tenasserim coast submitted. In the Burmese capital the court arrested the few Westerners living there, among them the American missionary Adoniram Judson, who spent the rest of the war in prison at Ava and Aungbinle.
    facts:
      - [Landing at Rangoon, "11 May 1824"]
      - [Expedition, "about 10,000 men, half British, half Indian"]
      - [Kemmendine stockades taken, "10 June 1824"]
      - [Martaban taken, "30 October 1824"]
