  - title: Malun, Pagan and the Treaty of Yandabo
    date: January – February 1826
    when: "1826-01-19"
    borders: "1826-02-24"
    countries: [mm, in, bd]
    body:
      - Campbell followed the Burmese up the river. At Malun, on the west bank below Magwe, envoys from Ava agreed terms early in January 1826 on condition that the king ratify them within fifteen days. No ratification came, and the Burmese used the time to strengthen their stockades; on 19 January the British stormed Malun, held by 10,000 to 12,000 men. The court raised one last army, which was beaten outside Pagan on 8 or 9 February (the sources differ by a day). On 16 February the British reached Yandabo, a village on the Irrawaddy about four days’ march from Ava.
      - The court gave in. Two ministers came to Campbell’s camp, with the American missionary doctor Jonathan Price, who had been a prisoner at Ava, and the treaty was signed on 24 February 1826. Burma ceded Arakan and the Tenasserim coast south of the Salween, renounced Assam and Manipur, promised not to interfere in Cachar and Jaintia, agreed to exchange envoys with Calcutta and to make a commercial treaty, and promised an indemnity of one million pounds sterling in four instalments. It paid the first instalment of 250,000 pounds in gold and silver and freed its prisoners, among them Judson, who later interpreted for the British envoy John Crawfurd in the talks on the commercial treaty; the British stayed in Rangoon until the second instalment was paid at the end of 1826.
      - The war cost the Company between 5 and 13 million pounds by different estimates, and contributed to the financial crisis in India that preceded the loss of its last trading monopolies in 1833. Of about 40,000 British and Indian soldiers sent to the war about 15,000 died, most of them of disease. Burmese losses are not known. For Burma the indemnity emptied the treasury for years, and the loss of its western provinces was never accepted at Ava; Mon and Arakanese risings against the new British rulers followed in Tenasserim and Arakan. Disputes over the treaty and over the treatment of British traders led to the second war in 1852.
    facts:
      - [Malun stormed, "19 January 1826"]
      - [Battle of Pagan, "8 or 9 February 1826"]
      - [Treaty of Yandabo, "24 February 1826"]
      - [Indemnity, "one million pounds sterling"]
      - [Company dead, "about 15,000 of some 40,000 troops, mostly from disease"]
    markers:
      - kind: battle
        side: eic
