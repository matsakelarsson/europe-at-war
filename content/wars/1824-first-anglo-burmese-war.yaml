  - title: Bandula before Rangoon
    date: November – December 1824
    when: "1824-11-30"
    borders: "1824-11-30"
    countries: [mm]
    body:
      - Bandula reached the delta in the autumn, now made Agga Maha Thenapati (supreme commander) by the king, and in November drew up his army in a wide arc around Rangoon, digging trenches close to the British lines. British officers put it at 30,000 to 60,000 men; the Burmese chronicles give about 16,000, many of them newly raised. Campbell had about 4,000 men fit to fight, with the guns of the fleet and a battery of Congreve rockets, a weapon the Burmese had not met before.
      - The great attack began on 30 November. The Burmese came on in separate columns that could not support one another, and were beaten back with heavy losses around the Shwedagon and at Kemmendine, where fire rafts were also sent down the river against the ships. On 7 December the British went over to the attack, and on 15 December they drove the last Burmese from their entrenched camp at Kokine, north of the town.
      - By Burmese counts only about 7,000 of the 16,000 men returned to the royal army; Campbell reported some 6,000 Burmese killed, wounded or taken. The British lost about 540 men killed and wounded in the battle, but in the six months at Rangoon about 1,200 had died of disease. Bandula fell back with what was left of his army to Danubyu, a stockaded town on the Irrawaddy.
    facts:
      - [Bandula’s army, "about 16,000 (Burmese chronicles); 30,000–60,000 (British estimates)"]
      - [Main Burmese attack, "30 November – 1 December 1824"]
      - [Kokine taken, "15 December 1824"]
      - [British losses, "about 540 killed and wounded; about 1,200 dead of disease by the end of the year"]
    markers:
