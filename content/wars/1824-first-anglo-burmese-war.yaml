  - title: Talks and battle at Prome
    date: September – December 1825
    when: "1825-12-01"
    borders: "1825-12-01"
    countries: [mm]
    body:
      - With Bandula dead, the court raised new levies, many of them Shan troops under their own hereditary rulers (sawbwas), and gave the command to Maha Ne Myo. An armistice was agreed on 17 September, and in early October envoys met at Ngagyaungbinzeik, about 30 km north of Prome. The British demanded that Burma give up Assam and Manipur, cede Arakan and Tenasserim and pay two million pounds. The Burmese offered to renounce Assam and Manipur and to cede Tenasserim, but not Arakan; told that “the question is not how much you will cede to us but how much we shall return to you”, they broke off the talks.
      - In November Burmese armies closed in on Prome from the north on both banks of the Irrawaddy and cut its river link with Rangoon. On 1 December Campbell, with about 2,500 European and 1,500 Indian troops and Captain James Brisbane’s flotilla, attacked Maha Ne Myo’s left wing at Simbaik; the Shan regiments, which by a British account “fought bravely”, were routed. Maha Ne Myo was killed in the fighting. On 2 December the British took the Napadi hills, the centre of the Burmese line, and on 5 December they drove the division on the west bank from its positions.
      - Modern historians think the British claims of 50,000 to 60,000 Burmese at Prome much too high; Maha Ne Myo’s own force was probably about 10,000. The army that was to have saved Lower Burma was scattered, and on 26 December the Burmese sent a flag of truce.
    facts:
      - [Armistice, "17 September 1825"]
      - [Talks at Ngagyaungbinzeik, "October 1825"]
      - [Battle of Prome, "1–5 December 1825, Company victory"]
    markers:
      - kind: battle
        side: eic
        name: Prome (Simbaik, Napadi)
        date: 1–5 December 1825
        text: Campbell attacked the Burmese divisions north of the town one after another, and Maha Ne Myo was killed.
        lonlat: [95.218, 18.824]
    arrows:
