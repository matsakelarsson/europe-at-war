  - title: Danubyu, Arakan and Prome
    date: February – April 1825
    when: "1825-04-01"
    borders: "1825-04-25"
    countries: [mm, in, bd]
    body:
      - In February 1825 Campbell marched north from Rangoon by land towards Tharrawaddy, while Brigadier-General Willoughby Cotton took a flotilla and about 4,000 men up the Irrawaddy. Cotton’s first assault on Danubyu, held by Bandula with about 10,000 men behind a stockade of teak beams more than a kilometre long, failed in March, and Campbell turned back to join him. On 1 April, during the British bombardment, Bandula was killed by a mortar shell as he walked the walls under his golden umbrella. Without him the garrison gave up the town, and on 25 April Campbell entered Prome, which the Burmese had abandoned. He stayed there through the rains.
      - A second army of about 11,000 men under Brigadier-General Joseph Morrison gathered at Chittagong to invade Arakan. On the way there, on 2 November 1824, the 47th Bengal Native Infantry at Barrackpore near Calcutta had refused to march without bullocks to carry its baggage; British troops fired on the sepoys on their parade ground, and estimates of the dead range from about 100 to 180 (the government’s figure) and up to 400–600 (the figure given in Parliament by Joseph Hume). About a dozen of their leaders were hanged and the regiment was disbanded. Morrison advanced along the coast in February and stormed Mrauk U on 1 April; U Sa withdrew across the mountains. When the rains came, fever and dysentery killed thousands of Morrison’s men, and the plan to march over the Arakan Yoma to join Campbell was dropped.
      - In the north, the Burmese garrison of Rangpur in Assam capitulated in January 1825 and was allowed to march home, and Gambhir Singh’s Manipur Levy, raised with Company support, drove the Burmese out of Manipur in June. The Company’s attempt to advance from Cachar into Manipur was halted by the forests and the rains.
    facts:
