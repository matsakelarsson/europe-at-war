        text: The Burmese stockades on the heights above the river were stormed after the court failed to ratify the terms agreed here.
        lonlat: [94.960, 20.050]
        lp: l
      - kind: battle
        side: eic
        name: Pagan (Bagan)
        date: 8 or 9 February 1826
        text: The last Burmese army of the war was defeated outside the old royal city.
        lonlat: [94.860, 21.170]
        lp: l
      - kind: treaty
        name: Yandabo
        date: 24 February 1826
        text: The treaty that ended the war was signed in this village on the Irrawaddy, about 80 km from Ava.
        lonlat: [95.360, 21.634]
      - kind: capital
        side: bur
