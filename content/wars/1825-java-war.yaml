id: java-war
name: Java War
start: "1825-07-20"
end: "1830-03-28"
tier: A
summary: "The rebellion of Prince Diponegoro of Yogyakarta against the Dutch colonial government and the Javanese courts allied with it, the last great war of the Javanese aristocracy against colonial rule. Diponegoro, eldest son of Sultan Hamengkubuwono III, drew on resentment of Dutch interference at court, of land rents, tolls and the Chinese toll-farmers, and on hopes of a Just King after cholera and the eruption of Merapi. When Dutch troops came to arrest him at Tegalrejo on 20 July 1825 he withdrew to Selarong and declared a holy war. His followers besieged Yogyakarta and rose across Central Java, and in 1826 his army threatened Surakarta until it was beaten at Gawok. The war became a guerrilla struggle that General Hendrik Merkus de Kock answered from 1827 with a network of more than 250 small forts, the benteng-stelsel, which slowly penned the rebels into the hills west of Yogyakarta. After his commanders were captured, killed or surrendered, Diponegoro agreed to talks and was arrested by de Kock at Magelang on 28 March 1830 and exiled to Sulawesi. At least 200,000 Javanese died, most of them civilians, and 15,000 soldiers of the colonial army. The Dutch annexed the outer provinces of the courts and introduced the Cultivation System, and Java saw no further large-scale revolt until the Indonesian revolution."
countries: [id, nl]
sides:
  - id: dip
    name: Diponegoro and his followers
    polities: [diponegoro]
    ink: green
