steps:
  - title: Tegalrejo and Selarong
    date: 1816 – July 1825
    when: "1825-07-20"
    borders: "1825-07-20"
    view:
      center: [110.5, -7.45]
      size: [520, 420]
    countries: [id, nl]
    body:
      - When the Dutch took back Java from the British in 1816, the courts of Central Java had already been humbled. Daendels had bullied them, the British had stormed the palace of Yogyakarta in 1812 and taken Kedu and other lands, and the new government let European and Chinese planters lease land from the nobility and Chinese toll-farmers squeeze the peasants at countless toll-gates. Diponegoro, born in 1785, the eldest son of Sultan Hamengkubuwono III by a secondary wife, had been passed over for the succession in favour of a younger half-brother (by some accounts he had himself declined the title) and lived as a devout Muslim on his estate at Tegalrejo outside Yogyakarta. He told of visions in which he was called to restore the faith and the kingdom. After his father’s death in 1814 two child sultans followed, and in 1822 Diponegoro became a guardian of the infant Hamengkubuwono V, quarrelling with the other guardians and with the Dutch resident, Anthonie Hendrik Smissaert.
      - In 1823 the government abolished the land leases and demanded heavy indemnities from the nobles who had to repay the planters. Cholera in 1821, the eruption of Merapi in 1822 and poor harvests fed hopes of the Ratu Adil, the Just King of Javanese prophecy, and by late 1824 Diponegoro was planning a rising with nobles, religious teachers and armed bands of the countryside.
      - In June 1825 Smissaert had a road laid out across Diponegoro’s land at Tegalrejo, and his followers tore out the survey stakes and fought the road workers. On 20 July 1825 a detachment of Dutch and Yogyakarta troops came to arrest him; after a skirmish Diponegoro escaped with his followers to the cave of Selarong in the hills south-west of the city, and on 21 July he proclaimed his rebellion. Some seventy members of the royal family joined him with their retinues.
