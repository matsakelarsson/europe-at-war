  - title: The siege of Yogyakarta and the spread of the rising
    date: July – September 1825
    when: "1825-08"
    borders: "1825-08"
    countries: [id, nl]
    body:
      - Diponegoro’s men ambushed and destroyed a Dutch column marching to Yogyakarta and captured its arms, and from 28 July they besieged the city, where the Dutch, the court and the European residents held the fort and the palace. Risings followed in the districts to the north and west, around Magelang and in Kedu, in the countryside of Surakarta and as far as Madiun and the north coast. At Ngawi in September Diponegoro’s followers killed the town’s Chinese, whom they saw as agents of the toll-gates. Diponegoro took the title of Sultan Erucakra, the Just King of prophecy, and religious teachers rallied their students to the holy war.
      - The government recalled troops from Sulawesi and appointed Lieutenant-General Hendrik Merkus de Kock commissioner for the princely states on 26 July. A relief force with troops from Sumenep and the Mangkunegaran reached Yogyakarta on 19 August and saved the city, and on 25 September de Kock arrived with 7,500 men and ended the siege. When his troops attacked Selarong soon after, Diponegoro had already left.
    facts:
      - [Siege of Yogyakarta, "28 July – 25 September 1825"]
      - [De Kock’s relief force, "7,500 men"]
