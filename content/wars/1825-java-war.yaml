  - title: The war beyond Mataram
    date: 1825–1828
    when: "1828-03"
    borders: "1828-03"
    countries: [id, nl]
    body:
      - The rising reached far beyond the heartland. North of Surakarta, towards Semarang, Prince Serang led a rebel army said to number 8,000 at the start of the war, with his mother, Nyi Ageng Serang, then in her seventies, commanding a cavalry unit. They fought on until mid-1827, when they surrendered.
      - In East Java Raden Aria Sasradilaga, Diponegoro’s brother-in-law, raised the country around Rembang and Lasem on the north coast in late 1827, with Chinese and mixed-descent fighters among his men, while Raden Ayu Yudakusuma, a princess of the Yogyakarta house whom the Dutch called “a clever but much dreaded woman”, led the rising around Ngawi and Madiun. Their forces joined from November 1827 to March 1828, when Sasradilaga was defeated; Yudakusuma fought on until October 1828. The Dutch had to build forts around Semarang and Madiun as well.
    facts:
      - [Prince Serang surrenders, "mid-1827"]
      - [Sasradilaga defeated, "March 1828"]
      - [Raden Ayu Yudakusuma surrenders, "October 1828"]
