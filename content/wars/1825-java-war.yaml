  - title: The arrest at Magelang
    date: February – March 1830
    when: "1830-03-28"
    borders: "1830-03-28"
    countries: [id, nl]
    body:
      - King William I had ordered that Diponegoro be killed or captured and that no agreement be made with him, but de Kock persuaded the new governor-general, Johannes van den Bosch, to offer safe conduct for talks. In February 1830 Diponegoro met the local Dutch commander and then came to Magelang, where he camped with his followers during the fasting month and paid informal visits to de Kock.
      - On 28 March 1830, the second day of the festival at the end of Ramadan, Diponegoro came to the residence at Magelang to negotiate and demanded recognition as sultan and as head of Islam in Java. De Kock announced his arrest, soldiers surrounded the house, and his escort, away at morning exercises, was disarmed. He was taken the same day to Semarang and then to Batavia. Raden Saleh’s painting of the arrest, made in 1857 in answer to a Dutch painting of the “submission”, shows it as a betrayal.
    facts:
      - [Diponegoro arrested, "28 March 1830, at Magelang"]
    markers:
