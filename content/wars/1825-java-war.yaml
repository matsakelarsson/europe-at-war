  - title: Annexation, exile and the Cultivation System
    date: 1830–1855
    when: "1830-07"
    borders: "1830"
    countries: [id, nl]
    body:
      - Diponegoro was exiled to Manado in northern Sulawesi, where he wrote his chronicle, and in 1833 to Makassar, where he died in Fort Rotterdam on 8 January 1855. Sentot was sent with his men to fight in the Padri War in Sumatra and was later exiled to Bengkulu. Pakubuwono VI of Surakarta, suspected of supporting Diponegoro, was deposed and exiled to Ambon in 1830.
      - The government annexed the outer provinces (mancanagara) of Yogyakarta and Surakarta, Banyumas, Bagelen, Madiun and Kediri, leaving the courts with little more than their heartlands. At least 200,000 Javanese had died, a third of Java’s six million people had been touched by the war and a quarter of its farmland damaged; the colonial army had lost 15,000 men and the treasury 20 to 25 million guilders.
      - To recover the costs, van den Bosch introduced the Cultivation System in 1830, which made Javanese villages grow export crops for the government and brought the Netherlands more than 800 million guilders by the 1870s. Java saw no large-scale revolt against Dutch rule again until the Indonesian revolution of 1945. Diponegoro was declared a National Hero of Indonesia in 1973.
    facts:
      - [Javanese dead, "at least 200,000"]
      - [Colonial army dead, "about 15,000 (8,000 European, 7,000 Indonesian)"]
      - [Cost to the Dutch, "20–25 million guilders"]
