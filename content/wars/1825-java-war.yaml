  - title: Diponegoro’s offensive and Gawok
    date: "1826"
    when: "1826-10-15"
    borders: "1826-10"
    countries: [id, nl]
    body:
      - Through late 1825 and 1826 de Kock’s columns chased Diponegoro without catching him. In June 1826 the Dutch stormed the rebel stronghold of Pleret, the old capital of Mataram. Diponegoro then marched north, ambushing a column of Yogyakarta nobles, destroying a Dutch column on the slopes of Merapi and taking a Dutch post, and he joined forces with Kyai Maja, his spiritual adviser, to strike at de Kock’s headquarters at Surakarta.
      - Quarrels between the two leaders cost the rebels time, and the Dutch concentrated their troops. On 15 October 1826 Diponegoro’s army was beaten at Gawok, west of Surakarta. The defeat broke the rebels’ numerical advantage and ended their hopes of taking the courts; Diponegoro withdrew west with about 5,000 men.
    facts:
