  - title: The collapse of the rebellion
    date: 1828 – October 1829
    when: "1829-09-17"
    borders: "1829-09"
    countries: [id, nl]
    body:
      - In 1828 and 1829 the forts closed in on Diponegoro’s men between the Progo and Bogowonto rivers, and the Dutch turned to harsher measures against the villages that supported them. In November 1828 Kyai Maja was ambushed and surrendered, and his followers were later exiled to Minahasa in Sulawesi. A three-month ceasefire from January to April 1829 brought no settlement; the war had exhausted the countryside, the rebels ran short of food and money, and some villagers turned on Diponegoro’s officials.
      - The final Dutch offensive began in June 1829. Within two months Diponegoro lost several strongholds, and by September he and his commander-in-chief, Sentot Ali Basah Prawirodirjo, had been pushed into the Progo valley with about 300 men. On 17 September they were routed at Siluk, where many of Diponegoro’s commanders were killed. His uncle Prince Jayakusuma died soon after, and in October Sentot surrendered with his men, who were taken into Dutch service. Diponegoro was left with about fifty followers.
    facts:
