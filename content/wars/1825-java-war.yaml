  - title: Guerrilla war and the fort system
    date: 1827–1828
    when: "1827-10"
    borders: "1827-10"
    countries: [id, nl]
    body:
      - After Gawok Diponegoro fought a guerrilla war. His men ambushed Dutch columns from the tall grass along the roads, villagers blocked the tracks with felled trees and bamboo stakes, and the fortified villages of the countryside served as rebel strongholds. Disease, the hostility of the population and the cuts in spending ordered by the commissioner-general, Leonard du Bus de Gisignies, wore down the Dutch; by April 1827 de Kock had lost 1,600 men, and he compared the war to the Vendée.
      - In 1827 de Kock changed his method. He built small forts (benteng) at short distances along the roads and rivers, linked by mobile columns, and pushed the network forward step by step, so that the rebels lost the villages that fed them. A ceasefire for talks in August–September 1827 led nowhere, and in October Diponegoro moved west along the south coast into Bagelen, surprising its Dutch posts. By the end of 1828 his men held most of the Bagelen countryside, but the Dutch had cleared the country around Yogyakarta and Surakarta.
      - Of the 258 forts built during the war, 133 went up in 1828 and 1829. The colonial army was reinforced by about 3,000 soldiers from the Netherlands, two-thirds of whom died, and by thousands of Indonesian auxiliaries from Madura, Sulawesi, Buton, the Moluccas and Bali, with 2,500 men of the Mangkunegaran Legion.
    facts:
      - [Dutch losses by April 1827, "1,600 dead"]
      - [Forts built, "258 in all, 133 of them in 1828–1829"]
