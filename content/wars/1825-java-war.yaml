notes:
  - The war is known in Indonesia as Perang Diponegoro. Diponegoro wrote his own account in exile, the Babad Diponegoro, a verse chronicle of more than 1,000 pages now on UNESCO’s Memory of the World register; a Javanese account from the Dutch side, the Babad Kedung Kebo, was written by Cokronegoro I. The Dutch official history in six volumes (1894–1909) and the work of the historian Peter Carey are the main modern accounts.
  - Estimates of the dead differ. Most give at least 200,000 Javanese dead from fighting, hunger and disease, with combat deaths among the rebels of about 20,000 or fewer; the colonial army lost about 15,000 men, 8,000 Europeans, most of them to disease, and 7,000 Indonesian soldiers. The population of the Yogyakarta districts reported by the Dutch fell from just over 400,000 in 1825 to under 200,000 in 1831.
  - Diponegoro’s forces also killed many Chinese, seen as agents of the hated toll-gates, notably at Ngawi in September 1825, though some Chinese fought for and supplied him.
