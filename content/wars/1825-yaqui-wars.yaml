notes:
  - "The numbers killed and deported are uncertain. The anthropologist Raquel Padilla counted more than 6,000 people deported in official reports of the Porfiriato; other estimates run to 15,000 or more. Mexico’s National Human Rights Commission describes the repression as aimed at eliminating Yaqui culture in whole or in part."
  - Much of the early history comes from Spanish and Jesuit accounts, such as Andrés Pérez de Ribas’s; Yaqui oral tradition tells it differently, with the Yaqui choosing peace and the missionaries.
