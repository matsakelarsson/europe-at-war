  - title: Mazocoba, the deportations and the last war
    date: 1887–1927
    when: "1900-01-18"
    borders: "1900-01-18"
    countries: [mx]
    body:
      - "Juan Maldonado, called Tetabiate, led the Yaqui who would not submit in a guerrilla war from the Bacatete mountains. A peace signed at Ortiz in May 1897 broke down in 1899. On 18 January 1900 General Lorenzo Torres’s troops trapped Yaqui families who had gathered on the mountain of Mazocoba; some 400 Yaqui were killed and hundreds, mostly women and children, captured (accounts range from 300 to about 1,000). By most accounts Tetabiate was killed by one of his own men in 1901; Mexico’s National Human Rights Commission says he died at Mazocoba."
      - "Díaz’s government and the Sonoran governors Rafael Izábal and Luis Torres then turned to deportation. From about 1902 to 1908 soldiers rounded up Yaqui men, women and children, including many who worked peacefully on haciendas, and sent them south by ship and railway to the henequen plantations of Yucatán and to Oaxaca and Veracruz, where they were sold to planters, by one officer’s account at 65 pesos a head. Families were split up and many died of disease and overwork; Yaqui fled to Arizona, where communities remain. Many Yaqui fought in the Revolution, which promised to return their land, and some deportees made their way home. When the promises were not kept the Yaqui rose again in 1926, stopping a train carrying former president Álvaro Obregón near Vícam; the army, with bombing aircraft, ended the rising in 1927."
    facts:
      - [Peace of Ortiz, "May 1897"]
      - [Massacre at Mazocoba, "18 January 1900"]
      - [Deportations, "about 1902–1908"]
      - [Last Yaqui rising, "1926–1927"]
