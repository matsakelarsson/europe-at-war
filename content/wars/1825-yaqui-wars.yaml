  - title: Cajeme’s Yaqui nation
    date: 1868–1887
    when: "1886-05-12"
    borders: "1886-05-12"
    countries: [mx]
    body:
      - "In the civil wars of Sonora the Yaqui often sided with Governor Ignacio Pesqueira’s conservative rivals. In February 1868 Sonoran troops held several hundred Yaqui prisoners in the church of Bácum, and when some tried to escape they fired on it with artillery and it caught fire; about 120 died. In 1874 Pesqueira made José María Leyva, called Cajeme, a Yaqui who had served in the Mexican army, alcalde mayor of the Yaqui and Mayo valleys, hoping he would bring them under control. Instead Cajeme organised the eight towns as a self-governing nation, with councils, a treasury fed by tolls on river traffic and a trained militia, and from 1875 refused to let state officials, tax collectors or surveyors into the valley."
      - "When the Díaz government decided to open the fertile valley to irrigation, railways and colonists, it sent federal troops. In 1885–1886 several thousand soldiers fought their way to Cajeme’s fortified positions at El Añil and Buatachive in the foothills; the last strongholds fell in May 1886, with about 200 Yaqui dead and some 2,000, mostly the old, children and the sick, captured. Cajeme escaped but was betrayed in April 1887 and shot on 23 April near Cócorit, after the army had paraded him through the towns."
    facts:
