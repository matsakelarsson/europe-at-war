steps:
  - title: From Guzmán to Banderas
    date: 1533–1833
    when: "1825"
    borders: "1832-12-01"
    countries: [mx]
    body:
      - "The Yaqui farmed the floodplain of the lower Yaqui River in some 80 rancherías, with perhaps 30,000 people, when Diego de Guzmán’s slave-raiding expedition reached the river in 1533 and was turned back in battle. In 1609–1610 they defeated the Spanish captain Diego Martínez de Hurdaide three times, and then made peace and asked for Jesuit missionaries, who arrived in 1617 and gathered the Yaqui into eight towns: Cócorit, Bácum, Tórim, Vícam, Pótam, Ráhum, Huírivis and Belem. The towns governed themselves under the missions for more than a century. In 1740, with Spanish settlers and miners pressing on their land, the Yaqui and their Mayo neighbours rose and drove out many settlers before the revolt was put down, with heavy Yaqui losses."
      - "Independent Mexico made the Yaqui citizens, which meant taxes and the division of their common land. In 1825 Juan Ignacio Jusacamea, known as Juan Banderas, raised the Yaqui, saying that the Virgin of Guadalupe had called him to restore the kingdom of Moctezuma, and drew in Mayo, Opata and Pima fighters in a bid to unite the Native peoples of Sonora. He held off state troops for years, until he was defeated at Soyopa in December 1832 and shot in January 1833 with the Opata leader Dolores Gutiérrez."
    facts:
      - [Guzmán’s expedition turned back, "1533"]
      - [Jesuit missions, "from 1617"]
      - [Revolt of Juan Banderas, "1825–1833"]
