id: yaqui-wars
name: Yaqui Wars
start: "1825"
end: "1927"
tier: B
summary: "The century of wars between the Yaqui (Yoeme) people of southern Sonora and the Mexican state over the lands of the eight Yaqui towns on the lower Yaqui River. The Yaqui had defeated Spanish expeditions in 1533 and 1609–1610 before accepting Jesuit missionaries on their own terms in 1617, and had risen in 1740. After independence Mexico’s attempts to tax the Yaqui, divide their land and open it to settlers led to the revolt of Juan Banderas (1825–1833), who tried to unite the Native peoples of Sonora, and to recurring wars. From 1875 the Yaqui leader Cajeme governed the valley as a self-ruling nation until the federal army broke it in 1886–1887. Tetabiate’s guerrillas fought on in the Bacatete mountains; after the massacre at Mazocoba in 1900, Porfirio Díaz’s government deported thousands of Yaqui to the henequen plantations of Yucatán and other parts of the south, where many died. Yaqui soldiers fought in the Mexican Revolution, and the last Yaqui rising was put down in 1926–1927 with aircraft. In 1937 President Lázaro Cárdenas recognised a reduced Yaqui territory, and in 2021 the Mexican government apologised to the Yaqui people."
countries: [mx]
