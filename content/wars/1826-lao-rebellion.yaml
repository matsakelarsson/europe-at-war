id: lao-rebellion
name: Lao rebellion (Anouvong’s war)
start: "1826-12"
end: "1828-12"
tier: B
summary: "A war between King Anouvong of Vientiane and Siam, to which Vientiane and Champasak had been tributary since 1779. Angered by Siamese demands on the Lao of the Khorat plateau, and believing that Siam was about to be attacked by Britain, Anouvong sent his armies across the Mekong in the winter of 1826–1827. They took Nakhon Ratchasima and came within three days’ march of Bangkok, and began to move the Lao population of the plateau back across the river. Siam struck back with three armies: the Lao were beaten at Nong Bua Lamphu in May 1827, the Siamese took Vientiane, and Anouvong fled to Vietnam. When he returned with a small force in August 1828, the Siamese came back, razed Vientiane and carried off its people. Anouvong was handed over to them by the ruler of Muang Phuan and died a prisoner in Bangkok. The kingdom of Vientiane was abolished, and in the following decades well over 100,000 Lao were moved from the left bank of the Mekong to the Khorat plateau and central Siam."
countries: [la, th, vn]
