notes:
  - Thai chronicles call the war the rebellion of Chao Anu (Kabot Chao Anu); Lao histories treat it as a war of independence from Siam. Both traditions are coloured by later national history, and the numbers of soldiers, dead and deported people in them are uncertain.
  - The Thai year then began in April, so events of early 1827 are dated 1826 (2369 in the Buddhist Era) in Thai sources. The dates here are the Gregorian equivalents given in the English sources cited.
  - Anouvong is also called Chao Anou or Anu. Nakhon Ratchasima is also called Khorat.
