  - title: The destruction of Vientiane
    date: August 1828 – 1829
    when: "1828-08"
    borders: "1828-12-01"
    countries: [la, th, vn]
    body:
      - In August 1828 Anouvong came back to Vientiane with Ratsavong Ngau and about 1,000 followers, escorted by some 80–100 Vietnamese officials; on 1 August they re-entered the city and, by Siamese accounts, killed the Siamese soldiers stationed there. Bodindecha arrived opposite the city with 3,000 men the next day. Anouvong fled again, and Ratsavong Ngau was wounded in a fight at Bok Wan near Nong Khai in October. Rama III now ordered the destruction of Vientiane. The city was burned and razed, and its people were taken across the river; of its temples only Wat Si Saket, built by Anouvong in 1819–1824, is said to have survived largely intact. The Phra Bang image was carried off to Bangkok.
      - Anouvong made for Muang Phuan (Xieng Khouang), whose ruler Chao Noi handed him over to the Siamese, by some accounts after betraying him. He was taken to Bangkok with members of his family, kept in an iron cage and exhibited, and died there soon afterwards; sources give 1828 or 1829. The kingdom of Vientiane ceased to exist. Minh Mạng, who regarded Muang Phuan as Vietnam’s tributary, summoned Chao Noi to Huế in 1831 and had him executed, and in 1832 annexed his principality as the prefecture of Trấn Ninh.
      - Over the next three decades Siam moved at least 100,000 people from the left bank of the Mekong to the right, and the number of Siamese-administered towns (mueang) on the Khorat plateau rose from 33 in 1826 to 54 in 1840. The forced migrations are a main reason why far more ethnic Lao live in north-eastern Thailand today than in Laos. Rivalry over the Lao lands and Cambodia led to war between Siam and Vietnam in 1833.
    facts:
      - [Anouvong back in Vientiane, "1 August 1828"]
      - [Bok Wan, "18 October 1828"]
      - [Vientiane razed, "late 1828"]
      - [People moved from the left bank, "at least 100,000 over three decades"]
