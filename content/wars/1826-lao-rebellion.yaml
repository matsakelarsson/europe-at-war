steps:
  - title: Anouvong crosses the Mekong
    date: December 1826 – March 1827
    when: "1827-01"
    borders: "1827-01-15"
    countries: [la, th]
    body:
      - Anouvong had grown up at the Siamese court as a hostage after Siam took Vientiane in 1779 and carried off the Emerald Buddha, and he had fought in Siam’s wars against Burma before Bangkok made him king of Vientiane in 1805. His son Nyo had ruled Champasak since 1819. By the 1820s the Lao had many grievances. Siam was tattooing men on the Khorat plateau to register them for labour and military service, and Anouvong was humiliated at the funeral of King Rama II in Bangkok in 1825. The First Anglo-Burmese War and the arrival of a British envoy in Bangkok persuaded him that Siam might soon face a British attack.
      - In December 1826 a Lao force under his son Prince Tissa took Kalasin, and in January 1827 three armies crossed the Mekong. Anouvong took Nakhon Ratchasima without a fight while its governor was away, his son Ratsavong Ngau pushed on as far as Saraburi, three days’ march from Bangkok, and Chao Nyo led the army of Champasak against Ubon. The aim, as far as it can be read from the sources, was to bring the Lao families of the plateau back to the left bank of the Mekong; Lao armies were never more than about 25,000 men.
      - The best-known episode of the war is told in Thai sources. Families taken from Nakhon Ratchasima were being marched north when, in March 1827, they turned on their Lao guards at Thung Samrit near Phimai and escaped. Thai tradition credits the rising to Lady Mo (Khunying Mo), wife of the deputy governor, who is said to have armed the captives; Rama III gave her the title Thao Suranari. Accounts of what she did vary, and historians have pointed out that the story was much embellished in the 1930s, when her statue was raised in Nakhon Ratchasima and she became a symbol of Thai nationalism; Lao chronicles tell the fight differently.
    facts:
      - [Kalasin taken, "December 1826"]
      - [Nakhon Ratchasima taken, "mid-January 1827"]
      - [Lao armies, "at most about 25,000 men"]
      - [Thung Samrit, "March 1827"]
