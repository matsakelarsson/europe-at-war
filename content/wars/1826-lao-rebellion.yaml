  - title: Nong Bua Lamphu and the fall of Vientiane
    date: March – May 1827
    when: "1827-05"
    borders: "1827-05-26"
    countries: [la, th, vn]
    body:
      - Rama III raised three armies. The main one, under the Front Palace (the viceroy, Maha Sakdi Polsep), marched by Saraburi and Khorat towards Vientiane; a second, under Prince Surinthontherak with Phraya Ratchasuphawadi (later Chaophraya Bodindecha), came by Prachinburi and the passes into the plateau; a third went north to Lom Sak to cut off the Lao vanguard. Anouvong fell back across the plateau, taking thousands of families with him.
      - The Lao made their stand at Nong Bua Lamphu, a fort on the road to Vientiane held by Phaya Narin with about 2,300 men. The Siamese arrived on 3 May 1827 and stormed it on 6 May; Phaya Narin was captured and executed. Other Siamese columns beat Ratsavong Ngau near Loei and took the Khao San pass. Anouvong abandoned his capital, and the Siamese occupied Vientiane on 26 May. They sacked the city and levelled its walls, but left most of its monasteries standing.
      - Anouvong escaped over the mountains into Vietnam, where the governor of Nghệ An received him at the end of May. In the south Bodindecha took Champasak; Chao Nyo fled into the hills, was caught by villagers and sent to Bangkok. Siam put Bodindecha in charge of Vientiane, Champasak and the Khorat plateau, and began moving people from the left bank of the Mekong to the right.
    facts:
      - [Battle of Nong Bua Lamphu, "3–6 May 1827, Siamese victory"]
      - [Vientiane occupied, "26 May 1827"]
      - [Anouvong in Vietnam, "end of May 1827"]
