  - title: Erivan and the Treaty of Turkmenchay
    date: 1827–1828
    when: "1827"
    borders: "1828-02-22"
    countries: [am, az, tr, ir, ru]
    body:
      - Paskevich replaced Yermolov in 1827 and carried the war south. He took Echmiadzin in April and Nakhchivan in June, and in July the fortress of Abbasabad on the Aras surrendered after he beat a Persian relief army. In August Abbas Mirza besieged Echmiadzin, and General Afanasy Krasovsky’s column broke through to it at Oshakan, with heavy losses. Erivan’s citadel surrendered on 13 October 1827 after a short siege and bombardment, and late that month Russian troops entered Tabriz, the chief city of Persian Azerbaijan, without a fight.
      - With Russian forces able to advance on Tehran, Persia made peace. The Treaty of Turkmenchay, signed in a village between Tabriz and Tehran on 22 February 1828, gave Russia the khanates of Erivan and Nakhchivan and set the border on the Aras. Persia paid 20 million silver roubles, confirmed Russia’s sole right to warships on the Caspian and granted Russian subjects legal privileges. Tens of thousands of Armenians moved from Persia into the new Russian lands, while many Muslims left them. In 1829 a mob in Tehran killed the Russian envoy, the playwright Alexander Griboyedov, and most of his mission.
    facts:
      - [Capture of Erivan, "13 October 1827"]
      - [Treaty of Turkmenchay, "22 February 1828"]
      - [Indemnity, "20 million silver roubles"]
