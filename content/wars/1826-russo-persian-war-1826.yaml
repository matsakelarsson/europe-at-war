        text: Krasovsky’s outnumbered column fought its way through Abbas Mirza’s army to relieve the monastery of Echmiadzin, at a heavy cost in lives.
        lonlat: [44.315, 40.263]
        lp: l
      - kind: taken
        side: ru
        name: Erivan
