id: russo-persian-war-1826
name: Russo-Persian War of 1826–1828
start: "1826-07"
end: "1828-02-22"
tier: B
summary: The last war between the Russian Empire and Qajar Persia, begun by Persia to win back the lands it had lost in 1813. After early Persian successes, Russian victories at Ganja and the capture of Erivan and Tabriz led to the Treaty of Turkmenchay in 1828, by which Persia gave up the khanates of Erivan and Nakhchivan and accepted the Aras as its border.
countries: [az, am, tr, ir, ru]
sides:
  - id: ru
    name: Russian Empire
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
  - id: ir
    name: Qajar Persia
    polities: [persia]
    ink: orange
    moves: Persian moves
    success: Persian success
notes:
  - Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so the Battle of Ganja is 13 September 1826 and the fall of Erivan 1 October 1827 in Russian sources. The Treaty of Turkmenchay is usually dated 22 February 1828 (10 February Old Style); some sources give 21 February.
  - Ganja, then called Yelizavetpol by the Russians, and Erivan, today’s Yerevan, are given their usual names of the time in the text.
