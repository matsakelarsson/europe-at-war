steps:
  - title: Abbas Mirza’s attack and Ganja
    date: July – September 1826
    when: "1826-07"
    borders: "1826-09-25"
    countries: [az, am, ru]
    body:
      - Persia had never accepted the loss of the khanates in 1813, and the border was vague in places. When Russian troops occupied the north shore of Lake Sevan in 1825, the clergy and the exiled khans at the shah’s court called for holy war. News of Alexander I’s death and of the Decembrist revolt suggested that Russia was weak. In July 1826 the crown prince, Abbas Mirza, crossed the Aras with a large army. Much of the Muslim population of Karabakh, Ganja, Shirvan, Sheki and Talysh rose against Russian rule, and the Persians took Lankaran.
      - Yermolov, short of troops, pulled many of his garrisons back towards Tiflis. In Karabakh only the fortress of Shusha held out, for seven weeks, under Colonel Iosif Reut with the help of local Armenians. Reinforcements arrived from Russia, and in September General Valerian Madatov beat a Persian force at Shamkir and retook Ganja. On 25 September General Ivan Paskevich, with about 10,000 men, defeated Abbas Mirza’s main army of some 30,000 outside Ganja. The Persians lifted the siege of Shusha and fell back across the Aras.
    facts:
      - [Persian invasion, "July 1826"]
      - [Siege of Shusha, "about seven weeks, Russian garrison held out"]
      - [Battle of Ganja, "25 September 1826, Russian victory"]
