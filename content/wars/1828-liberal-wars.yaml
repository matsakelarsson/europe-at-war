id: liberal-wars
name: Liberal Wars
start: "1828-05-16"
end: "1834-05-26"
tier: B
summary: A civil war in Portugal between the liberal constitutionalists of Pedro IV and his daughter Maria II and the absolutists of Pedro’s brother Miguel, who had made himself king in 1828. Pedro’s small army, landed near Porto in 1832, survived a year-long siege, took Lisbon in 1833 and forced Miguel to give up the throne at Evoramonte in May 1834.
countries: [pt, es]
sides:
  - id: lib
    name: Liberals (Pedro IV and Maria II)
    ink: blue
    moves: Liberal moves
    success: Liberal success
  - id: mig
    name: Miguelists
    polities: [miguelists]
    ink: brown
    moves: Miguelist moves
    success: Miguelist success
notes:
  - Also called the Portuguese Civil War or the War of the Two Brothers. Many foreign volunteers and mercenaries, British, French and Belgian among them, fought for the Liberals, and their fleet was commanded by British officers, George Sartorius and then Charles Napier.
  - The base map shows Portugal unchanged throughout; who held what is told in the steps. Some sources date the start of the war to the Porto rising of 16 May 1828, others to 18 May.
