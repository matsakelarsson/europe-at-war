  - title: Lisbon, Asseiceira and Evoramonte
    date: June 1833 – May 1834
    when: "1833-06-21"
    borders: "1834-05-26"
    countries: [pt, es]
    body:
      - To break the deadlock the Liberals sent a force under the Duke of Terceira by sea to the Algarve in June 1833. On 5 July Charles Napier’s small squadron captured most of the Miguelist fleet off Cape St Vincent, and Terceira marched north through the Alentejo, defeated a Miguelist force across the Tagus from the capital on 23 July and entered Lisbon the next day. Pedro moved his government there, and Miguelist attacks on Lisbon and Porto failed that summer and autumn. Miguel’s army still held much of the interior, with Santarém as his base, and guerrilla bands remained strong in the countryside.
      - In 1833 the death of Ferdinand VII turned Spain against Miguel, who had sheltered the Spanish pretender Don Carlos. In April 1834 Britain, France, Spain and Portugal formed the Quadruple Alliance, and Spanish troops entered Portugal. On 16 May the Duke of Terceira beat the Miguelist army at Asseiceira near Tomar, and on 26 May, at Evoramonte, Miguel accepted a pension and exile in return for giving up his claim. Pedro restored the Charter and dissolved the religious orders, but died in September 1834, and Maria II, aged 15, began her personal rule.
    facts:
      - [Battle of Cape St Vincent, "5 July 1833, Liberal victory"]
      - [Liberals enter Lisbon, "24 July 1833"]
      - [Concession of Evoramonte, "26 May 1834"]
