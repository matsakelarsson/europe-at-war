steps:
  - title: Miguel’s usurpation and the siege of Porto
    date: 1828 – 1833
    when: "1828-05-16"
    borders: "1833-06-01"
    countries: [pt]
    body:
      - When King John VI died in 1826, his elder son Pedro, Emperor of Brazil, granted Portugal a Constitutional Charter and abdicated in favour of his seven-year-old daughter Maria, who was to marry his younger brother Miguel. Miguel returned from exile in February 1828 as regent and swore to uphold the Charter, but his supporters, backed by most of the nobility and the Church, acclaimed him absolute king, and a traditional Cortes of the three estates confirmed him that summer. A liberal rising in Porto in May 1828 collapsed, and thousands of liberals were imprisoned or fled abroad.
      - Only the island of Terceira in the Azores held out for Maria, and in 1829 its defenders beat off a Miguelist landing at Praia. In 1831 Pedro abdicated the Brazilian throne, raised money and volunteers in Britain and France and gathered a small army in the Azores. On 8 July 1832 about 7,500 men landed at Mindelo, north of Porto, and occupied the city, which Miguel’s troops had abandoned. They were soon besieged by a much larger Miguelist army. For a year Porto was shelled and starved, and cholera broke out in 1833, but the defenders held their lines.
    facts:
      - [Liberal landing at Mindelo, "8 July 1832"]
      - [Siege of Porto, "July 1832 – August 1833"]
      - [Leaders, "Pedro IV (Dom Pedro); Miguel I"]
