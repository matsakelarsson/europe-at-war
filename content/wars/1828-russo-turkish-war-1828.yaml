  - title: Over the Balkans to Adrianople
    date: 1829
    when: "1829-05"
    borders: "1829-09-14"
    countries: [bg, tr, ro, ge, ru]
    body:
      - In 1829 General Hans Karl von Diebitsch replaced Wittgenstein and laid siege to Silistra. On 11 June he defeated the grand vizier, Reshid Mehmed Pasha, at Kulevcha as the Ottoman army marched out of Shumla, and Silistra surrendered at the end of the month. In July Diebitsch led about 35,000 men across the Balkan mountains, bypassing Shumla, took Burgas and the coastal towns with the help of the fleet, and on 20 August entered Adrianople, the second city of the empire, without a fight. His army was dwindling from disease, but the Ottomans did not know how weak it was.
      - In the east Paskevich beat the Ottoman army in the Saganlug mountains and entered Erzurum on 9 July. By the Treaty of Adrianople, signed on 14 September 1829, Russia returned Kars, Erzurum and its other conquests in Anatolia and Europe, but gained the mouths of the Danube, Akhaltsikhe and Akhalkalaki, and the Black Sea coast from the Kuban to Adjara. Moldavia and Wallachia became self-governing under Russian protection, and Russian troops stayed there until 1834. The sultan accepted the powers’ settlement for Greece, which became independent in 1830, and confirmed Serbia’s self-rule. Some 90,000 Armenians moved from Ottoman to Russian territory.
    facts:
      - [Battle of Kulevcha, "11 June 1829, Russian victory"]
      - [Adrianople entered, "20 August 1829"]
      - [Treaty of Adrianople, "14 September 1829"]
    markers:
      - kind: battle
        side: ru
        name: Battle of Kulevcha
        date: 11 June 1829
        text: Diebitsch caught the grand vizier’s army in the hills east of Shumla and routed it.
        lonlat: [27.116, 43.257]
      - kind: taken
        side: ru
        name: Silistra
        date: late June 1829
        text: The fortress surrendered after a six-week siege, freeing Diebitsch to march south.
        lonlat: [27.261, 44.117]
      - kind: taken
        side: ru
        name: Burgas
        date: July 1829
        text: Taken with the coastal towns of Mesembria (Nesebar) and Ahioli, which gave the army a port for supplies by sea.
        lonlat: [27.47, 42.503]
      - kind: treaty
        name: Treaty of Adrianople
        date: 14 September 1829
        text: Signed in the old Ottoman capital, which Diebitsch had entered on 20 August. He was given the honorary surname Zabalkansky, “beyond the Balkans”.
        lonlat: [26.556, 41.677]
      - kind: taken
        side: ru
        name: Erzurum
        date: 9 July 1829
        text: The chief city of eastern Anatolia surrendered to Paskevich. It was handed back under the peace.
        lonlat: [41.277, 39.909]
