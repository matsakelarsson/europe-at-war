id: russo-turkish-war-1828
name: Russo-Turkish War of 1828–1829
start: "1828-04-26"
end: "1829-09-14"
tier: B
summary: A war between the Russian Empire and the Ottoman Empire that grew out of the Greek War of Independence. After the capture of Varna and Akhaltsikhe in 1828, Diebitsch’s march over the Balkan mountains to Adrianople in 1829 forced the Ottomans to make peace, giving Russia the mouths of the Danube, the eastern Black Sea coast and Akhaltsikhe, and opening the way to Greek independence.
