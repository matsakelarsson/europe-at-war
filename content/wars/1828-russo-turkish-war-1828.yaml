steps:
  - title: Varna and Akhaltsikhe
    date: 1828
    when: "1828-04-26"
    borders: "1828-10-11"
    countries: [ro, bg, tr, ge, ru]
    body:
      - At Navarino in October 1827 British, French and Russian squadrons destroyed the Ottoman and Egyptian fleet that was fighting the Greek rising. Sultan Mahmud II answered by repudiating his recent agreements with Russia and closing the Bosporus to Russian ships, and on 26 April 1828 Russia declared war. The Ottomans had abolished the Janissaries only two years before, and their new army was still being formed. Field Marshal Peter Wittgenstein’s army occupied Moldavia and Wallachia, and in June, with Nicholas I present, it crossed the Danube into Dobruja.
      - Brăila surrendered in June, but Shumla was too strong to take and Silistra held out. Varna, besieged from the land and from the sea by Admiral Aleksey Greig’s Black Sea Fleet, surrendered on 11 October. Disease and hunger killed many Russian soldiers, and the army fell back for the winter. In the Caucasus General Ivan Paskevich, with fewer than 20,000 men, took Kars in July and Akhalkalaki, then defeated a relief army and stormed Akhaltsikhe in late August. The burning town was taken street by street. Anapa and Poti on the Black Sea coast also fell.
    facts:
      - [War declared, "26 April 1828"]
      - [Varna surrenders, "11 October 1828"]
      - [Akhaltsikhe stormed, "late August 1828"]
