    name: Russian Empire
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
  - id: tr
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so the fall of Varna is 29 September 1828 and the Treaty of Adrianople 2 September 1829 in Russian sources.
  - Adrianople is today’s Edirne, and Shumla is Shumen in Bulgaria.
