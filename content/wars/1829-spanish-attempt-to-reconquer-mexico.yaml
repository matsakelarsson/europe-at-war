id: spanish-attempt-to-reconquer-mexico
name: Spanish attempt to reconquer Mexico
start: "1829-07-26"
end: "1829-09-11"
tier: C
summary: "The expedition with which Ferdinand VII of Spain tried to win back Mexico in 1829, eight years after its independence. Spain had never recognised the Treaty of Córdoba, held the fortress of San Juan de Ulúa off Veracruz until 1825 and kept an army in Cuba; Mexico had expelled many Spanish-born residents in 1827–1829, and Spanish planners hoped that loyalists would rise. Brigadier Isidro Barradas sailed from Havana with about 3,500 soldiers, landed at Cabo Rojo on the Gulf coast at the end of July 1829 and occupied Tampico, but no one rose to join him. Antonio López de Santa Anna, governor of Veracruz, came by sea and land with troops from Veracruz, and Manuel Mier y Terán with forces from the north, and they besieged the Spaniards while yellow fever and dysentery spread through the invading army. After an assault on the fort of La Barra on 10 September, Barradas capitulated on 11 September 1829 at Pueblo Viejo, across the Pánuco River from Tampico, and his troops were shipped back to Cuba. Fever and fighting cost the expedition hundreds of dead. The victory made Santa Anna a national hero, the “hero of Tampico”, and helped bring him to the presidency in 1833. Spain recognised Mexico’s independence in the Santa María–Calatrava Treaty of 28 December 1836."
