id: belgian-revolution
name: Belgian Revolution
start: "1830-08-25"
end: "1832-12-23"
tier: B
summary: The rising of the southern provinces of the United Kingdom of the Netherlands that created the Kingdom of Belgium. Street fighting drove the Dutch army out of Brussels in September 1830 and a provisional government declared independence; a Dutch invasion in August 1831 was halted by a French army, which also took the citadel of Antwerp in December 1832, and the Netherlands recognised Belgium by the Treaty of London of 1839.
