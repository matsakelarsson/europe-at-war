steps:
  - title: The September Days and independence
    date: August – December 1830
    when: "1830-08-25"
    borders: "1830-12-20"
    countries: [be, nl, lu]
    body:
      - The south of the United Kingdom of the Netherlands had more people than the north but no more seats in the States General, most officials and officers were Dutch, Catholics resented King William I’s control of schools, and French-speakers his promotion of Dutch. Catholics and liberals made common cause against him. Weeks after the July Revolution in Paris, on 25 August 1830, the audience at Brussels’ opera house, the Monnaie, poured into the streets after a performance of Auber’s La Muette de Portici, and rioting spread to Liège and other towns.
      - The king’s heir, the Prince of Orange, came to Brussels and accepted that north and south should be governed separately, but his father chose force. From 23 to 26 September several thousand troops under his younger son, Prince Frederick, held the park in the city centre against volunteers firing from barricades and houses, then withdrew. Several hundred insurgents were killed; they lie under today’s Place des Martyrs. A provisional government declared independence on 4 October.
      - The Dutch army fell back to the citadel of Antwerp and the fortress of Maastricht. On 27 October, as Belgian volunteers entered Antwerp, General David Chassé’s guns in the citadel bombarded the city, setting warehouses and houses on fire. A National Congress, elected in November, declared Belgium independent and barred the House of Orange from its throne, and on 20 December a conference of the great powers in London accepted that the United Kingdom of the Netherlands was dissolved.
    facts:
      - [Riot at the Monnaie, "25 August 1830"]
      - [Fighting in Brussels, "23–26 September 1830, Dutch withdrawal"]
      - [Independence declared, "4 October 1830, by the provisional government"]
    markers:
      - kind: battle
        side: be
        name: Brussels Park
        date: 23–26 September 1830
        text: Prince Frederick’s troops broke into the city and held the park beside the royal palace for four days under fire, then withdrew in the night of 26–27 September.
        lonlat: [4.364, 50.844]
      - kind: held
        side: nl
        name: Antwerp citadel
        date: 27 October 1830
        text: Chassé’s garrison shelled the city when Belgian volunteers entered it, burning warehouses and houses. The citadel stayed in Dutch hands for two more years.
        lonlat: [4.393, 51.208]
      - kind: held
        side: nl
        name: Maastricht
        date: 1830–1839
        text: The Dutch garrison under General Bernard Dibbets held the fortress throughout the revolution, which is why the Netherlands kept eastern Limburg.
        lonlat: [5.691, 50.851]
