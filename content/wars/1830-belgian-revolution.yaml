        side: nl
        name: Lillo
        date: 1832–1839
        text: The Dutch kept the forts of Lillo and Liefkenshoek, which controlled the Scheldt below Antwerp, until the treaty of 1839.
        lonlat: [4.29, 51.303]
        lp: l
