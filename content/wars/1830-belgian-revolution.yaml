notes:
  - The United Kingdom of the Netherlands, created in 1815, joined the former Dutch Republic with the former Austrian Netherlands and the Prince-Bishopric of Liège. Its king, William I of Orange-Nassau, was also Grand Duke of Luxembourg. Its army and government are called “Dutch” here, as in most accounts.
  - The fighting ended in 1832, but the Netherlands accepted Belgian independence only by the Treaty of London of 19 April 1839, which also divided Limburg and Luxembourg. Until then Belgium held most of both.
