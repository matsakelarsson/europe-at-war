  - title: The Ten Days’ Campaign and the siege of Antwerp
    date: August 1831 – December 1832
    when: "1831-08-02"
    borders: "1832-12-23"
    countries: [be, nl, fr]
    body:
      - The National Congress chose Leopold of Saxe-Coburg as king, and he took the oath on 21 July 1831, now Belgium’s national day. William I had not accepted the terms set in London, and on 2 August a Dutch army of about 50,000 under the Prince of Orange crossed the border near Poppel. The Belgians had about 24,000 regulars and militia, split between an Army of the Scheldt around Antwerp and an Army of the Meuse in Limburg. The Dutch beat them at Turnhout, at Houthalen and Hasselt, and on 12 August before Leuven.
      - Leopold had appealed to France, and on 9 August Marshal Étienne Gérard crossed the border with about 70,000 men. Rather than fight the French, the Dutch agreed to a ceasefire on 12 August and withdrew, keeping only the citadel of Antwerp. The powers then offered terms less favourable to Belgium, the Twenty-Four Articles, which Belgium accepted and William refused. In November 1832 British and French warships blockaded the Dutch coast and Gérard returned to besiege the citadel. His engineers under General François Haxo dug their trenches up to the walls and pounded the fort with heavy mortars until Chassé surrendered on 23 December.
      - The Dutch still held the forts of Lillo and Liefkenshoek on the Scheldt below Antwerp, and an agreement in May 1833 left matters as they stood. In 1838 William at last accepted the Twenty-Four Articles. By the Treaty of London of 19 April 1839 the Netherlands recognised Belgium, whose independence and perpetual neutrality the great powers guaranteed, the guarantee Germany broke in 1914. Belgium gave up eastern Limburg, with Maastricht and Venlo, to the Netherlands, and the eastern, German-speaking part of Luxembourg, which remained a grand duchy under the Dutch king.
    facts:
      - [Ten Days’ Campaign, "2–12 August 1831, Dutch victories"]
      - [Siege of the Antwerp citadel, "15 November – 23 December 1832, French victory"]
      - [Treaty of London, "19 April 1839"]
    markers:
      - kind: battle
        side: nl
        name: Turnhout
        date: 3 August 1831
        text: The Prince of Orange’s main force routed the Belgian troops defending the town, many of whose people had already fled towards Antwerp.
        lonlat: [4.949, 51.323]
      - kind: battle
        side: nl
        name: Hasselt
        date: 8 August 1831
        text: The Dutch routed General Nicolas Daine’s Army of the Meuse, which had already been beaten at Houthalen, and it fell apart.
        lonlat: [5.333, 50.917]
      - kind: battle
        side: nl
        name: Leuven
        date: 12 August 1831
        text: Leopold’s troops were beaten outside the town, where he had his headquarters, as the ceasefire was being arranged; the Dutch occupied it briefly and then withdrew.
        lonlat: [4.7, 50.879]
      - kind: siege
        side: fr
        name: Antwerp citadel
        date: 15 November – 23 December 1832
        text: The French Army of the North took the citadel after 24 days of siege and handed it to Belgium. Chassé and his garrison became prisoners of war.
        lonlat: [4.393, 51.208]
        lp: l
