        via: [[-1.6, 34.8], [-1.75, 34.73], [-1.9, 34.69]]
  - title: The oases and the mountains
    date: 1848–1857
    when: "1849-07"
    borders: "1857-07-11"
    countries: [dz]
    body:
      - The constitution of the Second Republic declared Algeria part of France in 1848, and its settled north was divided into three départements, Algiers, Oran and Constantine, while the army governed the rest. Resistance moved to the oases of the south and the mountains. At the palm oasis of Zaatcha, near Biskra, Sheikh Bouziane held out from July 1849 against General Herbillon’s columns, which also lost many men to cholera; on 26 November 1849 the oasis was stormed, its defenders and many of its inhabitants were killed, and the heads of Bouziane and his son were displayed in the French camp.
      - In the high plateaus the sharif Muhammad ibn Abdallah, a former French ally, raised the south, and Laghouat became his stronghold. General Pélissier besieged the town from 21 November 1852 and stormed it on 4 December. By several accounts about two-thirds of the inhabitants still in the town, some 2,500 to 3,000 people, were killed in the assault and the days that followed. Touggourt was taken in 1854.
      - Great Kabylia, the mountains east of Algiers, had kept its independence under its own village councils and confederations. There Lalla Fatma N’Soumer, a woman of a marabout family, led resistance in the 1850s alongside the sharif Bou Baghla. In 1857 Marshal Randon invaded with about 35,000 men. The Kabyles fought hard at Icheriden on 24 June, but the French built Fort Napoléon on the heights of the Aït Iraten, and on 11 July Lalla Fatma was captured; she died in detention in 1863. The confederations submitted one by one.
    facts:
      - [Algeria declared French territory, "1848"]
      - [Zaatcha stormed, "26 November 1849"]
      - [Laghouat stormed, "4 December 1852"]
      - [Conquest of Great Kabylia, "May – July 1857"]
