steps:
  - title: The fly-whisk and the fall of Algiers
    date: April 1827 – 1834
    when: "1830-06-14"
    borders: "1830-07-05"
    countries: [dz, fr]
    body:
      - For three centuries the Regency of Algiers had been ruled by deys and beys who acknowledged the Ottoman sultan but governed for themselves, with a janissary garrison, a corsair fleet and three provincial beyliks at Oran, Médéa (Titteri) and Constantine. A long quarrel over debts set off the war. France owed the Algiers merchants Bacri and Busnach for grain supplied in the 1790s, and Dey Hussein, who had claims on the sums, pressed for payment. At an audience on 29 April 1827 he struck the French consul, Pierre Deval, with his fly-whisk. France answered with a blockade of Algiers that lasted three years and hurt French trade more than the dey, and in 1829 the batteries of Algiers fired on a French ship carrying an envoy. The government of Charles X, deeply unpopular at home, decided on an expedition.
      - A fleet of about 100 warships and some 460 transports under Admiral Duperré carried about 34,000 soldiers under General de Bourmont from Toulon. They landed against little resistance in the bay of Sidi Ferruch (Sidi Fredj), 25 km west of Algiers, on 14 June 1830. On 19 June they defeated the dey’s army at Staouéli, where janissaries, the contingents of the beys of Constantine and Titteri and Kabyle levies had gathered; after the French guns breached the Fort l’Empereur above the city, the dey capitulated on 5 July. The convention promised to respect the property, women and religion of the inhabitants. Hussein left for Naples, the janissaries were shipped to Anatolia, and the French seized the treasury of the Casbah; 43 million francs in gold and silver were shipped to France, and large sums went into officers’ private pockets.
      - Three weeks later Charles X was overthrown, and the new government of Louis-Philippe hesitated over what to do with Algiers but kept it. French troops took Oran in January 1831, Bône (Annaba) in 1832 and Bougie (Béjaïa) and Mostaganem in 1833, while expeditions inland to Médéa failed to hold the country. The promises of 1830 were soon broken. Religious foundations and houses were seized, and the Ketchaoua mosque became a cathedral. In April 1832 troops sent by the commander, the Duke of Rovigo, massacred the El Ouffia tribe near Algiers; a parliamentary commission in 1833 admitted this and other killings, including of men who had come under safe conduct. In July 1834 France made the “French possessions in North Africa” a colony under a governor-general.
    facts:
      - [The fly-whisk incident, "29 April 1827"]
      - [Landing at Sidi Ferruch, "14 June 1830, about 34,000 men"]
      - [Capitulation of Algiers, "5 July 1830"]
      - [Governor-general appointed, "July 1834"]
