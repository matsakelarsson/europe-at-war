  - title: Bou Amama and the Sahara
    date: 1881–1903
    when: "1881-04"
    borders: "1902-05-07"
    countries: [dz, ma]
    body:
      - In April 1881 Bou Amama, a Sufi sheikh of the Ouled Sidi Cheikh with his zawiya at Moghrar in the mountains of the south-west, raised the tribes of the south Oranais, a revolt that grew out of the long resistance of the Ouled Sidi Cheikh. On 11 June his followers attacked the camps of Spanish esparto harvesters near Khalfallah, south of Saïda, and killed about 190 of them. French columns drove him west, but he kept a following from bases on the Moroccan side of the border until his death in 1908. In the same year, on 16 February 1881, Kel Ahaggar and Kel Ajjer Tuareg destroyed the expedition of Colonel Paul Flatters, about ninety men surveying a route for a trans-Saharan railway, at Bir el-Garama in the Hoggar.
      - At the end of 1899 a scientific mission with a military escort entered In Salah, the main town of the Tidikelt, and in 1900–1901 French columns occupied the oases of the Tidikelt, the Gourara around Timimoun and the Tuat around Adrar, which looked to the sultan of Morocco and had never been ruled from Algiers. The new posts were raided by the Kel Ahaggar, the Tuareg of the Hoggar mountains, who taxed the caravans and oases. On 7 May 1902 Lieutenant Gaston Cottenest, returning from a punitive march to Tamanrasset with about 130 men, most of them Chaamba camel riders, was attacked at Tit by about 300 Kel Ahaggar and defeated them; the Tuareg lost about 93 dead. Under Colonel François-Henry Laperrine, camel corps of Saharan recruits then took over the desert.
      - In August 1903 a large force from the Moroccan oases of Tafilalet attacked the French post at Taghit, on the edge of the Saoura, and in September a convoy was ambushed at El Moungar. France sent Hubert Lyautey to command at Aïn Sefra, and from there the conquest moved on into Morocco. The Algerian Sahara is usually counted as conquered by 1903, and the southern territories stayed under military government.
    facts:
      - [Bou Amama’s rising, "April 1881"]
      - [Flatters expedition destroyed, "16 February 1881"]
      - [In Salah occupied, "December 1899 – January 1900"]
      - [Battle of Tit, "7 May 1902"]
