id: french-conquest-of-algeria
name: French conquest of Algeria
start: "1830-06-14"
end: "1903"
tier: A
summary: "The seventy-year war in which France conquered Algeria. A quarrel over debts and the dey’s blow with a fly-whisk in 1827 led to a blockade and, in June 1830, to a landing at Sidi Ferruch; Algiers capitulated on 5 July and Ottoman rule ended. France held only a few coastal towns at first. In the west Abd al-Qadir, chosen emir in 1832, built a state that France recognised by the treaties of 1834 and 1837, and in the east Ahmed Bey held Constantine until it was stormed in 1837. From 1840 Marshal Bugeaud fought a war of destruction, with mobile columns burning crops and villages and seizing herds; Abd al-Qadir lost his capitals and his mobile camp, and after Morocco was defeated at Isly in 1844 he surrendered in 1847. The oases, the high plateaus and Kabylia (1857) followed, the great Mokrani revolt of 1871 was crushed and punished with land confiscations, and between 1881 and 1903 French columns took the oases of the Sahara and defeated the Tuareg of the Hoggar. Estimates of the Algerian dead between 1830 and the 1860s, from war, famine and disease, range from about 500,000 to a million, out of some three million people."
countries: [dz, fr, ma]
