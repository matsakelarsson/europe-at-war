  - title: The Mokrani revolt
    date: March 1871 – January 1872
    when: "1871-03-16"
    borders: "1871-07-13"
    countries: [dz, fr]
    body:
      - The last great rising of the north came after years of disaster. Drought, locusts, cholera and an earthquake struck Algeria in 1866–1868, and famine killed hundreds of thousands of people; estimates run from under 500,000 to more than 800,000. In 1870 France’s defeat by Prussia brought down Napoleon III, whose “Arab kingdom” policy had given the chiefs some protection; the new republic put Algeria under civilian rule, which meant the settlers, and the Crémieux decree of October 1870 made the Jews of Algeria French citizens but not the Muslims. Muhammad al-Muqrani (Mokrani), the bachagha of the Medjana, a great chief who had served France, lost his standing and his credit.
      - On 16 March 1871 Mokrani declared war and attacked Bordj Bou Arréridj. On 8 April the head of the Rahmaniyya brotherhood, Sheikh al-Haddad, proclaimed jihad through his son Aziz at the market of Seddouk, and the brotherhood carried the rising through Kabylia and the east. More than 250 tribes, about a third of the population, rose. Their fighters besieged Fort National, Tizi Ouzou and Dellys, took Palestro (Lakhdaria), where settlers were killed, and came within 30 km of Algiers before they were stopped at Alma on 22 April.
      - French reinforcements, freed by the peace with Germany, turned the tide. Mokrani was killed in battle on 5 May 1871 at Soufflat, al-Haddad gave himself up on 13 July, and the last leader, Mokrani’s brother Boumezrag, was captured in January 1872. The punishment was severe. The tribes that had risen paid a collective fine of 36 million francs, about 450,000 hectares of their land were confiscated and given to settlers, many of them refugees from Alsace-Lorraine, and the leaders were tried and deported, many to New Caledonia, where they joined the deported Communards.
    facts:
      - [Revolt begins, "16 March 1871"]
      - [Jihad proclaimed at Seddouk, "8 April 1871"]
      - [Mokrani killed, "5 May 1871"]
      - [Land confiscated, "about 450,000 hectares"]
