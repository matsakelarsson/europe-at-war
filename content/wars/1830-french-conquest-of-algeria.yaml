  - title: Abd al-Qadir’s emirate
    date: 1832–1837
    when: "1832-11"
    borders: "1837-05-30"
    countries: [dz]
    body:
      - With the beylik of Oran gone, the tribes of the west looked for a leader of their own. In November 1832 the tribes of the plain of Ghriss near Mascara swore allegiance as emir to Abd al-Qadir, the young son of Muhyi al-Din, a sheikh of the Qadiriyya order who had already led them against the French at Oran. He called for jihad, collected taxes in the name of Islam and imposed his authority on tribes and towns that resisted him. In February 1834 the French commander at Oran, General Desmichels, signed a treaty with him that in the Arabic text recognised him as ruler of the west outside the French towns.
      - The peace did not last. On 28 June 1835 Abd al-Qadir’s horsemen caught General Trézel’s column in the marshes of the Macta and killed about 500 of its men. Marshal Clauzel answered by burning Mascara, Abd al-Qadir’s capital, in December 1835 and occupying Tlemcen in January 1836, and on 6 July 1836 General Thomas-Robert Bugeaud defeated the emir on the Sikkak river, after which Abd al-Qadir avoided pitched battles. France, which wanted its hands free against Constantine, made peace again. By the Treaty of the Tafna, signed on 30 May 1837, Abd al-Qadir acknowledged French sovereignty over Algiers, the Mitidja, Oran, Arzew and Mostaganem and was left to govern the provinces of Oran and Titteri and much of Algiers, about two-thirds of the country.
      - Abd al-Qadir used the peace to build a state. He divided his lands into provinces under khalifas, raised a small regular army paid from taxes, and built a line of forts and arsenals on the edge of the high plateaus, at Sebdou south of Tlemcen, Saïda, Tagdemt, Taza and Boghar, out of reach of the coast; Tagdemt became his capital after the loss of Mascara. Some tribes, among them the Douair and Zmela who had served the beys, sided with France.
    facts:
      - [Abd al-Qadir proclaimed emir, "November 1832"]
      - [Desmichels treaty, "26 February 1834"]
      - [Battle of the Macta, "28 June 1835, about 500 French dead"]
      - [Treaty of the Tafna, "30 May 1837"]
