  - title: Isly, the caves of the Dahra and Abd al-Qadir’s surrender
    date: 1844 – December 1847
    when: "1844-08-14"
    borders: "1847-12-23"
    countries: [dz, ma]
    body:
      - Abd al-Qadir’s raids from Morocco and clashes on the undefined border drew Morocco into the war. On 14 August 1844 Bugeaud, with about 11,000 men, routed a much larger Moroccan army under the sultan’s son on the Isly river near Oujda, while the French navy bombarded Tangier and Mogador. By the Treaty of Tangier in September 1844 the sultan agreed to outlaw Abd al-Qadir.
      - In April 1845 a new leader, Muhammad ibn Abdallah, called Bou Maza (“the man with the goat”), raised the tribes of the Dahra and the Ouarsenis. In June 1845 the Ouled Riah, driven from their villages by Colonel Aimable Pélissier’s column, took refuge with their families and animals in caves of the Dahra near Nekmaria. When they refused to come out, Pélissier had fires lit at the entrances on 18–19 June; estimates of the dead, men, women and children, range from about 500 to more than 1,000. The news caused an outcry in Paris, but Bugeaud defended Pélissier, and other columns walled up or smoked out caves in the same years.
      - Abd al-Qadir returned in September 1845. Near the marabout of Sidi Brahim he destroyed the column of Lieutenant-Colonel de Montagnac, about 450 men, on 23–26 September, and for months he raided across western and central Algeria as far as Kabylia. But the tribes were exhausted, the Moroccan sultan turned his troops against him in 1847, and on 23 December 1847, cornered near the border, he surrendered to General Lamoricière at Sidi Brahim, on the promise that he could go to Alexandria or Acre. France broke the promise and held him in France until Louis-Napoléon Bonaparte, soon to be Napoleon III, freed him in October 1852. He settled in Damascus, where in 1860 he sheltered thousands of Christians during the riots, and died there in 1883.
    facts:
      - [Battle of Isly, "14 August 1844"]
      - [Caves of the Dahra, "18–19 June 1845, about 500 to more than 1,000 dead"]
      - [Battle of Sidi Brahim, "23–26 September 1845"]
      - [Abd al-Qadir surrenders, "23 December 1847"]
    markers:
      - kind: battle
        side: fr
        name: Isly
        date: 14 August 1844
        text: Bugeaud’s army broke the Moroccan cavalry and took its camp. The Franco-Moroccan War ended a month later.
        lonlat: [-1.93, 34.69]
        lp: b
      - kind: event
        side: fr
        name: Caves of the Dahra
        date: 18–19 June 1845
        text: Pélissier’s troops lit fires at the mouths of the caves where the Ouled Riah had taken refuge between Nekmaria and Achaacha. Nearly all inside died.
        lonlat: [0.6, 36.15]
      - kind: battle
        side: abd
        name: Sidi Brahim
        date: 23–26 September 1845
        text: Montagnac’s column was overwhelmed; about 80 chasseurs held out in the marabout for three days before breaking out, and few of them reached Nemours (Ghazaouet).
        lonlat: [-1.878, 35.01]
        lp: b
      - kind: treaty
        side: fr
        name: Surrender of Abd al-Qadir
        date: 23–24 December 1847
        text: Abd al-Qadir gave himself up to Lamoricière near Sidi Brahim and the next day formally to the Duke of Aumale at Nemours (Ghazaouet).
        lonlat: [-1.86, 35.094]
        lp: t
    arrows:
      - side: abd
        label: Abd al-Qadir, 1845–1846
        via: [[-1.75, 34.85], [-0.3, 35.0], [1.5, 35.4], [3.6, 36.1]]
