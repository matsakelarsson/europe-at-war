        polygon: [[-1.9, 35.05], [-1.35, 35.25], [-0.85, 35.45], [-0.25, 35.5], [0.2, 35.72], [0.9, 36.05], [1.6, 36.3], [2.3, 36.4], [2.8, 36.35], [3.4, 36.3], [3.9, 36.2], [4.3, 36.05], [4.3, 35.5], [3.5, 35.0], [2.5, 34.4], [1.0, 34.0], [-0.5, 33.7], [-1.7, 34.2], [-1.9, 35.05]]
  - title: Constantine
    date: November 1836 – October 1837
    when: "1836-11"
    borders: "1837-10-13"
    countries: [dz]
    body:
      - In the east, Ahmed Bey, the last Ottoman bey of Constantine, refused to submit to France and kept up the government of his beylik from its rock-girt capital above the gorge of the Rhumel, while appealing to the sultan in Istanbul for help. In November 1836 Marshal Clauzel marched on the city from Bône with about 8,700 men. Rain and snow slowed the column, its assaults on the gates failed, and it fell back to Bône with heavy losses; Clauzel was recalled.
      - A second, stronger expedition under General Damrémont left the French camps near Guelma in October 1837, with a siege train. The siege began on 6 October. Damrémont was killed by a cannonball on 12 October while inspecting the batteries, and the next day General Valée’s troops stormed the breach and took the city after street fighting. Ahmed Bey, who had been outside the walls, withdrew south to the Aurès and the edge of the Sahara, where he resisted for another decade; he surrendered in June 1848.
      - The fall of Constantine gave France the east, and the French began to govern it through local notables such as the shaykh al-arab of the Ziban and the Mokrani family of the Medjana. In October 1839 a French column under Valée and the Duke of Orléans marched from Constantine to Algiers through the Iron Gates, the gorge of the Bibans, crossing land that Abd al-Qadir regarded as his under the Treaty of the Tafna.
    facts:
      - [First expedition, "November 1836, repulsed"]
      - [Constantine stormed, "13 October 1837"]
      - [Ahmed Bey surrenders, "June 1848"]
    markers:
