  - title: Bugeaud’s war of destruction
    date: November 1839 – May 1843
    when: "1839-11"
    borders: "1843-05-16"
    countries: [dz]
    body:
      - Abd al-Qadir answered the march through the Iron Gates by declaring war in November 1839. His horsemen swept into the Mitidja plain behind Algiers, burning the new settler farms and killing settlers, and the French were thrown back on the coast. In February 1841 Bugeaud returned as governor-general with a new method. The army in Algeria grew to more than 100,000 men, about a third of the French army. Instead of heavy columns tied to roads and forts, light columns moved fast across the country in all seasons, and the razzia, the raid on a tribe’s food and wealth, became the main weapon. Troops burned harvests and villages, cut down orchards, seized herds and took women and children as hostages until tribes submitted.
      - In 1841 the French took and destroyed Abd al-Qadir’s fortified towns, Tagdemt in May, Mascara, Boghar, Taza and Saïda, and in 1842 they occupied Tlemcen. Many tribes that could not survive the loss of their crops and animals went over to France. Abd al-Qadir kept the war going from his smala, a moving capital of tents with his family, treasury, officials and the families of his followers, which by some accounts held tens of thousands of people.
      - On 16 May 1843 the Duke of Aumale, a son of the king, came upon the smala at the spring of Taguin on the high plateaus while Abd al-Qadir was away, and charged it with about 600 cavalry. Thousands of people were taken, along with the emir’s treasury and herds. Abd al-Qadir lost most of his remaining allies and in late 1843 crossed into Morocco, where he looked to the sultan for help.
    facts:
      - [War renewed, "November 1839"]
      - [Bugeaud governor-general, "February 1841"]
      - [French army in Algeria, "more than 100,000 men by the mid-1840s"]
      - [Capture of the smala, "16 May 1843"]
