notes:
  - "The French army called many of its campaigns “pacification”, and French writers long described the conquest as a civilising mission; Algerian historians speak of resistance (muqawama) and, for the worst episodes, of extermination. Whether the conquest amounted to genocide is debated: some historians, among them Ben Kiernan, and the Algerian state use the word, while others reject it or describe the killings as massacres and war crimes within a colonial war."
  - "Losses are uncertain. Estimates of the Algerian dead between 1830 and the 1860s, from fighting, massacres, famine and epidemics, range from about 500,000 to a million, out of a population of about three million. Most French soldiers who died were killed by disease: between 1831 and 1851 some 3,300 were killed in battle and more than 92,000 died in hospital."
  - "Names are given in the forms of English sources, with French colonial names where they were used at the time and today’s names in brackets: Bône (Annaba), Bougie (Béjaïa), Philippeville (Skikda), Palestro (Lakhdaria), Nemours (Ghazaouet), Fort Napoléon or Fort National (Larbaâ Nath Irathen). Abd al-Qadir is also written Abdelkader and Abd el-Kader."
  - The wars with Morocco in 1844 and the Moroccan side of the conquest of the Sahara are told in the Franco-Moroccan War and the French conquest of Morocco; the Algerian War of 1954–1962 has its own story.
