id: july-revolution
name: July Revolution
start: "1830-07-27"
end: "1830-07-29"
tier: C
summary: The rising in Paris that overthrew Charles X, the last Bourbon king of France. On 26 July 1830 the government of Jules de Polignac published the July Ordinances, which suspended the freedom of the press, dissolved the newly elected Chamber of Deputies, in which the liberal opposition had won a large majority, and narrowed the franchise. On the “Three Glorious Days” of 27–29 July, printers, workers, students and former soldiers fought Marshal Auguste Marmont’s troops from barricades; as some line regiments went over to the crowd, the insurgents took the Hôtel de Ville, the Louvre and the Tuileries, and the royal forces left the city. Several hundred insurgents and soldiers were killed. Charles X abdicated on 2 August and went into exile in Britain. The liberal deputies passed over his grandson and on 9 August made his cousin Louis Philippe, Duke of Orléans, “King of the French” under a revised Charter, beginning the July Monarchy. The revolution helped inspire the Belgian Revolution and the November Uprising in Poland, and Eugène Delacroix commemorated it in Liberty Leading the People.
