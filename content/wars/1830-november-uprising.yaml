    name: Polish insurgents
    polities: [congress-poland]
    ink: magenta
    moves: Polish moves
    success: Polish success
  - id: ru
    name: Russian Empire
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
notes:
  - Dates are New Style (Gregorian), as used in the Kingdom of Poland. Russia still used the Julian calendar, then 12 days behind.
  - Casualty figures for the battles vary between sources and are given here as approximate.
