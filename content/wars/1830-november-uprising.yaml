id: november-uprising
name: November Uprising
start: "1830-11-29"
end: "1831-10-21"
tier: B
summary: A rising in Russian-ruled Congress Poland that began with an attack by officer cadets in Warsaw on 29 November 1830 and grew into a full war between the kingdom’s army and the Russian Empire. After hard-fought battles at Olszynka Grochowska and Ostrołęka, Russian troops took Warsaw in September 1831; the kingdom lost its constitution and army, and thousands of Poles went into exile in the Great Emigration.
countries: [pl, lt, fr]
sides:
