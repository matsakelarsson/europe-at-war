notes:
  - The name Baptist War was given by the planters, who blamed the Baptist missionaries; the missionaries denied any part in the plan, and historians see it as the work of enslaved leaders, many of them members of the Baptist congregations. Accounts of the number of rebels, of the dead and of the executed differ; the figures here are those most often given.
