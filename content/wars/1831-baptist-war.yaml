  - title: Martial law, the gallows and abolition
    date: January 1832 – August 1834
    when: "1832-01"
    borders: "1832-01-15"
    countries: [jm, gb]
    body:
      - The governor, the Earl of Belmore, declared martial law at the end of December. Major-General Sir Willoughby Cotton landed at Montego Bay with regular troops in the first days of January 1832 and, with the militia and Maroon companies, drove the rebels from the estates and into the hills, offering pardon to those who returned to work. Within about two weeks the rising was over. Fourteen white people had been killed; more than 200 rebels were killed by troops and militia, many of them shot out of hand.
      - The trials that followed, by courts martial and by the slave courts of the parishes, sent between 310 and 340 people to the gallows, many of them hanged in the square at Montego Bay, and hundreds more were flogged. Samuel Sharpe was tried in April and hanged at Montego Bay on 23 May 1832. The missionary Henry Bleby, who visited him in prison, recorded him saying that he would rather die on the gallows than live in slavery.
      - Planters blamed the missionaries. Militiamen of the Colonial Church Union destroyed Baptist and Methodist chapels across the west, and William Knibb and Thomas Burchell were arrested and later went to Britain, where they told of the reprisals at public meetings. Two parliamentary committees examined the state of the colony, and in August 1833 Parliament passed the Slavery Abolition Act. Slavery ended in the British colonies on 1 August 1834, followed by an apprenticeship that bound the formerly enslaved to their old estates until 1838. Independent Jamaica named Sharpe a National Hero, and the square where he was hanged is now Sam Sharpe Square.
    facts:
      - [Rising suppressed, "first half of January 1832"]
      - [Executed, "310 to 340"]
      - [Samuel Sharpe hanged, "23 May 1832, Montego Bay"]
      - [Slavery Abolition Act, "28 August 1833, in force 1 August 1834"]
