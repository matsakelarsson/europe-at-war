steps:
  - title: The Christmas strike becomes a rising
    date: December 1831 – January 1832
    when: "1831-12-27"
    borders: "1831-12-28"
    countries: [jm, gb]
    body:
      - In 1831 Jamaica had about 300,000 enslaved people, far outnumbering its white and free coloured inhabitants. Black Baptist congregations had spread across the western parishes, led by enslaved deacons and “daddies” such as Samuel Sharpe, who could read and followed the news of the British campaign against slavery. Rumours went round that the king had already freed the enslaved and that the planters were hiding it. Over the autumn Sharpe and his companions met on the estates and had people swear on the Bible not to return to work after the Christmas holidays unless they were paid. Sharpe hoped for a peaceful strike, but others prepared to fight.
      - On the night of 27 December 1831 the trash house of Kensington estate, high in the hills of Saint James, was set alight, and fires spread from estate to estate across the western parishes. A rebel force with firearms, called the Black Regiment and led by an enslaved man named Johnson, drove back the militia of Colonel William Grignon, which retreated towards Montego Bay. Up to 60,000 people took part, burning great houses, works and cane, though in the first days the rebels killed few white people. On the coast, boats from the frigate HMS Blanche attacked rebel positions near Montego Bay.
