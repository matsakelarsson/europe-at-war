id: baptist-war
name: Baptist War
start: "1831-12-27"
end: "1832-01"
tier: B
summary: "The largest rising of enslaved people in the British Caribbean, also called the Christmas Rebellion and the Great Jamaican Slave Revolt of 1831–1832. It was planned by Samuel Sharpe, an enslaved man of Montego Bay who was a deacon of the Baptist chapel of the missionary Thomas Burchell and a leader among the Black Baptists of western Jamaica. As the campaign against slavery grew in Britain, many enslaved Jamaicans believed that the king had granted freedom and that the planters were withholding it. Sharpe and his companions swore people on the estates to refuse to work after the Christmas holidays of 1831 unless they were paid wages. The strike turned into an armed rising when the trash house of Kensington estate in the hills of Saint James was set alight on 27 December. Up to 60,000 of the island’s roughly 300,000 enslaved people took part across Saint James, Hanover, Westmoreland, Trelawny and Saint Elizabeth; estates were burned, and a rebel Black Regiment drove back a militia force. The governor, Lord Belmore, declared martial law, and British troops under Sir Willoughby Cotton, with the militia and Maroons, broke the rising in the first weeks of January 1832. Fourteen white people were killed. More than 200 rebels died in the fighting, and between 310 and 340 were executed after trials by courts martial and slave courts; Sharpe was hanged at Montego Bay on 23 May 1832. Planters blamed the missionaries and destroyed Baptist and Methodist chapels. The Assembly put the damage at £1,154,589. The rising and the reprisals, reported in Britain by the missionaries, helped persuade Parliament to pass the Slavery Abolition Act of 1833."
countries: [jm, gb]
