id: bosnian-uprising
name: Bosnian Uprising of 1831–1832
start: "1831"
end: "1832-06-05"
tier: C
summary: A revolt of Bosnia’s Muslim notables, the ayans and hereditary captains, led by Husein Gradaščević, captain of Gradačac, against Sultan Mahmud II’s centralising reforms, which threatened their privileges, and against the Treaty of Adrianople’s promise of six districts to autonomous Serbia. The rebels drove out the governor, marched into Kosovo and beat the grand vizier near Štimlje on 18 July 1831, and an assembly in Sarajevo proclaimed Gradaščević vizier of Bosnia. Herzegovinian captains under Ali-paša Rizvanbegović and Smail-aga Čengić stayed loyal, and their troops helped an Ottoman army defeat the rebels at Stup outside Sarajevo on 4 June 1832. Gradaščević fled to Austria, and in 1833 Herzegovina became a separate province under Rizvanbegović.
countries: [ba, xk, rs, tr]
