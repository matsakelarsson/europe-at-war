notes:
  - Gradaščević is remembered by Bosniaks as the “Dragon of Bosnia” (Zmaj od Bosne) and a champion of Bosnian autonomy; other historians see the rising mainly as a conservative revolt of the Muslim nobility against reform. Some sources date the end of the rising to 1833, when the last captaincies submitted.
