  - title: Konya and Kütahya
    date: November 1832 – July 1833
    when: "1832-11-18"
    borders: "1833-05-14"
    countries: [tr, eg, sy, lb, il, ps, ru]
    body:
      - Sultan Mahmud II raised a new army of more than 50,000 men under the grand vizier, Reşid Mehmed Pasha. Ibrahim crossed the Taurus and entered Konya unopposed in November. On 21 December 1832, in thick fog on the plain outside the town, his smaller army found a gap in the Ottoman line and broke it; the grand vizier, riding forward to rally his left wing, was taken prisoner. The Egyptians lost fewer than 800 men, the Ottomans about 3,000 dead, many prisoners and much of their artillery. No army now stood between Ibrahim and Constantinople, and by February 1833 he was at Kütahya.
      - Turned down by Britain and France, the Sultan accepted help from Russia. A Russian squadron anchored in the Bosporus in February, and Russian troops, by various estimates from 18,000 to 40,000 men, landed on its Asian shore at Hünkâr İskelesi. Alarmed, Britain and France pressed both sides to settle. In May 1833 the Sultan confirmed Muhammad Ali as governor of Egypt and Crete and gave him the provinces of Syria, with Adana for Ibrahim, and the Egyptian army withdrew behind the Taurus. On 8 July Russia and the Ottomans signed the Treaty of Hünkâr İskelesi, a defensive alliance whose secret article alarmed Britain. Egyptian conscription and taxes soon provoked risings in Syria, among them the Palestinian peasants’ revolt of 1834.
    facts:
      - [Battle of Konya, "21 December 1832, Egyptian victory"]
      - [Kütahya settlement, "May 1833, firman of 6 May"]
      - [Treaty of Hünkâr İskelesi, "8 July 1833, Russia and the Ottoman Empire"]
