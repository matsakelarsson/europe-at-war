id: egyptian-ottoman-war-1831
name: Egyptian–Ottoman War of 1831–1833
start: "1831-10-29"
end: "1833-05"
tier: B
summary: A war in which Muhammad Ali, the Ottoman governor of Egypt, sent his son Ibrahim Pasha to conquer Syria from the Sultan. Ibrahim took Acre and Damascus, beat the Ottoman armies at Homs, Belen and Konya and advanced to Kütahya, until Russian intervention and pressure from Britain and France brought a settlement in May 1833 that left Egypt ruling Syria and Adana under nominal Ottoman sovereignty.
