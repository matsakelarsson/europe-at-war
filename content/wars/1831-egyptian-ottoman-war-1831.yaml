steps:
  - title: Acre and the conquest of Syria
    date: October 1831 – August 1832
    when: "1831-10-29"
    borders: "1832-08-01"
    countries: [eg, il, ps, lb, sy, tr]
    body:
      - Muhammad Ali had sent his army and fleet to fight the Greek revolt for the Sultan, and had received only Crete for it. He wanted Syria, with its timber, revenues and men. His pretext was a quarrel with Abdullah Pasha, governor of Acre, who had taken in thousands of Egyptian peasants fleeing conscription and taxes. At the end of October 1831 an army of about 30,000 men marched across Sinai, while Ibrahim Pasha sailed to Jaffa. Jaffa, Jerusalem, Sidon, Beirut and Tripoli submitted, and on 26 November Ibrahim laid siege to Acre, whose walls had defied Napoleon in 1799.
      - Abdullah’s garrison beat off bombardments and assaults for six months, while the Sultan declared Muhammad Ali a rebel and gathered an army against him. On 27 May 1832 Ibrahim led the final storm in person; the ruined town was plundered and Abdullah was sent to Egypt as a prisoner. Damascus opened its gates in June. In July Ibrahim beat the Ottoman vanguard at Homs and took Aleppo, and at the end of the month he routed the main army of Ağa Hüseyin Pasha in the Belen pass above Alexandretta, then crossed into Cilicia and took Adana and Tarsus.
    facts:
      - [Siege of Acre, "26 November 1831 – 27 May 1832"]
      - [Battle of Homs, "July 1832, Egyptian victory"]
      - [Battle of Belen, "Late July 1832, Egyptian victory"]
