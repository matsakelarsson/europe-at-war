notes:
  - Also called the First Syrian War or the First Turko-Egyptian War. Egypt was formally an Ottoman province, but Muhammad Ali ruled it as his own state, with an army and fleet trained on French lines.
  - Accounts differ on the dates of several battles in 1832 and on the size of the armies; numbers given here are estimates.
