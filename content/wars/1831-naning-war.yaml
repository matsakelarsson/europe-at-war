id: naning-war
name: Naning War
start: "1831-08-06"
end: "1832-06-15"
tier: C
summary: "A war between the British East India Company’s government at Malacca and Naning, a small Minangkabau district in Malacca’s hinterland ruled by its own penghulu (chief), Dol Said. Under Dutch rule Naning had paid Malacca a token tribute of 400 gantangs of rice a year. After the Anglo-Dutch Treaty of 1824 gave Malacca to Britain, Governor Robert Fullerton treated Naning as British territory, demanded a tenth of its produce and curbed the penghulu’s powers; Dol Said, who held that Naning had never been more than a tributary, refused to come to Malacca and was held to be defying the Company. On 6 August 1831 about 150 Indian sepoys under British officers, with six-pounder guns, marched from Malacca. Felled trees, sniping and supply boats stranded on the Malacca River halted them, Naning received men from Rembau and other neighbouring states, and on 24 August the column was back in Malacca, having left its guns and stores behind. Governor Robert Ibbetson then won Rembau over on 20 January 1832 by recognising it as independent, gathered about 1,500 troops with reinforcements from India, and sent a second expedition on 7 February 1832, joined by a Rembau contingent. It advanced slowly from post to post through abandoned villages, refused Dol Said’s offers to negotiate, and on 15 June 1832 reached his village of Taboh, which its defenders had already left. Dol Said surrendered on 4 February 1834 in return for a pardon and lived in Malacca on a pension until his death in 1849. Naning became a district of Malacca under British law. The cost of the war made the British wary of armed intervention in the Malay states for forty years; in Malaysia Dol Said is remembered as an early fighter against colonial rule."
