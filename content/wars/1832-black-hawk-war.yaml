steps:
  - title: Saukenuk and the return of the British Band
    date: 1804 – May 1832
    when: "1832-04-05"
    borders: "1832-05-14"
    countries: [us]
    body:
      - In 1804, at St. Louis, William Henry Harrison obtained from five Sauk and Meskwaki men, who had come to settle a killing, a treaty ceding all their lands east of the Mississippi and some to the west for $2,234 in goods and an annuity of $1,000. The Sauk and Meskwaki councils had not authorised it, and many never accepted it. The treaty let them stay until the land was sold, and they went on living at Saukenuk, a town of several thousand people near the mouth of the Rock River, where women farmed the fields along the river. In the late 1820s American squatters moved onto the fields; most Sauk followed Keokuk west across the Mississippi, but Black Hawk, a war leader who had fought beside the British in the War of 1812, led a band back to Saukenuk each spring. In June 1831 General Edmund Gaines and the Illinois militia forced the band west, and its leaders signed an agreement to stay there.
      - On 5 April 1832 Black Hawk crossed the Mississippi again at the Yellow Banks with about 500 warriors and 600 women, children and old people, the British Band, and went up the Rock River towards Prophetstown, the village of the Ho-Chunk and Sauk prophet Wabokieshiek (White Cloud), who had told him the Ho-Chunk and the British would help. General Henry Atkinson followed with about 220 regulars, and Governor John Reynolds called out about 2,100 Illinois militia. When neither the Ho-Chunk and Potawatomi nor the British offered help, Black Hawk decided to return west.
      - On 14 May, near the Kishwaukee River, he sent men under a white flag to speak to a mounted militia battalion under Major Isaiah Stillman. The militiamen fired on them and charged, and Black Hawk, with perhaps forty warriors, counter-attacked. The militia fled in panic, leaving about twelve dead; the band lost about three. The rout, known as Stillman’s Run, turned the crisis into a war.
