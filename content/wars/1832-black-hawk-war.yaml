notes:
  - "Black Hawk’s autobiography, dictated through an interpreter in 1833, is the main account from the Sauk side; most other sources are the reports and memoirs of officers and militiamen. Numbers for the band and its losses are estimates."
  - "Most Sauk and Meskwaki, led by Keokuk, stayed west of the Mississippi and out of the war. The Ho-Chunk and Potawatomi were divided: most stayed neutral or served the Americans as scouts, while some warriors joined the band’s raids."
  - Among the Illinois militiamen were Abraham Lincoln, who was elected captain of his company and saw no fighting, and among the regulars Zachary Taylor and Jefferson Davis, who later escorted Black Hawk to prison.
