id: black-hawk-war
name: Black Hawk War
start: "1832-04-05"
end: "1832-08-27"
tier: B
summary: "A war of 1832 between the United States and a band of about 1,100 Sauk, Meskwaki and Kickapoo people led by the Sauk war leader Black Hawk (Makataimeshekiakiak). Black Hawk’s followers, whom the Americans called the British Band, rejected a treaty of 1804 by which a few Sauk and Meskwaki men had ceded their lands east of the Mississippi, including the great Sauk town of Saukenuk on the Rock River. In April 1832 they crossed back into Illinois, hoping for help from the Ho-Chunk and the British. Illinois militia attacked them, and after routing the militia at Stillman’s Run on 14 May the band fled north into what is now Wisconsin, pursued by regulars and militia under General Henry Atkinson, while warriors raided farms and forts. After the rear guard held the pursuers at Wisconsin Heights on 21 July, the band was caught trying to recross the Mississippi at the mouth of the Bad Axe River on 1–2 August, where soldiers, militia and an armed steamboat killed between about 150 and 260 people or more, many of them women and children. About 77 Americans and between 450 and 600 of the band died in the war. Black Hawk surrendered on 27 August, and in September the Sauk, Meskwaki and Ho-Chunk were made to cede more land."
countries: [us]
sides:
