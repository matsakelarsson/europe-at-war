  - title: Bad Axe and the treaties
    date: August – September 1832
    when: "1832-08-02"
    borders: "1832-09-21"
    countries: [us]
    body:
      - The band crossed the hills of the Kickapoo country to the Mississippi, losing people to hunger and exhaustion, and reached it near the mouth of the Bad Axe River on 1 August. That afternoon the army steamboat Warrior came up the river; Black Hawk raised a white flag, but the soldiers, fearing a trick, opened fire with a cannon; newspapers reported about 23 killed. Black Hawk, Wabokieshiek and a few others left that night for the Ho-Chunk country to the north. On the morning of 2 August Atkinson’s army of some 1,300 regulars and militia attacked the people on the riverbank, while the Warrior fired from the river. Men, women and children were shot or drowned as they tried to swim across or hid on the islands. Estimates of the band’s dead range from about 150 to more than 260, with some 75 taken prisoner; the army’s losses are given as five killed and 19 wounded, or as 14 dead. Historians have called it the Bad Axe Massacre since the 1850s.
      - Of the people who reached the west bank, many were hunted down by Dakota warriors sent by the Americans, who killed 68 and took 22 captive on the Cedar River on about 9 August. Black Hawk and Wabokieshiek surrendered to the Indian agent Joseph Street at Prairie du Chien on 27 August, brought in by Ho-Chunk men. Of the roughly 1,100 people who had crossed into Illinois in April, an estimated 450 to 600, about half, died in the war.
      - Winfield Scott and Governor Reynolds dictated the peace at Fort Armstrong. On 15 September the Ho-Chunk ceded their lands south of the Wisconsin River, and on 21 September the Sauk and Meskwaki ceded a strip about 50 miles wide along the west bank of the Mississippi in what is now Iowa, about six million acres, known as the Black Hawk Purchase; Keokuk, who had kept out of the war, was recognised by the United States as their leader. Black Hawk was imprisoned at Fort Monroe in Virginia, then taken on a tour of eastern cities in 1833, where large crowds came to see him; he dictated his autobiography that year and died in Iowa in 1838.
    facts:
      - [Battle of Bad Axe, "1–2 August 1832"]
