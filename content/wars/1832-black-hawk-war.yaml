  - title: Raids, the pursuit and Wisconsin Heights
    date: May – July 1832
    when: "1832-06-24"
    borders: "1832-07-21"
    countries: [us]
    body:
      - After Stillman’s Run the band moved north up the Rock River into Michigan Territory, to the swamps around Lake Koshkonong, while its warriors and some Ho-Chunk and Potawatomi allies raided farms and forts in northern Illinois and the lead-mining district. On 21 May Potawatomi men, joined by a few Sauk, killed fifteen men, women and children of three American families at Indian Creek, known as the Indian Creek massacre, and carried off two teenage girls, who were later ransomed through Ho-Chunk intermediaries. On 24 June Black Hawk himself led an attack on the stockade at Apple River Fort, which its defenders held, and on 25 June his warriors fought militia at Kellogg’s Grove; on 16 June Henry Dodge’s Michigan volunteers killed a Kickapoo raiding party of eleven at Horseshoe Bend on the Pecatonica.
      - President Andrew Jackson sent General Winfield Scott with about 1,000 regulars from the East, but cholera broke out among them on the Great Lakes, and Scott reached Chicago with only some 350 men fit to fight. Atkinson, with regulars, volunteers and Menominee, Ho-Chunk and Potawatomi scouts, searched the marshes of the Rock River in July while the band, short of food, slipped away west towards the Four Lakes, where Madison now stands.
      - Militia under Henry Dodge and James D. Henry found the band’s trail and caught up with it on the bluffs above the Wisconsin River on 21 July. Black Hawk and Neapope, with a rear guard of perhaps 100 to 120 Sauk and Kickapoo warriors, held off some 600 to 750 militiamen until nightfall while the women, children and old people crossed the river; the militia lost one man killed, and the band some 40 to 70, including those who drowned. Some of the band went down the Wisconsin by canoe and raft and were killed or captured near Fort Crawford.
