  - title: Vergara and Morella
    date: 1838 – July 1840
    when: "1838-01-26"
    borders: "1840-07-06"
    countries: [es, fr]
    body:
      - In the east Cabrera, a former seminarian whose ruthlessness matched that of his enemies, made the mountain town of Morella his base in January 1838 and beat off a Liberal siege that summer. In the north the war ground on in exhaustion. The Carlist camp split between hardline courtiers and generals ready to make peace. In February 1839 the Carlist commander, General Rafael Maroto, had several of his rivals shot at Estella, and he then negotiated with Espartero.
      - On 31 August 1839, by the Convention of Vergara, Maroto’s army laid down its arms. Its officers kept their ranks in the royal army, and Espartero promised to recommend that the government respect the fueros. The two generals embraced before their troops. Don Carlos crossed into France in September. Espartero then turned east, took Morella on 30 May 1840 and Berga in Catalonia in early July, and Cabrera led his last men into France. The fueros of the Basque provinces and Navarre were cut back in 1839–41, and Espartero soon replaced Maria Christina as regent.
    facts:
      - [Convention of Vergara, "31 August 1839"]
      - [Morella taken by Espartero, "30 May 1840"]
      - [Carlist commanders, "Rafael Maroto; Ramón Cabrera"]
    markers:
      - kind: held
        side: car
        name: Morella
        date: January 1838 – May 1840
        text: Cabrera’s fortress capital in the Maestrazgo; it fell to Espartero after a short siege and heavy bombardment.
        lonlat: [-0.099, 40.619]
      - kind: event
        side: car
        name: Estella
        date: 18 February 1839
        text: Maroto had four Carlist generals and other officers of the hardline faction shot.
        lonlat: [-2.03, 42.67]
      - kind: treaty
        name: Vergara
        date: 31 August 1839
        text: Espartero and Maroto announced the agreement here before their troops, with an embrace that gave it its Spanish name, the Abrazo de Vergara.
        lonlat: [-2.414, 43.117]
      - kind: taken
        side: lib
        name: Berga
        date: July 1840
        text: The last Carlist stronghold in Catalonia; Cabrera crossed the Pyrenees into France soon after.
        lonlat: [1.845, 42.104]
    arrows:
