        text: The seat of Don Carlos’s court and government for most of the war.
        lonlat: [-2.03, 42.67]
        lp: l
      - kind: siege
        side: lib
        name: Bilbao
        date: June – July 1835
        text: The city held out, and Zumalacárregui, wounded in the leg near Begoña on 14 June, died ten days later after poor treatment.
        lonlat: [-2.935, 43.263]
      - kind: battle
        side: lib
        name: Mendigorría
        date: 16 July 1835
        text: General Luis Fernández de Córdova defeated the main Carlist army, the first major Liberal victory, but could not follow it up.
        lonlat: [-1.844, 42.621]
