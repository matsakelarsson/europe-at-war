id: first-carlist-war
name: First Carlist War
start: "1833-10-01"
end: "1840-07-06"
tier: B
summary: A civil war in Spain between the supporters of the child queen Isabella II and her mother, the regent Maria Christina, and those of Ferdinand VII’s brother Don Carlos, who claimed the throne as Carlos V and stood for absolute monarchy, the Church and the old regional rights (fueros). Fought mainly in the Basque provinces, Navarre, the Maestrazgo and Catalonia, it ended with the Convention of Vergara in 1839 and the defeat of the last Carlist armies in the east in 1840.
countries: [es, gb, fr, pt]
sides:
  - id: lib
    name: Liberals (Isabella II)
    polities: [spain]
    ink: blue
    moves: Liberal moves
    success: Liberal success
  - id: car
    name: Carlists
    polities: [carlists]
    ink: red
    moves: Carlist moves
    success: Carlist success
notes:
  - The Liberals were also called Cristinos or Isabelinos. Britain, France and Portugal backed them under the Quadruple Alliance of 1834 with loans, ships and troops, among them the British Legion of volunteers under George de Lacy Evans, the French Foreign Legion and a Portuguese division.
  - Estimates of the dead vary widely, from about 100,000 to over 300,000 including civilians. Both sides shot prisoners and took reprisals on civilians, among them the mother of the Carlist general Ramón Cabrera, executed by the Liberals in 1836.
