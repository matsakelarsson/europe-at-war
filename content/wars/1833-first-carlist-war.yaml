  - title: Luchana and the Royal Expedition
    date: 1836 – 1837
    when: "1836-06"
    borders: "1837-10-04"
    countries: [es, gb, fr]
    body:
      - The Liberals were divided, and in August 1836 a mutiny of the guard at La Granja forced the regent to restore the constitution of 1812, while the minister Juan Álvarez Mendizábal sold off Church lands to pay for the war. The Carlists, unable to break out of the north, sent raiding columns across Spain. In 1836 General Miguel Gómez marched as far as Galicia and Andalusia and back, but held nothing. That autumn they besieged Bilbao again, and on the night of 23–24 December 1836 General Baldomero Espartero broke the siege in a snowstorm at the bridge of Luchana, with help from British ships and sailors.
      - In May 1837 Don Carlos himself left Estella with his best troops in the Royal Expedition, hoping to take Madrid or force a settlement with the regent. He won at Huesca and Barbastro, crossed the Ebro to join Ramón Cabrera’s forces from the Maestrazgo, was checked at Chiva in July, and in September reached the outskirts of Madrid, while a second Carlist column had taken Segovia. Expected support in the capital never came, and when Espartero’s army approached, Don Carlos turned back. The retreat to the north, harried all the way, broke Carlist morale and prestige.
    facts:
      - [Battle of Luchana, "23–24 December 1836, Liberal victory"]
      - [Royal Expedition, "May – October 1837"]
      - [Carlists before Madrid, "September 1837"]
    markers:
      - kind: battle
        side: lib
        name: Luchana
        date: 23–24 December 1836
        text: Espartero’s troops stormed the Carlist positions on the Nervión and lifted the second siege of Bilbao; he was made Count of Luchana.
        lonlat: [-2.971, 43.293]
      - kind: battle
        side: car
        name: Huesca
        date: 24 May 1837
        text: The Royal Expedition defeated a Liberal army whose French Foreign Legion contingent lost heavily.
        lonlat: [-0.408, 42.136]
      - kind: battle
        side: lib
        name: Chiva
        date: 15 July 1837
        text: A smaller Liberal force nearly routed the Carlists near Valencia, forcing the expedition to turn north again.
        lonlat: [-0.72, 39.47]
      - kind: taken
        side: car
        name: Segovia
        date: August 1837
        text: Juan Antonio Zaratiegui’s column took the city in a raid from Navarre that briefly spread panic in Madrid.
        lonlat: [-4.118, 40.948]
        lp: l
      - kind: event
        side: lib
        name: Madrid
        date: 10–12 September 1837
        text: The Carlist vanguard reached the outskirts of the capital, then withdrew towards Alcalá de Henares as Espartero arrived.
        lonlat: [-3.704, 40.417]
