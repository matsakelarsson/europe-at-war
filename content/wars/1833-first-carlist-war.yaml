steps:
  - title: Zumalacárregui and the siege of Bilbao
    date: October 1833 – July 1835
    when: "1833-10-01"
    borders: "1835-07-16"
    countries: [es, pt]
    body:
      - In 1830 Ferdinand VII set aside the law that barred women from the throne so that his daughter Isabella could succeed him. When he died on 29 September 1833 she became queen at the age of three, with her mother Maria Christina as regent, and his brother Don Carlos, then in Portugal, proclaimed himself king. Carlist risings broke out in October in Talavera, Bilbao, Vitoria and across the north. Most of the army and the cities stayed loyal to Isabella, and the regent turned to the liberals for support, but Carlism took hold in the countryside of the Basque provinces and Navarre, where the fueros were at stake, and in parts of Aragon and Catalonia.
      - In Navarre Colonel Tomás de Zumalacárregui turned the Carlist bands into a disciplined army, which used the mountains to ambush and defeat government columns. Don Carlos, shipped to Britain after the Liberal victory in Portugal, crossed France in disguise and joined him in July 1834. Both sides shot their prisoners until a British envoy, Lord Eliot, arranged an agreement on exchanging them in April 1835. Don Carlos wanted a city to win foreign recognition and ordered Zumalacárregui to besiege Bilbao. He was wounded there in June and died on 24 June 1835. In July the Liberals won at Mendigorría, but the Carlists kept their hold on the countryside.
    facts:
      - [Death of Ferdinand VII, "29 September 1833"]
      - [Lord Eliot Convention, "April 1835"]
      - [Death of Zumalacárregui, "24 June 1835"]
    markers:
      - kind: event
        side: car
