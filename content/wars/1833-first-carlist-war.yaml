        date: October 1833
        text: One of the first Carlist risings, quickly put down; most of Castile stayed quiet.
        lonlat: [-4.83, 39.96]
      - kind: battle
        side: car
        name: Alsasua
        date: 22 April 1834
        text: Zumalacárregui routed a government force in the Sakana valley, one of the victories that made his name.
        lonlat: [-2.17, 42.9]
        lp: t
      - kind: held
        side: car
        name: Estella
