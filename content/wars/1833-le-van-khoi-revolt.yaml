notes:
  - Vietnamese records date events by the lunar calendar. The revolt began on the night of the 18th day of the 5th month of the year Quý Tỵ (5 July 1833), and the citadel fell on the 16th day of the 7th month of Ất Mùi (8 September 1835); some English sources give lunar dates as if they were Gregorian.
  - Siam fought its own war with Vietnam in 1833–1834, told in the Siamese–Vietnamese wars over Cambodia.
