id: le-van-khoi-revolt
name: Lê Văn Khôi revolt
start: "1833-07-05"
end: "1835-09-08"
tier: C
summary: "A revolt in southern Vietnam against the emperor Minh Mạng. The south had been governed almost on its own by the general Lê Văn Duyệt, who had opposed Minh Mạng’s accession and protected Catholic missionaries and Chinese merchants. After Duyệt’s death in 1832 the court abolished his governorship of Gia Định and opened a case against him. On the night of 5 July 1833 his adopted son Lê Văn Khôi broke out of prison with his followers, killed the new governor and the court’s investigator, and seized the Phiên An citadel at Saigon; within a month the rebels held all six southern provinces. Khôi gave his support to the line of Gia Long’s eldest son, Prince Cảnh, promised to protect Christianity, and asked Siam for help, which led to the Siamese invasion of Cambodia and southern Vietnam in November 1833. Imperial armies under Trương Minh Giảng and others retook the provinces and besieged the citadel, where Khôi died of illness in 1834. The citadel was stormed on 8 September 1835. About 550 defenders were killed in the assault, and the prisoners were executed and buried in a mass grave known as Mả Ngụy, the rebels’ grave; estimates of the number buried there range from about 1,300 to 1,831. Khôi’s young son Lê Văn Cù, the French missionary Joseph Marchand and four leaders were taken to Huế and put to death by slow slicing; Marchand died on 30 November 1835. Minh Mạng had the citadel razed, Duyệt’s tomb desecrated, and stepped up the persecution of Catholics."
