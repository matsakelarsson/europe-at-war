  - title: Trấn Tây and the Cambodian rising
    date: 1835–1840
    when: "1835"
    borders: "1840-09-15"
    countries: [kh, vn]
    body:
      - Ang Chan died in January 1835, leaving only daughters. Minh Mạng made his daughter Ang Mey queen in May 1835, and in November created the province of Trấn Tây, governed from Phnom Penh by Trương Minh Giảng. Cambodian provinces and officials were given Vietnamese names and titles, Vietnamese colonists and soldiers were settled, and the court tried to bring Cambodians to Vietnamese ways of dress, administration and farming. Cambodian chronicles remember these years as a time of heavy labour service and humiliation of the monkhood and the old elite; the Vietnamese records present it as bringing order and civilisation to the country.
      - In 1840 the Vietnamese demoted Ang Mey, and after a banquet on 24 August took her and her sisters to Saigon and arrested leading officials accused of dealing with Siam. Early in September provincial officials rose west of Phnom Penh, and the revolt soon spread over most of the country. Vietnamese garrisons were besieged and settlers killed, and the rebels called on Siam and Ang Duong. On 3 November 1840 Bodindecha invaded again, with about 20,000 men, by Pursat and Kampong Thom.
    facts:
