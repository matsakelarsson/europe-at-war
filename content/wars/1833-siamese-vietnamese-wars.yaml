  - title: Ang Duong and the siege of Oudong
    date: 1841–1847
    when: "1841-11"
    borders: "1845-12-01"
    countries: [kh, vn, th]
    body:
      - Minh Mạng died in January 1841, and his successor Thiệu Trị decided that holding Cambodia was not worth the cost. In November 1841 the Vietnamese withdrew to the Mekong delta, taking the Cambodian royal women with them; Trương Minh Giảng died soon afterwards, by some accounts by his own hand. Ang Duong, brought from Bangkok, set up his court at Oudong under Siamese protection, while the Siamese fortified Battambang and their posts in the west.
      - In July 1845 the Vietnamese came back with about 20,000 men under Nguyễn Tri Phương and Doãn Uẩn, retook Phnom Penh in September and besieged Ang Duong and Bodindecha at Oudong. The siege failed, and with neither side able to win, a settlement was reached in December 1845 under which Ang Duong would pay tribute to both courts. Vietnam released the princesses and invested Ang Duong as king at Oudong in May 1847; Siam crowned him in March 1848, and both armies left.
      - Ang Duong reigned until 1860 as a vassal of both neighbours. Fearing that they would partition his kingdom, he sought French protection in the 1850s, and in 1863 his son Norodom accepted a French protectorate.
    facts:
      - [Vietnamese withdrawal, "November 1841"]
      - [Siege of Oudong, "autumn 1845, Siamese and Cambodian success"]
      - [Peace agreed, "December 1845"]
      - [Ang Duong invested by Vietnam, "May 1847"]
