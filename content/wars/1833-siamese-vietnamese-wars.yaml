steps:
  - title: Bodindecha’s invasion and Vàm Nao
    date: November 1833 – April 1834
    when: "1833-11"
    borders: "1833-12-31"
    countries: [kh, vn, th, la]
    body:
      - Since the fall of Angkor, Cambodia’s kings had sought protection from Siam or Vietnam in turn. King Ang Chan, crowned with Siamese approval, had turned to Vietnam after 1812, while his brothers Ang Em and Ang Duong lived in Bangkok. When Lê Văn Khôi rose against the emperor Minh Mạng in Saigon in July 1833 and asked Siam for help, Rama III saw a chance to restore Siamese influence in Cambodia and perhaps take southern Vietnam.
      - On 23 November 1833 three forces left Bangkok. Chaophraya Bodindecha led the land army, said to number about 40,000, by Battambang and Pursat; Chaophraya Phrakhlang (Dit Bunnag) took a fleet of about 10,000 men by sea against Hà Tiên; a third force marched into the Lao lands towards Vietnam’s western frontier and took Muang Phuan. Bodindecha defeated the Cambodian army at Kampong Chhnang in December, and on 31 December Ang Chan fled from Phnom Penh into Vietnam. In January 1834 the fleet took Hà Tiên and Châu Đốc, and Bodindecha joined it for an advance down the Mekong towards Saigon.
      - On 21 January 1834 the Siamese met a Vietnamese army and river fleet under Trương Minh Giảng and Nguyễn Xuân on the Vàm Nao, the channel that joins the two arms of the Mekong. After about ten days of fighting, heaviest on 29 January, the Siamese broke off and fell back to Châu Đốc and Hà Tiên and then out of Cambodia, which they had left by April. They took thousands of Cambodian, Lao and Vietnamese captives with them, among them Vietnamese Catholics who settled in Bangkok. Ang Chan returned to Phnom Penh under Vietnamese escort in March 1834.
    facts:
