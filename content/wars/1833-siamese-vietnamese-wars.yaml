notes:
  - Older books date the first war 1831–1834. The Thai and Vietnamese chronicles, as read in the sources cited, place the Siamese invasion in November 1833, after the Lê Văn Khôi revolt had begun.
  - Cambodians fought on both sides. Ang Chan and many officials relied on Vietnam, his brothers Ang Em and Ang Duong lived in Bangkok under Siamese protection, and the rising of 1840 was led by provincial officials against Vietnamese rule. Army sizes come from Thai and Vietnamese chronicles and are uncertain.
  - Siam had held Battambang and Siem Reap since 1794. The province of Trấn Tây covered the rest of Cambodia from 1835 to 1841.
