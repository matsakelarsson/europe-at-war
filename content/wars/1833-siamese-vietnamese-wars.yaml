id: siamese-vietnamese-wars
name: Siamese–Vietnamese wars over Cambodia
start: "1833-11-23"
end: "1847-05"
tier: B
summary: "Two wars between Siam and Vietnam for control of Cambodia, whose kings had long paid tribute to both. In November 1833, with southern Vietnam in revolt under Lê Văn Khôi, Rama III sent armies under Chaophraya Bodindecha into Cambodia and a fleet against Hà Tiên. The Siamese drove the pro-Vietnamese king Ang Chan from Phnom Penh, but were beaten on the Vàm Nao channel in January 1834 and withdrew. Vietnam then ruled most of Cambodia directly as the province of Trấn Tây, with Ang Chan’s daughter Ang Mey as a figurehead queen. Its attempts to remake Cambodian government and customs on the Vietnamese model provoked a general Cambodian rising in 1840, and Siam invaded again with Prince Ang Duong. Vietnam withdrew in 1841, returned in 1845 and besieged the Siamese at Oudong, and in December 1845 both sides agreed that Ang Duong should rule as a vassal of both courts. He was invested by Vietnam in 1847 and crowned by Siam in 1848."
countries: [kh, vn, th, la]
