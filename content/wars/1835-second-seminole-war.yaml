  - title: Jesup, the capitulation and the seizure of Osceola
    date: December 1836 – December 1837
    when: "1837-10-21"
    borders: "1837-11-29"
    countries: [us]
    body:
      - By 1837 Jesup had more than 9,000 men, regulars, Marines, volunteers and several hundred Creek warriors from Alabama, whose leaders had been told that their service would protect their families during the Creek removal. He pushed columns into the Seminole country through the winter, destroying villages, food stores and cattle; in January 1837 Marines and Creek warriors captured some 25 Seminoles and Black Seminoles and a herd of horses at Hatchee-Lustee. On 6 March 1837, at Fort Dade, Jumper, Alligator and representatives of Micanopy signed a capitulation agreeing to assemble at Tampa Bay for removal, with the promise that their Black allies, “their bona fide property”, could go with them.
      - By May hundreds of Seminoles, Micanopy among them, were camped near Fort Brooke waiting for ships. But Jesup let slave catchers into the camp to search for people claimed by planters, and Black Seminoles fled. On the night of 2 June Osceola and Abiaka (Sam Jones), with about 200 warriors, entered the lightly guarded camp and led away about 700 people. Jesup, humiliated, turned to seizing leaders by any means. In September his troops captured King Philip and the Yuchi leader Uchee Billy; when King Philip’s son Coacoochee came in under a white flag to talk, he too was held.
      - On 21 October 1837, near Fort Peyton south of St. Augustine, Osceola and Coa Hadjo came to a parley under a white flag; on Jesup’s orders troops surrounded them and seized them with about 80 followers. The seizure caused an outcry across the United States. On the night of 29 November Coacoochee, John Horse and others, about twenty people in all, escaped from their cell in Fort Marion, the old Spanish Castillo de San Marcos at St. Augustine, by squeezing through a narrow window, and rejoined the fighters in the south. Osceola, moved to Fort Moultrie at Charleston, died there of illness on 30 January 1838.
    facts:
      - [Capitulation of Fort Dade, "6 March 1837"]
      - [Escape from the Fort Brooke camp, "2 June 1837"]
      - [Osceola seized, "21 October 1837"]
      - [Escape from Fort Marion, "29 November 1837"]
