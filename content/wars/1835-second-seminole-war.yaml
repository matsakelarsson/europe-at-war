  - title: Removal, the Macomb agreement and the Caloosahatchee
    date: 1838–1839
    when: "1839-05-19"
    borders: "1839-07-23"
    countries: [us]
    body:
      - The surrenders and seizures of 1837–1838 sent most of the leaders who had begun the war west, among them Micanopy, Jumper, Alligator and Abraham. Prisoners were held at Fort Brooke and on Egmont Key, then shipped to New Orleans and taken up the Mississippi and Arkansas rivers to Fort Gibson in Indian Territory; many died on the way or in the first years in the West, where they were settled on Creek land. To end the fighting, Jesup had promised freedom to Black Seminoles who surrendered, and many of them went west as free people, although their status was contested there for years.
      - Those who stayed in Florida retreated south of Lake Okeechobee and into the Everglades and the Big Cypress. Taylor tried to clear northern Florida with a grid of small posts. On 19 May 1839, at Fort King, General Alexander Macomb agreed with the Miccosukee leader Chitto Tustenuggee that the Seminoles could stay, at least for a time, in a reservation in south-western Florida if they stopped fighting.
      - The truce lasted two months. On 23 July 1839 about 150 warriors led by Billy Bowlegs, Chakaika and Hospetarke attacked a trading post the army had opened on the Caloosahatchee River under the agreement, killing most of its 23 soldiers and several civilians; its commander, Colonel William Harney, escaped through the river. Chakaika’s band, the so-called Spanish Indians, had not been party to the agreement, and the war resumed.
    facts:
      - [Macomb agreement, "19 May 1839"]
      - [Attack on the Caloosahatchee trading post, "23 July 1839"]
