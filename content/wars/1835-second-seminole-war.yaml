  - title: Indian Key and the Everglades
    date: 1840
    when: "1840-08-07"
    borders: "1840-12-31"
    countries: [us]
    body:
      - General Walker Keith Armistead, who took command in May 1840, campaigned through the summer, when the Seminoles planted their crops, and offered money to leaders who would emigrate. Earlier that year the territorial government had bought bloodhounds and hired handlers in Cuba to track the Seminoles; the dogs caused an outcry in the North and failed. The navy formed a flotilla of small craft and canoes, later known as the Mosquito Fleet, to patrol the coasts and penetrate the Everglades.
      - Before dawn on 7 August 1840 Chakaika’s band paddled some 50 km across Florida Bay and attacked Indian Key, a small island in the Keys where the wrecker Jacob Housman had built a settlement and the county seat. Most of the 50 to 70 inhabitants escaped by hiding or fleeing in boats, but the botanist Henry Perrine and others were killed, and the buildings were looted and burned; accounts of the dead range from six to eighteen, and many give 13.
      - In December Colonel Harney led about 90 soldiers in canoes into the Everglades, guided by John, a Black man who had been held by Chakaika’s band. They surprised Chakaika’s island camp; Chakaika was shot as he tried to surrender, and several of his men were hanged. It was the first US expedition to cross deep into the Everglades, and it showed the Seminoles that their last refuge could be reached.
    facts:
      - [Attack on Indian Key, "7 August 1840"]
      - [Harney’s Everglades expedition, "December 1840"]
