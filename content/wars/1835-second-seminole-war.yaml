  - title: Gaines, Scott and Call
    date: February – December 1836
    when: "1836-03-25"
    borders: "1836-11-21"
    countries: [us]
    body:
      - The first generals sent to end the war found that their columns could not catch the Seminoles. General Edmund Gaines marched from Tampa Bay with about 1,100 men in February 1836, buried Dade’s dead and tried to cross the Withlacoochee at the ford Clinch had used; from 27 February to 6 March his army was pinned in a hastily built breastwork, Camp Izard, by warriors under Osceola, Jumper and Alligator, eating its horses until Clinch arrived. At talks there the Seminoles offered to stop fighting if they could stay south of the river, but the talks broke down when Clinch’s men fired on them.
      - "General Winfield Scott then planned to trap the Seminoles in the Cove of the Withlacoochee, a maze of lakes and hammocks, with three converging columns totalling about 5,000 men: from Fort Drane in the north, from Volusia on the St. Johns in the east, and from Tampa Bay. The columns were late, the Seminoles slipped away, and the summer heat and disease sent the volunteers home. Abraham’s town of Pilaklikaha was burned. In the summer the army abandoned Fort King, Fort Drane and other posts to sickness, and on 23 July warriors attacked and burned the Cape Florida lighthouse."
      - Governor Richard Keith Call took command in the autumn with Florida militia, Tennessee volunteers and some 750 Creek warriors recruited in Alabama. His first advance in October was stopped by the flooded Withlacoochee; in November he fought the Seminoles at the Wahoo Swamp, where on 21 November his troops failed to cross a stream under fire and Major David Moniac, a Creek graduate of West Point, was killed. Call was replaced on 9 December by General Thomas Jesup.
    facts:
      - [Camp Izard, "27 February – 6 March 1836"]
      - [Scott’s campaign, "March – April 1836"]
      - [Battle of Wahoo Swamp, "21 November 1836"]
