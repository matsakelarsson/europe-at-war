steps:
  - title: Removal and the Treaty of Payne’s Landing
    date: 1823 – December 1835
    when: "1832-05-09"
    borders: "1835-11-26"
    countries: [us]
    body:
      - By the Treaty of Moultrie Creek of 1823 the Seminoles had given up northern Florida for a reservation in the centre of the peninsula, poor land on which many went hungry. After Congress passed the Indian Removal Act in 1830, the United States set out to move them west of the Mississippi. At Payne’s Landing on the Ocklawaha River, on 9 May 1832, Colonel James Gadsden obtained the marks of fifteen Seminole leaders on a treaty that would send them to the Creek lands in Indian Territory if a delegation found the land suitable. The delegation signed an approval at Fort Gibson in 1833, but most leaders said it had no authority to do so, and many said they had been tricked or coerced. The Senate ratified the treaty in 1834 and set the move for 1835.
      - Living among and beside the Seminole towns were several hundred Black Seminoles, freedom-seekers from Georgia and the Carolinas and their descendants, who farmed their own fields, bore arms and served as interpreters and advisers, such as Abraham, who spoke for the head chief Micanopy. Slaveholders claimed many of them, and in the West they could be seized by Creeks or slave traders. Both groups saw removal as ruin.
      - The agent, Wiley Thompson, pressed the chiefs at Fort King in 1834–1835, declared five of them deposed when they refused, including Micanopy, and banned sales of guns and powder to the Seminoles. Osceola, a young war leader who opposed removal, was briefly held in irons at Fort King after quarrelling with Thompson. In November 1835 Charley Emathla, a chief who had agreed to go west and had sold his cattle, was killed by Osceola and his followers on the trail from Fort King; the money from the cattle was scattered over his body. The Seminoles sent their families into the swamps and prepared for war.
    facts:
      - [Indian Removal Act, "28 May 1830"]
      - [Treaty of Payne’s Landing, "9 May 1832"]
      - [Charley Emathla killed, "November 1835"]
