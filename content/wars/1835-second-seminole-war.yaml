  - title: Worth’s campaigns and the end of the war
    date: 1841 – August 1842
    when: "1842-08-14"
    borders: "1842-08-14"
    countries: [us]
    body:
      - Colonel William Jenkins Worth, in command from May 1841, cut the army’s civilian payroll and kept his troops in the field through the summer, burning the Seminoles’ fields and villages so that they faced hunger in the winter. On 4 June 1841 Coacoochee, who had come to Fort Pierce to talk, was seized by Major Thomas Childs; Worth brought him back from a ship bound west and had him send messengers to his people, threatening to hang him if they did not come in. His band surrendered, and in October 1841 Coacoochee sailed for Indian Territory. Hospetarke and 127 of his people were captured in August 1841, and in April 1842 troops attacked Halleck Tustenuggee’s band in the Pelchikaha swamp; he was seized soon after when he came to Fort King to talk, and his band was rounded up.
      - By 1842 the US government judged that the cost of hunting down the last few hundred Seminoles was too high. Worth met Billy Bowlegs and other leaders at Cedar Key and allowed them to stay, for the time being, on land in south-western Florida; on 14 August 1842 he declared the war over. No peace treaty was signed. That month Congress passed the Armed Occupation Act, offering 160 acres in the peninsula, outside the Seminole area, to any man able to bear arms who would settle and farm it for five years.
      - About 4,000 Seminoles and Black Seminoles had been sent west, and estimates of those who remained in Florida, under Abiaka, Billy Bowlegs and others, range from about 300 to 600. About 1,500 US soldiers had died, most of them of disease, and an unknown number of militiamen and civilians; the number of Seminole and Black Seminole dead is not known. In Indian Territory the Black Seminoles were threatened with enslavement by Creek and other slave raiders, and in 1849–1850 John Horse and Coacoochee led a group of Seminoles and Black Seminoles to Mexico, where their descendants, the Mascogos, still live in Coahuila. The Seminoles who stayed in Florida fought again in 1855–1858.
    facts:
      - [Coacoochee seized, "4 June 1841"]
      - [War declared over, "14 August 1842"]
      - [Removed to Indian Territory, "about 4,000"]
      - [US soldiers killed or dead of disease, "about 1,500"]
