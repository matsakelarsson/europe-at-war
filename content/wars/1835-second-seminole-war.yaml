    polities: [united-states]
    ink: blue
    moves: US moves
    success: US success
notes:
  - "Most accounts of the war come from US officers, soldiers and officials; Seminole history survives in oral tradition and in what Seminole and Black Seminole leaders said in councils, recorded by interpreters. Numbers of Seminole fighters and losses are estimates, and the number of Seminole dead is not known."
  - "Names are given as the standard histories use them, with the Muscogee or Mikasuki names where they are known: Alligator (Halpatter Tustenuggee), Jumper (Ote Emathla), Abiaka (Sam Jones, Ar-pi-uck-i), Coacoochee (Wild Cat), King Philip (Emathla), Billy Bowlegs (Holata Micco). Osceola, born Billy Powell among the Muscogee of Tallassee, came to Florida as a Red Stick refugee and was a war leader, not a hereditary chief."
  - "General Thomas Jesup wrote in December 1836 that “this, you may be assured, is a negro, not an Indian war”: whether the Black Seminoles would be enslaved if they surrendered was central to every negotiation, and many of them fought to the end."
  - Older US sources call Dade’s battle the “Dade Massacre”; the Florida state park on the site calls it Dade’s Battle.
