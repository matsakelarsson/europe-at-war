  - title: Lake Okeechobee and Loxahatchee
    date: December 1837 – March 1838
    when: "1837-12-25"
    borders: "1838-01-24"
    countries: [us]
    body:
      - Jesup sent converging columns into the south to find the main Seminole bands. Colonel Zachary Taylor marched from Fort Brooke with some 800 to 1,000 regulars and Missouri volunteers, built Fort Gardiner on the Kissimmee River and followed a trail south. On 25 December 1837, near the north shore of Lake Okeechobee, he attacked fewer than 400 Seminole and Miccosukee fighters under Alligator, Abiaka and Coacoochee, who had chosen a hammock behind a broad saw-grass swamp and cut firing lanes through the grass. The Missouri volunteers broke under the first fire, and the 6th Infantry lost four officers and nearly 40 per cent of its men before the Seminoles withdrew across the lake. Taylor lost 26 killed and 112 wounded, the Seminoles 11 killed and 14 wounded; Taylor claimed a victory and was promoted to brigadier general.
      - On the east coast a navy and army party under Lieutenant Levin Powell was beaten back near Jupiter Inlet on 15 January 1838, losing four dead and 22 wounded. On 24 January Jesup himself, with about 1,500 men, attacked Seminoles who had dug in behind the Loxahatchee River; the soldiers drove them back across the river, but the Seminoles disappeared into the swamps after inflicting more casualties than they took, and Jesup was wounded in the face.
      - In February the leaders Tuskegee and Halleck Hadjo offered to stop fighting if their people could stay in the far south of the peninsula. Jesup, convinced that the war could not be won by arms, recommended accepting, but Secretary of War Joel Poinsett refused, and on 21 March Jesup had the 500 or so people camped near Fort Jupiter for the talks seized and sent west. In May Taylor replaced him.
    facts:
      - [Battle of Lake Okeechobee, "25 December 1837"]
      - [US losses at Okeechobee, "26 killed, 112 wounded"]
      - [Battle of Loxahatchee, "24 January 1838"]
      - [Seizure at Fort Jupiter, "21 March 1838"]
