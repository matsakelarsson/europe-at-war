id: second-seminole-war
name: Second Seminole War
start: "1835-12-28"
end: "1842-08-14"
tier: A
summary: "The longest and costliest of the wars the United States fought against Native nations, waged in Florida from 1835 to 1842. Under the Indian Removal Act of 1830 the United States demanded that the Seminoles leave Florida for Indian Territory, west of the Mississippi, citing the Treaty of Payne’s Landing (1832), which most Seminole leaders said they had never agreed to. The Seminoles and Miccosukees, with the Black Seminoles, people of African descent who lived among them as free allies and who faced enslavement if they went west, chose to fight. The war opened on 28 December 1835 with the destruction of Major Francis Dade’s column and the killing of the agent Wiley Thompson by Osceola. In a guerrilla war fought from the swamps and hammocks of the peninsula and later the Everglades, leaders such as Osceola, Micanopy, Jumper, Alligator, Abiaka (Sam Jones), Coacoochee (Wild Cat) and the Black Seminoles Abraham and John Horse held off a succession of US generals, of whom Thomas Jesup seized Osceola and other leaders under flags of truce. The war ended without a peace treaty on 14 August 1842. About 4,000 Seminoles and Black Seminoles had been removed to Indian Territory, while several hundred stayed in southern Florida; about 1,500 US soldiers died, most of them of disease, and the war cost the United States between $20 million and $40 million."
countries: [us]
sides:
  - id: sem
    name: Seminoles and Miccosukees
    polities: [seminole]
    ink: green
    moves: Seminole moves
    success: Seminole success
  - id: bsem
    name: Black Seminoles and people who had escaped slavery
    polities: [black-seminoles]
    ink: brown
    moves: Black Seminole moves
    success: Black Seminole success
  - id: us
