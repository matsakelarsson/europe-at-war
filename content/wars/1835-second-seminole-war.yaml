  - title: Dade’s Battle and the outbreak of war
    date: December 1835 – January 1836
    when: "1835-12-28"
    borders: "1835-12-31"
    countries: [us]
    body:
      - On 23 December 1835 Major Francis L. Dade left Fort Brooke with about 110 soldiers to reinforce Fort King, 160 km to the north. On the morning of 28 December, near the Wahoo Swamp, some 180 Seminole and Black Seminole warriors led by Micanopy, Jumper and Alligator, who had been watching the column for days, fired on it from the pine woods and palmetto. Dade fell in the first volley; the survivors built a small log breastwork and held out for several hours before they were overrun. All but three of the soldiers were killed, and one of the three died soon after; the Seminoles lost three killed and five wounded.
      - The same afternoon Osceola and a small party ambushed and killed Wiley Thompson and six others outside Fort King. Three days later, on 31 December, General Duncan Clinch, marching south from Fort Drane with about 750 regulars and Florida volunteers, was attacked by some 250 warriors under Osceola and Alligator while his regulars were crossing the Withlacoochee River; most of the volunteers stayed on the far bank. Clinch lost 4 killed and 59 wounded and withdrew.
      - On the east coast, Seminole and Black Seminole fighters, led among others by King Philip and his son Coacoochee, burned the sugar plantations south of St. Augustine, among them Bulowville and Dunlawton, in late December and January; on 17 January 1836 they drove off a volunteer company at Dunlawton. Hundreds of the enslaved workers on the plantations joined them, which some historians count as the largest uprising of enslaved people in US history, and planters fled to St. Augustine.
    facts:
      - [Dade’s Battle, "28 December 1835"]
      - [Dade’s command, "about 110 men, 3 survivors"]
      - [Battle of the Withlacoochee, "31 December 1835"]
