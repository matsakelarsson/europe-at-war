  - title: Velasco and the Republic of Texas
    date: May 1836 – 1845
    when: "1836-05-14"
    borders: "1836-12-19"
    countries: [us, mx]
    body:
      - "On 14 May 1836 Santa Anna, a prisoner, signed two treaties at Velasco with the Texian president, David G. Burnet: a public one ending hostilities and withdrawing Mexican troops beyond the Rio Grande, and a secret one in which he promised to work for Mexico’s recognition of Texas’s independence. General Vicente Filisola, his second-in-command, led the remaining Mexican army, still several thousand strong, back to Matamoros. The Mexican Congress rejected the treaties, saying a captive could not bind the nation, and Santa Anna, released in late 1836, lost his office. Mexico regarded Texas as a rebel province."
      - "Houston was elected president in September 1836, and in December the Texian Congress claimed the Rio Grande from its mouth to its source as the boundary, far beyond the Nueces River that had bounded the Mexican province, and including half of New Mexico. The United States recognised the republic in March 1837, France in 1839 and Britain in 1840, but not Mexico. Texas fought the Comanche and drove the Cherokee and their allies out of East Texas in 1839. In 1842 Mexican forces twice briefly occupied San Antonio; a Texian counter-raid was captured at Mier, and in 1843 one in ten of the prisoners, chosen by drawing black beans, was shot. Tejanos lost much of their land, and Seguín, mayor of San Antonio, was driven to Mexico in 1842."
      - "Most Texians wanted to join the United States, but annexation was blocked for years by northern opposition to adding a large slaveholding state and by the fear of war with Mexico. Congress annexed Texas by joint resolution in 1845, and its dispute with Mexico over the land between the Nueces and the Rio Grande became one of the causes of the Mexican–American War."
    facts:
      - [Treaties of Velasco, "14 May 1836"]
      - [Texian boundary act, "19 December 1836"]
      - [Recognised by the United States, "March 1837"]
      - [Annexed by the United States, "1845"]
