  - title: Refugio, Coleto and the Goliad massacre
    date: March 1836
    when: "1836-03-27"
    borders: "1836-03-27"
    countries: [us, mx]
    body:
      - "James Fannin, with several hundred men at Goliad, the largest Texian force, hesitated for weeks. He sent detachments under Amon King and William Ward to bring in colonists from Refugio, where Urrea’s troops beat them in mid-March; King and many of his men were shot after they were captured. Ordered by Houston to fall back to Victoria, Fannin left Goliad only on 19 March and with about 300 men was caught by Urrea in open prairie near Coleto Creek. After a day’s fighting, without water and surrounded, he surrendered on 20 March, believing his men would be treated as prisoners of war."
      - "Santa Anna insisted on the decree of December 1835. On Palm Sunday, 27 March 1836, the prisoners at Goliad were marched out in columns and shot; the wounded, Fannin last, were killed inside the presidio. Some 340 to 350 men died. About 28 escaped in the confusion, and some 20, physicians, mechanics and interpreters, were spared, several hidden by Mexican officers and by Francita Alavez, the companion of a Mexican officer, remembered in Texas as the “Angel of Goliad”. Urrea later wrote that he had disapproved; the order was carried out by Colonel José Nicolás de la Portilla."
    facts:
      - [Battle of Coleto, "19–20 March 1836"]
      - [Goliad massacre, "27 March 1836"]
      - [Prisoners killed, "about 340–350"]
