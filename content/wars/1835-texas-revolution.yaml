  - title: The Runaway Scrape and San Jacinto
    date: March – April 1836
    when: "1836-04-21"
    borders: "1836-04-21"
    countries: [us, mx]
    body:
      - "When news of the Alamo reached him at Gonzales on 13 March, Houston burned the town and began a retreat east, to the Colorado and then the Brazos, drilling his army of volunteers as he went and resisting demands to stand and fight. Colonists, Tejanos and the people they held in slavery fled ahead of the Mexican columns towards Louisiana through the spring rains, in what became known as the Runaway Scrape; the government fled from Washington-on-the-Brazos to Harrisburg and Galveston Island. Some enslaved people escaped to the Mexican army, which freed them."
      - "Santa Anna divided his army to pursue the government and burned Harrisburg in mid-April. Houston turned south-east to meet him, and on 20 April the two armies faced each other on the plain near the junction of Buffalo Bayou and the San Jacinto River. On the afternoon of 21 April, while the Mexican camp rested after Cos had come up with reinforcements, Houston’s army of about 910 men attacked across the open ground, with Seguín’s Tejano company among them, shouting “Remember the Alamo! Remember Goliad!”. The fight lasted about 18 minutes, but the killing of fleeing and surrendering soldiers went on for hours. Some 630 to 650 Mexican soldiers were killed and some 300 captured on the field, 730 in all by the Handbook of Texas’s count; the Texians lost 9 to 11 killed or mortally wounded and about 30 wounded. Santa Anna was found the next day disguised as a private."
    facts:
