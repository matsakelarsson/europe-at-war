steps:
  - title: Colonists, slavery and centralism
    date: 1821 – September 1835
    when: "1832-06-26"
    borders: "1835-09-01"
    countries: [us, mx]
    body:
      - "Spanish and then Mexican Texas had few settlers: perhaps 3,000 Tejanos lived around San Antonio de Béxar, La Bahía (Goliad) and Nacogdoches in 1821, while the Comanche, the Wichita peoples, the Lipan Apache and others held most of the land, and Cherokee, Shawnee and other nations driven from the United States were settling in the east. To build up the province, Spain and then independent Mexico granted land to empresarios who brought in colonists, starting with Stephen F. Austin’s colony on the Brazos in 1821. Most of the newcomers were Anglo-Americans from the US South, and many brought enslaved people to grow cotton. By 1834 some 30,000 Anglo-Americans lived in Coahuila y Tejas, against about 7,800 Mexicans."
      - "Mexico’s governments grew uneasy. President Vicente Guerrero abolished slavery in 1829, though Texas was exempted after protests; colonists got round later restrictions by registering the people they held as indentured servants. The law of 6 April 1830 banned further immigration from the United States and placed customs posts and garrisons in Texas. In 1832 colonists rose against the commander at Anahuac and fought a Mexican garrison at Velasco, and conventions in 1832 and 1833 asked for Texas to be separated from Coahuila as a state of its own. Austin, who carried the petition to Mexico City, was arrested there and held from January 1834 until 1835."
      - "In 1834–1835 Santa Anna, elected president as a federalist, turned to the centralists: he dissolved Congress and the state legislatures, cut the state militias, and in May 1835 crushed the militia of Zacatecas, which had resisted, and let his troops sack the city. Federalists in several states rebelled. In Texas, a party around William B. Travis drove the garrison from Anahuac in June, and Santa Anna sent his brother-in-law, General Martín Perfecto de Cos, with troops to Béxar to restore order and arrest the leaders."
    facts:
      - [Austin’s colony founded, "1821"]
      - [Mexico abolishes slavery, "15 September 1829 (Texas exempted in December)"]
      - [Law of 6 April 1830, "bans immigration from the United States"]
      - [Battle of Velasco, "26 June 1832"]
      - [Zacatecas militia defeated, "11 May 1835"]
