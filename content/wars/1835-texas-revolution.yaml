id: texas-revolution
name: Texas Revolution
start: "1835-10-02"
end: "1836-05-14"
tier: A
summary: "The rebellion of Texas against the government of Mexico in 1835–1836, which made Texas an independent republic. From the 1820s Mexico had invited settlers into its thinly peopled province of Coahuila y Tejas, and by 1835 Anglo-American colonists, many of them slaveholders from the US South, outnumbered the Tejanos (Mexican Texans) by several to one. They clashed with the government over Mexico’s attempts to end slavery and to stop immigration from the United States, and over the centralist rule of Antonio López de Santa Anna, who in 1835 overthrew the federal constitution of 1824. The fighting began at Gonzales on 2 October 1835; by December the Texians, with Tejano allies, had driven the Mexican garrisons out. Santa Anna marched north with some 6,000 men, took the Alamo in San Antonio on 6 March 1836, killing all its defenders, and on 27 March had more than 340 prisoners shot at Goliad. A convention declared Texas independent on 2 March. On 21 April Sam Houston’s army surprised and routed Santa Anna’s force at San Jacinto and captured him; at Velasco he agreed to withdraw his troops. Mexico never accepted the treaties, and Texas remained an independent republic, recognised by the United States, France and Britain but not by Mexico, until the United States annexed it in 1845."
countries: [us, mx]
sides:
  - id: tx
    name: Texians and Tejanos (the provisional government, from March 1836 the Republic of Texas)
    polities: [texas]
    ink: navy
    moves: Texian moves
    success: Texian success
  - id: mx
    name: Mexico (Santa Anna’s centralist government)
    polities: [mexico]
    ink: red
    moves: Mexican moves
    success: Mexican success
notes:
  - "“Texians” was the name the Anglo-American settlers of Mexican Texas used for themselves; “Tejanos” were the Spanish-speaking Mexicans of Texas, who fought on both sides. Numbers of defenders, attackers and dead at the Alamo, Goliad and San Jacinto differ between the Texian, Mexican and later accounts; the figures here follow the Handbook of Texas and the main modern studies."
  - "Slavery was a central issue: Mexico abolished it in 1829 and restricted it repeatedly, while the Republic of Texas’s constitution of 1836 protected it and barred free Black people from living in Texas without Congress’s consent. Some 5,000 enslaved people lived in Texas in 1836; the census of 1850 counted more than 58,000."
