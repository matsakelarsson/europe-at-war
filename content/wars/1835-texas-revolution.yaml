  - title: Gonzales, Goliad and the siege of Béxar
    date: October – December 1835
    when: "1835-10-02"
    borders: "1835-12-11"
    countries: [us, mx]
    body:
      - "On 2 October 1835 Mexican cavalry sent to take back a small cannon lent to the town of Gonzales were met by Texian volunteers under a flag reading “Come and Take It”, and withdrew after a brief exchange of fire, the first fight of the revolution. On 10 October volunteers took the presidio at Goliad, with its supplies, and an army of volunteers under Austin marched on Béxar, where Cos had about 600 men. On 28 October near Mission Concepción a Texian detachment under James Bowie and James Fannin beat off a Mexican attack."
      - "On 3 November delegates met at San Felipe as the Consultation. They declared that Texas was fighting for the federal constitution of 1824, not for independence, set up a provisional government with Henry Smith as governor, and named Sam Houston commander of a regular army that barely existed. Tejanos joined the siege of Béxar, among them Juan Seguín, who raised a company of horsemen, and Plácido Benavides of Victoria."
      - "After weeks of siege, in which the Texians captured a train of fodder in the “Grass Fight” of 26 November, some 300 volunteers led by Ben Milam stormed into Béxar on 5 December. After four days of house-to-house fighting, in which Milam was killed, Cos withdrew into the Alamo, asked for terms on 9 December and surrendered on 11 December. He and his men were allowed to leave Texas on parole, promising not to fight again. By the end of the year no Mexican garrison remained in Texas."
    facts:
      - [Battle of Gonzales, "2 October 1835"]
      - [Goliad taken, "10 October 1835"]
      - [Battle of Concepción, "28 October 1835"]
      - [Consultation at San Felipe, "3 November 1835"]
      - [Cos surrenders at Béxar, "11 December 1835"]
