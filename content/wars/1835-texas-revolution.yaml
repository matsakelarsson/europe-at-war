  - title: Santa Anna’s march and the Alamo
    date: February – March 1836
    when: "1836-03-06"
    borders: "1836-03-06"
    countries: [us, mx]
    body:
      - "Santa Anna gathered an army of some 6,000 men at Saltillo and in February 1836 crossed the Rio Grande in winter weather, while General José de Urrea led a second column up the coast from Matamoros. The Texians were divided: much of the volunteer army had gone off on a plan to attack Matamoros, the provisional government had fallen apart, and the garrisons at Béxar and Goliad were small. A decree of the Mexican government of 30 December 1835 ordered that foreigners taken in arms be treated as pirates and executed."
      - "Santa Anna reached Béxar on 23 February. About 180 to 260 defenders under William B. Travis and James Bowie, with David Crockett and his Tennessee volunteers and a few Tejanos, withdrew into the Alamo, the walled former mission. Travis sent out appeals for help, some carried by Juan Seguín; 32 men from Gonzales got through. Before dawn on 6 March, the thirteenth day, the Mexican army stormed the walls. Almost all the defenders were killed in the fighting, and a few, possibly including Crockett, were executed after surrendering; women and children, Susanna Dickinson among them, and Joe, Travis’s enslaved servant, were spared. Mexican losses were officially 60 killed and about 250 wounded; Texian and later estimates run to 400 to 600 killed and wounded."
      - "Meanwhile Urrea destroyed the Matamoros volunteers at San Patricio on 27 February and Agua Dulce Creek on 2 March. On 2 March, at Washington-on-the-Brazos, a convention of delegates declared Texas independent; it drafted a constitution that protected slavery and named Houston commander-in-chief. Lorenzo de Zavala, a Mexican federalist exile, became vice-president of the interim government, and José Antonio Navarro and José Francisco Ruiz of Béxar signed the declaration."
    facts:
      - [Siege of the Alamo, "23 February – 6 March 1836"]
      - [Texas declaration of independence, "2 March 1836"]
      - [Defenders of the Alamo, "about 180–260, almost all killed"]
      - [Mexican army in Texas, "some 6,000"]
