notes:
  - Dates here are Gregorian. Russian records give them in the Julian calendar, 12 days earlier (Tastobe 3 November 1837, Akbulak 30 June 1838).
  - The Bukey Horde, also called the Inner Horde, was founded in 1801, when Sultan Bukey and about 7,500 families of the Junior Zhuz were allowed to settle west of the Ural. The title of khan was abolished after Zhangir’s death in 1845.
  - Accounts differ on the course of the fighting and the numbers involved; some details of the rising are disputed.
