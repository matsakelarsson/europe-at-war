id: isatay-taimanuly-rebellion
name: Isatay Taimanuly’s rebellion
start: "1836-02"
end: "1838-07-12"
tier: C
summary: "A rising of the herders of the Bukey (Inner) Horde, the Kazakh khanate between the lower Volga and the Ural created under Russian protection in 1801, against Khan Zhangir and the Russian frontier authorities. The best land along the Bolshoy and Maly Uzen and around the Kamysh-Samar lakes had gone to Cossack settlements, the khan and his kinsmen and allies held most of the remaining pastures, the herders were barred from the Ural floodplain, and taxes and livestock losses were heavy. In February 1836 the elder Isatay Taimanuly and the poet Makhambet Utemisuly took the lead of scattered unrest, calling for the seizure of the khan’s and the Cossacks’ lands and herds. From 24 October to 6 November 1837 they besieged the khan’s headquarters (Khan Ordasy) for about two weeks, until troops arrived; Isatay then attacked a Russian detachment at Zhideli. On 15 November 1837 Ural and Astrakhan Cossacks and the khan’s men defeated the rebels at Tastobe. Part of the rebels broke through across the Ural into the lands of the Junior Zhuz, where Isatay’s following grew to 2,000–3,000 men by the spring of 1838, according to the military governor of Orenburg, Vasily Perovsky. On 12 July 1838 a Russian force defeated them on the Akbulak river, and Isatay was killed in the fighting. Makhambet, whose poems are classics of Kazakh literature, went on trying to raise support and was killed in October 1846 by a member of a detachment sent to capture him."
