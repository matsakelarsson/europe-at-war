notes:
  - "The Ndebele of Mzilikazi, also called the Matabele (the Sotho-Tswana name for them), are not the same people as the Southern Ndebele of the Transvaal. The numbers come mostly from trekker memoirs written years later, above all Sarel Cilliers’s, and differ between accounts: the Ndebele army at Vegkop is given as anything from about 3,000 to 6,000 men."
