id: matabele-boer-war
name: Matabele–Boer war
start: "1836-08"
end: "1837-11"
tier: C
summary: "The war between the Ndebele kingdom of Mzilikazi and the Voortrekkers, the emigrant Boers of the Great Trek, which ended Ndebele rule south of the Limpopo. In 1836 trekker parties crossed the Vaal into lands the Ndebele claimed, and in August Ndebele regiments attacked families camped near the river, among them most of the Liebenberg party, and carried off three children. On 16 October 1836 an Ndebele army of several thousand, sent by Mzilikazi under his general Mkalipi, attacked the laager of Hendrik Potgieter and Sarel Cilliers at Vegkop, near present-day Heilbron: about 40 men behind some 50 wagons beat off the assault, losing two killed against several hundred Ndebele dead, but the Ndebele drove off nearly all their livestock, about 5,000 cattle and 50,000 sheep and goats, and the laager survived on oxen sent by the Rolong chief Moroka of Thaba Nchu. On 17 January 1837 Potgieter and Gerrit Maritz, with about 100 Boers, Griqua and some 60 Rolong, surprised and burned Mosega in the Marico valley, killing several hundred people and taking 6,000 to 7,000 cattle; the American missionaries there left with the commando. A Zulu army sent by Dingane attacked the Ndebele in mid-1837, and in November 1837 Potgieter and Piet Uys, with several hundred men, fought a nine-day running campaign against Mzilikazi around his stronghold of eGabeni (Kapain) on the Marico. Early in 1838 Mzilikazi led his people north across the Limpopo; they settled in what is now western Zimbabwe, where he founded a new kingdom. Potgieter claimed the lands between the Vaal and the Limpopo by right of conquest, the start of the trekker settlements that became the South African Republic."
