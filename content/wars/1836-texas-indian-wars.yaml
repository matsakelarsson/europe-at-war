id: texas-indian-wars
name: Texas–Indian wars
start: "1836"
end: "1875-06-02"
tier: C
summary: "The wars between Texas, as a republic, a state of the United States and a Confederate state, and the Comanche, the Kiowa and other Native nations of Texas, from Texan independence to the surrender of the last free Comanche band in 1875. In May 1836 Comanche, Kiowa and allied fighters attacked Fort Parker and carried off five captives, among them the nine-year-old Cynthia Ann Parker. Sam Houston sought treaties, but his successor Mirabeau Lamar (1838–1841) made war: in July 1839 Texan forces drove the Cherokee and their allies out of East Texas, killing their leader Duwali (Chief Bowl) at the Neches. On 19 March 1840, at a peace council in the Council House at San Antonio, Texan officials tried to hold the Comanche delegation of the Penateka leader Muguara hostage for the return of captives; 35 Comanche, among them 12 leaders, and 7 Texans were killed, and the Comanche killed 13 of the captives they held in reply. In August Buffalo Hump (Potsanaquahip) led several hundred Comanche and Kiowa to the coast, sacking Victoria and burning Linnville, and on the way back Texan militia and Rangers attacked them at Plum Creek on 12 August; in October John Henry Moore’s volunteers destroyed a Comanche village on the upper Colorado River. Houston returned to treaty-making in 1843–1844. After annexation (1845) the United States built lines of forts and in 1854 a reservation on the Brazos, whose Caddo, Anadarko and Tonkawa scouts fought beside the Rangers at Antelope Hills in 1858, where the Comanche leader Iron Jacket was killed, but in 1859 attacks by Texan vigilantes forced the reservation peoples into Indian Territory. At Pease River in December 1860 Rangers attacked a Comanche camp and recaptured Cynthia Ann Parker, the mother of Quanah. During the Civil War Comanche and Kiowa raids, such as the Elm Creek raid of October 1864, pushed the line of settlement back by more than 160 km, and Kickapoo migrating to Mexico defeated Confederate Texans at Dove Creek in January 1865. After the war the Kiowa leaders Satanta, Satank and Big Tree attacked a wagon train on Salt Creek Prairie in May 1871, and Ranald Mackenzie’s cavalry began campaigning on the Llano Estacado; the Red River War of 1874–1875 ended with Quanah Parker’s Quahadi Comanche surrendering at Fort Sill on 2 June 1875."
