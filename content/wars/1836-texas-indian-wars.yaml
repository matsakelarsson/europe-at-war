notes:
  - The Lipan Apache and the Tonkawa often fought beside the Texans against the Comanche, and Caddo, Wichita, Kickapoo and Lipan bands fought on both sides at different times. The Comanche raids into Mexico are told in the Comanche–Mexico Wars, and the last campaign in the Red River War.
  - "Texan accounts call the deaths at Fort Parker a massacre and the Council House killings a fight; this entry calls the first an attack and the second the Council House Fight, the name the Handbook of Texas uses, and gives the numbers for both."
