  - title: Khan of the three zhuzes
    date: 1841–1845
    when: "1841-09"
    borders: "1844-08-14"
    countries: [kz, ru, uz]
    body:
      - In September 1841 representatives of the three zhuzes, meeting near the Turgai river, elected Kenesary khan. He ruled with a council of batyrs, biys and sultans, raised taxes on herds and harvests, organised his army in hundreds and thousands, banned feuding raids and encouraged farming to feed his men; the emir of Bukhara recognised him. In 1841 his forces turned south against the Khanate of Kokand, whose forts on the Syr Darya and the Karatau held the southern Kazakhs. They besieged Sozak, Zhanakorgan, Zhulek and Ak-Mechet and took several of them.
      - On 27 June 1843 Nicholas I approved a large expedition. A column under Lebedev, which grew to about 1,900 men, and a force of about 5,000 Cossacks and loyal Kazakhs under Colonel Bizyanov failed to bring Kenesary to battle. In February 1844 a raid on his camp on the Kengir rivers captured his wife Kunimzhan, but on the night of 20–21 July he destroyed the detachment of Sultan Akhmet Zhantorin, a Kazakh loyal to Russia, and on 14 August he attacked the Cossack settlement of Yekaterininskaya, burning its outskirts and taking captives. Russian columns closed in on him at the Mugodzhar hills on 22 August, but he slipped away. In 1845 he told Russian envoys he would accept Russian protection only if the forts were pulled down and the seized lands given back.
    facts:
      - [Kenesary elected khan, "September 1841"]
      - [Sultan Zhantorin’s detachment destroyed, "20–21 July 1844"]
      - [Kenesary’s army at its height, "about 20,000 men (1844–1845)"]
