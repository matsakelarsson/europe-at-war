notes:
  - Russian dates are Old Style (Julian), 12 days behind the Gregorian calendar; sources do not always say which they use.
  - Accounts of the rising come mostly from Russian military reports and from Kazakh historians, who call it a national liberation movement. The figures for Kenesary’s army (5,000 in 1841, about 20,000 at its height) and for the army that invaded Kyrgyz lands in 1847 (10,000–20,000) are rough.
  - Kenesary’s camps and raids moved across the whole steppe; the area on the map is only a rough guide to where his authority was recognised. Some accounts place the peace of August 1847 at Taldykorgan rather than Kopal.
