id: kenesary-rebellion
name: Kenesary’s rebellion
start: "1837"
end: "1847"
tier: B
summary: "The longest Kazakh rising against Russian rule, led by Kenesary Kasymov (Kenesary Kasymuly), a grandson of Ablai Khan, against the district administration that had replaced the khans of the Middle Zhuz in 1822 and against the Khanate of Kokand in the south. Kenesary burned the Russian fortress of Akmola in 1838, and in 1841 an assembly of the three zhuzes elected him khan. For a few years he ruled much of the central steppe, fought Kokand for the towns of the Syr Darya and the Karatau, and eluded the Russian columns and loyal Kazakh sultans sent against him; at its height his army numbered about 20,000. Pushed south-east by new forts and by sultans who went over to Russia, he invaded the lands of the northern Kyrgyz in 1847, was defeated by Ormon Khan near Tokmok, captured and put to death. His death opened Semirechye to the Russian advance. In Kazakhstan he is honoured as the last khan of the Kazakhs; in Kyrgyz tradition his invasion is remembered for the burning of auls and Ormon’s victory over him."
countries: [kz, kg, ru, uz]
