steps:
  - title: Akmola and the Turgai steppe
    date: 1837–1840
    when: "1837"
    borders: "1838-06-02"
    countries: [kz, ru]
    body:
      - The khans of the Junior and Middle Zhuz had sworn allegiance to Russia in 1731 and 1740, but the steppe went on governing itself until the Charter on the Siberian Kirghiz, drafted by Mikhail Speransky and signed in 1822, abolished the khan’s power in the Middle Zhuz. Its lands were divided into districts run from new outposts such as Kokshetau (1824), Karkaraly and Akmola, and Cossacks were settled on some of the best land. Kenesary’s family, the descendants of Ablai Khan, resisted. His brother Sarzhan was killed in 1836 on the orders of the Kokandi governor of Tashkent, until then the family’s ally, and his father Kasym in 1840.
      - In 1837 Kenesary’s men attacked a caravan from Petropavlovsk to Tashkent guarded by 55 Cossacks. In May 1838 about 2,000 of his horsemen besieged the fortress of Akmola, on the Ishim where Astana stands today. Archers shot burning arrows into it, and while the garrison fought the fires Kenesary’s batyrs broke in; the commandant, Ivan Karbyshev, and the senior sultan Konyrkulzha Kudaimendin escaped at night, and the fort burned. Kenesary then moved west into the Turgai steppe, where Zholaman batyr’s men joined him, and Russian columns with artillery went after him. In letters to the governor of Orenburg he asked for the forts to be removed and the seized lands returned.
    facts:
      - [Charter on the Siberian Kirghiz, "1822"]
      - [Siege of Akmola, "late May – early June 1838, Kazakh victory"]
      - [Kenesary’s force at Akmola, "about 2,000 men against about 500"]
