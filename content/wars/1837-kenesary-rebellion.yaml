  - title: Semirechye and Maitobe
    date: 1846–1847
    when: "1846"
    borders: "1847-04-01"
    countries: [kz, kg]
    body:
      - New Russian forts and the sultans who went over to Russia drove Kenesary out of the Middle Zhuz in 1846. A Russian force under General Vishnevsky, with Kazakh sultans, caught him by Lake Balkhash and penned him on a peninsula, but he broke out, and at the end of the year he held a hard-to-reach peninsula at the mouth of the Ili, from which he raided Kyrgyz lands. In June 1846 the sultans and biys of the Senior Zhuz swore allegiance to Russia, and in 1847 the fort of Kopal was built in Semirechye.
      - In April 1847 Kenesary invaded the Chüy valley with an army put at 10,000–20,000 men and camped at Maitobe near today’s Tokmok, to make the northern Kyrgyz submit; his men burned Kyrgyz auls. The Kyrgyz, led by Ormon Khan of the Sarybagysh, lit many campfires in the passes to look stronger than they were and then attacked. Sultans Rustem and Sypatai deserted Kenesary with much of the army, and the rest was driven into a marsh near Mykan and destroyed. Kenesary was captured with some thirty sultans and, after a few months in captivity, put to death; his head was sent to the Russian governor-general at Omsk. On 22 August 1847 Kyrgyz manaps and Senior Zhuz sultans made peace at Kopal, and Russia rewarded Ormon with a medal, a sabre and the rank of lieutenant colonel.
    facts:
      - [Battle of Maitobe, "April 1847, Kyrgyz victory"]
      - [Kenesary put to death, "1847"]
      - [Peace of Kopal, "22 August 1847"]
