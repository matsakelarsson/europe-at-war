id: oshio-heihachiro-rebellion
name: Ōshio Heihachirō’s rebellion
start: "1837-03-25"
end: "1837-05-01"
tier: C
summary: "A one-day rising in Osaka during the Tenpō famine, led by a former shogunate official. Ōshio Heihachirō had served as a police magistrate (yoriki) in the Osaka city administration and then taught the Neo-Confucian philosophy of Wang Yangming (Yōmeigaku), which held that knowledge must be put into action. After failed harvests from 1833 rice prices soared and people starved in the streets of Osaka, while rice merchants hoarded and the city magistrates shipped rice to Edo. Ōshio sold his books to feed the poor, trained his students and nearby villagers in arms and sent round a long manifesto calling for heaven’s punishment of corrupt officials and rich merchants. Betrayed by one of his followers, he struck early on 25 March 1837 (the 19th day of the second month of Tenpō 8): he set fire to his house in the Tenma quarter and led about 300 students, villagers and townspeople under a banner reading “Save the people” against the great merchant houses of Senba, among them the Mitsui and the Kōnoike, firing cannon and scattering money and rice. The magistrates’ troops dispersed the rebels within half a day, but the fire spread and burned for a day and a night. Japanese accounts say that about a fifth of the city burned, some 70,000 people lost their homes and at least 270 died; English accounts speak of more than 3,000 houses destroyed. Ōshio and his son hid for about forty days until they were found in a merchant’s house on 1 May 1837 and killed themselves, setting the house on fire. In 1838 nineteen of the rebels, among them Ōshio, most of them already dead and preserved in salt, were crucified. That an official of the shogunate had risen in its second city shook the regime, and smaller risings in his name followed, among them Ikuta Yorozu’s attack on the Kashiwazaki office in Echigo that summer."
