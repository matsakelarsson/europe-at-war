id: rebellions-of-1837-1838
name: Rebellions of 1837–1838
start: "1837-11-16"
end: "1838-12-04"
tier: B
summary: "Armed risings in the British colonies of Lower Canada (Quebec) and Upper Canada (Ontario) against their appointed governments. In Lower Canada the Parti patriote of Louis-Joseph Papineau, which held a large majority in the elected assembly, had demanded control of the colony’s revenues and an elected upper house in its Ninety-two Resolutions of 1834; when the British Parliament rejected them in the Russell Resolutions of March 1837, protest meetings turned into armed resistance. The Patriotes won at Saint-Denis on 23 November 1837 but were crushed at Saint-Charles and Saint-Eustache. In Upper Canada William Lyon Mackenzie led a smaller rising against the oligarchy known as the Family Compact, which was dispersed at Montgomery’s Tavern north of Toronto on 7 December. Exiled rebels and American sympathisers organised in the Hunters’ Lodges then raided the Canadas from the United States through 1838, and a second Patriote rising in November 1838 was defeated within a week. Twelve Patriotes were hanged in Montreal; in Upper Canada two leaders of the 1837 rising and a number of the raiders of 1838 were hanged; and some 150 prisoners were transported to Australia. Lord Durham’s report of 1839 led to the union of the two colonies as the Province of Canada in 1841, and in 1848 to responsible government."
countries: [ca, us]
