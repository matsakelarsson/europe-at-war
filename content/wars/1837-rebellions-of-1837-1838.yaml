  - title: The Hunters’ Lodges and the second rising
    date: February – December 1838
    when: "1838-11-09"
    borders: "1838-12-04"
    countries: [ca, us]
    body:
      - Exiled Patriotes and Upper Canadian rebels, with thousands of American sympathisers, organised secret societies along the border, the Hunters’ Lodges in the United States and the Frères chasseurs in Lower Canada, to invade the Canadas, while the US government tried with little success to enforce its neutrality. On 28 February 1838 Robert Nelson crossed the border at Caldwell’s Manor and proclaimed a republic of Lower Canada before retreating. Raiders who had occupied Pelee Island in Lake Erie were driven off by British regulars and militia on 3 March; in June a small band attacked at the Short Hills in the Niagara peninsula; and on 29 May raiders led by William Johnston burned the Canadian steamer Sir Robert Peel in the Thousand Islands.
      - In November 1838 the Frères chasseurs rose south of Montreal. Robert Nelson proclaimed independence again at Napierville on 4 November, and thousands of men gathered, but few had guns. Loyal volunteers beat them at Lacolle on 7 November and at Odelltown on 9 November, and Patriotes who had seized the seigneury of Beauharnois were dispersed on 10 November; Colborne’s troops and volunteers then burned farms and villages. From 12 November some 200 to 250 Hunters under Nils von Schoultz, a Finnish-born Swede, landed near Prescott, Upper Canada, and held a stone windmill until British artillery forced their surrender on 16 November; they lost about 20 killed and about 136 captured. On 4 December about 140 Hunters crossed from Detroit and attacked Windsor; about 25 of them were killed, and Colonel John Prince had four prisoners shot without trial.
      - "Courts martial in Montreal condemned 99 Patriotes to death; 12 were hanged, among them the Chevalier de Lorimier in February 1839, and 58 were transported to New South Wales. In Upper Canada von Schoultz and other Hunters were hanged, and some 90 prisoners, most of them Americans, were transported to Van Diemen’s Land (Tasmania). Lord Durham, sent to investigate, recommended in his report of 1839 the union of the two Canadas, with the aim of assimilating the French Canadians, and responsible government. The Act of Union of 1840 created the Province of Canada on 10 February 1841; responsible government came in 1848, and the transported men were pardoned in the 1840s."
    facts:
