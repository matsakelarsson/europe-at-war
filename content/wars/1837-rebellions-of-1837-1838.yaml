steps:
  - title: The Patriotes and the Richelieu
    date: November – December 1837
    when: "1837-11-23"
    borders: "1837-12-14"
    countries: [ca]
    view:
      center: [-73.50, 45.75]
      size: [130, 110]
    body:
      - "Lower Canada had an elected assembly but an appointed governor and councils that controlled the government and much of its money. The Parti patriote, led by Louis-Joseph Papineau, the speaker of the assembly, won over three-quarters of the vote in 1834 on its Ninety-two Resolutions, which demanded an elected legislative council and control of the budget. In March 1837 the British Parliament answered with Lord John Russell’s ten resolutions, which rejected the demands and let the governor spend public money without the assembly’s consent. Through the summer and autumn the Patriotes held mass meetings, boycotted British goods and, at the Assembly of the Six Counties at Saint-Charles on 23 October, called for resistance; their youth organised as the Fils de la Liberté."
      - After street fighting in Montreal on 6 November, the government issued warrants for the Patriote leaders, and Papineau left the city for the Richelieu valley. On 16 November Patriotes freed prisoners from a cavalry escort near Longueuil. Colonel Charles Gore marched from Sorel with about 300 regulars to make arrests at Saint-Denis, where on 23 November some 800 men under Wolfred Nelson, about half of them armed, defended a stone house and the village; after a day’s fighting Gore withdrew, leaving his cannon. About a dozen Patriotes and six soldiers were killed. Two days later Lieutenant Colonel George Wetherall, coming from Chambly with some 400 regulars and two guns, stormed the Patriote camp at Saint-Charles, defended by 200 to 250 men under Thomas Storrow Brown; 56 Patriotes and three soldiers were killed. Papineau, Nelson’s brother Robert and other leaders fled to the United States, and Wolfred Nelson was captured.
      - Martial law was declared in the district of Montreal on 5 December. North of the city, in the county of Deux-Montagnes, the Patriotes under Jean-Olivier Chénier gathered at Saint-Eustache. On 14 December Sir John Colborne, the commander of the British forces, attacked with some 1,500 regulars and volunteers and artillery. About 200 Patriotes held the church; the troops set fire to it, and those who jumped from the windows were shot. Some 70 Patriotes were killed, among them Chénier, and about 120 captured; three soldiers died. The next day the village of Saint-Benoît surrendered and was burned by loyal volunteers, and much of Saint-Eustache burned too.
