  - title: Montgomery’s Tavern and Navy Island
    date: December 1837 – January 1838
    when: "1837-12-07"
    borders: "1837-12-29"
    countries: [ca, us]
    body:
      - In Upper Canada power lay with the lieutenant governor, Sir Francis Bond Head, and a network of officials, merchants and Anglican clergy whom reformers called the Family Compact. After the elections of 1836, which the reformers lost amid violence and Head’s open campaigning, and a financial crisis in 1837, the radical journalist William Lyon Mackenzie decided on revolution. With most British troops sent to Lower Canada, he planned to seize Toronto’s arms and the government on 7 December, with Samuel Lount and Anthony Anderson as commanders, but the rising was brought forward and fell into confusion. On 4 December Anderson was shot dead by a loyalist he had captured, and a loyalist, Robert Moodie, was killed at the rebels’ roadblock on Yonge Street. On 5 December a few hundred rebels marching on the city scattered after an exchange of shots with a small loyalist picket.
      - On 7 December some 1,000 to 1,200 militia and volunteers, under Colonel James FitzGibbon and Allan MacNab, marched up Yonge Street with two cannon against the rebels at Montgomery’s Tavern, of whom only about 200 were armed. The rebels broke after a short fight, and the tavern was burned. Mackenzie fled to the United States, and Lount and Peter Matthews were captured and hanged in Toronto on 12 April 1838. In the London District Charles Duncombe raised some 400 to 500 men, who dispersed at Scotland on 14 December as MacNab approached.
      - In mid-December Mackenzie and about 200 supporters, mostly Americans, proclaimed a Republic of Canada on Navy Island, in the Niagara River on the British side. Volunteers and supplies came across from New York in the American steamer Caroline. On the night of 29 December a party of Canadian militia under Commander Andrew Drew crossed to Fort Schlosser on the American bank, seized the Caroline, set it on fire and sent it adrift; an American, Amos Durfee, was killed. The raid caused an uproar in the United States. Under bombardment the rebels left Navy Island on 13–14 January 1838, and Mackenzie was jailed in the United States for breaking its neutrality laws.
