notes:
  - The risings are called the Rebellions of 1837–1838 in English and the rébellion des Patriotes in Quebec, where the Journée nationale des patriotes is a public holiday. The Patriotes were mostly French-speaking but included English-speaking leaders such as Wolfred and Robert Nelson and Thomas Storrow Brown; many English-speaking colonists and some French Canadians fought for the government.
  - "Sources differ on the numbers in the risings and the losses. Figures here are those of the standard accounts and are rounded."
