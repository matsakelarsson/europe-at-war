  - title: The assault, Kharg and the retreat
    date: June – September 1838
    when: "1838-06-24"
    borders: "1838-09-09"
    countries: [af, ir]
    body:
      - In the spring of 1838 McNeill came to the shah’s camp and persuaded him to put off a planned assault, but Simonich, who had arrived at the same time, gained the upper hand and in June McNeill left for Tehran. On 24 June the Iranians attacked at five points and broke into the south-eastern corner of the walls. For about an hour the breach was fought over; according to British accounts Pottinger drove the wavering Yar Mohammad forward, and the defenders threw the attackers back.
      - Britain, unable to send an army across Afghanistan, sent ships from Bombay into the Gulf, and on 19 June 1838 troops occupied Kharg Island off Bushehr. On 11 August a British officer, Charles Stoddart, delivered McNeill’s warning to the shah that an attack on Herat would mean war with Britain. Russia, anxious about the British reaction, recalled Simonich and his colleague Vitkevich, saying that they had exceeded their instructions. On 9 September 1838 Mohammad Shah raised the siege and marched home. Herat had lost Farah and Sabzawar to the ruler of Kandahar, Kohandil Khan, who had come to terms with the shah during the siege. The threat that had justified British plans was gone, but within weeks Britain announced its invasion of Afghanistan.
    facts:
      - [General assault on Herat, "24 June 1838, repulsed"]
      - [Kharg Island occupied, "19 June 1838"]
      - [Siege lifted, "9 September 1838"]
    markers:
