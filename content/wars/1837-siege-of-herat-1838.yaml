notes:
  - Persian sources call the siege the First Herat War. Several of its dates differ by a day or two between accounts (the start of the siege is given as 23 or 24 November 1837).
  - British accounts, beginning with John Kaye’s, give Pottinger the main credit for the defence; modern historians also stress Yar Mohammad Khan and the tribal confederacy that harried the Iranian flanks.
