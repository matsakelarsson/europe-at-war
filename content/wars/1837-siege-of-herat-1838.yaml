steps:
  - title: Ghurian and the siege
    date: July 1837 – May 1838
    when: "1837-11-23"
    borders: "1837-11-23"
    countries: [af, ir]
    body:
      - Mohammad Shah left Tehran in July 1837 and gathered his army at Torbat-e Jam at the end of October. He hoped to take Herat and from there extend Iranian influence to the Amu Darya; the Russian envoy, Count Simonich, encouraged him, while the British minister, John McNeill, warned against it, since Britain regarded Herat as a gateway to India. An advance force of 8,000 men attacked the frontier fort of Ghurian, and after a week of bombardment its commander, Yar Mohammad’s brother Shir Mohammad Khan, submitted in mid-November.
      - The shah arrived before Herat on 23 November 1837. Kamran Shah and Yar Mohammad had repaired the walls, and Eldred Pottinger, an Indian Army officer who had entered the city in disguise that August, became one of their advisers. The Iranians dug trenches towards the walls but did not close the ring. On their flank, a confederacy of Aimaq, Hazara, Uzbek and Turkmen tribes gathered by Sher Mohammad Khan Hazara of Qala-e Naw harassed them; the governor of Khorasan, Asef al-Dowleh, took Qala-e Naw but was ambushed in the snowbound valleys of the Murghab. The winter, short supplies and disease wore down both the besiegers and the town, which drove out hundreds of old men, women and children to save food.
    facts:
      - [Ghurian surrenders, "13–15 November 1837"]
      - [Siege of Herat begins, "23 November 1837"]
      - [Qala-e Naw taken by Asef al-Dowleh, "late 1837"]
