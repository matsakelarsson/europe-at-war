id: siege-of-herat-1838
name: Siege of Herat
start: "1837-07"
end: "1838-09-09"
tier: B
summary: "Mohammad Shah Qajar’s attempt to take Herat, held since 1818 by the last Sadozai prince, Kamran Shah, and his vizier Yar Mohammad Khan Alakozai. Iran regarded Herat as part of Khorasan, and Herati and Turkmen raids had laid waste the frontier. Encouraged by the Russian envoy Count Simonich and opposed by the British, the shah took the fort of Ghurian and besieged Herat from November 1837. The city, helped by a young British officer, Eldred Pottinger, and by a Sunni confederacy of Aimaq, Hazara, Uzbek and Turkmen tribes, held out for ten months and beat off a general assault on 24 June 1838. Britain occupied Kharg Island in the Gulf and threatened war, and on 9 September 1838 the shah lifted the siege. The crisis was the immediate occasion of the First Anglo-Afghan War."
