name: Aroostook War
start: "1838"
end: "1839-03"
tier: C
summary: "A bloodless confrontation of 1838–1839 between the US state of Maine and the British colony of New Brunswick over the forests of the Aroostook valley, also called the Pork and Beans War. The Treaty of Paris of 1783 had left the boundary between Maine and British North America unclear, and both sides claimed some 12,000 square miles of timberland. In 1831 the King of the Netherlands, asked to arbitrate, proposed a compromise line that Britain accepted but the United States, under pressure from Maine, rejected. In the winter of 1838–1839 lumbermen from New Brunswick were cutting timber in the disputed valley, and Maine sent a posse under its land agent Rufus McIntire to drive them out; in February 1839 New Brunswick lumbermen seized McIntire and carried him to Woodstock. Both sides called out troops: Maine raised thousands of militia and began Fort Fairfield, New Brunswick and Nova Scotia mobilised theirs and British regulars moved up, and the US Congress authorised 50,000 men and $10 million. President Martin Van Buren sent General Winfield Scott, who in March 1839 arranged a truce with New Brunswick’s lieutenant governor, Sir John Harvey, under which both sides withdrew while the dispute was negotiated. There was no fighting; about 38 militiamen died of disease and accidents. The Webster–Ashburton Treaty of 9 August 1842 drew the boundary, giving the United States about 7,000 square miles and Britain about 5,000, including the route between New Brunswick and Quebec."
