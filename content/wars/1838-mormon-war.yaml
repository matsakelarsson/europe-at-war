id: mormon-war
name: Mormon War
start: "1838-08-06"
end: "1838-11-01"
tier: C
summary: "A conflict in northern Missouri in 1838 between members of the Church of Jesus Christ of Latter Day Saints led by Joseph Smith and their non-Mormon neighbours, the state militia and the state government. Driven out of Jackson County in 1833, the Latter Day Saints had been given Caldwell County as a refuge in 1836, but as thousands more arrived from Ohio in 1838 they settled in neighbouring Daviess and Carroll counties, where the older inhabitants feared their numbers, their votes and their opposition to slavery. A brawl at the polls in Gallatin on 6 August began months of violence. Vigilantes besieged the Mormon town of DeWitt until it was abandoned on 11 October; armed Mormons, among them the secret society of the Danites, then raided Gallatin and Millport, burning homes and stores and driving out non-Mormon families. On 25 October a Mormon force attacked a militia company at Crooked River, where Apostle David W. Patten and two others were killed. Governor Lilburn Boggs then issued Executive Order 44, declaring that the Mormons “must be treated as enemies, and must be exterminated or driven from the State if necessary for the public peace”. On 30 October some 240 militiamen and vigilantes attacked the settlement at Haun’s Mill and killed 17 Latter Day Saints, among them two boys aged ten and nine, in what is known as the Haun’s Mill massacre. Surrounded at Far West by some 2,500 militia, the Mormon leaders surrendered on 1 November; a court martial sentenced Joseph Smith to death, but General Alexander Doniphan refused to carry out the order, and Smith was held in Liberty Jail until April 1839, when he and the other prisoners escaped while being moved to another county. About 22 people were killed in all. Some 10,000 Latter Day Saints were expelled from Missouri in the winter of 1838–1839 and founded Nauvoo in Illinois. Executive Order 44 was formally rescinded by Governor Kit Bond in 1976."
