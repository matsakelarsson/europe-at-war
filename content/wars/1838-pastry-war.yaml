id: pastry-war
name: Pastry War
start: "1838-04-16"
end: "1839-03-09"
tier: C
summary: "A French blockade and attack on Mexico in 1838–1839 to force payment of claims by French citizens. Among the claims was one from a French pastry cook, Remontel, whose shop at Tacubaya near Mexico City had been looted by soldiers in 1828, which gave the war its name; France demanded 600,000 pesos in all, as well as trade privileges, after years of unpaid damages from Mexico’s civil wars. When Mexico refused, a French squadron blockaded the Gulf ports from April 1838. On 27 November 1838 ships under Rear Admiral Charles Baudin bombarded the island fortress of San Juan de Ulúa off Veracruz, which surrendered the next day, and Mexico declared war. On 5 December French troops landed at Veracruz to seize the Mexican commander; Antonio López de Santa Anna, back from disgrace after the loss of Texas, led the defence and drove them back to their boats, losing his left leg to grapeshot, and used the episode to restore his reputation. Britain, whose trade suffered from the blockade, mediated, and by the treaty of 9 March 1839 Mexico agreed to pay the 600,000 pesos and France returned the fortress. In 1861 French claims against Mexico again led to war, the French intervention."
