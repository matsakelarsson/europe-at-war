id: voortrekker-zulu-war
name: Voortrekker–Zulu war
start: "1838-02-06"
end: "1840-02"
tier: B
summary: "The war between the Zulu kingdom of Dingane and the Voortrekkers, the emigrant Boers of the Great Trek who crossed the Drakensberg into Natal in 1837. Their leader Piet Retief negotiated with Dingane for land south of the Thukela; on 6 February 1838 Dingane had Retief and about 100 of his party killed at his capital, uMgungundlovu, and his regiments then attacked the trekker camps along the Bushmans and Bloukrans rivers, killing over 500 men, women, children and servants. In April a Boer commando was beaten at Italeni and a force from Port Natal destroyed on the Thukela. In December 1838 a new commando under Andries Pretorius defeated the Zulu army at the Ncome River, the battle Afrikaners called Blood River, and burned out uMgungundlovu. The trekkers founded the Republic of Natalia, and in 1839 Dingane’s half-brother Mpande crossed into Natal with his followers and allied with them. In January 1840 Mpande’s army defeated Dingane at the Maqongqo hills; Dingane fled and was killed, and Pretorius proclaimed Mpande king of the Zulu, who ruled until 1872 as Natalia’s and then Britain’s neighbour."
countries: [za]
