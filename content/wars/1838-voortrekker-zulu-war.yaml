  - title: Mpande and the fall of Dingane
    date: 1839–1840
    when: "1840-01-29"
    borders: "1840-01-29"
    countries: [za, sz]
    body:
      - In March 1839 Dingane made peace with the trekkers, promising to return cattle and guns and to leave them the land south of the Thukela, where they founded the Republic of Natalia, with its capital at Pietermaritzburg. Dingane tried to rebuild his strength by expanding north against the Swazi and was beaten. In September 1839 his half-brother Mpande, fearing for his life, crossed the Thukela into Natal with some 17,000 followers and their cattle, and in October he made an alliance with the Natalia Volksraad.
      - In January 1840 Pretorius led a commando into Zululand alongside Mpande’s army, commanded by Nongalaza kaNondela. The Boers tried and shot two of Dingane’s envoys, Nzobo (Dambuza) and Khambazana, whom they held responsible for Retief’s death. On 29 January 1840, before the commando arrived, Nongalaza’s army met Dingane’s under Ndlela at the Maqongqo hills near present-day Magudu, about 5,000 men on each side, and after hard fighting, in which many of Dingane’s men went over to Mpande, Dingane’s army gave way. Dingane had Ndlela executed and fled north into the Lubombo mountains, where he was killed by Swazi and Nyawo men soon afterwards.
      - On 10 February 1840 Pretorius proclaimed Mpande king of the Zulu, and on 14 February he declared a border for Natalia far to the north of the Thukela, which the republic never occupied; the Boers drove home about 36,000 cattle. Mpande ruled the Zulu kingdom until his death in 1872, keeping peace with Natalia and, after 1843, with British Natal.
    facts:
      - [Mpande crosses into Natal, "September 1839"]
      - [Battle of Maqongqo, "29 January 1840"]
      - [Mpande proclaimed king, "10 February 1840"]
