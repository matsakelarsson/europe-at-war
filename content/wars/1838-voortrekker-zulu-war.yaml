  - title: Blood River
    date: November – December 1838
    when: "1838-12-16"
    borders: "1838-12-16"
    countries: [za]
    body:
      - In November 1838 Andries Pretorius, a farmer from Graaff-Reinet, arrived in Natal and was given command of a new commando of 464 men with 64 wagons, two small cannon and about 200 servants and followers, joined by Alexander Biggar with some Port Natal Africans. On the march the commando made a vow that if God gave them victory they would keep the day holy and build a church.
      - On 15 December Pretorius formed a laager of wagons beside the Ncome River, protected by the river’s deep pools on one side and a dry gully on another. At dawn on 16 December the Zulu army, estimated at anywhere from about 10,000 to 30,000 men, under Ndlela kaSompisi and Nzobo (Dambuza), attacked the laager in waves and was cut down by musket and cannon fire. When the attacks faltered, Boer horsemen rode out and pursued the Zulu for hours. The Boers counted more than 3,000 Zulu dead, a figure some historians consider inflated; three Boers were wounded, Pretorius among them. The trekkers called the river Bloedrivier, Blood River.
      - Pretorius marched on uMgungundlovu, which Dingane had set on fire and abandoned. On the hill of kwaMatiwane his men buried the remains of Retief’s party on 21 December and, they said, found the deed of cession in Retief’s pouch. On 27 December a Boer patrol pursuing Dingane’s cattle down the Opathe gorge towards the White Mfolozi was ambushed and fought its way out with losses, Alexander Biggar among the dead, and the commando returned to Natal.
    facts:
      - [Boer commando, "464 men, 64 wagons"]
      - [Battle of Blood River (Ncome), "16 December 1838"]
      - [Zulu dead, "more than 3,000, by the Boers’ count"]
