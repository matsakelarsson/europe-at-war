notes:
  - "Most accounts come from the trekkers and from British and missionary witnesses, such as the missionary Francis Owen, who saw Retief’s party led away. Why Dingane ordered the killings is debated: the Boers’ victories over Mzilikazi with guns and horses, their keeping of the guns and horses taken from the Tlokwa chief Sekonyela, and their occupation of land before any agreement are among the reasons given. The deed of cession Pretorius’s men said they found with Retief’s body has been both accepted and doubted."
  - "The Boers commemorated Blood River on 16 December as Dingaan’s Day and later the Day of the Vow; since 1995 it has been South Africa’s Day of Reconciliation. The Ncome Museum across the river remembers the Zulu dead."
