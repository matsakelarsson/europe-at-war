steps:
  - title: Retief, Weenen and the Zulu offensive
    date: February – August 1838
    when: "1838-02-06"
    borders: "1838-02-17"
    countries: [za]
    body:
      - In October 1837 Piet Retief led the first trekker wagons over the Drakensberg into Natal and rode to uMgungundlovu to ask Dingane for the land between the Thukela and the Mzimvubu. Dingane set a condition, that the trekkers recover cattle taken from him by the Tlokwa chief Sekonyela; Retief did so by a trick, handcuffing Sekonyela until he gave up some 700 cattle, but kept the guns and horses he also took. Meanwhile hundreds of trekker families came down the passes and camped along the Bushmans and Bloukrans rivers without waiting for an agreement.
      - Retief returned to uMgungundlovu with about 70 men and some 30 servants to deliver the cattle. On 6 February 1838, after Dingane had put his mark on a deed of cession, his men seized the whole party during a farewell dance and clubbed them to death on the hill of kwaMatiwane outside the capital; Retief, who had watched his son killed, died last. Within days Zulu regiments fell on the trekker camps. In the night of 16–17 February they killed 41 men, 56 women and 185 children of the trekkers and about 250 of their Khoikhoi and Basotho servants; the camps that had time to form wagon laagers held out. The place was later named Weenen, “weeping”.
      - In April a commando of about 350 men under Piet Uys and Hendrik Potgieter rode against Dingane and was drawn into an ambush at Italeni, near uMgungundlovu; Uys and his young son Dirkie were among the ten killed. On 17 April a force of Port Natal settlers and their African followers under Robert Biggar crossed the lower Thukela and was almost wiped out at Ndondakusuka by a Zulu army under Mpande and Nongalaza, and the Zulu then sacked Port Natal, whose people took refuge on a ship in the bay. In mid-August a large Zulu attack under Ndlela on the trekkers’ main laager on the Bushmans River, afterwards called the Veglaer (“fighting laager”), was beaten off.
    facts:
      - [Retief killed, "6 February 1838"]
      - [Bloukrans and Bushmans river camps attacked, "16–17 February 1838"]
      - [Dead in the camps, "about 530, servants included"]
      - [Italeni, "9 or 11 April 1838"]
