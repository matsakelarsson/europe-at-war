  - title: The Oriental Crisis and Acre
    date: July 1840 – June 1841
    when: "1840-07-15"
    borders: "1840-11-27"
    countries: [lb, sy, il, ps, eg, tr, gr, gb, at]
    body:
      - By the Convention of London of 15 July 1840 Britain, Austria, Prussia and Russia agreed with the Ottomans to offer Muhammad Ali hereditary rule of Egypt and lifelong rule of southern Syria if he accepted within ten days, and to force him out if he did not. Counting on France, which had been left out and talked of war, he refused. In Lebanon, Druze and Maronite mountaineers had already risen against Egyptian conscription and disarmament. In September British, Austrian and Ottoman ships under Admiral Robert Stopford bombarded Beirut and landed troops at Jounieh. Commodore Charles Napier took Sidon, the Egyptians abandoned Beirut on 3 October, and Ibrahim’s troops were beaten in the hills at Boharsef.
      - On 3 November the fleet bombarded Acre. A shell blew up the main magazine, killing about 1,100 men, and the garrison left that night; the British lost 18 killed. Napier sailed on to Alexandria and on 27 November, on his own authority, agreed a convention with Muhammad Ali. Ibrahim’s army marched back to Egypt through Syria that winter, losing many men. Firmans of 1841 gave Muhammad Ali and his heirs hereditary rule of Egypt under Ottoman sovereignty and limited his army to 18,000 men; he gave up Syria, Adana, Crete and the Hijaz and returned the Ottoman fleet.
    facts:
      - [Convention of London, "15 July 1840"]
      - [Bombardment of Acre, "3 November 1840, allied victory"]
      - [Convention of Alexandria, "27 November 1840"]
