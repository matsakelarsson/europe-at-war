steps:
  - title: Nezib
    date: April – July 1839
    when: "1839-04"
    borders: "1839-06-24"
    countries: [tr, sy, eg]
    body:
      - Neither side accepted the settlement of 1833 as final. Muhammad Ali wanted his rule over Egypt and Syria made hereditary and spoke openly of independence, while Mahmud II rebuilt his army with the help of Prussian officers, among them Captain Helmuth von Moltke, the future chief of the Prussian general staff. In April 1839 an Ottoman army under Hafiz Mehmed Pasha crossed the Euphrates at Birecik into Egyptian-held Syria. Ibrahim Pasha marched north from Aleppo to meet it, with the former French officer Soliman Pasha commanding his right wing.
      - Hafiz had been ordered to wait in strong positions, and Moltke urged him to attack or move, but he did neither. Ibrahim marched round the Ottoman camp, forcing Hafiz to turn his army about overnight, and on 24 June near Nezib the Egyptian artillery and infantry broke it. The Ottomans fled, leaving their guns and thousands of prisoners. Mahmud II died on 1 July, leaving the throne to his 16-year-old son Abdülmecid I, and in July the Kapudan Pasha, Ahmed Fevzi, sailed the Ottoman fleet to Alexandria and handed it over to Muhammad Ali.
    facts:
      - [Battle of Nezib, "24 June 1839, Egyptian victory"]
      - [Death of Mahmud II, 1 July 1839]
      - [Ottoman fleet goes over to Egypt, July 1839]
