notes:
  - Also called the Second Syrian War or the Second Turko-Egyptian War. Prussia and Russia signed the Convention of London of 1840 but took no part in the fighting; France, which had backed Muhammad Ali, was left out of it, and the crisis brought it close to war with the other powers.
