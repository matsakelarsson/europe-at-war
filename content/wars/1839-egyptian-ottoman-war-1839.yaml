id: egyptian-ottoman-war-1839
name: Egyptian–Ottoman War of 1839–1841
start: "1839-04"
end: "1841-06"
tier: B
summary: A second war between Muhammad Ali’s Egypt and the Ottoman Empire, opened by Sultan Mahmud II to win back Syria. Ibrahim Pasha routed the Ottoman army at Nezib in 1839 and the Ottoman fleet went over to Egypt, but Britain, Austria, Prussia and Russia took the Sultan’s side; British and Austrian ships took Beirut, Sidon and Acre in 1840, and Muhammad Ali gave up Syria, Adana and Crete in return for hereditary rule of Egypt.
countries: [eg, tr, sy, lb, il, ps, gr, gb, at]
