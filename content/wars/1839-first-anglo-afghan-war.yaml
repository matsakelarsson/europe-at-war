id: first-anglo-afghan-war
name: First Anglo-Afghan War
start: "1838-10-01"
end: "1842-12"
tier: A
summary: "The British East India Company’s invasion of Afghanistan to replace the Barakzai emir of Kabul, Dost Mohammad Khan, with the exiled Sadozai king Shah Shuja, whom it believed would keep Russian and Persian influence away from India. The Army of the Indus took Kandahar, stormed Ghazni and entered Kabul in 1839, and Dost Mohammad surrendered in 1840. But Shah Shuja’s rule depended on British bayonets and subsidies, and in November 1841 Kabul rose. The British envoy was killed, and in January 1842 the Kabul garrison of about 4,500 soldiers and 12,000 camp followers was destroyed on its retreat through the snowbound passes; only a handful reached Jalalabad. In 1842 two British armies fought their way back to Kabul, freed the hostages and destroyed much of the city and nearby towns before withdrawing. Shah Shuja had been killed, and Dost Mohammad returned to rule until 1863."
countries: [af, pk, in]
sides:
  - id: gb
    name: British India and Shah Shuja
    polities: [united-kingdom]
    ink: red
    moves: British and allied moves
    success: British success
  - id: afg
    name: Dost Mohammad Khan and the Afghan resistance
    polities: [afghanistan]
    ink: green
    moves: Afghan moves
    success: Afghan success
notes:
  - The invading army belonged to the East India Company, which ruled British India; it was made up of Company regiments (Indian sepoys with British officers), British Army regiments serving in India and Shah Shuja’s own levies. The Sikh Empire of Ranjit Singh was an ally under the Tripartite Treaty of 1838 and sent troops through the Khyber in 1839.
  - Contemporary British accounts, above all the diaries of Lady Sale and the history by John Kaye, dominate the record. Afghan losses are not known.
  - Place names are given in today’s forms (Jalalabad for the British “Jellalabad”, Ghazni for “Ghuznee”).
