  - title: The Army of Retribution
    date: August – December 1842
    when: "1842-09-15"
    borders: "1842-09-15"
    countries: [af, pk, in]
    body:
      - Ellenborough let his generals withdraw “by way of” Kabul. Pollock left Jalalabad on 20 August, passing the bones of Elphinstone’s army, beat the Ghilzais at Jagdalak on 8 September and Akbar Khan’s main force at Tezin on 13 September, and entered Kabul on 15 September. Nott marched from Kandahar in early August, defeated an Afghan army near Ghazni, retook the town on 6 September and pulled down its citadel, carrying off a pair of gates that Ellenborough wrongly believed had been looted from the Hindu temple of Somnath. He reached Kabul on 17 September. Most of the hostages, held at Bamyan, bribed their guard and were met by a British detachment on their way back.
      - Before leaving, the British blew up Kabul’s great covered bazaar, and a column under General John McCaskill sacked the town of Istalif in the Koh-i Daman, where many people were killed. Contemporaries, among them British officers, recorded the killing of civilians and destruction of villages along the line of march. The armies left Kabul on 12 October and were received at Ferozepur in December. Dost Mohammad was released, returned to Kabul in 1843 and ruled until his death in 1863, allied with Britain from 1855. The war had cost the Company many millions of pounds and, in the retreat alone, most of the 16,500 soldiers and camp followers who left Kabul; Afghan losses are unknown.
    facts:
      - [Battle of Tezin, "13 September 1842, British victory"]
      - [Pollock enters Kabul, "15 September 1842"]
      - [Ghazni retaken by Nott, "6 September 1842"]
      - [Kabul evacuated, "12 October 1842"]
    markers:
      - kind: battle
        side: gb
        name: Tezin
        date: 13 September 1842
        text: Akbar Khan’s last attempt to stop Pollock, defeated in the passes east of Kabul.
        lonlat: [69.580, 34.380]
        lp: b
      - kind: taken
        side: gb
        name: Kabul
        date: 15 September 1842
        text: Pollock raised the British flag over the Bala Hissar. Before leaving, his troops destroyed the covered bazaar where Macnaghten’s body had been displayed.
        lonlat: [69.192, 34.506]
      - kind: taken
        side: gb
        name: Ghazni
        date: 6 September 1842
        text: Retaken by Nott after a battle outside the town. The citadel was blown up.
        lonlat: [68.423, 33.549]
      - kind: taken
        side: gb
        name: Istalif
        date: 29 September 1842
        text: A prosperous town where Afghans from Kabul had taken refuge with their families. It was stormed, plundered and burnt.
        lonlat: [69.077, 34.833]
        lp: l
      - kind: event
        name: Bamyan
        date: September 1842
        text: The British hostages had been moved here. They bought their freedom from their guard and were met on the road by a British cavalry detachment.
        lonlat: [67.817, 34.817]
