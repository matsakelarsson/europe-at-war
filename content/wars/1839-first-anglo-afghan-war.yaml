steps:
  - title: The Army of the Indus
    date: October 1838 – May 1839
    when: "1838-10-01"
    borders: "1839-04-25"
    countries: [af, pk, in]
    body:
      - Dost Mohammad Khan, emir of Kabul since 1826, wanted above all to win back Peshawar, which the Sikh ruler Ranjit Singh had taken in 1834. When the British would not help him and a Russian envoy, Yan Vitkevich, appeared in Kabul, the Governor-General of India, Lord Auckland, decided to replace him with Shah Shuja, the Sadozai king who had been driven out in 1809 and had lived on a British pension at Ludhiana since 1818. In June 1838 Britain, Ranjit Singh and Shah Shuja signed the Tripartite Treaty, and on 1 October Auckland’s Simla Manifesto announced the invasion. The Persian siege of Herat, its main justification, was lifted a few weeks earlier.
      - Because Ranjit Singh would not let the army cross the Punjab, the Army of the Indus took the long way through Sindh. About 15,000 troops of the Bengal and Bombay armies under Sir John Keane, with some 6,000 levies raised for Shah Shuja, set out in December 1838 with about 38,000 camp followers and 30,000 camels. They crossed the Indus, struggled through the Bolan Pass in March 1839, losing many animals to heat and Baluch raiders, and reached Quetta. On 25 April the army entered Kandahar unopposed; its Barakzai rulers had fled to Persia. Shah Shuja was proclaimed king there on 8 May.
    facts:
      - [Simla Manifesto, "1 October 1838"]
      - [Army of the Indus, "about 21,000 troops, including Shah Shuja’s levies"]
      - [Kandahar entered, "25 April 1839"]
