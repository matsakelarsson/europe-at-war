  - title: The retreat from Kabul
    date: 6–13 January 1842
    when: "1842-01-06"
    borders: "1842-01-13"
    countries: [af]
    body:
      - On 1 January 1842 Elphinstone agreed to leave Afghanistan in return for a promise of safe conduct to Jalalabad, some 140 km away. On 6 January about 4,500 soldiers, some 690 of them European, and more than 12,000 camp followers, Indian servants, wives and children, marched out into deep snow. There was no escort and little food or fuel. Ghilzai tribesmen attacked from the first day, and in the narrow Khurd Kabul pass on 8 January thousands were killed or froze. On 9 January Akbar Khan took the British wives, children and married officers as hostages, and on 12 January Elphinstone himself; most of the hostages survived, though Elphinstone died in captivity in April.
      - The column was cut to pieces at Tezin and Jagdalak. On the morning of 13 January the last organised group, some twenty officers and forty-five men of the 44th Foot, made a stand on a hill near Gandamak and was overwhelmed; a few were taken prisoner. That afternoon an army surgeon, William Brydon, rode into Jalalabad on a wounded pony. He was not quite the only survivor, for besides the hostages and prisoners, some sepoys and camp followers were enslaved or hid in the villages and came back later. But the army had ceased to exist.
    facts:
      - [Leaving Kabul, "6 January 1842"]
      - [Khurd Kabul pass, "8 January 1842"]
      - [Last stand at Gandamak, "13 January 1842"]
      - [Losses, "about 4,500 soldiers and most of 12,000 camp followers killed, captured or missing"]
    markers:
