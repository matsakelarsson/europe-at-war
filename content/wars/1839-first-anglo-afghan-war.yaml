        date: 6 March 1842
        text: The garrison of Indian sepoys and a few British officers surrendered after a siege of three months; the officers were held as prisoners.
        lonlat: [68.423, 33.549]
      - kind: event
        side: afg
        name: Kabul
        date: 5 April 1842
        text: Shah Shuja was killed outside the Bala Hissar. His son Fath Jang briefly held the city.
        lonlat: [69.192, 34.506]
      - kind: taken
        side: gb
        name: Khyber Pass
        date: 5 April 1842
        text: Pollock seized the heights on both sides with light infantry and pushed his army through to Ali Masjid.
        lonlat: [71.112, 34.110]
        lp: b
      - kind: held
        side: gb
        name: Kandahar
        date: 1842
        text: Nott’s garrison beat off attacks on the city and fought several battles in the surrounding country through the winter and spring.
        lonlat: [65.716, 31.621]
