  - title: Jalalabad, Kandahar and Ghazni
    date: January – April 1842
    when: "1842-04-07"
    borders: "1842-04-16"
    countries: [af, pk]
    body:
      - Akbar Khan besieged Jalalabad, whose walls were shaken down by an earthquake on 19 February 1842 and rebuilt by the garrison. On 7 April Sale’s men sallied out and routed Akbar Khan’s army in its camp. Ghazni was less fortunate. Its sepoy garrison, short of water in the citadel, surrendered on 6 March, and many of the soldiers were killed after giving up their arms. In the south, Nott held Kandahar and the small fort of Qalat-i Ghilzai held out until relieved in May.
      - In Kabul, Shah Shuja kept his throne for three months. On 5 April 1842, as he left the Bala Hissar to join the chiefs’ army against Jalalabad, he was shot dead by the men of Shuja al-Daula, son of a Barakzai chief. On the same day General George Pollock, with a new army from India, forced the Khyber Pass, and on 16 April he reached Jalalabad. A brigade from Quetta under General Richard England, beaten back at Haikalzai in March, broke through the Khojak Pass to Kandahar in May. The new Governor-General, Lord Ellenborough, wanted only to bring the armies home.
    facts:
      - [Surrender of Ghazni, "6 March 1842"]
      - [Shah Shuja killed, "5 April 1842"]
      - [Pollock forces the Khyber, "5 April 1842"]
      - [Sale’s sortie at Jalalabad, "7 April 1842, British victory"]
    markers:
      - kind: battle
        side: gb
        name: Jalalabad
        date: 7 April 1842
        text: The garrison attacked the besiegers’ camp, scattered Akbar Khan’s army and took its guns.
        lonlat: [70.453, 34.430]
        lp: b
      - kind: taken
        side: afg
