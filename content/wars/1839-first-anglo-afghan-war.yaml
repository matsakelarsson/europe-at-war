  - title: The Kabul rising
    date: October – December 1841
    when: "1841-11-02"
    borders: "1841-11-02"
    countries: [af]
    body:
      - Shah Shuja’s government rested on British troops and on subsidies to the chiefs, and both were resented. To save money, Macnaghten cut the payments to the eastern Ghilzai chiefs who kept the road to India open, and in October 1841 they closed the passes. A brigade under Sir Robert Sale fought its way through to Jalalabad, which it reached on 12 November and fortified. In Kabul the elderly and ailing General William Elphinstone commanded the main garrison from a badly sited cantonment on the plain, with its stores kept in a separate fort.
      - On 2 November a crowd attacked the house of the political officer Sir Alexander Burnes in the city and killed him, his brother and their guards. The garrison did not react in force, and the rising spread. The commissariat fort was lost, an attack on the Bemaru heights on 23 November ended in defeat, and Dost Mohammad’s son Wazir Akbar Khan arrived to lead the resistance. A Gurkha regiment at Charikar was overwhelmed. Running out of food, Macnaghten negotiated with the chiefs while secretly trying to divide them; on 23 December, at a meeting outside the cantonment, he and three officers were seized and Macnaghten was killed by Akbar Khan’s party.
    facts:
      - [Rising in Kabul, Burnes killed, "2 November 1841"]
      - [Sale reaches Jalalabad, "12 November 1841"]
      - [Macnaghten killed, "23 December 1841"]
    markers:
