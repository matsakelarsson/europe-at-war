  - title: Ghazni and Kabul
    date: July 1839 – November 1840
    when: "1839-07-23"
    borders: "1839-08-07"
    countries: [af, pk]
    body:
      - Keane left Kandahar on 27 June, leaving his siege guns behind, and found the walls of Ghazni stronger than expected. A nephew of Dost Mohammad who had deserted told him that the Kabul Gate was weakly blocked. Before dawn on 23 July 1839 engineers blew it in with powder bags and the troops stormed the town; British and Indian losses were under 200 killed and wounded, while about 500 defenders were killed and some 1,500 captured. Dost Mohammad’s army melted away near Kabul, and he fled over the Hindu Kush. On 7 August Shah Shuja entered Kabul, thirty years after he had lost it. A second force of Sikh troops and Shah Shuja’s son Timur under Colonel Claude Wade forced the Khyber Pass, taking the fort of Ali Masjid on 26 July.
      - Most of the army went home, leaving about 8,000 men. On its way back the Bombay column stormed Kalat in Baluchistan on 13 November 1839 and killed its khan, Mehrab Khan. Dost Mohammad found refuge first with the Wali of Khulm and then in Bukhara, where he was held for a time, and in 1840 he returned with Uzbek help, only to be beaten near Bamyan in September. On 2 November 1840 his horsemen routed British cavalry at Parwan Darra north of Kabul, but two days later he rode into Kabul and surrendered to the British envoy, William Macnaghten. He was sent into exile in India.
    facts:
      - [Storming of Ghazni, "23 July 1839"]
      - [Shah Shuja enters Kabul, "7 August 1839"]
      - [Battle of Parwan Darra, "2 November 1840, Afghan victory"]
      - [Dost Mohammad surrenders, "4 November 1840"]
