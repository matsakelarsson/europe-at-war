id: first-opium-war
name: First Opium War
start: "1839-09-04"
end: "1842-08-29"
tier: A
summary: "A war between Britain and Qing China over the opium trade and the terms of foreign trade at Guangzhou (Canton). In 1839 the imperial commissioner Lin Zexu forced British and other merchants to surrender more than 20,000 chests of opium, which he destroyed at Humen. Britain, which defended the merchants’ claims and wanted wider trade and diplomatic equality, sent an expedition that took Zhoushan in 1840, forced the forts of the Pearl River and occupied Hong Kong Island in 1841, and then took Xiamen (Amoy), Ningbo and Zhenjiang and sailed up the Yangtze to Nanjing. The Treaty of Nanking of 29 August 1842 ceded Hong Kong Island, opened five ports to British trade and residence and made China pay an indemnity of 21 million silver dollars. It was the first of the treaties later called the unequal treaties in China."
countries: [cn, hk, gb]
sides:
  - id: gb
    name: British Empire (with the East India Company)
    polities: [united-kingdom]
    ink: red
    moves: British moves
    success: British success
  - id: qing
    name: Qing China
    polities: [qing]
    ink: gold
    moves: Qing moves
    success: Qing success
notes:
  - The British force was made up of Royal Navy ships, British Army regiments and Indian troops and armed steamers of the East India Company, which ruled British India and grew the opium that was sold in China.
  - In China the war is called the (First) Opium War; in Britain it was long called the First China War or the Anglo-Chinese War. Chinese historians have dated the start of modern Chinese history and of the “century of humiliation” to it.
  - Places are given in pinyin with the older English names in brackets. Sources disagree on the numbers of troops and of Chinese dead; the figures here are approximate.
