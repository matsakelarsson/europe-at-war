  - title: Pottinger takes the war north
    date: August – October 1841
    when: "1841-08-26"
    borders: "1841-10-13"
    countries: [cn, tw, gb]
    body:
      - The British government replaced Elliot with Sir Henry Pottinger, who reached Hong Kong in August 1841 with orders to carry the war to the coast and the Yangtze. On 26 August the fleet stormed the batteries of Xiamen (Amoy) and the city was abandoned; a garrison stayed on the island of Gulangyu. On 1 October the British retook Dinghai on Zhoushan, which had been handed back under the Chuenpi convention, killing the Qing commander Ge Yunfei and many of his men. On 10 October they stormed Zhenhai at the mouth of the Yong river, where the commissioner Yuqian drowned himself, and on 13 October they entered Ningbo without a fight.
      - The occupied towns were plundered by soldiers and by local people, and Pottinger levied ransoms on the merchants. In Taiwan the Qing commanders captured the crews of two British transports wrecked on the coast, the Nerbudda in September 1841 and the brig Ann in March 1842; in August 1842 197 of the prisoners, most of them Indian sailors and camp followers, were executed at Tainan, and 87 more died in captivity.
    facts:
      - [Xiamen (Amoy) taken, "26–27 August 1841"]
      - [Dinghai retaken, "1 October 1841"]
      - [Zhenhai taken, "10 October 1841"]
      - [Ningbo occupied, "13 October 1841"]
    markers:
      - kind: taken
        side: gb
        name: Xiamen (Amoy)
        date: 26 August 1841
        text: The granite batteries on the waterfront were taken by landing parties. The British kept a garrison on the island of Gulangyu until 1845.
        lonlat: [118.085, 24.460]
      - kind: taken
        side: gb
        name: Dinghai (Zhoushan)
        date: 1 October 1841
        text: Retaken after six days of fighting. The defenders, under Ge Yunfei, Wang Xipeng and Zheng Guohong, were killed.
        lonlat: [122.107, 30.020]
      - kind: taken
