        lonlat: [121.500, 31.375]
      - kind: taken
        side: gb
        name: Shanghai
        date: 19 June 1842
        text: Occupied without serious resistance. It became one of the five treaty ports and soon the largest of them.
        lonlat: [121.490, 31.226]
        lp: b
      - kind: taken
        side: gb
        name: Zhenjiang
        date: 21 July 1842
        text: The city at the junction of the Yangtze and the Grand Canal, stormed after fierce fighting with its Manchu garrison.
        lonlat: [119.424, 32.188]
        lp: b
      - kind: treaty
        name: Nanjing (Nanking)
        date: 29 August 1842
        text: The treaty was signed aboard HMS Cornwallis, anchored off the city.
        lonlat: [118.740, 32.090]
        lp: l
      - kind: event
        side: gb
        name: Hong Kong
        date: 29 August 1842
        text: Ceded to Britain “in perpetuity”. Victoria, its new town, became the seat of the British superintendent of trade.
        lonlat: [114.160, 22.280]
        lp: b
