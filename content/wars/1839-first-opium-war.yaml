  - title: The battle for Guangzhou
    date: May 1841
    when: "1841-05-21"
    borders: "1841-05-31"
    countries: [cn, gb]
    body:
      - The emperor sent the imperial clansman Yishan with orders to drive the British out, and troops from other provinces gathered round Guangzhou, by some accounts 50,000 men. On the night of 21 May they attacked the British ships in the river with fire rafts and shore batteries. The attack failed, and the British general, Sir Hugh Gough, landed about 2,400 men above the city on 24–25 May and took the forts on the heights to the north, from which his guns could fire into the city.
      - Before the assault, Yishan’s officials agreed to pay a ransom of six million dollars, and on 27 May the British called off the attack. On 30 May several thousand armed villagers from Sanyuanli and the surrounding districts, angered by looting and by violence against local people, surrounded a British and Indian detachment in a rainstorm; it was rescued with few losses. The British withdrew below the Bogue at the end of the month. Yishan reported a victory to Beijing, and in China the Sanyuanli clash became a symbol of popular resistance.
    facts:
      - [Qing attack, "21 May 1841"]
      - [Heights north of Guangzhou taken, "25 May 1841"]
      - [Ransom of Guangzhou, "6 million silver dollars"]
      - [Sanyuanli incident, "30 May 1841"]
    markers:
      - kind: battle
        side: gb
        name: Guangzhou
        date: 21–25 May 1841
        text: The night attack on the British fleet was beaten off; British troops then took the forts overlooking the walled city.
        lonlat: [113.264, 23.130]
        lp: l
      - kind: battle
        side: qing
        name: Sanyuanli
        date: 30 May 1841
        text: Militia from more than a hundred villages surrounded a British-led company of Madras sepoys, whose muskets failed in the rain. Few were killed, but it was remembered in China as a victory.
        lonlat: [113.260, 23.158]
        lp: r
      - kind: event
        name: The Bogue
        date: 31 May – 1 June 1841
        text: Having received the ransom, the British pulled back below the Bogue forts.
        lonlat: [113.623, 22.800]
    arrows:
