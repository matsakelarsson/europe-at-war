steps:
  - title: Lin Zexu and the opium of Canton
    date: March – November 1839
    when: "1839-03-10"
    borders: "1839-09-04"
    countries: [cn, hk, mo, gb]
    body:
      - Foreign trade with China was confined to Guangzhou (Canton), where Western merchants could deal only with licensed Chinese firms. To pay for the tea they bought, British and American traders sold opium grown in British India, and by the late 1830s some 40,000 chests a year were smuggled into China, draining its silver. In 1838 the Daoguang emperor rejected proposals to legalise the drug and sent Lin Zexu, a respected official, to stamp out the trade. Lin reached Guangzhou in March 1839, blockaded the foreign factories and forced the merchants, through the British superintendent of trade, Charles Elliot, to surrender more than 20,000 chests of opium. From 3 June it was mixed with lime and salt in trenches at Humen and flushed into the sea.
      - Elliot had promised the merchants that the British government would compensate them, which turned a dispute over contraband into a dispute between governments. In July British sailors killed a villager, Lin Weixi, at Kowloon, and Elliot refused to hand any of them over. Lin cut off food to the British, who had withdrawn to ships off Hong Kong after Macau, under Chinese pressure, expelled them. On 4 September British ships fired on war junks at Kowloon that were preventing villagers from selling them food, and on 3 November two British frigates fought Admiral Guan Tianpei’s junks at Chuenpi, near Humen, sinking several. In London the cabinet of Lord Melbourne had already decided, on 1 October, to send an expedition.
    facts:
      - [Opium surrendered, "20,283 chests, more than 1,000 tonnes"]
      - [Destruction at Humen, "3–25 June 1839"]
      - [Battle of Kowloon, "4 September 1839"]
      - [First Battle of Chuenpi, "3 November 1839"]
