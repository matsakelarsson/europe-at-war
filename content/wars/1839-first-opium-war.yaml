  - title: Up the Yangtze to Nanjing
    date: June – August 1842
    when: "1842-06-16"
    borders: "1842-08-29"
    countries: [cn, hk, gb]
    body:
      - On 16 June the fleet silenced the batteries at Wusong, at the mouth of the Huangpu river, where the old general Chen Huacheng was killed at his guns, and three days later the British occupied Shanghai. With 25 warships, dozens of transports and some 9,000–10,000 troops, Gough and Parker then sailed up the Yangtze. On 21 July they stormed Zhenjiang, where the Grand Canal crosses the river and the grain fleets that fed Beijing passed. The Manchu garrison fought from street to street, and when the city fell its commander, Hailing, and many bannermen and their families killed themselves. British losses there, under 40 killed, were the heaviest of any battle in the war.
      - With the Grand Canal cut and the fleet anchored off Nanjing on 9 August, the emperor authorised his envoys, Qiying, Ilibu and Niu Jian, to make peace. The Treaty of Nanking was signed aboard HMS Cornwallis on 29 August 1842. China ceded Hong Kong Island, opened Guangzhou, Xiamen, Fuzhou, Ningbo and Shanghai to British trade and consuls, abolished the licensed merchants’ monopoly and agreed to pay 21 million dollars. The treaty did not mention opium, whose trade went on and grew. The Treaty of the Bogue (1843) added extraterritoriality and most-favoured-nation treatment, and the United States and France won similar treaties in 1844.
      - British losses in battle were under a hundred killed, though several hundred more died of disease, above all at Zhoushan. Qing losses are less certain; a widely cited estimate is about 3,100 killed and 4,500 wounded, while other estimates of Chinese dead, including the families who died at Zhapu and Zhenjiang, are much higher.
    facts:
      - [Battle of Wusong, "16 June 1842"]
      - [Zhenjiang stormed, "21 July 1842"]
      - [Treaty of Nanking, "29 August 1842"]
      - [Indemnity, "21 million silver dollars"]
      - [Treaty ports, "Guangzhou, Xiamen, Fuzhou, Ningbo, Shanghai"]
    markers:
