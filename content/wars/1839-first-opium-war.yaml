  - title: Chuenpi, Hong Kong and the Bogue
    date: January – March 1841
    when: "1841-01-07"
    borders: "1841-01-26"
    countries: [cn, hk, gb]
    body:
      - The talks at Guangzhou dragged on, and on 7 January 1841 Charles Elliot attacked the forts at Chuenpi and Taikoktow at the entrance of the Bocca Tigris (the Bogue), the narrows below Humen. The iron East India Company steamer Nemesis, which drew so little water that it could go where junks could, destroyed a fleet of war junks. Qishan gave way, and on 20 January the two men agreed the Convention of Chuenpi. China was to cede Hong Kong Island, pay six million dollars and reopen trade, and the British would give back Zhoushan. On 26 January a British party landed on Hong Kong Island and raised the flag at what is still called Possession Point.
      - Neither government accepted the convention. The Daoguang emperor, furious that territory had been promised away, had Qishan arrested and sentenced to death (the sentence was later commuted), and Palmerston recalled Elliot for asking too little. Fighting resumed in February. On 26 February the British stormed the forts of the Bogue, where Guan Tianpei was killed with several hundred of his men, and destroyed the defences on the river up to Whampoa (Huangpu). On 18 March they took the Thirteen Factories at Guangzhou, and trade, which suited both the merchants and the Cantonese, briefly reopened.
    facts:
      - [Second Battle of Chuenpi, "7 January 1841"]
      - [Convention of Chuenpi, "20 January 1841 (rejected by both governments)"]
      - [Hong Kong Island occupied, "26 January 1841"]
      - [Battle of the Bogue, "26 February 1841"]
    markers:
      - kind: battle
        side: gb
        name: Chuenpi
        date: 7 January 1841
        text: The forts were stormed by British marines and Indian troops, and the Nemesis destroyed eleven war junks with rockets and shell.
        lonlat: [113.640, 22.770]
        lp: l
      - kind: taken
        side: gb
        name: Hong Kong Island
        date: 26 January 1841
        text: The British flag was raised at Possession Point. The island had a few fishing villages and an excellent deep harbour.
        lonlat: [114.149, 22.286]
        lp: b
      - kind: battle
        side: gb
        name: The Bogue
        date: 26 February 1841
        text: The Anunghoy (Weiyuan) and Wangtong forts were taken in a single day. Admiral Guan Tianpei died defending them.
        lonlat: [113.623, 22.800]
      - kind: taken
        side: gb
        name: Whampoa
        date: 2 March 1841
        text: The anchorage of the foreign merchant ships below Guangzhou, cleared of Chinese batteries.
        lonlat: [113.420, 23.100]
      - kind: taken
        side: gb
        name: Thirteen Factories
        date: 18 March 1841
        text: The foreign warehouses on the Guangzhou waterfront, retaken by the British. Trade resumed under a truce.
        lonlat: [113.252, 23.110]
        lp: l
