  - title: Ningbo, Cixi and Zhapu
    date: March – May 1842
    when: "1842-03-10"
    borders: "1842-05-18"
    countries: [cn, gb]
    body:
      - Over the winter the imperial clansman Yijing gathered an army in Zhejiang to retake the lost towns. On the night of 10 March 1842 Qing troops attacked Ningbo and Zhenhai at the same time. At Ningbo they broke in through the gates and were cut down by artillery and musket fire in the streets; a fire-raft attack on the ships at Zhoushan also failed. On 15 March a British column stormed the Qing camps on the hills at Cixi. The counter-offensive cost the Qing several hundred dead and ended their hopes of winning back the coast.
      - In May Pottinger and Gough, reinforced from India, left Ningbo and moved north. On 18 May they attacked Zhapu, a port on the north shore of Hangzhou Bay that had a garrison of Manchu bannermen. About 300 bannermen fought to the last in a temple, and when the town fell many bannermen’s families killed themselves rather than be taken.
    facts:
      - [Qing attack on Ningbo, "10 March 1842"]
      - [Battle of Cixi, "15 March 1842"]
      - [Zhapu taken, "18 May 1842"]
    markers:
