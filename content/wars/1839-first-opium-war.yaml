        lonlat: [113.673, 22.815]
        lp: r
      - kind: battle
        name: Kowloon
        date: 4 September 1839
        text: British boats fired on war junks guarding the coast; the first shots of the war. Neither side lost a ship.
        lonlat: [114.180, 22.310]
      - kind: battle
        side: gb
        name: Chuenpi
        date: 3 November 1839
        text: HMS Volage and HMS Hyacinth fought Guan Tianpei’s fleet of war junks and fire ships; several junks were sunk.
        lonlat: [113.640, 22.770]
        lp: l
      - kind: event
        name: Macau
        date: August 1839
        text: The Portuguese governor, under pressure from Lin, asked the British to leave. They moved to their ships in the anchorage off Hong Kong Island.
        lonlat: [113.543, 22.199]
        lp: l
  - title: The expedition, Zhoushan and the Peiho
    date: June – November 1840
    when: "1840-06-21"
    borders: "1840-07-06"
    countries: [cn, gb]
    body:
      - In April 1840 the House of Commons rejected a Tory motion censuring the government by only nine votes; William Gladstone called the war unjust. The expedition, raised in India and the colonies, gathered off Macau in June 1840. By one count it had 16 warships, 4 armed steamers and 28 transports carrying about 4,000 soldiers. Its commanders, Rear Admiral George Elliot and Charles Elliot, followed Lord Palmerston’s instructions to blockade the Pearl River and then strike north rather than attack Guangzhou.
      - On 5 July the fleet bombarded Dinghai, the port of Zhoushan (Chusan) island at the mouth of the Yangtze, and occupied the town the next day. It was meant to be a base and a pledge, but in the following months several hundred of its garrison died of dysentery and fever. In August the fleet appeared at the mouth of the Peiho (Hai River) below Tianjin, within reach of Beijing. The alarmed court sent the Manchu grandee Qishan to negotiate, and he persuaded the Elliots to return south for talks. Lin Zexu was dismissed and Qishan replaced him at Guangzhou.
    facts:
      - [Expedition off Macau, "21 June 1840, about 4,000 soldiers"]
      - [Dinghai taken, "5–6 July 1840"]
      - [Fleet at the Peiho, "August 1840"]
    markers:
      - kind: taken
        side: gb
        name: Dinghai (Zhoushan)
        date: 5–6 July 1840
        text: Bombarded from the sea and occupied. The British held the island until February 1841 and again from October 1841 to 1846.
        lonlat: [122.107, 30.020]
      - kind: event
        side: gb
        name: Mouth of the Peiho
        date: August 1840
        text: The fleet anchored off the Dagu forts and handed over Palmerston’s letter. Qishan met Charles Elliot on shore and agreed to talks in Guangzhou.
        lonlat: [117.705, 38.977]
      - kind: event
        side: gb
        name: Blockade of the Pearl River
        date: from June 1840
        text: A few ships stayed behind to blockade Guangzhou while the main fleet sailed north.
        lonlat: [113.800, 22.300]
        lp: b
