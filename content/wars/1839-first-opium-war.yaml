        date: 13 October 1841
        text: Abandoned by its officials and occupied without a fight.
        lonlat: [121.550, 29.870]
        lp: l
      - kind: event
        side: qing
        name: Tainan
        date: 10 August 1842
        text: The survivors of the Nerbudda and the Ann were held here; 197 of them were executed on the emperor’s orders.
        lonlat: [120.203, 22.995]
