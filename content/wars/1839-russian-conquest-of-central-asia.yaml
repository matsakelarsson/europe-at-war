steps:
  - title: Perovsky’s winter march on Khiva
    date: 1839–1840
    when: "1839-11"
    borders: "1840-02"
    countries: [kz, uz, ru]
    body:
      - By the 1830s Russia’s frontier ran along the Orenburg Line, and the Kazakh steppe to the south was slowly coming under Russian control. Russia complained that the Khanate of Khiva, an irrigated oasis on the lower Amu Darya some 1,200 km to the south, encouraged raids on the steppe and held Russian captives, many of them fishermen seized on the Caspian Sea and sold as slaves. In 1839 Nicholas I approved an expedition to put a khan friendly to Russia on the throne of Khiva, at a time when Britain was invading Afghanistan.
      - The governor of Orenburg, Vasily Perovsky, set out in late November 1839 with about 5,000 men and some 10,000 camels hired or requisitioned from the Kazakhs, choosing winter to avoid the lack of water. The winter turned out to be exceptionally cold and snowy. Khivan horsemen attacked the advance fort at Ak-Bulak without success, but the camels died in thousands, and by February 1840, having covered less than half the distance, Perovsky turned back. More than 1,000 of his men died, mostly of cold, scurvy and disease, and only about 1,500 camels survived. In 1840 the khan, urged by British officers who had reached Khiva from Herat, released 416 Russian captives, and Russia set aside the conquest of Khiva for three decades.
    facts:
      - [Russian force, "about 5,000 men and 10,000 camels"]
      - [Retreat ordered, "February 1840"]
      - [Russian dead, "about 1,050, almost all from cold and disease"]
    markers:
      - kind: event
        side: ru
        name: Orenburg
        date: November 1839
        text: The capital of Russia’s steppe frontier and the starting point of Perovsky’s columns. The survivors were back on the Orenburg Line by June 1840.
        lonlat: [55.1, 51.783]
      - kind: held
        side: khi
        name: Khiva
        date: 1840
        text: Capital of the khanate. The khan freed his Russian captives in 1840 and sent them north, which removed Russia’s main reason for the war.
        lonlat: [60.361, 41.381]
    arrows:
      - side: ru
        label: Perovsky, turned back
        via: [[55.1, 51.7], [56.6, 49.9], [57.6, 48.4], [58.2, 47.0]]
  - title: The Syr Darya line and Ak-Mechet
    date: 1847–1854
    when: "1853-08-09"
    borders: "1854-06"
    countries: [kz, ru]
    body:
      - After the failure at Khiva, Russia advanced step by step across the steppe, building forts as it went. In 1847 it founded the Raim fort near the mouth of the Syr Darya and launched the first Russian ships on the Aral Sea, and in the same years Cossack outposts moved south into Semirechye, the land of the seven rivers south of Lake Balkhash. These advances, and the end of Kenesary Kasymov’s Kazakh revolt in 1847, brought Russia up against the Khanate of Kokand, which held the middle Syr Darya and taxed the Kazakhs there from a chain of forts.
      - In the summer of 1853 Perovsky led more than 2,000 men up the river against Ak-Mechet, Kokand’s main northern fort, held by about 300 men. After a siege of more than three weeks, with trenches, batteries and mines, the Russians stormed it on 9 August; most of the defenders were killed. Renamed Fort Perovsky, it held out in December 1853 against a much larger Kokandi army sent to retake it. In 1854 Russia founded the fort of Vernyi, today’s Almaty, at the foot of the Tian Shan. Two lines of forts, along the Syr Darya and across Semirechye, now faced the khanates, with a gap of steppe and mountains between them.
    facts:
      - [Raim fort founded, "1847"]
      - [Ak-Mechet stormed, "9 August 1853"]
      - [Vernyi founded, "1854"]
    markers:
      - kind: taken
        side: ru
        name: Ak-Mechet
        date: 9 August 1853
        text: Kokand’s fort on the Syr Darya, taken after a siege of 25 days and renamed Fort Perovsky. It is today’s Kyzylorda.
        lonlat: [65.517, 44.85]
      - kind: event
        side: ru
        name: Kazalinsk
        date: 1853–1855
        text: Fort No. 1, built on the lower Syr Darya; it replaced the Raim fort as the base of the Aral flotilla.
        lonlat: [62.1, 45.767]
        lp: l
      - kind: event
        side: ru
        name: Vernyi
        date: "1854"
        text: A Russian fort in the foothills of the Tian Shan, the base for the advance into the lands of Kokand from the east. It grew into the city of Almaty.
        lonlat: [76.95, 43.233]
    arrows:
