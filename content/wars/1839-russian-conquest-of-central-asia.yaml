notes:
  - Dates are New Style (Gregorian). Russian sources use the Julian calendar, then 12 days behind, so Tashkent fell on 17 June 1865, Samarkand on 2 May 1868, Khiva on 29 May 1873, Geok Tepe on 12 January 1881 and Panjdeh on 18 March 1885 in Russian accounts.
  - This was not one war but a series of campaigns, often begun by local commanders before Saint Petersburg had approved them. Bukhara (from 1868) and Khiva (from 1873) stayed on the map as Russian protectorates under their own rulers until 1920.
  - Numbers for the Central Asian armies come almost entirely from Russian reports and are often inflated; Turkmen and Kokandi losses in particular are rough estimates.
