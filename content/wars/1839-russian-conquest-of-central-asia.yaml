        name: Andijan
        date: January 1876
        text: The centre of the revolt in the eastern Ferghana valley, stormed by Skobelev after an earlier attack had failed in October 1875.
        lonlat: [72.334, 40.783]
      - kind: taken
        side: ru
        name: Namangan
        date: September 1875
        text: Ceded to Russia by Nasruddin Khan, and held against a rebel siege that autumn.
        lonlat: [71.668, 41.001]
      - kind: event
        side: ru
        name: Margilan
        date: March 1876
        text: Pulat Khan, the leader of the revolt, was hanged here.
        lonlat: [71.725, 40.471]
        lp: b
