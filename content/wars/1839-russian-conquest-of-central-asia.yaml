  - title: Geok Tepe
    date: 1879–1881
    when: "1881-01-24"
    borders: "1881-02"
    countries: [tm, ir, ru]
    body:
      - The Tekke Turkmen of the Akhal oasis, at the foot of the Kopet Dag mountains, were the last large people of the region outside Russian control; they raided Persia and the caravan routes and held thousands of Persian captives. In September 1879 a Russian expedition under General Nikolai Lomakin attacked their great fortress of Dengil-Tepe near Geok Tepe after a short bombardment and was thrown back with heavy losses.
      - In 1880 General Mikhail Skobelev prepared a slower and much larger campaign, bringing up supplies from the Caspian by camel and by a new military railway. In December he laid siege to the fortress, whose mud walls enclosed tens of thousands of Tekke fighters and their families, and the defenders made costly night sorties. On 24 January 1881 a mine blew a wide breach in the wall and the Russians stormed in. Those who fled were pursued for 16 km by cavalry. Skobelev’s own report counted 6,500 bodies buried in the fortress and 8,000 people “of both sexes” killed in the pursuit; Russian losses in January were about 1,100 killed and wounded. About 600 Persian captives were freed. Ashgabat was occupied a few days later, Transcaspia became a Russian province, and a treaty with Persia in December 1881 fixed the border along the Atrek and the Kopet Dag.
    facts:
      - [First assault, "9 September 1879, Russian repulse"]
      - [Storming of Geok Tepe, "24 January 1881"]
      - [Akhal–Khorasan border treaty, "December 1881"]
    markers:
      - kind: siege
        side: ru
        name: Geok Tepe
        date: 24 January 1881
        text: The Tekke fortress of Dengil-Tepe, stormed after a three-week siege. The day is remembered in Turkmenistan as a day of mourning.
        lonlat: [57.968, 38.167]
      - kind: taken
        side: ru
        name: Ashgabat
        date: 30 January 1881
        text: A small settlement when the Russians took it; it became the capital of Transcaspia and later of Turkmenistan.
        lonlat: [58.38, 37.938]
        lp: b
      - kind: event
        side: ru
        name: Kyzyl-Arvat
        date: 1880–1881
        text: The Transcaspian Railway, begun on Skobelev’s orders from the Caspian shore, reached here in 1881.
        lonlat: [56.283, 38.983]
        lp: l
    arrows:
      - side: ru
        label: Skobelev
        phase: 1
        via: [[53.95, 37.6], [55.0, 37.95], [56.0, 38.4], [56.8, 38.7], [57.85, 38.2]]
      - side: ru
        label: Kuropatkin
        phase: 1
        via: [[60.3, 41.3], [59.6, 40.0], [58.1, 38.3]]
      - side: ru
        phase: 2
        via: [[58.0, 38.15], [58.3, 37.97]]
    areas:
      - style: gained
        side: ru
        label: Transcaspia, conquered by 1881
        atoms: [TM-B, TM-A]
  - title: Merv and Panjdeh
    date: 1884–1885
    when: "1885-03-30"
    borders: "1885-04"
    countries: [tm, af, ru, gb]
    body:
      - After Geok Tepe, the Tekke of the great oasis of Merv had little hope of resisting. Persuaded by the Daghestani officer Alikhanov, their elders took an oath to the tsar in early 1884, and Russian troops entered the oasis in March; Sarakhs on the Persian border followed. Britain, which saw Merv as a step towards Herat and India, protested in vain. An Anglo-Russian commission was set up to mark the northern border of Afghanistan, which had never been defined.
      - While the commissioners were on their way, Russian and Afghan troops faced each other at the oasis of Panjdeh, where the Kushk river joins the Murghab. On 30 March 1885 General Alexander Komarov attacked the Afghan force of about 4,000 men on the Kushk near the brick bridge of Pul-i-Khishti and drove it off. Komarov reported more than 500 Afghans killed; Russian losses were about 40 killed and wounded. Britain asked Parliament for war credits, but the Afghan amir, Abdur Rahman Khan, then visiting British India, played the clash down. Russia kept Panjdeh and gave up the Zulfikar pass, and a protocol of July 1887 fixed the border that still divides Turkmenistan and Afghanistan. Apart from the Pamirs in the 1890s, the Russian advance in Central Asia ended here.
    facts:
      - [Merv submits, "February–March 1884"]
      - [Panjdeh incident, "30 March 1885, Russian victory"]
      - [Border protocol, "22 July 1887"]
