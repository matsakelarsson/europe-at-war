  - title: The end of Kokand
    date: 1875–1876
    when: "1875-09-03"
    borders: "1876-03-02"
    countries: [uz, kg, tj, ru]
    body:
      - What was left of Kokand, the Ferghana valley and the mountains around it, was ruled by Khudayar Khan, whose heavy taxes and dependence on Russia made him hated. In the summer of 1875 his army and the Kipchak tribes rose against him under Abdurrahman Avtobachi and a pretender who called himself Pulat Khan. Khudayar fled to Russian Tashkent, and the rebels proclaimed a holy war and attacked Khujand and other Russian posts.
      - Kaufman crossed into Kokand with about 4,000 men and on 3 September routed the rebel army at the fortress of Makhram on the Syr Darya, with Colonel Mikhail Skobelev leading the cavalry. Khudayar’s son Nasruddin made peace and gave up Namangan, but the revolt spread again. Skobelev stormed Andijan in January 1876, and his troops killed many of its people; Abdurrahman surrendered and Pulat Khan was captured and hanged in Margilan. On 2 March 1876 Kokand was annexed outright and became the Ferghana province of Russian Turkestan, with Skobelev as its first governor.
    facts:
      - [Battle of Makhram, "3 September 1875, Russian victory"]
      - [Andijan stormed, "January 1876"]
      - [Kokand annexed, "2 March 1876"]
    markers:
      - kind: battle
        side: ru
        name: Makhram
        date: 3 September 1875
        text: Kaufman’s artillery and Skobelev’s cavalry broke the rebel army, which Russian reports put at tens of thousands, at this fortress on the Syr Darya.
        lonlat: [70.19, 40.245]
        lp: b
      - kind: taken
        side: ru
        name: Kokand
        date: September 1875
        text: The capital of the khanate opened its gates to Kaufman after Makhram. It was annexed with the rest of the khanate in March 1876.
        lonlat: [70.942, 40.529]
      - kind: taken
