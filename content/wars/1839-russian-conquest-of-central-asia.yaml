        atoms: [KZ-KZY, KZ-ALA, KAZ-4829]
  - title: Chimkent and Tashkent
    date: 1864–1865
    when: "1865-06-29"
    borders: "1865-07"
    countries: [kz, uz, kg, ru]
    body:
      - In 1864 Russia closed the gap between its two lines. Colonel Mikhail Chernyaev marched west from Vernyi and took Aulie-Ata (today’s Taraz) in June, while Colonel Nikolai Verevkin came up the Syr Darya and took the town of Turkestan with its great shrine of Ahmad Yasawi. Chernyaev stormed Chimkent in October and at once tried to take Tashkent, but his attack was beaten off. In December a sotnia of about 110 Ural Cossacks, caught near the village of Iqan by the Kokandi regent Alimqul with thousands of horsemen, fought its way out after three days; about half of the Cossacks were killed.
      - The foreign minister, Alexander Gorchakov, told the powers that Russia now had a natural frontier and would go no further. But Chernyaev, given vague orders, marched on Tashkent in May 1865, the largest and richest city of Central Asia, with about 100,000 people. He cut its water supply, and on 21 May Alimqul was mortally wounded in a battle outside the walls. On the night of 26–27 June Chernyaev’s men, fewer than 2,000 in all, stormed the gates, and after two days of street fighting the city’s notables surrendered on 29 June. Tashkent became the seat of a new Turkestan province and, from 1867, of the Governor-General of Turkestan, Konstantin von Kaufman.
    facts:
      - [Aulie-Ata and Turkestan taken, "June 1864"]
      - [Chimkent stormed, "4 October 1864"]
      - [Tashkent surrendered, "29 June 1865"]
    markers:
      - kind: taken
        side: ru
        name: Aulie-Ata
        date: June 1864
        text: Taken by Chernyaev’s column from Vernyi. Today it is Taraz in Kazakhstan.
        lonlat: [71.367, 42.9]
      - kind: taken
