id: russian-conquest-of-central-asia
name: Russian conquest of Central Asia
start: "1839-11"
end: "1885-03-30"
tier: A
summary: The campaigns in which the Russian Empire, advancing south from the Kazakh steppe and east from the Caspian Sea, conquered the khanates of Kokand, Bukhara and Khiva and the Turkmen tribes between 1839 and 1885. After a failed winter march on Khiva in 1839–1840, Russia built a line of forts along the Syr Darya, took Tashkent from Kokand in 1865, defeated Bukhara in 1866–1868, made Bukhara and Khiva protectorates, annexed Kokand in 1876 and conquered the Turkmen after the storming of Geok Tepe in 1881. The clash with Afghan troops at Panjdeh in 1885 nearly led to war with Britain and set the frontier of Russian Turkestan with Afghanistan.
countries: [kz, uz, tm, tj, kg, af, ru]
