  - title: War with Bukhara
    date: 1866–1868
    when: "1866-05-20"
    borders: "1868-07"
    countries: [uz, tj, ru]
    body:
      - The emir of Bukhara, Muzaffar, claimed Tashkent for himself, detained a Russian mission and gathered an army on the Syr Darya. On 20 May 1866 General Dmitry Romanovsky, with about 3,000 men, routed the emir’s much larger army at Irjar, a narrow pass on the river between Chinaz and Khujand. The Russians then stormed Khujand in June, and Ura-Tyube and Jizzakh in October. In 1867 the conquered lands were made the Governor-Generalship of Turkestan under Kaufman.
      - In May 1868, after the clergy of Bukhara declared a holy war, Kaufman marched on Samarkand, Timur’s old capital. He defeated the Bukharan army on the Chupan-Ata heights on 13 May, and the city opened its gates the next day. While Kaufman pursued the emir westwards, about 650 men left in the citadel were besieged for a week by Bukharan troops, the people of the city and the forces of Shahrisabz; they held out until Kaufman returned. On 14 June he destroyed the emir’s last army at Zerabulak. In the peace that followed, Bukhara gave up Samarkand and the upper Zarafshan valley, paid an indemnity and became a Russian protectorate.
    facts:
      - [Battle of Irjar, "20 May 1866, Russian victory"]
      - [Samarkand taken, "14 May 1868"]
      - [Battle of Zerabulak, "14 June 1868"]
    markers:
      - kind: taken
        side: ru
        name: Khujand
        date: June 1866
        text: Stormed after a siege of about ten days, with heavy losses among the defenders and townspeople.
        lonlat: [69.632, 40.279]
      - kind: taken
        side: ru
        name: Ura-Tyube
        date: October 1866
        text: Today Istaravshan in Tajikistan, taken with Jizzakh to secure the road to Samarkand.
        lonlat: [69.006, 39.911]
