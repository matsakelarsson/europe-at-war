        name: Chimkent
        date: 4 October 1864
        text: Stormed by Chernyaev, who went on to make a first, failed attack on Tashkent.
        lonlat: [69.596, 42.317]
      - kind: taken
        side: ru
        name: Tashkent
        date: 29 June 1865
        text: Stormed against orders after a six-week siege. Russian losses were reported as about 25 killed.
        lonlat: [69.28, 41.311]
    arrows:
