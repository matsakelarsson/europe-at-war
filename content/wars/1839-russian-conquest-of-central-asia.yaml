  - title: Khiva
    date: 1873
    when: "1873-06-10"
    borders: "1873-09"
    countries: [uz, tm, kz, ru]
    body:
      - In 1869 Russian troops landed on the eastern shore of the Caspian and founded Krasnovodsk, and in 1873 Russia attacked Khiva from all sides at once. About 13,000 men in four columns set out across the deserts in early spring. Kaufman’s column from Tashkent and Kazalinsk nearly died of thirst in the Kyzylkum before reaching the Amu Darya; Verevkin’s from Orenburg came down the west shore of the Aral Sea and took Kungrad, where Colonel Nikolai Lomakin’s men from the Mangyshlak peninsula joined it; Colonel Vasily Markozov’s column from Chikishlyar on the Caspian ran out of water and turned back.
      - Verevkin reached the walls of Khiva first and bombarded the city, and on 10 June Kaufman entered it; Khan Muhammad Rahim II, who had fled, was brought back and restored. Under the treaty signed on 24 August, Khiva became a Russian protectorate, gave Russia the right bank of the Amu Darya, agreed to pay an indemnity of 2.2 million roubles and abolished slavery; thousands of Persian slaves were freed. During the negotiations Kaufman demanded a heavy levy from the Yomut Turkmen, and when they could not pay, his troops burned their settlements and killed many of them, including women and children, as the American journalist Januarius MacGahan reported.
    facts:
      - [Russian force, "about 13,000 men in four columns"]
      - [Khiva occupied, "10 June 1873"]
      - [Treaty of Gandemian, "24 August 1873"]
    markers:
      - kind: taken
