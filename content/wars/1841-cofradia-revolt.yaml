id: cofradia-revolt
name: Cofradía revolt (Hermano Pule)
start: "1841-10-23"
end: "1841-11-04"
tier: C
summary: "A religious brotherhood’s rising in Tayabas (now Quezon), crushed by Spanish troops in 1841. Apolinario de la Cruz, known as Hermano Pule, was born in Lucban in 1815 and was refused entry into the Dominican order in 1829 because he was an indio, a native Filipino. In December 1832 he founded the Cofradía de San José, a lay brotherhood open only to native Filipinos, which grew to some 4,500 to 5,000 members in Tayabas, Laguna and Batangas. The church and the colonial government refused to recognise it, saw it as a threat, and on 19 October 1840 raided a meeting and arrested 243 members; in July 1841 the governor-general outlawed it. Pule and about 4,000 followers gathered at Isabang, on the slopes of Mount San Cristóbal near Tayabas, and later moved to Alitao. On 23 October 1841 an attack led by the alcalde mayor of Tayabas, Joaquín Ortega, was beaten off and Ortega was killed. On 1 November Colonel Joaquín Huet attacked the camp at Alitao with 800 to 1,000 soldiers; in about four hours of fighting some 300 to 500 members of the brotherhood were killed and about 500 were taken prisoner. Pule was caught the next evening near Sariaya, tried summarily and shot at Tayabas on 4 November 1841, aged 26; his body was quartered and displayed. Spain’s Supreme Court later reprimanded Governor-General Marcelino de Oraá, and on 20 January 1843 soldiers of the Tayabas regiment, many of whom had relatives among the dead, rose in Manila under Sergeant Irineo Samaniego and seized Fort Santiago; they were overcome, and the survivors were executed at Bagumbayan two days later. Survivors of the brotherhood kept its devotions alive in the villages around Mount Banahaw."
