  - title: Do-yo, Leh and Chushul
    date: November 1841 – September 1842
    when: "1841-12-14"
    borders: "1842-09-17"
    countries: [in, cn]
    body:
      - The Tibetan government sent an army under the minister (kalon) Pelhün, reinforced in November by several thousand more men; the Chinese amban in Lhasa reported the invasion to the emperor, but the Qing, at war with Britain, sent no army of their own. Zorawar Singh, with perhaps 3,000 men, chose to stay through the winter on the high Tibetan plateau. The Tibetans retook Taklakot on 9 November and cut his communications. On 14 December 1841 (the date in the Tibetan report; some accounts give 12 December), at Do-yo just north of Taklakot, his army was attacked in the snow. He was wounded and killed, and his army broke up. About 300 of his men were killed in the fighting and about 700 taken prisoner; many more died of cold on the flight back to Ladakh. Mehta Basti Ram, holding the Dogra fort near Taklakot, escaped over the Himalaya with about 240 men to the British at Almora.
      - The Tibetans followed into Ladakh in the spring of 1842 and besieged Leh, as Ladakhi nobles rose against Dogra rule. Gulab Singh sent fresh troops under Dewan Hari Chand and Wazir Ratnu, who relieved Leh and drove the Tibetans back to their camp at Drangtse, which they flooded by damming the stream. In August 1842 the Dogras defeated the Tibetans at Chushul and killed their commander. By an exchange of notes at Leh on 17 September 1842, known as the Treaty of Chushul, both sides agreed to keep to the “old, established frontiers”. Ladakh stayed with Gulab Singh and the Sikh Empire, Tibet kept western Tibet, and the old trade and the Ladakhi tribute missions to Lhasa were to continue.
    facts:
      - [Battle of Do-yo, "14 December 1841, Tibetan victory; Zorawar Singh killed"]
      - [Battle of Chushul, "August 1842, Dogra victory"]
      - [Treaty of Chushul, "17 September 1842"]
