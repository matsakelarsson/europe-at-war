id: sino-sikh-war
name: Dogra–Tibetan War
start: "1841-05"
end: "1842-09-17"
tier: B
summary: "A war between the Dogra state of Jammu, a vassal of the Sikh Empire, and Tibet, then under the protection of Qing China; it is also called the Sino-Sikh War. Having conquered Ladakh and Baltistan, Gulab Singh’s general Zorawar Singh invaded western Tibet in May 1841 with about 4,000–6,000 men, took Rudok, Gartok and Taklakot, and reached the sacred lake of Manasarovar. In the winter a Tibetan army cut him off, and in December 1841 he was killed and his army destroyed near Taklakot. The Tibetans advanced into Ladakh and besieged Leh, but were driven back by Dogra reinforcements and beaten at Chushul in August 1842. The Treaty of Chushul, agreed in September 1842, restored the old frontier and trade between Ladakh and Tibet."
countries: [in, cn]
sides:
  - id: dogra
    name: Dogra Jammu (under the Sikh Empire)
    polities: [jammu-kashmir, sikh-empire]
    ink: blue
    moves: Dogra moves
    success: Dogra success
  - id: tib
    name: Tibet (under Qing protection)
    polities: [tibet, qing]
    ink: slate
    moves: Tibetan moves
    success: Tibetan success
notes:
  - Gulab Singh, Raja of Jammu since 1822, was a vassal of the Sikh Empire, and Ladakh was recognised in the peace as part of the Sikh Empire’s lands. Qing China, which protected Tibet and kept two ambans (imperial residents) in Lhasa, was fighting the First Opium War at the time; the fighting was done by Tibetan troops.
  - Numbers on both sides are uncertain. Tibetan reports put Zorawar Singh’s army at 6,000, Dogra sources at about 4,000, including Ladakhi and Balti troops.
