steps:
  - title: Into western Tibet
    date: May – November 1841
    when: "1841-05"
    borders: "1841-09"
    countries: [in, cn]
    body:
      - From 1834 Zorawar Singh, general of Gulab Singh of Jammu, conquered the Buddhist kingdom of Ladakh in a series of campaigns, and in 1840 he took Baltistan. Ladakh had long controlled the trade in pashmina wool from western Tibet to the shawl weavers of Kashmir, and the conquest disturbed that trade. In May 1841 Zorawar Singh marched from Leh into Tibet’s western province, Ngari, with an army of Dogras, Ladakhis and Baltis, perhaps 4,000–6,000 men in all.
      - The army advanced in three columns, by Rupshu and Hanle, along the Indus towards Tashigang, and along the Pangong lake towards Rudok; the monasteries at Hanle and Tashigang were plundered. Zorawar Singh took Rudok and then Gartok, the trading centre of the province, and by September had reached Taklakot, near the borders of Nepal and British Kumaon, where he built a fort. The Tibetan officials and their small forces fell back. The British, worried about their own trade and about Nepal, asked the Sikh government in Lahore to recall him.
    facts:
      - [Invasion begins, "May 1841"]
      - [Dogra army, "about 4,000–6,000 men"]
      - [Taken, "Rudok, Tashigang, Gartok, Taklakot"]
