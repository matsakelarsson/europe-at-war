id: battle-of-congella
name: Battle of Congella and the British annexation of Natal
start: "1842-05-04"
end: "1843-08-08"
tier: C
summary: "The clash at Port Natal (Durban) that ended the Voortrekker Republic of Natalia. Britain had never accepted the republic the trekkers founded south of the Tugela after their war with Dingane, and a Boer raid on the Bhaca of Ncaphayi in December 1840, which alarmed the Cape government about the frontier, decided it to act. On 4 May 1842 Captain Thomas Charlton Smith arrived at Port Natal with a small force of the 27th (Inniskilling) Regiment and camped there. On the night of 23–24 May he marched out to attack the Boer camp at Congella, on the shore of the bay, and was beaten back by Andries Pretorius’s men with the loss of 16 to 19 killed and two guns. The Boers took the harbour and besieged the British camp. The trader Dick King slipped out with his young servant Ndongeni, who turned back part of the way, and rode some 960 km to Grahamstown in about ten days to call for help; on 26 June 1842 the schooner Conch and the frigate Southampton landed troops under Lieutenant-Colonel Abraham Cloete, who relieved the camp. The Natalia Volksraad submitted in July 1842. Britain proclaimed Natal a British colony on 12 May 1843, and on 8 August 1843 the Volksraad in Pietermaritzburg accepted the terms, with the Drakensberg as Natal’s border; Natal was joined to the Cape in 1844 and became a separate colony in 1856. Most trekker families left over the mountains for the highveld, to the lands that became the Orange Free State and the South African Republic."
