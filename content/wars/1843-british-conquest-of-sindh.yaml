steps:
  - title: New treaties
    date: 1838 – February 1843
    when: "1843-01"
    borders: "1843-02-15"
    countries: [pk]
    body:
      - The Talpur Mirs, Baluch chiefs who had taken Sindh from the Kalhora dynasty in 1783, ruled the lower Indus in three branches, at Hyderabad, Khairpur and Mirpur. In 1838–39 the British forced them to let the Army of the Indus march through Sindh to Afghanistan, to pay for it, and to accept British garrisons; Karachi was occupied from the sea in February 1839, and a British base grew up at Sukkur. After the Afghan disaster the new Governor-General, Lord Ellenborough, wanted the Indus in British hands. He sent General Sir Charles Napier to Sindh in September 1842 with new treaties that demanded Karachi, Thatta, Sukkur and other towns, control of the river and the coinage.
      - At Khairpur, Napier persuaded the aged Mir Rustam to hand the leadership of the family to his younger brother Ali Murad, who supported the British. When Rustam’s followers withdrew into the desert, Napier led a small column on camels to the fortress of Imamgarh in January 1843 and blew it up. The Hyderabad Mirs signed the new treaty on 12 February, but many of their Baluch followers refused it. On 15 February some 8,000 of them attacked the British Residency at Hyderabad, defended by Major James Outram and about 100 soldiers, who held out for several hours and escaped to two steamers on the Indus.
    facts:
      - [Napier arrives in Sindh, "September 1842"]
      - [Imamgarh destroyed, "January 1843"]
      - [Attack on the Residency at Hyderabad, "15 February 1843"]
