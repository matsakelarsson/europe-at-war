  - id: eic
    name: East India Company
    polities: [british-india]
    ink: red
    moves: Company moves
    success: Company success
  - id: talpur
    name: Talpur Mirs of Hyderabad and Mirpur
    polities: [talpurs]
    ink: green
    moves: Talpur moves
    success: Talpur success
notes:
  - The Company’s army in Sindh was mostly Indian sepoys of the Bombay Army under British officers, with one British regiment, the 22nd Foot.
  - Sindh was ruled by three branches of the Talpur family, at Hyderabad, Khairpur and Mirpur. Mir Ali Murad of Khairpur sided with the British and kept his state, which remained a princely state until 1955.
  - The story that Napier announced his conquest with the one-word Latin message “Peccavi” (“I have sinned”) is a joke printed in Punch in 1844, not a real dispatch.
  - Troop numbers for the Talpur armies range widely in the sources, from under 10,000 to 30,000 at Miani; British figures are more certain.
