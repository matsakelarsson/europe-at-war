id: british-conquest-of-sindh
name: British Conquest of Sindh
start: "1843-01"
end: "1843-04-04"
tier: B
summary: "The East India Company’s conquest of Sindh, the lower Indus valley ruled by the Talpur Mirs. The British had forced the Mirs to let the Army of the Indus pass through their country and to accept British troops during the First Anglo-Afghan War; in 1842 the new Governor-General, Lord Ellenborough, and his general in Sindh, Sir Charles Napier, demanded new cessions. After a Baluch attack on the British Residency at Hyderabad, Napier’s small army defeated far larger Talpur forces at Miani on 17 February 1843 and at Dubba near Hyderabad on 24 March, and took Mirpur and Umarkot. Sindh was annexed, except for Khairpur, whose Mir had sided with the British. The conquest was widely criticised in Britain as unprovoked."
countries: [pk]
