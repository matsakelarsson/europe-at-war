  - title: Miani and Dubba
    date: February – April 1843
    when: "1843-02-17"
    borders: "1843-04-04"
    countries: [pk]
    body:
      - Two days after the attack on the Residency, on 17 February 1843, Napier with about 2,800 men and 12 guns met the main Talpur army at Miani, about 10 km north of Hyderabad, where the Baluch held the dry, scrub-lined bed of the Phuleli channel. Accounts of their numbers range from under 10,000 to 30,000. After hours of close fighting with sword and bayonet along the bank the Baluch gave way. The British lost about 260 killed and wounded; Baluch losses were put at several thousand. Mir Sher Muhammad of Mirpur, with perhaps 8,000 more men, arrived too late. On 20 February the Hyderabad Mirs surrendered, and Napier occupied the city.
      - Sher Muhammad gathered a new army and marched on Hyderabad. On 24 March Napier, reinforced to about 5,000 men, attacked it at Dubba, a few kilometres from the city. The Talpur commander Hosh Muhammad Sheedi, an African-descended officer, was killed with many of his men, and Sher Muhammad fled. Napier took Mirpur on 27 March and the desert fort of Umarkot on 4 April. The Mirs were sent into exile in British India, and Sindh was annexed, with Napier as its governor; in 1847 it was joined to the Bombay Presidency. Sher Muhammad carried on resistance for some time before going into exile. In Britain the conquest was attacked as unjust, by Outram among others, but it was not reversed.
