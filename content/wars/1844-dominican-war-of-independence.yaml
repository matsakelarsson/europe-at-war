steps:
  - title: Independence and the campaign of 1844
    date: 1838 – May 1844
    when: "1844-02-27"
    borders: "1844-02-28"
    countries: [do, ht]
    body:
      - In 1838 Juan Pablo Duarte, a young merchant of Santo Domingo, founded the secret society La Trinitaria with Francisco del Rosario Sánchez, Matías Ramón Mella and others to free the east from Haitian rule. When the Haitian revolution of 1843 overthrew President Jean-Pierre Boyer, the Trinitarios first worked with the Haitian reformers, but the new president, Charles Rivière-Hérard, arrested their supporters and Duarte fled abroad. Conservative landowners and officials, some of whom were negotiating with the French consul for a protectorate, joined the separatists. On the night of 27 February 1844 Sánchez, Mella and their men seized the Puerta del Conde in Santo Domingo and proclaimed the Dominican Republic; the Haitian garrison capitulated the next day, and a governing junta took power.
      - Hérard invaded in March with some 30,000 men in three columns. In the south, Dominican troops under Pedro Santana, a cattle rancher from El Seibo, and Antonio Duvergé beat off the Haitian assault on Azua on 19 March, although Santana then fell back towards Baní and the Haitians occupied the town. In the north, General José María Imbert repulsed Jean-Louis Pierrot’s attack on Santiago on 30 March, and on 15 April a small Dominican squadron defeated Haitian ships off Tortuguero, near Azua. A rising of peasants in southern Haiti and the overthrow of Hérard on 3 May led the Haitian armies to withdraw. In July Santana seized power with the army; he had Duarte, Sánchez and Mella declared traitors and exiled, and in November became president under the first Dominican constitution.
