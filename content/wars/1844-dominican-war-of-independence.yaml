id: dominican-war-of-independence
name: Dominican War of Independence
start: "1844-02-27"
end: "1856-01-24"
tier: B
summary: "The wars in which the Dominican Republic broke away from Haiti, which had ruled the whole of Hispaniola since 1822, and beat off Haitian attempts to reunite the island. Juan Pablo Duarte’s secret society La Trinitaria, founded in 1838, and conservatives who hoped for French protection joined forces after the revolution of 1843 in Haiti, and on 27 February 1844 Francisco del Rosario Sánchez and Matías Ramón Mella proclaimed independence at the Puerta del Conde in Santo Domingo. President Charles Rivière-Hérard invaded in March 1844, but his armies were repulsed at Azua (19 March) and Santiago (30 March), a Dominican squadron won off Tortuguero (15 April), and a rising in Haiti that overthrew Hérard ended the campaign. Pedro Santana, the cattle rancher who led the Army of the South, seized power and exiled Duarte. Further Haitian invasions were beaten at La Estrelleta and Beler (1845), at El Número and Las Carreras (April 1849) under Faustin Soulouque, and, after Soulouque had made himself emperor, at Santomé, Cambronal (22 December 1855) and Sabana Larga (24 January 1856), after which Haiti made no further attempt to retake the east. In 1861 Santana handed the country back to Spain, which led to the Dominican Restoration War."
countries: [do, ht]
