  - title: Santomé and Sabana Larga
    date: December 1855 – January 1856
    when: "1855-12-22"
    borders: "1856-01-24"
    countries: [do, ht]
    body:
      - Soulouque, who had proclaimed himself Emperor Faustin I in 1849, invaded again in December 1855 with an army that Dominican accounts put at about 30,000 men, in a southern army aiming at San Juan and Azua and a northern one aiming at Santiago. On 22 December José María Cabral defeated the southern army at Santomé, near San Juan de la Maguana, where some 700 Haitian soldiers are said to have been killed, and on the same day a small Dominican force beat another column at Cambronal, near Neiba. In the north, General Juan Luis Franco Bidó defeated the emperor’s main army at Sabana Larga, near Dajabón, on 24 January 1856, and another Haitian force was beaten at Jácuba, near Puerto Plata.
      - The Haitian armies withdrew, and Haiti made no further attempt to retake the east. Soulouque was overthrown in 1859 by Fabre Geffrard, who turned to making peace. The cost of the twelve years of war is not known; Haiti probably lost about twice as many soldiers as the Dominican Republic. Fear of another Haitian invasion and Santana’s own ambitions led him to hand the country back to Spain in 1861.
    facts:
      - [Santomé and Cambronal, "22 December 1855"]
      - [Sabana Larga, "24 January 1856"]
      - [Spanish annexation, "18 March 1861"]
