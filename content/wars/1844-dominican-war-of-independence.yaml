  - title: The invasions of 1845 and 1849
    date: 1845–1849
    when: "1849-04-21"
    borders: "1849-04-21"
    countries: [do, ht]
    body:
      - In 1845 President Jean-Louis Pierrot sent new armies across the border. Dominican troops under José Joaquín Puello beat them at La Estrelleta, in the west, on 17 September, and Francisco Antonio Salcedo defeated another army at Beler, near Monte Cristi, later that autumn; Dominican schooners raided the Haitian coast. Pierrot was overthrown in 1846, and for three years Haiti made no new attack.
      - In March 1849 President Faustin Soulouque invaded with an army that Dominican accounts put at 10,000 to 18,000 men. It took Las Matas, San Juan and Azua, and the Dominican government of Manuel Jimenes called back Santana. On 19 April the Dominicans held the pass of El Número, east of Azua, and on 21–22 April Santana with a few hundred men routed Soulouque’s army at Las Carreras, on the Ocoa River near Baní. The Haitians retreated, harried by a Dominican squadron along the coast, and burned towns as they went. Santana then overthrew Jimenes and put Buenaventura Báez in the presidency.
