notes:
  - "Most accounts of the battles come from Dominican national histories, which give very large Haitian armies and very small Dominican losses; Haitian historians such as Thomas Madiou give other figures. The numbers here are those commonly cited and are best read as rough."
  - "Haiti’s constitutions declared the island one and indivisible, and Haitian governments saw the campaigns as wars to restore the country’s unity and to keep a European power from gaining a foothold on the island; Dominican conservatives did seek French, British and Spanish protection, and Spain annexed the country in 1861."
  - Haiti’s rule over the east from 1822 to 1844 is told in the Haitian occupation of Santo Domingo.
