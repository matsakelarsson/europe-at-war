id: franco-moroccan-war
name: Franco-Moroccan War
start: "1844-05-30"
end: "1844-09-10"
tier: C
summary: "A short war between France and Morocco over Abd al-Qadir, who carried on his war against the French conquest of Algeria from Moroccan territory with the support of many Moroccans. After clashes at the French post of Lalla Maghnia on the undefined border in May and June 1844, a French squadron under the Prince de Joinville bombarded Tangier on 6 August. On 14 August Marshal Bugeaud, with about 11,000 men, defeated a much larger Moroccan army, mostly cavalry, under the sultan’s son Sidi Mohammed on the Isly river near Oujda and took its camp; by Moroccan and French counts Morocco lost more than a thousand dead and France a few dozen. On 15–16 August the French bombarded Mogador (Essaouira) and occupied its island. Sultan Abd al-Rahman made peace by the Treaty of Tangier on 10 September 1844, agreeing to outlaw Abd al-Qadir, reduce the garrison at Oujda and mark the border. The Treaty of Lalla Maghnia of March 1845 drew the line from the coast to Teniet el-Sassi but left the desert border undefined, which led to disputes for more than a century."
