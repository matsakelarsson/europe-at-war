notes:
  - "Figures vary: French accounts give Bugeaud between 11,000 and 15,000 men and the Moroccan army 25,000 to 40,000 or more; Moroccan losses at Isly are put at 800 to more than 1,100 dead. The war is told on the map in the French conquest of Algeria."
