steps:
  - title: Mudki and Ferozeshah
    date: December 1845
    when: "1845-12-11"
    borders: "1845-12-22"
    countries: [in, pk]
    body:
      - Ranjit Singh died on 27 June 1839, and in the next six years the court at Lahore was torn apart by intrigue and murder. His son Kharak Singh was pushed aside and died in 1840; his grandson Nau Nihal Singh was killed by a falling archway on the day of his father’s funeral; his son Sher Singh was murdered with the wazir Dhian Singh in 1843. By 1845 the Maharaja was the seven-year-old Duleep Singh, with his mother, Rani Jind Kaur, as regent. The real power was the Khalsa army, perhaps 80,000 strong or more, with modern artillery, run by elected regimental committees (panchayats). The Company, fresh from its disaster in Afghanistan and its conquest of Sindh, moved troops and bridging boats up to the Sutlej, at Ferozepur, Ludhiana and Ambala.
      - On 11 December 1845 the Sikh army began to cross the Sutlej near Harike. In Sikh eyes it was moving into the Maharaja’s own lands south of the river; the Governor-General, Sir Henry Hardinge, treated it as an invasion and declared war on 13 December. Tej Singh surrounded Ferozepur but did not attack its garrison of about 7,000, while the wazir Lal Singh moved east. On 18 December, after a long march, the commander-in-chief, Sir Hugh Gough, met Lal Singh’s force of about 10,000 at Mudki and drove it back in a battle that lasted into the night; the British lost 215 killed and 657 wounded.
      - On 21 December Gough, joined by the Ferozepur garrison, attacked the entrenched Sikh camp at Ferozeshah late in the afternoon. The fighting went on into the dark and some of the camp was taken at great cost. The next morning Lal Singh’s troops abandoned it, but then Tej Singh arrived with a fresh army. The exhausted British, almost out of ammunition, expected to be overrun; Hardinge had his papers burned. After a cannonade Tej Singh withdrew across the Sutlej. Ferozeshah cost the British about 694 killed and 1,721 wounded, and the Sikhs some 70 guns and an unknown number of men.
