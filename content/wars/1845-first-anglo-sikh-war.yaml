id: first-anglo-sikh-war
name: First Anglo-Sikh War
start: "1845-12-11"
end: "1846-03-09"
tier: B
summary: "The first war between the East India Company and the Sikh Empire, fought along the Sutlej river six years after Maharaja Ranjit Singh’s death had left the Punjab in the hands of rival court factions and a powerful, self-governing army. The Sikh army crossed the Sutlej in December 1845 and fought four hard battles, at Mudki, Ferozeshah, Aliwal and Sobraon, all won by the British at heavy cost. By the Treaty of Lahore of March 1846 the Sikh state lost the Jullundur Doab, paid a large indemnity and gave up Kashmir, which the Company sold a week later to Gulab Singh of Jammu by the Treaty of Amritsar. A British Resident took control of the government in Lahore."
countries: [in, pk]
