  - title: Aliwal and Sobraon
    date: January – February 1846
    when: "1846-01-28"
    borders: "1846-02-20"
    countries: [in, pk]
    body:
      - In January the Sikhs tried to cut the Company’s supply lines. Ranjodh Singh Majithia crossed the Sutlej upstream with about 10,000 men and many guns and threatened Ludhiana. On 21 January his cavalry fell on the column of Sir Harry Smith near Baddowal and captured much of its baggage. A week later, on 28 January 1846, Smith, now with about 10,000 men, attacked Ranjodh Singh’s army of about 15,000 at Aliwal, drove it back into the river and took almost all its guns.
      - The main Sikh army had built a fortified bridgehead at Sobraon on the left bank of the Sutlej, joined to the right bank by a bridge of boats. On 10 February Gough bombarded it and then stormed it with about 20,000 men. The Sikhs fought hard; the veteran general Sham Singh Attariwala was killed leading a counter-attack. When they fell back, the bridge, weakened by the swollen river, gave way. British accounts say it collapsed under the weight of the retreating soldiers; many Sikh accounts say Tej Singh had it cut. Thousands drowned or were shot in the water. Estimates of Sikh dead range from about 8,000 to 10,000; British losses were 2,383 killed and wounded.
      - The British crossed the Sutlej at Ferozepur, reached Kasur and on 20 February 1846 entered Lahore without further fighting. Gulab Singh, the Raja of Jammu, who had kept his own troops out of the war, negotiated the peace for the Lahore court.
