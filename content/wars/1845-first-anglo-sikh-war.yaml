notes:
  - The Company’s armies were mostly Indian sepoys of the Bengal Army under British officers, with some British Army regiments. The Governor-General, Sir Henry Hardinge, served under the commander-in-chief, Sir Hugh Gough, during the campaign.
  - The Sikh army’s commanders, the wazir Lal Singh and the commander-in-chief Tej Singh, were accused then and later, above all by Sikh historians, of wanting the army defeated and of passing information to the British. Historians still disagree on how far this decided the war.
  - Troop numbers and losses differ between sources, especially for the Sikh side; ranges are given where they disagree.
