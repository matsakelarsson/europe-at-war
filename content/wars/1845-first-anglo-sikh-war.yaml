  - title: The treaties of Lahore and Amritsar
    date: March – December 1846
    when: "1846-03-09"
    borders: "1846-03-16"
    countries: [in, pk]
    body:
      - "The Treaty of Lahore, signed on 9 March 1846, left Duleep Singh on his throne but took much of his kingdom. The Company annexed the Jullundur Doab, between the Beas and the Sutlej, and the hill country of Kangra. It demanded an indemnity of 15 million rupees; since the treasury could not pay, the Sikh state gave up instead, for 10 million of it, the hill lands between the Beas and the Indus: Kashmir and Hazara. The Sikh army was cut to 20,000 infantry and 12,000 cavalry, and a British force stayed in Lahore."
      - A week later, by the Treaty of Amritsar of 16 March, the Company sold Kashmir and the hill country east of the Indus to Gulab Singh for 7.5 million rupees, making him Maharaja of Jammu and Kashmir under British protection. The Sikh governor of Kashmir, Sheikh Imamuddin, encouraged by Lal Singh, held out against the transfer until November 1846; Lal Singh was then removed and exiled. By the Treaty of Bhyroval of 16 December 1846 a British Resident, Henry Lawrence, and a council of Sikh chiefs were to govern the Punjab until Duleep Singh came of age, and Rani Jind Kaur was pensioned off. The Punjab was now a British protectorate in all but name.
    facts:
