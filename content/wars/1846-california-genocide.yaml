  - title: Extermination as policy
    date: 1851–1859
    when: "1851-01-07"
    borders: "1855-01-01"
    countries: [us]
    body:
      - "In January 1851 Governor Peter Burnett told the legislature that a war of extermination would continue between the races until the Indian race became extinct. The state raised and paid volunteer companies for expeditions against Native villages, up to $1.51 million in the 1850s, and towns such as Shasta and Marysville paid bounties for heads or scalps. The Mariposa Battalion, raised in 1851 against the Ahwahnechee, Yokuts and other peoples of the Sierra foothills, burned their food stores and became the first outsiders to enter Yosemite Valley; the Ahwahnechee leader Tenaya was captured and his people removed. On 23 April 1852 a posse led by the Trinity County sheriff killed more than 150 Wintu at Bridge Gulch, and in 1853 settlers set fire to the Tolowa town of Yontocket during a ceremony, killing between about 150 and 600 people."
      - "Federal commissioners signed eighteen treaties with Native leaders in 1851–1852 that would have set aside some 7.5 million acres for reservations; under pressure from California, the Senate rejected them in secret session in 1852, and the few military reservations created instead, such as Nome Lackee and Nome Cult, were poorly supplied and often raided for labourers. In Round Valley in 1859, after Yuki killed settlers’ livestock, settlers’ parties and Walter Jarboe’s state-sanctioned Eel River Rangers killed hundreds of Yuki; Jarboe himself reported 283 men killed and 292 captured in a few months, besides women and children. Contemporaries said it was a slaughter rather than a war."
    facts:
      - [Burnett’s message to the legislature, "January 1851"]
      - [Treaties rejected by the Senate, "18, in 1852"]
      - [State spending on militia expeditions, "up to $1.51 million"]
      - [Mendocino War, "July 1859 – January 1860"]
