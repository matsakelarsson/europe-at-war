notes:
  - "Numbers are uncertain and disputed. The demographer Sherburne Cook counted 4,556 killings between 1847 and 1865 in 1943; Benjamin Madley (An American Genocide, 2016) documents at least 9,492 to 16,094 killings between 1846 and 1873, among them 1,680 to 3,741 by the US Army; Gary Clayton Anderson argues for no more than about 2,000 and for the term ethnic cleansing, an estimate others have called far too low. Disease, hunger and the breakdown of Native ways of life killed more people than violence did, and historians differ over how far these deaths were the intended result of state policy."
  - "Spanish and Mexican rule from 1769 had already brought great loss of life through the missions and disease; this entry tells the period after the American conquest. The Modoc War of 1872–1873 is told in its own entry."
