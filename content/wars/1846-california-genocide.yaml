steps:
  - title: Conquest, gold and the indenture law
    date: 1846–1850
    when: "1846-04"
    borders: "1850-05-15"
    countries: [us]
    body:
      - "In 1846 California was a Mexican province in which Native people far outnumbered the settlers, many of them working on ranchos under conditions close to servitude. On 5 April 1846, before the war with Mexico, John C. Frémont’s exploring party attacked a gathering of Wintu on the Sacramento River near present-day Redding, killing by various estimates from about 120 to several hundred people, up to 900 by some accounts, and in May it destroyed a Klamath fishing village. American forces took California in 1846–1847, and in January 1848 gold was found at Coloma; within a few years some 300,000 newcomers had arrived, overrunning the valleys and foothills where Native people hunted, fished and gathered acorns."
      - "California entered the Union in 1850 with a constitution that denied Native people the vote. In April 1850 the legislature passed the Act for the Government and Protection of Indians, which let whites take Native children as wards and hire out Native adults arrested for vagrancy, the legal basis for decades of kidnapping and forced labour. At Clear Lake, Pomo workers whom the ranchers Andrew Kelsey and Charles Stone had held captive, starved and flogged killed the two men in December 1849; on 15 May 1850 US Army dragoons and infantry under Nathaniel Lyon attacked the Pomo gathered on an island in the lake, which became known as Bloody Island, killing at least 60 and by other estimates up to 200, or by one contemporary report hundreds, mostly women, children and old people."
    facts:
      - [Sacramento River massacre, "5 April 1846"]
      - [Gold found at Coloma, "24 January 1848"]
      - [Indenture act, "22 April 1850"]
      - [Bloody Island massacre, "15 May 1850"]
