id: california-genocide
name: California genocide
start: "1846-04"
end: "1873"
tier: B
summary: "The killing, enslavement and starvation of the Native peoples of California after the American conquest of 1846, during the gold rush and the first decades of statehood. Between 1846 and 1873 settlers, miners, volunteer companies paid by the state and the US Army killed, by the historian Benjamin Madley’s count, between about 9,500 and 16,000 Native Californians, in hundreds of attacks on villages; several thousand more died of starvation or forced labour. The Native population, perhaps 300,000 before Spanish colonisation and about 150,000 at the American conquest, fell to about 30,000 by 1870 and 16,000 by 1900, through killing, disease, hunger and the loss of land and food. California’s first laws denied Native people the vote and the right to testify against whites, and the Act for the Government and Protection of Indians of 1850 allowed Native children and adults to be bound as unpaid labourers; between 10,000 and 27,000 were held in forced labour. Governor Peter Burnett told the legislature in 1851 that a war of extermination would go on until the Indian race became extinct, and the state paid up to $1.51 million for militia expeditions, much of it repaid by the federal government. Eighteen treaties that would have set aside reservations were rejected by the Senate in 1852. In 2019 Governor Gavin Newsom apologised on behalf of the state and called what happened a genocide; most historians now use the word, while some prefer terms such as ethnic cleansing and give lower death tolls."
countries: [us]
