  - title: Tuluwat, the forced marches and the last killings
    date: 1860–1873
    when: "1860-02-26"
    borders: "1864-01-01"
    countries: [us]
    body:
      - "Before dawn on 26 February 1860 settlers crossed Humboldt Bay to Tuluwat (Indian Island), where the Wiyot had gathered for their World Renewal ceremony, and killed between about 80 and 250 people, most of them women, children and old people, with hatchets, clubs and knives; other Wiyot villages were attacked the same week. The writer Bret Harte, who condemned the killings in a local newspaper, had to leave town. In north-western California the US Army and California volunteers fought the Hupa, Chilula, Whilkut, Wailaki and other peoples in the Bald Hills War of 1858–1864, which ended with the Hoopa Valley reservation."
      - "During the Civil War the army moved Native people by force to distant reservations. In September 1863 soldiers marched 461 Konkow Maidu and others from Chico across the Sacramento Valley and the Coast Ranges to Round Valley; only 277 arrived; 32 died on the way and some 150, too sick and hungry to go on, were left behind. In the Mill Creek country the Yahi were hunted down in massacres in 1865 and about 1867 and 1871; Ishi, the last known Yahi, came out of hiding in 1911. The Modoc War of 1872–1873 is often seen as the last chapter. By 1870 about 30,000 Native people were left in California, from about 150,000 in 1846."
      - "In 2019 Governor Gavin Newsom issued an executive order apologising to California’s Native peoples for the violence, discrimination and exploitation sanctioned by the state, calling it a genocide, and set up a Truth and Healing Council. Tuluwat was returned to the Wiyot Tribe by the city of Eureka in 2019."
    facts:
      - [Wiyot massacre at Tuluwat, "26 February 1860"]
      - [Forced march from Chico to Round Valley, "September 1863, 461 set out, 277 arrived"]
      - [Native population of California, "about 150,000 in 1846, about 30,000 in 1870"]
