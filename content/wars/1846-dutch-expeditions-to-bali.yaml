id: dutch-expeditions-to-bali
name: Dutch expeditions to Bali
start: "1846-06"
end: "1849-07-15"
tier: B
summary: "Three Dutch military expeditions against the Balinese kingdoms of Buleleng, Karangasem and Klungkung in 1846, 1848 and 1849. The Dutch, anxious to keep other European powers out of Bali, had made the Balinese rulers sign contracts in 1841–1843 that gave up tawan karang, the ruler’s customary right to ships wrecked on his coast, and that the Dutch read as recognising their sovereignty. When Buleleng and Karangasem went on claiming wrecks, a first expedition in 1846 burned the palace of Buleleng at Singaraja. The patih (chief minister) of Buleleng, I Gusti Ketut Jelantik, then fortified Jagaraga, where he threw back a second expedition in June 1848. A third, larger expedition took Jagaraga in April 1849 and, with troops from the Balinese kingdom of Lombok, overran Karangasem; Jelantik and the raja of Buleleng were killed, and the raja of Karangasem took his own life. At Kusamba the forces of Klungkung killed the Dutch commander, Andreas Victor Michiels, in a night attack. A settlement negotiated at Kuta in July 1849 left the Dutch in control of Buleleng and Jembrana and gave Karangasem to Lombok, while the southern kingdoms stayed independent in practice until 1906."
