notes:
  - Bali was divided among several kingdoms, Klungkung, Karangasem, Buleleng, Jembrana, Badung, Tabanan, Gianyar, Mengwi and Bangli, whose rulers recognised the Dewa Agung of Klungkung as the highest in rank. Lombok was ruled by a branch of the Karangasem dynasty.
  - The Dutch force in each expedition was mostly Javanese, Madurese and Ambonese soldiers of the colonial army with European officers and a minority of European troops; in 1848 it included a company of African soldiers recruited on the Gold Coast. Dutch and Balinese figures for the dead differ widely, and Balinese losses were never counted.
