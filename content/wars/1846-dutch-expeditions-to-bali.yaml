steps:
  - title: The reef right and the first expedition
    date: June – August 1846
    when: "1846-06"
    borders: "1846-06-01"
    countries: [id]
    body:
      - Balinese custom gave a ruler tawan karang, the right to ships wrecked on his coast and their cargoes. In 1841–1843 Dutch envoys, anxious to forestall British or other European interest in Bali, made the rulers of Bali and Lombok sign contracts in which they gave up the reef right in return for salvage payments; the Dutch read the contracts as acknowledging Dutch sovereignty, which the rulers did not. Buleleng and Karangasem went on seizing wrecks and refused to ratify the terms. In Buleleng the leading figure was the patih, I Gusti Ketut Jelantik, a determined opponent of the Dutch.
      - In June 1846 an expedition under Lieutenant Colonel Gerhardus Bakker arrived off Buleleng with 1,700 soldiers, 400 of them European, on two frigates, four steamers and more than fifty smaller vessels carrying 230 guns. The frigates bombarded the fortified shore, the troops landed and took Buleleng, and on 29 June they burned the royal palace at Singaraja, which the raja had abandoned. The raja of Karangasem submitted on 5 July and the raja of Buleleng on 9 July. They agreed to pay part of the cost of the war, to destroy their defences and to accept a Dutch garrison of 150 men at Buleleng. The main force went back to Java in August; Jelantik refused to pay, and began to fortify Jagaraga and seek allies among the other kingdoms.
    facts:
      - [Dutch force, "1,700 soldiers, 230 guns"]
      - [Singaraja burned, "29 June 1846"]
      - [Submission of Karangasem and Buleleng, "5 and 9 July 1846"]
    markers:
      - kind: taken
        side: nl
        name: Singaraja
        date: 29 June 1846
        text: Buleleng’s capital and royal palace, burned by the Dutch after the landing. The raja had left it.
        lonlat: [115.088, -8.112]
      - kind: event
        side: nl
        name: Karangasem
        date: 5 July 1846
        text: Its raja submitted to the Dutch and agreed to share the indemnity with Buleleng.
        lonlat: [115.607, -8.450]
      - kind: capital
        side: bal
        name: Klungkung
        date: "1846"
        text: Seat of the Dewa Agung, the highest in rank of the Balinese rulers.
        lonlat: [115.404, -8.535]
        lp: l
    arrows:
      - side: nl
        label: Bakker
        via: [[115.000, -7.700], [115.050, -7.950], [115.085, -8.100]]
  - title: Jagaraga, 1848
    date: May – June 1848
    when: "1848-06-09"
    borders: "1848-06-09"
    countries: [id]
    body:
      - In March 1848 the Dutch sent ultimatums to the rulers of Klungkung, Karangasem and Buleleng, giving them fourteen days to comply. A second expedition of about 2,400 men, a third of them European and the rest Javanese and Madurese soldiers with a company of Africans, under Major General Carel van der Wijck, with Jan van Swieten as chief of staff, arrived off Buleleng in May with nine warships. Jelantik had built a fortified position at Jagaraga, about 4 km inland from the landing place at Sangsit, with walls, trenches and about 25 guns; the Dutch put his force at about 16,000 men, some 1,500 of them with firearms.
      - On 8 June the fleet bombarded Sangsit, and on 9 June the troops marched inland in the heat to storm Jagaraga. The assault failed, and a Balinese counter-attack drove them back to their ships. Van Swieten reported 131 killed and 98 wounded; other accounts give about 200 or 264 Dutch dead. Balinese losses were also heavy, about 2,000 killed and wounded by one Balinese account. The fleet left for Java on 20 June and van der Wijck retired. The victory made Jelantik’s name across Bali, and Mengwi joined the kingdoms opposing the Dutch.
    facts:
      - [Dutch force, "about 2,400 men"]
      - [Balinese at Jagaraga, "about 16,000 by Dutch estimates"]
      - [Assault on Jagaraga, "9 June 1848, Balinese victory"]
    markers:
      - kind: battle
        side: bal
        name: Jagaraga
        date: 9 June 1848
        text: Jelantik’s fortified position on the slope above Sangsit, where the Dutch landed. The assault was beaten off and the Dutch re-embarked.
        lonlat: [115.161, -8.106]
      - kind: capital
        side: bal
        name: Klungkung
        date: "1848"
        text: The Dewa Agung of Klungkung and the rulers of Karangasem and Mengwi supported Buleleng.
        lonlat: [115.404, -8.535]
        lp: l
    arrows:
      - side: nl
        label: van der Wijck
        via: [[115.120, -7.960], [115.137, -8.085], [115.156, -8.102]]
  - title: Jagaraga, Kusamba and the peace of Kuta
    date: April – July 1849
    when: "1849-04-16"
    borders: "1849-07-15"
    countries: [id]
    body:
      - In April 1849 Major General Andreas Victor Michiels came to Buleleng with about 100 ships, 5,000 soldiers and 3,000 sailors. Singaraja had been abandoned, and more than 10,000 Balinese faced his troops along the road; talks failed. On 15 April about 4,000 soldiers began the march up to Jagaraga, and after hard fighting they took its defences by the next day. The Dutch lost 34 dead, the Balinese thousands. Many defenders, among them Jelantik’s wife, fought to the death in what the Dutch described as the first puputan they had seen. Jelantik and the raja of Buleleng escaped to Karangasem; about 1,000 men of Buleleng now joined the Dutch.
      - Michiels re-embarked and sailed round to the east coast, landing at Padang Bai. The ruler of Lombok, whose dynasty was a branch of the house of Karangasem, sent about 4,000 men on Dutch ships, who took the Karangasem capital; its raja killed his wives and then fell in the fighting. Jelantik and the raja of Buleleng were killed soon after, by Lombok troops according to most accounts. The Dutch then moved on Klungkung and took Goa Lawah and Kusamba, where disease thinned their ranks. On the night of 24–25 May the forces of Klungkung, led by Dewa Agung Istri Kanya, the co-ruler of Klungkung, attacked the Dutch bivouac at Kusamba. Michiels was mortally wounded and died the next day, and Jan van Swieten fell back on Padang Bai while the armies of Klungkung, Badung, Gianyar and Tabanan gathered.
      - The Danish trader Mads Lange, who kept a trading post at Kuta in Badung, carried messages between the two sides, and in talks at his post from 10 to 15 July 1849 van Swieten made peace with the rulers of Badung, Tabanan, Gianyar and Mengwi and an envoy of the ailing Dewa Agung. The Dutch dropped the oath of loyalty, the homage and the indemnities they had demanded. Buleleng and Jembrana passed under Dutch authority, with a Dutch controller over their rulers from 1855, and Karangasem went to Lombok. The southern kingdoms remained independent in practice for another half-century.
    facts:
      - [Dutch force, "about 5,000 soldiers and 3,000 sailors"]
      - [Jagaraga taken, "15–16 April 1849"]
      - [Michiels mortally wounded, "night of 24–25 May 1849"]
      - [Talks at Kuta, "10–15 July 1849"]
