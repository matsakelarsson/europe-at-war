id: krakow-uprising
name: Kraków Uprising
start: "1846-02-20"
end: "1846-03-04"
tier: C
summary: A Polish rising for national independence and the end of serfdom, launched in the Free City of Kraków on the night of 20 February 1846 and put down by Austrian and Russian troops within about nine days. In neighbouring Galicia, peasants encouraged by Austrian officials turned on the Polish nobility in the Galician slaughter, killing by some estimates about 1,000 nobles, and in November 1846 Austria annexed Kraków with Russian and Prussian consent.
