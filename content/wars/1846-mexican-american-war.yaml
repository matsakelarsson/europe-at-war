  - title: Occupation and guerrilla war
    date: September 1847 – May 1848
    when: "1847-10-09"
    borders: "1847-11-11"
    countries: [us, mx]
    body:
      - "Santa Anna resigned the presidency and in late September besieged the small US garrison left at Puebla; it held out until a relief column under Joseph Lane arrived. On 9 October Lane beat Santa Anna at Huamantla, where his men, after their commander Samuel Walker was killed, looted the town. Santa Anna was relieved of his command and left Mexico in 1848. Mexico’s government, led by Manuel de la Peña y Peña, moved to Querétaro."
      - "US troops held Mexico City and the main towns and roads of the centre and north under military government until mid-1848. Guerrilla bands, some led by priests such as Celedonio Domeco de Jarauta, attacked convoys on the road from Veracruz, and the occupiers answered with reprisals against villages. On the Pacific, the US Navy occupied Guaymas in October and Mazatlán in November 1847, and small US garrisons at La Paz and San José del Cabo in Baja California withstood sieges by Mexican forces and local volunteers until early 1848."
    facts:
      - [Siege of Puebla, "14 September – 12 October 1847"]
      - [Battle of Huamantla, "9 October 1847"]
      - [Mazatlán occupied, "11 November 1847"]
