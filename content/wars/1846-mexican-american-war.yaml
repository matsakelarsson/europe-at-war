  - title: Buena Vista
    date: February 1847
    when: "1847-02-22"
    borders: "1847-02-22"
    countries: [us, mx]
    body:
      - "Learning from a captured dispatch that Taylor had been stripped of most of his regulars, Santa Anna marched north from San Luis Potosí at the end of January 1847 with some 20,000 men, across about 400 km of desert in winter; thousands died or deserted on the way. Taylor, with about 4,600 men, most of them volunteers who had never fought, took position at the narrow pass of La Angostura near the hacienda of Buena Vista, south of Saltillo."
      - "In two days of fighting on 22–23 February, Santa Anna’s army of about 15,000 turned the US left and came close to breaking the line; the light artillery, and Mississippi and Indiana volunteers under Colonel Jefferson Davis, held it. Among the Mexican gunners was the Saint Patrick’s Battalion, Irish and other European immigrants who had deserted the US Army, many of them Catholics angered by the nativism of their officers. On the night of the 23rd Santa Anna withdrew towards San Luis Potosí, claiming a victory: the US lost about 670 killed and wounded, the Mexicans about 1,600 killed and wounded and some 1,900 missing."
      - "In Mexico City the vice-president, Valentín Gómez Farías, had decreed the seizure of church property to pay for the war; in late February the militia battalions of the well-to-do, known as the polkos, rose against him. Santa Anna returned to the capital, settled the revolt by repealing the law, and marched east to meet Scott."
    facts:
