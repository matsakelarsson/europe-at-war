  - title: The Army of the West in New Mexico and Chihuahua
    date: June 1846 – March 1847
    when: "1846-08-18"
    borders: "1846-08-18"
    countries: [us, mx]
    body:
      - "In June 1846 Colonel Stephen W. Kearny led the Army of the West, about 1,700 regulars and Missouri volunteers, from Fort Leavenworth along the Santa Fe Trail. New Mexico’s governor, Manuel Armijo, gathered militia in Apache Canyon but withdrew without a fight, and on 18 August Kearny entered Santa Fe and proclaimed the province part of the United States. He named the trader Charles Bent governor and in September set off for California with 300 dragoons."
      - "Some New Mexicans, Hispanos and Pueblo people, planned a rising. On 19 January 1847 rebels at Taos killed Governor Bent and other officials, and attacks spread through the north. Colonel Sterling Price marched from Santa Fe with about 350 men, beat the rebels at Santa Cruz de la Cañada and Embudo Pass, and on 3–4 February besieged Taos Pueblo, where the rebels had taken refuge in the church. Artillery broke its walls; about 150 defenders were killed. After courts convened by the occupiers, more than two dozen men were hanged, some of them for treason against a country of which they were not citizens."
      - "Colonel Alexander Doniphan’s Missouri volunteers marched south: they beat a Mexican force at El Brazito on 25 December 1846, took El Paso del Norte, and on 28 February 1847 routed a larger Mexican army at the Sacramento River outside Chihuahua, which they occupied on 1 March, before marching on to join Taylor."
    facts:
      - [Kearny enters Santa Fe, "18 August 1846"]
      - [Taos Revolt, "19 January – February 1847"]
      - [Siege of Taos Pueblo, "3–4 February 1847"]
      - [Battle of the Sacramento, "28 February 1847"]
