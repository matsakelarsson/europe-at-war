  - title: Monterrey and Santa Anna’s return
    date: August – November 1846
    when: "1846-09-21"
    borders: "1846-09-24"
    countries: [us, mx]
    body:
      - "In August 1846 Antonio López de Santa Anna, exiled in Cuba after his overthrow in 1844, was let through the US naval blockade at Veracruz after hinting to Polk’s agents that he would make peace. Instead he took command of the Mexican army and became president again, and began to raise a new army at San Luis Potosí."
      - "Taylor advanced up the Rio Grande and across the desert to Monterrey, the capital of Nuevo León, defended by General Pedro de Ampudia with about 7,300 men in the city and its hill forts. Taylor attacked on 21 September with about 6,200 men from two sides; William J. Worth’s division stormed the heights of Independencia and Federación in the west, while in the east the Americans fought their way through the streets, tunnelling through the walls of houses. On 24 September Ampudia surrendered the city on terms that let his army march out with its arms and gave an eight-week armistice, which angered Polk. US losses were about 530 killed, wounded and missing, Mexican about 370."
      - "Taylor occupied Saltillo in November, and the navy took Tampico, the second port of the Gulf coast, on 14 November. Polk, mistrusting Taylor, a Whig, decided to send Winfield Scott with an army to Veracruz, and took many of Taylor’s best troops for it."
    facts:
      - [Battle of Monterrey, "21–24 September 1846"]
      - [Santa Anna lands at Veracruz, "16 August 1846"]
      - [Tampico occupied, "14 November 1846"]
