steps:
  - title: Annexation and the Nueces Strip
    date: March 1845 – May 1846
    when: "1846-04-25"
    borders: "1846-04-25"
    countries: [us, mx]
    body:
      - "On 1 March 1845 the US Congress voted to annex the Republic of Texas, which Mexico had never recognised, and Mexico broke off relations. Texas claimed the Rio Grande as its border, but the Mexican province of Texas had ended at the Nueces River, and the land between the two rivers, the Nueces Strip, was thinly settled and held by Mexican ranchers and Native peoples. President James K. Polk, elected in 1844 on a platform of expansion, also wanted Mexico’s provinces of New Mexico and California. In late 1845 he sent John Slidell to Mexico City to offer up to $25 million for them and for the Rio Grande border; the Mexican governments of José Joaquín de Herrera and of Mariano Paredes, who overthrew him for being too ready to negotiate, refused to receive him."
      - "Polk ordered General Zachary Taylor, whose army of some 3,500 to 4,000 men had camped at Corpus Christi since mid-1845, to advance to the Rio Grande. In March 1846 Taylor built a fort, Fort Texas, opposite the Mexican town of Matamoros. On 25 April Mexican cavalry under Anastasio Torrejón crossed the river and surprised a patrol of about 80 US dragoons under Captain Seth Thornton at the Rancho de Carricitos, killing about 15 and capturing most of the rest. Polk told Congress that Mexico had “shed American blood upon the American soil”, and on 13 May Congress declared war."
      - "Opponents in the United States, mainly Whigs, held that the war had been provoked on Mexican land; Representative Abraham Lincoln later challenged Polk to show the “spot” where the blood had been shed. Many in the North saw it as a war to spread slavery, and in August 1846 the Wilmot Proviso, which would have barred slavery from any land won from Mexico, passed the House but failed in the Senate."
    facts:
      - [Annexation of Texas, "voted 1 March 1845; Texas admitted 29 December 1845"]
      - [Thornton Affair, "25 April 1846"]
      - [US declaration of war, "13 May 1846"]
