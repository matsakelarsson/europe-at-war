  - title: The conquest of California
    date: June 1846 – January 1847
    when: "1846-07-07"
    borders: "1846-07-07"
    countries: [us, mx]
    body:
      - "Mexican Alta California had perhaps 8,000 to 10,000 Californios, the Hispanic ranchers and townspeople, a growing number of US immigrants in the north, and more than 100,000 Native Californians, many of whom worked the ranchos. On 14 June 1846, before news of the war arrived, US settlers seized Sonoma and raised a flag with a grizzly bear, proclaiming a California Republic, with the support of Captain John C. Frémont and his armed survey party. On 7 July Commodore John D. Sloat’s Pacific Squadron landed marines at Monterey, the capital, and claimed California for the United States; Commodore Robert F. Stockton and Frémont occupied San Diego and Los Angeles in August with little resistance."
      - "In September the Californios of Los Angeles rose under José María Flores and drove out the small US garrison, and the south was retaken by mounted militia armed with lances. Kearny, arriving overland from New Mexico with about 100 tired dragoons, attacked Andrés Pico’s Californio lancers at San Pasqual on 6 December 1846 and lost about 20 killed, the costliest US fight in California. Stockton and Kearny then marched north from San Diego with sailors, marines and volunteers, won at the San Gabriel River and La Mesa on 8–9 January 1847 and reoccupied Los Angeles. On 13 January Pico surrendered to Frémont at Cahuenga, on terms that let the Californios go home."
    facts:
      - [Bear Flag Revolt, "14 June 1846, Sonoma"]
      - [US landing at Monterey, "7 July 1846"]
      - [Battle of San Pasqual, "6 December 1846"]
      - [Treaty of Cahuenga, "13 January 1847"]
