  - title: Veracruz and Cerro Gordo
    date: March – May 1847
    when: "1847-03-09"
    borders: "1847-04-18"
    countries: [us, mx]
    body:
      - "On 9 March 1847 Winfield Scott landed about 10,000 men on the beaches south of Veracruz in a single day, the largest amphibious landing the US forces had yet made. He besieged the walled city and, rather than storm it, bombarded it with army and naval guns from 22 March. Shells fell on homes and churches; hundreds of civilians were killed, though estimates differ widely. On 27 March the garrison of some 3,300 surrendered, together with the fortress of San Juan de Ulúa, and marched out on the 29th. Scott hurried inland to escape the yellow fever season of the coast."
      - "Santa Anna blocked the national road at the pass of Cerro Gordo with about 12,000 men. Scott’s engineers, among them Captain Robert E. Lee, found a path around the Mexican left, and on 18 April the US army attacked from front and flank and routed the Mexicans, taking more than 3,000 prisoners, whom Scott released on parole. Scott occupied Jalapa and the fortress of Perote, and on 15 May Worth’s division entered Puebla, Mexico’s second city, without resistance. There Scott waited three months for reinforcements, as the terms of many of his volunteers ran out, while guerrillas attacked his supply line to the coast."
    facts:
      - [Landing at Veracruz, "9 March 1847"]
      - [Veracruz surrenders, "27–29 March 1847"]
      - [Battle of Cerro Gordo, "18 April 1847"]
      - [Puebla occupied, "15 May 1847"]
    markers:
