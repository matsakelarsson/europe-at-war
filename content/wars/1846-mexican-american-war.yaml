  - title: The Valley of Mexico
    date: August – September 1847
    when: "1847-09-13"
    borders: "1847-09-14"
    countries: [us, mx]
    view:
      center: [-99.10, 19.36]
      size: [70, 56]
    body:
      - "On 7 August Scott left Puebla with about 10,700 men, cutting loose from his line of supply. Avoiding the fortified hill of El Peñón on the main road, he marched around Lakes Chalco and Xochimilco to approach the city from the south. On 19–20 August his army defeated General Gabriel Valencia at Padierna (Contreras) and stormed the fortified convent of Churubusco, where the Saint Patrick’s Battalion and Mexican National Guards fought until their ammunition ran out. In the two battles the US lost about 1,300 killed, wounded and missing; the Mexicans lost several thousand killed and wounded and more than 2,000 captured."
      - "An armistice followed while Polk’s envoy, Nicholas Trist, negotiated, but talks broke down on 6 September. On 8 September Worth took the mill buildings of Molino del Rey at heavy cost, and on 13 September Scott stormed Chapultepec Castle, the military college on its hill; six young cadets who died defending it are honoured in Mexico as the Niños Héroes. That day 30 captured San Patricios were hanged within sight of the castle as the US flag was raised; some 20 more had been hanged days earlier. US troops fought their way through the western gates, and Santa Anna withdrew his army from the city that night. On 14 September Scott entered Mexico City, where townspeople fought the occupiers in the streets for two days."
    facts:
      - [Battles of Contreras and Churubusco, "19–20 August 1847"]
      - [Battle of Molino del Rey, "8 September 1847"]
      - [Battle of Chapultepec, "13 September 1847"]
      - [Scott enters Mexico City, "14 September 1847"]
