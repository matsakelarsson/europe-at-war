id: mexican-american-war
name: Mexican–American War
start: "1846-04-25"
end: "1848-02-02"
tier: A
summary: "The war of 1846–1848 in which the United States conquered the northern half of Mexico. The United States annexed Texas in 1845, which Mexico still regarded as a rebel province, and President James K. Polk, who wanted California and New Mexico as well, sent an army under Zachary Taylor to the Rio Grande, into land between the Nueces and the Rio Grande that both countries claimed. After Mexican cavalry attacked a US patrol there in April 1846, Congress declared war. Taylor won at Palo Alto, Resaca de la Palma, Monterrey and Buena Vista; Stephen W. Kearny took New Mexico and, with the navy and volunteers, California, where the Californios rose and were put down; and in 1847 Winfield Scott landed at Veracruz and fought his way inland to Mexico City, which fell in September. By the Treaty of Guadalupe Hidalgo of 2 February 1848 Mexico recognised the Rio Grande as the border of Texas and ceded California and New Mexico, together with Texas about half of its territory, for $15 million. About 13,000 Americans died, most of disease; Mexican losses are less certain but were higher. The war deepened the conflict over slavery in the United States, and in Mexico it is remembered as the US intervention, a national trauma."
countries: [us, mx]
sides:
  - id: us
    name: United States
    polities: [united-states]
    ink: blue
    moves: US moves
    success: US success
  - id: mx
    name: Mexico (with the Californios and the Taos rebels of 1847)
    polities: [mexico]
    ink: red
    moves: Mexican moves
    success: Mexican success
notes:
  - "In Mexico the war is called the US intervention in Mexico (la intervención estadounidense) or the war of 1847. Mexico’s government changed hands several times during the war, and Santa Anna, who returned from exile in August 1846, was its president and commander for most of it."
  - "Casualty figures: the US Army lost 1,733 killed in battle and about 11,500 dead of disease, out of about 79,000 regulars and volunteers. Mexican losses were never fully counted; estimates of soldiers killed range from about 5,000 in battle to 25,000 or more with the dead from wounds and disease, besides civilians."
  - "The Yucatán peninsula, which had broken away from Mexico, stayed neutral; from 1847 it was fighting the Caste War."
