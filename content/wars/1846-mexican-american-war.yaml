  - title: The Treaty of Guadalupe Hidalgo
    date: February – August 1848
    when: "1848-02-02"
    borders: "1848-05-30"
    countries: [us, mx]
    body:
      - "Polk recalled Trist in October 1847, but Trist stayed on and negotiated with Mexican commissioners, and on 2 February 1848 they signed a treaty at Guadalupe Hidalgo, just north of the capital. Mexico recognised the Rio Grande as the border of Texas and ceded Alta California and New Mexico, the present US states of California, Nevada and Utah and most of Arizona and New Mexico, with parts of Colorado and Wyoming. With Texas, Mexico had lost about half its territory. The United States paid $15 million and took over $3.25 million of claims by its citizens against Mexico, and promised to stop raids by Native nations from its new territory into Mexico. Mexicans living in the ceded lands could stay and become US citizens, with their property protected; in practice many lost their land over the following decades."
      - "Some expansionists in the United States had wanted all of Mexico, but the Senate ratified the treaty on 10 March 1848 by 38 votes to 14. The Mexican Congress, meeting at Querétaro, approved it in May, and ratifications were exchanged on 30 May. The last US troops left Veracruz on 2 August. Nine days before the signing, gold had been found at Sutter’s mill in California. In 1853 Mexico sold the Mesilla valley south of the Gila River to the United States (the Gadsden Purchase). The question of whether slavery would be allowed in the new lands divided Congress through the 1850s and led towards the Civil War."
    facts:
      - [Treaty signed, "2 February 1848"]
      - [US Senate ratifies, "10 March 1848"]
      - [Ratifications exchanged, "30 May 1848, Querétaro"]
      - [Land ceded, "about 1.36 million km² (525,000 square miles)"]
      - [Payment, "$15 million"]
