  - title: Palo Alto and Resaca de la Palma
    date: May 1846
    when: "1846-05-08"
    borders: "1846-05-08"
    countries: [us, mx]
    view:
      center: [-97.38, 25.97]
      size: [64, 52]
    body:
      - "General Mariano Arista crossed the Rio Grande with most of the Mexican Army of the North to cut Taylor off from his supply base at Point Isabel on the coast, while Mexican batteries in Matamoros bombarded Fort Texas from 3 May; its commander, Major Jacob Brown, was killed, and it was renamed Fort Brown. Taylor, returning from Point Isabel with a supply train, met Arista’s army of about 3,700 on the open prairie of Palo Alto on 8 May. With about 2,300 men he won the battle with his light artillery, whose fast-moving guns tore into the Mexican lines while the Mexican cannon, firing solid shot, fell short; Arista lost about 100 killed, Taylor nine."
      - "The next day Arista made a stand in a dry riverbed overgrown with chaparral, the Resaca de la Palma. Fighting there was hand to hand, and when US dragoons and infantry broke through, the Mexican army fled in disorder to the river, where many drowned. Arista abandoned Matamoros, and Taylor occupied it on 18 May. The victories made Taylor a national hero and later president."
    facts:
      - [Battle of Palo Alto, "8 May 1846"]
      - [Battle of Resaca de la Palma, "9 May 1846"]
      - [Matamoros occupied, "18 May 1846"]
      - [At Palo Alto, "about 2,300 US troops against about 3,700 Mexican"]
