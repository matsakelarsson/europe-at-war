id: second-carlist-war
name: Second Carlist War
start: "1846-09"
end: "1849-05"
tier: C
summary: A Carlist rising fought mainly in Catalonia, where it was called the War of the Matiners (“early risers”), after the guerrillas’ dawn raids. It broke out in 1846, after the plan to marry Isabella II to the Carlist claimant Carlos Luis, Count of Montemolín (“Carlos VI”), came to nothing, and the veteran general Ramón Cabrera returned from exile to lead it in 1848. Government armies under Fernando Fernández de Córdova wore the bands down, smaller risings elsewhere failed, Cabrera crossed back into France in the spring of 1849, and an amnesty followed that June.
