  - title: Bacalar and the Maya state
    date: 1858–1893
    when: "1858-02-21"
    borders: "1858-02-21"
    countries: [mx]
    body:
      - "On 21 February 1858 the Cruzob under Venancio Puc stormed Bacalar, the Yucatecan fort in the south, and killed most of its garrison and townspeople, including captives whom British officials from Belize had tried to ransom; survivors fled across the Río Hondo to British Honduras. In 1860 a Yucatecan expedition of some 2,500 to 3,000 men occupied Chan Santa Cruz and was routed, and later attempts also failed; in the 1860s the Yucatecans gave up the frontier town of Tihosuco."
      - "For more than three decades the Cruzob state ruled the eastern side of the peninsula, from north of Tulum to the Río Hondo, and its numbers shrank with war and epidemics. Britain dealt with it as a de facto independent state. A treaty signed in Belize in 1884 by a Cruzob general and Yucatán’s vice-governor, recognising Mexican sovereignty, was rejected by the Cruzob after a change of leaders."
    facts:
      - [Bacalar taken by the Cruzob, "21 February 1858"]
      - [Yucatecan expedition routed, "1860"]
