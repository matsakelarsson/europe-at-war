  - title: The Mexican conquest of Chan Santa Cruz
    date: 1893 – May 1901
    when: "1901-05-03"
    borders: "1901-05-05"
    countries: [mx]
    body:
      - "By the 1890s British investment in Porfirio Díaz’s Mexico mattered far more to London than the trade of Belize with the Cruzob. In 1893 Britain and Mexico signed the Spenser–Mariscal Treaty, ratified in 1897, which fixed the border of British Honduras on the Río Hondo and ended the sale of arms to the rebels. In January 1898 the Mexican navy anchored a customs post on the river mouth, and Othón P. Blanco founded Payo Obispo (now Chetumal) that May."
      - "General Ignacio Bravo advanced from Peto in 1899 with a federal army, building a road and a telegraph line through the forest and beating off Cruzob attacks. His troops entered Chan Santa Cruz on 3–4 May 1901 without a fight, the Cruzob having withdrawn, and on 5 May he telegraphed that the war was over; the navy reoccupied Bacalar the same month. The Cruzob scattered into forest villages, where measles and smallpox brought by the soldiers killed many. In 1902 Mexico made the east of the peninsula the federal territory of Quintana Roo, where political prisoners were sent as forced labour. The war was officially declared over again in 1915, and the last armed clash, at Dzulá, came in April 1933. In 2021 the governments of Mexico and Guatemala apologised to the Maya people for the repression of the war."
    facts:
      - [Spenser–Mariscal Treaty, "1893 (ratified 1897)"]
      - [Chan Santa Cruz occupied, "3–4 May 1901"]
      - [Territory of Quintana Roo, "1902"]
      - [Last armed clash, "Dzulá, April 1933"]
    markers:
