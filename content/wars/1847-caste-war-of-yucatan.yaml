id: caste-war-of-yucatan
name: Caste War of Yucatán
start: "1847-07-30"
end: "1901-05-05"
tier: A
summary: "The rising of the Maya of eastern and southern Yucatán against the Hispanic Yucatecan state, and the half-century war that followed. In the 1840s Yucatán, which had broken away from Mexico, was split between rival factions that armed Maya villagers for their own quarrels, while sugar estates spread into Maya lands and church fees and head taxes weighed on the villages. In July 1847 the Yucatecan authorities executed a Maya leader, Manuel Antonio Ay, for plotting a revolt, and on 30 July Cecilio Chi attacked Tepich. With Jacinto Pat, Chi’s armies took most of the peninsula by May 1848 and came close to Mérida and Campeche, until they dispersed and the Yucatecans, after rejoining Mexico in return for money and troops, drove them back. From 1850 the rebels of the south-east, inspired by a Speaking Cross, built an independent state centred on Chan Santa Cruz, armed through trade with British Honduras. Only after Britain agreed in 1893 to stop that trade did Mexican troops under Ignacio Bravo occupy Chan Santa Cruz, in May 1901; resistance in the villages went on into the 1930s. Yucatán’s population fell by 30 to 50 percent between 1846 and the 1860s through battle, massacre, hunger, disease and flight."
countries: [mx]
sides:
  - id: maya
    name: Maya rebels (Cecilio Chi and Jacinto Pat; from 1850 the Cruzob of Chan Santa Cruz)
    polities: [maya-rebels]
    ink: teal
    moves: Maya moves
    success: Maya success
  - id: yuc
    name: Yucatán (to 1848 the breakaway Republic of Yucatán) and Mexico
    polities: [republic-of-yucatan, mexico]
    ink: red
    moves: Yucatecan and Mexican moves
    success: Yucatecan and Mexican success
notes:
  - "“Caste War” is the name the Yucatecan elite gave the war, which they portrayed as a race war of Indians against whites. Historians stress that not all Maya rebelled, that many fought for the government, and that some Hispanic and mestizo villagers fought with the rebels; the rebels called themselves by other names, and their letters speak of taxes, land and oppression."
  - "The death toll is uncertain. Yucatán’s population fell by more than 40 percent between 1846 and 1862 by one modern count (Gabbert); deaths in the fighting are estimated at about 40,000 to 50,000, and the total loss of population, with hunger, disease and flight, at several times that."
  - "The war also reached British Honduras (Belize) and the Petén in Guatemala, which are told with Central America."
