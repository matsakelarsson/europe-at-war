  - title: The Speaking Cross
    date: 1850–1857
    when: "1850-10-15"
    borders: "1850-10-15"
    countries: [mx]
    body:
      - "In 1850, in the forest of the south-east, a cross carved on a tree beside a cenote began to speak to the defeated rebels, urging them to fight on. The leader José María Barrera promoted the cult, and the voice of the cross was given, by most accounts, by a ventriloquist, Manuel Nahuat. Its followers, the Cruzob (“people of the cross”), built a shrine town at the site, Chan Santa Cruz (now Felipe Carrillo Puerto). A Yucatecan raid in March 1851 killed Nahuat and carried off the cross, but new crosses spoke from the shrine, and the movement grew into a theocratic and military state, with its own church, a Patron of the Cross as its highest authority and companies of soldiers that took turns guarding the shrine."
      - "Other rebel groups made their peace. In 1853 the Maya of Chichanhá in the south, the pacíficos del sur, accepted a treaty that gave them autonomy in return for recognising the government, and the Icaiché later came to similar terms. The Cruzob refused. They sold timber and goods to the merchants of British Honduras, who supplied them with powder and guns, and raided the Yucatecan frontier, sacking Tekax in 1857."
    facts:
      - [Speaking Cross appears, "1850"]
      - [Peace with the pacíficos del sur, "1853"]
      - [Cruzob sack Tekax, "1857"]
    markers:
      - kind: capital
        side: maya
        name: Chan Santa Cruz
