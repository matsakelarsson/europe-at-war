  - title: The turn of the tide
    date: June 1848 – 1850
    when: "1848-08-17"
    borders: "1848-08-17"
    countries: [mx]
    body:
      - "In June 1848, with the cities almost in their grasp, the Maya armies broke up. The traditional explanation is that the men went home to plant their maize when the rains came; historians also point to exhausted supplies, quarrels between the leaders and the lack of any plan for taking walled cities. The Yucatecans counter-attacked. Barbachano turned to Mexico, which had just made peace with the United States, and on 17 August 1848 Yucatán rejoined the Mexican republic in return for money, arms and troops. Some 900 US veterans of the Mexican War, recruited with promises of pay and land, also fought for Yucatán."
      - "The government armies retook Izamal, Ticul, Tekax, Valladolid and Tihosuco, and in May 1849 Bacalar. Chi was killed by his secretary in December 1848, and Pat was killed by followers of a rival leader, Venancio Pec, in September 1849. The war became one of raids and reprisals on a forest frontier. From 1848 Yucatán’s governments sold captured Maya to Cuba as contract labourers, in practice slaves; one steamer alone, La Unión, carried 25 to 30 a month between 1855 and 1861, until the federal government banned the trade."
    facts:
      - [Yucatán rejoins Mexico, "17 August 1848"]
      - [Cecilio Chi killed, "December 1848"]
      - [Jacinto Pat killed, "September 1849"]
