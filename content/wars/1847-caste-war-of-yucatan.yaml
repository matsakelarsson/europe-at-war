steps:
  - title: A divided Yucatán and the outbreak
    date: 1839 – July 1847
    when: "1847-07-30"
    borders: "1847-07-30"
    countries: [mx]
    body:
      - "Yucatán, with its own trade by sea and its own elite in Mérida and Campeche, resisted rule from Mexico City. In 1839 the federalist Santiago Imán rose against the centralist government at Tizimín, arming Maya villagers with the promise of relief from taxes, and in 1841 Yucatán declared itself an independent republic; it beat off a Mexican invasion in 1842–1843, rejoined Mexico on terms and broke away again in 1846. Its politics were a feud between Miguel Barbachano’s party in Mérida and Santiago Méndez’s in Campeche, and both armed Maya soldiers, who did not give back their guns."
      - "In the south and east, where the Maya outnumbered Hispanic Yucatecans by about five to one, sugar estates and new land laws were taking village lands, debt bound workers to the estates, and Maya families paid head taxes and church fees that Hispanic Yucatecans did not. The batabs, the Maya village leaders, among them Jacinto Pat of Tihosuco, Cecilio Chi of Tepich and Manuel Antonio Ay of Chichimilá, had commanded Maya troops in the factional wars. In January 1847, in a revolt of one faction against the other, Maya soldiers sacked Valladolid and killed dozens of its Hispanic townspeople."
      - "In July 1847 the Méndez government learned that armed men were gathering on Pat’s estate. It arrested Ay, accused him of planning a revolt and hanged him in the square of Valladolid on 26 July; troops burned Tepich and killed or punished its people. On 30 July Chi attacked Tepich and ordered the deaths of its non-Maya inhabitants, and the rising spread through the villages of the east and south."
    facts:
      - [Republic of Yucatán declared, "1841"]
      - [Manuel Antonio Ay hanged, "26 July 1847, Valladolid"]
      - [Chi attacks Tepich, "30 July 1847"]
