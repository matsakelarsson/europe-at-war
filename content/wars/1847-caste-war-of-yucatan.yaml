  - title: The Maya offensive
    date: August 1847 – May 1848
    when: "1848-04-19"
    borders: "1848-05-28"
    countries: [mx]
    body:
      - "The Yucatecan government answered with executions of batabs across the peninsula, which drove more villages into the rising. Through the autumn and winter the Maya armies, Chi’s in the north-east and Pat’s in the south, took Tihosuco, Peto and town after town. Valladolid, the second city, was evacuated on 14 March 1848, and its column of refugees was attacked on the road. By May the rebels held Izamal, Ticul and Tekax, and in the south Bacalar fell to them."
      - "Barbachano, back in power, negotiated with Pat, and on 19 April 1848 at Tzucacab they agreed to abolish the head tax, cut church fees, return the villagers’ guns and let them farm untitled land without rent, with Barbachano and Pat as governors for life of the Hispanic and the Maya population. Chi rejected the treaty and the war went on. Méndez’s government, desperate, offered sovereignty over Yucatán to the United States, Spain and Britain in exchange for help; President Polk put the request to Congress, which debated it but did nothing."
      - "By late May 1848 the rebels held perhaps four-fifths of the peninsula. Tens of thousands of refugees crowded into Mérida, where Barbachano prepared a decree to evacuate the city, and only Campeche, the road between the two cities and the north-western coast remained in Yucatecan hands."
    facts:
      - [Valladolid evacuated, "14 March 1848"]
      - [Treaty of Tzucacab, "19 April 1848"]
      - [Greatest Maya advance, "late May 1848"]
