id: cayuse-war
name: Cayuse War
start: "1847-11-29"
end: "1855"
tier: C
summary: "A war in the Oregon Country between the Cayuse and the American settlers of the Willamette Valley, which began with the killing of the missionaries Marcus and Narcissa Whitman. Wagon trains on the Oregon Trail brought measles to the Columbia Plateau in 1847, and the epidemic killed about half of the Cayuse, while most white children treated at the Whitman mission at Waiilatpu, near today’s Walla Walla, recovered. On 29 November 1847 a group of Cayuse men led by Tiloukaikt and Tomahas, believing that Whitman was poisoning their people, killed him, his wife and eleven others at the mission and held some fifty people captive, most of them women and children, until Peter Skene Ogden of the Hudson’s Bay Company ransomed them a month later. The Provisional Government of Oregon raised about 500 volunteers, the Oregon Rifles, under Cornelius Gilliam, who fought the Cayuse and some of their allies at Sand Hollow on 24 February 1848 and burned villages, but could not bring the war to an end; Gilliam was killed in an accident in March. The war led Congress to organise Oregon Territory in August 1848. In 1850 the Cayuse handed over five men, Tiloukaikt, Tomahas, Klokamas, Isaiachalakis and Kimasumpkin, who were tried and hanged at Oregon City on 3 June 1850; whether all of them had taken part in the killings is doubted. Raids and patrols went on until the Walla Walla Council of 1855, where the Cayuse ceded most of their land and were placed with the Umatilla and Walla Walla on the Umatilla Reservation, and some of them fought again in the Yakima War."
