id: sonderbund-war
name: Sonderbund War
start: "1847-11-03"
end: "1847-11-29"
tier: B
summary: A short civil war in Switzerland between the Federal Diet and the Sonderbund, a defensive league of seven Catholic and conservative cantons. The federal army under General Guillaume Henri Dufour forced the league’s members to surrender one by one in under four weeks, with fewer than 100 dead, and the constitution of 1848 turned the loose confederation into a federal state.
