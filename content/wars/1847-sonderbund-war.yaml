  - title: Gisikon and the federal state
    date: 15 November 1847 – 12 September 1848
    when: "1847-11-17"
    borders: "1848-09-12"
    countries: [ch]
    body:
      - Dufour now marched his army against central Switzerland. On 17 November troops from Uri pushed down into Ticino and took Airolo, but the advance stalled near Biasca. Zug voted to surrender on 21 November without a fight. On 23 November five federal columns converged on Lucerne, and the Sonderbund council and Lucerne’s government withdrew to Uri. At Gisikon on the Reuss the Sonderbund army held a wooded height against two assaults before Colonel Eduard Ziegler led his division up it. It was the bloodiest fight of the war and the last pitched battle fought by Swiss troops.
      - Federal troops entered Lucerne on 24 November. The Sonderbund council broke up at Flüelen two days later; Unterwalden, Schwyz and Uri gave in, and Valais, the last, surrendered on 29 November. Later research counts about 60 federal and 33 Sonderbund dead. Dufour had ordered his men to spare the wounded and prisoners, and the war left less bitterness than many had feared. The defeated cantons were charged the war costs and got liberal governments. The Federal Constitution, adopted on 12 September 1848, made Switzerland a federal state and banned the Jesuits.
    facts:
      - [Battle of Gisikon, "23 November 1847, federal victory"]
      - [Last surrender, "Valais, 29 November 1847"]
      - [Dead, "about 60 federal and 33 Sonderbund soldiers"]
