    moves: Federal moves
    success: Federal success
  - id: sb
    name: Sonderbund
    polities: [sonderbund]
    ink: navy
    moves: Sonderbund moves
    success: Sonderbund success
notes:
  - The Sonderbund (“separate alliance”) was its opponents’ name for the league, which called itself a protective union (Schutzvereinigung). Unterwalden is today the two cantons of Obwalden and Nidwalden.
  - Neuchâtel, then both a Swiss canton and a principality of the King of Prussia, and Appenzell Innerrhoden stayed neutral and sent no troops.
