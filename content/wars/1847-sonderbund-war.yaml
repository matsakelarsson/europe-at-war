steps:
  - title: The separate alliance and the fall of Fribourg
    date: 1845 – 14 November 1847
    when: "1845-12-11"
    borders: "1847-11-14"
    countries: [ch]
    body:
      - Switzerland in the 1840s was a loose league of sovereign cantons under the Federal Treaty of 1815. Liberals and radicals, strongest in the Protestant and urban cantons, wanted a federal state; Catholic conservatives defended cantonal sovereignty and the Church. Aargau closed its monasteries in 1841, and Lucerne called in the Jesuits to run its schools in 1844. Bands of radical volunteers twice attacked Lucerne and were beaten off. On 11 December 1845 seven Catholic cantons, Lucerne, Uri, Schwyz, Unterwalden, Zug, Fribourg and Valais, formed a defensive league with its own council of war.
      - After elections in St Gallen gave the liberals a majority in the Federal Diet, it declared the league illegal under the Federal Treaty on 20 July 1847 and ordered it dissolved. Both sides mobilised in October. The Sonderbund struck first, seizing the St Gotthard on 3 November, and on 4 November the Diet resolved to dissolve it by force. General Guillaume Henri Dufour of Geneva, a moderate conservative, led about 100,000 federal troops. He turned first on isolated Fribourg, which surrendered on 14 November after a brief fight at one of its redoubts.
    facts:
      - [Sonderbund founded, "11 December 1845, in Lucerne"]
      - [Federal commander, General Guillaume Henri Dufour]
      - [Fribourg surrenders, "14 November 1847"]
