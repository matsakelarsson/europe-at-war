id: first-italian-war-of-independence
name: First Italian War of Independence
start: "1848-03-18"
end: "1849-08-22"
tier: A
summary: The first war of the Risorgimento, fought in 1848–1849 by the Kingdom of Sardinia, Italian volunteers and the revolutionary governments of Milan, Venice, Rome and Sicily against Austria and the rulers it backed. Austria’s Field Marshal Radetzky defeated Sardinia at Custoza in 1848 and at Novara in 1849, France destroyed the Roman Republic, the Bourbons retook Sicily and Venice surrendered in August 1849. The old order returned everywhere, but Sardinia kept its constitution and became the hope of Italian liberals.
