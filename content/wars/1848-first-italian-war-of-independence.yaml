  - title: Venice and Sicily
    date: September 1848 – August 1849
    when: "1849-04-28"
    borders: "1849-08-22"
    countries: [it, at]
    body:
      - After the Salasco armistice Venice restored its republic under Manin and held out alone. Austrian troops under Haynau laid siege to the fort of Marghera on the mainland on 28 April 1849, and after more than three weeks of bombardment its 2,000 defenders withdrew to the city on 26 May. The Austrians then shelled Venice itself across the lagoon from late July; earlier they had launched balloons carrying bombs, an early attempt at bombing from the air, but the wind blew them away. Short of food and struck by cholera, which killed nearly 2,800 people, the city surrendered on 22 August. Manin and other leaders went into exile.
      - Sicily had risen against Bourbon rule in January 1848 and declared King Ferdinand II deposed. In September his troops bombarded and stormed Messina, earning him the nickname “King Bomba”, and after a truce arranged by Britain and France broke down, General Carlo Filangieri took Catania on 7 April 1849 and entered Palermo on 15 May. Across Italy the old rulers returned, with Austrian garrisons in the Legations, Tuscany and the duchies and a French garrison in Rome. Piedmont alone kept a constitution, and thousands of exiles from the other states found refuge there.
    facts:
      - [Fort Marghera abandoned, "26 May 1849"]
      - [Palermo retaken, "15 May 1849"]
      - [Venice surrenders, "22 August 1849"]
    markers:
      - kind: siege
        side: at
