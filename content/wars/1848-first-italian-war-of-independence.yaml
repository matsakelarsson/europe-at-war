  - title: Custoza
    date: May – August 1848
    when: "1848-05-29"
    borders: "1848-08-09"
    countries: [it, at]
    body:
      - In April and May an Austrian relief army under Laval Nugent marched from the Isonzo through Friuli and Venetia, retaking the towns that had risen, and joined Radetzky at Verona. Radetzky then swung south around the Piedmontese flank. On 29 May Tuscan and Neapolitan volunteers, many of them students, held him for a day at Curtatone and Montanara. On 30 May the Piedmontese beat him at Goito, and the same day the fortress of Peschiera surrendered to them; Lombardy, the duchies and later Venice voted to join Sardinia. But the King of the Two Sicilies, after crushing a rising in Naples on 15 May, recalled his army, and on 10 June Radetzky took Vicenza from Papal troops.
      - In July Radetzky, now reinforced, attacked the Piedmontese line, which stretched for about 70 km along the Mincio. Around the hills of Custoza, south-west of Verona, he defeated Charles Albert’s main army on 24–25 July, and it fell back in disorder to Milan. Charles Albert agreed to give up the city on 4 August; crowds who felt betrayed fired on his residence, and he left under escort in the night. The armistice signed by General Carlo Canera di Salasco on 9 August returned Lombardy to Austria. Giuseppe Garibaldi, back from exile in South America, fought on with about a thousand volunteers near Lake Maggiore, winning a skirmish at Luino on 15 August, before escaping to Switzerland.
    facts:
      - [Battle of Goito, "30 May 1848, Sardinian victory"]
      - [Battle of Custoza, "24–25 July 1848, Austrian victory"]
      - [Armistice of Salasco, "9 August 1848"]
