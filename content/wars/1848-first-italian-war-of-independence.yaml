  - title: Novara
    date: March – August 1849
    when: "1849-03-20"
    borders: "1849-08-06"
    countries: [it, at]
    body:
      - Under pressure from democrats at home, Charles Albert ended the armistice in March 1849 and sent his army, now under the Polish general Wojciech Chrzanowski, against Lombardy. Radetzky struck first. On 20 March he crossed the Ticino at Pavia, where a Piedmontese division under General Gerolamo Ramorino had failed to guard the crossings; Ramorino was later shot for disobedience. The Austrians beat the Piedmontese at Mortara on 21 March and at Novara on 23 March. That evening Charles Albert abdicated in favour of his son, Victor Emmanuel II, and left for exile in Portugal, where he died in July.
      - Victor Emmanuel agreed an armistice with Radetzky at Vignale the next day, accepting an Austrian occupation of part of Piedmont until peace was made. In Lombardy the people of Brescia had risen on 23 March, not knowing of Novara, and held out for ten days until General Julius Haynau’s troops stormed the city; about 1,000 defenders and civilians were killed. In Genoa a republican revolt in April was crushed by Piedmontese troops under Alfonso La Marmora, who bombarded the city. By the Peace of Milan of 6 August 1849 Sardinia paid Austria an indemnity of 65 million francs but kept its territory and its constitution.
    facts:
      - [Battle of Novara, "23 March 1849, Austrian victory"]
      - [Charles Albert abdicates, "evening of 23 March 1849"]
      - [Peace of Milan, "6 August 1849"]
    markers:
      - kind: battle
        side: at
        name: Mortara
        date: 21 March 1849
        text: Two Austrian corps attacked the Piedmontese around the town in the evening and drove them out in confusion.
        lonlat: [8.737, 45.25]
      - kind: battle
        side: at
        name: Battle of Novara
        date: 23 March 1849
        text: Fought around the village of La Bicocca south-east of the city; by one count the Piedmontese lost nearly 6,000 men killed, wounded or captured.
        lonlat: [8.66, 45.43]
      - kind: treaty
        name: Vignale
        date: 24 March 1849
        text: Victor Emmanuel II met Radetzky here and agreed the armistice terms.
        lonlat: [8.64, 45.47]
        lp: t
      - kind: siege
        side: at
        name: Ten Days of Brescia
        date: 23 March – 1 April 1849
        text: The city fought on for ten days; after Haynau’s troops broke in, they killed prisoners and civilians, and he became known as the “Hyena of Brescia”.
        lonlat: [10.211, 45.539]
      - kind: taken
        side: sa
        name: Genoa
        date: 5–11 April 1849
        text: La Marmora’s troops bombarded and stormed the city, held by republicans who had risen against the armistice.
        lonlat: [8.934, 44.407]
      - kind: treaty
        name: Peace of Milan
        date: 6 August 1849
        text: Restored the pre-war borders between Sardinia and Austria.
        lonlat: [9.19, 45.467]
    arrows:
      - side: at
        label: Radetzky
