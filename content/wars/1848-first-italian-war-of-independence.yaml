  - title: The Roman Republic
    date: November 1848 – August 1849
    when: "1848-11-15"
    borders: "1849-07-03"
    countries: [it, fr, sm, at]
    body:
      - In Rome the Pope’s chief minister, Pellegrino Rossi, was stabbed to death on 15 November 1848, and Pius IX fled in disguise to the Neapolitan fortress of Gaeta. An elected assembly proclaimed the Roman Republic on 9 February 1849, and Giuseppe Mazzini led it in a triumvirate with Carlo Armellini and Aurelio Saffi. In Tuscany the Grand Duke Leopold II also fled, and a democratic government held Florence until April. The Pope appealed to the Catholic powers. France, whose president, Louis Napoleon Bonaparte, wanted Catholic support at home and to keep Austria out of central Italy, sent an army under General Charles Oudinot, which landed at Civitavecchia on 24 April.
      - On 30 April Oudinot’s attack on Rome was beaten back by Giuseppe Garibaldi’s legion and other defenders, and in May Garibaldi drove off a Neapolitan army at Palestrina and Velletri, while Austrian troops took Bologna and Ancona. French reinforcements opened a siege on 3 June. After a month of shelling and fighting on the Janiculum hill, the assembly gave up the defence, and the French entered Rome on 3 July. Garibaldi left with about 4,000 men, hoping to reach Venice. Pursued by French and Austrian troops, he disbanded them in San Marino at the end of July, and his wife Anita died during his flight through the marshes near Ravenna.
    facts:
      - [Roman Republic proclaimed, "9 February 1849"]
      - [French attack repulsed, "30 April 1849"]
      - [French enter Rome, "3 July 1849"]
    markers:
