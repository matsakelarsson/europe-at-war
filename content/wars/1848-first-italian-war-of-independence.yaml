        date: 28 April – 26 May 1849
        text: The fort guarding the mainland end of the railway bridge was abandoned after weeks of bombardment.
        lonlat: [12.243, 45.476]
        lp: l
      - kind: siege
        side: at
        name: Venice
        date: May – August 1849
        text: Bombardment, hunger and cholera forced the last stronghold of the revolution to surrender.
        lonlat: [12.336, 45.438]
