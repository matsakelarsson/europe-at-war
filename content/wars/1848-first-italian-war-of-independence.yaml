        lonlat: [10.675, 45.247]
        lp: l
      - kind: taken
        side: sa
        name: Peschiera
        date: 30 May 1848
        text: The Austrian garrison of the lakeside fortress, besieged since April, surrendered on the day of the battle.
        lonlat: [10.691, 45.439]
        lp: l
      - kind: taken
        side: at
        name: Vicenza
        date: 10 June 1848
        text: Radetzky stormed the hills above the city, which surrendered with its Papal garrison under General Giovanni Durando.
        lonlat: [11.546, 45.548]
