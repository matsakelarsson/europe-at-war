steps:
  - title: The Five Days of Milan
    date: 18 March – 30 April 1848
    when: "1848-03-18"
    borders: "1848-04-30"
    countries: [it, at]
    body:
      - News of the revolution in Vienna reached Milan, the capital of Austrian Lombardy, on 17 March 1848, and the next day the city rose against its garrison. For five days the Milanese fought from barricades, directed by a council of war under the federalist Carlo Cattaneo, and on the night of 22 March Field Marshal Joseph Radetzky, then 81, withdrew his troops from the city. About 400 Milanese and 180 Austrian soldiers had been killed. In Venice crowds freed the lawyer Daniele Manin from prison, the Austrian garrison left, and on 22 March Manin proclaimed the Republic of San Marco. Towns across Lombardy and Venetia rose, and the dukes of Parma and Modena fled.
      - On 23 March King Charles Albert of Sardinia declared war on Austria, partly to forestall a republican revolution, and his army crossed the Ticino into Lombardy. The Pope, the Grand Duke of Tuscany and the King of the Two Sicilies, pressed by liberal opinion, sent troops and volunteers. Radetzky fell back to the Quadrilateral, the fortresses of Peschiera, Verona, Mantua and Legnago, and waited for reinforcements down the Adige valley. The Piedmontese forced the Mincio at Goito on 8 April and drove the Austrians from Pastrengo on 30 April, but moved slowly. On 29 April Pope Pius IX declared that he could not make war on Catholic Austria.
    facts:
      - [Five Days of Milan, "18–22 March 1848"]
      - [Republic of San Marco proclaimed, "Venice, 22 March 1848"]
      - [Sardinia declares war, "23 March 1848"]
