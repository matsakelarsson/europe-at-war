notes:
  - Italian historians call Charles Albert’s two campaigns against Austria the “royal war” and the risings in Milan, Venice, Rome, Tuscany and Sicily the “popular war”. The Papal States, Tuscany and the Two Sicilies sent troops to fight Austria in spring 1848 but soon withdrew them; many of their volunteers fought on.
  - The revolutions in Vienna and the German states are told in German revolutions of 1848–1849, and the revolution in Paris in French Revolution of 1848.
