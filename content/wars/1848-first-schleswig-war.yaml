id: first-schleswig-war
name: First Schleswig War
start: "1848-03-24"
end: "1851-04-01"
tier: A
summary: A war over the duchies of Schleswig and Holstein, fought between Denmark and a German-minded provisional government in the duchies, which Prussia and the German Confederation backed until 1850. Denmark won on the battlefield, and the great powers’ London Protocol of 1852 kept the duchies under the Danish king.
