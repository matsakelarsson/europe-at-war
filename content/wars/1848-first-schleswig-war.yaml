notes:
  - Known in Denmark as the Three Years’ War (Treårskrigen) and in Germany as the Schleswig-Holstein uprising (Schleswig-Holsteinische Erhebung).
  - Place names are given in the form most used in English; most have both a Danish and a German name (Idstedt/Isted, Flensburg/Flensborg).
