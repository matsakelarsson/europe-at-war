id: french-revolution-of-1848
name: French Revolution of 1848
start: "1848-02-22"
end: "1848-06-26"
tier: C
summary: The revolution that overthrew King Louis Philippe and founded the Second French Republic, and the workers’ rising of the June Days that followed. Protests in Paris began on 22 February 1848, after the government banned a banquet held by the reform movement, and turned into insurrection when soldiers fired on a crowd on the Boulevard des Capucines on 23 February, killing about 50 people. Paris was covered with barricades overnight, the National Guard largely sided with the crowds, and on 24 February Louis Philippe abdicated and fled to England. A provisional government proclaimed the republic, introduced universal male suffrage, abolished slavery in the colonies and set up National Workshops for the unemployed; the news set off revolutions across Europe. When the conservative assembly elected in April decided to close the workshops, the workers of eastern Paris rose on 23 June. General Louis-Eugène Cavaignac crushed the rising in four days of street fighting. By one count some 4,500 people were killed or wounded, among them the Archbishop of Paris, shot while trying to make peace at a barricade, and many captured insurgents were shot; more than 4,000 were deported to Algeria. In December 1848 Louis-Napoléon Bonaparte was elected president.
