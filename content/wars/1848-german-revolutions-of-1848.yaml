steps:
  - title: The March revolution and the Frankfurt Parliament
    date: February – September 1848
    when: "1848-02-27"
    borders: "1848-05-18"
    countries: [de, at]
    body:
      - News of the February revolution in Paris set off meetings and petitions across the German states. A meeting at Mannheim on 27 February demanded a free press, trial by jury, a citizens’ militia and an all-German parliament, and these “March demands” spread from state to state. Most princes gave way and appointed liberal ministers. In Vienna students and workers rose on 13 March, and Metternich, the symbol of the old order, resigned and fled. In Berlin troops fought townspeople at the barricades on 18 March, and more than 250 people, most of them civilians, were killed before Frederick William IV withdrew the army from the city.
      - A pre-parliament met in Frankfurt at the end of March and called elections across the German Confederation, including the Austrian lands, on a broad male franchise. On 18 May the National Assembly opened in St Paul’s Church, its benches filled with lawyers, professors and officials. In Baden the radical Friedrich Hecker, impatient for a republic, led an armed column that was routed at Kandern on 20 April. When the Assembly accepted the armistice Prussia had made with Denmark at Malmö, riots broke out in Frankfurt on 18 September; two conservative deputies were murdered, and Prussian and Austrian troops restored order.
    facts:
      - [Barricade fighting in Berlin, "18–19 March 1848"]
      - [Battle of Kandern, "20 April 1848"]
      - [National Assembly opens, "18 May 1848, St Paul’s Church, Frankfurt"]
    markers:
