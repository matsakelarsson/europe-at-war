  - title: The constitution refused; Dresden and Baden
    date: March – July 1849
    when: "1849-03-28"
    borders: "1849-07-23"
    countries: [de]
    body:
      - On 28 March 1849 the National Assembly passed a constitution for a German empire without Austria and elected Frederick William IV of Prussia emperor. He refused a crown offered by a parliament, and Austria and Prussia recalled their deputies. Twenty-eight smaller governments had accepted the constitution, and in May risings to enforce it broke out in Saxony, the Prussian Rhineland and Westphalia, the Bavarian Palatinate and Baden. In Dresden, barricade fighting from 3 to 9 May, in which Richard Wagner and Mikhail Bakunin took part, was crushed by Saxon and Prussian troops; about 200 insurgents were killed.
      - In Baden the army itself went over to the revolution. The garrison of the federal fortress of Rastatt mutinied, Grand Duke Leopold fled, and a provisional government under Lorenz Brentano took power, allied with the insurgents in the Palatinate. Prussian and other federal troops under Prince William of Prussia, the future emperor, beat the revolutionary army under the Polish general Ludwik Mierosławski at Waghäusel on 21 June. Württemberg troops dispersed the last of the National Assembly, which had moved to Stuttgart, on 18 June. Rastatt surrendered on 23 July; courts martial sentenced 27 men to death, and thousands of Badeners emigrated.
    facts:
      - [Imperial Constitution, "passed 28 March 1849"]
      - [Dresden May Uprising, "3–9 May 1849"]
      - [Rastatt surrenders, "23 July 1849"]
    markers:
