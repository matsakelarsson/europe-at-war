        text: Workers and militia rose in defence of the constitution here and at Iserlohn; Prussian troops ended the risings within days.
        lonlat: [7.133, 51.267]
      - kind: event
        side: rev
        name: Kaiserslautern
        date: May – June 1849
        text: Seat of the revolutionary government of the Palatinate, which broke away from Bavaria.
        lonlat: [7.769, 49.445]
      - kind: event
        side: rev
        name: Karlsruhe
        date: 13–14 May 1849
        text: Grand Duke Leopold fled his capital, and the revolutionary committee took over the government of Baden.
        lonlat: [8.404, 49.009]
        lp: l
      - kind: battle
        side: gov
        name: Waghäusel
        date: 21 June 1849
        text: The Prussian I Corps under Moritz von Hirschfeld beat Mierosławski’s army, which fell back to the Murg.
        lonlat: [8.517, 49.25]
      - kind: event
        side: gov
        name: Stuttgart
        date: 18 June 1849
        text: Württemberg troops occupied the hall of the rump parliament, which had moved here from Frankfurt, and dispersed it.
        lonlat: [9.18, 48.778]
      - kind: siege
        side: gov
        name: Rastatt
        date: 30 June – 23 July 1849
        text: The fortress, the revolution’s last stronghold, surrendered after a three-week siege. Typhoid killed many of the prisoners held in its casemates.
        lonlat: [8.211, 48.858]
        lp: l
