  - title: Prague, Vienna and Berlin
    date: June – December 1848
    when: "1848-06-12"
    borders: "1848-12-05"
    countries: [at, cz, de]
    body:
      - The old powers recovered first in the Austrian Empire. In June an uprising in Prague was crushed by Prince Alfred Windischgrätz, who bombarded the city. On 6 October, as troops were leaving Vienna to fight the revolution in Hungary, workers, students and mutinous soldiers tried to stop them. The war minister, Count Latour, was lynched, and the emperor fled to Olmütz. Windischgrätz and Josip Jelačić, the Ban of Croatia, surrounded Vienna with more than 70,000 troops, beat a Hungarian relief army at Schwechat on 30 October and stormed the city the next day. About 2,000 people were killed in the fighting.
      - Robert Blum, a left-wing deputy who had come from Frankfurt to join the defence, was shot on 9 November despite his parliamentary immunity, and other leaders of the defence were executed. On 2 December the Emperor Ferdinand abdicated in favour of his 18-year-old nephew, Francis Joseph. In Prussia Frederick William IV moved the Prussian National Assembly out of Berlin to Brandenburg an der Havel, and on 10 November General Friedrich von Wrangel’s troops marched back into the capital unopposed. On 5 December the king dissolved the assembly and issued a constitution of his own.
    facts:
      - [Vienna stormed, "31 October 1848"]
      - [Robert Blum shot, "9 November 1848"]
      - [Constitution imposed in Prussia, "5 December 1848"]
    markers:
      - kind: siege
        side: gov
        name: Prague
        date: 12–17 June 1848
        text: Windischgrätz’s troops bombarded the city and put down the Whitsun uprising, in which his wife had been killed by a stray bullet.
        lonlat: [14.421, 50.087]
      - kind: taken
        side: gov
        name: Vienna
        date: 6–31 October 1848
        text: The city rose on 6 October; imperial troops bombarded it from 26 October and stormed it on 31 October.
        lonlat: [16.372, 48.208]
        lp: l
      - kind: battle
        side: gov
        name: Schwechat
        date: 30 October 1848
        text: The Hungarian army marching to relieve Vienna was beaten by Windischgrätz and Jelačić.
        lonlat: [16.479, 48.141]
        lp: b
      - kind: event
        side: gov
        name: Olmütz
        date: 2 December 1848
        text: The court had fled here in October. Ferdinand abdicated here, and Francis Joseph began a reign of 68 years.
        lonlat: [17.251, 49.594]
      - kind: event
        side: gov
        name: Brandenburg an der Havel
        date: November – December 1848
        text: The Prussian National Assembly was moved here from Berlin and dissolved on 5 December.
        lonlat: [12.533, 52.417]
        lp: l
      - kind: taken
        side: gov
        name: Berlin
        date: 10 November 1848
        text: Wrangel’s troops re-entered the capital without a fight, and a state of siege followed two days later.
        lonlat: [13.405, 52.52]
