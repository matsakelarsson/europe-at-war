id: german-revolutions-of-1848
name: German revolutions of 1848–1849
start: "1848-02-27"
end: "1849-07-23"
tier: B
summary: A wave of risings across the German Confederation and the Austrian Empire, set off by the February Revolution in Paris, which forced the princes to grant liberal governments and brought about an elected National Assembly in Frankfurt. The old powers recovered in Vienna and Berlin in late 1848; when the King of Prussia refused the crown offered by the Assembly, the risings of May 1849 to enforce its constitution were crushed by Prussian and other troops, ending with the fall of Rastatt in July 1849.
countries: [de, at, cz]
sides:
  - id: rev
    name: Revolutionaries
    polities: [revolutionaries-1848]
    ink: red
    moves: Revolutionary moves
    success: Revolutionary success
  - id: gov
    name: Governments of Prussia, Austria and other German states
    polities: [prussia, habsburg, saxony, bavaria, wurttemberg, baden]
    ink: slate
    moves: Government moves
    success: Government success
notes:
  - The revolutions were many separate risings, and this story follows only the main ones. The Hungarian Revolution of 1848–1849, the war in northern Italy of 1848–1849 and the First Schleswig War are told as separate wars.
  - The Frankfurt National Assembly stood between the two sides. It sought a constitutional German state by agreement with the princes, had no army of its own, and relied on Prussian and Austrian troops when it was threatened from the left.
