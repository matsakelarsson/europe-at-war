steps:
  - title: The April Laws
    date: March – August 1848
    when: "1848-03-15"
    borders: "1848-04-11"
    countries: [hu, sk, ro, rs, hr, at]
    body:
      - News of the February revolution in Paris reached the Hungarian diet at Pozsony, where Lajos Kossuth called for a constitution on 3 March 1848. After the rising in Vienna on 13 March, young radicals in Pest, the poet Sándor Petőfi among them, met at the Pilvax café on 15 March, read out twelve demands and Petőfi’s National Song to growing crowds, printed them without the censor’s leave and freed the imprisoned writer Mihály Táncsics. The court gave way without bloodshed. On 17 March Count Lajos Batthyány was appointed prime minister of Hungary, and on 11 April King Ferdinand V signed the laws the diet had passed.
      - The April Laws made Hungary a constitutional monarchy with a government answerable to an elected parliament in Pest, ended serfdom and the nobles’ freedom from tax, freed the press and united Transylvania with Hungary. But Hungarian stayed the only language of government in a kingdom where Magyars were fewer than half the people. Josip Jelačić, the new ban of Croatia, broke off relations with Pest. Serbs meeting at Karlóca in May proclaimed a Serbian Vojvodina and took up arms in June, and Romanians meeting at Balázsfalva claimed recognition as a nation and opposed the union with Transylvania, which its diet voted on 29 May. The court, recovering from its shock, began to back the nationalities against Pest.
    facts:
      - [Revolution in Pest, "15 March 1848"]
      - [April Laws signed, "11 April 1848"]
      - [Serbian May Assembly, "13–15 May 1848, Karlóca"]
    markers:
      - kind: event
        side: hu
