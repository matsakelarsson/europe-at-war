  - title: The Russian intervention
    date: June – August 1849
    when: "1849-06-17"
    borders: "1849-08-09"
    countries: [hu, sk, ro, ua, rs, at, ru]
    body:
      - On 21 May, in Warsaw, Francis Joseph thanked Tsar Nicholas I in person for his promise of help. In mid-June about 200,000 Russian troops under Field Marshal Ivan Paskevich crossed the Carpathians from Galicia, through the Dukla Pass and others, while a second Russian army under General Alexander von Lüders entered Transylvania from Wallachia. In the west the new Austrian commander, Julius Jacob von Haynau, took Győr on 28 June. Together the two empires had well over twice as many men as the Hungarians. Görgei held Haynau before Komárom on 2 July but failed to break through on 11 July, then marched east around the Russians, fighting them at Vác on 15–17 July and drawing them north before turning south towards Arad.
      - The government left Pest for Szeged, where on 28 July parliament passed laws allowing the nationalities to use their own languages in local government and schools and emancipating the Jews, too late to change the war. In Transylvania Lüders beat Bem at Segesvár on 31 July; the poet Petőfi was last seen alive on that battlefield. Haynau crossed the Tisza and beat Dembiński at Szőreg on 5 August, and on 9 August he routed the southern army, now under Bem, at Temesvár. Cholera swept through all the armies, and most of the Russian dead died of disease rather than in battle.
    facts:
      - [Russian army, "about 200,000 under Paskevich"]
      - [Battle of Segesvár, "31 July 1849, Russian victory"]
      - [Battle of Temesvár, "9 August 1849, Austrian victory"]
    markers:
      - kind: event
        side: ru
