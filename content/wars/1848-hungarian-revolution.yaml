  - title: Világos and the Arad martyrs
    date: August – October 1849
    when: "1849-08-11"
    borders: "1849-10-06"
    countries: [hu, ro, bg, at, ru]
    body:
      - On 11 August Kossuth handed full power to Görgei and fled with other leaders across the Ottoman border; his minister Bertalan Szemere buried the Holy Crown near Orsova, where it was found in 1853. On 13 August, at Világos near Arad, Görgei surrendered his army of about 30,000 men to the Russian general Count Theodor von Rüdiger, choosing to lay down arms before the Russians rather than the Austrians. The Russians handed the prisoners over to the Austrians. The remaining corps and fortresses gave up in the following weeks; Klapka held Komárom until 2 October and won free passage for its garrison.
      - Haynau, given full powers, took harsh revenge. On 6 October, the anniversary of the Vienna rising, twelve generals and a colonel of the Hungarian army were executed at Arad, four by firing squad and nine on the gallows, and the same day Batthyány was shot in Pest. Over a hundred people were executed and many more imprisoned or forced into the imperial army. Görgei was spared at the tsar’s request and interned at Klagenfurt, and many Hungarians called him a traitor. Hungary was ruled as a conquered land until the Compromise of 1867, Kossuth died in exile, and 6 October is a day of mourning in Hungary.
    facts:
      - [Surrender at Világos, "13 August 1849, to the Russians"]
      - [Komárom surrenders, "2 October 1849"]
      - [Executions at Arad, "6 October 1849"]
    markers:
      - kind: event
        side: hu
        name: Orsova
        date: August 1849
        text: Kossuth crossed into Ottoman territory nearby, and Szemere hid the Holy Crown and the regalia in the ground outside the town.
        lonlat: [22.396, 44.725]
      - kind: event
        side: ru
        name: Világos
        date: 13 August 1849
        text: Görgei’s army laid down its arms before Rüdiger’s Russian corps on the fields of Szőlős, ending the war in the field.
        lonlat: [21.633, 46.267]
      - kind: event
        name: Arad
        date: 6 October 1849
        text: The thirteen martyrs of Arad, officers of the Hungarian army, were executed in the fortress on Haynau’s orders.
        lonlat: [21.312, 46.175]
        lp: l
      - kind: taken
        side: at
        name: Komárom
        date: 2 October 1849
