        text: A Serb assembly proclaimed Serbian Vojvodina in southern Hungary. A Hungarian attack on the town on 12 June began the fighting.
        lonlat: [19.934, 45.203]
      - kind: held
        side: at
        name: Szenttamás
        date: July – August 1848
        text: The Serb fortified camp beat off two Hungarian sieges in the summer of 1848 and fell only in April 1849.
        lonlat: [19.783, 45.533]
