  - title: Jelačić and Pákozd
    date: September – December 1848
    when: "1848-09-11"
    borders: "1848-12-02"
    countries: [hu, hr, at, ro]
    body:
      - By late summer the court had turned against the Batthyány government, and on 11 September Jelačić crossed the Drava with an army of Croatian border regiments and volunteers. Batthyány resigned, and parliament gave power to a National Defence Committee led by Kossuth, which raised new honvéd battalions and printed its own money. On 28 September a crowd in Pest killed Count Franz Lamberg, sent by the king to take command of all troops in Hungary. The next day General János Móga’s army stopped Jelačić’s advance at Pákozd, near Lake Velence. The fight was small, but Jelačić asked for a three-day truce and slipped away towards Vienna, and on 7 October Artúr Görgei and Mór Perczel forced his rearguard of some 9,000 men to surrender at Ozora.
      - The order sending troops from Vienna against Hungary set off a rising there on 6 October. The Hungarian army crossed the border late and was beaten at Schwechat on 30 October by Jelačić and Prince Alfred Windischgrätz, who took Vienna the next day. On 2 December Ferdinand abdicated in favour of his 18-year-old nephew Francis Joseph, whom the Hungarian parliament refused to recognise as king. In Transylvania, Romanian insurgents and imperial troops took most of the country by November. Both sides killed civilians. Hungarian townspeople were massacred at Zalatna in October and at Nagyenyed in January, and Hungarian troops and courts burned Romanian villages and hanged peasants.
    facts:
      - [Battle of Pákozd, "29 September 1848, Hungarian success"]
      - [Surrender at Ozora, "7 October 1848"]
      - [Battle of Schwechat, "30 October 1848, Austrian victory"]
    markers:
      - kind: event
        side: at
        name: Varaždin
        date: 11 September 1848
        text: Jelačić crossed the Drava into Hungary here at the head of the Croatian army.
        lonlat: [16.338, 46.308]
      - kind: event
        name: Pest
        date: 28 September 1848
        text: The royal commissioner Count Lamberg was dragged from his carriage on the bridge of boats and killed by a crowd, ending hopes of a settlement.
        lonlat: [19.05, 47.5]
      - kind: battle
        side: hu
        name: Battle of Pákozd
        date: 29 September 1848
        text: The new Hungarian army and national guards held their ground against Jelačić, who then withdrew. It is remembered as the birthday of the Hungarian army.
        lonlat: [18.545, 47.221]
      - kind: battle
        side: hu
        name: Ozora
        date: 7 October 1848
        text: Hungarian troops and peasant militia surrounded the Croatian reserve corps of Generals Roth and Philippović and took it prisoner.
        lonlat: [18.398, 46.753]
      - kind: battle
        side: at
        name: Battle of Schwechat
        date: 30 October 1848
        text: The Hungarian army, marching to help the Vienna rising, was driven back by Windischgrätz and Jelačić just outside the city.
        lonlat: [16.479, 48.141]
      - kind: taken
        side: at
        name: Vienna
        date: 31 October 1848
        text: Windischgrätz’s troops stormed the city after a bombardment, ending the October rising.
        lonlat: [16.37, 48.21]
        lp: t
