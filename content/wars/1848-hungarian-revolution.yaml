        text: Haynau forced the crossing of the Tisza and defeated Dembiński’s army south-east of Szeged.
        lonlat: [20.211, 46.179]
        lp: b
      - kind: battle
        side: at
        name: Battle of Temesvár
        date: 9 August 1849
        text: Haynau routed the Hungarian southern army and relieved the imperial garrison, which had held the fortress against Hungarian sieges since the autumn of 1848.
        lonlat: [21.158, 45.831]
