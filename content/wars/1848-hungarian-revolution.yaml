        text: Haynau’s offensive began by driving Poeltenberg’s corps out of the town, with Francis Joseph present.
        lonlat: [17.634, 47.684]
      - kind: battle
        name: Komárom
        date: 2 and 11 July 1849
        text: Görgei’s army fought Haynau to a standstill outside the fortress, but its attempt to break out south-east failed.
        lonlat: [18.106, 47.736]
        lp: b
      - kind: battle
        name: Vác
        date: 15–17 July 1849
        text: Görgei fought his way past Paskevich’s army and slipped away north-east, drawing the Russians after him.
        lonlat: [19.131, 47.775]
        lp: t
      - kind: event
        side: hu
        name: Szeged
        date: 28 July 1849
        text: The last sitting of the Hungarian parliament passed a law on the rights of the nationalities and the emancipation of the Jews.
        lonlat: [20.145, 46.255]
        lp: l
      - kind: battle
        side: ru
        name: Battle of Segesvár
