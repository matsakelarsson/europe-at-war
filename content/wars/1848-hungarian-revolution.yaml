id: hungarian-revolution
name: Hungarian Revolution of 1848–1849
start: "1848-03-15"
end: "1849-10-02"
tier: A
summary: A revolution in which Hungary won a constitutional government of its own in the spring of 1848 and then fought the Austrian Empire, Croatia and the Serb and Romanian insurgents of the kingdom, declaring independence in April 1849. Its armies drove the imperial forces almost out of the country, but a Russian army of some 200,000 men joined the Austrians that summer, and the Hungarians surrendered at Világos in August 1849, followed by harsh reprisals.
countries: [hu, sk, ro, rs, hr, ua, at, ru]
sides:
  - id: hu
    name: Hungarian revolutionary government
    polities: [hungarian-revolutionaries]
    ink: olive
    moves: Hungarian moves
    success: Hungarian success
  - id: at
    name: Austrian Empire and its allies
    polities: [habsburg]
    ink: purple
    moves: Austrian and allied moves
    success: Austrian and allied success
  - id: ru
    name: Russian Empire
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
notes:
  - Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind.
  - Places are given their Hungarian names of the time, as in most accounts. Pozsony is Bratislava; Kassa is Košice and Nagysalló Tekovské Lužany in Slovakia; Kolozsvár is Cluj, Nagyszeben Sibiu, Segesvár Sighișoara, Piski Simeria, Temesvár Timișoara and Világos Șiria in Romania; Karlóca is Sremski Karlovci and Szenttamás Srbobran in Serbia.
  - The risings in Vienna are told in the German revolutions of 1848–1849, and the revolution in Wallachia in its own entry. The war in Hungary was also a civil war between the kingdom’s nationalities; numbers of civilians killed, especially in Transylvania and the south, are disputed.
