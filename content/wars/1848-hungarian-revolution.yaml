  - title: The Spring Campaign and the Declaration of Independence
    date: March – May 1849
    when: "1849-04-02"
    borders: "1849-05-21"
    countries: [hu, sk, ro, rs, at, ru]
    body:
      - In March Bem drove the Austrians and Russians out of Transylvania, taking Nagyszeben on 11 March, and Perczel cleared much of the south of Serb and imperial troops. At the start of April the main army, now led in practice by Görgei, attacked east of Pest and won at Hatvan on 2 April, Tápióbicske on 4 April and Isaszeg on 6 April, where Windischgrätz himself was beaten. It then turned north, took Vác on 10 April, defeated General Ludwig von Wohlgemuth at Nagysalló on 19 April and on 26 April relieved the besieged fortress of Komárom. Windischgrätz was dismissed, and his successor withdrew almost all imperial troops from Hungary, leaving garrisons in Buda castle and a few fortresses.
      - On 14 April, in the Great Church of Debrecen, parliament declared the House of Habsburg-Lorraine deposed and Hungary independent, and elected Kossuth governor-president. Görgei, who thought the declaration ruled out a compromise, turned back to besiege Buda rather than follow the enemy towards Vienna, a choice still argued over. The castle’s commander, General Heinrich Hentzi, shelled Pest across the river; Buda was stormed on 21 May after a siege of 17 days, and Hentzi was mortally wounded. It was the height of Hungarian success, but Francis Joseph had already asked the tsar for help.
    facts:
      - [Battle of Isaszeg, "6 April 1849, Hungarian victory"]
      - [Declaration of Independence, "14 April 1849, Debrecen"]
      - [Buda retaken, "21 May 1849"]
    markers:
