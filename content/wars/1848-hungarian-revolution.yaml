  - title: Windischgrätz takes Buda; Kápolna
    date: December 1848 – March 1849
    when: "1848-12-14"
    borders: "1849-03-04"
    countries: [hu, sk, ro, ua, at, ru]
    body:
      - In mid-December Windischgrätz invaded Hungary with the main imperial army, while other corps closed in from Galicia, Styria, Croatia and the Serbian south. Görgei fell back from the border, and Perczel was beaten at Mór on 30 December. Parliament and the National Defence Committee moved to Debrecen, beyond the Tisza, taking the Holy Crown with them, and on 5 January 1849 Windischgrätz entered Buda and Pest. Görgei led his corps north into the mountains of Upper Hungary, drawing imperial troops after him, forced the Branyiszkó Pass on 5 February and joined György Klapka’s troops at Kassa.
      - In Transylvania the Polish general Józef Bem took Kolozsvár at Christmas and, after beating the Austrian commander Anton Puchner at Piski on 9 February, held his own against imperial troops and a Russian detachment called in from Wallachia by the Saxon towns. Kossuth gave command of the main army to another Pole, Henryk Dembiński, whom Windischgrätz defeated at Kápolna on 26–27 February. Believing the war won, the court issued a new constitution, dated 4 March, which made Hungary one crown land among many in a centralised empire and separated Transylvania, Croatia and the Serbian Vojvodina from it. The war became one for independence.
    facts:
      - [Windischgrätz enters Buda and Pest, "5 January 1849"]
      - [Battle of Kápolna, "26–27 February 1849, Austrian victory"]
      - [Imposed March Constitution, "4 March 1849"]
    markers:
