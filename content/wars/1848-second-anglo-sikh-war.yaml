  - title: Ramnagar, Chillianwala and Gujrat
    date: November 1848 – March 1849
    when: "1849-01-13"
    borders: "1849-02-21"
    countries: [pk]
    body:
      - Sher Singh marched north to join his father, Chattar Singh, who had risen in Hazara in August. The Sikh troops at Peshawar joined the rising in October, and the Attariwalas offered Peshawar to Dost Mohammad Khan of Kabul in return for his help; Afghan horsemen took Attock early in 1849. Gough crossed the Ravi in November with about 20,000 men. On 22 November his cavalry attacked the Sikhs on the Chenab at Ramnagar and was beaten back with heavy loss; on 3 December a British force that had crossed upstream fought an indecisive action at Sadullapur, and the Sikhs fell back to the Jhelum.
      - On 13 January 1849 Gough attacked Sher Singh’s army at Chillianwala late in the afternoon, through thick scrub. Several British regiments were cut up, cavalry fled, and guns and colours were lost; British losses were about 2,400 killed, wounded and missing, Sikh losses perhaps 4,000 or more. Both sides claimed the victory, and the news shocked Britain; Gough was ordered to be replaced, though word did not arrive before the war was over.
      - With Multan taken, Whish’s troops joined Gough, who now had about 24,000 men and almost 100 guns. On 21 February 1849 at Gujrat he opened with a long artillery bombardment before advancing, and the Sikh army and its Afghan allies broke. Sikh losses were estimated at 3,000–5,000 and 53 guns; the British lost 96 killed and about 700 wounded. Sir Walter Gilbert pursued the beaten army, and on 12 March, near Rawalpindi, Chattar Singh and Sher Singh surrendered with about 20,000 men. The Afghans fell back through the Khyber.
    facts:
      - [Battle of Ramnagar, "22 November 1848, Sikh success"]
      - [Battle of Chillianwala, "13 January 1849, indecisive"]
      - [Battle of Gujrat, "21 February 1849, Company victory"]
      - [Sikh army surrenders, "12 March 1849"]
