steps:
  - title: Multan
    date: April 1848 – January 1849
    when: "1848-04-19"
    borders: "1848-09-14"
    countries: [pk]
    body:
      - After the First Anglo-Sikh War the Punjab was governed in the name of the boy Maharaja Duleep Singh by a council of Sikh chiefs under a British Resident. Diwan Mulraj, the governor of Multan, was pressed for higher revenue and resigned. On 18 April 1848 two British officers, Patrick Vans Agnew and Lieutenant William Anderson, arrived with a Sikh escort to take over the city. The next day, after Mulraj had handed them the keys of the citadel, they were attacked by his soldiers, and on 20 April a crowd killed them both. Mulraj, whether he had planned it or not, put himself at the head of the revolt.
      - The new Governor-General, Lord Dalhousie, and his commander-in-chief, Lord Gough, decided not to campaign in the hot season. A young political officer, Herbert Edwardes, raised Pashtun levies west of the Indus and, with the army of the Nawab of Bahawalpur, beat Mulraj’s troops at Kineyri on 18 June and at Saddusam on 1 July and shut them up in Multan. A Company force under General William Whish began a siege in August. On 14 September the Sikh army sent to help it, under Raja Sher Singh Attariwala, went over to the rebellion, and Whish had to lift the siege.
      - Reinforced from Bombay, Whish renewed the siege in late December. On 30 December a mortar shell hit the citadel’s main powder magazine, stored in a mosque, and the explosion killed several hundred defenders. The city was stormed on 2 January 1849, and on 22 January Mulraj surrendered the citadel. He was tried for the murder of the two officers, found guilty as an accessory, and sentenced to death; the sentence was changed to exile for life, and he died in 1851.
