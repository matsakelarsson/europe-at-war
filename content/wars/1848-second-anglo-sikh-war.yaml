notes:
  - The Company’s armies were mostly Indian sepoys of the Bengal and Bombay armies under British officers, with some British Army regiments. At Multan they were joined by Pashtun levies raised by Lieutenant Herbert Edwardes, the troops of the Nawab of Bahawalpur and Sikh regiments that stayed loyal to the Lahore government.
  - Formally the war was fought against rebels, not against the Sikh state, whose government in Lahore was under a British Resident and whose Maharaja, Duleep Singh, was ten years old. Sikh historians and many others see it as a national war of the Khalsa against British control.
