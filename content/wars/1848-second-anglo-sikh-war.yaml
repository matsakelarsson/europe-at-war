id: second-anglo-sikh-war
name: Second Anglo-Sikh War
start: "1848-04-19"
end: "1849-03-29"
tier: B
summary: "The war that ended the Sikh Empire. It began in April 1848 as a revolt at Multan, where the governor, Diwan Mulraj, had been forced to resign and two British officers sent to take over were killed, and became a general rising when the Sikh army under Sher Singh Attariwala joined it in September. The Company’s army under Lord Gough fought indecisive and costly battles at Ramnagar and Chillianwala, took Multan in January 1849 after a long siege, and won a decisive victory at Gujrat in February. The Sikh army surrendered in March, and on 29 March 1849 the Punjab was annexed to British India."
