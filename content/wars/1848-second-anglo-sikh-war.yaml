  - title: The annexation of the Punjab
    date: March 1849
    when: "1849-03-29"
    borders: "1849-03-29"
    countries: [pk, in]
    body:
      - Dalhousie decided to end the Sikh state rather than restore it. On 29 March 1849, at a durbar in the Lahore Fort, the ten-year-old Duleep Singh signed away his kingdom in return for a pension, and the Punjab was proclaimed part of the Company’s territories. The Koh-i-Noor diamond was taken from the Lahore treasury and sent to Queen Victoria. Duleep Singh was placed in British care, converted to Christianity and was taken to England in 1854; his mother, Jind Kaur, who had been exiled in 1848, escaped to Nepal.
      - The Punjab was governed at first by a board under Henry and John Lawrence. Many disbanded Sikh soldiers were later recruited into the Company’s new Punjab regiments, which fought on the British side in 1857. Peshawar and the frontier districts became British, and Dost Mohammad accepted this in the treaty of 1855. With the Punjab, the Company’s rule reached the Khyber Pass.
    facts:
      - [Punjab annexed, "29 March 1849"]
      - [Last Maharaja, "Duleep Singh (1838–1893)"]
