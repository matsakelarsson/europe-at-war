id: wallachian-revolution
name: Wallachian Revolution of 1848
start: "1848-06-21"
end: "1848-09-25"
tier: C
summary: A liberal and national revolution in Wallachia, an autonomous principality under Ottoman suzerainty and Russian protection. Young intellectuals and militia officers proclaimed a programme of reforms at Islaz on 21 June 1848, Prince Gheorghe Bibescu abdicated, and a provisional government in Bucharest abolished Roma slavery, ended censorship and promised land reform. Russia refused to accept it, and on 25 September Ottoman troops occupied Bucharest, after a clash with the city’s firemen on Dealul Spirii, while Russian troops entered the country. A joint Russian–Ottoman occupation lasted until 1851, but many of the revolutionaries later led the union of the principalities and the Romanian state. A smaller movement in Moldavia had been put down in the spring.
