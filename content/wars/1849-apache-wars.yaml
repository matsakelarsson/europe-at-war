steps:
  - title: The new border
    date: 1849–1855
    when: "1851-03-05"
    borders: "1851-03-05"
    countries: [us, mx]
    body:
      - "The Apache peoples, the Chiricahua (Chokonen, Bedonkohe, Chihenne and Nednhi), the Western Apache, the Mescalero, the Jicarilla and the Lipan, lived in small independent local groups across the mountains and deserts of what became Arizona, New Mexico, west Texas, Sonora and Chihuahua, and had raided Spanish and then Mexican settlements for livestock and captives for more than a century. When independent Mexico stopped the rations of the late Spanish peace, the raids grew, and from 1835 Sonora and later Chihuahua paid bounties for Apache scalps. In 1837 the Coppermine leader Juan José Compá was killed for bounty at Santa Rita del Cobre, and Mangas Coloradas became the leading war chief of the Chihenne."
      - "The United States occupied New Mexico in 1846 and by the treaty of Guadalupe Hidalgo in 1848 undertook to stop raids from its new territory into Mexico. Mangas Coloradas made peace with the Americans as enemies of Mexico, but miners reopened the copper mines at Santa Rita, and the Apache lost game, water and land. On 5 March 1851 Sonoran troops under Colonel José María Carrasco attacked an Apache camp outside Janos in Chihuahua while the men were trading in the town, killing among others the mother, wife and three children of a young Bedonkohe man, Goyaałé, later known as Geronimo."
      - "In the north, Jicarilla and Ute raiders attacked travellers on the Santa Fe Trail, killing the party of James White in 1849 and ten mail carriers near Wagon Mound in 1850. On 30 March 1854 Jicarilla warriors defeated a company of the 1st Dragoons at Cieneguilla, killing 22 of some 60 men, before a larger expedition guided by Kit Carson ran them down in the mountains. The Gadsden Purchase, in force from June 1854, moved the border south to its present line, through the middle of the Chiricahua homeland, and freed the United States from its promise to stop raids into Mexico."
    facts:
      - [Mexican scalp bounties, "from 1835 (Sonora) and 1837 (Chihuahua)"]
      - [Janos, "5 March 1851"]
      - [Battle of Cieneguilla, "30 March 1854, Jicarilla victory"]
      - [Gadsden Purchase, "in force 30 June 1854"]
