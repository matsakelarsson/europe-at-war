  - title: Geronimo’s last campaign and exile
    date: 1885–1913
    when: "1886-09-04"
    borders: "1886-09-04"
    countries: [us, mx]
    body:
      - "On 17 May 1885, after a quarrel over Crook’s ban on brewing tiswin beer, Geronimo, Naiche, Mangas, Chihuahua and the aged Nana left their camp on Turkey Creek near Fort Apache with about 135 people, some 40 of them fighting men, and fled to Mexico. Crook sent columns of Apache scouts after them into the Sierra Madre while troops guarded the waterholes along the border, and late in the year Josanie (Ulzana) led a small party on a long raid back through Arizona and New Mexico. In January 1886 Captain Emmet Crawford’s scouts attacked Geronimo’s camp in Sonora, but Mexican irregulars mistook the scouts for hostile Apache and killed Crawford."
      - "On 25–27 March 1886 Crook met the leaders at Cañón de los Embudos, just south of the border, where they agreed to surrender and go into exile in the East for two years. On the way north Geronimo and Naiche slipped away again with a few dozen followers; Chihuahua, Nana and the rest were sent to Fort Marion in Florida. Washington rejected Crook’s terms and he resigned, and in April General Nelson Miles replaced him, relying on regular troops, heliograph stations and a column under Captain Henry Lawton that pursued the band for months through Sonora."
      - "In August Lieutenant Charles Gatewood, with the Chiricahua scouts Martine and Kayitah, found Geronimo in the mountains of Sonora and told him that his people had already been sent east. On 4 September 1886 Geronimo and Naiche surrendered to Miles at Skeleton Canyon in Arizona. They and their last followers, but also the Chiricahua who had stayed at peace at Fort Apache and the scouts who had served the army, some 500 people in all, were sent as prisoners of war to Florida, from 1887 to Mount Vernon Barracks in Alabama and in 1894 to Fort Sill in Indian Territory; many died of disease, and their children were sent to the Carlisle school. Geronimo died a prisoner at Fort Sill in 1909. In 1913 the survivors were freed; most moved to the Mescalero reservation in New Mexico and the rest stayed in Oklahoma."
    facts:
      - [Breakout from Turkey Creek, "17 May 1885"]
      - [Meeting at Cañón de los Embudos, "25–27 March 1886"]
      - [Surrender at Skeleton Canyon, "4 September 1886"]
      - [Chiricahua held as prisoners of war, "1886–1913"]
