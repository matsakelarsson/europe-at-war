  - title: Bosque Redondo and the war in central Arizona
    date: 1862–1870
    when: "1863-03-01"
    borders: "1863-03-01"
    countries: [us]
    body:
      - "Carleton turned next on the Mescalero of the Sacramento and Sierra Blanca mountains. In the autumn of 1862 he sent Kit Carson and other officers against them with orders to kill the men and take the women and children, and after two of their leaders were shot while coming to talk, some 400 to 500 Mescalero surrendered and were taken in 1863 to Bosque Redondo on the Pecos, by Fort Sumner, where the Navajo were soon confined beside them. Crops failed, rations were short and the Navajo were old enemies; on the night of 3 November 1865 the Mescalero slipped away and went back to their mountains."
      - "Gold strikes around Prescott in 1863 brought miners into the country of the Yavapai and the Tonto and Pinal Apache in central Arizona. Volunteer parties raided their camps, and in January 1864 King Woolsey’s party killed some two dozen Apache and Yavapai at a parley at the place since called Bloody Tanks. Raids and reprisals went on for years, with Yavapai and Apache alike hunted as Apache."
      - "After the Civil War the regular army came back and built posts such as Camp Verde and Camp McDowell. The White Mountain Apache, by contrast, welcomed the founding of Camp Apache in their country in 1870 and gave the army many of its scouts, while the Aravaipa and Pinal bands began to come in to Camp Grant on the San Pedro."
    facts:
      - [Mescalero at Bosque Redondo, "1863 – November 1865"]
      - [Bloody Tanks, "24 January 1864"]
