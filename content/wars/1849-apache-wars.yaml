  - title: San Carlos and Victorio’s war
    date: 1876–1881
    when: "1880-10-14"
    borders: "1880-10-14"
    countries: [us, mx]
    body:
      - "After Cochise’s death the Chiricahua reservation was closed, and in June 1876 its people were ordered to San Carlos, a hot, malarial flat on the Gila; Juh, Geronimo and others fled to Mexico instead. In April 1877 the San Carlos agent John Clum arrested Geronimo at Ojo Caliente, the Chihenne agency in New Mexico, and moved the Chihenne under Victorio and Loco to San Carlos as well. Victorio broke away more than once, asking to live at Ojo Caliente or with the Mescalero."
      - "In late August 1879, fearing arrest, Victorio left for good with some 80 warriors and their families, joined by Mescalero and Chiricahua, and on 4 September they killed the soldiers guarding the 9th Cavalry’s horse herd at Ojo Caliente. For more than a year his band raided across New Mexico, west Texas and Chihuahua and fought some two dozen engagements with the Buffalo Soldiers of the 9th and 10th Cavalry, Apache scouts and Mexican troops, among them Hembrillo Canyon in the San Andres Mountains in April 1880. In the summer Colonel Benjamin Grierson’s 10th Cavalry held the waterholes of west Texas and turned the band back into Mexico. Settlers, herders and travellers on both sides of the border were killed in the raids."
      - "In October 1880, short of ammunition, the band camped at Tres Castillos, three rocky hills in the desert of northern Chihuahua, while Nana and others were away. On 14–15 October Mexican troops and militia under Colonel Joaquín Terrazas surrounded it and killed Victorio and most of his people; Mexican reports gave 78 killed and 68 women and children captured, and Apache tradition holds that Victorio took his own life. In the summer of 1881 the old leader Nana, with fewer than 40 warriors, rode some 1,600 km through New Mexico, fighting several engagements and eluding more than a thousand soldiers."
    facts:
      - [Victorio leaves San Carlos, "August 1879"]
      - [Battle of Hembrillo Canyon, "April 1880"]
      - [Battle of Tres Castillos, "14–15 October 1880"]
      - [Nana’s raid, "July–August 1881"]
