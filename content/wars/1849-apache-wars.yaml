id: apache-wars
name: Apache Wars
start: "1849"
end: "1886-09-04"
tier: A
summary: "The wars of 1849–1886 between the Apache peoples, with their Yavapai neighbours, and the United States and Mexico in the deserts and mountains of Arizona, New Mexico, west Texas, Sonora and Chihuahua. The Apache, the Chiricahua, Western Apache, Mescalero, Jicarilla and others, lived in small independent bands and had raided Spanish and Mexican settlements for more than a century, while Sonora and Chihuahua paid bounties for Apache scalps. When the United States took the region from Mexico in 1848 and 1854, miners, ranchers and soldiers moved into Apache country. The Bascom affair of 1861 turned the Chokonen leader Cochise against the Americans, and the killing of Mangas Coloradas under a flag of truce in 1863 deepened the war. After the Camp Grant massacre of 1871 the government made peace with Cochise and set up reservations, while General George Crook’s columns, guided by Apache scouts, forced the Yavapai and Tonto Apache onto them. The concentration of the bands at San Carlos from 1875 led to the breakouts of Victorio in 1879, who was killed by Mexican troops at Tres Castillos in 1880, and of Juh, Naiche and Geronimo in 1881 and 1885. Geronimo’s surrender at Skeleton Canyon on 4 September 1886 ended the wars; the whole Chiricahua people, including the scouts who had served the army, were sent as prisoners of war to Florida, Alabama and Oklahoma and held until 1913."
countries: [us, mx]
sides:
  - id: apa
    name: Apache (Mangas Coloradas, Cochise, Victorio, Nana, Juh, Naiche, Geronimo and other leaders)
    polities: [apache]
    ink: brown
    moves: Apache moves
    success: Apache success
  - id: yav
    name: Yavapai
    polities: [yavapai]
    ink: orange
    moves: Yavapai moves
    success: Yavapai success
  - id: us
    name: United States (US Army with Apache and other Native scouts, Arizona and New Mexico volunteers and settlers)
    polities: [united-states]
    ink: blue
    moves: US moves
    success: US success
  - id: mx
    name: Mexico (federal troops and the forces of Sonora and Chihuahua)
    polities: [mexico]
    ink: green
    moves: Mexican moves
    success: Mexican success
notes:
  - "The Apache were never one nation at war. Each band made war or peace for itself, many Western Apache served the army as scouts against the Chiricahua and Yavapai, and the Tohono O’odham, old enemies of the Apache, took part in the Camp Grant massacre. The Yavapai, who speak a Yuman language, were often called Apache Mohave or Apache Yuma by the Americans."
  - "Small fights between settlers, troops and Apache who stayed out in the Sierra Madre went on in Mexico and along the border into the 1920s."
