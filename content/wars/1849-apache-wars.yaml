  - title: Cibecue and the Sierra Madre
    date: 1881–1884
    when: "1883-05-15"
    borders: "1883-05-15"
    countries: [us, mx]
    body:
      - "In 1881 the Cibecue Apache medicine man Nock-ay-det-klinne drew many followers on the Fort Apache reservation with a dance that, he taught, would bring back dead leaders. On 30 August Colonel Eugene Carr arrested him at Cibecue Creek; his followers attacked as the column made camp, most of the 23 Apache scouts with the troops turned on the soldiers, and the prophet was killed by his guards. Several soldiers died, and the next day Apache warriors attacked Fort Apache itself. Three of the scouts were later hanged for mutiny."
      - "Troops poured into the reservations, and at the end of September 1881 Juh, Naiche, Geronimo and other Chiricahua leaders, fearing arrest, fled with their people to the Sierra Madre in Mexico. In April 1882 they came back, forced Loco’s Chihenne at San Carlos to go with them and fought their way south; US cavalry followed them across the border, and on 30 April Mexican infantry under Colonel Lorenzo García ambushed the column at Alisos Creek in Chihuahua, killing many, most of them women and children. In July 1882 the followers of the White Mountain leader Na-tio-tish were defeated at Big Dry Wash below the Mogollon Rim, the last large battle fought in Arizona."
      - "Crook came back to Arizona in September 1882, tried to end the corruption at San Carlos and enlisted hundreds of Apache scouts, and in July 1882 the United States and Mexico had agreed that troops of either country might cross the border in pursuit of raiders. In May 1883, guided by Tzoe (Peaches), a White Mountain man who had lived with the Chiricahua, Crook led some 50 soldiers and 193 Apache scouts into the Sierra Madre. The scouts surprised a Chiricahua camp on 15 May, and the leaders, shaken to be found in their stronghold, agreed to return. More than 300 people came back with Crook in June, and Geronimo and the others followed by March 1884."
    facts:
      - [Battle of Cibecue Creek, "30 August 1881"]
      - [Battle of Big Dry Wash, "17 July 1882"]
      - [Crook’s Sierra Madre expedition, "May–June 1883, with 193 Apache scouts"]
