  - title: Camp Grant and the peace with Cochise
    date: 1871–1872
    when: "1871-04-30"
    borders: "1871-04-30"
    countries: [us]
    body:
      - "Early in 1871 some 500 Aravaipa and Pinal Apache under Eskiminzin came in to Camp Grant, where Lieutenant Royal Whitman gave them rations and let them camp on Aravaipa Creek, cutting hay and harvesting barley for wages. In Tucson, William Oury and Jesús María Elías blamed every raid in southern Arizona on them. At dawn on 30 April six Americans, 48 Mexican Americans and 92 Tohono O’odham fell on the camp while most of the men were away hunting. They killed 144 people, all but eight of them women and children, and carried off 29 children, most of whom were sold into slavery in Mexico."
      - "The killings shocked the East. President Grant threatened Arizona with martial law if the attackers were not tried; in December 1871 a Tucson jury acquitted them all after 19 minutes. Under Grant’s Peace Policy, Vincent Colyer and then General Oliver Otis Howard came to make peace and set up reservations, among them San Carlos and the White Mountain reservation around Camp Apache, while the new commander, Lieutenant Colonel George Crook, prepared to make war on those who would not settle on them."
      - "Howard went in search of Cochise. Guided by Thomas Jeffords, a former mail-line superintendent whom Cochise trusted, and two Apache, he reached Cochise’s camp in the Dragoon Mountains and in October 1872 agreed to give the Chokonen a reservation in their own country in south-eastern Arizona, with Jeffords as agent. Cochise kept the peace until his death in June 1874, though young men from the reservation still raided into Sonora."
    facts:
      - [Camp Grant massacre, "30 April 1871"]
      - [Killed, "144 Aravaipa and Pinal Apache, all but eight women and children"]
      - [Howard’s peace with Cochise, "October 1872"]
