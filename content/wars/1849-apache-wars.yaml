  - title: Cochise’s war
    date: 1861–1863
    when: "1862-07-15"
    borders: "1862-07-15"
    countries: [us, mx]
    body:
      - "In January 1861 raiders, later found to be Western Apache, carried off the stepson of the rancher John Ward from Sonoita Creek. Lieutenant George Bascom, sent with 54 men, invited the Chokonen leader Cochise, who had kept the peace with the Americans, to a parley at Apache Pass and tried to hold him and his family as hostages. Cochise cut his way out of the tent and took hostages of his own on the stage road; when no exchange was made, Cochise killed his American captives, and on 19 February the soldiers hanged his brother, two nephews and three other Apache men. The boy grew up among the Apache and later served the army as the scout Mickey Free."
      - "Within months the Civil War drew the regular troops away, and Cochise and his father-in-law Mangas Coloradas attacked mail stations, ranches and travellers across southern Arizona and New Mexico, while Confederate Texans occupied the Mesilla valley and declared a Confederate Territory of Arizona; on 27 September 1861 Apache warriors attacked the mining camp of Pinos Altos, defended by Confederate volunteers. In 1862 the Union’s California Column under Colonel James Carleton marched east from Tucson. On 15–16 July Cochise and Mangas Coloradas, with several hundred warriors, ambushed its advance guard at the spring in Apache Pass and were driven off by its mountain howitzers; the army then built Fort Bowie to hold the pass."
      - "Carleton, now commanding in New Mexico, ordered his officers to kill Apache men wherever they were found. In January 1863 Mangas Coloradas, then about seventy, came under a flag of truce to talk peace with a party of prospectors and was handed over to General Joseph West’s soldiers at Fort McLane. West made clear that he wanted him dead, and that night, 18 January, the guards shot him, reporting that he had tried to escape. His death bound the Chiricahua to a decade of war."
    facts:
      - [Bascom affair, "4–19 February 1861"]
      - [Battle of Apache Pass, "15–16 July 1862"]
      - [Death of Mangas Coloradas, "18 January 1863"]
