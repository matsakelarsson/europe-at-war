  - title: Crook’s Tonto Basin campaign
    date: 1872–1875
    when: "1872-12-28"
    borders: "1872-12-28"
    countries: [us]
    body:
      - "In November 1872 Crook sent columns of cavalry, guided by Apache scouts from the White Mountain and other bands, into the Tonto Basin and the canyons below the Mogollon Rim against the Yavapai and Tonto Apache who had not come in to the reservations. Moving in small detachments through the winter, they attacked camp after camp and gave the people no rest. On 28 December 1872 troops under Captain William Brown trapped a band of Kewevkapaya Yavapai in a cave high in the Salt River Canyon; the soldiers fired into its roof, and about 76 people, among them women and children, were killed."
      - "On 27 March 1873 Captain George Randall’s men climbed Turret Peak by night and surprised a camp of Yavapai and Apache who had thought themselves safe there. In April the Yavapai leader Chalipun and other leaders surrendered to Crook at Camp Verde, and their people began to dig irrigation ditches and farm on a reservation along the Verde River."
      - "Under pressure from Tucson contractors and in line with the government’s policy of concentrating the Apache, the Rio Verde reservation was closed, and on 27 February 1875 about 1,500 Yavapai and Dilzhe’e (Tonto) Apache were marched in winter some 290 km over the mountains to San Carlos; many died on the way. The Yavapai remember the day as Exodus Day. Only after 1900 were some allowed to return to the Verde valley."
    facts:
      - [Skeleton Cave, "28 December 1872, about 76 Yavapai killed"]
      - [Battle of Turret Peak, "27 March 1873"]
      - [Removal to San Carlos (Exodus Day), "27 February 1875"]
