id: kongsi-wars
name: Kongsi wars in West Borneo
start: "1850"
end: "1854"
tier: C
summary: "Wars between the Dutch East Indies and the self-governing Chinese gold-mining federations (kongsis) of West Borneo: the Second Kongsi War of 1850–1854 against the kongsis of Montrado, and the Mandor rising of 1884–1885 that ended the last of them, the Lanfang kongsi. Hakka miners had organised kongsis around Montrado and Mandor since the 1770s, with their own councils, courts and militias; the largest were the Heshun federation (Fosjoen) of Montrado, led by the Thaikong (Dagang) kongsi, the Samtiaokioe (Santiaogou) kongsi, which had broken away and held Sepang, Seminis and the port of Pamangkat, and the Lanfang kongsi at Mandor. In 1850, as the Dutch moved against the Montrado kongsis’ trade outside their control and tried to bring them under the new residency of Sambas and Pontianak, the Thaikong overran Sepang and Pamangkat, and the Samtiaokioe turned to the Sultan of Sambas and the Dutch. A Dutch force of about 400 men took the fortified Pamangkat in September 1850, its commander dying of his wounds, and a second attack in November failed; envoys of the three kongsis then made a settlement that the resident took to Batavia in February 1851. When a government commissioner deposed the Montrado headman and occupied Sepang in early 1853, fighting broke out again and went against the Dutch in May and June. In May 1854 Lieutenant Colonel Augustus Andresen landed about 2,200 men at Sambas and Pontianak, took Singkawang and entered Montrado on 2 June 1854; the kongsis were declared dissolved, the Samtiaokioe with them, and anyone found with arms faced death. Resistance through secret societies went on until 1856. The Lanfang kongsi, which had not fought the Dutch, kept its autonomy until its head, Liu Asheng, died in 1884. When the Dutch took over Mandor, Chinese and Dayak fighters killed the controller J. C. de Rijk on 23 October 1884 and fought on until February 1885; the Lanfang lands were divided among Pontianak, Mempawah and Landak, and many of its people left for Sumatra, Singapore and Sarawak."
