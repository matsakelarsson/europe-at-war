notes:
  - The kongsi names are given in the Hakka forms used in Dutch sources, with the Mandarin forms in brackets where they differ. Some writers call the kongsis republics; they were self-governing mining partnerships that the Sultans of Sambas and Pontianak and the Dutch dealt with as powers in their own right.
  - The Mandor rising of 1884–1885 is often counted as the Third Kongsi War; the first, in 1822–1824, came before the period covered here.
