notes:
  - "The wars were many local conflicts rather than one war, and alliances changed often: Fuladu was itself born of a Fula and Muslim revolt against Kaabu but fought Fodé Kaba, and several Soninke rulers sought British protection while some marabouts made treaties with France. The siege of Kansala is told in the Battle of Kansala, Maba’s war in Maba Diakhou Bâ’s jihad and Mahmadu Lamine’s in the French conquest of the Western Sudan."
  - Most of the written record comes from British and French officials and missionaries; Mandinka and Fula oral traditions, kept by griots, give other accounts and other dates.
