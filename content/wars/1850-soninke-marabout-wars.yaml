id: soninke-marabout-wars
name: Soninke–Marabout wars
start: "1850"
end: "1901-03-23"
tier: C
summary: "Half a century of wars in the Gambia valley and Casamance between the old ruling families of the Mandinka kingdoms and Muslim reformers, the marabouts, in which Britain and France took sides and then took the land. “Soninke” here was not the Soninke people but the name the marabouts gave to the rulers and warriors who kept the old religion or a loosely held Islam and lived by raiding, taxing trade and drinking palm wine; the marabouts, among them Mandinka, Fula and Jakhanke clerics, wanted Muslim states ruled by Islamic law. Fighting began in 1850 in Kombo, next to the British post at Bathurst (Banjul), where Muslim towns rose against King Suling Jatta, who was killed in 1855; British and, in 1855, French forces attacked the marabout stronghold of Sabaji (Sabajee), and Britain used the war to add land in Kombo to its colony. In the 1860s Maba Diakhou Bâ carried the war north of the river into Badibu and Saloum, and in 1867 the Fula leader Alfa Molo and Futa Jallon destroyed Kansala, the capital of Kaabu, after which Alfa Molo and his son Musa Molo ruled Fuladu on the upper river. The Jakhanke marabout Fodé Kaba Doumbouya, who had served under Maba, fought Fuladu and the Mandinka and Jola villages from the 1870s and ruled Fogny and eastern Kiang from his fortified town of Medina; the Soninke Mahmadu Lamine’s jihad of 1885–1887 reached Wuli and Niani. All sides took captives, and many were sold for horses and guns. The Anglo-French convention of 1889 drew the Gambia’s borders through these lands, and the two powers used the wars to extend their protectorates. Musa Molo became France’s ally against Fodé Kaba, who was killed when a French column with British support stormed Medina on 23 March 1901; in 1903 Musa Molo himself crossed into the British Gambia rather than submit to France."
