id: taiping-rebellion
name: Taiping Rebellion
start: "1850-12"
end: "1864-11-18"
tier: A
summary: "A civil war between the Qing dynasty and the Taiping Heavenly Kingdom, a state founded by Hong Xiuquan, a Hakka from Guangdong who believed he was the younger brother of Jesus. His God Worshipping Society rose at Jintian in Guangxi in January 1851, marched north through Hunan to the Yangtze and took Nanjing in March 1853, making it the Heavenly Capital (Tianjing). A Taiping army came close to Tianjin in 1853, and at its height the kingdom ruled much of the Yangtze valley. A bloody purge of its leaders in 1856 weakened it; it recovered under Li Xiucheng and Chen Yucheng and took Suzhou and Hangzhou in 1860–1861, but the provincial armies of Zeng Guofan, Li Hongzhang and Zuo Zongtang, helped from 1862 by British and French forces and Western-officered units around Shanghai, wore it down. Nanjing fell on 19 July 1864. It was the deadliest civil war of the 19th century; most estimates of the dead range from 20 to 30 million, and some are far higher."
countries: [cn]
sides:
  - id: qing
    name: Qing China
    polities: [qing]
    ink: gold
    moves: Qing moves
    success: Qing success
  - id: tp
    name: Taiping Heavenly Kingdom
    polities: [taiping]
