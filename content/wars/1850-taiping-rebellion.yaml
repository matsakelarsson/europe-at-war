steps:
  - title: The God Worshippers rise at Jintian
    date: 1843 – April 1852
    when: "1851-01-11"
    borders: "1851-01-11"
    countries: [cn]
    body:
      - Hong Xiuquan, a Hakka village teacher from near Guangzhou, failed the civil service examinations four times. After a breakdown in 1837 he had visions which, after reading a Christian tract in 1843, he understood to mean that he was the second son of God, sent to destroy demons, among whom he came to count the Manchu rulers. His follower Feng Yunshan built up the God Worshipping Society among Hakka charcoal burners, miners and poor farmers in the Thistle Mountain (Zijing Shan) district of Guangxi, a province torn by armed robbery, feuds between Hakka and older settlers, and the hard times that followed the Opium War.
      - In 1850 the society gathered its members, perhaps 10,000–20,000 people, at the village of Jintian, where they pooled their property and organised as an army in which men and women served in separate units. Late in December 1850 and in January 1851 they beat off the Qing troops sent against them, and on 11 January 1851, Hong’s birthday, he proclaimed the Taiping Tianguo, the Heavenly Kingdom of Great Peace.
      - In September 1851 the Taiping took the walled town of Yongan (today Mengshan), where Hong named five kings under him, Yang Xiuqing (the East King), Xiao Chaogui, Feng Yunshan, Wei Changhui and Shi Dakai. Besieged there by Qing armies through the winter, they broke out in April 1852 and marched north.
    facts:
      - [Jintian uprising, "January 1851"]
      - [Heavenly Kingdom proclaimed, "11 January 1851"]
      - [Yongan held, "September 1851 – April 1852"]
