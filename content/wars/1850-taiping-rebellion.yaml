  - title: The fall of the Heavenly Capital
    date: 1864 – 1866
    when: "1864-07-19"
    borders: "1864-07-19"
    countries: [cn]
    body:
      - In the spring of 1864 Zuo Zongtang retook Hangzhou (31 March) and Li Hongzhang’s Huai Army and the Ever Victorious Army took Changzhou (May), closing the ring around Nanjing. Hong Xiuquan, refusing to leave the city, fell ill after eating wild plants when food ran short and died on 1 June 1864; his teenage son Hong Tianguifu succeeded him. On 19 July Zeng Guoquan’s troops blew a breach in the wall with a mine and stormed the city. Zeng Guofan reported that some 100,000 rebels died in the fighting and the sack, and soldiers looted and burned for days.
      - Li Xiucheng escaped with the young king, but was captured, wrote a long account of the movement and was executed on 7 August. Hong Tianguifu was caught in Jiangxi in October and executed in Nanchang on 18 November 1864, as was Hong Rengan. Taiping armies fought on. Li Shixian and Wang Haiyang held Zhangzhou in Fujian in 1864–1865, and the last of them was destroyed at Jiaying in Guangdong in January 1866, while other former Taiping, such as Lai Wenguang, joined the Nian in the north.
      - The war left the Yangtze provinces devastated and the Qing dependent on the regional armies and their Han Chinese commanders, Zeng Guofan, Li Hongzhang and Zuo Zongtang, who would lead the dynasty’s reforms and wars for the next generation. Most estimates of the dead range from 20 to 30 million.
    facts:
      - [Hangzhou retaken, "31 March 1864"]
      - [Death of Hong Xiuquan, "1 June 1864"]
      - [Fall of Nanjing, "19 July 1864"]
      - [Hong Tianguifu executed, "18 November 1864"]
      - [Last Taiping army defeated, "Jiaying, January 1866"]
