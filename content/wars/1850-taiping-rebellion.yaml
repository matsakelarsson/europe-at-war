  - title: The western war and the Xiang Army
    date: 1853 – 1856
    when: "1854-04"
    borders: "1855-04"
    countries: [cn]
    body:
      - A second army went west up the Yangtze in 1853 to secure the river and the rice of Jiangxi and Hubei. It besieged Nanchang, retook Wuchang in June 1854 and pushed into Hunan. There it met the Xiang (Hunan) Army raised by Zeng Guofan, a Confucian scholar-official who recruited peasants through local gentry networks, paid them well and built a river fleet. The Xiang Army won at Xiangtan in May 1854, retook Wuchang in October and fought its way down to Jiujiang.
      - In January and February 1855 the Taiping commander Shi Dakai trapped part of Zeng’s fleet in Lake Poyang at Hukou and destroyed the rest on the Yangtze; Zeng tried to drown himself. The Taiping retook Wuchang in April 1855 and held much of Jiangxi. In June 1856 they broke the Jiangbei and Jiangnan siege camps outside Nanjing, and the Qing commander Xiang Rong died soon after. It was the Heavenly Kingdom’s strongest moment.
    facts:
      - [Battle of Xiangtan, "May 1854, Xiang Army victory"]
      - [Battle of Hukou, "January – February 1855, Taiping victory"]
      - [Siege camps outside Nanjing broken, "June 1856"]
    markers:
      - kind: battle
        side: qing
