  - title: Revival and the eastern campaign
    date: 1858 – 1861
    when: "1860-05"
    borders: "1860-06-02"
    countries: [cn]
    body:
      - Two younger commanders, Chen Yucheng, the Brave King, and Li Xiucheng, the Loyal King, rebuilt the Taiping armies. In November 1858 they destroyed a Xiang Army force at Sanhe in Anhui, killing its commander Li Xubin and some 6,000 of his men. In 1859 Hong’s cousin Hong Rengan, who had lived among missionaries in Hong Kong, arrived in Nanjing and became chief minister with plans for railways, banks and a modern state that were never carried out.
      - In May 1860 Li Xiucheng drew the Qing away with a feint on Hangzhou and then destroyed the Jiangnan camp outside Nanjing a second time. His armies swept into the rich lowlands of southern Jiangsu, taking Changzhou on 26 May and Suzhou on 2 June. In August they reached Shanghai, but British and French troops, whose governments were then at war with the Qing in the north, beat them off from the walls.
      - Upriver, Zeng Guofan’s brother Zeng Guoquan besieged Anqing, the key to Nanjing’s western approaches. Chen Yucheng tried to relieve it by marching on Wuhan in 1861, but turned back, and on 5 September 1861 Anqing fell; its defenders were killed. Chen was betrayed and executed in 1862. In the east, Li Xiucheng took Ningbo on 9 December and Hangzhou at the end of December 1861 after a two-month siege in which tens of thousands starved.
    facts:
      - [Battle of Sanhe, "November 1858, Taiping victory"]
      - [Jiangnan camp destroyed, "May 1860"]
      - [Suzhou taken, "2 June 1860"]
      - [Anqing falls to the Xiang Army, "5 September 1861"]
      - [Hangzhou taken, "December 1861"]
