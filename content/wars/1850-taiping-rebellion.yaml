  - title: The Northern Expedition
    date: May 1853 – May 1855
    when: "1853-05"
    borders: "1853-10-30"
    countries: [cn]
    body:
      - In May 1853 an army of perhaps 20,000–70,000 men under Lin Fengxiang and Li Kaifang set out from Yangzhou to take Beijing. It marched through Anhui and Henan, failed to take Kaifeng, crossed the Yellow River and swung through southern Shanxi into Zhili. In Beijing the court prepared to flee. At the end of October the expedition reached Jinghai, within 30 km of Tianjin, but there it stopped, short of supplies, unused to the northern winter and facing the Mongol cavalry of Senggelinqin.
      - The army retreated south in February 1854 and was besieged in fortified villages on the Grand Canal. A relief force sent from Anqing was destroyed in Shandong. Senggelinqin flooded Lin Fengxiang’s position at Lianzhen with water from the canal and took it in March 1855; Li Kaifang held out at Fengguantun until May. Both were taken to Beijing and executed. The defeat ended the Taiping’s only serious attempt to overthrow the dynasty in the north.
    facts:
      - [Expedition sets out, "May 1853"]
      - [Farthest advance, "Jinghai, near Tianjin, October 1853"]
      - [Lianzhen taken, "7 March 1855"]
      - [Fengguantun taken, "31 May 1855"]
    markers:
