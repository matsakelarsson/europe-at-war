    moves: British and French moves
    success: British and French success
notes:
  - The Taiping called their state Taiping Tianguo, the Heavenly Kingdom of Great Peace. The Qing called them “long-haired rebels” (changmao) because they gave up the Manchu queue. The rebellion overlapped with other risings that sometimes cooperated with it, among them the Nian in the north, the Small Swords in Shanghai and the Red Turbans in Guangdong, which have their own entries.
  - Most of the dead were civilians who died of famine, disease and massacres by both sides; whole districts of Jiangsu, Zhejiang and Anhui were depopulated. Estimates of the total range from 20 to 30 million, the most widely cited figure, to 70 million or more; no census allows a precise count.
  - The areas shaded on the maps are approximate; Taiping control outside the walled towns was often loose and changed from month to month.
