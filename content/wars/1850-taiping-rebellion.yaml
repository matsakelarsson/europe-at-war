  - title: From Guangxi to the Heavenly Capital
    date: April 1852 – March 1853
    when: "1852-04"
    borders: "1853-03-19"
    countries: [cn]
    body:
      - The Taiping failed to take Guilin in April–May 1852, and in June Feng Yunshan was killed in an ambush at Suoyi Ford on the Xiang river. Turning into Hunan, the army grew quickly as miners, boatmen, members of secret societies and the poor joined it. Xiao Chaogui was killed at the siege of Changsha, which held out from September to November 1852. The Taiping then took Yuezhou, with its arsenal and its boats, and sailed down to the Yangtze, where they captured Hanyang and, on 12 January 1853, Wuchang, the capital of Hubei.
      - With a fleet of thousands of boats and an army now said to number half a million people, they swept down the Yangtze, taking Jiujiang and Anqing in February. On 19 March 1853 they stormed Nanjing, the old Ming capital, which became Tianjing, the Heavenly Capital. The Manchu garrison and its families, tens of thousands of people, were killed almost to the last. Zhenjiang and Yangzhou fell within weeks. The Qing set up two siege camps outside Nanjing, the Jiangnan camp to the south and the Jiangbei camp at Yangzhou, which would watch the city for years.
    facts:
      - [Feng Yunshan killed, "June 1852"]
      - [Siege of Changsha, "September – November 1852"]
      - [Wuchang taken, "12 January 1853"]
      - [Nanjing taken, "19 March 1853"]
