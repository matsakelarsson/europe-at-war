  - title: The Tianjing incident
    date: September 1856 – 1857
    when: "1856-09-02"
    borders: "1856-09-02"
    countries: [cn]
    body:
      - Inside Nanjing, Hong Xiuquan had withdrawn into his palace and left the government to Yang Xiuqing, the East King, who claimed to speak with the voice of God the Father and ruled with an elaborate system of officials and spies. In August 1856 Yang demanded the same title as Hong. Hong secretly called back Wei Changhui, the North King, who entered the city with his troops on the night of 1–2 September and killed Yang and his family. In the weeks that followed Wei’s men killed thousands of Yang’s followers and their families, by many accounts some 20,000 people.
      - Shi Dakai, the Wing King, protested and fled; Wei killed his family. Hong then had Wei and his associate Qin Rigang put to death in November. Shi returned to run the government, but Hong, now trusting only his own relatives, sidelined him, and in June 1857 Shi left Nanjing with a large part of the army. He fought on his own for six years across Jiangxi, Zhejiang, Fujian, Hunan, Guangxi and Guizhou, until in June 1863 he was trapped at Anshunchang on the Dadu river in Sichuan, surrendered and was executed in Chengdu. The purge cost the kingdom most of its founding leaders.
    facts:
      - [Yang Xiuqing killed, "2 September 1856"]
      - [Dead in the purge, "some 20,000 by many accounts"]
      - [Shi Dakai leaves Nanjing, "June 1857"]
      - [Shi Dakai surrenders on the Dadu river, "June 1863"]
    markers:
      - kind: event
        side: tp
        name: Tianjing (Nanjing)
        date: 2 September 1856
        text: Wei Changhui’s troops killed the East King Yang Xiuqing in his palace, then massacred his followers.
        lonlat: [118.780, 32.060]
        lp: b
      - kind: event
        side: qing
        name: Anshunchang
        date: June 1863
        text: Shi Dakai’s army was trapped against the flooded Dadu river by Qing troops and local Yi chiefs. He gave himself up hoping to save his men, most of whom were killed.
        lonlat: [102.276, 29.269]
        lp: l
