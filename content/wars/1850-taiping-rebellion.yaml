  - title: Shanghai, the foreigners and the siege of Nanjing
    date: 1862 – 1863
    when: "1862-05"
    borders: "1862-05-30"
    countries: [cn, gb, fr]
    body:
      - After the Convention of Peking ended their war with the Qing in 1860, Britain and France, anxious for their trade, moved from neutrality to support of the dynasty. In 1862 British and French troops cleared the Taiping from a 30-mile zone around Shanghai and helped retake Ningbo; the French admiral Auguste Protet was killed in one of these actions. A force of Chinese soldiers led by Western officers, raised by the American Frederick Townsend Ward and called the Ever Victorious Army, fought alongside them; Ward was killed at Cixi in September 1862 and was succeeded in 1863 by the British officer Charles Gordon. In April 1862 British steamers carried Li Hongzhang’s new Huai Army from Anqing to Shanghai.
      - In May 1862 Zeng Guoquan’s army reached the walls of Nanjing and dug in on the hill of Yuhuatai. Li Xiucheng came back from the east with a large army and attacked his lines for 46 days in October and November, but could not break them, while an epidemic killed many on both sides. In the west, Zuo Zongtang’s army entered Zhejiang from Jiangxi, and in December 1863 Suzhou was surrendered by Taiping commanders who had negotiated with Li Hongzhang and Gordon. Li had the surrendered kings put to death, and Gordon, who had guaranteed their safety, briefly refused to serve.
    facts:
      - [Huai Army reaches Shanghai, "April 1862"]
      - [Siege of Nanjing begins, "May 1862"]
      - [Ward killed at Cixi, "21 September 1862"]
      - [Suzhou surrenders, "5 December 1863"]
    markers:
