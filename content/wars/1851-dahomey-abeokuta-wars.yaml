steps:
  - title: Gezo’s attack
    date: 1851
    when: "1851-03-03"
    borders: "1851-03-03"
    countries: [ng, bj]
    body:
      - Dahomey had freed itself from Oyo in the 1820s and, under Gezo (king from 1818), became a highly organised military state, with a standing army that included several thousand women soldiers, called ahosi or mino in Fon and Amazons by Europeans. Its wealth came from selling captives to Atlantic slave traders at Ouidah, and its armies raided the lands to the east, where the Egba had built Abeokuta as a refuge. By the 1840s Abeokuta was a major power in its own right, welcomed British missionaries such as Henry Townsend, and sought British help in buying arms.
      - In 1851 Gezo, allied with Kosoko, the king of Lagos, who was to attack Badagry, marched on Abeokuta. On 3 March his army attacked the city across the open ground outside its walls. The Egba, with muskets bought on the coast and encouraged by the missionaries, held the walls and then counter-attacked; the Dahomeans withdrew after heavy losses, many of the dead being women soldiers, and were pursued as they retreated.
      - The defeat weakened Gezo and helped turn British opinion against his allies. In December 1851 a British naval force attacked Lagos, drove out Kosoko and installed his rival Akitoye, who promised to end the slave trade; and in 1852, under a British naval blockade, Gezo signed a treaty to end the export of slaves from Dahomey. Slave shipments from Ouidah resumed a few years later.
