  - title: Glele’s attack
    date: 1858 – 1864
    when: "1864-03-15"
    borders: "1864-03-15"
    countries: [ng, bj]
    body:
      - "Gezo died in 1858 or 1859, after a renewed campaign against the Egba; some accounts say he was killed by a marksman hired by Abeokuta, others that he died of smallpox. His son Glele swore to avenge him. In 1862 his army destroyed the Egba town of Ishagga, west of Abeokuta, and he refused British demands to end the slave trade. Richard Burton, sent by the British government to Abomey in 1863–1864, failed to persuade him to stop his war with Abeokuta."
      - On 15 March 1864 Glele’s army, which this time even brought small cannon on locally made carriages, attacked Abeokuta. Once again the attack broke down under the fire of the defenders, and the Dahomeans fled with heavy losses in dead and captured.
      - Dahomey never took Abeokuta, but it went on raiding the Egba and the western Yoruba borderlands for the rest of the century. Its armies sacked Okeodan in 1885 and destroyed the Yoruba town of Ketu in 1886, carrying off most of its people. The wars ended only with the French conquest of Dahomey in 1892–1894 and the British treaties with the Egba in 1893.
