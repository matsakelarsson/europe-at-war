id: dahomey-abeokuta-wars
name: Dahomey’s wars against Abeokuta
start: "1851-03-03"
end: "1864-03-15"
tier: B
summary: "Two great attacks by the Kingdom of Dahomey on Abeokuta, the city of the Egba in what is now south-western Nigeria, in 1851 and 1864, part of a rivalry that lasted from the 1840s to the end of Dahomey’s independence. Abeokuta, founded about 1830 by Egba refugees from the wars that followed the fall of Oyo, grew into a large walled city on the Ogun river, a centre of Christian missions and of the new palm-oil trade, and a rival to Dahomey for the trade and captives of the region between them. On 3 March 1851 King Gezo’s army, women soldiers in its front ranks, stormed Abeokuta’s walls and was driven off with heavy losses. Thirteen years later, on 15 March 1864, his son Glele attacked again, to avenge his father, and was routed in turn. Neither attack ended the rivalry. Dahomey went on raiding the Egba and western Yoruba borderlands, destroying Ketu in 1886, until the French conquest of Dahomey in 1892–1894."
