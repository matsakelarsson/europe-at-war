        side: nian
        name: Gaolouzhai
        date: 18 May 1865
        text: Senggelinqin’s exhausted army was surrounded and destroyed near Caozhou (today Heze). He was killed in the fighting.
        lonlat: [115.350, 35.300]
      - kind: battle
        side: nian
        name: Kaifeng
        date: October 1866
        text: The Nian broke through Zeng Guofan’s defence line on the Jialu river near the city.
        lonlat: [114.307, 34.797]
        lp: l
    arrows:
