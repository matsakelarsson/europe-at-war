steps:
  - title: Floods, fortified villages and Zhang Lexing
    date: 1851 – 1863
    when: "1856"
    borders: "1856"
    countries: [cn]
    body:
      - The plain between the Huai river and the Yellow River was poor and often flooded, and its people had long lived by salt smuggling, raiding and feuds, organised in bands called nian. In 1851 the Yellow River broke its dikes, and in 1855, at Tongwaxiang in Henan, it burst out of its old bed south of Shandong and found a new course to the sea north of the province, flooding huge areas. The Qing, drained by the Taiping war, could give little relief, and the bands grew into small armies whose cavalry raided across four provinces from earth-walled villages.
      - In 1856 the leaders of several bands met at Zhihe in northern Anhui and chose Zhang Lexing as their chief. The alliance was organised in coloured banners, each based on a group of related villages, and was never tightly controlled. Zhang accepted the title of prince from the Taiping, and Nian and Taiping armies sometimes fought together, but they never merged. In 1862 the court sent Senggelinqin, who had destroyed the Taiping Northern Expedition, against them. He stormed Zhihe, and in 1863 Zhang Lexing, betrayed by an ally, was captured and executed.
    facts:
      - [Yellow River changes course, "1855"]
      - [Alliance of Zhihe, "1856, under Zhang Lexing"]
      - [Zhang Lexing executed, "1863"]
    markers:
      - kind: event
        side: nian
