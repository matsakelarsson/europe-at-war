  - title: The death of Senggelinqin
    date: 1864 – 1866
    when: "1865-05-18"
    borders: "1865-05-18"
    countries: [cn]
    body:
      - After the fall of Nanjing in 1864, Taiping commanders such as Lai Wenguang who had been fighting in the north joined the Nian with their veterans and reorganised them as a mobile army of horsemen that could cover great distances and avoid pitched battle. Senggelinqin pursued them for months across Henan, Hubei and Shandong until his men and horses were exhausted. On 18 May 1865 the Nian ambushed his army at Gaolouzhai near Caozhou in south-western Shandong; Senggelinqin was killed and much of his cavalry destroyed.
      - The court gave the command to Zeng Guofan, the victor over the Taiping, who planned to pen the Nian in with fortified lines along rivers and canals and to cut them off from their home villages, which were registered and watched. The method was slow, and in October 1866 the Nian broke through his line on the Jialu river near Kaifeng. Zeng was replaced by his protégé Li Hongzhang. At the end of 1866 the Nian split into an Eastern army under Lai Wenguang and a Western army under Zhang Zongyu, a nephew of Zhang Lexing, which marched into Shaanxi to join the Hui rebels.
    facts:
      - [Battle of Gaolouzhai, "18 May 1865, Nian victory"]
      - [Nian break the Jialu river line, "October 1866"]
      - [Split into Eastern and Western Nian, "late 1866"]
    markers:
