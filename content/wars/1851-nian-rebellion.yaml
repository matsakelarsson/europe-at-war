  - title: The destruction of the Nian
    date: 1867 – 1868
    when: "1868-01"
    borders: "1868-08-16"
    countries: [cn]
    body:
      - Li Hongzhang’s Huai Army, armed with Western rifles and guns, used Zeng’s method on a larger scale. The Eastern Nian were driven into the Shandong peninsula and penned behind lines along the Grand Canal and other rivers. Their commander Ren Zhu was killed at Ganyu in November 1867, the army was crushed near Shouguang in December, and Lai Wenguang was captured near Yangzhou in January 1868 and executed.
      - To relieve the Eastern Nian, Zhang Zongyu led the Western Nian back from Shaanxi across Shanxi into Zhili in the winter of 1867–1868 and raided towards Baoding and Tianjin, alarming Beijing. Li Hongzhang and Zuo Zongtang turned all their forces against them and trapped them in the land between the Yellow River, the Grand Canal and the Tuhai river in north-western Shandong. The last Nian army was destroyed near Chiping in August 1868; Zhang Zongyu disappeared, probably drowned in the Tuhai.
    facts:
      - [Eastern Nian crushed, "December 1867 – January 1868"]
      - [Lai Wenguang captured, "January 1868"]
      - [Western Nian destroyed, "August 1868"]
    markers:
