notes:
  - The word nian, from the local dialect, meant a band or gang. The Nian had no single creed or programme; historians such as Elizabeth Perry have seen them as a product of the survival strategies of a poor, flood-prone region, in which villages walled themselves in and both raided and defended against their neighbours.
  - The war devastated the North China Plain. There is no reliable count of its dead.
