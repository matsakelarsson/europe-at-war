id: nian-rebellion
name: Nian Rebellion
start: "1851"
end: "1868-08-16"
tier: B
summary: "A rising of armed bands, the Nian, in the Huaibei region of northern Anhui and the neighbouring parts of Henan, Shandong and Jiangsu, at the same time as the Taiping Rebellion. Poverty, raiding and the disastrous floods of the Yellow River, which broke its banks in 1851 and changed its course to the north in 1855, swelled the bands, which raided far and wide from fortified villages. In 1856 they formed an alliance under Zhang Lexing, who accepted titles from the Taiping. The Mongol general Senggelinqin defeated and executed Zhang in 1863, but Taiping veterans reorganised the Nian as a fast-moving cavalry army that killed Senggelinqin in 1865. Zeng Guofan’s strategy of hemming them in with fortified river lines was carried through by Li Hongzhang and Zuo Zongtang, and in 1868 the Eastern Nian were destroyed in Shandong and Jiangsu and the Western Nian, after a raid towards Beijing, in north-western Shandong."
countries: [cn]
