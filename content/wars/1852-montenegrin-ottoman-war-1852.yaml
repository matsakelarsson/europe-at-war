id: montenegrin-ottoman-war-1852
name: Montenegrin–Ottoman War of 1852–1853
start: "1852-11"
end: "1853-03"
tier: C
summary: A war that followed Danilo Petrović-Njegoš’s transformation of Montenegro from a prince-bishopric into a secular principality in 1852 and his secret help to the Herzegovinian rebels of Luka Vukalović. After the Montenegrins seized the fortress of Žabljak near Lake Scutari, the Porte declared war, and in the winter of 1852–1853 Omer Pasha invaded Montenegro from Herzegovina and Albania with a much larger army. The Montenegrins held out, winning near Ostrog, and in February 1853 an Austrian envoy, Count Christian Leiningen, delivered an ultimatum in Constantinople, supported by Russia, that made the Ottomans withdraw. Like the dispute over the Holy Places, the crisis helped bring on the Crimean War.
