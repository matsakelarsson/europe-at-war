  - title: Bassein, Pegu and Prome
    date: May – December 1852
    when: "1852-05-19"
    borders: "1852-10-09"
    countries: [mm]
    body:
      - With Rangoon secured, Godwin sent a force by sea and up the Bassein river, which took Bassein (Pathein), the main town of the western delta, on 19 May 1852. On 3 June a column from Rangoon took Pegu (Bago) after sharp fighting around the Shwemawdaw Pagoda. The rains then halted operations, and Dalhousie visited Rangoon in July and August to decide how much of the country to keep.
      - In September the river steamers carried Godwin’s army up the Irrawaddy, and on 9 October 1852 he occupied Prome (Pyay), meeting only slight resistance from the Burmese forces under the Lord of Dabayin, a son of Maha Bandula. Austen had died of cholera on the river a few days earlier. In November Burmese troops besieged the small British garrison at Pegu, which was relieved in December.
      - In December Dalhousie informed King Pagan that the province of Pegu would henceforth belong to the Company. His proclamation of annexation was dated 20 December 1852 and read out at Rangoon on 20 January 1853. The new frontier was drawn across the country about 80 km north of Prome, so as to take in the teak forests and the district of Toungoo.
    facts:
