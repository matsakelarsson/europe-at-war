steps:
  - title: Lambert’s blockade and the fall of Rangoon
    date: January – April 1852
    when: "1852-04-05"
    borders: "1852-04-14"
    countries: [mm]
    body:
      - Since the Treaty of Yandabo (1826) the Company had held Arakan and Tenasserim, and British merchants traded at Rangoon, the Konbaung kingdom’s only large seaport. In 1851 the governor of Rangoon fined two British ship captains, Sheppard and Lewis, on charges brought by their crews. They complained to Calcutta, and Lord Dalhousie sent Commodore George Lambert to demand compensation and the governor’s removal. King Pagan replaced the governor, but in January 1852, after the new governor had refused to receive a British deputation, Lambert seized a ship belonging to the king and declared a blockade of the coast. Burmese shore batteries fired on his ships, and his frigates destroyed them. Dalhousie, who called Lambert the “combustible commodore”, raised the demand to about £100,000 to cover the cost of the preparations for war; in Britain, Richard Cobden attacked the war as one that had grown out of a claim of about £1,000.
      - When no answer came, an expedition under Major-General Henry Godwin, with the naval squadron of Rear-Admiral Charles Austen, sailed from Calcutta and Madras. On 5 April 1852 a short bombardment and assault took Martaban (Mottama) at the mouth of the Salween. Godwin landed below Rangoon on 12 April, and after two days of fighting his troops stormed the terraces of the Shwedagon Pagoda on 14 April. The Burmese army, estimated at about 50,000 men in all, fell back up the Irrawaddy and towards Pegu.
    facts:
      - [Lambert’s blockade, "January 1852"]
      - [Martaban taken, "5 April 1852"]
      - [Rangoon and the Shwedagon taken, "12–14 April 1852"]
