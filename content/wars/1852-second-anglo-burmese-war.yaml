id: second-anglo-burmese-war
name: Second Anglo-Burmese War
start: "1852-04-05"
end: "1853-06-30"
tier: B
summary: "The East India Company’s conquest of Pegu, the Irrawaddy delta and the lands up to Prome and Toungoo from the Konbaung kingdom of Burma. A dispute over fines that the governor of Rangoon had imposed on two British sea captains led the Governor-General, Lord Dalhousie, to send Commodore George Lambert, who blockaded Rangoon and seized a royal ship in January 1852. When King Pagan did not meet the Company’s demands, an expedition under Major-General Henry Godwin took Martaban and Rangoon in April 1852, Bassein and Pegu in May and June, and Prome in October. Dalhousie annexed the province of Pegu by a proclamation dated 20 December 1852 and read out at Rangoon on 20 January 1853. In Burma the war brought down Pagan Min, who was overthrown by his half-brother Mindon in February 1853. Mindon wanted peace but would not sign away Burmese land, so the war ended with a ceasefire in mid-1853 and no treaty. Local resistance continued for some months, notably under Myat Toon near Danubyu."
countries: [mm]
sides:
  - id: eic
    name: East India Company
    polities: [british-india]
    ink: red
    moves: Company moves
    success: Company success
  - id: bur
    name: Konbaung Burma
    polities: [konbaung]
    ink: brown
    moves: Burmese moves
    success: Burmese success
notes:
  - The Company’s army was made up of regiments of the Bengal and Madras armies, mostly Indian sepoys under British officers, with three British Army battalions; the fleet came from the Royal Navy and the Company’s Indian Navy.
  - Burmese place names are given as in the English sources of the time, with today’s names in brackets where they differ. The Burmese court was then at Amarapura, though British writers still called it the Court of Ava.
  - Sources differ on the end date. The war is often dated 1852–1853, ending with the annexation (20 December 1852 or its proclamation at Rangoon on 20 January 1853); the ceasefire with King Mindon took effect on 30 June 1853.
