  - title: Mindon’s coup, Myat Toon and a war without a treaty
    date: December 1852 – June 1853
    when: "1853-02-18"
    borders: "1853-06-30"
    countries: [mm]
    body:
      - At the court of Amarapura the war was unpopular. In late 1852 the king’s half-brother Mindon, who opposed the war, fled with his brother Kanaung to Shwebo, the old home of the dynasty, and raised a revolt. The court collapsed within weeks; officials let Mindon’s followers into the capital, and on 18 February 1853 Mindon took the throne. Pagan Min was deposed but allowed to live on in the palace grounds until his death in 1880.
      - Mindon sent two Italian Catholic priests to negotiate. They found the British already at Myede (Aunglan), about 80 km north of Prome, where Godwin had fixed the new frontier. Mindon would not sign a treaty ceding Burmese territory, and the British did not insist; hostilities ended by a ceasefire that took effect on 30 June 1853, and the Company’s Army of Ava was broken up in July.
      - In the delta, resistance continued under Myat Toon (Nga Myat Htun), a local leader with several thousand men in stockades near Danubyu, whom British reports called a robber chief and Burmese tradition remembers as a patriot. On 4 February 1853 he ambushed a column of sailors and sepoys under Captain Granville Loch, who was mortally wounded; the column retreated, leaving its dead and both its guns. Brigadier-General Sir John Cheape then led about 1,000 men through the swamps for several weeks and stormed Myat Toon’s main stockade on 19 March, losing 11 killed and 84 wounded by one count; among the wounded was a young Garnet Wolseley. Myat Toon escaped. In 1862 the Company’s successor, the Crown, joined Pegu, Arakan and Tenasserim into the province of British Burma.
    facts:
      - [Mindon takes the throne, "18 February 1853"]
      - [Loch’s defeat near Danubyu, "4 February 1853"]
      - [Myat Toon’s stockade stormed, "19 March 1853"]
      - [Ceasefire, "30 June 1853 (no treaty signed)"]
    markers:
