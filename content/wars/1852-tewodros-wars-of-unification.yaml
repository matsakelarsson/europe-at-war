steps:
  - title: Gur Amba and Ayshal
    date: November 1852 – June 1853
    when: "1852-11-27"
    borders: "1853-06-29"
    countries: [et]
    body:
      - Since 1769 the emperors at Gondar had been figureheads, set up and deposed by the great lords. From the 1780s the most powerful of them were the regents of the Yejju dynasty, lords of Oromo origin and Muslim descent from the eastern highlands who ruled from Debre Tabor; in 1852 the regent was Ras Ali II. Dejazmach Wube ruled Semien and Tigray, Goshu Zewde and his son Birru Goshu Gojjam, while Shewa had its own kings. Kassa Hailu, born about 1818 in Qwara near the Sudanese border, rose as the leader of a band of fighters, married Ras Ali’s daughter Tewabech and was made governor of Qwara. In 1848 he attacked the Egyptian post at Dabarki on the Sudanese frontier and was beaten back by artillery and disciplined musket fire, a lesson he did not forget.
      - In 1852 he broke with Ras Ali. On 27 November 1852 he defeated the regent’s army at Gur Amba, where its commander, Goshu Zewde of Gojjam, was killed. In 1853 he beat Ras Ali’s generals Birru Aligaz and Belew at Takusa, and on 29 June 1853 he defeated Ras Ali himself at Ayshal in eastern Gojjam. Ras Ali fled to Yejju and never returned to power. Ethiopian tradition dates the end of the Era of the Princes to this battle.
    facts:
      - [Battle of Gur Amba, "27 November 1852, victory of Kassa"]
      - [Battle of Ayshal, "29 June 1853, victory of Kassa"]
