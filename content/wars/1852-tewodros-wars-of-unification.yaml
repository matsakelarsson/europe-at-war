id: tewodros-wars-of-unification
name: Wars of Tewodros II
start: "1852"
end: "1868-04-13"
tier: B
summary: "The wars by which Kassa Hailu, a chief from the western borderland of Qwara, ended the Zemene Mesafint, the “Era of the Princes” in which regional lords had ruled Ethiopia in the name of powerless emperors at Gondar, and made himself emperor as Tewodros II. Between November 1852 and February 1855 he defeated the lords of Gojjam at Gur Amba, the regent Ras Ali II at Ayshal and Dejazmach Wube of Semien and Tigray at Derasge, and was crowned on 11 February 1855. He then took Wollo and, in 1855–1856, the kingdom of Shewa, whose young heir Menelik he brought to his court. His attempts to rule through appointed officials and a standing army, and to tax the church, met revolt in almost every province, which he answered with ever harsher reprisals. By 1867 he held little beyond his fortress of Magdala, where he died during the British assault of April 1868."
