notes:
  - The base map shows the Ethiopian empire as one state during the Era of the Princes, with Shewa separate until 1856. The lands of the regent and the regional lords, and the provinces that rose against Tewodros, are drawn as areas.
  - Tewodros chose his throne name after a prophecy of a just king named Tewodros who would restore Ethiopia. Some of the battles of 1852–1854 (Takusa, Amba Jebelli) are not precisely dated or located in the sources.
