  - title: Revolt in the provinces
    date: 1856–1868
    when: "1863"
    borders: "1867-06-01"
    countries: [et]
    body:
      - Tewodros wanted to end the power of the regional lords for good. He tried to replace hereditary governors with salaried appointees, built a standing army paid from taxes, banned the slave trade, and tried to tax church lands, which turned much of the clergy against him. His soldiers lived off the country. Revolts broke out in Gojjam under Tedla Gwalu, in Tigray under Negusse, who sought French help, in Lasta under Wagshum Gobeze, in Wollo and in Shewa.
      - Tewodros answered with growing violence. After defeating Tedla Gwalu’s forces in February 1863 he had thousands of prisoners killed, and in 1864 he let his army plunder Gondar. In 1865 Menelik escaped from Magdala to Shewa and was proclaimed king there. By the end of 1867 Tewodros held little more than the country between Debre Tabor and Magdala; Kassa Mercha ruled Tigray, Gobeze Lasta and much of the north-west. His imprisonment of the British consul and other Europeans, after London had left his letter to Queen Victoria unanswered, brought a British army to Magdala, where he shot himself on 13 April 1868.
    facts:
      - [Menelik’s escape to Shewa, "1865"]
      - [Death of Tewodros, "13 April 1868, Magdala"]
    markers:
