  - title: Derasge, the coronation and Shewa
    date: February 1855 – 1856
    when: "1855-02-09"
    borders: "1856-06-01"
    countries: [et]
    body:
      - Wube, the last great rival, ruled Semien and Tigray and had built the church of Derasge Maryam in Semien for his own coronation. Kassa defeated him at Derasge on 9 February 1855 and two days later, on 11 February, had himself crowned in Wube’s church by the Abuna Salama III as Tewodros II, King of Kings of Ethiopia. He then marched into Wollo, took the mountain fortress of Magdala, and turned on Shewa.
      - King Haile Melekot of Shewa, with Oromo allies from Wollo, could not stop an army said to number about 50,000. Ill and deserted by part of his army, he destroyed his food stores and the town of Debre Berhan to deny them to Tewodros, and died in late 1855. A few Shewan nobles fought on until they were beaten at Bulga, then gave up his eleven-year-old son and heir, Menelik. Tewodros made Haile Melekot’s brother Haile Mikael governor and took Menelik back with him, raising him at court and later marrying him to his daughter Alitash. Shewa’s independence was over for a decade.
    facts:
      - [Battle of Derasge, "9 February 1855, victory of Kassa"]
      - [Coronation of Tewodros II, "11 February 1855, Derasge Maryam"]
      - [Death of Haile Melekot, "October or November 1855"]
