id: umar-tall-jihad
name: Umar Tall’s jihad
start: "1852-09"
end: "1864-02"
tier: A
summary: "The holy war of al-Hajj Umar Tall, a Tijani scholar from Futa Toro on the Senegal, which in twelve years built the largest state of the western Sudan, the Umarian or Toucouleur Empire. From his community at Dinguiraye, in the hills east of Futa Jallon, Umar declared jihad after the king of Tamba attacked him in September 1852. He conquered Bambuk and the Khasso kingdoms in 1854 and the Bamana kingdom of Kaarta in 1855, making its capital Nioro his own. When he turned west towards his homeland on the Senegal he met the French of Governor Louis Faidherbe, who had built a fort at Médine; Umar besieged it from April to July 1857 and failed, and after recruiting thousands of emigrants in Futa Toro he left the Senegal valley to the French. In 1860–1861 he conquered the Bamana kingdom of Ségou, and in May 1862, after the battle of Cayawal, the Fulbe Caliphate of Hamdullahi in Massina, a Muslim state whose overthrow he had to justify in writing. Massina rose against him in 1863 under Ba Lobbo and the Kunta scholar Ahmad al-Bakkay; Umar was besieged in Hamdullahi, broke out in February 1864 and died in the cliffs of Degembere near Bandiagara. His son Ahmadu ruled from Ségou and his nephew Tidiani from Bandiagara until the French conquest of 1890–1893. Umar is remembered in Senegal as a reformer and a resister of the French, and in parts of Mali as a conqueror whose wars of booty and captives devastated the middle Niger."
