  - title: Kaarta
    date: 1855–1856
    when: "1855-04-11"
    borders: "1855-04-11"
    countries: [ml, mr]
    body:
      - From Koniakary Umar marched north-east against Kaarta, the Bamana kingdom of the Massassi Coulibaly, whose kings had raided Khasso for a century. His army took the capital, Nioro, on 11 April 1855. The faama, Mamadi Kandia, was put to death with his family, ending the Massassi dynasty, and Umar made Nioro his capital, building a great mosque there in 1856. Islam was imposed on the Bamana, and the worship of their shrines was forbidden.
      - In 1855–1856 the Bamana of Kaarta rose against the new rule, and Umar put the revolts down severely. On the Senegal, the Khasso kings who had submitted in 1854 turned to the French for protection, and Umar’s commander Thierno Jibi laid waste the right bank of the river, sending refugees across it. War, flight and the famine that began in 1856 and lasted until 1861 emptied whole villages in the upper Senegal valley.
    facts:
      - [Nioro taken, "11 April 1855"]
      - [Bamana risings in Kaarta, "1855–1856"]
