  - title: The conquest of Ségou
    date: May 1860 – March 1861
    when: "1861-03-10"
    borders: "1861-03-10"
    countries: [ml]
    body:
      - With the French settled on the Senegal, Umar turned against Ségou, the great Bamana kingdom on the Niger, which his followers called the city of unbelief. Its kings, the Diarra, had been weakened by succession quarrels, and the faama Torokoro Mari, who was friendly to Umar, had been deposed and killed in 1859 by the tonjon, who put Ali Diarra (Bina Ali) on the throne. Umar named his son Ahmadu his successor during the campaign. His army took Nyamina on the Niger without a fight on 25 May 1860 and in September won a battle at Witala, where cannon captured from the French decided the day.
      - Amadu III of Massina offered Ali Diarra help on condition that he become a Muslim, and in January 1861 a Massina army under Ba Lobbo, said to number 8,000 horsemen, 5,000 foot and 1,000 musketeers, joined the remains of the Bamana forces at Tio, on the right bank of the Niger opposite Sansanding. After a clash of canoe fleets in mid-February, and the loss of about 500 of his men who attacked on their own, Umar sent his army across the river at night in two wings and routed the allies. He entered Ségou on 10 March 1861; Ali Diarra fled to Hamdullahi with the royal shrines. Umar made Ségou his capital, with Ahmadu as its ruler, but Bamana war chiefs went on resisting in the countryside, encouraged by Massina.
    facts:
      - [Nyamina taken, "25 May 1860"]
      - [Battle of Witala, "September 1860"]
      - [Battle of Tio, "February 1861"]
      - [Ségou taken, "10 March 1861"]
