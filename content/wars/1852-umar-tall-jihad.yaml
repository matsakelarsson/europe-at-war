  - title: The Massina rising and Umar’s death
    date: 1863 – February 1864
    when: "1864-02-06"
    borders: "1864-02-06"
    countries: [ml]
    body:
      - Umar’s rule in Massina was harsh, and his attempt to reach Timbuktu united his enemies. In 1863 an Umarian army marching on the city was defeated by a coalition of the Kunta under Ahmad al-Bakkay, Tuareg, Moorish groups and Fulbe; its commanders Alfa Umar, Thierno Bayla and Alfa Uthman were killed. In the spring of 1863 Massina rose under Ba Lobbo, a nephew of Seku Amadu, allied with al-Bakkay. From June 1863 Umar was besieged in Hamdullahi, and hunger spread in the town through the winter.
      - In January 1864 Umar sent Tidiani to raise an army among the Dogon of the Bandiagara plateau. Early in February the besiegers broke into Hamdullahi, and on 6 February Umar escaped with his household and a few followers to the cliffs of Degembere near Bandiagara. There he died, with his sons Muhammad Makki, Hadi and Muhammad Mahi, on 12 or 14 February 1864; the traditions say that he died when his powder store exploded, or that he disappeared into a cave. When Tidiani arrived with Dogon and Fulbe troops it was too late.
      - Tidiani defeated Ba Lobbo’s coalition in 1864, retook Massina and ruled it from Bandiagara, largely independent of his cousin Ahmadu, who ruled the rest of the empire from Ségou and spent the next two decades fighting rebellious brothers and Bamana war chiefs. Al-Bakkay died in 1865. The divided empire lasted until the French took Ségou in 1890, Nioro in 1891 and Bandiagara in 1893.
    facts:
      - [Defeat before Timbuktu, "1863"]
      - [Siege of Hamdullahi, "June 1863 – February 1864"]
      - [Umar leaves Hamdullahi, "6 February 1864"]
      - [Death of Umar, "12 or 14 February 1864"]
