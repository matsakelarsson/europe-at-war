  - title: Cayawal and Hamdullahi
    date: April – June 1862
    when: "1862-05-15"
    borders: "1862-05-17"
    countries: [ml]
    body:
      - The war with Massina divided Muslim opinion. Hamdullahi was a Muslim caliphate, and Umar justified the attack in a treatise, the Bayan ma waqa’a, arguing that by protecting the king of Ségou and his idols Amadu III had sided with unbelief. Ahmad al-Bakkay, head of the Kunta scholars of Timbuktu and of the Qadiriyya order to which Massina belonged, answered that this was an unlawful war of Muslims on Muslims. Umar left Ahmadu in Ségou and set out on 13 April 1862 with about 30,000 men, most of them armed with guns.
      - The armies met at Cayawal on 10 May. After a first day of heavy losses on both sides and four days of skirmishing, a defector from Hamdullahi’s court told Umar how the Massina army was placed, and on 15 May his dismounted cavalry and riflemen broke it. Massina’s losses are given as about 30,000 dead and Umar’s as about 10,000, the bloodiest battle of his jihad. Umar entered Hamdullahi on 16 or 17 May. Amadu III, wounded, fled by river, was caught and was executed, on 16 May or at the end of June according to different sources. Djenné submitted, and Umar settled in Hamdullahi, with his nephew Tidiani and his son Muhammad Makki running its government.
    facts:
      - [Umar leaves Ségou, "13 April 1862"]
      - [Battle of Cayawal, "10–15 May 1862"]
      - [Hamdullahi taken, "16 or 17 May 1862"]
      - [Losses at Cayawal, "about 30,000 Massina and 10,000 Umarian dead (contemporary estimates)"]
