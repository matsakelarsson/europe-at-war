notes:
  - "Umar’s followers were mostly Fulbe (Toucouleur, from the French name for the Fulbe of Futa Toro) and Soninke, with Moors, Malinke and others, and many former slaves; his core troops were the talibés, his disciples, and from 1860 he also had cannon taken from the French. The name Toucouleur Empire comes from French writers; historians also speak of the Umarian state or the Tijani caliphate."
  - "The main sources are Umar’s own writings and those of his followers, French military reports and the traditions of the peoples he conquered, which judge him very differently. The figures for armies and losses come from these sources and are rough; the battles in Massina in 1862 are said to have cost more than 70,000 lives. Sources also differ on dates: Ségou is sometimes said to have fallen in 1860 rather than on 10 March 1861, Hamdullahi on 16 March rather than 16–17 May 1862, and Umar’s death is given as 12 or 14 February 1864."
