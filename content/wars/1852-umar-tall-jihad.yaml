  - title: Médine and the French
    date: 1855–1860
    when: "1857-04-20"
    borders: "1857-07-18"
    countries: [ml, sn, mr]
    body:
      - Louis Faidherbe, governor of the French colony of Senegal from 1854, set out to make France the master of the Senegal river trade. In September 1855 he built a fort at Médine, the capital of the Khasso kingdom of Dembaya just below the Félou falls, and took the Khasso kings under French protection. For Umar, who called on the Muslims of Futa Toro to leave lands under French control, the fort barred the way back to his homeland. In April 1857 he brought his army, about 20,000 men by French count, against it.
      - The fort was held by its commander, Paul Holle, with seven French soldiers, 22 Senegalese tirailleurs and 34 sailors from Saint-Louis, and about 6,000 people of the village and their king, Sambala, sheltered inside its walls. The first assault, on 20 April, was beaten off with heavy losses, about 300 dead by French count; a landing on a rock in the river on 11 May and a second assault on the night of 4–5 June also failed. The besiegers settled down to starve the fort. Low water kept Faidherbe’s gunboat, the Basilic, from coming up the river until the rains raised it, and he reached Médine with about 500 men on 18 July 1857 and drove the besiegers off.
      - Umar never again attacked a French fort. In 1858–1859 he toured Bundu and Futa Toro, preaching emigration away from the French, and led thousands of families east to settle in Kaarta and to fill his army; French columns destroyed Umarian posts on the river, among them Guémou in 1859. In 1860 the two sides came to an agreement by which the French kept the Senegal valley and their forts, and Umar was left free to turn east against Ségou.
    facts:
      - [Fort at Médine built, "September 1855"]
      - [Siege of Médine, "20 April – 18 July 1857"]
      - [Garrison, "about 65 soldiers and sailors, with about 6,000 villagers"]
      - [Agreement with Faidherbe, "1860"]
