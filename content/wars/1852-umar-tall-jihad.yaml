steps:
  - title: Dinguiraye and the call to holy war
    date: 1852–1854
    when: "1852-09"
    borders: "1854-11-30"
    countries: [gn, ml, sn]
    body:
      - Umar Tall was born about 1794 at Halwar in Futa Toro, the Fulbe Muslim state on the middle Senegal, into a family of Torodbe scholars. On the pilgrimage to Mecca (1828–1830) he was made a khalifa of the Tijaniyya Sufi order for the western Sudan. He spent six years in Sokoto, where he married a daughter of the caliph Muhammad Bello, and in 1840 settled at Jegunko in Futa Jallon, where disciples from Futa Toro and beyond gathered around him. His message drew scholars, traders, poor herders and slaves who hoped for freedom; the guns his community bought in Sierra Leone with the profits of trade worried the rulers of Futa Jallon, and about 1849–1851 he moved to Dinguiraye in the small Jallonke kingdom of Tamba.
      - The king of Tamba, Yambi, alarmed by the arms being stored at Dinguiraye, attacked it and was defeated in September 1852. Umar then proclaimed a holy war against unbelievers and Muslims he judged to have strayed, and took Tamba. In a rapid campaign between May and November 1854 his army conquered the gold country of Bambuk, and the rulers of the small Khasso kingdoms on the upper Senegal submitted. Umar built a fortress (tata) at Koniakary, whose commander governed the region. Captives taken in these wars were shared among his followers or sold for horses and guns.
    facts:
      - [Tamba attacks Dinguiraye, "September 1852"]
      - [Conquest of Bambuk, "May–November 1854"]
