  - title: The fall of Sevastopol
    date: 1855
    when: "1855-02"
    borders: "1855-09-09"
    countries: [ua, ru, gb, fr, tr, it]
    body:
      - Through the winter both armies suffered terribly from cold, hunger and disease. Reports by the war correspondent William Howard Russell turned British opinion against the government, which fell in January 1855, and Florence Nightingale led nurses at the army hospital at Scutari. Nicholas I died in March and was succeeded by Alexander II. The Kingdom of Sardinia joined the allies and sent some 18,000 men. Ottoman troops beat off a Russian attack on Yevpatoria in February, and in May an allied expedition took Kerch and opened the Sea of Azov.
      - An allied assault on the Malakhov and the Redan on 18 June failed with heavy losses. Admiral Nakhimov was mortally wounded in July. A Russian attempt to break the siege was beaten by French and Sardinian troops on the Chernaya on 16 August. After a massive bombardment, French troops under General Patrice de MacMahon stormed the Malakhov on 8 September, while the British attack on the Redan failed. That night the Russians blew up their forts, sank their remaining ships and withdrew across a pontoon bridge to the north side of the harbour.
    facts:
      - [Siege of Sevastopol, "October 1854 – September 1855"]
      - [Battle of the Chernaya, "16 August 1855, allied victory"]
      - [Malakhov stormed, "8 September 1855"]
    markers:
      - kind: battle
        side: tr
        name: Battle of Yevpatoria
        date: 17 February 1855
        text: Omar Pasha’s Ottoman troops held the town against a Russian assault.
        lonlat: [33.381, 45.212]
      - kind: taken
        side: al
        name: Kerch
        date: May 1855
        text: An allied landing took the town and opened the Sea of Azov to raids on Russian supply ports.
        lonlat: [36.471, 45.362]
      - kind: battle
        side: al
        name: Battle of the Chernaya
        date: 16 August 1855
        text: French and Sardinian troops beat back a Russian attack across the river, the last Russian attempt to relieve the city.
        lonlat: [33.647, 44.557]
      - kind: taken
        side: al
        name: Malakhov
        date: 8 September 1855
        text: The French took the key bastion by surprise at midday, making the south side of Sevastopol untenable. The Russians evacuated it that night.
        lonlat: [33.549, 44.604]
        lp: l
    arrows:
      - side: ru
        label: Gorchakov
        via: [[33.78, 44.63], [33.72, 44.58], [33.66, 44.56]]
      - side: al
        label: Kerch expedition
        via: [[33.6, 44.45], [35.2, 44.6], [36.42, 45.3]]
  - title: Kars and the Treaty of Paris
    date: 1855–1856
    when: "1855-06"
    borders: "1856-03-30"
    countries: [tr, ge, md, ua, ru, gb, fr]
    body:
      - In June 1855 General Nikolay Muravyov besieged Kars, the main Ottoman fortress in eastern Anatolia, defended by Ottoman troops under the British general William Fenwick Williams. A Russian assault on 29 September was beaten off with heavy losses. Omar Pasha landed an army in Abkhazia to relieve the city by way of Mingrelia but advanced too slowly, and on 28 November the starving garrison surrendered. Facing an Austrian threat to join the allies, Alexander II agreed to make peace.
      - By the Treaty of Paris, signed on 30 March 1856, the Black Sea was made neutral and closed to warships, with no naval arsenals on its shores. Russia returned Kars and gave the southern part of Bessarabia, at the mouths of the Danube, to Moldavia, and the allies returned Sevastopol. Moldavia and Wallachia were placed under the guarantee of all the powers instead of Russia’s protection. Hundreds of thousands of soldiers had died, most of them from disease. Defeat helped push Alexander II towards reforms, above all the abolition of serfdom in 1861.
    facts:
      - [Kars surrenders, "28 November 1855"]
      - [Treaty of Paris, "30 March 1856"]
      - [Black Sea, "neutralised; closed to warships until 1871"]
    markers:
      - kind: siege
        side: ru
        name: Siege of Kars
        date: June – 28 November 1855
        text: The garrison repulsed a seven-hour assault in September but was starved into surrender. Muravyov took the name Muravyov-Karsky.
        lonlat: [43.1, 40.617]
      - kind: event
        side: tr
        name: Sukhum
        date: autumn 1855
        text: Omar Pasha landed here with a large Ottoman army meant to relieve Kars, which never got near the city.
        lonlat: [41.019, 43.004]
      - kind: treaty
        name: Southern Bessarabia
        date: 30 March 1856
        text: Under the Treaty of Paris, Russia gave this strip along the lower Danube to Moldavia, which cut Russia off from the river.
        lonlat: [28.613, 45.667]
    arrows:
      - side: ru
