        name: Bucharest
        date: July 1853
        text: Russian troops under Prince Mikhail Gorchakov occupied the Wallachian capital.
        lonlat: [26.104, 44.432]
        lp: l
      - kind: naval
        side: ru
        name: Battle of Sinop
        date: 30 November 1853
        text: Nakhimov’s ships sank or burned every Ottoman frigate and corvette in the harbour; only one steamer escaped.
        lonlat: [35.15, 42.02]
      - kind: battle
        side: ru
        name: Akhaltsikhe
        date: 26 November 1853
        text: A Russian force beat an Ottoman army advancing on the fortress from the south-west.
        lonlat: [42.993, 41.643]
      - kind: battle
        side: ru
        name: Battle of Başgedikler
        date: 1 December 1853
        text: About 10,000 Russians routed an Ottoman army more than three times their number near Kars.
        lonlat: [43.559, 40.652]
