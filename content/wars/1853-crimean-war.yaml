  - title: The Danube and Silistra
    date: March – August 1854
    when: "1854-03"
    borders: "1854-08-01"
    countries: [bg, ro, tr, ru, gb, fr]
    body:
      - In March 1854 Russian troops crossed the lower Danube into Dobruja, and in May an army of up to 90,000 under Field Marshal Ivan Paskevich laid siege to Silistra. The fortress was held by 12,000–18,000 Ottoman and Egyptian troops, helped by a few British officers, and it held out for six weeks. Meanwhile British and French troops landed at Varna, and Austria, alarmed by a Russian advance towards the Balkans, massed troops on its borders and demanded that Russia leave the principalities.
      - On 23 June, hours before a planned assault, the Russians lifted the siege on Nicholas I’s orders and withdrew north of the Danube. Ottoman troops beat a Russian force on the islands at Giurgiu in July. By August the Russians had left Moldavia and Wallachia, which Austrian troops occupied until 1857. Cholera killed thousands of British and French soldiers around Varna and in a French expedition into Dobruja. With the Danube secure, the allies decided to attack Sevastopol, the base of Russia’s Black Sea Fleet.
    facts:
      - [Siege of Silistra, "11 May – 23 June 1854, Ottoman victory"]
      - [Russian withdrawal from the principalities, "July – August 1854"]
      - [Allied base at Varna, "from May 1854"]
    markers:
      - kind: siege
        side: tr
        name: Siege of Silistra
        date: 11 May – 23 June 1854
        text: The garrison beat off attacks for six weeks. Paskevich was injured, and the siege was lifted before the final assault.
        lonlat: [27.261, 44.117]
      - kind: battle
        side: tr
        name: Battle of Giurgiu
        date: 3–8 July 1854
        text: Ottoman troops crossed to the Danube islands and drove off the Russians, who were already withdrawing from Wallachia.
        lonlat: [25.97, 43.9]
      - kind: event
        side: al
        name: Varna
        date: May – August 1854
        text: The British and French armies gathered here. Cholera swept through their camps in the summer heat.
        lonlat: [27.917, 43.208]
    arrows:
      - side: ru
        label: Russian army
        via: [[27.96, 45.25], [28.2, 44.9], [27.8, 44.4], [27.32, 44.14]]
      - side: al
        label: British and French
        via: [[29.0, 41.2], [28.4, 42.2], [27.98, 43.15]]
  - title: Bomarsund and Sveaborg in the Baltic
    date: 1854–1855
    when: "1854-05"
    borders: "1855-08-11"
    countries: [fi, ru, gb, fr]
    body:
      - In 1854 a large British fleet under Admiral Sir Charles Napier, joined by a French squadron, sailed into the Baltic to blockade Russia’s ports. It judged Kronstadt, the sea fortress guarding Saint Petersburg, too strong to attack. In the Gulf of Bothnia British ships burned tar, timber and shipping at Oulu and Raahe in Finland, but at Kokkola local men and soldiers drove off their boats. In August about 10,000 French troops and British marines landed in the Åland Islands and besieged the unfinished fortress of Bomarsund, which surrendered on 16 August and was blown up.
      - The allies returned in 1855 under Admiral Richard Dundas and Rear-Admiral Charles Pénaud. Near Kronstadt several British ships were damaged by Russian sea mines, among the first used in war. On 9–11 August 1855 the fleet bombarded Sveaborg, the island fortress off Helsinki, for two days with mortars and rockets, causing fires and explosions, but made no attempt to land. Sweden, invited to join the allies, stayed neutral. After the war a convention attached to the Treaty of Paris forbade fortifications on Åland, and the islands remain demilitarised.
    facts:
      - [Fall of Bomarsund, "16 August 1854"]
      - [Bombardment of Sveaborg, "9–11 August 1855"]
      - [Åland demilitarised, "1856"]
    markers:
      - kind: held
        side: ru
