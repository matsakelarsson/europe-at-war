steps:
  - title: From the holy places to Sinop
    date: 1853
    when: "1853-07"
    borders: "1853-11-30"
    countries: [ro, tr, ge, ru]
    body:
      - A quarrel between Catholic and Orthodox monks over the holy places in Palestine, backed by France and Russia, grew into a crisis when Nicholas I demanded the right to protect all the Orthodox subjects of the sultan. When the Ottomans refused, Russian troops occupied Moldavia and Wallachia in July 1853, and Britain and France sent fleets to the Dardanelles. The Ottoman Empire declared war in October. Omar Pasha’s army crossed the Danube and on 4 November held off a Russian attack at Oltenița.
      - On 30 November Admiral Pavel Nakhimov’s squadron attacked an Ottoman squadron at anchor in Sinop on the Anatolian coast and destroyed it with explosive shells. Nearly 3,000 Ottomans were killed, and part of the town burned. In the Caucasus Russian forces defeated Ottoman armies at Akhaltsikhe and Başgedikler. In Britain the press called Sinop a massacre. In January 1854 the British and French fleets entered the Black Sea, and at the end of March both countries declared war on Russia.
    facts:
      - [Russian occupation of Moldavia and Wallachia, "July 1853 – August 1854"]
      - [Battle of Sinop, "30 November 1853, Russian victory"]
      - [Britain and France declare war, "27–28 March 1854"]
    markers:
      - kind: battle
        side: tr
        name: Battle of Oltenița
        date: 4 November 1853
        text: The first battle of the war. A Russian attack on Omar Pasha’s bridgehead was called off with heavy losses.
        lonlat: [26.637, 44.087]
      - kind: event
