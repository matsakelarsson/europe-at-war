        via: [[43.85, 40.79], [43.45, 40.72], [43.15, 40.64]]
      - side: tr
        label: Omar Pasha
        via: [[41.1, 42.95], [41.6, 42.6], [42.0, 42.35]]
    areas:
      - style: lost
        side: ru
        label: Southern Bessarabia, to Moldavia in this peace
        atoms: [MD-CA, MD-TA, UA-51~ro1938~1856]
