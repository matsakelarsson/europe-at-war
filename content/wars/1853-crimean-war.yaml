        text: Russia’s main Black Sea naval base. Allied guns opened the first bombardment on 17 October.
        lonlat: [33.523, 44.605]
        lp: l
      - kind: battle
        name: Battle of Balaclava
        date: 25 October 1854
        text: The Russians kept the redoubts they had taken but failed to reach the British base. The Charge of the Light Brigade took place here.
        lonlat: [33.602, 44.535]
        lp: b
      - kind: battle
        side: al
        name: Battle of Inkerman
        date: 5 November 1854
        text: British troops held the ridge in fog against much larger Russian forces until French reinforcements came up.
        lonlat: [33.592, 44.585]
    arrows:
      - side: al
        label: Allied armies
        via: [[33.5, 45.0], [33.67, 44.85], [33.76, 44.65], [33.63, 44.53]]
      - side: ru
        label: Liprandi
