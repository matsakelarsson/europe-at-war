  - title: The Alma, Balaclava and Inkerman
    date: September – November 1854
    when: "1854-09-14"
    borders: "1854-11-05"
    countries: [ua, ru, gb, fr, tr]
    body:
      - On 14 September 1854 more than 50,000 British, French and Ottoman troops landed at Kalamita Bay, north of Sevastopol. Six days later they drove Prince Aleksandr Menshikov’s army from the heights above the Alma, with some 9,000 killed and wounded on both sides. Instead of attacking at once, the allies marched round to the south of the city, the British taking Balaklava as their base and the French the bays near Kamiesch. The Russians sank ships across the harbour mouth, and sailors, soldiers and townspeople guided by the engineer Eduard Totleben built earthworks around the city. The siege began in October.
      - On 25 October Russian forces attacked towards Balaklava. They took redoubts held by Ottoman troops, but the 93rd Highlanders, the “thin red line”, and the Heavy Brigade stopped their cavalry. A misunderstood order then sent the British Light Brigade charging down a valley into Russian guns, with heavy losses. On 5 November, in thick fog, Russian columns attacked the British on the heights at Inkerman. The fighting broke up into a “soldiers’ battle” until French troops arrived, and the Russians lost some 11,000 men. Then winter came, and a storm on 14 November sank supply ships at Balaklava.
    facts:
      - [Allied landing, "14 September 1854"]
      - [Battle of the Alma, "20 September 1854, allied victory"]
      - [Battle of Inkerman, "5 November 1854, allied victory"]
    markers:
      - kind: event
        side: al
        name: Kalamita Bay
        date: 14 September 1854
        text: The allied armies landed unopposed on the beaches south of Yevpatoria.
        lonlat: [33.467, 45.05]
      - kind: battle
        side: al
        name: Battle of the Alma
        date: 20 September 1854
        text: French troops climbed cliffs on the Russian left and British infantry stormed the heights, forcing Menshikov to retreat.
        lonlat: [33.669, 44.831]
      - kind: siege
