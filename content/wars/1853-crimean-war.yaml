id: crimean-war
name: Crimean War
start: "1853-10"
end: "1856-03-30"
tier: A
summary: A war in which the Ottoman Empire, Britain, France and later Sardinia fought the Russian Empire, fearing Russian power over the declining Ottoman state. Fought on the Danube, in the Caucasus, in the Baltic and above all in Crimea, where Sevastopol fell after a siege of nearly a year, it ended with the Treaty of Paris in 1856, which barred warships from the Black Sea.
countries: [ua, ru, tr, ro, bg, ge, fi, md, gb, fr, it]
sides:
  - id: ru
    name: Russian Empire
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
  - id: tr
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
  - id: al
    name: Britain, France and Sardinia
    polities: [united-kingdom, france, savoy]
    ink: navy
    moves: British and French moves
    success: British and French success
notes:
  - Dates are New Style (Gregorian). Russia used the Julian calendar, then 12 days behind, so Russian sources date the Battle of Sinop to 18 November 1853 and the fall of the Malakhov to 27 August 1855.
  - Numbers of dead are estimates. Most of the soldiers who died were killed by cholera, dysentery, typhus and the cold rather than in battle.
  - Places in Crimea are given their usual English names of the time. Crimea is part of Ukraine; Sevastopol, Balaklava and Yevpatoria were then Russian.
