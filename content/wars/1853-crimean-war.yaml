        text: The allied admirals found the forts and minefields guarding Saint Petersburg too strong to attack.
        lonlat: [29.775, 59.991]
      - kind: siege
        side: al
        name: Bomarsund
        date: 8–16 August 1854
        text: French troops and British marines landed and took the towers one by one. The garrison of about 2,000 surrendered.
        lonlat: [20.238, 60.212]
      - kind: naval
