id: small-swords-uprising
name: Small Swords Society uprising
start: "1853-05"
end: "1855-02-17"
tier: C
summary: "Risings of the Small Swords Society, a branch of the Heaven and Earth Society (Tiandihui) secret societies, in Fujian and Shanghai during the Taiping Rebellion. In May 1853 the society took Xiamen (Amoy) and nearby towns, holding Xiamen until Qing forces retook it in November 1853. On 7 September 1853 its members in Shanghai, led by Liu Lichuan and mostly from Guangdong and Fujian, seized the walled Chinese city, killed the magistrate and drove out the intendant Wu Jianzhang. They proclaimed a restored Ming state and wrote to the Taiping, who never sent help. Qing troops besieged the city for seventeen months, while thousands of refugees crowded into the foreign settlements outside its walls. The British and Americans at first stayed neutral, and in April 1854 their volunteers fought Qing troops who threatened the settlements at the Battle of Muddy Flat; the French joined the siege in December 1854 and January 1855, and the rebels abandoned the city on the night of 17 February 1855. Liu Lichuan was killed, and the Qing executed many of those who stayed behind."
