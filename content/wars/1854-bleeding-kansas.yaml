steps:
  - title: Popular sovereignty and two governments
    date: May 1854 – December 1855
    when: "1854-05-30"
    borders: "1855-03-30"
    countries: [us]
    body:
      - "The Kansas–Nebraska Act, written by Senator Stephen A. Douglas and signed by President Franklin Pierce on 30 May 1854, opened Kansas and Nebraska territories to settlement and repealed the Missouri Compromise of 1820, which had banned slavery north of 36°30′. Whether Kansas allowed slavery would now be decided by its settlers. The land was not empty: it had been set aside in the 1820s and 1830s for the Shawnee, Lenape (Delaware), Potawatomi, Kickapoo and other nations removed from the East, and the Kaw (Kansa) and Osage lived there too. Treaties of 1854 and after took most of their reserves for the newcomers."
      - The territory became a contest between North and South. In the North the New England Emigrant Aid Company sent settlers who founded Lawrence in 1854 and Topeka soon after; across the border, Missourians urged on by Senator David Rice Atchison founded proslavery towns such as Atchison and Leavenworth and vowed that Kansas would be a slave state. Slaveholders in western Missouri, along the Missouri River, feared being surrounded by free states on three sides.
      - "On 30 March 1855, when a territorial legislature was elected, several thousand armed Missourians crossed the border to vote; a congressional committee later found that most of the ballots were cast illegally and that the actual settlers would have elected a Free-State legislature. Governor Andrew Reeder let most of the results stand. The new legislature met at Pawnee and then at the Shawnee Mission, expelled its few Free-State members, adopted Missouri’s slave code and made it a crime even to deny the right to hold slaves. The Free-Staters called it the “Bogus Legislature” and set up a government of their own: a convention at Topeka wrote a constitution banning slavery, approved on 15 December 1855, and in a separate vote Free-Staters also chose to bar free Black people from the state."
      - In November 1855 a proslavery settler killed a Free-Stater, Charles Dow, near Lawrence. When Free-Staters freed a man arrested by the proslavery sheriff Samuel Jones, between about 700 and 1,500 men, most of them Missourians, gathered on the Wakarusa River to attack Lawrence, which fortified itself. In this “Wakarusa War” one Free-Stater, Thomas Barber, was killed before Governor Wilson Shannon arranged a truce in December.
    facts:
      - [Kansas–Nebraska Act, "30 May 1854"]
      - [Territorial legislature elected, "30 March 1855"]
      - [Topeka Constitution approved, "15 December 1855, 1,731 to 46"]
