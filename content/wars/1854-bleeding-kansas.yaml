    moves: Federal moves
    success: Federal success
notes:
  - "“Border Ruffians” was the Free-State name for the proslavery Missourians, which many of them adopted with pride; Free-State fighters were called “Jayhawkers” by their enemies. The territorial legislature elected in 1855 was called the “Bogus Legislature” by its opponents."
  - "The count of about 56 political killings between 1854 and 1861 comes from Dale Watts’s study of 1995, used by the Kansas Historical Society; contemporary claims, and some later writers, put the number near 200."
  - Most Free-Staters wanted Kansas for free white farmers rather than an end to slavery everywhere. The Topeka movement voted to bar free Black people from the state, while abolitionists such as John Brown and James Montgomery fought slavery itself.
