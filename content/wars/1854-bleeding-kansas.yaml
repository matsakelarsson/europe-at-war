  - title: The sack of Lawrence and Pottawatomie
    date: May – September 1856
    when: "1856-05-21"
    borders: "1856-05-21"
    countries: [us]
    body:
      - In the spring of 1856 a grand jury at Lecompton indicted the Free-State leaders for treason and named the Lawrence newspapers and the fortified Free State Hotel as nuisances. On 21 May Sheriff Jones entered Lawrence with several hundred proslavery men, many of them Missourians; they wrecked the presses of the Herald of Freedom and the Kansas Free State, shelled and burned the hotel and burned Charles Robinson’s house. The only death was a proslavery man killed by falling masonry. In Washington the next day, Representative Preston Brooks of South Carolina beat Senator Charles Sumner unconscious with a cane at his desk in the Senate for a speech on “The Crime Against Kansas”.
      - On the night of 24–25 May the abolitionist John Brown, four of his sons and three other men took five proslavery settlers, James Doyle and two of his sons, Allen Wilkinson and William Sherman, from their cabins on Pottawatomie Creek and killed them with broadswords. The killings set off a summer of guerrilla war. At Black Jack on 2 June Brown’s company captured the Missouri militia leader Henry Clay Pate and his men; Free-State bands attacked the proslavery strongholds of Franklin, Fort Saunders and Fort Titus in August, and James H. Lane brought a Free-State “Army of the North” overland through Iowa and Nebraska because Missourians had closed the Missouri River to Northern emigrants.
      - On 30 August about 250–400 proslavery men under John W. Reid attacked Osawatomie. They killed Brown’s son Frederick on the road, drove off Brown’s small force after a fight at the river and burned the town. On 4 July federal troops under Colonel Edwin V. Sumner had already dispersed the Free-State legislature at Topeka on the orders of the acting governor. The new governor, John W. Geary, arrived in September, used federal troops against armed bands of both sides and sent the Missourians home; by the end of 1856 the worst of the fighting was over.
    facts:
