  - title: Lecompton, Marais des Cygnes and statehood
    date: 1857 – January 1861
    when: "1857-11-07"
    borders: "1861-01-29"
    countries: [us]
    body:
      - "In 1857 a proslavery convention at Lecompton, elected after a Free-State boycott, wrote a constitution that protected slavery. It was put to the voters on 21 December 1857 in a form that allowed them to reject only further imports of enslaved people, not slavery already in Kansas, and Free-Staters stayed away. By then they had won the territorial legislature in October 1857, after Governor Robert J. Walker threw out thousands of fraudulent proslavery votes, and the new legislature called its own vote on 4 January 1858, in which the constitution was rejected by about 10,000 votes to fewer than 200. President James Buchanan still asked Congress to admit Kansas under it. Douglas broke with the president, the Democratic Party split, and Kansans rejected the constitution once more on 2 August 1858, by 11,812 to 1,926."
      - Violence went on along the Missouri border. On 19 May 1858 Charles Hamilton and about thirty proslavery men seized eleven Free-State men near Trading Post, lined them up in a ravine on the Marais des Cygnes and shot them; five were killed and five wounded. In south-eastern Kansas James Montgomery’s Free-State “Jayhawkers” drove out proslavery settlers and raided around Fort Scott. In December 1858 John Brown led a raid into Missouri that freed eleven enslaved people and killed a slaveholder, David Cruise, and then took the freed people more than 1,600 km to Detroit and across to Canada.
      - In July 1859 a convention at Wyandotte wrote a constitution that banned slavery, and voters approved it in October by 10,421 to 5,530. The Senate, where Southern members could block it, did not act until senators from the seceding states had left. Kansas was admitted as a free state on 29 January 1861, with its western boundary drawn at about 102° W; the land beyond, to the Rockies, became Colorado Territory a month later. Ten weeks after Kansas’s admission the Civil War began, and the border war between Kansas and Missouri merged into it.
    facts:
      - [Lecompton Constitution rejected, "4 January 1858 and 2 August 1858"]
      - [Marais des Cygnes, "19 May 1858, five killed and five wounded"]
      - [Wyandotte Constitution approved, "4 October 1859"]
      - [Kansas admitted as a free state, "29 January 1861"]
