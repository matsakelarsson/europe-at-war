id: bleeding-kansas
name: Bleeding Kansas
start: "1854-05-30"
end: "1861-01-29"
tier: B
summary: "The armed struggle over whether Kansas Territory would enter the Union as a slave state or a free state. The Kansas–Nebraska Act of 1854 repealed the Missouri Compromise line and left the question to the territory’s settlers (“popular sovereignty”), and both sides rushed in. Thousands of Missourians crossed the border to vote in the territorial elections of 1854 and 1855, and the proslavery legislature they elected adopted Missouri’s slave code; antislavery settlers, many sent by the New England Emigrant Aid Company, set up a rival Free-State government at Topeka. Rival governments, constitutions and militias led to raids, ambushes and killings, above all in 1856: the sack of Lawrence, John Brown’s killing of five proslavery men at Pottawatomie Creek, and the fights at Black Jack and Osawatomie. Federal troops and a new governor restored a fragile peace in late 1856, Kansans rejected the proslavery Lecompton Constitution in 1858, and Kansas was admitted as a free state on 29 January 1861. About 56 people were killed in political violence, and the struggle split the Democratic Party and helped bring on the Civil War."
countries: [us]
sides:
  - id: fs
    name: Free-State forces and antislavery settlers
    polities: [free-state-forces]
    ink: green
    moves: Free-State moves
    success: Free-State success
  - id: ps
    name: Proslavery forces from Kansas and Missouri (the “Border Ruffians”)
    polities: [proslavery-forces]
    ink: red
    moves: Proslavery moves
    success: Proslavery success
  - id: us
    name: United States (territorial governors and federal troops)
    polities: [united-states]
