steps:
  - title: The plan of 1854
    date: "1854"
    when: "1854-12-16"
    borders: "1854-12-16"
    countries: [sn, mr]
    body:
      - "In 1854 France held the island town of Saint-Louis at the mouth of the Senegal river, the island of Gorée off Cape Verde, and a few trading posts up the river and on the Casamance. Saint-Louis lived by the river trade, above all in gum arabic gathered in the lands of the Moors north of the river, and its merchants paid customs to the African states along it, Waalo, the emirates of Trarza and Brakna and Futa Toro, for the right to trade. The Trarza also taxed the goods that came down to Saint-Louis."
      - "The Bordeaux shipping firm Maurel et Prom, the largest trading house in Saint-Louis, petitioned Paris to end African control of the gum trade, and in 1854 the ministry sent Governor Auguste Protet a detailed plan for forts along the river, the Plan of 1854. Protet built a fort at Podor, but Louis Faidherbe, an engineer officer in Senegal since 1852, complained that he was moving too slowly, and on 16 December 1854 Faidherbe was made governor himself. He held the post, with an interval in 1861–1863, until July 1865."
    facts:
      - [Plan of 1854, "ministerial orders to Governor Protet"]
      - [Faidherbe governor, "16 December 1854 – July 1865 (except 1861–1863)"]
