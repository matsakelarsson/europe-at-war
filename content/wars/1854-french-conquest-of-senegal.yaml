  - title: Cayor and Futa Toro
    date: 1861–1865
    when: "1862-07-29"
    borders: "1862-07-29"
    countries: [sn, mr]
    body:
      - "France wanted a telegraph and a road across Cayor, the Wolof kingdom between Saint-Louis and Dakar, and backed Madiodio as damel against the young prince Lat Dior, who drove Madiodio out in 1861. French columns restored Madiodio, who ceded border provinces to France; Lat Dior destroyed a French column at Ngolgol in December 1863 but was beaten at Loro in January 1864 and went into exile, and in 1865 France annexed Cayor. South of it Maba Diakhou Bâ’s jihad swept through Saloum, and in 1862 Maba failed to take the French post at Kaolack."
      - "In 1862 Futa Toro rose against France under Alfa Amadou Thierno Demba, whom Umar Tall had named to lead it in war. Governor Jauréguiberry’s column beat Futa Toro’s forces at Mbirboyan on 29 July and burned their towns, among them Oréfondé, the capital, and beat the almami’s army at Loumbel on 22 September. In January 1863 1,600 men went upriver by boat along the Doué; they were beaten at Touldégal on 17 January but marched across Futa Toro to Matam, fought their way back and returned to Saint-Louis after 45 days, having fought 3 battles and 16 skirmishes and destroyed 76 villages. Futa Toro made peace at Moctar-Salam on 20 March 1863 and gave up more land to the colony."
    facts:
      - [Ngolgol, "29 December 1863, French column destroyed"]
      - [Mbirboyan, "29 July 1862"]
      - [Touldégal, "17 January 1863, French repulsed"]
      - [Peace of Moctar-Salam, "20 March 1863"]
      - [Cayor annexed, "1865"]
