  - title: The railway and the end of the kingdoms
    date: 1882–1891
    when: "1890-05-25"
    borders: "1890-05-25"
    countries: [sn, mr, ml]
    body:
      - "When Lat Dior turned against the railway, a French column drove him out at the turn of 1883 and France installed damels who accepted it. The line from Dakar to Saint-Louis, the first railway in French West Africa, was built from 1882 and opened in July 1885, and with it came French posts and groundnut traders across Cayor. After the damel Samba Laobé Fall was killed in a quarrel with French officers at Tivaouane on 6 October 1886, France abolished the title, and on 26 or 27 October Lat Dior was killed fighting French troops and his former followers at Dekhelé. Cayor was divided into provinces under French-appointed chiefs, and in 1887 the French-backed sides won the wars in Rip and Sine."
      - "By 1890 Jolof was the last independent kingdom of northern Senegambia. Its ruler, Alboury Ndiaye, made contact with Ahmadu, Umar Tall’s son and successor at Ségou, and planned to lead his people east. In May 1890 Colonel Alfred Dodds marched on Yang-Yang, installed a buurba loyal to France and declared a protectorate. Alboury crossed the Ferlo to Futa Toro, where the French shelled Kaédi in July to drive him out, and he reached Ahmadu at Nioro in October with about 40 followers. The same year France moved against the last autonomous chiefs of Futa Toro; Abdul Bokar Kan fled north and was killed by Moors on 4 August 1891. The colony had now almost its present borders, and in 1895 it became part of French West Africa."
    facts:
      - [Railway opened, "July 1885"]
      - [Lat Dior killed at Dekhelé, "26 or 27 October 1886"]
      - [Dodds at Yang-Yang, "May 1890"]
      - [Abdul Bokar Kan killed, "4 August 1891"]
      - [French West Africa, "1895"]
