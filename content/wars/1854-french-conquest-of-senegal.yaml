id: french-conquest-of-senegal
name: French conquest of Senegal
start: "1854"
end: "1891-08-04"
tier: A
summary: "The wars by which France turned its trading towns at Saint-Louis and Gorée into the colony of Senegal, between the Plan of 1854 and the fall of the last Wolof kingdom in 1890. Under Governor Louis Faidherbe (1854–1865) France conquered Waalo, pushed the Moorish emirs of Trarza and Brakna north of the Senegal river, built a chain of forts up the river and turned back Umar Tall’s jihad at Médine, took Dakar, and fought the Serer kingdoms of Sine and Saloum and the Wolof kingdom of Cayor. It created the tirailleurs sénégalais, African soldiers who did most of the fighting, many of them slaves bought from their owners. The French advance became entangled with the Muslim reform movements of the time, led by Umar Tall, Maba Diakhou Bâ and Shaikh Amadou Ba, which fought the old warrior aristocracies as well as France, and France allied with whichever side served it. Its long contest with Lat Dior of Cayor ended after the Dakar–Saint-Louis railway was built across his kingdom, with his death at Dekhelé in 1886; in 1890 a French column took Yang-Yang, the capital of Jolof, and in 1891 the last strongman of Futa Toro, Abdul Bokar Kan, was killed in flight. By then the colony had almost its present borders; in 1895 it became part of French West Africa."
