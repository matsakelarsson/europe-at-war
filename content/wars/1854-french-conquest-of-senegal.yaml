notes:
  - "This entry gives the outline of the conquest; several of its wars have entries of their own: Umar Tall’s jihad (Médine and Guémou), Maba Diakhou Bâ’s jihad, Lat Dior’s wars, the Soninke–Marabout wars in the Gambia valley and the French conquest of the Western Sudan."
  - "Most written accounts come from French officers and governors, above all Faidherbe, whose own figures are the only ones for many battles. Wolof, Serer and Fula oral traditions, kept by griots, remember several French defeats that French reports pass over, and the Serer and Wolof kingdoms long kept their kings as chiefs under French rule: the last kings of Sine and Saloum died in 1969."
