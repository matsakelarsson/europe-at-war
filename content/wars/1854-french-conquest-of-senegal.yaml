  - title: Dakar, Sine and Saloum
    date: 1857–1861
    when: "1859-05-18"
    borders: "1859-05-18"
    countries: [sn]
    body:
      - "In 1857 France occupied Dakar on the Cape Verde peninsula, opposite Gorée, and its commandant, Émile Pinet-Laprade, laid out a new port town there; a telegraph and a road soon linked Saint-Louis with Gorée and Rufisque. Faidherbe then declared the old treaties with the Serer kingdoms of Sine and Saloum void and demanded new terms: an end to the duties French traders paid the kings and the right to buy land and build in stone."
      - "Sine refused. On 13 May 1859, by Serer tradition, the heir of Sine, Sanmoon Faye, beat Pinet-Laprade’s troops at Djilass. Faidherbe came to Gorée with 200 tirailleurs and 160 marines, called up the men of Gorée, Rufisque and the Lebu of Dakar, telling them that as Frenchmen they had to fight, and marched by Joal into Sine. On 18 May at Logandème, outside Fatick, French artillery broke the Serer army; Faidherbe reported about 150 Serer killed or wounded against a handful of French wounded, and had Fatick and the villages around it burned. Paris criticised him for starting a war without authority. France went on to set up a post at Kaolack on the Saloum river, beside the Saloum capital, Kahone."
    facts:
      - [Dakar occupied, "1857"]
      - [Djilass, "13 May 1859 (Serer victory, by Serer tradition)"]
      - [Logandème, "18 May 1859"]
