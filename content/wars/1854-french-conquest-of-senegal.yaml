  - title: Waalo and the Moors
    date: 1855–1858
    when: "1855-02-25"
    borders: "1855-02-25"
    countries: [sn, mr]
    body:
      - "Waalo, the Wolof kingdom around the lower river and the Lac de Guiers, had long been squeezed between Saint-Louis and the raids of the Moors. To end the raids, its ruler, Lingeer Njembot Mbodj, married the emir of Trarza, Muhammad al-Habib, in 1833, an alliance that Saint-Louis saw as a threat; her sister Ndaté Yalla Mbodj succeeded her in 1846–1847. Trarza now put forward Ely, the emir’s son by Njembot, as brak (king) of Waalo, allied with Brakna, and in 1855 its raiders almost took Saint-Louis."
      - "Faidherbe answered at once. On 25 February 1855 his troops, French soldiers and African volunteers, defeated the Waalo and Moorish forces at Jubuldu, and France annexed Waalo, which its columns had burned and emptied. The war against Trarza and Brakna went on in raids and counter-raids on both banks for three more years, until treaties with the two emirates in 1858 made the river the limit of their power."
    facts:
      - [Jubuldu, "25 February 1855"]
      - [Waalo annexed, "1855"]
      - [Treaties with Trarza and Brakna, "1858"]
