  - title: The Mahdi and the damel
    date: 1867–1882
    when: "1875-02-11"
    borders: "1875-02-11"
    countries: [sn, mr]
    body:
      - "Maba’s death in 1867 let France extend its hold on Saloum. In 1868 cholera killed about a quarter of the people of Futa Toro, and Shaikh Amadou Ba, who saw the epidemic as a sign of the end of the world and himself as the Mahdi, gathered a following there. Allied with Lat Dior, he beat the French at Mékhé in July 1869; driven out of Futa Toro by a French column in 1870, he took over Jolof, besieged its king in Yang-Yang and forced the country to accept his rule. Lat Dior made peace with France and was recognised as damel in 1871, and when Amadou Ba invaded Cayor in July 1874, French troops and artillery came to the damel’s help and destroyed the Mahdist army at Samba Sadio on 11 February 1875."
      - "For the next years France ruled mostly through African allies. In Futa Toro Abdul Bokar Kan, master of the upper province, accepted a French protectorate in 1877 but kept his own forces. Saint-Louis and Gorée became French communes with elected councils in 1872 and Rufisque in 1880, and the groundnut trade grew in Cayor and the Serer kingdoms. In 1879 Lat Dior signed a convention for a railway from Dakar to Saint-Louis across Cayor, which he soon came to regret."
    facts:
      - [Cholera in Futa Toro, "1868"]
      - [Mékhé, "July 1869"]
      - [Samba Sadio, "11 February 1875"]
      - [Railway convention, "1879"]
    markers:
      - kind: battle
        side: mu
