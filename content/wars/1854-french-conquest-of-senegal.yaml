  - title: The river forts
    date: 1855–1860
    when: "1857-07-18"
    borders: "1857-07-18"
    countries: [sn, ml, mr]
    body:
      - "Within months of taking office Faidherbe began a fort at Médine, below the Félou falls at the head of navigation, in September 1855, and by 1860 a chain of posts guarded the river from Saint-Louis to Médine, among them Podor, Matam and Saldé. Short of soldiers from France, he had the tirailleurs sénégalais created by a decree of 21 July 1857: African infantry who, until 1905, included slaves bought from their owners, and who became France’s main force in West Africa."
      - "The river forts brought France into conflict with Umar Tall, whose jihad was recruiting thousands of men in Futa Toro. His army besieged Médine from April 1857 until Faidherbe relieved it by river on 18 July 1857, and in October 1859 the French stormed his fort at Guémou. In 1860 an agreement left Umar the lands to the east and France the river. France incorporated the western Futa Toro province of Dimar in 1859 and annexed Damga, around Matam, in 1860, and divided the rest of Futa Toro into separate states."
    facts:
      - [Médine fort begun, "September 1855"]
      - [Tirailleurs sénégalais created, "21 July 1857"]
      - [Siege of Médine relieved, "18 July 1857"]
      - [Agreement with Umar Tall, "1860"]
