id: miao-rebellion-1854
name: Miao rebellion (1854–1873)
start: "1854-03"
end: "1873"
tier: C
summary: "A long series of risings in Guizhou, also called the Qian rebellion after the province’s short name, in which Miao and other non-Han peoples, as well as Han and Hui rebels and religious sects, fought the Qing. Poverty, competition for land with Han settlers, corrupt officials and new taxes for the war against the Taiping lay behind it, and the Qing had withdrawn troops from the province. A rising of Buyi farmers under Yang Yuanbao at Dushan in March 1854 was quickly put down, but in March 1855 Zhang Xiumei led the Miao of Taigong in south-eastern Guizhou in revolt, and rebellion spread across much of the province. Rebel bands, some of them allied with Taiping forces passing through, took many towns and threatened the capital Guiyang. After the defeat of the Taiping, Hunan armies under Xi Baotian were sent in during the late 1860s and reconquered the province district by district; Zhang Xiumei was captured in 1872 and executed, and the last resistance ended in 1873. Large parts of Guizhou were left depopulated, and many Miao (Hmong) moved south into what are now Vietnam and Laos."
