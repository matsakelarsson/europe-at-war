id: red-turban-rebellion-1854
name: Red Turban rebellion in Guangdong
start: "1854-06"
end: "1856"
tier: C
summary: "A rising of the Heaven and Earth Society (Tiandihui) lodges of Guangdong, whose fighters wore red headbands, inspired by the Taiping capture of Nanjing. Hard times, heavy taxes for the war against the Taiping and floods drove the lodges to revolt in the summer of 1854. He Liu took Dongguan, Chen Kai took Foshan on 4 July 1854, and Li Wenmao and others joined him; by the autumn Red Turban armies held much of the Pearl River delta and besieged Guangzhou. The provincial capital held out, defended by militia raised by the gentry and with the British navy guarding the river. In 1855 the governor-general Ye Mingchen drove the rebels out of the delta and carried out mass executions at the Guangzhou execution ground; estimates of those put to death in the province range from more than 100,000, the figure Ye himself gave, to as many as a million. Many Red Turbans marched north to join the Taiping, while Chen Kai and Li Wenmao went west into Guangxi, took Xunzhou (Guiping) in 1855 and founded the Dacheng kingdom there, which held out until 1861."
