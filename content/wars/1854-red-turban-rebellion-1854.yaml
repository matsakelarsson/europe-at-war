notes:
  - Not to be confused with the Red Turban rebellion of the 1350s against the Yuan dynasty.
  - Ye Mingchen’s executions made him notorious; two years later, in the Second Opium War, the British captured him at Guangzhou and sent him to Calcutta, where he died.
