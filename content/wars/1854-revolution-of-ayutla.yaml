id: revolution-of-ayutla
name: Revolution of Ayutla
start: "1854-03-01"
end: "1855-08-09"
tier: C
summary: "The liberal revolt of 1854–1855 that overthrew Antonio López de Santa Anna for the last time. Recalled by the Conservatives in 1853, Santa Anna had ruled as a dictator with the title His Most Serene Highness, exiled opponents, taxed doors, windows and dogs, and sold the Mesilla valley to the United States (the Gadsden Purchase) to pay his army. On 1 March 1854 Colonel Florencio Villarreal proclaimed the Plan of Ayutla in the village of Ayutla in Guerrero, calling for Santa Anna’s removal and a congress to write a new constitution, with the backing of Juan Álvarez, the old insurgent who dominated Guerrero; on 11 March Ignacio Comonfort, former customs chief of Acapulco, issued a revised version at Acapulco. Santa Anna marched south with a large army in the spring of 1854 but failed to take Acapulco, held by Comonfort in the fort of San Diego, and his troops burned villages on their retreat. The revolt spread through Michoacán, the north under Santiago Vidaurri, and the centre, and in August 1855 Santa Anna left Mexico City and sailed into exile. Álvarez became interim president in October 1855, with Benito Juárez, Melchor Ocampo and Comonfort in his government. Their reforms, the Juárez and Lerdo laws and the Constitution of 1857, led to the Reform War."
