id: rogue-river-wars
name: Rogue River Wars
start: "1855-10-08"
end: "1856-06"
tier: C
summary: "The war of 1855–1856 in south-western Oregon between the United States Army, Oregon volunteers and miners’ militias and the peoples of the Rogue River valley and the coast, the Takelma, the Upland Takelma or Latgawa, the Shasta, the Tututni and their neighbours, whom American sources grouped as the Rogue River Indians. Gold strikes near Jacksonville from 1851 brought thousands of miners and settlers onto their land, destroying the fish runs, game and oak groves they lived on. After fighting in 1853, including the Battle of Evans Creek, the Takelma leaders Apserkahar (Joe), Toquahear (Sam) and Anachaharah (Jim) signed the Treaty of Table Rock, which left them a small reservation beside the army’s Fort Lane. On 8 October 1855 volunteers under James Lupton attacked a Takelma camp at the mouth of Little Butte Creek and killed about two dozen people, most of them women, children and old men; in reply Takelma fighters killed about 27 settlers along the Rogue from Gold Hill to Galice Creek. On 31 October and 1 November 1855 some 200 Native fighters held off more than 300 soldiers and volunteers at Hungry Hill (Grave Creek Hills). On 22 February 1856 Tututni and other coastal peoples killed about 30 people near the mouth of the Rogue, among them the Indian agent Ben Wright, and besieged the survivors. At Big Bend on 27–28 May 1856, fighters under Tecumtum (Chief John) attacked Captain Andrew Jackson Smith’s company, which had come to receive their surrender, until another army force relieved it; within weeks most bands surrendered. About 1,400 people were removed to the new Coast Reservation (Siletz) and some 325 to 400 from Table Rock to the Grand Ronde Reservation, some marched overland and some taken by sea, and many died in the first years there."
