id: santal-rebellion
name: Santal rebellion
start: "1855-06-30"
end: "1856-02"
tier: C
summary: "A rising of the Santals of the Rajmahal hills and the Damin-i-koh, in today’s Jharkhand, known to the Santals as the Hul (“rebellion”). Settled in the Damin-i-koh under East India Company rule from the 1830s, many Santals had fallen into debt to moneylenders and traders from the plains, lost land to zamindars and suffered from the police and the courts. On 30 June 1855 the brothers Sidhu and Kanhu Murmu of Bhognadih, with their brothers Chand and Bhairav, called on the Santals to drive out the outsiders, and thousands rose against moneylenders, zamindars and the Company, attacking police posts, plundering markets and cutting the roads and railway works between Bhagalpur and Rajmahal. They defeated several Company detachments in July, but were beaten at Maheshpur on 24 July. Company troops and landholders’ levies then crushed the rising, burning villages and killing many; martial law was in force from November 1855 to January 1856. Sidhu and Kanhu were captured and executed. Estimates of the number of Santals killed range from about 10,000 to more than 15,000. Afterwards the Company made the area a separate district with its own administration, the Santal Parganas, under Act XXXVII of 1855."
