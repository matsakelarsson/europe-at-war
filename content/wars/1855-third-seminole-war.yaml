id: third-seminole-war
name: Third Seminole War
start: "1855-12-20"
end: "1858-05-08"
tier: C
summary: "The last war between the United States and the Seminoles of Florida, also called the Billy Bowlegs War. After the Second Seminole War some few hundred Seminoles and Miccosukees remained in southern Florida under Holata Micco (Billy Bowlegs) and Abiaka (Sam Jones). As settlement pushed south, Florida and the federal government pressed them to leave, built a chain of forts and sent surveyors into their lands. On 20 December 1855 Bowlegs and some 30 to 40 warriors attacked an army surveying patrol under Lieutenant George Hartsuff near the Big Cypress Swamp, whose men, Seminole accounts say, had destroyed his gardens; four soldiers were killed. In the war that followed, Seminole bands raided farms and posts as far north as Tampa Bay, while regulars and Florida volunteers, using boats to reach the islands of the Everglades and the Big Cypress, burned villages and crops; one of the largest actions was at the Tillis farm near Fort Meade in June 1856. Worn down by hunger and offered cash payments, Bowlegs agreed to emigrate, and in May 1858 he left for Indian Territory with about 165 people; the army declared the war over on 8 May 1858. Abiaka and between about 100 and 300 others never left, and their descendants are the Seminole Tribe of Florida and the Miccosukee Tribe of Indians of Florida, who never signed a peace treaty with the United States."
