id: yakima-war
name: Yakima War
start: "1855-09"
end: "1858-09"
tier: C
summary: "A war of 1855–1858 in Washington and Oregon territories between the United States and the Yakama and other peoples of the Columbia Plateau, fought together with the Puget Sound War west of the Cascades. At the Walla Walla Council of May–June 1855, Governor Isaac Stevens of Washington Territory and Joel Palmer of Oregon pressed the Yakama, Nez Perce, Walla Walla, Cayuse and Umatilla to cede most of their land for reservations, and within weeks the ceded land was declared open while miners bound for a gold strike near Fort Colville crossed Yakama country. Some miners were killed, and in September 1855 Yakama men killed the Indian agent Andrew Bolon. The Yakama under Kamiakin defeated Major Granville Haller’s troops at Toppenish Creek on 6 October 1855, and Oregon volunteers seized the Walla Walla leader Peopeomoxmox during talks under a flag of truce and killed him in December. West of the mountains the Nisqually leader Leschi, who had refused the Medicine Creek treaty of 1854, led Nisqually, Puyallup, Muckleshoot and Klickitat fighters; after deaths among the settlers on the White River in October 1855 they attacked Seattle on 26 January 1856 and were driven off by the sloop-of-war USS Decatur, and Yakama and Klickitat fighters attacked the settlement at the Cascades of the Columbia in March. Leschi was later captured and hanged on 19 February 1858; a historical court in Washington exonerated him in 2004. The war flared again in 1858, when Spokane, Coeur d’Alene and Palouse fighters defeated Lieutenant Colonel Edward Steptoe at Pine Creek on 17 May. Colonel George Wright defeated them at Four Lakes and Spokane Plains on 1 and 5 September, had about 800 of their horses shot and hanged Qualchan and other men. Kamiakin went into exile in British territory, and the Senate ratified the 1855 treaties in 1859. Some peoples fought for the United States, among them the Snoqualmie under Patkanim and Nez Perce scouts with Wright."
