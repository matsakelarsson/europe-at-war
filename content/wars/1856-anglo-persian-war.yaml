id: anglo-persian-war
name: Anglo-Persian War
start: "1856-11-01"
end: "1857-04-05"
tier: B
summary: "A short war between Britain and Qajar Iran over Herat. In 1856 Naser al-Din Shah’s army besieged and took Herat, which Iran claimed as part of Khorasan and had promised in 1853 to leave alone. Britain, which wanted Herat in Afghan hands as a barrier against Russian and Persian influence near India, declared war on 1 November 1856. Instead of marching across Afghanistan it sent a force from Bombay to the Gulf, which seized Kharg Island and Bushehr, defeated an Iranian army at Khushab in February 1857 and took Mohammerah (Khorramshahr) and Ahvaz in March and April. A peace signed in Paris on 4 March 1857, before the last battles were fought, made Iran give up Herat and its claims in Afghanistan; the British left Bushehr in October 1857."
countries: [ir, af]
sides:
  - id: gb
    name: Britain and British India
    polities: [united-kingdom]
    ink: red
    moves: British moves
    success: British success
  - id: ir
    name: Qajar Iran
    polities: [persia]
    ink: green
    moves: Iranian moves
    success: Iranian success
  - id: her
    name: Herat
    polities: [herat]
