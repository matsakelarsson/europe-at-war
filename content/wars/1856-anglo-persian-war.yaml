  - title: Bushehr and Khushab
    date: December 1856 – February 1857
    when: "1856-12-10"
    borders: "1857-02-08"
    countries: [ir]
    body:
      - Rather than send an army through Afghanistan, Britain struck at Iran’s Gulf coast. A division of about 2,300 British and 3,400 Indian troops under Major-General Foster Stalker sailed from Bombay in November, occupied Kharg Island on 4 December 1856 and landed south of Bushehr the next day. The troops stormed the old Dutch fort at Reshire, and on 10 December Bushehr, Iran’s chief port, surrendered after a short bombardment. Reconnaissance showed an Iranian army gathering inland, and the British waited for a second division, which arrived with Sir James Outram as commander-in-chief at the end of January 1857.
      - On 3 February Outram marched inland with most of his force to Borazjan, where an Iranian army under Mehr Ali Khan Shoja al-Molk had its camp. The Iranians withdrew without a fight, leaving stores and ammunition. As the British marched back on the night of 7 February, Qashqai horsemen harassed them, and at dawn on 8 February the Iranian army, some 7,000 to 8,000 men, stood in line of battle near the village of Khushab. British cavalry broke one of the Iranian infantry squares and the Iranian army withdrew towards the mountains. Short of supplies, Outram returned to Bushehr through heavy rain.
    facts:
      - [Kharg Island occupied, "4 December 1856"]
      - [Bushehr taken, "10 December 1856"]
      - [Battle of Khushab, "8 February 1857, British victory"]
