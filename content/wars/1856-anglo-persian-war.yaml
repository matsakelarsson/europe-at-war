steps:
  - title: Herat falls to Iran
    date: March – November 1856
    when: "1856-10-25"
    borders: "1856-10-25"
    countries: [af, ir]
    body:
      - Under an agreement of 1853 Iran had promised not to send troops to Herat unless a foreign army threatened it. But in 1855 Dost Mohammad Khan of Kabul, now Britain’s ally, took Kandahar, and Herat, ruled by the Sadozai prince Mohammad Yusuf, looked like his next target. Relations between Tehran and the British legation had also broken down in a quarrel over the shah’s refusal to accept a Persian official, Mirza Hashem Khan, as a British protégé, and in December 1855 the British minister, Charles Murray, left Tehran.
      - In March 1856 an Iranian army of perhaps 15,000 to 20,000 men under Prince Morad Mirza Hesam al-Saltaneh took the frontier fort of Ghurian and laid siege to Herat. Mohammad Yusuf raised the British flag, without British authority, and was overthrown by his vizier Isa Khan, who handed him over to the Iranians on 28 April but then defended the city himself. After a siege of about seven months the Iranians broke in, and Isa Khan surrendered the citadel in October 1856. The shah’s name was read in the Friday sermon and struck on Herat’s coins. On 1 November the Governor-General of India, acting on orders from London, declared war on Iran.
    facts:
      - [Siege of Herat, "late March – October 1856"]
      - [British declaration of war, "1 November 1856"]
