  - title: Mohammerah and the Peace of Paris
    date: March – July 1857
    when: "1857-03-26"
    borders: "1857-04-05"
    countries: [ir, af, iq]
    body:
      - Peace talks, begun in Istanbul and moved to Paris, ended with a treaty signed on 4 March 1857, but the news took weeks to reach the Gulf. Outram meanwhile took a force of about 4,000 men up the Shatt al-Arab against Mohammerah (today’s Khorramshahr), where Prince Khanlar Mirza had perhaps 13,000 men and strong river batteries. On 26 March British steamers and sloops silenced the batteries in a three-hour bombardment, the troops landed, and the Iranian army withdrew north towards Ahvaz without a battle.
      - A small flotilla of river steamers with about 300 soldiers pushed up the Karun to Ahvaz, where the Iranian army, much larger, again retreated; the British destroyed stores and came back. On 4 April the force learned of the peace. Under the Treaty of Paris, Iran agreed to leave Herat and the rest of Afghanistan alone and to submit any future dispute with the Afghans to British mediation, while Britain dropped its demand that the shah dismiss his chief minister. Iranian troops left Herat in July 1857, handing it to Dost Mohammad’s nephew Sultan Ahmad Khan, and the British left Bushehr in October; by then most of the expedition had been shipped to India to fight the Rebellion. Dost Mohammad took Herat in 1863.
    facts:
      - [Treaty of Paris, "4 March 1857"]
      - [Mohammerah taken, "26 March 1857"]
      - [Ahvaz occupied, "1 April 1857"]
      - [Iranian troops leave Herat, "July 1857"]
    markers:
      - kind: taken
        side: gb
        name: Mohammerah
        date: 26 March 1857
        text: The forts on the Karun and the Shatt al-Arab were bombarded into silence. The town lay on the Ottoman border, which the British were careful not to cross.
        lonlat: [48.182, 30.439]
        lp: l
      - kind: taken
        side: gb
        name: Ahvaz
        date: 1 April 1857
        text: Occupied by a few hundred British troops after the Iranian army withdrew. The stores were destroyed and the force returned downriver.
        lonlat: [48.684, 31.319]
