    moves: Herati moves
    success: Herati success
notes:
  - The expedition was made up of East India Company troops from the Bombay army, British Army regiments serving in India and the Company’s Indian Navy. Many of its men and both of its senior commanders, Outram and Havelock, were sent on to fight the Indian Rebellion of 1857 a few months later.
  - Herat fell on 25 October 1856 in most British accounts; the Persian chronicles date its capture to 11 Safar 1273, about 11 October.
  - Casualty figures are uncertain. At Khushab the British reported about 700 Iranians killed against 19 of their own, while the Iranian government claimed the battle as a victory with 1,000 British casualties.
