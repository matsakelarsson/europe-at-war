id: liberian-grebo-wars
name: Wars of the Grebo and Kru against Liberia
start: "1856"
end: "1936"
tier: C
summary: "Eighty years of intermittent war on the south-eastern coast of Liberia between the Americo-Liberian settler states and the Grebo and Kru, coastal peoples who had long traded with European ships and whose men worked as sailors and dockers along the whole West African coast. The settlers, freed and freeborn African Americans sent by colonisation societies, claimed authority over the coast through treaties that the Grebo and Kru understood differently, and they fought over land, trade, customs duties and taxes. In 1856 the Grebo and Kru around Cape Palmas attacked Maryland in Liberia, the separate settler republic at Harper that had declared independence on 29 May 1854. Unable to defend itself, Maryland asked Liberia for help; President Joseph Jenkins Roberts sent militia, the joint force drove the attackers back, and after a referendum in February 1857 Maryland joined Liberia as Maryland County on 6 April 1857. The Grebo, who had hoped to form a united Grebo state, rose again in 1875 over the loss of their land: on 8 September 1875 they attacked Cape Palmas and were beaten off, the United States sent the USS Alaska to Liberia in February 1876, and on 1 March 1876 the Grebo chiefs signed a treaty acknowledging the authority of the Liberian government. When the First World War ended German shipping to Liberia and threw thousands of Kru out of work, the government’s demands for taxes set off the Kru Coast revolt: from 28 September 1915 Kru fighters besieged the port of Sinoe (Greenville) and burned its customs house, and the small Liberian Frontier Force, led by American officers and supported by the cruiser USS Chester, burned towns and drove the Kru into the forest until the rising died out in 1916. President Daniel Howard’s government sentenced 67 Kru chiefs and leaders to death, and 47 had been hanged before foreign appeals for clemency arrived, and fines, forced labour and garrisons followed. After the League of Nations inquiry of 1930 into forced labour, to which Kru witnesses had testified, the government’s crackdown led to the Sasstown war of 1931–1936, in which the Kru of Sasstown under Paramount Chief Juah Nimley held out against the Frontier Force."
