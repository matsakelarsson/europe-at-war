  - title: The fall of Dali
    date: 1868 – 1873
    when: "1872-12"
    borders: "1873-01-15"
    countries: [cn, mm, gb]
    body:
      - The siege of Kunming failed, and Cen Yuying, made governor of Yunnan, took the offensive with Ma Rulong, using artillery with the help of French advisers. In 1868 a British mission from Burma under Major Edward Sladen visited the rebel-held town of Tengyue (Momien), and in 1872 Du Wenxiu sent his adopted son Hassan through Burma to London to ask Queen Victoria for recognition. Britain declined to intervene.
      - Town after town of the west fell, and in 1872 the Qing armies surrounded Dali. At the end of December, to save the city, Du Wenxiu took poison and gave himself up; he was beheaded before he died, and his head was sent to Beijing. Despite the surrender, Qing troops massacred thousands of the city’s Hui in January 1873. Tengyue, the last stronghold, was stormed in May 1873. Many Hui fled to Burma, where their descendants are known as Panthay.
    facts:
