steps:
  - title: The Kunming massacre and the Pingnan state
    date: 1856 – 1868
    when: "1856-04"
    borders: "1856-09"
    countries: [cn]
    body:
      - Yunnan’s silver and copper mines drew Han and Hui miners, and quarrels over mines, land and trade had led to massacres of Hui in the 1840s. After fighting between Han and Hui miners in central Yunnan in 1855, officials in Kunming encouraged Han militias to attack the Hui; in the spring of 1856 thousands of Hui in and around the provincial capital were killed. Hui across the province took up arms, and Yi, Bai and other peoples joined in many places.
      - In September 1856 Du Wenxiu, a Hui scholar from Baoshan, took Dali, the main city of the west, and set up a government there. Known to his Muslim subjects as Sultan Suleiman, he called for the Manchus to be driven out and for Hui and Han to unite, appointed many Han officials and protected the local religions. In the east and south, Ma Rulong and the cleric Ma Dexin led the Hui and twice besieged Kunming, but in 1862 they made terms with the Qing and Ma Rulong became a Qing general, fighting his former allies. In 1867 Du Wenxiu sent a large army east, which took dozens of towns and besieged Kunming for more than a year.
    facts:
      - [Massacre of Hui at Kunming, "spring 1856"]
      - [Du Wenxiu takes Dali, "September 1856"]
      - [Ma Rulong goes over to the Qing, "1862"]
      - [Siege of Kunming by Du’s army, "1867–1868"]
