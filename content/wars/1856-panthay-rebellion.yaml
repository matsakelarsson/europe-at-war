id: panthay-rebellion
name: Panthay Rebellion
start: "1856-04"
end: "1873-05"
tier: B
summary: "A rising of the Hui (Chinese-speaking Muslims) of Yunnan, joined by other peoples of the province, against the Qing. After years of violence between Hui and Han miners and settlers, officials and militias massacred Hui in and around Kunming in 1856, and risings broke out across the province. In western Yunnan Du Wenxiu took Dali and founded a state he called Pingnan Guo, the “Pacified South”, with himself as its ruler, known to Muslims and foreigners as Sultan Suleiman; it governed with Hui and Han officials and held much of the west for sixteen years. In the east the rebel leader Ma Rulong went over to the Qing in 1862. Du’s armies besieged Kunming in 1867–1868 but failed, and the Qing governor Cen Yuying, with modern artillery, slowly took back the province. Dali fell in January 1873 after Du Wenxiu had poisoned himself; thousands of its people were massacred. Estimates of the dead run as high as a million."
countries: [cn, mm]
sides:
  - id: qing
    name: Qing China (with Ma Rulong from 1862)
    polities: [qing]
    ink: gold
    moves: Qing moves
    success: Qing success
  - id: pn
    name: Du Wenxiu’s Pingnan state and other Hui rebels
    polities: [pingnan-guo, hui-rebels]
    ink: green
    moves: Rebel moves
    success: Rebel success
notes:
  - “Panthay” is the Burmese name for the Chinese Muslims of Yunnan who traded with Burma; it was not used in Yunnan. Chinese historians call the rising the Du Wenxiu rebellion.
  - The war was fought along many lines at once, between Hui and Han, between rebel leaders, and with Yi, Bai and other peoples of the province on both sides. Massacres were committed by all sides. Yunnan lost a large part of its population to war, famine and the plague that spread in these years; the figures are estimates.
