  - title: The capture of Guangzhou
    date: December 1857 – January 1858
    when: "1857-12-28"
    borders: "1857-12-29"
    countries: [cn, gb, fr]
    body:
      - France joined the expedition, citing the execution of the missionary Auguste Chapdelaine in Xilin, in western Guangxi, in February 1856. Elgin, whose troops had been diverted to India, waited at Hong Kong until reinforcements arrived. In December 1857 the allies, with about 5,700 men, demanded that Ye Mingchen open the city and pay compensation. Ye did not answer, and on 28 December they bombarded Guangzhou, scaled its walls the next day and took the heights to the north. Allied losses were about 15 killed; several hundred defenders and townspeople were killed or wounded.
      - On 5 January 1858 Ye was found in hiding and taken prisoner; he was sent to Calcutta, where he died in 1859. The allies left the Qing governor in office under an Anglo-French commission, which ran the city until October 1861. With Guangzhou in their hands, Elgin and the French envoy Baron Gros sailed north to put their demands to the court.
    facts:
      - [Guangzhou bombarded and stormed, "28–29 December 1857"]
      - [Allied troops, "about 5,700"]
      - [Ye Mingchen captured, "5 January 1858"]
    markers:
      - kind: taken
        side: allies
        name: Guangzhou (Canton)
        date: 29 December 1857
        text: Taken by British, French and Indian troops after a day’s bombardment. Allied commissioners governed the city until 1861.
        lonlat: [113.264, 23.130]
        lp: l
      - kind: event
        side: qing
        name: Xilin
        date: 29 February 1856
        text: The French missionary Auguste Chapdelaine was executed here by the local magistrate; Guangxi was closed to foreigners under the treaties.
        lonlat: [105.100, 24.490]
