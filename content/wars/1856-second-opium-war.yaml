  - title: The repulse at Dagu
    date: June 1859
    when: "1859-06-25"
    borders: "1859-06-25"
    countries: [cn, gb, fr, us]
    body:
      - The emperor and his advisers regretted the treaties, and above all the clause on envoys in Beijing. The Mongol prince Senggelinqin, the general who had destroyed the Taiping Northern Expedition, rebuilt the Dagu forts and closed the river with booms and iron stakes. When the British and French envoys arrived in June 1859 to exchange the ratifications, they were told to land further north at Beitang and travel to Beijing without an armed escort.
      - The British admiral Sir James Hope instead tried to force the river on 25 June 1859. The forts opened fire, sank or disabled several gunboats and threw back a landing party floundering in the mud; the British and French lost more than 400 killed and wounded, and Hope himself was badly hurt. The American commodore Josiah Tattnall, officially neutral, helped tow British boats, saying that “blood is thicker than water”. The American envoy, John Ward, accepted the route the Qing offered and exchanged the US ratifications at Beitang in August. The defeat made renewed war certain.
    facts:
      - [Second Battle of the Dagu Forts, "25 June 1859, Qing victory"]
      - [British and French losses, "more than 400 killed and wounded"]
    markers:
      - kind: battle
        side: qing
        name: Dagu forts
        date: 25 June 1859
        text: Senggelinqin’s rebuilt forts repelled the British and French flotilla and its landing party.
        lonlat: [117.705, 38.977]
      - kind: event
        name: Beitang
        date: June 1859
        text: The landing place the Qing offered the envoys, about 12 km north of the forts.
        lonlat: [117.720, 39.105]
    arrows:
