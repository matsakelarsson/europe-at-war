        label: Hope
        via: [[118.100, 38.900], [117.850, 38.960], [117.730, 38.975]]
  - title: The 1860 expedition and Baliqiao
    date: August – September 1860
    when: "1860-08-01"
    borders: "1860-09-21"
    countries: [cn, gb, fr]
    body:
      - Elgin and Gros came back in 1860 with about 11,000 British and Indian troops under Sir James Hope Grant and about 6,700 French under General Charles Cousin-Montauban, carried by some 170 ships. They occupied the Zhifu (Yantai) and Dalian anchorages as bases, landed unopposed at Beitang on 1 August and on 21 August took the northern Dagu fort from the land side, after which the other forts surrendered. Tianjin was occupied soon after.
      - Talks with the court’s envoys failed, and on 18 September, near Tongzhou, the Qing seized the British negotiator Harry Parkes, Elgin’s secretary Henry Loch and some three dozen other British, French and Indian men under a flag of truce. On the same day the allies beat Senggelinqin at Zhangjiawan, and on 21 September, at the bridge of Baliqiao, his Mongol and Manchu cavalry, charging the allied guns, were cut down. The next day the Xianfeng emperor left Beijing for his hunting palace at Rehe (Chengde), leaving his brother Prince Gong to deal with the invaders.
    facts:
      - [Allied army, "about 11,000 British and 6,700 French"]
      - [Dagu forts taken, "21 August 1860"]
      - [Parkes and Loch seized, "18 September 1860"]
      - [Battle of Baliqiao, "21 September 1860"]
    markers:
