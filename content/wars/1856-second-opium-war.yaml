  - title: Beijing, the Summer Palace and the Conventions of Peking
    date: October – November 1860
    when: "1860-10-06"
    borders: "1860-11-14"
    countries: [cn, hk, gb, fr, ru]
    body:
      - On 6 October French troops reached the Yuanmingyuan, the Old Summer Palace north-west of Beijing, a park of palaces, gardens and collections built by the Qing emperors over 150 years, and began to plunder it; the British joined the next day. Parkes and Loch were released on 8 October, but about half of the 39 prisoners, among them a correspondent of The Times, had died of their treatment. On 13 October the city gave up the Anding Gate. In reprisal for the prisoners, Elgin had British troops burn the Yuanmingyuan on 18–19 October; the French declined to take part. The fires burned for two days and destroyed hundreds of buildings.
      - Prince Gong signed the Convention of Peking with Britain on 24 October and with France on 25 October. It ratified the Treaties of Tianjin, raised the indemnity to eight million taels for each ally, opened Tianjin as a treaty port, allowed Chinese to emigrate as labourers, and ceded the Kowloon peninsula to Britain’s colony of Hong Kong. The Russian envoy Nikolay Ignatiev, who had offered to mediate, secured a third Convention of Peking on 14 November 1860 that confirmed the Amur border and gave Russia the lands east of the Ussuri, where Vladivostok had been founded that summer.
      - The defeat led the court to set up a foreign office, the Zongli Yamen, in 1861 and, after the emperor’s death that year, to begin the Self-Strengthening reforms. Britain and France now backed the dynasty against the Taiping.
    facts:
      - [Old Summer Palace looted, "from 6 October 1860"]
      - [Old Summer Palace burned, "18–19 October 1860"]
      - [Conventions of Peking, "24 October (Britain), 25 October (France), 14 November 1860 (Russia)"]
      - [Indemnity, "8 million taels each to Britain and France"]
