  - title: Dagu and the Treaties of Tianjin
    date: April – June 1858
    when: "1858-05-20"
    borders: "1858-06-27"
    countries: [cn, gb, fr, ru, us]
    body:
      - In April 1858 the allied fleet, with the American and Russian envoys William Reed and Yevfimy Putyatin, arrived off the mouth of the Hai river. On 20 May British and French gunboats silenced the Dagu forts in two hours and steamed up to Tianjin. The court sent the senior officials Guiliang and Huashana to negotiate, and in June they signed the Treaties of Tianjin with Russia (13 June), the United States (18 June), Britain (26 June) and France (27 June).
      - The treaties opened about ten more ports, including Niuzhuang in Manchuria, Dengzhou in Shandong, Tainan and Danshui in Taiwan, and Hankou and other towns on the Yangtze, allowed foreigners to travel in the interior and missionaries to work freely, and gave Britain and France the right to station envoys in Beijing; Britain and France were also to receive indemnities. A tariff agreement later in 1858 legalised the import of opium. Weeks earlier, on 28 May 1858, the Russian governor of Eastern Siberia, Nikolay Muravyov, had made the Qing general Yishan sign the Treaty of Aigun, which gave Russia the left bank of the Amur.
    facts:
      - [First Battle of the Dagu Forts, "20 May 1858"]
      - [Treaty of Aigun, "28 May 1858"]
      - [Treaties of Tianjin, "13–27 June 1858"]
    markers:
