id: second-opium-war
name: Second Opium War
start: "1856-10-08"
end: "1860-10-24"
tier: A
summary: "A war of Britain and France against Qing China, also called the Arrow War. Britain wanted to revise the treaties of the First Opium War to open all of China to trade, legalise opium and station an ambassador in Beijing. The seizure of the Chinese-owned, Hong Kong-registered lorcha Arrow at Guangzhou (Canton) in October 1856 gave it a pretext, and France joined after the execution of a French missionary in Guangxi. The allies took Guangzhou at the end of 1857 and the Dagu (Taku) forts in May 1858, and imposed the Treaties of Tianjin. When the Qing repulsed their envoys at Dagu in 1859, an Anglo-French army of about 18,000 men returned in 1860, beat the Mongol general Senggelinqin at Baliqiao and occupied Beijing, where Lord Elgin had the Old Summer Palace looted and burned. The Conventions of Peking of October 1860 opened more ports, legalised the opium trade, allowed Christian missions, ceded Kowloon to Britain and, in a separate treaty, confirmed Russia’s annexation of the lands north of the Amur and east of the Ussuri."
countries: [cn, hk, gb, fr, ru]
sides:
  - id: allies
    name: Britain and France
    polities: [united-kingdom, france]
    ink: red
    moves: British and French moves
    success: British and French success
  - id: qing
    name: Qing China
    polities: [qing]
    ink: gold
    moves: Qing moves
    success: Qing success
  - id: us
    name: United States (not an ally; fought at Guangzhou in 1856)
    polities: [united-states]
    ink: blue
    moves: American moves
    success: American success
  - id: ru
    name: Russia (not a combatant; gained land by treaty)
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
notes:
  - The war was fought while the Qing were also fighting the Taiping Rebellion, and the British force was delayed in 1857 by the Indian Rebellion, which drew away troops bound for China.
  - The United States and Russia did not join the alliance but sent envoys who won treaties of their own in 1858; American warships fought the forts below Guangzhou in November 1856 after being fired on, and an American commodore helped tow British boats at Dagu in 1859.
  - The British called the war the Second China War or the Arrow War. The Russian gains, roughly a million square kilometres in the Amur and Ussuri regions, are known in Russia as the Amur annexation.
