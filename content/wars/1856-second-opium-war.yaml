steps:
  - title: The Arrow and the first attack on Guangzhou
    date: October 1856 – June 1857
    when: "1856-10-08"
    borders: "1856-10-08"
    countries: [cn, hk, gb, us]
    body:
      - The Treaty of Nanking had not given the British what they hoped for. The Cantonese kept foreigners out of the walled city of Guangzhou, trade grew more slowly than expected, and the Qing would not revise the treaties. On 8 October 1856 Qing marines boarded the Arrow, a Chinese-owned lorcha registered in Hong Kong, and arrested twelve of its Chinese crew for piracy. The British consul, Harry Parkes, claimed that the British flag had been insulted and that the ship was protected, although its registration had in fact expired. The governor of Hong Kong, Sir John Bowring, backed him, and when the viceroy Ye Mingchen returned the sailors without an apology, Rear Admiral Sir Michael Seymour attacked.
      - British ships destroyed the river forts below Guangzhou and in late October began to shell the city; on 29 October sailors broke through the wall and briefly entered Ye’s compound. Ye offered a reward for British heads, and in December a crowd burned the foreign factories. In November American ships, fired on from the Barrier Forts, stormed them in a separate action. Seymour withdrew to Hong Kong in January 1857. In London the House of Commons condemned the attack on 3 March 1857, but Palmerston called an election and won it, and Lord Elgin was sent out as envoy. In June British gunboats destroyed a Qing war fleet at Fatshan Creek.
    facts:
      - [Arrow incident, "8 October 1856"]
      - [Guangzhou bombarded, "from late October 1856"]
      - [Battle of the Barrier Forts (US), "16–22 November 1856"]
      - [Battle of Fatshan Creek, "1 June 1857"]
