id: zulu-civil-war-1856
name: Zulu civil war of 1856
start: "1856"
end: "1856-12-02"
tier: C
summary: "The succession war between two sons of King Mpande, decided at the battle of Ndondakusuka on the lower Tugela. Mpande, who had ruled the Zulu kingdom since 1840, named no heir, and in the 1850s his sons Cetshwayo, the eldest, and Mbuyazi, whom the king was thought to favour, built up rival followings: Cetshwayo’s party called itself the uSuthu, Mbuyazi’s the iziGqoza. In 1856 Mpande gave Mbuyazi land near the Tugela, and Mbuyazi moved south with his followers, their families and cattle, hoping for support from the Colony of Natal across the river. Cetshwayo followed with a larger army. On 2 December 1856, with the Tugela in flood behind them, the iziGqoza, about 7,000 fighting men, with the hunter John Dunn and a small party of Natal border police and African hunters on their side, were attacked by some 15,000 to 20,000 uSuthu near Ndondakusuka hill. Mbuyazi’s army broke, and his people were driven into the river: Mbuyazi and five of his brothers were killed, and the uSuthu killed many of the women and children who had come with the iziGqoza. Estimates of the dead, combatants and others, run to about 20,000, though no count was made; the place where the bodies washed up was afterwards called Mathambo, “the bones”. Cetshwayo was from then on the effective heir and, as Mpande aged, the real power in the kingdom; Mpande died in 1872 and Cetshwayo was installed in 1873. Dunn made his peace with him and became his adviser and a Zulu chief."
