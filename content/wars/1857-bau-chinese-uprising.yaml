id: bau-chinese-uprising
name: Chinese uprising at Bau and Kuching
start: "1857-02-18"
end: "1857-04-15"
tier: C
summary: "A rising of the Hakka gold miners of Bau, in Upper Sarawak, against the Brooke Raj. Their kongsi, the Twelve Kongsi, ran the gold mines of the Bau district and managed many of its own affairs; in the 1850s James Brooke’s government curbed its powers, made it build and pay for a fort at Belidah, and shortly before the rising fined it £150 for smuggling opium. Rumours of Britain’s war with China at Canton and of the British commission of inquiry into Brooke’s rule encouraged the kongsi’s leaders. On 18 February 1857 about 600 miners under Liu Shan Bang went down the Sarawak River by boat from Tundong and attacked Kuching after midnight. They burned the houses of Brooke and his officers and took the stockade with its arms and treasury; Brooke escaped by swimming a creek. Several Europeans were killed, among them a young officer, Nicholetts, whose head was paraded as the Rajah’s, two small children of the police inspector and a Borneo Company clerk. The kongsi’s leaders sat in Brooke’s court, made the Borneo Company’s manager and the Malay Datu Bandar govern the town under them, and went back upriver with their plunder. Malays under the Datu Bandar fought them on the river; within days the Borneo Company steamer Sir James Brooke arrived from Singapore and the Iban fighters of Brooke’s nephew Charles Brooke came from the Batang Lupar. The miners fled towards the Dutch border. Liu Shan Bang was killed on 24 February, and Malay, Iban and Bidayuh forces pursued the retreating Chinese, women and children among them, for days. Brooke-era accounts put the Chinese dead at about 1,000 and those who escaped into Sambas at about 2,000, half of them women and children; one account gives about 3,000 villagers killed in the pursuit. Peace was proclaimed on 15 April 1857. The kongsi was broken up, the Borneo Company took over much of the mining, and the Hakka of Bau later honoured Liu Shan Bang as a deity."
