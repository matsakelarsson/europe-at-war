notes:
  - The best-known accounts of the rising were written by Brooke’s officers and friends (Spenser St John, Charles Brooke, Harriette McDougall) and give the government’s side; their numbers of attackers (sometimes 1,000–3,000) and of dead are uncertain, and modern historians put the attacking force at about 400–600. The date of the attack is given as the night of 18–19 February.
  - Charles Brooke was then called Charles Johnson; he took the name Brooke in 1863 and succeeded his uncle as Rajah in 1868.
