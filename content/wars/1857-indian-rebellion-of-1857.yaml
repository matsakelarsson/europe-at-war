        text: A walled palace garden south of the city, held by Outram through the winter.
        lonlat: [80.905, 26.813]
        lp: b
      - kind: battle
        side: gb
        name: Cawnpore
        date: 6 December 1857
        text: Tatya Tope had beaten General Windham’s force here in late November; Campbell routed the Gwalior Contingent on his return.
        lonlat: [80.332, 26.450]
      - kind: taken
        side: gb
