        date: 21 March 1858
        text: Taken with the help of Jung Bahadur’s Gurkhas after two weeks of fighting through the palaces.
        lonlat: [80.946, 26.847]
        lp: r
    arrows:
      - side: gb
        label: Havelock and Outram
        phase: 1
