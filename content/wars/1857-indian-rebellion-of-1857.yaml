        via: [[77.706, 28.984], [77.550, 28.800], [77.420, 28.670], [77.270, 28.660]]
  - title: The rising spreads
    date: May – July 1857
    when: "1857-06-04"
    borders: "1857-06-04"
    countries: [in]
    body:
      - Within weeks the rising spread down the Ganges and into Awadh, Rohilkhand and Bundelkhand. Regiment after regiment of the Bengal Army turned on its officers, often after news of disarmings elsewhere; in all 54 of its 74 regular infantry regiments and all ten of its light cavalry regiments rebelled or were disbanded. Lucknow rose on 30 May, Bareilly and Shahjahanpur on 31 May, Benares on 4 June and Allahabad on 6 June. At Bareilly a descendant of the Rohilla chiefs, Khan Bahadur Khan, set up his own government; at Jhansi, where about sixty Europeans were killed after surrendering in June, the widowed Rani Lakshmibai took over the state the British had annexed. In June and July the Gwalior Contingent and the Indore troops rose, though their rulers stayed loyal to the Company, and in Bihar the old landholder Kunwar Singh of Jagdishpur joined the Dinapur regiments and besieged the British at Arrah.
      - Across the countryside landholders and peasants settled their own scores, attacking moneylenders, courts and the new landowners. Many rulers and landholders waited to see who would win, and some sheltered British fugitives. In the Punjab, conquered only eight years earlier, the chief commissioner John Lawrence disarmed the suspect regiments at Lahore and Peshawar in May and raised new Sikh, Punjabi and Pashtun units. Most of the Sikh princes, who had no wish to see the Mughals restored, sided with the Company, as did the Nizam of Hyderabad.
      - The Company answered with martial law and summary executions. Colonel James Neill, moving up the Ganges from Benares and Allahabad in June, had villages burned and suspected rebels hanged in large numbers, and rebels were sometimes executed by being blown from guns.
    facts:
      - [Bengal Army regiments that rebelled, "54 of 74 regular infantry regiments, all 10 light cavalry"]
      - [Madras Army, "no regiments rebelled"]
      - [Bombay Army, "three of 29 regiments rebelled"]
    markers:
      - kind: event
        side: reb
        name: Bareilly
        date: 31 May 1857
        text: Khan Bahadur Khan ruled Rohilkhand in the emperor’s name until May 1858. The Bareilly brigade under Bakht Khan marched to Delhi.
        lonlat: [79.432, 28.367]
      - kind: event
        side: reb
        name: Jhansi
        date: June 1857
        text: The garrison rose, and the Europeans who had taken refuge in the fort were killed after surrendering. Rani Lakshmibai took over the government.
        lonlat: [78.576, 25.458]
      - kind: held
        side: gb
        name: Allahabad
        date: June 1857
        text: The fort at the meeting of the Ganges and the Yamuna was held by Sikh and British troops after the sepoys rose on 6 June. Neill retook the town.
        lonlat: [81.877, 25.430]
      - kind: held
        side: gb
        name: Benares
        date: 4 June 1857
        text: A rising in the cantonment was put down with heavy firing on the sepoys, followed by mass hangings in the district.
        lonlat: [82.974, 25.318]
      - kind: siege
        side: gb
        name: Arrah
        date: 27 July – 3 August 1857
        text: About seventy people, most of them Sikh police, held a fortified house for a week against Kunwar Singh and the Dinapur sepoys until relieved.
        lonlat: [84.663, 25.556]
      - kind: event
        side: gb
        name: Lahore
        date: 13 May 1857
        text: The Indian regiments at Mian Mir were disarmed before they could rise; Peshawar followed on 22 May.
        lonlat: [74.360, 31.530]
      - kind: event
        side: reb
        name: Gwalior
        date: 14 June 1857
        text: The Gwalior Contingent rose against its British officers. The Maharaja, Jayajirao Scindia, stayed loyal to the Company.
        lonlat: [78.169, 26.230]
        lp: l
    arrows:
      - side: reb
        label: Bareilly brigade
        via: [[79.432, 28.367], [78.770, 28.840], [78.000, 28.750], [77.300, 28.670]]
