        name: Meerut
        date: 10 May 1857
        text: The 3rd Light Cavalry and the 11th and 20th Native Infantry rose on Sunday evening, freed their imprisoned comrades and set off for Delhi.
        lonlat: [77.706, 28.984]
      - kind: taken
        side: reb
        name: Delhi
        date: 11 May 1857
        text: The Delhi regiments joined the Meerut sepoys. Bahadur Shah II gave his support, and Delhi became the centre of the rising.
        lonlat: [77.241, 28.656]
        lp: l
    arrows:
