  - title: Lucknow
    date: June 1857 – March 1858
    when: "1857-06-30"
    borders: "1857-11-17"
    countries: [in, np]
    body:
      - In Lucknow, the capital of Awadh, the chief commissioner Sir Henry Lawrence had fortified the Residency compound. After a defeat at Chinhat on 30 June he shut himself in with about 855 British soldiers, 712 loyal Indian troops, 153 civilian volunteers and some 1,280 non-combatants. Lawrence was mortally wounded by a shell in the first days and died on 4 July. In Lucknow the rebels proclaimed the young Birjis Qadr king of Awadh, with his mother, Begum Hazrat Mahal, as regent; the landholders of Awadh, whose estates the British had reassessed, largely backed her.
      - Havelock tried to break through in August and was forced back by losses and cholera. Reinforced and joined by Sir James Outram, he fought into the Residency on 25 September, only to be besieged in turn. In November the new commander-in-chief, Sir Colin Campbell, fought his way in from the Alambagh. At the Sikandar Bagh on 16 November nearly 2,000 sepoys were killed. Campbell evacuated the garrison, women and children by 22 November; Havelock died of dysentery on 24 November. Outram stayed at the Alambagh, and Campbell hurried back to Cawnpore, where he beat the Gwalior Contingent under Tatya Tope on 6 December.
      - Campbell returned in March 1858 with about 30,000 men, joined by some 9,000 Nepalese troops under Jung Bahadur Rana, the ruler of Nepal. Lucknow was taken palace by palace between 6 and 21 March and plundered. Begum Hazrat Mahal escaped and fought on in the countryside with the Maulvi of Faizabad, Ahmadullah Shah, who was killed in June 1858. Bareilly fell to Campbell in May, and through 1858 the British cleared Awadh and Rohilkhand village by village.
    facts:
      - [Battle of Chinhat, "30 June 1857, rebel victory"]
      - [First relief, "25 September 1857"]
      - [Second relief, "14–22 November 1857"]
      - [Lucknow retaken, "6–21 March 1858"]
    markers:
