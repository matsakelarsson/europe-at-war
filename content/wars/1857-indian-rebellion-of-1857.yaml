  - title: The siege of Delhi
    date: June – September 1857
    when: "1857-06-08"
    borders: "1857-09-20"
    countries: [in]
    body:
      - A British force marched from Ambala, beat the rebels at Badli-ki-Serai on 8 June and occupied the Ridge, a low rise north-west of the walled city. It was too small to besiege Delhi and was itself attacked almost daily by a rebel army that grew as regiments arrived from all over northern India; cholera and the heat killed many on both sides. Inside the city, Bahadur Shah’s court tried to govern, raise money and feed the army, and in July the Bareilly commander Bakht Khan became commander-in-chief, but rivalry between the princes and the sepoy leaders weakened the defence.
      - The Punjab decided the siege. John Nicholson arrived with a movable column on 14 August and destroyed a rebel force at Najafgarh on 25 August, and a siege train followed in early September. By then the force on the Ridge had about 9,000 men, a third of them British, the rest Sikhs, Punjabis, Gurkhas and Pashtuns, with Kashmiri troops sent by the Maharaja of Jammu and Kashmir. Against them stood perhaps 12,000 sepoys and many thousands of irregulars, including a large body of mujahideen who had come to fight a holy war.
      - The batteries breached the northern walls, and on 14 September the assault began, with engineers blowing in the Kashmiri Gate. It took six days of street fighting to clear the city, and Nicholson was mortally wounded. On 20 September Bahadur Shah surrendered at Humayun’s Tomb to Captain William Hodson, who two days later shot three of the princes after they too had given themselves up. The victors plundered the city for days; many residents were killed, above all in the Kucha Chelan quarter, hundreds were hanged, and the whole population was driven out for months.
    facts:
      - [Badli-ki-Serai, "8 June 1857, Company victory"]
      - [Najafgarh, "25 August 1857, Company victory"]
      - [Assault on Delhi, "14–20 September 1857"]
      - [Company losses in the siege, "1,254 killed and 4,493 wounded"]
    markers:
      - kind: battle
        side: gb
        name: Badli-ki-Serai
        date: 8 June 1857
        text: The Delhi Field Force drove the rebels from their position and took the Ridge overlooking the city.
        lonlat: [77.150, 28.745]
        lp: l
      - kind: held
        side: gb
        name: The Ridge
        date: June – September 1857
        text: For three months the small British camp held this low ridge against repeated attacks.
        lonlat: [77.214, 28.687]
        lp: t
      - kind: battle
        side: gb
        name: Najafgarh
        date: 25 August 1857
        text: Nicholson caught a rebel force trying to get behind the British camp to intercept the siege train.
        lonlat: [76.980, 28.609]
        lp: b
      - kind: siege
        side: gb
        name: Delhi
        date: 14–20 September 1857
        text: The walls were stormed through the Kashmiri Gate and breaches near it, and the city was cleared street by street.
        lonlat: [77.241, 28.656]
      - kind: event
        side: gb
        name: Humayun’s Tomb
        date: 20 September 1857
        text: Bahadur Shah surrendered here to Hodson on the promise of his life. Two days later Hodson shot three Mughal princes on the road back to the city.
        lonlat: [77.251, 28.593]
        lp: b
