steps:
  - title: The cartridges, Meerut and Delhi
    date: January – May 1857
    when: "1857-05-10"
    borders: "1857-05-10"
    countries: [in]
    body:
      - By 1857 the East India Company ruled most of India directly and the rest through dependent princes. Its Bengal Army, recruited largely from high-caste Hindus and Muslims of Awadh and Bihar, had many grievances, over pay, service overseas and the loss of privileges, and many civilians had their own. Lord Dalhousie had annexed states whose rulers died without a natural heir, among them Satara, Jhansi and Nagpur, and in February 1856 he deposed the King of Awadh and annexed his kingdom, the home of many sepoys. Land settlements had dispossessed many landholders, and missionaries and reforms were seen as threats to religion.
      - The new Enfield rifle brought a spark. Its paper cartridges were greased and had to be torn open with the teeth, and the rumour spread that the grease was made from cow and pig fat, offensive to Hindus and Muslims alike. The Company changed the drill, but the rumour did not die. At Barrackpore near Calcutta, Mangal Pandey of the 34th Bengal Native Infantry attacked his officers on 29 March 1857 and was hanged; his regiment was disbanded.
      - At Meerut, 85 troopers of the 3rd Bengal Light Cavalry who refused the cartridges were sentenced to ten years’ hard labour and shackled in front of the garrison on 9 May. The next evening, a Sunday, the Indian regiments rose, freed them, and with crowds from the bazaar killed about fifty British officers, women and children. The British garrison, as large as the Indian one, did not pursue them. The sepoys rode through the night to Delhi, 64 km away, where the regiments of the garrison joined them on 11 May. Europeans and Indian Christians were killed in the city, British officers blew up the great magazine rather than let it fall, and the 82-year-old Mughal emperor, Bahadur Shah II, a Company pensioner, was proclaimed leader of the rising.
    facts:
      - [Mangal Pandey at Barrackpore, "29 March 1857"]
      - [Rising at Meerut, "10 May 1857"]
      - [Delhi taken by the rebels, "11 May 1857"]
