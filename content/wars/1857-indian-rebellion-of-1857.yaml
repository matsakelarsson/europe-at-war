  - title: Jhansi and Gwalior
    date: January – June 1858
    when: "1858-03-24"
    borders: "1858-06-20"
    countries: [in]
    body:
      - In central India a column under Sir Hugh Rose set out from Mhow in January 1858, relieved Saugor in February and reached Jhansi in March. Rani Lakshmibai, whom the British held responsible for the killings of June 1857 though her part in them is disputed, refused to surrender. The siege began on 24 March. On 1 April Rose beat a relieving army of more than 20,000 under Tatya Tope on the Betwa, and on 3 April his troops stormed the town; about 5,000 defenders and townspeople died in the fighting and killing that followed. The Rani escaped by night with her adopted son and rode to Kalpi.
      - Rose defeated the rebels again at Kunch on 7 May and took Kalpi on the Yamuna on 23 May. Then the rebel leaders, the Rani, Tatya Tope and Nana Sahib’s nephew Rao Sahib, struck at Gwalior. On 1 June the army of Maharaja Jayajirao Scindia went over to them, and the Maharaja fled to Agra. Rose marched on Gwalior in the hottest weeks of the year. On 17 June the Rani was killed in a cavalry fight near Kotah-ki-Serai, fighting in men’s clothes; some accounts give 18 June. Gwalior was retaken on 19 June and its fortress on 20 June, and Scindia was restored. This was the last large battle of the war.
    facts:
      - [Siege of Jhansi, "24 March – 4 April 1858"]
      - [Battle of the Betwa, "1 April 1858, Company victory"]
      - [Kalpi taken, "23 May 1858"]
      - [Rebels take Gwalior, "1 June 1858"]
      - [Rani Lakshmibai killed, "17 June 1858"]
      - [Gwalior retaken, "19–20 June 1858"]
