  - title: Cawnpore
    date: June – July 1857
    when: "1857-06-06"
    borders: "1857-06-27"
    countries: [in]
    body:
      - At Cawnpore (Kanpur) the elderly General Hugh Wheeler had about 900 people, some 300 of them soldiers and many of the rest women and children, behind a weak earthwork on open ground. The sepoys rose on 5 June and were joined by Nana Sahib, the adopted son of the last Peshwa, whose British pension had been stopped. For three weeks the entrenchment was shelled in the June heat; by the end, a well under fire was the only water. On 25 June Wheeler accepted Nana Sahib’s offer of safe passage by boat to Allahabad.
      - On the morning of 27 June, as the survivors boarded boats at the Satichaura Ghat on the Ganges, firing broke out, the thatched boats were set alight, and the men were killed in the water and on the bank. It is still disputed whether the massacre was planned. About 120 women and children were taken prisoner and held in a small house, the Bibighar, with others brought in later. On 15 July, as a British relief column approached, they were killed, some 200 in all, and their bodies thrown into a well.
      - Brigadier-General Henry Havelock had left Allahabad on 7 July with about 1,000 British troops and some Sikh soldiers. He beat Nana Sahib’s forces at Fatehpur on 12 July and outside Cawnpore on 16 July, and entered the town on 17 July. The discovery of the Bibighar inflamed British troops and opinion at home. Neill, left in command, made captured sepoys clean the blood from the floor before hanging them, and “Remember Cawnpore” became a cry that excused much killing in the months that followed. Nana Sahib withdrew to Bithur and later disappeared.
    facts:
      - [Siege of Wheeler’s entrenchment, "6–25 June 1857"]
      - [Satichaura Ghat, "27 June 1857"]
      - [Bibighar, "15 July 1857, about 200 women and children killed"]
      - [Havelock retakes Cawnpore, "16–17 July 1857"]
