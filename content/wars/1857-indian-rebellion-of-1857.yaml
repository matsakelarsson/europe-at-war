  - title: The end of Company rule
    date: 1858–1859
    when: "1858-11-01"
    borders: "1858-11-01"
    countries: [in, np]
    body:
      - Bahadur Shah was tried by a military commission in the Red Fort from January to March 1858, found guilty and exiled to Rangoon, where he died in 1862; the Mughal dynasty ended with him. Kunwar Singh died at Jagdishpur in April 1858, days after beating a British force. Tatya Tope led the remnants of the rebel armies on a long chase through Rajputana and central India until he was betrayed in April 1859 and hanged at Shivpuri. Begum Hazrat Mahal and Nana Sahib crossed into the Nepal Terai with thousands of followers in 1859; the Begum lived in Kathmandu until her death in 1879, and Nana Sahib’s fate is unknown.
      - In Britain the rising ended the East India Company’s rule. The Government of India Act of 2 August 1858 transferred its powers to the Crown, with a Secretary of State in London and a Viceroy in Calcutta. On 1 November 1858 Lord Canning read Queen Victoria’s proclamation at Allahabad, promising religious toleration, an end to annexations of princely states and a pardon for rebels not guilty of killing British subjects. Peace was formally proclaimed on 8 July 1859.
      - About 6,000 of the British in India, soldiers and civilians, died. Indian deaths, in battle, in reprisals and in the famine and disease that followed, were never counted; estimates run from several hundred thousand to some 800,000 or more. The army was rebuilt with fewer high-caste soldiers from the Ganges plain, more from the Punjab, Nepal and the north-west, and a higher share of British troops, and the artillery was kept in British hands.
