        lonlat: [80.813, 25.930]
      - kind: battle
        side: gb
        name: Battle of Cawnpore
        date: 16 July 1857
        text: Havelock outflanked Nana Sahib’s army south-west of the town and entered Cawnpore the next day, to find the Bibighar.
        lonlat: [80.300, 26.420]
        lp: b
      - kind: event
