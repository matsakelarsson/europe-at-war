        side: reb
        name: Chinhat
        date: 30 June 1857
        text: Lawrence’s sortie against the advancing rebels was routed, and the siege of the Residency began.
        lonlat: [81.020, 26.880]
      - kind: siege
        side: gb
        name: Lucknow Residency
        date: 1 July – 22 November 1857
        text: Held for 87 days until the first relief and almost two more months until Campbell evacuated it.
        lonlat: [80.926, 26.861]
        lp: t
      - kind: battle
        side: gb
        name: Sikandar Bagh
        date: 16 November 1857
        text: A walled garden stormed by Campbell’s Highlanders and Punjabis. Almost all its defenders were killed.
        lonlat: [80.950, 26.856]
      - kind: held
        side: gb
        name: Alambagh
