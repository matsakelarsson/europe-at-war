id: indian-rebellion-of-1857
name: Indian Rebellion of 1857
start: "1857-05-10"
end: "1858-11-01"
tier: A
summary: "The largest armed challenge to British rule in India in the 19th century, also called the Indian Mutiny, the Sepoy Mutiny, the Great Rebellion and the First War of Independence. It began on 10 May 1857 when Indian soldiers (sepoys) of the East India Company’s Bengal Army rose at Meerut and marched to Delhi, where they proclaimed the aged Mughal emperor Bahadur Shah II their leader. Most of the Bengal Army and much of the population of the upper Ganges plain, Awadh, Rohilkhand and Bundelkhand joined them. The Company held Calcutta, Bombay, Madras and the Punjab, retook Delhi in September 1857 after a three-month siege, and recovered Cawnpore, Lucknow and central India by mid-1858. Both sides killed prisoners and civilians, and British reprisals were heavy. In 1858 the British Crown took over the government of India from the Company."
countries: [in, np]
sides:
  - id: gb
    name: East India Company and its allies
    polities: [british-india, nepal, jammu-kashmir]
    ink: red
    moves: Company and allied moves
    success: Company success
  - id: reb
    name: Rebel sepoys, Bahadur Shah II and the rebel leaders
    polities: [rebels-1857, mughals]
    ink: green
    moves: Rebel moves
    success: Rebel success
notes:
  - "The rising has many names. British writers long called it the Indian Mutiny or the Sepoy Mutiny; in India it is widely known as the First War of Independence, a name made popular by V. D. Savarkar’s book of 1909. Historians also use the Great Rebellion, the Revolt of 1857 and the Indian Rebellion of 1857. Whether it was a soldiers’ revolt, a set of regional rebellions or a national rising is still debated."
  - The Company’s armies were mostly Indian. Loyal sepoys, Sikh and Punjabi regiments raised in 1857, Gurkhas, the troops of allied princes such as Patiala, Jind, Kashmir and Nepal, and British regiments all fought on its side. The Madras and Bombay armies stayed largely loyal.
  - Contemporary British accounts dominate the record, and rebel letters and proclamations survive mainly in captured archives at Delhi. Indian losses were never counted.
  - Place names are given in the forms used at the time, with today’s forms where they differ (Cawnpore for Kanpur, Oudh or Awadh).
