steps:
  - title: Tacubaya and Juárez’s flight to Veracruz
    date: December 1857 – May 1858
    when: "1857-12-17"
    borders: "1858-05-04"
    countries: [mx]
    body:
      - "The Liberals who overthrew Santa Anna in the Revolution of Ayutla passed laws in 1855–1857 that abolished the special courts of the clergy and the army (the Juárez law), forced the Church and Indigenous communities to sell their corporate lands (the Lerdo law) and capped parish fees, and wrote them into the Constitution of 5 February 1857. The Church threatened to excommunicate those who swore to it. On 17 December 1857 General Félix Zuloaga proclaimed the Plan of Tacubaya, annulling the constitution; President Ignacio Comonfort first went along with it, then changed his mind and left the country. In January 1858 the Conservatives made Zuloaga president in Mexico City, while Benito Juárez, the president of the Supreme Court and so the constitutional successor, formed a government at Guanajuato."
      - "The Conservatives, with most of the regular army, beat the Liberal militias at Salamanca on 10 March 1858. At Guadalajara mutinous soldiers nearly shot Juárez; the poet and minister Guillermo Prieto stood in front of him, crying “The brave do not murder!”. Juárez escaped to Colima and Manzanillo and sailed by way of Panama, Havana and New Orleans to Veracruz, which its governor held for the Liberals, arriving on 4 May 1858. Its port and customs revenues kept his government alive for the rest of the war."
