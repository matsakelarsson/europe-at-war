  - title: Two governments
    date: 1858–1860
    when: "1859-04-11"
    borders: "1859-07-12"
    countries: [mx, us, es]
    body:
      - "The Conservatives held Mexico City and most of the centre, and in 1858–1859 their young general Miguel Miramón, who became their president in early 1859, won battle after battle, at Ahualulco and elsewhere. The Liberals held Veracruz, much of the north and the far south, and kept raising new armies under Santos Degollado. In March 1859 Miramón besieged Veracruz but had to withdraw. On 11 April 1859 Leonardo Márquez beat Degollado at Tacubaya and had the prisoners shot, along with doctors and medical students who had been treating the wounded; he became known as the Tiger of Tacubaya."
      - "In July 1859, at Veracruz, Juárez issued the Laws of Reform: church property was nationalised without compensation, monasteries were suppressed, marriage became a civil contract and births and deaths were registered by the state. Both governments sought foreign help. The United States recognised Juárez in April 1859, and in December his minister Melchor Ocampo signed the McLane–Ocampo Treaty, which would have given the United States perpetual rights of transit across Mexico; the US Senate never ratified it. The Conservatives signed the Mon–Almonte Treaty with Spain. In March 1860, when Miramón besieged Veracruz again, US warships seized at Antón Lizardo two steamers bought in Havana to blockade the port, and the siege failed."
    facts:
      - [Massacre at Tacubaya, "11 April 1859"]
      - [Laws of Reform, "July 1859"]
      - [McLane–Ocampo Treaty, "14 December 1859 (not ratified)"]
      - [Antón Lizardo incident, "6 March 1860"]
