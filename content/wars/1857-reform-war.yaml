  - title: Silao, Calpulalpan and the Liberal victory
    date: August 1860 – June 1861
    when: "1860-12-22"
    borders: "1861-01-11"
    countries: [mx]
    body:
      - "In 1860 the Liberal armies, now led by Jesús González Ortega and Ignacio Zaragoza, turned the war. On 10 August they defeated Miramón at Silao, capturing much of his army, and on 3 November Guadalajara surrendered after a siege. With about 11,000 men González Ortega met Miramón’s last army of some 8,000 at San Miguel Calpulalpan, north-west of the capital, on 22 December 1860 and routed it. Miramón fled abroad, and the Liberal army entered Mexico City on 25 December. Juárez returned on 11 January 1861 and expelled the papal nuncio and the Spanish ambassador."
      - "The Conservatives fought on as guerrillas. In June 1861 Márquez’s men captured and shot Melchor Ocampo, and Santos Degollado and Leandro Valle were killed pursuing them. Juárez was elected president in 1861, but his government was bankrupt, and in July it suspended payment of the foreign debt, which brought Spanish, British and French troops to Veracruz."
    facts:
      - [Battle of Silao, "10 August 1860"]
      - [Guadalajara surrenders, "3 November 1860"]
      - [Battle of Calpulalpan, "22 December 1860"]
      - [Juárez returns to Mexico City, "11 January 1861"]
