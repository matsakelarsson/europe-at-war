notes:
  - "Both sides claimed to be the government of Mexico. The United States recognised Juárez’s government in April 1859; Spain, France, Britain and the Pope dealt with the Conservative government in Mexico City. The base map shows Mexico as one country; much of it changed hands repeatedly."
  - Casualty figures for the war are uncertain; it was fought largely by forced levies, guerrilla bands and reprisals, and both sides shot prisoners.
