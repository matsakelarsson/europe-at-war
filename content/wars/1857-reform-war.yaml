id: reform-war
name: Reform War
start: "1857-12-17"
end: "1861-01-11"
tier: B
summary: "The civil war of 1857–1861 between Mexico’s Liberals and Conservatives over the Constitution of 1857 and the Liberal laws that ended the special courts of the Church and the army and forced the sale of church and communal lands. In December 1857 General Félix Zuloaga proclaimed the Plan of Tacubaya against the constitution and the Conservatives took Mexico City, while Benito Juárez, as president of the Supreme Court, claimed the presidency and set up a constitutional government, from May 1858 at Veracruz. For three years Mexico had two governments. The Conservative armies of Miguel Miramón, Leonardo Márquez and Tomás Mejía won most of the early battles, but twice failed to take Veracruz, and in 1859 Juárez answered with the Laws of Reform, which nationalised church property and separated church and state. In 1860 the Liberal armies of Jesús González Ortega and Ignacio Zaragoza won at Silao, took Guadalajara and destroyed Miramón’s army at Calpulalpan on 22 December, and Juárez returned to the capital on 11 January 1861. The war left the treasury empty and the Conservatives looking to Europe for a monarch, which led to the French intervention."
countries: [mx]
sides:
  - id: lib
    name: Liberals (Juárez’s constitutional government)
    polities: [mexican-liberals, mexico]
