  - title: Kane’s mediation, the Move South and the peace
    date: February – July 1858
    when: "1858-06-26"
    borders: "1858-06-26"
    countries: [us]
    body:
      - "In February 1858 Bannock and Shoshone men raided Fort Limhi, the Mormon mission on the Salmon River far to the north, killing two missionaries and driving off its cattle; the mission was abandoned. The same month Thomas L. Kane, a Pennsylvanian who had long befriended the Saints, arrived in Salt Lake City by way of Panama and California, sent unofficially by Buchanan. He persuaded Young to accept Cumming, and on 12 April Cumming entered Salt Lake City, without the army, and was received as governor."
      - Young would not let the army into the valley’s settlements. From March he ordered the Move South, and some 30,000 Latter-day Saints left their homes in Salt Lake City and the northern settlements for Provo and the towns to the south, leaving men behind with orders to burn the houses if the army attacked. Criticised in Congress for an expensive war, Buchanan issued a proclamation on 6 April offering a pardon to all who submitted to federal law, and two peace commissioners, Lazarus W. Powell and Ben McCulloch, reached Salt Lake City in June. On 12 June Young and the church leaders accepted the pardon.
      - On 26 June Johnston’s army marched through the silent, almost empty city without stopping and went on to build Camp Floyd in Cedar Valley, about 60 km to the south-west; the Saints returned to their homes in July. Young was no longer governor, but he remained the most powerful man in Utah. The army stayed at Camp Floyd until 1861, when its troops were called east for the Civil War; Johnston died at Shiloh as a Confederate general in 1862.
    facts:
      - [Cumming enters Salt Lake City, "12 April 1858"]
      - [Buchanan’s pardon, "6 April 1858"]
      - [The Move South, "about 30,000 people"]
      - [Army marches through Salt Lake City, "26 June 1858"]
