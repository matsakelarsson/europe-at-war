id: utah-war
name: Utah War
start: "1857-05"
end: "1858-07"
tier: B
summary: "An armed confrontation in 1857–1858 between the government of the United States and the Latter-day Saints of Utah Territory, led by their church president and territorial governor Brigham Young. Believing reports that the Mormons were in rebellion against federal authority, President James Buchanan replaced Young as governor with Alfred Cumming and sent some 2,500 soldiers to install him. Young declared martial law, called out the territorial militia, the Nauvoo Legion, and prepared to resist. On 11 September 1857 Mormon militiamen from southern Utah, with some Southern Paiutes, killed about 120 men, women and children of the Baker–Fancher wagon train from Arkansas at Mountain Meadows, the worst atrocity of the conflict. In October Mormon raiders under Lot Smith burned three army supply trains and the army wintered near the burned-out Fort Bridger. In 1858, through the mediation of Thomas L. Kane, Cumming entered Salt Lake City as governor, some 30,000 Latter-day Saints left their homes in northern Utah in the Move South, Buchanan pardoned those who submitted, and the army marched through the empty city on 26 June to set up Camp Floyd. There were no battles; about 150 people died in the conflict, most of them at Mountain Meadows."
countries: [us]
