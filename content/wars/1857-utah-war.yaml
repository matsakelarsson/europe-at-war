notes:
  - "Sources date the conflict from Buchanan’s decision in May 1857 or the army’s departure in July to the army’s arrival in Salt Lake Valley in June or July 1858. Historians disagree on how much Brigham Young knew in advance of the massacre at Mountain Meadows; they agree that his war preparations and rhetoric helped create the conditions for it and that he concealed evidence afterwards."
  - "The church was then called the Church of Jesus Christ of Latter-day Saints; its members were commonly called Mormons. Utah Territory, created in 1850, also covered most of present-day Nevada and parts of Colorado and Wyoming."
