  - title: Echo Canyon and the burning of the supply trains
    date: October – November 1857
    when: "1857-10-05"
    borders: "1857-11-20"
    countries: [us]
    body:
      - The Utah Expedition marched west along the Oregon Trail in separate detachments under Colonel Edmund Alexander, without its new commander, Colonel Albert Sidney Johnston, who was still on the way, and with its supply trains strung out behind. Young’s strategy was to stop it without battle. Some 1,200 to 2,000 Nauvoo Legion men under Daniel H. Wells built breastworks and dams in Echo Canyon, the gateway to the Salt Lake Valley, while mounted raiders harried the army east of the mountains.
      - In early October Lot Smith’s company of about forty horsemen captured and burned three army supply trains on the Green River and the Big Sandy, including the train of Lewis Simpson at what is now Simpson’s Hollow, 76 wagons in all, with food meant to feed the army for months; no one was killed. Other raiders drove off hundreds of the army’s cattle and burned the grass along the trail. The Legion also burned Fort Bridger and the nearby Mormon settlement of Fort Supply so that the army could not use them.
      - Snow and the loss of supplies and animals halted the expedition. In November Johnston gathered it in a winter camp, Camp Scott, beside the ruins of Fort Bridger, where Cumming and the other new officials set up a government in exile at Eckelsville; the troops spent a hungry winter on reduced rations, and many of their animals died. Cumming declared Utah in rebellion. In the same weeks Mormons in central Utah arrested the Aiken party, six Californians suspected of being spies, and robbed and murdered them.
    facts:
      - [Supply trains burned, "4–5 October 1857"]
      - [Wagons burned, "76"]
      - [Army in winter quarters, "November 1857 – June 1858"]
