steps:
  - title: Martial law and the Mountain Meadows massacre
    date: May – September 1857
    when: "1857-09-11"
    borders: "1857-09-11"
    countries: [us]
    body:
      - The Latter-day Saints had settled the Great Basin from 1847 to escape the violence they had suffered in Missouri and Illinois. When Congress created Utah Territory in 1850, Brigham Young was appointed governor, and church and territorial government were in practice one. Federal judges and officials sent to Utah clashed with him, the church’s public announcement of plural marriage in 1852 stirred outrage in the East, and in 1857 a departing judge, William W. Drummond, accused Young of defying federal law. In May 1857 the new president, James Buchanan, decided to replace Young with a non-Mormon governor, Alfred Cumming, and to send about 2,500 soldiers with him. The first troops left Fort Leavenworth on 18 July.
      - Young heard the news on 24 July, at the celebration of the tenth anniversary of the Saints’ arrival. Expecting a repeat of the expulsions of the 1830s and 1840s, he called the Saints back from outlying colonies such as San Bernardino and Carson Valley, put the Nauvoo Legion on a war footing, told the Saints not to sell grain to passing emigrants, and sought the support of Native leaders. Church leaders preached against the “gentiles” and called for vengeance for the murder of Joseph Smith in 1844 and of the apostle Parley P. Pratt in Arkansas that May. On 15 September Young declared martial law and forbade armed forces to enter the territory.
      - "Into this atmosphere came the Baker–Fancher party, a wagon train of about 120 to 140 people, mostly families, from north-western Arkansas, bound for California. Refused supplies on the way south, they camped at Mountain Meadows to rest their cattle. On 7 September militiamen of Iron County, some disguised as Native Americans, and Southern Paiute men they had recruited attacked the camp; the emigrants circled their wagons and held out for five days. On 11 September the militia officer John D. Lee came under a white flag and promised them safe conduct if they gave up their arms. The emigrants were led out, the men separated from the women and children, and at a signal the militiamen shot the men, while others killed the women and older children. At least 120 people died; 17 children aged six or under were spared and taken into Mormon families, and in 1859 the army returned them to Arkansas. Young’s letter telling the local leaders to let the emigrants pass arrived two days later."
      - The militia leaders, among them Isaac Haight and William Dame, swore the men to secrecy and blamed the Paiutes, as Young did in his reports. Only John D. Lee was ever convicted; he was executed by firing squad at Mountain Meadows on 23 March 1877. The church expressed its “profound regret” for the massacre in 2007.
    facts:
      - [Buchanan orders the expedition, "May 1857"]
      - [Mountain Meadows massacre, "7–11 September 1857"]
      - [Killed at Mountain Meadows, "at least 120"]
      - [Martial law, "15 September 1857"]
