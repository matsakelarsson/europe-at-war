steps:
  - title: Missionaries, Napoleon III and the landing at Tourane
    date: 1857 – September 1858
    when: "1858-09-01"
    borders: "1858-09-01"
    countries: [vn, fr, es, ph]
    body:
      - Since the 1830s the Nguyễn emperors Minh Mạng, Thiệu Trị and Tự Đức had banned Christianity, which they saw as a threat to the Confucian order and to the dynasty; Vietnamese Catholics had been prominent in the revolt of Lê Văn Khôi in 1833. Missionaries and Vietnamese priests were executed, and French warships had already fired on Tourane in 1847 and 1856. French missionaries, among them Bishop François Pellerin, who claimed some 600,000 Catholics in Vietnam, urged Napoleon III to intervene. Naval officers and merchants wanted a French base in East Asia to match British Hong Kong. When Tự Đức’s officials executed the Spanish Dominican bishop José María Díaz Sanjurjo in July 1857, Spain agreed to join an expedition.
      - The French fleet was already in Chinese waters for the Second Opium War. In November 1857 Napoleon III ordered Admiral Charles Rigault de Genouilly to take a port in Vietnam. On 1 September 1858 his squadron of fourteen ships bombarded the forts at the entrance of the bay of Tourane, near the road to the capital Huế, and landed about 1,000 French marine infantry, 550 Spanish soldiers and 450 Filipino troops, who took the Tiên Sa forts on the Sơn Trà peninsula.
      - The French had expected the Catholics of the region to rise and the court to give in quickly. Neither happened. Tự Đức sent Nguyễn Tri Phương, his most experienced general, to contain the landing, and he built a line of earthworks around the bay that kept the allies from marching on Huế.
    facts:
      - [Execution of Bishop Díaz, "July 1857"]
      - [Landing at Tourane, "1 September 1858"]
      - [Allied landing force, "about 1,000 French, 550 Spanish and 450 Filipino troops"]
