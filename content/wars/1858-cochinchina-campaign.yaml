  - title: The Treaty of Saigon and the war that went on
    date: June 1862 – 1864
    when: "1862-06-05"
    borders: "1862-06-05"
    countries: [vn, fr, es]
    body:
      - On 5 June 1862, aboard the French ship Duperré at Saigon, Phan Thanh Giản for the emperor signed a treaty with Bonard and with Palanca for Spain. Vietnam ceded the provinces of Biên Hòa, Gia Định and Định Tường and the island of Poulo Condore to France, allowed Catholics to practise their faith, opened the ports of Tourane, Ba Lạt and Quảng Yên to trade, gave French ships free passage up the Mekong to Cambodia, and agreed to pay France and Spain an indemnity over ten years (one million dollars in some accounts, four million piastres in others). Spain received its share of the money but no land, and withdrew its troops in 1863.
      - Many in the south refused to accept the treaty. Trương Định, a landowner and official who had raised a force around Gò Công in 1859, disobeyed the emperor’s order to disband and refused a post in An Giang. Taking the title Bình Tây (“subduer of the West”), he fought on from the swamps and forests of the coast, and the court stripped him of his rank. In August 1864, betrayed by a former follower and surrounded by French troops, he killed himself rather than be taken. His son Trương Quyền carried on the fight from Tây Ninh until his death in 1870.
      - In 1863 Phan Thanh Giản led an embassy to Paris to buy back the provinces. Napoleon III agreed in principle, but the navy minister, Chasseloup-Laubat, opposed it, and the agreement was cancelled in 1864. That year the three provinces became the colony of Cochinchina, governed by admirals from Saigon.
    facts:
      - [Treaty of Saigon, "5 June 1862"]
      - [Ceded, "Biên Hòa, Gia Định, Định Tường and Poulo Condore"]
      - [Indemnity, "payable over ten years; one million dollars or four million piastres, by different accounts"]
      - [Death of Trương Định, "August 1864"]
