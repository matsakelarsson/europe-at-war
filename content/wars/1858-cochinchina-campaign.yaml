        text: The allied camp around the bay, besieged for eighteen months and evacuated in March 1860.
        lonlat: [108.215, 16.085]
      - kind: battle
        side: fr
        name: Cẩm Lệ
        date: 15 September 1859
        text: A French assault broke the Vietnamese line here and took about 40 guns. Lê Đình Lý was mortally wounded, but a new line was built further back.
        lonlat: [108.190, 16.000]
