  - title: The siege of Tourane
    date: September 1858 – March 1860
    when: "1859-05-08"
    borders: "1859-05-08"
    countries: [vn, fr, es]
    body:
      - The allies held the bay but could not break out of it. Nguyễn Tri Phương’s troops, about 4,000 at first and more later, dug lines that the French stormed again and again without changing the situation. On 8 May 1859 Rigault de Genouilly led about 1,500 men against the Vietnamese earthworks, losing 78 killed and wounded; in September an assault at Cẩm Lệ, south of the town, took some 40 guns, and the Vietnamese commander Lê Đình Lý was mortally wounded there. Each time the Vietnamese built new lines further back.
      - Disease did more damage than the fighting. Cholera, dysentery and typhus swept the camp; about 200 French soldiers died of cholera in three weeks of June 1859 alone. Admiral François Page, who succeeded Rigault de Genouilly in November 1859, was told to seek a treaty protecting the Catholic faith without gaining territory, but the court refused his terms. With France now fighting in northern China, the allies evacuated Tourane on 22 March 1860. Vietnamese accounts count the siege as a victory.
    facts:
      - [Attack on the Vietnamese lines, "8 May 1859"]
      - [Cẩm Lệ, "15 September 1859"]
      - [Tourane evacuated, "22 March 1860"]
    markers:
      - kind: held
        side: fr
        name: Tourane (Đà Nẵng)
