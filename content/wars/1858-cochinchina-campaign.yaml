  - title: The siege of Saigon and Kỳ Hòa
    date: March 1860 – February 1861
    when: "1861-02-24"
    borders: "1861-02-24"
    countries: [vn, fr, es]
    body:
      - After the evacuation of Tourane, and while most French ships and troops were away in China, Nguyễn Tri Phương came south. From March 1860 a Vietnamese army of several thousand besieged Saigon, where Captain Jules d’Ariès held on with about 1,000 French and Spanish soldiers. The Vietnamese built the Kỳ Hòa lines, a chain of forts and earthworks about 12 km long west of the town, and cut it off by land.
      - When the Second Opium War ended with the Convention of Beijing in October 1860, Admiral Léonard Charner brought about 70 ships and 3,500 soldiers from China. On 24 and 25 February 1861 the French and Spanish troops, with General Élie de Vassoigne and Colonel Carlos Palanca Gutiérrez, attacked the Kỳ Hòa lines and took them after two days of fighting. Estimates of the Vietnamese army range from about 10,000 to more than 30,000 men, counting militia. The allies lost 12 killed and over 200 wounded; the French estimated the Vietnamese losses at about 1,000, and among the dead were the commanders Nguyễn Duy, a brother of Nguyễn Tri Phương, and Tôn Thất Trĩ. Nguyễn Tri Phương himself was wounded, and his army retreated towards Biên Hòa.
    facts:
      - [Siege of Saigon, "March 1860 – February 1861"]
      - [Battle of Kỳ Hòa, "24–25 February 1861, Franco-Spanish victory"]
      - [Allied losses, "12 killed, over 200 wounded"]
    markers:
