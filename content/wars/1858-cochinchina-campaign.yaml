  - title: The western provinces
    date: June 1867 – 1868
    when: "1867-06-20"
    borders: "1867-06-25"
    countries: [vn, fr, kh]
    body:
      - The three provinces left to Vietnam in the delta, Vĩnh Long, An Giang and Hà Tiên, now lay between French Cochinchina and Cambodia, which had accepted a French protectorate in 1863. The French accused their officials of sheltering the resistance. In June 1867 the governor, Admiral Pierre-Paul de La Grandière, sent troops against them. Vĩnh Long was taken on 20 June, Châu Đốc, the seat of An Giang, two days later and Hà Tiên on 24 June. The Vietnamese governor of the three provinces, Phan Thanh Giản, ordered the garrisons not to resist, to spare the people a hopeless fight. He resigned and took poison, dying on 4 August 1867.
      - Resistance continued. On 16 June 1868 Nguyễn Trung Trực, who had burned the Espérance in 1861, seized the French post at Rạch Giá; he was captured soon after and executed there on 27 October 1868. The court in Huế never formally accepted the loss of the western provinces until the second Treaty of Saigon in 1874, which recognised French rule over all six provinces of Cochinchina and opened the Red River in the north to trade, the issue over which the French went on to Tonkin.
    facts:
      - [Vĩnh Long, Châu Đốc and Hà Tiên taken, "20–24 June 1867"]
      - [Death of Phan Thanh Giản, "4 August 1867"]
      - [Nguyễn Trung Trực executed, "27 October 1868"]
      - [Treaty recognising the six provinces, "15 March 1874"]
    markers:
      - kind: taken
        side: fr
        name: Vĩnh Long
        date: 20 June 1867
        text: Taken without resistance. Phan Thanh Giản had ordered the garrison not to fight.
