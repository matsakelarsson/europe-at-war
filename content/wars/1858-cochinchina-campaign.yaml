id: cochinchina-campaign
name: Cochinchina campaign
start: "1858-09-01"
end: "1862-06-05"
tier: A
summary: "The war in which France, with Spanish help, took the southern provinces of Nguyễn Vietnam (Đại Nam) and founded the colony of Cochinchina. Napoleon III sent a French fleet under Admiral Rigault de Genouilly, citing the persecution of Catholic missionaries; Spain, whose bishop José María Díaz Sanjurjo had been executed in 1857, sent troops from the Philippines. The allies landed at Tourane (Đà Nẵng) in September 1858 but were held there by Nguyễn Tri Phương’s siege lines and by cholera, and turned south to take Saigon in February 1859. The small garrison of Saigon was itself besieged until Admiral Charner broke the Vietnamese lines at Kỳ Hòa in February 1861. Mỹ Tho, Biên Hòa and Vĩnh Long followed, and by the Treaty of Saigon (5 June 1862) Emperor Tự Đức ceded the provinces of Biên Hòa, Gia Định and Định Tường and the island of Poulo Condore, allowed Catholic worship and agreed to pay an indemnity. Local leaders such as Trương Định and Nguyễn Trung Trực fought on against the French, and in June 1867 Admiral de La Grandière took the three western provinces as well, completing French Cochinchina."
countries: [vn, fr, es, ph]
sides:
