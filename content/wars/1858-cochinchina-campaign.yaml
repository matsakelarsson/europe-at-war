notes:
  - Cochinchina was the European name for the south of Vietnam, which the Vietnamese called Nam Kỳ or Gia Định after its old capital, today’s Ho Chi Minh City. Tourane is Đà Nẵng. Kỳ Hòa is also written Chí Hòa.
  - The Spanish contingent came from the Philippines and was largely made up of Filipino soldiers (chasseurs tagals in French accounts) under Spanish officers.
  - Most detailed accounts of the war are French. Vietnamese army sizes are uncertain, and French and Vietnamese figures differ widely; the text gives ranges where the sources do.
  - The local fighters who continued the war after 1862 are shown as their own side, because the court in Huế had made peace and ordered them to disband. Vietnamese call them the righteous army (nghĩa quân).
