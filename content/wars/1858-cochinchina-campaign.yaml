  - title: Mỹ Tho, Biên Hòa and Vĩnh Long
    date: April 1861 – March 1862
    when: "1861-04-12"
    borders: "1861-12-16"
    countries: [vn, fr, es]
    body:
      - Charner pushed into the Mekong delta. A French flotilla worked its way down the creeks from Saigon while Admiral Page came up the Mekong, and on 12 April 1861 they occupied Mỹ Tho, the capital of Định Tường province, without a fight. Charner now demanded the cession of the provinces around Saigon and an indemnity, terms Tự Đức would not accept. Across the occupied districts village leaders and officials raised local forces. In June about 600 men attacked the French post at Gò Công, and on 10 December 1861 Nguyễn Trung Trực’s men boarded and burned the French lorcha Espérance on the Nhật Tảo river, killing many of its crew.
      - Admiral Louis Adolphe Bonard, who took over at the end of November, answered with a campaign in Biên Hòa province and took its citadel on 16 December 1861. In March 1862, after an explosion on a French gunboat near Mỹ Tho that the French blamed on sabotage, he landed about 1,000 French and Spanish troops at Vĩnh Long, whose citadel was taken on 23 March.
      - Tự Đức was by then facing a second war in the north, where Tạ Văn Phụng, who claimed descent from the old Lê dynasty, had raised a revolt in Tonkin with the support of many Vietnamese Catholics. In April 1862 the court let the French know that it wanted peace.
    facts:
