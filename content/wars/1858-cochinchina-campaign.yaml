  - title: The capture of Saigon
    date: February – April 1859
    when: "1859-02-17"
    borders: "1859-02-17"
    countries: [vn, fr, es, ph]
    body:
      - In January 1859 Rigault de Genouilly decided to strike in the south instead. Gia Định, the province around Saigon, sent rice to Huế and to the army at Tourane, and it could be reached by sea and river without crossing mountains. Leaving a garrison at Tourane, he sailed south in early February, fought his way up the Saigon river past the forts that guarded it, and on 17 February 1859 French marines and Spanish and Filipino troops stormed the citadel of Saigon, built in 1836, and beat off a counter-attack.
      - The allies could not hold so large a fortress. On 8 March they blew up the citadel and burned the rice stored in its granaries, which by French estimates could have fed an army for a year. In April Rigault de Genouilly took most of his men back to Tourane, leaving Captain Bernard Jauréguiberry with about 1,000 French and Spanish troops in a smaller fort by the river. On 21 April a Vietnamese attack west of the town inflicted heavy losses on the garrison.
    facts:
      - [Saigon citadel stormed, "17 February 1859"]
      - [Citadel demolished, "8 March 1859"]
      - [Garrison left at Saigon, "about 1,000 men"]
    markers:
