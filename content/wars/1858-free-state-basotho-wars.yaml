  - title: The third war and British protection
    date: 1867–1869
    when: "1867-07"
    borders: "1869-02-12"
    countries: [ls, za, gb]
    body:
      - The Basotho could not live without the lowlands, and many returned to plough. After two white men were killed near Ladybrand in June 1867, the Free State resumed the war in July. This time its commandos took one Basotho stronghold after another and overran nearly all the kingdom except Thaba Bosiu, and Moshoeshoe, now about eighty, faced the end of his state.
      - For years he had asked to be taken under British protection, “to rest under the large folds of the flag of England”, as he wrote. Wodehouse, worried that the Free State would absorb the Basotho and their land, persuaded London to agree, and on 12 March 1868 he proclaimed the Basotho British subjects and their country British territory. The Free State, which could not fight Britain, ended the war under protest.
      - By the Convention of Aliwal North of 12 February 1869, Britain and the Free State agreed the border. The Conquered Territory west of the Caledon stayed with the Free State, and the land east of it became Basutoland, the territory of today’s Lesotho. Moshoeshoe died at Thaba Bosiu on 11 March 1870. In 1871 Britain handed Basutoland to the Cape Colony, whose attempt to disarm the Basotho led to the Gun War of 1880–1881.
    facts:
      - [Third war begins, "July 1867"]
      - [Basutoland proclaimed British territory, "12 March 1868"]
      - [Convention of Aliwal North, "12 February 1869"]
