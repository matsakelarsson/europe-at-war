notes:
  - "The wars are known in Lesotho by their own names: the 1865–1866 war is called Ntoa ea Seqiti, after the sound of the Free State’s new cannon. The date of the peace of Thaba Bosiu in 1866 is given as 3 April or 11 April in different sources, and the start of the first war as 19 or 22 March 1858."
  - The Basotho kingdom, ruled by Moshoeshoe and his sons, absorbed many refugees of the wars of the 1820s; its people are the Basotho, its language Sesotho, and the British territory was called Basutoland until Lesotho’s independence in 1966.
