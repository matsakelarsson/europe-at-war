id: free-state-basotho-wars
name: Free State–Basotho wars
start: "1858-03-19"
end: "1869-02-12"
tier: B
summary: "Three wars between the Orange Free State and the Basotho kingdom of Moshoeshoe over the fertile lowlands of the Caledon valley. Moshoeshoe had built his kingdom around the mountain stronghold of Thaba Bosiu in the 1820s, and his people farmed the lowlands on both sides of the Caledon, where white farmers also settled from the 1830s. British attempts to draw a boundary, the Warden Line of 1849, failed; the Basotho defeated a British force at Viervoet in 1851 and fought another to a standstill at Berea in 1852, and in 1854 Britain withdrew and left the Orange Free State to deal with the Basotho. In Senekal’s War of 1858 Free State commandos failed to take Thaba Bosiu and the governor of the Cape, Sir George Grey, mediated a peace. In the Seqiti War of 1865–1866 the Free State, under President Jan Brand, again failed to storm Thaba Bosiu but destroyed crops and seized cattle until Moshoeshoe, short of food, ceded most of his arable land. When war resumed in 1867 the Free State overran almost everything but Thaba Bosiu, and Moshoeshoe asked for British protection. On 12 March 1868 Britain proclaimed Basutoland British territory, and the Convention of Aliwal North of 1869 fixed the border that Lesotho has today, leaving the Conquered Territory west of the Caledon to the Free State."
countries: [ls, za, gb]
sides:
  - id: ofs
    name: Orange Free State
    polities: [orange-free-state]
    ink: orange
    moves: Free State moves
    success: Free State success
  - id: sot
    name: Basotho kingdom (Moshoeshoe)
    polities: [lesotho]
    ink: blue
    moves: Basotho moves
    success: Basotho success
  - id: gb
