steps:
  - title: Senekal’s War
    date: 1858
    when: "1858-03-19"
    borders: "1858-05-01"
    countries: [ls, za]
    body:
      - The border between the Free State and the Basotho had never been agreed. The British Resident, Major Henry Warden, drew a line in 1849 that gave farmers much land the Basotho regarded as theirs; Moshoeshoe rejected it, defeated Warden’s force at Viervoet in 1851, and held off an army under the Cape governor Sir George Cathcart at Berea in December 1852, after which he sent Cathcart a conciliatory letter that let both sides claim success. By the Bloemfontein Convention of February 1854 Britain gave up the Orange River Sovereignty, and the new Orange Free State inherited the dispute. Raids for cattle and quarrels over farms went on.
      - On 19 March 1858 President Jacobus Boshof declared war. Free State commandos under Jacobus Senekal advanced into the lowlands, burned the French Protestant mission at Morija and other stations, and in May reached Thaba Bosiu. They could not take the mountain, whose few paths up the cliffs Moshoeshoe’s men held. Meanwhile Basotho horsemen raided the farms behind them, and the burghers rode home to protect their families.
      - Boshof asked Sir George Grey, governor of the Cape, to mediate. An armistice was agreed on 1 June 1858, and by the Treaty of Aliwal North of 29 September 1858 Grey confirmed a boundary close to Warden’s line, with some changes in the Basotho’s favour. Neither side regarded it as final.
