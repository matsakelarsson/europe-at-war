  - title: The Seqiti War
    date: 1865–1866
    when: "1865-08-15"
    borders: "1865-08-15"
    countries: [ls, za]
    body:
      - In 1864 the Cape governor Sir Philip Wodehouse, asked to arbitrate, upheld the 1858 line, but Basotho continued to farm and graze beyond it. In June 1865 the Free State president, Jan Brand, declared war. The Free State had new cannon and its commandos, under Commandant-General Johan Fick, moved against the Basotho strongholds.
      - In August 1865 the burghers twice tried to storm Thaba Bosiu. On 15 August Commandant Louw Wepener led an assault up one of the passes and was shot dead near the top, and the attack failed. The Boers then laid siege to the mountain and, when that too failed, turned to destroying the Basotho’s crops and driving off their cattle across the lowlands, a strategy that brought hunger to the kingdom over the following winter.
      - In March 1866 Moshoeshoe’s son Molapo, in the north, made a separate peace and accepted Free State rule. In April 1866 Moshoeshoe, his people short of food, accepted the peace of Thaba Bosiu, which gave the Free State most of the kingdom’s arable lowlands, the Conquered Territory. Basotho families who stayed on the ceded land were to be removed.
    facts:
