    countries: [me, ba, tr]
    body:
      - From 1852 Luka Vukalović led the Orthodox clans of eastern Herzegovina in revolt against the Ottoman authorities, encouraged by Prince Danilo of Montenegro, who had turned the old prince-bishopric into a secular principality. When Vukalović rose again in late 1857 and beat off an Ottoman attack with Montenegrin help, the Porte sent an army under Hussein Pasha to settle accounts with Montenegro itself. On 10 May 1858 it took Vilusi and Grahovo, in the disputed borderland above the Bay of Kotor. About 7,500 Montenegrins under the prince’s elder brother, Mirko Petrović-Njegoš, held the plateau of Grahovac above them.
      - The Ottomans attacked on 11 May, and most of the casualties, some 3,000 Ottoman and 1,000 Montenegrin by one account, fell that day. Mirko refused a truce but let the Ottomans bury their dead. On 13 May, as Ottoman reinforcements arrived from Bosnia, the Montenegrins charged the Ottoman guns and routed the army, capturing a great quantity of arms. The victory, celebrated in South Slav songs, brought the great powers in. A commission marked out the border, giving Montenegro Grahovo, Rudine, the Župa of Nikšić, much of Drobnjaci, Upper Vasojevići and other districts, a de facto recognition of its independence.
