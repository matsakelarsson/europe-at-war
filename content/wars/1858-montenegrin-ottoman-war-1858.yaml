id: montenegrin-ottoman-war-1858
name: Montenegrin–Ottoman War of 1858
start: "1858-05-10"
end: "1858-05-13"
tier: B
summary: A short war in which an Ottoman army sent to crush Montenegrin support for the Herzegovinian rebels of Luka Vukalović was routed at Grahovac in May 1858 by Montenegrins under Grand Duke Mirko Petrović-Njegoš. The victory led the great powers to fix Montenegro’s border with the Ottoman Empire in 1858–1859, enlarging the principality and amounting to de facto recognition of its independence.
