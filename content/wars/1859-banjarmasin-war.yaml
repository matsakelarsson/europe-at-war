  - title: Antasari and the war on the Barito
    date: 1859–1905
    when: "1862"
    borders: "1862-10-11"
    countries: [id]
    body:
      - Antasari’s strength lay up the Barito, among Banjar, Bakumpai and Dayak communities bound to him by marriage and alliance, notably the Dayak chief Tumenggung Surapati. In December 1859 Surapati’s men boarded the Dutch steamer Onrust on the Barito, killed its crew and sank it. Dutch reinforcements under Major Verspyck won a series of engagements in the following years, and in early 1862 Hidayatullah, who had sided with the fighters, surrendered and was sent into exile at Cianjur in West Java with a monthly allowance.
      - On 14 March 1862 Antasari’s followers proclaimed him Panembahan Amiruddin Khalifatul Mukminin, head of the faithful. He died of smallpox on 11 October 1862 at Bayan Begok, in the forests of the upper Barito, and was buried there; his remains were moved to Banjarmasin in 1958. The Dutch declared the war over in 1863.
      - Antasari’s sons and other leaders, among them Gusti Muhammad Seman, kept up a government in the interior, known as the Pagustian, with forts along the upper Barito and its tributaries, and raided Dutch posts for four decades. Gusti Muhammad Seman was killed defending the fort of Baras Kuning on 24 January 1905, which ended the organised resistance. Indonesia declared Antasari a National Hero in 1968.
    facts:
      - [Onrust sunk, "December 1859"]
      - [Hidayatullah’s surrender, "early 1862"]
      - [Death of Antasari, "11 October 1862"]
      - [Death of Gusti Muhammad Seman, "24 January 1905"]
