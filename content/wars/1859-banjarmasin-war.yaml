id: banjarmasin-war
name: Banjarmasin War
start: "1859-04-28"
end: "1905-01-24"
tier: B
summary: "The war of the Banjar sultanate in south-eastern Borneo and its Dayak allies against the Dutch, known in Indonesia as the Banjar War (Perang Banjar). After Sultan Adam died in 1857 the Dutch installed Tamjidillah as sultan over the claims of Prince Hidayatullah, whom much of the court preferred, and exiled another claimant; resentment of Dutch interference, taxes and the new Dutch coal mines grew. On 28 April 1859 Prince Antasari, a member of the royal house, attacked the Oranje Nassau coal mine at Pengaron, and the rising spread across the sultanate and up the Barito River. The Dutch deposed Tamjidillah, declared the sultanate abolished in 1860 and annexed its lands, and by 1863 had broken the main resistance: Hidayatullah surrendered in 1862 and was exiled to Java, and Antasari, proclaimed head of the faithful by his followers, died of smallpox on the upper Barito in October 1862. His sons and other leaders fought on from forts in the interior for four more decades, until Gusti Muhammad Seman was killed at Baras Kuning on 24 January 1905."
countries: [id]
