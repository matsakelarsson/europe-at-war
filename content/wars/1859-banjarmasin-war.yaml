steps:
  - title: Pengaron and the end of the sultanate
    date: April 1859 – 1860
    when: "1859-04-28"
    borders: "1859-04-28"
    countries: [id]
    body:
      - The Banjar sultanate, centred on Martapura and the lower Barito, had been bound by treaties with the Dutch since the 18th century, and the Dutch residency stood at Banjarmasin. When Sultan Adam died in November 1857, the Dutch resident installed his grandson Tamjidillah, unpopular at court, rather than Prince Hidayatullah, whom Sultan Adam and many nobles favoured, and they later banished another claimant, Prince Prabu Anom, to Java. Dutch control of the succession, new taxes and labour demands, and the coal mines the government and private companies had opened at Pengaron and Kalangan turned many Banjar nobles, religious leaders and Dayak chiefs against them.
      - On 28 April 1859 fighters led by Prince Antasari, a member of the royal house, attacked the Oranje Nassau coal mine at Pengaron. On 1 May the Europeans at the Julia Hermina mine at Kalangan were killed, among them the English engineer and naturalist James Motley with his wife and children, and missionaries in the Dayak country were also killed. Colonel Augustus Andresen took command at Banjarmasin with troops from Java. In June 1859 the Dutch made Tamjidillah abdicate; in 1860 they declared the sultanate abolished and placed its lands under direct rule from Batavia.
      - The fighting spread on three fronts, in the Banua Lima districts up the Negara River, in Martapura and Tanah Laut under Kiai Demang Lehman, and along the Barito under Antasari. Demang Lehman attacked the Dutch post at Martapura on 30 June and the Bumi Selamat palace there on 30 August 1859, without success; in August he took the Dutch fort at Tabanio on the south coast, which the Dutch retook with the help of naval guns. On 27 September the Dutch stormed the fort of Gunung Lawak, but were harried so hard that they abandoned it.
