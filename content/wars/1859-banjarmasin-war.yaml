notes:
  - English and Dutch writers usually date the war 1859–1863, when the Dutch declared it over; Indonesian historians count the long resistance after 1863 as part of the same war and date it 1859–1905 or 1906.
  - Losses were poorly recorded. The figures usually cited are several thousand dead on each side, including about 200 Europeans, with two Dutch steamers lost.
