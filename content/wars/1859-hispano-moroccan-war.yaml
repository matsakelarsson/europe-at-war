steps:
  - title: Ceuta, Castillejos and Tetuán
    date: August 1859 – February 1860
    when: "1859-12"
    borders: "1860-02-06"
    countries: [es, ma]
    view:
      center: [-5.45, 35.72]
      size: [100, 80]
    body:
      - In August 1859 men of the Anjera, the tribe of the hills around Ceuta, tore down new Spanish fortification works outside the town. Leopoldo O’Donnell, prime minister and minister of war, demanded that the sultan punish them and cede more land around Ceuta. The old sultan, Abd al-Rahman, died in August, and his son Muhammad IV could not meet the Spanish demands; many in Spain also wanted a war that would unite the country behind O’Donnell’s government. The Cortes voted for war on 22 October 1859.
      - An army of about 45,000 men in three corps, under O’Donnell himself, crossed to Ceuta in November and December. For weeks it fought off Moroccan attacks in the hills around the town while cholera spread through its camps. On 1 January 1860 it set out south along the coast, and at Castillejos General Juan Prim led the charge that won the first battle. The army struggled on through rain and mud past Cabo Negro, supplied by the fleet, to the plain of the Martín river below Tetuán.
      - On 4 February the Spanish stormed the Moroccan camps outside Tetuán, defended by the army of the sultan’s brother Mawlay al-Abbas; about 450 Catalan volunteers who had arrived with Prim fought in the attack. Two days later the city surrendered, and O’Donnell was made Duke of Tetuán. In Spain the victory was celebrated in newspapers, songs and paintings, and the writer Pedro Antonio de Alarcón’s war diary became a best-seller.
    facts:
      - [War declared, "22 October 1859"]
      - [Spanish army, "about 45,000 men"]
      - [Battle of Castillejos, "1 January 1860"]
      - [Tetuán taken, "6 February 1860"]
