id: hispano-moroccan-war
name: Hispano-Moroccan War
start: "1859-10-22"
end: "1860-04-26"
tier: B
summary: "A war between Spain and Morocco, called the African War (Guerra de África) in Spain and the War of Tetuán in Morocco. After tribesmen of the Anjera destroyed new fortifications outside Ceuta in August 1859, the government of Leopoldo O’Donnell declared war in October and landed an army of about 45,000 men at Ceuta. Through the winter it fought its way south along the coast, winning at Castillejos on 1 January 1860, and on 4–6 February it defeated the army of Mawlay al-Abbas, the sultan’s brother, and entered Tetuán. After a last Spanish victory at Wad-Ras on 23 March, Morocco made peace by the Treaty of Wad-Ras of 26 April 1860: it enlarged the territories of Ceuta and Melilla, promised Spain a fishing post at Santa Cruz de la Mar Pequeña on the Atlantic coast, and agreed to pay an indemnity of 20 million duros, with Tetuán held by Spain until it was paid. Spain lost about 4,000 dead, most of them to cholera and other disease, and Morocco about 6,000. The war was hugely popular in Spain, while in Morocco the indemnity emptied the treasury and opened the way to European loans and control of the customs."
countries: [ma, es]
sides:
  - id: es
    name: Spain
    polities: [spain]
    ink: gold
    moves: Spanish moves
    success: Spanish success
  - id: ma
    name: Morocco
    polities: [morocco]
    ink: red
    moves: Moroccan moves
    success: Moroccan success
notes:
  - "Losses by the usual Spanish count: 4,040 dead, 1,152 of them killed in battle and 2,888 by disease, mostly cholera, and 4,994 wounded. Moroccan losses are estimated at about 6,000 dead; Moroccan sources on the war are few."
  - "The indemnity of 20 million duros was 400 million reales or 100 million pesetas. Britain, which had warned Spain not to take Tangier, lent Morocco part of the money in 1861. The site of Santa Cruz de la Mar Pequeña was later identified with Ifni, which Spain occupied only in 1934."
