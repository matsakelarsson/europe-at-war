  - title: Wad-Ras and the peace
    date: March – April 1860
    when: "1860-03-23"
    borders: "1860-04-26"
    countries: [es, ma]
    view:
      center: [-5.5, 35.7]
      size: [110, 80]
    body:
      - Muhammad IV rejected the peace terms O’Donnell offered after Tetuán, and his brother gathered a new army in the hills on the road to Tangier. On 23 March 1860 the Spanish advanced up the valley of Wad-Ras and defeated it after a hard day’s fighting, in which Basque volunteers took part. Britain had made clear that it would not accept a Spanish Tangier, and O’Donnell, whose army was weakened by disease, preferred peace to a march on Tangier or Fez.
      - By the Treaty of Wad-Ras, signed in Tetuán on 26 April 1860, Morocco enlarged the boundaries of Ceuta and Melilla, recognised Spain’s hold on the Chafarinas Islands, promised Spain land for a fishing post at Santa Cruz de la Mar Pequeña, allowed a Catholic mission at Tetuán and agreed to pay 20 million duros. Spain kept Tetuán as a pledge until 1862, when Morocco had paid much of the sum, partly with a British loan secured on its customs.
      - In Spain many felt the treaty was “a small peace for a great war”. For Morocco the defeat showed how far its army lagged behind European ones; Muhammad IV began to reform it, but the indemnity drained the treasury, the currency lost value, and the customs posts that paid the debt came under foreign supervision.
