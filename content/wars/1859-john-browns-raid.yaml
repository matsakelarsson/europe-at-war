notes:
  - Accounts differ slightly on the number of raiders, because some of Brown’s men stayed behind at the Kennedy Farm and a schoolhouse in Maryland, and on the number of enslaved people who joined or were taken along from nearby farms.
  - Brown had asked Frederick Douglass and Harriet Tubman to join him. Douglass, who met him at Chambersburg in August 1859, thought the attack on a federal arsenal hopeless and refused.
