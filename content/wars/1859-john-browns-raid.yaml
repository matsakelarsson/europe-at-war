id: john-browns-raid
name: John Brown’s raid on Harpers Ferry
start: "1859-10-16"
end: "1859-10-18"
tier: C
summary: "An armed attempt by the abolitionist John Brown to start a war of liberation against slavery. On the night of 16 October 1859 Brown and 21 men, 16 white and five Black (Osborne Perry Anderson, Shields Green, John Anthony Copeland, Lewis Sheridan Leary and Dangerfield Newby, who hoped to free his enslaved wife and children), crossed the Potomac from their base at the Kennedy Farm in Maryland and seized the federal armory, arsenal and rifle works at Harpers Ferry, Virginia (now West Virginia). They meant to arm enslaved people who joined them and carry the fight south through the Appalachians, but few joined. They took hostages, among them Lewis Washington, a great-grandnephew of George Washington; the first man they killed was Heyward Shepherd, a free Black railway baggage master. Militia from Virginia and Maryland trapped the raiders in the armory’s engine house, and on the morning of 18 October a company of US Marines sent from Washington under Colonel Robert E. Lee, with Lieutenant J. E. B. Stuart, stormed it. Ten raiders were killed, among them two of Brown’s sons, and the raiders killed four townspeople and a Marine. Brown was tried by Virginia for treason against the state, murder and inciting enslaved people to rebel, and was hanged at Charles Town on 2 December 1859; six of his men were hanged after him, and five escaped. The raid deepened the divide between North and South: many Northerners came to see Brown as a martyr against slavery, while white Southerners saw proof of an abolitionist plot to raise a rebellion of the enslaved, and secessionists used it a year later."
