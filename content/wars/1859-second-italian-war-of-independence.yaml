  - title: Villafranca and Zürich
    date: July 1859 – March 1860
    when: "1859-07-11"
    borders: "1860-03-24"
    countries: [it, fr, at, ch]
    body:
      - Shaken by the slaughter, by the strength of the Austrian fortresses and by Prussia’s mobilisation on the Rhine, Napoleon III proposed an armistice without consulting his ally and met Francis Joseph at Villafranca on 11 July. Austria would cede Lombardy, without Mantua and Peschiera, to France, which would hand it to Sardinia, and the rulers of Tuscany and Modena were to return to their thrones. Cavour, furious, resigned. The Treaty of Zürich confirmed the terms on 10 November 1859.
      - The restorations never happened. Assemblies in Tuscany, Parma, Modena and the Romagna voted to join Sardinia, and after plebiscites in March 1860, held under Cavour, now back in office, they were annexed. In return, by the Treaty of Turin of 24 March 1860, Sardinia ceded Savoy and Nice to France, which plebiscites confirmed in April. Garibaldi, who had been born in Nice, never forgave Cavour. The pope excommunicated those who had taken part in seizing the Romagna.
    facts:
      - [Armistice of Villafranca, "11 July 1859"]
      - [Treaty of Zürich, "10 November 1859"]
      - [Treaty of Turin, "24 March 1860, Savoy and Nice to France"]
