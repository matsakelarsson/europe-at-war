id: second-italian-war-of-independence
name: Second Italian War of Independence
start: "1859-04-29"
end: "1859-11-10"
tier: B
summary: A war in 1859 in which France under Napoleon III and the Kingdom of Sardinia defeated Austria at Magenta and Solferino. By the armistice of Villafranca and the Treaty of Zürich Austria gave up Lombardy, which passed to Sardinia; Tuscany, Parma, Modena and the Papal Romagna then voted to join Sardinia, and in 1860 Sardinia ceded Savoy and Nice to France.
