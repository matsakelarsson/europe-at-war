  - title: Solferino
    date: 24 June 1859
    when: "1859-06-24"
    borders: "1859-06-24"
    countries: [it, fr, at]
    body:
      - Emperor Francis Joseph took command of the Austrian army himself and on 23 June led it back across the Mincio, meeting the advancing allies the next morning in the hills south of Lake Garda. Together the armies had well over a quarter of a million men, and all three were led by their monarchs. The French stormed the hill and tower of Solferino in the centre after hours of fighting, while the Sardinians fought all day for the heights of San Martino to the north. In the afternoon a violent storm broke over the battlefield, and the Austrians withdrew across the Mincio.
      - Nearly 40,000 men were killed, wounded or missing. Thousands of wounded lay for days without care in Castiglione delle Stiviere and the villages around, where a Swiss businessman, Henri Dunant, organised help from the townspeople. His book A Memory of Solferino, published in 1862, led to the founding of the International Committee of the Red Cross in 1863 and the first Geneva Convention in 1864. The Austrians held the Quadrilateral, and the war seemed likely to go on.
    facts:
      - [Battle of Solferino and San Martino, "24 June 1859, French and Sardinian victory"]
      - [Commanders, "Napoleon III, Victor Emmanuel II; Francis Joseph"]
      - [Losses, "nearly 40,000 killed, wounded or missing"]
    markers:
