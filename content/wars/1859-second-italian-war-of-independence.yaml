steps:
  - title: Magenta
    date: April – June 1859
    when: "1859-04-29"
    borders: "1859-06-08"
    countries: [it, fr, at]
    body:
      - In July 1858, at Plombières, the French emperor Napoleon III secretly promised Count Camillo Cavour, Sardinia’s prime minister, to help drive Austria out of northern Italy in return for Savoy and Nice, provided Austria could be made to look the aggressor. Sardinia mobilised and enrolled volunteers from all over Italy, and on 23 April 1859 Austria demanded that it disarm. When Sardinia refused, Austria declared war, and on 29 April General Ferenc Gyulai’s army crossed the Ticino into Piedmont. He advanced slowly through flooded country, while French troops arrived by rail over the Alps and by sea at Genoa.
      - After clashes at Montebello on 20 May and Palestro on 30–31 May the allies swung north and crossed the Ticino, while Giuseppe Garibaldi’s volunteers, the Hunters of the Alps, beat the Austrians at Varese and San Fermo near Como. On 4 June the French under Napoleon III and General Patrice de MacMahon defeated Gyulai at Magenta, and on 8 June Napoleon and King Victor Emmanuel II rode into Milan. The Austrians fell back east towards the fortresses of the Quadrilateral, and risings drove out the rulers of Tuscany, Parma and Modena and the Papal governors of the Romagna.
    facts:
      - [Austrian ultimatum, "23 April 1859"]
      - [Battle of Magenta, "4 June 1859, French and Sardinian victory"]
      - [Allies enter Milan, "8 June 1859"]
