        side: fr
        name: Solferino
        date: 24 June 1859
        text: The French took the village and its medieval tower, the Spia d’Italia, breaking the Austrian centre.
        lonlat: [10.566, 45.372]
        lp: b
      - kind: battle
        side: sa
        name: San Martino
        date: 24 June 1859
        text: The Sardinian army attacked the heights several times against Ludwig von Benedek’s corps and took them in the evening as the Austrians withdrew.
        lonlat: [10.567, 45.435]
