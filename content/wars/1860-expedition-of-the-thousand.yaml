id: expedition-of-the-thousand
name: Expedition of the Thousand
start: "1860-05-05"
end: "1861-03-20"
tier: B
summary: The campaign in which Giuseppe Garibaldi and about a thousand volunteers landed in Sicily in May 1860 and, joined by Sicilian insurgents and thousands more volunteers, overthrew the Bourbon Kingdom of the Two Sicilies. The Sardinian army meanwhile took the Marche and Umbria from the Papal States and besieged King Francis II in Gaeta, which surrendered in February 1861; the south was joined to the new Kingdom of Italy, proclaimed on 17 March 1861.
