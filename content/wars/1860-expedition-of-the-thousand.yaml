notes:
  - Garibaldi’s force grew from about 1,100 men at the start to tens of thousands, organised from July as the Southern Army; its volunteers wore the red shirts that gave them their name, the Redshirts. Sicily and Naples formally joined the Kingdom of Sardinia after the plebiscites of 21 October 1860.
