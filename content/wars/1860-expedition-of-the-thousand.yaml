  - title: Castelfidardo and Gaeta
    date: September 1860 – March 1861
    when: "1860-09-11"
    borders: "1861-03-17"
    countries: [it]
    body:
      - To keep Garibaldi from marching on Rome, which would have meant war with France, and to take his revolution in hand, Cavour sent the Sardinian army into the Papal Marche and Umbria on 11 September, with Napoleon III’s tacit consent. On 18 September General Enrico Cialdini defeated the Papal army of the French general Christophe de Lamoricière, which included Catholic volunteers from France, Belgium and Ireland, at Castelfidardo near Loreto, and on 29 September Ancona surrendered after a siege by land and sea. Victor Emmanuel then led his army south through the Abruzzi into the Kingdom of Naples.
      - Francis II and Queen Maria Sophia held out in Gaeta with what remained of the Bourbon army. Cialdini besieged the fortress from 5 November; a French squadron kept the sea open until January 1861, and on 13 February, short of supplies and struck by typhus after weeks of bombardment, the garrison surrendered. The royal couple went into exile in Rome. The first Italian parliament proclaimed Victor Emmanuel King of Italy on 17 March 1861, and the last Bourbon strongholds, the citadel of Messina and Civitella del Tronto, surrendered in March. Rome and Venetia remained outside the new kingdom, and in the south a long guerrilla war began.
    facts:
      - [Battle of Castelfidardo, "18 September 1860, Sardinian victory"]
      - [Ancona surrenders, "29 September 1860"]
      - [Gaeta surrenders, "13 February 1861"]
    markers:
      - kind: taken
        side: sa
        name: Perugia
        date: 14 September 1860
        text: General Manfredo Fanti’s troops stormed the city, held by foreign regiments of the Papal army.
        lonlat: [12.389, 43.112]
      - kind: battle
        side: sa
        name: Battle of Castelfidardo
        date: 18 September 1860
        text: Cialdini’s corps scattered Lamoricière’s army as it tried to reach Ancona; Lamoricière escaped to the fortress with a few hundred men.
        lonlat: [13.56, 43.46]
        lp: b
      - kind: siege
        side: sa
        name: Ancona
        date: 24–29 September 1860
        text: Besieged from land and bombarded by the Sardinian fleet, the port surrendered with its garrison and Lamoricière.
        lonlat: [13.51, 43.607]
      - kind: siege
        side: sa
        name: Gaeta
        date: 5 November 1860 – 13 February 1861
        text: The last stand of the Bourbon kingdom; Queen Maria Sophia’s visits to the batteries made her a heroine to legitimists across Europe.
        lonlat: [13.555, 41.222]
      - kind: taken
        side: sa
        name: Civitella del Tronto
        date: 20 March 1861
        text: The fortress surrendered three days after the Kingdom of Italy was proclaimed, the last to fall.
        lonlat: [13.67, 42.77]
