steps:
  - title: Sicily
    date: May – July 1860
    when: "1860-05-05"
    borders: "1860-07-28"
    countries: [it]
    body:
      - A revolt in Palermo on 4 April 1860 was quickly put down but lived on in the countryside. Garibaldi gathered volunteers near Genoa, and Cavour, Sardinia’s prime minister, neither stopped nor openly helped him. On the night of 5–6 May about 1,100 men, most of them from Lombardy, Venetia and Liguria and many of them students and artisans, sailed from Quarto in two steamers and landed at Marsala on 11 May. At Salemi Garibaldi declared himself dictator of Sicily in the name of King Victor Emmanuel II. On 15 May at Calatafimi his volunteers, with Sicilian irregulars, drove a larger Neapolitan force off a terraced hill.
      - Garibaldi feinted towards Corleone, then broke into Palermo on 27 May. After three days of street fighting, while Bourbon warships and the fortress shelled the city, the garrison of some 20,000 men agreed to an armistice and in June left by sea. Volunteers poured in from the north, and on 20 July Garibaldi defeated the Neapolitans at Milazzo; Messina was given up at the end of July, though its citadel held out. Peasants who rose against their landlords in the hope of land met harsh repression, and at Bronte in August Garibaldi’s lieutenant Nino Bixio had five men shot after a summary trial.
    facts:
      - [Landing at Marsala, "11 May 1860"]
      - [Battle of Calatafimi, "15 May 1860, Garibaldine victory"]
      - [Battle of Milazzo, "20 July 1860, Garibaldine victory"]
    markers:
      - kind: event
        side: gar
