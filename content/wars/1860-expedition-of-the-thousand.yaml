  - title: Naples and the Volturno
    date: August – October 1860
    when: "1860-08-19"
    borders: "1860-10-26"
    countries: [it]
    body:
      - On the night of 18–19 August Garibaldi crossed the Strait of Messina with about 3,700 men, landed near Melito and took Reggio on 21 August. The Bourbon army in Calabria, demoralised and badly led, surrendered or melted away, and Garibaldi advanced so fast that he outran most of his troops. King Francis II left Naples on 6 September for the fortress of Gaeta, and the next day Garibaldi arrived in the capital by train with a few companions and was greeted by cheering crowds.
      - Francis II still had a large and loyal army on the Volturno, around the fortress of Capua. On 1–2 October it attacked Garibaldi’s volunteers along the river in the largest battle of the campaign, and was beaten back with help from Sardinian troops landed at Naples. Plebiscites on 21 October approved union with Sardinia by huge majorities, though voting was public and critics doubted the result. On 26 October Garibaldi met Victor Emmanuel near Teano and greeted him as King of Italy. He handed over his conquests and on 9 November sailed home to the island of Caprera.
    facts:
      - [Crossing of the Strait, "18–19 August 1860"]
      - [Garibaldi enters Naples, "7 September 1860"]
      - [Battle of the Volturno, "1–2 October 1860, Garibaldine victory"]
