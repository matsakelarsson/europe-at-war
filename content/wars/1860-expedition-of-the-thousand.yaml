        name: Palermo
        date: 27–30 May 1860
        text: The volunteers and the city’s insurgents fought their way in from the Porta Termini; the garrison capitulated on 6 June.
        lonlat: [13.361, 38.116]
      - kind: battle
        side: gar
        name: Milazzo
        date: 20 July 1860
        text: A hard-fought victory that opened the way to Messina; the Neapolitan garrison of the castle left by sea a few days later.
        lonlat: [15.243, 38.221]
      - kind: event
