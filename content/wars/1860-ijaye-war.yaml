id: ijaye-war
name: Ijaye War
start: "1860-04"
end: "1865"
tier: C
summary: "A war among the Yoruba successor states of the Oyo Empire. When Alaafin Atiba died in 1859, his son Adelu succeeded him at New Oyo, against the old custom that the crown prince died with his father. Ibadan, the strongest of the new Yoruba towns, accepted Adelu; Kurunmi, the ruler of Ijaye and holder of Oyo’s highest military title, refused to do homage and seized a party of the alaafin’s men. In April 1860 Ibadan’s war chiefs, led by Balogun Ibikunle and Ogunmola, declared war on Ijaye. Abeokuta and its Egba army came to Ijaye’s help, and Ijebu also took its side, fearing Ibadan’s power. Ibadan besieged the city, which missionaries in the 1850s had estimated at 40,000–100,000 people, and cut off its food supplies; Kurunmi’s five sons were killed and he himself died in June 1861. Ijaye, starving, fell on 17 March 1862 and was destroyed; its survivors fled to Abeokuta, where they settled in a quarter still called Ago Ijaye, while many others were enslaved. The war went on between Ibadan and the Egba and Ijebu over the roads to the coast, which both sides closed to each other’s trade. Britain, which had annexed Lagos in 1861 and wanted the trade routes open, intervened in March 1865, when troops from Lagos drove the Egba from their camp outside Ikorodu, a town under Lagos’s protection. Ibadan emerged as the leading Yoruba military power, and the rivalries left unresolved led to the Kiriji War of 1877–1893."
