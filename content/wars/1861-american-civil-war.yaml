  - title: Vicksburg
    date: December 1862 – July 1863
    when: "1863-05-18"
    borders: "1863-07-04"
    countries: [us]
    body:
      - Vicksburg stood on high bluffs over a bend of the Mississippi, and its guns and those of Port Hudson, 200 km downstream, kept the river closed to the Union and the Confederacy joined to Arkansas, Louisiana and Texas. Grant’s first advance, overland along the Mississippi Central Railroad, ended when Earl Van Dorn’s cavalry burned his supply base at Holly Springs on 20 December 1862, and Sherman’s attack by river was beaten back at Chickasaw Bayou north of the city on 29 December. Through the winter canals and expeditions through the bayous failed.
      - "In the spring Grant marched his army down the Louisiana bank, and on the night of 16 April David Dixon Porter’s gunboats and transports ran past the Vicksburg batteries. While Benjamin Grierson’s cavalry rode through the length of Mississippi to Baton Rouge, drawing off Confederate troops, Grant crossed the river at Bruinsburg on 30 April. In three weeks he won five battles: Port Gibson on 1 May, Raymond on 12 May, Jackson, the state capital, on 14 May, Champion Hill on 16 May, where he beat John C. Pemberton’s field army, and Big Black River Bridge on 17 May. His assaults on the Vicksburg lines on 19 and 22 May failed, and he laid siege to the city."
      - "For six weeks Vicksburg was shelled from land and river. Civilians lived in caves dug into the hillsides, and soldiers and townspeople ran short of food. On 4 July 1863, the day after Gettysburg, Pemberton surrendered his army of about 29,500 men, who were paroled. Port Hudson, besieged by Nathaniel Banks since May, surrendered on 9 July. The Mississippi was in Union hands from source to mouth, and the Confederacy was cut in two; Lincoln wrote that “the Father of Waters again goes unvexed to the sea.” Thousands of enslaved people in the valley came into the Union lines, and many of the men enlisted in the new Black regiments raised there."
    facts:
      - [Holly Springs raid, "20 December 1862"]
      - [Grant crosses at Bruinsburg, "30 April 1863"]
      - [Champion Hill, "16 May 1863, Union victory"]
      - [Siege of Vicksburg, "18 May – 4 July 1863, about 29,500 Confederates surrendered"]
      - [Port Hudson surrendered, "9 July 1863"]
