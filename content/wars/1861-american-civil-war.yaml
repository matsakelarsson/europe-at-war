  - title: The Overland Campaign and Petersburg
    date: May 1864 – March 1865
    when: "1864-05-05"
    borders: "1864-06-15"
    countries: [us]
    body:
      - "As general-in-chief, Grant planned attacks on every front at once and travelled with Meade’s Army of the Potomac, about 120,000 men, against Lee’s 65,000. They crossed the Rapidan on 4 May 1864 into the Wilderness, where two days of fighting in dense thickets and burning woods cost the Union some 17,000 men. Instead of retreating, as his predecessors had, Grant moved south. At Spotsylvania Court House the armies fought for two weeks; at the “Bloody Angle” on 12 May they fought hand to hand for nearly a day. Sheridan’s cavalry rode on Richmond, and J. E. B. Stuart was mortally wounded at Yellow Tavern. After the North Anna, Grant attacked at Cold Harbor on 3 June and lost thousands of men in less than an hour, an assault he later regretted."
      - Grant then slipped across the James River on a pontoon bridge more than 600 m long and attacked Petersburg, the railway junction that fed Richmond, on 15–18 June, but Beauregard held until Lee arrived. A siege of nine and a half months followed, with trench lines growing to about 50 km. On 30 July Union miners blew a great crater under the Confederate lines, but the attack that followed failed. In the Overland Campaign the Union lost about 55,000 men and the Confederacy perhaps 30,000–35,000, losses Lee could not replace; in the North, war-weariness grew and critics called Grant a butcher.
      - Lee sent Jubal Early through the Shenandoah Valley to threaten Washington. Early beat a scratch Union force at the Monocacy on 9 July and reached the city’s defences at Fort Stevens on 11–12 July, where Lincoln came under fire, before withdrawing. Grant gave Philip Sheridan an army to clear the Valley; he beat Early at Winchester and Fisher’s Hill in September, his men burned barns, mills and crops so that the Valley could no longer feed Lee’s army, and he routed Early at Cedar Creek on 19 October. These victories and the fall of Atlanta helped Lincoln win re-election on 8 November 1864 against George McClellan, whose party called for an armistice.
    facts:
      - [Wilderness, "5–7 May 1864"]
      - [Spotsylvania Court House, "8–21 May 1864"]
      - [Cold Harbor, "31 May – 12 June 1864"]
      - [Siege of Petersburg, "June 1864 – April 1865"]
      - [Lincoln re-elected, "8 November 1864"]
