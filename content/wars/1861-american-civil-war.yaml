steps:
  - title: Secession and Fort Sumter
    date: November 1860 – May 1861
    when: "1860-12-20"
    borders: "1861-04-12"
    countries: [us]
    body:
      - "In 1860 nearly four million people were enslaved in the United States, more than one in three of the people of the states that would form the Confederacy, and the cotton they grew was the country’s largest export. For a decade the question of whether slavery could spread into the western territories had divided the nation. On 6 November 1860 Abraham Lincoln, the candidate of the Republican Party, which opposed that spread, was elected president without a single electoral vote from the South, where he was not even on the ballot in ten states. South Carolina declared its secession on 20 December 1860, and by 1 February 1861 Mississippi, Florida, Alabama, Georgia, Louisiana and Texas had followed. Their conventions said why; Mississippi’s declaration stated, “Our position is thoroughly identified with the institution of slavery, the greatest material interest of the world.”"
      - "Delegates of the seven states met at Montgomery, Alabama, on 4 February 1861, formed the Confederate States of America and chose Jefferson Davis of Mississippi as president. Its constitution protected slavery explicitly. On 21 March the vice-president, Alexander Stephens, told an audience in Savannah that the new government’s “corner-stone rests upon the great truth that the negro is not equal to the white man; that slavery, subordination to the superior race, is his natural and normal condition.” The seceding states seized federal forts, arsenals and mints; compromise proposals in Congress failed. In his inaugural address of 4 March Lincoln promised not to interfere with slavery where it existed, but declared secession void and said he would hold the federal places that remained, above all Fort Sumter in Charleston harbour and Fort Pickens at Pensacola."
      - When Lincoln told South Carolina that he was sending provisions to Sumter’s small garrison, the Confederate government ordered General P. G. T. Beauregard to take the fort. His batteries opened fire before dawn on 12 April 1861, and Major Robert Anderson surrendered the next day; no one had been killed by the bombardment. On 15 April Lincoln called on the states for 75,000 militiamen to put down the rebellion, and on 19 April he proclaimed a blockade of the Southern ports. Rather than fight against the seceded states, Virginia’s convention voted to secede on 17 April, followed by Arkansas, Tennessee and North Carolina in May. The Confederate capital moved to Richmond. The eleven Confederate states had about nine million people, some 3.5 million of them enslaved; the Union states had about 22 million.
    facts:
      - [South Carolina secedes, "20 December 1860"]
      - [Confederacy formed at Montgomery, "4 February 1861"]
      - [Fort Sumter, "12–13 April 1861"]
      - [Lincoln calls for 75,000 militia, "15 April 1861"]
