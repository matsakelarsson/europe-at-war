  - title: The Peninsula and Second Bull Run
    date: March – August 1862
    when: "1862-03-17"
    borders: "1862-06-25"
    countries: [us]
    body:
      - In March 1862 McClellan shipped the Army of the Potomac, more than 100,000 men, down the Chesapeake to Fort Monroe to advance on Richmond from the south-east. He spent a month besieging a much smaller force at Yorktown, fought at Williamsburg on 5 May and by late May was within sight of Richmond’s church spires. Norfolk was abandoned and the Virginia scuttled, but Confederate batteries at Drewry’s Bluff turned back the Union gunboats on the James. At Seven Pines on 31 May–1 June Joseph E. Johnston was wounded, and Jefferson Davis gave command to Robert E. Lee, who named his force the Army of Northern Virginia.
      - Meanwhile Stonewall Jackson, with about 17,000 men, marched up and down the Shenandoah Valley, beating three Union forces in turn at McDowell, Front Royal, Winchester, Cross Keys and Port Republic between May and early June. His campaign kept tens of thousands of Union troops away from Richmond. Jackson then joined Lee, who attacked McClellan in the Seven Days battles from 25 June to 1 July, at Mechanicsville, Gaines’ Mill, Savage’s Station, Glendale and Malvern Hill. Lee lost more men, about 20,000 against 16,000, and Union artillery cut down his last attack at Malvern Hill, but McClellan retreated to the James and Richmond was saved.
      - "Lincoln brought John Pope from the West to command a new Army of Virginia and recalled McClellan’s army from the Peninsula. Lee struck north before the two could join. Jackson beat part of Pope’s army at Cedar Mountain on 9 August, then marched around Pope’s flank and destroyed his supply depot at Manassas Junction. At Second Bull Run on 28–30 August Pope attacked Jackson, and James Longstreet’s corps crushed his left flank; about 22,000 men fell, and Pope fell back on Washington. In three months Lee had moved the war from the outskirts of Richmond to those of Washington."
    facts:
      - [Siege of Yorktown, "5 April – 4 May 1862"]
      - [Lee takes command, "1 June 1862"]
      - [Seven Days, "25 June – 1 July 1862, about 36,000 casualties"]
      - [Second Bull Run (Second Manassas), "28–30 August 1862, Confederate victory"]
