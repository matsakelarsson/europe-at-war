notes:
  - "Causes. The Confederacy was formed to protect slavery. South Carolina, Mississippi, Georgia and Texas published declarations of the causes of their secession that named the threat to slavery as the reason, and the Confederate constitution protected it in so many words. After the war former Confederate leaders and the writers of the “Lost Cause” argued that the South had fought for states’ rights rather than slavery; historians today generally reject that view, while discussing how the expansion of slavery into the West, party politics and economic interests shaped the crisis. The Union went to war to restore the Union; ending slavery became a war aim with the Emancipation Proclamation."
  - "Deaths. For more than a century the toll was given as about 620,000 soldiers, roughly 360,000 Union and 260,000 Confederate, from the counts of William F. Fox and Thomas L. Livermore. In 2011 the demographer J. David Hacker estimated from the censuses of 1850–1880 that about 750,000 soldiers died, with a range of 650,000 to 850,000. About two-thirds of the soldiers who died were killed by disease. Civilian deaths, including those of formerly enslaved people in crowded refugee camps, were never counted."
  - "Names. Union officials called the war the War of the Rebellion; “War Between the States” was preferred by many former Confederates. Many battles have two names, the Union one usually after a stream and the Confederate one after a town: Bull Run (Manassas), Antietam (Sharpsburg), Stones River (Murfreesboro), Pea Ridge (Elkhorn Tavern). Shiloh, the Confederate name, was Pittsburg Landing in many Union reports."
  - "Dates. The war is usually dated from Fort Sumter (12 April 1861) to the surrender of the Confederate Trans-Mississippi Department, agreed at New Orleans on 26 May 1865. Stand Watie surrendered on 23 June 1865, the raider CSS Shenandoah on 6 November 1865, and President Andrew Johnson declared the insurrection over on 20 August 1866. Casualty figures for battles are the usual ones (killed, wounded, captured and missing) from the American Battlefield Trust and the National Park Service."
  - "The Dakota War of 1862, the Navajo campaign and Long Walk of 1863–1864 and the Sand Creek massacre of 1864, fought by the Union in the West during the war, have their own stories."
