  - title: West of the Mississippi and in Indian Territory
    date: 1861–1865
    when: "1862-03-07"
    borders: "1862-03-07"
    countries: [us]
    body:
      - "Indian Territory, today’s Oklahoma, was the land of the Five Nations, the Cherokee, Muscogee (Creek), Seminole, Choctaw and Chickasaw, who had been forced from the South-East in the 1830s, and of other removed nations. Many of their leading families held enslaved Black people; the Oklahoma Historical Society estimates that about one in seven of the territory’s roughly 100,000 people were enslaved. In the spring of 1861 the US Army abandoned its forts there and federal payments owed under the treaties stopped. The Confederate commissioner Albert Pike offered treaties that guaranteed the nations’ lands, gave them delegates in the Confederate Congress and recognised slavery, and the Muscogee, Choctaw, Chickasaw and Seminole governments signed in July and August. The Cherokee principal chief John Ross had sought neutrality, but his nation signed on 7 October, and Stand Watie raised a Cherokee regiment for the Confederacy."
      - "Many refused. Opothleyahola, an elderly Muscogee leader, gathered some 7,000 Muscogee, Seminole and others, with Black people both free and escaped, and set out for Kansas. Confederate troops under Douglas Cooper and James McIntosh, with Choctaw, Chickasaw, Muscogee and Cherokee regiments, attacked them at Round Mountain on 19 November, at Chusto-Talasah on 9 December and at Chustenahlah on 26 December 1861, where the camp was overrun; the survivors fled through a blizzard to Kansas, where many died in the refugee camps. From them the Union raised the Indian Home Guard regiments. At Pea Ridge in Arkansas on 7–8 March 1862, Samuel Curtis’s Union army defeated Earl Van Dorn’s, which included Pike’s Cherokee, Muscogee, Choctaw and Chickasaw troops, and secured Missouri for the Union. In 1863 the Cherokee split: a council loyal to Ross repudiated the Confederate treaty and abolished slavery, while Watie led the Confederate Cherokee. At Honey Springs on 17 July 1863, the largest battle in the territory, James Blunt’s Union force, with the Indian Home Guard and the 1st Kansas Colored Infantry, defeated Cooper. Raids and reprisals went on to the end; about 10,000 people in Indian Territory died as a result of the war."
      - On the Kansas–Missouri border the war of Bleeding Kansas went on as a guerrilla war. Confederate guerrillas under William Quantrill burned Lawrence on 21 August 1863 and killed about 150 to 190 men and boys; the Union answered with General Order No. 11, which drove the people of most of four Missouri border counties from their homes. Sterling Price’s last invasion of Missouri ended in defeat at Westport on 23 October 1864, and a Union drive up the Red River in Louisiana was turned back at Mansfield in April 1864. In New Mexico, Henry Sibley’s Texans won at Valverde on 21 February 1862 and took Albuquerque and Santa Fe, but at Glorieta Pass on 26–28 March Colorado volunteers under John Chivington, guided by New Mexican volunteers under Manuel Chaves, destroyed their supply train, and they retreated to Texas. The Confederacy’s Territory of Arizona was lost by the summer of 1862.
      - With the regular army gone east, volunteer regiments fought the Native nations of the West. Besides the wars that have their own stories, the Dakota War in Minnesota in 1862, Kit Carson’s campaign against the Navajo and the Sand Creek massacre of 1864, California volunteers under Patrick Connor attacked a Northwestern Shoshone winter camp on the Bear River in Idaho on 29 January 1863 and killed an estimated 250 to 500 people, many of them women and children.
    facts:
      - [Confederate treaties with the Five Nations, "July–October 1861"]
      - [Pea Ridge (Elkhorn Tavern), "7–8 March 1862, Union victory"]
      - [Glorieta Pass, "26–28 March 1862, Union victory"]
      - [Honey Springs, "17 July 1863, Union victory"]
