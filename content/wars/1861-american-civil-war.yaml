  - title: Chancellorsville and Gettysburg
    date: May – July 1863
    when: "1863-07-01"
    borders: "1863-07-03"
    countries: [us]
    body:
      - At Chancellorsville, west of Fredericksburg, Joseph Hooker’s army of about 130,000 crossed the Rappahannock upstream at the end of April 1863 and got behind Lee, who had about 60,000. Lee divided his army once more, and on 2 May Jackson marched around the Union right and routed the XI Corps. That night Jackson was shot by mistake by his own men, and he died on 10 May. Hooker withdrew across the river on 6 May. It was Lee’s greatest victory, but he lost some 13,000 men and Hooker about 17,000.
      - In June Lee marched north through the Shenandoah and Cumberland valleys into Pennsylvania, to feed his army, spare Virginia and win a victory that might strengthen the peace movement in the North. His cavalry fought the largest cavalry battle of the war at Brandy Station on 9 June, and his infantry routed the Union garrison at Winchester. In Pennsylvania his army took food, horses and money, and seized Black men, women and children, both free people and people who had escaped slavery, and sent them south into slavery. On 28 June George G. Meade replaced Hooker.
      - "The armies met at Gettysburg on 1 July. The Confederates drove two Union corps through the town onto Cemetery Hill and Culp’s Hill. On 2 July Longstreet attacked the Union left at Little Round Top, Devil’s Den, the Wheatfield and the Peach Orchard, and Ewell the Union right, but Meade’s lines held. On 3 July, after a two-hour cannonade, about 12,500 men under George Pickett, James Johnston Pettigrew and Isaac Trimble advanced across open fields against the Union centre on Cemetery Ridge; more than half were killed, wounded or captured. Some 51,000 men fell in the three days: about 23,000 Union, and an estimated 23,000 to 28,000 Confederate. Lee retreated on 4 July and recrossed the Potomac at Williamsport on 13–14 July. On 19 November Lincoln dedicated the soldiers’ cemetery with the Gettysburg Address, calling for “a new birth of freedom”."
      - The Union had begun conscription in March 1863; a man could pay $300 to avoid the draft. When the first names were drawn in New York, rioters, many of them Irish immigrants, attacked draft offices, the police and above all Black New Yorkers from 13 to 16 July. They lynched at least eleven Black men and burned the Colored Orphan Asylum, and at least 119 people died before troops sent from Gettysburg restored order. The Confederacy had conscripted men since April 1862 and exempted one white man on every plantation with twenty or more enslaved people, which many poor Southerners called a rich man’s war and a poor man’s fight.
    facts:
      - [Chancellorsville, "30 April – 6 May 1863, Confederate victory"]
      - [Gettysburg, "1–3 July 1863, Union victory"]
      - [Losses at Gettysburg, "about 51,000 killed, wounded, captured and missing"]
      - [New York draft riots, "13–16 July 1863"]
