id: american-civil-war
name: American Civil War
start: "1861-04-12"
end: "1865-05-26"
tier: A
summary: "The war between the United States (the Union) and the Confederate States of America, formed by eleven Southern slave states that seceded to preserve slavery after Abraham Lincoln, who opposed its spread into the western territories, was elected president in 1860. It began with the Confederate bombardment of Fort Sumter on 12 April 1861. The Union, with more than twice the population and most of the country’s industry, railways and ships, blockaded the Southern coast, took the Mississippi Valley in 1862–1863 and split the Confederacy in two, while Robert E. Lee’s Army of Northern Virginia defended Richmond and twice invaded the North, to be turned back at Antietam (1862) and Gettysburg (1863). Lincoln’s Emancipation Proclamation of 1 January 1863 made the end of slavery a Union war aim, and about 179,000 Black soldiers, most of them formerly enslaved, served in the Union army. Ulysses S. Grant’s Overland Campaign of 1864 pinned Lee at Petersburg, William T. Sherman took Atlanta and marched to the sea, and Lee surrendered at Appomattox on 9 April 1865; the last Confederate forces surrendered in May and June. The war was fought also in the Far West and in Indian Territory, where the Cherokee, Muscogee and Seminole nations divided between the two sides. An estimated 620,000 to 750,000 soldiers died, more than in any other American war. The Thirteenth Amendment of December 1865 abolished slavery throughout the United States, freeing about four million people."
countries: [us, bs, bm, cu, mx, gb]
