  - title: Bull Run and the border states
    date: April – December 1861
    when: "1861-07-21"
    borders: "1861-07-21"
    countries: [us]
    body:
      - "Four slave states, Delaware, Maryland, Kentucky and Missouri, stayed in the Union, and Lincoln worked to keep them there. In Maryland a crowd attacked Massachusetts troops passing through Baltimore on 19 April, and four soldiers and twelve civilians were killed; Lincoln suspended habeas corpus and later had secessionist legislators arrested. In Missouri Union troops under Nathaniel Lyon captured the pro-secession militia at Camp Jackson in St. Louis on 10 May, and a riot followed in which 28 civilians died. Lyon was killed at Wilson’s Creek on 10 August, and Sterling Price’s Missouri State Guard took Lexington in September, but the state stayed largely in Union hands, with rival governments and a guerrilla war that lasted until 1865. Kentucky declared itself neutral until the Confederates occupied Columbus on 3 September; Ulysses S. Grant took Paducah three days later. In north-western Virginia, where few people held slaves, Union victories at Philippi and Rich Mountain allowed Unionists meeting at Wheeling to set up a loyal government of Virginia, the start of the state of West Virginia."
      - "In Washington the cry was “On to Richmond!”. On 21 July 1861 General Irvin McDowell’s army of about 35,000, most of them three-month volunteers, attacked the Confederates behind Bull Run near Manassas Junction. Joseph E. Johnston brought his troops from the Shenandoah Valley by rail to join Beauregard, an early use of the railway in war that both sides would repeat. A Virginia brigade held Henry Hill and gave its commander, Thomas J. Jackson, the name “Stonewall”, and a Confederate counter-attack turned the Union retreat into a rout back to Washington. About 2,900 Union and 2,000 Confederate soldiers were killed, wounded or captured. Both sides now prepared for a long war: Congress authorised 500,000 three-year volunteers, and George B. McClellan took over the Army of the Potomac."
      - "Enslaved people did not wait for either government. On 23 May three men, Frank Baker, Shepard Mallory and James Townsend, escaped to Fort Monroe in Virginia, and its commander, Benjamin Butler, refused to return them to their owner, calling them “contraband of war”. Thousands more followed them to the Union lines wherever the army came, and by the end of the war hundreds of thousands had freed themselves in this way. In August Congress allowed the seizure of enslaved people used for the Confederate war effort, but when General John C. Frémont declared the slaves of Missouri rebels free, Lincoln overruled him, fearing to lose Kentucky."
    facts:
      - [Baltimore riot, "19 April 1861"]
      - [First Bull Run (Manassas), "21 July 1861, Confederate victory"]
      - [Wilson’s Creek, "10 August 1861, Confederate victory"]
      - [Losses at Bull Run, "about 2,900 Union, 2,000 Confederate"]
