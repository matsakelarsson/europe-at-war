  - title: The blockade and the war at sea
    date: 1861–1865
    when: "1861-11-07"
    borders: "1862-03-08"
    countries: [us, bs, bm, cu, mx, gb]
    body:
      - The blockade Lincoln proclaimed on 19 April 1861 was part of the “Anaconda Plan” of General Winfield Scott, who proposed to strangle the Confederacy by closing its coast and taking the Mississippi. It meant watching some 5,600 km of coastline with a navy that had 42 ships in commission; by 1865 it had 671. The navy seized harbours for coaling and repair bases, Hatteras Inlet in August 1861 and Port Royal Sound in South Carolina on 7 November 1861. At Port Royal the planters fled and the enslaved people of the Sea Islands were free; teachers and missionaries from the North came to work with them in the “Port Royal Experiment”.
      - "Fast, low, grey-painted steamers, many of them British-built and British-owned, ran the blockade from Nassau in the Bahamas, St. George’s in Bermuda and Spanish Havana, carrying cotton out and rifles, powder, medicine and luxuries in; others traded through Matamoros on the Mexican bank of the Rio Grande. In 1861–1862 about one run in nine ended in capture, in 1863–1864 about one in three, and some 1,500 runners were captured or destroyed in all. Southern cotton exports fell by about 95 per cent. Britain declared its neutrality, and the Confederacy’s hope that a cotton famine would force it to intervene came to nothing; the nearest the two powers came to war was the Trent affair of November 1861, when a US warship took two Confederate envoys, James Mason and John Slidell, off a British mail steamer in the Old Bahama Channel, and Lincoln released them after Britain protested."
      - "On 8 March 1862 the Confederate ironclad CSS Virginia, rebuilt from the scuttled USS Merrimack, destroyed two wooden warships at Hampton Roads; the next day the Union’s new USS Monitor fought it to a standstill in the first battle between ironclads. Charleston held out against ironclads and a long siege; off its harbour on 17 February 1864 the submarine H. L. Hunley sank the USS Housatonic, the first warship sunk by a submarine, and was lost with its crew. David Farragut closed Mobile Bay on 5 August 1864, and the fall of Fort Fisher on 15 January 1865 closed Wilmington, the last great port of the blockade runners."
      - "Confederate commerce raiders, some built in Britain, hunted Union merchant ships around the world. The CSS Alabama, built at Birkenhead, took some 65 ships before the USS Kearsarge sank it off Cherbourg, France, on 19 June 1864, and the CSS Shenandoah went on taking American whalers in the Pacific until after the war ended. In 1872 an international tribunal at Geneva ordered Britain to pay the United States $15.5 million for the damage done by British-built raiders. About 19,000 Black men served in the Union navy."
    facts:
      - [Blockade proclaimed, "19 April 1861"]
      - [Union navy, "42 ships in commission in 1861, 671 in 1865"]
      - [Blockade runners captured or destroyed, "about 1,500"]
      - [Monitor and Virginia, "9 March 1862"]
