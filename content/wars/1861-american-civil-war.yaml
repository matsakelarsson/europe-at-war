  - title: Appomattox and the end of slavery
    date: February – December 1865
    when: "1865-04-09"
    borders: "1865-04-09"
    countries: [us]
    body:
      - "In February 1865 Sherman marched north into South Carolina. Columbia burned on the night of 17 February; who started the fires, retreating Confederates burning cotton or Union soldiers and freed prisoners, is still disputed. Charleston was evacuated, and Black troops of the 21st US Colored Troops and the 55th Massachusetts marched in. Johnston’s last attack, at Bentonville in North Carolina on 19–21 March, failed. On 13 March, with Lee’s support, the Confederate Congress voted to enlist enslaved men as soldiers; only a few companies were formed. Congress had already passed the Thirteenth Amendment abolishing slavery on 31 January."
      - "At Petersburg Lee’s attack on Fort Stedman failed on 25 March, Sheridan broke his right at Five Forks on 1 April, and Grant’s assault on 2 April broke the lines. The Confederate government fled Richmond that night, and fires set by the retreating army burned much of the city; Union troops, among them Black regiments, entered on 3 April, and Lincoln walked its streets the next day, surrounded by freedpeople. Lee retreated west, lost about a quarter of his army at Sailor’s Creek on 6 April and found his way blocked at Appomattox. On 9 April he surrendered the Army of Northern Virginia to Grant in Wilmer McLean’s house at Appomattox Court House. Grant’s terms let the men go home on parole with their horses; about 28,000 were paroled."
      - "On 14 April John Wilkes Booth shot Lincoln at Ford’s Theatre in Washington, and he died the next morning; Andrew Johnson became president. Johnston surrendered to Sherman at Bennett Place near Durham on 26 April, and Richard Taylor in Alabama on 4 May. Jefferson Davis was captured near Irwinville, Georgia, on 10 May. The last battle was fought at Palmito Ranch near Brownsville, Texas, on 12–13 May, and the Trans-Mississippi Department surrendered on terms agreed on 26 May and signed by Edmund Kirby Smith at Galveston on 2 June. The Cherokee brigadier general Stand Watie surrendered his command of Cherokee, Muscogee, Seminole and Osage troops at Doaksville in the Choctaw Nation on 23 June. Some Confederates went into exile in Brazil and in Mexico, where the French-backed emperor Maximilian was fighting Benito Juárez’s republic."
      - "On 19 June 1865 General Gordon Granger announced at Galveston that all enslaved people in Texas were free, a day celebrated as Juneteenth and a federal holiday since 2021. The Thirteenth Amendment was ratified on 6 December 1865, ending slavery everywhere in the United States, including Kentucky and Delaware. Treaties in 1866 required the nations of Indian Territory to free the people they had enslaved and give them citizenship, and took much of their western land. Reconstruction followed: the Fourteenth and Fifteenth Amendments promised Black Americans citizenship and Black men the vote, but white-supremacist violence and the withdrawal of federal troops in 1877 brought it to an end, and segregation and disenfranchisement lasted for nearly a century."
    facts:
      - [Richmond taken, "3 April 1865"]
      - [Lee surrenders at Appomattox, "9 April 1865"]
      - [Lincoln assassinated, "14–15 April 1865"]
      - [Juneteenth, "19 June 1865"]
      - [Thirteenth Amendment ratified, "6 December 1865"]
