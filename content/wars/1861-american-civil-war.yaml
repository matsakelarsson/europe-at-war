  - title: Antietam and emancipation
    date: September 1862 – January 1863
    when: "1862-09-17"
    borders: "1862-09-17"
    countries: [us]
    body:
      - "Early in September 1862 Lee crossed the Potomac into Maryland, hoping for recruits, supplies, and a victory on Union soil that might bring recognition from Britain and France. He divided his army to send Jackson against the Union garrison at Harpers Ferry, and on 13 September Union soldiers near Frederick found a copy of his orders wrapped around three cigars. McClellan forced the passes of South Mountain on 14 September, but Jackson took Harpers Ferry the next day with about 12,500 prisoners. On 17 September, along Antietam Creek near Sharpsburg, McClellan attacked Lee in the Cornfield, the West Woods, the Sunken Road and at Burnside’s Bridge, and A. P. Hill’s division, arriving from Harpers Ferry in the afternoon, stopped the last Union attack. Nearly 23,000 men were killed, wounded or missing, the bloodiest single day in American history. Lee withdrew to Virginia; McClellan did not pursue him and was removed in November."
      - "Emancipation had been coming. Congress abolished slavery in the District of Columbia in April 1862 and in the territories in June, and in July allowed the freeing of the slaves of rebels and the enlistment of Black men. Lincoln had drafted a proclamation in July, but on his cabinet’s advice waited for a victory. On 22 September, five days after Antietam, he announced that all persons held as slaves in any state still in rebellion on 1 January 1863 “shall be then, thenceforward, and forever free”. The final proclamation of 1 January 1863 applied only to the Confederacy, leaving slavery untouched in the loyal border states, Tennessee and Union-held parts of Louisiana and Virginia, but it freed people wherever the Union army advanced, opened the army and navy to Black men and made the end of slavery a Union war aim. Britain and France, which had talked of mediation that autumn, did not intervene."
      - "In the West Braxton Bragg and Edmund Kirby Smith invaded Kentucky in August and September; after a hard fight at Perryville on 8 October Bragg withdrew to Tennessee. Ambrose Burnside, McClellan’s successor, attacked Lee at Fredericksburg on 13 December and lost about 12,600 men in repeated assaults on Marye’s Heights, more than twice Lee’s losses. At Stones River near Murfreesboro, from 31 December to 2 January, William Rosecrans’s army held against Bragg’s attacks at a cost of some 24,000 casualties on both sides, and Bragg retreated."
    facts:
      - [Harpers Ferry surrendered, "15 September 1862, about 12,500 Union prisoners"]
      - [Antietam (Sharpsburg), "17 September 1862, nearly 23,000 casualties"]
      - [Preliminary Emancipation Proclamation, "22 September 1862"]
      - [Emancipation Proclamation, "1 January 1863"]
