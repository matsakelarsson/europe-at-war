  - title: Atlanta and the March to the Sea
    date: May 1864 – January 1865
    when: "1864-09-02"
    borders: "1864-09-02"
    countries: [us]
    body:
      - "In May 1864 Sherman advanced from Chattanooga into Georgia with about 100,000 men against Joseph E. Johnston’s Army of Tennessee, some 60,000. Johnston fell back from one entrenched line to the next, past Dalton, Resaca and Kennesaw Mountain, where Sherman’s frontal assault failed on 27 June. On 17 July Davis replaced him with John Bell Hood, who attacked at Peachtree Creek, at Atlanta itself, where the Union general James McPherson was killed, and at Ezra Church, and lost heavily each time. When Sherman cut the last railway into the city at Jonesboro, Hood evacuated Atlanta on 1 September, and Sherman wired Washington: “Atlanta is ours, and fairly won.” He ordered the remaining civilians out of the city."
      - Hood marched north to cut Sherman’s supply line and then invaded Tennessee. Sherman sent Thomas back to defend it. At Franklin on 30 November Hood threw his army against entrenched Union troops and lost about 6,000 men, six of his generals among the dead, and at Nashville on 15–16 December Thomas’s army, with brigades of US Colored Troops, destroyed the Army of Tennessee as a fighting force.
      - "Sherman left Atlanta on 15 November after burning its railway yards, factories and much of the city. With some 62,000 men in two wings he cut loose from his supply lines and marched about 460 km to Savannah, living off the land and wrecking railways, mills, cotton gins and food stores across a band up to 100 km wide; he reckoned the damage at $100 million, $80 million of it “simple waste and destruction”. Milledgeville, the state capital, was occupied on 23 November. Thousands of enslaved people freed themselves and followed the columns. At Ebenezer Creek on 9 December the Union general Jefferson C. Davis had his pontoon bridge taken up before the freedpeople following his corps could cross; many drowned trying to swim the creek or were recaptured by Confederate cavalry. Savannah fell on 21 December, and Sherman offered it to Lincoln as a Christmas present."
      - On 16 January 1865, after meeting Black ministers in Savannah, Sherman issued Special Field Order No. 15, which set aside the Sea Islands and the coastal rice lands from Charleston to the St. Johns River for freed families, in plots of up to 40 acres, the origin of the phrase “forty acres and a mule”. About 40,000 people settled there before President Andrew Johnson returned most of the land to its former owners later in 1865.
    facts:
      - [Kennesaw Mountain, "27 June 1864, Confederate victory"]
      - [Atlanta falls, "2 September 1864"]
      - [Franklin, "30 November 1864"]
      - [Nashville, "15–16 December 1864, Union victory"]
      - [Savannah taken, "21 December 1864"]
