  - title: Black soldiers and the fight for freedom
    date: 1862–1865
    when: "1863-07-18"
    borders: "1863-07-18"
    countries: [us]
    body:
      - "The first Black regiments were raised in 1862, before emancipation: the 1st Kansas Colored Infantry, which fought at Island Mound in Missouri in October, the Louisiana Native Guards and the 1st South Carolina Volunteers, recruited among the freedpeople of the Sea Islands. After the Emancipation Proclamation enlistment opened widely, and in May 1863 the War Department set up a Bureau of Colored Troops. About 179,000 Black men, most of them formerly enslaved, served in the United States Colored Troops, about a tenth of the Union army, and about 19,000 in the navy. Nearly 40,000 of them died, about 30,000 of disease. They were paid $10 a month, less $3 for clothing, against $13 for white privates, until Congress granted equal pay in June 1864; the 54th and 55th Massachusetts refused any pay for more than a year in protest. Almost all their officers were white."
      - "In the spring and summer of 1863 Black soldiers proved themselves in battle. The Louisiana Native Guards charged the works at Port Hudson on 27 May, where Captain André Cailloux was killed; at Milliken’s Bend on 7 June the new African Brigade held off a Texas brigade in hand-to-hand fighting. On 1–2 June Harriet Tubman guided Colonel James Montgomery’s 2nd South Carolina Volunteers up the Combahee River, where they burned plantations and freed more than 750 people. On 18 July the 54th Massachusetts led the assault on Fort Wagner, guarding Charleston harbour; its colonel, Robert Gould Shaw, and nearly half its men were killed, wounded or captured, and Sergeant William Carney carried the flag back though wounded."
      - "The Confederate Congress declared in May 1863 that captured Black soldiers would be handed over to the states as rebels, and their white officers could be put to death. Lincoln threatened retaliation, and the exchange of prisoners broke down, partly over the Confederacy’s refusal to exchange Black soldiers. Black soldiers were killed after surrendering in several places. At Fort Pillow in Tennessee on 12 April 1864 Nathan Bedford Forrest’s troops stormed the fort and shot down many of the garrison, about half of them Black, as they surrendered or fled; reports give 277 to 350 dead, and only 58 Black soldiers were taken prisoner. Such killings happened again at the Crater outside Petersburg on 30 July and at Saltville in Virginia in October 1864."
      - Black troops fought at Olustee in Florida, at Petersburg, where fourteen of them won the Medal of Honor at New Market Heights on 29 September 1864, and at Nashville in December. The all-Black XXV Corps was among the first Union forces to enter Richmond in April 1865, and Black regiments entered Charleston, the cradle of secession.
    facts:
      - [Black soldiers in the Union army, "about 179,000, a tenth of the army"]
      - [Black sailors in the Union navy, "about 19,000"]
      - [Fort Wagner, "18 July 1863"]
      - [Equal pay granted, "June 1864"]
