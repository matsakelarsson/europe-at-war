  - title: Chickamauga and Chattanooga
    date: June – November 1863
    when: "1863-09-19"
    borders: "1863-09-20"
    countries: [us]
    body:
      - In a near-bloodless campaign around Tullahoma from 24 June to 3 July 1863, Rosecrans manoeuvred Bragg out of middle Tennessee. In early September Burnside occupied Knoxville and Rosecrans, crossing the Tennessee River downstream, forced Bragg out of Chattanooga, the railway gateway to Georgia, which Union troops entered on 9 September. Davis sent Bragg two divisions of Longstreet’s corps from Virginia. With the direct railway through Knoxville lost, they had to travel some 1,200 km by a roundabout route through the Carolinas and Georgia, and the first of them arrived in time for the battle.
      - On 18–20 September Bragg attacked Rosecrans along Chickamauga Creek in north-western Georgia. On the 20th Longstreet’s men charged into a gap that a mistaken order had opened in the Union line and routed a third of Rosecrans’s army, Rosecrans with it; George H. Thomas held Snodgrass Hill until nightfall, earning the name “the Rock of Chickamauga”, and the army fell back into Chattanooga. With about 34,600 casualties, Chickamauga was the costliest battle in the West. Bragg besieged the Union army from Missionary Ridge and Lookout Mountain, and its men went hungry.
      - The Union rushed in reinforcements. Two corps of about 20,000 men under Hooker came from Virginia by rail, about 1,900 km in under two weeks, and Sherman marched from Mississippi. Grant took command of the western armies in October, replaced Rosecrans with Thomas and opened a supply line to the city, the “Cracker Line”. Bragg sent Longstreet against Burnside at Knoxville. On 24 November Hooker’s men took Lookout Mountain in the “Battle Above the Clouds”, and on 25 November Thomas’s troops, ordered only to take the rifle pits at the foot of Missionary Ridge, stormed up the ridge and broke Bragg’s army, which retreated into Georgia. Longstreet’s assault on Knoxville failed on 29 November. Chattanooga became the base for the invasion of Georgia, and in March 1864 Grant was made general-in-chief of all the Union armies.
    facts:
      - [Union troops enter Chattanooga, "9 September 1863"]
      - [Chickamauga, "18–20 September 1863, Confederate victory"]
      - [Missionary Ridge, "25 November 1863, Union victory"]
