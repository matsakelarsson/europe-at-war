  - title: Forts Henry and Donelson, Shiloh and New Orleans
    date: February – June 1862
    when: "1862-02-06"
    borders: "1862-04-25"
    countries: [us]
    body:
      - "In the West the rivers led into the heart of the Confederacy. Albert Sidney Johnston held a long, thin line across southern Kentucky, anchored on the Mississippi at Columbus and on two forts where the Tennessee and Cumberland rivers crossed into Tennessee. In February 1862 Grant and Flag Officer Andrew Foote’s gunboats went up the Tennessee: Fort Henry fell to the gunboats on 6 February, and Grant marched across to Fort Donelson on the Cumberland. After a failed breakout, General Simon Bolivar Buckner surrendered on 16 February with some 12,000 men, on Grant’s terms of “unconditional and immediate surrender”. Johnston gave up Kentucky and Nashville, which Don Carlos Buell’s army occupied on 25 February, the first Confederate state capital to fall."
      - "Johnston gathered about 44,000 men at the railway junction of Corinth, Mississippi, and on 6 April attacked Grant’s camps at Pittsburg Landing near Shiloh Church. The surprised Union divisions were driven back to the river through a day of fighting around the Hornet’s Nest and the Peach Orchard; Johnston was killed, the highest-ranking officer to die in the war. Buell’s army arrived during the night, and on 7 April the Union counter-attacked and drove the Confederates back to Corinth. Shiloh cost about 23,700 men killed, wounded and missing, and showed both sides what the war would cost. Henry Halleck took Corinth on 30 May; Island No. 10 had fallen on 8 April and Memphis followed after a river battle on 6 June."
      - On the night of 24 April David Farragut’s fleet ran past Forts Jackson and St. Philip below New Orleans, the largest city and greatest port of the Confederacy, and the city surrendered; Benjamin Butler’s troops occupied it from 1 May. Farragut steamed upriver to Baton Rouge and Natchez but could not take Vicksburg. By the summer of 1862 only Vicksburg and Port Hudson kept the Mississippi open between the eastern Confederacy and Arkansas, Louisiana and Texas. In New Orleans the Louisiana Native Guards, regiments of free men of colour, were taken into the Union army in September.
    facts:
      - [Fort Henry, "6 February 1862"]
      - [Fort Donelson, "16 February 1862, about 12,000 Confederates surrendered"]
      - [Shiloh (Pittsburg Landing), "6–7 April 1862, about 23,700 casualties"]
      - [New Orleans taken, "25 April – 1 May 1862"]
