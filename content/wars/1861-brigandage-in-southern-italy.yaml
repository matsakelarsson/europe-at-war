id: brigandage-in-southern-italy
name: Brigandage in southern Italy
start: "1861"
end: "1870"
tier: C
summary: A guerrilla war in the former Kingdom of the Two Sicilies after its annexation by Italy. Armed bands of former Bourbon soldiers, deserters, peasants and outlaws, encouraged at first by the exiled court of Francis II in Rome and joined by a few foreign legitimists, attacked troops, officials and landowners, above all in Basilicata, Apulia, Campania and the Abruzzi; leaders such as Carmine Crocco commanded hundreds of men. The new state answered with a large part of its army, martial law and, from 1863, the Pica Law, which set up military courts and allowed the arrest of brigands’ relatives. Both sides committed atrocities. After brigands killed some 40 soldiers near Pontelandolfo in August 1861, troops burned Pontelandolfo and Casalduni and killed many of their people. Official figures for 1861–1864 alone count about 2,400 brigands killed in fighting, over 1,000 executed and about 600 soldiers killed; estimates of the total dead vary widely and remain disputed. By the late 1860s the bands had been destroyed, but the war left lasting bitterness in the south.
