  - title: The siege of Puebla and the fall of Mexico City
    date: September 1862 – July 1863
    when: "1863-03-16"
    borders: "1863-06-10"
    countries: [mx, fr]
    body:
      - "General Élie-Frédéric Forey arrived in September 1862 with reinforcements that brought the French army to some 30,000 men, and in March 1863 laid siege to Puebla, now fortified and held by about 22,000 men under Jesús González Ortega. The siege lasted two months of block-by-block fighting. On 30 April, at Camarón on the road from Veracruz, 65 men of the French Foreign Legion under Captain Jean Danjou, escorting a convoy, held out for a day in a farmhouse against some 2,000 to 3,300 Mexican troops until almost all were dead or wounded; the Legion still commemorates the fight. On 8 May General Achille Bazaine routed a Mexican relief army under Ignacio Comonfort at San Lorenzo."
      - "Out of food and ammunition, González Ortega destroyed his guns and surrendered Puebla on 17 May 1863 with about 12,000 men. The captured officers refused to give their word not to fight again, and many, among them Porfirio Díaz and González Ortega, escaped. Juárez left Mexico City on 31 May with his government for San Luis Potosí, and on 10 June Forey made a ceremonial entry into the capital. An Assembly of Notables chosen by the French voted on 10 July to make Mexico a monarchy and to offer the crown to Archduke Maximilian of Austria, brother of Emperor Franz Joseph."
    facts:
      - [Siege of Puebla, "16 March – 17 May 1863"]
      - [Battle of Camarón, "30 April 1863"]
      - [Juárez leaves Mexico City, "31 May 1863"]
      - [Forey enters Mexico City, "10 June 1863"]
