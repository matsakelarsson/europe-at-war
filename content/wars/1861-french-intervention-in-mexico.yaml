  - title: Querétaro
    date: February – July 1867
    when: "1867-05-15"
    borders: "1867-06-21"
    countries: [mx]
    body:
      - "Maximilian refused to leave with the French. In February 1867 he went to Querétaro with about 9,000 men under Miguel Miramón, Tomás Mejía and Leonardo Márquez, hoping to fight a decisive battle. Escobedo had just beaten Miramón at San Jacinto near Zacatecas on 1 February and shot many of his prisoners. From 6 March the republican armies of Escobedo and Ramón Corona, eventually some 30,000 to 40,000 men, besieged the city. Márquez slipped out to bring help from Mexico City but did not return; on 2 April Porfirio Díaz stormed Puebla, and he then beat Márquez and besieged the capital."
      - "On the night of 14–15 May 1867 an imperial colonel, Miguel López, let republican troops into the convent of La Cruz, and Querétaro fell. Maximilian, Miramón and Mejía were tried by a court martial under Juárez’s law against those who made war on the republic and sentenced to death. Despite appeals from European monarchs, the United States and figures such as Victor Hugo and Giuseppe Garibaldi, Juárez refused clemency, and on 19 June the three were shot on the Cerro de las Campanas outside the city. Mexico City surrendered to Díaz on 21 June, and Juárez returned to the capital on 15 July. The restored republic had defeated the last attempt of a European power to rule in the Americas, and the conservatives who had backed the empire never recovered."
    facts:
      - [Battle of San Jacinto, "1 February 1867"]
      - [Siege of Querétaro, "6 March – 15 May 1867"]
      - [Puebla stormed by Díaz, "2 April 1867"]
      - [Maximilian, Miramón and Mejía shot, "19 June 1867"]
      - [Mexico City surrenders, "21 June 1867"]
