  - title: Oaxaca, the Black Decree and Paso del Norte
    date: 1865
    when: "1865-10-03"
    borders: "1865-10-03"
    countries: [mx, fr]
    body:
      - "In early 1865 Bazaine besieged Oaxaca, the last large city held by the republic in the south, and on 9 February Porfirio Díaz surrendered it; he escaped from prison in Puebla in September and raised a new army. In Michoacán the war swung back and forth: on 11 April republican troops under Nicolás de Régules defeated a garrison of the Belgian Legion at Tacámbaro and captured some 240 of its men. French columns pushed into Sinaloa and Sonora and up to Chihuahua, and in August Juárez retreated to Paso del Norte (now Ciudad Juárez) on the US border. In November, his presidential term having run out, he extended it by decree for the duration of the war, which split the republicans."
      - "Believing that Juárez had left the country, Maximilian signed on 3 October 1865 the decree later called the Black Decree: members of armed bands, which in practice meant republican soldiers, were to be tried by court martial and shot within 24 hours. Under it the republican generals José María Arteaga and Carlos Salazar, captured in Michoacán, were shot at Uruapan on 21 October, and many other prisoners were executed. The decree hardened the war and turned many moderates against the empire."
    facts:
