id: french-intervention-in-mexico
name: French intervention in Mexico
start: "1861-12-08"
end: "1867-06-21"
tier: A
summary: "The invasion of Mexico by Napoleon III’s France and the war between the Mexican Republic of Benito Juárez and the empire France set up under Maximilian of Habsburg. When Juárez’s government, bankrupt after the Reform War, suspended payments on its foreign debts in July 1861, Spain, Britain and France sent troops to Veracruz. Spain and Britain withdrew in April 1862 when it became clear that Napoleon meant to overthrow the republic. On 5 May 1862 Ignacio Zaragoza’s army beat the French at Puebla, the victory remembered as Cinco de Mayo, but a much larger French army took Puebla after a siege in 1863 and entered Mexico City. Mexican conservatives offered the throne to Maximilian, who arrived in 1864. Juárez’s government retreated to the far north and fought on with guerrilla and regular forces. After the American Civil War the United States pressed France to leave, and Napoleon, facing Prussia in Europe, withdrew his army in 1866–1867. The republicans besieged Maximilian at Querétaro, which fell on 15 May 1867; he was shot with his generals Miguel Miramón and Tomás Mejía on 19 June, and Mexico City surrendered two days later."
countries: [mx, fr]
sides:
  - id: rep
    name: Mexican Republic (Juárez’s government and the republican armies)
    polities: [mexico, mexican-liberals]
    ink: green
    moves: Republican moves
    success: Republican success
  - id: fr
    name: French Empire (with Austrian and Belgian volunteers and an Egyptian battalion)
    polities: [france]
    ink: navy
    moves: French moves
    success: French success
  - id: imp
    name: Mexican Empire (Maximilian) and the Conservatives
    polities: [mexican-imperialists, mexican-conservatives]
    ink: purple
    moves: Imperial moves
    success: Imperial success
  - id: all
