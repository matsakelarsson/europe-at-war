  - title: Cinco de Mayo
    date: April – June 1862
    when: "1862-05-05"
    borders: "1862-05-05"
    countries: [mx, fr]
    body:
      - "General Charles de Lorencez, sure that Mexicans would welcome the French, marched on Mexico City with about 6,000 men. He pushed the Mexicans off the heights of Acultzingo on 28 April and on 5 May attacked Puebla, held by some 3,800 to 5,000 men of the Army of the East (sources differ) under General Ignacio Zaragoza. Lorencez sent his infantry uphill against the forts of Loreto and Guadalupe on the city’s northern edge. Three assaults failed under artillery fire and in a rainstorm, while Mexican cavalry and the brigade of Porfirio Díaz beat back attacks on the flanks; Nahua battalions from Zacapoaxtla and Xochiapulco in the northern highlands fought among the defenders. The French lost about 470 killed and wounded, the Mexicans about 350."
      - "Lorencez fell back to Orizaba. The victory did not end the war, but it gave the republic a national symbol, and it bought a year: Napoleon had to send a much larger army. Zaragoza died of typhoid in September 1862. A Mexican attempt to drive the French from Orizaba failed when a French company stormed the Cerro del Borrego above the town on the night of 13–14 June."
    facts:
      - [Battle of Puebla, "5 May 1862"]
      - [French force, "about 6,000"]
      - [Mexican defenders, "about 3,800–5,000"]
      - [Losses, "French about 470 killed and wounded, Mexican about 350"]
