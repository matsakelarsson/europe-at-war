  - title: The French withdrawal and the republican offensive
    date: 1866 – March 1867
    when: "1866-06-16"
    borders: "1867-02-05"
    countries: [mx, fr, us]
    body:
      - "The end of the American Civil War in April 1865 changed the balance. The United States had never recognised Maximilian; General Ulysses S. Grant sent Philip Sheridan with some 50,000 troops to the Rio Grande, where arms found their way across to the republicans, and Secretary of State William Seward pressed Paris to leave. The war was costly and unpopular in France, the empire could not pay its debts, and Prussia was rising in Europe. In January 1866 Napoleon III announced that his army would be withdrawn. Carlota went to Europe in July 1866 to plead with Napoleon and the Pope for help, failed, and suffered a mental breakdown from which she never recovered."
      - "The republicans went on the offensive as the French pulled back. In the north Mariano Escobedo captured a large imperial convoy at Santa Gertrudis on 16 June 1866, and Tomás Mejía gave up Matamoros; Monterrey, Saltillo and Chihuahua were soon in republican hands, and Juárez moved south again. In the south Porfirio Díaz beat imperial forces at Miahuatlán on 3 October and an Austrian column at La Carbonera on 18 October, and took Oaxaca. Guadalajara fell in December. The last French troops left Mexico City on 5 February 1867 and sailed from Veracruz in March."
    facts:
      - [Napoleon announces withdrawal, "January 1866"]
      - [Battle of Santa Gertrudis, "16 June 1866"]
      - [Battle of Miahuatlán, "3 October 1866"]
      - [French leave Mexico City, "5 February 1867"]
