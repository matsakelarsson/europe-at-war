steps:
  - title: Debts and the allied landing
    date: July 1861 – April 1862
    when: "1861-12-08"
    borders: "1862-01-08"
    countries: [mx, fr, es, gb]
    body:
      - "The Reform War had left Juárez’s government without money, and on 17 July 1861 Congress suspended payments on the foreign debt for two years. On 31 October Britain, France and Spain signed the Convention of London to force Mexico to pay. Some 6,000 Spanish troops sent from Cuba under General Manuel Gasset occupied Veracruz in mid-December, and British marines, a French force and the Spanish commander-in-chief, General Juan Prim, followed in January 1862. Napoleon III had larger aims: urged on by Mexican conservative exiles, he hoped to set up a friendly monarchy that would open Mexico to French trade and check the United States, then caught up in its civil war."
      - "On 19 February 1862, at La Soledad, the allies agreed with Juárez’s foreign minister, Manuel Doblado, to negotiate, and were allowed to move inland from the yellow-fever coast to Orizaba, Córdoba and Tehuacán. When French reinforcements arrived with the conservative general Juan Almonte, who meant to head a new government, the allies quarrelled. In April 1862 Britain and Spain withdrew their troops, and France broke off the talks and began the war alone."
    facts:
      - [Debt payments suspended, "17 July 1861"]
      - [Convention of London, "31 October 1861"]
      - [Convention of La Soledad, "19 February 1862"]
      - [Britain and Spain withdraw, "April 1862"]
