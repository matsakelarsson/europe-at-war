  - title: Maximilian and the empire
    date: October 1863 – December 1864
    when: "1864-06-12"
    borders: "1864-12-31"
    countries: [mx, fr]
    body:
      - "Bazaine, who replaced Forey in command, led the French and Mexican imperial troops out from the capital at the end of 1863 and took the cities of the interior one after another: Querétaro, Morelia, Guanajuato, San Luis Potosí, Guadalajara. Juárez’s government moved north to Saltillo and Monterrey, and in the autumn of 1864 to Chihuahua. Republican armies were beaten in open battle, but generals and guerrilla leaders held out in the mountains of Guerrero, Michoacán and the Huasteca and across the north."
      - "Maximilian accepted the crown at his castle of Miramare near Trieste on 10 April 1864, after a doubtful plebiscite organised by the French. By the Convention of Miramare the empire would pay the costs of the French army, which was to stay for some years. He and his wife Charlotte (Carlota) landed at Veracruz on 28 May and entered Mexico City on 12 June. To the anger of the conservatives and the Church, the new emperor, a liberal at heart, kept the Reform laws and the sale of church property. Volunteer corps came from Austria, about 6,000 men, and from Belgium, Carlota’s homeland, about 1,500, and Egypt’s ruler lent a battalion of Sudanese soldiers for service in the lowlands of Veracruz."
    facts:
      - [Maximilian accepts the crown, "10 April 1864, Miramare"]
      - [Maximilian enters Mexico City, "12 June 1864"]
      - [Austrian and Belgian volunteers, "about 6,000 and 1,500"]
