    polities: [spain, united-kingdom]
    ink: gold
    moves: Spanish and British moves
    success: Spanish and British success
notes:
  - "Mexico was ruled by two governments from 1863 to 1867: Juárez’s republic, recognised by the United States, and Maximilian’s empire, recognised by most of Europe. The base map names the country the Mexican Empire for those years; the areas in the steps show roughly who held what, though much of the countryside was contested throughout."
  - "Casualty figures are uncertain. One modern count (Clodfelter) gives about 32,000 republican soldiers killed, including some 11,000 executed, and about 14,000 dead on the side of France and the empire, many of disease."
  - Cinco de Mayo, the anniversary of the battle of Puebla, is an official holiday in the state of Puebla and a civic day elsewhere in Mexico, when public schools close, and it is widely celebrated by Mexican Americans in the United States.
