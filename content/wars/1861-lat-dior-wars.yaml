  - title: Dekhelé
    date: 1883–1886
    when: "1886-10-27"
    borders: "1886-10-27"
    countries: [sn]
    body:
      - "For almost four years Lat Dior fought a guerrilla war with a shrinking band of followers while the railway was built. In May 1883 he and his nephew Samba Laobé Fall were defeated, and France then made Samba Laobé damel in Amary Ngoné’s place on condition that Lat Dior be banished; the kings of Baol and Jolof signed the same undertaking. The line from Dakar to Saint-Louis opened in July 1885. In 1886 Samba Laobé fought Alboury Ndiaye of Jolof, Lat Dior’s cousin and secret supporter, and was beaten; at Tivaouane on 6 October 1886, during a quarrel with French officers, he was killed. France abolished the title of damel, divided Cayor into six provinces and gave their leadership to Demba War Sall and his brothers, Lat Dior’s former commanders."
      - "On 26 or 27 October 1886 Lat Dior and his last followers met a French force with Demba War Sall’s men at Dekhelé, in the east of Cayor in today’s Louga region. The fight was short and bloody: Lat Dior was killed with two of his sons and dozens of his companions, and by tradition Demba War Sall carried his body away to bury it in a secret place so that it could not be taken as a trophy. He and his horse Malaw have a lasting place in Senegalese memory, and a bronze statue of them stands in Dakar."
    facts:
      - [Railway opened, "July 1885"]
      - [Samba Laobé killed, "6 October 1886, Tivaouane"]
      - [Dekhelé, "26 or 27 October 1886"]
      - [Cayor, "divided into French-ruled provinces"]
    markers:
