id: lat-dior-wars
name: Lat Dior’s wars
start: "1861"
end: "1886-10-27"
tier: B
summary: "The 25-year struggle of Lat Dior Ngoné Latyr Diop, damel (king) of the Wolof kingdom of Cayor between Saint-Louis and Dakar, to keep his throne and his country’s independence against France and its candidates for the throne. Lat Dior took power in the civil wars that followed the death of Damel Birima in 1859, when France was pushing for a telegraph line and then a road across Cayor. He destroyed a French column at Ngolgol in December 1863 but was beaten at Loro in January 1864 and driven out, and France annexed Cayor in 1865. In exile he joined Maba Diakhou Bâ, converted to Islam and became his general; back in Cayor, he and Shaikh Amadou Ba beat the French at Mékhé in 1869, and France recognised him as damel in 1871. For a decade he was France’s ally, and with French artillery he crushed Amadou Ba at Samba Sadio in 1875. He broke with France over the Dakar–Saint-Louis railway, which he had accepted in 1879 and then saw as the end of Cayor’s independence; deposed at the turn of 1883, he fought a guerrilla war while the railway was built. He was killed in battle at Dekhelé in October 1886, and Cayor was divided into French-ruled provinces. Senegal remembers him as a national hero of the resistance to colonial rule."
