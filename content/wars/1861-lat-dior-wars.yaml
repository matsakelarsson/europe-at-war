  - title: Ally and adversary
    date: 1871–1883
    when: "1875-02-11"
    borders: "1875-02-11"
    countries: [sn]
    body:
      - "As damel Lat Dior kept the peace with France for a decade. When Shaikh Amadou Ba, master of Jolof since 1870, invaded Cayor in July 1874 and won a string of victories, French troops and artillery came to Lat Dior’s help, and on 11 February 1875 they destroyed Amadou Ba’s army at Samba Sadio near Coki; Amadou Ba was killed in flight and his movement broke up."
      - "In 1879 Lat Dior signed a convention allowing France to build a railway from Dakar to Saint-Louis across Cayor, but he soon saw that it would bring French posts, French traders and French rule, and he withdrew his consent. He is reported to have told Governor Servatius that as long as he lived he would oppose the railway with all his might. He also resisted the spread of groundnut farming for export, and moved people away from the line of the track. In December 1882 and January 1883 a French column drove him into Baol, and France installed another damel, Amary Ngoné Fall, who agreed to the railway."
    facts:
      - [Samba Sadio, "11 February 1875"]
      - [Railway convention, "1879"]
      - [Lat Dior deposed, "December 1882 – January 1883"]
    markers:
