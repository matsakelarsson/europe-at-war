steps:
  - title: The damel against France
    date: 1861–1871
    when: "1869-07-03"
    borders: "1869-07-03"
    countries: [sn]
    body:
      - "Cayor, the richest of the Wolof kingdoms, lay across the route between the French towns of Saint-Louis and Dakar, and Governor Faidherbe wanted a telegraph, a road and posts through it. After Damel Birima died in 1859 the electors chose Madiodio, a candidate France favoured. Lat Dior, a young prince born in 1842, drove him out with an army led by Demba War Sall, beating Madiodio and his French allies at Coki in 1861, and was made damel. Faidherbe restored Madiodio, who ceded provinces to France. On 29 December 1863 Lat Dior ambushed a French column of 140 soldiers with Madiodio’s followers at the well of Ngolgol, where by Faidherbe’s own account 103 of the French were left dead; but on 12 January 1864 French troops beat him at Loro, and he fled. In 1865 France annexed Cayor."
      - "In exile Lat Dior joined Maba Diakhou Bâ in Rip, converted to Islam and led Maba’s armies until Maba’s death in 1867. Back in Cayor he allied with the Mahdist preacher Shaikh Amadou Ba from Futa Toro, and in July 1869 their forces almost destroyed a squadron of Senegalese spahis at Mékhé. He raided the provinces that sided with France and fought the French near Louga. With France weakened by its war with Germany, the governor made peace, and on 12 January 1871 Lat Dior was recognised as damel of Cayor; he soon added the title of teigne of Baol."
    facts:
      - [Ngolgol, "29 December 1863, French column destroyed"]
      - [Loro, "12 January 1864, Lat Dior defeated"]
      - [Mékhé, "July 1869 (3 or 8 July)"]
      - [Recognised as damel, "12 January 1871"]
