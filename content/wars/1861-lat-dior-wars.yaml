notes:
  - "Sources differ on many dates: Lat Dior became damel in 1861 or 1862, Mékhé is dated 3 July or 8 July 1869, and Dekhelé 26 or 27 October 1886 (one English account puts it in December). The figures for Ngolgol come from Faidherbe."
  - "Lat Dior fought for Cayor and his own throne, and alliances shifted: he fought beside the French against Amadou Ba in 1875, and Cayor’s own nobles and its royal slave soldiers, led by Demba War Sall, his long-time commander, went over to France in the last years."
