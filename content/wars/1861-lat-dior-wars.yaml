        side: cy
        name: Coki (Samba Sadio)
        date: 11 February 1875
        text: Lat Dior, with French troops and heavy guns, routed Shaikh Amadou Ba’s Madiyanke at Samba Sadio near Coki.
        lonlat: [-15.983, 15.500]
      - kind: capital
        side: fr
        name: Dakar
        date: "1879"
