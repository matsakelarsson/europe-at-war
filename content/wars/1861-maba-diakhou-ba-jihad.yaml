notes:
  - "Accounts differ by community. Muslim and Wolof traditions remember Maba as a reformer who wanted to end the rule of warrior aristocracies and the caste system; Serer tradition, which preserves a detailed account of Somb, remembers his war as an assault on their religion and kingdom; French officers saw him first as a useful ally against the old kings and then as the main threat to their posts. The historian Martin Klein stresses the slave raiding that fed his armies."
