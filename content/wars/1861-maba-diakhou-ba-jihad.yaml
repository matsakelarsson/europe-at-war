  - title: Sine and Somb
    date: 1866–18 July 1867
    when: "1867-07-18"
    borders: "1867-07-18"
    countries: [sn]
    body:
      - "Urged on by Lat Dior, who bore a grudge against the king of Sine, Maba turned on that Serer kingdom, which kept its old religion. In 1866 a surprise attack captured and burned its capital, Diakhao. On 20 April 1867 Maba defeated and killed the French captain Le Creurer at Thiofack, and the same month his forces surprised the Serer village of Mbin o Ngor, killed a royal counsellor and carried off two princesses. Maad a Sinig Kumba Ndoffene Famak Joof then challenged him to meet the whole army of Sine in open battle."
      - "Maba came back with arms and powder bought in the British Gambia, and on 18 July 1867 the two armies met between Somb and Thiouthioune, with the king of Saloum fighting on Sine’s side and Lat Dior and Alboury Ndiaye of Jolof on Maba’s. The marabouts had the better of the morning and broke into Thiouthioune, but at midday heavy rain soaked their powder, and while they tried to dry their guns by the pond of Fandane the king of Sine arrived with fresh troops. Maba’s army was routed; Lat Dior and Alboury escaped, but Maba was killed and his body beheaded. His tomb at Mbel Fandane became a place of pilgrimage, though Serer tradition holds that the man buried there was the Serer prince Makhoureja Ngoneh Joof. His brothers held Rip after him, but his attempt to unite Senegambia in one Muslim state was over."
    facts:
      - [Diakhao burned, "1866"]
      - [Thiofack, "20 April 1867, French captain killed"]
      - [Battle of Somb (Fandane-Thiouthioune), "18 July 1867"]
      - [Maba, "killed in the battle"]
