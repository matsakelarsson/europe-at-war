id: maba-diakhou-ba-jihad
name: Maba Diakhou Bâ’s jihad
start: "1861"
end: "1867-07-18"
tier: B
summary: "The war of the Muslim cleric Maba Diakhou Bâ, who took over the Mandinka kingdom of Badibu on the north bank of the Gambia, renamed it Rip and carried a jihad into the Wolof and Serer kingdoms to the north. A teacher of the Qur’an of Fula descent and a follower of the Tijaniyya order, whom Umar Tall is said to have made its leader in the region, he led the Muslim villages of Badibu against the raids of the king’s warriors and by 1861 ruled the country from his new capital, Nioro. He then conquered most of Saloum, sheltered the deposed kings of Cayor, among them Lat Dior, who converted to his strict Islam, and briefly took Jolof in 1865. His forces burned and enslaved villages that resisted, and he aimed to replace the Serer and Wolof kingdoms and their warrior aristocracies with a single Muslim state. France and Britain, which feared him and also armed him at times, could not stop him: France recognised him as almami of Badibu and Saloum in 1864, and his army, led by Lat Dior, drove off a large French column at Pathé Badiane in 1865. His invasion of the Serer kingdom of Sine ended on 18 July 1867, when the army of Maad a Sinig Kumba Ndoffene Famak Joof routed his forces in the rain near Somb and Maba was killed."
