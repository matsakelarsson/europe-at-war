steps:
  - title: Rip and Saloum
    date: 1861–1865
    when: "1862-10-02"
    borders: "1864-10"
    countries: [sn, gm]
    body:
      - "Maba Diakhou Bâ was born in 1809 in Badibu, a Mandinka kingdom on the north bank of the Gambia, into a family of Qur’an teachers from Futa Toro, and studied and taught in Cayor and Jolof. Back in Badibu around 1850 he became court marabout to its king while the king’s warriors raided Muslim villages. When the marabouts struck back, he and his students defeated the king’s men. In 1861 the British governor of the Gambia attacked Badibu over raids on British traders, and Maba used the king’s defeat to make himself master of the country, which he renamed Rip; his followers burned Mandinka villages and took captives. He made Nioro his capital, named after Umar Tall’s Nioro in the Sahel."
      - "From Rip he invaded the Serer kingdom of Saloum. In 1862 he was joined by Macodou, the deposed damel of Cayor, and twice defeated Macodou’s son Samba Laobé, the king of Saloum, but on 2 October 1862 he failed to take the French fort at Kaolack, where Samba Laobé had taken refuge. In 1863 Mandinka chiefs, helped by Kiang and Wuli, beat his forces at Kwinella south of the river. In 1864 he gave asylum to Lat Dior, the damel of Cayor driven out by the French, who converted with his warriors and became his best general. With up to 11,000 fighting men, Maba was recognised by France in October 1864 as almami of Badibu and Saloum. In 1865 Lat Dior led his army into Jolof and took its capital, Warkhokh, in July, and Maba sought allies in Trarza and Futa Toro, until a revolt in Rip called him back. Governor Pinet-Laprade marched on Rip with 1,600 regulars, 2,000 cavalry and 4,000 auxiliaries, but on 30 November 1865 Lat Dior drove him back from Pathé Badiane, outside Nioro, to Kaolack."
    facts:
      - [Rip conquered, "by 1861"]
      - [Kaolack attacked, "2 October 1862"]
      - [Recognised as almami by France, "October 1864"]
      - [Pathé Badiane, "30 November 1865"]
