id: montenegrin-ottoman-war-1861
name: Montenegrin–Ottoman War of 1861–1862
start: "1861"
end: "1862-08-31"
tier: C
summary: A war between Montenegro under Prince Nicholas and the Ottoman Empire, which grew out of Luka Vukalović’s renewed rising in Herzegovina, backed by Montenegro. Omer Pasha’s forces were at first held, but under pressure from the great powers Montenegro stopped fighting in Herzegovina, and in 1862 Ottoman armies invaded from Herzegovina and Albania, took the Ostrog monastery from the defenders under Mirko Petrović-Njegoš and pushed into the heart of the country. The Convention of Scutari of 31 August 1862 made Montenegro acknowledge Ottoman suzerainty, but on mild terms, restoring the borders of 1859 and letting Montenegrins import goods other than arms through Ottoman territory.
