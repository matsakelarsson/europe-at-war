id: dakota-war-of-1862
name: Dakota War of 1862
start: "1862-08-17"
end: "1864-08"
tier: B
summary: "The war between the eastern Dakota (Santee Sioux) and the United States in the Minnesota River valley in August and September 1862, and its aftermath. Treaties in 1851 and 1858 had left the four eastern Dakota bands a narrow strip along the Minnesota River, and traders’ claims swallowed much of the payments promised for their land. After a crop failure and a hard winter, the 1862 payment was late, and agents and traders refused food on credit. On 17 August four young Dakota men killed five settlers at Acton; that night the Mdewakanton soldiers’ lodge persuaded Taoyateduta (Little Crow) to lead a war to drive the settlers from the valley. Dakota fighters attacked the Lower Sioux Agency on 18 August and killed hundreds of settlers in the following days, but failed to take Fort Ridgely and New Ulm. Colonel Henry Hastings Sibley’s volunteers defeated them at Wood Lake on 23 September, and on 26 September Dakota who had opposed the war handed over 269 captives at Camp Release. Counts of the settlers killed range from 358 to more than 600, besides 77 soldiers and 36 militiamen and armed civilians; Dakota losses are not known. A military commission sentenced 303 Dakota men to death; President Lincoln approved 39 sentences, and 38 men were hanged at Mankato on 26 December 1862, the largest mass execution in the history of the United States. About 1,600 Dakota non-combatants were held in a camp below Fort Snelling, where between about 100 and 300 died; in 1863 Congress annulled the treaties and the Dakota were expelled from Minnesota to Crow Creek on the Missouri. Expeditions under Sibley and Alfred Sully in 1863 and 1864 carried the war into Dakota Territory against the Dakota, Yanktonai and Lakota."
