  - title: Wood Lake, Camp Release and Mankato
    date: September – December 1862
    when: "1862-09-23"
    borders: "1862-09-23"
    countries: [us]
    body:
      - "Governor Alexander Ramsey gave command to Henry Hastings Sibley, a former fur trader. On 2 September Dakota fighters surrounded a burial party at Birch Coulee and kept it pinned down for more than a day, killing 13 soldiers, and on 3–4 September they attacked Hutchinson and Forest City. On 9 September Ramsey told the legislature that the Dakota “must be exterminated or driven forever beyond the borders of the State.” Sibley advanced up the valley with about 1,600 men and on 23 September defeated the Dakota at Wood Lake."
      - "On 26 September Dakota who had opposed the war handed over 269 captives, white and of mixed descent, at a camp Sibley named Camp Release, and many other Dakota surrendered there. Taoyateduta and some 150 to 250 followers fled west onto the plains. The war had killed 77 soldiers and 36 militiamen and armed civilians; counts of the settlers killed range from 358 to more than 600, and some older accounts give higher figures. How many Dakota died is not known; about 150 men were killed in battle."
      - "A military commission of Minnesota officers tried several hundred Dakota men in less than six weeks, some cases in a few minutes, and sentenced 303 to death. President Abraham Lincoln reviewed the trial records and approved 39 sentences; one man was reprieved, and 38 were hanged together at Mankato on 26 December 1862. In November about 1,600 non-combatants, mostly women, children and old people, were marched to Fort Snelling, attacked by a mob at Henderson on the way, and held through the winter in a fenced camp below the fort, where measles and other diseases killed an estimated 102 to 300 of them."
    facts:
      - [Battle of Birch Coulee, "2–3 September 1862, Dakota success"]
      - [Battle of Wood Lake, "23 September 1862, US victory"]
      - [Captives released at Camp Release, "269"]
      - [Executed at Mankato, "38, on 26 December 1862"]
