steps:
  - title: Hunger and the attack on the agencies
    date: 17–25 August 1862
    when: "1862-08-18"
    borders: "1862-08-18"
    countries: [us]
    body:
      - "By the treaties of Traverse des Sioux and Mendota in 1851 the four eastern Dakota bands, the Mdewakanton and Wahpekute of the lower agency and the Wahpeton and Sisseton of the upper agency, gave up most of their land in Minnesota for a reservation along the Minnesota River and yearly payments, and in 1858 they lost the half of the strip north of the river. Traders took much of the money for debts they claimed, and agents pressed the Dakota to give up hunting for farming. In 1861 the crops failed and a hard winter followed. In the summer of 1862 the payment, delayed while Congress, at war with the Confederacy, debated paying it in paper money, had still not come. Asked to sell food on credit, the trader Andrew Myrick is reported to have said that if the Dakota were hungry they could eat grass."
      - "On 17 August four young Dakota men of the Rice Creek village, on a hunting trip, quarrelled and killed five settlers at Acton. That night the soldiers’ lodge urged war while the settlers’ men were away fighting in the Civil War, and Taoyateduta (Little Crow), who had long counselled peace, agreed to lead it. On the morning of 18 August Dakota fighters attacked the Lower Sioux Agency, killing Myrick and other traders and employees, and ambushed a company of soldiers under Captain John Marsh at the Redwood Ferry, killing 24. Over the following days Dakota parties killed hundreds of settlers across the valley and took captive many women and children."
      - "The Dakota attacked the town of New Ulm on 19 and 23 August and Fort Ridgely on 20 and 22 August. Artillery held the fort; at New Ulm the townspeople and volunteers under Charles Flandrau held the centre while much of the town burned, and on 25 August they evacuated it. Thousands of settlers fled the region. Many Sisseton and Wahpeton leaders refused to join the war, and some Dakota, among them John Other Day, led settlers to safety."
    facts:
      - [Killings at Acton, "17 August 1862"]
      - [Attack on the Lower Sioux Agency, "18 August 1862"]
      - [Attacks on New Ulm and Fort Ridgely, "19–23 August 1862"]
