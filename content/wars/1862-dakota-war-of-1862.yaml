  - title: Exile and the expeditions onto the plains
    date: 1863–1864
    when: "1863-07"
    borders: "1863-09-03"
    countries: [us]
    body:
      - "In 1863 Congress abolished the Dakota and Ho-Chunk reservations in Minnesota and declared the Dakota treaties void, and the state offered a bounty for the scalps of Dakota men found within its borders. In May about 1,300 surviving Dakota from the Fort Snelling camp were crowded onto steamboats and taken to Crow Creek on the Missouri, a drought-stricken site where more than 200 died within six months, many of them children; the convicted men were held at Davenport, Iowa, until 1866, by which time a third of them had died. On 3 July 1863 Taoyateduta, who had returned to Minnesota, was shot by a settler near Hutchinson while picking berries with his son."
      - "Sibley led an expedition into Dakota Territory in the summer of 1863 and fought the Dakota and their Lakota allies at Big Mound, Dead Buffalo Lake and Stony Lake in late July. On 3 September Alfred Sully’s cavalry attacked a large camp of Yanktonai, Dakota and Lakota at Whitestone Hill, killing by various estimates between about 150 and 300 people, many of them women and children, and destroying their food for the winter. In 1864 Sully defeated a gathering of Lakota, Yanktonai and Dakota at Killdeer Mountain on 28 July and fought his way through the Badlands of the Little Missouri in August."
      - "The expeditions carried the war from the Dakota to the Lakota and led into the wars of the northern plains that followed. In 1866 the Dakota prisoners and the Crow Creek exiles were moved to the Santee Reservation in Nebraska; other Dakota went to reservations in Dakota Territory or to Canada, and a few families slowly returned to Minnesota. In 2012 the governor of Minnesota formally repudiated Ramsey’s call for extermination."
    facts:
      - [Removed to Crow Creek, "about 1,300 people, May 1863"]
      - [Battle of Whitestone Hill, "3 September 1863"]
      - [Battle of Killdeer Mountain, "28 July 1864"]
