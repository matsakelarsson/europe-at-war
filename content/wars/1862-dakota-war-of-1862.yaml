notes:
  - "Many Dakota, especially among the Sisseton and Wahpeton of the upper agency, opposed the war; some sheltered settlers or led them to safety, and the peace party freed the captives at Camp Release. They were punished with the rest: of the eastern Dakota only 208 Mdewakanton who had helped settlers were allowed to stay in Minnesota."
  - "The war is also called the U.S.–Dakota War, the Sioux Uprising and Little Crow’s War. Until the 1890s most published accounts were written by settlers; the testimony of Dakota participants, among them Taoyateduta’s son Wowinape and Big Eagle (Wamditanka), was gathered later."
