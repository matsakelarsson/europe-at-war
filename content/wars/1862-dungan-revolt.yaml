  - title: The end of the revolt and the Dungan exodus
    date: 1876 – 1878
    when: "1877-12"
    borders: "1877-12-31"
    countries: [cn, kg, kz]
    body:
      - With Gansu subdued, Zuo prepared the reconquest of Xinjiang. In 1876 his armies took Ürümqi and the Hui towns north of the Tian Shan, and in 1877 they drove into the Tarim Basin, where Yakub Beg had died in May. In December 1877, as Kashgar fell, Bai Yanhu led several thousand Hui men, women and children over the snowbound passes of the Tian Shan into the Russian Empire. They and other refugees from Ili in the early 1880s settled in Semirechye and the Chüy valley, where their descendants, the Dungan people of Kyrgyzstan and Kazakhstan, still live.
      - The revolt changed the north-west. Gansu and Shaanxi lost much of their population; the Hui survived mainly in the communities that had submitted, such as Hezhou, and in later decades their leaders, the Ma family warlords, ruled Gansu, Qinghai and Ningxia. In 1884 Xinjiang became a province of the Qing empire.
    facts:
      - [Bai Yanhu crosses into Russia, "December 1877"]
      - [Xinjiang made a province, "1884"]
