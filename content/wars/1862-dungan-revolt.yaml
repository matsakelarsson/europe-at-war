  - title: Hezhou, Xining and Suzhou
    date: 1872 – 1873
    when: "1872-02"
    borders: "1873-10-24"
    countries: [cn]
    body:
      - In 1872 Zuo turned against Hezhou. At Taiziside in February Ma Zhan’ao’s Hui inflicted a heavy defeat on the Qing army, but then, to the surprise of both sides, he surrendered. Zuo accepted, and Ma Zhan’ao and his officers, including his son Ma Anliang, joined the Qing forces; the Hui of Hezhou were allowed to stay, and their descendants became the Muslim generals who dominated the north-west in the Republic. Liu Jintang took Xining in November 1872 after a three-month campaign; the Shaanxi refugees there were resettled in isolated parts of southern Gansu.
      - The last stronghold in Gansu was Suzhou, held by Ma Wenlu with many Hui from Xining and Shaanxi. Zuo besieged it from September 1873 with heavy guns, and the city fell in October. Zuo had about 7,000 of its Hui put to death and moved the rest away, leaving no Hui population in the Hexi Corridor between Lanzhou and Dunhuang. Bai Yanhu, a commander of the Shaanxi Hui, escaped west into Xinjiang.
    facts:
      - [Battle of Taiziside, "February 1872, Hui victory"]
      - [Ma Zhan’ao surrenders, "1872"]
      - [Xining taken, "November 1872"]
      - [Suzhou falls, "October 1873"]
