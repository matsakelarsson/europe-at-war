  - title: Xinjiang rises
    date: 1864 – 1866
    when: "1864-06-04"
    borders: "1864-11-10"
    countries: [cn]
    body:
      - News of the risings in Gansu, and rumours that the authorities planned to disarm or kill the Hui, set off revolts in Xinjiang. On the night of 3–4 June 1864 the Hui of Kucha rose and were joined by the Turkic Muslims of the town, who made a local religious leader, Rashidin Khoja, their ruler. On 26 June the Hui soldiers of the Ürümqi garrison rebelled under Tuo Ming (Daud Khalifa), who proclaimed a Muslim kingdom; the Manchu fortress there fell in October, and Manas and Wusu soon after. Yarkand rose in July, and Khotan, where the cleric Habibullah took power, soon followed.
      - In the Ili valley, the seat of the Qing military governor of Xinjiang, Hui and Taranchis (Turkic farmers) rose on 10 November 1864. The fortress of Huining fell in April 1865 and its defenders were massacred; Huiyuan, the governor’s seat, fell in early 1866, and the governor, Mingxu, blew himself up with his family in the citadel. The Taranchis then turned on the Hui and set up a sultanate of their own under Ala Khan. In the south, Kyrgyz and Hui fighters besieged the Qing garrisons of Kashgar. By 1866 the Qing held almost nothing in Xinjiang except the eastern towns of Hami and Barkol.
    facts:
      - [Kucha rising, "3–4 June 1864"]
      - [Ürümqi rising, "26 June 1864"]
      - [Ili rising, "10 November 1864"]
      - [Huiyuan falls, "1866"]
