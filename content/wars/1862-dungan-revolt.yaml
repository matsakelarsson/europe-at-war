notes:
  - The revolt was not one movement. The Hui of Shaanxi and Gansu, the Hui and Turkic-speaking Muslims (the ancestors of today’s Uyghurs) of Xinjiang, the Sufi orders and local leaders fought the Qing, and often each other; some Hui leaders, such as Ma Zhan’ao, changed sides and later served the Qing.
  - Massacres were committed by all sides. The fighting began with killings of Han by Hui and of Hui by Han militias in Shaanxi; the Qing armies and militias later killed or deported most of the Hui of Shaanxi, and Muslim forces in Xinjiang massacred Manchu, Han and Hui garrisons and civilians. Figures for the dead are estimates from population records before and after the war.
  - The Panthay Rebellion in Yunnan (1856–1873), Russia’s occupation of Ili (1871–1881) and the Qing reconquest of Xinjiang (1876–1878) have their own entries.
