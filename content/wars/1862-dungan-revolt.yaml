        text: Bai Yanhu’s followers settled near here, by Lake Issyk-Kul, and in the Chüy valley; their descendants are the Dungans of Kyrgyzstan and Kazakhstan.
        lonlat: [78.390, 42.490]
        lp: l
      - kind: taken
        side: qing
