  - title: Yakub Beg’s Kashgaria
    date: 1865 – 1872
    when: "1865-09"
    borders: "1871-07"
    countries: [cn, ru]
    body:
      - The rebels of Kashgar asked Kokand for help, and early in 1865 Buzurg Khan, a member of the Afaqi khoja family that had led earlier invasions, arrived with a small force commanded by Yakub Beg, a Kokandi officer. Yakub Beg took the Qing fortress of Kashgar in September 1865, pushed Buzurg aside, and in the next two years took Yarkand, Khotan, where Habibullah was killed, and Kucha. In 1870 he defeated the Hui of Ürümqi, with the help of a Han militia under Xu Xuegong, and took Turfan.
      - His state, which he called Yettishar (the “Seven Cities”), ruled the Tarim Basin and part of the north with a Kokandi army and officials, collected heavy taxes and enforced Islamic law. Many local people resented his foreign officials, but he won recognition and arms from the Ottoman sultan, who named him emir in 1873, and trade treaties with Russia (1872) and British India (1874). In July 1871 Russia, worried that he would take the Ili valley, occupied it and ended the Taranchi sultanate there, promising to hand it back when the Qing could hold it.
    facts:
      - [Yakub Beg takes Kashgar, "September 1865"]
      - [Ürümqi taken from the Hui, "1870"]
      - [Russia occupies Ili, "July 1871"]
