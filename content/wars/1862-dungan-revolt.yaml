  - title: Gansu and Ningxia
    date: 1862 – 1868
    when: "1864"
    borders: "1866"
    countries: [cn]
    body:
      - The rising spread to Gansu, a province that then included Ningxia and the area around Xining. Ma Hualong, head of the Jahriyya, a Sufi order of the Naqshbandi tradition with a large trading network, held Jinjibao on the Yellow River in Ningxia and took Lingzhou. Ma Zhan’ao led the Hui of Hezhou (today Linxia) south-west of Lanzhou, Ma Guiyuan held the region of Xining, and Ma Wenlu took Suzhou (today Jiuquan) in the Hexi Corridor. Guyuan, Pingliang and many other towns fell, and the Qing held little more than Lanzhou and scattered forts.
      - The Qing commanders, short of men and money while the Taiping war went on, tried to negotiate. In 1866 Ma Hualong formally submitted and was given an official title, but kept his power and his arms. The court made Zuo Zongtang, one of the generals who had beaten the Taiping, governor-general of Shaanxi and Gansu in 1866, but he first had to fight the Western Nian, who had moved into Shaanxi, and did not begin his campaign in the north-west until 1868.
    facts:
      - [Rising in Gansu and Ningxia, "from 1862"]
      - [Zuo Zongtang made governor-general, "1866"]
