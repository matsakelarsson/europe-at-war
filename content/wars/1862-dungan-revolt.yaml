steps:
  - title: Shaanxi
    date: 1862 – 1864
    when: "1862-04"
    borders: "1862-06"
    countries: [cn]
    body:
      - The Hui of the Wei river valley in Shaanxi, some of them prosperous traders, had long quarrelled with their Han neighbours over land, water and lawsuits. In 1862, as a Taiping army and Nian bands moved into southern Shaanxi, both communities raised militias. In the spring a dispute at Shengshan in Huazhou over bamboo poles, which the Hui were buying in bulk to make spears, ended in killings, and Han militia burned Hui villages. Hui bands attacked Han villages and towns across the valley, and the violence spread from one district to the next; in many places Han militias killed whole Hui communities.
      - By late June 1862 Hui forces had surrounded Xi’an, the provincial capital, whose own Hui quarter stayed loyal. The siege lasted more than a year, until the Manchu general Dolongga, called in from the war against the Taiping, broke it in 1863 and stormed the Hui strongholds of the valley; he was killed in 1864. Most of the Shaanxi Hui who survived fled west into Gansu with their families, organised in eighteen “battalions”. Of a Hui population once counted in millions, only a small remnant was left in Shaanxi after the war.
    facts:
      - [Shengshan bamboo incident, "spring 1862"]
      - [Siege of Xi’an, "June 1862 – 1863"]
