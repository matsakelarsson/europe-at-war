id: dungan-revolt
name: Dungan Revolt
start: "1862-04"
end: "1877-12"
tier: A
summary: "A series of risings of the Hui (Chinese-speaking Muslims, called Dungans in Central Asia) and other Muslims against the Qing in north-western China, also called the Tongzhi Hui Revolt. Fighting between Hui and Han militias in Shaanxi in 1862, as Taiping and Nian armies approached, turned into a war of massacres on both sides; the Hui besieged Xi’an and then fell back into Gansu, where leaders such as Ma Hualong of the Jahriyya Sufi order held much of the province. In 1864 the Muslims of Xinjiang rose too, and Qing rule there collapsed. Yakub Beg, an officer from Kokand, built a state in the Tarim Basin and took Ürümqi from the Dungans in 1870, while Russia occupied the Ili valley. From 1867 Zuo Zongtang reconquered Shaanxi and Gansu, taking Jinjibao in 1871, Hezhou and Xining in 1872 and Suzhou in 1873, with mass executions and deportations, and in 1876–1877 he retook Xinjiang. The north-west lost a large part of its population; estimates of the dead range from about 8 to 12 million, and one demographic study puts the total loss, by violence, famine, plague and flight, at about 21 million."
countries: [cn]
