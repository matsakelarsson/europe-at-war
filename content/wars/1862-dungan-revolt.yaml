  - title: Zuo Zongtang and Jinjibao
    date: 1868 – 1871
    when: "1869-09"
    borders: "1871-01"
    countries: [cn]
    body:
      - Zuo Zongtang prepared his campaign carefully. He raised loans from foreign banks through the southern provinces, set up an arsenal at Lanzhou, settled soldiers on farms to grow their own grain, and advanced only when his supplies were secure. After destroying the Western Nian in 1868 he cleared Shaanxi and the Hui battalions on the Dongzhiyuan plateau in 1869, and in the autumn of 1869 laid siege to Jinjibao.
      - The siege lasted sixteen months. One of Zuo’s best commanders, Liu Songshan, was killed in 1870, and the Hui flooded the approaches by breaking the irrigation canals. In January 1871 Ma Hualong, out of food, surrendered to save his followers. Zuo had him and his son put to death, with some eighty of his officers; many of the people of the district were killed and thousands of Hui were deported to other parts of the province.
    facts:
      - [Western Nian destroyed, "1868"]
      - [Siege of Jinjibao, "autumn 1869 – January 1871"]
      - [Ma Hualong surrenders, "January 1871"]
    markers:
