notes:
  - Korean records use the lunar calendar. The Danseong rising was on the 4th day of the second month, and the Jinju rising began on the 14th and reached the town on the 18th; in 1862 the second month began on 1 March, so the Gregorian dates differ by exactly one month. The risings on Jeju and at Hamhung came in the ninth and tenth months.
  - The risings are also known as the Jinju uprising, after the largest of them.
