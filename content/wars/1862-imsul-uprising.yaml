id: imsul-uprising
name: Imsul peasant uprisings
start: "1862-03-04"
end: "1862-12"
tier: C
summary: "A wave of peasant risings across southern Korea in 1862, the imsul year of the sixty-year cycle. Under the rule of the in-law Andong Kim clan the three main taxes, the land tax, the military cloth tax and the state grain loans, had become a means of extortion by magistrates and clerks, who added arbitrary levies and forced loans of grain at high interest. After a rising at Danseong on 4 March, peasants of Jinju led by Yu Gye-chun rose on 14 March against the extortions of the provincial army commander Baek Nak-sin. Wearing white headbands and armed with clubs, thousands of them entered the town on 18 March, humiliated the commander, killed several clerks and burned the houses of officials and rich landlords. The court sent Bak Gyu-su to investigate, but the unrest spread in the spring and summer to more than 70 towns in Gyeongsang, Jeolla and Chungcheong, among them Hamyang, Iksan, Gaeryeong, Hampyeong, Gongju and Hoedeok, and in the autumn to Jeju and Hamhung. Each rising was local, attacking the county office and dispersing within days. The government executed the leaders, punished corrupt officials, and set up an office to reform the three taxes, the Samjeong ijeongcheong, but abandoned its reforms within months."
countries: [kr]
