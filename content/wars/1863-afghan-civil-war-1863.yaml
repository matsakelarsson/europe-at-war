id: afghan-civil-war-1863
name: Afghan Civil War of 1863–1869
start: "1863-06-09"
end: "1869-01-03"
tier: C
summary: The war of succession among the sons of Dost Mohammad Khan, who died at Herat on 9 June 1863, days after taking the city. His chosen heir, Sher Ali Khan, was challenged by his half-brothers Mohammad Afzal Khan and Mohammad Azam Khan and by Afzal’s son Abdur Rahman Khan, and by his own full brother Mohammad Amin Khan at Kandahar. Sher Ali defeated and killed Amin in 1865, but lost his heir in the same battle; Abdur Rahman and Azam then beat him at Sheikhabad in 1866 and at Kalat-i-Ghilzai in 1867, and Afzal and then Azam ruled in Kabul. After Afzal’s death in 1867 the victors quarrelled, and Sher Ali, with his son Yaqub Khan, retook Kandahar in May 1868 and Kabul in September. Azam fled to Persia and Abdur Rahman to Russian Turkestan, from where he returned to take the throne in 1880. British India stayed out of the war and recognised whoever held Kabul.
