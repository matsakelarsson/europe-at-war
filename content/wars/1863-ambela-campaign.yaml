id: ambela-campaign
name: Ambela campaign
start: "1863-10-20"
end: "1863-12-23"
tier: C
summary: "A British Indian expedition on the North-West Frontier in 1863 against the community of Indian mujahideen at Malka, beyond the border of British territory, followers of the movement of Sayyid Ahmad Barelvi whom the British called the “Hindustani Fanatics”, and the Pashtun tribes who backed them. About 6,000 troops under Brigadier-General Neville Chamberlain marched into the Ambela (Umbeyla) pass in October, intending to cross Buner. The Bunerwals, joined by Swatis rallied by the Akhund of Swat and by other tribes, some 15,000 men in all, rose and pinned the force in the pass for weeks; the Crag Picquet changed hands several times, and Chamberlain was badly wounded. Reinforced and under Major-General John Garvock, the British broke out in mid-December, and the Buner elders agreed to destroy Malka themselves, which a party escorted by British officers burned on 23 December. British casualties were some 900 to 1,000 killed and wounded."
