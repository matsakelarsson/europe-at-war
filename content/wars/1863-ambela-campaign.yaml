notes:
  - The mujahideen settlement had been founded by followers of Sayyid Ahmad Barelvi, who died fighting the Sikhs at Balakot in 1831. The British suspected it of links with the rebels of 1857 and with networks of supporters in Bengal and Bihar, whose members were tried for conspiracy in the 1860s.
  - Losses on the tribal side are not known.
