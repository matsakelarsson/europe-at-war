id: anglo-satsuma-war
name: Anglo-Satsuma War
start: "1863-08-15"
end: "1863-08-17"
tier: C
summary: "A brief war between Britain and the Satsuma domain, fought as the bombardment of Kagoshima. On 14 September 1862 samurai escorting Shimazu Hisamitsu, the father and regent of the Satsuma daimyo, cut down British merchants who had failed to make way for his procession at Namamugi near Yokohama, killing Charles Lennox Richardson. Britain demanded £100,000 and an apology from the shogunate, which paid, and £25,000 and the trial and execution of the killers from Satsuma, which refused. In August 1863 Admiral Augustus Kuper sailed from Yokohama with seven warships and anchored in Kagoshima Bay on 11 August. When talks failed he seized three Satsuma steamers on 15 August; the shore batteries opened fire, and in a typhoon the British squadron bombarded the town and the forts for two days. The British lost 13 killed, among them Captain Josling and Commander Wilmot of the flagship Euryalus, killed by the same shot from a shore battery, and 50 to 69 wounded by different counts; Satsuma reported 5 killed. About 500 houses burned, between 5 and 10 per cent of the town in different accounts, together with Satsuma’s modern factory complex, the Shūseikan, and five Ryukyuan junks in the harbour. Short of coal and ammunition, the squadron withdrew on 17 August. In talks at Yokohama that autumn Satsuma agreed to pay the £25,000, borrowed from the shogunate, and promised to look for the killers, who were never handed over. The war convinced Satsuma’s leaders that they could not drive out the Western powers by force; the domain soon bought British ships and arms, sent students to Britain in 1865 and became one of Britain’s main partners in Japan."
