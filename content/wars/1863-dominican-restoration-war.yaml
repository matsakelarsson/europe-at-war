steps:
  - title: Annexation and the Grito de Capotillo
    date: 1861 – September 1863
    when: "1863-08-16"
    borders: "1863-09-14"
    countries: [do, es, ht]
    body:
      - On 18 March 1861 President Pedro Santana proclaimed the return of the Dominican Republic to Spain, which hoped to regain influence in the Americas while the United States slid into civil war, and Santana became captain general. A rising at Moca was crushed in May, and Francisco del Rosario Sánchez, one of the founders of the republic, who crossed from Haiti with a band of exiles, was captured and shot at El Cercado on 4 July 1861. Spanish rule soon alienated many Dominicans. Officials from Spain and Cuba took the posts, the army requisitioned animals without pay, the new archbishop pressed couples to marry in church, new tariffs and a tobacco monopoly hurt the merchants and farmers of the Cibao, and rumours spread that slavery, still legal in Spanish Cuba and Puerto Rico, would return. Santana himself resigned in 1862.
      - On 16 August 1863 a band led by Santiago Rodríguez crossed from Haiti and raised the Dominican flag on the hill of Capotillo, near Dajabón, the Grito de Capotillo. Town after town in the Cibao rose. In early September some 6,000 insurgents besieged the Spanish garrison of about 800 men in Fort San Luis at Santiago, much of the town burned, and on 13 September the garrison and its reinforcements broke out and retreated to Puerto Plata, harried all the way. On 14 September the rebels set up a provisional government in Santiago, with José Antonio Salcedo as president, and declared the republic restored.
    facts:
      - [Annexation to Spain, "18 March 1861"]
      - [Grito de Capotillo, "16 August 1863"]
      - [Provisional government in Santiago, "14 September 1863"]
