id: dominican-restoration-war
name: Dominican Restoration War
start: "1863-08-16"
end: "1865-07-11"
tier: B
summary: "The war in which Dominicans ended Spain’s rule over their country, which President Pedro Santana had handed back to Spain in 1861. Spanish officials, taxes, requisitions and a tobacco monopoly, church demands and rumours that slavery would return turned much of the population against the annexation. On 16 August 1863 Santiago Rodríguez and a band of exiles from Haiti raised the Dominican flag on the hill of Capotillo, near Dajabón; the Cibao rose, the Spanish garrison was driven out of Santiago, and on 14 September a provisional government there proclaimed the republic restored. Spain sent tens of thousands of soldiers from Cuba, Puerto Rico and Spain, who held the capital and the ports and retook the south-west, but they could not reconquer the Cibao, guerrillas cut their roads, and yellow fever and other diseases killed far more of them than the fighting did. With the war unpopular in Spain and the Union winning the American Civil War, Queen Isabella II annulled the annexation on 3 March 1865, and the last Spanish troops left in July. Spain had lost more than 10,000 men, most of them to disease."
countries: [do, es, ht]
sides:
  - id: res
    name: Dominican restorationists (the provisional government of Santiago; Santiago Rodríguez, José Antonio Salcedo, Gaspar Polanco, Gregorio Luperón, José María Cabral)
    polities: [dominican-restorationists]
    ink: blue
    moves: Restorationist moves
    success: Restorationist success
  - id: es
    name: Spain and the Dominican annexationists (Pedro Santana’s reserves)
    polities: [spain, dominican-republic]
    ink: gold
    moves: Spanish moves
    success: Spanish success
notes:
  - "From 1861 to 1865 the base map shows the country as the Spanish Captaincy General of Santo Domingo; the restorationist government is drawn as an area. Many Dominicans served on the Spanish side, in Santana’s reserves and other units, and some, such as the young Máximo Gómez, left with the Spanish army in 1865."
  - "Haiti, whose president Fabre Geffrard was alarmed by Spain’s claims to border lands and by its presence on the island, let the rebels use Haitian territory and sold them arms, while officially neutral."
  - The casualty figures come mainly from Spanish reports and contemporary newspapers; Dominican losses are not known.
