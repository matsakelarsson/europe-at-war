  - title: Guerrilla war and yellow fever
    date: October 1863 – 1864
    when: "1864-03"
    borders: "1864-06-01"
    countries: [do, es]
    body:
      - Spain sent reinforcements from Cuba, Puerto Rico and Spain; by the end of the war it had committed some 30,000 to 50,000 soldiers (estimates differ), with about 12,000 Dominican auxiliaries, against perhaps 15,000 restorationists. Spanish troops retook Azua and the towns of the south-west in December 1863, but the rebellion spread to the south and east, guerrillas held San Cristóbal and cut the road from the capital, and Santana, commanding the Dominican reserves, failed to force his way into the Cibao. In March 1864 the captain general, José de la Gándara, relieved him for disobeying orders; Santana died in June before he could be court-martialled. In May 1864 La Gándara took Monte Cristi from the sea, but the Spanish advance inland towards Santiago was halted.
      - Yellow fever, malaria and dysentery killed far more Spanish soldiers than the fighting; by March 1864 Spain counted about 1,000 killed in action and 9,000 dead of disease. The restorationists bought arms by trading tobacco in the Turks Islands and in Haiti, and fought as guerrillas under leaders such as Gregorio Luperón, Gaspar Polanco, Pedro Antonio Pimentel and Benito Monción; in the south José María Cabral beat the Spanish at Neiba on 4 December 1864. In the rebel camp Polanco overthrew Salcedo in October 1864, accusing him of military failures and of wanting to bring back the former president Buenaventura Báez, and had him shot.
    facts:
      - [Spanish troops committed, "about 30,000–50,000, with some 12,000 Dominican auxiliaries"]
      - [Spanish dead by March 1864, "about 1,000 in action and 9,000 of disease"]
      - [Battle of Neiba, "4 December 1864"]
