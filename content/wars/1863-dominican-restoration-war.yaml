  - title: Spain withdraws
    date: January – July 1865
    when: "1865-07-11"
    borders: "1865-07-11"
    countries: [do, es]
    body:
      - In January 1865 a junta under Benigno Filomeno de Rojas, with Gregorio Luperón as vice-president, replaced Polanco, and in March Pedro Antonio Pimentel became president under a new constitution. In Spain the war had become costly and unpopular, and with the Union winning the American Civil War the Cortes feared a quarrel with the United States. On 3 March 1865 Queen Isabella II signed the annulment of the annexation, and the last Spanish troops left in July, taking with them many of the Dominicans who had served Spain.
      - Spain had spent more than 33 million pesos and lost over 10,000 men, most of them to disease. The war is remembered in the Dominican Republic as the Restoration of the republic; 16 August is a national holiday and the day on which presidents take office. It also showed Cubans and Puerto Ricans that Spain could be beaten, and the Cuban Ten Years’ War began in 1868, with veterans of the Dominican war, among them Máximo Gómez, who had fought for Spain, as its commanders.
    facts:
      - [Annexation annulled, "3 March 1865"]
      - [Last Spanish troops leave, "July 1865"]
      - [Spanish losses, "more than 10,000 dead, mostly of disease"]
