steps:
  - title: A rising against conscription
    date: January – March 1863
    when: "1863-01-22"
    borders: "1863-01-22"
    countries: [pl]
    body:
      - In February 1861 Russian troops fired on a patriotic demonstration in Warsaw, and over the next two years a clandestine Central National Committee prepared a rising. To break the movement, Aleksander Wielopolski, head of the kingdom’s civil administration, brought forward a conscription of young activists into the Russian army for twenty years’ service. Rather than wait to be rounded up, the committee called the rising on the night of 22–23 January 1863.
      - At first about 10,000 poorly armed men took to the forests against about 90,000 Russian troops. Volunteers and weapons came over the borders from Austrian Galicia and Prussian Poland, but on 8 February Prussia agreed in the Alvensleben Convention to help Russia. In the south Marian Langiewicz gathered the largest insurgent force in the Holy Cross Mountains. After fighting at Małogoszcz and Grochowiska he crossed into Galicia in March, where the Austrians interned him.
    facts:
      - [Rising proclaimed, "22 January 1863"]
      - [Insurgents at the start, "about 10,000"]
      - [Alvensleben Convention, "8 February 1863, Prussia with Russia"]
    markers:
      - kind: event
        name: Warsaw
        date: 22 January 1863
        text: The Central National Committee declared itself a provisional national government and called the nation to arms.
        lonlat: [21.01, 52.23]
      - kind: battle
        side: ru
        name: Battle of Miechów
        date: 17 February 1863
        text: About 2,500 insurgents under Apolinary Kurowski attacked the Russian garrison and were beaten. The town was burned.
        lonlat: [20.033, 50.358]
        lp: l
      - kind: battle
        side: ru
        name: Battle of Małogoszcz
        date: 24 February 1863
        text: One of the largest battles of the rising. Langiewicz’s force, mostly armed peasants, was attacked by Russian columns and ordered a retreat.
        lonlat: [20.283, 50.817]
      - kind: battle
        name: Battle of Grochowiska
        date: 18 March 1863
        text: Langiewicz’s 3,000 men, cornered by a Russian force near Pińczów, fought their way out in one of the bloodiest battles of the rising.
        lonlat: [20.637, 50.488]
    arrows:
      - side: pl
        label: Langiewicz
        via: [[20.3, 50.85], [20.6, 50.5], [20.95, 50.1]]
  - title: The forest war spreads east
    date: 1863
    when: "1863-05"
    borders: "1863-08-08"
    countries: [pl, lt, by]
    body:
      - By late spring 1863 some 35,000 insurgents faced a Russian army of 145,000 in the kingdom. They could not hold towns, but small units moved through the forests, ambushed patrols and convoys and slipped away. At Żyrzyn on 8 August a force under Michał Heidenreich captured a Russian convoy carrying 140,000 roubles. France, Britain and Austria sent diplomatic notes in support of Polish rights in April, but none of them was willing to go further.
      - From February the rising spread into Lithuania and Belarus, led by Zygmunt Sierakowski, the priest Antanas Mackevičius and Konstanty Kalinowski. In May Russian troops destroyed Sierakowski’s force near Biržai, and he was hanged in Vilnius in June. The new governor-general, Mikhail Muravyov, put down the rising there with public executions and mass deportations, and became known as “the Hangman”. Mackevičius was captured and hanged in Kaunas in December.
    facts:
      - [Insurgents by mid-1863, "about 35,000 against 145,000"]
      - [Battle of Żyrzyn, "8 August 1863, insurgent victory"]
      - [Battle of Biržai, "7–9 May 1863, Russian victory"]
    markers:
      - kind: battle
        side: pl
        name: Battle of Żyrzyn
        date: 8 August 1863
        text: Heidenreich’s insurgents ambushed a Russian column escorting a cash convoy, one of the largest insurgent successes.
        lonlat: [22.1, 51.5]
      - kind: battle
        side: ru
        name: Battle of Biržai
        date: 7–9 May 1863
        text: Sierakowski’s force, the main insurgent army in Lithuania, was broken up. He was wounded and captured the next night.
        lonlat: [24.75, 56.2]
      - kind: event
        name: Vilnius
        date: June 1863
        text: Sierakowski was hanged on Lukiškės Square, the first of many public executions ordered by Muravyov.
        lonlat: [25.271, 54.689]
      - kind: event
        name: Kaunas
        date: 28 December 1863
        text: Antanas Mackevičius, a Catholic priest who led insurgents in Samogitia, was hanged here.
        lonlat: [23.886, 54.897]
        lp: l
  - title: Traugutt and the end of the rising
    date: October 1863 – May 1865
    when: "1863-10-17"
    borders: "1864-08-05"
    countries: [pl, lt, by]
    body:
      - In October 1863 Romuald Traugutt, a former officer of the Russian army, took the lead of the insurgent National Government and tried to turn the partisan bands into a regular army. By then the Russian forces were far stronger, and on 21 February 1864 they beat off an insurgent attack on Opatów. On 2 March the tsar abolished serfdom in the kingdom and gave peasants the land they farmed, undercutting the insurgents’ own promises, and the rising faded.
      - Traugutt was arrested in April 1864 and hanged with four other members of the National Government at the Warsaw Citadel on 5 August. Kalinowski had been hanged in Vilnius in March. The last partisan leader, the priest Stanisław Brzóska, was caught in 1865 and hanged at Sokołów Podlaski in May. Official Russian figures counted 396 executions and 18,672 exiles to Siberia, and 3,454 estates were confiscated in Poland and Lithuania.
    facts:
      - [Traugutt hanged, "5 August 1864, Warsaw Citadel"]
      - [Official Russian figures, "396 executed, 18,672 exiled"]
      - [Peasant emancipation decree, "2 March 1864"]
    markers:
      - kind: battle
        side: ru
        name: Battle of Opatów
        date: 21 February 1864
        text: About 1,000 insurgents under Ludwik Zwierzdowski and Apolinary Kurowski tried to take the town from its Russian garrison and were beaten off.
        lonlat: [21.42, 50.8]
      - kind: event
        name: Warsaw Citadel
        date: 5 August 1864
        text: Traugutt and four colleagues from the National Government were hanged on the slopes of the citadel.
        lonlat: [21.0, 52.265]
      - kind: event
        name: Vilnius
        date: 22 March 1864
        text: Konstanty Kalinowski, leader of the rising in Lithuania and Belarus, was hanged on Lukiškės Square.
        lonlat: [25.271, 54.689]
      - kind: event
        name: Sokołów Podlaski
        date: 23 May 1865
        text: Stanisław Brzóska, the last insurgent commander still in the field, was publicly hanged here.
        lonlat: [22.246, 52.407]
