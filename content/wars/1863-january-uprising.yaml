id: january-uprising
name: January Uprising
start: "1863-01-22"
end: "1865-05-23"
tier: B
summary: A rising against Russian rule in Congress Poland, Lithuania and Belarus that began on 22 January 1863 and was fought for some 18 months as a partisan war in the forests. Russian forces crushed it with executions, deportations to Siberia and confiscations, and the Kingdom of Poland lost the last of its separate institutions.
countries: [pl, lt, by]
sides:
  - id: pl
    name: Polish and Lithuanian insurgents
    polities: [congress-poland]
    ink: magenta
    moves: Insurgent moves
    success: Insurgent success
  - id: ru
    name: Russian Empire
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
notes:
  - Dates are New Style (Gregorian). Russia used the Julian calendar, then 12 days behind.
  - The numbers of insurgents and of the dead are estimates. About 25,000 insurgents are thought to have been killed in some 650 battles and skirmishes.
  - The rising had many leaders in Lithuania and Belarus who are remembered there as national figures, among them Konstanty Kalinowski (Kastus Kalinoŭski) and Antanas Mackevičius.
