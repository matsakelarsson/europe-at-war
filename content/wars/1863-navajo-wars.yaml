notes:
  - "The Navajo call Bosque Redondo Hwéeldi, the place of suffering, and their oral tradition of the Long Walk is central to Navajo history; army reports and the record of the treaty council of 1868 give the American side."
  - "The Navajo wars with Spain, Mexico and the United States go back to the seventeenth century; this entry tells the American war from 1846, and above all the campaign of 1863–1864 and the captivity that followed."
