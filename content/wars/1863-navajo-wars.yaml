  - title: Carson’s campaign and Canyon de Chelly
    date: July 1863 – March 1864
    when: "1864-01"
    borders: "1864-01-14"
    countries: [us]
    body:
      - "Carson marched into the Navajo country in July 1863 with about 700 men of the 1st New Mexico Cavalry and Ute scouts, and made Fort Defiance, renamed Fort Canby, his base. Instead of seeking battles he set out to starve the Navajo into surrender, destroying fields of corn, wheat and beans, burning hogans and seizing or killing sheep and horses through the summer and autumn. The army paid a bounty for captured livestock, and Ute and New Mexican parties raided Navajo camps for captives to sell."
      - "In January 1864 Carson led a winter expedition into Canyon de Chelly, the Navajo stronghold, while a detachment under Captain Albert Pfeiffer passed through it from the east. They killed 23 people, took prisoners and destroyed food stores; in the summer troops cut down thousands of the canyon’s peach trees. The campaign broke Navajo resistance: from early 1864, hungry and cold, thousands came in to Fort Canby and Fort Wingate. Others fled west to Navajo Mountain, the Grand Canyon and the Apache country, or north towards the San Juan."
    facts:
      - [Carson’s force, "about 700 New Mexico volunteers, with Ute scouts"]
      - [Canyon de Chelly expedition, "6–14 January 1864"]
