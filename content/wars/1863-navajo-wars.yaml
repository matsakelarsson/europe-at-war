  - title: The Long Walk and Hwéeldi
    date: 1864–1868
    when: "1864-08"
    borders: "1865-03-01"
    countries: [us]
    body:
      - "From the spring of 1864 to the end of 1866 the army marched the Navajo who surrendered to Bosque Redondo in more than fifty groups by several routes, about 500 km by way of the Rio Grande near Albuquerque. Most walked; many were weak with hunger and poorly clothed, and those who could not keep up were left behind or shot. At least 200 people died on the walk, and Navajo accounts tell of many more. By the spring of 1865 9,022 Navajo were held at Bosque Redondo, with some 400 to 500 Mescalero Apache, on a reservation planned for 5,000."
      - "The water was brackish and firewood scarce, insects, floods and drought destroyed the crops year after year, and dysentery and other diseases spread. Comanche raiders attacked the camp. The Mescalero escaped in November 1865; Manuelito, who had held out in the west, surrendered in September 1866. Deaths during the march and the four years of captivity are estimated at about 3,000, and up to 3,500 by some counts. The army found the reservation ruinously expensive, and a government commission condemned it."
      - "In May 1868 General William T. Sherman and Samuel Tappan came to Fort Sumner for the Peace Commission. Barboncito, speaking for the Navajo, refused removal to Indian Territory and asked to go home. By the treaty signed on 1 June 1868 the Navajo received a reservation on part of their old country, with sheep, goats and seed, and on 18 June they began the walk back, in a column said to be 16 km long. The reservation has since been enlarged many times and is today the Navajo Nation, the largest Native American reservation in the United States."
    facts:
      - [Forced marches, "more than 50, 1864–1866"]
      - [Held at Bosque Redondo, "9,022 Navajo in spring 1865"]
      - [Deaths in the march and the captivity, "about 3,000 to 3,500 (estimates)"]
      - [Treaty of Bosque Redondo, "1 June 1868"]
