steps:
  - title: Raids, forts and Carleton’s ultimatum
    date: 1846 – July 1863
    when: "1863-06"
    borders: "1863-07-20"
    countries: [us]
    body:
      - "The Navajo, who call themselves Diné, lived by farming and herding sheep and horses in the high country between the four mountains sacred to them, Blanca Peak, Mount Taylor, the San Francisco Peaks and Hesperus Mountain. For generations Navajo raided the New Mexican settlements and the Pueblos for livestock, and New Mexicans, Pueblos and Ute raided the Navajo for herds and for women and children, who were sold as servants; by the 1860s thousands of Navajo were held as captives in New Mexican households."
      - "After the United States took New Mexico in 1846, treaties came and went. In 1849 soldiers killed the respected leader Narbona during a parley; in 1851 the army built Fort Defiance in the heart of the Navajo country, and quarrels over its grazing lands led Manuelito and Barboncito to attack it with about 1,000 men on 30 April 1860. In September 1861, after a disputed horse race at Fort Fauntleroy, New Mexican volunteer troops fired on the Navajo gathered there, killing about 12 to 15 people, among them women and children."
      - "In September 1862 General James Carleton, who had brought the California Column to New Mexico during the Civil War, took command. He had Kit Carson round up the Mescalero Apache and confine them at Bosque Redondo, a grove on the Pecos River by the new Fort Sumner, and then demanded that the Navajo surrender by 20 July 1863 for removal there; those who did not would be treated as enemies. Few came in."
    facts:
      - [Navajo attack on Fort Defiance, "30 April 1860"]
      - [Killings at Fort Fauntleroy, "22 September 1861"]
      - [Carleton’s deadline, "20 July 1863"]
