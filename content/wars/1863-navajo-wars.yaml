id: navajo-wars
name: Navajo Wars and the Long Walk
start: "1863-07"
end: "1868-06-01"
tier: B
summary: "The United States’ war of 1863–1864 against the Navajo (Diné) and their forced removal to Bosque Redondo, which ended with the treaty of 1868. Raids and counter-raids for livestock and captives between the Navajo, the New Mexicans, the Pueblos and the Ute had gone on for generations under Spanish and Mexican rule, and continued after the American conquest of New Mexico in 1846, with the killing of the Navajo leader Narbona during talks in 1849, a Navajo attack on Fort Defiance in 1860 and the killing of Navajo women and children at Fort Fauntleroy in 1861. In 1863 General James Carleton ordered the Navajo to surrender for removal to Bosque Redondo on the Pecos River, where he had already confined the Mescalero Apache. Colonel Christopher “Kit” Carson’s New Mexico volunteers and Ute scouts destroyed crops, orchards, homes and herds across the Navajo country, entering Canyon de Chelly in January 1864, while Ute and New Mexican raiders carried off Navajo women and children. Starving, some 8,000 to 9,000 people surrendered and were marched about 500 km east in more than fifty groups between 1864 and 1866, the Long Walk, on which at least 200 died. At Bosque Redondo (Hwéeldi), with brackish water, failed harvests, disease and raids, deaths during the march and the captivity are estimated at about 3,000, and up to 3,500 by some counts. Others held out in the canyons and mountains of the west, among them Manuelito, who surrendered in 1866. By the Treaty of Bosque Redondo of 1 June 1868, negotiated by Barboncito, the Navajo were allowed to return to part of their homeland, the beginning of today’s Navajo Nation."
countries: [us]
