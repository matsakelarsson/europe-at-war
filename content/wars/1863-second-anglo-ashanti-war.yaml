id: second-anglo-ashanti-war
name: Second Anglo-Ashanti War
start: "1863"
end: "1864"
tier: C
summary: "A brief war between the Asante Empire and Britain, which had ruled the Gold Coast forts and a protectorate over the coastal states since the peace of 1831. In 1862 Kwesi Gyani, an Asante subject accused of keeping a gold nugget that belonged by law to the king, fled south across the Pra river into the British Protectorate. Asantehene Kwaku Dua I demanded his return; Governor Richard Pine refused. Early in 1863 Asante armies crossed the Pra, defeated the forces of the coastal states sent against them, burnt villages in the Protectorate and withdrew with the rains. Pine sent troops of the West India Regiment and local levies to the Pra in 1864 to prepare an advance on Kumasi, but they could not cross the river in strength, and fever and dysentery killed far more of them than any fighting. London, unwilling to pay for a war in the interior, ordered the force withdrawn in mid-1864. Neither side claimed victory; a parliamentary select committee in 1865 even recommended that Britain prepare to leave most of West Africa, and the question of who ruled the coast was left to the war of 1873."
