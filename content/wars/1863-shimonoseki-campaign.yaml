  - title: The allied bombardment
    date: September 1864
    when: "1864-09-05"
    borders: "1864-09-05"
    countries: [jp, gb, fr, nl, us]
    body:
      - In August 1864, with the strait still closed and the shogunate unable to act, the four powers sent a joint squadron from Yokohama under the British admiral Sir Augustus Kuper. The ships gathered off the island of Himeshima, on the Kyushu side of the Inland Sea, for their final preparations. Nine British, four Dutch and three French warships carried about 2,000 sailors, marines and soldiers, and the chartered American steamer Ta-Kiang came as a token of United States support. Chōshū was at its weakest. In August its troops had been beaten in Kyoto in the Kinmon incident, and the shogunate was preparing an army against it.
      - On 5 September the squadron entered the strait and in an afternoon’s firing silenced the batteries at Maeda and Dan-no-ura. The next day landing parties stormed the positions, spiked or carried off some 60 guns and burned the magazines, beating back Chōshū counter-attacks. On 8 September Chōshū asked for peace, sending the young officer Takasugi Shinsaku to negotiate. Under the peace agreed on 18 September Chōshū opened the strait to foreign ships, promised to supply them with coal, food and water and to remove its batteries, and accepted an indemnity of $3,000,000, which the powers then claimed from the shogunate. The shogunate could pay only part of it, and in return the powers pressed for the opening of Hyōgo (Kobe) to trade and lower customs duties. In Chōshū the defeat strengthened those, like Takasugi and Itō Hirobumi, who wanted Western weapons and drill.
