notes:
  - The English accounts give Gregorian dates; the imperial deadline was the 10th day of the 5th month of Bunkyū 3 in the Japanese calendar.
  - Casualty figures for 1864 differ. The allies are usually given 12 killed and about 50 wounded (the British diplomat Ernest Satow, who was present, counted 8 killed and 30 wounded among the British), Chōshū 18 killed and 29 wounded.
  - The United States returned its share of the indemnity, about $785,000, to Japan in 1883.
