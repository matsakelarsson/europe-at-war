steps:
  - title: Chōshū closes the strait
    date: June – July 1863
    when: "1863-06-25"
    borders: "1863-07-01"
    countries: [jp, us, fr, nl]
    body:
      - On 25 June 1863, the day after the emperor’s deadline, two Chōshū warships fired on the American merchant steamer Pembroke as she lay at anchor at the eastern entrance of the strait; she escaped through the Bungo Channel. The next day shore batteries damaged the French dispatch steamer Kien Chan, and on 11 July the Dutch warship Medusa, whose captain trusted in the old friendship between Japan and the Netherlands, ran the strait under fire with nine men killed or wounded. Chōshū had fired on the flags of most of the treaty powers.
      - On 16 July the American frigate USS Wyoming under Captain David McDougal steamed into the strait and fought the batteries and Chōshū’s American-built steamers for about two hours, sinking two of them and damaging a third; four of her crew were killed. On 20 July the French warships Sémiramis and Tancrède under Captain Benjamin Jaurès bombarded the batteries and landed 250 men, who spiked guns and burned a village. Chōshū rebuilt its batteries, and the strait stayed closed to foreign ships for more than a year while the powers negotiated with the shogunate.
    facts:
      - [Pembroke fired on, "25 June 1863"]
      - [Medusa fired on, "11 July 1863"]
      - [USS Wyoming in the strait, "16 July 1863"]
      - [French landing, "20 July 1863"]
