id: shimonoseki-campaign
name: Shimonoseki campaign
start: "1863-06-25"
end: "1864-09-08"
tier: B
summary: "Fighting between the Chōshū domain and the navies of the United States, France, the Netherlands and Britain over the Strait of Shimonoseki, the narrow passage between Honshu and Kyushu that links the Inland Sea with the Sea of Japan. In 1863 Emperor Kōmei, under pressure from the radical samurai of the “revere the emperor, expel the barbarians” (sonnō jōi) movement, ordered the shogunate to expel the foreigners by the 10th day of the 5th month (25 June). The shogunate did nothing, but Chōshū, whose lord Mōri Takachika backed the radicals, opened fire from its batteries and steamers on the American steamer Pembroke, the French dispatch boat Kien Chan and the Dutch warship Medusa and closed the strait. The USS Wyoming sank two Chōshū ships on 16 July and a French squadron landed men and wrecked batteries on 20 July, but the strait stayed closed for a year. In September 1864, after Chōshū had been driven from Kyoto, a squadron of nine British, four Dutch and three French warships with an American chartered steamer, about 2,000 men in all, under the British admiral Augustus Kuper, silenced the batteries on 5 September, landed and destroyed them, and forced Chōshū to make peace on 8 September; Takasugi Shinsaku negotiated for the domain. The shogunate had to accept an indemnity of $3,000,000. The defeat turned Chōshū’s leaders from expelling the foreigners to modernising their army with Western arms and overthrowing the shogunate."
countries: [jp, gb, fr, nl, us]
sides:
  - id: cho
    name: Chōshū domain
    polities: [choshu-domain]
    ink: red
