  - title: The Treaty of Sinchula
    date: June – November 1865
    when: "1865-11-11"
    borders: "1865-11-11"
    countries: [bt, in]
    body:
      - Lawrence offered peace in June 1865, but Bhutan refused until British troops prepared to advance again. In the autumn the Bhutanese government agreed to negotiate, and on 11 November 1865 its representatives signed the Treaty of Sinchula. Bhutan gave up the eighteen Bengal and Assam Duars, the Ambari Falakata district and the hills on the left bank of the Teesta, which became the Kalimpong subdivision of Darjeeling district. In return the British would pay an annual allowance of up to 50,000 rupees, and both sides promised perpetual peace and friendship.
      - Bhutan lost about a fifth of its territory and its best farmland, and the Duars were soon cleared for tea gardens worked by labourers brought from Chota Nagpur and Nepal. The treaty remained in force until 1910, when the Treaty of Punakha gave Britain control of Bhutan’s foreign relations in exchange for a larger allowance.
    facts:
      - [Treaty of Sinchula, "11 November 1865"]
      - [Annual allowance, "up to 50,000 rupees"]
