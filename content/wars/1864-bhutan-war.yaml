id: bhutan-war
name: Bhutan War
start: "1864-11-12"
end: "1865-11-11"
tier: B
summary: "A war between British India and Bhutan in 1864–1865, also called the Duar War or the Anglo-Bhutan War. It was fought over the Duars, the fertile strip of foothills and plain below the Bhutanese mountains, after years of disputes over Bhutanese raids into Cooch Behar and Sikkim, the humiliation of a British envoy, Ashley Eden, at Punakha in 1864 and British interest in the land for tea. British columns took the forts along the foothills in the winter of 1864–1865; the Bhutanese retook Dewangiri, which the British then won back. By the Treaty of Sinchula of 11 November 1865 Bhutan gave up the Bengal and Assam Duars and the hills east of the Teesta around Kalimpong, about a fifth of its territory, for an annual payment of 50,000 rupees."
