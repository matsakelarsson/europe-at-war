notes:
  - Bhutan had no standing army; its forts were held by local levies armed with matchlocks, bows and swords. The British force of four columns was made up of British, Indian and Gurkha troops. Losses were small by the standards of the time, a few dozen killed on the British side and perhaps one or two hundred on the Bhutanese, though many more British troops fell ill in the swamps of the foothills.
  - British accounts dominate the record. Modern historians give more weight than the British did at the time to the value of the Duars for tea and revenue.
