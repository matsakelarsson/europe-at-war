steps:
  - title: The Duars campaign
    date: November 1864 – April 1865
    when: "1864-11-12"
    borders: "1865-01-01"
    countries: [bt, in]
    body:
      - The Duars, “doors” to the hills, were a strip of forest, grassland and rice fields along the foot of the Bhutanese mountains, which Bhutan had long ruled and taxed. The British had annexed the Assam Duars in 1841, paying Bhutan compensation, and complained of Bhutanese raids into Cooch Behar and Sikkim. In 1863–1864 an envoy, Ashley Eden, travelled to Punakha, where he was insulted and made to sign an agreement returning the Assam Duars. The Viceroy, Sir John Lawrence, repudiated it, and on 12 November 1864 the British annexed the Bengal Duars.
      - Four columns of British, Indian and Gurkha troops advanced into the foothills that winter and took the Bhutanese forts at Dalimkot, Buxa and Dewangiri with little fighting. The Bhutanese, whose levies were armed with matchlocks and bows, struck back early in 1865, taking Dewangiri and two British howitzers when the garrison abandoned it. The British, reinforced under Brigadier-General Henry Tombs, retook it in the spring. Most of the war’s casualties came from disease.
    facts:
      - [British annexation of the Bengal Duars, "12 November 1864"]
      - [Forts taken, "Dalimkot, Buxa, Dewangiri"]
      - [Dewangiri lost and retaken, "early 1865"]
