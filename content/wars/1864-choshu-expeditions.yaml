notes:
  - The English sources give the date of the Kinmon incident in the Gregorian calendar, but several give the dates of the Second Chōshū expedition in the lunar calendar (for example “7 June 1866” for the first bombardment of Ōshima, the 7th day of the 6th month, which fell in mid-July by the Gregorian calendar). The dates here are Gregorian, some of them approximate.
  - Figures for the shogunate’s armies, often given as 100,000 to 150,000 men, are those it mobilised on paper; far fewer fought, and several domains, Satsuma among them, refused to send troops in 1866.
