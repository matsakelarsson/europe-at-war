  - title: The War on Four Borders
    date: July – October 1866
    when: "1866-07"
    borders: "1866-08-29"
    countries: [jp]
    body:
      - The shogun Tokugawa Iemochi moved to Osaka in 1865 to direct a second expedition, but it took a year to obtain the court’s sanction and to bring the domains to move. Satsuma refused to take part, and many others sent troops reluctantly. Fighting began in mid-July 1866, when shogunate warships bombarded Ōshima, an island of Chōshū in the Inland Sea, and troops of the Matsuyama domain landed there; Chōshū militias, helped by a night attack by Takasugi’s warship on the shogunate fleet, retook it within days. On the Hiroshima border the Chōshū troops held their ground against the Hikone and Takada contingents and modern shogunate infantry, while in the north Ōmura Masujirō led a column through the neutral Tsuwano domain into Iwami and took Hamada Castle, whose lord was a brother of Yoshinobu, together with the shogunate’s silver mine at Iwami Ginzan.
      - Across the Strait of Shimonoseki Takasugi landed troops on the Kyushu shore and attacked the Kokura domain. The Kumamoto troops fought well at Akasaka, but the shogunate’s commander Ogasawara Nagamichi did little, and when news came that Iemochi had died in Osaka Castle on 29 August, he left the front and the Kyushu domains went home. In early September the Kokura garrison set fire to its castle and withdrew inland. Yoshinobu, now head of the Tokugawa house, first vowed to lead an army himself, then had the court order a halt; Katsu Kaishū and the Chōshū envoys Hirosawa Saneomi and Inoue Kaoru agreed on a ceasefire at Miyajima in early October 1866. About 260 Chōshū men had been killed. The shogunate had failed to defeat a single domain.
    facts:
      - [Chōshū army, "about 3,500–4,000"]
      - [First fighting, "mid-July 1866 (Ōshima)"]
      - [Hamada Castle taken, "late August 1866"]
      - [Death of Iemochi, "29 August 1866"]
      - [Ceasefire at Miyajima, "early October 1866"]
