id: choshu-expeditions
name: Kinmon incident and the Chōshū expeditions
start: "1864-08-20"
end: "1866-10"
tier: B
summary: "The armed struggle between the Tokugawa shogunate and the Chōshū domain in western Honshu that broke the shogunate’s authority. Chōshū, led by radical samurai of the “revere the emperor, expel the barbarians” movement, had dominated the imperial court in Kyoto until a coup by Aizu and Satsuma drove its men out in September 1863. On 20 August 1864 about 3,000 Chōshū troops and allied rōnin tried to retake Kyoto by force and were beaten at the gates of the imperial palace by Aizu, Satsuma and other domains; fire destroyed some 28,000 houses in the city. Branded an enemy of the court, Chōshū faced a shogunate army in the First Chōshū expedition, but through the mediation of Satsuma’s Saigō Takamori it submitted without a battle, putting three of its elders to death, and the army withdrew in January 1865. Within weeks Takasugi Shinsaku and his volunteer militias seized power in Chōshū, rearmed it with Western rifles and in March 1866 made a secret alliance with Satsuma. In the Second Chōshū expedition, which Chōshū calls the War on Four Borders, fighting began in July 1866. Chōshū’s modernised army of perhaps 3,500–4,000 men held off a much larger but poorly coordinated shogunate force on the island of Ōshima, on the Hiroshima border, in Iwami, where it took Hamada Castle, and across the strait at Kokura, whose garrison burned its castle and withdrew. The shogun Tokugawa Iemochi died in Osaka on 29 August, and his successor Tokugawa Yoshinobu agreed to a ceasefire in October. The shogunate’s failure to defeat a single domain showed the country that it could be overthrown, as it was in the Boshin War of 1868."
