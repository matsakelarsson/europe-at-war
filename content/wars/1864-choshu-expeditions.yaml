  - title: The first expedition and Takasugi’s coup
    date: September 1864 – March 1866
    when: "1864-09"
    borders: "1865-01-24"
    countries: [jp]
    body:
      - The shogunate gathered the armies of some 35 domains under the former Owari lord Tokugawa Yoshikatsu, with headquarters at Hiroshima, to march on Chōshū from five directions. Chōshū was at its lowest point. Its batteries had just been destroyed by the Western fleet at Shimonoseki, and a conservative faction took over its government. Saigō Takamori, chief of staff of the expedition, argued that Satsuma gained nothing from destroying Chōshū and arranged terms through the Iwakuni branch of the Mōri. In December 1864 the elders Fukuhara Echigo, Masuda Uemonnosuke and Kunishi Shinano committed seppuku and four of their staff officers were executed; the lord of Chōshū apologised, and in January 1865 the expeditionary army withdrew without fighting.
      - In January 1865 Takasugi Shinsaku, with only a few dozen men of his volunteer militias (shotai), among them the Kiheitai, in which samurai and commoners served together, rose against the conservative government at Kōzan-ji in Chōfu. The militias won the short civil war that followed and took over Chōshū. Under Ōmura Masujirō they were rearmed with Minié rifles bought, through Satsuma, from British merchants, and on 7 March 1866, with Sakamoto Ryōma of Tosa as go-between, Kido Takayoshi and Saigō concluded a secret alliance between Satsuma and Chōshū in Kyoto.
    facts:
