steps:
  - title: The battle at the palace gates
    date: 20 August 1864
    when: "1864-08-20"
    borders: "1864-08-20"
    countries: [jp]
    body:
      - In the coup of 30 September 1863 (the 18th day of the 8th month) Aizu and Satsuma troops seized the gates of the imperial palace and expelled Chōshū and its allies among the court nobles from Kyoto. In the summer of 1864, enraged further by the Ikedaya incident, in which the shogunate’s Shinsengumi police killed or arrested radical samurai at an inn in Kyoto, Chōshū sent troops to petition, and if need be fight, for its return. About 3,000 men, Chōshū soldiers and rōnin, camped at Fushimi, Yamazaki below Mount Tennōzan, and Saga west of the city, facing a much larger force of Aizu, Satsuma, Kuwana and other domains under Tokugawa Yoshinobu, the court’s guardian of the palace.
      - Early on 20 August the Chōshū columns attacked. At the Hamaguri Gate on the west side of the palace they broke into the grounds against the Aizu, until Satsuma troops under Saigō Takamori arrived and drove them out. Kusaka Genzui died at the Takatsukasa residence, Kijima Matabei at the Hamaguri Gate, and Maki Izumi took his own life on Tennōzan in the retreat. Fires started in the fighting burned for two days and destroyed some 28,000 houses in Kyoto. Chōshū lost about 400 killed and wounded. The court declared Chōshū an enemy of the throne and ordered the shogunate to punish it.
    facts:
      - [Chōshū force, "about 3,000 (1,400 Chōshū troops and 1,600 rōnin)"]
      - [Chōshū losses, about 400 killed and wounded]
      - [Houses burned in Kyoto, "about 28,000"]
