steps:
  - title: Gold, a lost treaty and the summer of 1864
    date: 1858 – September 1864
    when: "1864-06"
    borders: "1864-09-28"
    countries: [us]
    body:
      - "By the Treaty of Fort Laramie of 1851 the United States recognised the lands between the North Platte and the Arkansas, from the Rocky Mountains into western Kansas, as Cheyenne and Arapaho. Gold was found near today’s Denver in 1858, and in the Pikes Peak gold rush tens of thousands of people crossed and settled those lands. At Fort Wise in February 1861 six Southern Cheyenne chiefs, among them Black Kettle, White Antelope and Lean Bear, and four Arapaho chiefs, among them Little Raven, ceded more than nine-tenths of it for a reserve between the Arkansas and Sand Creek. The Dog Soldiers and many other Cheyenne said the chiefs had no authority to sign and went on hunting the buffalo country of eastern Colorado and western Kansas."
      - "In April and May 1864 Colorado troops sent after stolen cattle attacked several Cheyenne camps; in May soldiers in Kansas shot Lean Bear, who had met President Lincoln the year before, as he rode towards them wearing his peace medal. Cheyenne, Arapaho and Lakota war parties struck back along the Platte and Smoky Hill roads, and on 11 June the Hungate family were killed on their ranch south-east of Denver and their bodies displayed in the town. Raids closed the roads, and Denver ran short of food. Governor John Evans told friendly Indians to report to the forts, and in August authorised citizens to kill hostile Indians and raised the 3rd Colorado Cavalry, volunteers enlisted for a hundred days."
      - "In late summer Black Kettle and other peace chiefs sent word that they wanted peace and handed over captives to Major Edward Wynkoop, the commander at Fort Lyon. At the Camp Weld council near Denver on 28 September Evans and Colonel John Chivington told them to make their peace with the army; Black Kettle’s Cheyenne and Left Hand’s Arapaho then camped on Sand Creek, about 60 km from Fort Lyon, believing themselves under its protection."
