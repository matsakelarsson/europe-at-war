  - title: Julesburg, the Platte road and the Powder River
    date: January – October 1865
    when: "1865-01-07"
    borders: "1865-02-02"
    countries: [us]
    body:
      - "The survivors reached the Cheyenne Dog Soldiers and their Lakota allies on the Smoky Hill River, and the camps sent the war pipe to the Brulé and Oglala Lakota and the Arapaho. In January 1865 about 1,000 warriors attacked Julesburg on the South Platte and the nearby Camp Rankin, killing some 18 soldiers and civilians on 7 January; through January they burned ranches and stage stations along the road, cut the telegraph to Denver, and on 2 February returned and plundered and burned Julesburg. Moving north with their families, they fought off troops at Mud Springs and Rush Creek in February and joined the Northern Cheyenne, Northern Arapaho and Lakota in the Powder River country."
      - "In July the allied warriors attacked the post at Platte Bridge on the North Platte, killing Lieutenant Caspar Collins and his detachment and a supply train at Red Buttes. General Patrick Connor’s Powder River Expedition marched against them in August and on 29 August destroyed the Arapaho camp of Black Bear on the Tongue River, killing men, women and children, but his other columns ran out of food and lost their horses, and the expedition achieved nothing more. Army and government efforts to open a road through the Powder River country led into Red Cloud’s War the next year."
      - "On the southern plains a peace commission met Black Kettle, Little Raven and the Kiowa and Comanche at the mouth of the Little Arkansas in October 1865. The treaty signed there promised the Cheyenne and Arapaho a reservation south of the Arkansas and land and money for the survivors of Sand Creek, but it was never carried out; the Medicine Lodge treaty of 1867 replaced it, and Black Kettle was killed when George Armstrong Custer’s cavalry attacked his camp on the Washita in November 1868."
    facts:
      - [Attack on Julesburg, "7 January 1865"]
      - [Julesburg burned, "2 February 1865"]
      - [Battle of the Tongue River, "29 August 1865"]
      - [Treaty of the Little Arkansas, "14 October 1865"]
