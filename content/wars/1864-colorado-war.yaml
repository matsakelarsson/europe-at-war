id: colorado-war
name: Colorado War
start: "1864-04"
end: "1865-10-14"
tier: B
summary: "The war of 1864–1865 on the central plains between the Southern Cheyenne, the Arapaho and their Lakota allies and the United States, Colorado’s volunteers and settlers, remembered above all for the Sand Creek massacre. The Pikes Peak gold rush of 1858–1859 brought tens of thousands of migrants onto the lands that the Treaty of Fort Laramie (1851) had recognised as Cheyenne and Arapaho, and by the Treaty of Fort Wise (1861) a few chiefs gave up most of it for a small reserve on the Arkansas, which many Cheyenne, above all the Dog Soldiers, rejected. In the spring of 1864 Colorado troops attacked Cheyenne camps, and that summer Cheyenne, Arapaho, Lakota, Kiowa and Comanche raids closed the roads to Denver. In September, after the Camp Weld council, the peace chiefs Black Kettle and Left Hand camped on Sand Creek near Fort Lyon, believing they were under the army’s protection. On 29 November 1864 Colonel John Chivington’s Colorado volunteers attacked the camp and killed between about 150 and 230 people by most estimates, most of them women, children and old men (the estimates range from about 70 to more than 600), and mutilated the dead. Congress and the army condemned the attack. The Cheyenne, Arapaho and Lakota answered by sacking Julesburg and raiding the Platte road in early 1865 before moving north to the Powder River, where General Patrick Connor’s expedition failed to defeat them. In October 1865 the southern chiefs signed the Treaty of the Little Arkansas, which promised reparations for Sand Creek that were never paid."
countries: [us]
