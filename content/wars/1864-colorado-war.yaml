  - title: Sand Creek
    date: 29 November 1864
    when: "1864-11-29"
    borders: "1864-11-29"
    countries: [us]
    body:
      - "Chivington, a Methodist minister who had won fame against the Confederates at Glorieta Pass and hoped to run for Congress, marched south with the 3rd Colorado Cavalry, whose hundred days were nearly up, and companies of the 1st. At Fort Lyon, where Wynkoop had been replaced by Major Scott Anthony, more troops joined him, and several officers protested in vain that the camp on Sand Creek had been promised safety. With about 675 men and four howitzers he reached the camp at dawn on 29 November."
      - "There were perhaps 750 people in the camp, Black Kettle’s and other Cheyenne bands and a few Arapaho lodges, and many of the young men were away hunting. Black Kettle raised an American flag and a white flag over his lodge. The soldiers attacked from several sides, firing into the lodges and pursuing people up the dry creek bed, where many dug pits in the sand to shelter. White Antelope was killed standing in the creek bed, and Left Hand was mortally wounded. Captain Silas Soule and Lieutenant Joseph Cramer refused to order their companies to fire. Most of the dead were women, children and old men; most sources estimate between about 150 and 230 killed, and the soldiers mutilated the bodies and took body parts as trophies, which were shown in Denver."
      - "Hailed in Denver as a victory, the attack was soon exposed by Soule’s and Cramer’s letters and by survivors and witnesses. Two military inquiries and Congress’s Joint Committee on the Conduct of the War condemned Chivington, who had left the army and was never tried; Soule, who testified against him, was shot dead in Denver in April 1865. Evans was forced to resign as governor. In 2014 Colorado’s governor formally apologised to the descendants of the victims."
    facts:
      - [Chivington’s force, "about 675 men, with four howitzers"]
      - [Killed, "about 150 to 230 by most estimates (the range is about 70 to more than 600), most of them women, children and old men"]
      - [Soldiers killed, "about 24"]
