notes:
  - "The number killed at Sand Creek has been disputed since 1864. Chivington claimed 500 to 600 warriors; Cheyenne and Arapaho survivors, the interpreter John Smith and army witnesses described a camp of families in which most of the dead were women, children and old men; most modern sources give about 150 to 230 dead, the National Park Service about 230. The site is now the Sand Creek Massacre National Historic Site."
  - "In the war of 1865 the Cheyenne and Arapaho were joined by Brulé and Oglala Lakota, and the Kiowa and Comanche raided along the Arkansas; the fighting on the Powder River in 1865 led into Red Cloud’s War."
