notes:
  - The Japanese sources date the events by the lunar calendar; the Gregorian dates here are converted. Tengu (“long-nosed goblin”) was a nickname given to the radicals by their opponents, which they took up themselves.
  - The figures for the dead in the fighting of 1864 are uncertain and differ widely between sources; the numbers of those who surrendered and were executed come from the domain and shogunate records.
