id: mito-rebellion
name: Mito rebellion
start: "1864-05-02"
end: "1865-01-14"
tier: C
summary: "A civil war in the Mito domain north-east of Edo, and the long march of its radical faction, the Tengutō (Tengu party), towards Kyoto. Mito, a senior branch of the Tokugawa house, was the home of the Mito school that taught reverence for the emperor, and its samurai were split between radicals who demanded that the shogunate carry out the court’s order to expel the foreigners and conservatives, the Shoseitō, who backed the shogunate. On 2 May 1864 (the 27th day of the third month of Genji 1) Fujita Koshirō, son of the scholar Fujita Tōko, raised a band of 62 men on Mount Tsukuba; it grew to some 1,400 samurai, villagers and rōnin. While some units levied money from towns of the northern Kantō and burned part of Tochigi, the Shoseitō under Ichikawa Sanzaemon took power in Mito. The shogunate sent an army against the rebels, and when the daimyo of the branch domain of Shishido, Matsudaira Yorinori, came to mediate with a large following, he was drawn into the fighting around Nakaminato, forced to surrender and made to commit seppuku. About 1,000 of the rebels gathered at Daigo under Takeda Kōunsai and at the beginning of the eleventh month (late November) set out for Kyoto along the Nakasendō, hoping to put their case to Tokugawa Yoshinobu, a son of the late Mito lord. They beat the Takasaki domain’s troops at Shimonita and the Takashima and Matsumoto troops at Wada Pass, then turned aside through Mino and Echizen in the snow. Yoshinobu himself led troops against them, and on 14 January 1865, cornered at Shinbo near Tsuruga, the 828 who remained surrendered to the Kaga domain. The shogunate took them over, and in March 1865 352 of them were beheaded at Tsuruga, Takeda among them. In Mito the Shoseitō put to death the rebels’ families, women and small children included; when the radicals returned to power in 1868 they took the same revenge on the families of the Shoseitō, and the feud went on into the Boshin War."
