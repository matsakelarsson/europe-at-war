        atoms: [DE-SH~schleswig, DK-83~jut]
  - title: Heligoland, London and Als
    date: May – June 1864
    when: "1864-06-29"
    borders: "1864-06-29"
    countries: [dk, de, at]
    body:
      - On 25 April a peace conference opened in London. On 9 May Danish and Austrian–Prussian squadrons fought off Heligoland, then a British island. The Austrian flagship Schwarzenberg caught fire and the allied squadron withdrew, but Denmark had to give up its blockade of the German North Sea coast. An armistice began on 12 May. In London, Britain and others proposed splitting Schleswig along a national line. The Danish government would not accept the lines on offer, and the conference broke up on 25 June.
      - The fighting resumed at once. In the early hours of 29 June Prussian troops crossed the narrow sound to Als in rowing boats and took the island from its 9,000 Danish defenders, who lost nearly 3,000 men killed, wounded or captured. With Als gone and no help from abroad, the Danish islands themselves now seemed open to attack.
    facts:
      - [Battle of Heligoland, "9 May 1864"]
      - [London Conference, "25 April – 25 June 1864"]
      - [Battle of Als, "29 June 1864, Prussian victory"]
    markers:
      - kind: naval
        side: dk
        name: Battle of Heligoland
        date: 9 May 1864
        text: Commodore Suenson’s frigates beat off Tegetthoff’s two Austrian frigates, which took refuge in neutral waters. Both sides claimed success.
        lonlat: [7.85, 54.05]
      - kind: battle
        side: pr
        name: Battle of Als
        date: 29 June 1864
        text: The Prussians crossed under fire before dawn and the Danish defence collapsed. Some of the defenders surrendered; others were taken off by sea.
        lonlat: [9.917, 54.983]
    arrows:
      - side: pr
        label: Herwarth
        via: [[9.76, 54.95], [9.83, 54.96], [9.9, 54.98]]
  - title: Jutland overrun; the Treaty of Vienna
    date: July – October 1864
    when: "1864-07"
    borders: "1864-10-30"
    countries: [dk, de, at]
    body:
      - In July Prussian and Austrian troops crossed the Limfjord and occupied all of Jutland, reaching Skagen on 14 July. At Lundby on 3 July a Danish company charged a Prussian position and was shot down, in the last fight of the war. In Copenhagen the government fell, and its successor asked for peace. Preliminary terms were signed on 1 August.
      - By the Treaty of Vienna on 30 October 1864 the king of Denmark gave up Schleswig, Holstein and Lauenburg to the emperor of Austria and the king of Prussia jointly. Denmark lost about two-fifths of its territory, and its population fell from about 2.6 to 1.6 million. Some 200,000 Danish speakers in Schleswig came under German rule; the northern part returned to Denmark after a plebiscite in 1920. Within two years Prussia had taken the duchies for itself, after defeating Austria in the war of 1866.
    facts:
      - [Treaty of Vienna, "30 October 1864"]
      - [Ceded, "Schleswig, Holstein and Lauenburg"]
      - [Population of Denmark, "From about 2.6 to 1.6 million"]
    markers:
      - kind: battle
        side: pr
        name: Lundby
        date: 3 July 1864
        text: A Danish bayonet charge against a Prussian company behind a dyke was stopped 20 metres short, with heavy Danish losses.
        lonlat: [10.007, 56.966]
      - kind: taken
        side: pr
        name: Skagen
        date: 14 July 1864
        text: Prussian troops reached the northern tip of Jutland. The whole peninsula was occupied until the peace.
        lonlat: [10.583, 57.717]
    arrows:
      - side: pr
        label: Vogel von Falckenstein
        via: [[9.6, 56.45], [9.9, 57.0], [10.58, 57.7]]
