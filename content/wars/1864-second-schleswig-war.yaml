id: second-schleswig-war
name: Second Schleswig War
start: "1864-02-01"
end: "1864-10-30"
tier: A
summary: A war in which Prussia and Austria defeated Denmark after it tried to tie Schleswig more closely to the kingdom. By the Treaty of Vienna Denmark gave up Schleswig, Holstein and Lauenburg, about two-fifths of its territory, and some 200,000 Danish speakers came under German rule.
