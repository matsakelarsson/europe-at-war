  - title: Dybbøl
    date: March – April 1864
    when: "1864-04-18"
    borders: "1864-04-29"
    countries: [dk, de, at]
    body:
      - The Danish army dug in at Dybbøl, a line of ten redoubts covering the bridge to the island of Als. The Prussians besieged it from February, and their rifled guns, firing from across the inlet at Broager, shelled the position and the town of Sønderborg day and night, the bombardment growing heavier from early April. The redoubts had too few shelters, and the defenders were worn down. In the north the Austrians and Prussians pushed into Jutland and invested the fortress of Fredericia.
      - At 10 o’clock on 18 April the guns fell silent and Prussian columns stormed the redoubts. Within a quarter of an hour the forward line was taken; a counterattack by the Danish 8th Brigade bought time for the rest to escape to Als. By one count about 3,600 Danes and 1,200 Prussians were killed, wounded or missing, and thousands of Danes were taken prisoner. The government had ordered the army to hold on so that Denmark could bargain from strength at the coming peace conference. Within two weeks the Danes had evacuated Fredericia.
    facts:
      - [Storm of Dybbøl, "18 April 1864, Prussian victory"]
      - [Casualties, "About 3,600 Danish and 1,200 Prussian killed, wounded or missing"]
      - [Fredericia evacuated, "Late April 1864"]
    markers:
      - kind: siege
        side: pr
        name: Battle of Dybbøl
        date: 18 April 1864
        text: The decisive battle of the war. The Danish ironclad Rolf Krake shelled the attackers from the sea but could not stop them.
        lonlat: [9.758, 54.907]
      - kind: naval
        side: dk
        name: Battle of Jasmund
        date: 17 March 1864
        text: A Danish squadron fought a Prussian one off Rügen and drove it back into port, keeping the Danish blockade of the Baltic coast in place.
        lonlat: [13.85, 54.3]
      - kind: battle
        side: at
        name: Vejle
        date: 8 March 1864
        text: The Austrians took the town after fierce house-to-house fighting, and the Danish troops in Jutland fell back northwards.
        lonlat: [9.533, 55.717]
      - kind: taken
        side: at
        name: Fredericia
        date: Late April 1864
        text: After Dybbøl, the Danish garrison was ordered to retreat over the Little Belt to Funen, and the fortress was left to the Austrians.
        lonlat: [9.753, 55.568]
    arrows:
      - side: pr
        label: Prussian storm
        via: [[9.7, 54.89], [9.73, 54.9], [9.755, 54.905]]
    areas:
      - style: occupied
