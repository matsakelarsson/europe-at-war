steps:
  - title: The November Constitution
    date: November 1863 – January 1864
    when: "1863-11-18"
    borders: "1864-01-16"
    countries: [dk, de]
    body:
      - Frederick VII, the last king of the old line, died on 15 November 1863. Three days later his successor, Christian IX, signed a new constitution for Denmark and Schleswig together, leaving Holstein and Lauenburg outside. Danish nationalists had long wanted this, but it broke the promise of 1852 not to bind Schleswig more closely to the kingdom than Holstein. In the duchies many backed a rival heir, Frederick of Augustenburg, and German opinion was outraged.
      - The German Confederation ordered a “federal execution” against Holstein and Lauenburg, which were its members. On 24 December Saxon and Hanoverian troops marched in, and the Danish army withdrew behind the Eider without a fight. Prussia’s chief minister, Otto von Bismarck, then went further. On 16 January 1864 Prussia and Austria gave Denmark 48 hours to withdraw the constitution in Schleswig. The Danish government refused, trusting in help from Britain or Sweden that never came.
    facts:
      - [November Constitution, "Signed 18 November 1863"]
      - [Federal execution, "Saxon and Hanoverian troops in Holstein from 24 December 1863"]
      - [Ultimatum, "16 January 1864, from Prussia and Austria"]
    markers:
      - kind: event
        side: dk
        name: November Constitution
        date: 18 November 1863
        text: Christian IX signed the joint constitution for Denmark and Schleswig in his first days as king, under strong pressure from the government and the Copenhagen public.
        lonlat: [12.568, 55.676]
      - kind: taken
        name: Federal execution
        date: 24 December 1863
        text: Federal troops occupied Holstein and Lauenburg, where many welcomed Frederick of Augustenburg as their duke.
        lonlat: [10.139, 54.323]
      - kind: event
        side: dk
        name: Danevirke
        date: January 1864
        text: The Danish army, about 38,000 strong, waited behind the old earthwork, rebuilt at great cost across the neck of the peninsula.
        lonlat: [9.45, 54.467]
        lp: l
    areas:
      - style: occupied
        label: Held by federal troops from December 1863
        atoms: [DE-SH~holstein]
  - title: The Danevirke abandoned
    date: February 1864
    when: "1864-02-01"
    borders: "1864-02-18"
    countries: [dk, de, at]
    body:
      - On 1 February 1864 Prussian and Austrian troops under the elderly Field Marshal Wrangel crossed the Eider into Schleswig. The Danes stopped a Prussian attempt to cross the Schlei at Mysunde on 2 February, and the Austrians pushed up to the Danevirke the next day. But the line was too long to hold with the troops available, the frozen marshes and inlets could be crossed, and the Prussians were preparing to cross the Schlei further east.
      - On the night of 5 February the Danish commander, General de Meza, abandoned the Danevirke and retreated north in snow and frost, leaving his heavy guns behind. The Austrians caught the rearguard at Oeversee on 6 February, but the army escaped to Dybbøl and Fredericia. The retreat saved the army but shocked the Danish public, which had been taught to see the Danevirke as the country’s shield, and de Meza was dismissed. On 18 February Prussian troops crossed into Jutland at Kolding.
    facts:
      - [Danish army, "About 38,000 men under General de Meza"]
      - [Invading armies, "About 38,000 Prussians and 23,000 Austrians, later reinforced"]
      - [Danevirke abandoned, "Night of 5–6 February 1864"]
    markers:
      - kind: battle
        side: dk
        name: Mysunde
        date: 2 February 1864
        text: Prussian troops under Prince Frederick Charles tried to take the crossing over the Schlei and were driven off.
        lonlat: [9.72, 54.52]
      - kind: battle
        side: at
        name: Königshügel
        date: 3 February 1864
        text: Austrian troops drove the Danish outposts back onto the Danevirke south of Schleswig town.
        lonlat: [9.55, 54.48]
        lp: l
      - kind: event
        side: none
        name: Danevirke abandoned
        date: 5–6 February 1864
        text: The army slipped away at night. Many guns were spiked and left in the earthworks.
        lonlat: [9.45, 54.467]
        lp: b
      - kind: battle
        side: at
        name: Oeversee
        date: 6 February 1864
        text: The Danish rearguard was beaten in heavy fighting at Sankelmark Lake, but it held the Austrians long enough for the army to get away.
        lonlat: [9.44, 54.71]
        lp: l
      - kind: taken
        side: pr
        name: Kolding
        date: 18 February 1864
        text: Prussian hussars, carried away by a cavalry skirmish, rode over the border of Schleswig and occupied Kolding, in the kingdom itself.
        lonlat: [9.5, 55.492]
