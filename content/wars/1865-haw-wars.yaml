id: haw-wars
name: Haw wars
start: "1865"
end: "1890"
tier: C
summary: "Wars against armed Chinese bands in the uplands of Laos, northern Vietnam and northern Siam. “Haw” (Ho) is the Thai and Lao name for the Yunnanese Chinese, and was applied to these bands, most of whose men came from Guangxi and Guangdong: they were remnants of the armies of the Taiping and other mid-century risings, pushed south by the Qing from the 1860s. In Tonkin and the hills they formed rival bands under coloured flags (the Black Flags, the Yellow Flags, and later the Red and Striped Flags), which taxed trade, took tribute and raided; the French and Siamese often called them pirates or bandits, while the Vietnamese court at times employed them. In 1873–1874 the Striped Flags took Muang Phuan and the Plain of Jars, routed a force sent by Luang Prabang and Vietnam, and sacked the ruins of Vientiane. Siam, which held Luang Prabang and the Lao principalities as vassals, sent expeditions in 1875, 1884–1885 and 1885–1887; the first two failed against Haw stockades, and the third, under Chamuen Waiwonnat (later Chaophraya Surasak Montri), occupied Hua Phan and the Sipsong Chau Tai and carried off brothers of the Tai lord Đèo Văn Trị of Lai Châu as hostages. In June 1887 Đèo Văn Trị, with Haw and Black Flag fighters, sacked Luang Prabang; the French vice-consul Auguste Pavie got the old king Oun Kham away by boat. French troops from Tonkin then occupied the Sipsong Chau Tai, Đèo Văn Trị went over to the French, who recognised him as lord of the Sipsong Chau Tai in 1889–1890, and the last large bands broke up by about 1890, though raids went on into the mid-1890s. The wars weakened Siam’s hold on the left bank of the Mekong and prepared the ground for the French claims of 1893. In Thailand they are remembered as the suppression of the Haw (Prap Ho)."
