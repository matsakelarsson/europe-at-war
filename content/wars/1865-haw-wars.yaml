notes:
  - The bands changed names, leaders and allegiances often, and the sources, mostly Siamese and French reports, give few reliable numbers. The Black Flags of Liu Yongfu fought the French in Tonkin in 1873–1885 and are told in the French campaigns in Tonkin and the Sino-French War.
