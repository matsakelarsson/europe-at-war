id: morant-bay-rebellion
name: Morant Bay rebellion
start: "1865-10-11"
end: "1865-11-13"
tier: B
summary: "The rising of 11 October 1865 in the parish of Saint Thomas-in-the-East, Jamaica, and its suppression. Thirty years after the end of slavery, most Black Jamaicans were small farmers and labourers with little land, low wages and no vote: in 1864 fewer than 2,000 Black men could vote, out of a population of more than 436,000. Floods, drought and epidemics had deepened their poverty, and the governor, Edward John Eyre, answered their petitions with a message from the Queen telling them to work harder. Paul Bogle, a Black Baptist deacon of Stony Gut, and his followers, allies of the mixed-race assemblyman George William Gordon, marched on the courthouse at Morant Bay on 11 October after warrants were issued for their arrest. The volunteer militia fired on them, and in the fighting that followed the crowd burned the courthouse and killed 18 officials and militiamen, among them the custos, Baron von Ketelhodt, while seven of the marchers died. For two days the rebels held much of the parish. Eyre declared martial law, and soldiers, sailors and Maroons from Moore Town put down the rising with extreme violence: 439 people were killed, 354 of them after courts martial, more than 600 were flogged and about 1,000 homes were burned. Gordon, arrested in Kingston where martial law did not apply, was tried by court martial at Morant Bay and hanged on 23 October, and Bogle the next day. A royal commission found the punishments excessive, Eyre was recalled amid a fierce debate in Britain, and in 1866 the Jamaican Assembly gave up its powers and the island became a Crown colony ruled from London. Jamaica made Bogle and Gordon National Heroes in 1969."
countries: [jm, gb]
