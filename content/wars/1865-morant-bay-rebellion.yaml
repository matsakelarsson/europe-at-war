steps:
  - title: The march on Morant Bay
    date: 7–13 October 1865
    when: "1865-10-11"
    borders: "1865-10-11"
    countries: [jm, gb]
    view:
      center: [-76.40, 17.93]
      size: [60, 50]
    body:
      - After the end of slavery in 1834 and of apprenticeship in 1838, many freed Jamaicans left the estates for small plots in the hills, but good land was scarce, wages on the estates were low and often unpaid, and a property qualification kept almost all Black men from voting for the Assembly. Floods in 1864, drought, cholera and smallpox made matters worse. In 1865 a letter from the Baptist missionary Edward Underhill to the Colonial Office describing the distress led to public meetings across the island; the government’s answer, a message in the Queen’s name advising the people to work for wages, angered many. Paul Bogle, a farmer and Black Baptist deacon at Stony Gut in the hills above Morant Bay, led a delegation that walked to Spanish Town in August to see the governor, Edward John Eyre, who refused to receive it. Bogle was a political ally of George William Gordon, a mixed-race landowner and member of the Assembly who was Eyre’s fiercest critic.
      - On 7 October 1865 a crowd from Stony Gut disrupted the trial at Morant Bay of a man charged with trespassing on an abandoned estate, and warrants were issued for Bogle and others. On 10 October the police sent to arrest Bogle were overpowered at Stony Gut. The next day, 11 October, Bogle led several hundred men and women, some armed, to the courthouse where the parish vestry was meeting. The volunteer militia fired into the crowd, killing seven; the crowd set fire to the courthouse and nearby buildings and killed 18 officials and militiamen as they fled, among them the custos of the parish, Baron Maximilian von Ketelhodt.
      - For the next two days bands of rebels moved through the parish of Saint Thomas-in-the-East, attacking estates and killing a few more white men, while many planters fled to the coast. Bogle called on the people to join him, but the rising did not spread beyond the parish.
