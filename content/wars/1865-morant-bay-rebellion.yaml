notes:
  - The figure of 439 killed is the count of the royal commission of 1866, which broke it down into 354 executed by court martial, 50 shot or hanged without trial, 25 shot by the Maroons and 10 killed otherwise. Other counts, to the end of martial law on 13 November, are higher, at 469 or more than 600.
  - In Britain the Jamaica Committee, with John Stuart Mill, Charles Darwin and Thomas Huxley, tried to have Eyre prosecuted for murder, while the Eyre Defence Committee, with Thomas Carlyle, John Ruskin, Charles Dickens and Alfred Tennyson, defended him. Grand juries refused to indict him, and the courts found for him in a civil suit, Phillips v Eyre.
