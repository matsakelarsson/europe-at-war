  - title: Martial law and the Crown colony
    date: October 1865 – 1866
    when: "1865-10-23"
    borders: "1865-10-23"
    countries: [jm, gb]
    body:
      - On 13 October Eyre declared martial law in the county of Surrey, the east of the island, except the city of Kingston. Troops under Brigadier-General Alexander Nelson, among them soldiers of the West India Regiment, were landed from warships at Morant Bay and elsewhere on the coast, and the Maroons of Moore Town under their colonel, Alexander Fyfe, came down from the Blue Mountains. In the thirty days of martial law soldiers, sailors and Maroons hunted the rebels and many who had nothing to do with the rising; the royal commission later counted 439 killed, 354 of them after hasty courts martial, more than 600 men and women flogged and about 1,000 homes burned.
      - Eyre held Gordon responsible. Gordon gave himself up in Kingston, where martial law did not apply, and was taken by sea to Morant Bay, tried by a court martial and hanged there on 23 October 1865, though he had taken no part in the rising. Bogle was captured by Maroons and hanged at the courthouse the next day.
      - In Britain the news divided opinion between those who saw Eyre as the saviour of the colony and those who accused him of murder. A royal commission under Sir Henry Storks, which sat in Jamaica in early 1866, found that martial law had been kept in force too long and that the punishments were excessive, the floggings barbarous and the burning of homes wanton. Eyre was recalled and never held office again. The Jamaican Assembly, dominated by planters fearful of Black voters, voted to abolish itself, and from 1866 Jamaica was a Crown colony ruled by a governor appointed from London.
