id: austro-prussian-war
name: Austro-Prussian War
start: "1866-06-14"
end: "1866-08-23"
tier: A
summary: A seven-week war in which Prussia and Italy defeated Austria and most of the German middle states. After the Prussian victory at Königgrätz, the Peace of Prague dissolved the German Confederation and shut Austria out of Germany; Prussia annexed Hanover, Hesse-Kassel, Nassau, Frankfurt and Schleswig-Holstein and led a new North German Confederation, and Austria ceded Venetia to Italy.
countries: [de, at, cz, it, hr, sk]
sides:
  - id: pr
    name: Prussia and its allies
    polities: [prussia, mecklenburg, oldenburg, brunswick, anhalt]
    ink: slate
    moves: Prussian moves
    success: Prussian success
  - id: it
    name: Italy
    polities: [italy]
    ink: green
    moves: Italian moves
    success: Italian success
  - id: at
    name: Austria and its allies
    polities: [habsburg, saxony, hanover, bavaria, wurttemberg, baden, hesse, hesse-kassel, nassau]
    ink: purple
    moves: Austrian and allied moves
    success: Austrian and allied success
notes:
  - Also called the Seven Weeks’ War, in German often the German War (Deutscher Krieg), and in Italy the Third War of Independence.
  - Places in Bohemia and Moravia are named in the German forms used in most accounts of the war; Königgrätz is today’s Hradec Králové, Nikolsburg is Mikulov, Pressburg is Bratislava and Lissa is the Croatian island of Vis.
