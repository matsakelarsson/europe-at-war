steps:
  - title: Holstein and the north German states
    date: June 1866
    when: "1866-06-07"
    borders: "1866-06-29"
    countries: [de]
    body:
      - After their joint victory over Denmark in 1864, Prussia and Austria fell out over Schleswig and Holstein. The Gastein Convention of August 1865 gave Prussia Schleswig and Austria Holstein to administer, but Otto von Bismarck, Prussia’s chief minister, meant to end Austria’s leading role in Germany. On 8 April 1866 he made a secret alliance with Italy, which wanted Venetia. When Austria put the duchies’ future before the Federal Diet, Prussian troops marched into Holstein on 7 June and the Austrians withdrew. On 14 June the Diet voted, nine votes to six, to mobilise federal forces against Prussia, which declared the German Confederation dissolved.
      - Most of the middle-sized states sided with Austria. On 15 June Prussia demanded that Saxony, Hanover and Hesse-Kassel disarm, and the next day its troops invaded all three. The Saxon army withdrew into Bohemia to join the Austrians, and the Prussians entered Dresden on 18 June. The Elector of Hesse was taken prisoner to Stettin. The Hanoverian army, about 19,000 men with King George V, marched south to join the Bavarians. At Langensalza on 27 June it beat off an attacking Prussian detachment, but converging Prussian forces surrounded it, and it surrendered two days later.
    facts:
      - [Prussians enter Holstein, "7 June 1866"]
      - [Federal Diet vote, "14 June 1866, nine to six against Prussia"]
      - [Battle of Langensalza, "27 June 1866, Hanoverian victory; surrender on 29 June"]
