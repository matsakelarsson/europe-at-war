  - title: The Main campaign
    date: 1–27 July 1866
    when: "1866-07-04"
    borders: "1866-07-27"
    countries: [de]
    body:
      - After Langensalza the Prussian forces in the west became the Army of the Main under General Eduard Vogel von Falckenstein. Against them stood two federal corps that never joined up, the Bavarians under Prince Charles of Bavaria and the troops of Württemberg, Baden, Hesse-Darmstadt, Nassau and Austria under Prince Alexander of Hesse. Falckenstein beat the Bavarians at Dermbach on 4 July and at Kissingen on the Franconian Saale on 10 July, then turned west and beat Prince Alexander’s corps at Laufach and Aschaffenburg on 13 and 14 July. On 16 July his troops entered Frankfurt; the Federal Diet had fled to Augsburg.
      - Frankfurt, which had taken no part in the fighting, was ordered to pay huge war contributions, and its mayor, Karl Fellner, hanged himself rather than enforce them. General Edwin von Manteuffel, who took over the army, beat the Württembergers at Tauberbischofsheim on 24 July and the Bavarians around Helmstadt and Rossbrunn over the next two days. On 27 July Prussian guns shelled the fortress of Würzburg, which held out. Armistices with the southern states followed in early August. In separate peace treaties they paid indemnities and secretly allied with Prussia, and Bavaria and Hesse-Darmstadt gave up small territories.
    facts:
      - [Battle of Kissingen, "10 July 1866, Prussian victory"]
      - [Frankfurt occupied, "16 July 1866"]
      - [Battle of Tauberbischofsheim, "24 July 1866, Prussian victory"]
    markers:
      - kind: battle
        side: pr
        name: Dermbach
        date: 4 July 1866
        text: The Army of the Main’s first clash with the Bavarians, in the Rhön hills.
        lonlat: [10.12, 50.716]
      - kind: battle
        side: pr
        name: Battle of Kissingen
        date: 10 July 1866
        text: The Prussians forced the crossings of the Franconian Saale and drove the Bavarians from the spa town.
        lonlat: [10.067, 50.2]
      - kind: battle
        side: pr
        name: Aschaffenburg
        date: 14 July 1866
        text: Falckenstein’s troops broke into the town held by Austrian and Hessian troops, opening the road to Frankfurt.
        lonlat: [9.15, 49.967]
      - kind: taken
        side: pr
        name: Frankfurt
        date: 16 July 1866
        text: The free city, seat of the Federal Diet, was occupied and ordered to pay contributions of many millions of guilders.
        lonlat: [8.682, 50.111]
        lp: l
      - kind: battle
        side: pr
        name: Tauberbischofsheim
        date: 24 July 1866
        text: The Prussians crossed the Tauber against the Württemberg division of the VIII Federal Corps.
        lonlat: [9.663, 49.623]
        lp: b
      - kind: siege
        name: Würzburg
        date: 27 July 1866
        text: Prussian artillery shelled the Marienberg fortress, but the Bavarian garrison held out until the armistice.
        lonlat: [9.933, 49.783]
