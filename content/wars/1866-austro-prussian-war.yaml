  - title: Königgrätz
    date: 22 June – 3 July 1866
    when: "1866-06-22"
    borders: "1866-07-03"
    countries: [cz, de, at]
    body:
      - Prussia’s chief of staff, Helmuth von Moltke, used the railways to bring three armies to the Bohemian border and sent them through the mountain passes separately, to unite on the battlefield. The Elbe Army and the First Army came from Saxony and Lusatia, the Second Army under Crown Prince Frederick William from Silesia. Ludwig von Benedek, commanding the Austrian North Army and the Saxons, failed to strike at either group alone. In a week of battles from 26 June the Austrians lost at Náchod, Skalitz, Münchengrätz and Gitschin, winning only at Trautenau, as the fast-firing Prussian breech-loading needle gun cut down their attacking columns.
      - On 3 July Benedek stood before the fortress of Königgrätz, by the village of Sadowa, with the Elbe at his back. Close to half a million men took part, more than in any battle in Europe since Leipzig in 1813. Prince Frederick Charles’s First Army attacked across the Bistritz in the morning and was held by the Austrian artillery until the Second Army reached the Austrian right flank in the afternoon and took the heights at Chlum. Benedek’s army escaped across the Elbe, covered by its cavalry and guns, but lost about 31,000 men killed, wounded, missing or captured, against about 9,000 Prussians.
    facts:
      - [Battle of Königgrätz (Sadowa), "3 July 1866, Prussian victory"]
      - [Commanders, "King William I and Moltke; Benedek"]
      - [Austrian and Saxon losses, "about 31,000, over 9,000 of them prisoners"]
    markers:
      - kind: battle
        side: at
        name: Trautenau
        date: 27 June 1866
        text: Ludwig von Gablenz’s corps drove back a Prussian corps of the Second Army, the only Austrian victory in Bohemia, at a heavy cost in men.
        lonlat: [15.915, 50.556]
      - kind: battle
        side: pr
        name: Náchod
        date: 27 June 1866
        text: General Karl von Steinmetz’s corps beat the Austrian VI Corps as the Second Army came out of the mountains; it won again at Skalitz the next day.
        lonlat: [16.194, 50.426]
      - kind: battle
        side: pr
        name: Münchengrätz
        date: 28 June 1866
        text: The Elbe Army and the First Army forced the Austrian I Corps and the Saxons back from the Iser.
        lonlat: [14.974, 50.521]
      - kind: battle
        side: pr
        name: Gitschin
        date: 29 June 1866
        text: The First Army defeated Count Clam-Gallas’s I Corps and the Saxons, opening the way to a junction with the Second Army.
        lonlat: [15.352, 50.437]
      - kind: battle
        side: pr
        name: Battle of Königgrätz
        date: 3 July 1866
        text: The decisive battle of the war. The beaten Austrian army fell back towards Olmütz and could no longer defend Bohemia.
        lonlat: [15.75, 50.285]
        lp: b
