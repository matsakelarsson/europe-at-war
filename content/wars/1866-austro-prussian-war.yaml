  - title: Custoza and Lissa
    date: 20 June – 12 August 1866
    when: "1866-06-24"
    borders: "1866-08-12"
    countries: [it, hr, at]
    body:
      - Italy declared war on Austria on 20 June and sent two armies against Venetia. On 24 June the larger, under General Alfonso La Marmora with King Victor Emmanuel II, crossed the Mincio and was beaten at Custoza by the smaller South Army of Archduke Albrecht, based on the fortresses around Verona. The day after Königgrätz Francis Joseph offered Venetia to Napoleon III of France in return for his mediation, to free troops for the defence of Vienna, but Italy, bound by its alliance with Prussia, fought on. Giuseppe Garibaldi’s volunteers pushed into Trentino and beat the Austrians at Bezzecca on 21 July.
      - At sea the larger and more modern Italian fleet under Admiral Carlo Persano attacked the Austrian island of Lissa in the Adriatic. On 20 July Wilhelm von Tegetthoff’s squadron came to its relief and, in the first battle between fleets of ironclads, rammed and sank the Re d’Italia, while the armoured gunboat Palestro blew up; 612 Italians were killed, against 38 Austrians. As Austrian troops went north, General Enrico Cialdini’s army advanced across Venetia. Garibaldi, ordered on 9 August to leave Trentino, replied with one word, “Obbedisco” (“I obey”), and the armistice of Cormons ended the fighting on 12 August.
    facts:
      - [Battle of Custoza, "24 June 1866, Austrian victory"]
      - [Battle of Lissa, "20 July 1866, Austrian victory"]
      - [Armistice of Cormons, "12 August 1866"]
    markers:
      - kind: battle
        side: at
        name: Battle of Custoza
        date: 24 June 1866
        text: Archduke Albrecht’s South Army attacked the Italians as they advanced from the Mincio and drove them back across the river.
        lonlat: [10.796, 45.379]
      - kind: battle
