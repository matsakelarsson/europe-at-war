  - title: Nikolsburg and the Peace of Prague
    date: 22 July – 12 October 1866
    when: "1866-07-22"
    borders: "1866-10-12"
    countries: [de, at, cz, sk, it]
    body:
      - By mid-July the Prussian armies had occupied Prague and Brno and reached the Marchfeld, a day’s march from Vienna, while Austria brought troops north from Italy. On 22 July, during a last action at Blumenau outside Pressburg, an armistice came into force at noon. King William wanted to march into Vienna and annex Austrian and Saxon land, but Bismarck, threatening to resign, insisted on a mild peace that would neither make Austria a lasting enemy nor give France a reason to intervene. The preliminary peace was signed at Nikolsburg on 26 July and the final Peace of Prague on 23 August.
      - Austria accepted the end of the German Confederation and its own exclusion from German affairs, gave up its rights in Schleswig and Holstein, and paid an indemnity. Prussia annexed Hanover, Hesse-Kassel, Nassau and the free city of Frankfurt, then Schleswig-Holstein, and led the states north of the Main in a new North German Confederation; Saxony kept its king but had to join it. By the Treaty of Vienna of 3 October Austria ceded Venetia, through France, to Italy. Many in the annexed states resented Prussian rule, and in 1871 a party loyal to the deposed King of Hanover won almost half the vote there.
    facts:
      - [Armistice, "22 July 1866"]
      - [Preliminary peace of Nikolsburg, "26 July 1866"]
      - [Peace of Prague, "23 August 1866"]
    markers:
      - kind: battle
        name: Blumenau
        date: 22 July 1866
        text: Prussian troops were outflanking the Austrian position before Pressburg when the fighting stopped at noon under the armistice.
        lonlat: [17.054, 48.192]
      - kind: treaty
        name: Nikolsburg
        date: 26 July 1866
        text: Bismarck and the Austrian envoys signed the preliminary peace at the castle, the Prussian headquarters.
        lonlat: [16.638, 48.806]
      - kind: treaty
        name: Peace of Prague
        date: 23 August 1866
        text: Confirmed the terms of Nikolsburg and dissolved the German Confederation.
        lonlat: [14.421, 50.087]
      - kind: treaty
        name: Treaty of Vienna
        date: 3 October 1866
        text: Austria made peace with Italy and ceded Venetia, which Napoleon III handed on to Italy; a plebiscite approved the union later in October.
        lonlat: [16.372, 48.208]
