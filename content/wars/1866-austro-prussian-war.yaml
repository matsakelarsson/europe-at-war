        text: Garibaldi’s volunteers, the Hunters of the Alps, won the hardest fight of their campaign in the valleys west of Lake Garda.
        lonlat: [10.717, 45.9]
      - kind: naval
        side: at
        name: Battle of Lissa
        date: 20 July 1866
        text: Tegetthoff’s weaker fleet broke up the Italian line, and his flagship Erzherzog Ferdinand Max rammed and sank the Re d’Italia.
        lonlat: [16.053, 43.176]
      - kind: treaty
        name: Armistice of Cormons
        date: 12 August 1866
        text: Ended the fighting between Italy and Austria; peace followed at Vienna on 3 October.
        lonlat: [13.467, 45.95]
