steps:
  - title: Arkadi and the Cretan revolt
    date: 1866 – 1869
    when: "1866-08-21"
    borders: "1867-06-01"
    countries: [gr, tr, eg]
    body:
      - Crete had stayed Ottoman when Greece became independent, and its Christian majority rose again in 1841 and 1858. The reforms promised after the Crimean War came slowly, and in 1866 a quarrel over the property of the monasteries brought matters to a head. Assemblies of Christian notables petitioned the Sultan, and on 21 August 1866 they proclaimed a revolt and union with Greece. The insurgents, joined by volunteers from Greece, took most of the countryside, while the Ottomans held the fortified towns of the north coast. Egypt’s Khedive Ismail sent a large force of infantry to help put the rising down.
      - The monastery of Arkadi, near Rethymno, was a centre of the revolt. On 8 November 1866 an Ottoman army of perhaps 15,000 men with artillery attacked it; inside were 964 people, of whom 259 were armed men and most of the rest women and children. On the second day the attackers broke in, and the defenders set fire to the powder magazine, killing themselves and many of the soldiers. About 864 of those in the monastery died and 114 were taken prisoner; Ottoman losses are put at about 1,500. Reported abroad by telegraph, the “holocaust of Arkadi” caused outrage, and volunteers from Italy, France, Hungary and Serbia joined the Cretans.
      - In May 1867 Omer Pasha’s troops overran the Lasithi plateau in the east, and from October 1867 the grand vizier, Âli Pasha, spent four months on the island, building blockhouses and offering reform. His Organic Law of 1868 gave the Christians a large share in local government. Greek ships kept running guns to the rebels until a conference of the powers in Paris in early 1869 made Greece stop, and by then most rebel leaders had submitted.
    facts:
      - [Revolt proclaimed, 21 August 1866]
      - [Arkadi, "8–9 November 1866, about 864 dead among the defenders and refugees"]
