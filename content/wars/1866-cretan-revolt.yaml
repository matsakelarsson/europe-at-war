id: cretan-revolt
name: Cretan Revolt of 1866–1869
start: "1866-08-21"
end: "1869"
tier: B
summary: The largest of the nineteenth-century Christian risings in Ottoman Crete, which sought union with Greece. Ottoman and Egyptian troops held the towns and slowly won back the countryside; the destruction of the Arkadi monastery in November 1866, where defenders blew up the powder magazine, turned European opinion towards the Cretans, and the revolt ended in 1869 with a new Organic Law that gave the Christians a share in governing the island.
