notes:
  - "The Fenians called their armed force the Irish Republican Army, the first use of the name. The Fenian Brotherhood split in 1865 between the followers of its founder John O’Mahony, who wanted to support a rising in Ireland, and the “Senate” faction of William R. Roberts and General Thomas W. Sweeny, which planned the invasion of Canada."
  - "Casualty figures differ between sources, particularly for the Fenians; a Canadian militia report of 1868 counted 31 dead and 103 wounded or disabled by disease on the Canadian side in 1866."
