  - title: Pembina and the end of the raids
    date: October 1871
    when: "1871-10-05"
    borders: "1871-10-05"
    countries: [ca, us]
    body:
      - The last raid was aimed at Manitoba, which had joined Canada in 1870 after the Red River Resistance. O’Neill and William B. O’Donoghue, an Irish-born teacher who had been treasurer of Louis Riel’s provisional government in 1869–1870, hoped the Métis would rise with them. Instead Riel and other Métis leaders offered their help to the lieutenant governor, Adams Archibald, who reviewed the mounted Métis at St. Boniface on 8 October 1871. On 5 October O’Neill, with about 35 men, seized the Hudson’s Bay Company post at Pembina, which proved to stand on the American side of the boundary; US soldiers under Captain Loyd Wheaton arrested him the same day, and Métis captured O’Donoghue and handed him to the Americans.
      - The Fenian invasions were over. They had cost several dozen lives on both sides, many of the Canadian dead from disease in the militia camps, and the Canadian government had spent heavily on its militia. Canada’s claims for the raids were left out of the Treaty of Washington between Britain and the United States in 1871, and Britain compensated Canada with a guaranteed loan. In Canada the raids were long remembered as a threat that had helped unite the colonies; Ridgeway is described as the last battle fought in Ontario against a foreign invading force.
    facts:
      - [Pembina raid, "5 October 1871"]
      - [Fenians in the raid, "about 35"]
