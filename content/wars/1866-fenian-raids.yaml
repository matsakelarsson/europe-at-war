id: fenian-raids
name: Fenian raids
start: "1866-04"
end: "1871-10-05"
tier: B
summary: "Armed raids from the United States into British North America by the Fenian Brotherhood, an Irish-American organisation that aimed to seize Canada and hold it hostage to force Britain to grant Ireland its independence. Many Fenians were veterans of the American Civil War. After a failed attempt on Campobello Island in New Brunswick in April 1866, John O’Neill crossed the Niagara River on 1 June 1866 with about a thousand men, defeated the Canadian militia at Ridgeway and Fort Erie the next day, and withdrew to the United States, where the US Navy intercepted his men. A second force entered Quebec at Pigeon Hill on 7 June and retreated within two days. The US government, which had tolerated the Fenians’ preparations, then enforced its neutrality laws. In May 1870 Canadian militia beat back Fenian raids at Eccles Hill and Trout River, and in October 1871 a small party under O’Neill seized a Hudson’s Bay Company post at Pembina, on the border of the new province of Manitoba, which turned out to be on American soil, and was arrested by US troops. The raids cost several dozen lives on both sides, and the danger they showed helped bring about the confederation of Canada in 1867."
countries: [ca, us]
