steps:
  - title: Campobello, Ridgeway and Fort Erie
    date: April – June 1866
    when: "1866-06-02"
    borders: "1866-06-02"
    countries: [ca, us]
    view:
      center: [-79.03, 42.93]
      size: [60, 50]
    body:
      - The Fenian Brotherhood was founded in New York in 1858 by John O’Mahony as the American wing of the Irish Republican Brotherhood. After the Civil War it could draw on tens of thousands of Irish-born veterans of the Union and Confederate armies, and its leaders believed that a war with Britain in North America would help Ireland win its freedom. In April 1866 O’Mahony’s wing gathered some 700 men at Eastport, Maine, opposite Campobello Island in New Brunswick. Royal Navy warships carrying about 700 soldiers came from Halifax, US troops under General George Meade seized the Fenians’ arms, and the men dispersed. The scare helped the supporters of Confederation win the elections in New Brunswick that summer.
      - "The rival “Senate” wing planned a larger invasion, of which only one prong crossed in strength. In the early hours of 1 June 1866 Colonel John O’Neill, a Union cavalry veteran, crossed the Niagara River from Buffalo with about 1,000 men, took the village of Fort Erie and cut the telegraph and railway. On the morning of 2 June, near Ridgeway, some 850 Canadian volunteers, the Queen’s Own Rifles of Toronto, the 13th Battalion of Hamilton and two rifle companies from Haldimand County, under Lieutenant Colonel Alfred Booker, ran into O’Neill’s positions. After about two hours of fighting, a false alarm of Fenian cavalry led the Canadians to form a square, under fire, and then to break and retreat to Port Colborne. Seven of them were killed on the field and two died of wounds soon after, and four more died later of wounds or disease; Fenian losses are uncertain, from the one or two killed O’Neill admitted to about ten in other estimates."
      - "That afternoon a small Canadian force under Lieutenant Colonel John Stoughton Dennis, the Welland Canal Field Battery and the Dunnville Naval Brigade, landed at Fort Erie from a tug and was overwhelmed when O’Neill’s men returned; most were taken prisoner. Learning that British regulars and more militia were closing in and that no reinforcements could cross, O’Neill released his prisoners and took his men back across the river on the night of 2–3 June, where the gunboat USS Michigan intercepted them; several hundred were detained. On 6 June President Andrew Johnson ordered the neutrality laws enforced, and Generals Grant and Meade went to the border to stop further crossings."
