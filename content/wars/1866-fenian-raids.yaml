  - title: Pigeon Hill, Eccles Hill and Trout River
    date: June 1866 – May 1870
    when: "1870-05-25"
    borders: "1870-05-25"
    countries: [ca, us]
    body:
      - On 7 June 1866 General Samuel P. Spear led 1,000 or more Fenians across the Vermont border into Missisquoi County, Quebec, and occupied Pigeon Hill, Saint-Armand, Frelighsburg and Stanbridge. Short of arms, food and ammunition, which US authorities had seized, they plundered farms and waited for reinforcements that never came. When Canadian volunteers and British regulars advanced on 8 June, most of them retreated across the border; the cavalry of the Royal Guides took some prisoners. Canadian courts tried the captured raiders of 1866 and sentenced several to death, but the sentences were commuted. On 1 July 1867 New Brunswick, Nova Scotia and the Province of Canada united as the Dominion of Canada, and the Fenian threat had been one of the arguments for union.
      - By 1870 O’Neill was president of the Brotherhood. On 25 May 1870 he led several hundred Fenians from Franklin, Vermont, towards Eccles Hill, just across the border, where Canadian militia under Lieutenant Colonel William Osborne Smith and local home guards under Brown Chamberlin waited on the ridge, warned by Thomas Billis Beach, a British spy in the Fenian leadership known as Henri Le Caron. Their fire stopped the Fenians at the border; two Fenians were killed, and O’Neill, returning to the American side, was arrested by a US marshal. On 27 May another Fenian force crossed from Malone, New York, near Trout River, west of Huntingdon, and was driven back by Canadian militia and the British 69th Regiment without loss.
