steps:
  - title: The persecution of 1866 and the survey of the Han
    date: March – October 1866
    when: "1866-03"
    borders: "1866-09-26"
    countries: [kr, fr]
    body:
      - The regent Heungseon Daewongun, who governed for his young son King Gojong from 1864, at first tolerated the small Catholic church, which had about 23,000 Korean members and twelve French priests of the Paris Foreign Missions Society. After Russian ships appeared on the east coast in January 1866, Korean converts suggested an alliance with France against Russia; instead the court arrested the French bishop Siméon-François Berneux, who was beheaded on 7 March. Nine of the twelve French priests were executed, and estimates of the Korean Catholics killed in the persecution, many of them at Jeoldusan on the Han River in Hanseong, range from about 8,000 to 10,000.
      - One of the surviving priests, Félix-Clair Ridel, escaped by fishing boat to China in July and told Rear Admiral Roze at Tianjin. Roze and the French chargé d’affaires in Beijing, Henri de Bellonet, decided on a punitive expedition without waiting for orders from Paris; Bellonet even demanded, without authority, that the Korean king give up his crown. Roze was more cautious and aimed at reparations.
      - Having no charts, Roze first sent three ships to survey the approaches. In late September they passed Ganghwa Island and went up the Han as far as Yanghwajin and Seogang, just outside Hanseong, causing panic in the capital, before returning to China. The survey convinced Roze that his ships could not attack the city, and that the best he could do was to seize Ganghwa, which commanded the mouth of the river, and blockade the capital.
    facts:
      - [French missionaries executed, "nine of twelve"]
      - [Korean Catholics killed, "about 8,000 to 10,000"]
      - [Survey of the Han, "late September 1866"]
