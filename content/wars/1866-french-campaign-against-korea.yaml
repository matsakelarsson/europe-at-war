id: french-campaign-against-korea
name: French campaign against Korea
start: "1866-10-11"
end: "1866-11-11"
tier: B
summary: "A French punitive expedition to Korea, called Byeongin Yangyo in Korean (“the Western disturbance of 1866”). Early in 1866 the government of the regent Heungseon Daewongun executed nine French Catholic missionaries and thousands of Korean converts. Rear Admiral Pierre-Gustave Roze, commander of the French squadron in the Far East, surveyed the Han River up to the outskirts of Hanseong in September and returned in October with seven ships and about 800 men. His marines took the town of Ganghwa on 16 October and held it for nearly four weeks, carrying off silver, weapons and books from the royal library there. But a landing at Munsusanseong on the mainland was driven back on 26 October, and on 9 November Korean tiger hunters under Yang Heon-su repulsed an attack on Jeongjoksanseong. Roze burned the government buildings of Ganghwa and withdrew on 11 November. The Daewongun treated the outcome as a victory and hardened Korea’s isolation; the looted royal protocols were returned to Korea on a renewable loan in 2011."
countries: [kr, fr]
sides:
  - id: fr
    name: France
    polities: [france]
    ink: navy
    moves: French moves
    success: French success
  - id: js
    name: Joseon Korea
    polities: [joseon]
    ink: red
    moves: Korean moves
    success: Korean success
notes:
  - The dates are the Gregorian dates of the French reports, as given in the English Wikipedia article. Korean records use the lunar calendar (Ganghwa fell on the 8th day of the ninth month); the Gregorian dates in the Korean Wikipedia article for the autumn fighting are about a month too late.
  - French numbers vary between accounts, from about 600 to over 1,000 men; Korean accounts give larger figures.
