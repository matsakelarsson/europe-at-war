  - title: Ganghwa, Munsusanseong and Jeongjoksanseong
    date: October – November 1866
    when: "1866-10"
    borders: "1866-11-09"
    countries: [kr, fr]
    body:
      - Roze sailed from Yantai on 11 October with the frigate Guerrière, two corvettes, two gunboats and two dispatch boats, carrying about 800 men, among them some 300 marines from Yokohama. On 16 October his marines landed at Gapgot and took the walled town of Ganghwa. They seized flags, cannon, thousands of muskets, boxes of silver and gold, and the manuscripts and paintings of the royal library at Oegyujanggak, among them the uigwe, the illustrated protocols of court ceremonies. Roze wrote to the Korean commander on the mainland, Yi Yong-hui, demanding reparations and the punishment of those responsible; there was no reply, and Korean troops gathered daily across the strait.
      - On 26 October about 120 marines landed on the mainland to take the mountain fort of Munsusanseong, which overlooked the strait, and were met by heavy fire from Han Seong-geun’s troops; the French withdrew with losses. On the night of 7 November Yang Heon-su crossed secretly to the south of the island with about 500 tiger hunters, skilled marksmen, and occupied Jeongjoksanseong, the walled hill around the temple of Jeondeungsa. When about 160 marines under Olivier attacked it on 9 November, they were driven off with some thirty wounded.
      - With winter coming, Korean forces growing, and news that the two missionaries he had come to rescue had escaped to China, Roze decided to leave. His men burned the palace and government buildings of Ganghwa, carried off what they could, and re-embarked on 11 November. The French lost three dead and about 35 wounded in the whole campaign. The Daewongun proclaimed a victory over the Western powers, and the books taken from Ganghwa went to the Bibliothèque nationale in Paris, where 297 volumes of uigwe remained until their return to Korea in 2011.
    facts:
      - [Ganghwa taken, "16 October 1866"]
      - [Munsusanseong, "26 October 1866, Korean success"]
      - [Jeongjoksanseong, "9 November 1866, Korean success"]
      - [French losses, "3 killed, about 35 wounded"]
