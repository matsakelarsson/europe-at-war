id: general-sherman-incident
name: General Sherman incident
start: "1866-08-16"
end: "1866-09-02"
tier: C
summary: "The destruction of the American-owned armed merchant schooner General Sherman on the Taedong River at Pyongyang. The ship sailed from Yantai on 9 August 1866 with a cargo of cotton cloth, glass and tinware, intending to open trade with Korea despite its closed-door policy. On board were its owner W. B. Preston, an American captain and mate, the British supercargo George Hogarth, the Welsh missionary Robert Jermain Thomas as interpreter, and a Chinese and Malay crew. It entered the Taedong on 16 August and went up to Pyongyang, ignoring officials’ orders to leave. The regent Heungseon Daewongun, who took it for a French warship come to avenge the executed missionaries, told the governor of Pyongan, Bak Gyu-su, to drive it away. When the crew seized a Korean officer, Yi Hyeon-ik, whose boat had been shadowing them, crowds gathered on the banks and attacked the ship, which had run aground on a sandbank as the river fell, and its cannon killed several people on the shore. On 2 September Korean troops sent fire ships down on it; the ship burned and everyone on board, about twenty people, was killed as they reached the bank. The United States learned of their fate only gradually, and in 1871 sent a naval expedition to Korea, in part because of the incident. North Korean accounts later credited Kim Il Sung’s great-grandfather Kim Ung-u with leading the attack, for which there is no historical evidence."
