  - title: Wagon boxes and the Treaty of Fort Laramie
    date: August 1867 – November 1868
    when: "1867-08-02"
    borders: "1868-11-06"
    countries: [us]
    body:
      - "In 1867 the forts received Springfield rifles converted to breech-loaders, which could be fired several times as fast as the old muzzle-loaders. On 1 August Cheyenne, Arapaho and Lakota warriors attacked soldiers and civilian hay-cutters near Fort C. F. Smith, who held out in a log corral (the Hayfield Fight); the next day several hundred Lakota attacked Captain James Powell’s 32 men guarding woodcutters near Fort Phil Kearny, who fought from behind a ring of wagon boxes until relief came (the Wagon Box Fight). The army counted both as victories, but the warriors kept the forts under siege and the trail closed."
      - "A peace commission led by General William T. Sherman concluded that the forts were not worth keeping, now that the Union Pacific Railroad was being built across the plains to the south. The Treaty of Fort Laramie of 1868, signed by band after band from April, created the Great Sioux Reservation, all of today’s South Dakota west of the Missouri, including the Black Hills, “for the absolute and undisturbed use and occupation” of the Lakota, and closed the Powder River country to whites as unceded Indian territory. The army left the forts in August 1868, and the Lakota and Cheyenne burned them. Red Cloud came in and signed on 6 November."
      - "Red Cloud never went to war again and settled at the agency that bore his name; others, such as Sitting Bull and Crazy Horse, kept to the buffalo country and never signed. The treaty required the consent of three-quarters of the adult men for any cession, a clause the United States broke when it took the Black Hills in 1877; in 1980 the Supreme Court ruled the taking illegal, and the compensation, which the Lakota have refused, has grown to more than a billion dollars."
    facts:
      - [Hayfield Fight, "1 August 1867"]
      - [Wagon Box Fight, "2 August 1867"]
      - [Treaty of Fort Laramie, "signed from 29 April 1868; by Red Cloud on 6 November 1868"]
