steps:
  - title: The Bozeman Trail and the Fetterman Fight
    date: June – December 1866
    when: "1866-12-21"
    borders: "1866-12-21"
    countries: [us]
    body:
      - "Gold strikes in Montana from 1862 brought miners up the Bozeman Trail, opened in 1863, which left the Oregon Trail near Fort Laramie and ran north along the eastern foot of the Bighorn Mountains to Virginia City. It crossed the Powder River country, recognised as Crow land in 1851 but taken by the Lakota, Northern Cheyenne and Northern Arapaho, for whom it was now the richest buffalo range left. After the fighting of 1865, a peace commission met the Lakota at Fort Laramie in June 1866. During the talks Colonel Henry Carrington arrived with about 700 soldiers under orders to fortify the trail, and Red Cloud, Man Afraid of His Horses and others walked out."
      - "Carrington took over Fort Reno on the Powder River, built Fort Phil Kearny below the Bighorns as his headquarters in July and Fort C. F. Smith on the Bighorn River in August. Warriors from the great camps on the Tongue River attacked the forts’ herds, wood trains and passing travellers again and again in the following months (fifteen attacks near Fort Phil Kearny alone between mid-July and late September); travel on the trail almost stopped."
      - "On 21 December 1866 warriors attacked a wood train near Fort Phil Kearny, and a decoy party of about ten men, among them Crazy Horse, drew the relief force of Captain William Fetterman, 81 officers, soldiers and civilians, over Lodge Trail Ridge. There more than 1,000 Lakota, Cheyenne and Arapaho, with the Miniconjou Hump (High Backbone) prominent in the fighting, surrounded and killed them all within about half an hour. It was the army’s worst defeat on the plains until the Little Bighorn. Red Cloud had helped plan the attack; estimates of Native losses range from about a dozen to 160."
    facts:
      - [Fort Phil Kearny founded, "13 July 1866"]
      - [Fetterman Fight, "21 December 1866, Lakota, Cheyenne and Arapaho victory"]
      - [US dead, "81"]
