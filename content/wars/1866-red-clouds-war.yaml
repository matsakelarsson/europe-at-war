id: red-clouds-war
name: Red Cloud’s War
start: "1866-06"
end: "1868-11-06"
tier: B
summary: "The war of 1866–1868 between the Lakota, Northern Cheyenne and Northern Arapaho and the United States over the Bozeman Trail, the road from the Oregon Trail to the Montana gold fields through the Powder River country east of the Bighorn Mountains. The Treaty of Fort Laramie of 1851 had recognised that country as Crow land, but by 1860 the Lakota and their allies had taken it from the Crow as their best remaining buffalo range. When the army began building forts along the trail in June 1866, during peace talks at Fort Laramie, the Oglala leader Red Cloud (Mahpiya Luta) and others left the council and made war. Lakota, Cheyenne and Arapaho warriors harassed the forts, their wood trains and travellers for two years, and on 21 December 1866 a decoy party that included the young Crazy Horse drew Captain William Fetterman and 80 men into an ambush near Fort Phil Kearny, where all were killed. Soldiers with new breech-loading rifles held off attacks at the Hayfield and Wagon Box fights in August 1867, but the trail stayed closed. With the Union Pacific Railroad offering another way west, the government gave in: by the Treaty of Fort Laramie of 1868 it abandoned the forts, which the Lakota and Cheyenne burned, closed the Powder River country to whites as unceded Indian territory and created the Great Sioux Reservation, including the Black Hills. Red Cloud signed on 6 November 1868. It is often called one of the few wars the United States lost to a Native nation; the treaty’s breach over the Black Hills led to the Great Sioux War of 1876."
