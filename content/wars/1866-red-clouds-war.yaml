notes:
  - "The Crow, whose treaty land the forts stood on, supported the army against their Lakota enemies; the 1868 treaties gave the Powder River country to the Lakota and their allies and left the Crow a reservation on the Yellowstone. Lakota accounts call the Fetterman Fight the Battle of the Hundred in the Hands; estimates of Native losses there range from about 13 to as many as 160; Native accounts name between 11 and 21 dead."
