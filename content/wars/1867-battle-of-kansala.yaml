id: battle-of-kansala
name: Battle of Kansala
start: "1867"
end: "1867"
tier: B
summary: "The siege and destruction of Kansala, the capital of Kaabu, by the army of the Imamate of Futa Jallon and the Fula of Kaabu who had risen under Alfa Molo, remembered by the Mandinka as Turban Keloo, the war of annihilation. Kaabu, a federation of Mandinka kingdoms that had begun as a western province of the Mali Empire, had ruled the lands between the Gambia river and the Geba for three centuries and grown rich on the slave trade. In the 19th century it was weakened by the end of that trade, by the jihad of Futa Jallon to the south, and by the revolt of the Fula herders who lived among its Mandinka nobility, the Nyancho. In 1867, by the usual dating, Futa Jallon’s army and Alfa Molo’s Fula besieged Kansala; after an assault that lasted, by tradition, eleven days, Mansaba Janke Waali Sanneh opened the gates and had his sons fire the town’s powder stores, killing the defenders and many of the attackers. Kaabu ceased to exist as a power, Futa Jallon carried off thousands of captives, and Alfa Molo founded the kingdom of Fuladu in its eastern lands. The battle is told mainly by griots, and some historians think tradition has enlarged or merged it with earlier fighting."
