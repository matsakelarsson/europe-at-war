steps:
  - title: The fall of Kansala
    date: "1867"
    when: "1867-05-13"
    borders: "1866-12-31"
    countries: [gw, sn, gm, gn]
    body:
      - "By the 1860s Kaabu was a shrinking federation of Mandinka kingdoms ruled from Kansala, near today’s Gabú in Guinea-Bissau. Its warrior nobility had lived from raiding and selling captives, and as the Atlantic slave trade ended it taxed its peasants harder. The Fula herders who had settled among the Mandinka, many of them refugees from Futa Jallon, were treated as a possible enemy within and squeezed for cattle and tribute. From the late 1840s Alfa Molo, a Fula born a slave, raided Mandinka villages from his fort at Ndorna; when Kaabu struck back he called in the Imamate of Futa Jallon, whose Muslim rulers had been at war with Kaabu for decades. Kaabu’s fortresses fell one by one, among them Berekolong and the core kingdom of Jimara."
      - "In 1867, by the usual dating, the army of Futa Jallon and Alfa Molo’s Fula surrounded Kansala. Oral tradition puts Kaabu’s whole strength at 25,000 men, half of them in Kansala, and the attackers at 12,000 to 32,000. It tells of a siege of one to three months in which neither side would fire first, because marabouts had told both leaders that the side that fired first would lose, until a Mandinka shot began the battle on 13 May. For eleven days the Fula, unable to use their cavalry against the walls, lost many men on the scaling ladders. Then Mansaba Janke Waali, seeing that he could not hold out, ordered the gates opened; Mandinka women threw themselves into the wells rather than be enslaved, and when the town was full of attackers his sons fired six of its seven powder stores. The explosion killed the defenders and, by tradition, all but about 4,000 of the attackers."
      - "Kaabu’s power ended at Kansala, although Mandinka kingdoms that had belonged to it lived on along the Gambia. Futa Jallon took about 15,000 captives. Alfa Molo made the eastern lands of Kaabu into the kingdom of Fuladu, which he and his son Musa Molo ruled until the British, French and Portuguese divided it between them; Musa Molo was driven out by the French in 1903. For the Mandinka griots of Senegambia the fall of Kansala remains one of their best-known stories."
    facts:
      - [Battle, "1867 (by tradition from 13 May; some sources 1864 or 1865)"]
      - [Kaabu, "about 25,000 men in all (oral tradition)"]
      - [Attackers, "12,000–32,000 (oral tradition)"]
      - [Captives taken, "about 15,000"]
