notes:
  - "The date and the scale of the battle are uncertain. Most accounts give 1867, others 1864 or 1865. Contemporary European sources do not mention it and the remains at Kansala are small, so the historian George Brooks has argued that oral tradition exaggerated it or merged it with the fall of the fortress of Berekolong, which had held out against Fula armies until about 1850–1851. The numbers below come from oral tradition as collected by the historian Djibril Tamsir Niane."
