notes:
  - Many of the fighters on both sides were Chinese miners organised in rival brotherhoods (Yap Ah Loy belonged to the Hai San), Mandailing settlers from Sumatra, Batu Bara men and European adventurers hired as officers; the princes depended on them and on the Straits merchants who financed the war.
