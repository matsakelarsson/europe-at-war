id: klang-war
name: Klang War
start: "1867-03"
end: "1874"
tier: C
summary: "A civil war in Selangor, also called the Selangor Civil War, between rival Malay princes, each allied with Chinese tin-mining groups, over the revenues of the Klang valley and its tin mines. In 1866–1867 Raja Mahdi, a grandson of an earlier sultan who felt he had been passed over, quarrelled with Raja Abdullah, the governor of Klang, over the right to tax the opium and tin trade, and took Klang in March 1867. Sultan Abdul Samad stayed largely aloof at Langat. On 26 June 1868 he made his new son-in-law Tengku Kudin, a prince of Kedah, viceroy (Wakil Yamtuan) to end the war; Kudin backed Raja Abdullah’s son Raja Ismail, and with his help Ismail retook Klang in March 1870, while Mahdi fell back on Kuala Selangor. In Kuala Lumpur the Hakka leader Yap Ah Loy, the Kapitan China, sided with Kudin, while rival Chinese miners under Chong Chong joined Mahdi. In July 1871, after the crew of a Penang junk were killed off Selangor in an attack the British traced to Kuala Selangor, British warships bombarded the town and it was handed to Kudin; Raja Musa, who had claimed it, went over to Mahdi. In 1872 Mahdi’s side, with the Mandailing leaders Raja Asal and Sutan Puasa and the commander Syed Mashhor, besieged Kudin’s men at Bukit Nanas and took Kuala Lumpur, which was burned; Yap Ah Loy escaped to Klang. With about 1,000 men raised by Yap and about 1,000 Pahang fighters under Tok Gajah, sent by the Bendahara Wan Ahmad, Kudin retook Kuala Lumpur in March 1873, and the Pahang forces captured Kuala Selangor on 8 November 1873, which largely ended the war. Mahdi went into exile in Johor and Singapore. The war, with the Larut Wars in Perak, led the British government to give up its policy of non-intervention in the Malay states in September 1873; Selangor accepted a British Resident in 1875, and Yap Ah Loy rebuilt Kuala Lumpur."
