id: mentana-campaign
name: Mentana campaign
start: "1867-09"
end: "1867-11-03"
tier: C
summary: Giuseppe Garibaldi’s attempt in autumn 1867 to take Rome, the last remnant of the Papal States, after the French garrison had left under the September Convention of 1864. The Italian government, bound by the convention, had Garibaldi arrested in September and sent to Caprera, but he escaped, and volunteer columns crossed into Papal territory. A rising in Rome on 22 October failed, the brothers Enrico and Giovanni Cairoli were defeated at Villa Glori, and Garibaldi took Monterotondo on 26 October. France sent troops back to Rome, and on 3 November Papal troops and a French brigade armed with the new Chassepot rifle defeated Garibaldi’s volunteers at Mentana. Garibaldi was arrested again on Italian soil, and the French garrison stayed in Rome until 1870.
