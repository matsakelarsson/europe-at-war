notes:
  - The French commander, General Pierre de Failly, reported that the Chassepots had “done wonders”, a phrase that angered Italian opinion. A bomb attack by Roman patriots on the Serristori barracks on 22 October killed more than 20 Papal Zouaves; two of the men responsible were executed in 1868.
