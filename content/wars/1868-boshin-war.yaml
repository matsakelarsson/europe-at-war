  - title: Enomoto’s fleet and the Republic of Ezo
    date: October 1868 – January 1869
    when: "1868-10-04"
    borders: "1869-01-27"
    countries: [jp, fr]
    body:
      - The shogunate’s navy had not been handed over with Edo. On 4 October 1868 its commander Enomoto Takeaki sailed from Shinagawa with eight ships, about 2,000 men and some of the French military advisers, among them Captain Jules Brunet, who had resigned to join him. The fleet lost two ships in a storm, gathered at Sendai, took on board the remnants of the shogunate and alliance troops, including Ōtori Keisuke and the Shinsengumi vice-commander Hijikata Toshizō, and sailed for Ezo, the northern island, which Enomoto proposed to develop as a home for the Tokugawa retainers.
      - The fleet landed some 3,000 men at Washinoki on 3 December. They took Goryōkaku, the new Western-style star fort at Hakodate, a few days later, and on 18 December Hijikata took Matsumae Castle from the Matsumae domain, which had sided with the court. The flagship Kaiyō Maru, the most powerful warship in Japan, was wrecked in a storm at Esashi on 28 December. On 27 January 1869 Enomoto’s followers elected him president (sōsai) of what foreigners called the Republic of Ezo. Its government asked the court to let it hold Ezo for the Tokugawa retainers; the court refused.
    facts:
