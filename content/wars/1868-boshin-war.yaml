  - title: The siege of Aizu
    date: October – November 1868
    when: "1868-10-06"
    borders: "1868-10-08"
    countries: [jp]
    body:
      - On 6 October 1868 the imperial army under Itagaki Taisuke and Ijichi Masaharu broke through the alliance’s defences at Bonari Pass, on the mountain road from Nihonmatsu, and marched on Aizu-Wakamatsu faster than its defenders expected. On 8 October they entered the castle town. In the confusion a squad of the Byakkotai (“White Tiger Force”), teenage samurai sons, saw the town burning from the hill of Iimoriyama and, believing the castle lost, killed themselves; nineteen died. Many families of Aizu samurai also took their own lives rather than be captured, and women of Aizu, among them Nakano Takeko, fought and died with the men.
      - The castle, Tsuruga-jō, held out for a month under bombardment by imperial artillery. One by one the other members of the alliance gave up. Yonezawa submitted in October and Sendai at the end of October, and Aizu’s lord Matsudaira Katamori surrendered on 6 November 1868. Aizu lost about 3,000 dead. The domain was abolished, and in 1869 its samurai were resettled in a small new domain at Tonami in the cold and barren far north of Honshu. Shōnai, the last of the alliance, surrendered a few days after Aizu.
    facts:
      - [Bonari Pass, "6 October 1868"]
      - [Imperial army enters Aizu-Wakamatsu, "8 October 1868"]
      - [Aizu surrenders, "6 November 1868"]
      - [Aizu dead, "about 3,000"]
