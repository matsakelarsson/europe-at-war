steps:
  - title: The restoration of imperial rule
    date: November 1867 – January 1868
    when: "1867-11-09"
    borders: "1868-01-03"
    countries: [jp]
    body:
      - After the failure of the Second Chōshū expedition, Satsuma and Chōshū prepared to overthrow the shogunate by force. The new shogun, Tokugawa Yoshinobu, tried to forestall them. On 9 November 1867, on the advice of the Tosa domain, he returned his governing powers to the young Emperor Meiji, expecting to remain the greatest lord in the country and to lead a new council of daimyo. On 3 January 1868 Satsuma, with court nobles led by Iwakura Tomomi and troops from Tosa, Echizen, Owari and Aki, took over the gates of the imperial palace in Kyoto, proclaimed the restoration of imperial rule and the abolition of the shogunate, and that night demanded that Yoshinobu give up his offices and his lands.
      - Yoshinobu withdrew with his troops and the Aizu and Kuwana soldiers to Osaka Castle, where he received the foreign envoys as Japan’s ruler and declared that he would not be bound by the proclamation. In Edo, rōnin sheltered by the Satsuma residence carried out robberies and arson to provoke the shogunate, and on 19 January 1868 shogunate troops and the Shōnai domain burned the Satsuma residence. When the news reached Osaka, Yoshinobu’s officers demanded war, and he agreed to march on Kyoto to petition the emperor against Satsuma.
    facts:
      - [Return of powers to the emperor, "9 November 1867"]
      - [Coup in Kyoto and restoration of imperial rule, "3 January 1868"]
      - [Burning of the Satsuma residence in Edo, "19 January 1868"]
