  - title: The Northern Alliance
    date: June – September 1868
    when: "1868-06"
    borders: "1868-06-22"
    countries: [jp]
    body:
      - The court ordered the domains of the north-east to punish Aizu, whose lord Matsudaira Katamori had commanded the shogunate’s forces in Kyoto, and Shōnai, which had burned the Satsuma residence. Sendai and Yonezawa pleaded for Aizu instead, and when the imperial envoy Sera Shūzō was killed by Sendai samurai, the northern domains made common cause. On 22 June 1868 more than twenty, and soon thirty-one domains formed the Ōuetsu Reppan Dōmei, the alliance of the domains of Mutsu, Dewa and Echigo, with its headquarters at Shiroishi and Prince Kitashirakawa Yoshihisa, abbot of Kan’ei-ji, as its nominal head. Its armies were large but mostly armed in the old style, and its members did not all share Aizu’s determination.
      - The imperial army had taken the key castle of Shirakawa, the gateway to the north, on 20 June, and threw back the alliance’s efforts to retake it. In Echigo the Nagaoka domain, led by Kawai Tsugunosuke, who had bought modern rifles and two Gatling guns, joined the alliance; its castle fell on 8 July, was retaken in a daring counter-attack on 10 September and lost again a few days later, and Kawai died of his wounds. Through the summer the imperial army, with modern rifles and artillery, pushed north and took Nihonmatsu, whose boy soldiers died defending it. The Kubota (Akita) domain left the alliance, and Shōnai and Sendai troops invaded it.
    facts:
