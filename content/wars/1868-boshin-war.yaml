  - title: Toba and Fushimi
    date: 27–31 January 1868
    when: "1868-01-27"
    borders: "1868-01-27"
    countries: [jp]
    body:
      - On 27 January 1868 the shogunate army, about 15,000 men including the French-trained infantry, Aizu and Kuwana troops and the Shinsengumi, marched from Osaka towards Kyoto along the Toba and Fushimi roads. Satsuma troops barred the bridge at Koeda on the Toba road and opened fire when the shogunate column tried to pass, while at Fushimi the Aizu troops and the Shinsengumi fought Chōshū and Satsuma soldiers around the magistrate’s office, which burned. The imperial side had only about 5,000 men, but they were better armed and led, and the shogunate columns, marching in road formation, were thrown back.
      - On 28 January the court named Prince Ninnaji-no-miya Yoshiaki commander-in-chief and gave him the brocade banner of the imperial army, which was raised over the Satsuma and Chōshū troops. Fighting against the emperor’s banner, the shogunate’s allies wavered. The Yodo domain, whose lord was a member of the shogun’s government, shut its castle gates against the retreating shogunate troops, and on 30 January the Tsu domain, posted at Yamazaki, turned its guns on them at Hashimoto. The shogunate army fell back to Osaka with 895 killed and wounded, against 326 on the imperial side.
      - On the night of 30–31 January Yoshinobu, who had promised to lead his troops in person, slipped out of Osaka Castle with Matsudaira Katamori of Aizu and a few others and sailed for Edo on the warship Kaiyō Maru. His army dispersed, and imperial troops took over Osaka Castle, which burned. The court declared Yoshinobu an enemy of the throne.
    facts:
      - [Shogunate army, "about 15,000"]
      - [Imperial army, "about 5,000"]
      - [Losses, "shogunate 895 killed and wounded, imperial 326"]
      - [Yoshinobu leaves Osaka, "31 January 1868"]
