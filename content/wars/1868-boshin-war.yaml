  - title: Miyako Bay and Hakodate
    date: March – June 1869
    when: "1869-03-09"
    borders: "1869-06-27"
    countries: [jp, fr]
    body:
      - In March 1869 the imperial fleet sailed north, led by the ironclad Kōtetsu, which the United States had withheld during the war and then delivered to the new government. When it put into Miyako Bay on the Iwate coast, Enomoto sent the warship Kaiten with Hijikata Toshizō and a boarding party to seize it by surprise on 6 May. The Kaiten came alongside, but its boarders were cut down by the Kōtetsu’s Gatling gun and the attack failed.
      - On 20 May about 1,500 imperial troops landed at Otobe on the west coast of the Oshima peninsula, followed by more, until about 7,000 were ashore. They advanced on Hakodate by three roads; Hijikata held the pass at Futamata for weeks, but Matsumae fell and the defenders were driven back. In Hakodate Bay the two fleets fought for several weeks, and the Ezo navy was destroyed. The French advisers escaped on a French warship. On 20 June the imperial army launched its general attack on Hakodate, and Hijikata was killed in the fighting near the Benten battery. Enomoto surrendered Goryōkaku to Kuroda Kiyotaka on 27 June 1869.
      - The new government pardoned and later employed many of its enemies; Enomoto himself became a minister. Ezo was renamed Hokkaido in 1869 and opened to Japanese settlement. In 1869 the daimyo returned their registers of land and people to the emperor, and in 1871 the domains were abolished and replaced by prefectures.
    facts:
      - [Battle of Miyako Bay, "6 May 1869"]
      - [Imperial landing at Otobe, "20 May 1869"]
      - [General attack on Hakodate, "20 June 1869"]
      - [Surrender of Goryōkaku, "27 June 1869"]
      - [Losses at Hakodate, "imperial about 770 killed and wounded, Ezo about 1,700 killed and wounded and 1,300 captured"]
    markers:
      - kind: naval
        side: imp
        name: Miyako Bay
        date: 6 May 1869
