notes:
  - Japan changed to the Gregorian calendar only in 1873, and the Japanese sources date the war by the lunar calendar. The dates here are Gregorian; some English accounts give lunar dates as if they were Gregorian (for example “August 20” for Enomoto’s departure from Shinagawa, which was 4 October).
  - The numbers of men mobilised are given variously as about 69,000 and about 120,000; about 8,200 were killed and more than 5,000 wounded. The imperial dead were enshrined at the Tokyo Shōkonsha, founded in 1869 and later renamed Yasukuni Shrine; the dead of the defeated side were not.
  - France had trained the shogunate’s army through a military mission from 1867, and some of its officers, among them Jules Brunet, resigned to fight in Ezo. Britain favoured the imperial side. The Western powers declared their neutrality in February 1868.
