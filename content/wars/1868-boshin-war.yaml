id: boshin-war
name: Boshin War
start: "1868-01-27"
end: "1869-06-27"
tier: A
summary: "The civil war of 1868–1869 in which the new imperial government, led by men of the Satsuma and Chōshū domains, destroyed the power of the Tokugawa shogunate and its allies. The shogun Tokugawa Yoshinobu had handed back his powers to the emperor in November 1867, hoping to keep his lands and a leading place in a council of lords, but on 3 January 1868 Satsuma and its allies seized the palace in Kyoto and proclaimed the restoration of imperial rule. Yoshinobu’s march on Kyoto was beaten at Toba and Fushimi in late January, and when the imperial banner appeared on the battlefield he fled to Edo. The imperial army marched east, and in May 1868 Katsu Kaishū surrendered Edo Castle without a fight. In the north-east more than thirty domains formed the Ōuetsu Reppan Dōmei (the Northern Alliance) around Sendai and Aizu; they were defeated in a summer and autumn of hard fighting at Shirakawa, Nagaoka and Bonari Pass, and Aizu-Wakamatsu fell after a month’s siege on 6 November 1868. Enomoto Takeaki took most of the shogunate’s navy and some French officers to Ezo (Hokkaido), took Hakodate and Matsumae and set up the Republic of Ezo, which surrendered at Goryōkaku on 27 June 1869. The war, named after the year of the earth dragon (boshin) in which it began, cost about 8,200 lives; it gave the Meiji government control of the whole country and opened the way to the abolition of the domains in 1871."
countries: [jp, fr]
