  - title: Edo opens its gates
    date: February – July 1868
    when: "1868-02"
    borders: "1868-05-03"
    countries: [jp]
    body:
      - The imperial army, with Prince Arisugawa Taruhito as commander and Saigō Takamori as its chief of staff, marched on Edo in three columns along the Tōkaidō, the Nakasendō and the Hokurikudō, while most domains of central and western Japan declared for the court. Yoshinobu rejected the advice of the French envoy Léon Roches and his own officers to fight and shut himself up in a temple at Ueno. On 29 March Kondō Isami of the Shinsengumi, leading a small shogunate force to hold Kōfu, was routed at Katsunuma.
      - In Edo the shogunate’s army minister, Katsu Kaishū, met Saigō on 6 and 7 April and agreed that the city would be handed over without a battle in return for Yoshinobu’s life. The British envoy Harry Parkes, worried for foreign trade, also pressed Saigō for moderation. On 3 May 1868 Edo Castle was handed over to the imperial army, and Yoshinobu went into retirement at Mito. Many shogunate soldiers refused to accept the surrender. Ōtori Keisuke led some 2,000 north and fought for Utsunomiya Castle in May, and in Edo the Shōgitai held Kan’ei-ji at Ueno until the imperial army, under Ōmura Masujirō, stormed it with Armstrong guns on 4 July.
    facts:
