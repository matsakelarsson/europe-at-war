  - title: Arogee and Magdala
    date: 10–13 April 1868
    when: "1868-04-10"
    borders: "1868-04-13"
    countries: [et, gb]
    view:
      center: [39.17, 11.37]
      size: [70, 60]
    body:
      - On Good Friday, 10 April 1868, as the British vanguard climbed towards the heights of Fala and Selassie in front of Magdala, Tewodros’s army charged down on it on the Arogee plain. The attackers, with muzzle-loaders and spears, met breech-loading Snider rifles, rockets and artillery; about 700 Ethiopians were killed and 1,200 wounded, against two British dead and about twenty wounded. That night Tewodros tried to make peace, released the captives on 11 and 12 April and offered cattle, but would not surrender himself. On 13 April the British shelled Magdala and stormed the gates. Tewodros shot himself with a pistol that Queen Victoria had once sent him.
      - The British looted the fortress and its churches, and their prize agents auctioned the plunder on the spot. It included crowns, crosses, hundreds of manuscripts and church tabots, many of which are now in the British Library, the British Museum, the Victoria and Albert Museum and other collections. Magdala was then burned. Tewodros’s seven-year-old son Alemayehu was taken to Britain, where he died in 1879. The army marched back to the coast and had left by June. Napier gave Kassa Mercha guns and ammunition, which helped him defeat his rivals and be crowned Yohannes IV in 1872.
    facts:
      - [Battle of Arogee, "10 April 1868, British victory"]
      - [Ethiopian losses at Arogee, "about 700 killed, 1,200 wounded"]
      - [Storming of Magdala, "13 April 1868"]
