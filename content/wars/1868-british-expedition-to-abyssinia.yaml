notes:
  - The army was raised and supplied by the Bombay Presidency of British India; most of its soldiers and nearly all its followers came from India. Tewodros by then controlled only a small part of the country, and the rulers of Tigray, Lasta and Shewa stayed out of the fighting or helped the British.
  - Contemporary accounts call Magdala also Maqdala; Arogee is also written Arogye.
