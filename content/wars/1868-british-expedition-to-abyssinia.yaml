id: british-expedition-to-abyssinia
name: British Expedition to Abyssinia
start: "1867-10"
end: "1868-06"
tier: B
summary: "A British and Indian army’s march to Magdala to free British and other European captives held by Emperor Tewodros II. Tewodros had imprisoned the British consul Charles Cameron in January 1864, after his letter to Queen Victoria went unanswered, and later the envoy Hormuzd Rassam and missionaries. In 1867 the British government sent an army from Bombay under Sir Robert Napier: about 13,000 soldiers, 26,000 followers and more than 40,000 animals, among them elephants, landed at Zula on the Red Sea and marched some 600 km through the highlands, helped by the ruler of Tigray, Kassa Mercha. On 10 April 1868 Tewodros’s army was cut down at Arogee below Magdala; he released the captives, and on 13 April, as the British stormed the fortress, he shot himself. The British looted and burned Magdala and left the country by June. Kassa Mercha, rewarded with arms, became Emperor Yohannes IV in 1872. Many of the manuscripts and treasures taken from Magdala are still in British collections, and Ethiopia has long asked for their return."
countries: [et, er, gb]
sides:
  - id: gb
    name: British and Indian army (Napier)
    polities: [united-kingdom, british-india]
    ink: red
    moves: British moves
    success: British success
  - id: et
