  - title: From Zula to the Bashilo
    date: October 1867 – 9 April 1868
    when: "1868-01-02"
    borders: "1868-03-17"
    countries: [er, et, gb]
    body:
      - Royal Engineers landed at Zula on Annesley Bay in October 1867 and built piers, a short railway and a road up the Kumayli pass to Senafe on the edge of the highlands. Napier arrived on 2 January 1868 and set off for Senafe on 25 January. More than 280 ships brought the army from Bombay, with some 13,000 British and Indian soldiers, about 26,000 followers and over 40,000 mules, camels, horses and bullocks, and 44 elephants for the heavy guns.
      - The column climbed south through Tigray, buying food and transport from the local people. At Antalo Napier won the cooperation of the ruler of Tigray, Dejazmach Kassa Mercha, who let the army pass and helped supply it. It reached Lake Ashenge on 17 March, about 160 km from Magdala, with the troops on half rations. Tewodros, meanwhile, dragged his guns and mortar from Debre Tabor across the gorges to Magdala, which he reached in late March. The British reached the Bashilo river below the fortress on 9 April.
    facts:
      - [Napier lands at Zula, "2 January 1868"]
      - [Army, "about 13,000 soldiers, 26,000 followers, 40,000 animals"]
      - [Bashilo river reached, "9 April 1868"]
