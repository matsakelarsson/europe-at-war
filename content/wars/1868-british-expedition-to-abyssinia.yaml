steps:
  - title: The captives
    date: January 1864 – 1867
    when: "1864-01-02"
    borders: "1867-06-01"
    countries: [et, gb]
    body:
      - Tewodros had written to Queen Victoria in 1862 asking for friendship and help against his Muslim neighbours, and sent the letter through the British consul, Charles Cameron. The Foreign Office left it unanswered for two years, while Cameron travelled to the Egyptian-held Sudan, which Tewodros took as an insult. On 2 January 1864 the emperor had Cameron and his staff chained, together with other Europeans in his camp, among them the missionary Henry Stern, who had written disrespectfully of Tewodros’s descent.
      - In January 1866 Hormuzd Rassam arrived with a reply from the queen. He was received with honour at first, but in mid-1866 he too was made a prisoner, and the captives, Europeans with their families and servants, were later taken to the mountain fortress of Magdala. Tewodros, facing revolt everywhere, had moved his army between Debre Tabor and Magdala, where European craftsmen at Gafat had cast his great mortar, which his troops called Sebastopol. In 1867, after demands for their release had failed, the British government decided to send an army.
    facts:
      - [Cameron imprisoned, "2 January 1864"]
      - [Rassam’s mission, "arrived January 1866, imprisoned 1866"]
