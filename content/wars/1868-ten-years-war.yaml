  - title: Las Guásimas and the death of Céspedes
    date: November 1873 – March 1874
    when: "1874-03-15"
    borders: "1874-03-15"
    countries: [cu, es]
    body:
      - Gómez now took the offensive in Camagüey. On 9 November 1873 he defeated a Spanish column at La Sacra, and on 2 December, at Palo Seco near Guáimaro, his cavalry overran another and killed its commander. He planned to carry the war west across the trocha and gathered arms and men for the invasion.
      - On 27 February 1874 Céspedes, deposed and refused permission to leave for the United States, was surprised by a Spanish patrol at San Lorenzo, a hamlet in the Sierra Maestra where he lived with a single escort, and was killed as he tried to escape.
      - "From 15 to 19 March 1874 (some accounts give 16–20 March) Gómez, with Antonio Maceo among his commanders, fought the largest battle of the war at Las Guásimas, about 36 km south-west of Puerto Príncipe, against a Spanish force under Brigadier Armiñán of some 3,000 to 5,000 men. For five days about 2,000 insurgents attacked the Spanish columns, and Armiñán retreated to Puerto Príncipe with over 1,000 men killed, wounded or missing; the Cubans lost about 170. It was the insurgents’ greatest victory, but it used up the ammunition gathered for the invasion, which had to wait until the next year."
    facts:
