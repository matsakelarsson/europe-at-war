id: ten-years-war
name: Ten Years’ War
start: "1868-10-10"
end: "1878-05-28"
tier: A
summary: "The first Cuban war of independence, fought from 1868 to 1878 between the insurgent Republic of Cuba in Arms and Spain. On 10 October 1868 Carlos Manuel de Céspedes, a planter and lawyer of Manzanillo, freed the people he held in slavery at his La Demajagua sugar mill and proclaimed Cuba’s independence. The rising spread through the east of the island, Oriente and Camagüey, where there were fewer great plantations and fewer enslaved people than in the west, and briefly to Las Villas; the rebels took Bayamo, and in April 1869 an assembly at Guáimaro gave the republic a constitution, with Céspedes as president. Spain, supported in Havana by tens of thousands of Volunteers loyal to the colony, answered with columns, executions, forts and the fortified line of the Júcaro–Morón trocha that kept the war out of the sugar plantations of the west. Insurgent commanders such as Ignacio Agramonte, Máximo Gómez, Antonio Maceo and Calixto García won battles, notably Las Guásimas in 1874, and Gómez carried the war across the trocha into Las Villas in 1875, but the insurgents never had the arms, the recognition abroad or the unity to win: Agramonte was killed in 1873, the House of Representatives deposed Céspedes, who was killed in 1874, and regional quarrels split the army. After the end of the Carlist War in Spain, General Arsenio Martínez Campos combined fresh troops with pardons and promises, and on 10 February 1878 the Pact of Zanjón ended the war without independence or the abolition of slavery. Maceo rejected it in the Protest of Baraguá and fought on until May. Estimates of the dead range from about 100,000 to more than 200,000, most of them Spanish soldiers who died of disease and Cuban civilians and insurgents."
countries: [cu, es]
sides:
  - id: cub
    name: Republic of Cuba in Arms (Cuban Liberation Army)
    polities: [cuban-liberation-army]
    ink: red
    moves: Cuban moves
    success: Cuban success
  - id: es
    name: Spain (Captaincy General of Cuba, the Spanish army and the Volunteers)
    polities: [spain, cuba]
    ink: gold
    moves: Spanish moves
    success: Spanish success
notes:
  - The insurgents called themselves mambises, a name first used as an insult by the Spanish. Most of the Spanish army’s soldiers were conscripts from Spain, but the Volunteers, more than 70,000 by 1869, and many of the soldiers raised on the island were Cuban-born, and both sides recruited formerly enslaved people.
  - Death tolls are estimates. Estimates of the Spanish army’s dead run from about 81,000 to 96,000, most of them from disease; José Martí estimated 50,000 Cuban dead, and modern totals including civilians range from about 100,000 to 250,000.
  - The base map shows Cuba as a Spanish colony throughout; the land held by the insurgents, which changed with every campaign, is drawn in the steps. The war is continued in the Little War of 1879–1880 and the Cuban War of Independence of 1895–1898.
