  - title: Agramonte, Céspedes and the Virginius
    date: May – November 1873
    when: "1873-05-11"
    borders: "1873-05-11"
    countries: [cu, es, us, gb]
    body:
      - On 11 May 1873 Ignacio Agramonte was killed in a skirmish on the plain of Jimaguayú, south of Puerto Príncipe, and the Spanish burned his body. Máximo Gómez took over his command in Camagüey. The republic’s leaders were divided. The House of Representatives accused Céspedes of acting as a dictator and of favouring his own followers, and on 27 October 1873, meeting at Bijagual, it deposed him and made Salvador Cisneros Betancourt president.
      - "Four days later, on 31 October, the Spanish warship Tornado captured the Virginius, an American-registered steamer carrying men and arms to the insurgents, in international waters near Jamaica, and took her into Santiago de Cuba. From 4 November the local authorities shot 53 of those on board as pirates, among them the captain, the American Joseph Fry, many of the crew, some of them British, and the insurgent general Bernabé Varona. The killings stopped when the British sloop HMS Niobe under Sir Lambton Loraine arrived. The affair brought the United States and Spain close to war; Spain, then a republic, returned the ship and the survivors and paid compensation."
    facts:
      - [Death of Agramonte, "11 May 1873"]
      - [Céspedes deposed, "27 October 1873"]
      - [Virginius captured, "31 October 1873"]
      - [Executed at Santiago, "53, from 4 November 1873"]
    markers:
