  - title: The Protest of Baraguá
    date: March – May 1878
    when: "1878-03-15"
    borders: "1878-03-15"
    countries: [cu, es]
    body:
      - Antonio Maceo, now the leading insurgent general in Oriente, refused to accept a peace that left Cuba Spanish and slavery in place. On 15 March 1878 he met Martínez Campos at Los Mangos de Baraguá and told him so, and fighting resumed on 23 March under a new provisional government. But Maceo was isolated, and on 9 May, with the agreement of Martínez Campos, he left for Jamaica to seek support; the last of his forces surrendered, and on 28 May 1878 the war was over.
      - The war had devastated the east and killed perhaps 100,000 to more than 200,000 people, Spanish soldiers, insurgents and civilians, most of them from disease and hunger. Slavery did not survive it. In 1870 the Moret Law had freed enslaved children born after 1868 and people over 60; the Pact of Zanjón freed the enslaved who had fought; an 1880 law replaced slavery with an eight-year patronato, and slavery ended in Cuba in 1886. Calixto García, Maceo and other veterans soon took up arms again in the Little War of 1879–1880, and in 1895 Martí, Gómez and Maceo began the final war.
    facts:
      - [Protest of Baraguá, "15 March 1878"]
      - [Maceo leaves for Jamaica, "9 May 1878"]
      - [End of the war, "28 May 1878"]
      - [Slavery abolished in Cuba, "1880 (patronato), 1886"]
    markers:
      - kind: event
        side: cub
        name: Los Mangos de Baraguá
        date: 15 March 1878
        text: Maceo told Martínez Campos here that he would not accept the Pact of Zanjón.
        lonlat: [-75.970, 20.463]
