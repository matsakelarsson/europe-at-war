  - title: Martínez Campos and the Pact of Zanjón
    date: November 1876 – February 1878
    when: "1878-02-10"
    borders: "1878-02-10"
    countries: [cu, es]
    body:
      - The end of the Carlist War in Spain in 1876 freed troops for Cuba, and in November General Arsenio Martínez Campos arrived with large reinforcements. He pressed the insurgents with columns while offering pardons, good treatment of prisoners and the prospect of reform. After eight years of war the insurgents were exhausted and divided; Vicente García led another sedition at Santa Rita in May 1877, and many units surrendered. On 19 October 1877 Spanish troops captured President Estrada Palma at Tasajeras.
      - Martínez Campos opened talks in the autumn of 1877. On 8 February 1878 the House of Representatives dissolved the republic’s government, and on 10 February a committee of insurgent leaders signed the Pact of Zanjón at El Zanjón in Camagüey. It gave an amnesty, promised Cuba the same political rights as Puerto Rico, including representation in the Spanish Cortes, and freed the enslaved and the Chinese indentured workers who had served in the insurgent ranks. It did not give independence or abolish slavery.
    facts:
      - [Martínez Campos arrives, "November 1876"]
      - [Estrada Palma captured, "19 October 1877"]
      - [Pact of Zanjón, "10 February 1878"]
