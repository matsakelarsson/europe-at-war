  - title: Across the trocha
    date: January 1875 – 1876
    when: "1875-01-06"
    borders: "1875-01-06"
    countries: [cu, es]
    body:
      - In early January 1875 Gómez slipped across the trocha with a column that sources put at between about 600 and fewer than 2,000 men. In Las Villas he joined forces with the American Henry Reeve, who had fought for Cuba since 1869, and for a year the insurgents burned cane fields and sugar mills around Sancti Spíritus and towards Cienfuegos and Trinidad, freeing the enslaved workers who joined them. It was the first time the war had reached the rich sugar districts west of the trocha.
      - The invasion stalled for lack of reinforcements. Many officers of Oriente and Camagüey would not fight far from home or under a Dominican, and on 17 April 1875, at Lagunas de Varona, Vicente García led a sedition that forced President Cisneros Betancourt out; Juan Bautista Spotorno and then, from 1876, Tomás Estrada Palma succeeded him. On 4 August 1876 Henry Reeve was killed near Yaguaramas, and in 1876 Gómez left Las Villas. The war in the west petered out.
    facts:
