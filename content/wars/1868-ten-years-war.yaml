  - title: Guáimaro and the Volunteers
    date: January – June 1869
    when: "1869-04-10"
    borders: "1869-04-10"
    countries: [cu, es]
    body:
      - On 10 April 1869 delegates from Oriente, Camagüey and Las Villas met at Guáimaro and gave the Republic of Cuba in Arms a constitution. Agramonte and the Camagüeyans insisted that a House of Representatives should control both the president and the army, and Céspedes, elected president on 12 April, accepted it, with Manuel de Quesada as commander-in-chief. The constitution declared all inhabitants of the republic free, but freed people were at first kept at work under a code of regulations, and the republic abolished slavery fully only in December 1870. The insurgents hoped in vain that the United States would recognise them as belligerents.
      - In Havana the captain general, Domingo Dulce, offered pardons and reforms, but the Volunteers, militias of Spanish-born merchants, clerks and workers determined to keep Cuba Spanish, answered with violence. In January 1869 they fired on the audience of the Villanueva theatre, where separatist songs had been sung, and in June they forced Dulce to leave the island. In the east Valmaseda decreed that men found away from their homes without good reason would be shot and empty houses burned, and Spanish columns and insurgents alike burned farms and estates. Spain raised its army in Cuba from about 30,000 men in 1868 to some 55,000 in 1870.
    facts:
      - [Assembly of Guáimaro, "10–12 April 1869"]
      - [Volunteers, "more than 70,000 by early 1869"]
      - [Spanish troops, "about 30,000 (1868) to 55,000 (1870)"]
