  - title: The trocha and the war in the east
    date: 1870 – 1872
    when: "1871-04"
    borders: "1871-07-01"
    countries: [cu, es]
    body:
      - The war settled into a struggle of columns and ambushes in the forests and savannas of the east. The insurgents, short of guns and ammunition and with few expeditions reaching them from abroad, lived off the land and burned sugar estates to strike at the colony’s wealth; Spanish columns burned the farms that fed them, and thousands of civilians died of hunger and disease. Between 1869 and 1872 Spain built the trocha, a cleared belt with a ditch, palisades, blockhouses and forts across the narrowest part of the island from Júcaro to Morón, about 68 km long, to keep the war out of the sugar country of the west.
      - In July 1871 Máximo Gómez led his men into the district of Guantánamo, where coffee and sugar estates worked by enslaved people had been left untouched; many of the enslaved joined him, and the young Antonio Maceo, the son of a Venezuelan-born farmer and the Afro-Cuban Mariana Grajales, made his name as an officer. In Camagüey Agramonte trained a disciplined cavalry, and on 8 October 1871 he rescued his captured comrade Julio Sanguily from a Spanish column with a few dozen horsemen.
      - In Havana the Volunteers kept up the pressure on the colonial government. In November 1871 a group of medical students was accused of desecrating the tomb of a Volunteer journalist, and under the Volunteers’ pressure eight of them were shot on 27 November, a date Cuba marks as a day of mourning.
    facts:
      - [Trocha from Júcaro to Morón built, "1869–1872"]
      - [Invasion of Guantánamo, "July 1871"]
      - [Medical students shot in Havana, "27 November 1871"]
