steps:
  - title: La Demajagua and Bayamo
    date: October 1868 – January 1869
    when: "1868-10-10"
    borders: "1868-10-10"
    countries: [cu, es]
    body:
      - In the 1860s Cuba was Spain’s richest colony and the world’s largest producer of sugar, grown on the great plantations of the west by some 370,000 enslaved Africans and their descendants and by tens of thousands of Chinese indentured labourers. The planters and farmers of the east, poorer and with fewer enslaved workers, resented Spain’s taxes, its trade monopoly and their exclusion from government, and the failure of a reform commission in Madrid in 1867 turned many towards independence. When a revolution in Spain overthrew Queen Isabella II in September 1868, conspirators in Oriente and Camagüey prepared a rising.
      - "On 10 October 1868, warned that the plot had been discovered, Carlos Manuel de Céspedes rang the bell of his sugar mill, La Demajagua, near Manzanillo, freed the people he held in slavery and called on them to join the fight for independence. His manifesto promised the gradual, compensated abolition of slavery. The next day his small force was beaten off at Yara, but the revolt spread through the Cauto valley, and on 20 October the rebels took Bayamo after three days of fighting; there the song La Bayamesa, today Cuba’s national anthem, was first sung."
      - Camagüey rose on 4 November, and the young lawyer Ignacio Agramonte joined the rising there within days; Las Villas followed in February 1869. On 4 November, at Pino de Baire, Máximo Gómez, a Dominican who had served in the Spanish army, led the first of the machete charges that became the insurgents’ trademark. A Spanish column under Blas Villate, Count of Valmaseda, fought its way to Bayamo, and in January 1869 the insurgents set the town on fire rather than give it up.
    facts:
      - [Cry of Yara, "10 October 1868"]
      - [Bayamo taken by the insurgents, "20 October 1868"]
      - [Camagüey rises, "4 November 1868"]
      - [Bayamo burned, "January 1869"]
