  - title: The provisional government, Thomas Scott and the Manitoba Act
    date: December 1869 – July 1870
    when: "1870-03-04"
    borders: "1870-07-15"
    countries: [ca]
    body:
      - On 27 December 1869 Riel became president of the provisional government. The same day Donald A. Smith, a senior company officer, arrived as Canada’s special commissioner and appealed over Riel’s head to mass meetings in the fort’s courtyard on 19 and 20 January 1870. They agreed to elect a convention of forty delegates, twenty from the English-speaking and twenty from the French-speaking parishes, which in February adopted a list of rights, endorsed the provisional government with Riel as president and chose delegates to negotiate with Ottawa.
      - Some of the prisoners had escaped in January, among them Schultz and Thomas Scott, an Ontario labourer and Orangeman. In February Major Charles Boulton led about 50 men from Portage la Prairie to free the remaining prisoners; they were captured near Fort Garry on 17 February. Boulton was condemned to death and reprieved, but Scott, who had abused his guards, was tried by a Métis court martial for insubordination and shot by firing squad on 4 March 1870. In Ontario, where Schultz and his followers toured to denounce the “murder”, the execution made Riel an outlaw in the eyes of many English Canadians.
      - The delegates, the priest Joseph-Noël Ritchot, John Black and Alfred H. Scott, reached Ottawa in April, where Ritchot and Scott were briefly arrested for complicity in Thomas Scott’s death; they then negotiated with Prime Minister John A. Macdonald and George-Étienne Cartier. The Manitoba Act, passed on 12 May 1870, created a small province around the settlement, with an elected legislature, French and English as official languages, publicly funded Catholic and Protestant schools and 1.4 million acres reserved for the children of Métis families. Manitoba joined Canada on 15 July 1870, when the transfer of Rupert’s Land took effect. The delegates believed they had been promised an amnesty for all acts of the provisional government, but no amnesty was proclaimed.
