id: red-river-rebellion
name: Red River Rebellion
start: "1869-10-11"
end: "1870-08-24"
tier: B
summary: "The resistance of the Métis of the Red River Settlement, in what is now Manitoba, to the transfer of Rupert’s Land from the Hudson’s Bay Company to Canada in 1869–1870, also called the Red River Resistance. The Canadian government agreed to buy the company’s territory without consulting its people, of whom some 10,000 of about 12,000 at Red River were Métis, and sent surveyors and a lieutenant governor, William McDougall, before the transfer took effect. In October 1869 the Métis, led by Louis Riel, stopped the survey, formed a National Committee, turned McDougall back at the border and seized Upper Fort Garry. In December they declared a provisional government, which a convention of French- and English-speaking delegates endorsed in February 1870. The government imprisoned members of the pro-Canadian party and on 4 March 1870 executed one of them, Thomas Scott, which caused fury in Ontario. Delegates sent to Ottawa negotiated the Manitoba Act, by which Manitoba joined Canada as a province on 15 July 1870 with guarantees for land, the French language and Catholic schools. A military expedition under Colonel Garnet Wolseley reached Fort Garry on 24 August 1870; Riel had fled to the United States, and he was never granted the amnesty the delegates believed they had been promised."
countries: [ca]
sides:
