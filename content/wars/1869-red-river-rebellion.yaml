steps:
  - title: The transfer and the National Committee
    date: October – December 1869
    when: "1869-11-02"
    borders: "1869-12-08"
    countries: [ca]
    body:
      - In 1869 the Hudson’s Bay Company agreed to sell Rupert’s Land, the vast territory draining to Hudson Bay, to the new Dominion of Canada for £300,000, the transfer to take effect on 1 December. Nobody asked the people who lived there. The Red River Settlement, at the meeting of the Red and Assiniboine rivers, had about 12,000 inhabitants, some 10,000 of them Métis, French- and English-speaking, who held long river lots by custom rather than by title. Before the transfer Canada sent survey parties, which began to lay out square townships across the river lots, and named a lieutenant governor, William McDougall, an Ontario politician and ardent expansionist whom the French-speaking Métis distrusted. A small Canadian Party led by John Christian Schultz openly looked forward to taking the land.
      - On 11 October 1869 a group of Métis led by Louis Riel, a 24-year-old who had been educated in Montreal, stood on a surveyor’s chain on the farm of André Nault and told the surveyors to stop. On 16 October the Métis formed a National Committee, with John Bruce as president and Riel as secretary, and in late October built a barricade across the road at St. Norbert and warned McDougall not to enter. When he arrived at the border he was turned back on 2 November by armed Métis under Ambroise-Dydime Lépine and waited at Pembina, in Dakota Territory. The same day Riel and some 400 men occupied Upper Fort Garry, the company’s headquarters, without a shot.
      - Canada refused to complete the purchase while the territory was in turmoil, but on 1 December McDougall, unaware of this, crossed the border to proclaim the transfer and his own authority, then retreated to Ontario; his surveyor, Colonel John Stoughton Dennis, tried in vain to raise an armed force against the Métis. Riel issued a list of rights, and on 7 December the Métis surrounded Schultz’s house in the village of Winnipeg, where his supporters had gathered, and imprisoned some 45 of them in the fort. On 8 December the National Committee proclaimed a provisional government.
