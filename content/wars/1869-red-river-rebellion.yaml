notes:
  - "Historians and Métis organisations often call the events the Red River Resistance: the Métis were resisting a transfer of authority made without their consent, before Canada governed the territory, rather than rebelling against an established government. The Hudson’s Bay Company still governed the settlement, through the Council of Assiniboia, until 15 July 1870."
  - "The Métis are a people of mixed First Nations and European, mostly French and Scottish, descent who developed their own language (Michif), culture and economy, based on the buffalo hunt, freighting and river-lot farming. At Red River the French-speaking Catholic Métis and the English-speaking Protestant “country-born” lived side by side."
