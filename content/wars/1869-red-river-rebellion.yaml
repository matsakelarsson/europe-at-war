  - title: The Wolseley expedition
    date: May – September 1870
    when: "1870-08-24"
    borders: "1870-08-24"
    countries: [ca, us]
    body:
      - To assert Canadian authority, and to satisfy Ontario, the government sent a military expedition under Colonel Garnet Wolseley, with about 400 British regulars of the 60th Rifles, the Royal Artillery and the Royal Engineers, and some 700 Canadian militia in the 1st (Ontario) and 2nd (Quebec) Rifles, carried by about 400 Native and other voyageurs and boatmen. It went by train from Toronto to Collingwood and by steamer across Lakes Huron and Superior, where the United States refused to let the steamer Chicora through its canal at Sault Ste. Marie with military stores, so that they were carried around on the Canadian side. From Prince Arthur’s Landing, the later Thunder Bay, which Wolseley named on 25 May, the force struggled along the unfinished Dawson Road and through some fifty portages to the Lake of the Woods and down the Winnipeg River, a journey of about three months.
      - The troops reached Upper Fort Garry in pouring rain on 24 August 1870, expecting a fight, and found the fort empty; Riel had fled across the river to St. Boniface and then to the United States. The British regulars soon returned east, and the Ontario militiamen who stayed as a garrison harassed and assaulted Métis whom they blamed for Scott’s death; in September 1870 Elzéar Goulet, a member of Scott’s court martial, was chased into the Red River by a crowd that included soldiers and drowned. No one was charged.
      - Riel was elected to the House of Commons three times from 1873 but could not take his seat; Ontario offered a reward for his arrest. In 1875 he was granted an amnesty on condition of five years’ banishment, and Lépine’s death sentence for Scott’s execution was commuted. Delays and fraud in distributing the promised land, and the pressure of newcomers, drove many Métis from Manitoba west to the Saskatchewan valley, where they rose again under Riel in 1885.
    facts:
      - [Expedition, "about 1,100 soldiers and 400 voyageurs"]
      - [Prince Arthur’s Landing named, "25 May 1870"]
      - [Arrival at Fort Garry, "24 August 1870"]
