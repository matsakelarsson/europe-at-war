id: capture-of-rome
name: Capture of Rome
start: "1870-09-11"
end: "1870-09-20"
tier: B
summary: The Italian conquest of Rome and the last of the Papal States in September 1870, after the French garrison that had protected the pope left for the Franco-Prussian War. Italian troops breached the city walls at Porta Pia on 20 September, Rome and Lazio voted to join Italy, and Rome became the capital in 1871, while Pius IX declared himself a “prisoner in the Vatican”.
