steps:
  - title: Porta Pia
    date: September – October 1870
    when: "1870-09-11"
    borders: "1870-10-09"
    countries: [it, va]
    body:
      - Since 1849 a French garrison had protected what was left of the Papal States, Rome and Lazio, and in 1867 French and Papal troops had beaten Garibaldi’s volunteers at Mentana. When the Franco-Prussian War broke out in July 1870, Napoleon III withdrew his troops, and after his defeat and capture at Sedan on 2 September the Italian government decided to act. Pope Pius IX rejected a last offer from King Victor Emmanuel II, and on 11 September some 50,000 Italian troops under General Raffaele Cadorna crossed the border. The Papal garrisons fell back on Rome, and Civitavecchia surrendered on 16 September.
      - The pope had about 13,000 troops under General Hermann Kanzler, many of them foreign volunteers, but ordered only a token defence. On the morning of 20 September Italian artillery opened a breach in the Aurelian Walls near the Porta Pia, Bersaglieri and infantry stormed through, and a white flag was raised over St Peter’s; 49 Italian and 19 Papal soldiers were killed. A plebiscite on 2 October approved union with Italy by an overwhelming majority, and Rome became the capital in 1871. Pius IX refused the Law of Guarantees offered by the Italian parliament and called himself a prisoner in the Vatican.
