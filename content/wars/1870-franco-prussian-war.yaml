id: franco-prussian-war
name: Franco-Prussian War
start: "1870-07-19"
end: "1871-05-10"
tier: A
summary: A war between France and the German states led by Prussia, which destroyed the armies of the Second Empire at Sedan and Metz, besieged Paris and defeated the new French republic’s armies in the provinces. The southern German states joined Prussia in a German Empire proclaimed at Versailles in January 1871, and by the Treaty of Frankfurt France ceded Alsace and part of Lorraine and paid an indemnity of five billion francs.
countries: [fr, de, ch]
sides:
  - id: de
    name: Prussia and the German states
    polities: [prussia, germany, saxony, bavaria, wurttemberg, baden, hesse, mecklenburg, oldenburg, brunswick, anhalt]
    ink: slate
    moves: German moves
    success: German success
  - id: fr
    name: France
    polities: [france]
    ink: blue
    moves: French moves
    success: French success
notes:
  - In France it is usually called the War of 1870 (la guerre de 1870), and in Germany the German–French War (Deutsch-Französischer Krieg). On the German side fought the North German Confederation, led by Prussia, with Bavaria, Württemberg, Baden and Hesse-Darmstadt as allies; together they formed the German Empire from 1 January 1871.
  - Numbers of soldiers, prisoners and dead are estimates, and the sources differ, especially for the French side.
