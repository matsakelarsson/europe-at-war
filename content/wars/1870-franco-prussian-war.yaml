        name: Battle of Spicheren
        date: 6 August 1870
        text: Prussian troops of the First and Second Armies stormed the heights south of Saarbrücken, and General Charles Frossard’s corps withdrew.
        lonlat: [6.971, 49.207]
      - kind: battle
        side: de
        name: Battle of Wörth
        date: 6 August 1870
        text: Fighting around Frœschwiller cost each side about 10,000 killed and wounded, and MacMahon also lost some 9,000 men as prisoners.
        lonlat: [7.723, 48.944]
        lp: b
