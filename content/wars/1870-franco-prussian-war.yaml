  - title: The siege of Paris and the war in the provinces
    date: 19 September 1870 – January 1871
    when: "1870-09-19"
    borders: "1871-01-28"
    countries: [fr, ch]
    body:
      - German armies surrounded Paris on 19 September, shutting in some two million people. Gambetta left the city by balloon on 7 October to raise new armies from Tours, and the republic called up hundreds of thousands of men, many of them barely trained. The Army of the Loire won at Coulmiers on 9 November and retook Orléans, but the fall of Metz freed Prince Frederick Charles’s army, which beat the French at Loigny on 2 December, took Orléans again and in January reached Le Mans. In the north General Louis Faidherbe fought on until his defeat at St Quentin on 19 January.
      - Sorties from Paris failed, at Champigny in early December and at Buzenval on 19 January. Food ran short, and Parisians ate horses, cats, rats and the animals of the zoo; from 5 January German siege guns shelled the city. In the east General Charles Bourbaki’s army, sent to relieve besieged Belfort, was beaten on the Lisaine in mid-January. Driven against the Swiss border, about 87,000 of his men crossed into Switzerland on 1 February and were interned. Behind the German lines irregular francs-tireurs attacked supply lines, and the Germans answered with reprisals against villages and the taking of hostages.
    facts:
      - [Siege of Paris, "19 September 1870 – 28 January 1871"]
      - [Battle of Coulmiers, "9 November 1870, French victory"]
      - [Interned in Switzerland, "about 87,000 of Bourbaki’s men, 1 February 1871"]
    markers:
      - kind: siege
        side: de
        name: Paris
        date: 19 September 1870 – 28 January 1871
        text: Encircled for over four months. Balloons carried mail and passengers out over the German lines.
        lonlat: [2.352, 48.857]
      - kind: event
        side: fr
        name: Tours
        date: September – December 1870
        text: Seat of a delegation of the government, which Gambetta joined in October, until it moved on to Bordeaux.
        lonlat: [0.689, 47.394]
      - kind: battle
        side: fr
        name: Battle of Coulmiers
        date: 9 November 1870
        text: The Army of the Loire’s victory forced the Bavarians to give up Orléans.
        lonlat: [1.65, 47.917]
        lp: b
      - kind: battle
        side: de
        name: Loigny
        date: 2 December 1870
        text: The Army of the Loire’s advance towards Paris was stopped; Orléans fell to the Germans two days later.
        lonlat: [1.734, 48.124]
      - kind: battle
        side: de
        name: Le Mans
