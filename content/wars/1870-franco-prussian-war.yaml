        text: King William met the French ambassador on the spa promenade; Bismarck’s edited account of the meeting became the Ems dispatch.
        lonlat: [7.711, 50.338]
      - kind: battle
        side: de
        name: Wissembourg
        date: 4 August 1870
        text: The Third Army overwhelmed General Abel Douay’s division, and Douay was killed.
        lonlat: [7.95, 49.04]
      - kind: battle
