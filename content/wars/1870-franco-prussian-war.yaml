  - title: Mars-la-Tour, Gravelotte and Metz
    date: 14 August – 27 October 1870
    when: "1870-08-14"
    borders: "1870-10-27"
    countries: [fr]
    body:
      - Marshal François Achille Bazaine, now in command of the main French army, the Army of the Rhine, began to withdraw from Metz towards Verdun, and the Germans caught up with him. On 16 August at Mars-la-Tour the Prussian III Corps under Constantin von Alvensleben blocked the road west in a day of costly fighting that included Bredow’s cavalry charge, the “death ride”. On 18 August, at Gravelotte and St Privat, in the largest battle of the war, the Germans attacked well-entrenched French positions and lost about 20,000 men against some 12,000 French. Bazaine then withdrew into the fortress of Metz instead of breaking out.
      - Prince Frederick Charles’s army besieged Metz, and attempts to break out at Noisseville on 31 August and at Bellevue on 7 October failed. Further south, Strasbourg was bombarded from late August, which killed many civilians and burned the city’s library with its medieval manuscripts, and it surrendered on 28 September. In Metz the food ran out in October, and on 27 October Bazaine surrendered the fortress and his whole army, more than 140,000 men, the largest surrender of the war. In 1873 a French court martial sentenced him to death for it, a sentence commuted to imprisonment.
    facts:
      - [Battle of Mars-la-Tour, "16 August 1870"]
      - [Battle of Gravelotte–St Privat, "18 August 1870, German victory"]
      - [Metz surrenders, "27 October 1870"]
    markers:
      - kind: battle
        side: de
        name: Battle of Mars-la-Tour
        date: 16 August 1870
        text: Outnumbered German corps held the road to Verdun all day, cutting off Bazaine’s retreat to the west.
        lonlat: [5.873, 49.103]
        lp: l
      - kind: battle
        side: de
        name: Gravelotte–St Privat
        date: 18 August 1870
        text: The Prussian Guards lost heavily attacking St Privat, but its fall in the evening turned the French right flank.
        lonlat: [6.025, 49.165]
        lp: t
      - kind: siege
        side: de
        name: Metz
        date: 19 August – 27 October 1870
        text: Starved into surrender after ten weeks, with the whole Army of the Rhine inside.
        lonlat: [6.178, 49.12]
      - kind: siege
        side: de
        name: Strasbourg
        date: 15 August – 28 September 1870
        text: Besieged by a Baden and Prussian corps under General August von Werder and heavily bombarded before the garrison surrendered.
        lonlat: [7.751, 48.585]
    arrows:
