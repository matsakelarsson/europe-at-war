steps:
  - title: The Ems dispatch and the frontier battles
    date: July – 6 August 1870
    when: "1870-07-13"
    borders: "1870-08-06"
    countries: [fr, de]
    body:
      - In July 1870 the Spanish throne was offered to Prince Leopold of Hohenzollern-Sigmaringen, a relative of the King of Prussia. France protested and the candidacy was withdrawn, but the French ambassador, Vincent Benedetti, then asked King William at the spa of Ems for a promise that it would never be renewed. William politely refused. Bismarck shortened the king’s telegraphed report of the meeting, the Ems dispatch, so that it read as a snub, and published it on 13 July. Outraged opinion in Paris pushed Napoleon III’s government into declaring war on 19 July, and the south German states joined Prussia under their alliances of 1866.
      - The German armies mobilised faster and in greater numbers, carried to the frontier by rail and directed again by Moltke. On 4 August the Third Army under Crown Prince Frederick William surprised a French division at Wissembourg, and on 6 August it crushed Marshal Patrice de MacMahon’s corps at Frœschwiller and Wörth, while further west Prussian troops stormed the heights of Spicheren near Saarbrücken. MacMahon fell back across the Vosges towards Châlons. The French had the better rifle, the Chassepot, but the Germans’ steel Krupp breech-loading guns outclassed the French artillery.
    facts:
      - [Ems dispatch published, "13 July 1870"]
      - [France declares war, "19 July 1870"]
      - [Wörth and Spicheren, "6 August 1870, German victories"]
    markers:
