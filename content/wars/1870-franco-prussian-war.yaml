  - title: An empire proclaimed at Versailles
    date: November 1870 – March 1871
    when: "1870-11-15"
    borders: "1871-01-18"
    countries: [fr, de]
    body:
      - The war completed what 1866 had begun. In November 1870 Bismarck concluded treaties with Baden, Hesse-Darmstadt, Bavaria and Württemberg, which joined the North German Confederation in a German Empire from 1 January 1871. Bavaria and Württemberg kept special rights, among them their own railways and postal services, and Bavaria its own army in peacetime. King Ludwig II of Bavaria, secretly paid by Bismarck, wrote the letter inviting William to take the imperial title. On 18 January 1871, the anniversary of the first Prussian coronation in 1701, William was proclaimed German Emperor in the Hall of Mirrors of the palace of Versailles, before princes and officers.
      - Ten days later, with Paris starving, the French government signed an armistice at Versailles. Paris paid 200 million francs and gave up its forts, but German troops stayed outside the city. Elections on 8 February returned a National Assembly with a monarchist majority, which met in Bordeaux and chose Adolphe Thiers to lead the government. Thiers negotiated the preliminary peace signed at Versailles on 26 February, and German troops held a short victory parade in Paris on 1 March. Belfort, whose garrison had surrendered with honours, stayed French; by many accounts Thiers accepted the parade as its price.
    facts:
      - [Proclamation of the German Empire, "18 January 1871, Versailles"]
      - [Armistice, "28 January 1871"]
      - [Preliminary peace of Versailles, "26 February 1871"]
    markers:
      - kind: event
        side: de
        name: Versailles
        date: 18 January 1871
        text: The German headquarters during the siege of Paris. William was proclaimed emperor in the Hall of Mirrors, and the armistice and preliminary peace were signed here.
        lonlat: [2.12, 48.805]
        lp: l
      - kind: event
        side: fr
        name: Bordeaux
        date: February – March 1871
        text: The newly elected National Assembly met here, chose Thiers as head of the government and ratified the preliminary peace.
        lonlat: [-0.58, 44.84]
      - kind: held
        side: fr
        name: Belfort
        date: 18 February 1871
        text: The garrison marched out with the honours of war, and the town and its territory remained French in the peace.
        lonlat: [6.863, 47.638]
  - title: The Treaty of Frankfurt
    date: 10 May 1871
    when: "1871-05-10"
    borders: "1871-05-10"
    countries: [fr, de]
    body:
      - The Treaty of Frankfurt, signed on 10 May 1871, confirmed the preliminary peace. France ceded Alsace, except Belfort, and the north-east of Lorraine with Metz, with about 1.5 million inhabitants, to the German Empire as the imperial territory of Alsace-Lorraine. People there could keep French nationality until 1 October 1872 if they moved to France, and tens of thousands did. France had to pay an indemnity of five billion francs, and German troops occupied the north-east of the country until it was paid. France paid ahead of time, and the last German troops left in September 1873.
      - The war had cost about 139,000 French and 45,000 German lives, counting deaths from disease, and some 380,000 French soldiers had been taken prisoner. While the peace was being negotiated, Paris rose against the government in March 1871 and formed the Commune. Government troops retook the city in the “Bloody Week” of 21–28 May, and thousands of Communards were killed in the fighting and in mass shootings, with estimates from about 7,000 to 20,000 or more. The loss of Alsace-Lorraine left a lasting bitterness in France, and the new German Empire was now the strongest power on the continent.
    facts:
      - [Treaty of Frankfurt, "10 May 1871"]
      - [Indemnity, "five billion francs, paid by September 1873"]
      - [Dead, "about 139,000 French and 45,000 Germans"]
    markers:
      - kind: treaty
        name: Treaty of Frankfurt
        date: 10 May 1871
        text: Signed at the Hotel Zum Schwan by Bismarck and the French foreign minister, Jules Favre.
        lonlat: [8.682, 50.111]
      - kind: event
        side: de
        name: Strasbourg
        date: from 1871
        text: Became the capital of the imperial territory of Alsace-Lorraine, governed from Berlin.
        lonlat: [7.746, 48.583]
      - kind: event
        name: Paris Commune
        date: 18 March – 28 May 1871
        text: The rising began when troops tried to remove the National Guard’s cannon from Montmartre, and ended in the Bloody Week.
        lonlat: [2.341, 48.887]
    areas:
      - style: gained
        side: de
        label: Ceded to Germany as Alsace-Lorraine
        atoms: [FR-67, FR-68, FR-57]
