  - title: Sedan and the fall of the empire
    date: 23 August – 4 September 1870
    when: "1870-08-23"
    borders: "1870-09-04"
    countries: [fr]
    body:
      - At Châlons MacMahon gathered a new army of about 120,000 men, and Napoleon III joined it. Under pressure from Paris it set off on 23 August on a wide northern sweep to relieve Bazaine in Metz. Moltke turned the Third Army and a new Army of the Meuse north to meet it. The Germans surprised a French corps at Beaumont on 30 August and drove the army into a loop of the Meuse around the small fortress of Sedan, near the Belgian border. On 1 September they closed the ring. Their guns on the heights shelled the trapped army, and French cavalry charges at Floing failed to break out.
      - In Bazeilles Bavarian troops fought French marines from house to house and burned most of the village, and dozens of civilians were killed or wounded. On 2 September Napoleon III surrendered with about 104,000 men and went into captivity in Germany. When the news reached Paris, crowds invaded the legislature on 4 September, and Léon Gambetta and others proclaimed a republic at the Hôtel de Ville. A Government of National Defence under General Louis Trochu resolved to fight on; its foreign minister, Jules Favre, declared that France would yield “not an inch of our territory, not a stone of our fortresses”.
    facts:
      - [Battle of Sedan, "1 September 1870, German victory"]
      - [Napoleon III surrenders, "2 September 1870, with about 104,000 men"]
      - [Republic proclaimed, "4 September 1870, in Paris"]
    markers:
      - kind: battle
        side: de
        name: Beaumont
        date: 30 August 1870
        text: The Army of the Meuse surprised General Pierre de Failly’s corps in its camp and drove it back towards Sedan.
        lonlat: [5.058, 49.539]
      - kind: battle
        side: de
        name: Battle of Sedan
        date: 1–2 September 1870
        text: Surrounded and shelled from all sides, the Army of Châlons surrendered with the emperor the next day.
        lonlat: [4.946, 49.699]
        lp: t
      - kind: battle
        side: de
        name: Bazeilles
        date: 1 September 1870
        text: French marines held the village against Bavarian troops in hours of street fighting before it was burned.
        lonlat: [4.977, 49.678]
        lp: b
      - kind: event
        name: Paris
        date: 4 September 1870
        text: The republic was proclaimed at the Hôtel de Ville, and the Empress Eugénie fled to England.
        lonlat: [2.353, 48.856]
