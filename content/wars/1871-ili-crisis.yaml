notes:
  - The only fighting was in 1871, between the Russian column and the forces of the Taranchi sultan Ala Khan; Russia and the Qing never came to blows, though both prepared for war in 1880.
  - The Treaty of Saint Petersburg was seen in China as a rare diplomatic success, recovering by negotiation much of what had been signed away at Livadia.
