id: ili-crisis
name: Russian occupation of Ili and the Ili crisis
start: "1871-07-04"
end: "1881-02-24"
tier: C
summary: "Russia’s ten-year occupation of the Ili valley in northern Xinjiang and the diplomatic crisis over its return. During the Dungan Revolt the Taranchi Muslims of Ili had set up a sultanate at Kulja (Yining). In 1871, fearing that Yakub Beg would take the valley and wanting to secure its trade and frontier, Russia sent troops under General Gerasim Kolpakovsky from Semirechye; after brief fighting they occupied Kulja on 4 July 1871 (22 June in the Julian calendar) and ended the sultanate, promising to hand the region back when the Qing could hold it. After Zuo Zongtang reconquered the rest of Xinjiang in 1877–1878, the Qing envoy Chonghou signed the Treaty of Livadia in 1879, which returned only part of the valley, ceded the Tekes valley and the passes to the south, and gave Russia large trade rights and 5 million roubles. Beijing refused to ratify it and sentenced Chonghou to death; for a time in 1880 war seemed near, with Russian warships sent to Chinese waters and Zuo moving his headquarters to Hami. Under the Treaty of Saint Petersburg, negotiated by Zeng Jize and signed on 24 February 1881, China recovered most of the valley, including the Tekes, for an indemnity of 9 million roubles, while Russia kept a strip in the west for the people who chose to move to Russia. Russian troops left in 1883, and many Taranchis and Dungans resettled in Semirechye."
