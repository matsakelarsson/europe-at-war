name: Paris Commune
start: "1871-03-18"
end: "1871-05-28"
tier: C
summary: The revolutionary government that ruled Paris from 18 March to 28 May 1871, after France’s defeat in the Franco-Prussian War. When Adolphe Thiers’s government sent troops to remove the National Guard’s cannon from Montmartre on 18 March, crowds and guardsmen stopped them, two generals were shot dead, and the government withdrew to Versailles. A council elected on 26 March took power as the Commune. It separated church and state, suspended rents and let workers take over workshops their owners had left, while short-lived communes in Lyon, Marseille and other cities were soon put down. The army, rebuilt under Marshal Patrice de MacMahon with soldiers freed from German captivity, entered Paris on 21 May. In the “Bloody Week” that followed, Communards burned the Tuileries Palace and the Hôtel de Ville and shot about a hundred hostages, among them the Archbishop of Paris, while government troops killed Communards in the street fighting and in mass executions. Estimates of the Communards killed range from about 7,000 to 20,000; the army lost 877 dead from April to May. Over 43,000 people were taken prisoner, and some 13,500 were convicted, many of them deported to New Caledonia, until an amnesty in 1880.
