notes:
  - The Franco-Prussian War, told separately, ended with the Treaty of Frankfurt on 10 May 1871. German troops still held the forts north and east of Paris during the fighting and did not take part.
  - Some of the last Communards were shot against a wall in Père Lachaise cemetery, now known as the Communards’ Wall (Mur des Fédérés).
