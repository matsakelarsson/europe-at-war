notes:
  - The dates are the Gregorian dates of the American reports. Korean records use the lunar calendar (the landing at Chojijin was on the 23rd day of the fourth month).
  - Korean estimates of their losses at Gwangseongbo, about 350 dead, are higher than the American count of 243; some of the defenders are said to have drowned themselves rather than be captured.
