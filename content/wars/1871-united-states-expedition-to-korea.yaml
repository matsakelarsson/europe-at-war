steps:
  - title: The voyage and the firing at Sondolmok
    date: May – June 1871
    when: "1871-05"
    borders: "1871-06-01"
    countries: [kr, us]
    body:
      - The fate of the General Sherman, burned with all its crew on the Taedong River in 1866, had never been officially explained, and Korean officials had evaded the questions of American naval officers in 1867 and 1868. In 1871 the State Department sent Frederick Low, its minister in Beijing, with the Asiatic Squadron under Rear Admiral John Rodgers, to find out what had happened and to negotiate a treaty on shipwrecked sailors and trade. The squadron, the frigate Colorado, the sloops Alaska and Benicia and the gunboats Monocacy and Palos, left Nagasaki on 16 May and anchored off Jakyak Island near Incheon at the end of the month.
      - Korean officials came aboard but said that their government was not interested in a treaty. The Americans announced that they would survey the waters, which Korean law closed to foreign ships because they led to the capital. On 1 June, as the gunboats and steam launches passed the narrows of Sondolmok in the Ganghwa strait, the Korean batteries opened fire. The fire did little damage; the Americans returned it and withdrew. Rodgers demanded an apology within ten days. The governor of Ganghwa sent cattle, chickens and eggs, which the Americans refused, but no apology.
    facts:
      - [American squadron, "1 frigate, 2 sloops, 2 gunboats"]
      - [Firing at Sondolmok, "1 June 1871"]
