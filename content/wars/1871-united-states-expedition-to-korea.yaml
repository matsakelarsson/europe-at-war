  - title: The Ganghwa forts
    date: 10–11 June 1871
    when: "1871-06"
    borders: "1871-06-11"
    countries: [kr, us]
    view:
      center: [126.52, 37.66]
      size: [30, 26]
    body:
      - On 10 June, covered by the guns of the Monocacy and the Palos, about 650 sailors and marines landed near Chojijin, at the south-eastern corner of Ganghwa, and overran the fort, whose defenders had only matchlocks and old cannon. The next morning they found the fort of Deokjinjin abandoned, dismantled it, and moved north along the shore to Gwangseongbo, a walled citadel on a headland over the Sondolmok narrows, where the Korean troops had regrouped.
      - After an artillery bombardment from the hills and from the Monocacy, the Americans stormed the citadel. The fighting inside lasted about fifteen minutes. Lieutenant Hugh McKee, the first man over the wall, was mortally wounded; the Korean commander Eo Jae-yeon was killed and his great flag, the sujagi, captured. American reports counted 243 Korean dead and 20 prisoners, against three Americans killed and ten wounded. Fifteen Americans received the Medal of Honor, the first awarded for action abroad.
      - The Koreans still refused to negotiate, and more troops gathered on the mainland. The squadron stayed at its anchorage until 3 July and then sailed for China. The Daewongun had stone stelae set up in Hanseong and across the country, inscribed “When Western barbarians invade, not to fight is to make peace, and to urge peace is to sell out the country”; Korea opened to Japan in 1876, and the United States obtained a treaty in 1882.
