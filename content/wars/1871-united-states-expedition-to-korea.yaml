id: united-states-expedition-to-korea
name: United States expedition to Korea
start: "1871-06-01"
end: "1871-07-03"
tier: B
summary: "An American naval expedition to Korea, called Sinmi Yangyo in Korean (“the Western disturbance of 1871”). Frederick Low, the United States minister to China, and Rear Admiral John Rodgers sailed to Korea with five warships to learn the fate of the merchant schooner General Sherman, destroyed at Pyongyang in 1866, and to negotiate a treaty. On 1 June 1871 Korean batteries fired on American ships surveying the Ganghwa strait. When no apology came, about 650 sailors and marines landed on Ganghwa on 10 June, took the forts of Chojijin and Deokjinjin, and on 11 June stormed the citadel of Gwangseongbo, where the Korean commander Eo Jae-yeon and most of his men were killed: 243 Koreans by the American count, against three Americans. The Korean government still refused to negotiate, and the squadron left for China on 3 July. The regent Heungseon Daewongun set up stelae across the country warning against peace with Westerners; Korea and the United States signed a treaty only in 1882."
