steps:
  - title: Lost River and the Stronghold
    date: November 1872 – January 1873
    when: "1872-11-29"
    borders: "1873-01-17"
    countries: [us]
    body:
      - "By the treaty of 1864 the Modoc ceded their homeland around the Lost River, Tule Lake and Lower Klamath Lake and moved onto the Klamath Reservation in Oregon. There the Klamath treated them as intruders, and in 1865 and again in 1870 Kintpuash, whom the settlers called Captain Jack, led his band back to the Lost River. The superintendent of Indian affairs for Oregon, Alfred Meacham, asked Washington for a separate reservation for the band and never received an answer, while settlers on the land petitioned for their removal."
      - "On 29 November 1872 Captain James Jackson’s cavalry came to the Modoc camp on the Lost River to bring the band back to the reservation. While the men were laying down their arms, Scarfaced Charley and Lieutenant Frazier Boutelle fired at each other and a short fight broke out. Kintpuash’s people crossed Tule Lake by boat, while Hooker Jim’s men rode around its eastern shore and killed 14 to 18 settlers (sources differ) on 29 and 30 November. All reached the lava beds south of the lake, a maze of trenches, ridges and caves that became known as Captain Jack’s Stronghold."
      - "On 17 January 1873 Lieutenant Colonel Frank Wheaton attacked the Stronghold from west and east with some 300 to 400 regulars, Oregon and California volunteers and Klamath scouts. In thick fog the soldiers hardly saw their enemy, and by evening they retreated with dozens killed and wounded. The Modoc, with perhaps 52 or 53 fighting men among about 150 people, lost no one."
