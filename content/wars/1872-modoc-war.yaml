  - title: Canby’s death, Sand Butte and exile
    date: April – October 1873
    when: "1873-04-11"
    borders: "1873-06-01"
    countries: [us]
    body:
      - "A peace commission under Meacham and General Edward Canby, commander of the Department of the Columbia, met Kintpuash several times between the lines. He asked for a pardon for his people, the withdrawal of the troops and a reservation of their own on the Lost River; the commissioners demanded that Hooker Jim’s men be handed over for trial. Schonchin John, Hooker Jim and others, believing that the army would leave if its leaders were killed, shamed Kintpuash into agreeing to kill the commissioners. On 11 April 1873, at the peace tent, he shot Canby dead, Boston Charley killed the Reverend Eleazer Thomas, and Meacham was badly wounded."
      - "Canby’s death turned public opinion and tested President Grant’s peace policy. On 15–17 April several hundred troops with mortars and Warm Springs scouts attacked the Stronghold again and cut the Modoc off from the lake, and the Modoc slipped away south through the lava. On 26 April Scarfaced Charley and about two dozen men ambushed a patrol of some 80 soldiers and scouts under Captain Evan Thomas at Sand Butte and killed or wounded about 35 of them, five officers among the dead. On 10 May the Modoc attacked troops at Dry Lake and were beaten off with five dead, their first defeat. The band split up; Hooker Jim and his followers surrendered and guided the soldiers to Kintpuash, who was captured with his family near Langell Valley in early June."
      - "A military court tried six men for the deaths of Canby and Thomas. Kintpuash, Schonchin John, Black Jim and Boston Charley were hanged at Fort Klamath on 3 October 1873, and two others were sent to Alcatraz; Hooker Jim, who had turned against Kintpuash, was not tried. The 153 survivors of the band were sent as prisoners of war to the Quapaw Agency in Indian Territory. In 1909 they were allowed to return; 29 went back to Oregon, and the rest stayed in Oklahoma, where the Modoc Nation is now recognised separately."
