id: modoc-war
name: Modoc War
start: "1872-11-29"
end: "1873-06"
tier: B
summary: "The war of 1872–1873 between a band of Modoc under Kintpuash (Captain Jack) and the United States Army in the lava beds south of Tule Lake, on the California–Oregon border. By the treaty of 1864 the Modoc gave up their lands on the Lost River and Tule Lake and were moved onto the Klamath Reservation with the Klamath, their old rivals; Kintpuash’s band of about 150 people went back to the Lost River, where settlers demanded their removal. On 29 November 1872 cavalry sent to bring them back tried to disarm them, fighting broke out, and the band fled to a natural fortress of lava trenches and caves, Captain Jack’s Stronghold, while Hooker Jim’s men killed 14 to 18 settlers on the way. With no more than about 53 fighting men, the Modoc beat off an attack by some 300 to 400 soldiers and volunteers on 17 January 1873 without loss. During peace talks on 11 April, under pressure from the band’s war faction, Kintpuash shot General Edward Canby, the only general killed in the wars against Native nations, and Boston Charley killed the Reverend Eleazer Thomas. Reinforced troops drove the Modoc from the Stronghold in April, but Scarfaced Charley’s warriors destroyed a patrol at Sand Butte on 26 April; after the Modoc’s first defeat at Dry Lake on 10 May the band split, Hooker Jim’s group surrendered and helped track Kintpuash, who was captured in early June. He and three others were hanged at Fort Klamath on 3 October 1873, and the 153 survivors of the band were sent as prisoners of war to Indian Territory, where they were held until 1909."
