notes:
  - "The war grew out of twenty years of violence on the emigrant road around Tule Lake: in 1852 Modoc killed an emigrant party at what Americans called Bloody Point, and a California militia under Ben Wright then killed about 41 Modoc at a peace parley. Historians of the California genocide such as Benjamin Madley end their account with the Modoc War."
  - The photographer Eadweard Muybridge took pictures of the early campaign; newspapers across the country followed the war, and many Americans sympathised with Kintpuash until Canby’s death.
