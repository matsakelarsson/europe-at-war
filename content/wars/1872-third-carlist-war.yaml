id: third-carlist-war
name: Third Carlist War
start: "1872-04-21"
end: "1876-02-28"
tier: C
summary: The last Carlist War, fought by the supporters of the claimant Carlos VII against the governments of King Amadeo I, the First Spanish Republic and finally Alfonso XII. Strongest again in Navarre and the Basque provinces, where they set up a state with its capital at Estella, and in Catalonia and the Maestrazgo, the Carlists besieged Bilbao in 1874 without taking it. After the Bourbon restoration of December 1874 brought the army behind Alfonso XII, government forces took La Seu d’Urgell in 1875 and Estella in February 1876, and on 28 February Carlos VII crossed into France. The Basque fueros were abolished that July.
countries: [es, fr]
sides:
  - id: gov
    name: Spanish government (Amadeo I, the Republic, Alfonso XII)
    polities: [spain]
    ink: blue
  - id: car
    name: Carlists
    polities: [carlists]
    ink: red
notes:
  - Estimates of the casualties vary widely, from about 7,000 to 50,000. The siege of Bilbao, from February to May 1874, included a heavy bombardment of the city; it was lifted on 2 May, and in June General Manuel Gutiérrez de la Concha was killed leading an attack on the Carlist lines near Estella.
