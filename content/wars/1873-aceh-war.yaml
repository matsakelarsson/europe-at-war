  - title: The Gayo and Alas expedition
    date: February – July 1904
    when: "1904-06-14"
    borders: "1904-06-14"
    countries: [id]
    side_names:
      ac: Gayo and Alas villages
    body:
      - The highlands of the Gayo and the Alas valley to the south, in the interior of Aceh, had never been reached by Dutch troops, and resistance leaders had taken refuge there. On 8 February 1904 Lieutenant Colonel Gotfried Coenraad Ernst van Daalen set out with a column of marechaussee, about 10 European officers, 13 European NCOs and 208 Ambonese and Javanese soldiers, with hundreds of convict porters, to bring the interior under Dutch rule.
      - The column marched from Takengon over the mountains into Gayo Lues, where the villages had fortified themselves behind earth walls and bamboo stockades. Van Daalen stormed them one after another, at Pasir, Gemuyang, Durin, Rikit Gaib, Penosan and Tampeng, killing the defenders, among them women and children who had sheltered inside. At Pasir on 14 March 1904 41 people were killed.
      - In June the column entered the Alas valley. At Kuta Reh on 14 June 1904 it stormed the fortified village and killed 561 people, 313 men, 189 women and 59 children, for the loss of 2 soldiers; further villages, Likat and Kuta Lengat Baru, followed. When the column reached the Batak lands in July, the Dutch count of the dead stood at at least 2,922, among them 1,149 women and children, against 26 dead on the Dutch side.
      - Photographs taken by the expedition’s doctor, showing van Daalen and his officers standing over the dead at Kuta Reh, and later reports in the press, caused outrage in the Netherlands and questions in parliament. Van Daalen was nonetheless made governor of Aceh in 1905. The killings are remembered in Aceh, and anger over them contributed to the bombing of the Van Heutsz monument in Amsterdam in 1984.
    facts:
      - [Column, "about 230 marechaussee and hundreds of convict porters"]
      - [March, "8 February – 23 July 1904"]
      - [Dead at Kuta Reh, "561 (313 men, 189 women, 59 children)"]
      - [Dead in the campaign, "at least 2,922 by the Dutch count, 1,149 of them women and children"]
