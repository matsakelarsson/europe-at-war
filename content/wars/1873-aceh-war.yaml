  - title: The first expedition
    date: April 1873
    when: "1873-04-14"
    borders: "1873-04-14"
    countries: [id]
    body:
      - An expedition of about 3,000 soldiers under Major General Johan Harmen Rudolf Köhler sailed from Batavia and landed on the coast east of the capital in early April 1873. The Acehnese, armed with muskets and some artillery, fought it from fortified positions in the villages and gardens around the city. On 10 April the troops reached the Masjid Raya, the great mosque of Banda Aceh, which the Acehnese defended as part of the approaches to the sultan’s palace.
      - On 14 April Köhler was shot and killed near the mosque. His successor, Colonel E. C. van Daalen, decided that the palace could not be taken with the troops at hand, and the expedition re-embarked at the end of April. By Dutch counts the expedition lost 45 to 56 dead and 405 to 438 wounded; some accounts give about 80 dead. The defeat was a shock in the Netherlands and a triumph for Aceh; the Dutch blockaded the coast and prepared a much larger force.
    facts:
      - [Dutch force, "about 3,000 men"]
      - [Köhler killed, "14 April 1873"]
      - [Dutch losses, "45–56 dead and 405–438 wounded (Dutch counts)"]
