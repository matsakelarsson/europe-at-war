  - title: Snouck Hurgronje and Teuku Umar
    date: 1891–1899
    when: "1896-03-30"
    borders: "1896-03-30"
    countries: [id]
    body:
      - In 1891–1892 the Dutch scholar of Islam Christiaan Snouck Hurgronje, who had lived in Mecca under the name Abdul Ghaffar, spent seven months in Aceh. In his reports and his book on the Acehnese he argued that the sultan mattered less than the Dutch supposed, that the uleebalang could be won over with recognition and pay, and that the ulama who led the holy war had to be fought without mercy. His advice shaped Dutch strategy for the next decade.
      - Teuku Umar, an uleebalang from the west coast and the husband of Cut Nyak Dhien, whose first husband had been killed by the Dutch in 1878, had fought the Dutch and changed sides before. On 30 September 1893 he submitted to them, and on 1 January 1894 they gave him the title Teuku Johan Pahlawan and a legion of 250 men with arms and money, later enlarged. On 30 March 1896 he went back to the resistance, taking 800 rifles, 25,000 rounds, about 500 kg of ammunition and $18,000 with him; Dutch histories called it the “betrayal of Teuku Umar”, Acehnese tradition a stratagem to arm the resistance.
      - With Cut Nyak Dhien, Umar fought the Dutch in Aceh Besar and along the west coast for three more years. On 11 February 1899 he was killed in a Dutch ambush near Meulaboh. Cut Nyak Dhien led his followers on in the forests of the west.
    facts:
