  - title: The second expedition and the fall of the dalam
    date: December 1873 – 1875
    when: "1874-01-24"
    borders: "1874-01-31"
    countries: [id]
    body:
      - The Dutch sent a second expedition under Lieutenant General Jan van Swieten, the veteran of the Bali wars of the 1840s, with about 8,500 soldiers, 4,300 servants and coolies and a reserve of 1,500 men, the largest force the colonial army had yet put in the field. It landed on 9 December 1873 at the mouth of a river east of the capital and fought its way forward slowly. Cholera, which had broken out in Java, came with it, and some 1,400 soldiers died of it between November 1873 and April 1874.
      - The troops took the Masjid Raya in early January 1874 and on 24 January entered the dalam, the sultan’s palace, which its defenders had abandoned. Sultan Mahmud Syah, who had withdrawn inland, died of cholera at the end of the month. On 31 January van Swieten proclaimed Aceh annexed to the Dutch East Indies, and the capital was renamed Kutaraja.
      - The Acehnese did not accept defeat. Their leaders moved inland, and in 1875 they proclaimed a child of the royal house, Muhammad Daud, as sultan, with a regent to rule for him. The Dutch held only Kutaraja and the coast around it, and the war became a struggle for the valley of the Aceh River, Aceh Besar, and then for the whole country.
    facts:
