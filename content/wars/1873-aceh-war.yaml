    moves: Acehnese moves
    success: Acehnese success
notes:
  - The colonial army that fought in Aceh was mostly Javanese, Ambonese, Manadonese and other Indonesian soldiers with European officers and a minority of European and African troops; tens of thousands of convict labourers, many of whom died, carried its supplies. Some Acehnese uleebalang fought on the Dutch side, especially after 1898.
  - Dutch histories long dated the war 1873–1904, ending with the sultan’s surrender and the Gayo campaign; the Dutch had already declared it over in 1880–1881. Acehnese and Indonesian historians count resistance until 1942, and the war is remembered in Aceh as a holy war (prang sabi) and as part of Indonesia’s struggle against colonial rule. Teuku Umar, Cut Nyak Dhien and Cut Nyak Meutia are National Heroes of Indonesia.
  - Figures for the dead are uncertain. The colonial army’s losses are given as about 37,000 dead, about 2,200 of them European, many from cholera and beriberi. For the Acehnese, estimates range from about 50,000–60,000 to 60,000–70,000 fighters and civilians, and some historians give more than 100,000 for the whole war; about 10,000 Acehnese fled to Malaya.
