  - title: Holy war and the concentrated line
    date: 1874–1891
    when: "1884"
    borders: "1884-08-01"
    countries: [id]
    body:
      - Over the next years the Dutch fought their way up the Aceh valley. Under General Karel van der Heijden, governor from 1877, they took much of Aceh Besar in hard campaigns, and in 1880–1881 they declared the war over and set up a civil government. The declaration was premature. Resistance was led by uleebalang, the territorial chiefs, and increasingly by the ulama, who called the faithful to prang sabi, holy war; the epic Hikayat Prang Sabi, recited in villages and camps, promised paradise to those who fell.
      - The leading figure was Teungku Chik di Tiro, Muhammad Saman, an ulama from Pidie who from 1881 rallied fighters from across Aceh and took Dutch posts in the upper Aceh valley, Indrapuri among them. The young sultan held court at Keumala in Pidie, beyond Dutch reach. In 1883 the British steamer Nisero was wrecked off Teunom on the west coast, and its local ruler held the crew for ransom for ten months, causing a dispute between Britain and the Netherlands.
      - In 1884, short of troops and money, the Dutch drew back to a concentrated line around Kutaraja, a ring of 16 forts linked by a tramway and cleared ground, and left the rest of Aceh to blockade from the sea. The line held, but it gave the initiative to the Acehnese, who attacked it repeatedly. Teungku Chik di Tiro died in January 1891, by Acehnese accounts of poison; his sons carried on the struggle.
    facts:
      - [War declared over by the Dutch, "1880–1881"]
      - [Concentrated line, "from 1884, 16 forts"]
      - [Death of Teungku Chik di Tiro, "January 1891"]
