  - title: The last years of resistance
    date: 1904–1914
    when: "1910-10-24"
    borders: "1910-10-24"
    countries: [id, my]
    body:
      - Resistance went on in the forests after the sultan’s surrender. Cut Nyak Dhien, ageing and nearly blind, kept a band of followers in the western mountains until one of her own men, Pang Laot, led the Dutch to her camp at Beutong. She was captured about 1905 and exiled to Sumedang in West Java, where she died on 6 November 1908. In the north Cut Nyak Meutia fought on with her husband Pang Nanggroe; he was killed on 26 September 1910, and she was killed in a skirmish at Alue Kurieng on 24 October 1910.
      - The marechaussee hunted down the last bands, and Dutch reports record fighting in Gayo and elsewhere until about 1914. Even after organised resistance ended, Acehnese men carried out lone attacks on Dutch soldiers and civilians, which the Dutch called Atjeh-moord (Aceh murder). About 10,000 Acehnese fled to Malaya. Acehnese tradition counts the resistance as continuing until the Japanese landed in 1942, when Acehnese ulama rose against the Dutch.
      - The war left Aceh devastated. Estimates of Acehnese dead range from about 50,000–60,000 to 60,000–70,000, and some historians put them at more than 100,000; on the colonial side about 37,000 soldiers died, about 2,200 of them European, most from disease, and many of the convict labourers. Memories of the war shaped Aceh’s place in Indonesia; Hasan di Tiro, a descendant of Teungku Chik di Tiro, founded the Free Aceh Movement in 1976.
    facts:
      - [Cut Nyak Dhien captured, "about 1905; died in exile 6 November 1908"]
      - [Cut Nyak Meutia killed, "24 October 1910"]
      - [Acehnese dead, "estimates range from about 50,000 to more than 100,000"]
      - [Colonial army dead, "about 37,000"]
    markers:
      - kind: taken
        side: nl
        name: Beutong
        date: about 1905
        text: Cut Nyak Dhien was captured at her camp here, betrayed by one of her men, and exiled to Java.
        lonlat: [96.530, 4.460]
      - kind: battle
        side: nl
        name: Alue Kurieng
        date: 24 October 1910
        text: Cut Nyak Meutia was killed in a skirmish in the forests of Aceh Utara, a month after her husband Pang Nanggroe.
        lonlat: [97.290, 4.990]
      - kind: event
        side: ac
        name: Penang
        date: 1904–1914
        text: About 10,000 Acehnese fled to British Malaya.
        lonlat: [100.329, 5.415]
        lp: l
