steps:
  - title: Aceh, the pepper coast and the Treaty of Sumatra
    date: 1824–1873
    when: "1873-03-26"
    borders: "1873-03-26"
    countries: [id, my, sg]
    body:
      - The sultanate of Aceh, at the northern tip of Sumatra, had been a power in the Strait of Malacca since the 16th century. In the early 19th century its ports on the north and west coasts supplied about half the world’s pepper, sold to American, British and other traders, and Penang was its main market. In the Anglo-Dutch Treaty of 1824, which divided the region into British and Dutch spheres, the Netherlands undertook to respect Aceh’s independence.
      - As the Dutch extended their rule in Sumatra, the borders of their sphere and Aceh’s met. Sultan Alauddin Ibrahim Mansur Syah (reigned 1838–1870) reasserted Aceh’s overlordship of the east-coast states of Deli, Langkat and Serdang, but in 1858 the Dutch made a treaty with Siak that they read as giving them those states, and they occupied them in the 1860s. The opening of the Suez Canal in 1869 brought more shipping through the Strait, and Dutch officials feared that another power, Britain, France, Italy or the United States, might take Aceh first.
      - In the Treaty of Sumatra of 2 November 1871, part of a set of agreements in which the Dutch also handed their Gold Coast forts in West Africa to Britain, Britain withdrew its objection to Dutch expansion in northern Sumatra in return for equal trading rights. Aceh’s envoys sought help abroad, from the Ottoman sultan, whom Aceh had long recognised as overlord of the faithful, and from the American and Italian consuls in Singapore, with whom they talked in early 1873. The Dutch took the talks as a threat. On 26 March 1873 the Dutch commissioner, F. N. Nieuwenhuijzen, declared war on Aceh from a warship off its coast.
    facts:
      - [Anglo-Dutch Treaty, "1824"]
      - [Treaty of Sumatra, "2 November 1871"]
      - [Dutch declaration of war, "26 March 1873"]
