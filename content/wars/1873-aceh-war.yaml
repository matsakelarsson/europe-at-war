    name: Dutch East Indies (Royal Netherlands East Indies Army)
    polities: [dutch-east-indies, netherlands]
    ink: orange
    moves: Dutch moves
    success: Dutch success
  - id: ac
    name: Sultanate of Aceh, its uleebalang and ulama
