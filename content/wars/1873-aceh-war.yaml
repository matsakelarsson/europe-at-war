  - title: Van Heutsz and the sultan’s surrender
    date: 1898–1903
    when: "1903-01-20"
    borders: "1903-01-20"
    countries: [id]
    body:
      - The Dutch had founded the Korps Marechaussee in 1890, small units of Ambonese, Manadonese and Javanese soldiers under European officers, armed with carbines and klewang (sabres), who pursued fighters through the jungle instead of holding forts. In 1898 Joannes Benedictus van Heutsz became governor of Aceh, with Snouck Hurgronje as his adviser. He abandoned the concentrated line and sent the marechaussee after the resistance leaders across the country, and had uleebalang who submitted sign the Korte Verklaring, the short declaration, accepting Dutch sovereignty.
      - In 1898 his troops overran Pidie and took Keumala, and the sultan’s court became a fugitive. The fortress of Batee Iliek near Samalanga, which had defied the Dutch for years, fell on 3 February 1901; 71 defenders were killed, against 5 Dutch dead and 27 wounded. The campaigns burned crops and villages and killed many civilians.
      - In late 1902 the Dutch captured the wives and son of Sultan Muhammad Daud and threatened to exile them. The sultan surrendered on 10 January 1903 and made his formal submission at Kutaraja on 20 January; he was given an allowance and later exiled to Ambon and Batavia for continuing to support the resistance. Panglima Polem, the leading war chief of Aceh Besar, surrendered in September. Van Heutsz, who became governor-general in 1904, was celebrated in the Netherlands as the man who had won Aceh.
    facts:
      - [Korps Marechaussee founded, "1890"]
      - [Van Heutsz governor of Aceh, "1898–1904"]
      - [Batee Iliek taken, "3 February 1901"]
      - [Sultan’s surrender, "10 January 1903"]
