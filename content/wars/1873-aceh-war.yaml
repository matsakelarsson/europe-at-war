id: aceh-war
name: Aceh War
start: "1873-03-26"
end: "1914"
tier: A
summary: "The longest of the Dutch colonial wars, fought for the sultanate of Aceh at the northern tip of Sumatra. Aceh was an independent Muslim kingdom and a great exporter of pepper, whose independence Britain had agreed to respect in 1824; in the Treaty of Sumatra of 1871 Britain gave the Dutch a free hand, and when Aceh sought foreign support the Dutch declared war in March 1873. A first expedition was driven off after its general was killed; a second took the sultan’s palace in January 1874, and the Dutch proclaimed Aceh annexed and renamed its capital Kutaraja. But the war went on in the countryside for thirty years, led by uleebalang (territorial chiefs) and ulama (religious scholars) who preached it as a holy war. Teungku Chik di Tiro led the resistance in the 1880s; Teuku Umar served the Dutch from 1893 and turned against them in 1896 with their weapons, fighting with his wife Cut Nyak Dhien until his death in 1899. Under J. B. van Heutsz, with the scholar Christiaan Snouck Hurgronje as adviser and mobile marechaussee units, the Dutch broke the resistance village by village; the sultan surrendered in January 1903, and in 1904 a column under G. C. E. van Daalen marched through the Gayo and Alas highlands, killing at least 2,922 people by its own count. Fighting went on in places until about 1914, and Acehnese count the resistance as lasting until the Japanese invasion of 1942. Estimates of the Acehnese dead range from about 50,000 to more than 100,000; on the colonial side about 37,000 died, most of them from disease."
countries: [id]
sides:
