        side: gb
        name: Elmina
        date: 13 June 1873
        text: The British bombarded and destroyed the old town, then beat off an Asante attack.
        lonlat: [-1.349, 5.083]
        lp: l
      - kind: held
        side: gb
        name: Cape Coast Castle
        date: "1873"
        text: Crowded with refugees from the interior while the Asante army camped nearby.
        lonlat: [-1.242, 5.103]
        lp: r
      - kind: event
        name: Prasu
