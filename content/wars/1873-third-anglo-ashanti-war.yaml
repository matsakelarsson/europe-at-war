steps:
  - title: Elmina changes hands
    date: 1867 – 1872
    when: "1872-04-06"
    borders: "1872-06-01"
    countries: [gh]
    body:
      - "For two centuries the Dutch and the British had held forts side by side along the Gold Coast. The Dutch, based at Elmina, were Asante’s partners on the coast and paid the Asantehene a regular sum of gold, which Kumasi regarded as rent for its land; the Fante states, allied with the British, were Asante’s enemies. In 1867 the two powers agreed to exchange forts so that each held a continuous stretch of coast, the Dutch to the west of Elmina and the British to the east. The exchange of 1868 provoked the Fante, who formed a confederacy at Mankessim and besieged Elmina from March 1868, and an Asante army came to the town’s support at the end of 1869."
      - In February 1871 the Netherlands, tired of an unprofitable colony, signed a treaty selling all its Gold Coast possessions to Britain, and on 6 April 1872 Elmina was formally handed over. Kofi Karikari, Asantehene since 1867, protested that Elmina was his by right, citing a document known as the Elmina Note, and Asante’s war party gained the upper hand in Kumasi.
      - Asante also held European captives, the Basel missionaries Friedrich Ramseyer, his wife and Johannes Kühne, and the French trader Marie-Joseph Bonnat, taken during an Asante campaign east of the Volta in 1869. Negotiations for their release and for Elmina failed, and at the turn of 1872–1873 Asante prepared to invade the coast.
    facts:
