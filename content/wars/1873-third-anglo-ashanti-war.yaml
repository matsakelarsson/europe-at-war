  - title: Kumasi burned and the Treaty of Fomena
    date: February 1874 – 1875
    when: "1874-02-06"
    borders: "1874-07-24"
    countries: [gh]
    body:
      - "Kofi Karikari had left Kumasi, and his envoys did not come in to negotiate. With the rains approaching and supplies short, Wolseley would not wait. On 6 February his engineers blew up the royal palace, which impressed the British with its size and its contents, including rows of books in many languages, and the troops set fire to the town as they marched back to the coast. Glover’s column reached the ruins of Kumasi from the east about a week later and followed them south."
      - "At Fomena, the Asantehene’s envoys accepted a treaty dated 13 February 1874. Asante promised to pay an indemnity of 50,000 ounces of gold, renounced its claims to Elmina and to the allegiance of Denkyira, Assin, Akyem, Adansi and the other states south of the Pra, and to the rents of the forts, and agreed to keep the road from Kumasi to the Pra open to trade and to end human sacrifice. Wolseley’s troops sailed home in March, before the unhealthy season, and he returned to Britain a celebrity; ‘all Sir Garnet’ became a byword for efficiency."
      - On 24 July 1874 Britain proclaimed the coastal states a crown colony, the Gold Coast Colony, and later that year abolished slavery there. In Kumasi the defeat discredited the king, and Kofi Karikari was deposed in October 1874. Dwaben, one of the core Asante states, broke away and was defeated in 1875, its people fleeing south-east into Akyem, while Gonja, Dagbon and the Brong states in the north threw off Asante rule. Civil war followed in the 1880s, until Prempeh I was enstooled in 1888.
    facts:
      - [Kumasi burned, "6 February 1874"]
      - [Treaty of Fomena, "13 February 1874"]
      - [Gold Coast Colony proclaimed, "24 July 1874"]
