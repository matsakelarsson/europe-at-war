        label: Asante withdrawal
        via: [[-1.32, 5.30], [-1.33, 5.60], [-1.37, 5.95], [-1.48, 6.25]]
  - title: Amoaful and Odaso
    date: January – February 1874
    when: "1874-01-31"
    borders: "1874-01-31"
    countries: [gh]
    body:
      - "The first British battalions, of the Black Watch, the Rifle Brigade and the Royal Welch Fusiliers, landed in December 1873 and marched up the road in January, joining the 1st and 2nd West India Regiments, a naval brigade and two regiments raised locally. Kofi Karikari, hoping to stop the advance, released the European captives, but Wolseley’s terms were too harsh to accept. The main column crossed the Pra in January and entered the hills of Adansi, Asante’s southern province, while smaller columns advanced on its flanks; from the east, Captain John Glover led Hausa troops and levies from the Volta towards Kumasi."
      - "The Asante made their stand at Amoaful, on 31 January 1874. Amankwatia’s men held the dense forest around the village in their traditional horseshoe formation, and fought for four hours before the Black Watch, with the pipes playing, charged through the village. Amankwatia was killed; British officers praised his choice of ground and his generalship. The British had 3 Europeans killed and about 165 wounded, and the next day they took Bekwai."
      - "On 4 February the Asante tried again to stop the column at the Oda river, at Odaso, south of Kumasi, and after hours of fighting broke before another charge. That evening Wolseley’s troops marched into Kumasi."
    facts:
