  - title: Wolseley holds the coast
    date: October – December 1873
    when: "1873-11-05"
    borders: "1873-11-05"
    countries: [gh]
    body:
      - The British government appointed Major-General Sir Garnet Wolseley to command, with civil authority as administrator of the Gold Coast, and he landed at Cape Coast on 2 October 1873 with a staff of handpicked officers. Until British troops could be sent, he raised local levies and used sailors, marines and the West India Regiment to keep the Asante off balance. On 14 October he attacked Esaman and other villages west of Elmina that supported the Asante, and burned them.
      - "On 5–6 November the Asante attacked the fortified mission station of Abrakrampa, north of Cape Coast, and were beaten off. By then Amankwatia’s army had been in the field for almost a year; smallpox and dysentery were killing his soldiers by the thousand. In late November the Asante began to withdraw, harried by the British, and by December they had crossed back over the Pra."
      - "Meanwhile Royal Engineers and thousands of hired labourers widened the forest path from Cape Coast towards Kumasi into a road, with a fortified camp at every day’s march, more than 230 bridges and a telegraph line, and built a large depot at Prasu, where a prefabricated bridge brought from England crossed the Pra."
    facts:
      - [Wolseley lands at Cape Coast, "2 October 1873"]
      - [Esaman burned, "14 October 1873"]
      - [Asante attack on Abrakrampa, "5–6 November 1873"]
    markers:
      - kind: taken
        side: gb
        name: Esaman
        date: 14 October 1873
        text: A village west of Elmina that supported the Asante, attacked and burned by Wolseley’s marines, sailors and West Indian troops.
        lonlat: [-1.40, 5.12]
        lp: l
      - kind: held
        side: gb
        name: Abrakrampa
        date: 5–6 November 1873
        text: A fortified mission station held by British officers and local levies, which beat off the Asante attacks.
        lonlat: [-1.234, 5.248]
        lp: r
