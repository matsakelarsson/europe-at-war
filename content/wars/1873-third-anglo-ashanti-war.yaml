id: third-anglo-ashanti-war
name: Third Anglo-Ashanti War
start: "1873-01"
end: "1874-02-13"
tier: A
summary: "The war in which Britain broke the power of the Asante Empire over the Gold Coast, now Ghana. When the Netherlands sold its Gold Coast forts to Britain in 1872, Asante lost Elmina, the port through which it had traded with the Dutch and which it regarded as its own. In 1873 Asante armies under Amankwatia crossed the Pra river, overran the lands of the Fante and their neighbours under British protection and threatened the forts on the coast. Britain sent Major-General Sir Garnet Wolseley, who held the coast through the autumn while disease drove the Asante back across the Pra, and then, with three British battalions, West Indian and African troops and thousands of carriers, built a road through the forest and marched on Kumasi. After hard fighting at Amoaful on 31 January 1874 and at Odaso on 4 February, the British entered Kumasi, abandoned by the Asantehene Kofi Karikari, and on 6 February blew up the palace and burned the city. By the Treaty of Fomena Asante promised a huge indemnity in gold and gave up its claims south of the Pra. Britain proclaimed the Gold Coast Colony in July 1874, and Asante, its authority shaken, lost much of its empire over the following years."
countries: [gh, gb]
sides:
  - id: as
    name: Asante Empire (Kofi Karikari)
    polities: [asante]
    ink: gold
    moves: Asante moves
    success: Asante success
  - id: gb
    name: Britain, the Fante and their allies
    polities: [united-kingdom, ghana, fante]
    ink: red
    moves: British and allied moves
    success: British and allied success
notes:
  - "The British called the campaign the Ashanti (or Ashantee) Expedition. It was one of the most closely reported colonial wars of its time, with war correspondents such as Henry Morton Stanley and G. A. Henty, so the British side is well documented; the Asante side is known from oral history and from historians such as Ivor Wilks. The size of the Asante armies and their losses are not known precisely."
  - "Wolseley’s force lost 18 men killed in action and 55 dead of disease, with 185 wounded; many more of the African carriers and soldiers died. Asante losses were much higher, above all from smallpox and dysentery in the army that invaded the coast in 1873."
  - "The treaty was drawn up at Fomena and dated 13 February 1874; Asante envoys confirmed it in the following weeks, and some sources date it to March 1874."
