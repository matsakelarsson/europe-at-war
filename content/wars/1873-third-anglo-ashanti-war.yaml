  - title: The Asante invasion of the coast
    date: January – June 1873
    when: "1873-06-13"
    borders: "1873-06-13"
    countries: [gh]
    body:
      - Early in 1873 an Asante army of tens of thousands under the general Amankwatia crossed the Pra into the British protectorate. In the spring they defeated the armies of the Fante and their allies in a series of battles and burned many villages; refugees crowded into Cape Coast, Elmina and the other coastal towns, where the British had only a few hundred West Indian soldiers and Hausa police.
      - "In June the Asante advanced on Elmina, where many townspeople supported them. On 13 June the British, who distrusted the town, ordered its people to give up their arms; when they refused, warships and guns from the castle bombarded the old town and destroyed it. The same day Royal Marines and West India troops beat off an Asante attack on Elmina. The Asante army camped a short march inland and cut the coastal towns off from the interior."
    facts:
      - [Asante army crosses the Pra, "early 1873"]
      - [Bombardment of Elmina, "13 June 1873"]
    markers:
