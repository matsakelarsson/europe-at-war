notes:
  - Tonkin (Bắc Kỳ) was the European name for northern Vietnam, and Annam (Trung Kỳ) for the centre around Huế. The Paper Bridge (Cầu Giấy) was a bridge on the road just west of Hanoi.
  - The Black Flag Army was a force of Chinese and Vietnamese fighters under Liu Yongfu, which had come into Tonkin from Guangxi in the 1860s after the defeat of the rebellions in southern China. It controlled trade on the upper Red River from Lào Cai and served the Nguyễn court for pay and titles. French writers called it and similar bands pirates; Vietnamese sources call it quân Cờ Đen.
  - The Sino-French War of 1884–1885 is told as a war of its own, and the Cần Vương movement, which began with the attack at Huế in July 1885, as another.
