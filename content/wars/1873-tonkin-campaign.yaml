steps:
  - title: Garnier and the Red River
    date: November 1873 – March 1874
    when: "1873-11-20"
    borders: "1873-11-20"
    countries: [vn, fr]
    body:
      - After taking Cochinchina, the French looked to the Red River as a route into Yunnan in south-western China. In 1873 the French trader Jean Dupuis took a cargo of arms up the river to the Qing authorities in Yunnan and, defying the Vietnamese officials, set himself up in Hanoi with Chinese hired soldiers. The court in Huế asked the governor of Cochinchina, Admiral Marie Jules Dupré, to remove him. Dupré sent the naval officer and explorer Francis Garnier with about 180 men and two gunboats, who reached Hanoi on 5 November, sided with Dupuis and declared the river open to trade.
      - When the provincial governor, the old general Nguyễn Tri Phương, refused, Garnier stormed the citadel of Hanoi at dawn on 20 November 1873. About 7,000 Vietnamese soldiers held it; by Garnier’s report some 80 were killed and 2,000 captured, and the French lost no one. Nguyễn Tri Phương, badly wounded, refused treatment and died a month later. Small French parties then took Hải Dương, Phủ Lý and Ninh Bình, the last with six sailors, and Garnier took Nam Định on 11 December.
      - The court called on Liu Yongfu’s Black Flag Army. On 21 December, as the Black Flags approached Hanoi, Garnier led a sortie and was killed near the Paper Bridge, just west of the city, with his officer Balny d’Avricourt and several sailors. Saigon had not authorised the conquest. Its envoy Paul-Louis-Félix Philastre arranged the evacuation of the delta towns, and by the Treaty of Saigon of 15 March 1874 France gave them back in return for Vietnam’s recognition of French rule over all of Cochinchina, the opening of the Red River to trade and small French garrisons in Hanoi and Haiphong.
