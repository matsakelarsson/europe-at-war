  - title: Sơn Tây, Bắc Ninh and Hưng Hóa
    date: December 1883 – April 1886
    when: "1883-12-16"
    borders: "1884-06-06"
    countries: [vn, fr, cn]
    body:
      - The treaty did not end the war in Tonkin, where the Black Flags held Sơn Tây and the Guangxi army held Bắc Ninh. In December 1883 Courbet, with about 9,000 men, marched on Sơn Tây, a walled town on the Red River held by the Black Flags with Chinese and Vietnamese troops. The first assault, on the outworks at Phù Sa on 14 December, was beaten back with heavy losses; on 16 December the French stormed the town, losing 83 dead and 320 wounded. The Black Flags fell back up the Red River to Hưng Hóa.
      - General Charles-Théodore Millot, with just over 11,000 French, Algerian and Vietnamese troops, the largest French force of the campaign, attacked Bắc Ninh in March 1884, and the Guangxi army abandoned it on 12 March after little fighting. On 11–12 April Millot took Hưng Hóa. By the Tientsin Accord of 11 May 1884 China agreed to withdraw its troops from Tonkin, and by a new Treaty of Huế on 6 June 1884 the court confirmed the protectorate; the seal the Chinese emperor had given the Nguyễn kings was melted down in front of the French envoy, Jules Patenôtre.
      - Within weeks the clash at Bắc Lệ began the Sino-French War. When that war ended in June 1885, about 35,000 French troops were in Tonkin. In the summer and autumn of 1885 cholera killed more of them than the war with China had, and local leaders, scholars and remaining Black Flags fought on in the hills and the delta; the French occupied Lào Cai on 29 March 1886, and in April 1886 General Warnet declared Tonkin under control. Resistance continued, at Bãi Sậy in the delta, in Yên Thế and under the Cần Vương edict, until the late 1890s.
    facts:
