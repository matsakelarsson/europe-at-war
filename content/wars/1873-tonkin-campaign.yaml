id: tonkin-campaign
name: French campaigns in Tonkin
start: "1873-11-20"
end: "1886-04"
tier: B
summary: "The French conquest of Tonkin, the north of Nguyễn Vietnam (Đại Nam), in two attempts. In 1873 the naval officer Francis Garnier, sent from Saigon to settle a quarrel between the court and the arms trader Jean Dupuis over trade on the Red River, stormed the citadel of Hanoi and overran the delta, but he was killed by Liu Yongfu’s Black Flag Army outside Hanoi, and France withdrew under the treaty of 1874. In 1882 Henri Rivière took Hanoi again; his death at the Paper Bridge in May 1883 led France to send an expeditionary corps, attack Huế and force the court to accept a protectorate (August 1883). French armies took Sơn Tây from the Black Flags in December 1883 and Bắc Ninh and Hưng Hóa from the Chinese armies in Tonkin in March and April 1884, and the Treaty of Huế of June 1884 made the protectorate final. The clash with China that followed is told as the Sino-French War; after it the French fought local resistance across Tonkin and declared the country under control in April 1886, though fighting went on for another decade."
