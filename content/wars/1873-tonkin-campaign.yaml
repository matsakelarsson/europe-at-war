  - title: Rivière, the Paper Bridge and the protectorate
    date: April 1882 – August 1883
    when: "1883-05-19"
    borders: "1883-08-25"
    countries: [vn, fr]
    body:
      - Under Jules Ferry’s government France returned to Tonkin. In April 1882 the governor of Cochinchina sent Commandant Henri Rivière to Hanoi with a small force of marine infantry, and on 25 April Rivière seized the citadel. The court protested and asked China, its suzerain, for help; Qing troops from Guangxi and Yunnan moved into the north of Tonkin, and Liu Yongfu’s Black Flags were paid to fight the French. On 27 March 1883 Rivière took Nam Định to secure the river route to the sea.
      - On 19 May 1883 Rivière led a column out of Hanoi against the Black Flags and was ambushed at the Paper Bridge by about 1,500 Black Flags; he and 34 of his officers and men were killed and 52 wounded. France sent an expeditionary corps under General Alexandre-Eugène Bouët, with Admiral Amédée Courbet’s ships and the civil commissioner Jules Harmand. Emperor Tự Đức died on 17 July, and the succession was disputed at court. In August Courbet’s squadron bombarded the Thuận An forts at the mouth of the Perfume River, which guarded Huế, and stormed them on 20 August.
      - With the capital open to attack, the new emperor Hiệp Hòa’s ministers signed the treaty Harmand dictated on 25 August 1883. Vietnam accepted a French protectorate, ceded the province of Bình Thuận to Cochinchina (it was given back in 1884) and agreed to French residents in the provinces of Tonkin. In the delta Bouët’s attacks on the Black Flags at Phủ Hoài and Palan in August and September gained little.
    facts:
      - [Hanoi citadel taken by Rivière, "25 April 1882"]
      - [Battle of the Paper Bridge, "19 May 1883, Black Flag victory"]
      - [Thuận An forts stormed, "20 August 1883"]
