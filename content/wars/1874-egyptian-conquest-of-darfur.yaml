id: egyptian-conquest-of-darfur
name: Egyptian conquest of Darfur
start: "1873-07"
end: "1874-11-04"
tier: C
summary: "The end of the independent Keira sultanate of Darfur at the hands of al-Zubayr Rahma Mansur, a Ja’ali merchant prince from the Nile who had built a private empire of trading and slave-raiding stations (zaribas) in Bahr el-Ghazal, and of the Egyptian government of Sudan. The sultans of Darfur controlled the trade routes north from Bahr el-Ghazal, and quarrels over caravans and a grain embargo led al-Zubayr to fight the Rizeigat Baggara, Darfur’s clients, and to occupy Shakka in August 1873. Khedive Ismail made him governor of Shakka and Bahr el-Ghazal in November 1873, and in 1874 his army of slave riflemen (bazinqir) invaded Darfur from the south while the governor-general Ismail Ayyub Pasha advanced from Kordofan. On 25 October 1874 (23 or 30 October in other accounts) Sultan Ibrahim Qarad was defeated and killed at Manawashi, south of El Fasher; al-Zubayr entered El Fasher on 2 November and Ismail Ayyub two days later. Darfur became an Egyptian province, but members of the Keira family led resistance from Jebel Marra for years. Al-Zubayr went to Cairo in 1875 to press his claims and was not allowed to return; his son Sulayman was killed after a revolt in 1879, and his lieutenant Rabih az-Zubayr went west to found his own state. Egyptian rule in Darfur ended with the Mahdist rising in 1883."
