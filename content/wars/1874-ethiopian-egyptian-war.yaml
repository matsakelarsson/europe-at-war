id: ethiopian-egyptian-war
name: Ethiopian–Egyptian War
start: "1874"
end: "1876-03-10"
tier: B
summary: "Khedive Isma’il of Egypt’s attempt to extend his African empire into the Ethiopian highlands. Egypt had taken over Massawa from the Ottomans in 1865 and occupied the Bogos country around Keren in 1872, and in 1875 its forces took Zeila, Berbera and the emirate of Harar. In the autumn of 1875 two columns marched inland against Ethiopia: Werner Munzinger’s from Tadjoura was destroyed by the forces of the sultan of Aussa, and Colonel Arendrup’s from Massawa was annihilated by Emperor Yohannes IV’s army at Gundet near the Mareb on 16 November 1875. A larger army under Ratib Pasha, with the American general William Loring as chief of staff, entrenched on the plain of Gura and was defeated on 7–9 March 1876. No peace was signed; Egypt kept Massawa, Bogos and Harar for some years, and the war’s cost added to the debts that led to Isma’il’s fall in 1879. Shalaqa Alula, the hero of both battles, became Ras Alula and governor of the northern frontier."
