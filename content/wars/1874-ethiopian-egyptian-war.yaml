notes:
  - Egypt was formally an Ottoman province governed by its khedive. Its armies were officered partly by Europeans and by Americans who had served in the Civil War, among them Loring and Charles Pomeroy Stone in Cairo.
  - The sources give different strengths and losses for both battles, and different days for Gura (7–9 or 7–10 March 1876). The site of Gundet is described only as a narrow valley near the Mareb, south of today’s Adi Quala; its marker is approximate.
