steps:
  - title: Isma’il’s advance and Gundet
    date: 1872 – November 1875
    when: "1875-11-16"
    borders: "1875-11-16"
    countries: [er, et, eg, dj, so]
    body:
      - Isma’il, khedive of Egypt from 1863, wanted to control the Nile basin and the coasts of the Red Sea and the Gulf of Aden. In 1865 the Ottomans handed Massawa and Suakin over to Egypt, and in 1872 the Swiss Werner Munzinger, Egypt’s governor at Massawa, occupied the Bogos country around Keren, which Ethiopia claimed. In 1875 Egyptian forces took Zeila and Berbera, and in October Ra’uf Pasha marched from Zeila to Harar, killed its emir and occupied the city. Emperor Yohannes IV, crowned in 1872, protested to the European powers, but Isma’il prepared to take the northern highlands as well.
      - In the autumn of 1875 two columns marched inland. Munzinger set out from Tadjoura towards Shewa, whose king Menelik was Yohannes’s rival, but in November his column was attacked in the country of the Afar sultanate of Aussa and Munzinger was killed. The other column, about 2,500 Egyptian soldiers under the Danish colonel Adolph Arendrup, marched from Massawa into the highlands of Hamasien and on to the Mareb. Yohannes gathered an army of perhaps 10,000 or more, and on 16 November 1875 at Gundet, in a narrow valley near the Mareb, his troops, led by Shalaqa Alula, attacked the strung-out column from the hills and destroyed it. Arendrup and his senior officers, among them Arakil Bey and Count Zichy, were killed, and the Ethiopians took the column’s guns and rifles.
    facts:
      - [Egypt takes Harar, "October 1875"]
      - [Battle of Gundet, "16 November 1875, Ethiopian victory"]
      - [Egyptian losses, "about 2,000 killed or captured"]
