  - title: Gura
    date: December 1875 – March 1876
    when: "1876-03-07"
    borders: "1876-03-10"
    countries: [er, et, eg]
    body:
      - Isma’il sent a second, larger army, about 13,000 men under Muhammad Ratib Pasha, with Loring as chief of staff and the khedive’s son Prince Hassan attached. It landed at Massawa in December 1875, climbed to the highlands and built two forts, one on the plain of Gura and one at Khaya Khor in the pass behind it, with about 7,500 and 5,500 men. Yohannes brought up an army of over 50,000, of whom perhaps 15,000–20,000 were engaged at a time.
      - On 7 March 1876 about 5,000 Egyptian infantry marched out of Fort Gura against the Ethiopians, were surrounded in the open and broke; most were killed or taken. An Ethiopian assault on the fort was beaten back by its artillery, and after a few days the Ethiopian army, short of food, dispersed, while the Egyptians fell back to the coast. Egyptian losses are given as about 3,200 dead and 2,000 captured, Ethiopian losses as about 1,800 dead.
      - No treaty followed. Egypt kept Massawa and Bogos and held Harar until 1885; Charles Gordon, the khedive’s governor-general of the Sudan, failed to reach a settlement with Yohannes in 1879. Alula was made Ras and governor of the frontier province of Mereb Melash, which from 1884 he ruled from Asmara. The defeat added to Egypt’s debts and its discontents, and Isma’il was deposed under European pressure in 1879. In 1884, by the Hewett Treaty, Britain and Egypt returned Bogos to Ethiopia in return for help in evacuating the Egyptian garrisons cut off by the Mahdists in the Sudan.
    facts:
