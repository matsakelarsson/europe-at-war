  - title: Malaria and the Peking agreement
    date: June – December 1874
    when: "1874-10-30"
    borders: "1874-12-03"
    countries: [tw, cn, jp]
    body:
      - The Japanese built lasting camps and showed no sign of leaving. The Qing sent the commissioner Shen Baozhen to Taiwan with troops and warships, and the two sides held talks in camp in June without result. In the summer malaria broke out among the Japanese; hundreds were sick by August and September, and by the end 561 had died, many times the number killed in battle.
      - Ōkubo Toshimichi went to Beijing in September, and after weeks of difficult talks, with the British minister Thomas Wade acting as a go-between, an agreement was signed at the end of October 1874. The Qing paid an indemnity of 500,000 taels, of which 100,000 was for the families of the dead Ryukyuans, and described the expedition as a lawful act to protect Japanese subjects; Japan accepted that Taiwan was Chinese. The troops left on 3 December. Afterwards the Qing built roads into the mountains, encouraged settlement and in 1885 made Taiwan a province.
    facts:
      - [Peking agreement, "October 1874"]
      - [Indemnity, "500,000 taels"]
