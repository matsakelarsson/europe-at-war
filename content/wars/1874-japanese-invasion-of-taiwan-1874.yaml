steps:
  - title: The landing and the Battle of Stone Gate
    date: May – June 1874
    when: "1874-05-22"
    borders: "1874-05-22"
    countries: [tw]
    body:
      - The Japanese government decided on the expedition in April 1874, over the objections of the British and American ministers, and sent it off under Saigō Jūdō, the younger brother of Saigō Takamori. An advance force landed at Sheliao on Langqiao Bay (today Checheng in Pingtung) on 6–7 May and built a camp, and some of the southern villages made terms with it. On 17 and 21 May small parties were ambushed by fighters from Mudan; a soldier was killed and beheaded.
      - On 22 May, the day Saigō arrived with the main force, a column of about 150 men under Sakuma Samata pushed up the river valley into the gorge of Shimen (Stone Gate), where some 70 Mudan men waited behind the rocks. After more than an hour of fighting Japanese riflemen climbed the cliffs above and the Paiwan withdrew, losing 16 men, among them their chief Agulu and his son. In early June three Japanese columns marched into the hills and burned Mudan, Kuskus and other villages, and on 1 July the leaders of Mudan and Kuskus submitted.
