notes:
  - Japanese and Western sources of the time called the indigenous peoples of Taiwan “savages” and their lands terra nullius; the Qing held that the whole island was Chinese even where its officials did not govern. Japan’s campaign was planned with the help of the former American consul at Xiamen, Charles Le Gendre.
  - Japanese losses were 12 killed in battle and 561 dead of disease, according to Japanese figures. The Paiwan lost some 30 or more men in the fighting, including the Mudan chief Agulu and his son, and many villages were burned.
