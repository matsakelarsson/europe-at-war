id: japanese-invasion-of-taiwan-1874
name: Japanese invasion of Taiwan (1874)
start: "1874-05-06"
end: "1874-12-03"
tier: B
summary: "Japan’s first overseas military expedition of the Meiji era, also called the Taiwan Expedition or, in Taiwan and China, the Mudan Incident. In December 1871 a ship from the Ryukyu Kingdom was wrecked on the south-east coast of Taiwan, and 54 of its crew were killed by Paiwan people of Mudan and Kuskus. Japan, which was claiming the Ryukyus, argued that the indigenous lands of Taiwan lay outside Qing rule and in May 1874 landed some 3,600 troops under Saigō Jūdō in the south of the island. They defeated the Paiwan at Stone Gate on 22 May and burned their villages, but malaria killed 561 men while the soldiers waited in camp. The Qing sent troops to Taiwan, and in Beijing Ōkubo Toshimichi negotiated an agreement, signed at the end of October, by which China paid 500,000 taels and called the expedition an act to protect Japanese subjects. Japan withdrew in December; it later used the wording to support its annexation of the Ryukyus in 1879, and the Qing began to strengthen its hold on Taiwan."
