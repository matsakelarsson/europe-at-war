id: red-river-war
name: Red River War
start: "1874-06-27"
end: "1875-06-02"
tier: B
summary: "The United States Army’s campaign of 1874–1875 that forced the last free bands of the Comanche, Kiowa, Southern Cheyenne and Arapaho onto reservations in Indian Territory, ending the wars of the southern plains. The Medicine Lodge treaties of 1867 had assigned the four nations reservations in Indian Territory with rations and hunting rights south of the Arkansas, but the rations fell short and from 1873 commercial hunters slaughtered the last great buffalo herds of the southern plains for their hides. Inspired by the Comanche prophet Isatai, several hundred Comanche, Cheyenne and Kiowa warriors (estimates range from about 250 to 700) led by Quanah Parker attacked the hunters’ post at Adobe Walls in the Texas Panhandle on 27 June 1874 and were driven off by the hunters’ long-range rifles; raids across Texas, Kansas and Colorado followed. Generals Sherman and Sheridan sent five columns from Kansas, Indian Territory, Texas and New Mexico to converge on the headwaters of the Red River and keep the bands moving without rest. Most fights were small, but the army destroyed what the bands could not carry: on 28 September Colonel Ranald Mackenzie’s 4th Cavalry surprised Comanche, Kiowa and Cheyenne camps in Palo Duro Canyon, burned their lodges and winter food and killed most of some 1,400 captured horses. Hungry and on foot, band after band surrendered through the winter and spring, the last, Quanah’s Quahadi Comanche, at Fort Sill on 2 June 1875. About seventy men and women chosen as leaders or wrongdoers were sent without trial to prison at Fort Marion in Florida."
