notes:
  - "Many Comanche, Kiowa, Cheyenne and Arapaho stayed at the agencies throughout the war and were enrolled as friendly; the war was fought by the bands that left them or had never come in, travelling with their families. The prisoners at Fort Marion were held until 1878; the officer in charge, Richard Henry Pratt, later founded the Carlisle Indian Industrial School on the model of his work with them."
