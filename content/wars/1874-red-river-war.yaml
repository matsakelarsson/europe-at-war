  - title: Palo Duro Canyon and the surrender
    date: September 1874 – June 1875
    when: "1874-09-28"
    borders: "1874-09-28"
    countries: [us]
    body:
      - "In September Kiowa and Comanche warriors besieged an army supply train under Captain Wyllys Lyman on the upper Washita for five days, and small fights flared across the Panhandle as the columns pressed the bands, which travelled with their families and herds. Mackenzie’s Tonkawa and Black Seminole scouts found a great winter camp of Comanche, Kiowa and Cheyenne in the upper Palo Duro Canyon, and at dawn on 28 September his troopers rode down a narrow trail into it. The people escaped up the canyon with only a few killed, but the soldiers burned hundreds of lodges with the winter’s food and took more than 1,400 horses, most of which Mackenzie had shot in nearby Tule Canyon so that they could not be retaken."
      - "Through a wet and freezing autumn and winter the columns kept up the pursuit, and band after band, hungry and on foot, came in to Fort Sill or the Cheyenne agency at Darlington. Satanta, who had been paroled in 1873, was sent back to prison in Texas, where he died in 1878; Lone Wolf’s Kiowa surrendered in February 1875 and the Cheyenne of Stone Calf in March, after freeing captive white girls of the German family. Troops pursuing Cheyenne who fled north attacked a camp on Sappa Creek in Kansas on 23 April, killing about 27 people, among them women and children. Quanah’s Quahadi, the last free Comanche band, came in to Fort Sill on 2 June 1875."
      - "Sherman and Sheridan wanted the leaders tried by military commissions, but the army found no legal basis for it, and instead about seventy Cheyenne, Kiowa, Comanche, Arapaho and Caddo prisoners, some chosen almost at random, were sent to Fort Marion at St. Augustine, Florida. The buffalo were gone from the southern plains within a few years, and the Panhandle was opened to ranchers. Quanah Parker became a leader of the Comanche on the reservation and a negotiator with the government."
