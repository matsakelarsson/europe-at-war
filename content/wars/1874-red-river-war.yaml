steps:
  - title: Buffalo, Adobe Walls and the five columns
    date: June – August 1874
    when: "1874-06-27"
    borders: "1874-08-01"
    countries: [us]
    body:
      - "By the Medicine Lodge treaties of 1867 the Comanche, Kiowa and Plains Apache accepted a reservation between the Washita and the Red River, and the Southern Cheyenne and Arapaho one to the north of it (moved in 1869 to the lands just north of the Washita), in return for rations, schools and the right to hunt south of the Arkansas while the buffalo lasted. Some bands, such as the Quahadi Comanche of the Llano Estacado, never came in. After a new tanning process made buffalo hides valuable in 1870, white hunters killed millions of buffalo, and from 1873 they moved south into the Texas Panhandle, the last great range of the southern herd. Rations at the agencies were short and horse thieves raided the bands’ herds."
      - "In the spring of 1874 the young Comanche prophet Isatai, who promised his followers protection from bullets, called a sun dance, and the bands agreed on war. On 27 June several hundred Comanche, Cheyenne and Kiowa warriors (estimates range from about 250 to 700) led by Quanah Parker attacked Adobe Walls, a hunters’ trading post in the Panhandle defended by 28 men and one woman. A few defenders were killed in the first rush, but the hunters’ heavy buffalo rifles kept the warriors at a distance, and after several days they withdrew. War parties then struck settlements and travellers in Texas, Kansas and Colorado, and the Kiowa war leader Lone Wolf (Guipago), whose son had been killed by soldiers in Texas, fought Texas Rangers at Lost Valley in July."
      - "In July the government ordered all who were friendly to enrol at the agencies, and Sheridan sent five columns against the rest: Colonel Nelson Miles south from Fort Dodge in Kansas, Lieutenant Colonel John Davidson west from Fort Sill, Lieutenant Colonel George Buell north-west from Fort Griffin, Mackenzie north from Fort Concho and Major William Price east from Fort Union by way of Fort Bascom in New Mexico. On 22 August fighting broke out at the Wichita Agency at Anadarko when troops tried to disarm Kiowa and Comanche there."
