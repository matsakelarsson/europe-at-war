id: saga-rebellion
name: Saga rebellion
start: "1874-02-16"
end: "1874-04-13"
tier: C
summary: "The first of the armed risings of former samurai (shizoku) against the Meiji government, in the former Saga (Hizen) domain in northern Kyushu. The samurai had lost their stipends, their status and their monopoly of arms, and when the government refused in 1873 to send an expedition against Korea (the Seikanron debate), the former justice minister Etō Shinpei and other councillors resigned in protest. In January 1874 Etō returned to Saga, where he led the Seikantō, the party for war with Korea, while the former Akita governor Shima Yoshitake led the Yūkokutō, conservatives who wanted the old order back. On 16 February their followers seized a bank and the government offices in the old Saga castle; estimates of their strength range from about 3,000 to 11,000. The interior minister Ōkubo Toshimichi took personal command, set up his headquarters at Hakata on 19 February and brought in some 5,000 soldiers and police with steamships and the telegraph. After the rebels lost a battle on the Saga–Fukuoka border on 22 February Etō disbanded his followers and fled; the rest fought on in the streets of Saga on 27 February, and government troops took the castle on 1 March. Government losses were 147 killed and 209 wounded, rebel losses 173 killed and 160 wounded. Etō was caught in Tosa on 28 March and Shima in Kagoshima; after a military trial they and eleven others were executed on 13 April, and Etō’s head was put on public display. Satsuma and Tosa did not rise with Saga, and the government’s speed set the pattern for the risings of 1876 and 1877."
