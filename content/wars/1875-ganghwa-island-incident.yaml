notes:
  - Japan used the Gregorian calendar from 1873, and Japanese records give these dates directly; the clash on 20 September was on the 21st day of the eighth lunar month in Korean records. The treaty is dated 26 February 1876 in the Japanese text and 27 February in some Korean accounts.
  - Inoue’s own report suggests that the Un’yō opened fire first on 21 September, in reprisal for the firing of the day before.
