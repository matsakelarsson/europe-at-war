id: ganghwa-island-incident
name: Ganghwa Island incident
start: "1875-09-20"
end: "1876-02-26"
tier: C
summary: "A clash between the Japanese gunboat Un’yō and the Korean forts at the mouth of the Han River, which Japan used to force Korea to open its ports. After the Meiji Restoration Korea had refused to accept letters from the new Japanese government because they used titles reserved for the Chinese emperor, and talks at Busan in 1875 had failed. In September 1875 the Un’yō, under Inoue Yoshika, was surveying the Korean coast. On 20 September a boat from the ship approached the fort of Chojijin on Ganghwa Island, said to be looking for water, and the fort fired on it. The next day the Un’yō shelled Chojijin, and on 22 September it bombarded the fort of Yeongjongjin on Yeongjong Island and landed marines, who burned the town and carried off its cannon. Thirty-five Koreans were killed and sixteen captured; two Japanese were wounded. In February 1876 Japan sent Kuroda Kiyotaka with warships and troops to Ganghwa to demand redress, and on 26 February the Korean envoy Sin Heon signed the Japan–Korea Treaty of Amity, the Treaty of Ganghwa. It declared Korea an independent state with the same sovereign rights as Japan, opened Busan and two more ports (Wonsan and Incheon) to Japanese trade, gave Japanese subjects extraterritorial rights and allowed Japan to survey the Korean coast. It was the first of the unequal treaties that opened Korea."
countries: [kr, jp]
