notes:
  - Dates are New Style (Gregorian); local Orthodox Christians used the Julian calendar, then 12 days behind. Numbers of refugees and dead are contemporary estimates and vary widely.
  - Historians of the region still differ over how far the rising was a social revolt of peasants against landlords, a national rising and a religious war, and over the part played by Catholics, most of whom stayed out of it after the first months. Its fighting from June 1876 is told under the Montenegrin–Ottoman and Serbian–Ottoman wars.
