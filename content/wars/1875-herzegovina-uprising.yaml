id: herzegovina-uprising
name: Herzegovina Uprising of 1875–1877
start: "1875-07-09"
end: "1877"
tier: B
summary: A rising of Christian peasants, mostly Orthodox Serbs, against their Muslim landlords and Ottoman tax collectors, which began around Nevesinje in Herzegovina in July 1875 and spread to Bosnia. Aided by Montenegro and Serbia, it opened the Great Eastern Crisis that led to the Serbian and Montenegrin wars of 1876, the Russo-Turkish War of 1877–1878 and the Austro-Hungarian occupation of Bosnia and Herzegovina.
