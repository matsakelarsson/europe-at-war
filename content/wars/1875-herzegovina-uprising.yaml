steps:
  - title: Nevesinje and the Great Eastern Crisis
    date: 1875–1877
    when: "1875-07-09"
    borders: "1876-06-30"
    countries: [ba, hr, me, rs, tr]
    body:
      - Bosnia’s Christian peasants owed up to half their harvest to Muslim landlords, as well as taxes collected by tax farmers, and the bad harvest of 1874 and higher taxes in 1875 made their burden unbearable. In early July 1875 villagers around Nevesinje in Herzegovina clashed with Ottoman troops, and within weeks the revolt spread to Bileća, Stolac, Gacko and the Montenegrin border; Catholics around Gabela also rose, hoping for Austrian intervention. Bands of rebels destroyed border posts and the towers of the beys, and besieged Trebinje in August. In mid-August Serbs in the Bosnian Krajina rose too, around Kozara and Grmeč.
      - Montenegro and Serbia sent arms and volunteers, and Italians, Russians and others came to fight, while refugees fled to Austrian Dalmatia and Croatia and to Montenegro, between 100,000 and 250,000 by the end of 1876. The great powers tried to contain the crisis. The Andrássy Note of December 1875 and the Berlin Memorandum of May 1876 called for reforms, but the rebels would not lay down their arms without guarantees. Villages were burned and civilians driven out by both sides. In June 1876 Serbia and Montenegro went to war, and the rising merged into the wider wars that ended with the Austro-Hungarian occupation of 1878.
