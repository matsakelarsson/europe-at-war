  - title: Arsi and the Gurage
    date: 1881–1888
    when: "1886-09-06"
    borders: "1887-01-01"
    countries: [et]
    body:
      - The Arsi Oromo, south-east of Shewa, had no kings; they were governed by the assemblies and age-sets of the gadaa system, and their horsemen knew the country. They defeated or wore down five Shewan campaigns from 1881, using raids and ambushes against armies with more guns. Menelik left his uncle Ras Darge Sahle Selassie in charge, and on 6 September 1886 Darge’s army defeated the Arsi at Azule. Arsi oral tradition and Oromo historians tell that captured men and women were then mutilated at Anole, men’s right hands and women’s breasts being cut off; the scale of what happened is disputed, and a monument to the victims was put up at Anole in 2014. Many Arsi were enslaved and sold, and travellers four years later still saw Arsi captives in the markets. The land was divided among Shewan soldiers and the church.
      - West of Shewa, the Muslim Gurage and Qabena leader Hassan Enjamo declared a jihad against Shewan rule and held out for more than a decade, until Ras Gobana defeated him at Jebdu Meda in 1888 with the help of Habte Giyorgis Dinagde. In the east, an attempt to advance into the Chercher highlands was beaten back by the Ittu Oromo in 1883–1885.
    facts:
      - [Shewan campaigns in Arsi, "six, from 1881 to 1886"]
      - [Battle of Azule, "6 September 1886, Shewan victory"]
      - [Battle of Jebdu Meda, "1888, Shewan victory"]
    arrows:
      - side: sh
        label: Ras Darge
        phase: 1
        via: [[39.00, 9.00], [39.20, 8.50], [39.40, 8.00]]
      - side: sh
        label: Ras Gobana
        phase: 2
        via: [[38.70, 8.95], [38.40, 8.50], [38.10, 8.10]]
