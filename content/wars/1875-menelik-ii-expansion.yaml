  - title: The Ogaden and the new borders
    date: 1887–1900
    when: "1897-05-14"
    borders: "1900-01-01"
    countries: [et, so, dj, er]
    body:
      - From Harar, Ras Makonnen’s forces raided and taxed the Somali clans of the Ogaden and the Haud in the 1890s, carrying off livestock as tribute, and pushed garrisons as far as Jijiga and the Shebelle valley. In 1891 Menelik sent the European powers a circular claiming borders that reached Khartoum in the west and Lake Victoria in the south. After Adwa the powers negotiated with him. Treaties of 1897 with France and Britain set the borders with French Somaliland and, by the treaty Rennell Rodd signed on 14 May 1897, with British Somaliland, where Britain gave up much of the grazing land it had claimed. The borders with Italian Eritrea (1900 and 1902) and Italian Somaliland (1908) followed, the last left undemarcated in the Ogaden.
      - In the conquered lands the new order rested on the neftenya, northern soldiers settled in fortified towns, and the gebbar system, under which the local farmers owed them and the state labour, produce and taxes; much land passed to the crown, the church and the settlers. Local rulers who had submitted, like Abba Jifar of Jimma or the Leqa rulers of Wollega, kept much of their power, while elsewhere the old elites were replaced. In 1900 the followers of Mohammed Abdullah Hassan, who called themselves Dervishes (Daraawiish), attacked the Ethiopian garrison at Jijiga, the start of two decades of war in the Ogaden and British Somaliland.
    facts:
      - [Menelik’s circular to the powers, "1891"]
      - [Anglo-Ethiopian treaty, "14 May 1897"]
      - [Dervish attack on Jijiga, "1900"]
