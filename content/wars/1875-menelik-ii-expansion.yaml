steps:
  - title: The king of Shewa
    date: 1865–1878
    when: "1876"
    borders: "1878-03-01"
    countries: [et]
    body:
      - Menelik escaped from Tewodros’s fortress of Magdala in 1865 and was proclaimed king of Shewa, the kingdom his grandfather Sahle Selassie had ruled. Shewa lay on the trade routes from the south to the ports of Zeila and Tadjoura, and Menelik used its income from ivory, gold, civet, coffee and slaves, and from taxes on the caravans, to buy firearms. After Tewodros’s death he fought for a decade over southern Wollo with its Muslim Oromo lords and queens, founded the fortress of Were Ilu there, and in 1876 placed the province under a governor of his own. Several Gurage districts west of Shewa, among them the Soddo Gurage, submitted peacefully in these years.
      - Menelik also hoped for the imperial throne, which Kassa Mercha of Tigray had taken as Yohannes IV in 1872. In 1878 Yohannes marched on Shewa, and at Liche on 15 February 1878 Menelik submitted, paid tribute and was recognised as king of Shewa under Yohannes. The two rivals left each other a free hand on different frontiers, Yohannes in the north and west, Menelik in the south.
    facts:
      - [Menelik king of Shewa, "1865"]
      - [Council of Liche, "15 February 1878"]
    markers:
      - kind: capital
        side: sh
        name: Ankober
        date: 1865–1878
        text: Old capital of the kings of Shewa; Menelik later moved his court to Liche, Entoto and Addis Ababa.
        lonlat: [39.73, 9.58]
      - kind: taken
        side: sh
        name: Were Ilu
        date: 1870s
        text: The fortress Menelik founded in southern Wollo during his wars with its Oromo rulers.
        lonlat: [39.43, 10.60]
    arrows:
      - side: sh
        label: Menelik
        phase: 1
        via: [[39.60, 9.70], [39.50, 10.10], [39.43, 10.55]]
