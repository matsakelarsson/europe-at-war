  - title: Kaffa, Bela Shangul and the far south
    date: 1896–1898
    when: "1897-09"
    borders: "1898-06-01"
    countries: [et]
    body:
      - After the victory over Italy at Adwa in March 1896 Menelik turned to the last independent kingdom of the south-west, Kaffa, a highland state with its own ancient dynasty, rich in coffee and forest. Three armies under Ras Wolde Giyorgis, Dejazmach Tessema Nadew and Dejazmach Demissew Nasibu, with the help of Abba Jifar of Jimma, invaded it. King Gaki Sherocho withdrew into the forests and resisted for months, but was captured in September 1897 and taken to Addis Ababa. Wolde Giyorgis became governor. The war, the slave raids that followed it and the burdens of the new rule depopulated large parts of Kaffa.
      - In 1897–1898 Ethiopian armies took the gold-bearing borderlands of Bela Shangul on the Sudanese frontier, where Sheikh Khojali al-Hasan of Asosa submitted, and Tessema Nadew led an expedition to the White Nile, hoping to meet the French at Fashoda. Wolde Giyorgis marched south, and on 29 March 1898 his men raised the Ethiopian flag on the shores of Lake Turkana. These advances fixed the claims Ethiopia then negotiated with Britain on its borders with the Sudan (1902) and British East Africa (1907).
    facts:
      - [Gaki Sherocho captured, "September 1897"]
      - [Lake Turkana reached, "29 March 1898"]
