notes:
  - "The dates of many campaigns differ by a year or more between sources, which rely on Ethiopian chronicles, European travellers and the oral traditions of the conquered peoples. Numbers of dead, especially for Arsi, Wolaita and Kaffa and for the famine of 1888–1892, are estimates that vary widely; some put the deaths caused by the conquests in the millions, others give much lower figures."
  - "The terms are contested. Ethiopian historians have spoken of expansion, unification or the recovery of provinces held by the medieval empire before the 16th century; Oromo nationalist and other southern historians speak of conquest and colonisation. The Encyclopaedia Aethiopica calls Menelik the founder of the modern Ethiopian state, whose empire was deeply flawed but no worse than those of other empire-builders of his time."
  - The base map shows the conquered lands changing hands as the sources date their incorporation. Tributary states such as Jimma are drawn as areas.
