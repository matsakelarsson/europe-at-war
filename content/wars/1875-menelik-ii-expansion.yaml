        atoms: [ET-HA, ET-DD, ET-OR~hararghe]
  - title: Famine, the crown and the southern kingdoms
    date: 1888–1894
    when: "1894-11"
    borders: "1894-12-31"
    countries: [et]
    body:
      - From 1888 a rinderpest epidemic, brought to the Horn with cattle imported by the Italians, killed most of the region’s cattle, and drought, locusts and disease followed. In the Great Famine of 1888–1892 a large part of the population died; some estimates put it at a third. When Yohannes IV was killed at Gallabat in March 1889, Menelik was recognised as emperor and crowned on 3 November 1889, and the treaty he signed with Italy at Wuchale that year gave him access to Italian rifles.
      - The campaigns went on through the famine. Ras Darge took Bale in 1891–1892, and Ethiopian armies moved into Sidamo, Gedeo and the southern Hadiya country. The kingdom of Wolaita, under Kawo Tona, refused to submit. In late 1894 Menelik led a large army against it; after weeks of fighting Tona was wounded and captured, and his kingdom was devastated. Bahru Zewde calls it one of the bloodiest campaigns of the expansion. Wolaita oral tradition gives figures of over 100,000 dead, which historians treat with caution, and thousands of captives were carried off.
    facts:
      - [Great Ethiopian Famine, "1888–1892"]
      - [Menelik crowned emperor, "3 November 1889"]
      - [Bale taken, "1891–1892"]
      - [Wolaita conquered, "late 1894"]
    markers:
