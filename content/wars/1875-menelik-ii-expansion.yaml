        polygon: [[39.0, 10.4], [40.0, 10.4], [40.0, 11.2], [39.0, 11.2]]
  - title: Embabo and the south-west
    date: 1880–1886
    when: "1882-06-06"
    borders: "1882-06-06"
    countries: [et]
    body:
      - South-west of Shewa lay the rich lands of the Gibe and Wollega, with the Oromo monarchies of Jimma, Limmu-Ennarea, Gera, Gomma and Guma and the Leqa states of Neqemte and Qellem, sources of gold, ivory, coffee, civet and slaves. Menelik’s general Ras Gobana Dacche, himself a Shewan Oromo, led his armies there. Many rulers chose to submit and pay tribute rather than fight. Abba Jifar II of Jimma submitted in 1882 and kept his kingdom with wide self-rule until his death in 1932, and Moroda Bakare of Neqemte and his son Kumsa Moroda accepted Shewan overlordship and kept their lands.
      - The same lands were promised by Yohannes to his other vassal, Tekle Haymanot, whom he had crowned king of Gojjam in 1881. The two kings’ armies met at Embabo, near the Guder river, on 6 June 1882; Gobana’s cavalry broke the Gojjame flank, and Tekle Haymanot was wounded and captured. Yohannes intervened, summoned both to Were Ilu, freed Tekle Haymanot, took southern Wollo and the Shewan army’s captured guns from Menelik, and confirmed his hold on the south-west. Menelik moved his court to Entoto in 1881 and founded Addis Ababa below it in 1886.
    facts:
      - [Battle of Embabo, "6 June 1882, Shewan victory"]
      - [Losses at Embabo, "about 900 killed on each side"]
      - [Jimma submits, "1882"]
    markers:
