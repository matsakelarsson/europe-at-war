  - title: Chelenqo and Harar
    date: 1885 – January 1887
    when: "1887-01-09"
    borders: "1887-01-31"
    countries: [et]
    body:
      - When Egypt withdrew from Harar in 1885, the British arranged for Emir Abdullahi, a member of the old ruling family, to take over. His city, a centre of Islamic learning and the trade between the highlands and the coast, was weak, surrounded by Oromo and Somali groups, and sought by Shewa, by the Italians and by others. After an Italian exploring party under Count Porro was killed near Harar in 1886, Menelik, who had been preparing for the conquest, marched on the city himself with 20,000–25,000 men.
      - Abdullahi, with 3,000–4,000 men, attacked the Shewan camp at Chelenqo at dawn on 9 January 1887, hoping to take it by surprise. His force was defeated, with about 1,000 dead; Harari tradition remembers among them hundreds of Quran scholars and young men who had just married. The emir fled to the Ogaden, and Menelik entered Harar. He made his cousin Makonnen governor; the city’s main mosque was demolished and the church of Medhane Alem built in its place. Harar became the base for the Ethiopian advance into the Somali lands of the Ogaden.
    facts:
      - [Battle of Chelenqo, "9 January 1887, Shewan victory"]
      - [Forces, "Shewa 20,000–25,000; Harar 3,000–4,000"]
      - [Governor of Harar, "Makonnen (later Ras)"]
    markers:
      - kind: battle
        side: sh
        name: Chelenqo
        date: 9 January 1887
        text: Emir Abdullahi’s dawn attack on the Shewan camp failed; about 1,000 Harari fighters were killed.
        lonlat: [41.561, 9.398]
        lp: l
      - kind: taken
        side: sh
        name: Harar
        date: January 1887
        text: Entered by Menelik after Chelenqo. Makonnen became governor.
        lonlat: [42.12, 9.31]
