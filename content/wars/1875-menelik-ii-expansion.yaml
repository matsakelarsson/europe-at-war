id: menelik-ii-expansion
name: Expansion of Shewa and Ethiopia under Menelik II
start: "1875"
end: "1900"
tier: A
summary: "The wars by which Menelik, king of Shewa from 1865 and emperor of Ethiopia from 1889, brought the lands to the south, west and east of the old Christian highlands under his rule, greatly enlarging the empire and giving Ethiopia most of its present borders. With firearms bought through the Red Sea ports and generals such as Ras Gobana Dacche, Ras Darge, Ras Makonnen and Ras Wolde Giyorgis, his armies took or forced the submission of southern Wollo, the Gurage, the Oromo kingdoms of the Gibe and the Leqa states of Wollega (1875–1886), defeated the king of Gojjam at Embabo (1882), conquered the Arsi Oromo after six campaigns (1881–1886) and the emirate of Harar at Chelenqo (1887), and then, through the great famine of 1888–1892, Bale, Sidamo and Wolaita (1891–1894) and, after the victory over Italy at Adwa, Kaffa (1897), Bela Shangul and the borderlands down to Lake Turkana and the Ogaden. Some peoples submitted by agreement and kept their rulers, as Jimma did; others resisted and suffered heavy losses, enslavement and the loss of their land to soldier-settlers under the gebbar system. Ethiopian national history has long presented the expansion as the building, or the reunification, of the modern state; many Oromo and other southern historians describe it as a colonial conquest comparable to the European conquests of the same years."
countries: [et]
