id: perak-war
name: Perak War
start: "1875-11-02"
end: "1876-07"
tier: B
summary: "A brief war in the Malay state of Perak that followed the killing of the first British Resident, J. W. W. Birch, at Pasir Salak on 2 November 1875. Under the Pangkor Engagement of January 1874, the British had recognised Raja Abdullah as sultan over his rival Raja Ismail, and Abdullah had accepted a Resident whose advice he was bound to follow except in matters of religion and Malay custom. Birch’s attempts to take over the collection of taxes, to free debt-bondsmen and to rule through proclamations angered the sultan and the chiefs, who agreed in July 1875 that he should be removed; followers of the Maharaja Lela speared him in his bath-house on the Perak River. The British brought troops from the Straits, India and Hong Kong, took Pasir Salak on 15 November 1875 after a first attack had failed, and broke the resistance along the Perak River in the following months. The Maharaja Lela surrendered in July 1876 and was hanged at Matang with the Dato’ Sagor on 20 January 1877; Sultan Abdullah, the Mantri of Larut and other chiefs were exiled to the Seychelles. Perak remained under a British Resident, and the war fixed the pattern of British rule through Residents in the Malay states."
countries: [my]
