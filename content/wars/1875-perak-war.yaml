steps:
  - title: Pangkor and the killing of Birch
    date: January 1874 – November 1875
    when: "1875-11-02"
    borders: "1875-11-01"
    countries: [my]
    body:
      - In the early 1870s Perak was torn by a succession dispute between Raja Abdullah and Raja Ismail, and by the Larut Wars, in which rival Chinese societies fought over the tin mines of Larut, ruled by the Mantri, Ngah Ibrahim. The new governor of the Straits Settlements, Sir Andrew Clarke, called the chiefs to Pangkor, and in the Pangkor Engagement of 20 January 1874 he recognised Abdullah as sultan in return for his acceptance of a British Resident, whose advice was to be asked and acted on in all matters except Malay religion and custom. Ismail, who held the royal regalia, and the chiefs who supported him did not accept it.
      - James Wheeler Woodford Birch, the Colonial Secretary of the Straits Settlements, became Resident in November 1874. He set out to collect taxes through the government instead of the chiefs, opposed debt-bondage and slavery, and enforced his orders by burning houses and demanding the surrender of arms and bondsmen. Malay leaders complained of his interference with religion, custom and property. On 21 July 1875 Sultan Abdullah met his chiefs, and they accepted the Maharaja Lela’s offer to have the Resident killed.
      - On 2 November 1875 Birch came to Pasir Salak, the Maharaja Lela’s village on the Perak River, to post proclamations announcing that British officers would govern in the sultan’s name. Followers of the Maharaja Lela, among them Seputum, speared him in the bath-house of his boat.
    facts:
      - [Pangkor Engagement, "20 January 1874"]
      - [Birch Resident, "from November 1874"]
      - [Birch killed, "2 November 1875"]
