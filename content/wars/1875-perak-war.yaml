notes:
  - Malaysian historians see the killing of Birch and the war that followed as a defence of Malay rule and custom against colonial control, and the Maharaja Lela is honoured as a fighter against it; others, such as Cheah Boon Kheng, stress that the plot also grew out of the rivalries among Perak’s chiefs and claimants to the throne. Some Perak chiefs, and Raja Yusuf, who became regent in 1877, sided with the British.
