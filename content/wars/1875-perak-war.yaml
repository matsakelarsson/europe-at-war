  - title: The Perak expedition
    date: November 1875 – January 1877
    when: "1875-11-15"
    borders: "1875-11-15"
    countries: [my]
    body:
      - Frank Swettenham, Birch’s assistant, made his way back to the Residency, and the British gathered what troops they could. On 7 November about 110 soldiers and police attacked towards Pasir Salak, burned Bandar Tua and were thrown back, losing Captain Innes and two other men. Governor William Jervois arrived with more troops, and on 15 November a larger force took the stockades of Pasir Salak, which were razed. Troops from India and Hong Kong and a naval brigade followed, more than 1,200 men in all, under Major General Francis Colborne; at the same time British and Gurkha troops fought in Sungai Ujong, where Captain George Channer stormed the stockade at Bukit Putus in December 1875.
      - The British columns moved up the Perak River against the chiefs and villages that had backed Ismail and the Maharaja Lela, and on 4 January 1876 one was ambushed at Kota Lama Kanan near Kuala Kangsar. Resistance faded in the following months. Raja Ismail gave himself up and was sent to live in Johor in March 1876, and the Maharaja Lela surrendered in July. After a trial at Matang from 14 to 22 December 1876, before two Malay judges with two British assessors, the Maharaja Lela, the Dato’ Sagor and a third man were hanged on 20 January 1877. Sultan Abdullah was exiled to the Seychelles with the Mantri of Larut, the Laksamana and the Shahbandar, Raja Yusuf became regent, and Hugh Low, the next Resident, governed Perak by working with the chiefs rather than against them.
    facts:
      - [Failed attack, "7 November 1875"]
      - [Pasir Salak taken, "15 November 1875"]
      - [Maharaja Lela hanged, "20 January 1877, Matang"]
