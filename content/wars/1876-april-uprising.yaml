id: april-uprising
name: April Uprising
start: "1876-05-02"
end: "1876-06"
tier: B
summary: A Bulgarian rising against Ottoman rule in the spring of 1876, organised by the Bulgarian Revolutionary Central Committee and centred on the Sredna Gora and the western Rhodopes. It was crushed within weeks, largely by bashi-bazouk irregulars, with massacres at Batak, Perushtitsa, Panagyurishte and elsewhere; reports of the “Bulgarian horrors” turned European opinion against the Ottomans and prepared the way for the Russo-Turkish War of 1877–1878 and a Bulgarian state.
countries: [bg, mk, ro, tr]
sides:
  - id: bg
    name: Bulgarian revolutionaries
    polities: [bulgarian-revolutionaries]
    ink: green
    moves: Bulgarian moves
    success: Bulgarian success
  - id: ot
    name: Ottoman Empire and bashi-bazouk irregulars
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Dates are New Style (Gregorian). Bulgarians used the Julian calendar, then 12 days behind, and Bulgaria commemorates the rising on 20 April, the Old Style date of its outbreak at Koprivshtitsa (2 May New Style).
  - The number of dead is disputed. Contemporary investigators put the Bulgarian dead at 12,000 (Walter Baring) to 15,000 (Eugene Schuyler), and the French and Russian consuls at 25,000–40,000; some later historians, notably Justin McCarthy and Stanford Shaw, give much lower figures and stress Muslim victims, which the contemporary reports put at a few hundred.
