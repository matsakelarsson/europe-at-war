steps:
  - title: Koprivshtitsa, Batak and Botev
    date: April – June 1876
    when: "1876-05-02"
    borders: "1876-06-01"
    countries: [bg, mk, ro, tr]
    body:
      - In November 1875 the Bulgarian Revolutionary Central Committee, meeting in exile at Giurgiu in Romania, planned a general rising for the spring and divided the country into revolutionary districts. Arms were hoarded, and in the Sredna Gora the rebels even made a cannon out of cherry wood. A delegate betrayed the plan after a meeting at Oborishte, and Ottoman police tried to arrest the leaders in Koprivshtitsa. On 2 May 1876 Todor Kableshkov’s men attacked the police post there and proclaimed the rising, two weeks early. It spread across the Sredna Gora and the western Rhodopes, with smaller risings around Gabrovo, Tryavna and Sliven and near Berovo in Macedonia.
      - Rather than send regular troops, the authorities largely armed bashi-bazouk irregulars, among them Pomaks and Circassians, who put down the rising by the middle of May with massacres. Panagyurishte, Perushtitsa, Klisura and Batak were sacked; at Batak alone some 5,000 people are thought to have been killed. Bratsigovo, which fought regular troops, suffered far fewer deaths. On 29 May the poet Hristo Botev landed from a Danube steamer at Kozloduy with about 200 émigrés from Romania; his band was scattered in the Vratsa Balkan, and he was killed on 1 June.
      - The Americans Eugene Schuyler and Januarius MacGahan reported the killings, and a British inquiry by Walter Baring largely confirmed them. William Gladstone’s pamphlet Bulgarian Horrors and the Question of the East, published in September 1876, roused British opinion, and the British government, Russia’s rival, could no longer support the Ottomans as before. When the Constantinople Conference of the powers failed to impose reforms early in 1877, Russia went to war, and in 1878 an autonomous Bulgarian principality was created.
    facts:
      - [Rising proclaimed at Koprivshtitsa, "2 May 1876 (20 April Old Style)"]
      - [Batak massacre, "May 1876, about 5,000 killed (estimate)"]
      - [Hristo Botev killed, "1 June 1876"]
    markers:
      - kind: event
        side: bg
        name: Giurgiu
        date: November 1875
        text: Bulgarian revolutionaries in Romania met here, across the Danube from Ruse, and decided on a rising for the spring of 1876.
        lonlat: [25.974, 43.901]
      - kind: event
        side: bg
        name: Oborishte
        date: April 1876
        text: Delegates of the fourth revolutionary district met in the forest here to prepare the rising; one of them betrayed it to the authorities.
        lonlat: [24.067, 42.517]
        lp: l
      - kind: event
        side: bg
        name: Koprivshtitsa
        date: 2 May 1876
        text: Todor Kableshkov’s rebels attacked the Ottoman konak and proclaimed the rising in a letter to Panagyurishte signed with the blood of the killed local governor, the “Bloody Letter”.
        lonlat: [24.35, 42.633]
      - kind: taken
        side: ot
        name: Panagyurishte
        date: May 1876
        text: Centre of the rising, taken and burned by Ottoman troops and bashi-bazouks; some 3,000 people were killed by Schuyler’s estimate.
        lonlat: [24.183, 42.5]
        lp: b
      - kind: event
        name: Batak
        date: May 1876
        text: After the defenders gave up their arms on Ahmed Aga’s promise to withdraw, his bashi-bazouks killed most of the townspeople, many of them in the church of Sveta Nedelya.
        lonlat: [24.217, 41.95]
      - kind: taken
        side: ot
        name: Perushtitsa
        date: May 1876
        text: The last defenders held out in the church before it was taken; about 1,000 people were killed by Schuyler’s estimate.
        lonlat: [24.55, 42.05]
      - kind: siege
        side: ot
        name: Bratsigovo
        date: May 1876
        text: One of the best-prepared centres, it held out for days against regular troops. Its leader, Vasil Petleshkov, took all the blame for the rising on himself.
        lonlat: [24.367, 42.017]
        lp: l
      - kind: event
        side: bg
        name: Kozloduy
        date: 29 May 1876
        text: Botev’s band seized the Austrian steamer Radetzky on the Danube and made its captain land them on the Bulgarian bank.
        lonlat: [23.733, 43.783]
      - kind: battle
        side: ot
        name: Vratsa Balkan
        date: 1 June 1876
        text: After fighting Ottoman troops and Circassians, Botev was shot dead in the mountains near Vratsa, at Okolchitsa or the nearby Vola peak, and his band dispersed.
        lonlat: [23.584, 43.151]
