  - title: The Little Bighorn
    date: 25–26 June 1876
    when: "1876-06-25"
    borders: "1876-06-25"
    countries: [us]
    view:
      center: [-107.40, 45.53]
      size: [60, 50]
    body:
      - "Terry and Gibbon met on the Yellowstone and sent Custer with the 7th Cavalry, about 600 men with Arikara and Crow scouts, up the Rosebud to find the trail and come on the camp from the south, while they marched up the Bighorn to block it from the north. Custer followed the trail across the divide, and at dawn on 25 June his scouts saw the camp’s vast pony herd from a lookout called the Crow’s Nest. Fearing that the camp would scatter, he attacked that day. The camp on the Little Bighorn, which the Lakota call the Greasy Grass, held perhaps 6,000 to 8,000 Lakota, Cheyenne and some Arapaho, with perhaps 900 to 2,500 fighting men by different estimates."
      - "Custer divided his regiment. Captain Frederick Benteen took three companies to scout to the south, and Major Marcus Reno crossed the river with three companies and charged the south end of the camp, the Hunkpapa circle. Warriors poured out against him; Reno dismounted, fell back into the timber, where his Arikara scout Bloody Knife was shot beside him, and then fled in disorder back across the river to the bluffs, losing about a third of his men. Benteen and the pack train joined him there, on what is now Reno Hill."
      - "Custer with five companies, about 210 men, rode north along the bluffs and down Medicine Tail Coulee towards the river. Warriors led by Gall, Crazy Horse, the Cheyenne Two Moons and Lame White Man and many others crossed the river against him and up the ravines, and within perhaps an hour all of Custer’s battalion were killed on the ridges, the last on the hill now called Last Stand Hill. Custer, two of his brothers, a nephew and a brother-in-law died with them."
      - "The warriors besieged Reno and Benteen on the hill through the next day. On the evening of 26 June, as Terry and Gibbon approached, the camp moved away towards the Bighorn Mountains. The 7th Cavalry lost 268 dead, among them scouts and civilians, and 55 badly wounded. Native dead are estimated at between about 31 and more than 100; Lame White Man was among them. News of the defeat reached the East in the first days of July, during the celebrations of the nation’s centennial."
    facts:
      - [Battle of the Little Bighorn (Greasy Grass), "25–26 June 1876, Lakota, Cheyenne and Arapaho victory"]
      - [US dead, "268, with 55 badly wounded"]
      - [Native dead, "estimated at about 31 to more than 100"]
