id: great-sioux-war
name: Great Sioux War of 1876
start: "1876-02-08"
end: "1877-05-07"
tier: A
summary: "The war of 1876–1877 in which the United States took the Black Hills from the Lakota and forced the free bands of the Lakota and Northern Cheyenne onto reservations. The Treaty of Fort Laramie of 1868 had given the Lakota the Great Sioux Reservation, including the Black Hills (Paha Sapa), which are sacred to them, and left the Powder River country beyond it as unceded Indian territory. After George Armstrong Custer’s expedition of 1874 found gold in the Black Hills, thousands of miners poured in, the Lakota refused to sell, and President Grant’s government ordered all Lakota to come in to the agencies by 31 January 1876 and turned those who did not over to the army. Bands following Sitting Bull and Crazy Horse, joined by many from the agencies, gathered in the largest camp the northern plains had known. Three army columns converged on them; the Lakota and Cheyenne fought George Crook’s column to a standstill on the Rosebud on 17 June 1876, and on 25 June at the Little Bighorn they destroyed Custer and five companies of the 7th Cavalry, killing 268 soldiers, scouts and civilians in all. The army, heavily reinforced, then campaigned through the winter, destroying villages and food at Slim Buttes, the Red Fork of the Powder River and elsewhere, while Congress cut off the agencies’ rations until the Lakota gave up the Black Hills, which it annexed on 28 February 1877. Crazy Horse surrendered in May 1877 and was killed at Camp Robinson in September; Sitting Bull led his people to Canada and surrendered in 1881. In 1980 the Supreme Court ruled that the Black Hills had been taken illegally; the Lakota have refused the compensation and ask for the land."
countries: [us, ca]
sides:
  - id: lak
    name: Lakota, Northern Cheyenne and Arapaho (Sitting Bull, Crazy Horse, Gall, Two Moons, Lame White Man, Dull Knife)
    polities: [lakota, cheyenne, arapaho]
    ink: brown
    moves: Lakota and Cheyenne moves
    success: Lakota and Cheyenne success
  - id: us
    name: United States (US Army, with Arikara and other Native scouts)
    polities: [united-states]
    ink: blue
    moves: US moves
    success: US success
  - id: cs
