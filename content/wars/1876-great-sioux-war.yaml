    polities: [crow, shoshone]
    ink: slate
    moves: Crow and Shoshone moves
    success: Crow and Shoshone success
notes:
  - "By 1876 about two-thirds of the Lakota lived at the agencies and did not fight; the war was fought by the bands that kept to the buffalo country and by young men who joined them from the agencies each summer. The Little Bighorn and much of the fighting took place in the Powder River and Yellowstone country, which the 1851 treaty had recognised as Crow land and the 1868 treaty as the Crow reservation; the Crow and Shoshone, old enemies of the Lakota, fought beside the army."
  - "Numbers are uncertain. Estimates of the camp at the Little Bighorn range from about 6,000 to 8,000 people with 900 to 2,500 fighting men, and of Native deaths there from about 31 to more than 100. Much of what is known of the Native side comes from accounts given later by participants such as Wooden Leg, Two Moons, Red Horse, Black Elk and Kate Bighead."
