  - title: The army’s summer and the Black Hills taken
    date: July – October 1876
    when: "1876-09-09"
    borders: "1876-10-21"
    countries: [us]
    body:
      - "After the battle the great camp broke up into smaller bands to hunt. Congress sent reinforcements, and the army took control of the agencies. On 17 July the 5th Cavalry under Colonel Wesley Merritt turned back a party of Cheyenne leaving the Red Cloud Agency at Warbonnet Creek, where the scout William “Buffalo Bill” Cody killed the Cheyenne Yellow Hair. Crook and Terry, joined in August, followed the bands’ trails without catching them, and Crook’s men, out of rations in heavy rain, ate their horses on the march towards the Black Hills. On 9 September an advance party under Captain Anson Mills attacked American Horse’s Miniconjou village at Slim Buttes; American Horse was mortally wounded, and a counter-attack led by Crazy Horse was beaten off."
      - "On 15 August Congress voted that the Lakota would receive no more rations until they gave up the Black Hills and the unceded territory, a law the Lakota call “sell or starve”. A commission under George Manypenny took the terms to the agencies in September and October and obtained the signatures of leaders including Red Cloud and Spotted Tail, but of only about a tenth of the men, far short of the three-quarters of adult men the 1868 treaty required for any cession. In October troops under Ranald Mackenzie surrounded the camps of Red Cloud and Red Leaf and took their horses and guns."
      - "Colonel Nelson Miles built a winter post at the mouth of the Tongue River on the Yellowstone. On 20–21 October he met Sitting Bull between the lines on Cedar Creek; the talks broke down and fighting followed, after which some 2,000 Miniconjou and Sans Arc agreed to go in to the agencies, while Sitting Bull moved north. On 28 February 1877 Congress passed the act that took the Black Hills and the unceded territory from the Lakota."
    facts:
      - [Battle of Warbonnet Creek, "17 July 1876"]
      - [Battle of Slim Buttes, "9–10 September 1876"]
      - [“Sell or starve” rider, "15 August 1876"]
      - [Black Hills annexed, "28 February 1877"]
