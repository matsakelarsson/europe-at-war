  - title: Three columns and the Rosebud
    date: April – June 1876
    when: "1876-06-17"
    borders: "1876-06-17"
    countries: [us]
    body:
      - "Sheridan’s spring plan sent three columns to converge on the free bands: Colonel John Gibbon’s Montana column down the Yellowstone from Fort Ellis, General Alfred Terry’s Dakota column, with Custer’s 7th Cavalry, west from Fort Abraham Lincoln from 17 May, and Crook’s Wyoming column, about 1,000 soldiers, north again from Fort Fetterman at the end of May. About 260 Crow and Shoshone warriors, the Shoshone under their leader Washakie, joined Crook to fight their old Lakota enemies."
      - "Through the spring the free bands moved together, and hundreds of families came out from the agencies to join them. In early June, at a sun dance on the Rosebud, Sitting Bull offered a hundred pieces of his flesh and saw in a vision many soldiers falling upside down into the camp, which was taken as a promise of victory."
      - "On 17 June Crazy Horse and other leaders led perhaps 750 to 1,800 Lakota and Cheyenne warriors (estimates vary widely) against Crook’s column on the Rosebud. In six hours of moving fights across the hills, in which the Crow and Shoshone saved the soldiers from being overrun more than once, neither side broke. The Cheyenne remember it as the fight where the girl saved her brother: Buffalo Calf Road Woman rode in to rescue her unhorsed brother, Comes in Sight. Crook claimed a victory, but he fell back to his base on Goose Creek and waited there for reinforcements for seven weeks, out of the campaign."
    facts:
      - [Crow and Shoshone with Crook, "about 260 warriors"]
      - [Battle of the Rosebud, "17 June 1876, Lakota and Cheyenne checked Crook"]
