  - title: Powder River
    date: March 1876
    when: "1876-03-17"
    borders: "1876-03-17"
    countries: [us]
    body:
      - "General George Crook left Fort Fetterman on 1 March 1876 with about 900 men and marched north in bitter cold along the old Bozeman Trail. On 17 March Colonel Joseph Reynolds, with six companies of cavalry, attacked a village on the Powder River at dawn, believing it to be Crazy Horse’s; the army counted about 104 lodges, Cheyenne accounts some 40 to 65 tipis and other shelters. It was a camp of Northern Cheyenne under Old Bear and a few Oglala under He Dog, many of whom had been on their way to the agencies."
      - "The soldiers drove the people from the village, burned the lodges with their food and robes and took several hundred ponies, but the warriors kept up a fire from the bluffs, Reynolds withdrew in haste, leaving dead and a wounded man behind, and that night the Cheyenne took back most of their herd. Crook, short of supplies, returned to Fort Fetterman and had Reynolds court-martialled. The Cheyenne, without shelter in the snow, made their way to Crazy Horse’s camp and then with him to Sitting Bull’s, and the attack drew the free bands together."
    facts:
      - [Battle of Powder River, "17 March 1876"]
      - [Village attacked, "Northern Cheyenne and Oglala, 40 to 104 lodges by different counts"]
