steps:
  - title: Gold in the Black Hills
    date: 1874 – January 1876
    when: "1875-11-03"
    borders: "1876-01-31"
    countries: [us]
    body:
      - "The Treaty of Fort Laramie of 1868, which ended Red Cloud’s War, set apart the Great Sioux Reservation, all of today’s South Dakota west of the Missouri, for the Lakota’s “absolute and undisturbed use and occupation”, and closed the Powder River country to whites. At its heart lay the Black Hills, Paha Sapa, a sacred place and a source of lodge poles and game. Most Lakota came to live at agencies on the reservation, among them those of Red Cloud and Spotted Tail, but non-treaty bands, led above all by the Hunkpapa Sitting Bull (Tatanka Iyotake) and the Oglala Crazy Horse (Tasunke Witko), kept to the buffalo country of the Powder, Tongue and Yellowstone with their Northern Cheyenne allies, and fought survey parties of the Northern Pacific Railroad in 1872 and 1873."
      - "In the summer of 1874 Lieutenant Colonel George Armstrong Custer led about 1,000 men, most of them of the 7th Cavalry, from Fort Abraham Lincoln into the Black Hills, and miners with the expedition found gold on French Creek. Newspapers spread the news, and despite the treaty prospectors poured in; by 1876 thousands were digging in the hills, at Custer City and in Deadwood Gulch. In September 1875 the Allison Commission offered to buy the hills for $6 million or lease them for $400,000 a year, and the Lakota refused; many would not hear of any sale."
      - "On 3 November 1875, at a meeting in the White House, President Ulysses S. Grant decided that the army would no longer keep miners out of the Black Hills and that the free bands would be forced onto the reservation. In December the Indian Office ordered all Lakota to report to the agencies by 31 January 1876, in the depth of winter, when the bands could hardly have moved if they had wished to. On 1 February the matter was handed to the army, and on 8 February General Philip Sheridan ordered his generals to begin a winter campaign."
    facts:
      - [Black Hills Expedition, "July–August 1874"]
      - [Allison Commission, "September 1875"]
      - [Deadline to report to the agencies, "31 January 1876"]
