  - title: The winter war and the surrenders
    date: November 1876 – September 1877
    when: "1876-11-25"
    borders: "1877-05-07"
    countries: [us, ca]
    body:
      - "Mackenzie’s Powder River Expedition, about 1,100 soldiers with some 350 to 400 Pawnee, Shoshone, Arapaho, Lakota and Cheyenne scouts, found the Northern Cheyenne village of Dull Knife (Morning Star) and Little Wolf in a canyon of the Red Fork of the Powder River and attacked at dawn on 25 November. About 40 Cheyenne were killed, the soldiers burned some 200 lodges with all their food and robes, and the people fled into temperatures far below freezing, in which several infants froze to death, to seek shelter with Crazy Horse. On 8 January 1877 Miles’s infantry, with artillery, fought Crazy Horse in a snowstorm at Wolf Mountain on the Tongue River."
      - "Through the winter and spring, envoys from the agencies, among them Spotted Tail and the Oglala George Sword, carried offers of peace to the hungry bands, and band after band came in. Dull Knife’s Cheyenne surrendered at Camp Robinson in April and were sent to Indian Territory, from which some of them fled north in 1878. In May 1877 Crazy Horse came in to Camp Robinson with some 900 people, and on 7 May Miles destroyed the Miniconjou camp of Lame Deer, who was killed, in the last large fight of the war. On 5 September 1877 Crazy Horse was fatally stabbed with a bayonet at Camp Robinson as soldiers and agency police tried to imprison him."
      - "In May 1877 Sitting Bull led his people across the border into Canada, which the Lakota called the Grandmother’s Land, and camped near Wood Mountain under the eye of the North-West Mounted Police. Canada refused them a reserve, and as the buffalo vanished his followers drifted back; Sitting Bull surrendered at Fort Buford on 19 July 1881. In 1980, in United States v. Sioux Nation of Indians, the Supreme Court held that the Black Hills had been taken illegally and awarded compensation with interest; the Lakota nations have refused the money, which by 2018 had grown to more than a billion dollars, and continue to seek the return of the land."
    facts:
      - [Dull Knife Fight, "25 November 1876"]
      - [Battle of Wolf Mountain, "8 January 1877"]
      - [Crazy Horse’s surrender, "May 1877, at Camp Robinson"]
      - [Sitting Bull’s surrender, "19 July 1881, at Fort Buford"]
