steps:
  - title: Vučji Do, Nikšić and the coast
    date: June 1876 – July 1878
    when: "1876-06-30"
    borders: "1878-07-13"
    countries: [me, ba, al, tr]
    body:
      - Montenegro had armed the Herzegovinian rebels since 1875, and at the end of June 1876 it declared war together with Serbia. Prince Nicholas’s army of mountain clans, joined by Herzegovinian insurgents, won its greatest victory in late July at Vučji Do near Nikšić, where an Ottoman army under Ahmed Muhtar Pasha was routed; Selim Pasha was killed and Osman Pasha taken prisoner. On 2 August Marko Miljanov and Ilija Plamenac threw back a larger force from Scutari at Fundina in the Kuči lands. When Serbia was beaten, Montenegro too accepted the armistice of November 1876, but no peace followed.
      - In June 1877, as Russia went to war, an Ottoman army under Suleiman Pasha fought its way through the Duga pass to relieve Nikšić and then across Montenegro down the Zeta valley, before being shipped to Bulgaria to face the Russians. Nicholas then besieged Nikšić, which surrendered on 8 September after 47 days, and in January 1878 his troops took Bar and Ulcinj on the coast and the forts on Lake Scutari. Many Albanian and Slav Muslim inhabitants left or were driven from Podgorica, Spuž and other places. At Berlin Montenegro won independence, Nikšić, Podgorica, Kolašin and Bar; Ulcinj followed in 1880.
    facts:
      - [Battle of Vučji Do, "July 1876, Montenegrin victory"]
      - [Nikšić taken, "8 September 1877"]
      - [Independence recognised, "Congress of Berlin, 13 July 1878"]
