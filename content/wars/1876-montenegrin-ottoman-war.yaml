id: montenegrin-ottoman-war
name: Montenegrin–Ottoman War of 1876–1878
start: "1876-06-30"
end: "1878-01-31"
tier: B
summary: A war in which the Principality of Montenegro, allied with Serbia and the Herzegovinian rebels and later fighting alongside Russia, beat Ottoman armies at Vučji Do and Fundina in 1876, took Nikšić in 1877 and Bar and Ulcinj on the coast in 1878. Known in Montenegro as the Great War, it ended with Montenegro’s independence recognised at the Congress of Berlin and its territory roughly doubled, with an outlet to the Adriatic.
countries: [me, ba, al, tr]
sides:
