    name: Montenegro and the Herzegovinian insurgents
    polities: [montenegro, herzegovinian-insurgents]
    ink: red
    moves: Montenegrin moves
    success: Montenegrin success
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Dates are New Style (Gregorian). Montenegro used the Julian calendar, then 12 days behind, so Montenegrin accounts date the fall of Nikšić 27 August 1877. Several battle dates appear in either style in the literature, and some are given here only by month.
  - The Herzegovina Uprising, the Serbian–Ottoman Wars and the Russo-Turkish War of 1877–1878 have their own entries.
