        name: Battle of Fundina
        date: 2 August 1876
        text: Warned of the Ottoman plan, about 4,000 Montenegrins under Marko Miljanov and Ilija Plamenac beat back Mahmud Pasha’s attack from Scutari.
        lonlat: [19.365, 42.451]
      - kind: battle
        side: ot
        name: Zeta valley
        date: June 1877
        text: Suleiman Pasha’s army forced its way down the valley past Ostrog in costly fighting to join the Ottoman forces at Podgorica.
        lonlat: [19.05, 42.61]
        lp: l
      - kind: taken
        side: me
        name: Nikšić
        date: 8 September 1877
        text: The Ottoman garrison surrendered after a 47-day siege by Montenegrin troops under Mašo Vrbica.
        lonlat: [18.95, 42.778]
      - kind: taken
        side: me
        name: Bar
        date: January 1878
        text: The old town surrendered after a siege, giving Montenegro its first port.
