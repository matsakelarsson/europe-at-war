steps:
  - title: Ürümqi and Manas
    date: April – November 1876
    when: "1876-08-13"
    borders: "1876-08-18"
    countries: [cn]
    body:
      - In 1874–1875 the Qing court debated whether, after Japan’s expedition to Taiwan, it should spend its scarce funds on a navy, as Li Hongzhang urged, or on recovering Xinjiang, as Zuo Zongtang argued. Zuo won, and in 1875 he was given command. He spent a year bringing grain, camels and munitions some 1,300 km along the Gansu corridor and borrowed millions of taels from foreign banks. In 1876 his commanders Liu Jintang and Jin Shun crossed the desert from Hami and Barkol to Gucheng (Qitai), north of the Tian Shan, with tens of thousands of troops.
      - On 13 August 1876 Liu Jintang stormed the fort of Gumadi north of Ürümqi, held by Hui troops of Bai Yanhu and others; thousands of its defenders were killed. Ürümqi was taken a few days later without a fight. Manas, the strongest Hui town in the north, was besieged from early September and surrendered on 6 November; its garrison was killed as it marched out. Yakub Beg, who had expected the Qing to stop at Ürümqi, fortified the passes to Turfan.
