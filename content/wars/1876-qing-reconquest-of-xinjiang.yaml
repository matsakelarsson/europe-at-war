    name: Qing China
    polities: [qing]
    ink: gold
    moves: Qing moves
    success: Qing success
  - id: yb
    name: Yakub Beg’s Kashgaria (Yettishar) and the Hui of Bai Yanhu
    polities: [yettishar, hui-rebels]
    ink: magenta
    moves: Moves of Yakub Beg’s and Bai Yanhu’s forces
    success: Success of Yakub Beg’s and Bai Yanhu’s forces
notes:
  - Zuo Zongtang’s army included Hui units led by commanders who had earlier fought against the Qing in Shaanxi and Gansu, among them Ma Anliang, Cui Wei and Hua Dacai. The Shaanxi Hui leader Bai Yanhu, who had fled to Xinjiang in 1873, fought on Yakub Beg’s side and escaped into Russian territory at the end.
  - Yakub Beg’s death in May 1877 was variously ascribed by contemporaries to a stroke, to poison or to murder; historians still disagree.
