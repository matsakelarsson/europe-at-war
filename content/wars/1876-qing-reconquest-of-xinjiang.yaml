  - title: The Tarim Basin
    date: October 1877 – January 1878
    when: "1877-10"
    borders: "1878-01-02"
    countries: [cn, kg]
    body:
      - The Qing advance resumed in the autumn. Karashahr and Korla were taken in early October 1877 although the defenders had flooded the land by damming the Kaidu river. Bai Yanhu retreated west, burning crops and driving the population of the towns with him; Jin Shun’s cavalry caught up with the column near Bugur, scattered the soldiers and freed the people. Kucha and Aksu were taken in October and Ush soon after, and the troops of Liu Jintang and Dong Fuxiang pressed on towards Kashgar.
      - Kashgar fell on 17 December 1877, Yarkand a few days later and Khotan on 2 January 1878. Beg Kuli Beg and Bai Yanhu escaped with their followers over the mountains into the Russian Empire, where Russia refused to hand them over. The Qing executed many of Yakub Beg’s officials, and his body was exhumed and burned. Zuo’s campaign had restored Qing rule everywhere in Xinjiang except the Ili valley, which Russia gave up only by the Treaty of Saint Petersburg in 1881. In 1884 Xinjiang was made a province, with Liu Jintang as its first governor.
    facts:
      - [Karashahr and Korla taken, "early October 1877"]
      - [Kashgar taken, "17 December 1877"]
      - [Khotan taken, "2 January 1878"]
      - [Xinjiang province created, "1884"]
