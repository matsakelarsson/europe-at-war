  - title: Turfan and the death of Yakub Beg
    date: April – May 1877
    when: "1877-04-16"
    borders: "1877-05-30"
    countries: [cn]
    body:
      - In April 1877 the Qing attacked on two fronts. Liu Jintang took the pass fort of Dabancheng, on the road from Ürümqi to Turfan, between 16 and 20 April, while Zhang Yao advanced from Hami and took Pichan. On 26 April the two armies took Turfan and Toksun. Many of Yakub Beg’s soldiers deserted or surrendered; some of the captured were released and sent back to spread word of the Qing advance.
      - Yakub Beg fell back to Korla, where he died suddenly at the end of May 1877. His sons and commanders fought one another for the succession; his son Beg Kuli Beg made himself master of Kashgar, while other towns of the oases changed sides or declared for local rulers. The Qing armies halted for the summer heat and to bring up supplies.
    facts:
