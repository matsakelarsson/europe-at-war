id: qing-reconquest-of-xinjiang
name: Qing reconquest of Xinjiang
start: "1876-04"
end: "1878-01-02"
tier: B
summary: "The campaign in which the Qing general Zuo Zongtang destroyed Yakub Beg’s state of Yettishar (Kashgaria) and restored Qing rule in Xinjiang, the last phase of the Dungan Revolt. After the court decided in 1875, against the advice of Li Hongzhang, to spend the money on the north-west rather than on coastal defence, Zuo’s armies, financed by foreign loans and armed with modern rifles and Krupp guns, took Ürümqi and Manas in 1876. In April 1877 they took Dabancheng, Turfan and Toksun, and in May Yakub Beg died at Korla. His state broke up in a struggle among his sons, and between October 1877 and January 1878 Liu Jintang’s troops advanced through Karashahr, Kucha and Aksu to Kashgar, Yarkand and Khotan. The Ili valley, occupied by Russia since 1871, was recovered by treaty in 1881, and Xinjiang became a province of the Qing empire in 1884."
countries: [cn]
sides:
