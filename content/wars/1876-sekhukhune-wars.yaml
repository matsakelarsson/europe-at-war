  - title: Wolseley storms Tsate
    date: November – December 1879
    when: "1879-11-28"
    borders: "1879-11-28"
    countries: [za, sz, gb]
    body:
      - After the defeat of the Zulu kingdom, Sir Garnet Wolseley, now high commissioner for south-eastern Africa, turned against the Pedi. In November 1879 he gathered about 2,000 British soldiers, colonial horse and African levies at Fort Burgers and called on the Swazi king Mbandzeni, who sent some 8,000 to 10,000 men. Sekhukhune refused a last ultimatum.
      - On 28 November 1879 the British advanced on Tsate along the valley while the Swazi attacked the Pedi positions on the mountain slopes above it. The town was taken and burned, and the Pedi made their last stand on a fortified hill in the valley, which the British called the Fighting Kopje; it was stormed after hours of fighting. About 1,000 Pedi were killed, among them Sekhukhune’s heir Morwamotše, and the Swazi lost several hundred men.
      - Sekhukhune escaped to a cave in the mountains, Mamatamageng, and was captured there on 2 December 1879. He was taken to Pretoria and imprisoned. The British broke up his kingdom among chiefs who accepted their rule. After the First Boer War the Pretoria Convention of 1881 provided for Sekhukhune’s release; he returned to his country and was murdered there by Mampuru on 13 August 1882. Mampuru was hanged in Pretoria in November 1883.
    facts:
