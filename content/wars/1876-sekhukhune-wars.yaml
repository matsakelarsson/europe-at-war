steps:
  - title: The Republic’s war
    date: May 1876 – February 1877
    when: "1876-05-16"
    borders: "1876-08-02"
    countries: [za, sz]
    body:
      - Sekhukhune became paramount of the Pedi in September 1861, on the death of his father Sekwati, and drove his half-brother and rival Mampuru into exile. From Tsate, on the eastern side of the Leolo mountains between the Olifants and Steelpoort rivers, he ruled a kingdom that the South African Republic claimed as part of its territory. The Boers of the Lydenburg district wanted Pedi land and labour; the Pedi refused to pay tax and bought guns with wages earned at the diamond fields. A quarrel came to a head when Sekhukhune’s half-brother Johannes Dinkwanyane, a Christian convert from the Botshabelo mission, settled with his followers on land the Boers claimed and refused the Republic’s authority.
      - On 16 May 1876 President Thomas Burgers declared war. His commandos marched with a Swazi army, which stormed Dinkwanyane’s stronghold in mid-July; Dinkwanyane was mortally wounded, and the Swazi killed many women and children there before going home, angered that the Boers had not supported their assault. On 2 August 1876 the commandos’ attack on Tsate failed, and many burghers left for home.
      - The Republic then built forts, among them Fort Burgers on the Steelpoort, and hired the Lydenburg Volunteer Corps of foreign adventurers under Conrad von Schlickmann, paid with promises of land and loot. Its raids and the killings of which Field-Cornet Abel Erasmus was accused drew protests from British officials; von Schlickmann was killed in a Pedi ambush on 17 November. With his cattle taken and his people hungry, Sekhukhune agreed to a peace at Botshabelo on 16 February 1877, but the war had emptied the Republic’s treasury and damaged its standing.
    facts:
      - [War declared, "16 May 1876"]
      - [Attack on Tsate fails, "2 August 1876"]
      - [Peace of Botshabelo, "16 February 1877"]
