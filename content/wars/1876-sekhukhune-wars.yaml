id: sekhukhune-wars
name: Sekhukhune wars
start: "1876-05-16"
end: "1879-12-02"
tier: B
summary: "The wars in which the Pedi kingdom of Sekhukhune, in the Leolo mountains of the eastern Transvaal, resisted first the South African Republic and then the British. The Pedi, ruled by the Maroteng dynasty from their capital Tsate, had rebuilt their power after the wars of the 1820s; many of their young men worked at the Kimberley diamond fields and came home with guns. Disputes over land, labour and tax led President Thomas Burgers to declare war in May 1876. The Republic’s commandos and their Swazi allies failed to take Tsate in August, and a war of forts and raids ended in an uneasy peace in February 1877. The Republic’s failure helped Britain justify its annexation of the Transvaal in April 1877, and the British in turn demanded Sekhukhune’s submission; their campaigns of 1878 also failed. After the Anglo-Zulu War, Sir Garnet Wolseley attacked with about 2,000 British and colonial troops and some 8,000 to 10,000 Swazi, and on 28 November 1879 Tsate was stormed with heavy loss of life. Sekhukhune was captured on 2 December and imprisoned in Pretoria; released after the Transvaal regained its independence in 1881, he was murdered by his rival Mampuru in 1882."
countries: [za, sz, gb]
