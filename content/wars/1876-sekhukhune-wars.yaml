  - title: British demands and the campaigns of 1878
    date: April 1877 – 1878
    when: "1878"
    borders: "1878-10-01"
    countries: [za, gb]
    body:
      - On 12 April 1877 Sir Theophilus Shepstone annexed the Transvaal for Britain, pointing among other reasons to the Republic’s failure against Sekhukhune as proof that it could not keep order. The new British administration demanded that Sekhukhune pay the fine of cattle agreed in 1877 and accept British authority. He refused, and in 1878 Pedi forces attacked chiefs who had sided with the government and raided towards Lydenburg.
      - British and colonial troops under Captain Clarke, and then a larger force under Colonel Hugh Rowlands, moved against the Pedi in 1878. Drought, horse-sickness and the strength of the Pedi positions defeated them; in October 1878 Rowlands came close to Tsate and withdrew. The coming war with the Zulu kingdom then drew the British troops away, and Sekhukhune remained independent for another year.
    facts:
      - [Annexation of the Transvaal, "12 April 1877"]
      - [Rowlands withdraws, "October 1878"]
