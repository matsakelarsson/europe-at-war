notes:
  - "Sources differ on numbers. About 1,000 Pedi are said to have been killed at Tsate in 1879, among them Sekhukhune’s heir Morwamotše; British losses among European troops were small, while the Swazi, who led the assault on the hills, lost several hundred men, by some accounts about 500."
  - Tsate is also written Tjate or Tshate; the site, below the hill of Thaba Mosego, is a provincial heritage site.
