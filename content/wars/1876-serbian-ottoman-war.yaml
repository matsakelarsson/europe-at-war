id: serbian-ottoman-war
name: Serbian–Ottoman Wars of 1876–1878
start: "1876-06-30"
end: "1878-02-05"
tier: B
summary: Two wars between the Principality of Serbia and the Ottoman Empire during the Great Eastern Crisis. In 1876 Serbia, with Montenegro, went to war in support of the rising in Bosnia and Herzegovina and was beaten at Đunis, saved only by a Russian ultimatum; in December 1877, as Russia was winning its own war, Serbia attacked again and took Niš, Pirot and Vranje, which it kept, with full independence, at the Congress of Berlin.
countries: [rs, tr, xk, ba, bg]
sides:
  - id: rs
    name: Serbia and its volunteers
    polities: [serbia]
    ink: red
    moves: Serbian moves
    success: Serbian success
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Dates are New Style (Gregorian). Serbia used the Julian calendar, then 12 days behind, so Serbian accounts date the declaration of war 18 June 1876 and the capture of Niš 29–30 December 1877. Some dates of the 1876 campaign appear in either style in the literature.
  - The Russo-Turkish War of 1877–1878, the Montenegrin–Ottoman War of 1876–1878 and the Herzegovina Uprising have their own entries.
