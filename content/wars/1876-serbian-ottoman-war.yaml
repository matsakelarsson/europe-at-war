        lonlat: [21.267, 43.15]
      - kind: taken
        side: rs
        name: Pirot
        date: 28 December 1877
        text: Taken by the Timok Corps. San Stefano gave it to Bulgaria, but the Congress of Berlin returned it to Serbia.
