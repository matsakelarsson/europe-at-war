steps:
  - title: Aleksinac and Đunis
    date: June 1876 – March 1877
    when: "1876-06-30"
    borders: "1876-11-01"
    countries: [rs, tr, ba, ru]
    body:
      - Serbia and Montenegro, which had armed and aided the rebels in Herzegovina and Bosnia, declared war on the Ottoman Empire on 30 June 1876, a month after Sultan Abdülaziz was deposed. Prince Milan’s main army, about 45,000 men with its volunteers, gathered at Aleksinac under the Russian general Mikhail Chernyayev, conqueror of Tashkent. It advanced down the Nišava valley towards Sofia, while smaller forces crossed the Drina towards Bijeljina and the Timok towards Vidin. The Serbian militia, poorly trained and armed with a mixture of old rifles, was driven back on every front within weeks.
      - From Vidin, Osman Pasha took Zaječar and Knjaževac in the Timok valley, where villages were burned and civilians killed. The main Ottoman army under Abdülkerim Pasha advanced from Niš up the Morava. A Serbian redoubt at Šumatovac near Aleksinac held on 23 August, but the Ottomans pushed along the river’s west bank; among the thousands of Russian volunteers, Colonel Nikolai Raevsky was killed at Adrovac. On 29 October they broke the line at Đunis, opening the road north. Russia gave the Porte a 48-hour ultimatum, an armistice followed on 1 November, and the peace of early 1877 restored the pre-war border.
    facts:
      - [Serbia declares war, "30 June 1876"]
      - [Battle of Đunis, "29 October 1876, Ottoman victory"]
      - [Peace of Constantinople, "February–March 1877, pre-war border"]
