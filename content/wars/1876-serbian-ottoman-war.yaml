        name: Niš
        date: 11 January 1878
        text: The fortress surrendered after a short siege. Much of the town’s Muslim population, mostly Albanian, left or was expelled, and most of its mosques were pulled down.
        lonlat: [21.896, 43.321]
      - kind: taken
        side: rs
        name: Vranje
        date: 31 January 1878
        text: The southernmost town Serbia kept at the peace.
        lonlat: [21.9, 42.55]
