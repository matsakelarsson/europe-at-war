  - title: Niš, Pirot and Vranje
    date: December 1877 – July 1878
    when: "1877-12-13"
    borders: "1878-07-13"
    countries: [rs, xk, bg, tr]
    body:
      - Serbia stayed out of the Russo-Turkish War until the Russians had nearly taken Plevna. With Russian money it rebuilt its army in five corps, nearly 90,000 men, and on 13 December 1877, three days after Plevna fell, it declared war again. Under Prince Milan, with General Kosta Protić in effective command, the main force struck south and surrounded Niš within days, while a column took Kuršumlija to cut the road from Kosovo, and Pirot fell on 28 December. Niš surrendered on 11 January 1878. A planned advance into the Sanjak of Novi Pazar was called off under Austro-Hungarian pressure.
      - Serbian troops took Vranje on 31 January and pushed on towards Preševo and Vitina in Kosovo and into the Bulgarian lands around Trn and Kyustendil before an armistice in early February. The Treaty of San Stefano gave Serbia Niš but assigned Pirot and Vranje to a large Bulgaria; at the Congress of Berlin Serbia won full independence and kept Niš, Pirot, Toplica and Vranje. Tens of thousands of Albanians and other Muslims fled or were driven out of these districts, between 49,000 and 130,000 by different estimates, many to Kosovo, where Serbs then suffered reprisals.
    facts:
      - [Serbia declares war, "13 December 1877"]
      - [Niš taken, "11 January 1878"]
      - [Independence recognised, "Congress of Berlin, 13 July 1878"]
