id: shizoku-revolts-of-1876
name: Shinpūren, Akizuki and Hagi rebellions
start: "1876-10-24"
end: "1876-12-03"
tier: C
summary: "Three linked risings of former samurai (shizoku) in western Japan in October and November 1876, provoked by the government’s ban on wearing swords (March 1876) and the forced conversion of samurai stipends into government bonds (August 1876). On the night of 24 October about 170–200 members of the Keishintō, a Shinto league of former Kumamoto samurai known as the Shinpūren (“league of the divine wind”) and led by the priest Otaguro Tomoo, attacked the army garrison and officials in Kumamoto with swords and spears, refusing firearms as foreign. They killed the prefectural governor Yasuoka Ryōsuke, the garrison commander Major General Taneda Masaaki and his chief of staff, and about 60 soldiers and officials, but the garrison rallied by morning; about 124 rebels were killed or took their own lives, Otaguro among them. On 27 October former samurai of Akizuki in Fukuoka Prefecture, led by Miyazaki Kurumanosuke and others, rose in answer to the Kumamoto call, killed police officers and marched out some 200–400 strong; they were scattered by the 14th Infantry Regiment of Kokura under Nogi Maresuke, Miyazaki and other leaders killed themselves, and two were beheaded on 3 December. On 28 October Maebara Issei, a former Chōshū leader and councillor of state, rose at Hagi with about 200 men. Government troops broke the rising within a week. Maebara, sailing for Tokyo, was caught on 5 November at the port of Uryū in Izumo, where bad weather had driven his boat, and on 3 December he and seven other leaders were beheaded. None of the three risings drew in the much larger body of discontented samurai in Satsuma, which rose three months later under Saigō Takamori."
