  - title: Kiriji and the peace
    date: 1879 – 1893
    when: "1882"
    borders: "1886-09-23"
    countries: [ng]
    body:
      - "In 1879 the allies returned and dug in on a hill near Imesi-Ile, and Ibadan set up its own camp on a facing hill near Igbajo, an hour’s walk away. Ogedengbe of Ilesha, a renowned war chief who had once fought for Ibadan, joined the alliance with his own army and took command. The Ekiti Parapo had long-range rifles that Ibadan could not match, and Ibadan built mud walls and trenches to shelter from them. Neither side could break the other, and for seven years the camps, with their farms, markets, smithies and shrines, became towns of tens of thousands of people."
      - In 1882 the war spread to Ife, where Ibadan backed its Oyo-Yoruba settlers of Modakeke against the town and the Ekiti Parapo and Ijebu came to Ife’s help. Ibadan suffered losses on every front, and in August 1885 Latosisa died in the camp at Igbajo. The war was financed largely by selling captives, and slave raiding spread across the region.
      - "The governor of Lagos, Alfred Moloney, worried by French ambitions inland and by the closed trade routes, sent two Yoruba clergymen, Samuel Johnson and Charles Phillips, between the camps. A treaty was signed in Lagos in June 1886, and on 23 September 1886 British commissioners proclaimed peace in the camps, where Ogedengbe and the Ibadan commander Osungbekun swore friendship. But Ilorin refused to make peace; its army took Offa in 1887, and the camps stayed in arms until 14 March 1893, when Captain Robert Bower, sent from Lagos after Governor Gilbert Carter’s treaties with the Yoruba states, had them dispersed. Later that year Ibadan accepted a British resident."
    facts:
      - [Death of Latosisa, "August 1885"]
      - [Peace proclaimed in the camps, "23 September 1886"]
      - [Camps dispersed, "14 March 1893"]
