id: kiriji-war
name: Kiriji War
start: "1877-07-31"
end: "1893-03-14"
tier: B
summary: "The last and longest of the 19th-century Yoruba wars, also called the Ekiti Parapo war. By the 1870s Ibadan, the military city-state that had defeated Ilorin and destroyed Ijaye, ruled much of eastern Yorubaland, the Ekiti, Ijesha, Igbomina and Akoko country, through resident agents, the ajele, whose exactions were deeply resented. In 1877 Ibadan, under Are Latosisa, went to war with the Egba and Ijebu, who blocked its roads to the coast. In the east the towns rose against the ajele and formed an alliance, the Ekiti Parapo (‘Ekiti together’), led from 1879 by the Ijesha war chief Ogedengbe and armed with breech-loading rifles bought through Lagos by Ekiti and Ijesha emigrants there; the noise of their guns gave the war its name. Ilorin, the Egba and Ijebu joined against Ibadan. From 1879 the two armies faced each other for seven years in fortified camps on the hills near Igbajo and Imesi-Ile, which grew into towns of tens of thousands. War-weariness, the death of Latosisa in 1885 and the mediation of the British governor of Lagos, through the Yoruba clergymen Samuel Johnson and Charles Phillips, led to a peace treaty in 1886, but Ilorin fought on around Offa, and the camps were finally broken up only in March 1893, when British officials took over the mediation and Yorubaland passed under British protection."
