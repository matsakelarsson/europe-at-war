steps:
  - title: The eastern towns rise
    date: 1877 – 1878
    when: "1878-08"
    borders: "1878-06-01"
    countries: [ng]
    body:
      - "Ibadan could not buy arms or sell its goods on the coast without passing through the lands of the Egba and Ijebu, who had blockaded it since the Ijaye war. On 31 July 1877 Latosisa declared war on the Egba, and the Ijebu sided with them. At about the same time, at Okemesi in the Ekiti country, the young warrior Fabunmi killed the ajele and his household after a quarrel with the agent’s men, and Ibadan’s agents and their followers were killed in town after town of the east."
      - The eastern rulers and war chiefs met at Okemesi and swore to fight until Ibadan’s rule was broken, taking the name Ekiti Parapo, which an association of Ekiti and Ijesha emigrants in Lagos, many of them Christians who had returned from Sierra Leone, had already adopted; the association sent arms and advisers by the new Ondo road, outside Ibadan’s reach. Ilorin, hoping to replace Ibadan as overlord, sent troops.
      - "In August 1878 the allies burnt Igbajo, a town loyal to Ibadan, and besieged Ikirun. An Ibadan army under Balogun Ajayi Ogboriefon routed them; many Ilorin soldiers drowned in the Otin river, which gave the battle its Yoruba name, Jalumi, recalling the plunge into the river. But Ibadan was too stretched, fighting the Egba and Ijebu in the south at the same time, to follow up its victory."
    facts:
      - [Ibadan declares war on the Egba, "31 July 1877"]
      - [Battle of Ikirun (Jalumi), "1878"]
