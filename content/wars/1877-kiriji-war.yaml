notes:
  - "The history of the war rests mainly on Samuel Johnson’s History of the Yorubas, written by one of the peace envoys, on local traditions of the Ekiti and Ijesha towns, and on missionary and Lagos government records. Dates and numbers vary between them; the camp populations of about 40,000 and 60,000 are traditional figures that include the warriors’ families."
  - "The positions of the two war camps, a few kilometres apart on facing hills between Igbajo and Imesi-Ile, are shown approximately."
