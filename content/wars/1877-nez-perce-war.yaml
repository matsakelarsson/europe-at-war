  - title: The Lolo Trail, the Big Hole and Yellowstone
    date: July – September 1877
    when: "1877-08-09"
    borders: "1877-08-09"
    countries: [us]
    body:
      - "Some 750 Nez Perce, about 250 of them fighting men, with more than 2,000 horses, crossed the Bitterroot Mountains by the Lolo Trail. At its eastern end they found soldiers and volunteers barring the way behind a log barricade, which they passed round on the mountainside, and the settlers let them go by; the post became known as Fort Fizzle. Believing the war was behind them in Idaho, they moved slowly up the Bitterroot valley, trading with the settlers, under the leadership of Looking Glass."
      - "At dawn on 9 August Colonel John Gibbon, with about 160 soldiers and some volunteers from Fort Shaw and Missoula, attacked the sleeping camp on the Big Hole River. The soldiers fired into the lodges and killed between about 60 and 90 Nez Perce, many of them women and children, but the warriors rallied, drove the troops back into a wooded hillside, captured their howitzer and kept them pinned down while the camp packed and escaped; 29 soldiers and volunteers were killed. Lean Elk (Poker Joe) now led the march."
      - "The Nez Perce turned south and east, raided Howard’s camp at Camas Meadows on 20 August for his mules, and crossed the new Yellowstone National Park, where some of their young men killed tourists. Hoping for help from the Crow, their old allies, they came down the Clark’s Fork, but the Crow refused them and some even scouted for the army. On 13 September they held off the 7th Cavalry at Canyon Creek, west of today’s Billings, and decided to go north to Canada, where Sitting Bull’s Lakota had found refuge."
    facts:
      - [Battle of the Big Hole, "9–10 August 1877"]
      - [Nez Perce dead at the Big Hole, "about 60–90, many of them women and children"]
      - [Battle of Canyon Creek, "13 September 1877"]
