id: nez-perce-war
name: Nez Perce War
start: "1877-06-14"
end: "1877-10-05"
tier: B
summary: "The war of June–October 1877 between the non-treaty bands of the Nez Perce (Nimiipuu), with a small band of Palouse, and the United States Army, a fighting retreat of about 1,900 km from Idaho to within 64 km of the Canadian border. The treaty of 1855 had left the Nez Perce a reservation of some 7.5 million acres, but after gold was found on it the treaty of 1863, signed by leaders of other bands, cut it by nine-tenths. The bands that had not signed, among them the Wallowa band of Joseph (Hinmatóowyalahtqit) and his brother Ollokot, refused to leave their land, and in May 1877 General Oliver Otis Howard ordered them onto the reservation within thirty days. On 14–15 June young men of White Bird’s band killed settlers on the Salmon River in revenge for earlier killings, and on 17 June the Nez Perce routed the troops sent against them at White Bird Canyon. After the battle of the Clearwater some 750 people, about 250 of them fighting men, crossed the Lolo Trail into Montana with more than 2,000 horses, hoping for help from the Crow. At the Big Hole on 9 August Colonel John Gibbon’s troops attacked their sleeping camp, killing many women and children, but the warriors held the soldiers off while the camp escaped. The Nez Perce crossed Yellowstone National Park and, refused by the Crow, turned north to join Sitting Bull in Canada, but Colonel Nelson Miles caught them at the Bears Paw Mountains on 30 September. After a five-day siege Joseph surrendered on 5 October 1877, while White Bird and some 150 to 200 others escaped to Canada. The 418 who surrendered were sent not home, as Miles had promised, but to Kansas and Indian Territory; in 1885 the 268 survivors were allowed back to the Northwest."
countries: [us]
