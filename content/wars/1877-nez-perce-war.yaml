notes:
  - "American newspapers made Joseph the Nez Perce’s war chief, the “Red Napoleon”; to the Nez Perce he was the leader of the Wallowa band who cared for the camp, while Ollokot, Looking Glass, Lean Elk (Poker Joe), White Bird and Toohoolhoolzote led in war and on the trail. The surrender speech “I will fight no more forever” was written down by Lieutenant Charles Erskine Scott Wood from the interpreter Arthur Chapman’s translation; how much of the wording is Joseph’s is debated."
