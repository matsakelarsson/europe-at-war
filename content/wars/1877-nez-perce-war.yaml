steps:
  - title: Wallowa, White Bird Canyon and the Clearwater
    date: May – July 1877
    when: "1877-06-17"
    borders: "1877-06-17"
    countries: [us]
    body:
      - "By the treaty of Walla Walla in 1855 the Nez Perce kept some 7.5 million acres of their homeland in the valleys of the Snake, the Salmon and the Clearwater. Gold was found on the reservation in 1860, and in 1863 leaders of the bands around Lapwai, many of them Christian, signed a treaty that cut it to about 750,000 acres. The bands whose lands lay outside the new reservation and who had not signed, the non-treaty Nez Perce, called it the thief treaty. Among them was the Wallowa band of Tuekakas (Old Joseph), who on his death in 1871 left his sons Joseph and Ollokot the charge never to sell the Wallowa valley."
      - "In May 1877, at a council at Fort Lapwai, General Howard gave the non-treaty bands thirty days to move onto the reservation and jailed the Dreamer leader Toohoolhoolzote when he protested. The bands crossed the flooded Snake with their herds and gathered, about 600 people, at Tolo Lake on the Camas Prairie. There, on 14 June, the young warrior Wahlitits (Shore Crossing), whose father had been killed by a settler, rode with two cousins to the Salmon River and killed four white men; other young men joined them, and in two days some 18 settlers were killed."
      - "On 17 June about 100 cavalry and volunteers under Captain David Perry attacked the Nez Perce camp in White Bird Canyon; perhaps 70 warriors routed them, killing 34 soldiers without losing a man. In early July troops attacked the village of Looking Glass, who had stayed out of the war, and he joined the others. Howard, with some 440 soldiers and about 160 volunteers and scouts, attacked the Nez Perce on the Clearwater on 11–12 July; after two days they withdrew, and the leaders decided to cross the mountains to the buffalo country of Montana."
