  - title: Bear Paw and exile
    date: September – October 1877
    when: "1877-09-30"
    borders: "1877-10-05"
    countries: [us, ca]
    body:
      - "The Nez Perce crossed the Missouri at Cow Island on 23 September, took supplies from an army depot there, and pushed on across the plains towards the border. Lean Elk wanted to hurry, but Looking Glass, now leading again, let the exhausted people rest, and on 29 September they camped on Snake Creek below the Bears Paw Mountains, about 64 km from Canada. Colonel Nelson Miles, who had marched from the Tongue River with cavalry, infantry and Cheyenne and Lakota scouts, many of whom had surrendered after the war of 1876, attacked on the morning of 30 September and drove off most of the horses."
      - "The warriors dug rifle pits and the families shelters, and the siege went on for five days in cold and snow; Ollokot, Toohoolhoolzote, Lean Elk and Looking Glass were killed. Howard arrived with an advance party in the last days of the siege. On 5 October Joseph surrendered, with the words recorded as “From where the sun now stands I will fight no more forever.” White Bird and some 150 to 200 others slipped through the lines and reached Sitting Bull’s camp in Canada."
      - "Miles had promised that the 418 who surrendered could return to Idaho, but General Sherman sent them to Fort Leavenworth in Kansas and then to Indian Territory, which they called Eeikish Pah, the hot place, where many died of disease. Joseph went to Washington to plead for his people. In 1885 the 268 survivors were allowed to go back to the Northwest: some to the Lapwai reservation and about 150, Joseph among them, to the Colville Reservation in Washington, where he died in 1904, never having been allowed to return to the Wallowa."
    facts:
      - [Battle of Bear Paw, "30 September – 5 October 1877"]
      - [Surrendered, "418"]
      - [Length of the retreat, "about 1,900 km (1,170 miles)"]
