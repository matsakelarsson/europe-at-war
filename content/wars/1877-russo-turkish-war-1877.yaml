id: russo-turkish-war-1877
name: Russo-Turkish War of 1877–1878
start: "1877-04-24"
end: "1878-03-03"
tier: A
summary: A war in which the Russian Empire, joined by Romania, Serbia and Montenegro, fought the Ottoman Empire after the bloody suppression of the Bulgarian April Uprising. Russian victories at Plevna, Shipka and Kars brought the Ottomans to the Treaty of San Stefano, revised at the Congress of Berlin in 1878, which created a Bulgarian principality and made Romania, Serbia and Montenegro independent.
countries: [bg, ro, rs, me, tr, ge, am, md, ua, ru]
sides:
  - id: ru
    name: Russian Empire and Bulgarian volunteers
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
  - id: ro
    name: Romania
    polities: [romania]
    ink: navy
    moves: Romanian moves
    success: Romanian success
  - id: sm
    name: Serbia and Montenegro
    polities: [serbia, montenegro]
    ink: red
    moves: Serbian and Montenegrin moves
    success: Serbian and Montenegrin success
  - id: tr
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Dates are New Style (Gregorian). Russia and the Balkan states used the Julian calendar, then 12 days behind, so the crossing of the Danube is 15 June 1877, the fall of Plevna 28 November 1877 and the Treaty of San Stefano 19 February 1878 in their sources. Bulgaria celebrates its liberation on 3 March.
  - Numbers of dead and of refugees are estimates and vary widely between sources.
  - Plevna is today’s Pleven, Adrianople is Edirne, and San Stefano is Yeşilköy, now part of Istanbul.
