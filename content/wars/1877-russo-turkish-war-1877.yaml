  - title: Kars and the Caucasus
    date: April – November 1877
    when: "1877-04-24"
    borders: "1877-11-18"
    countries: [tr, ge, am, ru]
    body:
      - In the Caucasus Russian columns under General Mikhail Loris-Melikov crossed the border at the start of the war. They took Ardahan in May and laid siege to Kars, while another column took Bayazid. In June the Ottoman commander, Ahmed Muhtar Pasha, beat the Russians at Zivin and drove them back to the border, relieving Kars, and Russian troops were themselves besieged in Bayazid. An Ottoman landing on the Black Sea coast set off a rising in Abkhazia.
      - With reinforcements, the Russians broke Ahmed Muhtar Pasha’s army in the Aladzha heights east of Kars in October. On the night of 17–18 November they stormed Kars, taking thousands of prisoners. Russian troops then advanced on Erzurum, which they did not take before the armistice, and failed to take Batumi. Many Armenians welcomed the Russian advance, and many Muslims fled the lands Russia conquered.
    facts:
      - [Ardahan taken, "May 1877"]
      - [Battle of Aladzha, "October 1877, Russian victory"]
      - [Kars stormed, "17–18 November 1877"]
    markers:
      - kind: taken
        side: ru
        name: Ardahan
        date: May 1877
        text: The fortress fell to a Russian column after a bombardment.
        lonlat: [42.702, 41.111]
      - kind: battle
        side: tr
        name: Battle of Zivin
        date: June 1877
        text: Ahmed Muhtar Pasha halted the Russian advance on Erzurum and forced Loris-Melikov to lift the siege of Kars.
        lonlat: [42.17, 40.13]
      - kind: battle
        side: ru
        name: Battle of Aladzha
        date: October 1877
        text: The Russians broke the Ottoman lines on the Aladzha heights, opening the way to Kars.
        lonlat: [43.416, 40.374]
        lp: b
      - kind: taken
        side: ru
        name: Kars
        date: 17–18 November 1877
        text: Russian columns stormed the forts in a night attack, and most of the garrison was killed or captured.
        lonlat: [43.096, 40.608]
      - kind: held
        side: tr
        name: Batumi
        date: 1877–1878
        text: Ottoman troops held the port against Russian attacks until the end of the war.
        lonlat: [41.642, 41.646]
