        text: Gurko’s troops broke Suleiman Pasha’s army in three days of fighting around the city.
        lonlat: [24.75, 42.15]
      - kind: taken
        side: sm
        name: Niš
        date: January 1878
        text: The Serbian army took the town, which Serbia kept at Berlin.
        lonlat: [21.896, 43.321]
