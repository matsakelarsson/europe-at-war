  - title: San Stefano and Berlin
    date: January – July 1878
    when: "1878-01"
    borders: "1878-07-13"
    countries: [bg, ro, rs, me, tr, ge, md, ua, ru]
    body:
      - After Sheynovo the Russians advanced fast. Gurko took Plovdiv in January, and Adrianople fell without a fight. An armistice was signed on 31 January, with Russian troops close to Constantinople and a British fleet in the Sea of Marmara. Hundreds of thousands of Muslims fled before the Russian armies, and many were killed by Russian troops, Cossacks and Bulgarian bands. The Treaty of San Stefano, signed on 3 March 1878, created a large Bulgarian state stretching to the Aegean and Macedonia, and gave Russia southern Bessarabia and Kars, Ardahan, Batumi and Bayazid.
      - Britain and Austria-Hungary feared that Bulgaria would be a Russian client, and the powers revised the treaty at the Congress of Berlin, which ended on 13 July. Bulgaria became a self-governing principality between the Danube and the Balkan mountains, with Sofia; Eastern Rumelia to the south stayed an autonomous Ottoman province, and Macedonia was returned to the sultan. Romania, Serbia and Montenegro became independent and gained land. Russia took back southern Bessarabia, giving Romania northern Dobruja instead, and kept Kars, Ardahan and Batumi. Austria-Hungary occupied Bosnia and Herzegovina, and Britain took Cyprus.
    facts:
      - [Treaty of San Stefano, "3 March 1878"]
      - [Congress of Berlin, "13 June – 13 July 1878"]
      - [Independent, "Romania, Serbia, Montenegro"]
    markers:
      - kind: treaty
        name: Treaty of San Stefano
        date: 3 March 1878
        text: Signed in a village outside Constantinople, which Russian troops had reached. Its terms were revised at Berlin four months later.
        lonlat: [28.825, 40.959]
      - kind: taken
