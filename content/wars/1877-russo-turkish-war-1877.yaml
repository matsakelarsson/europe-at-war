steps:
  - title: Across the Danube
    date: April – July 1877
    when: "1877-04-24"
    borders: "1877-06-27"
    countries: [bg, ro, rs, me, tr, ru]
    body:
      - In 1875 Christian peasants rose against Ottoman rule in Herzegovina and Bosnia, and in April 1876 the Bulgarians followed. Ottoman irregulars put down the April Uprising with massacres; at Batak alone some 5,000 people are thought to have been killed. Serbia and Montenegro went to war with the Ottomans in the summer of 1876, and Serbia was beaten. When a conference of the powers in Constantinople failed to impose reforms, Russia, having secured Austria-Hungary’s neutrality, declared war on 24 April 1877.
      - Romania let Russian troops pass through its territory and on 21 May declared itself independent. On the night of 26–27 June General Mikhail Dragomirov’s division crossed the Danube in boats from Zimnicea and took Svishtov, and the army followed over a pontoon bridge. One column under General Iosif Gurko pushed south, took the old Bulgarian capital of Tarnovo on 7 July and crossed the Balkan mountains by a little-used pass, while another took the Danube fortress of Nikopol.
    facts:
      - [Russia declares war, "24 April 1877"]
      - [Romania declares independence, "21 May 1877"]
      - [Danube crossing at Svishtov, "26–27 June 1877"]
    markers:
      - kind: event
        side: ru
        name: Crossing of the Danube
        date: 26–27 June 1877
        text: Dragomirov’s men rowed across the river under fire, and Skobelev drove the Ottoman garrison out of Svishtov.
        lonlat: [25.35, 43.617]
      - kind: taken
        side: ru
        name: Tarnovo
        date: 7 July 1877
        text: Gurko’s advance guard entered the medieval Bulgarian capital, to the joy of its Christian inhabitants.
        lonlat: [25.617, 43.078]
      - kind: taken
        side: ru
        name: Nikopol
        date: 16 July 1877
        text: The Danube fortress surrendered to General Nikolai Kridener’s corps after two days of fighting.
        lonlat: [24.9, 43.7]
        lp: l
      - kind: event
        name: Batak
        date: May 1876
        text: Ottoman irregulars killed most of the townspeople after the rising. Reports of the “Bulgarian horrors” turned opinion in Europe against the Ottomans.
        lonlat: [24.217, 41.95]
    arrows:
      - side: ru
        label: Main Russian army
        via: [[25.37, 43.9], [25.36, 43.6], [25.55, 43.25], [25.6, 43.1]]
      - side: ru
        label: Gurko
        via: [[25.65, 43.0], [25.95, 42.8], [25.75, 42.55]]
  - title: Shipka and the Balkan passes
    date: July 1877 – January 1878
    when: "1877-07-19"
    borders: "1877-08-26"
    countries: [bg, tr, ru]
    body:
      - Gurko took the Shipka Pass from the south on 19 July and raided into the valley beyond, but he was driven back after the battle of Stara Zagora at the end of July. Ottoman troops then burned the town and killed thousands of its Bulgarian inhabitants; some estimates put the dead at about 14,000. As the Russians withdrew, many Bulgarians fled north with them. The pass was left to a small force of Russians and Bulgarian volunteers, the opalchentsi, while the main army was held at Plevna.
      - On 21–26 August Suleiman Pasha’s army of some 30,000 men attacked the pass again and again. The defenders, about 5,000 Bulgarian volunteers and 2,500 Russians, ran out of ammunition and threw stones and the bodies of the dead before reinforcements arrived. A further attack in September also failed. Through the winter the defenders held the pass in snow and bitter cold, losing thousands to frostbite and disease. On 8–9 January 1878 Russian columns came down on both sides of the Ottoman camp at Sheynovo, and its army surrendered.
    facts:
      - [Shipka Pass taken, "19 July 1877"]
      - [Main Ottoman assault, "21–26 August 1877, repulsed"]
      - [Battle of Shipka–Sheynovo, "8–9 January 1878, Russian victory"]
    markers:
      - kind: held
        side: ru
        name: Shipka Pass
        date: 21–26 August 1877
        text: Russian troops and Bulgarian volunteers held the peak against a much larger Ottoman army until reinforcements reached them.
        lonlat: [25.317, 42.767]
      - kind: battle
        side: tr
        name: Battle of Stara Zagora
        date: 31 July 1877
        text: Suleiman Pasha’s army defeated Gurko’s force, which included Bulgarian volunteers. The town was then burned and many of its people massacred.
        lonlat: [25.634, 42.426]
      - kind: battle
        side: ru
        name: Battle of Shipka–Sheynovo
        date: 8–9 January 1878
        text: Generals Mikhail Skobelev and Nikolai Svyatopolk-Mirsky surrounded Wessel Pasha’s army below the pass, and it surrendered the same day.
        lonlat: [25.3, 42.68]
        lp: b
    arrows:
      - side: tr
        label: Suleiman Pasha
        via: [[26.1, 42.4], [25.65, 42.43], [25.4, 42.6], [25.33, 42.74]]
      - side: ru
        label: Gurko’s raid
        via: [[25.9, 42.95], [26.0, 42.7], [25.75, 42.47]]
  - title: Plevna
    date: July – December 1877
    when: "1877-07-20"
    borders: "1877-12-10"
    countries: [bg, ro, tr, ru]
    body:
      - Osman Pasha marched an Ottoman army from Vidin to Plevna, a road junction west of the Russian advance, and dug in. Two Russian assaults in July were beaten off with heavy losses, and the Russians had to ask Romania for help. On 11 September a combined Russian and Romanian army made a third assault, with Prince Carol of Romania in nominal command. The Romanians took the Grivitsa redoubt and Skobelev’s troops broke into the defences in the south, but the attack failed with very heavy Russian and Romanian losses.
      - The allies then besieged the town under the engineer General Eduard Totleben, the defender of Sevastopol. Gurko cut its supply road at Gorni Dubnik in October. Starving and short of ammunition, Osman Pasha tried to break out on 10 December, was wounded and surrendered with about 40,000 men. The five-month siege had held up the Russian advance, but its end freed some 100,000 troops. Serbia re-entered the war a few days later, and in January Gurko crossed the mountains in deep snow and took Sofia.
    facts:
      - [Siege of Plevna, "20 July – 10 December 1877"]
      - [Ottoman prisoners, "about 40,000"]
      - [Third assault, "11 September 1877, failed"]
    markers:
      - kind: siege
        side: ru
        name: Siege of Plevna
        date: 20 July – 10 December 1877
        text: Osman Pasha’s earthworks threw back three assaults. Hunger forced his surrender after a failed breakout.
        lonlat: [24.62, 43.408]
      - kind: taken
        side: ro
        name: Grivitsa redoubt
        date: 11 September 1877
        text: Romanian and Russian troops took the redoubt, the only gain of the third assault that they kept.
        lonlat: [24.7, 43.417]
        lp: t
      - kind: battle
        side: ru
        name: Battle of Gorni Dubnik
        date: 24 October 1877
        text: The Russian Guard stormed the fortified village, closing the road from Sofia that supplied Plevna.
        lonlat: [24.352, 43.379]
        lp: l
      - kind: taken
        side: ru
        name: Sofia
        date: 4 January 1878
        text: Gurko entered the town after crossing the Balkan mountains in winter.
        lonlat: [23.33, 42.7]
    arrows:
      - side: tr
