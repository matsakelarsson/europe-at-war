  - title: The march on Kumamoto
    date: February 1877
    when: "1877-02-15"
    borders: "1877-02-22"
    countries: [jp]
    body:
      - On 15 February 1877 the main Satsuma army, about 13,000 men in seven battalions, set out from Kagoshima in an unusually heavy snowfall, with Saigō in an army general’s uniform, Kirino Toshiaki and Shinohara Kunimoto as his commanders. On 19 February the government declared it a rebellion and named Prince Arisugawa Taruhito commander of the punitive force, with Yamagata Aritomo and Admiral Kawamura Sumiyoshi as his deputies. Satsuma’s only plan was to march north through Kumamoto, where the government had a garrison of about 4,000 men under Major General Tani Tateki.
      - Tani, unsure of the loyalty of his Kyushu conscripts, decided to stand on the defensive in Katō Kiyomasa’s great castle. On 19 February a fire, whose cause is still disputed, burned the keep and much of the stores. The Satsuma vanguard reached Kawashiri on 20 February, and on 22 February the Satsuma army attacked the castle from two sides. The attacks failed with heavy losses, and the rebels settled down to a siege. The same day the 14th Infantry Regiment from Kokura, marching to relieve the castle, ran into Satsuma troops at Ueki; in the night fighting its acting commander, Major Nogi Maresuke, lost the regiment’s colours.
    facts:
      - [Satsuma army leaves Kagoshima, "15 February 1877"]
      - [Satsuma army, "about 13,000, later about 30,000 with allies from other domains"]
      - [Kumamoto garrison, "about 3,800 soldiers and 600 police"]
      - [Assault on Kumamoto Castle, "22–23 February 1877"]
