  - title: Shiroyama
    date: September 1877
    when: "1877-09-24"
    borders: "1877-09-24"
    countries: [jp]
    body:
      - Saigō’s men drove the small government garrison from parts of Kagoshima and dug in on Shiroyama, the wooded hill behind the old castle. Yamagata did not risk another escape. Some 30,000 government troops surrounded the hill with trenches and palisades, while warships in the bay shelled it. Yamagata sent Saigō a letter urging him to end the fighting. Saigō did not answer it.
      - The final assault began at four in the morning of 24 September 1877. Saigō was hit in the hip and abdomen as he and his last followers came down the hill; according to the most widely accepted account, Beppu Shinsuke beheaded him at his request, and Beppu, Kirino and the others were killed charging the government lines. Within a few hours the fighting was over. About 6,400 government and 6,800 rebel soldiers had been killed in the war, and the government had to print paper money to pay for it, which brought years of inflation.
      - The rebellion ended armed samurai resistance to the Meiji state; opposition turned to the movement for freedom and popular rights, led by Itagaki Taisuke. Ōkubo Toshimichi, Saigō’s boyhood friend and the leading man of the government, was assassinated in Tokyo by former samurai from Kaga on 14 May 1878. Saigō remained popular as a symbol of loyalty and sincerity, and in 1889 the emperor pardoned him posthumously and restored his rank. His statue was unveiled in Ueno Park in Tokyo in 1898.
    facts:
      - [Saigō reaches Shiroyama, "1 September 1877"]
      - [Final assault, "24 September 1877, 4 a.m."]
      - [Satsuma men on Shiroyama, "about 300–500"]
      - [Total killed, "about 6,400 government and 6,800 rebel soldiers"]
