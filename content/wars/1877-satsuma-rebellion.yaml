steps:
  - title: Saigō and the academies
    date: 1873 – February 1877
    when: "1877-01-29"
    borders: "1877-01-29"
    countries: [jp]
    body:
      - Saigō Takamori had led the Satsuma troops in the overthrow of the shogunate and served in the new government as commander of the Imperial Guard and a councillor of state. In 1873 he proposed to go to Korea as envoy, expecting to provoke a war that would give the samurai a purpose; when his colleagues, back from their tour of the West, rejected the plan, he resigned and returned to Kagoshima with many Satsuma officers. There he founded private academies, the shigakkō, which taught military drill and the Chinese classics to former samurai, and whose graduates came to fill the offices of Kagoshima Prefecture, which went its own way under Saigō’s friend, the governor Ōyama Tsunayoshi.
      - The government meanwhile dismantled the samurai order. A conscription law of 1873 opened the army to commoners, the wearing of swords in public was banned in March 1876, and in August 1876 the samurai stipends were converted into government bonds. Revolts in Saga in 1874 and in Kumamoto, Akizuki and Hagi in 1876 were put down. In January 1877 the government began to ship the arms and powder in the Kagoshima arsenals to Osaka by night. Academy students broke into the powder magazine at Sōmuta on the night of 29 January and into the naval yard and arsenal over the following days. They had also arrested Nakahara Hisao, one of a group of police officers born in Kagoshima whom the police chief Kawaji Toshiyoshi had sent home, and under torture he confessed to a plot to assassinate Saigō. Saigō, who had been away hunting, decided to lead his followers to Tokyo.
    facts:
      - [Saigō leaves the government, "October 1873"]
      - [Samurai stipends abolished, "August 1876"]
      - [Raid on the Sōmuta powder magazine, "29 January 1877"]
