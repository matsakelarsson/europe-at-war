  - title: The relief of Kumamoto
    date: March – April 1877
    when: "1877-03-19"
    borders: "1877-04-14"
    countries: [jp]
    body:
      - To strike the Satsuma army from behind, the government landed a second force from the sea on the coast of Yatsushiro Bay. On 19 March troops of the Separate 2nd Brigade, warned that Satsuma men were waiting at Hinagu, came ashore at Suguchi a few kilometres to the south, and police and soldiers took Yatsushiro. Reinforced to several brigades, this force pushed north along the coast towards Uto and Kawashiri, while the Satsuma army, short of men and ammunition after Tabaruzaka, had to fight on two fronts.
      - In the castle food was running low. On 8 April part of the garrison broke out through the Satsuma lines to make contact with the southern force. On 14 April Lieutenant Colonel Yamakawa Hiroshi, a former Aizu officer who had fought against Satsuma in 1868, led a picked detachment through the lines into the castle, and the siege was over. The Satsuma army fell back east of the city and fought for a week along a line from Ōzu to Mifune, then withdrew south-east through the mountains, reaching Hitoyoshi at the end of April.
    facts:
      - [Landing near Hinagu, "19 March 1877"]
      - [Garrison sortie, "8 April 1877"]
      - [Siege of Kumamoto lifted, "14 April 1877"]
