  - title: Tabaruzaka
    date: February – March 1877
    when: "1877-03-04"
    borders: "1877-03-20"
    countries: [jp]
    body:
      - Government reinforcements landed at Hakata from 22 February and marched south down the road to Kumamoto. The Satsuma army sent part of its strength north to meet them and fought them at Takase in late February, where Saigō’s youngest brother Kohei was killed. The rebels then dug in on the hills north-west of Kumamoto, where the road climbed through a sunken track at Tabaruzaka, the only route for the government’s artillery. Some 15,000 Satsuma men and their allies held a line from Kichiji Pass to Tabaruzaka.
      - From 4 March the government brigades attacked Tabaruzaka in heavy rain. The battle lasted seventeen days. The Satsuma swordsmen made the conscripts pay heavily, and the government formed the Battōtai, sword-bearing units of police chosen from former samurai, many of them from the domains Satsuma had fought in the Boshin War, who went into action on 14 March. On 20 March, with fresh troops and artillery, the government broke through the Satsuma line. Losses on both sides were heavy; the government counted about 2,400 killed in the fighting around Tabaruzaka alone. Meanwhile an imperial envoy, Yanagiwara Sakimitsu, arrived at Kagoshima with warships in early March and carried off governor Ōyama Tsunayoshi, who was later tried and executed.
