notes:
  - The rebels never declared war on the emperor; Saigō said he was going to Tokyo to question the government. Former samurai from Kumamoto, Hitoyoshi, Nobeoka and other domains of Kyushu joined the Satsuma army, which at its height numbered some 30,000 men.
  - The government mobilised about 52,000 soldiers of the Imperial Japanese Army, 5,000 of the Imperial Guard and about 18,000 police, and fired on average 322,000 rifle rounds a day. The war cost about 41 million yen, nearly the whole of the government’s tax revenue of about 48 million yen for a year.
  - The killed are given here as in the Japanese sources, about 6,400 on the government side and about 6,800 on the rebel side; the wounded on each side numbered about 10,000 or more.
