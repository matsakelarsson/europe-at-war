  - title: Wadagoe and Mount Enodake
    date: August 1877
    when: "1877-08-15"
    borders: "1877-08-18"
    countries: [jp]
    body:
      - The government took Nobeoka on 14 August. The next morning Saigō, for the only time in the war, took command in person and led some 3,000 to 3,500 men against the government army at Wadagoe north of the town. They were beaten and surrounded in the village of Nagai at the foot of Mount Enodake. On 16 August Saigō released his followers from their duty; most of them surrendered, and some took their own lives. Saigō burned his papers and his general’s uniform.
      - On the night of 17–18 August Saigō, Kirino, Murata, Beppu Shinsuke and about 300 men, with porters about 400, climbed Mount Enodake, broke through the government lines at the summit and disappeared into the mountains of central Kyushu. For two weeks they marched south-west by mountain paths through Mitai and Kobayashi, while the government troops, unsure where they had gone, searched for them, and on 1 September they came down into Kagoshima and seized the hill of Shiroyama above the town.
    facts:
