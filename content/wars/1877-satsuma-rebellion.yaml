  - title: Hitoyoshi, Kagoshima and Miyazaki
    date: April – July 1877
    when: "1877-04-27"
    borders: "1877-07-31"
    countries: [jp]
    body:
      - Saigō made Hitoyoshi, in the upper Kuma valley, his new base and sent detachments to raise the provinces of Hyūga and Bungo. The government, rather than attack the mountains at once, landed a mixed force of soldiers, police and marines at Kagoshima on 27–28 April, took the town, the rebels’ base, and held it through two months of attacks by Satsuma detachments. From late May the government brigades advanced on Hitoyoshi along the valleys, and the town fell on 1 June.
      - The Satsuma army fell back into Hyūga and made a stand at Miyakonojō under Murata Shinpachi, while other detachments fought in the hills of Bungo and northern Hyūga. Government forces took Miyakonojō on 24 July, and on 31 July the rebels abandoned Miyazaki, where they had issued their own paper money. Short of rifles and ammunition, the Satsuma army retreated north along the coast towards Nobeoka.
    facts:
      - [Government landing at Kagoshima, "27–28 April 1877"]
      - [Hitoyoshi taken, "1 June 1877"]
      - [Miyakonojō taken, "24 July 1877"]
      - [Miyazaki abandoned by the rebels, "31 July 1877"]
