id: satsuma-rebellion
name: Satsuma Rebellion
start: "1877-01-29"
end: "1877-09-24"
tier: A
summary: "The last and largest of the armed risings of former samurai against the Meiji government, known in Japan as the Seinan War (the south-western war). Saigō Takamori, a leader of the Meiji Restoration and chief of staff of the imperial army in the Boshin War, left the government in 1873 after it rejected his plan for a confrontation with Korea and returned to Kagoshima, where his private academies (shigakkō) trained thousands of young former samurai. Resentment grew as the government abolished the samurai’s stipends and their right to wear swords. In January 1877 academy students seized the arms in the government arsenals at Kagoshima, and when they believed they had uncovered a government plot to murder Saigō, he agreed to lead them to Tokyo. About 13,000 men left Kagoshima in mid-February and laid siege to Kumamoto Castle, but they could not take it. The new conscript army and militarised police, led by Yamagata Aritomo, fought its way through the Satsuma lines at Tabaruzaka in March and relieved Kumamoto in April, and over the summer drove the rebels back through Hitoyoshi, Miyakonojō and Miyazaki to Nobeoka. Saigō broke out of encirclement at Mount Enodake with a few hundred men and returned to Kagoshima, where he died in the final assault on Shiroyama on 24 September 1877. About 6,400 government and 6,800 rebel soldiers were killed. The war showed that a peasant conscript army could defeat the samurai, and ended armed resistance to the Meiji state."
countries: [jp]
sides:
