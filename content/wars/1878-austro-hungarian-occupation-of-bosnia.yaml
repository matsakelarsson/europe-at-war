id: austro-hungarian-occupation-of-bosnia
name: Austro-Hungarian occupation of Bosnia and Herzegovina
start: "1878-07-29"
end: "1878-10-20"
tier: B
summary: The campaign of July to October 1878 in which Austria-Hungary, given the right by the Congress of Berlin to occupy and administer Bosnia and Herzegovina, overcame armed resistance by Bosnian Muslims and Orthodox Serbs, helped unofficially by Ottoman troops. Sarajevo fell after street fighting on 19 August, and the last strongholds in October; the provinces stayed under nominal Ottoman sovereignty until Austria-Hungary annexed them in 1908.
countries: [ba, hr, at, hu, tr]
