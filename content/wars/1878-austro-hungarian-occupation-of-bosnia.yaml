steps:
  - title: Sarajevo and the occupation
    date: 29 July – 20 October 1878
    when: "1878-07-29"
    borders: "1878-10-20"
    countries: [ba, hr, at, hu, tr]
    body:
      - The Congress of Berlin allowed Austria-Hungary to occupy and administer Bosnia and Herzegovina, which stayed under the sultan’s nominal sovereignty, and to garrison the Sanjak of Novi Pazar between Serbia and Montenegro. The foreign minister, Gyula Andrássy, expected “a walk with a brass band”, but many Bosnian Muslims, who stood to lose most under Christian rule, and many Orthodox Serbs resisted; most Catholic Croats did not. On 29 July General Josip Filipović’s XIII Corps crossed the Sava at Brod, Kostajnica and Gradiška, while General Stjepan Jovanović’s division marched up the Neretva from Dalmatia and took Mostar on 5 August.
      - Muslim volunteers led by the preacher Hadži Lojo rallied armed bands, helped almost openly by withdrawing Ottoman troops. Hussars were ambushed at Maglaj on 3 August, and on 7 August the Austro-Hungarians lost some 600 men in a battle near Jajce. Vienna mobilised three more corps, and on 19 August Sarajevo was taken after a day of street fighting; summary courts then had many accused rebels executed. Resistance went on in the hills until Hadži Lojo surrendered on 3 October and the castle of Velika Kladuša fell on 20 October. The campaign needed 153,000 troops and cost almost 5,200 Austro-Hungarian casualties.
    facts:
      - [Invasion begins, "29 July 1878"]
      - [Sarajevo taken, "19 August 1878"]
      - [Austro-Hungarian losses, "946 dead, 3,980 wounded, 272 missing"]
