notes:
  - The Ottoman government did not fight the occupation officially, but many of its troops in the provinces joined or helped the resistance. Numbers of insurgents and of Bosnian dead are uncertain; the Austro-Hungarian General Staff estimated 79,000 armed insurgents and 13,800 Ottoman regulars.
  - The occupation was sanctioned by Article 25 of the Treaty of Berlin. Austro-Hungarian garrisons entered the Sanjak of Novi Pazar, which stayed under Ottoman administration, in September 1879.
