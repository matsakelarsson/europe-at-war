id: batak-war
name: Batak War
start: "1878-02"
end: "1907-06-17"
tier: C
summary: "The resistance of Sisingamangaraja XII, the priest-king of the Toba Batak, to the Dutch advance into the Batak highlands of North Sumatra. German missionaries of the Rhenish Mission, led by Ludwig Ingwer Nommensen, had worked in the Silindung valley around Tarutung since the 1860s, and the Dutch stationed troops there to protect them and their converts. Sisingamangaraja XII, whose authority over the Toba Batak was religious more than administrative, saw the mission and the soldiers as a threat to the Batak religion and to the lands still outside Dutch rule. In February 1878 he held a ceremony to rally the Batak and attacked the Dutch posts at Bahal Batu and Tarutung; the attacks failed, and Dutch expeditions that year brought Silindung and much of the southern Toba country under Dutch rule. In 1883–1884, with help from Aceh, then at war with the Dutch, his followers attacked Dutch positions at Uluan, Balige and Tangga Batu; the Dutch replied with burnings, fines and executions but could not catch him. In 1894 they took Bakkara, his seat on the south-western shore of Lake Toba, and he moved to Parlilitan in the hills west of the lake and then to the forests of the Dairi (Pakpak) country, keeping in touch with the Acehnese. In 1904 van Daalen’s column passed through the Batak lands at the end of its march through the Gayo and Alas country. In 1907 a Marechaussee column under Captain Hans Christoffel captured his wife and two of his children, and on 17 June 1907 it caught up with him in the Dairi forest and killed him, his daughter Lopian and his sons Patuan Nagari and Patuan Anggi. His death ended the war. Indonesia declared him a National Hero in 1961."
