id: fireburn
name: Fireburn
start: "1878-10-01"
end: "1878-10"
tier: C
summary: "A rising of plantation labourers on Saint Croix in the Danish West Indies, now part of the United States Virgin Islands. Denmark had abolished slavery in its West Indian islands in 1848, but the Labour Act of 1849 bound the freed people to the estates on yearly contracts at a fixed day wage and let them change employer only once a year, on Contract Day, 1 October. On that day in 1878 crowds of labourers who had come into Frederiksted heard a rumour, which proved false, that Henry Trotman, a labourer injured by the police, had died in hospital. The police and soldiers withdrew into the fort, which the crowd failed to storm, and that night buildings across the town were set on fire and shops were looted. Soldiers arrived from Christiansted the next morning, but for days fires spread across the western part of the island, and about 50 plantations and more than half of Frederiksted were destroyed. The governor, Janus August Garde, declined help offered by British, French and American warships, and by mid-October the rising was over. About 100 labourers were killed, most of them shot by soldiers, against two soldiers and one planter; 12 men were sentenced to death and shot at once, and about 40 people were convicted later. Among them were the women remembered as the leaders, the “queens”: Mary Thomas (“Queen Mary”), Axeline Elizabeth Salomon (“Queen Agnes”) and Mathilda McBean (“Queen Mathilda”), with Susanna Abrahamson. Their death sentences were commuted by the king, and several served their terms in the women’s prison of Christianshavn in Copenhagen in 1882–1887. The rising brought slightly higher wages; Denmark sold the islands to the United States in 1917. In 2018 a statue of Mary Thomas, I Am Queen Mary, was unveiled in Copenhagen."
