notes:
  - "The peoples of the coast and the islands, among them the Papel, Manjaco, Balanta, Felupe, Beafada and Bijagó, were organised in many small kingdoms and village communities rather than one state, and fought Portugal at different times and often separately; some, like the Fula of the interior and the Muslim Mandinka, fought on the Portuguese side."
  - "Portuguese accounts of the period, written by the officers who led the campaigns, are the main written record; the historian René Pélissier’s work on them is the standard modern study."
