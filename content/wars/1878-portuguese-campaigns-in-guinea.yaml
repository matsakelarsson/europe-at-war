id: portuguese-campaigns-in-guinea
name: Portuguese campaigns in Guinea
start: "1878-12-30"
end: "1936-02"
tier: C
summary: "The wars by which Portugal turned a handful of trading posts on the rivers of Guinea into the colony of Portuguese Guinea, today’s Guinea-Bissau. For centuries Portugal had held only forts and river towns such as Cacheu, Bissau and Bolama, often paying the surrounding Papel, Manjaco, Balanta, Felupe (Jola) and Bijagó peoples for the right to trade, and these towns had been centres of the Atlantic slave trade. On 30 December 1878 a Portuguese force sent up the Cacheu river to punish the Felupe for an attack on the post of Bolol (Bolor) was almost wiped out, and the shock led Lisbon to separate Guinea from Cape Verde as a colony of its own in 1879, governed from Bolama. Between 1879 and 1891 gunboats and landing parties fought the coastal and river peoples; the convention with France of 12 May 1886 fixed the borders but gave up the Casamance. In 1892 Guinea became a military district, and the Muslim Fula rulers of the interior recognised Portuguese sovereignty in return for autonomy and supplied auxiliaries against their non-Muslim neighbours. Portugal called the campaigns that followed “pacification”. The most violent were those of Captain João Teixeira Pinto, who arrived in 1912 and from 1913 to 1915 used African soldiers and the irregulars of the Wolof war leader Abdul Injai to break resistance to the hut tax in Oio, among the Manjaco of the Cacheu region and among the Papel around Bissau, burning villages and seizing cattle; many people fled to Senegal or into the forests. The cost of his forces led to his recall in 1915, and a Portuguese lawyer later published a report on the killing of fleeing villagers by the irregulars. Abdul Injai, rewarded with power in Oio, ruled it almost independently until August 1919, when colonial troops defeated his force at Mansabá on 1–2 August and deported him to Cape Verde. Resistance continued in the north-west and the Bijagós islands in the 1920s and 1930s, and Portugal treated the conquest of Canhabaque in the Bijagós, after a campaign from November 1935 to February 1936, as the end of the occupation of the colony."
