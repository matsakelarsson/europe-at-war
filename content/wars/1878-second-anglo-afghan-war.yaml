  - title: Maiwand
    date: July – August 1880
    when: "1880-07-27"
    borders: "1880-07-27"
    countries: [af, gb]
    body:
      - With no amir in Kabul acceptable to them, the British turned to Abdur Rahman Khan, a grandson of Dost Mohammad who had returned from exile in Russian Turkestan, and on 22 July 1880 recognised him as amir of Kabul. A new Liberal government in London wanted the army out of Afghanistan. But Sher Ali’s younger son Ayub Khan, governor of Herat, had already set out for Kandahar with an army of regulars and tribesmen. A brigade of about 2,500 men under Brigadier-General George Burrows marched to the Helmand to stop him; the troops of the British-appointed governor of Kandahar went over to Ayub.
      - On 27 July 1880 Ayub’s army of about 12,000 men, with more irregulars, caught Burrows’s brigade on open ground near Maiwand. After hours of artillery fire the Indian infantry on the left gave way, and the brigade broke and fled. The rear of the British 66th Regiment made a last stand in a walled garden. The British and Indian dead numbered about 970, some accounts say up to 1,200, and the Afghans lost an estimated 2,500 to 3,000 killed and wounded. Afghan tradition remembers Malalai, a young woman who is said to have rallied the Afghan fighters with her songs before she was killed. The survivors straggled back to Kandahar, where Ayub besieged the British garrison.
    facts:
      - [Battle of Maiwand, "27 July 1880, Afghan victory"]
      - [Ayub Khan’s army, "about 12,000 men and irregulars"]
      - [Burrows’s brigade, "about 2,500 men"]
    markers:
      - kind: battle
        side: afg
        name: Battle of Maiwand
        date: 27 July 1880
        text: The worst British defeat of the war. It is commemorated by monuments in Kabul and, for the 66th Regiment, in Reading, England.
        lonlat: [65.133, 31.733]
      - kind: event
        side: afg
        name: Girishk
        date: July 1880
        text: Burrows’s brigade faced Ayub Khan across the Helmand here before falling back to Kushk-i-Nakhud.
        lonlat: [64.36, 31.82]
        lp: b
      - kind: siege
        side: brit
        name: Kandahar
        date: August 1880
        text: The British garrison expelled many of the city’s people and held the walls against Ayub Khan’s army until relieved.
        lonlat: [65.716, 31.62]
