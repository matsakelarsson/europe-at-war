steps:
  - title: The invasion
    date: November 1878 – February 1879
    when: "1878-11-21"
    borders: "1878-12"
    countries: [af, pk, gb]
    body:
      - In July 1878, during the crisis with Britain over the Russo-Turkish War, a Russian mission under General Nikolai Stoletov reached Kabul. The viceroy of India, Lord Lytton, demanded that the amir Sher Ali Khan receive a British mission too, and when its leader, Sir Neville Chamberlain, was turned back at the Afghan fort of Ali Masjid in the Khyber Pass on 21 September, Lytton sent an ultimatum. It expired without an answer, and on 21 November 1878 three British and Indian columns, some 40,000 men in all, crossed the border.
      - Sir Samuel Browne’s Peshawar Valley Field Force attacked Ali Masjid, whose garrison slipped away during the night, and occupied Jalalabad in December. Major-General Frederick Roberts led the Kurram Field Force up the Kurram valley and on 2 December outflanked the Afghan position on the Peiwar Kotal pass with a night march. In the south, Sir Donald Stewart’s Kandahar Field Force marched from Quetta over the Khojak pass and entered Kandahar unopposed on 8 January 1879. Sher Ali left Kabul for the north, hoping for Russian help that the Russians would not give, and died at Mazar-i-Sharif on 21 February 1879. His son Mohammad Yaqub Khan, whom he had kept in prison for years, became amir.
    facts:
      - [British ultimatum expired, "20 November 1878"]
      - [Battle of Peiwar Kotal, "2 December 1878, British victory"]
      - [Kandahar occupied, "8 January 1879"]
    markers:
