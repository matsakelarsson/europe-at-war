  - title: Gandamak and the Kabul residency
    date: May – September 1879
    when: "1879-05-26"
    borders: "1879-05-26"
    countries: [af, pk, gb]
    body:
      - Yaqub Khan came to the British camp at Gandamak and on 26 May 1879 signed a treaty with the British negotiator, Major Louis Cavagnari. The amir gave up the Kurram, Pishin and Sibi districts and control of the Khyber and Michni passes, agreed to conduct his relations with other states through the British, and accepted a British envoy in Kabul in return for an annual subsidy of six lakh rupees and the withdrawal of British troops from the rest of the country. Most of the invading forces went back to India, losing many men to cholera on the march.
      - Cavagnari entered Kabul as envoy in July 1879 with an escort of the Corps of Guides. On 3 September soldiers of regiments from Herat, who had come to the Bala Hissar to demand months of unpaid wages, attacked the residency, joined by townspeople. Cavagnari, his three British companions and almost all of the 75 Guides of the escort were killed after a day-long fight; the amir did not intervene. Lytton ordered the reoccupation of Kabul.
    facts:
      - [Treaty of Gandamak, "26 May 1879"]
      - [Ceded to British India, "Kurram, Pishin and Sibi; control of the Khyber"]
      - [Residency attacked, "3 September 1879"]
    markers:
      - kind: treaty
        name: Treaty of Gandamak
        date: 26 May 1879
        text: Signed at the British camp near Gandamak, between Jalalabad and Kabul, where a British force had been destroyed in January 1842.
        lonlat: [70.038, 34.289]
      - kind: event
        side: afg
        name: Bala Hissar, Kabul
        date: 3 September 1879
        text: The residency inside the citadel of Kabul was stormed and burnt, and the envoy and his escort killed.
        lonlat: [69.192, 34.506]
    arrows:
      - side: brit
        label: Cavagnari’s mission
        via: [[70.45, 34.43], [70.04, 34.3], [69.55, 34.45], [69.2, 34.5]]
  - title: Kabul and Sherpur
    date: October 1879 – April 1880
    when: "1879-10-06"
    borders: "1879-10-13"
    countries: [af, gb]
    body:
      - Roberts advanced from the Kurram over the Shutargardan pass with about 6,500 men, defeated the Afghan army at Charasiab on 6 October 1879 and entered Kabul on 13 October. Yaqub Khan abdicated and was sent into exile in India. A British military commission tried those accused of the attack on the residency and of resisting the British, and dozens of Afghans were publicly hanged; parts of the Bala Hissar were blown up. The executions turned many Afghans against the occupation.
      - In December the religious leader Mushk-i-Alam of Ghazni called for holy war, and Mohammad Jan Khan Wardak gathered a tribal army that British estimates put at tens of thousands, proclaiming Yaqub’s young son Musa Jan amir. After costly fighting in the hills around Kabul, Roberts pulled his whole force back into the Sherpur cantonment north of the city on 14 December. On 23 December the Afghans stormed the cantonment and were beaten off with heavy losses, and their army broke up. In April 1880 Stewart marched from Kandahar to Kabul and defeated a large Afghan force at Ahmed Khel, near Ghazni, on 19 April.
    facts:
      - [Battle of Charasiab, "6 October 1879, British victory"]
      - [Assault on Sherpur, "23 December 1879, repulsed"]
      - [Battle of Ahmed Khel, "19 April 1880, British victory"]
    markers:
