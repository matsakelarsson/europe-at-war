  - title: The march to Kandahar
    date: August 1880 – April 1881
    when: "1880-09-01"
    borders: "1880-09-01"
    countries: [af, gb]
    body:
      - On 8 August Roberts left Kabul for Kandahar with about 10,000 picked troops and some 8,000 followers, carrying everything on pack animals. They covered the 500 km in three weeks, relieved the garrison of Kalat-i-Ghilzai on the way and reached Kandahar on 31 August. The next day Roberts attacked Ayub Khan’s camp west of the city and routed his army; Ayub lost his guns and about 1,000 killed, and fled to Herat. In the north Stewart had already handed Kabul to Abdur Rahman and withdrawn through the Khyber.
      - The last British troops left Kandahar in April 1881. Ayub Khan took the city that summer, but Abdur Rahman defeated him in September and he fled to Persia. Britain kept the districts ceded at Gandamak and, by agreement with Abdur Rahman, control of Afghanistan’s foreign relations, which lasted until 1919. Abdur Rahman, paid a British subsidy, spent the next twenty years forcing the regions of Afghanistan under the rule of Kabul.
    facts:
      - [Kabul to Kandahar march, "8–31 August 1880"]
      - [Battle of Kandahar, "1 September 1880, British victory"]
      - [British withdrawal from Kandahar, "April 1881"]
    markers:
      - kind: battle
        side: brit
        name: Battle of Kandahar
        date: 1 September 1880
        text: Roberts turned Ayub Khan’s position on the Baba Wali ridge and took his camp, ending the war.
        lonlat: [65.65, 31.635]
        lp: l
      - kind: held
        side: brit
        name: Kalat-i-Ghilzai
        date: 23 August 1880
        text: A small British garrison on the Kandahar road, relieved and withdrawn by Roberts’s column.
        lonlat: [66.9, 32.105]
      - kind: event
        side: afg
        name: Kabul
        date: 22 July – August 1880
        text: Abdur Rahman Khan was recognised as amir, and Stewart’s force left the city to him.
        lonlat: [69.178, 34.525]
