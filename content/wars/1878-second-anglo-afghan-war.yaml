id: second-anglo-afghan-war
name: Second Anglo-Afghan War
start: "1878-11-21"
end: "1880-09-01"
tier: A
summary: The war in which British India invaded Afghanistan to force the amir Sher Ali Khan, who had received a Russian mission, to accept British control of his foreign relations. British and Indian columns took the Khyber, the Kurram and Kandahar in 1878–1879, and Sher Ali’s son Yaqub Khan signed the Treaty of Gandamak. The killing of the British envoy in Kabul in September 1879 brought a second invasion, Afghan risings around Kabul and the British defeat at Maiwand in July 1880, before Roberts’s march from Kabul to Kandahar ended the fighting. Britain withdrew, recognising Abdur Rahman Khan as amir, but kept the Kurram, Pishin and Sibi districts and control of Afghanistan’s foreign policy.
countries: [af, pk, gb]
sides:
  - id: brit
    name: British India
    polities: [united-kingdom]
    ink: red
    moves: British and Indian moves
    success: British success
  - id: afg
    name: Afghanistan
    polities: [afghanistan]
    ink: green
    moves: Afghan moves
    success: Afghan success
notes:
  - The British forces were mostly regiments of the Indian Army (the Bengal, Bombay and Madras armies, with Sikh, Gurkha, Punjabi and Pashtun soldiers), together with British regiments. On the Afghan side fought the amir’s regular army and, especially after September 1879, tribal forces and religious volunteers (ghazis) who were not under the government’s control.
  - Casualty figures for Afghan forces come mostly from British estimates. At Maiwand the British and Indian dead are usually given as about 970, and some accounts give up to 1,200; Afghan losses are estimated at 2,500 to 3,000 killed and wounded.
