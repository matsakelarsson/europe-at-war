  - title: Gingindlovu and the relief of Eshowe
    date: April 1879
    when: "1879-04-02"
    borders: "1879-04-03"
    countries: [za, gb]
    view:
      center: [31.49, -29.05]
      size: [60, 60]
    body:
      - Chelmsford, reinforced by troops rushed from Britain and other colonies, led a relief column of about 5,700 men across the lower Thukela at the end of March, advancing slowly and forming a laager every night. On 2 April, at Gingindlovu, south of the Nyezane, about 11,000 Zulu under Somopho kaZikhala, with Dabulamanzi among the commanders, attacked the square entrenched laager. Rifle fire, artillery and Gatling guns stopped them short of the line, and they broke under a cavalry pursuit; the British lost 11 killed and 62 wounded, the Zulu more than 1,000 killed.
      - Chelmsford relieved Eshowe on 3 April. He decided not to hold it; the garrison marched back to the Thukela, and the Zulu burned the empty post. In both north and south the British had now defeated the Zulu army in battles fought from fortified positions, and Chelmsford prepared a second invasion with fresh troops.
    facts:
