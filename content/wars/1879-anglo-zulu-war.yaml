  - title: The second invasion and Ulundi
    date: May – July 1879
    when: "1879-07-04"
    borders: "1879-07-04"
    countries: [za, gb, fr]
    body:
      - The British government, shocked by Isandlwana, sent reinforcements and appointed Sir Garnet Wolseley to supersede Chelmsford, who hurried to finish the war before Wolseley arrived. In late May and June the new 2nd Division and Wood’s column, renamed the Flying Column, advanced from the north-west on oNdini, building forts as they went, while the 1st Division moved slowly up the coast. On 1 June a Zulu patrol killed the Prince Imperial of France, who had ridden out with a small party, near the Ityotyosi River. Cetshwayo sent messengers offering peace, but Chelmsford’s terms included the surrender of the Zulu army’s weapons, and the war went on.
      - On 4 July 1879 Chelmsford crossed the White Mfolozi with about 5,200 men, some 4,200 British and 1,000 African troops with ten field guns and two Gatlings, and formed a great hollow square on the open plain near oNdini. The Zulu army, some 12,000 to 15,000 men under Ziwedu kaMpande, attacked from all sides but could not get within close range of the square, and after about half an hour the cavalry charged out and drove it from the field. The British lost 13 to 18 killed and about 70 to 90 wounded; 473 Zulu dead were counted, and Zulu losses were reported as about 1,500. Chelmsford had oNdini and the other royal homesteads in the valley burned, and then withdrew; he handed over command to Wolseley and sailed for home.
    facts:
      - [Death of the Prince Imperial, "1 June 1879"]
      - [Battle of Ulundi, "4 July 1879"]
      - [British square, "about 5,200 men"]
