  - title: The capture of Cetshwayo and the partition
    date: August – September 1879
    when: "1879-08-28"
    borders: "1879-09-01"
    countries: [za, gb]
    body:
      - After Ulundi the Zulu regiments went home, and most chiefs submitted to Wolseley. Cetshwayo hid in the north, moving from one homestead to another; on 28 August 1879 a patrol of dragoons under Major Richard Marter found him at a homestead in the Ngome forest. He was taken to Cape Town and held in the castle.
      - On 1 September 1879 at Ulundi, Wolseley announced the settlement. The Zulu monarchy and the regimental system were abolished, and the kingdom was divided among thirteen chiefs under a British resident, among them Zibhebhu kaMaphitha and the king’s half-brother Hamu kaNzibe, who had gone over to the British, and John Dunn, the trader who had been Cetshwayo’s adviser. The settlement set Zulu against Zulu. Cetshwayo, after visiting London in 1882, was restored to part of his kingdom in 1883 but driven out by Zibhebhu within months and died at Eshowe in 1884; Britain annexed Zululand in 1887, and in 1897 it was joined to Natal.
    facts:
      - [Cetshwayo captured, "28 August 1879"]
      - [Wolseley’s settlement, "1 September 1879"]
      - [Chiefdoms, "thirteen"]
