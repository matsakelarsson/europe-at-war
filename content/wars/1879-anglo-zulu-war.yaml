  - title: Isandlwana and Rorke’s Drift
    date: 22–23 January 1879
    when: "1879-01-22"
    borders: "1879-01-22"
    countries: [za, gb]
    view:
      center: [30.66, -28.37]
      size: [60, 50]
    body:
      - Chelmsford camped below the hill of Isandlwana on 20 January without entrenching or forming a wagon laager. The main Zulu army, some 20,000 men under Ntshingwayo kaMahole and Mavumengwana kaNdlela, had moved unseen into the Ngwebeni valley a few kilometres away. Before dawn on 22 January, believing the Zulu were to the south-east, Chelmsford took about half his force to the Mangeni hills, leaving about 1,300 men in the camp under Lieutenant-Colonel Henry Pulleine, joined later that morning by Durnford with some 500 mostly mounted African troops and a rocket battery.
      - At about midday British scouts stumbled on the Zulu army, which attacked at once in its classic formation, the “horns” encircling the flanks while the “chest” pressed the centre. British volleys held the centre for a time, but the firing line was spread too thin, Durnford’s men fell back when their ammunition ran short, and the horns closed around the camp. By mid-afternoon, as an eclipse of the sun darkened the sky, the camp was overrun. Of the roughly 1,800 men in the camp more than 1,300 died, among them 343 men of the Natal Native Contingent; the Zulu lost about 1,000 to 3,000 killed.
      - The Zulu reserve, three to four thousand men of the Undi corps under Prince Dabulamanzi kaMpande, crossed the Buffalo against Cetshwayo’s orders and attacked the mission station at Rorke’s Drift, where about 150 soldiers, many of them sick, had barricaded the buildings with mealie bags and biscuit boxes. They held out for about ten hours of attacks through the night, losing 17 killed; some 350 Zulu bodies were counted around the post, and wounded prisoners were killed afterwards. Eleven Victoria Crosses were awarded for the defence, which the British public took as a counterweight to Isandlwana.
    facts:
