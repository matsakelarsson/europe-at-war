steps:
  - title: Confederation, the ultimatum and the invasion
    date: 1877 – January 1879
    when: "1878-12-11"
    borders: "1879-01-11"
    countries: [za, gb]
    body:
      - In the 1870s the British colonial secretary, Lord Carnarvon, wanted to unite the British colonies, the Boer republics and the African kingdoms of southern Africa in a confederation under British rule, as Canada had been united. Britain annexed the Transvaal in 1877 and sent Sir Bartle Frere to the Cape as high commissioner to carry the plan through. Frere came to see Cetshwayo’s kingdom, with an army of perhaps 40,000 men, as a danger to Natal and the main obstacle to confederation.
      - Frere built his case on border incidents. In July 1878 the sons of the Zulu chief Sihayo crossed into Natal, seized two of their father’s wives who had fled there, and killed them; two colonial surveyors were briefly held by Zulu on the Thukela. A boundary commission that Natal’s governor had appointed found largely in the Zulu kingdom’s favour over the land it disputed with the Transvaal, but Frere withheld its award. On 11 December 1878, at a tree on the Natal bank of the lower Thukela, his officials read the award and then an ultimatum to Cetshwayo’s envoys. He was to hand over Sihayo’s sons, pay fines in cattle, accept a British resident and, within thirty days, disband the Zulu army and abandon its regimental system. The British government had not approved it, and Cetshwayo could not comply without destroying his kingdom.
      - Lord Chelmsford had assembled more than 17,000 men in five columns, three of them to advance on oNdini from different sides. Colonel Evelyn Wood’s column, advancing from Utrecht in the north-west, crossed the Ncome (Blood) River on 6 January. When the ultimatum expired, the centre column of about 4,700 men, which Chelmsford accompanied, crossed the Buffalo River at Rorke’s Drift on 11 January 1879, and from 12 January Colonel Charles Pearson’s coastal column crossed the lower Thukela by ferry. A column under Colonel Anthony Durnford guarded the Middle Drift of the Thukela, and another the Transvaal border in the north. Cetshwayo gathered his regiments at oNdini, his royal homestead.
