  - title: Intombe, Hlobane and Kambula
    date: March 1879
    when: "1879-03-29"
    borders: "1879-03-29"
    countries: [za, gb]
    body:
      - In the north, Wood’s column held a fortified camp at Kambula and raided the abaQulusi, a Zulu community loyal to the king, and the Swazi prince Mbilini waMswati, who lived under Cetshwayo’s protection. On 12 March Mbilini’s men surprised a company of the 80th Regiment escorting a supply convoy on the Ntombe River near Lüneburg and killed 62 of them and about 18 civilian conductors and African drivers.
      - On 28 March Wood sent his mounted troops under Lieutenant-Colonel Redvers Buller to storm the abaQulusi stronghold on Hlobane mountain, just as the main Zulu army, sent north by Cetshwayo, came into sight. The mounted men were caught on the mountain and driven down its steep western end with heavy losses; about 90 European officers and men and more than 100 African troops were killed.
      - The next day, 29 March, about 20,000 Zulu under Mnyamana Buthelezi and Ntshingwayo attacked Wood’s 2,000-odd men in the laager and redoubt at Kambula. Wood provoked the Zulu right wing into attacking before the rest of the army was ready, and for four hours British rifles and artillery broke attack after attack; then the mounted troops pursued the retreating Zulu for miles. The British lost 29 killed; estimates of the Zulu dead range from about 800 to 2,000. Kambula was the turning point of the war, and Zulu commanders said afterwards that the army never recovered its confidence.
    facts:
