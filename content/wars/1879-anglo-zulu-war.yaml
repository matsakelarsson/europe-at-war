  - title: Inyezane and the siege of Eshowe
    date: January – March 1879
    when: "1879-01-22"
    borders: "1879-02-15"
    countries: [za, gb]
    view:
      center: [31.49, -29.05]
      size: [60, 60]
    body:
      - On the coast, Pearson’s column of about 4,700 men, with 384 wagons, advanced from the Lower Drift towards the abandoned Norwegian mission at Eshowe. On 22 January, the same day as Isandlwana, about 6,000 Zulu under Godide kaNdlela attacked its leading division as it crossed the Nyezane River; the British fought them off with rifles, artillery and a Gatling gun, losing 15 killed against 300 to 600 Zulu dead. Pearson reached Eshowe the next day and began to fortify the mission.
      - News of Isandlwana reached him days later. With the centre column destroyed, Pearson decided to hold Eshowe, sent his mounted men and African troops back to Natal, and was soon cut off by Zulu regiments that watched the post without attacking it. For ten weeks about 1,700 men lived in the earthwork fort, communicating with the Thukela by heliograph, while sickness killed more of them than the Zulu did.
    facts:
      - [Battle of Inyezane, "22 January 1879"]
      - [Siege of Eshowe, "23 January – 3 April 1879"]
