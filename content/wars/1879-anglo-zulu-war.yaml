id: anglo-zulu-war
name: Anglo-Zulu War
start: "1879-01-11"
end: "1879-09-01"
tier: A
summary: "The British invasion of the Zulu kingdom of Cetshwayo in 1879. Sir Bartle Frere, the British high commissioner, saw the independent Zulu kingdom and its army as the main obstacle to his plan for a confederation of southern Africa under British rule, and in December 1878, without the British government’s approval, sent Cetshwayo an ultimatum that no Zulu king could accept, demanding among other things that he disband his army. On 11 January 1879 Lord Chelmsford’s army crossed into Zululand in three columns. On 22 January a Zulu army of some 20,000 men destroyed the British camp at Isandlwana, killing more than 1,300 soldiers, one of the worst defeats of a colonial army in Africa; that evening and night the small garrison of Rorke’s Drift beat off a Zulu attack. The coastal column was besieged at Eshowe, but in the north Evelyn Wood’s column repulsed the main Zulu army at Kambula on 29 March, and on 2 April Chelmsford won at Gingindlovu and relieved Eshowe. With reinforcements from Britain he invaded again and defeated the Zulu army at Ulundi on 4 July, burning the royal homestead of oNdini. Cetshwayo was captured on 28 August, and Sir Garnet Wolseley divided the kingdom among thirteen chiefs, a settlement that led to civil war in the 1880s and to the British annexation of Zululand in 1887."
countries: [za, gb]
sides:
  - id: zulu
    name: Zulu kingdom (Cetshwayo)
    polities: [zulu-kingdom]
    ink: brown
    moves: Zulu moves
    success: Zulu success
  - id: brit
    name: British Empire (British troops, Natal and Transvaal colonial forces and African auxiliaries)
    polities: [united-kingdom, natal]
    ink: red
    moves: British moves
    success: British success
notes:
  - "About half of Chelmsford’s army were Africans, mostly from Natal, in the Natal Native Contingent and other units; many of them died at Isandlwana. The British side lost about 1,900 killed in the war; Zulu losses were never counted, and the figure of about 6,900 killed often quoted is a minimum."
  - "The Zulu army was a citizen army of age-regiments (amabutho) armed mainly with shields and stabbing spears and some firearms. Cetshwayo fought a defensive war and forbade his commanders to cross into Natal, hoping that defeats would persuade the British to negotiate; British accounts of the war long dominated, and Zulu testimony collected afterwards gives the other side."
  - The Prince Imperial, Louis-Napoléon Bonaparte, son of Napoleon III, who had joined Chelmsford’s staff as an observer, was killed by a Zulu patrol on 1 June 1879, an event that made the war famous in France.
