id: little-war
name: Little War (Guerra Chiquita)
start: "1879-08"
end: "1880-12-03"
tier: C
summary: "The second Cuban war for independence, fought in 1879–1880 by veterans who had not accepted the Pact of Zanjón that ended the Ten Years’ War. It was organised from New York by the Cuban Revolutionary Committee of Calixto García, who had refused the pact, with the support of Antonio Maceo in exile and of José Martí in Havana, until Martí was arrested and deported to Spain in September 1879. The rising began in Oriente in late August 1879 (sources give 24 or 26 August) under José Maceo, Guillermo Moncada and Quintín Banderas, and spread to Las Villas, where Emilio Núñez and Francisco Carrillo led it. The rebels, a few thousand at most, were short of arms and of experienced leaders, and the people of the countryside were exhausted by ten years of war. The Spanish commanders, among them Camilo García de Polavieja in Oriente, combined pursuit with offers of pardon, and Spanish authorities presented the rising as a race war, since many of its leaders were Black, which kept many white Cubans away from it. Antonio Maceo never managed to land; Calixto García landed on the south coast of Oriente in May 1880, but after months in the Sierra Maestra and the Cauto valley he surrendered and was again deported to Spain. Most leaders had capitulated by September 1880, and the last, Emilio Núñez, laid down his arms on 3 December 1880. Hundreds of rebels were killed. The failure convinced José Martí that a new war needed one organisation uniting the exiles and the island, which he founded in 1892 as the Cuban Revolutionary Party."
