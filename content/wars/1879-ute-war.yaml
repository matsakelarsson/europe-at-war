id: ute-war
name: Ute War (White River War)
start: "1879-09-29"
end: "1879-10-21"
tier: C
summary: "A short war in western Colorado in 1879 between the White River Ute and the United States, which ended with the removal of most Ute from Colorado. The treaty of 1868 had given the Ute most of western Colorado for their “absolute and undisturbed use and occupation”, but miners moved onto their land in the 1870s, and Colorado’s governor, Frederick Pitkin, campaigned on the slogan “The Utes Must Go!”. Nathan Meeker, the agent at the White River Agency from 1878, tried to make the White River Ute settle as farmers and become Christians, and in September 1879 he had a pasture and racetrack where they kept their horses ploughed. After a scuffle with the Ute leader Canalla (Johnson), Meeker asked for troops, and Major Thomas Thornburgh marched from Fort Fred Steele in Wyoming with about 150 soldiers. The Ute had warned that troops entering the reservation would mean war. On 29 September 1879 Ute fighters under Nicaagat (Captain Jack) and Colorow met Thornburgh’s column at Milk Creek, about 29 km north of today’s Meeker, killed him and 13 of his men and besieged the rest for almost a week, until a company of the 9th Cavalry, Buffalo Soldiers under Captain Francis Dodge, reached them on 2 October and Colonel Wesley Merritt’s relief column on 5 October. The same day as the battle, Ute men under Quinkent (Douglass) killed Meeker and ten agency employees and took five women and children captive, among them Meeker’s wife Arvilla and daughter Josephine; they were freed on 21 October through talks in which the Uncompahgre Ute leader Ouray, his wife Chipeta and his sister Shawsheen took part. Under an agreement of 1880 the White River Ute were removed to the Uintah Reservation in Utah in 1881 and the Uncompahgre Ute, who had not fought, to a reservation beside it; only the Southern Ute kept a strip of land in south-western Colorado, and millions of acres were opened to settlement."
