  - title: Togbao and Kouno
    date: 1897 – October 1899
    when: "1899-07-17"
    borders: "1899-10-28"
    countries: [td]
    body:
      - Britain recognised Rabih as “sultan of Bornu”, but France, which claimed the Chad basin, called him a usurper and a slave trader, a charge it used to justify war. The French officer Émile Gentil came up the Ubangi and the Chari with the steamer Léon-Blot, founded a post at Fort-Archambault, and in October 1897 signed a treaty making Baguirmi a French protectorate at Gaourang’s request. In 1899 Rabih received the French envoy Ferdinand de Béhagle at Dikwa, then had him arrested and later hanged.
      - In July 1899 a small French force under Lieutenant Henri Bretonnet, with 44 Senegalese tirailleurs, three guns and about 400 Baguirmi soldiers under Gaourang, waited for Rabih at the post of Kouno on the Chari. Rabih came with about 2,700 riflemen and some 10,000 auxiliaries. Bretonnet fell back to the hills of Togbao nearby, where on 17 July Rabih’s third assault destroyed his column; three tirailleurs survived as prisoners, and Gaourang escaped wounded. Rabih took the three guns. On 28 October Gentil came down the river with 344 men and attacked Kouno with the guns of his steamer and a land column; the French burned the town but could not take Rabih’s stockade, lost 46 dead and 106 wounded, and withdrew to Fort-Archambault.
    facts:
      - [Baguirmi a French protectorate, "October 1897"]
      - [Battle of Togbao, "17 July 1899 (some sources give 18 July)"]
      - [Battle of Kouno, "28 October 1899"]
    markers:
      - kind: battle
        side: rb
        name: Kouno and Togbao
        date: 17 July and 28 October 1899
        text: Rabih destroyed Bretonnet’s column on the hills of Togbao near Kouno in July, and in October beat off Gentil’s attack on his stockade at Kouno.
        lonlat: [17.661, 9.846]
      - kind: held
