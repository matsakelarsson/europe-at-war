id: wars-of-rabih-az-zubayr
name: Wars of Rabih az-Zubayr
start: "1879"
end: "1901-08-23"
tier: A
summary: "The wars of Rabih az-Zubayr, a Sudanese soldier and slave trader who led the remnant of al-Zubayr Rahma Mansur’s private army from the Bahr el-Ghazal across Central Africa and made himself master of the ancient empire of Bornu. After the Egyptian government of the Sudan crushed the revolt of al-Zubayr’s son Suleiman in 1879, Rabih escaped west with about 400 men. For twelve years his army raided the peoples of today’s Central African Republic and southern Chad for captives and ivory, growing to some 5,000 riflemen. In 1892–1893 he drove the king of Baguirmi from Massenya, and in 1893–1894 he defeated the armies of the al-Kanemi shehus, sacked Kukawa and ruled Bornu from Dikwa as a military state. France, which claimed the Chad basin, declared him a usurper: his army destroyed a French column at Togbao in July 1899 and held off another at Kouno in October, but on 22 April 1900 three French columns, from the Congo, the Niger and Algeria, joined at Kousséri and defeated him; Rabih and the French commander, Amédée-François Lamy, were both killed. Rabih’s son Fadlallah fought on in the British sphere until he was killed at Gujba in August 1901. Rabih is remembered in Bornu and southern Chad for depopulation and devastation, and by others as one of the last great opponents of French rule in Africa."
