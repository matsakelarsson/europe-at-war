        text: Capital of Baguirmi, taken and burnt by Rabih; Gaourang II fled south.
        lonlat: [16.167, 11.400]
      - kind: taken
        side: rb
        name: Karnak Logone (Logone-Birni)
        date: 1892 or 1893
