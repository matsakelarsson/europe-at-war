notes:
  - "Rabih’s own state left few records; the main sources are the reports of French officers, above all Émile Gentil’s book La chute de l’empire de Rabah, British reports from Nigeria, and the traditions of Bornu, Baguirmi and the peoples of the south, collected much later. Rabih’s birth date is uncertain (about 1835–1845), and dates in the 1880s are approximate."
  - "The fighting of 1893–1901 took place in lands that are now in north-eastern Nigeria and northern Cameroon as well as in Chad, then divided on paper between the British, German and French spheres; France fought in the German and British spheres without their consent, which Britain and Germany protested. Fort-Lamy, founded across the Chari from Kousséri on 29 May 1900, became N’Djamena in 1973."
