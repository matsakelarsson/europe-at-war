  - title: Kousséri
    date: January – April 1900
    when: "1900-04-22"
    borders: "1900-04-22"
    countries: [td, cm, ne]
    body:
      - France sent two more columns to meet Gentil at Lake Chad. The Foureau–Lamy mission crossed the Sahara from Algeria by Aïr and Zinder; the Central Africa mission came from the Niger, under Lieutenants Joalland and Meynier after its first leaders, Voulet and Chanoine, had been killed. On the way Lamy’s column met Sanda Kura of the al-Kanemi family, and the French invested him as shehu of Bornu on 14 January 1900, which gave them a claim to fight Rabih in lands assigned to Germany. From a camp on the Chari set up on 24 February, the joint French and Bornu force crossed the river and took Rabih’s fortress of Kousséri, at the meeting of the Chari and the Logone, and Gentil’s column arrived on 20 or 21 April.
      - On 22 April Lamy, with about 700 French troops and some 800 Baguirmi riflemen and horsemen, attacked Rabih’s fortified camp at Lakhta, about five kilometres from Kousséri. After a few hours Rabih’s army broke. Lamy was mortally wounded; Rabih was shot as he fled and killed by a former soldier of his own, who cut off his head and brought it to the dying Lamy. The French lost 28 dead and 75 wounded, Rabih’s side between 1,000 and 1,500 dead, among them women and children with the army. Rabih’s head was displayed on a pike at Kousséri, and his skull was sent to Paris as a trophy. On 29 May Gentil founded Fort-Lamy across the river.
    facts:
      - [Sanda Kura invested as shehu, "14 January 1900"]
      - [French columns meet, "20–21 April 1900"]
      - [Battle of Kousséri, "22 April 1900"]
      - [Losses, "French 28 dead; Rabih’s side 1,000–1,500 dead"]
    markers:
      - kind: battle
        side: fr
        name: Kousséri
        date: 22 April 1900
        text: The three French columns and their Baguirmi and Bornu allies stormed Rabih’s camp at Lakhta nearby; Rabih and Lamy were both killed. Fort-Lamy was founded across the Chari on 29 May.
        lonlat: [15.033, 12.083]
      - kind: event
        side: fr
        name: Zinder
        date: late 1899
        text: The Foureau–Lamy mission from Algeria and the Central Africa mission met here before marching to Lake Chad.
        lonlat: [8.988, 13.805]
    arrows:
