  - title: Baguirmi
    date: 1891–1893
    when: "1892"
    borders: "1893-01-01"
    countries: [td, cm]
    body:
      - To avoid the French in the south and to reach the rich farmland around Lake Chad, Rabih led his army north into Baguirmi, the sultanate on the lower Chari whose king, the mbang Gaourang II, at first received him in friendship. Relations soon broke down. Rabih drove Gaourang from his capital, Massenya, and burnt it; in 1892 he defeated a joint army of Baguirmi and Wadai, its overlord, and Gaourang retreated to the south and later turned to the French for help.
      - Rabih then subdued the walled towns of the Kotoko along the Chari and the Logone, vassals of Bornu, without much resistance, though the kingdom of Mandara in the hills to the west threw back his attacks. In 1892 or 1893 he seized Karnak Logone (Logone-Birni), a strong fortress whose people he drove out, and made it his base for the attack on Bornu. Gaourang had asked the shehu of Bornu, Ashimi, for help; Ashimi sent none and tried only to stop the sale of arms to Rabih.
    facts:
      - [Massenya burnt, "1892 or 1893"]
      - [Baguirmi and Wadai defeated, "1892"]
    markers:
