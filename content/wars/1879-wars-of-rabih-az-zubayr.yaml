  - title: Fadlallah
    date: April 1900 – August 1901
    when: "1901-08-23"
    borders: "1901-08-23"
    countries: [ng, cm, td]
    body:
      - The council elected Rabih’s son Fadlallah, then under 25, as emir. He abandoned Dikwa at the French approach, was beaten at Dagumba, south of the town, at the start of May 1900 and again on 9 May by a French party under René Reibell, and withdrew up the Yedseram valley; the French installed Sanda Kura at Dikwa. By July Fadlallah had gathered nearly 5,000 men again near Mubi. He wrote to the British, who allowed him into their sphere, and in November and December 1900 he took Maiduguri, retook Dikwa and defeated the French-backed shehu Abubakar Garbai at Ngala, freeing the Hausa among his prisoners as British subjects.
      - The French occupied Dikwa again on 31 December, and Fadlallah moved west into the British sphere, raiding for food for a following of nearly 10,000. In June 1901 a British officer, Major Augustus McClintock, visited him and planned to recommend him as emir of Bornu under British protection. But on 23 August 1901 a French column under Captain Dangeville surprised his camp at Gujba, deep in the British sphere, and Fadlallah was shot dead; the French dug up his body and displayed his head at Dikwa. His brother Muhammad Niebe and sister Hawwa surrendered. Britain and Germany protested, and Bornu was divided among the three colonial powers, with the al-Kanemi shehus restored under their rule.
    facts:
      - [Fadlallah emir, "April 1900"]
      - [Dikwa retaken by Fadlallah, "30 November 1900"]
      - [Fadlallah killed at Gujba, "23 August 1901"]
