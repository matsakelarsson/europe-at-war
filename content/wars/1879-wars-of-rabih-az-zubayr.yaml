  - title: The conquest of Bornu
    date: May 1893 – March 1894
    when: "1893-10-02"
    borders: "1894-03-01"
    countries: [ng, cm, ne, td]
    body:
      - In the summer of 1893 Rabih’s army, about 3,000 men, half of them with firearms, entered Bornu and camped at Amja. Bornu was the oldest empire of the central Sudan, ruled since the 1840s by the al-Kanemi shehus from Kukawa. At Amja in May 1893 Rabih placed his flank behind a swamp; the shehu’s general Momman Tahr, whose army may have numbered 30,000, sent his cavalry through it, and the horses stuck fast under Rabih’s rifles. Tahr was captured and executed. In about August the shehu Ashimi himself was beaten at Lekarawa and fled. Rabih’s men sacked Kukawa, killing about 3,000 people and carrying off 4,000 as captives with great booty, and Rabih moved his capital to Dikwa.
      - The courtiers deposed Ashimi in favour of his nephew Kyari, who had his uncle killed and led a new army against Rabih. Near Gashegar on the Yobe, in February or March 1894, Kyari overran Rabih’s camp, but Rabih counter-attacked in the night and routed the Bornu army; Kyari was captured and his throat was cut. His brother Sanda Wuduroma was captured and executed within a month. Rabih now ruled Bornu as a military dictatorship with his council of commanders, and levied a heavy yearly tax of one Maria Theresa thaler a head; farming collapsed under raids, scorched earth and the flight of the people, and the old trade across the Sahara came to a halt.
    facts:
      - [Battle of Amja, "May 1893"]
      - [Kukawa sacked, "1893"]
      - [Battle of Gashegar and death of Kyari, "February–March 1894"]
      - [Rabih’s army, "about 35,000 men in garrisons, with a core of 3,000 riflemen at Dikwa"]
