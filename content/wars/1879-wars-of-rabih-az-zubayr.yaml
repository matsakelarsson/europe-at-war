steps:
  - title: From the Bahr el-Ghazal to Dar al-Kuti
    date: 1879–1891
    when: "1879"
    borders: "1885-01-01"
    countries: [ss, sd, cf, td]
    body:
      - Rabih was born about 1840 at Halfaya near Khartoum, of Nilotic origin, and was enslaved as a child. After some years in the Egyptian army he joined the household of al-Zubayr Rahma Mansur, the Ja’ali trader whose fortified camps (zaribas) dominated the ivory and slave trade of the Bahr el-Ghazal and who conquered Darfur for Egypt in 1874. When al-Zubayr was detained in Cairo, his son Suleiman took command, and Rabih became one of his chief officers. In 1878 Suleiman was driven into revolt by the new governor-general of the Sudan, Charles Gordon; Gordon’s lieutenant Romolo Gessi defeated him with difficulty, and in 1879 Suleiman and the officers who surrendered were executed.
      - Rabih, who did not trust the government’s word, escaped west with about 400 men. His officers elected him their emir. For the next twelve years he lived by war in the lands that are now the Central African Republic and southern Chad, raiding the Azande and later the Sara for captives and ivory, building zaribas (in 1882–1884) and offering prisoners their lives and freedom if they joined his army. By the early 1890s he had about 5,000 men and 44 light field guns, and in 1887 he declared his allegiance to the Mahdist state in the Sudan. In 1890 he stayed in Dar al-Kuti and Dar Runga, on the southern borders of Wadai, until a Wadai army defeated him; in 1891 his lieutenant Muhammad al-Sanusi of Dar al-Kuti destroyed the French expedition of Paul Crampel.
    facts:
      - [Rabih elected emir, "1879"]
      - [Allegiance to the Mahdist state, "1887"]
      - [Crampel expedition destroyed, "1891"]
