id: basotho-gun-war
name: Basotho Gun War
start: "1880-09-13"
end: "1881-04-29"
tier: C
summary: "The war in which the Basotho resisted the Cape Colony’s attempt to disarm them, and kept their guns. Basutoland, a British protectorate since 1868, had been annexed to the Cape in 1871. Many Basotho had bought rifles with wages earned at the Kimberley diamond fields, and to them guns meant the defence of their land and cattle and the standing of grown men. In 1879 the Cape doubled the hut tax, crushed the rising of the Baphuthi chief Moorosi in the south and announced that the Quthing district would be opened to white settlement; Gordon Sprigg’s government extended the Peace Preservation Act of 1878 to Basutoland, and in 1880 ordered all firearms handed in for compensation. Most chiefs refused. The paramount chief Letsie I stayed formally loyal; his son Lerotholi led the resistance in the south and besieged the magistracy at Mafeteng, and Letsie’s brother Masopha held Thaba Bosiu and blockaded Maseru, while Jonathan Molapo in the north sided with the government against his kinsman Joel Molapo. Cape forces, the Cape Mounted Riflemen, yeomanry and burgher volunteers under Brigadier-General Charles Clarke and Lieutenant-Colonel Frederick Carrington, entered Basutoland on 13 September 1880, but the Basotho, mounted and armed with rifles, fought them to a standstill: at Qalabane on 19 October 1880 Lerotholi’s horsemen cut up a Cape column. The Cape spent about £3 million and lost some 94 men killed. On 29 April 1881 the High Commissioner, Sir Hercules Robinson, gave an award that let the Basotho keep their guns on payment of a licence fee, with a fine in cattle and an amnesty, and Quthing remained Basotho land. Unrest continued, and in 1884 the Cape handed Basutoland back to the Crown, which ruled it as a High Commission territory; that is why Lesotho was not included in the Union of South Africa in 1910 and became independent in 1966."
