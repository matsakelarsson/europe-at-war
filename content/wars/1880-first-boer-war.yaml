  - title: Peace and the Pretoria Convention
    date: March – October 1881
    when: "1881-03-06"
    borders: "1881-03-23"
    countries: [za, gb]
    body:
      - "Colley’s successor, Sir Evelyn Wood, agreed an armistice with Joubert on 6 March 1881, and on 23 March, after talks at O’Neil’s Cottage below Majuba, he and Kruger, Joubert and Pretorius signed a peace agreement. Gladstone’s cabinet had no wish to fight a long war for a colony annexed by its predecessors, and it feared a rising of Afrikaners in the Cape Colony and the Orange Free State, which had openly sympathised with the Transvaal. Some of the besieged garrisons heard of the peace only weeks later; Marabastad held out until 2 April."
      - "A royal commission worked out the terms, set down in the Pretoria Convention, signed on 3 August 1881 and ratified by the Volksraad on 25 October. The Transvaal State received complete self-government under the suzerainty of Queen Victoria; Britain kept control of its relations with foreign states and with the African peoples beyond its borders, and a British Resident was to watch over the treatment of the African population, much of which had paid taxes to the British administration and feared the return of Boer rule. The republic’s government took office in Pretoria again on 8 August 1881. By the London Convention of 27 February 1884 the name South African Republic was restored and suzerainty dropped, leaving Britain only a veto over its treaties."
      - "For the Boers the victory became a founding story of Afrikaner nationalism. For many in Britain it was a humiliation, and “Remember Majuba” was a soldiers’ cry in the Second Boer War of 1899–1902, which began after gold had been found on the Witwatersrand in 1886 and turned the small republic into the richest state in southern Africa."
    facts:
      - [Armistice, "6 March 1881"]
      - [Peace agreement at O’Neil’s Cottage, "23 March 1881"]
      - [Pretoria Convention, "signed 3 August 1881, ratified 25 October 1881"]
      - [London Convention, "27 February 1884"]
