id: first-boer-war
name: First Boer War
start: "1880-12-16"
end: "1881-03-23"
tier: B
summary: "The short war in which the Boers of the Transvaal won back the independence of the South African Republic, which Britain had annexed in 1877. After three years of petitions, a mass meeting at Paardekraal proclaimed the republic restored in December 1880 under a triumvirate of Paul Kruger, Piet Joubert and Marthinus Wessel Pretorius. Boer commandos besieged the seven small British garrisons in the Transvaal, destroyed a column of the 94th Regiment at Bronkhorstspruit on 20 December, and held the Natal border against the relief force of Major-General Sir George Colley, beating it at Laing’s Nek (28 January 1881) and Schuinshoogte (8 February) and killing Colley on Majuba Hill on 27 February. Gladstone’s government made peace on 23 March 1881. By the Pretoria Convention of August 1881 the Transvaal became self-governing under British suzerainty, which the London Convention of 1884 reduced to a British veto on its treaties. Some 400 British soldiers and about 40 Boers were killed. Afrikaners call it the First War of Independence."
countries: [za, gb]
sides:
  - id: boer
    name: Transvaal Boers (the restored South African Republic)
    polities: [transvaal-boers]
    ink: orange
    moves: Boer moves
    success: Boer success
  - id: brit
    name: Britain (the British Transvaal and Natal)
    polities: [united-kingdom, transvaal, natal]
    ink: red
    moves: British moves
    success: British success
notes:
  - "The Transvaal had been the South African Republic (Zuid-Afrikaansche Republiek) until its annexation on 12 April 1877; the base map shows it as the British Transvaal until the restoration of self-government in August 1881. The Pretoria Convention called it the Transvaal State; the London Convention of 1884 restored the old name."
  - "Casualty figures differ between sources. Those given here follow the regimental returns used in the battle articles cited; Wikipedia’s summary gives 409 British soldiers killed and 359 wounded in the whole war, and 43 Boers killed and 58 wounded."
