steps:
  - title: Annexation and revolt
    date: April 1877 – December 1880
    when: "1880-12-16"
    borders: "1880-12-16"
    countries: [za, gb]
    body:
      - "On 12 April 1877 Sir Theophilus Shepstone read a proclamation in Church Square, Pretoria, annexing the South African Republic to the British Empire. The colonial secretary, Lord Carnarvon, wanted to unite the colonies, republics and African kingdoms of South Africa in a confederation under British rule, and the republic, bankrupt and unable to subdue the Pedi kingdom of Sekhukhune, offered no armed resistance. British troops defeated the Zulu kingdom and the Pedi in 1879, removing the threats that had been used to justify the annexation. Paul Kruger led two delegations to London, the second with a petition signed by more than 6,500 Boers, and the Boers hoped that William Gladstone, who had condemned the annexation in opposition, would undo it when he took office in April 1880; he did not."
      - "The administrator, Sir Owen Lanyon, pressed for taxes. In November 1880 Piet Bezuidenhout of Potchefstroom refused to pay a charge on his wagon, and on 11 November about 100 armed burghers under Piet Cronjé took the seized wagon back from the sheriff’s auction. From 8 December some 8,000–10,000 Boers gathered at Paardekraal, near today’s Krugersdorp. They chose a triumvirate of Kruger, Piet Joubert and Marthinus Wessel Pretorius, proclaimed the republic restored on 13 December, and on 16 December, the anniversary of Blood River, raised its flag, the Vierkleur, at Heidelberg, the provisional capital. The first shots of the war were exchanged that day at Potchefstroom, where Cronjé’s commando besieged the British fort."
      - "On 20 December 1880 a column of the 94th Regiment under Lieutenant-Colonel Philip Anstruther, marching from Lydenburg to reinforce Pretoria with a long wagon train, was stopped at Bronkhorstspruit by a commando under Frans Joubert. Anstruther refused to turn back, and in a few minutes of firing 157 of his soldiers were killed or wounded, by the count of most historians; the Boers lost one or two killed and four or five wounded. Anstruther died of his wounds. The British garrisons at Pretoria, Potchefstroom, Rustenburg, Lydenburg, Marabastad, Standerton and Wakkerstroom, about 1,800 soldiers in all, were cut off. The Boers did not try to storm them, but starved them: the fort at Potchefstroom surrendered after 95 days, on 21 March 1881."
    facts:
      - [Annexation of the Transvaal, "12 April 1877"]
      - [Republic proclaimed restored, "13 December 1880 (flag raised at Heidelberg on 16 December)"]
      - [Battle of Bronkhorstspruit, "20 December 1880; 157 British soldiers killed or wounded"]
      - [Besieged British garrisons, "seven, about 1,800 soldiers"]
