  - title: Laing’s Nek, Schuinshoogte and Majuba
    date: January – February 1881
    when: "1881-01-28"
    borders: "1881-01-28"
    countries: [za, gb]
    view:
      center: [29.88, -27.585]
      size: [60, 56]
    body:
      - "Colley, governor of Natal and commander in south-eastern Africa, gathered the Natal Field Force, about 1,200 soldiers, at Newcastle to march to the relief of the garrisons. Piet Joubert’s commandos held Laing’s Nek, the pass over the Drakensberg by which the road from Natal entered the Transvaal. On 28 January 1881 Colley attacked: the 58th Regiment advanced uphill in close order, carrying its colours (the last time a British regiment did so in battle), and was shot down by Boers firing from cover. The British lost 84 killed and 113 wounded; the Boers reported 14 killed and 27 wounded."
      - "On 8 February Colley led about 300 men south to clear the road to Newcastle and was attacked by Boers under Nicolaas Smit on the ridge of Schuinshoogte above the Ingogo River. After a day of fighting in heavy rain the survivors withdrew across the swollen river at night, having lost 66 killed and 77 wounded; the Boers lost 8 killed. Peace feelers were already passing between Kruger, the British government and President Jan Brand of the Orange Free State, and on 21 February Colley sent the Boers terms with 48 hours to reply."
      - "Before Kruger’s answer reached him, Colley led some 550 soldiers and sailors by night up Majuba Hill, leaving parties on the way, so that about 400 reached the summit, which overlooked the Boer camps at Laing’s Nek. At dawn on 27 February the Boers saw them on the summit. While marksmen kept the British under fire, storming parties under Nicolaas Smit, Stephanus Roos, Joachim Ferreira and D. J. K. Malan worked their way up the slopes and overran the hilltop. The British lost 92 killed, 134 wounded and 59 taken prisoner; Colley was shot dead. The Boers lost one man killed and five wounded, one of whom died."
    facts:
      - [Battle of Laing’s Nek, "28 January 1881"]
      - [Battle of Schuinshoogte (Ingogo), "8 February 1881"]
      - [Battle of Majuba Hill, "27 February 1881; Colley killed"]
      - [British losses at Majuba, "92 killed, 134 wounded, 59 captured"]
