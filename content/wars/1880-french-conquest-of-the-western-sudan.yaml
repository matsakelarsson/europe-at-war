id: french-conquest-of-the-western-sudan
name: French conquest of the Western Sudan
start: "1880"
end: "1898-09-29"
tier: A
summary: "The campaigns by which France took the lands between the upper Senegal and the Niger bend, today’s Mali, which it called the Western or French Sudan. From the colony of Senegal, officers of the marine troops led by Gustave Borgnis-Desbordes, Joseph Gallieni and Louis Archinard pushed a line of forts from Kayes to Kita (1881) and Bamako (1883), on the route of a planned railway to the Niger, often ahead of orders from Paris. The states in their way were the Toucouleur Empire of Ahmadu Tall, the son of Umar Tall, at Ségou and Nioro; the Wassoulou Empire of Samori Touré to the south; and smaller kingdoms and chiefdoms that made treaties with one side or the other. After a decade of treaties made to buy time on both sides, Archinard took Koundian (1889), Ségou (1890) and Nioro (1891), and in 1893 Djenné and Bandiagara, driving Ahmadu into exile. A column reached Timbuktu in December 1893, where the Tuareg destroyed Eugène Bonnier’s column in January 1894. The conquest ended with the storming of Sikasso, capital of Kénédougou, on 1 May 1898 and the capture of Samori in September. The armies that won it were mostly African, Senegalese tirailleurs and allied or conscripted auxiliaries under French officers; captives were distributed among the victors, and the violence of Archinard’s campaigns was criticised in France at the time."
countries: [ml, sn, gn, bf, ci]
