  - title: Archinard takes Ségou
    date: February 1889 – 1890
    when: "1890-04-06"
    borders: "1890-04-06"
    countries: [ml]
    body:
      - Louis Archinard, commander of the Upper River from 1888, had no patience with treaties. In February 1889 he destroyed the Toucouleur fortress of Koundian on his own initiative, and on 6 April 1890 he took Ségou, the capital of the Toucouleur Empire, where Ahmadu’s son Madani commanded. French artillery kept the defenders from manning the walls. Archinard sent more than 400 manuscripts from Ahmadu’s library to France, where they are now in the national library, took one of Ahmadu’s young sons, Abdoulaye, as a prisoner to France, and gave away women of the court to his officers. The Toucouleur fortresses of Ouossébougou, which resisted fiercely, and Koniakary fell soon after.
      - Archinard ruled Ségou through Bamana and other client kings, among them Mademba Sy, a Senegalese in French service whom he made faama of Sansanding. Ahmadu, cut off at Nioro, allied himself with the exiled Wolof king Alboury Ndiaye and with Samori. A Toucouleur attempt to retake Koniakary in September 1890 failed.
    facts:
      - [Koundian destroyed, "February 1889"]
      - [Ségou taken, "6 April 1890"]
      - [French Sudan created, "18 August 1890"]
    markers:
