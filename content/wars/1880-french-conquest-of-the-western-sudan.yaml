  - title: Djenné and Bandiagara
    date: March 1892 – May 1893
    when: "1893-04-29"
    borders: "1893-05-04"
    countries: [ml]
    body:
      - The Bamana of the Ségou country, who had fought Ahmadu for decades, soon resented French rule and the demands of the French and their client kings. In March 1892 Bamana and Toucouleur forces together besieged Sansanding. Archinard answered with a campaign down the Niger in 1893. Djenné refused to renounce Ahmadu and was bombarded; Archinard entered it on 12 April 1893. He then took Mopti, broke the Toucouleur line on the plateau at Kori-Kori and entered Bandiagara on 29 April.
      - On 4 May 1893 Archinard installed Ahmadu’s brother Aguibou, who had gone over to the French, as sultan of Massina at Bandiagara. Ahmadu refused an offer of a comfortable retirement and retreated east with Alboury Ndiaye into what is now Niger; he reached the lands of the Sokoto Caliphate and died at Maykouki in 1897, and Alboury was killed at Dosso in 1901. Archinard was replaced at the end of 1893 by a civilian governor, Albert Grodet, as Paris tried to rein in its soldiers.
    facts:
      - [Sansanding besieged, "March 1892"]
      - [Djenné taken, "12 April 1893"]
      - [Bandiagara taken, "29 April 1893"]
      - [Aguibou installed as sultan of Massina, "4 May 1893"]
