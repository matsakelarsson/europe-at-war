  - title: Timbuktu and the Tuareg
    date: December 1893 – February 1894
    when: "1894-01-15"
    borders: "1894-01-15"
    countries: [ml]
    body:
      - Timbuktu, the old scholarly and trading city on the edge of the desert, was under the protection of the Tuareg of the Niger bend, above all the Tengeregif and the Kel Antessar. Colonel Eugène Bonnier, Archinard’s successor as military commander, set out from Ségou on 26 December 1893 against the orders of the new civilian governor, with about 200 tirailleurs in a canoe flotilla; Major Joseph Joffre followed overland with 400 men and a battery. Ahead of them, Lieutenant Boiteux had gone down the river with two gunboats to Kabara, the port of Timbuktu, and walked into the city with a few men; meanwhile Tuareg attacked his boats at Kabara and killed about seventeen of his men.
      - Bonnier reached Kabara on 10 January 1894 and occupied Timbuktu. Two days later he marched west towards Goundam and raided Tuareg camps, carrying off more than 500 animals. Before dawn on 15 January the Tengeregif under their chief Chebboun attacked his camp at Tacoubao, some way from the city, and killed Bonnier, 13 other French officers and NCOs and about 70 tirailleurs and auxiliaries. Joffre reached Timbuktu in February, recovered the bodies and raided the Tuareg in turn, killing more than a hundred and taking 1,500 cattle by his own account. The Tuareg of the Niger bend resisted the French for years afterwards.
    facts:
      - [Boiteux reaches Kabara, "December 1893"]
      - [Bonnier’s column destroyed at Tacoubao, "15 January 1894"]
      - [French losses at Tacoubao, "about 84 of 95 men"]
    markers:
      - kind: taken
        side: fr
        name: Timbuktu
        date: December 1893 – January 1894
        text: Entered by Boiteux’s men and occupied by Bonnier on 10 January 1894. On 15 January the Tengeregif Tuareg destroyed Bonnier’s column at its camp at Tacoubao, outside the city; Joffre’s column arrived in February.
        lonlat: [-3.009, 16.776]
      - kind: event
        side: fr
        name: Mopti
        date: December 1893
        text: Boiteux went on from here with the gunboats instead of waiting for Bonnier.
        lonlat: [-4.199, 14.496]
        lp: l
