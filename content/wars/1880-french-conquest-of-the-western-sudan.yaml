steps:
  - title: Gallieni’s mission and the fort at Kita
    date: 1878–1881
    when: "1881-02-07"
    borders: "1881-02-07"
    countries: [ml, sn]
    body:
      - In the late 1870s French governors of Senegal revived Faidherbe’s plan of a railway from the Senegal to the Niger, which would draw the trade of the western Sudan to French ports. In September 1878 Governor Louis Brière de l’Isle sent a column under Colonel Reybaud that stormed Sabouciré on the Senegal, capital of the small Malinke kingdom of Logo, and killed its king, Niamody Sissoko, an ally of the Toucouleur; in 1879 the French built a post at Bafoulabé, where the Bafing and the Bakoye meet. In 1880 Captain Joseph Gallieni was sent to the Toucouleur ruler Ahmadu Tall at Ségou, signing treaties with the chiefs on the way, including one for a fort at Kita. On 11 May 1880 his party was attacked and plundered at Dio by Bamana of Beledougou, who were in revolt against Ahmadu and suspicious of the French.
      - Ahmadu kept Gallieni waiting for months at Nango, near Ségou, and gave him the Treaty of Nango on his own terms, by which France recognised the Toucouleur Empire and its borders, promised it cannon and rifles and kept only its post at Bafoulabé and the right to trade. Paris never ratified it. Meanwhile Lieutenant-Colonel Gustave Borgnis-Desbordes, named commander of the Upper River in September 1880, marched from Bafoulabé and occupied Kita on 7 February 1881. Within weeks he destroyed the village of Goubanko nearby, against orders, and the post at Kayes became the base of the new territory.
    facts:
      - [Sabouciré stormed, "September 1878"]
      - [Gallieni attacked at Dio, "11 May 1880"]
      - [Treaty of Nango, "1880 (never ratified by France)"]
      - [Kita occupied, "7 February 1881"]
