  - title: Sikasso and the end of Samori
    date: "1898"
    when: "1898-05-01"
    borders: "1898-05-01"
    countries: [ml, bf, ci, gn]
    body:
      - Kénédougou, the Senufo kingdom of the Traoré dynasty with its capital at Sikasso, had been France’s ally against Samori, who besieged Sikasso for fifteen months in 1887–1888 and failed. Its king Tieba even rode with Archinard to Ségou in 1890. His brother Babemba, king from 1893, kept the alliance but refused to accept a French garrison; in early 1898 he expelled a French mission and stopped paying the yearly tribute, and according to French reports his men attacked the mission on its way back.
      - The French opened an artillery bombardment on the walls of Sikasso, the great tata built by Tieba, on 15 April 1898. The defenders’ sorties could not drive them off, and the city fell on 1 May after house-to-house fighting. Babemba, wounded in the citadel, ordered his guards to kill him rather than be taken. Sikasso was sacked, and about 4,000 captives were shared out as slaves among the victors, African and European. With Kénédougou gone, French columns closed in on Samori, who was captured at Guélémou in the forest of what is now western Côte d’Ivoire on 29 September 1898.
    facts:
      - [Siege of Sikasso, "15 April – 1 May 1898"]
      - [Captives taken at Sikasso, "about 4,000"]
      - [Samori captured, "29 September 1898"]
    markers:
      - kind: siege
        side: fr
        name: Sikasso
        date: 15 April – 1 May 1898
        text: Capital of Kénédougou, stormed after a two-week bombardment; Babemba had himself killed rather than be captured.
        lonlat: [-5.667, 11.317]
      - kind: event
        side: fr
