  - title: Mourgoula, Bamako and the first clash with Samori
    date: 1882–1883
    when: "1883-02-01"
    borders: "1883-04-12"
    countries: [ml, gn]
    body:
      - In February 1882 Borgnis-Desbordes crossed the Niger to relieve Kéniéran, a town allied to the French that the army of Samori Touré had besieged and sacked; Samori’s horsemen harried his column back to the river after a battle at Samaya, and the long war between France and Samori had begun. In Paris, the navy minister Jauréguiberry won funds for the railway in March 1882 and ordered the occupation of Bamako. On 22 December 1882 Borgnis-Desbordes forced the Toucouleur commander Almamy Abdallah out of the fortress of Mourgoula, which guarded the Birgo country south of Kita, and razed it.
      - His column of 542 men marched from Kayes in November 1882, fought at Daba in Beledougou on 16 January 1883 and reached Bamako, then a trading town of a few thousand people, on 1 February. The French built a fort and a telegraph line back to Kayes. In March Samori’s brother Fabu (Kebe Brema) came with about 3,000 men, cut the line and raided the villages that had sided with the French. Borgnis-Desbordes attacked his camp on the Woyowayanko, a few kilometres from Bamako, on 2 April and was driven back; on 12 April he turned the position and Fabu withdrew. The French now held a line of posts from the Senegal to the Niger, and the chiefs of Beledougou accepted their protection.
    facts:
      - [Mourgoula razed, "22 December 1882"]
      - [Bamako fort begun, "1 February 1883"]
      - [Battles of the Woyowayanko, "2 and 12 April 1883"]
