  - title: Mamadou Lamine and the treaties
    date: 1885–1888
    when: "1886-04-01"
    borders: "1887-05-12"
    countries: [sn, ml, gn]
    body:
      - In the mid-1880s the French had too few men to fight everyone at once, and Ahmadu and Samori had reasons of their own to make terms. In 1885 a French column tried to seize the Buré goldfields and was forced back by Samori, who signed the Treaty of Kéniéba-Koura on 28 March 1886, accepting the Niger below Siguiri as his border. Ahmadu, fighting a rebellion by his brother Muntaga at Nioro, signed the Treaty of Gori on 12 May 1887, which made his empire a nominal French protectorate and reopened the arms trade. Neither side expected these treaties to last.
      - The more urgent threat came from Mamadou Lamine Drame, a Soninke Tijani scholar from near Kayes who had returned from Mecca and been imprisoned and then released by the Toucouleur. Many Soninke communities, resentful of French taxes and requisitions, joined him. In February 1886 he took Boulibane, capital of the French-allied state of Bundu, and from 1 to 4 April he besieged the French fort at Bakel until reinforcements from Kayes drove him off; French columns with Toucouleur and Moorish auxiliaries then burned about a hundred villages in the area. Gallieni, back as commander from October 1886, burned Lamine’s base at Diana on 26 December 1886 and took Toubakouta on 8 December 1887. Lamine escaped but was caught by the forces of Musa Molo of Fuladu, a French ally, and died of his wounds on 9 December 1887. His son Souaïbou, besieged by Ahmadu in the fort of Gori, fled and was executed.
    facts:
      - [Treaty of Kéniéba-Koura with Samori, "28 March 1886"]
      - [Siege of Bakel, "1–4 April 1886"]
      - [Treaty of Gori with Ahmadu, "12 May 1887"]
      - [Death of Mamadou Lamine, "9 December 1887"]
