  - title: Nioro and Youri
    date: December 1890 – 1891
    when: "1891-01-03"
    borders: "1891-01-03"
    countries: [ml, sn]
    body:
      - In December 1890 Archinard marched on Nioro. His artillery scattered the army of Ahmadu’s brother Bassirou at Niogomera on 23 December, Ahmadu evacuated the city, and the French entered it on 1 January 1891. On 3 January Alboury Ndiaye led Ahmadu’s army in a last stand at Youri, where French machine guns cut it down. Ahmadu retreated east to Bandiagara, where he took over from his brother Mounirou, who had succeeded Tidiani.
      - The campaigns of 1891 were remembered for their brutality. Archinard’s own reports and the French press described summary executions and beheaded bodies, and his methods were criticised in France. In April 1891 he turned south against Samori and took Kankan, beginning the second war against the Wassoulou Empire.
    facts:
      - [Battle of Niogomera, "23 December 1890"]
      - [Nioro taken, "1 January 1891"]
      - [Battle of Youri, "3 January 1891"]
      - [Kankan taken from Samori, "11 April 1891"]
