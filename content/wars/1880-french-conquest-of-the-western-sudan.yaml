notes:
  - "The French territory was called Upper River (Haut-Fleuve) or Upper Senegal from 1880, French Sudan (Soudan français) from 18 August 1890, with Kayes as its capital, and later Upper Senegal and Niger (1904) before it became French Sudan again in 1921 and Mali in 1960. Its commanders answered to the navy ministry in Paris and often acted against the wishes of the governors of Senegal and of the ministry itself."
  - "Most of the record comes from French officers’ reports and memoirs, which inflate enemy numbers and play down the cost to the people of the region; the traditions of the Bamana, Fulbe, Soninke, Malinke and Senufo give other views. Samori’s war with France is told in more detail in the Mandingo Wars."
