  - title: The southern rising
    date: June – December 1881
    when: "1881-06-27"
    borders: "1881-10-26"
    countries: [tn, fr]
    body:
      - Once the protectorate was signed, the south and centre of the regency rose against the French and against the bey who had accepted them. Sfax rose on 27 June. The tribes of the south and the steppe, the Neffat under their qaid Ali ben Khalifa among them, and in the west the Ouled Ayar under Ali ben Ammar, joined the rising, which spread to the country around Kairouan, the holy city of the interior. French warships bombarded Sfax, and on 16 July marines stormed it after four hours of street fighting. Fighting spread to Gabès and the coast, Le Kef was besieged, and a French column near Hammamet was harassed for days in late August.
      - In the autumn France sent a second, much larger expedition. Tunis itself was occupied on 7 October to reassure the Europeans. Three columns, from Tunis, from Sousse on the coast and from Tébessa in Algeria, converged on Kairouan, which surrendered without a fight on 26 October. Ali ben Ammar’s forces were routed, and the last fighting ended in December. Ali ben Khalifa and many of the tribes that had risen, with their families and herds, crossed into Ottoman Tripolitania.
      - After the death of Muhammad III as-Sadiq in 1882 his brother Ali III signed the conventions of La Marsa on 8 June 1883, by which the bey undertook to carry out the reforms France chose. A French resident-general governed in the bey’s name until independence in 1956.
