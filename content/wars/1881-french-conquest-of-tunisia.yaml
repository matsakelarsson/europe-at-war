id: french-conquest-of-tunisia
name: French conquest of Tunisia
start: "1881-04-24"
end: "1881-12"
tier: B
summary: "The French invasion that made Tunisia a protectorate. Using raids by the Kroumir tribes across the Algerian border as a pretext, France sent about 24,000 men from Algeria into north-western Tunisia on 24 April 1881 and landed another force at Bizerte on 1 May. On 12 May Muhammad III as-Sadiq, the bey of Tunis, signed the Treaty of Bardo, which gave France control of the regency’s foreign relations and the right to station troops. In June the south and centre rose against the occupation and the bey who had accepted it. French ships bombarded and stormed Sfax in July, a second, larger expedition took Kairouan without a fight in October, and the last resistance ended in December, while many of the tribes that had risen fled to Ottoman Tripolitania. The conventions of La Marsa in 1883 completed the protectorate, under which the beys reigned until 1957."
