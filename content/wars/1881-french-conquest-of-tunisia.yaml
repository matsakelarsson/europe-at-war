notes:
  - "Tunisia had been an Ottoman province governed by its own beys since the 1700s and was deep in debt to European creditors, who had controlled its finances through an international commission since 1869. At the Congress of Berlin in 1878 Britain and Germany let France understand that it could take Tunisia, and France moved partly to forestall Italy, which had many settlers there. The Ottoman Empire protested but could do nothing."
  - Losses in 1881 are not well recorded. French losses in battle were light, but many soldiers fell sick; Tunisian losses and the number of refugees who fled to Tripolitania are not known with any precision.
