steps:
  - title: The Kroumir pretext and the Treaty of Bardo
    date: March – May 1881
    when: "1881-04-24"
    borders: "1881-05-12"
    countries: [tn, dz, fr]
    body:
      - On 30–31 March 1881 men of the Kroumir tribes of the wooded mountains of north-western Tunisia clashed with the Ouled Nahd across the Algerian border. The government of Jules Ferry, which had long wanted Tunisia, presented the raids as a threat to Algeria and obtained credits from the Chamber for a punitive expedition. On 24 April about 24,000 men under General Forgemol de Bostquénard crossed into Tunisia through Kroumirie and from Sidi Youssef; Tabarka and Le Kef were taken on 26 April, and fighting in the Kroumir mountains lasted until late May.
      - The bey’s small army did not resist. On 1 May a second force of about 6,000 men under General Bréart landed at Bizerte and marched on Tunis. On the evening of 12 May, with French troops camped at La Manouba, Muhammad III as-Sadiq signed the Treaty of Bardo at his palace of Ksar Saïd, reportedly fearing that the French would otherwise replace him with his brother. The treaty let France occupy any points it chose, made its resident minister the bey’s channel to foreign powers and bound France to support the dynasty. Italy protested; Britain and Germany accepted it.
    facts:
      - [Border clashes, "30–31 March 1881"]
      - [Invasion from Algeria, "24 April 1881, about 24,000 men"]
      - [Landing at Bizerte, "1 May 1881"]
