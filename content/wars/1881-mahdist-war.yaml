  - title: The Mahdist State
    date: 1885–1892
    when: "1889-08-03"
    borders: "1889-08-03"
    countries: [sd, eg, et]
    body:
      - The Mahdi died at Omdurman on 22 June 1885, perhaps of typhus, and was buried under a great domed tomb. His chosen successor, the Khalifa Abdallahi ibn Muhammad, a Baggara of the Ta’aisha, ruled from Omdurman, which grew into the largest town in Sudan. Kassala and Sennar surrendered in the summer of 1885, completing the conquest of the north. The Khalifa built a state with a treasury, courts and an army of riflemen, relied more and more on his own Baggara kinsmen, and put down revolts among the riverain peoples, in Darfur and in the Nuba Mountains.
      - He also meant to carry the jihad abroad. An Anglo-Egyptian force beat a Mahdist army at Ginnis on the Egyptian frontier on 30 December 1885, after which the frontier stayed at Wadi Halfa. War with Ethiopia brought the sack of Gondar in 1888 and the battle of Gallabat on 9 March 1889, where Emperor Yohannes IV was killed and his army withdrew (see the Mahdist–Ethiopian War). In 1889 Abd al-Rahman al-Nujumi led about 6,000 fighters and their families down the Nile to invade Egypt; on 3 August, at Toski north of the frontier, Francis Grenfell’s Egyptian army killed al-Nujumi and about 1,200 of his men and captured 4,000.
      - Drought, locusts and war brought the great famine of 1888–1892, remembered in Sudan as the famine of the Year Six (1306 of the Islamic calendar). The Khalifa’s forced movement of the Baggara to Omdurman and the requisitions for his armies made it worse. Many hundreds of thousands are thought to have died of hunger and disease, but no count exists, and the British estimate that Sudan’s population fell from about 8 million to 2–3 million during the Mahdiyya is regarded by many historians as exaggerated.
    facts:
      - [Death of the Mahdi, "22 June 1885"]
      - [Battle of Ginnis, "30 December 1885"]
      - [Battle of Gallabat, "9 March 1889"]
      - [Battle of Toski, "3 August 1889"]
      - [Famine of the Year Six, "1888–1892"]
