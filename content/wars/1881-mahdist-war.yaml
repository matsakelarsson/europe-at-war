  - title: The railway to Abu Hamed
    date: March 1896 – September 1897
    when: "1896-09-23"
    borders: "1897-08-07"
    countries: [sd, eg, er, it]
    body:
      - In the 1890s the Mahdist State faced European empires on all sides. Italy, expanding from Eritrea, beat a Mahdist army at Agordat on 21 December 1893 and took Kassala on 17 July 1894. When the Ethiopians crushed the Italians at Adwa on 1 March 1896, Italy asked Britain for a diversion to relieve Kassala, and the British government, also wishing to keep France out of the Nile valley, let the Sirdar (commander) of the Egyptian Army, Herbert Kitchener, advance up the Nile.
      - Kitchener moved slowly and methodically. On 7 June 1896 his Egyptian and Sudanese battalions surprised the Mahdist garrison at Firket, killing about 1,000, and on 23 September they entered Dongola after the Mahdists withdrew. Gunboats carried on the Nile flood supported every move. Then, instead of following the great bend of the river, Kitchener had his Sudan Military Railway built straight across the Nubian Desert from Wadi Halfa to Abu Hamed, more than 300 km, laid by Egyptian and Sudanese labourers under the Canadian engineer Percy Girouard and supplied with water by train. A flying column under Archibald Hunter stormed Abu Hamed on 7 August 1897, and the Mahdists abandoned Berber. Italy handed Kassala to Egypt at the end of 1897.
    facts:
      - [Italians take Kassala, "17 July 1894"]
      - [Battle of Firket, "7 June 1896"]
      - [Dongola occupied, "23 September 1896"]
      - [Abu Hamed taken, "7 August 1897"]
    markers:
