  - title: The fall of Khartoum
    date: December 1884 – February 1885
    when: "1885-01-26"
    borders: "1885-01-26"
    countries: [sd, gb]
    body:
      - Wolseley’s army gathered at Korti on the great bend of the Nile at the end of 1884. To save time he split it. A River Column was to push upstream to Berber, while a Desert Column of about 1,800 picked men on camels under Herbert Stewart crossed the Bayuda desert to reach the Nile at Metemma and meet Gordon’s steamers there. On 17 January 1885 at the wells of Abu Klea several thousand Ansar attacked its square and briefly broke into it; the British lost 74 killed and the Mahdists about 1,100. Two days later, near Abu Kru (Gubat), the column fought its way to the river, and Stewart was mortally wounded. Four of Gordon’s steamers were waiting.
      - The steamers left for Khartoum on 24 January under Colonel Charles Wilson. By then the city was starving, and the falling White Nile had opened a gap in its defences near the Masalamiya gate. Before dawn on 26 January 1885 the Ansar stormed Khartoum. Gordon was killed at the governor’s palace, and the garrison and several thousand of the inhabitants were killed; women and children were enslaved. When Wilson’s steamers came in sight of the city on 28 January they found the Mahdi’s flags over it and turned back under fire.
      - The relief force withdrew. The River Column won a battle at Kirbekan on 10 February, where its commander, William Earle, was killed, and was then recalled; by mid-1885 the British had pulled back to the Egyptian frontier. Gordon’s death made him a hero in Britain and left a demand for revenge that shaped British policy for a decade.
    facts:
      - [Battle of Abu Klea, "17 January 1885"]
      - [Abu Kru, "19 January 1885"]
      - [Fall of Khartoum, "26 January 1885"]
      - [Wilson’s steamers reach Khartoum, "28 January 1885"]
