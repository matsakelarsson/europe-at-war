  - title: Umm Diwaykarat and the Condominium
    date: 1899
    when: "1899-11-24"
    borders: "1899-11-24"
    countries: [sd, gb, eg]
    body:
      - On 19 January 1899 Britain and Egypt signed the Condominium Agreement, under which Sudan was to be governed by a governor-general appointed by Egypt on Britain’s recommendation, flying both flags. In practice it was a British colony, and Kitchener was its first governor-general.
      - "The Khalifa still had several thousand followers in southern Kordofan. In November 1899 a column under Reginald Wingate caught him at Umm Diwaykarat in Kordofan, west of the White Nile, on 24 November (25 November in some accounts). After his last attack failed, the Khalifa and his chief emirs sat down on their sheepskins to await death and were shot where they sat. About 1,000 Ansar were killed or wounded and 3,000 captured. Osman Digna escaped and was caught in January 1900. In Darfur, Ali Dinar of the old Keira dynasty had already restored the sultanate, which kept its independence until 1916. Mahdist belief lived on: the Mahdi’s son Abd al-Rahman later led the Ansar as a religious and political movement, the base of the Umma party."
    facts:
      - [Condominium Agreement, "19 January 1899"]
      - [Battle of Umm Diwaykarat, "24 November 1899"]
      - [Osman Digna captured, "January 1900"]
