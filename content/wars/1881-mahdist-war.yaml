  - title: El Obeid and Shaykan
    date: September 1882 – December 1883
    when: "1883-11-05"
    borders: "1883-11-05"
    countries: [sd]
    body:
      - In the summer of 1882 the Mahdi came down from the mountains and laid siege to El Obeid, the capital of Kordofan. A direct assault on 8 September 1882 was beaten off with heavy losses, and he settled down to starve the town; Bara fell on 5 January 1883, and El Obeid surrendered in January 1883. Its arsenal gave the Ansar thousands of Remington rifles and some artillery, and many of the surrendered soldiers, Sudanese slave riflemen, joined the Mahdi as his musketeers, the jihadiyya.
      - The Egyptian government, now under British control, sent a new army under William Hicks, a retired officer of the Indian Army. It left Omdurman in September 1883 with about 8,000 regulars, 1,000 irregular cavalry, artillery, machine guns and 2,000 camp followers, many of its soldiers veterans of the Urabi revolt sent south in chains, and marched from the White Nile at Ed Dueim into the waterless country of Kordofan, harassed by Mahdist horsemen and, it was said, misled by its guides. On 3–5 November 1883, in the forest of Shaykan south of El Obeid, the Ansar surrounded and destroyed it. Hicks, his European officers and the journalist Edmund O’Donovan were killed; only a few hundred men escaped.
      - Shaykan made the Mahdi master of western Sudan. In December 1883 Rudolf Slatin, the Austrian governor of Darfur, surrendered and became a Muslim and a prisoner, and in April 1884 Frank Lupton in Bahr el-Ghazal did the same.
    facts:
      - [Siege of El Obeid, "September 1882 – January 1883"]
      - [Battle of Shaykan, "3–5 November 1883"]
      - [Hicks’s army, "about 9,000 soldiers; some 7,000 killed"]
