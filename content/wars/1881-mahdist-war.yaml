steps:
  - title: The Mahdi
    date: 1881–1882
    when: "1881-08-12"
    borders: "1881-08-12"
    countries: [sd, ss]
    body:
      - Sixty years of Egyptian rule had made many enemies. Taxes were collected by Turkish-speaking officials and irregular soldiers with the whip. Under Khedive Ismail, Europeans such as Charles Gordon, governor-general in 1877–1880, and Romolo Gessi had campaigned against the slave trade of the south, which ruined many northern Sudanese traders and the Baggara cattle nomads who took part in it; to devout Muslims the rule of Christians and of Turks who ignored Islamic law was itself an offence. Egypt’s bankruptcy in 1876, the deposition of Ismail in 1879 and the British occupation of Egypt in 1882 left the government in Khartoum weak and short of money.
      - Muhammad Ahmad ibn Abdallah, the son of a boat-builder from the Dongola reach and a teacher of the Sammaniyya Sufi order, lived on Aba Island in the White Nile. In 1881 he told his disciples that he was the Mahdi, and on 29 June he proclaimed it publicly, calling on Muslims to join a holy war against the “Turks”. On 12 August 1881 two companies of soldiers sent to arrest him landed on Aba Island; in the confusion they fired on each other, and his followers, armed mostly with spears and sticks, killed most of them.
      - "Like the Prophet, the Mahdi made a hijra, an emigration, to a refuge far from the government: Jebel Qadir in the Nuba Mountains of southern Kordofan, where he arrived in about November 1881. Baggara tribesmen flocked to him. On the night of 9 December 1881 Rashid Bey, the governor of Fashoda, attacked without orders with about 400 soldiers and 1,000 irregulars and was killed with most of his force; on 7 June 1882 a much larger army of about 4,000 under Yusuf al-Shallali was destroyed in a dawn attack. Each victory brought the Ansar captured rifles and new recruits, and seemed to prove the Mahdi’s claim."
    facts:
