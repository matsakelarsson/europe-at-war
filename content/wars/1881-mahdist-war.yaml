id: mahdist-war
name: Mahdist War
start: "1881-08-12"
end: "1899-11-24"
tier: A
summary: "The rising that ended Egyptian rule in Sudan, the Mahdist State that followed, and its conquest by an Anglo-Egyptian army. In 1881 Muhammad Ahmad, a Sufi teacher from Dongola, proclaimed himself the Mahdi, the guide expected to restore Islam before the end of time, and called for war against the “Turks”, the Egyptian government whose taxes, officials and campaigns against the slave trade had made it hated. His followers, the Ansar, destroyed the Egyptian forces sent against them, took El Obeid in January 1883 and annihilated William Hicks’s army at Shaykan in November. Britain, which had occupied Egypt in 1882, decided to give up Sudan and sent Charles Gordon to Khartoum to organise the withdrawal; he stayed, was besieged, and was killed when the Mahdists stormed the city on 26 January 1885, two days before a British relief force arrived. The Mahdi died that June, and his successor, the Khalifa Abdallahi, ruled the Mahdist State from Omdurman for thirteen years of war with Ethiopia, Egypt and Italy, and of famine. From 1896 Herbert Kitchener led an Egyptian and British army up the Nile, building a railway as it went; it destroyed the Mahdist army at Omdurman on 2 September 1898, and the Khalifa was killed at Umm Diwaykarat in November 1899. Sudan became an Anglo-Egyptian condominium. How many people died in the wars and famines of these years is unknown; contemporary British claims that the population fell by more than half are now thought exaggerated."
countries: [sd, ss, eg, et, er, gb]
sides:
