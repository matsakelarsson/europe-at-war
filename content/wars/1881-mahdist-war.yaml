  - title: Atbara and Omdurman
    date: April – September 1898
    when: "1898-09-02"
    borders: "1898-09-01"
    countries: [sd, gb, eg]
    body:
      - With British brigades added to his Egyptian army, Kitchener stood at the meeting of the Nile and the Atbara. The Khalifa’s general Mahmud Ahmad marched north with about 15,000 men but stopped and fortified a camp on the Atbara river near Nakheila. On 8 April 1898 Kitchener’s army stormed the camp, killing some 2,000 and capturing Mahmud. In the summer the railway was pushed on to the Atbara and gunboats were brought up for the advance on Omdurman.
      - Kitchener’s army of about 25,800 men, 8,200 of them British, with artillery, Maxim guns and a flotilla of gunboats, reached the plain of Kerreri north of Omdurman on 1 September. At dawn on 2 September 1898 the Khalifa’s army, perhaps 35,000–50,000 strong, attacked across the open plain and was mown down; a second attack on the Sudanese brigade of Hector MacDonald failed in the same way, and the 21st Lancers, with the young Winston Churchill among them, made a costly charge into a hidden gully. About 12,000 Ansar were killed, 13,000 wounded and 5,000 captured; the Anglo-Egyptian army lost 47 or 48 dead and 382 wounded. Many wounded Mahdists were killed where they lay, a fact criticised in Britain at the time. Kitchener entered Omdurman the same afternoon; the Mahdi’s tomb was destroyed on his orders and his remains thrown into the Nile.
      - The Khalifa escaped west into Kordofan. Kitchener went on up the White Nile to Fashoda, where on 18 September he met a small French expedition under Jean-Baptiste Marchand, which had crossed Africa from the Congo to claim the upper Nile for France. Britain and France came close to war before France gave way in November. On 22 September an Egyptian force took Gedaref from the Mahdists in the east.
    facts:
      - [Battle of the Atbara, "8 April 1898"]
      - [Battle of Omdurman, "2 September 1898"]
      - [Losses at Omdurman, "about 12,000 Mahdists killed; 47–48 Anglo-Egyptian dead"]
      - [Kitchener meets Marchand at Fashoda, "18 September 1898"]
