  - title: Osman Digna and the Red Sea hills
    date: 1883–1885
    when: "1884-02-29"
    borders: "1884-03-13"
    countries: [sd, gb]
    body:
      - In 1883 the Mahdi sent Osman Digna, a slave trader of Suakin whose business had been ruined by the government’s campaign against the trade, to raise the Beja of the Red Sea hills. The Hadendoa and other Beja groups joined him and cut the road from Suakin to Berber. They besieged the Egyptian garrisons of Sinkat and Tokar, and on 4 February 1884 at El Teb they routed a relief force of about 3,500 Egyptian gendarmes under Valentine Baker, killing more than 2,000. The garrison of Sinkat died trying to break out on 8 February, and Tokar surrendered.
      - Britain, determined to hold the Red Sea coast, landed about 4,500 troops under Gerald Graham at Trinkitat. At El Teb on 29 February 1884 and at Tamai on 13 March, where a Beja charge broke into a British square, Graham’s men killed some 2,000 of Osman Digna’s followers in each battle at the cost of a few hundred casualties. The British then withdrew to Suakin, and Osman Digna kept the hills. Another British force fought at Hashin and Tofrek in 1885, and Suakin, held by Egypt with British help, remained a besieged port for most of the next decade.
    facts:
      - [First battle of El Teb, "4 February 1884"]
      - [Second battle of El Teb, "29 February 1884"]
      - [Battle of Tamai, "13 March 1884"]
