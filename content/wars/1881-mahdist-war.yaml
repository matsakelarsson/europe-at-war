notes:
  - "The Mahdi’s followers called themselves the Ansar, “helpers”, after the companions of the Prophet. British soldiers and writers called them Dervishes, and the Mahdist State the Dervish State; those names are kept here only in quotations. Sudanese call the period the Mahdiyya."
  - "Egypt was an autonomous province of the Ottoman Empire under its khedives, and from 1882 under British occupation. The army that reconquered Sudan in 1896–1898 was the Egyptian Army, with British officers and Sudanese and Egyptian battalions, joined by British brigades in 1898."
  - Most accounts of the war were written by British officers and by Europeans held captive in Omdurman (Rudolf Slatin, Father Joseph Ohrwalder, Charles Neufeld), whose books served British purposes; Mahdist letters and proclamations, published since the 1950s, give the movement’s own view.
