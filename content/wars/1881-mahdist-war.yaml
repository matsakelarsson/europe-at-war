  - title: Gordon in Khartoum
    date: February – December 1884
    when: "1884-03-13"
    borders: "1884-05-26"
    countries: [sd, gb, eg]
    body:
      - After Shaykan the British government of William Gladstone decided that Egypt could not hold Sudan and must withdraw its garrisons, perhaps 30,000 soldiers and officials and their families. It chose Charles Gordon, a celebrated soldier who knew the country, to organise the evacuation. Gordon reached Khartoum on 18 February 1884, cancelled tax arrears, announced that the government would no longer interfere with slavery, and proposed that al-Zubayr Rahma Mansur, the slaving prince held in Cairo, be sent to rule in his place; London refused. Gordon came to believe that the Mahdi had to be fought rather than left the country, and stayed.
      - The telegraph to Cairo was cut on 15 March 1884, and Mahdist forces closed in on Khartoum. On 26 May Berber, the key to the road to Egypt, fell and its garrison was killed. Gordon sent steamers up and down the Nile, fortified the city between the Blue and White Niles with a ditch and mines, and held out with about 7,000 troops and some 30,000 inhabitants. In September he sent his deputy, Colonel J. D. H. Stewart, downriver in the steamer Abbas with his journals and the French and British consuls; the steamer ran aground and they were killed. In October the Mahdi himself arrived with his main army and camped at Omdurman across the White Nile.
      - In Britain public opinion turned the fate of Gordon into a cause, and in August 1884 Gladstone’s cabinet reluctantly approved a relief expedition under Garnet Wolseley, which went up the Nile from Egypt in boats manned by Canadian voyageurs and West African and British crews.
    facts:
      - [Gordon arrives in Khartoum, "18 February 1884"]
      - [Telegraph cut, "15 March 1884"]
      - [Fall of Berber, "26 May 1884"]
      - [Siege of Khartoum, "about ten months, March 1884 – 26 January 1885"]
