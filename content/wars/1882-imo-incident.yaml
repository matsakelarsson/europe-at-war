notes:
  - Korean records use the lunar calendar (the revolt began on the 9th day of the sixth month and the Treaty of Chemulpo was signed on the 17th day of the seventh). The English Wikipedia article dates the Daewongun’s arrest to September; the Korean records date it to the 13th day of the seventh month, 26 August.
  - The Japanese dead included Horimoto and six members of the legation party killed at Incheon. Japan forgave most of the indemnity in 1884.
