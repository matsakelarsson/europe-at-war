id: imo-incident
name: Imo incident
start: "1882-07-23"
end: "1882-08-30"
tier: C
summary: "A revolt of soldiers in Hanseong in 1882, the imo year of the sixty-year cycle. The soldiers of the old army units, who resented the favour shown to the new Special Skills Force trained by a Japanese officer, had gone unpaid for thirteen months; when they were finally given a month’s rice ration, it had been mixed with sand and husks. On 23 July 1882 they rioted, broke into the house of Min Gyeom-ho, the official in charge of their pay, seized weapons, freed prisoners and were joined by the poor of the city. Crowds killed the Japanese instructor Horimoto Reizō and attacked the Japanese legation; the minister Hanabusa Yoshitada and his staff burned it and fought their way to Incheon, losing several men, and escaped to sea, where a British survey ship picked them up. The next day the rioters entered the palace and killed Min Gyeom-ho and other officials. Queen Min escaped disguised as a court lady, and the king recalled his father, the Heungseon Daewongun, who had sympathised with the soldiers, to power. Japan sent troops and warships with Hanabusa, and the Qing sent about 4,500 troops under Wu Changqing, with Ma Jianzhong and Ding Ruchang. On 26 August the Chinese lured the Daewongun to their camp, arrested him and took him to China, where he was held for three years, and three days later Chinese troops attacked the soldiers’ quarters at Wangsimni and Itaewon. On 30 August Korea signed the Treaty of Chemulpo with Japan, agreeing to punish the culprits, pay an indemnity of 500,000 yen and let Japan station troops at its legation. Chinese troops stayed in Hanseong, and China reasserted its authority over Korea."
