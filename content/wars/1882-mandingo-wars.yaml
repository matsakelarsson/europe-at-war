  - title: Kéniéran, Woyowayanko and Niagassola
    date: February 1882 – March 1886
    when: "1883-04-02"
    borders: "1885-06-01"
    countries: [ml, gn]
    body:
      - The French reached Kita in 1881, and a member of the Kaba family who had fled Kankan sheltered with their allies at Kéniéran. When Gustave Borgnis-Desbordes declared Kéniéran a French protectorate, Samori sacked it on 21 February 1882. The French relief column came too late; Samori’s army turned and fought it at Samaya on 26 February, where its frontal charges were cut down by French rifles and artillery, but then harried the column back to the Niger with ambushes and cavalry raids. The fight made Samori’s name as a leader who could stand up to the French.
      - In February 1883 the French built a fort at Bamako. Samori’s brother Fabu (Keme Brema) came against it with about 3,000 men in March, cut the telegraph and raided the villages allied to the French; on 2 April he threw back Borgnis-Desbordes’s attack on his camp on the Woyowayanko, and after a second attack on 12 April he withdrew in good order. In 1885 a column under Colonel Combes occupied Niagassola to seize the Buré goldfields; Samori split his army into three mobile columns, cut round the French lines of supply and forced it back. Fighting Mamadou Lamine and the Toucouleur at the same time, the French signed the Treaty of Kéniéba-Koura on 28 March 1886, which fixed the Niger below Siguiri as the border and left Samori Buré and the Manding. Samori sent his son Djaoulen-Karamo on an embassy to France.
    facts:
      - [Kéniéran sacked, "21 February 1882"]
      - [Battles of the Woyowayanko, "2 and 12 April 1883"]
      - [Treaty of Kéniéba-Koura, "28 March 1886"]
