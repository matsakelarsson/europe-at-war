  - title: The siege of Sikasso
    date: April 1887 – 1888
    when: "1887-04"
    borders: "1888-01-01"
    countries: [ml, gn]
    body:
      - Samori proclaimed Islam the state religion and took the title of almami in 1884. When his officers began forcing conversion and destroying sacred sites in 1885, the Wassoulou and other non-Muslim districts rose, killing sofa garrisons; Fabu put the revolt down, and the last strongholds were starved into submission by early 1887. On the eastern frontier, along the Bagoé, raids between Samori and Kénédougou, the Senufo kingdom of Tieba Traoré, had laid the country waste since 1884. Samori signed a new treaty with the French at Bissandougou in 1887 and turned his whole army against Tieba.
      - In April 1887 he laid siege to Sikasso with about 12,000 men. The great wall that Tieba had built round the town was one of the strongest in West Africa, and Samori had no artillery. His supplies came by porters through hostile country, the rains turned the roads to mud, and dysentery killed many of his men, Fabu among them. The French built a fort at Siguiri and cut his trade with the Sahel and the Senegal. A rumour that Samori was dead set off a new revolt at home, and at the end of the 1888 rainy season he gave up the siege. His starving troops took revenge on the Wassoulou, killing the rebels they found. In February 1889 he signed another treaty at Niako that pushed the French border further south, and the British, bound by the Brussels Act of 1890, stopped selling him breech-loaders.
    facts:
