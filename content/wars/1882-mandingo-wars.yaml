notes:
  - "Samori’s state had no official name. Its people called it Samoridugu, “Samori’s land”; the name Wassoulou Empire was made popular by the French officer Marie-Étienne Péroz after one of its provinces. The wars are often divided into three: 1882–1886, 1891–1895 and 1897–1898, with uneasy truces between."
  - "French reports are the main written source; Malinke oral traditions and the work of the historian Yves Person give Samori’s side. His wars depended on the sale of captives to buy horses and guns, and the slave trade grew as the French cut off his other revenues; whole regions, such as the Wassoulou after the revolt of 1888, were laid waste by his armies and by the French. Figures for his army are rough: in 1887 he could field some 30,000–35,000 infantry and 3,000 cavalry."
