  - title: Dabakala and Kong
    date: 1894–1897
    when: "1895-03-14"
    borders: "1895-04-01"
    countries: [ci, bf, gh]
    body:
      - Encouraged by Babemba Traoré, Tieba’s successor at Sikasso, the Bamana country rose against Samori in 1894, cutting him off from the horses of the Sahel; Samori defeated Babemba at Kaloua in September 1894. In February 1895 he set up his new base at Dabakala, near the Comoé, and negotiated with Gbon Coulibaly of Korhogo, whose Senufo joined his army. His aim was Kong, the old Dyula trading city that had accepted French protection. A French column under Colonel Monteil, sent from the coast, ran into his sofas on 2 March 1895, was beaten in a battle on 14 March and retreated, abandoning Kong, which submitted to Samori in April.
      - For two years the French left him alone. But Kong’s merchants, whose trade with the coast had collapsed, began to intercept his arms caravans and to call the French back, and when the city revolted Samori destroyed it, in May 1897. In the east his son Saranken Mori held Bouna, which both the French and the British wanted. In April 1897 a small British force from the Gold Coast under Henderson marched on Bouna, was beaten at Dokita and was routed at Wa, where Henderson was captured. Then a French column under Captain Paul Braulot came to Bouna to take it over by agreement; Saranken Mori first accepted, but on 20 August 1897 Braulot was killed and his column destroyed outside the town, and the war with France began again.
    facts:
