steps:
  - title: From trader to almami
    date: 1853–1881
    when: "1878"
    borders: "1881-06-01"
    countries: [gn, ml]
    body:
      - Samori Touré was born about 1830 into a family of Dyula (Muslim Malinke) traders in the upper Niger country of what is now Guinea, and traded kola nuts as a young man. When the Cissé raided his home village of Sanankoro in 1853 and carried off his mother, he took service with them as a soldier to win her freedom, learning the use of firearms and becoming a Muslim; after about seven years he returned with her. In the 1860s he led a war band of his own, and between 1866 and 1873 brought the Toron country under his authority by force and by alliances, with the Konaté of Gbodou and the people of Bissandougou. In 1873 he took Bissandougou, defeated the king of Saboudou, and became faama of the lands between the Milo, the Sankarani and the Dion.
      - In 1875 the Kaba dynasty of Kankan, a Muslim trading town, made an alliance with him against their neighbours. Samori won over or conquered the towns of the upper Niger, among them Kouroussa and Norassoba after a nine-month siege, the goldfields of Buré and the Wassoulou. He made pacts with Aguibou Tall of Dinguiraye and with the almami of Futa Jallon to protect his caravans to the coast, bought breech-loading rifles through Freetown in Sierra Leone, and by 1878 ruled as faama from Bissandougou. When the Kaba refused him troops he besieged Kankan and took it, and he crushed the Cissé of Morlaye and Sere Brema; by about 1881 his state stretched from the Sierra Leone hills to the borders of today’s Côte d’Ivoire.
    facts:
      - [Bissandougou taken, "1873"]
      - [Alliance with Kankan, "1875"]
      - [Samori faama, "by 1878"]
