id: mandingo-wars
name: Mandingo Wars
start: "1882-02"
end: "1898-09-29"
tier: A
summary: "The wars between France and the Wassoulou Empire of Samori Touré (Samory Ture), the longest resistance France met in its conquest of West Africa. Samori, a Malinke trader turned war leader, built a state in the upper Niger basin in the 1860s and 1870s, with its capital at Bissandougou, an army of sofa infantry and cavalry armed with rifles bought through Sierra Leone and made in his own workshops, and Islam as the state religion from 1884. The French first fought him in 1882 at Kéniéran and in 1883 near Bamako; after he turned back a French column in 1885, the Treaty of Kéniéba-Koura (1886) left him the right bank of the Niger. His fifteen-month siege of Sikasso, capital of Kénédougou (1887–1888), failed and set off revolts at home. In 1891 Louis Archinard took Kankan and Bissandougou, and Samori fought a war of manoeuvre and scorched earth, moving his whole state east between 1892 and 1895 to the lands of the Bandama and the Comoé, where he defeated a French column, took Kong and destroyed it in 1897, and clashed with the British at Wa. After the fall of Sikasso in May 1898 the French closed in; his columns starved in the forest on the way to Liberia, and Captain Henri Gouraud captured him at Guélémou on 29 September 1898. He died in exile in Gabon in 1900. Samori is honoured in Guinea and much of West Africa as a hero of resistance, and remembered in other places for the devastation and the mass enslavement his wars brought."
countries: [gn, ml, ci, bf, gh, sl]
