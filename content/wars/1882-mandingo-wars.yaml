  - title: Sikasso falls, Samori is taken
    date: May – September 1898
    when: "1898-09-29"
    borders: "1898-09-29"
    countries: [ml, ci, gn, lr]
    body:
      - The French stormed Sikasso on 1 May 1898, and Babemba had himself killed rather than be captured. Now free to concentrate against Samori, French columns pushed in from the north and the east. Samori decided to move once more, west towards the Liberian hinterland, hoping to live off the land; but in the mountainous forest of western Côte d’Ivoire his columns met hostile villagers, rain and French attacks, and thousands of his followers died of hunger.
      - Using information from deserters, Captain Henri Gouraud’s column of about 200 tirailleurs surprised Samori’s camp at Guélémou at dawn on 29 September 1898 and captured him without a shot; his sons and household were taken, and about 1,800 sofas laid down their arms. Samori was taken to Kayes and on 22 December 1898 sentenced to exile. After a failed suicide attempt at Saint-Louis he was deported to Gabon, where he died of pneumonia on 2 June 1900 on the island of Missanga in the Ogooué, near Ndjolé.
    facts:
      - [Fall of Sikasso, "1 May 1898"]
      - [Samori captured at Guélémou, "29 September 1898"]
      - [Death in exile, "2 June 1900"]
