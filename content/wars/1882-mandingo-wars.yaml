  - title: Kankan, Bissandougou and the move east
    date: March 1891 – 1894
    when: "1891-04-11"
    borders: "1892-05-09"
    countries: [gn, ml, ci, sl]
    body:
      - On 10 March 1891 Colonel Louis Archinard set out from Nyamina to strike Samori in a lightning campaign. Knowing his forts could not stand up to French artillery, Samori chose a war of manoeuvre and scorched earth. Archinard took Kankan on 11 April and then an empty Bissandougou, but found little worth taking. His successor, Colonel Pierre Humbert, marched on Bissandougou again in January 1892 with picked troops; the sofas fought hard defensive battles at the Soumbe and Diamanko creeks on 11 and 12 January, nearly taking the French guns, but could not save the town. The French set up posts at Bissandougou and Kérouané and chased Samori south through ambushes and burnt country.
      - At a council at Frankonedou on 9 May 1892 Samori and his chiefs decided to move the whole state east, to the lands of the Bandama and the Comoé, laying waste each district before leaving it to slow the French. In early 1893 the French took Faranah and closed the routes to Sierra Leone and Liberia that brought his rifles; the western provinces and Kissidougou surrendered. Samori still had about 12,000 infantry and 2,000 horsemen, with a moving following of some 120,000 people. The smiths in his workshops had learned to copy French and other rifles, but they could not make enough, and he now depended on a long route to the Gold Coast.
    facts:
