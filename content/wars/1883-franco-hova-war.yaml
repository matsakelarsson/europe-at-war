steps:
  - title: Majunga and Tamatave
    date: May – July 1883
    when: "1883-06-11"
    borders: "1883-06-11"
    countries: [mg, fr]
    body:
      - "By the 1880s the Merina kingdom, ruled by Queen Ranavalona II and her prime minister and husband Rainilaiarivony, governed most of Madagascar from Antananarivo and had made Protestant Christianity the religion of the court. France had held the islands of Nosy Be and Mayotte since 1840–1841, when Sakalava chiefs who had fled the Merina placed themselves under French protection, and French colonial circles in Réunion claimed that this gave France rights over the whole north-west coast. They also took up the claims of the heirs of Jean Laborde, the French engineer who had built the queen’s foundries and died in 1878, to his estates, which Merina law did not allow foreigners to own, and the land concessions Radama II had granted to Joseph-François Lambert in the 1860s and the monarchy had revoked."
      - "In May 1883 a French squadron under Rear Admiral Pierre bombarded the Merina posts along the north-west coast and occupied Majunga. Pierre sent an ultimatum to Antananarivo demanding recognition of French rights in the north, a French protectorate over the Sakalava, the right of French citizens to own land and an indemnity of 1.5 million francs. When it was refused, he bombarded Tamatave, the main port of the east coast, and occupied it on 11 June. There he arrested the British missionary George Shaw, accused of helping the Merina, which caused a quarrel with Britain that ended with France paying him compensation."
      - "Ranavalona II died on 13 July 1883, and Rainilaiarivony married her young successor, Ranavalona III, and kept power. Pierre, worn out by the campaign, was relieved and died later that year. The Merina withdrew their garrisons from the coast to positions inland and prepared for a long war."
    facts:
      - [Majunga occupied, "May 1883"]
      - [Tamatave occupied, "11 June 1883"]
      - [Death of Ranavalona II, "13 July 1883"]
