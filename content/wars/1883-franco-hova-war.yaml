  - title: Farafaty and the Treaty of Tamatave
    date: 1884 – December 1885
    when: "1885-09"
    borders: "1885-12-17"
    countries: [mg, fr]
    body:
      - "Admiral Galiber and then Rear Admiral Miot continued the war with too few troops to march inland. The French blockaded the coasts, bombarded ports and sought allies among the Sakalava and Antankarana chiefs of the north, old enemies of the Merina. Outside Tamatave the Merina army, under the town’s governor Rainandriamampandry, held entrenched lines at Farafaty (Farafatra), a few kilometres inland, which the French could not break; an attack in September 1885 was repulsed. France, which was also fighting China in Tonkin, was tired of the war, and the Merina government wanted the ports back."
      - "The Treaty of Tamatave was signed on 17 December 1885 aboard a French warship in Tamatave harbour by Miot and the diplomat Salvator Patrimonio for France and by Digby Willoughby, a British officer commanding the Malagasy forces, for the queen. It gave France the right to occupy the bay of Diego Suarez in the far north, where it built a naval base, and 10 million francs to settle the claims of French and other foreign subjects, and installed a French resident at Antananarivo who was to represent Madagascar in its relations with other countries. The Merina government kept control of its internal affairs. France treated the treaty as a protectorate; the Malagasy, supported by an explanatory letter from the French negotiators that was never shown to the French parliament, said it was not. Britain recognised a French protectorate over Madagascar in 1890, and in 1894–1895 France settled the question by conquest."
    facts:
      - [French attack on Farafaty repulsed, "September 1885"]
      - [Treaty of Tamatave, "17 December 1885"]
      - [Payment for French and foreign claims, "10 million francs"]
