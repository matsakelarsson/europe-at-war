id: franco-hova-war
name: Franco-Hova War
start: "1883-05"
end: "1885-12-17"
tier: B
summary: "The first French war against the Merina kingdom of Madagascar, called the Hova by the French. France pressed old claims: to a protectorate over the Sakalava of the north-west, whose chiefs had signed treaties with France in 1840–1841, and to the estates of the French businessman Jean Laborde and the concessions Radama II had granted to Joseph-François Lambert. In May 1883 Admiral Pierre bombarded the Merina posts on the north-west coast and occupied Majunga, and when Queen Ranavalona II’s government rejected his ultimatum he bombarded and occupied Tamatave in June. The queen died in July; Ranavalona III and her prime minister and husband Rainilaiarivony fought on. For two years the French blockaded and raided the coasts but could not break the Merina lines at Farafaty outside Tamatave. The Treaty of Tamatave of 17 December 1885 gave France the bay of Diego Suarez, 10 million francs to settle French and other foreign claims, and a resident at Antananarivo to handle Madagascar’s foreign relations; France called it a protectorate, the Merina government did not, and the dispute led to the French conquest of 1895."
countries: [mg, fr]
sides:
  - id: mer
    name: Kingdom of Madagascar (Merina)
    polities: [merina]
    ink: red
    moves: Merina moves
    success: Merina success
  - id: fr
    name: France
    polities: [france]
    ink: navy
    moves: French moves
    success: French success
notes:
  - "“Hova”, the name of the free commoner class among the Merina, was what the French and British of the time called the Merina and their government; the war keeps that name in French and English. The Merina government called its state the Kingdom of Madagascar."
  - "Some accounts give the dates of the bombardment of Tamatave and the occupation of Majunga differently; the treaty, ratified in 1886, is sometimes dated to that year."
