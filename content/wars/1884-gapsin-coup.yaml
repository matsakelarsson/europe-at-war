id: gapsin-coup
name: Gapsin coup
start: "1884-12-04"
end: "1884-12-06"
tier: C
summary: "A failed coup in Hanseong by the young reformers of the Enlightenment Party (Gaehwadang), named after the year 1884, gapsin in the sixty-year cycle. Kim Ok-gyun, Pak Yeong-hyo, Hong Yeong-sik, Seo Gwang-beom and Seo Jae-pil wanted to end Korea’s dependence on China and reform the state on the model of Meiji Japan, and were losing ground to the pro-Chinese faction around Queen Min. When half of the Chinese garrison left for the war with France, they planned a coup with the promised help of the Japanese minister Takezoe Shin’ichirō. On the evening of 4 December 1884, at a banquet for the opening of the new post office, which Hong Yeong-sik headed, their men set a fire as a signal and wounded the queen’s nephew Min Yeong-ik. The plotters took King Gojong to the Gyeongugung palace, guarded by about 140 Japanese legation troops, and killed six conservative ministers. On 5 December they announced a new government and a programme of reform, including the end of tribute to China, equal rights for all and the abolition of the yangban’s privileges. On 6 December some 1,500 Chinese troops under Yuan Shikai attacked the palace, by then Changdeokgung, together with Korean soldiers; the Japanese troops withdrew, Hong Yeong-sik was killed, and crowds burned the Japanese legation and killed some forty Japanese. Kim Ok-gyun, Pak Yeong-hyo and the others escaped to Japan, and their relatives were executed. Japan obtained an apology and compensation in the Treaty of Hanseong of 9 January 1885, and in the Convention of Tianjin of 18 April 1885 Japan and China agreed to withdraw their troops from Korea and to notify each other before sending them again."
