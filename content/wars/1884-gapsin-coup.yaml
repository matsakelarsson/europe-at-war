notes:
  - The coup began on the 17th day of the tenth lunar month and lasted three days, hence its Korean name, the “three-day government”. The English Wikipedia article on the coup dates the Convention of Tianjin to 31 May 1885; it was signed on 18 April.
  - Kim Ok-gyun was murdered in Shanghai in 1894; Seo Jae-pil, later known as Philip Jaisohn, went to the United States and returned in 1896 to found the newspaper The Independent.
