  - title: Keelung, Tamsui and the blockade of Taiwan
    date: October 1884 – March 1885
    when: "1884-10-01"
    borders: "1884-10-08"
    countries: [tw, fr]
    body:
      - On 1 October 1884 Lieutenant-Colonel Bertaux-Levillain landed at Keelung with 1,800 marine infantry and took the town and the harbour, but the Chinese withdrew to the hills around it, and the French could not advance further. On 8 October Lespès sent about 600 sailors ashore at Tamsui, the port of Taipei, after a bombardment; they were beaten back in the scrub behind the beach by troops under Sun Kaihua and returned to their ships.
      - Courbet then declared a blockade of Taiwan’s ports from 23 October, which the French could enforce only in part. Reinforced to about 4,000 men under Colonel Jacques Duchesne, the French at Keelung fought for the forts on the surrounding hills through the winter against Liu Mingchuan’s army, by some counts 25,000 men. In March 1885 they finally broke the Chinese lines around the town, but cholera and typhoid killed more French soldiers in Taiwan than the fighting did.
    facts:
