  - title: Kép and Chũ, and the siege of Tuyên Quang
    date: October – December 1884
    when: "1884-10-08"
    borders: "1884-10-08"
    countries: [vn, cn, fr]
    body:
      - In late September 1884 the Guangxi army advanced from Lạng Sơn towards the delta down the valleys of the Thương and Lục Nam rivers, while the Yunnan army under Tang Jingsong and the Black Flags came down the Red and Clear rivers in the west. The new French commander in Tonkin, General Louis Brière de l’Isle, sent General François de Négrier with nearly 3,000 men by gunboat up the rivers. After clashes at Lam Cốt on 6 October, de Négrier stormed the Chinese fort at Kép on 8 October in hard fighting, after which there were reports that French troops had killed Chinese wounded, and on 10 October a second column defeated the Chinese at Chũ. The Guangxi army fell back towards Lạng Sơn.
      - In the west the Black Flags and the Yunnan army closed in on Tuyên Quang, a small citadel on the Clear River that the French had occupied in June, and laid siege to it in November. In early January 1885 de Négrier defeated another Chinese force at Núi Bop, north-east of Chũ.
    facts:
      - [Battle of Kép, "8 October 1884, French victory"]
      - [Battle of Chũ, "10 October 1884, French victory"]
      - [Siege of Tuyên Quang begins, "November 1884"]
