  - title: Bang Bo and the retreat from Lạng Sơn
    date: March 1885
    when: "1885-03-24"
    borders: "1885-03-24"
    countries: [vn, cn, fr]
    body:
      - The Guangxi army regrouped across the border under Pan Dingxin, with fresh troops under the veteran general Feng Zicai, who built a wall and earthworks across the valley below the Zhennan Pass. On 23 and 24 March 1885 de Négrier attacked these lines at Bang Bo with about 1,500 men. The Guangxi forces in the area numbered some 25,000 to 30,000, though by some estimates only a few thousand took part in the battle itself. The French were driven back with 70 to 74 killed and 188 to 213 wounded, by different counts. On 23 March a French battalion had also been routed near Hưng Hóa, at Phu Lam Tao, by Chinese troops and Black Flags.
      - On 28 March the Chinese followed up and attacked de Négrier’s lines at Kỳ Lừa, outside Lạng Sơn. They were beaten back with heavy losses, but de Négrier was badly wounded, and his successor, Lieutenant-Colonel Paul-Gustave Herbinger, fearing encirclement and claiming to be short of ammunition, abandoned Lạng Sơn that evening and fell back to Chũ, leaving supplies behind. The Chinese reoccupied the town on 30 March.
      - Brière de l’Isle’s alarmed telegram reached Paris on 28 March, and on 30 March the Chamber of Deputies overthrew Jules Ferry’s government, already unpopular for the cost of the war. In China the victory at Bang Bo was celebrated, and Feng Zicai became a national hero.
    facts:
      - [Battle of Bang Bo, "24 March 1885, Chinese victory"]
      - [Kỳ Lừa, "28 March 1885"]
      - [Lạng Sơn abandoned, "28 March 1885"]
      - [Fall of Jules Ferry, "30 March 1885"]
