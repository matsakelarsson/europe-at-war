steps:
  - title: The clash at Bắc Lệ
    date: May – June 1884
    when: "1884-06-23"
    borders: "1884-06-23"
    countries: [vn, cn, fr]
    body:
      - China had long treated the Vietnamese kings as tributaries, and since 1882 its Guangxi and Yunnan armies had moved into northern Tonkin to support the court in Huế against the French, alongside Liu Yongfu’s Black Flags. After its defeats at Sơn Tây, Bắc Ninh and Hưng Hóa, the Qing court let Li Hongzhang negotiate. By the Tientsin Accord, signed with the French naval captain François-Ernest Fournier on 11 May 1884, China agreed to withdraw its troops from Tonkin and to accept the French treaties with Vietnam, and France gave up any claim to an indemnity. The accord set no date for the withdrawal; the French took it to mean at once, the Chinese commanders had no orders to leave.
      - In June a French column of about 450 French soldiers and 350 Vietnamese auxiliaries under Lieutenant-Colonel Alphonse Dugenne marched up the Mandarin Road from Phủ Lạng Thương to occupy Lạng Sơn and the other border towns. On 23 June, at the crossing of the Thương river near Bắc Lệ, it found about 4,600 Guangxi troops entrenched on the far side. Dugenne gave them an ultimatum to withdraw; the Chinese commanders asked for time to get orders, and when the French advanced, fighting broke out. After two days the column, nearly surrounded, fought its way back, with 22 killed and 70 wounded; Chinese losses were about 300 killed and wounded.
      - The French called the clash an ambush and a breach of the accord. Jules Ferry’s government demanded that China apply the accord at once and pay a large indemnity. China agreed to withdraw but refused to apologise or pay, and talks in July and August broke down.
