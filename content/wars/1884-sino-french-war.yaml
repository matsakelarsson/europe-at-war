  - title: The Pescadores and the Treaty of Tianjin
    date: February – June 1885
    when: "1885-03-31"
    borders: "1885-06-09"
    countries: [cn, tw, fr]
    body:
      - At sea Courbet went after the Chinese southern fleet. On the night of 14 February 1885 two French torpedo launches attacked the frigate Yuyuan and the sloop Chengqing in Shipu bay, south of Ningbo; the Yuyuan was sunk by a spar torpedo, and the Chengqing also sank, probably hit by Chinese fire, though the Chinese said she had been scuttled. Britain, under the Foreign Enlistment Act, closed Hong Kong and its other ports to French warships, and in late February France declared rice a contraband of war and tried to stop the rice ships bound for northern China. From 29 to 31 March Courbet’s ships and a landing force of marines took the Pescadores, the islands between Taiwan and the mainland, and their harbour at Makung.
      - Both governments now wanted peace, and talks arranged by Robert Hart, the British head of China’s Maritime Customs, led to a protocol signed in Paris on 4 April 1885. By the Treaty of Tianjin, signed by Li Hongzhang and Jules Patenôtre on 9 June 1885, China accepted the French treaties with Vietnam, in effect giving up its suzerainty, and agreed to open its border with Tonkin to trade; France gave up its claim to an indemnity and evacuated Keelung and the Pescadores that summer. Courbet died of illness aboard his flagship at Makung on 11 June.
      - Each side counted the war a partial success. France kept Tonkin and in 1887 joined it with Cochinchina, Annam and Cambodia in French Indochina. Chinese armies had held their own on land against a European army, but the loss of the Fujian fleet showed the weakness of its navy; it made Taiwan a province in 1885 under Liu Mingchuan and founded a central admiralty.
    facts:
      - [Shipu, "14–15 February 1885"]
      - [Pescadores taken, "29–31 March 1885"]
      - [Peace protocol, "4 April 1885"]
      - [Treaty of Tianjin, "9 June 1885"]
    markers:
      - kind: taken
        side: fr
        name: Makung (Pescadores)
        date: 29–31 March 1885
        text: Courbet’s marines took the islands and their harbour. Courbet died here aboard the Bayard on 11 June 1885.
        lonlat: [119.566, 23.567]
      - kind: naval
