  - title: Lạng Sơn and the Gate of China
    date: February 1885
    when: "1885-02-13"
    borders: "1885-02-13"
    countries: [vn, cn, fr]
    body:
      - Paris decided to finish the war in Tonkin by taking Lạng Sơn. On 3 February 1885 Brière de l’Isle marched from Chũ with about 7,200 soldiers and 4,500 Vietnamese porters, in two brigades under de Négrier and Laurent Giovanninelli. In ten days of fighting through the hills, at Tây Hòa, Hạ Hòa, Đồng Sông, the Quao pass and Bắc Việt, they drove back the Guangxi army, and on 13 February they entered Lạng Sơn after a rearguard action at Kỳ Lừa.
      - Brière de l’Isle then took Giovanninelli’s brigade back to relieve Tuyên Quang. De Négrier, left at Lạng Sơn, attacked the Guangxi army at Đồng Đăng on 23 February and drove it out of Tonkin. His troops crossed briefly into Guangxi and blew up the customs gate at the Zhennan Pass, the “Gate of China”, before falling back.
    facts:
      - [French advance from Chũ, "3 February 1885"]
      - [Lạng Sơn taken, "13 February 1885"]
      - [Battle of Đồng Đăng, "23 February 1885, French victory"]
