  - title: Keelung and Fuzhou
    date: August 1884
    when: "1884-08-23"
    borders: "1884-08-23"
    countries: [cn, tw, fr]
    body:
      - France decided to seize a “pledge” on the Chinese coast to force China to pay. On 5 August 1884 Rear-Admiral Sébastien Lespès bombarded the batteries of Keelung, the coal port in northern Taiwan, and landed troops, but on 6 August the Chinese troops of Liu Mingchuan, the official sent to defend Taiwan, drove them back to their ships.
      - Admiral Amédée Courbet’s Far East squadron had meanwhile entered the Min river and anchored at Pagoda Anchorage (Mawei), beside the Fuzhou Navy Yard, China’s main modern shipyard, among the ships of the Fujian fleet. When talks broke down, Courbet was ordered to attack. On the afternoon of 23 August his thirteen ships opened fire at close range and sank or burned nine Chinese warships, among them the flagship Yangwu, and many war junks in less than an hour, and then shelled the navy yard. The Chinese officially counted 796 killed; Courbet thought 2,000 to 3,000 had died, a figure that includes the fighting of the following days. The French lost 10 killed and 48 wounded. From 25 to 28 August the squadron steamed back down the river, destroying the forts along it from behind.
      - On 26 August the Qing court issued an edict announcing war with France. The commissioner for Fujian’s coastal defence, Zhang Peilun, who had been in charge at Fuzhou, was dismissed and exiled.
    facts:
      - [Keelung attacked, "5–6 August 1884"]
      - [Battle of Fuzhou, "23 August 1884, French victory"]
      - [Chinese losses, "796 killed (official count) to 2,000–3,000 (French estimate)"]
      - [French losses, "10 killed, 48 wounded"]
    markers:
