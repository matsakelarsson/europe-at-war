  - title: The relief of Tuyên Quang
    date: November 1884 – March 1885
    when: "1885-03-02"
    borders: "1885-03-03"
    countries: [vn, cn, fr]
    body:
      - Tuyên Quang was held by about 400 men of the Foreign Legion and 200 Vietnamese riflemen under Commandant Marc-Edmond Dominé. From 24 November 1884 about 3,000 Black Flags and 9,000 men of Tang Jingsong’s Yunnan army besieged it, and from mid-February 1885 they blew breaches in the walls with mines. The garrison beat off seven assaults, and lost more than a third of its men, 50 killed and 224 wounded.
      - Giovanninelli’s brigade came up the Clear River from the south. On 2 March 1885 it attacked the Black Flag and Yunnan lines at Hòa Mộc, south of the town, losing 76 killed and 408 wounded, the heaviest French losses of any battle in the war. The besiegers withdrew, and the relief force entered Tuyên Quang on 3 March.
    facts:
      - [Siege of Tuyên Quang, "November 1884 – 3 March 1885"]
      - [French garrison, "about 600 men; 50 killed, 224 wounded"]
      - [Battle of Hòa Mộc, "2 March 1885; French losses 76 killed, 408 wounded"]
