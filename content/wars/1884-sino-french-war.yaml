id: sino-french-war
name: Sino-French War
start: "1884-06-23"
end: "1885-06-09"
tier: A
summary: "The war between France and Qing China over Tonkin, northern Vietnam, which China regarded as a tributary state and France had just made a protectorate. China’s Guangxi and Yunnan armies and Liu Yongfu’s Black Flag Army were already fighting the French in Tonkin, and the Tientsin Accord of May 1884, by which China was to withdraw them, broke down when a French column was stopped at Bắc Lệ in June. In August Admiral Courbet destroyed the Fujian fleet at Fuzhou in less than an hour. The French then occupied Keelung on Taiwan but were beaten back at Tamsui, and the war in Taiwan became a long, sickly stalemate. In Tonkin the French defeated the Guangxi army at Kép, took Lạng Sơn in February 1885 and relieved the besieged garrison of Tuyên Quang, but in March they were beaten at Bang Bo below the Zhennan Pass and abandoned Lạng Sơn, which brought down Jules Ferry’s government. After the French took the Pescadores, the two sides made peace: by the Treaty of Tianjin (9 June 1885) China accepted the French protectorate over Vietnam, and France gave back Keelung and the Pescadores without an indemnity."
countries: [vn, cn, tw, fr]
sides:
  - id: fr
    name: France
    polities: [france]
    ink: blue
    moves: French moves
    success: French success
  - id: qing
    name: Qing China
    polities: [qing]
    ink: gold
    moves: Chinese moves
    success: Chinese success
  - id: bf
