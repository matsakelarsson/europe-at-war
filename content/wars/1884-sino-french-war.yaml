notes:
  - France never formally declared war, and presented its attacks as reprisals; the Qing court issued an edict announcing war on 26 August 1884, after the battle of Fuzhou. The war in Tonkin before June 1884, including Sơn Tây and Bắc Ninh, is told in the French campaigns in Tonkin.
  - The French forces in Tonkin included the Foreign Legion, Algerian and African troops, marine infantry and Vietnamese auxiliaries and riflemen. Some Vietnamese officials and fighters, who rejected the protectorate, fought alongside the Chinese armies and the Black Flags.
  - Taiwan was then a prefecture of Fujian province; it was made a province of its own in 1885, after the war. Keelung is Jilong, Tamsui is Danshui, and the Pescadores are the Penghu Islands. The Zhennan Pass is today’s Friendship Pass (Youyiguan) on the border of Guangxi and Lạng Sơn.
  - Casualty figures differ by source. One modern estimate gives about 4,200 French killed and wounded and some 5,200 dead of disease, and at least 10,000 Chinese killed; a French study counts 811 French killed and 2,093 wounded.
