  - title: Ba Đình, the killings of Catholics and the capture of Hàm Nghi
    date: 1885–1888
    when: "1885-09"
    borders: "1886-12-15"
    countries: [vn]
    body:
      - In the first months of the rising, Cần Vương bands under the slogan bình Tây sát tả, “pacify the West, exterminate the Christians”, attacked the Catholic villages of central Vietnam, whose people they saw as allies of the French. French missionary counts put the dead from late July to September 1885 at about 40,000, nearly a third of the Catholics of the region, among them some 24,000 in Quảng Ngãi and Bình Định and 7,500 in Quảng Trị; other accounts give lower numbers. The French, whose Tonkin Expeditionary Corps had been raised to 35,000 men, sent columns to the coast. Prud’homme’s column took Bình Định on 3 September 1885, and armed Catholics and troops of the Đồng Khánh court under mandarins such as Nguyễn Thân took part in campaigns in which villages suspected of supporting the rising were burned and their people killed.
      - In the north the scholar Nguyễn Thiện Thuật held the reed marshes of Bãi Sậy in Hưng Yên until he left for China in 1889, and in Thanh Hóa Đinh Công Tráng and Phạm Bành fortified three villages at Ba Đình, surrounded by flooded rice fields. French troops besieged them from December 1886 with heavy artillery, and on 20 January 1887 the surviving defenders broke out. The French lost 19 killed and 45 wounded; the defenders’ losses were much heavier. Tráng was killed later in 1887.
      - Hàm Nghi stayed in hiding in the mountains of Quảng Bình, moving from camp to camp, while Thuyết went to China in 1886 to seek help and never returned. On the night of 1–2 November 1888 Trương Quang Ngọc, a leader of the emperor’s Mường guards, betrayed him to the French; Thuyết’s son Tôn Thất Thiệp was killed defending him. Hàm Nghi, then about 17, was exiled to Algeria. He arrived in Algiers in January 1889 and lived there until his death in 1944.
    facts:
      - [Catholics killed, July–September 1885, "about 40,000 by missionary counts"]
      - [Ba Đình, "December 1886 – 20 January 1887, French victory"]
      - [Hàm Nghi captured, "1–2 November 1888"]
