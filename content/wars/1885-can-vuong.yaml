steps:
  - title: The attack at Huế and the king’s call
    date: July – September 1885
    when: "1885-07-05"
    borders: "1885-07-05"
    countries: [vn]
    body:
      - The treaty signed at Huế on 6 June 1884 made Annam and Tonkin French protectorates, and the Treaty of Tianjin of June 1885 ended China’s support for the Vietnamese court. At Huế real power lay with the regents Tôn Thất Thuyết and Nguyễn Văn Tường, who in August 1884 had put the boy Hàm Nghi on the throne, the fourth emperor since Tự Đức’s death in July 1883. Thuyết had been building up troops and a fortified refuge in the mountains of Quảng Trị. In early July 1885 General Roussel de Courcy arrived at Huế with a strong escort and demanded to be received through the central gate of the palace, reserved for the emperor.
      - On the night of 4–5 July Thuyết’s troops attacked the French legation and the garrison in the Mang Cá fort at the corner of the citadel. The French held, and in the morning they stormed the citadel; the palace was looted, and many Vietnamese soldiers and townspeople were killed. Thuyết fled with Hàm Nghi to Tân Sở, his base in the hills of Quảng Trị, and from there an edict in the emperor’s name called on officials, scholars and people to “aid the king” and drive out the French.
      - Nguyễn Văn Tường stayed in Huế and went over to the French, who later deported him to Tahiti. On 19 September 1885 the French and the remaining court officials put Hàm Nghi’s elder brother on the throne as Đồng Khánh. By then risings had broken out from Thanh Hóa to Bình Định, led by scholar-officials who rejected the new emperor.
    facts:
      - [Attack on the French at Huế, "night of 4–5 July 1885"]
      - [Cần Vương edict, "July 1885, at Tân Sở"]
      - [Đồng Khánh enthroned, "19 September 1885"]
