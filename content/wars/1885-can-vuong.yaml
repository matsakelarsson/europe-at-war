notes:
  - The French called the fighting the pacification of Annam and Tonkin; Vietnamese historians call it the Cần Vương movement, after the edict, and count it as the first stage of the resistance to colonial rule. The movement had no single command. Most of its forces were raised locally by scholar-officials and village notables, and leaders such as Phan Đình Phùng, Đinh Công Tráng and Nguyễn Thiện Thuật fought in their own regions.
  - The numbers of Catholics killed in 1885 come mainly from French missionaries and are approximate; the numbers of Vietnamese killed by French columns and in the burning of villages are not known. The French forces were mostly colonial troops, Vietnamese riflemen (tirailleurs) and Catholic militias, with the Foreign Legion and marine infantry.
  - The edict is dated in Vietnamese sources to the lunar calendar; it was issued at Tân Sở in July 1885, a few days after the flight from Huế.
