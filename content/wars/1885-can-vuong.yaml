  - title: Phan Đình Phùng, Hương Khê and Yên Thế
    date: 1888–1896, Yên Thế to 1913
    when: "1889"
    borders: "1893-06-01"
    countries: [vn]
    body:
      - The resistance lasted longest in the mountains of Hà Tĩnh, under Phan Đình Phùng, a former imperial censor who had answered the edict in 1885. From his headquarters on Mount Vũ Quang, in the Hương Khê country overlooking the French post at Hà Tĩnh, he organised the four provinces of Thanh Hóa, Nghệ An, Hà Tĩnh and Quảng Bình into districts, with bases of 100 to 500 men each, supplied by a tax in rice and silver paid by the villages. His commander Cao Thắng had his men take apart captured French rifles of the 1874 model and make about 300 copies. Cao Thắng was killed in 1893 attacking a French fort.
      - The French and the court cut the fighters off from the villages, with the mandarin Nguyễn Thân directing operations, and in 1895 brought in about 3,000 troops to close a ring around the last bases. Phan Đình Phùng died of his wounds on 28 December 1895, and his followers gave up their arms or scattered in early 1896, which ended the Cần Vương movement. Many of the scholars who survived turned to new forms of resistance, among them Phan Bội Châu, who was born in Nghệ An.
      - In the hills of Yên Thế, north of Hanoi, Hoàng Hoa Thám (Đề Thám) had led peasant fighters since the mid-1880s. He fought off French columns and twice made truces, in 1894 and 1897, that left him in control of a group of villages around his fort at Phồn Xương. He kept links with Phan Bội Châu’s nationalists, and after a plot to poison the Hanoi garrison in 1908 the French attacked again in 1909. Hoàng Hoa Thám was killed by men in French pay on 10 February 1913.
    facts:
      - [Cao Thắng’s rifles, "about 300, copied from the French 1874 model"]
      - [Death of Phan Đình Phùng, "28 December 1895"]
      - [Death of Hoàng Hoa Thám, "10 February 1913"]
