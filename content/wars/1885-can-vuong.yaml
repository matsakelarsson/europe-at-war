id: can-vuong
name: Cần Vương movement
start: "1885-07-05"
end: "1896-02"
tier: B
summary: "A rising against the French protectorate over Annam and Tonkin in the name of the young emperor Hàm Nghi. Cần Vương means “aid the king”. On the night of 4–5 July 1885 the regent Tôn Thất Thuyết’s troops attacked the French garrison at Huế; the attack failed, the French took the citadel, and Thuyết escaped with Hàm Nghi to the mountains, where an edict in the emperor’s name called on scholars and people to rise. Across central and northern Vietnam the local scholar-gentry (văn thân) raised forces, and in the first months bands killed many thousands of Vietnamese Catholics, whom they saw as allies of the French; missionary counts put the dead at about 40,000. The French put Hàm Nghi’s brother Đồng Khánh on the throne, sent columns with Catholic militias and Vietnamese troops of the court, and burned villages that supported the rising. They broke the fortified villages of Ba Đình in January 1887, and in November 1888 Hàm Nghi was betrayed, captured and exiled to Algeria. The resistance held out longest in Hà Tĩnh and Nghệ An under Phan Đình Phùng, whose death at the end of 1895 ended the movement. Hoàng Hoa Thám, who had fought in Yên Thế since the mid-1880s, held out against the French until 1913."
countries: [vn]
