  - title: Gallabat, Sar Weha and the sack of Gondar
    date: January 1887 – October 1888
    when: "1888-01"
    borders: "1888-01-31"
    countries: [et, sd]
    body:
      - Raids crossed the western border in both directions. In January 1887 King Tekle Haymanot of Gojjam, one of Yohannes’s vassals, attacked the Mahdist border town of Gallabat with a large army, routed its garrison and plundered the country towards Gedaref, killing the wounded and carrying off women. The Khalifa sent his general Hamdan Abu Anja with a large army in reply. On 18 January 1888 Abu Anja defeated Tekle Haymanot at Sar Weha, and the Mahdists entered Gondar, the old capital, looted and burned its churches and carried many people off into slavery.
      - Yohannes, whose main army was facing the Italians near Massawa in the spring of 1888, and who suspected Menelik of Shewa of dealing with Italy, did not march west at once. In the south-west Ras Gobana Dacche, Menelik’s general, defeated a Mahdist force at Guté Dili in Wollega on 14 October 1888.
    facts:
      - [Tekle Haymanot sacks Gallabat, "January 1887"]
      - [Battle of Sar Weha, "18 January 1888, Mahdist victory"]
      - [Gondar sacked, "January 1888"]
