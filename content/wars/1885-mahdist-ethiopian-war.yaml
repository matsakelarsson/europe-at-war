steps:
  - title: The Hewett Treaty and Kufit
    date: June 1884 – September 1885
    when: "1885-09-23"
    borders: "1885-09-23"
    countries: [et, er, sd]
    body:
      - The Mahdist rising that began in the Sudan in 1881 cut off the Egyptian garrisons along the Ethiopian border, at Kassala, Amideb, Algeden, Gira, Gallabat and Keren. In June 1884 the British admiral Sir William Hewett, acting for Britain and Egypt, signed a treaty with Yohannes IV at Adwa. Ethiopia would help the garrisons withdraw through its territory to the coast; in return it received the Bogos country around Keren and the right to import goods, arms included, freely through Massawa. In February 1885, with British consent, Italy occupied Massawa instead of Egypt, which Yohannes and his commanders had not foreseen.
      - Ras Alula, governor of the northern frontier, brought out some of the garrisons, but Kassala, after a long siege, fell to the Mahdists on 30 July 1885. The Mahdist commander in the east, Osman Digna, then moved towards the Bogos country. Alula entered Keren in September and marched west to meet him, and on 22–23 September 1885 at Kufit, between Keren and Kassala, his army routed the Mahdists after a hard fight. Estimates of the Mahdist dead range from 3,000 to 10,000, and Alula lost about 1,500 men, among them his lieutenant Blatta Gebru; he was wounded himself.
    facts:
      - [Hewett Treaty, "June 1884, Adwa"]
      - [Kassala falls to the Mahdists, "30 July 1885"]
      - [Battle of Kufit, "22–23 September 1885, Ethiopian victory"]
