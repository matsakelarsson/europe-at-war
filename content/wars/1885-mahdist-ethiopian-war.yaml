id: mahdist-ethiopian-war
name: Mahdist–Ethiopian War
start: "1885-09"
end: "1889-03-12"
tier: B
summary: "War between Emperor Yohannes IV of Ethiopia and the Mahdist state of the Sudan. By the Hewett Treaty of June 1884 Ethiopia agreed to help evacuate the Egyptian garrisons cut off by the Mahdist rising on its border, in return for the Bogos country and free transit through Massawa; the Mahdists treated this as an act of war. Ras Alula defeated Osman Digna at Kufit in September 1885. In January 1887 King Tekle Haymanot of Gojjam sacked the Mahdist border town of Gallabat, and in reply the Mahdist general Abu Anja defeated him at Sar Weha in January 1888 and sacked Gondar, burning its churches and carrying off captives. Yohannes, who had also to face the Italians on the coast and a restless Menelik of Shewa, led a great army against the Mahdist fortifications at Gallabat in March 1889. His army was close to victory when he was mortally wounded; it broke up in retreat, and the Mahdists sent his head to Omdurman. The war exhausted both sides and opened the way for Menelik’s accession and Italy’s advance into Eritrea."
countries: [et, sd, er]
sides:
  - id: et
    name: Ethiopian Empire (Yohannes IV)
    polities: [ethiopia]
    ink: gold
    moves: Ethiopian moves
    success: Ethiopian success
  - id: md
    name: Mahdist State
    polities: [mahdist-state]
    ink: green
    moves: Mahdist moves
    success: Mahdist success
notes:
  - The Mahdists called themselves the Ansar (helpers); the British called them Dervishes. Their state was led after the Mahdi’s death in June 1885 by the Khalifa Abdallahi ibn Muhammad, who saw Ethiopia as an enemy once it had helped the Egyptian garrisons.
  - Gallabat, on the Sudanese side, and Metemma, on the Ethiopian side, are twin towns on the trade route from the Nile valley to Gondar; the battle of 1889 is known by both names. Army sizes on both sides, given in the sources as tens of thousands, are rough estimates, and no reliable count of the dead exists.
  - The site of Kufit, between Keren and Kassala, and the battlefield of Sar Weha cannot be located precisely and have no markers.
