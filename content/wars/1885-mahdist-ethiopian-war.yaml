  - title: The death of Yohannes at Gallabat
    date: 9–12 March 1889
    when: "1889-03-09"
    borders: "1889-03-12"
    countries: [et, sd]
    body:
      - In early 1889 Yohannes gathered his army in Dembiya, north of Lake Tana; the sources speak of 130,000 foot and 20,000 horse, certainly an exaggeration. The Mahdists, under Zeki Tummal since Abu Anja had died of illness, waited behind a thorn-bush zariba around Gallabat. The Ethiopians attacked on 9 March 1889, broke through at one point and nearly destroyed one Mahdist division, while their left wing lost its commander, Ras Haile Maryam Gugsa. Yohannes took command himself, was wounded in the hand and then shot in the chest. He died that night, after naming his son Ras Mengesha as heir.
      - The army, on the point of victory, turned back towards the Atbara with the emperor’s body. On 12 March Zeki Tummal caught Ras Alula’s rearguard, captured the body and sent the head to the Khalifa in Omdurman, where it was displayed. Each side probably lost several thousand men; no reliable figures exist.
      - The war had exhausted both sides. The Mahdists never again put so large an army into the field. In Ethiopia Tigray’s claim to the throne collapsed, and within weeks Menelik of Shewa was recognised as emperor; the Italians used the confusion to occupy Keren and Asmara in the summer of 1889. Menelik later sought good relations with the Khalifa, and the two never fought again.
    facts:
      - [Battle of Gallabat (Metemma), "9–10 March 1889, Mahdist victory"]
      - [Yohannes IV, "mortally wounded, died 9–10 March 1889"]
      - [Ethiopian rearguard overtaken, "12 March 1889"]
