  - title: Frenchman’s Butte, Loon Lake and the surrenders
    date: May – July 1885
    when: "1885-05-28"
    borders: "1885-07-02"
    countries: [ca]
    body:
      - Strange’s Alberta Field Force, about 1,000 men including the Winnipeg Light Infantry, the 65th Mount Royal Rifles of Montreal and Sam Steele’s mounted scouts, left Calgary on 20 April, reached Edmonton on 1 May and went down the North Saskatchewan by boat and overland. It buried the dead at Frog Lake and reoccupied the ruins of Fort Pitt. On 28 May it found Big Bear’s band dug in on the slopes above a creek at Frenchman’s Butte. After hours of firing across the muskeg, Strange, fearing that he would be outflanked, withdrew to Fort Pitt; the Cree, short of ammunition, slipped away north the same day.
      - Steele’s scouts followed the band and caught up with it on 3 June at a narrows of Makwa (Loon) Lake. In the last fight of the conflict, Cree marksmen held off the scouts while the rest crossed the narrows; several Cree were killed. The band then broke up. The prisoners were released, Wandering Spirit gave himself up at Fort Pitt, and Imasees and other men fled to Montana. Big Bear, with his youngest son, evaded the troops searching for him and on 2 July walked into Fort Carlton and surrendered to a police sergeant.
    facts:
      - [Battle of Frenchman’s Butte, "28 May 1885"]
      - [Battle of Loon Lake, "3 June 1885"]
      - [Big Bear surrenders, "2 July 1885"]
