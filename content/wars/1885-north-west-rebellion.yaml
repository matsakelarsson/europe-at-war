  - title: Batoche
    date: 9–15 May 1885
    when: "1885-05-12"
    borders: "1885-05-12"
    countries: [ca]
    view:
      center: [-106.13, 52.66]
      size: [60, 60]
    body:
      - Middleton resumed his advance on 7 May with about 900 men, four guns and a Gatling gun handled by an American officer, Arthur Howard, while the steamer Northcote, fortified with planks and carrying troops, came down the river to attack from the water. On 9 May his troops reached Batoche, where about 250 to 300 Métis and Dakota held rifle pits along the edge of the woods and the riverbank. The Northcote arrived too early and drifted past the village under fire; the Métis lowered the ferry cable, which tore off its funnels and masts, and it took no further part.
      - For three days the soldiers, camped in a fortified enclosure, a zareba, east of the village, skirmished with the defenders without trying to storm their pits, while the Métis, short of ammunition, fired nails and stones. On the afternoon of 12 May the Midland Battalion and the Royal Grenadiers, tired of waiting, charged on their own initiative, followed by the 90th Winnipeg Rifles, and overran the rifle pits and the village. Middleton reported eight killed and 46 wounded; modern historians put the Métis dead at about 12 to 16, among them several old men, including José Ouellette, who was 93.
      - The provisional government collapsed. Riel gave himself up to scouts on 15 May. Dumont escaped to Montana, where he later toured with Buffalo Bill’s Wild West show; he returned to Batoche in 1893. Soldiers and volunteers looted and burned Métis homes around Batoche.
    facts:
      - [Battle of Batoche, "9–12 May 1885"]
      - [Canadian forces, "about 900 men"]
      - [Riel surrenders, "15 May 1885"]
