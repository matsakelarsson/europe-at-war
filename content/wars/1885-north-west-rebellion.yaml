  - id: fn
    name: Cree and Assiniboine bands (Big Bear’s, Poundmaker’s and others)
    polities: [cree, assiniboine]
    ink: olive
    moves: Cree and Assiniboine moves
    success: Cree and Assiniboine success
  - id: can
