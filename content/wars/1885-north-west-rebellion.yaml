  - title: Middleton’s advance and Fish Creek
    date: April 1885
    when: "1885-04-24"
    borders: "1885-04-24"
    countries: [ca]
    body:
      - The government raised some 5,000 men, permanent soldiers and militia from Ontario, Quebec, Manitoba and the Maritimes, along with Mounted Police and local scouts. The Canadian Pacific Railway, still unfinished north of Lake Superior, carried them west within days; where the line had gaps they marched across the ice or rode in open sleighs. Middleton planned three columns. He himself would march north from Qu’Appelle station against Batoche; Lieutenant Colonel William Otter would march from Swift Current to relieve Battleford; and Major General Thomas Bland Strange would lead a force from Calgary to Edmonton and down the North Saskatchewan against Big Bear.
      - Middleton left Qu’Appelle on 6 April with about 800 men and reached the South Saskatchewan at Clarke’s Crossing on 17 April, where he divided his force between the two banks to advance on Batoche. On 23 April Dumont, with some 150 to 200 Métis and Dakota from Whitecap’s band, set an ambush in the wooded ravine of Fish Creek, known as Tourond’s Coulee. When Middleton’s scouts ran into it on the morning of 24 April, the Métis fired from rifle pits on the slopes, and the soldiers’ attacks into the ravine failed. Middleton lost ten or eleven killed and some 40 wounded; the Métis and Dakota lost fewer men, with estimates from four to eleven killed, and many horses. Middleton halted for two weeks to bring up supplies, reinforcements and the steamer Northcote.
      - Otter left Swift Current on 13 April with some 500 men, crossed the South Saskatchewan at Saskatchewan Landing and reached Battleford on 24 April, the day of Fish Creek, without meeting any resistance.
    facts:
      - [Canadian forces raised, "about 5,000 men"]
      - [Battle of Fish Creek, "24 April 1885"]
      - [Battleford relieved, "24 April 1885"]
