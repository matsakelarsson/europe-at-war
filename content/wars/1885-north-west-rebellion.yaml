id: north-west-rebellion
name: North-West Rebellion
start: "1885-03-26"
end: "1885-07-02"
tier: A
summary: "The armed resistance of the Métis of the Saskatchewan valley, led by Louis Riel and Gabriel Dumont, and of some Cree and Assiniboine (Nakoda) bands against the government of Canada in the spring of 1885, also called the North-West Resistance. The Métis, many of whom had left Manitoba after 1870, petitioned in vain for title to their river-lot farms, while the Cree, Assiniboine and other First Nations of the plains, who had signed Treaty 6 in 1876, were starving after the buffalo disappeared and the government cut their rations. Riel, called back from Montana, declared a provisional government at Batoche on 19 March 1885, and on 26 March the Métis defeated the North-West Mounted Police at Duck Lake. Warriors of Big Bear’s band killed nine men at Frog Lake on 2 April, and Cree and Assiniboine looted Battleford. The government sent some 5,000 troops west, many of them by the nearly finished Canadian Pacific Railway. The Métis stopped General Frederick Middleton at Fish Creek on 24 April, and Cree and Assiniboine under Fine Day drove off Colonel William Otter at Cut Knife on 2 May, but Middleton took Batoche on 12 May, and Riel surrendered. Poundmaker gave himself up on 26 May, Big Bear on 2 July. Riel was hanged for high treason at Regina on 16 November 1885, and eight Cree and Assiniboine men were hanged at Battleford on 27 November, the largest mass execution in Canadian history. The conflict confirmed Canadian control of the prairies, deepened the divide between English and French Canada and was followed by harsh controls on the First Nations of the plains."
countries: [ca]
sides:
  - id: met
    name: Métis provisional government (Louis Riel and Gabriel Dumont, with Dakota allies of Whitecap’s band)
    polities: [metis]
