    polities: [canada]
    ink: red
    moves: Canadian moves
    success: Canadian success
notes:
  - "The conflict has long been called the North-West Rebellion; Métis organisations, many historians and The Canadian Encyclopedia now call it the North-West Resistance. Most First Nations of the region took no part, and of those who did, many leaders, among them Big Bear and Poundmaker, tried to restrain their young men; the government nevertheless treated whole bands as rebels."
  - "Accounts of the fighting come mostly from Canadian officers and soldiers; Métis and Cree testimony, gathered at the trials and later from survivors and oral history, gives a different view of events such as Frog Lake, Battleford and Cut Knife. Losses differ between sources, especially for the Métis and First Nations."
