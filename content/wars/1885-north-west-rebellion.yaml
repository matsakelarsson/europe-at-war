  - title: Trials and executions
    date: July – November 1885
    when: "1885-11-16"
    borders: "1885-11-27"
    countries: [ca]
    body:
      - Riel was tried for high treason at Regina from 20 July 1885 before a stipendiary magistrate and a jury of six English-speaking men. His lawyers argued that he was insane; Riel rejected the defence and, in two long speeches, defended the Métis cause and his own mission. On 1 August the jury found him guilty but recommended mercy. Appeals to the Manitoba court and the Privy Council in London failed, a medical commission found him sane enough to hang, and Prime Minister John A. Macdonald’s cabinet refused clemency despite petitions from Quebec. Riel was hanged at Regina on 16 November 1885. In Quebec, where he was seen as a French Canadian and a Catholic put to death by an English Protestant government, tens of thousands protested in Montreal, and the execution divided Canadian politics for a generation.
      - Big Bear and Poundmaker, who had both tried to prevent bloodshed, were convicted of treason-felony and sentenced to three years in Stony Mountain Penitentiary in Manitoba; both were released early in broken health and died within months, Poundmaker in 1886 and Big Bear in 1888. Most of the Métis tried received prison terms. Eleven Cree and Assiniboine men were sentenced to death for killings at Frog Lake and near Battleford, and three sentences were commuted. On 27 November 1885 the other eight, among them Wandering Spirit, were hanged together at Fort Battleford, tried without defence lawyers, with people from the nearby reserves made to watch.
      - The government withheld annuities from bands it called disloyal, took their horses and guns and introduced a pass system to keep First Nations people on their reserves, which had no basis in law. Delays continued in the Métis land claims. In 2019 the government of Canada exonerated Poundmaker and apologised to his nation. Riel, long seen in English Canada as a traitor, is now honoured as the founder of Manitoba.
