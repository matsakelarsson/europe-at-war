  - title: Cut Knife
    date: May 1885
    when: "1885-05-02"
    borders: "1885-05-02"
    countries: [ca]
    body:
      - At Battleford Otter decided to punish Poundmaker’s band, which he blamed for the looting of the town. On the night of 1 May he set out with some 350 to 390 police and soldiers, two seven-pounder guns and a Gatling gun, and at dawn on 2 May attacked the Cree and Assiniboine camp beside Cut Knife Hill, on Poundmaker’s reserve. Assiniboine warriors charged to cover the women and children, and the war chief Kamiokisihkwew (Fine Day) spread his men through the coulees around the hill, from which they nearly surrounded the soldiers.
      - After some six hours of fighting Otter withdrew across the creek and back to Battleford. Some of the Cree prepared to pursue the retreating column, but Poundmaker persuaded them to let it go. Otter lost eight killed and 14 wounded; the Cree and Assiniboine lost five or six killed.
      - The camp then began to move east to join Riel. On 14 May its warriors captured an army supply train in the Eagle Hills and took its teamsters prisoner, unharmed. When news came of the fall of Batoche, Poundmaker sent a message of peace to Middleton, and on 26 May he and the other chiefs of the camp came into Battleford and gave themselves up.
    facts:
      - [Battle of Cut Knife, "2 May 1885"]
      - [Otter’s losses, "8 killed, 14 wounded"]
      - [Poundmaker surrenders, "26 May 1885"]
