  - title: Duck Lake
    date: 26–28 March 1885
    when: "1885-03-26"
    borders: "1885-03-28"
    countries: [ca]
    body:
      - On 26 March Superintendent Leif Crozier marched out of Fort Carlton with about 55 Mounted Police and 40 Prince Albert Volunteers and a seven-pounder gun to recover supplies at Duck Lake, without waiting for the reinforcements that were on their way under Commissioner Acheson Irvine. A few kilometres from the village he met a force of some 200 to 250 Métis and Cree under Gabriel Dumont. Dumont’s brother Isidore and the Cree elder Assiyiwin, from Beardy’s reserve, came forward under a white flag to parley; in the confusion Crozier’s interpreter shot them both, and the fighting began.
      - The Métis, firing from a slope and from a log house on the police flank, had the advantage; the cannon was disabled when it was loaded the wrong way round. After about half an hour Crozier ordered a retreat, leaving his dead. He lost 12 killed and 11 wounded, the Métis five or six killed, among them Isidore Dumont and Assiyiwin; Gabriel Dumont was wounded in the head. Riel, who had ridden among his men holding a crucifix, stopped them from pursuing the beaten column.
      - Irvine judged Fort Carlton indefensible, and on 27–28 March the police and volunteers abandoned it for Prince Albert; a fire started during the evacuation burned much of the post. The news of Duck Lake spread to the reserves and, by telegraph, to eastern Canada, where the government called out the militia and gave command to General Frederick Middleton.
    facts:
      - [Battle of Duck Lake, "26 March 1885, Métis victory"]
      - [Government losses, "12 killed, 11 wounded"]
      - [Fort Carlton abandoned, "27–28 March 1885"]
