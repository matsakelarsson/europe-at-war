steps:
  - title: Grievances and the provisional government
    date: 1876 – March 1885
    when: "1885-03-19"
    borders: "1885-03-19"
    countries: [ca]
    body:
      - After 1870 many Métis left Manitoba for the valley of the South Saskatchewan, where they founded the parishes of St. Laurent, Batoche, St. Louis and Duck Lake on long river lots, as at Red River, and lived by farming, freighting and the last buffalo hunts. Dominion surveyors laid out square townships, Ottawa was slow to confirm the Métis’ titles, and their petitions went unanswered; English-speaking farmers around Prince Albert had grievances of their own. In June 1884 a delegation led by Gabriel Dumont, the famous buffalo-hunt captain, rode to Montana to ask Louis Riel, then a schoolteacher in exile, to lead them. Riel arrived in July, and in December a petition was sent to Ottawa; the government answered with a promise to study the claims.
      - The Cree, Assiniboine and Saulteaux of the plains had signed Treaty 6 at Fort Carlton and Fort Pitt in 1876, giving up their claim to a vast territory in return for reserves, annuities, tools and a promise of help in times of famine. Within a few years the buffalo were gone. To press the bands onto reserves, the Indian commissioner, Edgar Dewdney, kept rations low, and many people starved. Mistahimaskwa (Big Bear), who had refused to sign until hunger forced him in 1882, worked to unite the Cree bands to win better terms, and at a Thirst Dance on Poundmaker’s reserve in June 1884 a confrontation with the police nearly ended in bloodshed. In Big Bear’s band influence passed to younger men, among them his son Imasees and the war chief Kapapamahchakwew (Wandering Spirit).
      - "In March 1885, convinced that Ottawa would not listen and that he had a religious mission, Riel moved to open defiance. On 18–19 March his followers seized the church at Batoche, took several government men prisoner, cut the telegraph and formed a provisional government, the Exovedate, with Dumont as its military commander. Riel demanded the surrender of Fort Carlton, held by the North-West Mounted Police, and appealed to the English-speaking settlers and the Cree to join him. Most of the clergy, the English-speaking settlers and the First Nations chiefs stayed aloof."
    facts:
      - [Treaty 6, "August – September 1876"]
      - [Riel returns from Montana, "July 1884"]
      - [Provisional government proclaimed, "18–19 March 1885"]
