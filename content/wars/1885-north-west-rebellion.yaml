  - title: Battleford, Frog Lake and Fort Pitt
    date: March – April 1885
    when: "1885-04-02"
    borders: "1885-04-17"
    countries: [ca]
    body:
      - On 30 March Cree from Poundmaker’s and Little Pine’s reserves and Assiniboine (Nakoda) from the Eagle Hills came to Battleford to ask for food and for news. Some 500 townspeople had fled into the Mounted Police barracks, and the Indian agent would not come out to meet them. The visitors took food and goods from the empty stores and houses, and some were later burned. In the Eagle Hills Assiniboine men killed two men, the farm instructor James Payne and the farmer Barney Tremont. The townspeople stayed in the barracks for nearly a month; newspapers in the East called it a siege, but historians note that the Cree never attacked the fort.
      - At Frog Lake, where Big Bear’s band and the Woods Cree of the Frog Lake reserve were camped, Wandering Spirit and other warriors, angry at the Indian agent Thomas Quinn and encouraged by the news of Duck Lake, rounded up the settlement’s people on the morning of 2 April. When Quinn refused to go to their camp, Wandering Spirit shot him, and others then killed eight more men, among them the priests Léon Fafard and Félix Marchand. Big Bear shouted to them to stop. The Hudson’s Bay Company clerk William Cameron was spared with the help of Cree in the camp, and two widows, Theresa Delaney and Theresa Gowanlock, were later ransomed by Métis men in the camp. The killings, known as the Frog Lake Massacre, turned public opinion in the East against the Cree as a whole.
      - Big Bear’s band then moved on to Fort Pitt, where Inspector Francis Dickens, a son of the novelist, held the post with 23 police. After a police scouting party rode into the Cree camp on 15 April, where Constable David Cowan was killed and another man wounded, Dickens and his men withdrew down the river to Battleford, and the civilians, led by the trader W. J. McLean, went into the Cree camp as prisoners; the Cree looted the fort. Other bands looted company posts at Lac La Biche and Green Lake.
    facts:
      - [Looting of Battleford, "30 March 1885"]
      - [Frog Lake, "2 April 1885, nine men killed"]
      - [Fort Pitt abandoned, "15 April 1885"]
