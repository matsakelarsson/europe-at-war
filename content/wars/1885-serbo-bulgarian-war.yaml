id: serbo-bulgarian-war
name: Serbo-Bulgarian War
start: "1885-11-14"
end: "1885-11-28"
tier: B
summary: A two-week war in November 1885 in which Serbia, objecting to the union of Bulgaria and Eastern Rumelia, invaded Bulgaria and was defeated at Slivnitsa and Pirot. Austria-Hungary stopped the Bulgarian counter-offensive, the Treaty of Bucharest of March 1886 restored peace without changing borders, and the powers accepted the Bulgarian union in the Tophane Agreement.
countries: [bg, rs]
sides:
