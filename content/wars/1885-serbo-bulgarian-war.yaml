steps:
  - title: The union and Slivnitsa
    date: September – November 1885
    when: "1885-09-18"
    borders: "1885-11-19"
    countries: [bg, rs]
    body:
      - The Congress of Berlin in 1878 had split the Bulgarian lands, leaving Eastern Rumelia an autonomous Ottoman province. On 18 September 1885 a revolutionary committee and local militia seized power in its capital, Plovdiv, and proclaimed union with the Principality of Bulgaria, and Prince Alexander of Battenberg accepted it. Russia, at odds with Alexander, withdrew its officers from the Bulgarian army, leaving it with no one above the rank of captain. King Milan of Serbia claimed that the balance of Berlin had been upset, and on 14 November, with most Bulgarian troops guarding the Ottoman border far to the south-east, he invaded.
      - The main Serbian army crossed at Tsaribrod and advanced on Sofia, which lay only some 60 kilometres from the border. The Bulgarians brought troops north from the Rumelian frontier in forced marches and dug in at Slivnitsa, a pass on the road to the capital. There, from 17 to 19 November, they beat off the Serbian attacks and then counter-attacked, with Prince Alexander in command. In the north-west a smaller Serbian army laid siege to Vidin, whose garrison held out.
    facts:
      - [Union proclaimed in Plovdiv, "18 September 1885"]
      - [Serbia declares war, "14 November 1885"]
      - [Battle of Slivnitsa, "17–19 November 1885, Bulgarian victory"]
