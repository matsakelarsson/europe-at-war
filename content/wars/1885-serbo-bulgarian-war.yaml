    name: Serbia
    polities: [serbia]
    ink: red
    moves: Serbian moves
    success: Serbian success
  - id: bg
    name: Bulgaria
    polities: [bulgaria, eastern-rumelia]
    ink: green
    moves: Bulgarian moves
    success: Bulgarian success
notes:
  - Bulgaria and Serbia used the Julian (Old Style) calendar, 12 days behind the Gregorian in the 19th century; Bulgarian accounts date the union to 6 September and the war to 2–16 November 1885. All dates here are New Style.
  - Tsaribrod is today’s Dimitrovgrad in Serbia; the town passed from Bulgaria to Yugoslavia in 1920.
