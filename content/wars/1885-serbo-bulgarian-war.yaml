        date: 24 November 1885
        text: Retaken by the Bulgarians as they pursued the Serbian army back across the border.
        lonlat: [22.776, 43.016]
        lp: l
      - kind: battle
        side: bg
        name: Battle of Pirot
        date: 26–27 November 1885
        text: The Bulgarian Western Corps took the town from the Nišava Army; an Austro-Hungarian ultimatum halted its advance.
        lonlat: [22.586, 43.155]
      - kind: treaty
        name: Treaty of Bucharest
        date: 3 March 1886
        text: Serbia and Bulgaria made peace in the Romanian capital, restoring the borders as they had been.
        lonlat: [26.1, 44.43]
      - kind: treaty
        name: Tophane Agreement
        date: 5 April 1886
        text: Signed in the Tophane quarter of Constantinople; it made the union of Bulgaria and Eastern Rumelia a fact recognised by the powers.
        lonlat: [28.982, 41.027]
