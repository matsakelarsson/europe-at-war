  - title: Pirot and the peace
    date: November 1885 – April 1886
    when: "1885-11-24"
    borders: "1886-04-05"
    countries: [bg, rs, tr]
    body:
      - The Bulgarians retook Tsaribrod on 24 November, crossed into Serbia and on 26–27 November beat the Serbian army at Pirot and took the town. The road to Niš lay open. On 28 November the Austro-Hungarian envoy, Count Rudolf Khevenhüller, warned Prince Alexander that Austro-Hungarian troops would enter the war if the Bulgarians went further, and the fighting stopped. The Bulgarians withdrew from Pirot under the armistice.
      - The Treaty of Bucharest, signed on 3 March 1886, had a single article restoring peace, and no border changed. In the Tophane Agreement of 5 April the Ottoman Empire and the powers recognised the Prince of Bulgaria as governor-general of Eastern Rumelia, accepting the union in practice; the Ottomans received the Kardzhali district in the Rhodopes in return. The victory made the young Bulgarian army a source of national pride, but Russia did not forgive Alexander, and in August 1886 pro-Russian officers overthrew him.
    facts:
      - [Battle of Pirot, "26–27 November 1885, Bulgarian victory"]
      - [Treaty of Bucharest, "3 March 1886"]
      - [Tophane Agreement, "5 April 1886"]
    markers:
      - kind: taken
        side: bg
