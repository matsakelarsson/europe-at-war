notes:
  - The British and Indian armies called the Burmese fighters dacoits, from the Hindi dakait, an armed robber, and treated resistance as a police matter. Some bands did live by plunder, but most historians now describe the fighting of 1885–1895 as an anti-colonial resistance led by princes, officials, monks and village headmen. The text uses “resistance” and gives the British word where it quotes British policy.
  - The official dates of the war are 7–29 November 1885. Organised resistance in the plains was largely over by 1890; fighting in the hills went on to 1895, and some accounts end the resistance in 1896. Kachin resistance went on longer, to 1914–1915.
  - Losses on the Burmese side are not known. The British Army counted 1,532 dead in Upper Burma and the military police 46, most of them from disease.
