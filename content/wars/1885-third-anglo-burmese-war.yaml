      - [Ultimatum, "22 October 1885"]
      - [British force, "3,029 British and 6,005 Indian troops, 67 guns"]
      - [Minhla, "17 November 1885, British victory"]
      - [Mandalay entered, "28 November 1885"]
      - [Annexation proclaimed, "1 January 1886"]
