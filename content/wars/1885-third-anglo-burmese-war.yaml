  - title: The resistance in Upper Burma
    date: 1886–1895
    when: "1886-01-01"
    borders: "1887-06-01"
    countries: [mm]
    body:
      - On 1 January 1886 Lord Dufferin proclaimed Upper Burma part of British India, and the monarchy was abolished. Resistance had begun at once. Lieutenants of the Myinzaing prince, a son of Mindon, gathered Shan and Burmese followers east of Mandalay and attacked the city on 31 December 1885; the Hteiktin princes took Shwebo; in the west the monk U Ottama took Sagu in the Minbu district in February 1886, and Bo Swe fought on in the Minbu and Thayetmyo country until he was killed. In Lower Burma, the Mayanchaung monk led attacks on towns along the Sittang in December 1885, until he was captured and publicly hanged at Kyaikto in March 1886. Most of the fighters were soldiers of the disbanded royal army and villagers led by their headmen and local officials, and they fought in small bands that the British, calling them dacoits, hunted as criminals.
      - The British answer was to flood the country with troops. Sir Frederick Roberts, commander-in-chief in India, came in 1886 and covered Upper Burma with a network of small military and police posts and mobile columns; tens of thousands of soldiers and military police were deployed. The Upper Burma Village Regulation of 1887, applied under Chief Commissioner Sir Charles Crosthwaite, made villages collectively responsible for attacks in their area, fined them, and allowed the authorities to remove whole villages and resettle their people where they could be watched; villages that sheltered fighters were burned, and captured leaders were hanged. The princes were killed, died of fever or were handed over, among them the Setkya prince, captured by the Lawksawk sawbwa in 1888 and executed. In 1888–1889 columns broke the rising of U Po Saw, who had taken Mogaung with Kachin support.
      - In the Shan states, a group of sawbwas had formed the Limbin Confederacy around the Limbin prince, a son of Mindon’s brother and heir, the Kanaung prince, as a rival to Thibaw, and later to resist the British. British columns entered the Shan plateau in 1887, built Fort Stedman by Inle Lake and played on the feuds among the sawbwas; the Limbin prince submitted and was held in Calcutta until 1912, and the Shan states were ruled through their sawbwas as British protectorates. Expeditions into the Chin Hills in 1888–1890 and the Kachin Hills in 1892–1893 brought the hill peoples under British rule; the last Chin leaders surrendered in 1894. By 1895 the resistance was over in most of the country.
    facts:
      - [Upper Burma annexed, "1 January 1886"]
      - [Attack on Mandalay, "31 December 1885"]
      - [Upper Burma Village Regulation, "1887"]
      - [British Army dead in Upper Burma, "1,532, mostly from disease"]
