id: third-anglo-burmese-war
name: Third Anglo-Burmese War
start: "1885-11-07"
end: "1895"
tier: B
summary: "The British conquest of the Konbaung kingdom of Upper Burma, and the long resistance that followed. Relations between British India and King Thibaw’s court at Mandalay had been poor since his accession in 1878, and the British feared the court’s dealings with France, which was then conquering Tonkin. In 1885 the Burmese council of ministers (Hluttaw) fined the Bombay Burmah Trading Corporation, a British teak firm, for under-reporting the timber it took from the Toungoo forests and underpaying its workers. The Viceroy, Lord Dufferin, answered with an ultimatum on 22 October 1885 that would have put Burma’s foreign relations under British control. When the court refused, a flotilla of steamers under Major-General Harry Prendergast carried about 9,000 British and Indian troops up the Irrawaddy, took the forts at Minhla on 17 November and reached Mandalay on 28 November. Thibaw surrendered and was exiled to Ratnagiri in India, where he died in 1916, and on 1 January 1886 Upper Burma was annexed to British India. Princes, former officials, soldiers of the disbanded army, monks and village leaders then fought the occupation for about ten years. British reports called them “dacoits”, armed robbers; Burmese histories call it a resistance movement. The British needed tens of thousands of soldiers and military police, collective punishments of villages and the resettlement of villagers to end it, and they extended their rule over the Shan states and the Chin and Kachin hills."
