steps:
  - title: The ultimatum and the river war
    date: October – November 1885
    when: "1885-11-14"
    borders: "1885-11-28"
    countries: [mm]
    body:
      - After the war of 1852–1853 the Konbaung kingdom was cut off from the sea. King Mindon modernised his army and administration from his new capital, Mandalay, and kept on terms with the British. His son Thibaw came to the throne in 1878 in a court struggle that ended with the killing of dozens of his royal relatives, and the British Resident soon left Mandalay. The court looked to France for help; a Burmese mission negotiated in Paris in 1883–1885, and the French consul at Mandalay, Haas, discussed a French bank and a railway concession. In London and Calcutta this was seen as a threat at a time when France was conquering Tonkin, next to Burma’s Shan lands.
      - In August 1885 the Hluttaw fined the Bombay Burmah Trading Corporation, which held the teak forests north of Toungoo, for taking more timber than it reported and for not paying its foresters. The company appealed to the British, and on 22 October Lord Dufferin sent an ultimatum, demanding that the case be referred to a British envoy, that a British Resident be received at Mandalay, that Burma’s foreign relations be conducted under British guidance and that the British be allowed to trade with China through Burma. The court’s reply was taken as a refusal. On 7 November Thibaw called on his people to drive out the invaders.
      - Prendergast’s force, 3,029 British troops, 6,005 Indian soldiers and 67 guns on more than 55 steamers, barges and launches, set off from the frontier at Thayetmyo on 14 November and seized the king’s steamer. On 17 November it stormed the new forts of Minhla and Gwegyaung Kamyo on either bank, where the Burmese lost about 170 killed and 276 taken prisoner. The flotilla silenced the river batteries at Nyaung-U, Pakokku and Myingyan, and on 26 November, near Ava, envoys came aboard to offer surrender. The next day the Hluttaw ordered its garrisons to lay down their arms, but many soldiers dispersed with their weapons. British troops entered Mandalay on 28 November; Thibaw surrendered, and on 29 November he and Queen Supayalat were taken down river by steamer, to exile at Ratnagiri on the coast south of Bombay. Prendergast went on up the river to Bhamo, near the Chinese border, by 28 December.
