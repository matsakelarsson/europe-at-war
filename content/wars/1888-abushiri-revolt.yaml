steps:
  - title: The company takes the coast
    date: April – December 1888
    when: "1888-09"
    borders: "1888-12-01"
    countries: [tz]
    body:
      - "Carl Peters’ treaties with chiefs of the interior in 1884 had brought Germany a claim to the mainland behind Zanzibar, and in 1886 Germany and Britain agreed that a strip of the coast about ten miles deep should remain the sultan’s. On 28 April 1888 Sultan Khalifa bin Said, under German pressure, leased it to the German East Africa Company, which was to collect the customs and govern in his name. In August 1888 the company’s agents landed in the coastal towns, ran up its flag beside or in place of the sultan’s, took over the customs houses and demanded proof of title to land and new taxes. At Pangani the attempt of the agent Emil von Zelewski to raise the company’s flag over the town caused particular anger."
      - "In September the coast rose. At Pangani the planter Abushiri ibn Salim al-Harthi led townspeople and the men of the plantations and the hinterland against the company; Bwana Heri, ruler of Saadani and its Zigua hinterland, joined. The company’s men were driven out of Tanga and Pangani, two of its agents were killed at Kilwa, and those at Lindi and Mikindani fled. Only Bagamoyo and Dar es Salaam, where the company’s men were protected by marines and the guns of German warships, held out, and they were attacked again and again. Benedictine missionaries at Pugu, near Dar es Salaam, were killed or taken prisoner in January 1889."
    facts:
      - [Coast leased to the company, "28 April 1888"]
      - [Company takes over the towns, "August 1888"]
      - [Rising begins, "September 1888"]
