  - title: Wissmann and the death of Abushiri
    date: January – December 1889
    when: "1889-05-08"
    borders: "1889-12-15"
    countries: [tz, de]
    body:
      - "The company could not put down the rising, and early in 1889 Bismarck made Hermann von Wissmann, an officer who had explored the Congo basin, imperial commissioner with funds from the Reichstag. Wissmann hired German officers and NCOs and recruited several hundred African soldiers, Sudanese veterans of the Egyptian army and Shangaan men from Mozambique. German and British warships had blockaded the coast since December 1888 to stop arms coming in."
      - "Abushiri’s alliance with the peoples of the hinterland had begun to break down, and he had hired Arab mercenaries to hold a stockade outside Bagamoyo. After a truce, Wissmann’s force, landed at Bagamoyo, stormed the fort on 8 May 1889, killing many of its defenders; Abushiri escaped inland. In June and July Wissmann’s troops, carried and covered by the navy, took Saadani, Pangani and Tanga. Abushiri raised new followers among the Mbunga and others inland, but his attacks on Dar es Salaam and Bagamoyo failed and his men deserted. In December a Zigua headman seized him and handed him over to the Germans, who hanged him at Pangani on 15 December 1889."
    facts:
      - [Wissmann made imperial commissioner, "early 1889"]
      - [Abushiri’s fort stormed, "8 May 1889"]
      - [Abushiri hanged at Pangani, "15 December 1889"]
