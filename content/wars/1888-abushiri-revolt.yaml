id: abushiri-revolt
name: Abushiri revolt
start: "1888-08"
end: "1890-05"
tier: B
summary: "The rising of the Swahili coast of present-day Tanzania against the German East Africa Company. In April 1888 Sultan Khalifa of Zanzibar leased the mainland coast to the company, and when its agents arrived in August, hauled down the sultan’s flags and took over the customs houses, the towns rose. Led at Pangani by Abushiri ibn Salim al-Harthi, a planter of Arab and Oromo descent, and at Saadani by Bwana Heri, Swahili townspeople, Arab planters and traders and the peoples of the hinterland drove the company out of every port except Bagamoyo and Dar es Salaam, which held out with the help of German warships. Germany and Britain blockaded the coast, and in 1889 the imperial commissioner Hermann von Wissmann, with an army of African soldiers recruited in Egypt and Mozambique, stormed Abushiri’s fort near Bagamoyo (8 May) and retook the northern ports. Abushiri was betrayed and hanged at Pangani on 15 December 1889; Bwana Heri submitted early in 1890, and Kilwa, Lindi and Mikindani were retaken in May. The German government took over the colony from the company on 1 January 1891, and Wissmann’s force became the core of the Schutztruppe."
countries: [tz, de]
sides:
  - id: cst
    name: Coastal resistance (Abushiri, Bwana Heri and their allies)
    polities: [abushiri-rising]
    ink: red
    moves: Moves of the coastal resistance
    success: Success of the coastal resistance
  - id: de
    name: German East Africa Company and Germany
    polities: [german-east-africa, germany]
    ink: slate
    moves: German moves
    success: German success
notes:
  - "German writers of the time called the rising the Arab Revolt (Araberaufstand), presenting it as the work of slave traders resisting abolition. Historians since the 1960s, among them John Iliffe and Jonathon Glassman, have shown that it was a broad rising of the coast: Swahili townspeople, Arab and Swahili planters who used slave labour, caravan traders and Zigua, Yao and other peoples of the hinterland, each with their own grievances against the company."
  - "The Royal Navy took part in the blockade of the coast from December 1888, which was declared against the import of arms and the export of slaves; British forces did not fight on land."
