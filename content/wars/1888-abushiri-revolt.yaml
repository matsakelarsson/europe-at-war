  - title: Bwana Heri and the south
    date: December 1889 – January 1891
    when: "1890-05"
    borders: "1891-01-01"
    countries: [tz, de]
    body:
      - "Bwana Heri fought on in the Zigua country behind Saadani and in December 1889 drove back a German column, but further expeditions in early 1890 forced him to come in and submit. In the south the rising, carried on by Yao and coastal leaders, had held Kilwa, Lindi and Mikindani for a year and a half. In May 1890 Wissmann sailed south with the navy and retook them, but Machemba, the Yao leader of the Makonde plateau, refused to submit and drove back the forces sent against him."
      - "By the Anglo-German agreement of 1 July 1890 Britain recognised the German sphere on the mainland, and the sultan sold the coastal strip to Germany for four million marks. On 1 January 1891 the German government took over the colony from the company, and Wissmann’s soldiers became the core of the Schutztruppe, the colonial army. The rising had cost the coast heavily: its towns had been shelled and burned and its trade cut off by the blockade, and the Germans now ruled it directly, through officials and akidas, local agents who were often hated."
    facts:
      - [Bwana Heri submits, "early 1890"]
      - [Kilwa, Lindi and Mikindani retaken, "May 1890"]
      - [German government takes over, "1 January 1891"]
