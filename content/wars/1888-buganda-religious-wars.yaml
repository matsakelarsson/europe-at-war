steps:
  - title: Three kings in one year
    date: 1885 – October 1888
    when: "1888-09"
    borders: "1888-10-21"
    countries: [ug, tz]
    body:
      - "Buganda, on the northern shore of Lake Victoria, was the strongest kingdom of the region, ruled by its kabaka through appointed chiefs. Kabaka Mutesa I had welcomed Muslim traders from the coast and, from 1877, Protestant missionaries of the Church Missionary Society and Catholic White Fathers, and many young men at his court became Muslims or Christians. His son Mwanga II, still in his teens when he succeeded in 1884, came to see the converts’ loyalty to their new faiths as a threat to his authority. In October 1885 he had the Anglican bishop James Hannington killed on his way into the country, and between 1885 and 1887 some forty-five Christian converts, Catholics and Anglicans, were put to death, many of them burned at Namugongo in June 1886; the Catholic Church honours them as the Uganda Martyrs."
      - "The converts nonetheless rose in the kabaka’s service, commanding new regiments armed with guns. In 1888, fearing that Mwanga meant to be rid of them, Muslims and Christians together turned on him; he fled across the lake to the south, and they made his brother Kiwewa kabaka and shared out the great offices. The alliance lasted a few weeks. In October 1888 the Muslims, backed by Arab traders, drove the Christian chiefs and the missionaries out of the country and on 21 October replaced Kiwewa with another brother, Kalema. The Christians found refuge on the borders of Ankole."
    facts:
      - [Uganda Martyrs killed, "1885–1887"]
      - [Mwanga deposed, "August or September 1888"]
      - [Kalema made kabaka, "21 October 1888"]
