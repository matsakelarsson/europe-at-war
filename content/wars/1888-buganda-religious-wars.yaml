  - title: Lugard and the battle of Mengo
    date: December 1890 – spring 1892
    when: "1892-01-24"
    borders: "1892-04-30"
    countries: [ug, gb]
    body:
      - "Victory split the Christians. The Catholic party, the Fransa, and the Protestant party, the Ingleza, quarrelled over the chieftaincies, above all the office of katikiro (chief minister), which went to the Protestant Apolo Kaggwa, and Mwanga leaned towards the Catholics. In December 1890 Captain Frederick Lugard arrived with a small force for the Imperial British East Africa Company, built a fort on Kampala hill beside the capital and on 26 December persuaded Mwanga to sign a treaty accepting the company’s protection. In 1891 he led the Christian army against the Muslims on the Bunyoro border and then marched west through Toro to Lake Albert, where he enlisted the Sudanese soldiers left behind by Emin Pasha."
      - "In January 1892 a killing in the capital led to open war between the parties. Lugard gave rifles to the Protestants, and on 24 January the Maxim gun on his fort turned the battle against the Catholics; the Protestants burned the Catholic mission at Rubaga. Mwanga and the Catholic chiefs fled to Bulingugwe island, where the company’s troops attacked them with a Maxim gun and many were killed or drowned, and then to Buddu in the south-west. The fighting was reported in Europe as a massacre of Catholics, and France protested to Britain."
      - "Mwanga returned to his capital in the spring of 1892 and accepted the company’s terms. The chieftaincies were divided: the Catholics received the province of Buddu, the Protestants most of the rest, and in 1893 the Muslims three small counties. The company could not afford to stay; Britain took over, and declared a protectorate over Buganda in 1894. In 1897 Mwanga rose against the British himself."
    facts:
      - [Lugard’s treaty with Mwanga, "26 December 1890"]
      - [Battle of Mengo, "24 January 1892"]
      - [British protectorate, "1894"]
