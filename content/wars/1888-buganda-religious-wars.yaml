  - title: The Christians return
    date: 1889 – February 1890
    when: "1889-10-05"
    borders: "1890-02-28"
    countries: [ug]
    body:
      - "Mwanga escaped from the Arab traders who held him south of the lake and found shelter with the White Fathers. In 1889 he made common cause with the Christian exiles, who promised to restore him, and with boats and guns from the trader Charles Stokes he set himself up on the Sese and Bulingugwe islands in the lake. Under Kalema the Muslims, fearing a return of the old line, killed Kiwewa and many princes and princesses of the royal family."
      - "The Christian army, Catholics and Protestants together, took Mengo on 5 October 1889 and restored Mwanga. Kalema’s forces counter-attacked and drove Mwanga back to Bulingugwe in November, but in February 1890 the Christians took the capital for good. The Muslims withdrew to Singo on the border of Bunyoro, whose king Kabalega supported them; Kalema died there of smallpox in early 1891. That February the German Carl Peters reached Mengo and Mwanga signed a treaty with him, but in July 1890 Germany recognised Buganda as part of the British sphere."
    facts:
      - [Mengo taken by the Christian army, "5 October 1889"]
      - [Muslim counter-attack, "November 1889"]
      - [Christians take Mengo for good, "February 1890"]
