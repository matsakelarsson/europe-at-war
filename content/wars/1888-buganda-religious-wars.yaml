notes:
  - "The parties were named after the missions that had converted their leaders: the Fransa after the French Catholic White Fathers, the Ingleza after the English Protestants of the Church Missionary Society. They were political factions competing for chieftaincies and land as much as religious communities, and Muslims, Catholics and Protestants were all Baganda."
  - "Sources differ on several dates: Mwanga’s overthrow is dated 2 August or 10 September 1888, and the battle of Mengo 21 or 24 January 1892. Much of the story was first written by the missionaries of both churches and by Lugard, each defending their own side; the Ganda chief and historian Apolo Kaggwa, a Protestant leader in the wars, wrote another account."
