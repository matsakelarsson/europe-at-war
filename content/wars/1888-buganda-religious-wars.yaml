id: buganda-religious-wars
name: Buganda civil wars
start: "1888-09"
end: "1892-04"
tier: B
summary: "The wars between the Muslim, Catholic and Protestant parties of the kingdom of Buganda, which opened the way to British rule in Uganda. Converts to Islam and to the two Christian missions, many of them young chiefs and royal pages, had become powerful at the court, and Kabaka Mwanga II, who had had dozens of Christians killed in 1885–1887, tried to break them. In August or September 1888 Muslims and Christians together deposed him and enthroned his brother Kiwewa; within weeks the Muslims drove out the Christians and made another brother, Kalema, kabaka. Mwanga escaped and joined the Christian exiles, who won back the capital in October 1889, lost it, and took it for good in February 1890; Kalema withdrew towards Bunyoro. The victors then split into a Catholic party, the Fransa, and a Protestant party, the Ingleza. Frederick Lugard of the Imperial British East Africa Company, who arrived in December 1890, sided with the Protestants, and on 24 January 1892 his Maxim gun decided the battle of Mengo against the Catholics and Mwanga. The settlement that followed divided Buganda’s chieftaincies between the parties, and Buganda became a British protectorate in 1894."
countries: [ug, tz, gb]
