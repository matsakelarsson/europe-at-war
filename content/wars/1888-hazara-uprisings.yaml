notes:
  - Numbers are very uncertain. Afghan sources put the amir’s army at up to 40,000 regular troops and 10,000 cavalry, joined by as many as 100,000 tribal volunteers; the often-cited figure that more than 60 percent of the Hazaras were killed or displaced is an estimate by later historians.
