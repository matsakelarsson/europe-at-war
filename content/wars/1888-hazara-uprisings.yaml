id: hazara-uprisings
name: Hazara uprisings
start: "1888"
end: "1893"
tier: C
summary: The risings of the Hazaras of central Afghanistan against the amir Abdur Rahman Khan, who was bringing the Hazarajat, until then ruled by its own chiefs, under the direct control of Kabul. A first rising in 1888–1890, when Hazara chiefs joined the revolt of the amir’s cousin Mohammad Ishaq Khan, was put down, and Afghan governors, garrisons and taxes followed. In the spring of 1892 a wider revolt, sparked by abuses by Afghan soldiers, spread across the Hazarajat. The amir, with the support of Sunni clerics, declared a holy war against the mostly Shia Hazaras and raised a large army of regular troops and tribal levies, which took the centre of the revolt in Uruzgan in 1892 and crushed a last rising against taxation in 1893. Many thousands of Hazaras were killed, thousands of men, women and children were enslaved and sold in Kabul and Kandahar, much of their land was given to Pashtun nomads and settlers, and large numbers fled to British India (Quetta), Persia (Mashhad) and Russian Turkestan. Historians often estimate that more than half of the Hazara population was killed or driven out; several call it the worst case of ethnic cleansing or genocide in modern Afghan history.
