notes:
  - China, which claimed suzerainty over Tibet, negotiated the 1890 convention, but the Tibetan government did not accept it; its refusal to honour the agreement was one of the reasons given for the British expedition to Tibet in 1903–1904.
  - British casualties were light; Tibetan losses are not reliably known.
