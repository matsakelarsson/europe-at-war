id: sikkim-expedition
name: Sikkim expedition
start: "1888-03-20"
end: "1888-09-25"
tier: C
summary: "A British Indian campaign in 1888 to drive Tibetan troops out of Sikkim, also called the Anglo-Sikkimese war or the Anglo-Tibetan war of 1888. After the British gave up a planned mission to Lhasa in 1886, Tibetan soldiers built a fort at Lingtu inside Sikkim, on the trade road to Tibet, and the Chogyal of Sikkim, Thutob Namgyal, leaned towards Tibet. A force of about 2,000 under Brigadier-General Thomas Graham stormed Lingtu on 20–21 March 1888. A Tibetan attack on the British camp at Gnatong was beaten off on 22 May, and in late September Graham defeated the Tibetan army at the Tuko La, crossed the Jelep La and pursued it into the Chumbi valley. The British took over the government of Sikkim, and the Anglo-Chinese Convention of Calcutta of 17 March 1890 recognised Sikkim as a British protectorate and fixed its border with Tibet."
countries: [in, cn]
