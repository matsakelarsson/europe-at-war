id: first-franco-dahomean-war
name: First Franco-Dahomean War
start: "1890-02-21"
end: "1890-10-03"
tier: C
summary: "A short war between France and the Kingdom of Dahomey over the coast of what is now Benin. France had claimed a protectorate over Porto-Novo, a rival kingdom long raided by Dahomey, since 1863 (renewed in 1882 under King Toffa I), and claimed the port of Cotonou under treaties of 1868 and 1878 signed by Dahomey’s officials at Ouidah, while Dahomey went on collecting customs there and raiding villages in the Ouémé valley under French protection. A French mission to Abomey in late 1889 achieved nothing, and the new king, Béhanzin, who succeeded his father Glele at the end of December 1889, refused to give up his rights. On 21 February 1890 the French arrested Dahomey’s officials in Cotonou and fortified the town. On 4 March a Dahomean army of several thousand, women soldiers among them, stormed the stockade before dawn and fought for four hours before withdrawing with several hundred dead, 129 of them inside the French lines. On 20 April, at Atchoupa north of Porto-Novo, Toffa’s warriors fled under fire, but a French column of about 350 men in squares held off repeated attacks, and Béhanzin withdrew to Abomey. By a treaty of 3 October 1890 Dahomey recognised the French protectorate over Porto-Novo and French rule in Cotonou in return for 20,000 francs a year. Both sides rearmed, and war came again in 1892."
