notes:
  - "The French force at Cotonou was about 360 men, most of them tirailleurs from Senegal and Gabon; the French commander in the field at Atchoupa was Lieutenant-Colonel Terrillon. Dahomey’s women soldiers, the Agojie or Mino, called Amazons by Europeans, fought in both battles."
