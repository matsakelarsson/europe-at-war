steps:
  - title: The Ghost Dance and the death of Sitting Bull
    date: 1889 – December 1890
    when: "1890-12-15"
    borders: "1890-12-15"
    countries: [us]
    body:
      - "Under the Sioux Agreement of 1889, pressed on the Lakota by a commission led by George Crook, the Great Sioux Reservation was split into six reservations, Pine Ridge, Rosebud, Standing Rock, Cheyenne River, Lower Brulé and Crow Creek, and about nine million acres were opened to settlers. Soon after, Congress cut the beef ration; in 1890 drought ruined the crops, and measles, influenza and whooping cough killed many, above all children. That year the Lakota delegates Kicking Bear and Short Bull returned from a journey to Wovoka, a Northern Paiute prophet in Nevada, who taught that if the people danced the Ghost Dance and lived in peace, the dead would return, the buffalo come back and the whites disappear."
      - "The dance spread on all the Lakota reservations; some dancers wore painted shirts that they believed would stop bullets. Agents saw it as a threat, and on Pine Ridge the new agent, Daniel Royer, called for soldiers. From 20 November 1890 General Nelson Miles moved thousands of troops onto and around the reservations. Ghost Dancers under Short Bull and Kicking Bear withdrew to the Stronghold, a high table in the Badlands."
      - "At Standing Rock the agent James McLaughlin, fearing that Sitting Bull would join the dancers, ordered his arrest. At dawn on 15 December 1890 about 40 Lakota agency police under Lieutenant Bull Head took him from his cabin on the Grand River. His followers gathered and Catch-the-Bear shot Bull Head, who as he fell shot Sitting Bull, and Sergeant Red Tomahawk shot him in the head; Sitting Bull, seven of his followers and six policemen died. Many of his Hunkpapa fled south to the Miniconjou camp of Spotted Elk (Big Foot) on the Cheyenne River."
