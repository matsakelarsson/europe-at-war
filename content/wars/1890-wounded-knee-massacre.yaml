id: wounded-knee-massacre
name: The Ghost Dance and Wounded Knee
start: "1890-11-20"
end: "1891-01-15"
tier: B
summary: "The army’s campaign of 1890–1891 on the Lakota reservations of South Dakota against the Ghost Dance movement, in which Sitting Bull was killed and the 7th Cavalry killed between about 250 and 300 Lakota at Wounded Knee Creek. In 1889 the Great Sioux Reservation was broken up into six smaller reservations and about nine million acres of it opened to settlers; rations were cut, crops failed in drought, and disease spread. The Lakota learned of the Ghost Dance taught by Wovoka, a Northern Paiute prophet in Nevada, who promised that through the dance and right living the dead would return and the old world be restored, and by the autumn of 1890 thousands danced on Pine Ridge, Rosebud, Cheyenne River and Standing Rock. Alarmed agents called for troops, and in November 1890 General Nelson Miles sent thousands of soldiers onto the reservations; Ghost Dancers under Short Bull and Kicking Bear withdrew to the Stronghold in the Badlands. On 15 December Lakota police sent to arrest Sitting Bull at his home on the Grand River killed him in a fight with his followers. Spotted Elk (Big Foot) led his Miniconjou band, with Hunkpapa refugees, towards Pine Ridge; on 28 December the 7th Cavalry intercepted them and camped them on Wounded Knee Creek, and on the morning of 29 December, as the soldiers disarmed the men, a shot was fired and the troops and their Hotchkiss guns opened fire on the camp, killing men, women and children, many as they fled; 25 soldiers also died. The last Ghost Dance bands surrendered at Pine Ridge on 15 January 1891. Wounded Knee is often counted as the end of the wars between the United States and the Native nations of the plains."
countries: [us]
