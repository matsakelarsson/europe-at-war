  - title: Wounded Knee
    date: 23 December 1890 – 15 January 1891
    when: "1890-12-29"
    borders: "1890-12-29"
    countries: [us]
    body:
      - "On 23 December Spotted Elk, ill with pneumonia, left the Cheyenne River with his band and 38 Hunkpapa refugees, about 350 people in all, to go to Pine Ridge, where Red Cloud and other leaders had invited him to help make peace. The army believed he was heading for the Stronghold. The band crossed the Badlands, and on 28 December a battalion of the 7th Cavalry under Major Samuel Whitside met it near Porcupine Butte and escorted it to Wounded Knee Creek. That night Colonel James Forsyth arrived with the rest of the regiment and four Hotchkiss guns trained on the camp."
      - "On the morning of 29 December the soldiers began to disarm the men and search the lodges. A deaf man, Black Coyote, would not give up his rifle, and in a struggle it went off; a few young men drew hidden guns and fired, and the soldiers, many at close range, opened fire on the men, the lodges and the women and children. The Hotchkiss guns raked the camp, and troopers pursued people who fled up a ravine and across the prairie for kilometres. Between about 250 and 300 Lakota were killed, most of them by some accounts women and children, and 51 wounded survivors were taken to Pine Ridge; some estimates, such as Britannica’s, start as low as 150. Twenty-five soldiers died, some probably hit by their comrades’ fire. After a blizzard the Lakota dead were buried in a mass grave in the first days of January 1891."
      - "The next day Lakota warriors skirmished with the 7th Cavalry near the Drexel Mission, north of the Pine Ridge agency, until the Buffalo Soldiers of the 9th Cavalry came to its aid. Some 4,000 Lakota, among them the Ghost Dancers from the Stronghold, gathered on White Clay Creek while Miles’s troops closed around them; negotiations followed, and on 15 January 1891 Kicking Bear laid down his rifle at Pine Ridge, ending the campaign. In 1973 activists of the American Indian Movement and Oglala Lakota occupied Wounded Knee for 71 days."
