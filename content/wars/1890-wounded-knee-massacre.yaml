notes:
  - "The army long called Wounded Knee a battle; Lakota survivors and most historians since call it a massacre. Nineteen soldiers (twenty in some counts) received the Medal of Honor for it. In 1990 Congress expressed its deep regret to the descendants of the victims but left the medals in place; Lakota and other Native organisations have long asked for them to be withdrawn, but after a Pentagon review the Defense Secretary, Pete Hegseth, announced in September 2025 that they would stand."
  - "Wovoka’s teaching was peaceful. The belief of some Lakota Ghost Dancers that their painted shirts would turn bullets, and the fears of agents and settlers, who called the movement the Messiah craze, shaped what followed."
