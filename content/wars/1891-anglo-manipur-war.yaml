notes:
  - In Manipur 13 August is observed as Patriots’ Day, and Khongjom Day, on 23 April, honours those who fell in the battle, which British accounts date to 25 April 1891.
  - British accounts called the events of March 1891 the Manipur rebellion or the “Manipur disaster”; Manipuri historians treat the war as the defence of an independent kingdom.
