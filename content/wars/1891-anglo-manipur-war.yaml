id: anglo-manipur-war
name: Anglo-Manipur War
start: "1891-03-24"
end: "1891-04-27"
tier: C
summary: "A short war in 1891 between British India and the kingdom of Manipur, which the British regarded as a protected state and the Manipuris as independent. In September 1890 the senapati (army commander) Tikendrajit Singh deposed Maharaja Surachandra Singh and put his brother Kulachandra on the throne. The British accepted Kulachandra but sent the Chief Commissioner of Assam, James Quinton, with a Gurkha escort to arrest Tikendrajit. The attempt on 24 March 1891 failed, the British Residency was besieged, and Quinton, the political agent Frank Grimwood and three other officers were killed after going to parley; the rest escaped to Cachar. Three columns from Kohima, Silchar and Tamu then invaded, defeated the Manipuri forces at Thoubal and in the battle of Khongjom in late April, and occupied Imphal on 27 April. Tikendrajit and the general Thangal were hanged in public on 13 August 1891, and the British made the boy Churachand raja of a princely state under their control."
