notes:
  - "The main study is Dennis D. Cordell, Dar al-Kuti and the Last Years of the Trans-Saharan Slave Trade (1985), based on French colonial archives and on oral traditions. French reports, written by officers who wanted to end al-Sanusi’s rule, shaped the account of his death; the dates of his early life and of the first rulers of Dar al-Kuti are approximate."
  - "Rabih’s own wars, including the years 1890–1891 when al-Sanusi was his lieutenant, are told in the Wars of Rabih az-Zubayr; the conquest of Wadai in the French conquest of Wadai."
