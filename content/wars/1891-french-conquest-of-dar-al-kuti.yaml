id: french-conquest-of-dar-al-kuti
name: French conquest of Dar al-Kuti
start: "1891-04-09"
end: "1912-12-17"
tier: C
summary: "The rise and fall of Dar al-Kuti under Muhammad al-Sanusi and its conquest by France. Dar al-Kuti, in the north of today’s Central African Republic, began about 1830 as a frontier province of Dar Runga and its overlord, the sultanate of Wadai, from which horsemen raided the Banda and other peoples to the south for captives. In 1890 Rabih az-Zubayr, then the strongest power in the region, deposed its governor Kobur and installed Kobur’s nephew Muhammad al-Sanusi, born in Wadai about 1850 and a member of the Sanusiyya Sufi order, whose daughter married Rabih’s son Fadlallah. On 9 April 1891 al-Sanusi’s men killed the French explorer Paul Crampel and his companions, who were trying to open a route from the Ubangi to Lake Chad. In October 1894 a Wadai army destroyed al-Sanusi’s capital, Chá; after two years on the move he built a new fortified town (tata) at N’Délé, from which his armies raided the Banda and other peoples of the Ubangi–Chari watershed on a large scale. Captives were sold north through Wadai into the trans-Saharan trade or kept in Dar al-Kuti, and a French resident later described wide tracts of empty, devastated land; the historian Dennis Cordell places Dar al-Kuti among the last states that fed the trans-Saharan slave trade, while noting that the number of people it enslaved cannot be calculated. Al-Sanusi chose to deal with France: on 28 August 1897 he signed a treaty of trade and protectorate with Émile Gentil, revised on 18 February 1903 and 26 January 1908, and kept his independence in practice. After France took Wadai’s capital, Abéché, in 1909, it set out to rule Dar al-Kuti directly. Al-Sanusi died at N’Délé on 12 January 1911, killed by French troops; some accounts say he fell fighting, others that he was assassinated. His son Kamun withdrew east to Ouanda Djallé and resisted until Captain Souclier took the town on 17 December 1912, when Kamun went into exile in the Anglo-Egyptian Sudan. Dar al-Kuti became a district of Ubangi-Shari; it is now the prefecture of Bamingui-Bangoran, and al-Sanusi’s descendants still hold the title of sultan at N’Délé."
