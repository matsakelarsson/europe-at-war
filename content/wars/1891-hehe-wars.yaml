steps:
  - title: Lugalo
    date: July – August 1891
    when: "1891-08-17"
    borders: "1891-08-17"
    countries: [tz, de]
    body:
      - "In the 1870s Munyigumba, a chief of the Hehe, united the small chiefdoms of the Iringa highlands into a kingdom with a disciplined army, which conquered and raided its neighbours. His son Mkwawa, who succeeded him in 1879, extended Hehe power east and north towards the caravan routes from the coast to Tabora and Lake Tanganyika, which the Germans needed to control. The Germans, who had just taken over the colony from the German East Africa Company, saw the Hehe as the main obstacle in the south."
      - "In July 1891 the imperial commissioner Emil von Zelewski marched into Hehe country with about 320 askari, German officers and NCOs, porters and light guns. Near Lugalo, east of present-day Iringa, on the morning of 17 August 1891, his column was strung out along a path through thick bush when some 3,000 Hehe warriors, hidden on both sides, rushed it. In close combat their spears outmatched the soldiers’ rifles; about ten Germans, Zelewski among them, and some 250–300 askari were killed, and with the porters the dead numbered about 400. Part of the rearguard escaped. The Hehe lost a few hundred men."
    facts:
      - [Battle of Lugalo, "17 August 1891"]
      - [German column, "about 320 askari with officers, porters and guns"]
      - [German side killed, "about ten Germans, Zelewski among them, and some 250–300 askari"]
