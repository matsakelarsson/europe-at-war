  - title: The storming of Kalenga
    date: 1892 – October 1894
    when: "1894-10-28"
    borders: "1894-10-30"
    countries: [tz, de]
    body:
      - "After Lugalo the Hehe attacked caravans and German posts on the central route, and the two sides sent envoys, but the Germans would accept only submission. Mkwawa strengthened Kalenga with a long wall. In 1894 Governor Friedrich von Schele led a large expedition of askari with artillery against it. After shelling the town, his troops stormed the walls on 28–30 October 1894 and took Kalenga after fierce fighting. Mkwawa escaped with part of his army."
    facts:
      - [Kalenga stormed, "28–30 October 1894"]
    markers:
      - kind: taken
        side: de
        name: Kalenga
        date: 28–30 October 1894
        text: Governor von Schele’s troops shelled and stormed Mkwawa’s walled capital. Mkwawa escaped.
        lonlat: [35.600, -7.800]
    arrows:
      - side: de
        label: Von Schele
        via: [[36.3, -7.3], [36.0, -7.55], [35.75, -7.72], [35.62, -7.79]]
      - side: hehe
        label: Mkwawa
        via: [[35.58, -7.78], [35.55, -7.65], [35.5, -7.5]]
  - title: Mkwawa’s last war
    date: 1894 – July 1898
    when: "1898-07-19"
    borders: "1898-07-19"
    countries: [tz, de]
    body:
      - "Mkwawa fought on from the bush for nearly four years, attacking German patrols and the chiefs who went over to them. In 1896 the Germans built a fortified station at Iringa, from which Captain Tom von Prince led columns through the Hehe country, burning villages and crops to deny the warriors food. Hunger and the rewards the Germans offered wore down Mkwawa’s following, and many Hehe leaders submitted."
      - "In July 1898, sick and with only a few companions left, Mkwawa was tracked to the rock shelter at Mlambalasi, some 30 km north-west of Iringa. On 19 July, as the Germans closed in, he shot himself rather than be taken. A German sergeant cut off his head, which was sent to Germany. Article 246 of the Treaty of Versailles (1919) required Germany to hand over “the skull of the Sultan Mkwawa”; a skull identified as his in a Bremen museum was returned on 9 July 1954 and is kept in the Mkwawa Memorial Museum at Kalenga. The Hehe were ruled by the Germans through appointed chiefs, and their resistance became part of Tanzania’s national history."
    facts:
      - [Iringa station built, "1896"]
      - [Death of Mkwawa, "19 July 1898"]
      - [Skull returned, "9 July 1954"]
