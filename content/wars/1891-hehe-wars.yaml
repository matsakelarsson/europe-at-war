id: hehe-wars
name: Hehe wars
start: "1891-07"
end: "1898-07-19"
tier: B
summary: "The war of the Hehe kingdom of the southern highlands of Tanzania against the German conquest. The Hehe, united by Munyigumba and his son Mkwawa in the 1870s and 1880s, dominated the country around Iringa and raided their neighbours and the caravan routes to the interior. In 1891 a German column under Emil von Zelewski marched against them, and on 17 August Mkwawa’s warriors ambushed it at Lugalo and killed Zelewski and most of his men, one of the worst defeats of German colonial troops in Africa. In October 1894 Governor Friedrich von Schele stormed Mkwawa’s walled capital at Kalenga, but Mkwawa escaped and fought a guerrilla war for almost four years, while the Germans burned crops and villages and set up a fort at Iringa. Cornered in July 1898, Mkwawa shot himself rather than be captured; his head was taken to Germany, and the Treaty of Versailles required its return. A skull believed to be his was handed back in 1954 and is kept at Kalenga."
countries: [tz, de]
