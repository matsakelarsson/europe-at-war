notes:
  - "Numbers for Lugalo differ: the German column had about 320 African soldiers (askari) with German officers and NCOs, porters and light artillery; the Hehe attackers are put at about 3,000. Estimates of the Hehe dead range from about 60 on the field and perhaps 200 more who died of their wounds (Tom von Prince’s estimate, followed by later historians) to German claims of about 700."
  - "Mkwawa’s full name is given as Mkwavinyika Munyigumba Mwamuyinga. The German governor’s dates for the storming of Kalenga are given as 28 or 30 October 1894."
  - "Some historians doubt that the skull returned in 1954 is really Mkwawa’s; the German Federal Agency for Civic Education calls its whereabouts unclear."
