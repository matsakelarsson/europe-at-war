id: pahang-uprising
name: Pahang Uprising
start: "1891-12"
end: "1895-11"
tier: C
summary: "A rising of Malay chiefs in Pahang against the British Residency set up in 1888. Under growing British pressure Sultan Ahmad accepted a British protectorate and a Resident, John Pickersgill Rodger, in 1888. The new administration took over the collection of taxes, which the territorial chiefs had held, and set up courts and police that cut into their authority. Dato’ Bahaman, the Orang Kaya of Semantan, would not accept the new order in his district; when some of his followers were arrested in December 1891, he attacked the Sikh police at Lubuk Terua, burned the police post and sacked Temerloh. Tok Gajah of Pulau Tawar, who had led Pahang’s fighters in the Klang War, and his son Mat Kilau joined him, and on 10 April 1892 Mat Kilau’s men sacked Kuala Lipis. Sikh police and Malay levies, reinforced from Perak and Selangor, burned Mat Kilau’s stronghold at Budu in May 1892, and an amnesty followed on 16 October 1892 for all but the leaders, who withdrew with about 100 men to the borders of Kelantan and Terengganu, then under Siamese overlordship. In June 1894 they came back, seized the stockade at Kuala Tembeling on 14 June and were defeated at Jeram Ampai on 29 June; Hugh Clifford led a column into Kelantan and Terengganu after them. In October–November 1895 Siamese officials, who had agreed to stop harbouring them, captured Bahaman and four other leaders and deported them to Chiang Mai; Mat Kilau and Tok Gajah were reported dead. The exiles were allowed to return in 1913. In 1970 the Pahang government accepted the claim of an old man who had come forward as Mat Kilau; he died ten days later. Bahaman and Mat Kilau are remembered in Malaysia as fighters against colonial rule."
