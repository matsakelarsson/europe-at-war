id: yeke-war
name: End of the Yeke kingdom
start: "1891"
end: "1892-01"
tier: C
summary: "The Congo Free State’s seizure of Katanga and the killing of Msiri, king of the Yeke (Garanganze). Msiri, a Nyamwezi trader from the Tabora region, settled in Katanga about 1856 and built a kingdom from his capital, Bunkeya, out of lands that had paid tribute to Kazembe, trading copper, ivory and slaves east to the Swahili and Arab merchants of Zanzibar’s sphere and west to Portuguese Angola through Ovimbundu caravans. The Berlin agreements of 1884–1885 gave Katanga to Leopold II’s Free State on paper, but only effective occupation would secure it, and Cecil Rhodes’s British South Africa Company was also seeking a treaty. Msiri turned away the company’s envoy Alfred Sharpe in 1890 and gave the Free State expedition of Paul Le Marinel only a vague letter in 1891. By then his kingdom was under strain: the Sanga and other subject peoples had risen against him, and his main army was away in the south. The Compagnie du Katanga, one of Leopold’s companies, sent an expedition under the Canadian-born British officer William Stairs, with about 400 Africans hired mostly in Zanzibar, which reached Bunkeya on 14 December 1891 with orders to take Katanga with or without Msiri’s agreement. Msiri received Stairs on 17 December but refused to accept the Free State flag, and left for the fortified village of Munema. On 20 December 1891 Stairs’s second-in-command, the Belgian captain Omer Bodson, went into Munema to arrest him; in the confrontation Bodson shot Msiri dead and was mortally wounded by Msiri’s son Masuka. The expedition’s askaris looted Munema and killed many of its people, Msiri’s head was cut off and displayed, according to the expedition’s Marquis de Bonchamps, and the people of Bunkeya, which may have had 60,000–80,000 inhabitants, scattered amid famine. Stairs recognised Msiri’s adopted son Mukanda-Bantu as chief of a reduced territory and restored the Sanga chiefs Msiri had overthrown, and by early January 1892 he had the treaties that secured Katanga for the Free State; the Anglo-Belgian agreement of 1894 fixed the border on the Luapula. Of the expedition’s 400 Africans, 189 returned to Zanzibar, most of the others having died of disease and hunger, and Stairs died of malaria on the Zambezi on 9 June 1892 (3 June in some accounts)."
