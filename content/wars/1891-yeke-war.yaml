notes:
  - "The killing at Munema is known from the accounts of the expedition’s officers (Bonchamps, the doctor Joseph Moloney and Stairs) and of the missionary Dan Crawford, who saw the aftermath; Yeke (Garanganze) traditions remember it differently, and the fate of Msiri’s head is uncertain."
  - "Msiri’s subjects and neighbours remembered his rule for its raids and executions, and some Sanga chiefs welcomed the Europeans; Yeke tradition and later Congolese writers present him as a king who resisted colonial conquest. His successors still hold the title Mwami Mwenda at Bunkeya."
