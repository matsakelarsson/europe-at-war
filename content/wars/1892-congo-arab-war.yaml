    polities: [congo-arabs]
    ink: red
    moves: Swahili-Arab moves
    success: Swahili-Arab success
notes:
  - "European writers called the traders’ side “Arabs”; most of its leaders were Swahili-speaking Muslims from the East African coast and Zanzibar, some of Omani descent, and most of its fighters were Congolese, among them the ruga-ruga irregulars and soldiers raised in Maniema. The Free State’s army was also overwhelmingly African. The account of the war comes almost entirely from Free State officers; dates differ between sources, notably for Sefu’s death (20 October or 19 November 1893)."
  - "Bruce Vandervort called the war one of the most obscure colonial wars of the period. Its losses are poorly documented: the figures for African deaths are rough estimates, and the destruction of Nyangwe and Kasongo, with tens of thousands of inhabitants each, emptied the main markets of Maniema."
