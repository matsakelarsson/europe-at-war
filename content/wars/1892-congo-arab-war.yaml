  - title: Nyangwe, Kasongo and Stanley Falls
    date: November 1892 – June 1893
    when: "1893-03-04"
    borders: "1893-05-01"
    countries: [cd]
    body:
      - "By October 1892 Sefu had gathered some 10,000 men, about 500 of them Swahili-Arab officers and the rest Congolese, and in November he crossed the Lomami to attack Ngongo Lutete. Fighting went on almost daily in November and December. Accounts of the first clashes on the Lomami differ, a failed Free State attack on Sefu’s fort in some and a victory for Lieutenant Michaux in others, but by December, while Dhanis and Ngongo’s warriors dealt with Mohara’s son on the Lualaba, Sefu’s army was falling back east. At Kasongo the two Free State residents, Lieutenants Joseph Lippens and Henri De Bruyne, were killed, which gave Dhanis the reason his superiors had lacked for open war. In early January 1893 Mohara was killed in battle, and on 28 January the Free State column reached the Lualaba opposite Nyangwe, the great slave and ivory market of the region."
      - On 4 March 1893 Dhanis’s troops crossed the river in about 100 dugout canoes paddled by Genia fishermen and entered Nyangwe, which its defenders had abandoned; when its people rose on 13 March the town was burnt. On 22 April Dhanis took Kasongo, whose population had swollen with refugees to perhaps 60,000; its defenders, civilians and slaves fled, and Sefu withdrew south-east to join Rumaliza at Kabambare. In the north, Captain Louis-Napoléon Chaltin came up the Lomami from Basoko by steamer and marched overland to Riba-Riba, which he found in flames on 30 April, then went on to Stanley Falls, where he relieved the Free State garrison besieged by Rashid’s men; the traders withdrew south towards Kabambare.
    facts:
      - [Nyangwe taken, "4 March 1893"]
      - [Kasongo taken, "22 April 1893"]
      - [Free State force, "About 10,000 men in all, mostly auxiliaries"]
