steps:
  - title: Ngongo Lutete and the road to war
    date: 1887–1892
    when: "1892-05"
    borders: "1892-06-01"
    countries: [cd]
    body:
      - "On 24 February 1887 Tippu Tip, the greatest of the Swahili-Arab traders of the upper Congo, accepted Leopold II’s offer to govern the Stanley Falls district for the Congo Free State. He was to send his ivory down the Congo to the Atlantic instead of east to Zanzibar, but he regarded himself as an ally rather than an official, and the other traders, above all Rumaliza, the master of Ujiji on Lake Tanganyika, did not accept the arrangement. The Free State, for its part, used traders as recruiting agents: Draper notes that it paid Tippu Tip’s son Sefu a bonus for each recruit he supplied, recruits whom he could only find by raiding. In 1890 Tippu Tip returned to Zanzibar, leaving Sefu at Kasongo and his nephew Rashid at Stanley Falls. Free State officers seized ivory from traders and taxed it, and by 1892 the traders of Maniema, led by Sefu’s uncle Mohara, had united against the state."
      - "Ngongo Lutete, a former slave who had become one of Tippu Tip’s most powerful vassals, led Tetela and Kusu warriors from his town of Ngandu between the Lomami and the Sankuru. In April 1892, when his army tried to cross the Sankuru on a slave raid, Lieutenant Francis Dhanis, from the Free State post at Lusambo, defeated him four times in three weeks: at Mona-Kialo on 24 April, at Batubenge on 5 and 9 May and at Kisima-Souri on 12 May. Ngongo then changed sides, bringing thousands of warriors to the Free State. In the same months Sefu’s men attacked Free State agents, and in May 1892 the expedition of the British ivory trader Arthur Hodister was massacred at Riba-Riba on the Lualaba. On Lake Tanganyika, Rumaliza’s forces besieged the post of Albertville, founded on 3 January 1892 by Captain Alphonse Jacques of the Belgian Anti-Slavery Society, from 5 April."
    facts:
      - [Tippu Tip governor of Stanley Falls, "24 February 1887"]
      - [Ngongo Lutete defeated by Dhanis, "24 April – 12 May 1892"]
      - [Hodister expedition killed, "May 1892"]
