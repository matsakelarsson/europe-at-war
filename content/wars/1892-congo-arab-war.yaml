id: congo-arab-war
name: Congo Arab war
start: "1892-05"
end: "1894-03"
tier: B
summary: "The war in which the Congo Free State of Leopold II destroyed the power of the Swahili-Arab traders in the eastern Congo. From the 1860s traders from Zanzibar’s sphere, led by Tippu Tip, had built a commercial empire in Maniema and on the upper Congo, based on ivory and on raids that took slaves and recruited soldiers, from towns such as Nyangwe, Kasongo and Stanley Falls. In 1887 Leopold made Tippu Tip governor of Stanley Falls for the Free State, but the two powers competed for the same ivory, and when Tippu Tip went back to Zanzibar in 1890 his son Sefu at Kasongo, his nephew Rashid at Stanley Falls and the Lake Tanganyika trader Rumaliza turned against the state. In 1892 the Free State officer Francis Dhanis defeated Tippu Tip’s former vassal Ngongo Lutete, who changed sides with his Tetela and Kusu warriors, and Sefu’s men killed the trader Arthur Hodister’s expedition. From November 1892 Dhanis’s Force Publique, a few dozen European officers with African regulars armed with modern rifles and thousands of African auxiliaries, drove Sefu back across the Lomami, took Nyangwe on 4 March and Kasongo on 22 April 1893, and relieved Stanley Falls. Rumaliza then came west with a large army and held the Free State off in fortified camps on the Luama River until November 1893; Sefu was killed in the fighting. On 14 January 1894 Dhanis stormed Rumaliza’s camps before Kabambare, and Rumaliza fled to German East Africa. The Free State presented the war in Europe as a crusade against the slave trade; historians see it above all as a war for ivory and territory, in which the Free State itself recruited soldiers through slave raids and its auxiliaries raided and killed on a large scale. It lost 16 European officers and NCOs; the African dead, soldiers, auxiliaries and civilians, are not known, with estimates running from tens of thousands to possibly more than 100,000."
countries: [cd, tz]
sides:
