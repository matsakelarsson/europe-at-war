  - title: Rumaliza and the fall of Kabambare
    date: October 1893 – March 1894
    when: "1894-01-14"
    borders: "1894-03-01"
    countries: [cd, tz]
    body:
      - "Rumaliza, Muhammad bin Khalfan al-Barwani, now came west from Lake Tanganyika with a large army to retake Maniema, and built fortified camps (bomas) on the Luama River, threatening Kasongo. Dhanis attacked them on 15 October 1893 but could not take them; the defenders’ sorties killed many of his men, among them Commandant Pierre Ponthier, and Dhanis tried to starve the camps out. On the night of 15–16 November Rumaliza slipped away. Sefu was killed in the fighting, on 20 October according to some accounts and in a clash with the Free State’s pursuing column at Ogella on 19 November according to others."
      - Rumaliza fell back to a line of bomas across the road to Kabambare, on the Lulindi River. Dhanis returned with 15 Europeans, 700 regulars and about 2,000 auxiliaries, was joined in mid-December by Captain Hubert Lothaire with 300 more men and brought up artillery. On 14 January 1894 (9 January in some accounts) his troops stormed the outer bomas; a shell from a Krupp mountain gun set the main boma on fire, its defenders fled and the other bomas surrendered. Rumaliza escaped with a few followers. Lothaire took Kabambare and pursued him to Lake Tanganyika, where the Free State made contact with Jacques’s anti-slavery force, and Rumaliza crossed into German East Africa. By March 1894 the Free State held the east; bands under Said bin Abedi fought on in the Ituri forest until later in the year. The Free State kept much of the traders’ administration, and recruited many of its soldiers among the Tetela and Kusu who had fought in the war.
    facts:
      - [Fighting on the Luama, "15 October – 16 November 1893"]
      - [Bomas before Kabambare stormed, "14 January 1894"]
      - [Free State losses, "16 European officers and NCOs (six by disease)"]
