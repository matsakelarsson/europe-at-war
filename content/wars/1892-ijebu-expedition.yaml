id: ijebu-expedition
name: Ijebu expedition
start: "1892-05-12"
end: "1892-05"
tier: C
summary: "A short British campaign from Lagos that conquered the Yoruba kingdom of Ijebu, in what is now south-western Nigeria. Ijebu lay across the roads between the British colony of Lagos and the interior, and it kept the trade in its own merchants’ hands, charging tolls and closing the roads to Lagos traders and missionaries when it chose. In January 1892, after the Awujale (king) of Ijebu had turned back a mission led by the acting governor George Denton the year before, he agreed to open the roads in return for £500 a year in compensation for lost tolls; when a missionary was refused passage soon afterwards, Governor Gilbert Carter’s government treated it as a breach of the agreement. On 12 May 1892 a force of several hundred colonial soldiers, mostly Hausa troops from Lagos and the Gold Coast and men of the West India Regiment, with carriers and some Ibadan irregulars, under Colonel Francis Scott, landed at Epe on the lagoon and marched inland. The Ijebu raised an army of about 8,000 armed mostly with old muskets, and fought hard at the crossing of the Yemoji river near Imagbon, where Maxim guns cut down their ranks; the Ijebu are reported to have lost over 900 men and the British force about 56 killed and 30 wounded. The Awujale submitted, the British flag was raised in Ijebu Ode, and Ijebu toll gates and several shrines were destroyed. Ijebu came under the Lagos government, the roads to Ibadan were opened, and in 1893 Carter toured the interior; treaties with Abeokuta, Oyo and Ibadan that year brought most of Yorubaland under British protection without further war."
