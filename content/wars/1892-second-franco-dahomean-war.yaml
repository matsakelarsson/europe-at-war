  - title: Béhanzin’s surrender
    date: 1893 – 1894
    when: "1894-01-15"
    borders: "1894-06-22"
    countries: [bj]
    body:
      - "Béhanzin set up his court in the north, at Atchérigbé, and tried to rebuild his army, including the women’s corps, while sending envoys to France to negotiate. In 1893 Dodds, now a general, returned with fresh troops and sent columns through the country to cut him off from food and followers. Many chiefs went over to the French, who offered the throne to Béhanzin’s brother Goutchili, the former chief of staff of the army, who took the royal name Agoli-Agbo."
      - "Abandoned by most of his followers, Béhanzin surrendered to the French in January 1894. He was exiled to Martinique and later moved to Algeria, where he died in 1906; his remains were brought back to Abomey in 1928. Under Agoli-Agbo, Dahomey survived as a reduced kingdom under French protection, part of the colony of Dahomey proclaimed in June 1894, until France deposed and exiled him in 1900 and abolished the monarchy."
    facts:
      - [Béhanzin surrenders, "15 January 1894"]
      - [Colony of Dahomey, "June 1894"]
      - [Monarchy abolished, "1900"]
