  - title: Abomey burns
    date: November – December 1892
    when: "1892-11-17"
    borders: "1892-12-01"
    countries: [bj]
    body:
      - The truce talks failed when Béhanzin would not accept Dodds’s terms. On 16 November the French marched on Abomey. Rather than let the capital fall into French hands, Béhanzin had it set on fire and left with the remains of his army for the north. On 17 November the French entered the city and raised the tricolour over the Singboji palace, which survived the fire.
      - "Dodds declared Béhanzin deposed and placed the coast, including Ouidah, under direct French rule. His troops carried off treasures from the royal palaces, among them thrones, royal statues and carved doors. In November 2021 France returned 26 of these objects to Benin, the first major restitution of looted African art by a French government."
    facts:
      - [French enter Abomey, "17 November 1892"]
    markers:
      - kind: taken
        side: fr
        name: Abomey
        date: 17 November 1892
        text: Set on fire and abandoned by Béhanzin, then occupied by the French, who raised their flag over the Singboji palace.
        lonlat: [1.99, 7.19]
    arrows:
