        label: Dodds
        via: [[2.58, 6.52], [2.52, 6.62], [2.48, 6.72], [2.46, 6.80]]
  - title: Poguessa and Adégon
    date: October 1892
    when: "1892-10-06"
    borders: "1892-10-06"
    countries: [bj]
    body:
      - The French moved farther up the Ouémé and then turned west, away from the river, towards Abomey. On 4 October, at Poguessa, Béhanzin himself led an attack on the column. His soldiers charged several times over two to three hours and failed against the French bayonets; French accounts put the Dahomean dead at 150 to 200, and the French had 42 casualties. The women soldiers stood out in the fighting.
      - "Two days later, on 6 October, at the village of Adégon, the French broke a Dahomean force with a bayonet charge. French reports counted 86 regular soldiers and 417 women soldiers dead, against 6 French killed and 32 wounded. Much of the women’s corps was destroyed in a single day, and with it the court’s hope of stopping the invasion. After Poguessa the Dahomeans turned to defending lines of trenches and harassing the column rather than meeting it in the open."
    facts:
      - [Battle of Poguessa, "4 October 1892"]
      - [Battle of Adégon, "6 October 1892"]
      - [Dahomean dead at Adégon (French count), "86 men and 417 women soldiers"]
