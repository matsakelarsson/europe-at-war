  - title: Dogba
    date: July – September 1892
    when: "1892-09-19"
    borders: "1892-09-19"
    countries: [bj]
    body:
      - "Dodds assembled 2,164 men: Foreign Legionnaires, French marine infantry and artillery, engineers, Senegalese spahis and West African tirailleurs, armed with the Lebel rifle, the first to use smokeless powder. Porto-Novo supplied about 2,600 porters. On 4 July French gunboats shelled villages along the lower Ouémé, and in mid-August the column began to move up the river, its supplies carried by boat."
      - On 14 September the column camped at Dogba, on the river at the border between Porto-Novo and Dahomey. At about five in the morning of 19 September a Dahomean army attacked the camp. For three to four hours its soldiers, men and women, tried again and again to close with the French, who held them off with rifle volleys and bayonets. When they withdrew, French accounts counted from about 130 to several hundred Dahomean dead; the French lost five to seven killed, among them the battalion commander, Major Faurax.
    facts:
      - [French force, "2,164 men"]
      - [Battle of Dogba, "19 September 1892"]
    markers:
      - kind: battle
        side: fr
        name: Dogba
        date: 19 September 1892
        text: A Dahomean dawn attack on the French camp was beaten off after three to four hours, with heavy Dahomean losses.
        lonlat: [2.463, 6.849]
        lp: r
    arrows:
