  - title: Akpa, Cotopa and Cana
    date: October – November 1892
    when: "1892-11-04"
    borders: "1892-11-04"
    countries: [bj]
    view:
      center: [2.12, 7.12]
      size: [40, 34]
    body:
      - It took the French a month to cover the last stretch between Poguessa and Cana. At Akpa they were attacked daily from 15 October; supplies ran short and sickness spread until reinforcements arrived on 20 October. On 26 and 27 October the column fought its way through the trenches at Cotopa, where French officers reported that the women soldiers fought hardest of all, charging out of their trenches.
      - "Cana, a royal town a few hours’ march from Abomey, was the last line of defence. Béhanzin’s army now numbered no more than about 1,500, including slaves and pardoned prisoners. On 3 November he attacked the French camp, and on 4 November, at the nearby palace village of Diokoué, special units of women soldiers were given the task of killing French officers; after a full day of fighting a final bayonet charge carried the position. On 5 November Béhanzin sent envoys to ask for a truce, and the French entered Cana the next day."
    facts:
      - [Siege of Akpa, "15–26 October 1892"]
      - [Battles of Cana, "2–4 November 1892"]
