steps:
  - title: The road to war
    date: 1890 – June 1892
    when: "1892-03"
    borders: "1892-03-01"
    countries: [bj]
    body:
      - The treaty of October 1890 had left the frontier between Dahomey and the French protectorate of Porto-Novo unsettled, and neither side expected the peace to last. Béhanzin bought between 4,000 and 6,000 modern rifles, among them Winchester and Mannlicher carbines, as well as a few machine guns and cannon, from German merchants at Ouidah. His armies resumed raiding the villages of the Ouémé valley, which France counted as part of Porto-Novo.
      - "In March 1892 the French resident at Porto-Novo, Victor Ballot, went up the Ouémé in a gunboat to investigate; Dahomean troops fired on it, wounding five men. Béhanzin rejected French protests. In Paris the Chamber voted funds for an expedition, and command went to Colonel Alfred-Amédée Dodds, a veteran of the marine troops in Senegal, born in Saint-Louis to a family of mixed French and Senegalese descent. On 15 June 1892 French warships blockaded the Dahomean coast to stop the arms trade."
    facts:
      - [Gunboat incident on the Ouémé, "March 1892"]
      - [French blockade of the coast, "15 June 1892"]
    link: { href: "#/war/first-franco-dahomean-war", text: The First Franco-Dahomean War }
