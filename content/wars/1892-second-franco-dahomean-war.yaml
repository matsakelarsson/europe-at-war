id: second-franco-dahomean-war
name: Second Franco-Dahomean War
start: "1892-07-04"
end: "1894-01-15"
tier: A
summary: "The French conquest of the Kingdom of Dahomey, in what is now southern Benin. After the war of 1890 both sides rearmed. When Dahomey resumed its raids in the Ouémé valley, claimed by France for its protectorate of Porto-Novo, and fired on a French gunboat, France sent Colonel Alfred-Amédée Dodds with about 2,000 soldiers, Foreign Legionnaires, marines and West African tirailleurs armed with the new Lebel rifle. Advancing up the Ouémé river and then west towards Abomey from August 1892, his column fought its way through a series of battles at Dogba, Poguessa, Adégon, Akpa, Cotopa and Cana against King Béhanzin’s army, in which Dahomey’s women soldiers, the Agojie, called Amazons by Europeans, fought in the front line and suffered terrible losses to French rifles and bayonets. On 17 November 1892 the French entered Abomey, which Béhanzin had set on fire and abandoned. He fought on from the north for more than a year, until the French made his brother Agoli-Agbo king and he surrendered in January 1894. Béhanzin died in exile in 1906; Dahomey became a French colony, and the monarchy was abolished in 1900."
countries: [bj, fr]
sides:
  - id: fr
    name: France and Porto-Novo
    polities: [france, french-dahomey, porto-novo]
    ink: navy
    moves: French moves
    success: French success
  - id: da
    name: Kingdom of Dahomey (Béhanzin)
    polities: [dahomey]
    ink: purple
    moves: Dahomean moves
    success: Dahomean success
notes:
  - "French losses in the campaign of 1892 are given as 85 killed and 440 wounded in action, with 205 dead of disease; Dahomey’s losses are not known precisely; estimates range from about 1,750 to 4,000 killed, with thousands more wounded. The figures for individual battles come from French reports."
  - "Béhanzin’s surrender is dated 15 January 1894 in most accounts and 25 January in some others."
  - "The women soldiers called themselves ahosi (the king’s wives) or mino (our mothers); Agojie is a name used for their corps in Fon tradition."
