steps:
  - title: The Company in Mashonaland
    date: October 1888 – August 1893
    when: "1893-07-18"
    borders: "1893-07-18"
    countries: [zw, bw, gb]
    body:
      - "Lobengula had ruled the Ndebele since 1870 from Bulawayo. The kingdom his father Mzilikazi had founded after leading his people north across the Limpopo in the late 1830s was organised in age regiments settled around the capital; it took tribute, cattle and captives from many of the Shona chiefdoms to the east. On 30 October 1888 Lobengula put his mark to the Rudd Concession, which gave the agents of Cecil Rhodes the mineral rights of his lands in return for £100 a month, 1,000 Martini–Henry rifles, 100,000 cartridges and a steamboat on the Zambezi. He soon protested that he had been told he was granting far less, but on the strength of the concession the British government gave Rhodes’s British South Africa Company a royal charter in October 1889."
      - "In 1890 the company’s Pioneer Column, about 200 settlers escorted by some 500 company police and guided by the hunter Frederick Selous, set out from Bechuanaland, skirted the Ndebele heartland and on 12 September reached the site of Fort Salisbury (now Harare), where it raised the British flag the next day. The company built forts at Tuli, Victoria and Charter, gave out farms and gold claims, and claimed to govern Mashonaland, while Lobengula still regarded its Shona chiefs as his subjects."
      - "In July 1893 an Ndebele force raided Shona villages around Fort Victoria to punish people the king accused of taking his cattle, killing many and seizing cattle in sight of the settlers. On 18 July Jameson ordered the izinDuna to take their men back across the border within an hour, and a company patrol under Captain Charles Lendy fired on the withdrawing Ndebele and killed some thirty. Lobengula protested and sought to avoid war, but Rhodes and Jameson decided to destroy his kingdom. By the “Victoria Agreement” of 14 August each volunteer was promised a farm of some 6,000 acres, gold claims and a share of the captured cattle."
    facts:
      - [Rudd Concession, "30 October 1888"]
      - [Royal charter of the British South Africa Company, "October 1889"]
      - [Pioneer Column reaches Fort Salisbury, "12 September 1890"]
      - [Clash at Fort Victoria, "18 July 1893"]
