  - title: Pupu and the end of the kingdom
    date: November 1893 – July 1894
    when: "1893-12-04"
    borders: "1894-01-23"
    countries: [zw]
    body:
      - "Jameson wrote to Lobengula on 7 November offering him safety if he came in. The king’s reply was evasive, and on 14 November Forbes set out in pursuit with about 470 men, reduced to a flying column of 160 as heavy rains slowed the march. On 3 December he reached the Shangani River and sent Major Allan Wilson across with a small patrol to find the king, who was camped nearby with a few thousand of his men. The river rose in the night and Forbes could not follow."
      - "On 4 December 1893 the Ndebele surrounded Wilson’s patrol at Pupu, north of the river, and after hours of fighting killed all 34 men; three scouts sent back for help had got through. Zimbabwe now commemorates the battle as an Ndebele victory under the commander Mtshane Khumalo of the Imbizo regiment. Forbes’s column retreated to Bulawayo, harassed all the way. Lobengula died north of the Shangani in late January 1894, by most accounts of smallpox; his burial place was kept secret. His senior izinDuna made peace with the company in February 1894."
      - "Apart from Wilson’s patrol the company’s losses were small; how many Ndebele died is not known. The company and its volunteers seized most of the kingdom’s cattle, a Matabeleland Order in Council of 18 July 1894 gave it the government of the country, and the best land around Bulawayo was pegged out as farms, while two dry reserves, Gwaai and Shangani, were set aside for the Ndebele. The company’s territory was named Rhodesia in 1895. The loss of land and cattle, forced labour and the brutality of the company’s African police led to the Ndebele and Shona rising of 1896."
    facts:
      - [Battle of Pupu (the Shangani Patrol), "4 December 1893; 34 company men killed"]
      - [Death of Lobengula, "about 22–23 January 1894"]
      - [Matabeleland Order in Council, "18 July 1894"]
