notes:
  - "The kingdom’s own name was Mthwakazi; Europeans called it Matabeleland and its people the Matabele, the Sotho form of the name Ndebele. Bulawayo was the royal town (koBulawayo); the colonial city of Bulawayo was built on its ruins."
  - "Numbers are uncertain. Settler accounts claimed that thousands of Ndebele were killed in each battle; later estimates by historians are often much lower, a few hundred to about 1,500 at Shangani and at Bembesi. What happened to Wilson’s patrol is known only from Ndebele accounts, gathered from 1894 onwards."
