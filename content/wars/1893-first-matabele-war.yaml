  - title: Shangani, Bembesi and the fall of Bulawayo
    date: October – November 1893
    when: "1893-10-25"
    borders: "1893-11-04"
    countries: [zw, bw]
    body:
      - "The Salisbury column under Major Patrick Forbes and the Victoria column under Major Allan Wilson met at Iron Mine Hill on 16 October 1893: about 670 mounted volunteers and police with five Maxim machine guns and light artillery, followed by several hundred Shona and other African auxiliaries. A southern column of the Bechuanaland Border Police under Lieutenant-Colonel Hamilton Goold-Adams, with some 1,000 Bangwato under their king Khama III, an ally of the British, advanced from the Tati district. Lobengula, whose army had rifles but little training in their use, kept trying to negotiate while his regiments gathered."
      - "At dawn on 25 October, near the Shangani River, some 5,000 men of the Insukamini and other Ndebele regiments, led by Manonda and Mjaan, attacked the columns’ laager of wagons at the place the Ndebele call Bonko; on 1 November, at Bembesi (Egodade), about 35 km east-north-east of Bulawayo, the Imbizo and Ingubo regiments charged across open ground. Both attacks broke down under the fire of the Maxims and rifles, and the Ndebele lost hundreds of men in each battle, the company only a handful; by some accounts Manonda, commander of the Insukamini, took his own life after the defeat. Khama’s men went home soon after a skirmish on the Singuesi River on 2 November, reportedly because of smallpox in their camp and the coming planting season."
      - "Lobengula left Bulawayo after Bembesi, and on his orders the royal town was set on fire and its ammunition store blown up. The columns rode in on 4 November and raised the company and British flags over the ruins, where Jameson laid out the new town of Bulawayo."
    facts:
      - [Columns join at Iron Mine Hill, "16 October 1893"]
      - [Battle of Shangani (Bonko), "25 October 1893"]
      - [Battle of Bembesi (Egodade), "1 November 1893"]
      - [Columns enter Bulawayo, "4 November 1893"]
