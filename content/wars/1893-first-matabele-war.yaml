id: first-matabele-war
name: First Matabele War
start: "1893-10-16"
end: "1894-01"
tier: B
summary: "The British South Africa Company’s conquest of the Ndebele kingdom (Mthwakazi) of King Lobengula, in what is now western Zimbabwe. Cecil Rhodes’s company had obtained a mining concession from Lobengula in 1888, received a royal charter in 1889 and occupied Mashonaland, east of the kingdom, in 1890, among Shona chiefdoms the Ndebele regarded as their tributaries. After an Ndebele raid near Fort Victoria in July 1893, the company’s administrator, Leander Starr Jameson, recruited volunteers with promises of land, gold claims and captured cattle and invaded the kingdom in October with two columns and about five Maxim guns, while a third column of Bechuanaland police and Khama III’s Bangwato came from the south-west. The Ndebele regiments attacked the columns’ wagon laagers at Shangani (Bonko) on 25 October and Bembesi (Egodade) on 1 November and were cut down by machine-gun and rifle fire. Lobengula abandoned and burned his capital, Bulawayo, and fled north; on 4 December his rearguard wiped out Major Allan Wilson’s patrol of 34 men at Pupu on the Shangani River. The king died in January 1894, the izinDuna (chiefs) made peace, and the company took Matabeleland, its land and most of its cattle, grievances that led to the rising of 1896."
countries: [zw, bw, gb]
sides:
