id: first-melillan-campaign
name: First Melillan campaign
start: "1893-10-03"
end: "1894-04-25"
tier: C
summary: A war between Spain and the Rifian tribes around Melilla, also called the Margallo War. It began in October 1893 when tribesmen attacked the garrison over new forts that Spain was building outside the city, near a shrine and cemetery, and on 28 October the governor of Melilla, General Juan García y Margallo, was killed in the fighting. Spain sent some 25,000 troops under General Arsenio Martínez Campos, the tribes were brought to terms with the help of the Sultan, Hassan I, and in 1894 a treaty with Morocco confirmed Melilla’s boundaries and obliged the Sultan to pay Spain an indemnity.
