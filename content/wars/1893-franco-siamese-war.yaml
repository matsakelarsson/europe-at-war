  - title: Paknam and the ultimatum
    date: July – August 1893
    when: "1893-07-13"
    borders: "1893-07-13"
    countries: [th]
    body:
      - On 13 July 1893 the aviso Inconstant and the gunboat Comète, led by the mail steamer Jean-Baptiste Say, entered the mouth of the Chao Phraya against Siamese orders. At about half past six in the evening the new Phra Chulachomklao fort at Paknam fired warning shots and then opened fire, with the Siamese gunboats joining in. In about 25 minutes the French ships forced the passage and steamed on to anchor off the French legation in Bangkok, with their guns trained on the palace; the Jean-Baptiste Say ran aground and was taken. The French lost three killed and three wounded, the Siamese about fifteen or sixteen killed and twenty wounded.
      - On 20 July France sent an ultimatum demanding all the land east of the Mekong, an indemnity and the punishment of those responsible for the killings. Siam offered to accept most of it, but not the whole left bank; France rejected this and declared a blockade of the Siamese coast from 29 July. Britain, which had warships in the river to protect its subjects, advised Siam to give way and would not intervene, and Siam accepted the ultimatum in full. The blockade was lifted on 3 August.
    facts:
      - [Paknam, "13 July 1893, French ships forced the river"]
      - [Losses, "3 French and about 16 Siamese killed"]
      - [Ultimatum, "20 July 1893"]
      - [Blockade, "29 July – 3 August 1893"]
