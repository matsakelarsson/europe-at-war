id: franco-siamese-war
name: Franco-Siamese crisis of 1893
start: "1893-04"
end: "1893-10-03"
tier: B
summary: "A short war between France and Siam over the lands east of the Mekong, which Siam held as overlord of the Lao principalities and France claimed as heir to Vietnam’s rights. In April 1893 French columns from Indochina moved into the disputed country; a French officer was captured in the Khone islands, and on 5 June a French police inspector, Grosgurin, was killed with seventeen Vietnamese militiamen at Keng Kert in Khammouane. On 13 July two French warships forced their way past the forts at Paknam at the mouth of the Chao Phraya and anchored off Bangkok. France sent an ultimatum on 20 July and blockaded the coast from 29 July to 3 August, and Siam, finding that Britain would not support it, gave way. By the treaty of 3 October 1893 Siam ceded all its lands east of the Mekong, accepted a demilitarised zone 25 km wide on the west bank and the French occupation of Chanthaburi, and paid an indemnity of three million francs. Later treaties, in 1904 and 1907, gave France the right-bank parts of Luang Prabang and Champasak and the Cambodian provinces of Battambang, Siem Reap and Sisophon, in return for the evacuation of Chanthaburi, Trat and Dan Sai."
countries: [th, la, kh]
sides:
  - id: fr
    name: France and French Indochina
    polities: [france, french-indochina]
    ink: blue
    moves: French moves
    success: French success
  - id: siam
    name: Siam
    polities: [thailand]
    ink: purple
    moves: Siamese moves
    success: Siamese success
notes:
  - The left bank of the Mekong had been tributary to Siam since 1779 and to Vietnam in some districts; both France and Siam based their claims on these overlapping tributes, which neither side’s maps could fix as lines.
  - Some of the officers in the Siamese navy and forts were Danish, among them Andreas du Plessis de Richelieu, who commanded the fort at Paknam.
