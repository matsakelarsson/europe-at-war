  - title: The treaty of 1893 and after
    date: October 1893 – 1907
    when: "1893-10-03"
    borders: "1893-10-04"
    countries: [th, la, kh]
    body:
      - The treaty signed in Bangkok on 3 October 1893 gave France all the land on the left bank of the Mekong and the islands in the river. Siam agreed to keep no troops or forts within 25 km of the west bank or in the provinces of Battambang and Siem Reap, and to pay three million francs. French troops occupied the port of Chanthaburi as a guarantee. Phra Yot, acquitted by a Siamese court, was retried by a mixed Franco-Siamese court in 1894 and sentenced to twenty years’ imprisonment. The ceded lands became French Laos, with the kingdom of Luang Prabang as a protectorate.
      - Britain and France agreed in 1896 to keep the Chao Phraya basin as a neutral buffer between their empires. By a convention of 13 February 1904 Siam ceded the right-bank parts of Luang Prabang (Sainyabuli) and Champasak, with Mlu Prey and Tonle Repou; the French left Chanthaburi in 1905 but took Trat, Dan Sai and Koh Kong instead. By the treaty of 23 March 1907 Siam ceded Battambang, Siem Reap and Sisophon to French Cambodia and got back Trat and Dan Sai, and France gave up extraterritorial rights over its Asian subjects in Siam. In 1909 Siam ceded Kedah, Kelantan, Terengganu and Perlis to Britain on similar terms. These treaties fixed most of Thailand’s present borders.
    facts:
