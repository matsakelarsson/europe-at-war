steps:
  - title: The French columns on the Mekong
    date: April – June 1893
    when: "1893-04"
    borders: "1893-06-05"
    countries: [la, kh, th]
    body:
      - After the Haw wars Siam had garrisons and commissioners in the Lao lands on both banks of the Mekong, and a French consulate had opened at Luang Prabang in 1886. Auguste Pavie, the consul there and from 1892 the French minister in Bangkok, and the colonial party in Paris argued that the left bank had belonged to Vietnam, now a French protectorate. After Siamese governors expelled French traders from the middle Mekong in 1892, France demanded in March 1893 that Siam withdraw its posts east of the river, and sent the gunboat Lutin to Bangkok.
      - In April the governor-general of Indochina, Jean de Lanessan, sent three columns into the disputed country. In the centre the small Siamese garrisons withdrew, and on 25 May the Siamese commissioner of Khammouane, Phra Yot Mueang Khwang, was made to leave his post. Elsewhere the French met resistance. In the Khone islands, where the Mekong falls into Cambodia, Siamese troops besieged a French post and captured an officer, Captain Thoreux.
      - On 5 June Phra Yot’s men attacked the village of Keng Kert, where the French police inspector Grosgurin lay sick. Grosgurin and seventeen Vietnamese militiamen were killed and the village burned. Siam said that its commissioner had acted in self-defence, under orders to make the French withdraw; in France the killing was called a massacre, and the government decided to force the issue.
    facts:
