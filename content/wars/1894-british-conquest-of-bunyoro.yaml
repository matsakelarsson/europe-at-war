notes:
  - "British officers wrote most contemporary accounts and described Kabalega as a cruel tyrant, an image that shaped colonial histories and Bunyoro’s treatment under British rule. Banyoro traditions and later historians present him as the defender of his kingdom’s independence; Uganda declared him a national hero in 2009."
  - "Dates for the start of the invasion vary: Colvile’s force crossed into Bunyoro in late December 1893, the formal declaration of war is dated 1 January 1894, and Mparo is said to have been taken on 2 or 5 January."
