id: british-conquest-of-bunyoro
name: British conquest of Bunyoro
start: "1894-01-01"
end: "1899-04-09"
tier: B
summary: "The war in which Britain and its Ganda allies conquered the kingdom of Bunyoro-Kitara in western Uganda. Omukama Kabalega, who had rebuilt Bunyoro’s power with a standing army armed with guns, resisted the advance of British influence from Buganda and backed Buganda’s Muslim party. In December 1893 Colonel Henry Colvile invaded with Sudanese troops and a large Ganda army under Semei Kakungulu; Britain declared war on 1 January 1894, and Kabalega abandoned his capital, Mparo. For five years he fought on from the Budongo forest and the country north of the Nile, while the British built forts across his kingdom and gave large parts of it to Buganda and Toro. In 1897 Kabaka Mwanga II of Buganda rose against the British, was defeated and, after a mutiny of the protectorate’s Sudanese troops, joined Kabalega. Both were captured in Lango on 9 April 1899 and exiled to the Seychelles. The lands south of the Kafu given to Buganda remained a grievance in Bunyoro; two of the “lost counties” voted to return to it in a referendum in 1964."
countries: [ug]
