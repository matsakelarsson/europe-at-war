steps:
  - title: Colvile’s invasion
    date: 1891 – January 1894
    when: "1894-01-01"
    borders: "1894-01-31"
    countries: [ug]
    body:
      - "Kabalega had become Omukama of Bunyoro-Kitara in 1870 after a war of succession. He built a standing army, the abarusura, armed with guns bought from traders, used it to bring back provinces that had broken away, and in 1872 drove off the Egyptian expedition of Samuel Baker. Buganda was Bunyoro’s old rival, and Kabalega gave refuge and help to its Muslim party after 1889. When Frederick Lugard of the Imperial British East Africa Company marched west in 1891, he restored the prince Kasagama in Toro, a province that had broken away from Bunyoro, and built a line of forts on its border held by Sudanese soldiers. Raids and counter-raids followed."
      - "In December 1893 Colonel Henry Colvile, the acting commissioner of the new British administration, invaded Bunyoro with Sudanese troops under British officers and a large Ganda army led by Semei Kakungulu, crossing the Kafu river in late December. Britain declared war on 1 January 1894. Kabalega did not risk his army in battle: he abandoned his capital at Mparo, which the invaders occupied in early January, and withdrew into the Budongo forest. Colvile built a chain of forts from the Kafu ford to Kibiro on Lake Albert to cut the kingdom in two."
    facts:
      - [Colvile crosses the Kafu, "late December 1893"]
      - [Britain declares war on Bunyoro, "1 January 1894"]
      - [Mparo occupied, "early January 1894"]
