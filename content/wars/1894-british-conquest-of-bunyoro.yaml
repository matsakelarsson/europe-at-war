        via: [[32.5, 0.35], [32.0, 0.8], [31.65, 1.2], [31.4, 1.42]]
  - title: Mwanga joins Kabalega
    date: 1894 – April 1899
    when: "1899-04-09"
    borders: "1899-04-09"
    countries: [ug, tz]
    body:
      - "For five years Kabalega fought on, from the Budongo forest and then from the country north of the Victoria Nile, in Lango and Acholi, where Acholi chiefs such as Awich of Payira sheltered him. British columns with Sudanese troops and Ganda levies burned villages, seized cattle and built forts at Hoima and other places. Colvile had promised Buganda all of Bunyoro south of the Kafu river, and those lands were given to Ganda chiefs who had fought in the war, while Toro also gained land; the Uganda Agreement of 1900 confirmed the counties given to Buganda."
      - "Kabaka Mwanga II, resentful of his loss of power, rose against the British on 6 July 1897 and was defeated in Buddu on 20 July; he fled into German territory and was held at Bukoba, and the British deposed him in favour of his infant son Daudi Chwa. In September 1897 the Sudanese soldiers of a British expedition, unpaid and overworked, mutinied in Busoga and held out for months, and the British had to bring troops from India. Mwanga escaped and returned to Buganda in January 1898 with a rebel force; defeated again, he went north and joined Kabalega."
      - "On 9 April 1899 a British-led column with Ganda allies caught the two kings in Lango, near Kangai in present-day Dokolo District. Kabalega was badly wounded. Both were sent first to Kismayu and then into exile in the Seychelles, where Mwanga died in 1903. Kabalega was allowed to return in 1923 and died at Jinja on his way home. Bunyoro was ruled by the British through Ganda agents, which provoked the Nyangire protest of 1907; two of the “lost counties”, Buyaga and Bugangaizi, voted to return to Bunyoro in a referendum on 4 November 1964."
    facts:
      - [Mwanga’s rising, "6 July 1897"]
      - [Sudanese mutiny, "September 1897"]
      - [Capture of Kabalega and Mwanga, "9 April 1899"]
