  - title: The second rising and Ugeumchi
    date: October 1894 – April 1895
    when: "1894-10"
    borders: "1894-12-05"
    countries: [kr]
    body:
      - After the Japanese victory at Pyongyang, Jeon Bong-jun decided to drive the Japanese out and raised the southern peasant army again at Samnye in October. Choe Si-hyeong, who had opposed the first rising for fear that it would bring about the destruction of Donghak, now called out the northern congregations under Son Byeong-hui, who joined Jeon at Nonsan. Risings broke out in Chungcheong, Gyeongsang, Gangwon and Hwanghae. Tens of thousands of peasants, armed mostly with spears, bows and matchlocks, marched north towards Gongju, the key to the road to Hanseong.
      - Gongju was held by about 3,000 government troops and a few hundred Japanese soldiers with modern rifles. After a first round of fighting south of the town in late November, the peasant army attacked the pass of Ugeumchi from 4 to 7 December, charging up the slope again and again into rifle and artillery fire. It broke with enormous losses; one account says only about 500 of its men remained together afterwards.
      - Jeon fell back by way of Nonsan and Wonpyeong to Taein, where he was beaten again and disbanded his army. Betrayed by a follower, he was captured at Pinori, in Sunchang, on 28 December 1894. Japanese and government troops and local militias hunted down the rebels through the winter, burning villages and killing captives, and the last band was destroyed on Mount Daedun in February 1895. Jeon, Son Hwa-jung, Choe Gyeong-seon and Kim Deok-myeong were hanged in Hanseong on 24 April 1895; Choe Si-hyeong was caught and executed in 1898. Some of the peasants’ demands, such as the abolition of slavery and the right of widows to remarry, were enacted in the Gabo reforms, and many former rebels later fought in the righteous armies against Japan.
    facts:
      - [Peasant army at Gongju, "tens of thousands"]
      - [Battle of Ugeumchi, "4–7 December 1894, Japanese and government victory"]
      - [Jeon Bong-jun captured, "28 December 1894"]
      - [Peasants killed, "estimates range from tens of thousands to several hundred thousand"]
