steps:
  - title: Gobu, Hwangtohyeon and the march on Jeonju
    date: February – May 1894
    when: "1894-02"
    borders: "1894-05-31"
    countries: [kr]
    body:
      - Donghak, “Eastern Learning”, was founded in 1860 by Choe Je-u, who was executed in 1864 as a heretic. Under its second leader, Choe Si-hyeong, it spread among the peasants of the south with its teaching that every person bears Heaven within and its promise of a new age, and in 1892–1893 its members petitioned for the clearing of Choe Je-u’s name. The peasants of Jeolla, the richest rice province, suffered from heavy and arbitrary taxes, corrupt officials and the sale of rice to Japanese merchants.
      - In Gobu the magistrate Jo Byeong-gap forced the farmers to build a new reservoir and then charged them for its water. On 15 February 1894 about a thousand peasants led by Jeon Bong-jun, a village teacher and local Donghak leader, took the county office, opened the armoury and the prison, returned the rice Jo had taken and broke the reservoir. They dispersed when a new magistrate was appointed, but the government’s inspector then hunted down those involved.
      - Jeon, with Son Hwa-jung and Kim Gae-nam, raised about 4,000 men at Mujang in late April and gathered tens of thousands at Baeksan, where they swore not to kill the innocent, to expel the Japanese and to march on Hanseong to drive out the powerful families. On 11 May, at the pass of Hwangtohyeon, they ambushed the provincial troops at dawn in the fog and routed them. Troops sent from the capital under Hong Gye-hun followed them south; on 27 May, on the Hwangryong River at Jangseong, the peasants rolled bamboo baskets ahead of them as shields against the bullets and defeated the vanguard. Jeon turned north again and on 31 May entered Jeonju, the capital of Jeolla, without a fight.
    facts:
      - [Gobu rising, "15 February 1894"]
      - [Battle of Hwangtohyeon, "11 May 1894, peasant victory"]
      - [Battle of the Hwangryong River, "27 May 1894, peasant victory"]
      - [Jeonju taken, "31 May 1894"]
