  - title: The Jeonju truce and the arrival of foreign troops
    date: June – September 1894
    when: "1894-06"
    borders: "1894-07-23"
    countries: [kr]
    body:
      - The fall of Jeonju alarmed the court, which asked the Qing to send troops. Qing soldiers landed at Asan Bay, south of Incheon, in early June, and Japan, claiming the right under the Tianjin Convention of 1885 to send troops whenever China did, landed a larger force at Incheon and marched it to Hanseong. With foreign armies on Korean soil, both the government and the rebels wanted an end to the fighting.
      - At Jeonju, on 10–11 June, the peasant leaders agreed to leave the town in return for promises of reform. Their demands included the punishment of corrupt officials and exploiting landlords, the burning of slave registers, an end to discrimination against outcast groups, permission for widows to remarry, the cancellation of debts, fairer taxes and an equal share of land for the peasants. Through the summer the rebels governed much of Jeolla through their own local offices, the jipgangso, set up alongside the magistrates; landowners in Naju and Namwon resisted them.
      - The Qing and Japanese troops did not leave. On 23 July 1894 Japanese troops seized Gyeongbokgung, the royal palace, and set up a new government under the old regent Heungseon Daewongun and the reformer Kim Hong-jip, which began the Gabo reforms. Two days later Japanese warships attacked Chinese transports off Asan, opening the First Sino-Japanese War, which the Japanese won in Korea at Seonghwan in July and Pyongyang in September.
    facts:
      - [Truce of Jeonju, "10–11 June 1894"]
      - [Gyeongbokgung seized by Japanese troops, "23 July 1894"]
