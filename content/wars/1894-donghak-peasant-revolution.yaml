id: donghak-peasant-revolution
name: Donghak Peasant Revolution
start: "1894-02-15"
end: "1895-04-24"
tier: B
summary: "A peasant rising in south-western Korea led by members of Donghak (“Eastern Learning”), a religion founded in 1860. It began on 15 February 1894 at Gobu, where Jeon Bong-jun led farmers against a corrupt magistrate, and grew in the spring into a rebellion across Jeolla. The peasant army beat government troops at Hwangtohyeon on 11 May and on the Hwangryong River on 27 May, and entered Jeonju, the provincial capital, on 31 May. The government asked the Qing for troops; Japan sent its own, and the rebels made a truce at Jeonju in June and set up local offices of their own across Jeolla. After Japanese troops seized the royal palace in July and the First Sino-Japanese War began, the Donghak rose again in October, this time against the Japanese. At Ugeumchi, outside Gongju, Japanese and government troops with modern rifles destroyed the peasant army in early December. Jeon was captured at the end of the year and hanged with other leaders on 24 April 1895. Estimates of the peasants killed range from tens of thousands to several hundred thousand."
