notes:
  - Korea used the lunar calendar until the end of 1895. The English Wikipedia articles give most dates of the rising in the lunar calendar as if they were Gregorian (Gobu on “10 January”, Hwangtojae on “7 April”); the dates here are Gregorian conversions (the Gobu rising, on the 10th day of the first month, was 15 February 1894, and Hwangtohyeon, on the 7th day of the fourth month, 11 May 1894). Where the conversion is uncertain the text gives a month.
  - The rebels were organised in jeop, Donghak congregations. The southern jeop of Jeolla under Jeon Bong-jun led both risings; the northern jeop under the religion’s leader Choe Si-hyeong opposed the first and joined the second. The war between China and Japan that the rising set off is told as the First Sino-Japanese War.
