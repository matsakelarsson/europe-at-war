  - title: The last battles in Manchuria
    date: January – March 1895
    when: "1895-03-04"
    borders: "1895-03-09"
    countries: [cn, jp]
    body:
      - Through the winter the Chinese tried to retake Haicheng, attacking it several times from Liaoyang and Yingkou, while the Japanese First Division, coming up from the Liaodong peninsula, took Gaiping (Kaiping, today Gaizhou) on 10 January. The attacks on Haicheng were all beaten off, and the Qing court sent tens of thousands of fresh troops to the region of Shanhaiguan to guard the road to Beijing.
      - In March the Japanese went over to the attack. Nozu’s First Army took Niuzhuang after fierce street fighting on 4 March, the First Division entered the treaty port of Yingkou on 7 March, and on 9 March the combined Japanese forces stormed Tianzhuangtai on the Liao River. The Chinese armies east of the Liao were broken; the campaign of January–March had cost them some 6,000 killed, wounded and captured, the Japanese under 1,000. Japan was preparing to carry the war towards Beijing when the armistice came.
    facts:
      - [Gaiping taken, "10 January 1895"]
      - [Niuzhuang taken, "4 March 1895"]
