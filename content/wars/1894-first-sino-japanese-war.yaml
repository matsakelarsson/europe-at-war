notes:
  - Korea was the main prize and the first battlefield, but not a free party to the war. The palace guard fought the Japanese on 23 July 1894; the government the Japanese then installed under Kim Hong-jip declared Korea’s ties with China ended, and on 26 August Japan made it sign a treaty of alliance. Korean government troops fought beside the Japanese against the second Donghak rising in the autumn of 1894, which is told in the story of the Donghak Peasant Revolution.
  - Korea still used the lunar calendar in 1894 (until 1896); dates here are the Gregorian ones the English sources give. Japan had used the Gregorian calendar since 1873.
  - "Places are given by the names Western sources used at the time, with today’s names where it helps: Seoul (then Hanseong), Chemulpo (Incheon), Port Arthur (Lüshunkou, today Lüshun in Dalian), Talienwan (Dalian), Weihaiwei (Weihai)."
  - Japanese army figures give 1,132 killed in action, 285 died of wounds and 11,894 died of disease, many of them in Taiwan in 1895. Chinese losses were never counted; 35,000 killed and wounded is a common estimate. The number killed at Port Arthur is disputed, with estimates from about 2,600 to 20,000 or more.
