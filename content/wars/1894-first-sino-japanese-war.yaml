id: first-sino-japanese-war
name: First Sino-Japanese War
start: "1894-07-25"
end: "1895-04-17"
tier: A
summary: "The war between Qing China and Japan in 1894–1895 for control of Korea, a tributary state of the Qing. Both powers sent troops to Korea in June 1894 during the Donghak peasant rising. On 23 July Japanese troops seized the royal palace in Seoul and installed a government that asked them to expel the Chinese; two days later the Japanese navy attacked a Chinese convoy off Pungdo and sank the troopship Kowshing, and on 1 August both countries declared war. Japan’s modern army and navy won every major battle: Seonghwan, Pyongyang and the naval battle of the Yalu in 1894, then Port Arthur (Lüshun), where Japanese troops killed thousands of soldiers and civilians after taking the town, and the naval base of Weihaiwei in February 1895. By the Treaty of Shimonoseki of 17 April 1895 China recognised Korea’s independence, ceded Taiwan, the Penghu Islands and the Liaodong peninsula and agreed to pay 200 million taels; within days Russia, Germany and France forced Japan to give back Liaodong. The war ended China’s suzerainty over Korea and made Japan the leading power in East Asia. Japan lost about 13,300 dead, most of them to disease; Chinese losses are uncertain and are usually estimated at some 35,000 killed and wounded."
countries: [cn, jp, kr, kp, tw]
sides:
