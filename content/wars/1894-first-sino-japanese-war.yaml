  - title: Pungdo and Seonghwan
    date: 25 July – 5 August 1894
    when: "1894-07-25"
    borders: "1894-08-01"
    countries: [kr, jp, cn, gb]
    body:
      - On the morning of 25 July three Japanese cruisers, Yoshino, Naniwa and Akitsushima, met the Chinese cruiser Jiyuan and the gunboat Guangyi off the island of Pungdo, at the mouth of Asan Bay. Guangyi was driven aground and burned and Jiyuan escaped badly damaged. The British steamer Kowshing, chartered by the Qing to carry some 1,100–1,200 soldiers and twelve guns to Asan, then came in sight. Its Chinese troops refused to let the British captain follow Naniwa, whose captain was Tōgō Heihachirō; after hours of talks Naniwa sank the ship. More than 800 soldiers died in the sinking or in the water, and about 300 swam to nearby islands. The sinking of a ship under the British flag caused an outcry in Britain until British jurists ruled it lawful.
      - The Chinese at Asan, about 3,900 men under Ye Zhichao, had fortified the village of Seonghwan on the road to Seoul. Ōshima marched south with some 4,000 men and four guns, turned the Chinese position at night by crossing the Anseong River, and took it in the early hours of 29 July; the Chinese lost about 500 killed and wounded, the Japanese 88. The Japanese entered Asan without a fight, and Ye’s troops made a 26-day march round Seoul to join the main Chinese army at Pyongyang. China and Japan declared war on 1 August, and Ōshima’s brigade was back in Seoul on 5 August.
    facts:
      - [Battle of Pungdo, "25 July 1894"]
      - [Kowshing sunk, "25 July 1894, more than 800 dead"]
      - [Battle of Seonghwan, "28–29 July 1894, Japanese victory"]
      - [Declarations of war, "1 August 1894"]
