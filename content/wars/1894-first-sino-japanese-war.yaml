  - title: Weihaiwei
    date: January – February 1895
    when: "1895-01-20"
    borders: "1895-02-12"
    countries: [cn, jp]
    body:
      - The rest of the Beiyang Fleet, with the battleships Dingyuan and Zhenyuan, lay at Weihaiwei on the Shandong peninsula, behind a harbour boom and the forts on the mainland and on Liugong Island. After a diversionary bombardment of Dengzhou on 18 January 1895, the Japanese landed some 25,000 men of the Second Army at Rongcheng Bay, at the eastern tip of the peninsula, from 20 January, and marched on the base from the landward side in bitter cold.
      - On 30 January they stormed the mainland forts south and east of the harbour, losing Major General Ōdera Yasuzumi, the highest-ranking Japanese officer killed in the war, and on 2 February entered Weihai town. The Japanese turned the captured guns on the fleet, cut the boom, and in night attacks from 4–5 February their torpedo boats crippled Dingyuan and sank other ships; the Chinese torpedo boats tried to break out and were destroyed or captured.
      - Itō Sukeyuki wrote to Ding Ruchang, an old acquaintance, urging him to surrender and offering him refuge in Japan. Ding refused for himself, and took poison on the night of 11–12 February; several of his captains also killed themselves. The garrison and the remaining ships were surrendered on 12 February. Itō let the Chinese sailors and soldiers go free and sent Ding’s body home with honours on a Chinese ship. The loss of the fleet left the sea approaches to Beijing open, and the Qing court sent Li Hongzhang to sue for peace.
    facts:
      - [Landing at Rongcheng Bay, "from 20 January 1895"]
      - [Mainland forts taken, "30 January 1895"]
      - [Ding Ruchang’s suicide, "night of 11–12 February 1895"]
      - [Weihaiwei surrenders, "12 February 1895"]
