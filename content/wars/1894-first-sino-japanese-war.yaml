  - title: The battle of the Yalu
    date: 17 September 1894
    when: "1894-09-17"
    borders: "1894-09-17"
    countries: [cn, kp, jp]
    body:
      - The Beiyang Fleet under Admiral Ding Ruchang had escorted transports with some 4,500 reinforcements to Dadonggou, at the mouth of the Yalu, and was preparing to return to Port Arthur when the Japanese Combined Fleet of Vice Admiral Itō Sukeyuki found it near Haiyang Island on 17 September. The Chinese had the two most powerful warships in East Asia, the German-built battleships Dingyuan and Zhenyuan, which no Japanese shell could pierce; the Japanese had faster cruisers and many more quick-firing guns, better shells and better-trained crews.
      - Ding’s ships formed a line abreast, while the Japanese steamed round them in two columns and fired into their unarmoured cruisers. In about five hours the Chinese lost five ships. The cruiser Zhiyuan sank with her captain Deng Shichang while trying to ram a Japanese cruiser, and the captain of Jiyuan, who fled the battle, was later beheaded. Some 850 Chinese sailors were killed and 500 wounded; the Japanese lost about 180 killed and 200 wounded, many of them on the flagship Matsushima, and no ships. The two Chinese battleships survived, but Li Hongzhang ordered the fleet to stay in harbour, and Japan held the sea for the rest of the war.
    facts:
      - [Battle of the Yalu River (Haiyang Island), "17 September 1894, Japanese victory"]
      - [Chinese ships lost, "five cruisers sunk or destroyed"]
      - [Losses, "about 850 Chinese and 180 Japanese killed"]
