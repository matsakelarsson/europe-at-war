  - title: Port Arthur and its massacre
    date: October – November 1894
    when: "1894-10-24"
    borders: "1894-11-21"
    countries: [cn, jp]
    body:
      - While the First Army crossed the Yalu, Ōyama Iwao’s Second Army landed unopposed from 24 October at Huayuankou, near Pitzuwo (Pikou) on the east coast of the Liaodong peninsula, to take Port Arthur, the Beiyang Fleet’s fortified base. On 6 November it stormed the walled town of Jinzhou at the neck of the peninsula, and on 7 November it entered the port of Talienwan (Dalian), whose defenders had fled, leaving behind plans of the minefields. The fleet had already been ordered to Weihaiwei.
      - Port Arthur was ringed by forts with Krupp guns, but many of its officers fled before the attack. The Japanese stormed the landward forts on 21 November and took the town the same day with a loss of 40 killed and 241 wounded. On entering they found the mutilated bodies of Japanese soldiers captured in a skirmish a few days before. For the next three or four days Japanese troops killed soldiers who had thrown away their uniforms and civilians alike in the streets, houses and surrounding hills.
      - Western correspondents with the army reported the killings; James Creelman of the New York World wrote that practically the whole population had been massacred. The Japanese government admitted excesses, blamed provocation and disguised soldiers, and punished no one. The number of dead is disputed. A report sent to Li Hongzhang counted some 2,600–2,700 civilians killed in the town alone; the Wanzhong Tomb, first built in 1895–1896, gave about 18,000 dead in its first epitaph and 20,000, including soldiers, when it was rebuilt in 1948; other estimates are lower or higher. The reports damaged Japan’s standing abroad at the moment it was negotiating an end to its unequal treaties with the Western powers.
    facts:
      - [Landing at Huayuankou, "from 24 October 1894"]
      - [Jinzhou taken, "6 November 1894"]
      - [Talienwan taken, "7 November 1894"]
      - [Port Arthur taken, "21 November 1894"]
      - [Dead in the massacre, "estimates from about 2,600 to 20,000"]
