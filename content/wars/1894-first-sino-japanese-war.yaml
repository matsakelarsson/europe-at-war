steps:
  - title: Two armies in Korea, and the palace
    date: June – July 1894
    when: "1894-06-08"
    borders: "1894-07-23"
    countries: [kr, kp, jp, cn]
    body:
      - Since the 1870s Japan had competed with Qing China for influence in Korea, which had sent tribute to the Chinese emperors for centuries. After a failed pro-Japanese coup in Seoul in 1884, the two powers agreed in the Convention of Tianjin (1885) to withdraw their troops and to inform each other before sending any back. In the spring of 1894 the Donghak peasant army rose in Jeolla province and on 31 May took Jeonju, the provincial capital. King Gojong’s government asked the Qing for help, and from 8 June some 2,500–2,800 Chinese troops under Ye Zhichao and Nie Shicheng landed at Asan Bay, south of Seoul.
      - Japan, holding that China had not given proper notice, sent its own force at once. A mixed brigade under Major General Ōshima Yoshimasa landed at Chemulpo (Incheon) and took up positions around Seoul; by the end of June there were some 8,000 Japanese troops in Korea, more than twice the Chinese force. The Donghak army had meanwhile made a truce with the government, and Korea asked both powers to leave. Japan instead demanded sweeping reforms of the Korean government, which China rejected.
      - Before dawn on 23 July Japanese troops marched into Seoul, then called Hanseong, and stormed Gyeongbokgung palace. The palace guard resisted until the king, now in Japanese hands, was made to order it to lay down its arms. The Japanese put the king’s father, the Heungseon Daewongun, at the head of affairs, and a new cabinet under Kim Hong-jip began the Gabo reforms and asked Japan to drive the Chinese troops out of Korea.
    facts:
      - [Donghak army takes Jeonju, "31 May 1894"]
      - [Chinese troops land at Asan, "from 8 June 1894"]
      - [Japanese troops land at Chemulpo, "from 9 June 1894"]
      - [Gyeongbokgung occupied, "23 July 1894"]
