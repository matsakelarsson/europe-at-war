  - title: Pyongyang
    date: August – September 1894
    when: "1894-09-15"
    borders: "1894-09-15"
    countries: [kp, kr, jp, cn]
    body:
      - The main Chinese force in Korea, some 13,000 men or more of Li Hongzhang’s Huai Army (Chinese sources give up to 20,000), who had come by sea and overland from Manchuria, spent August fortifying Pyongyang behind its city walls, the Taedong River and the hills to the north. Japan landed the rest of its First Army at Chemulpo, Busan and Wonsan, and on 26 August made the Korean government sign a treaty of alliance against China.
      - Lieutenant General Nozu Michitsura attacked on 15 September with four columns converging from the south, the south-west and the north. The attacks from the south were beaten back in heavy rain, but the columns from Wonsan and Sangnyong stormed the forts on Moranbong, the hill north of the city, and their guns could fire over the walls. That afternoon the Chinese asked for terms, and in the night they broke out towards the Yalu; many were shot down on the roads. The Chinese lost about 2,000 killed and 700 captured, among the dead the Muslim general Zuo Baogui, who fell defending the northern gate. Japanese losses were 162 killed and 438 wounded. The Japanese entered the city on 16 September; the Chinese did not stop until they had crossed the Yalu, leaving Korea to Japan.
    facts:
