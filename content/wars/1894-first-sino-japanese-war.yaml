  - title: Shimonoseki and the Triple Intervention
    date: March – November 1895
    when: "1895-03-20"
    borders: "1895-05-08"
    countries: [cn, jp, tw, kr, kp, ru, de, fr]
    body:
      - Li Hongzhang arrived at Shimonoseki in March 1895 to negotiate with the prime minister Itō Hirobumi and the foreign minister Mutsu Munemitsu. Japan refused an armistice on any terms China could accept, and its troops occupied the Penghu Islands in the Taiwan Strait on 23–26 March. On 24 March a Japanese nationalist, Koyama Toyotarō, shot Li in the face. The attack embarrassed the Japanese government, which then agreed to an armistice on 30 March, excluding Taiwan and Penghu.
      - By the Treaty of Shimonoseki, signed on 17 April 1895, China recognised “the full and complete independence and autonomy of Korea”, ending the tributary relationship; ceded Taiwan, the Penghu Islands and the Liaodong peninsula with Port Arthur to Japan; agreed to pay an indemnity of 200 million taels of silver; and opened four more cities to Japanese trade. Japan kept Weihaiwei as a pledge for the payment. The cession of Taiwan led to the Japanese invasion of the island that summer, told in its own story.
      - On 23 April Russia, Germany and France “advised” Japan to give up the Liaodong peninsula, whose possession they said would threaten Beijing and Korea. Unable to face three great powers, Japan agreed on 5 May, and by a convention of 8 November 1895 returned the peninsula to China for another 30 million taels. Three years later Russia leased Port Arthur and Dalian for itself, Germany took Jiaozhou Bay and Britain Weihaiwei. In Korea, Japan’s victory did not bring the control it wanted. In October 1895 Japanese agents murdered Queen Min, and the king took refuge in the Russian legation, setting Japan and Russia on the road to war in 1904.
    facts:
      - [Penghu Islands occupied, "23–26 March 1895"]
      - [Armistice, "30 March 1895"]
      - [Treaty of Shimonoseki, "17 April 1895"]
      - [Triple Intervention, "23 April 1895"]
      - [Liaodong returned, "8 November 1895, for 30 million taels"]
