  - title: Across the Yalu
    date: October – December 1894
    when: "1894-10-24"
    borders: "1894-12-13"
    countries: [cn, kp, kr, jp]
    body:
      - Yamagata Aritomo’s First Army reached the Yalu on 23 October. On the night of 24 October it threw a pontoon bridge across the river near Uiju, and on 25 October took the hill of Hushan, the northern end of the Chinese line. The next morning the Chinese fortifications along the river, from Hushan and Jiuliancheng down to Andong (today Dandong), were found abandoned.
      - The Chinese fell back on Fenghuangcheng, then gave it up on 30 October; Song Qing’s army withdrew towards Mukden (Shenyang), the old Manchu capital. Japanese columns took Xiuyan in November and fought off Chinese attacks around Motianling in the mountains, and on 13 December Katsura Tarō’s 3rd Division took the walled town of Haicheng. Yamagata, ill, was recalled and Nozu took over the First Army.
      - Behind the front, the Donghak peasant army had risen again in Korea in October against the Japanese presence. Japanese troops and Korean government forces crushed it at Ugeumchi near Gongju late in 1894 and hunted down its fighters through the winter.
