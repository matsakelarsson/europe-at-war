  - title: Up the Betsiboka
    date: March – June 1895
    when: "1895-06-09"
    borders: "1895-06-09"
    countries: [mg, fr]
    body:
      - "The vanguard of the expeditionary corps reached Majunga on 1 March 1895, and the main body began to land on 23 April; General Jacques Duchesne arrived with it on 6 May. He had about 15,000 soldiers, French infantry and marines, the Foreign Legion and Algerian and other colonial troops, and some 7,000 drivers and porters, many of them Kabyles from Algeria. The War Ministry had decided that supplies would go inland in thousands of light metal carts, the voitures Lefebvre, which needed a road; the soldiers had to build it as they advanced, through swamps and across rivers, in heat and rain."
      - "The army moved up the valley of the Betsiboka. The Merina posts on the lower river, among them Marovoay, Mahabo and Miadana, fell in a series of small fights between March and May, and on 9 June the French took the fort of Mevatanana, the main Merina position on the river. Duchesne set up his headquarters at nearby Suberbieville, a gold-mining settlement founded by a French concessionaire. The Merina commanders fell back rather than risk their army in the open."
    facts:
      - [French expeditionary corps, "about 15,000 soldiers and 7,000 drivers and porters"]
      - [Carts, "4,000–5,000 voitures Lefebvre"]
      - [Mevatanana taken, "9 June 1895"]
    markers:
      - kind: event
        side: fr
