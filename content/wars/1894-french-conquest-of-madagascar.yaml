  - title: Gallieni and the end of the monarchy
    date: September 1896 – mid-1897
    when: "1897-02-28"
    borders: "1897-02-28"
    countries: [mg, fr]
    body:
      - "General Joseph Gallieni arrived in September 1896 with full civil and military powers, and soon became governor-general. He blamed the rising on the Merina court. On 15 October 1896 he had Prince Ratsimamanga, the queen’s uncle, and the minister Rainandriamampandry, who had defended Tamatave against the French in 1885, shot after a court martial for supporting the rebels; many others were exiled or imprisoned."
      - "Gallieni and his officers, among them Hubert Lyautey, fought the rising with what they called the oil stain (tache d’huile): a spreading network of military posts, columns that burned the rebels’ villages and crops, amnesties for those who surrendered and markets and roads for the areas brought under control. Hunger drove many bands to give up. Rabezavana surrendered in May 1897, and by about June 1897 the rising in Imerina was over, though fighting went on in other parts of the island, among the Sakalava and in the south and east, into the 1900s."
      - "On 27 February 1897 Gallieni sent Ranavalona III into exile. She was taken to Tamatave and then to Réunion, and on 28 February 1897 the Merina monarchy was abolished; in 1899 she was moved to Algiers, where she died in 1917. The dead of the rising and its suppression are not known: estimates of Malagasy deaths run as high as 100,000, many of them from hunger and disease, while French losses, mostly from disease, were in the hundreds. Madagascar remained a French colony until 1960."
    facts:
      - [Ratsimamanga and Rainandriamampandry executed, "15 October 1896"]
      - [Monarchy abolished, "28 February 1897"]
      - [Rabezavana surrenders, "May 1897"]
    markers:
