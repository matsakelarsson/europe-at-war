  - title: Fever and Andriba
    date: June – September 1895
    when: "1895-08-22"
    borders: "1895-08-22"
    countries: [mg, fr]
    body:
      - "The road was the expedition’s undoing. Malaria, dysentery and typhoid swept through the soldiers who built it, and the hospitals at Majunga and along the route filled with the sick and dying; the young soldiers from France suffered worst. By the end of the campaign 5,756 men of the expedition had died of disease, about one in three, against 25 killed in action."
      - "Rainilaiarivony tried to stop the French at Tsarasaotra on 29 June, but the attack failed. At Andriba, a strong position on the plateau edge, the French found the Merina entrenched; they reached it on 20 August, and on 22 August General Voyron’s troops took it after brief fighting, the defenders falling back. Andriba was still about 150 km from Antananarivo, the rainy season was coming, and the road could not be pushed much further with the men still fit to work."
    facts:
      - [Merina attack at Tsarasaotra fails, "29 June 1895"]
      - [Andriba taken, "22 August 1895"]
      - [French dead, "25 killed in action, 5,756 dead of disease"]
    markers:
