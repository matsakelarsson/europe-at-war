notes:
  - "French writers called the Merina government and army “Hova”, and the war of 1894–1895 the Second Madagascar Expedition or the second Franco-Hova war."
  - "The Menalamba took their name from the shawls (lamba) of the rural people, said to be stained red with the laterite earth of the highlands. Historians disagree about the rising’s aims: Hubert Deschamps and Stephen Ellis stressed its rejection of the Christian state church and of the old regime’s officials, Gwyn Campbell the burden of forced labour (fanompoana) that the court and the mission churches had imposed."
  - "Numbers differ between accounts. The figures for the French expedition (about 15,000 soldiers and 7,000 drivers and porters; 25 killed in action and 5,756 dead of disease) are those usually cited from French official sources; the Malagasy army’s strength and losses are not well known."
