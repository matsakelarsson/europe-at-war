steps:
  - title: The ultimatum
    date: October 1894 – January 1895
    when: "1894-12-12"
    borders: "1895-01-14"
    countries: [mg, fr]
    body:
      - "The treaty of 1885 had left France and the Merina government arguing for nine years over what the French resident at Antananarivo was entitled to do. In the Anglo-French convention of 5 August 1890 Britain recognised a French protectorate over Madagascar, and France a British one over Zanzibar, which left the Merina without a European friend. In October 1894 the former governor of Cochinchina, Charles Le Myre de Vilers, brought Queen Ranavalona III and her prime minister Rainilaiarivony a treaty that would have given France control of the island’s government and army. They refused, the French residents left the capital, and the French parliament voted the money for an expedition."
      - "On 12 December 1894 French troops occupied Tamatave, the main port of the east coast, and on 14 January 1895 the navy landed at Majunga in the north-west, which was to be the base for the march inland. The Merina army was large on paper, with tens of thousands of soldiers and reserves, and had bought modern rifles and some artillery, but its men were poorly trained and paid, many of its officers owed their rank to purchase or favour, and its commander-in-chief, Rainilaiarivony, was 66 years old. The British officers who had trained it had left. The government counted on the island’s distances, forests and fevers, “General Hazo and General Tazo” (forest and fever) as an old saying had it, to defeat the invaders."
    facts:
      - [Le Myre de Vilers’ ultimatum refused, "October 1894"]
      - [Tamatave occupied, "12 December 1894"]
      - [Majunga occupied, "14 January 1895"]
