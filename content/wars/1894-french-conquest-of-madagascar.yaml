id: french-conquest-of-madagascar
name: French conquest of Madagascar
start: "1894-12-12"
end: "1897-06"
tier: A
summary: "The French invasion that ended the independence of the Merina kingdom of Madagascar, and the Menalamba rising that followed. After Queen Ranavalona III’s government refused a full French protectorate in October 1894, French forces occupied Tamatave in December and Majunga in January 1895. An expeditionary corps of about 15,000 men under General Jacques Duchesne landed at Majunga and marched up the Betsiboka, building a road for its carts as it went; malaria and other diseases killed more than 5,700 of its men, while only 25 died in combat. From Andriba a flying column of some 4,250 men pushed through to Antananarivo, shelled the royal palace on 30 September 1895 and forced the queen to accept a protectorate. In November 1895 the Menalamba (“red shawls”), a rural rising against the French, the Christian court and its forced labour, broke out around the capital and by mid-1896 besieged it. France annexed Madagascar in August 1896 and sent General Joseph Gallieni, who executed leading Merina nobles, crushed the rising by mid-1897, deposed and exiled the queen and abolished the monarchy on 28 February 1897. Resistance continued in other parts of the island for some years; estimates of the Malagasy dead in the rising and its suppression run up to about 100,000."
countries: [mg, fr]
