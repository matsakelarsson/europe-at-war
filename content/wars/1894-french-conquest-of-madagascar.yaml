  - title: The red shawls
    date: November 1895 – September 1896
    when: "1896-03"
    borders: "1896-08-06"
    countries: [mg, fr]
    body:
      - "Less than eight weeks after the French entered Antananarivo, in late November 1895, about 2,000 people rose at Amboanana, west of the capital, and killed a British Quaker missionary family and a Merina governor. The rising spread through the countryside of Imerina, and in March 1896 it became general. Its fighters, called Menalamba after their red-stained shawls, burned hundreds of churches and killed Malagasy pastors and teachers, Merina officials and five European missionaries. They called on the old royal talismans and the ancestors against the Christian state church, the forced labour and taxes of the old regime and the French who now protected it. They did not seek to restore the queen’s government, whose officials they attacked."
      - "The strongest bands held the forests and hills of the north and north-east around Anjozorobe, under leaders such as Rabezavana and Rabozaka, and Vakinankaratra in the south under Rainibetsimisaraka; bands of outlaws, the fahavalo, joined them. At its height the rising may have controlled areas with up to 300,000 people. In July, August and September 1896 the Menalamba blockaded Antananarivo, and a state of siege was declared."
      - "In Paris the government decided to end the protectorate. The law annexing Madagascar as a French colony was promulgated on 6 August 1896. In late September the outgoing resident-general, Hippolyte Laroche, proclaimed the abolition of slavery, which freed several hundred thousand people and deprived Merina slave-owners of their labour."
    facts:
      - [Rising at Amboanana, "late November 1895"]
      - [Blockade of Antananarivo, "July – September 1896"]
      - [Annexation, "6 August 1896"]
