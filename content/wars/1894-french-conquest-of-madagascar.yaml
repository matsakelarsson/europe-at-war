  - title: The flying column and the fall of Antananarivo
    date: 14 September – 1 October 1895
    when: "1895-09-30"
    borders: "1895-10-01"
    countries: [mg, fr]
    body:
      - "Duchesne left the road and the sick behind and formed a light column of the fittest men: about 4,250 soldiers with three batteries of artillery, 1,500 Kabyle drivers and 2,800 mules, carrying twenty days’ food. It left Andriba on 14 September and covered the 150 km to the capital in sixteen days. The Merina tried to hold the passes and fought at Tsinainondry on 15 September, at the Kiangara pass on 17 September and in the Ambohimena mountains on 19 September, but each time the French artillery and rifles drove them back."
      - "At the end of September the column reached the hills around Antananarivo, and on 30 September, after fighting on the heights outside the city, its guns opened fire on the Rova, the royal palace on the summit. Rainilaiarivony sent an interpreter with a white flag, and his son came out to ask for terms; that afternoon the French entered the capital."
      - "On 1 October 1895 Ranavalona III signed a treaty that made Madagascar a French protectorate. The French removed Rainilaiarivony, who had governed the kingdom for 31 years, and put him under house arrest on 15 October; in February 1896 he was sent into exile in Algiers, where he died on 17 July 1896. The queen stayed on her throne under a French resident-general."
    facts:
      - [Flying column, "about 4,250 soldiers, 1,500 drivers, 2,800 mules"]
      - [Antananarivo taken, "30 September 1895"]
      - [Protectorate treaty, "1 October 1895"]
    markers:
