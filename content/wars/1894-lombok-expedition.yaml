id: lombok-expedition
name: Dutch intervention in Lombok and Karangasem
start: "1894-06"
end: "1894-11-23"
tier: C
summary: "The Dutch conquest of Lombok, ruled since the 18th century by a Balinese dynasty from Karangasem, and with it of Karangasem in eastern Bali. The Muslim Sasak majority of Lombok resented the Balinese court at Cakranegara, and when it conscripted men for a war against Klungkung in 1891, the Sasak of Praya and eastern Lombok rose; the court sent more than 12,000 men against them, and in October 1892 several Sasak chiefs asked the Dutch for help. Governor-General Aart van der Wijck approved an expedition on 27 May 1894, and about 2,400 European and Indonesian soldiers, under General Jacobus Vetter with General P. P. H. van Ham, landed at Ampenan. The Dutch demanded that the old raja, Ratu Agung Gede Ngurah Karangasem, abdicate in favour of the crown prince and give up his son Anak Agung Made, whose harsh rule the Sasak blamed; the court put Made to death and accepted most of the demands. But on the night of 25–26 August 1894 Balinese forces, led by the crown prince Anak Agung Ketut without the raja’s knowledge, attacked the Dutch camp at the Mayura palace in Cakranegara and killed more than 500 soldiers, sailors and labourers, van Ham among them. The Dutch fell back to Ampenan, returned with reinforcements, destroyed the palaces of Mataram and Pagesangan in September and bombarded Cakranegara from 8 November; about 2,000 Balinese and 166 Dutch soldiers died in its capture. Many of the Balinese nobility died in puputan (fights to the death); the raja surrendered on 20 November, was taken to Batavia on 23 November and died there in 1895. Lombok and Karangasem became part of the Dutch East Indies, Karangasem under the Balinese lord Gusti Gede Jelantik as a Dutch regent. The Dutch carried off the court treasury, about 230 kg of gold and 7,199 kg of silver coin with about 1,000 krisses, and some 400 manuscripts, among them a copy of the Nagarakretagama that the Netherlands returned to Indonesia in 1970."
