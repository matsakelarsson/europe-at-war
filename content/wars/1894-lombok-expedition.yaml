notes:
  - Dutch accounts of the time called the night attack of August 1894 treachery; Balinese and Indonesian accounts stress that the Dutch had come to depose the raja. The figures for the dead are from Dutch records; Sasak and Balinese losses in the fighting of 1891–1894 were not counted.
