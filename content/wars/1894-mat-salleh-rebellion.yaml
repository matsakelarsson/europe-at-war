id: mat-salleh-rebellion
name: Mat Salleh rebellion
start: "1894"
end: "1900-01-31"
tier: C
summary: "A rebellion in North Borneo (today’s Sabah) against the British North Borneo Chartered Company, led by Mat Salleh (Datu Muhammad Salleh), a chief of Suluk and Bajau descent from the Sugut River. The Company’s new taxes on rice, boats and trade passes, and its rules that took authority from local chiefs, bore hard on the coastal and river peoples, and Mat Salleh kept collecting the tolls on the Sugut himself. In 1894 he was suspected of the killing of two Iban traders on the Sugut and refused arrest. In August 1895 he took a petition against the taxes to Sandakan and was refused a hearing; on 29 August Company men tried to arrest him on Jambongan Island, and when he escaped they burned his village. He built forts in the interior, which the Company took one after another without catching him, and gathered Bajau, Suluk and Dusun (Kadazan) followers. On 9 July 1897 his men raided the Company station on Gaya Island, burned it and carried off its treasury and a clerk as hostage; in November they burned the residency at Ambong. Company troops were beaten back at his fort at Ranau on 13 December 1897 and took it on 9 January 1898, after he had moved to Tambunan. In April 1898 the Company’s managing director, William Clarke Cowie, met him and agreed that he could settle in Tambunan and run the district, but the written terms did not match what Mat Salleh understood, and when the Company began to set up its own post in Tambunan, fighting resumed in 1899. A Company force reached Tambunan at the end of December 1899, diverted the river that supplied his fort with water and shelled it for four days; Mat Salleh was killed on 31 January 1900 (some accounts say 1 February). About 1,000 of his followers and people of the nearby villages are reported killed in the campaign. Some of his followers fought on until about 1903–1905. He is remembered in Malaysia as a fighter against colonial rule, and a memorial stands at the site of his fort in Tambunan."
