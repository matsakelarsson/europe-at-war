id: akassa-raid
name: Akassa raid
start: "1895-01-29"
end: "1895-04"
tier: C
summary: "An attack by the Nembe kingdom, also called Brass, on the Royal Niger Company in the Niger Delta, and the British reprisal that followed. Nembe was an Ijaw trading state on the eastern side of the delta, inside the British Oil Rivers Protectorate since 1884. The Royal Niger Company, which held a British charter over the Niger from 1886, used its rules and licences to keep the river trade for itself and shut out the Nembe traders, who had sold palm oil in the interior markets for generations. In January 1895 King Frederick William Koko, who had recently renounced Christianity, led more than a thousand men in some 22 war canoes against the company’s headquarters at Akassa, at the mouth of the Nun river. At dawn on 29 January they destroyed its warehouses, offices and machinery, killed a number of its African workers and carried about 70 captives back to Nembe. Koko offered to exchange them for a return to free trade, writing that his quarrel was with the company and not with Queen Victoria; when the British refused, more than forty of the captives were killed in a ritual, and later reports said they had been eaten. On 22 February a Royal Navy force, which had left Brass two days earlier, attacked and burnt Nembe, and many more people died in a smallpox epidemic that followed. Koko escaped. The inquiry of Sir John Kirk, published in 1896, confirmed the killings but also upheld many of Nembe’s complaints against the company. Koko refused the settlement offered and died in hiding in 1898. Criticism of the company after Akassa contributed to the revocation of its charter in 1899; on 1 January 1900 its territories passed to the British crown."
