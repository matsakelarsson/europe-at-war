notes:
  - "Most of what is known comes from Free State officers’ reports; the rebels left no written record of their own. The Luluabourg mutiny is dated 4 July 1895 by Belgian historians, January 1895 in some English accounts. Dates for the end of the last bands differ between sources (1901 or 1908), and the number of people killed in the fighting and the reprisals is not known."
  - "The Tetela had served the Swahili-Arab traders as soldiers before they served the Free State; for the war in which they were recruited, see the Congo Arab war."
