id: batetela-rebellion
name: Batetela rebellion
start: "1895-07"
end: "1908"
tier: C
summary: "Three revolts of Tetela and Kusu soldiers of the Congo Free State’s army, the Force Publique, and the guerrilla war that followed them, from 1895 until 1901 or later. The Free State had recruited heavily among the Tetela of the Sankuru, Lomami and Maniema during the Congo Arab war of 1892–1894, in which their leader Ngongo Lutete changed sides and fought for the Free State. In September 1893 Ngongo was executed after a summary court-martial on a charge of treason that many of his followers considered false. In July 1895 the Tetela soldiers of the garrison at Luluabourg (Kananga) rose, killed one of their Belgian officers and marched off; Tetela soldiers from other posts joined them over the following years, and by October 1896 there were some 3,000–4,000 of them in the Kasai, the Lomami and Maniema. In 1897 about 1,300 Tetela and Kusu soldiers of Francis Dhanis’s expedition to the Upper Nile, described as the largest colonial force yet assembled in Africa, rose in the north-east of the Free State over harsh treatment and the execution of some of their chiefs, killed about ten Belgian officers and broke up the expedition, which was meant to claim the Fashoda region before the British and the French; Dhanis spent 1897 and 1898 fighting the rebel bands. On 17 April 1900 the garrison of the Shinkakasa fort, which guarded the river below the capital, Boma, also rose, fired on a ship moored in the river and threatened the town before it was overcome. The last bands, around Lake Kisale in northern Katanga, were defeated in 1901 by some accounts and in 1908 by others. Afterwards the colonial authorities mixed the peoples in every unit of the Force Publique so that no group was a majority. Free State and Belgian writers called the revolts mutinies; they are now counted among the most important anti-colonial revolts in the Congo’s history."
