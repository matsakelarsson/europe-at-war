  - title: Weyler and the reconcentration
    date: February 1896 – 1897
    when: "1896-10-21"
    borders: "1896-10-21"
    countries: [cu, es, us]
    body:
      - Martínez Campos would not wage the war of terror he believed was needed to win and asked to be replaced. His successor, General Valeriano Weyler, arrived in Havana on 10 February 1896. Spain poured in troops, about 200,000 men by the end of the war, against insurgent forces that rarely numbered more than a few tens of thousands. Weyler built a new trocha from Mariel to Majana to pen Maceo into Pinar del Río, strengthened the Júcaro–Morón line, and sent his columns through the west province by province.
      - On 21 October 1896 he ordered the people of the countryside of Pinar del Río to move within eight days into towns held by Spanish troops; anyone found outside afterwards would be treated as an enemy, and crops and livestock left behind were destroyed. The order was extended to Havana and Matanzas and in 1897 to Las Villas and other provinces. Crowded into the towns without food, shelter or medicine, the reconcentrados died in huge numbers of hunger, dysentery, yellow fever and smallpox. The historian John Lawrence Tone estimates 155,000 to 170,000 deaths, nearly a tenth of Cuba’s people; older Cuban estimates are much higher. American newspapers called Weyler “the Butcher”, and the suffering they reported turned American opinion against Spain.
    facts:
      - [Weyler arrives, "10 February 1896"]
      - [Reconcentration ordered in Pinar del Río, "21 October 1896"]
      - [Civilian deaths, "about 155,000–170,000 (Tone); other estimates higher"]
