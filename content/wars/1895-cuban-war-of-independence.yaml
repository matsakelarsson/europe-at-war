id: cuban-war-of-independence
name: Cuban War of Independence
start: "1895-02-24"
end: "1898-08-12"
tier: A
summary: "The last and decisive Cuban war against Spanish rule, which José Martí called “the necessary war”. Martí united the exiles of Florida and New York in the Cuban Revolutionary Party in 1892 and, with the veterans Máximo Gómez and Antonio Maceo, launched the rising of 24 February 1895, the Cry of Baire. Martí was killed at Dos Ríos in May, but the insurgents of the Liberation Army defeated Martínez Campos at Peralejo, set up a government at Jimaguayú and, in the invasion of 1895–1896, carried the war from the east to the western tip of the island, burning the sugar crop as they went. Spain sent some 200,000 soldiers, the largest army it had ever sent to the Americas, and General Valeriano Weyler forced the rural population of the west and centre into fortified towns; in this reconcentration about 155,000 to 170,000 civilians died of hunger and disease, by the most careful modern estimate, and some estimates are far higher. Maceo was killed in December 1896, but the insurgents held the countryside, Calixto García took Las Tunas and Guisa in 1897, and Spain, after Weyler’s recall, offered autonomy in 1898, which the insurgents rejected. The explosion of the USS Maine in Havana in February 1898 and American public anger at the reconcentration led to the Spanish–American War; Spain gave up Cuba in the armistice of 12 August 1898 and the Treaty of Paris, which handed the island to American military rule until the Republic of Cuba was founded in 1902, bound by the Platt Amendment."
countries: [cu, es, us]
sides:
  - id: cub
    name: Republic of Cuba in Arms (Cuban Liberation Army)
    polities: [cuban-liberation-army]
    ink: red
    moves: Cuban moves
    success: Cuban success
  - id: es
    name: Spain (Captaincy General of Cuba, the Spanish army and the Volunteers)
    polities: [spain, cuba]
    ink: gold
