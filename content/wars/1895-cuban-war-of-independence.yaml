  - title: The Maine and the American intervention
    date: February – August 1898
    when: "1898-07-17"
    borders: "1898-07-17"
    countries: [cu, es, us]
    body:
      - On 15 February 1898 the American battleship Maine, sent to Havana after the January riots, exploded in the harbour, killing 260 of her crew at once and six more later. Spain suspended the reconcentration and offered an armistice, which the insurgents refused. In April the United States Congress demanded Spain’s withdrawal from Cuba and, in the Teller Amendment, disclaimed any intention to annex the island, and the war between the United States and Spain began.
      - The Liberation Army helped the American landings. Calixto García’s troops secured the beaches at Daiquirí and Siboney for General William Shafter’s Fifth Army Corps in June, scouted and fought around Santiago de Cuba and harassed a Spanish relief column marching from Manzanillo, which nonetheless reached the city, while Gómez kept tens of thousands of Spanish troops tied down in Las Villas. But when Santiago surrendered on 17 July the Americans kept the Cuban forces out of the city and left the Spanish officials in charge, and García resigned his command in protest. On 12 August Spain and the United States signed an armistice in Washington; the Cubans were not consulted.
    facts:
      - [USS Maine explodes, "15 February 1898"]
      - [Teller Amendment, "19–20 April 1898"]
      - [Surrender of Santiago, "17 July 1898"]
      - [Armistice, "12 August 1898"]
    markers:
