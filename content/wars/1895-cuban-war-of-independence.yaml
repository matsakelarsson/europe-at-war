  - title: Jimaguayú and the invasion of the west
    date: September 1895 – January 1896
    when: "1895-10-22"
    borders: "1896-01-22"
    countries: [cu, es]
    body:
      - In September 1895 delegates of the insurgent army met at Jimaguayú in Camagüey and adopted a constitution. Salvador Cisneros Betancourt became president, with Bartolomé Masó as vice-president, Gómez as general-in-chief and Maceo as his deputy. Gómez ordered the sugar harvest stopped and the cane burned, to ruin the colony’s finances and force the workers of the estates into his ranks.
      - On 22 October 1895 Maceo set out from Los Mangos de Baraguá with some 1,400 men to carry the war to the west. He joined Gómez in Camagüey at the end of November, and together, with some 4,000 men, mostly cavalry, they crossed the trocha into Las Villas. On 15 December they destroyed a Spanish force at Mal Tiempo, near Cruces, and on 23 December, at Coliseo in Matanzas, they slipped past Martínez Campos himself. Burning cane fields as they marched, they reached the province of Havana at New Year, where Gómez stayed to keep the Spanish busy while Maceo rode on into Pinar del Río. On 22 January 1896, after 92 days, he entered Mantua, near the western tip of the island. The war now covered all of Cuba.
    facts:
      - [Assembly of Jimaguayú, "September 1895"]
      - [Invasion begins, "22 October 1895, Mangos de Baraguá"]
      - [Battle of Mal Tiempo, "15 December 1895"]
      - [Maceo reaches Mantua, "22 January 1896"]
