  - title: The leaders land and Martí falls
    date: April – July 1895
    when: "1895-05-19"
    borders: "1895-05-19"
    countries: [cu, es]
    body:
      - On 1 April 1895 Antonio Maceo, his brother José and Flor Crombet landed at Duaba near Baracoa with a small group of veterans; Crombet was killed within days, but the Maceos fought their way into the mountains and raised the east. On 11 April Martí and Gómez landed with four companions at Playitas de Cajobabo on the south coast of Guantánamo. At La Mejorana on 5 May the three leaders met and disagreed over how far the war should be run by a civilian government, as Martí wanted, or by its generals.
      - On 19 May 1895 Martí, who had been made a major general but had no military experience, rode into a Spanish column at Dos Ríos, on the Cauto, and was killed. His death made him the martyr of Cuban independence. On 13 July Maceo ambushed a column under Martínez Campos himself at Peralejo near Bayamo; Brigadier Fidel Alonso de Santocildes was killed, and the captain general reached Bayamo only with heavy losses. By the summer the insurgents held most of the countryside of Oriente and Camagüey.
    facts:
      - [Maceo lands at Duaba, "1 April 1895"]
      - [Martí and Gómez land at Playitas, "11 April 1895"]
      - [Death of Martí at Dos Ríos, "19 May 1895"]
      - [Battle of Peralejo, "13 July 1895, Cuban victory"]
