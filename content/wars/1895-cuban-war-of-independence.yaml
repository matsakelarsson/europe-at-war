notes:
  - The insurgents called themselves mambises. Many of the Liberation Army’s soldiers and officers, among them Antonio and José Maceo, Guillermo Moncada, Quintín Banderas and Jesús Rabí, were Afro-Cubans, and Spanish propaganda again called the war a race war; Martí’s idea of a Cuba “with all and for the good of all” answered it.
  - Death tolls are estimates. Spanish figures count some 9,400 soldiers killed in action and 53,300 dead of disease; the Liberation Army counted 5,480 killed and 3,437 dead of disease. For civilian deaths in the reconcentration, the historian John Lawrence Tone estimates 155,000 to 170,000, nearly a tenth of the population; older Cuban and American estimates run to 300,000 or more.
  - The base map shows Cuba as Spanish until the end of Spanish rule on 1 January 1899; the land held by the insurgents is drawn in the steps. The American part of the war is told in the Spanish–American War.
