steps:
  - title: Martí’s party and the Cry of Baire
    date: 1892 – February 1895
    when: "1895-02-24"
    borders: "1895-02-24"
    countries: [cu, es, us]
    body:
      - The Pact of Zanjón and the failure of the Little War left Cuba Spanish, and the reforms Spain had promised changed little. Sugar now depended on the American market, and when the United States raised its tariff on Cuban sugar in 1894 the island’s economy slumped. Among the Cuban exiles in the United States, the poet and journalist José Martí spent a decade uniting veterans and young radicals, rich émigrés and the cigar workers of Key West, Tampa and New York, whose clubs and contributions paid for the war. On 10 April 1892 he founded the Cuban Revolutionary Party, with himself as its delegate, and won over the old commanders Máximo Gómez, in the Dominican Republic, and Antonio Maceo, in Costa Rica.
      - In January 1895 American authorities seized at Fernandina, Florida, three ships Martí had chartered to carry men and arms to Cuba, but he ordered the rising anyway. On 24 February 1895 insurgents rose at Baire, Bayate, Guantánamo and other places in Oriente; the rising in the west, at Ibarra in Matanzas, failed, and its leader Juan Gualberto Gómez was captured. Spain sent back Arsenio Martínez Campos, the peacemaker of 1878, as captain general.
    facts:
      - [Cuban Revolutionary Party founded, "10 April 1892"]
      - [Fernandina expedition seized, "January 1895"]
      - [Cry of Baire, "24 February 1895"]
