        date: 1 January 1899
        text: Spain handed Cuba over to the American military government here.
        lonlat: [-82.359, 23.136]
        lp: b
      - kind: event
        side: us
        name: Guantánamo Bay
        date: "1903"
        text: The naval base leased to the United States under the Platt Amendment.
