  - title: Las Tunas, Guisa and autonomy
    date: 1897 – January 1898
    when: "1897-08-30"
    borders: "1897-08-30"
    countries: [cu, es]
    body:
      - In 1897 Gómez, in the campaign of La Reforma in eastern Las Villas, drew Weyler’s columns after him and wore them out in marches and skirmishes, while in Oriente Calixto García, who had returned in 1896, attacked the Spanish garrison towns. With artillery, including a dynamite gun landed by an expedition, he forced the surrender of Victoria de las Tunas on 30 August 1897 and took Guisa, near Bayamo, at the end of November. In October an assembly at La Yaya adopted a new constitution and chose Bartolomé Masó as president.
      - In Spain the prime minister, Antonio Cánovas del Castillo, who had backed Weyler, was assassinated by an Italian anarchist on 8 August 1897. The new liberal government of Práxedes Mateo Sagasta recalled Weyler in October, sent General Ramón Blanco to replace him and eased the reconcentration, and in November decreed autonomy for Cuba and Puerto Rico. An autonomous Cuban government took office on 1 January 1898, but the insurgents would accept nothing less than independence, and in Havana officers and supporters of Spanish rule rioted against autonomy in January.
    facts:
