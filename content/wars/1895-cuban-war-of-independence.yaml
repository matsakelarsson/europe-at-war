  - title: The occupation and the Platt Amendment
    date: August 1898 – May 1902
    when: "1899-01-01"
    borders: "1899-01-01"
    countries: [cu, es, us]
    body:
      - "The Treaty of Paris, signed on 10 December 1898 without any Cuban representative, ended Spanish sovereignty over Cuba. On 1 January 1899 the last Spanish captain general handed the island over to the American military governor, General John R. Brooke, followed in December by General Leonard Wood. The Liberation Army, which listed some 50,000 soldiers at the end of the war, was disbanded in 1899, its men paid off with $75 each from $3 million the United States provided, and the Assembly of Representatives that claimed to speak for the republic dissolved itself. Máximo Gómez refused to stand for president and died in Havana in 1905."
      - "A Cuban constitutional convention met in 1900. In 1901 the United States Congress passed the Platt Amendment, which gave the United States the right to intervene in Cuba, limited the Cuban government’s power to make treaties and borrow, and required a naval base, which became Guantánamo Bay. Told that American troops would not leave otherwise, the convention added it to the constitution by a narrow vote. The Republic of Cuba was proclaimed on 20 May 1902 with Tomás Estrada Palma as president, and the Platt Amendment shaped Cuban politics until it was abrogated in 1934."
    facts:
      - [Treaty of Paris, "10 December 1898"]
      - [American military government, "1 January 1899 – 20 May 1902"]
      - [Platt Amendment, "1901"]
      - [Republic of Cuba proclaimed, "20 May 1902"]
    markers:
      - kind: capital
        side: us
