  - title: The death of Maceo
    date: December 1896
    when: "1896-12-07"
    borders: "1896-12-07"
    countries: [cu, es]
    body:
      - Through 1896 Maceo fought Weyler’s columns in the mountains and valleys of Pinar del Río, cut off from the rest of the island by the trocha. In December he set out to rejoin Gómez in the centre. On the night of 4 December he and a small party crossed the bay of Mariel by boat, around the northern end of the trocha, and marched east into the province of Havana.
      - On 7 December 1896, at San Pedro near Punta Brava, south-west of Havana, his small force ran into a Spanish column. Maceo, wounded more than twenty times in his wars, was shot and killed, and Francisco Gómez Toro, the son of Máximo Gómez, who was serving as his aide, died at his side. His men carried off the bodies and buried them in secret. The loss of the “Bronze Titan”, the most admired of the insurgent generals, was a heavy blow, but the Liberation Army fought on.
    facts:
      - [Maceo crosses the bay of Mariel, "4 December 1896"]
      - [Death of Antonio Maceo, "7 December 1896, San Pedro"]
