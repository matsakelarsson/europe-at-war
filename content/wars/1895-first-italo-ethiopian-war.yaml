  - title: Adwa
    date: 1 March 1896
    when: "1896-03-01"
    borders: "1896-03-01"
    countries: [et, it]
    view:
      center: [38.97, 14.06]
      size: [70, 60]
    body:
      - The two armies faced each other for weeks in the mountains east of Adwa. Both were short of food, and Menelik’s army was beginning to disperse in search of it. Under pressure from the Italian prime minister Francesco Crispi, who wanted a victory, and after his brigade commanders voted against a retreat on 28 February, Baratieri ordered an advance by night. His army of about 17,700 men, some 10,600 Italians and 7,100 askari, with 56 guns, marched in four brigades under Generals Matteo Albertone, Giuseppe Arimondi, Vittorio Dabormida and Giuseppe Ellena, to take positions overlooking the Ethiopian camp.
      - In the dark and on poor maps the brigades lost touch. At dawn on 1 March Albertone’s askari brigade, far ahead of the others near Enda Kidane Mehret, was attacked by masses of Ethiopian troops and destroyed. Arimondi’s brigade was overwhelmed on the slopes of Mount Belah and Mount Rajo, and Dabormida’s, which had turned off into the Mariam Shewito valley, was cut off and wiped out. By noon the Italian army was in flight towards Eritrea, leaving its artillery behind. Arimondi and Dabormida were killed and Albertone was captured. Menelik’s army, from 73,000 to over 100,000 strong, under Ras Makonnen, Ras Mikael, Ras Alula, Ras Mengesha, Negus Tekle Haymanot, Ras Welle Betul and others, with Taytu’s troops and the emperor’s artillery, had fought as one force.
      - Italian losses are given as about 5,900 to over 6,100 killed, among them some 2,000 askari, with about 3,900 taken prisoner; Ethiopian losses as about 3,900 to 7,000 killed and 6,000 to 10,000 wounded. About 800 captured Eritrean askari, regarded by the Ethiopians as traitors, had their right hand and left foot cut off. The Italian prisoners were taken to Addis Ababa.
    facts:
      - [Battle of Adwa, "1 March 1896, Ethiopian victory"]
      - [Italian army, "about 17,700 men and 56 guns"]
      - [Ethiopian army, "73,000 to over 100,000"]
      - [Italian dead, "about 5,900–6,100, with about 3,900 prisoners"]
