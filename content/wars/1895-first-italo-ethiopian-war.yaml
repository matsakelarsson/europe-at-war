  - title: The siege of Mekele
    date: December 1895 – 21 January 1896
    when: "1896-01-07"
    borders: "1896-01-21"
    countries: [et, it]
    body:
      - About 1,300 soldiers, nearly 1,100 of them Eritrean askari, under Major Giuseppe Galliano held the unfinished fort the Italians had built around the church of Enda Iyesus at Mekele. Makonnen’s vanguard arrived in mid-December, and Menelik came up with the main army on 7 January 1896. Assaults on the walls were beaten back with heavy losses, but the Ethiopians took the springs below the fort, and Empress Taytu’s men guarded them.
      - With his water gone, Galliano surrendered on 21 January 1896. Menelik, who hoped to negotiate, let the garrison march out with its arms and escorted it towards the Italian lines. The Ethiopian army then marched around the Italian positions at Adigrat and Edaga Hamus and in February camped near Adwa, threatening Eritrea and the Italian line of supply.
    facts:
      - [Siege of the Mekele fort, "January 1896"]
      - [Garrison surrenders, "21 January 1896"]
