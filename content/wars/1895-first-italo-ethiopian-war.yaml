  - title: The Treaty of Addis Ababa
    date: March – October 1896
    when: "1896-10-26"
    borders: "1896-10-26"
    countries: [et, er, it]
    body:
      - The news of Adwa brought down Crispi’s government within days. Menelik did not invade Eritrea; his army was exhausted and short of food, and he withdrew south. Italy, under a new government, negotiated, and by the Treaty of Addis Ababa, signed on 26 October 1896, it annulled the Treaty of Wuchale and recognised the absolute independence of Ethiopia. The border was to follow the Mareb, Belesa and Muna rivers, leaving Eritrea to Italy, and the Italian prisoners were released in the following year against a payment Italy called compensation for their upkeep.
      - In the north-west, where Italy had taken Kassala from the Mahdists in 1894, the Mahdists besieged the town in the spring of 1896 until an Italian force relieved it; Italy handed it to the Anglo-Egyptian Sudan in 1897. Britain, France and other powers sent missions to Addis Ababa to make treaties with Menelik. Adwa assured Ethiopia’s independence for the next four decades, until Fascist Italy invaded again in 1935, and it became a symbol of African resistance to colonial rule.
    facts:
      - [Treaty of Addis Ababa, "26 October 1896"]
      - [Border, "the Mareb, Belesa and Muna rivers"]
    markers:
