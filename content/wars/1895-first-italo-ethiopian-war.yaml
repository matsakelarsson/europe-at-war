  - title: Coatit, Senafe and the occupation of Tigray
    date: December 1894 – October 1895
    when: "1895-01-13"
    borders: "1895-10-01"
    countries: [er, et, it]
    body:
      - Menelik refused to accept the protectorate. He repaid an Italian loan, bought rifles and artillery from France and Russia through the French port of Djibouti, and in 1893 denounced the treaty. Ras Mengesha Yohannes of Tigray, Yohannes’s son, who had dealt with the Italians, submitted to Menelik in 1894. In December 1894 Bahta Hagos, an Eritrean chief who had served Italy, rose against Italian rule in Akele Guzai and was killed. In January 1895 Mengesha crossed into Eritrea with about 19,000 men.
      - At Coatit on 13–14 January 1895 General Oreste Baratieri, governor of Eritrea, with about 3,900 men, most of them askari, beat off Mengesha’s attacks, and on 15–16 January he shelled the Tigrayan camp at Senafe, from which Mengesha escaped in the night. Baratieri then occupied Adigrat in March and Adwa in April and declared Tigray annexed to Eritrea. Italian columns advanced to Mekele, where they built a fort around the church of Enda Iyesus, and in October beat Mengesha again at Debra Aila and pushed their outposts south to Amba Alagi.
    facts:
      - [Battle of Coatit, "13–14 January 1895, Italian victory"]
      - [Losses at Coatit, "Italy 95 killed; Tigray about 1,500 killed"]
      - [Tigray annexed by Italy, "1895"]
