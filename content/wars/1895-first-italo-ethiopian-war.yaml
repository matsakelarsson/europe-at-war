id: first-italo-ethiopian-war
name: First Italo-Ethiopian War
start: "1894-12"
end: "1896-10-26"
tier: A
summary: "Italy’s attempt to impose a protectorate on Ethiopia, which ended in its defeat at Adwa. From Massawa, occupied in 1885, Italy had built the colony of Eritrea, and it read the Treaty of Wuchale, signed with Menelik II in 1889, as making Ethiopia its protectorate, a reading Menelik rejected. In December 1894 a revolt against Italian rule in Eritrea led to war with Ras Mengesha of Tigray; the Italians under General Oreste Baratieri defeated him at Coatit and Senafe in January 1895 and occupied Tigray. Menelik called out the whole empire, and an army of more than 100,000 destroyed an Italian force at Amba Alagi on 7 December 1895, forced the surrender of the fort at Mekele in January 1896 and, on 1 March 1896, routed Baratieri’s army of about 17,700 at Adwa, killing or capturing more than half of it. By the Treaty of Addis Ababa of 26 October 1896 Italy annulled the Treaty of Wuchale and recognised Ethiopia’s full independence, keeping Eritrea. Adwa made Ethiopia the one African state to defeat a European colonial army decisively and keep its independence through the Scramble for Africa, and it became a symbol across Africa and its diaspora."
countries: [et, er, it]
sides:
  - id: it
    name: Italy
    polities: [italy, italian-eritrea]
    ink: green
    moves: Italian moves
    success: Italian success
  - id: et
    name: Ethiopian Empire (Menelik II)
    polities: [ethiopia]
    ink: gold
    moves: Ethiopian moves
    success: Ethiopian success
notes:
  - Most of Italy’s soldiers in Africa were Eritrean askari, recruited in the colony and led by Italian officers. Many Tigrayan lords changed sides during the war, and some fought for Italy.
  - Figures for the armies and the dead at Adwa differ widely between sources. The numbers here are the ranges given by Harold Marcus, David Levering Lewis, George Berkeley and Richard Caulk as cited in the sources.
  - The Italian occupation of Tigray in 1895 is drawn as an area; the base map follows the treaty borders of Wuchale and Addis Ababa.
