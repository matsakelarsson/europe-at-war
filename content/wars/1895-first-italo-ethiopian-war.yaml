steps:
  - title: Massawa, Dogali and the Treaty of Wuchale
    date: 1885–1890
    when: "1887-01-26"
    borders: "1890-01-01"
    countries: [er, et, it]
    body:
      - Italy had held the bay of Assab on the Red Sea since 1869, first through a shipping company and from 1882 as a colony. In February 1885, with British consent and as Egypt gave up its Red Sea ports, Italian troops occupied Massawa, and they soon pushed inland to Saati and other posts claimed by Ras Alula, governor of the frontier for Emperor Yohannes IV. On 25 January 1887 Alula attacked Saati and was beaten off; the next day his army caught a relief column of about 500 Italians under Lieutenant-Colonel Tommaso De Cristoforis at Dogali and destroyed it, killing about 430. In 1888 Italy sent a much larger army; Yohannes faced it at Saati but withdrew without a battle to meet the Mahdists in the west.
      - Italy had meanwhile courted Menelik of Shewa, Yohannes’s rival. When Yohannes was killed at Gallabat in March 1889, Menelik claimed the throne, and on 2 May 1889 at Wuchale he signed a treaty of friendship with the Italian envoy Pietro Antonelli. It drew a border that left Italy the Bogos country and much of the Eritrean highlands, including Asmara, which Italian troops occupied in August. In Article 17 the Amharic text said that the emperor could use the Italian government for his dealings with other powers; the Italian text said that he must. In October 1889 Italy told the powers that Ethiopia was its protectorate, and on 1 January 1890 it proclaimed the colony of Eritrea.
    facts:
      - [Italian occupation of Massawa, "February 1885"]
      - [Battle of Dogali, "26 January 1887, Ethiopian victory"]
      - [Treaty of Wuchale, "2 May 1889"]
      - [Colony of Eritrea proclaimed, "1 January 1890"]
