  - title: The call to arms and Amba Alagi
    date: September – December 1895
    when: "1895-12-07"
    borders: "1895-12-07"
    countries: [et, it]
    body:
      - In September 1895 Menelik proclaimed a general mobilisation and called the lords of the empire to gather at Were Ilu in Wollo. Armies came from Shewa, Gojjam, Wollo, Begemder, Harar and the newly conquered south, led by Ras Makonnen, Ras Mikael of Wollo, Negus Tekle Haymanot of Gojjam, Ras Wolde Giyorgis and others, with Empress Taytu commanding her own troops. The army, well over 100,000 strong and much of it armed with modern rifles, marched north in the autumn.
      - Its vanguard, under Ras Makonnen, Ras Welle Betul and Ras Mengesha, reached the Italian outpost at Amba Alagi, a mountain commanding the road north, held by Major Pietro Toselli with about 2,350 men, most of them askari. On 7 December 1895 about 30,000 Ethiopians overran the position. Toselli and almost all his Italian officers were killed, with some 1,500 or more askari and irregulars; the survivors fell back to Mekele with General Giuseppe Arimondi, who had come up too late to help.
    facts:
      - [Mobilisation proclaimed, "September 1895"]
      - [Battle of Amba Alagi, "7 December 1895, Ethiopian victory"]
      - [Italian losses, "about 1,500–2,000 killed"]
