id: fourth-anglo-ashanti-war
name: Fourth Anglo-Ashanti War
start: "1895-12"
end: "1896-01-22"
tier: C
summary: "The British occupation of Kumasi in 1896 and the exile of the Asantehene, Prempeh I. After the war of 1873–1874 the Asante Empire had lost its southern provinces and gone through years of civil war, but Prempeh, enstooled in 1888, restored much of its unity. Britain, anxious to keep France and Germany out of the interior and its gold and rubber, offered him a protectorate in 1891, which he declined, and pressed for a British resident in Kumasi and payment of the indemnity left from 1874. An Asante embassy led by John Owusu Ansa went to London in 1895 to negotiate but was refused a hearing, and a British expedition under Colonel Sir Francis Scott, with British and West India Regiment troops, Gold Coast Hausa police and a levy raised by Major Robert Baden-Powell, left Cape Coast in December 1895. Prempeh ordered his people not to resist, and Scott entered Kumasi on 17 January 1896 without a shot being fired. On 20 January Prempeh made his formal submission; when he could not pay the indemnity demanded, he was arrested with the queen mother, Yaa Akyaa, and other leading chiefs. They were held at Elmina, then in Sierra Leone, and from 1900 in the Seychelles; Prempeh returned only in 1924. Disease killed some 18 Europeans of the expedition, among them Queen Victoria’s son-in-law Prince Henry of Battenberg. Britain declared a protectorate over Asante, built a fort in Kumasi and stationed a resident there, and four years later its demand for the Golden Stool led to the War of the Golden Stool."
