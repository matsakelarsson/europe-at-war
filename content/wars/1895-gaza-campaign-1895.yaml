id: gaza-campaign-1895
name: Portuguese campaign against Gaza
start: "1895-02-02"
end: "1895-12-28"
tier: B
summary: "The Portuguese conquest of the Gaza kingdom of Ngungunhane (Gungunhana) in southern Mozambique in 1895. The kingdom, founded in the 1820s by Nguni from Zululand under Soshangane, ruled Tsonga, Chopi and Ndau subjects between the Incomati and the Save; Ngungunhane had played Portugal against Cecil Rhodes’s British South Africa Company, but the Anglo-Portuguese treaty of 1891 placed all of it in Portugal’s sphere. In 1894 Ronga chiefdoms near Lourenço Marques (Maputo), under Portuguese overlordship, rose against taxes and abuses and attacked the town. Portugal sent an expedition under the royal commissioner António Enes, which defeated the Ronga at Marracuene on 2 February 1895. When Ngungunhane sheltered their chiefs and refused Portugal’s terms, Portuguese columns, fighting in squares with machine guns and modern rifles, won at Magul (8 September) and at Coolela near his capital Mandlakazi (Manjacaze) on 7 November, and burned the capital. On 28 December Joaquim Mouzinho de Albuquerque seized Ngungunhane at Chaimite. The king died in exile in the Azores in 1906; a last rising under his general Maguiguana was crushed in 1897."
countries: [mz, pt]
