  - title: Chaimite and the end of the kingdom
    date: December 1895 – July 1897
    when: "1895-12-28"
    borders: "1895-12-28"
    countries: [mz, pt]
    body:
      - "Ngungunhane took refuge at Chaimite, the sacred village where his grandfather Soshangane was buried, and sent Matibejana to the Portuguese as a sign that he wanted peace. Enes created a military district of Gaza on 15 December and made Mouzinho de Albuquerque, a cavalry officer who had fought at Coolela, its governor. Mouzinho set out with a small force; the king’s envoys met him on the way with gold, ivory and cattle. At dawn on 28 December 1895, with 47 Portuguese soldiers and some 200 African auxiliaries, he entered the palisaded kraal of Chaimite. Its people did not resist. He had Ngungunhane bound, made him sit on the ground before him, and had two of his advisers shot."
      - "Ngungunhane, his son Godide, seven of his wives, Matibejana and other prisoners were shipped to Lisbon, where they were paraded through the streets in March 1896, and then exiled to Angra do Heroísmo in the Azores. There the king was baptised Reinaldo Frederico Gungunhana, and there he died on 23 December 1906. Many of Gaza’s former subjects did not mourn the end of Nguni rule; Mozambique’s independence movement later made Ngungunhane a symbol of resistance, and in 1985 Portugal handed over an urn with earth from his grave, which was taken to the fortress in Maputo."
      - "In 1897 Maguiguana (Magigwane Khosa), Ngungunhane’s most famous general, rose to restore the kingdom. Mouzinho, now governor-general of Mozambique, routed his followers at Macontene near Chibuto on 21 July 1897, and Maguiguana was killed soon after. Southern Mozambique remained under Portuguese rule until independence in 1975; its men went in their hundreds of thousands to work in the mines of South Africa."
    facts:
      - [Ngungunhane captured at Chaimite, "28 December 1895"]
      - [Ngungunhane’s death in the Azores, "23 December 1906"]
      - [Battle of Macontene, "21 July 1897"]
