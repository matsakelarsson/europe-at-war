notes:
  - "Portuguese sources call the Gaza Nguni Vátuas and the campaign part of the “pacification” of Mozambique; that was their term. The Ronga, the southern Tsonga around Delagoa Bay, were not subjects of Gaza; their chiefs fought Portugal first and then took refuge with Ngungunhane."
  - "Numbers rest mostly on Portuguese reports. Gaza’s forces are given as anything from 6,000 to 20,000 at each battle, and their losses as several hundred at Magul and 300 to 1,500 at Coolela. Many of Ngungunhane’s soldiers were Chopi, Tsonga and Ndau subjects with little wish to fight for him, and several of his vassals joined the Portuguese."
