steps:
  - title: The Ronga rising and Marracuene
    date: September 1894 – February 1895
    when: "1895-02-02"
    borders: "1895-02-02"
    countries: [mz, pt]
    body:
      - "Ngungunhane became king of Gaza in 1884, and in 1889 moved his capital from Mossurize in the highlands to Mandlakazi (Manjacaze), near the lower Limpopo. Like his father Mzila he balanced the powers around him: he accepted Portuguese envoys, and in 1890 granted Rhodes’s company a mining and railway concession for a subsidy and 1,000 rifles. The Anglo-Portuguese treaty of June 1891 left the whole kingdom inside Portuguese Mozambique, and its power was already weakened by famine, disease, revolts of subject peoples and the departure of young men to the mines of the Transvaal."
      - "Between Lourenço Marques and Gaza lay small Ronga chiefdoms that paid tax to Portugal and supplied it with soldiers. Resentment of the hut tax, of labour recruiters and of traders boiled over in 1894: Matibejana (Nwamatibyana) of Zixaxa and Mahazul of Magaia raised several thousand men, attacked Portuguese posts and, in October, Lourenço Marques itself, where they were beaten back. British warships anchored in the bay to protect British subjects, and the government in Lisbon, fearing that Britain would use the crisis to take the port as the railway to Pretoria neared completion, sent António Enes as royal commissioner with full powers and an expedition from Portugal."
      - "On 2 February 1895 a column of about 800 soldiers, Portuguese and Angolan, under Major Alfredo Caldas Xavier, camped in a square near Marracuene on the Incomati, was attacked at dawn by some 3,000–4,000 Ronga fighters under Matibejana, some of them wearing the uniforms of a missing Portuguese patrol. They broke into the square before rifle, machine-gun and artillery fire drove them off. Mozambicans remember the battle as Gwaza Muthini, in Ronga “the place of piercing with the spear”. Matibejana and Mahazul fled north with their people to Gaza, where Ngungunhane gave them refuge."
    facts:
      - [Anglo-Portuguese treaty, "11 June 1891"]
      - [Ronga attack on Lourenço Marques, "October 1894"]
      - [Battle of Marracuene (Gwaza Muthini), "2 February 1895"]
