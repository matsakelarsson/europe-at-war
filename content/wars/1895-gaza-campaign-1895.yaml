  - title: Magul and Coolela
    date: August – November 1895
    when: "1895-09-08"
    borders: "1895-11-07"
    countries: [mz, pt]
    body:
      - "Enes demanded that Ngungunhane hand over the Ronga chiefs, pay a heavy yearly tribute and let Portugal collect taxes in his lands. The king played for time, waiting for the rains, and sent envoys to Natal, Pretoria and Cape Town in search of protection or an alliance; they came back with nothing. Meanwhile the Portuguese built posts, roads and bridges along the Incomati, bought river steamers and won over several chiefs. On 23 August Enes broke off the talks."
      - "A southern column under Alfredo Freire de Andrade, about 275 European and some 30 Angolan soldiers with four Nordenfelt machine guns (some accounts give about 600 men in all), crossed the Incomati in pursuit of the Ronga chiefs; its African auxiliaries had been sent to raid the chiefs’ lands. On 8 September 1895, on the plain of Magul, it formed a square protected by thorn bushes and barbed wire and was attacked by thirteen regiments, 6,000 or more men under Matibejana, Mahazul and their allies. The machine guns jammed, but rifle fire kept the attackers back; by Portuguese counts 300–400 of them were killed, against 5 Portuguese dead. The chiefs between the Incomati and the Limpopo began to submit, and armed steamers went up the Limpopo, burning villages."
      - "A northern column under Colonel Eduardo Galhardo landed at Inhambane in June and marched slowly towards Mandlakazi, losing half its European soldiers to disease. On 7 November, camped by the lake of Coolela, its square was attacked by Ngungunhane’s army, perhaps 10,000 men, many of them unwilling Chopi and Tsonga subjects. The attack broke within about forty minutes; the Portuguese lost 5 dead and some 20–30 wounded, the Gaza army hundreds, by some estimates more than a thousand. Ngungunhane fled, and on 11 November the Portuguese burned his abandoned capital."
    facts:
      - [Talks broken off, "23 August 1895"]
      - [Battle of Magul, "8 September 1895"]
      - [Battle of Coolela, "7 November 1895"]
      - [Mandlakazi burned, "11 November 1895"]
