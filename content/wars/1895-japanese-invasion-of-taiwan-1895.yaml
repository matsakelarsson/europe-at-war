  - title: Hsinchu, Miaoli and Baguashan
    date: June – September 1895
    when: "1895-08-27"
    borders: "1895-08-27"
    countries: [tw]
    body:
      - The Japanese took Hsinchu on 22 June, but south of it the Hakka militias of Jiang Shaozu, Wu Tangxing and Xu Xiang fought hard. In June and July they attacked Hsinchu and the Japanese supply lines, and the Japanese answered with sweeps that burned villages and killed many civilians. At Jianbishan near Miaoli on 10 July the militias were defeated, and Miaoli was occupied in mid-August.
      - The walled city of Changhua and the fortified heights of Baguashan above it were the strongest position in central Taiwan. In a night crossing of the Dadu river on 26–27 August, Japanese columns took the Bagua battery and the city by surprise at dawn on 27 August. It was the largest battle ever fought on Taiwanese soil; Wu Tangxing and Wu Pengnian were among the many Formosan dead. Malaria then swept the Japanese camps at Changhua and killed more than 2,000 men.
    facts:
      - [Hsinchu taken, "22 June 1895"]
      - [Miaoli occupied, "14 August 1895"]
      - [Battle of Baguashan, "27 August 1895"]
