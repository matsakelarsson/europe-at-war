steps:
  - title: Penghu, Shimonoseki and the landing in the north
    date: March – June 1895
    when: "1895-05-29"
    borders: "1895-06-07"
    countries: [tw]
    body:
      - While peace talks went on at Shimonoseki, Japan, which had kept Taiwan and Penghu out of the armistice, seized the Penghu Islands between 23 and 26 March 1895 against little resistance; soon afterwards cholera killed more than 1,500 of the occupying troops. The Treaty of Shimonoseki, signed on 17 April, ceded Taiwan and Penghu to Japan. In Taiwan, the gentry leader Qiu Fengjia and others proclaimed the Republic of Formosa in Taipei on 23 May; the governor, Tang Jingsong, took office as its president on 25 May, and its leaders hoped in vain for intervention by the European powers.
      - On 29 May the Imperial Guards Division under Prince Kitashirakawa Yoshihisa landed at Audi, east of Keelung, and on 3 June took the Keelung forts; the same day the formal handover of the island was signed aboard a ship off Keelung. Tang Jingsong fled to Xiamen, unpaid soldiers looted Taipei, and the Japanese entered the city on 7 June, invited in by its merchants.
    facts:
      - [Penghu occupied, "23–26 March 1895"]
      - [Treaty of Shimonoseki, "17 April 1895"]
      - [Republic of Formosa proclaimed, "23–25 May 1895"]
      - [Japanese landing at Audi, "29 May 1895"]
      - [Taipei occupied, "7 June 1895"]
