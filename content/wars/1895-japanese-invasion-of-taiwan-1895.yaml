id: japanese-invasion-of-taiwan-1895
name: Japanese invasion of Taiwan (1895)
start: "1895-03-23"
end: "1895-11-18"
tier: B
summary: "The Japanese conquest of Taiwan after the First Sino-Japanese War, called the Yiwei War in Chinese. Japan seized the Penghu Islands in March 1895, and by the Treaty of Shimonoseki of 17 April China ceded Taiwan and Penghu to Japan. In late May officials and gentry in Taipei proclaimed a Republic of Formosa, with the Qing governor Tang Jingsong as president, to resist the handover. The Japanese landed near Keelung on 29 May; Tang fled, and Taipei was occupied on 7 June. The advance south was then slowed by Hakka militias around Hsinchu and Miaoli and by guerrilla attacks, but the Japanese won the decisive battle at Baguashan near Changhua on 27 August. In October three Japanese forces closed in on Tainan, where the general Liu Yongfu led the republic; he fled to the mainland, and Tainan surrendered on 21 October. Japan declared the island subdued in November, although armed resistance went on for years. About 14,000 Chinese and Taiwanese soldiers and militiamen are estimated to have died; Japan lost 164 killed in battle and thousands more to cholera and malaria."
countries: [tw]
sides:
  - id: jp
    name: Empire of Japan
    polities: [japan]
    ink: red
    moves: Japanese moves
    success: Japanese success
  - id: fr
    name: Republic of Formosa and Taiwanese militias
    polities: [formosa-republic]
    ink: blue
    moves: Formosan moves
    success: Formosan success
notes:
  - The Republic of Formosa was proclaimed by Qing officials and local gentry and claimed loyalty to the Qing emperor; many of its soldiers were Qing troops from the mainland, who often fled or surrendered, while local Hakka and other militias did much of the hardest fighting.
  - Japanese counts of the dead found on the battlefields came to about 7,000; the total of Chinese and Taiwanese dead, including militiamen and civilians killed in reprisals, is not known exactly, and some Taiwanese estimates are far higher than the figure of about 14,000.
