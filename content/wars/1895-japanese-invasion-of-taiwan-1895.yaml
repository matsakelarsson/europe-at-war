  - title: Tainan
    date: October – November 1895
    when: "1895-10-21"
    borders: "1895-11-18"
    countries: [tw]
    body:
      - With reinforcements from Japan, the advance on Tainan began in October from three directions. The Imperial Guards marched south from Changhua and stormed Chiayi on 9 October; Prince Fushimi’s brigade landed at Budai on the coast, and Nogi Maresuke’s division of 6,330 men landed at Fangliao in the far south on 10 October, fought the bloodiest action of the campaign for the Japanese at Jiadong and moved on Takow (Kaohsiung), which the navy had already taken. At Xiaolong on 19 October nearly a thousand militiamen trapped in the village were killed.
      - Liu Yongfu, the former commander of the Black Flag Army, had led the republic from Tainan since June. His offers of a conditional surrender were refused, and on the night of 19–20 October he escaped from Anping aboard a British steamer bound for Xiamen. Tainan surrendered on 21 October and the republic ended. Prince Kitashirakawa died of malaria in Tainan a week later. On 18 November the Japanese governor-general declared the island subdued, but armed resistance continued in many places into the early 1900s.
    facts:
      - [Battle of Chiayi, "9 October 1895"]
      - [Nogi lands at Fangliao, "10 October 1895"]
      - [Tainan surrenders, "21 October 1895"]
