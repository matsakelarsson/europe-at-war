id: korean-righteous-armies
name: Korean righteous armies (1895–1915)
start: "1895-10-08"
end: "1915-07-05"
tier: B
summary: "Armed resistance to Japanese control of Korea by volunteer “righteous armies” (uibyeong), named after the militias that had fought the Japanese invasions of the 1590s. The first wave rose in 1896 after Japanese agents murdered Queen Min in the palace in Seoul in October 1895 and the government ordered men to cut their topknots; it faded after King Gojong took refuge in the Russian legation. A second wave followed the protectorate treaty of 1905, and the largest after Japan forced Gojong to abdicate and disbanded the Korean army in 1907: thousands of former soldiers joined the scholars, peasants, hunters and miners in the hills. A combined army of thirteen provinces tried to march on Seoul in January 1908 and was driven back, and a Japanese sweep through Jeolla in 1909 broke the strongest remaining bands. After the annexation of 1910 the survivors went to Manchuria and the Russian Far East, and the last leader in Korea, Chae Eung-eon, was captured in 1915. Japanese figures count some 17,800 Korean fighters killed between 1906 and 1911."
countries: [kr, kp, jp]
sides:
  - id: ra
    name: Righteous armies
    polities: [righteous-armies]
    ink: green
    moves: Righteous army moves
    success: Righteous army success
  - id: jp
    name: Empire of Japan (army, gendarmerie and police in Korea)
    polities: [japan]
    ink: red
    moves: Japanese moves
    success: Japanese success
notes:
  - The righteous armies were many separate bands, not one army. Their leaders were at first Confucian scholars loyal to the king; from 1906–1907 commoners and disbanded soldiers led more and more of them. Korean government troops fought them in 1896, and Korean auxiliaries served with the Japanese forces after 1907.
  - Korea adopted the Gregorian calendar on 1 January 1896; earlier dates are the Gregorian equivalents the sources give.
  - The figures for the fighting come mostly from Japanese military and police records, which counted the dead and captured but not the villagers killed or the houses burned in reprisals. Korean historians regard the true losses as higher.
