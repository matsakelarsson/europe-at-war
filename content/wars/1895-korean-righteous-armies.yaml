steps:
  - title: The queen’s murder and the Eulmi armies
    date: October 1895 – 1896
    when: "1895-10-08"
    borders: "1896-02-11"
    countries: [kr, jp]
    body:
      - After the war with China, Queen Min and her circle turned to Russia to balance Japanese power at court. Before dawn on 8 October 1895 Japanese soldiers, legation police and civilian adventurers (sōshi), acting on a plan approved by the Japanese minister Miura Gorō and joined by Korean troops of the Japanese-trained Hullyeondae, broke into Gyeongbokgung, killed the queen in her quarters and burned her body. Miura and dozens of others were recalled and tried in Hiroshima, but were all released for lack of evidence. On 30 December the new pro-Japanese cabinet ordered men to cut off their topknots, a sign of adult status and Confucian propriety.
      - From January 1896 Confucian scholars raised righteous armies in Gangwon, Chungcheong, Gyeongsang and elsewhere, attacking Japanese troops, telegraph lines and officials of the new order. Yu In-seok’s army, gathered at Jecheon, took Chungju in February and killed its governor. On 11 February King Gojong escaped from the palace to the Russian legation; the prime minister Kim Hong-jip was killed by a crowd, and the king revoked the topknot order and called on the armies to disband. Most did so by the summer. Government troops defeated Yu In-seok at Jecheon in May, and he led his remaining men into Manchuria.
    facts:
      - [Murder of Queen Min (Eulmi incident), "8 October 1895"]
      - [Topknot ordinance, "30 December 1895"]
      - [Gojong in the Russian legation, "11 February 1896 – February 1897"]
