  - title: Protectorate and the disbanded army
    date: 1905 – August 1907
    when: "1905-11-17"
    borders: "1907-08-01"
    countries: [kr, jp]
    body:
      - After its victory over Russia, Japan made Korea a protectorate by the Eulsa treaty of 17 November 1905, which five ministers signed under Japanese military pressure while Emperor Gojong refused to put his seal to it. Righteous armies rose again. The former official Min Jong-sik took the walled town of Hongju (Hongseong) in May 1906 and held it until Japanese troops stormed it at the end of the month. The 73-year-old scholar Choe Ik-hyeon raised an army at Taein in Jeolla in June, but when Korean government troops came against him at Sunchang he dismissed his men rather than fight fellow Koreans; he died in Japanese custody on Tsushima on 1 January 1907. In the mountains of the east coast Sin Dol-seok, a commoner, led a band that grew to some thousands.
      - In July 1907, after Gojong had sent secret envoys to the peace conference at The Hague to protest against the protectorate, the Japanese forced him to abdicate in favour of his son Sunjong, and a new treaty on 24 July put the Korean government under the Japanese resident-general. On 1 August the Korean army was disbanded. In Seoul Major Park Seung-hwan of the guards killed himself, and his soldiers fought the Japanese around the Namdaemun gate; the garrisons of Wonju and Ganghwa rose in the following days. Thousands of former soldiers, with their rifles and training, joined the righteous armies, and the fighting spread to every province.
    facts:
      - [Eulsa protectorate treaty, "17 November 1905"]
      - [Hongju held by Min Jong-sik, "May 1906"]
      - [Gojong forced to abdicate, "20 July 1907"]
      - [Korean army disbanded, "1 August 1907"]
