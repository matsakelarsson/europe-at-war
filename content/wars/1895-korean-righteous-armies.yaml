  - title: The march on Seoul, the 1909 sweep and the end
    date: 1907–1915
    when: "1908-01"
    borders: "1909-10-01"
    countries: [kr, kp, jp]
    body:
      - At the end of 1907 righteous army leaders gathered at Yangju, north-east of Seoul, as the Army of the Thirteen Provinces under Yi In-yeong, with Heo Wi as military commander, and asked the foreign legations to recognise them as belligerents. In January 1908 Heo Wi’s vanguard of some 300 men reached a point about 30 ri (12 km) outside the East Gate of Seoul, but Japanese troops attacked it before the main body arrived, and it fell back. Yi In-yeong had gone home on hearing of his father’s death. The bands dispersed to fight on alone; Heo Wi was captured and hanged in 1908. In the north, Hong Beom-do’s army of hunters fought the Japanese in the mountains around Gapsan and Samsu.
      - The fighting reached its height in 1908, above all in Jeolla, where bands led by men such as Jeon Hae-san, Sim Nam-il and An Gyu-hong attacked Japanese police posts, tax collectors and landowners. From September to October 1909 the Japanese army ran what it called the “great punitive operation in southern Korea”, sealing off the Jeolla coast with warships and combing the province district by district. A Jeolla police report counted 420 fighters killed and 1,687 captured or surrendered between late August and late October; most of the leaders, Sim Nam-il and An Gyu-hong among them, were taken and executed, and villages accused of sheltering fighters were burned.
      - Japan annexed Korea in August 1910. Most of the surviving fighters moved to Manchuria and the Russian Far East, where they formed the core of the later independence armies. In Korea, Chae Eung-eon kept a band together in the mountains of the north until he was captured on 5 July 1915 at Seongcheon in South Pyongan; he was hanged in Pyongyang in November. Japanese records count about 17,800 righteous army fighters killed between 1906 and 1911, against far smaller Japanese losses.
    facts:
      - [March on Seoul, "January 1908"]
      - [“Great punitive operation in southern Korea”, "September – October 1909"]
      - [Annexation of Korea, "29 August 1910"]
      - [Chae Eung-eon captured, "5 July 1915"]
      - [Korean fighters killed 1906–1911 (Japanese figures), "17,779"]
