id: nandi-resistance
name: Nandi resistance
start: "1895-07-16"
end: "1906"
tier: C
summary: "The Nandi of the highlands west of the Rift Valley in Kenya resisted British occupation for more than ten years. In July 1895 Nandi warriors destroyed the camp of the trader Peter West after quarrels with traders’ caravans, and British expeditions of several hundred African soldiers with Maxim guns in 1895 and 1897 burned villages and seized cattle without subduing them. When the Uganda Railway was built across their land towards Lake Victoria from 1899, the Nandi took its iron and telegraph wire, and attacked posts and travellers; a column sent in 1900 killed dozens of Nandi and seized their cattle, but the raids went on. Their leader was the orkoiyot (spiritual leader) Koitalel Arap Samoei. On 19 October 1905 the British officer Richard Meinertzhagen shot him dead at a meeting at Ket Parak, in the Nandi Hills, that had been called to negotiate a truce; Meinertzhagen claimed self-defence, but Nandi accounts and later historians describe a planned killing. A large expedition that followed, in the British term a punitive one, broke the resistance, and in 1906 the Nandi were confined to a reserve while much of their land was given to European settlers."
