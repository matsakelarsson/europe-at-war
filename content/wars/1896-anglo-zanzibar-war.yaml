summary: "A British naval bombardment of the sultan’s palace in Zanzibar town on 27 August 1896, often called the shortest war in history. Zanzibar had been a British protectorate since 1890, and Britain claimed the right to approve each new sultan. When Sultan Hamad bin Thuwaini died suddenly on 25 August 1896, his cousin Khalid bin Barghash occupied the palace and proclaimed himself sultan with about 2,800 armed supporters, palace guards and a few guns. The British ordered him to stand down by 9 a.m. on 27 August. At 9.02 five Royal Navy ships under Rear Admiral Harry Rawson opened fire; about 38 minutes later the palace was in flames, the sultan’s only warship, the Glasgow, had been sunk and the flag shot down. About 500 of Khalid’s supporters were killed or wounded; one British sailor was wounded. Khalid escaped to the German consulate, and Britain installed Hamud bin Muhammad, who abolished slavery in Zanzibar the following year."
