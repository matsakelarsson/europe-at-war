    body:
      - "The sultans of Zanzibar, a branch of the Omani dynasty, had ruled the islands and the coast opposite since the early nineteenth century, growing rich on cloves, ivory and the slave trade. Britain and Germany divided the mainland between them, and by the Anglo-German agreement of 1890 Zanzibar became a British protectorate; the British consul’s approval was required for a new sultan. Sultan Hamad bin Thuwaini, chosen with British support in 1893, died suddenly at 11.40 a.m. on 25 August 1896. Within hours his cousin Khalid bin Barghash, a son of the former sultan Barghash, moved into the palace and proclaimed himself sultan."
      - "Khalid gathered about 2,800 men, among them some 700 askari of the sultan’s army who sided with him, the rest mostly armed townsmen, servants and slaves, with a few machine guns, two field guns and an old bronze cannon, and the sultan’s yacht Glasgow lay in the harbour. The British consul Basil Cave and General Lloyd Mathews, the British commander of the sultan’s army, refused to recognise him and ranged about 900 loyal Zanzibari askari and 150 British sailors and marines against the palace. By 26 August five warships under Rear Admiral Harry Rawson were in the harbour, and Rawson gave Khalid until 9 a.m. on 27 August to haul down his flag and leave."
      - "At 9.02 Racoon, Thrush and Sparrow opened fire on the palace and its harbour battery, supported by the cruisers St George and Philomel. The Glasgow fired back and was sunk, and the wooden palace caught fire and collapsed. By 9.40 the guns ashore were silent and the flag had come down, and the firing stopped. About 500 of Khalid’s men and others in and around the palace were killed or wounded; one British petty officer was badly wounded and recovered. Khalid and some forty followers took refuge in the German consulate and were smuggled to German East Africa in October; the British captured him there in 1916. Britain installed Hamud bin Muhammad as sultan the same afternoon, made Khalid’s supporters pay for the shells and damage, and ruled Zanzibar through its sultans until 1963. In April 1897 Hamud abolished the legal status of slavery."
