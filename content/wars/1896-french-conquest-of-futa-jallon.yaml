id: french-conquest-of-futa-jallon
name: French conquest of Futa Jallon
start: "1896-03"
end: "1896-11-13"
tier: C
summary: "The French campaign that ended the independence of the Imamate of Futa Jallon, the Fulbe Muslim state of the Guinea highlands founded in the jihad of the 1720s. Futa Jallon was a federation of provinces under an almami at Timbo, chosen in turn from two rival houses, the Alfaya and the Soriya; it took subsidies from the British in Sierra Leone as well as dealing with the French, and helped Samori Touré in his wars with France. The Anglo-French agreement of 1889 put it in the French sphere. Bokar Biro of the Soriya seized power in 1890 by killing his brother and fought the provincial chiefs, among them Alfa Yaya of Labé, who wanted more autonomy; some of them asked the French for help. In March 1896 the French envoy Raoul de Beeckman came to Timbo with troops and demanded the right to build roads, to keep a resident and to approve the provincial chiefs. Bokar Biro appeared to sign, but where his signature should have been he had written “Bismillah”, “in the name of God”. When his term ended in April 1896 he refused to hand over office, and Futa Jallon drifted towards civil war. At the end of the rains French columns from Senegal, French Guinea and the French Sudan converged on the country and took Timbo on 3 November. Few chiefs joined Bokar Biro, and on 13 November 1896 his army was destroyed by tirailleurs and artillery, fighting alongside the Fulbe of his rival Umaru Bademba, on the plain of Porédaka. Bokar Biro escaped from the field but was caught and killed by men of a rival chief. France made Umaru Bademba almami of a reduced state, recognised Alfa Yaya’s Labé as separate, and a few months later imposed a protectorate treaty; in 1904 it removed the chiefs’ remaining powers, and in 1905 it arrested Alfa Yaya and sent him into exile."
