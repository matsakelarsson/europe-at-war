id: french-conquest-of-the-mossi-kingdoms
name: French conquest of the Mossi kingdoms
start: "1896"
end: "1897"
tier: C
summary: "The French conquest of Ouagadougou, the leading Mossi kingdom on the upper Volta, in today’s Burkina Faso. The Mossi kingdoms (Ouagadougou, Yatenga, Tenkodogo, Fada N’Gourma and Boussouma among them) had kept their independence for centuries with their cavalry, but by the 1890s they were divided, Yatenga by civil war, and France, Britain and Germany were racing to sign treaties with them. The Mogho Naba Wobgo (Boukary Koutou), king of Ouagadougou since 1890, turned away the French officer Parfait-Louis Monteil in 1891 and signed a treaty of friendship with George Ekem Ferguson, a Fante agent of the British Gold Coast, in 1894; Yatenga accepted a French protectorate in 1895–1896. In 1896 a French column of tirailleurs under Captain Paul Voulet and Lieutenant Julien Chanoine marched from the Niger bend; Wobgo’s horsemen could not stop it, and Voulet entered Ouagadougou in September 1896 and burned the town. In January 1897 Voulet installed Wobgo’s brother Kouka as Mogho Naba under the name Sighiri, who signed a protectorate treaty. Wobgo appealed to the British in vain and, after further fighting, withdrew to Zongoiri, just across the border in the British Gold Coast, where he died in 1904. Voulet and Chanoine went on to campaign in the Gurunsi country in 1897, and in 1899 led the mission to Lake Chad whose killings made them notorious. France ruled the Mossi through their own kings, made Ouagadougou the capital of the colony of Upper Volta in 1919, and drew heavily on Mossi labour and soldiers."
