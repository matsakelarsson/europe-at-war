  - title: Manila Bay and Aguinaldo’s return
    date: April – June 1898
    when: "1898-05-01"
    borders: "1898-06-12"
    countries: [ph, us]
    body:
      - In April 1898 the United States went to war with Spain over Cuba. In Singapore and Hong Kong, Aguinaldo met American consuls and officers who, by his account, promised that the United States would recognise Philippine independence; they denied having promised anything. On 1 May Commodore George Dewey’s squadron destroyed the Spanish fleet of Admiral Patricio Montojo off Cavite, in the battle of Manila Bay. Dewey had no troops to take Manila, and on 19 May an American ship, the McCulloch, brought Aguinaldo back to Cavite.
      - Aguinaldo proclaimed a dictatorial government on 24 May and armed his followers with captured Spanish weapons and guns bought abroad. On 28 May they won their first battle under the new flag at Alapan, near Imus. Filipino troops in the Spanish army changed sides, and in June the Spanish garrisons of Cavite, Batangas, Laguna, Bulacan, Pampanga and the provinces of central Luzon surrendered one after another; thousands of Spanish soldiers, officials and friars were taken prisoner.
      - On 12 June 1898, from the window of his house in Kawit, Aguinaldo proclaimed the independence of the Philippines. Ambrosio Rianzares Bautista read the act of independence, the flag sewn in Hong Kong by Marcela Agoncillo and her helpers was raised and the march composed by Julián Felipe was played. The act placed the new nation under the protection of the United States, which did not recognise it. On 23 June, on the advice of Apolinario Mabini, the dictatorial government was replaced by a Revolutionary Government.
    facts:
      - [Battle of Manila Bay, "1 May 1898, American victory"]
      - [Aguinaldo returns, "19 May 1898"]
      - [Battle of Alapan, "28 May 1898"]
      - [Declaration of independence, "12 June 1898, Kawit"]
