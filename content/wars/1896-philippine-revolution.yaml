  - title: Malolos and the Visayas
    date: September 1898 – January 1899
    when: "1898-09-15"
    borders: "1899-01-23"
    countries: [ph, us, es]
    body:
      - Aguinaldo moved his government to Malolos in Bulacan, where the Revolutionary Congress met in the church of Barasoain on 15 September 1898. It ratified the declaration of independence and wrote a constitution, promulgated on 21 January 1899. On 23 January 1899 the First Philippine Republic was inaugurated at Malolos with Aguinaldo as president, the first republic in Asia. Its government held most of Luzon outside Manila and sent officials to the other islands.
      - The revolution spread south. On Negros the sugar planters Aniceto Lacson and Juan Araneta rose on 5 November 1898, and the Spanish governor surrendered at Bacolod the next day. On Panay revolutionary forces under Martín Delgado closed in on Iloilo, and in late December 1898 the Spanish governor-general, Diego de los Ríos, who had moved his government there, left for Zamboanga; Cebu too was given up. Local leaders who recognised the Malolos government took over Cebu and Bohol, and on 31 December Vicente Lukbán reached Catbalogan to take charge of Samar and Leyte for it. In the south the Spanish kept only Zamboanga, Jolo and a few posts in Mindanao.
      - In Paris, Spain and the United States had signed a peace treaty on 10 December 1898, by which Spain ceded the Philippines to the United States for 20 million dollars; the Filipino envoy Felipe Agoncillo was not heard. On 21 December President McKinley proclaimed American sovereignty over the islands as a policy of “benevolent assimilation”. American troops held Manila and Cavite and were sent to Iloilo, and Filipino and American soldiers faced each other along the lines around Manila. War broke out on 4 February 1899.
    facts:
      - [Malolos Congress opens, "15 September 1898"]
      - [Negros rising, "5 November 1898"]
      - [Treaty of Paris, "10 December 1898"]
      - [First Philippine Republic inaugurated, "23 January 1899, Malolos"]
