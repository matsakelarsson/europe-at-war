notes:
  - "The Katipunan’s full name was Kataastaasan, Kagalanggalangang Katipunan ng mga Anak ng Bayan, the Highest and Most Venerable Society of the Children of the Nation. Its members called themselves Katipuneros. The revolutionary governments that followed it were the Magdalo and Magdiwang councils of Cavite (1896), the government elected at Tejeros (1897), the Republic of Biak-na-Bato (1897), and Aguinaldo’s Dictatorial (May 1898) and Revolutionary (June 1898) governments, which became the First Philippine Republic in January 1899."
  - The date and place of the Cry that began the revolution are disputed. Witnesses gave dates from 23 to 26 August 1896 and places from Pugad Lawin to Balintawak, Kangkong and Bahay Toro, all then in Caloocan; it was marked on 26 August at Balintawak until 1963, when the government made it 23 August at Pugad Lawin, now in Quezon City.
  - Estimates of the Katipunan’s membership in 1896 range from about 30,000 to 400,000, and the numbers of dead in the fighting of 1896–1897 are uncertain. Most of the soldiers on the Spanish side were Filipinos.
  - The base map shows Spanish rule over the islands until the Treaty of Paris came into force in April 1899; the land held by the revolutionaries is drawn in the steps. The war that followed is told in the Philippine–American War, and the American war with Spain in the Spanish–American War.
