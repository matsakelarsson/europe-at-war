  - title: Cavite holds
    date: September – December 1896
    when: "1896-11-09"
    borders: "1896-11-11"
    countries: [ph]
    body:
      - In Cavite the Katipunan councils took over most towns in the first days of September 1896. They were divided into two rival groups, the Magdalo council of Kawit, led by Baldomero Aguinaldo and his cousin Emilio Aguinaldo, the town’s young mayor, and the Magdiwang council of Noveleta and San Francisco de Malabon, led by Mariano Álvarez, a relative of Bonifacio’s wife, and his son Santiago Álvarez. The revolutionaries dug trenches across the narrow coastal plain and made gunpowder and cartridges in the towns.
      - In November Blanco sent his reinforcements against Cavite. On 9–11 November 1896 a column under Colonel José Marina attacked the Magdalo lines at Binakayan, and General Diego de los Ríos attacked the Magdiwang at Dalahican. Both were beaten back with heavy losses; the Magdalo general Candido Tirona was killed. It was the revolution’s first great victory, and it made Emilio Aguinaldo its best-known commander.
      - Cavite remained the heart of the revolution through the winter. In December Bonifacio came to Cavite at the invitation of the Magdiwang to settle the quarrels between the two councils, but he was drawn into them instead. In Manila Blanco, criticised by the friars and the Spanish community as too soft, was replaced on 13 December by General Camilo de Polavieja.
    facts:
      - [Battle of Binakayan–Dalahican, "9–11 November 1896, revolutionary victory"]
      - [Polavieja takes over, "13 December 1896"]
