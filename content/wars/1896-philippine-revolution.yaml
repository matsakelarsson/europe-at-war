  - title: Tejeros and the death of Bonifacio
    date: March – June 1897
    when: "1897-03-22"
    borders: "1897-05-10"
    countries: [ph]
    body:
      - On 22 March 1897, as the Spanish closed in, the revolutionaries met at the friar estate house of Tejeros to set up a single government in place of the Katipunan. Aguinaldo, who was away at the front, was elected president, Mariano Trías vice-president and Bonifacio, the Supremo of the Katipunan, only director of the interior; when Daniel Tirona of the Magdalo questioned whether Bonifacio was qualified even for that post, Bonifacio declared the proceedings void. He and his followers drew up their own military agreement at Naic in April.
      - Aguinaldo ordered his arrest. At Limbon, near Indang, on 28 April Aguinaldo’s men attacked Bonifacio’s camp; his brother Ciriaco was killed and he was wounded and taken prisoner. A council of war of Magdalo officers at Maragondon found Bonifacio and his brother Procopio guilty of sedition and treason and sentenced them to death. Aguinaldo first commuted the sentence to exile, then, urged by his generals Mariano Noriel and Pío del Pilar, withdrew the commutation. On 10 May 1897 the two brothers were shot in the hills of Maragondon. Whether the trial was just, and who bears the blame, has been argued over ever since.
      - The Spanish retook the last towns of Cavite in May. Aguinaldo and his government retreated through Batangas, Laguna and Morong to the mountains of Bulacan, and in June set up their camp at Biak-na-Bato. Polavieja, ill, had resigned in April and was succeeded by Fernando Primo de Rivera.
    facts:
      - [Tejeros Convention, "22 March 1897"]
      - [Bonifacio captured, "28 April 1897, Limbon (Indang)"]
      - [Bonifacio executed, "10 May 1897, Maragondon"]
