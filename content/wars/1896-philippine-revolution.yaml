        lonlat: [121.030, 14.664]
  - title: The rising around Manila
    date: August – September 1896
    when: "1896-08-30"
    borders: "1896-08-30"
    countries: [ph]
    body:
      - The Katipunan planned to rise on the night of 29 August 1896 and take Manila. On that night and the morning of 30 August Bonifacio, with Emilio Jacinto at his side, led some 800 to 1,000 men, most armed with bolos, against the Spanish powder magazine of El Polvorín and the reservoir at San Juan del Monte, east of the city. Reinforcements of Spanish infantry drove them off; about 150 Katipuneros were killed and 200 captured, and 57 prisoners were shot the next day. Risings broke out the same days in Santa Mesa, Pandacan and towns around Manila such as Pasig and San Mateo, and in Noveleta and San Francisco de Malabon in Cavite.
      - Governor-General Ramón Blanco declared a state of war on 30 August in eight provinces, Manila, Bulacan, Cavite, Pampanga, Tarlac, Laguna, Batangas and Nueva Ecija, which are remembered in the eight rays of the sun on the Philippine flag. Thousands were arrested in Manila and the provinces, many were deported to the Carolines, the Marianas and Fernando Póo in Africa, and suspects were executed; at Cavite thirteen men, the Thirteen Martyrs, were shot on 12 September 1896.
      - Around Manila the Spanish soon had the upper hand, and Bonifacio’s men withdrew to the hills of Morong and San Mateo, from where they kept up raids. Blanco had few Spanish troops, most of his soldiers were Filipinos, and reinforcements from Spain did not arrive until October. In Cavite, south of Manila, the rising went the other way.
    facts:
      - [Battle of San Juan del Monte, "30 August 1896, Spanish victory"]
      - [State of war in eight provinces, "30 August 1896"]
      - [Thirteen Martyrs of Cavite shot, "12 September 1896"]
