steps:
  - title: The Katipunan
    date: 1892 – August 1896
    when: "1892-07-07"
    borders: "1896-08-23"
    countries: [ph]
    body:
      - In the 1880s Filipino reformists in Spain, the Propaganda Movement of José Rizal, Marcelo H. del Pilar and Graciano López Jaena, asked for Filipino seats in the Spanish Cortes, equality before the law and the transfer of parishes from the Spanish friars to Filipino priests. Rizal’s novels Noli me tángere (1887) and El filibusterismo (1891) attacked the friars and the colonial government. In July 1892 Rizal founded the reformist La Liga Filipina in Manila; days later he was arrested and deported to Dapitan in Mindanao.
      - On 7 July 1892, in Tondo, Andrés Bonifacio, a self-taught warehouse clerk, founded with Deodato Arellano, Ladislao Diwa, Teodoro Plata, Valentín Díaz and José Dizon a secret society that aimed at independence by armed revolt, the Katipunan. Its members took an oath signed in their own blood and were organised in local councils; it grew fast from 1895 among the working people of Manila and the farmers and townspeople of the Tagalog provinces, and its newspaper Kalayaan (Freedom) spread its ideas. In June 1896 Pío Valenzuela visited Rizal in Dapitan to seek his support; Rizal refused to back a revolt for which the country was not yet armed.
      - On 19 August 1896 the society was betrayed. A member, Teodoro Patiño, told his sister, and the Augustinian parish priest of Tondo, Mariano Gil, learned of it and had the printing shop where Patiño worked searched; arrests followed. Bonifacio and several hundred Katipuneros gathered in the hills north of Manila. There, on 23 August by the official date, they tore up their cédulas, the tax certificates every Filipino had to carry, as a sign that they rejected Spanish rule, and decided to rise; this is remembered as the Cry of Pugad Lawin.
    facts:
      - [Katipunan founded, "7 July 1892, Tondo"]
      - [Katipunan discovered, "19 August 1896"]
      - [Cry of Pugad Lawin, "23 August 1896 (official date)"]
