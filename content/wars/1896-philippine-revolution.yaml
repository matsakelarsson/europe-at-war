  - title: The siege of Manila and the mock battle
    date: June – August 1898
    when: "1898-07"
    borders: "1898-08-13"
    countries: [ph, us, es]
    body:
      - From June the revolutionary army surrounded Manila, held its suburbs and dug trenches facing the Spanish lines; the Spanish governor-general, Basilio Augustín, and from late July his successor Fermín Jáudenes, were shut in the city with their troops and thousands of refugees. American troops arrived by sea from the end of June, and by August General Wesley Merritt had about 10,700 men camped south of the city, in trenches some of which the Filipinos had handed over at the Americans’ request.
      - The Spanish commanders preferred to surrender to the Americans rather than to the Filipinos. Through the Belgian consul, Édouard André, Jáudenes and the Americans arranged a battle for honour’s sake. On 13 August 1898 American troops attacked, the Spanish gave way after a short fight, and the city surrendered; American troops kept the Filipino forces out of the city, and there were clashes between them. Neither side in Manila knew that a protocol ending the war had been signed in Washington the day before.
      - Elsewhere Spanish garrisons held on. At Baler, on the east coast of Luzon, about 50 Spanish soldiers besieged by the revolutionaries in the town church from 1 July 1898 held out until 2 June 1899, refusing to believe that the war was over. Spain still held Iloilo, Cebu and Zamboanga.
    facts:
