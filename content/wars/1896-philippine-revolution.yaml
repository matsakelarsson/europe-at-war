  - title: Biak-na-Bato
    date: June – December 1897
    when: "1897-11-01"
    borders: "1897-12-15"
    countries: [ph]
    body:
      - Biak-na-Bato, a rugged area of caves and forest in San Miguel, Bulacan, became the revolution’s refuge. Fighting went on in Bulacan, Nueva Ecija and the other provinces of central Luzon, where Spanish columns could not catch the revolutionary bands. On 1 November 1897 the leaders adopted a constitution for the Republic of Biak-na-Bato, modelled on the Cuban constitution of Jimaguayú, with Aguinaldo as president.
      - Neither side could win. The lawyer Pedro Paterno went back and forth between the camp and Governor-General Primo de Rivera, and on 14 December 1897 the Pact of Biak-na-Bato was signed. The revolutionaries agreed to lay down their arms and their leaders to go into exile; Spain was to pay 800,000 pesos in three instalments and grant an amnesty, and the Filipinos understood that reforms would follow.
      - On 27 December Aguinaldo and about 25 leaders sailed from Sual, in Pangasinan, for Hong Kong, where they deposited the first instalment of 400,000 pesos in a bank. A second payment of 200,000 went to those who had stayed; the third was never paid, no general amnesty was declared, and no reforms were made. In early 1898 fighting broke out again in central Luzon, where Francisco Makabulos set up a Central Executive Committee, and on 3 April 1898 a rising in Cebu led by Pantaleón Villegas, called León Kilat, was put down.
    facts:
      - [Constitution of Biak-na-Bato, "1 November 1897"]
      - [Pact of Biak-na-Bato, "14 December 1897"]
      - [Aguinaldo leaves for Hong Kong, "27 December 1897"]
      - [Payment agreed, "800,000 pesos; 600,000 paid"]
