  - title: Rizal’s execution and Polavieja’s offensive
    date: December 1896 – April 1897
    when: "1896-12-30"
    borders: "1897-02-20"
    countries: [ph, es]
    body:
      - José Rizal had been allowed to leave Dapitan in 1896 to serve as an army doctor in Cuba. He was arrested on board ship on the way to Spain, brought back to Manila, and tried by a court-martial for rebellion, sedition and illegal association, though he had condemned the rising. On the morning of 30 December 1896 he was shot at Bagumbayan, outside the walls of Manila, where the Rizal monument now stands. He left a poem of farewell, later called Mi último adiós. His death turned many Filipinos who had hoped for reform against Spain.
      - Polavieja, with fresh battalions from Spain, launched an offensive on Cavite in February 1897. General José de Lachambre’s division came in from Laguna to the east, while other troops attacked from Manila along the coast. On 17 February Aguinaldo’s men held the Zapote bridge on the road from Manila, and the revolutionary general Edilberto Evangelista was killed. But Lachambre took Silang on 19 February, and in March and April the Spanish retook Imus, San Francisco de Malabon and the other towns of the province one by one, with heavy losses on both sides.
    facts:
