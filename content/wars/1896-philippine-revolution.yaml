id: philippine-revolution
name: Philippine Revolution
start: "1896-08-23"
end: "1899-01-23"
tier: A
summary: "The armed revolt against Spanish rule that made the Philippines the first republic in Asia. The Katipunan, a secret society founded in Manila in 1892 by Andrés Bonifacio and others, rose in August 1896 after it was discovered. Around Manila the rising was soon contained, but in Cavite the revolutionaries held most of the province and defeated the Spanish at Binakayan in November. Spain executed the reformist writer José Rizal in December 1896 and sent reinforcements; its offensive of 1897 retook Cavite, and the rivalry between Bonifacio and Emilio Aguinaldo ended with Bonifacio’s execution in May. Aguinaldo held out at Biak-na-Bato until the pact of December 1897 sent him into exile in Hong Kong. When the United States went to war with Spain in 1898, he returned with American help after the battle of Manila Bay, his forces took most of Luzon, and on 12 June 1898 he proclaimed independence at Kawit. The Americans took Manila from the Spanish in August without letting the Filipinos in, the revolution spread to the Visayas, and in January 1899 the First Philippine Republic was inaugurated at Malolos, a month after Spain had ceded the islands to the United States in the Treaty of Paris."
countries: [ph, es, us]
