notes:
  - "The settlers and the company called the war the Matabele and Mashona Rebellions. That was their word: neither people had accepted company rule, and in Mashonaland many chiefs had never been conquered at all. In Zimbabwe the war is the First Chimurenga, the forerunner of the Second Chimurenga of the 1960s and 1970s."
  - "How far the risings were planned together is disputed. Terence Ranger (1967) argued that the Mwari priests and the spirit mediums organised a common rising; Julian Cobbing (1977) and later historians saw more separate, local wars. Many Ndebele and Shona leaders stayed neutral or fought for the company."
