id: second-matabele-war
name: Second Matabele War (First Chimurenga)
start: "1896-03-20"
end: "1897-10"
tier: B
summary: "The armed rising of the Ndebele and of many Shona chiefdoms against the British South Africa Company’s rule in what is now Zimbabwe, called in Zimbabwe the First Chimurenga (“war of liberation”). Three years after the conquest of the Ndebele kingdom, people had lost much of their land and almost all their cattle, were forced to work for settlers and beaten by the company’s African police, and were then struck by drought, locusts and the cattle plague rinderpest. When most of the company’s armed police were captured in the Jameson Raid on the Transvaal, the Ndebele rose in March 1896, killing settlers across Matabeleland and besieging Bulawayo; in June the Shona of Mashonaland, whom the settlers had thought friendly, rose too. Priests of the Mwari shrines such as Mkwati and spirit mediums such as Nehanda and Kaguvi helped to bind the risings together. Imperial troops relieved Bulawayo; Cecil Rhodes ended the Ndebele war by negotiating with the izinDuna in the Matobo Hills in August–October 1896, while in Mashonaland the company dynamited the caves of the chiefs one by one until late 1897. About one in ten of the settlers in the country was killed; African deaths, in battle, in executions and from the hunger that followed, were far higher and were never counted."
countries: [zw, gb]
