  - title: The indabas and the end of the war
    date: August 1896 – April 1898
    when: "1896-08-21"
    borders: "1896-10-13"
    countries: [zw]
    body:
      - "The British could not drive the Ndebele out of the Matobo Hills without heavy losses, and the war was costing the company dearly. Cecil Rhodes went unarmed into the hills with a few companions and from late August 1896 held a series of indabas (meetings) with the izinDuna. They spoke of the land, the cattle, the police and the treatment of their people. Rhodes promised that the hated African police would go, that the izinDuna would be paid as salaried headmen, and that land would be found for the Ndebele, though most of the land stayed with settlers. By October the Ndebele leaders had laid down their arms."
      - "In Mashonaland there were no talks. Kaguvi and Nehanda were tried for murder, Nehanda for ordering the killing of the native commissioner Henry Pollard, and both were hanged in Salisbury on 27 April 1898. Nehanda’s reported last words, that her bones would rise again, became a rallying cry for the nationalists of the 1960s and 1970s. Mkwati was never captured. The company ruled Southern Rhodesia until 1923, when it became a self-governing British colony."
    facts:
      - [First indaba in the Matobo Hills, "21 August 1896"]
      - [Nehanda and Kaguvi hanged, "27 April 1898"]
      - [Settlers killed in the war, "about one in ten"]
    markers:
      - kind: treaty
        name: Matobo Hills
        date: August – October 1896
        text: Rhodes met the Ndebele izinDuna here in a series of indabas that ended the Ndebele war.
        lonlat: [28.508, -20.550]
      - kind: event
        side: bsac
        name: Salisbury (Harare)
        date: 27 April 1898
        text: Nehanda and Kaguvi were hanged here.
        lonlat: [31.052, -17.829]
