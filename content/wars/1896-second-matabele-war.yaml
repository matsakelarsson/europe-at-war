  - title: The Shona rising
    date: June 1896 – October 1897
    when: "1896-06-20"
    borders: "1896-06-20"
    countries: [zw]
    body:
      - "In mid-June 1896 the Shona of central Mashonaland rose in their turn, to the surprise of settlers who had seen them as glad to be freed from Ndebele raids. Chief Mashayamombe in Mhondoro and the chiefs around Hartley, Mazowe, Goromonzi and Mrewa killed settlers and African workers, and the survivors in Mashonaland gathered in the laager at Salisbury and smaller posts. At the Alice Mine in the Mazowe valley a group of settlers held out until a patrol from Salisbury fought its way through to bring them out; two telegraphists who had gone to send for help were killed. The medium of the spirit Kaguvi, Gumboreshumba, at Chikwaka’s near Goromonzi, and the medium of Nehanda, Charwe Nyakasikana, in the Mazowe valley, called on people to drive the settlers out; Mkwati moved east to join Kaguvi."
      - "Unlike the Ndebele, the Shona chiefdoms had no central command. Each held out in fortified villages and the caves of its granite hills, and the company and British troops took them one at a time with artillery and dynamite. Chief Makoni held out in caves that the company’s troops blew up with dynamite; he was captured and shot after a court martial. Fighting continued into 1897. Mashayamombe was killed when his stronghold fell in July 1897, Kaguvi surrendered in October and Nehanda was captured in December."
    facts:
      - [Shona rising begins, "mid-June 1896"]
      - [Mashayamombe’s stronghold taken, "July 1897"]
      - [Kaguvi surrenders, "October 1897"]
