steps:
  - title: The Ndebele rising
    date: March – July 1896
    when: "1896-04-15"
    borders: "1896-04-15"
    countries: [zw]
    body:
      - "After 1893 the company took the Ndebele cattle, handed out the best land around Bulawayo as farms and mining claims, and made men work for settlers, recruited by African police who were hated for their violence. A hut tax was introduced in 1894. In early 1896 rinderpest swept down from the north, killing most of the remaining cattle, and the company shot herds to stop it spreading. The company’s administrator, Leander Starr Jameson, had taken most of its mounted police into the Transvaal in the Jameson Raid of December 1895, where they were captured."
      - "On 20 March 1896 Ndebele killed African policemen in the Filabusi district, and in the following days settlers, prospectors and traders were killed on isolated farms and mines across Matabeleland, 141 in the first week. Leaders of the old kingdom’s regiments, among them Mpotshwana, Mlugulu and Sikhombo, joined the rising; one faction proclaimed Lobengula’s son Nyamanda king; Mkwati, a priest of the Mwari (Mlimo) shrine at Ntaba zika Mambo, gave it religious authority. Some of the senior izinDuna, such as Gampu, stayed with the company."
      - "The settlers of Matabeleland withdrew into laagers at Bulawayo, Gwelo and smaller posts, and the Ndebele gathered on the hills around Bulawayo but did not storm it, leaving the road south open. Relief forces came from Mafeking and Kimberley under Herbert Plumer and from Salisbury; General Frederick Carrington took command in June with British regulars. Columns broke the Ndebele concentrations around Bulawayo and on 5 August Plumer stormed Mkwati’s stronghold at Ntaba zika Mambo, and the Ndebele, an estimated 50,000 people, retreated with their remaining cattle into the granite hills of the Matobo."
    facts:
      - [Rising begins, "20 March 1896 (Filabusi district)"]
      - [Settlers killed in the first week, "141 in Matabeleland"]
      - [Ntaba zika Mambo taken, "5 August 1896"]
