  - title: The fall of Benin City
    date: February – August 1897
    when: "1897-02-18"
    borders: "1897-09-01"
    countries: [ng]
    body:
      - "Rawson brought warships and about 1,200 sailors, Royal Marines and Niger Coast Protectorate soldiers, with several thousand carriers, from the Royal Navy’s Cape station and the protectorate. The invasion began on 9 February 1897 in three columns: one from Ughoton along the road the Phillips party had taken, where it found the remains of the dead, and two from the south, the Sapoba column and the main column. Benin’s soldiers fought from ambushes in the forest for ten days, but they had few modern guns against the British rifles, Maxim guns and rockets."
      - "On 18 February the columns entered Benin City, which its defenders and most of its people had abandoned. On 21 February fire swept through the city and destroyed the palace. The soldiers looted the palace and the shrines of the brass plaques, heads and figures, carved ivory and wood that recorded centuries of Benin’s history; the Admiralty sold much of it to pay for the expedition."
      - "Ovonramwen escaped to the forest and returned to surrender on 5 August 1897. Moor tried him and the chiefs held responsible for the January attack; several chiefs were executed, and Ologbosere, who fought on in the forest, was captured and hanged in 1899. Ovonramwen was exiled to Calabar, and Benin was ruled through a council of chiefs under a British resident as part of the protectorate. After his death in 1914 the British allowed his son to take the throne as Oba Eweka II, and the monarchy continues today."
