id: benin-expedition-of-1897
name: Benin Expedition of 1897
start: "1897-01-04"
end: "1897-08-05"
tier: B
summary: "The British conquest of the Kingdom of Benin, in what is now southern Nigeria. Benin, ruled by its obas from Benin City for some six centuries, controlled the trade of its hinterland and had kept its independence while Britain built up the Niger Coast Protectorate around it. Britain claimed that a treaty of 1892 had opened Benin to free trade; Oba Ovonramwen went on levying duties and in 1896 halted the palm-oil trade with the Itsekiri middlemen. In late December 1896 the acting consul-general, James Phillips, set out for Benin City with a party of about 250, without waiting for permission from London and against the oba’s request to wait until a festival was over. On 4 January 1897 Benin soldiers attacked the party near Ugbine and killed most of its members. A British force of about 1,200 sailors, marines and protectorate soldiers under Rear-Admiral Harry Rawson invaded in February and took Benin City on 18 February after ten days of fighting; much of the city burned, and the troops looted the palace and shrines of thousands of brass, ivory and wooden works of art, the Benin Bronzes. Ovonramwen surrendered in August and was exiled to Calabar, where he died in 1914, and Benin was annexed to the protectorate. The return of the Bronzes, scattered among museums in Europe and North America, has become one of the best-known questions of restitution of cultural property."
