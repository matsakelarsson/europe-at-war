notes:
  - "The British called the invasion the Benin Punitive Expedition and justified it by the killing of the Phillips party and by the human sacrifices reported in Benin City. Historians such as Philip Igbafe have stressed the commercial aims behind it, and Robin Law has argued that British accounts exaggerated the sacrifices to justify intervention. Eight men of the British force were recorded killed in action; Benin’s losses, military and civilian, were not counted but are thought to have been high."
  - "The official figure for the objects taken is about 2,500, among them more than a thousand brass plaques and sculptures. About 40 per cent went to the British Museum; much of the rest was auctioned to pay for the expedition and bought by museums in Germany and elsewhere. Since 2022 Germany, the Netherlands, the Smithsonian Institution, the Horniman Museum in London and other institutions have returned objects or transferred their ownership to Nigeria, while the British Museum’s collection of about 900 objects is held under an act of Parliament."
