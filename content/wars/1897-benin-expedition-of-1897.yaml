steps:
  - title: The Phillips party
    date: 1892 – January 1897
    when: "1897-01-04"
    borders: "1897-01-04"
    countries: [ng]
    body:
      - In 1892 the British vice-consul Henry Gallwey obtained Ovonramwen’s mark on a treaty that, in British eyes, placed Benin under British protection and opened it to free trade. The oba continued to require duties and to control trade through his chiefs, and the protectorate’s consul-general, Ralph Moor, pressed London for permission to use force. In 1894 a British force destroyed Ebrohimi, the town of the Itsekiri trader Nana Olomu, on Benin’s southern border, and Benin strengthened its frontier. In March 1896 Ovonramwen stopped the supply of palm produce to the Itsekiri middlemen, and the British traders on the Benin river asked the protectorate to ‘open up’ Benin.
      - "James Phillips, acting consul-general while Moor was in Britain, asked London in November 1896 for permission to visit Benin City and, without waiting for an answer, set out in late December with a party of about 250, a handful of British officials and traders and more than two hundred African carriers and servants, landing at Ughoton (Gwato), Benin’s old river port. The oba, who was celebrating the Igue festival, sent word that he could not receive them and asked them to wait; his council was divided, and while Ovonramwen ordered that the party be allowed to approach, war chiefs led by Ologbosere prepared to stop it."
      - On 4 January 1897, on the forest road near Ugbine, Benin soldiers attacked the party. Phillips and all but two of the Britons were killed along with many of the carriers; the two survivors, Alan Boisragon and Ralph Locke, escaped wounded through the forest, and more than a hundred Itsekiri carriers were taken captive to Benin City. The news reached London within days, and on 12 January the Admiralty gave Rawson command of an invasion force.
