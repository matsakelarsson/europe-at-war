  - title: Burmi and Satiru
    date: 1903 – 1906
    when: "1903-07-27"
    borders: "1906-03-10"
    countries: [ng]
    body:
      - "Attahiru I left Sokoto on a hijra towards Mecca, saying he would not live under Christian rule, and thousands joined him as he moved east through Zamfara, Kano and Bauchi, among them emirs and officials who had lost their thrones; in some Kano districts half the population followed him. British columns pursued him and fought him in several engagements. He took refuge at Burmi, a town in the Gombe emirate whose people had already driven off a British attack, and in June 1903 its defenders repulsed the British again."
      - "On 27 July 1903 a reinforced British force stormed Burmi after shelling it. The British commander, Major Charles Marsh, was killed by an arrow; Attahiru was killed with, by British reports, more than 600 of his followers. His son Muhammad Bello, known as Mai Wurno, led the survivors east, and their descendants still live in Sudan. The fall of Burmi ended the caliphate as an independent state."
      - "Resistance flared again in 1906, when Mahdist expectations of the end of the age spread among the peasants of the Sokoto countryside. At Satiru, a village south of Sokoto, followers of a self-proclaimed Mahdi, joined by a fugitive leader from French territory, Dan Makafo, routed a company of mounted infantry on 14 February 1906, killing its three British officers and about 25 African soldiers. On 10 March a larger British force, with troops sent by Sultan Attahiru II and the Sokoto aristocracy, who feared the movement as much as the British did, destroyed the village; perhaps 2,000 of its defenders, armed mostly with hoes, axes and swords, were killed, and captured leaders were executed. It was the last armed resistance to British rule in northern Nigeria."
    facts:
      - [Battle of Burmi, "27 July 1903"]
      - [Death of Caliph Attahiru I, "27 July 1903"]
      - [Destruction of Satiru, "10 March 1906"]
    markers:
      - kind: battle
        side: gb
        name: Burmi (approximate)
        date: 27 July 1903
        text: The British stormed the town where Attahiru I had taken refuge. The caliph and hundreds of his followers were killed.
        lonlat: [11.43, 10.87]
      - kind: battle
        side: sat
        name: Satiru (approximate)
        date: 14 February 1906
        text: The Mahdists routed a British mounted infantry company here. On 10 March British and Sokoto troops destroyed the village.
        lonlat: [5.25, 12.86]
        lp: l
      - kind: capital
        name: Sokoto
        date: 1903–1906
        text: Seat of the sultan installed by the British, Attahiru II, whose troops helped crush the Satiru rising.
        lonlat: [5.234, 13.062]
