id: british-conquest-of-northern-nigeria
name: British conquest of northern Nigeria
start: "1897-01"
end: "1906-03-10"
tier: B
summary: "The conquest of the Sokoto Caliphate and its emirates by the Royal Niger Company and then the British Northern Nigeria Protectorate. The caliphate, founded in Usman dan Fodio’s jihad, was the largest state in West Africa, a loose union of some thirty emirates under the caliph at Sokoto and the emir of Gwandu. In 1897 the Royal Niger Company, which held a British charter over the lower Niger, defeated the emirates of Nupe at Bida and of Ilorin. The British government took over the company’s territories on 1 January 1900 and Frederick Lugard, as high commissioner, extended British rule emirate by emirate with the West African Frontier Force, taking Kontagora, Yola, Bauchi and Zaria in 1901–1902, Kano on 3 February 1903 and Sokoto on 15 March 1903. Caliph Attahiru I set out with thousands of followers on a hijra towards Mecca and was killed at Burmi in July 1903. Lugard kept the emirs who submitted as rulers under British residents, the system that became known as indirect rule. The last armed resistance, a Mahdist rising at Satiru near Sokoto, was crushed in March 1906 by British troops together with the new sultan’s forces."
countries: [ng, gb]
