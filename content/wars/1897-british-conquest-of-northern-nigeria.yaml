notes:
  - "British accounts, the reports of Lugard and his officers, give the numbers of the armies and the dead; the figures for the caliphate’s armies and losses are estimates. Accounts from the caliphate side include the testimony of Sokoto officials recorded by the colonial historian H. A. S. Johnston, and the histories of Murray Last and Paul Lovejoy."
  - "The markers for Burmi and Satiru are placed approximately; Burmi (Mbormi) lies near Bajoga in today’s Gombe State, and Satiru lay about 22 km (14 miles) south of Sokoto."
  - "The brief for this atlas lists the war from 1900, the year the protectorate was proclaimed; it is dated here from the company’s campaign of 1897, which began the conquest."
