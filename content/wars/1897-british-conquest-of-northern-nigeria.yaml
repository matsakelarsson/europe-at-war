steps:
  - title: Bida and Ilorin
    date: 1897 – 1900
    when: "1897-01-27"
    borders: "1897-06-01"
    countries: [ng]
    body:
      - The Royal Niger Company, chartered in 1886 and led by Sir George Goldie, had made treaties with many of the emirates along the Niger and the Benue, which it read as giving it sovereignty and they as trade agreements. The emirate of Nupe, ruled from Bida, raided for slaves in lands the company claimed, and Ilorin fought on against the Yoruba towns under British protection from Lagos. In January 1897 Goldie led about 500 African soldiers of the company’s constabulary, with some 30 British officers, Maxim guns and artillery, from Lokoja up the Niger.
      - "At Bida, on 26–27 January 1897, they faced the Nupe army, by British estimates more than 25,000 strong, mostly cavalry. Fighting in a square, the company’s force beat off its charges with rapid fire and shelled the town, which burned; Etsu Abubakar fled, and Goldie installed a rival as emir. In February the force marched on Ilorin and took it after a battle on 16 February; its emir submitted and was left in office under the company. Goldie then declared the legal status of slavery abolished in the company’s territories."
      - The caliph did not respond militarily. Britain and France settled the borders of their claims in the region in 1898, and the British government, preparing to take over from the company, raised the West African Frontier Force under Lugard. On 1 January 1900, at Lokoja, Lugard read the proclamation of the Protectorate of Northern Nigeria.
    facts:
      - [Battle of Bida, "26–27 January 1897"]
      - [Ilorin taken, "16 February 1897"]
      - [Protectorate of Northern Nigeria proclaimed, "1 January 1900"]
    link: { href: "#/war/fulani-war", text: The Fulani War }
