  - title: Kano and Sokoto
    date: 1901 – March 1903
    when: "1903-03-15"
    borders: "1903-04-01"
    countries: [ng]
    body:
      - Lugard set up his headquarters at Zungeru and moved against the emirates one at a time, playing on their rivalries. In 1901 the Frontier Force took Kontagora, whose emir had raided for slaves across the middle Niger, and Yola, capital of Adamawa; in 1902 it occupied Bauchi and Gombe, and set up a garrison at Zaria, whose emir was later deposed. Caliph Abdurrahman refused to recognise British authority, writing to Lugard in 1902 that between Muslims and unbelievers there could be only war. He died in October 1902, and his successor, Muhammadu Attahiru I, and his council were divided between resistance and hijra, emigration away from Christian rule.
      - "At the end of January 1903 Colonel Thomas Morland led about 800 African soldiers with mountain guns and machine guns from Zaria to Kano. The emir, Aliyu Babba, was at Sokoto with much of his cavalry; the British breached the walls and took Kano on 3 February. The Kano army, hurrying home, was defeated at Kwatarkwashi later that month. From Kano the column marched on Sokoto, occupying Gwandu on the way."
      - "On 15 March 1903, outside Sokoto, the caliph’s army of perhaps 2,000 horsemen and 4,000 foot soldiers charged the British square and was cut down by machine-gun and artillery fire in less than two hours. The British entered the largely deserted city. Lugard arrived a few days later and installed Muhammadu Attahiru II as sultan, with powers limited to Sokoto province, promising that Islam and the emirs’ dynasties would be respected."
    facts:
      - [Kano taken, "3 February 1903"]
      - [Battle of Sokoto, "15 March 1903"]
