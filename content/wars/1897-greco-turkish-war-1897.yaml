steps:
  - title: Crete and Thessaly
    date: February – May 1897
    when: "1897-02-14"
    borders: "1897-04-30"
    countries: [gr, tr]
    body:
      - Crete’s Christian majority had risen again and again against Ottoman rule, and in early 1897 fighting broke out in Chania. Swept along by public opinion and the nationalist Ethniki Etaireia (National Society), the Greek government sent warships and, on 14 February, landed two battalions under Colonel Timoleon Vassos, who proclaimed the island’s union with Greece. The six Great Powers had already sent an international squadron; they landed troops in the towns, shelled insurgent positions and blockaded Crete, and promised the island autonomy under Ottoman rule.
      - In April Greek irregulars crossed into Ottoman Macedonia, and on 18 April the Ottoman Empire declared war. Its army in Thessaly under Edhem Pasha, larger and better armed and trained by German officers, broke through the frontier passes. On the night of 23–24 April the Greek army under Crown Prince Constantine fell back in panic, and Larissa was occupied on 27 April. Only at Velestino did a brigade under Colonel Konstantinos Smolenskis hold, from 27 to 30 April. On the Epirus front, Greek attacks across the Arta river made little progress.
    facts:
      - [Greek troops land on Crete, "14 February 1897"]
      - [Ottoman declaration of war, "18 April 1897"]
      - [Larissa occupied, "27 April 1897"]
