id: greco-turkish-war-1897
name: Greco-Turkish War (1897)
start: "1897-04-18"
end: "1897-05-20"
tier: B
summary: A short war, also called the Thirty Days’ War, that grew out of a Christian revolt on Ottoman Crete and Greek efforts to annex the island. The Ottoman army routed the Greeks in Thessaly and won at Domokos before the powers imposed an armistice; Greece paid an indemnity and lost a strip of its northern frontier, but the powers then made Crete an autonomous state under a Greek prince.
