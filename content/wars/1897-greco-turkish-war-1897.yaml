  - title: Domokos and the peace
    date: May 1897 – December 1898
    when: "1897-05-05"
    borders: "1898-12-21"
    countries: [gr, tr, it]
    body:
      - On 5 May the Ottomans attacked Farsala and forced the Greeks back to Domokos, and Volos fell on 8 May. At Domokos about 40,000 Greek soldiers, joined by some 2,000 Italian volunteers under Ricciotti Garibaldi, held a strong position, but on 17 May the Ottomans turned the Greek right and the army retreated again. The road to Athens was open. The powers stepped in, and after Tsar Nicholas II telegraphed the sultan, an armistice came into force on 20 May.
      - The Treaty of Constantinople of 4 December 1897 made Greece pay an indemnity of four million Ottoman pounds, under an international commission that took control of part of its revenue, and gave the Ottomans small strips of the Thessalian frontier. Yet Crete was lost to the sultan. After Ottoman troops and Muslim mobs killed British soldiers and Christians in Heraklion in September 1898, the powers expelled the Ottoman army, and in December Prince George of Greece arrived as high commissioner of an autonomous Cretan State.
    facts:
      - [Battle of Domokos, "17 May 1897, Ottoman victory"]
      - [Armistice, "20 May 1897"]
      - [Treaty of Constantinople, "4 December 1897"]
    markers:
      - kind: battle
        side: ot
        name: Farsala
        date: 5–6 May 1897
        text: Three Ottoman divisions attacked the town, and the Greeks withdrew in good order to Domokos.
        lonlat: [22.383, 39.3]
        lp: l
      - kind: taken
        side: ot
        name: Volos
        date: 8 May 1897
        text: The port of Thessaly was occupied after Smolenskis withdrew to Almyros.
        lonlat: [22.943, 39.362]
      - kind: battle
        side: ot
        name: Battle of Domokos
        date: 17 May 1897
        text: Edhem Pasha’s army broke the Greek right flank; the Greeks fell back towards Thermopylae before the armistice.
        lonlat: [22.3, 39.13]
        lp: l
      - kind: treaty
        name: Treaty of Constantinople
        date: 4 December 1897
        text: Ended the war with an indemnity and small border changes in Thessaly in the Ottomans’ favour.
        lonlat: [28.976, 41.009]
      - kind: event
        name: Chania
        date: 21 December 1898
        text: Prince George landed as high commissioner of the Cretan State, which remained under nominal Ottoman sovereignty until 1913.
        lonlat: [24.018, 35.512]
