steps:
  - title: The frontier rising
    date: June – September 1897
    when: "1897-07-26"
    borders: "1897-08-25"
    countries: [pk]
    body:
      - The Durand Line agreed with the Amir of Afghanistan in 1893 cut through the Pashtun tribal country, and the British followed it with forts, roads and garrisons, among them a camp on the Malakand pass after the Chitral campaign of 1895. In June 1897 tribesmen attacked a British political officer’s escort at Maizar in the Tochi valley. On the night of 26 July thousands of tribesmen from Swat and the surrounding valleys, led by a religious leader, Saidullah, attacked the British camps on the Malakand pass and the small fort of Chakdara on the Swat river. Both held out for a week until a column under Sir Bindon Blood relieved Chakdara on 2 August.
      - The rising spread. On 7 August the Mohmands, called to arms by the Hadda Mullah, attacked the fort at Shabqadar near Peshawar. Late in August the Afridis, whom the British had paid for sixteen years to keep the Khyber Pass open, rose and took the Khyber posts held by their own tribesmen in the Khyber Rifles, including Landi Kotal. The Orakzais attacked the forts of the Samana range above Kohat, and on 12 September they overran the signal post of Saragarhi between Fort Lockhart and Fort Gulistan, whose 21 Sikh soldiers of the 36th Sikhs fought until all were killed.
    facts:
      - [Siege of Malakand, "26 July – 2 August 1897"]
      - [Khyber posts taken, "23–25 August 1897"]
      - [Battle of Saragarhi, "12 September 1897"]
