  - title: The Tirah campaign
    date: October 1897 – April 1898
    when: "1897-10-20"
    borders: "1897-11-01"
    countries: [pk]
    body:
      - The Tirah Field Force, about 35,000 British and Indian troops with some 20,000 followers under Sir William Lockhart, set out from Kohat in October to punish the Afridis and Orakzais in their home valleys of Tirah, which no British army had entered. On 18 October it took the Dargai heights above the Chagru pass, then left them for lack of water, and on 20 October stormed them again at a cost of nearly 200 casualties; the Gordon Highlanders’ charge, led on by a wounded piper, became a famous image in Britain. The force crossed the Sampagha and Arhanga passes at the end of October and occupied the Maidan valley.
      - For six weeks the brigades burned fortified villages and destroyed crops and stores while the Afridis fought a skilled guerrilla war against foraging parties and convoys. In December Lockhart withdrew down the Bara valley in snow and freezing rain, harried all the way, and reached the Peshawar plain on 14 December. Faced with another expedition in the spring, the Afridis agreed to pay fines and hand over rifles, and the force was broken up on 4 April 1898. The British lost about 1,150 killed and wounded in Tirah. Afterwards the new Viceroy, Lord Curzon, pulled regular troops back from the tribal areas, relied on tribal militias, and in 1901 made the frontier districts a separate North-West Frontier Province.
