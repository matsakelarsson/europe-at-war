id: pashtun-revolt-of-1897
name: Pashtun revolt of 1897
start: "1897-06-10"
end: "1898-04-04"
tier: B
summary: "A wave of risings by Pashtun tribes along the North-West Frontier of British India in 1897–1898, the largest the British faced there. Resentment of the Durand Line of 1893 and of new British posts in tribal country, preached against by religious leaders, broke out in attacks in the Tochi valley in June, on the British camps at Malakand and the fort of Chakdara in July, on Shabqadar in August, on the Khyber posts held by Afridi levies and on the forts of the Samana range, where 21 Sikh soldiers died defending Saragarhi in September. The British sent several field forces; the largest, about 35,000 strong under Sir William Lockhart, marched into the Afridi and Orakzai valleys of Tirah in October, stormed the Dargai heights and burned villages before withdrawing through the snow in December. The tribes submitted and paid fines in the spring of 1898."
countries: [pk]
sides:
