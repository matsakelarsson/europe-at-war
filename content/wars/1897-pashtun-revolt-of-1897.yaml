notes:
  - British writers called the leader of the Malakand rising, Saidullah, the “Mad Mullah” or “Mad Fakir”, and the risings a “fanatical outbreak”. Modern historians stress the tribes’ grievances over the Durand Line, new forts and roads, and British interference in tribal affairs, as well as the calls to holy war by several religious leaders.
  - The young Winston Churchill served with the Malakand Field Force as an officer and correspondent and wrote his first book about it.
  - Tribal losses were not counted.
