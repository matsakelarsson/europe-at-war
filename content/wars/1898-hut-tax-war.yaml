notes:
  - "Cardew blamed the rising on chiefs who resented the end of slave raiding and the slave trade, and he cast Bai Bureh as its instigator; Chalmers called the attempt to arrest Bai Bureh “aggression pure and simple”, and later historians have also seen the war as a defence of the chiefs’ authority and of a social order that included slavery. Figures for those killed in the Mende rising range from about 300 to more than 1,000."
