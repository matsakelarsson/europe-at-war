id: hut-tax-war
name: Hut Tax War
start: "1898-02"
end: "1898-11-11"
tier: B
summary: "The armed resistance of 1898 to British rule in the new Protectorate of Sierra Leone, set off by Governor Frederic Cardew’s tax on houses. Britain had ruled the coastal Colony around Freetown since 1808 and in 1896 declared a protectorate over the interior to secure it against other European powers; from 1 January 1898 every house there was to pay five or ten shillings a year, collected by the chiefs under the eye of district commissioners and the Frontier Police. Chiefs petitioned against it as an attack on their authority. In the north the Temne and Loko under Bai Bureh, ruler of Kasseh near Port Loko, fought a guerrilla war from February to November 1898 that tied down British and West Indian troops for months. In the south-east, from late April, Mende chiefs and warriors, organised through the Poro society, rose suddenly and killed several hundred Creole traders, missionaries, officials and others seen as agents of the government, before columns under Lieutenant-Colonel Marshall put the rising down in about two months. British troops burned villages and farms to break the resistance. Bai Bureh was captured on 11 November 1898 and exiled to the Gold Coast with the Mende leaders Nyagua and Kpana Lewis, and 96 men were hanged for murder. A royal commissioner, Sir David Chalmers, found that the tax and the way it was enforced had caused the rising, but the tax stayed."
