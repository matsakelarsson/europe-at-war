steps:
  - title: Bai Bureh’s war
    date: February–November 1898
    when: "1898-02-19"
    borders: "1898-02-19"
    countries: [sl]
    body:
      - "Bai Bureh, born around 1840 and trained as a warrior at Gbendembu, had become ruler of Kasseh near Port Loko in 1886 and the leading war chief of the Temne and Loko north. He had already crossed the British by raiding into French Guinea and rejecting a treaty they made with the Limba. When he and other chiefs refused to collect the hut tax, the district commissioner, Captain W. S. Sharpe, tried to arrest him with the Frontier Police in February 1898. Fighting broke out at once, and by 19 February Bai Bureh’s men had cut the river and road links between Freetown and Port Loko."
      - "Bai Bureh fought from hidden stockades of logs and thorn, the war fences, from which his men ambushed British columns in the bush and then slipped away; by some accounts the Limba ruler Almamy Suluku sent fighters and arms, and he later carried Bai Bureh’s peace offers to the British. For four months the British, with the Frontier Police, the West India Regiment and the new West African Regiment, could do little more than hold Port Loko and the posts and escort supply columns, at heavy cost on both sides. Cardew refused Bai Bureh’s peace offers of April and June because they were not unconditional surrender, offered £100 for his capture and ordered villages and farms in the country that supported him burned. With food running out, Bai Bureh’s war wound down; on 11 November 1898 a patrol tracked him down in the swamps, and he was captured (some accounts say he surrendered) and taken to Freetown."
    facts:
      - [Hut tax in force, "1 January 1898"]
      - [Freetown–Port Loko links cut, "by 19 February 1898"]
      - [Bai Bureh captured, "11 November 1898"]
      - [Exile, "Gold Coast, 1899–1905"]
