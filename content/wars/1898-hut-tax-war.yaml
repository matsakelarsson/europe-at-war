  - title: The Mende rising
    date: April–July 1898
    when: "1898-05-03"
    borders: "1898-05-03"
    countries: [sl]
    body:
      - "On 27 April 1898 the Mende country of the south and south-east rose, organised through the Poro society, with some Sherbro taking part. Bands attacked district headquarters, mission stations and trading towns and killed almost every outsider they caught: Creole traders and clergy from Freetown, African employees of the government, and European and American missionaries. Five American missionaries of the United Brethren were killed at Rotifunk and others at Taiama. Estimates of the dead range from about 300 to more than 1,000."
      - "Cardew sent columns under Lieutenant-Colonel J. W. A. Marshall, with West Indian troops, a naval brigade and African levies, which relieved the posts and broke organised resistance in the south within about two months. The Mende rising lacked a single leader and a clear plan; Nyagua of Panguma and Kpana Lewis of the Sherbro were among the rulers the British held responsible and exiled. Most of the 96 men hanged for murder after the war were Mende. The British forces lost 67 killed and 184 wounded, besides 90 carriers dead and uncounted levies; losses among the people of the Protectorate were not recorded."
    facts:
      - [Rising begins, "27 April 1898"]
      - [Killed in the rising, "about 300 to more than 1,000"]
      - [British losses, "67 killed, 184 wounded"]
      - [Hanged, "96"]
