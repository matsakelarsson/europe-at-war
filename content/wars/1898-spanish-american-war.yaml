id: spanish-american-war
name: Spanish–American War
start: "1898-04-21"
end: "1898-08-12"
tier: A
summary: "The war of 1898 between Spain and the United States, which grew out of the Cuban War of Independence. American sympathy for the Cuban insurgents, outrage at the deaths in Spain’s reconcentration camps, fed by a sensational press, and American investments in Cuba came to a head when the battleship Maine exploded in Havana harbour on 15 February 1898. In April Congress demanded Spain’s withdrawal from Cuba, while renouncing any intention to annex it, and the war began. On 1 May Commodore George Dewey destroyed the Spanish squadron in Manila Bay. In the Caribbean Admiral Pascual Cervera’s squadron took refuge at Santiago de Cuba, and an American army landed nearby in June with the help of Calixto García’s Cuban insurgents, took the San Juan Heights and El Caney on 1 July and besieged the city; on 3 July Cervera’s ships were destroyed trying to break out, and Santiago surrendered on 17 July. American troops then landed in Puerto Rico and advanced across the island until the armistice of 12 August; Manila fell the next day. By the Treaty of Paris of 10 December 1898 Spain gave up Cuba and ceded Puerto Rico, Guam and the Philippines to the United States for $20 million. About 2,450 Americans died, most of them of disease, as did most of the roughly 15,700 Spanish dead. The United States became a colonial power in the Caribbean and the Pacific; in Spain the loss of the last great colonies was remembered as “the Disaster”, and in the Philippines the war led straight into the Philippine–American War."
countries: [us, es, cu, pr, ph, gu]
