  - title: Cervera’s squadron and the blockade
    date: April – June 1898
    when: "1898-05-19"
    borders: "1898-05-19"
    countries: [us, es, cu, pr]
    body:
      - Admiral Pascual Cervera, who had warned Madrid that his ships were no match for the American navy, sailed from the Cape Verde Islands on 29 April with four armoured cruisers and three destroyers. Fear of a Spanish raid on the American coast kept Commodore Winfield Scott Schley’s Flying Squadron at Hampton Roads. Looking for Cervera, Sampson bombarded San Juan, Puerto Rico, on 12 May, while Cervera, short of coal, called at Martinique and Curaçao and on 19 May slipped into the harbour of Santiago de Cuba.
      - American ships cut the undersea cables off Cienfuegos on 11 May, and the same day the torpedo boat Winslow was badly damaged by Spanish guns at Cárdenas. From the end of May the American squadrons blockaded Santiago, and on 3 June Lieutenant Richmond Hobson tried to block the harbour entrance by sinking the collier Merrimac in the channel, but she sank too far in. On 10 June a battalion of marines landed at Guantánamo Bay to secure a coaling station, guided by Cuban insurgents, and held it in four days of fighting.
    facts:
      - [Cervera sails from Cape Verde, "29 April 1898"]
      - [San Juan bombarded, "12 May 1898"]
      - [Cervera enters Santiago, "19 May 1898"]
      - [Marines land at Guantánamo Bay, "10 June 1898"]
