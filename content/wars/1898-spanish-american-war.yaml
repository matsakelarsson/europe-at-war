id: spanish-american-war
name: Spanish–American War
start: "1898-04-21"
end: "1898-08-12"
tier: C
summary: A war between Spain and the United States that grew out of the Cuban War of Independence and the explosion of the American battleship Maine in Havana harbour in February 1898. American squadrons destroyed the Spanish fleets at Manila Bay on 1 May and off Santiago de Cuba on 3 July, and American troops took Santiago, Puerto Rico and Manila. By the Treaty of Paris of 10 December 1898 Spain gave up Cuba and ceded Puerto Rico, Guam and the Philippines to the United States, for which it was paid $20 million. In Spain the loss of the last major colonies was remembered as “the Disaster” of 1898.
