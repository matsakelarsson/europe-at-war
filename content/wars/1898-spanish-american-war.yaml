  - title: El Caney and the San Juan Heights
    date: 1 July 1898
    when: "1898-07-01"
    borders: "1898-07-01"
    countries: [us, es, cu]
    view:
      center: [-75.80, 20.03]
      size: [50, 50]
    body:
      - Shafter planned to take the village of El Caney, north-east of Santiago, in two hours with General Henry Lawton’s division of about 6,600 men, and then throw his whole army against the San Juan Heights, the ridge that guarded the city. At El Caney some 520 Spanish soldiers under General Joaquín Vara de Rey, in a stone fort, blockhouses and trenches, held out for about ten hours until Vara de Rey was killed and the survivors withdrew; the Americans lost 81 killed and about 360 wounded.
      - Meanwhile General Jacob Kent’s infantry and the dismounted cavalry division, about 8,400 men, waited under fire on the jungle trail below the heights, where an observation balloon gave away their position. In the afternoon they charged up the slopes without orders from the top. The Rough Riders, the 9th and 10th Cavalry and other regiments took Kettle Hill, and Kent’s infantry, with the 24th Infantry, took San Juan Hill, supported by Lieutenant John Parker’s Gatling guns. About 520 Spaniards held the heights, while General Linares kept most of his 10,000 men in the city; he was wounded, and General José Toral took command.
      - The Americans lost about 200 killed and nearly 1,200 wounded on 1 July, the Spanish about 100 killed, some 500 wounded and 200 captured. The army dug in on the heights, short of food and ammunition and with fever spreading, and Shafter considered pulling back. Cuban troops held the approaches to the north and west of the city.
    facts:
