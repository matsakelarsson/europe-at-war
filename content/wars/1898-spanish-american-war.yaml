  - title: Manila Bay and the Pacific
    date: May – August 1898
    when: "1898-05-01"
    borders: "1898-05-01"
    countries: [us, es, ph, gu]
    body:
      - Weeks before the war the Assistant Secretary of the Navy, Theodore Roosevelt, ordered Commodore George Dewey’s Asiatic Squadron to Hong Kong, ready to attack the Spanish in the Philippines. Dewey sailed from Mirs Bay on 27 April, entered Manila Bay in the night and at dawn on 1 May 1898 destroyed Rear Admiral Patricio Montojo’s outdated squadron off Cavite. Hundreds of Spanish sailors were killed or wounded; no American was killed in action.
      - Dewey had no troops to take Manila. He brought the exiled revolutionary leader Emilio Aguinaldo back from Hong Kong on 19 May, and Aguinaldo proclaimed independence at Kawit on 12 June, while his forces took most of Luzon outside Manila from the Spanish over the summer. On 20–21 June the cruiser Charleston took the surrender of Guam, whose Spanish garrison had not heard of the war. American troops under General Wesley Merritt arrived in the summer, and on 13 August, after an arranged battle with the Spanish commanders, they took Manila while keeping the Filipino forces out. What followed is told in the Philippine Revolution and the Philippine–American War.
    facts:
      - [Battle of Manila Bay, "1 May 1898, American victory"]
      - [Philippine independence proclaimed, "12 June 1898, Kawit"]
      - [Guam surrenders, "20–21 June 1898"]
      - [Manila taken, "13 August 1898"]
    link: { href: "#/war/philippine-american-war", text: The Philippine–American War }
