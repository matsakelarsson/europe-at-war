  - title: The armistice and the Treaty of Paris
    date: August 1898 – April 1899
    when: "1898-12-10"
    borders: "1898-12-10"
    countries: [us, es, cu, pr, ph, gu]
    body:
      - On 12 August 1898 the French ambassador Jules Cambon, acting for Spain, and Secretary of State William R. Day signed a protocol in Washington. Spain would give up Cuba and cede Puerto Rico and an island in the Marianas, and the United States would hold Manila until a treaty decided the fate of the Philippines. The peace conference opened in Paris on 1 October, and McKinley, deciding that the United States should keep the whole archipelago, instructed his commissioners to demand it.
      - The Treaty of Paris, signed on 10 December 1898, ended Spanish rule in the Americas and Asia. Spain relinquished Cuba, which the United States would occupy, and ceded Puerto Rico, Guam and the Philippines, for which the United States paid $20 million; neither Cubans, Puerto Ricans nor Filipinos took part. After a bitter debate with the Anti-Imperialist League, the Senate approved the treaty on 6 February 1899 by a single vote more than the two-thirds needed, two days after fighting had broken out between American and Filipino troops near Manila. Spain handed Cuba over on 1 January 1899, and the treaty came into force on 11 April 1899.
    facts:
      - [Protocol of peace, "12 August 1898, Washington"]
      - [Treaty of Paris, "10 December 1898"]
      - [Senate approval, "6 February 1899, 57 to 27"]
      - [Payment to Spain, "$20 million"]
