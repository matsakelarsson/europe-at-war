steps:
  - title: The Maine and the road to war
    date: February – April 1898
    when: "1898-02-15"
    borders: "1898-02-15"
    countries: [us, es, cu]
    body:
      - By 1898 Americans had some $50 million invested in Cuba and a large trade with the island, and the Cuban insurgents had many friends in the United States. The newspapers of William Randolph Hearst and Joseph Pulitzer filled their pages with the horrors of Weyler’s reconcentration, true and invented, and in February published a stolen private letter in which the Spanish minister in Washington, Enrique Dupuy de Lôme, called President William McKinley weak.
      - On the night of 15 February 1898 the battleship Maine, sent to Havana in January to protect Americans during riots, blew up and sank in the harbour; 260 men died at once and six more later. An American naval court of inquiry concluded in March that a mine had set off her magazines, and “Remember the Maine!” became a rallying cry; a Spanish inquiry found that the explosion had started inside the ship. In March Senator Redfield Proctor described to the Senate what he had seen in the reconcentration camps.
      - Spain offered to suspend hostilities in Cuba, but on 19–20 April Congress demanded its withdrawal from the island and authorised force, adding the Teller Amendment, which renounced any intention to annex Cuba. On 22 April McKinley proclaimed a blockade of Havana and the north coast, Spain declared war on 23 April, and on 25 April Congress declared that a state of war had existed since 21 April.
    facts:
      - [Maine explodes, "15 February 1898, 266 dead"]
      - [Teller Amendment, "19–20 April 1898"]
      - [Blockade of Cuba, "from 22 April 1898"]
      - [Declarations of war, "Spain 23 April, United States 25 April (from 21 April)"]
