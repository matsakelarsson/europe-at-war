  - title: Puerto Rico
    date: May – August 1898
    when: "1898-07-25"
    borders: "1898-07-25"
    countries: [us, es, pr]
    body:
      - Puerto Rico had received a charter of autonomy from Spain in November 1897; an autonomous cabinet in which Luis Muñoz Rivera was the leading figure took office in February 1898, and the island’s first elected parliament met on 17 July, a week before the Americans came. On 25 July General Nelson A. Miles landed the first troops of a force of about 3,300 men at Guánica on the south coast, instead of near San Juan, where the Spanish expected him. Yauco and then Ponce, the island’s second city, fell within days, Ponce without a fight on 27–28 July, and many Puerto Ricans welcomed the troops. A second force under General John R. Brooke landed at Arroyo on 1–3 August and took Guayama.
      - Miles sent four columns towards San Juan, with about 15,000 men in all against some 8,000 Spanish regulars and 10,000 Puerto Rican volunteers under the governor-general, Manuel Macías. General James Wilson’s column took Coamo on 9 August and was stopped by Spanish guns at Asomante, above Aibonito, on 12 August; General Theodore Schwan’s column fought at Hormigueros on 10 August and took Mayagüez. News of the armistice halted the fighting on 13 August. The campaign cost few lives, fewer than ten Americans and about seventeen Spanish and Puerto Rican soldiers killed. The last Spanish troops left San Juan on 18 October 1898, when the island passed to American military government.
    facts:
      - [Landing at Guánica, "25 July 1898"]
      - [Ponce taken, "27–28 July 1898"]
      - [Coamo, "9 August 1898"]
      - [Asomante, "12 August 1898"]
