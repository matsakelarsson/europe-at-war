  - title: Landing at Daiquirí and Siboney
    date: June 1898
    when: "1898-06-22"
    borders: "1898-06-22"
    countries: [us, es, cu]
    view:
      center: [-75.88, 19.99]
      size: [70, 50]
    body:
      - General William R. Shafter’s Fifth Army Corps, about 17,000 regulars and volunteers, sailed from Tampa in mid-June. Among them were the 1st United States Volunteer Cavalry, the Rough Riders of Leonard Wood and Theodore Roosevelt, and the four regiments of Black regular soldiers, the 9th and 10th Cavalry and the 24th and 25th Infantry, whom the Plains peoples had called Buffalo Soldiers. On 20 June Shafter and Sampson met Calixto García at Aserraderos, west of Santiago, and agreed that the army would land east of the city with Cuban help.
      - On 22 June the troops began to come ashore at Daiquirí, in surf so rough that some men and many horses drowned, with Cuban troops under Demetrio Castillo Duany covering the beach; the small Spanish garrisons withdrew, and on 23 June the landing moved to Siboney. On 24 June dismounted cavalry under General Joseph Wheeler, among them the Rough Riders and the 10th Cavalry, attacked the Spanish rearguard of General Antero Rubín at Las Guásimas on the road to Santiago; the Spanish withdrew as planned, and the Americans lost 17 killed and 52 wounded. Over the following days García brought some 3,000 more Cubans by sea from Aserraderos to Siboney.
    facts:
