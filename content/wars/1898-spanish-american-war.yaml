  - title: The surrender of Santiago
    date: July – August 1898
    when: "1898-07-17"
    borders: "1898-07-17"
    countries: [us, es, cu]
    view:
      center: [-75.85, 20.03]
      size: [60, 50]
    body:
      - The Americans and Cubans now besieged Santiago. A Spanish relief column of some 3,600 men under Colonel Federico Escario, marching from Manzanillo, fought its way past the Cubans and entered the city on 3 July. American guns and ships bombarded the city on 10–11 July, and General Toral, with no hope of relief, opened talks. On 16 July he agreed to surrender the city and the eastern district of the province, and on 17 July some 23,000 Spanish soldiers laid down their arms, about 12,000 of them in Santiago.
      - The Americans did not let the Cuban army into the city or take part in the ceremony, and left the Spanish officials in their posts. Calixto García wrote to Shafter in protest and resigned his command. Meanwhile yellow fever, malaria and dysentery swept through the Fifth Army Corps; in early August its senior officers, Roosevelt among them, signed a letter urging that it be sent home before it was destroyed, and the troops were shipped to a quarantine camp at Montauk on Long Island.
    facts:
      - [Santiago surrenders, "17 July 1898"]
      - [Spanish troops surrendered, "about 23,000 in the district, 12,000 in the city"]
