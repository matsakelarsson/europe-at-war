  - title: The naval battle of Santiago
    date: 3 July 1898
    when: "1898-07-03"
    borders: "1898-07-03"
    countries: [us, es, cu]
    view:
      center: [-76.33, 19.96]
      size: [130, 60]
    body:
      - With the army closing in on Santiago, Captain General Blanco ordered Cervera to break out. On the morning of Sunday 3 July 1898, while Sampson in his flagship New York had steamed east to meet Shafter, Cervera led his four armoured cruisers, the Infanta María Teresa, Vizcaya, Cristóbal Colón and Almirante Oquendo, and two destroyers out of the narrow harbour entrance in single file and turned west along the coast.
      - Schley’s armoured cruiser Brooklyn and the battleships Texas, Iowa, Indiana and Oregon gave chase. Within an hour the burning María Teresa and Oquendo had been run aground a few miles west of the harbour, the destroyers sunk or beached, and the Vizcaya ran ashore near Aserraderos. The fast Cristóbal Colón ran on until her good coal gave out and was beached near the mouth of the Turquino River, some 75 km west of Santiago, early in the afternoon.
      - More than 300 Spanish sailors were killed and 151 wounded, and about 1,800, Cervera among them, were taken prisoner; the Americans lost one man killed and one wounded. Spain’s main fleet had ceased to exist, and Madrid began to look for peace.
