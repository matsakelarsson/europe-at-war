notes:
  - Far more soldiers died of disease than in battle. The United States lost 385 men killed in action and 2,061 dead of disease, many of them of typhoid in training camps at home; Spanish losses are given as about 15,700 dead, about 15,000 of them from disease, most of them in Cuba.
  - The cause of the Maine explosion is still disputed. An American naval court of inquiry in March 1898 blamed a mine, a Spanish inquiry an explosion inside the ship; a study published by Admiral Hyman Rickover in 1976 concluded that a fire in a coal bunker had most likely set off the magazines, and later studies have not settled the question.
  - Cubans have often called the conflict the Spanish–Cuban–American War, since it ended a war the Cuban insurgents had been fighting since 1895, which is told in the Cuban War of Independence. The war in the Philippines is told in the Philippine Revolution and the Philippine–American War.
