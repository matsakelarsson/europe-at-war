  - title: Tianjin and the killing of Christians
    date: June – July 1900
    when: "1900-07-13"
    borders: "1900-07-14"
    countries: [cn, gb, ru, jp, de, fr, us, it, at]
    body:
      - From mid-June the foreign concessions of Tianjin, defended by a few thousand allied troops, were shelled and attacked by Qing troops and Boxers. Allied reinforcements landed at Dagu, and on 9 July the Qing general Nie Shicheng, who had fought the Boxers before he was ordered to fight the foreigners, was killed. On 13–14 July several thousand Japanese, Russian, British, American, French and Austrian troops stormed the walled Chinese city of Tianjin; the Americans and Japanese lost heavily in the assault. The city was looted and many civilians were killed.
      - Across North China and in Inner Mongolia, Boxers and some officials killed missionaries and, in far greater numbers, Chinese Christians, both Catholic and Protestant. The worst killings were in Shanxi, whose governor Yuxian had 44 foreign men, women and children, mostly missionaries and their families, put to death in Taiyuan on 9 July, and in Zhili. In all about 32,000 Chinese Christians and some 200 foreign missionaries were killed. Many people suspected of Boxer sympathies were in turn killed by allied troops and Qing officials.
    facts:
      - [Battle of Tianjin, "13–14 July 1900, allied victory"]
      - [Taiyuan killings, "9 July 1900, 44 foreigners"]
      - [Christians killed, "about 32,000 Chinese and some 200 foreign missionaries"]
    markers:
