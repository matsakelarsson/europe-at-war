  - title: The Boxer Protocol
    date: 7 September 1901
    when: "1901-09-07"
    borders: "1901-09-07"
    countries: [cn, gb, ru, jp, de, fr, us, it, at]
    body:
      - The Boxer Protocol was signed in Beijing on 7 September 1901 by China and eleven foreign states. China was to pay an indemnity of 450 million taels of silver, about one tael for each of its people, over 39 years at 4 per cent interest, nearly 1,000 million taels in all, secured on its customs and salt revenues. The forts at Dagu and between Beijing and the sea were to be razed, foreign troops could be stationed in the Legation Quarter, which was closed to Chinese residents, and along the railway to the sea, and imports of arms were banned for two years. Prince Duan (Zaiyi), the patron of the Boxers, was exiled, and other officials, among them Yuxian, were executed or ordered to kill themselves. Prince Chun went to Berlin to apologise for Ketteler’s death.
      - Most foreign troops left Beijing in September 1901, and the court returned in January 1902. The defeat discredited the conservatives at court and led to the late Qing reforms, but also to growing nationalist and revolutionary opposition. The United States and later other powers returned part of their share of the indemnity, the Americans using theirs for scholarships and to found what became Tsinghua University. Estimates of the total dead of the rising and the war are around 100,000, most of them Chinese civilians.
    facts:
      - [Boxer Protocol signed, "7 September 1901"]
      - [Indemnity, "450 million taels over 39 years"]
      - [Court returns to Beijing, "January 1902"]
    markers:
      - kind: treaty
        name: Beijing
        date: 7 September 1901
        text: Signed by Li Hongzhang and Prince Qing with the ministers of Germany, Austria-Hungary, Belgium, Spain, the United States, France, Britain, Italy, Japan, the Netherlands and Russia.
        lonlat: [116.403, 39.901]
        lp: b
      - kind: event
        name: Dagu forts
        date: "1901"
        text: To be demolished under the protocol, leaving the sea approach to Beijing undefended.
        lonlat: [117.705, 38.977]
