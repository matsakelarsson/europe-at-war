id: boxer-rebellion
name: Boxer Rebellion
start: "1899-10"
end: "1901-09-07"
tier: A
summary: "An anti-foreign and anti-Christian rising in North China, and the war it led to between the Qing court and eight foreign powers. The Boxers, the Yihetuan or “Militia United in Righteousness”, grew among villagers in Shandong and Zhili hit by drought, floods and the German seizure of Jiaozhou Bay; practising martial arts and rituals they believed made them invulnerable, they attacked missionaries, Chinese Christians, railways and telegraphs. In June 1900 they poured into Beijing and Tianjin. When foreign troops seized the Dagu forts, the Empress Dowager Cixi declared war on the powers, and Qing troops and Boxers besieged the foreign legations in Beijing for 55 days. An international army of about 20,000, mostly Japanese, Russian, British and American, took Tianjin and relieved Beijing on 14 August 1900; the court fled to Xi’an, and foreign troops looted the capital and sent punitive columns through Zhili while Russia occupied Manchuria. The Boxer Protocol of September 1901 imposed an indemnity of 450 million taels. About 32,000 Chinese Christians and some 200 foreign missionaries were killed, and estimates of the total dead are around 100,000."
countries: [cn, jp, ru, gb, us, fr, de, it, at]
sides:
  - id: allies
    name: Eight-Nation Alliance
    polities: [japan, russia, united-kingdom, united-states, france, germany, italy, austria-hungary]
    ink: blue
    moves: Allied moves
    success: Allied success
  - id: boxers
    name: Boxers (Yihetuan)
    polities: [boxers]
    ink: red
    moves: Boxer moves
    success: Boxer success
  - id: qing
    name: Qing China (at war from 21 June 1900)
    polities: [qing]
    ink: gold
    moves: Qing moves
    success: Qing success
notes:
  - Neither side formally declared war in the usual way. The court’s edict of 21 June 1900 was a declaration of war in all but name; the powers treated it as the act of a faction and fought, as they put it, to rescue their nationals and put down a rebellion. The governors of the southern and eastern provinces, led by Li Hongzhang, Zhang Zhidong and Liu Kunyi, refused to obey the edict and agreed with the consuls to keep the peace (the Mutual Protection of the Southeast), so the war was confined to the north.
  - The name “Boxers” was given by foreigners to the martial-arts practice of the movement. Contemporary Western accounts were written mostly by the besieged and the armies of the alliance; reports of atrocities on all sides, by Boxers, Qing troops and allied soldiers, are well documented, though some details, such as eyewitness accounts of the Taiyuan killings, have been questioned.
  - Russia’s invasion of Manchuria in 1900, part of the same war, has its own entry.
