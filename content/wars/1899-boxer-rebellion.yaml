steps:
  - title: “Support the Qing, destroy the foreigners”
    date: November 1897 – May 1900
    when: "1899-10"
    borders: "1899-10-18"
    countries: [cn, de]
    body:
      - After China’s defeat by Japan in 1895 the powers scrambled for bases and spheres of influence. In November 1897 two German Catholic missionaries were killed in Juye county in south-western Shandong, and Germany used the killings to seize Jiaozhou Bay, with Qingdao, and to claim rights to railways and mines in the province. Russia leased Lüshun (Port Arthur) and Dalian in 1898, Britain Weihaiwei and the New Territories of Hong Kong, and France Guangzhouwan. Missionaries, protected by treaty, intervened in lawsuits for their converts, and quarrels over church property set Christian and non-Christian villagers against each other.
      - In 1898 the Yellow River flooded western Shandong, and drought followed. Village groups that practised boxing and spirit-possession rituals, which they believed made them immune to swords and bullets, spread across the plain, attacking Christians under the slogan “Support the Qing, destroy the foreigners”. In October 1899, at the Senluo temple in Pingyuan county, Qing troops fought a band that for the first time called itself the Yihetuan, the Militia United in Righteousness. Yuan Shikai, made governor of Shandong in December 1899, suppressed the Boxers there with his modern troops, and the movement moved north into Zhili, where officials were divided over whether to crush it or use it.
    facts:
      - [Juye incident, "1 November 1897"]
      - [Germany occupies Jiaozhou Bay, "14 November 1897"]
      - [Battle of Senluo temple, "18 October 1899"]
      - [Yuan Shikai governor of Shandong, "December 1899"]
