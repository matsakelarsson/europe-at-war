  - title: The relief of Beijing
    date: 4 – 16 August 1900
    when: "1900-08-04"
    borders: "1900-08-14"
    countries: [cn, gb, ru, jp, de, fr, us, it, at]
    body:
      - On 4 August a relief army of about 20,000 men left Tianjin, its largest contingents Japanese (about 10,000), Russian, British (mostly Indian troops) and American, with smaller French, Austrian and Italian detachments; the German reinforcements had not yet arrived. It beat Qing forces at Beicang on 5 August and Yangcun on 6 August. The Qing commander Li Bingheng killed himself after his defeat, and the march to Tongzhou met little resistance.
      - On 14 August the allies attacked the gates of Beijing. Russian and Japanese troops fought their way in through the eastern gates, and British Indian troops, entering through a water gate under the wall, were first to reach the Legation Quarter that afternoon. The Beitang was relieved on 16 August. Early on 15 August the Empress Dowager and the Guangxu emperor fled in disguise, travelling by way of Taiyuan to Xi’an. The allied troops, and many civilians and missionaries, looted the city for days; the British held public auctions of loot.
    facts:
      - [Relief army, "about 20,000 men"]
      - [Battle of Beicang, "5 August 1900"]
      - [Battle of Yangcun, "6 August 1900"]
      - [Beijing relieved, "14 August 1900"]
