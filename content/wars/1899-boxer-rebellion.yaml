  - title: Occupation and punitive expeditions
    date: August 1900 – 1901
    when: "1900-10"
    borders: "1900-10-20"
    countries: [cn, de, fr, gb, ru, jp, us, it, at]
    body:
      - The German field marshal Alfred von Waldersee arrived in late September 1900 as allied commander-in-chief, after the main fighting was over. Kaiser Wilhelm II had told the departing German troops to make themselves feared “as the Huns under their King Attila” had been. From the autumn of 1900 to the spring of 1901 allied columns, the German ones most often, made dozens of punitive expeditions into the Zhili countryside, to Baoding in October and, in early 1901, to the passes leading into Shanxi. Villages suspected of harbouring Boxers were burned and many people were executed without trial, often on the word of local Christians or missionaries; foreign observers and newspapers reported looting, rape and killings by troops of several nations.
      - Allied troops occupied Beijing, Tianjin and much of Zhili, the Shanhaiguan forts and the railway to the sea, and divided Beijing into national sectors. In Manchuria Russia used the attacks on its railway to occupy the whole region. Yuan Shikai’s troops, and Qing officials anxious to make peace, crushed the remaining Boxer bands in Shandong and Zhili. Peace talks were led for the court by Li Hongzhang and Prince Qing.
    facts:
      - [Waldersee arrives, "late September 1900"]
      - [Baoding expedition, "October 1900"]
    markers:
      - kind: taken
        side: allies
        name: Baoding
        date: October 1900
        text: Occupied by a British, French, German and Italian column; several provincial officials were tried by an allied court and beheaded for the killings of missionaries.
        lonlat: [115.465, 38.875]
      - kind: taken
        side: allies
        name: Shanhaiguan
        date: October 1900
        text: The forts where the Great Wall meets the sea, occupied by allied troops.
        lonlat: [119.753, 40.000]
      - kind: event
        side: allies
        name: Beijing
        date: 1900–1901
        text: Divided into sectors under the different allied armies. Waldersee made his headquarters in the imperial palace complex.
        lonlat: [116.397, 39.917]
        lp: b
    arrows:
