  - title: The Boxers in Zhili and the Seymour expedition
    date: May – June 1900
    when: "1900-05-28"
    borders: "1900-06-16"
    countries: [cn, gb, ru, jp, de, fr, us, it, at]
    body:
      - In May 1900 the Boxers, now tens of thousands strong, attacked Christian villages around Baoding and Laishui, ambushed and killed a Qing colonel sent against them, occupied the walled town of Zhuozhou and burned stations on the new Beijing–Baoding railway. On 31 May about 400 foreign marines and sailors arrived by train to guard the legations in Beijing. On 5 June the railway to Tianjin was cut, and in mid-June Boxers entered Beijing, burned churches and foreign houses and killed Chinese Christians. On 11 June soldiers of the Gansu troops of Dong Fuxiang, who were friendly to the Boxers, killed Sugiyama Akira, the chancellor of the Japanese legation.
      - On 10 June the British admiral Sir Edward Seymour set out from Tianjin by train with about 2,100 sailors and marines of eight nations to reach Beijing. Boxers and then Qing troops, who had orders to stop him, blocked the line, and after fighting at Langfang on 18 June Seymour turned back. His column retreated along the river on foot, seized the Xigu arsenal outside Tianjin and held out there until a relief force arrived on 25 June. It had lost about 62 killed and 230 wounded.
    facts:
      - [Legation guards arrive in Beijing, "31 May 1900"]
      - [Railway to Tianjin cut, "5 June 1900"]
      - [Sugiyama Akira killed, "11 June 1900"]
      - [Seymour expedition, "10–26 June 1900, about 2,100 men"]
