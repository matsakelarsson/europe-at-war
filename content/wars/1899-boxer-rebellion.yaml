        text: A clash between Boxers led by Zhu Hongdeng and Qing troops near Pingyuan. The Boxers here first called themselves the Yihetuan.
        lonlat: [116.420, 37.130]
      - kind: event
        side: qing
        name: Jinan
        date: December 1899
        text: Seat of the governor of Shandong. Yuan Shikai’s suppression drove many Boxers north into Zhili.
        lonlat: [117.000, 36.665]
        lp: b
