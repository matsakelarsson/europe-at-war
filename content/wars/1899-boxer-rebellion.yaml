  - title: The Dagu forts, the declaration of war and the siege of the legations
    date: 17 June – 14 August 1900
    when: "1900-06-17"
    borders: "1900-06-21"
    countries: [cn, gb, ru, jp, de, fr, us, it, at]
    body:
      - On 17 June an allied flotilla under the Russian admiral Yevgeny Alekseyev took the Dagu forts at the mouth of the Hai river after the Qing commander refused to hand them over; the United States did not take part. For the court, this was an act of war. On 20 June the German minister, Baron Clemens von Ketteler, was shot dead in the street by a Manchu officer on his way to the Zongli Yamen, and that afternoon Qing troops and Boxers opened fire on the Legation Quarter. On 21 June the Empress Dowager Cixi issued an edict declaring war on the foreign powers.
      - In the Legation Quarter, south-east of the Forbidden City, 473 foreign civilians, about 409 soldiers and marines of eight nations and some 3,000 Chinese Christians held out under the British minister, Sir Claude MacDonald. A few kilometres away, about 3,200 Chinese Catholics, 43 French and Italian sailors and the priests and nuns of the Beitang (North Cathedral) under Bishop Alphonse Favier were besieged separately. The attackers burned the buildings around the British legation, including the Hanlin Academy and its library, and mined the French legation, but never made an all-out assault. Some at court, among them the commander Ronglu, held back, and a truce in mid-July let food into the legations.
      - In the south, the governors-general Li Hongzhang, Zhang Zhidong and Liu Kunyi refused to obey the declaration of war. They agreed with the foreign consuls to protect foreigners in their provinces if the powers kept their troops out, and the Yangtze valley and the south stayed at peace.
    facts:
      - [Dagu forts taken, "17 June 1900"]
      - [Ketteler killed, "20 June 1900"]
      - [Declaration of war, "21 June 1900"]
      - [Siege of the legations, "20 June – 14 August 1900 (55 days)"]
      - [Besieged in the Legation Quarter, "about 900 foreigners and 3,000 Chinese Christians"]
    markers:
