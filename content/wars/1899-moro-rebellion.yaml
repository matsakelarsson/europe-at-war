notes:
  - The Americans called the war the Moro campaigns or the Moro Rebellion and counted it as part of the Philippine–American War, which they declared over in the north in July 1902. Most of the Moros had never accepted Spanish rule and did not see themselves as rebels against a government they had never recognised.
  - Whether the people killed at Bud Dajo in 1906 were fighters or villagers who had fled in fear is disputed; the action is also called the Moro Crater massacre. Mark Twain’s “Comments on the Moro Massacre” (1906) was among the protests against it.
  - The base map shows Sulu as its own state until the United States abrogated the Bates agreement on 2 March 1904.
