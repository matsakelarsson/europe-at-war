  - title: Disarmament and Bud Bagsak
    date: 1909–1915
    when: "1913-06-11"
    borders: "1913-06-15"
    countries: [ph, us]
    body:
      - John J. Pershing, military governor of the Moro Province from November 1909, ordered on 8 September 1911 that all Moros give up their firearms and edged weapons by 1 December. Many Tausug refused, and in December 1911 some again withdrew to Bud Dajo; this time Pershing surrounded the crater and starved them out, and few were killed. In early 1913 several thousand Tausug, led by Datu Amil, fortified themselves with their families on Bud Bagsak, a mountain in eastern Jolo. Pershing persuaded many of them to come down.
      - On 11 June 1913 Pershing attacked the remaining defenders with Philippine Scouts, among them Moro companies, and American infantry. Datu Amil was killed on 12 June, and on 15 June, after artillery had been brought up, the last kota was stormed. The official count gave 240 Tausug dead, Pershing estimated 200 to 300, and some Filipino historians give 2,000 to 3,000; the attackers lost 14 killed and 25 wounded by one count.
      - Bud Bagsak is counted as the last major battle of the Moro Rebellion, though clashes went on until October 1913. In December Pershing handed over to a civilian governor, Frank Carpenter, and the Moro Province became the Department of Mindanao and Sulu. On 22 March 1915 Sultan Jamalul Kiram II signed the Carpenter agreement, giving up his temporal power and keeping his religious authority.
    facts:
      - [Disarmament order, "8 September 1911"]
      - [Battle of Bud Bagsak, "11–15 June 1913"]
      - [Carpenter agreement, "22 March 1915"]
