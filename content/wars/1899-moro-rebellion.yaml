  - title: Bud Dajo
    date: March 1906
    when: "1906-03-05"
    borders: "1906-03-07"
    countries: [ph, us]
    body:
      - In late 1905 several hundred Tausug families of Jolo, opposed to the head tax and to American rule, withdrew to the crater of Bud Dajo, an extinct volcano about 8 km south-east of Jolo town, where they planted crops and fortified the trails. The governor of Sulu, Major Hugh Scott, saw them as villagers who had fled in fear and tried to talk them down; others described them as fighters who raided the villages around. Leonard Wood, now commanding the army in the Philippines, ordered an attack.
      - From 5 to 8 March 1906 about 750 soldiers, marines and constabulary under Colonel Joseph W. Duncan climbed the steep trails to the rim, hauled up mountain guns and fired into the crater with artillery, machine guns and rifles. Of the 800 to 1,000 people in it, men, women and children, nearly all were killed; by some accounts only six survived. The Americans lost between 15 and 21 killed and about 70 wounded.
      - American newspapers reported that women and children were among the dead, and a photograph of soldiers posing above the bodies in the crater became one of the best-known images of the war. President Theodore Roosevelt congratulated Wood on a brilliant feat of arms, while anti-imperialists, among them Mark Twain, called it a massacre. Under Tasker Bliss, governor from 1906 to 1909, the province had a quieter period without punitive expeditions.
    facts:
      - [Attack on Bud Dajo, "5–8 March 1906"]
