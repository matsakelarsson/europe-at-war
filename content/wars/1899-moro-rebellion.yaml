id: moro-rebellion
name: Moro Rebellion
start: "1899-05-18"
end: "1913-06-15"
tier: B
summary: "The war between the United States and the Muslim peoples of Mindanao and the Sulu archipelago, whom Spain had never fully conquered. American troops replaced the Spanish garrisons at Jolo and Zamboanga in 1899, and to keep the south quiet while it fought the Philippine Republic in Luzon the American army signed the Bates agreement with the Sultan of Sulu, whose English text spoke of American sovereignty and whose Tausug text of protection. From 1902 American columns fought the Maranao around Lake Lanao, and from 1903 the Moro Province, under military governors Leonard Wood, Tasker Bliss and John J. Pershing, imposed a head tax, outlawed slavery, abrogated the Bates agreement (1904) and fought datus who resisted, among them Datu Ali in the Cotabato valley. In March 1906 American troops killed nearly all of the 800 to 1,000 Tausug men, women and children who had taken refuge in the crater of Bud Dajo on Jolo. Pershing’s disarmament order of 1911 led to the last great battle, at Bud Bagsak in June 1913, after which the province was handed to a civilian government; in 1915 the sultan gave up his temporal power. American losses were about 130 killed and some 500 dead of disease, while the Philippine Scouts lost more than 110 killed and the Philippine Constabulary several hundred; Moro losses were never counted, but ran to thousands."
