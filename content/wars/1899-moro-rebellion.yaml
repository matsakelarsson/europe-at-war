steps:
  - title: The Bates agreement and Lake Lanao
    date: 1899–1905
    when: "1899-08-20"
    borders: "1902-05-02"
    countries: [ph, us]
    body:
      - The Spanish withdrew from the south in 1899, and American troops took over the government at Jolo on 18 May 1899 and the fort of Zamboanga in December. Busy with the war against the Philippine Republic in Luzon, the army wanted no second war in the south. On 20 August 1899 General John C. Bates signed an agreement at Jolo with Sultan Jamalul Kiram II of Sulu. The United States promised to respect the Moros’ religion and customs and not to interfere in their internal affairs, and paid the sultan and his datus monthly sums; the English text declared American sovereignty, while the Tausug text spoke only of American support and protection. Bates later admitted that it was meant to buy time.
      - Around Lake Lanao the Maranao datus had fought the Spanish until 1898 and did not accept the Americans either. After American soldiers were killed in ambushes near Parang and Malabang in March 1902, General Adna Chaffee demanded that the killers be handed over; the datus of Bayang refused. On 2–3 May 1902 Colonel Frank Baldwin’s force stormed the kotas of Pandapatan at Bayang, on the south shore of the lake. Between 300 and 500 Maranao were killed, and the Americans lost 11 to 18 killed by different counts. From Camp Vicars, near Bayang, Captain John J. Pershing led expeditions around the lake in 1902–1903, against Butig, Bacolod, Calahui and Taraka.
      - On 1 June 1903 the Americans created the Moro Province, under military governors, with Leonard Wood as its first governor. Wood outlawed slavery and imposed a head tax, and on 2 March 1904 the United States abrogated the Bates agreement. His campaigns against datus who resisted, such as Panglima Hassan on Jolo and the Maranao of Taraka, where some 130 kotas were destroyed in 1904, cost many Moro lives. In the Cotabato valley Datu Ali, the strongest of the upriver datus, fought the Americans until he was killed by troops under Captain Frank McCoy in October 1905.
    facts:
      - [Bates agreement, "20 August 1899"]
      - [Battle of Bayang, "2–3 May 1902"]
      - [Moro Province created, "1 June 1903"]
      - [Bates agreement abrogated, "2 March 1904"]
