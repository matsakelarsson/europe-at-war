steps:
  - title: The first shots and the battle of Manila
    date: 4–5 February 1899
    when: "1899-02-04"
    borders: "1899-02-05"
    countries: [ph, us]
    body:
      - After the fall of Manila in August 1898, American troops held the city and the Republic’s army held the country around it, and the two armies faced each other along lines a few kilometres from the walls. In December Spain ceded the islands to the United States, and President McKinley proclaimed American sovereignty as “benevolent assimilation”; the Republic, inaugurated at Malolos in January 1899, claimed independence. The treaty still had to be ratified by the American Senate, where it was opposed by anti-imperialists. Talks between American and Filipino officers in January settled nothing.
      - On the evening of 4 February 1899 Private William Grayson of the 1st Nebraska Volunteers, on patrol at Santa Mesa, on the eastern edge of the city, fired on Filipino soldiers who did not halt when challenged. Firing spread along the lines through the night. The next day General Arthur MacArthur’s and General Thomas Anderson’s divisions attacked; the Filipino forces, many of whose generals were away for the weekend, were driven back. The Americans lost 44 killed and about 195 wounded; Filipino losses were far heavier, estimated at about 700 killed.
      - Aguinaldo said the firing on his side had been against his orders and sent an envoy to ask for a ceasefire and talks; General Elwell Otis refused. On 6 February the Senate ratified the treaty by 57 votes to 27, one more than the two-thirds needed. American accounts blamed Filipino patrols for provoking the clash; many Filipino historians argue that the Americans sought it to win the vote. On 10 February MacArthur’s troops took Caloocan, north of the city.
    facts:
      - [First shots, "4 February 1899, Santa Mesa"]
      - [Battle of Manila, "4–5 February 1899, American victory"]
      - [Treaty ratified by the US Senate, "6 February 1899, 57 to 27"]
