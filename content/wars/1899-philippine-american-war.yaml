id: philippine-american-war
name: Philippine–American War
start: "1899-02-04"
end: "1902-07-04"
tier: A
summary: "The war between the First Philippine Republic and the United States, which had bought the Philippines from Spain in the Treaty of Paris of December 1898. Fighting broke out around Manila on 4 February 1899, two days before the United States Senate ratified the treaty. In 1899 the American army drove the Republic’s forces from Malolos and the plain of central Luzon, took the main towns of the Visayas, and in November forced President Emilio Aguinaldo to disband his army and flee into the mountains of the north; at Tirad Pass his rearguard under Gregorio del Pilar died covering his escape. The Republic’s generals then fought a guerrilla war in their own provinces, which the Americans met with garrisons in hundreds of towns, the burning of villages, torture, and the concentration of civilians in zones where many died of hunger and disease. Aguinaldo was captured at Palanan in March 1901. After the killing of most of an American company at Balangiga on Samar in September 1901, General Jacob H. Smith ordered Samar turned into “a howling wilderness”; in Batangas General J. Franklin Bell’s reconcentration forced Miguel Malvar to surrender in April 1902. President Theodore Roosevelt declared the war over on 4 July 1902, but resistance went on for years, and the Moros of the south fought on in the Moro Rebellion. More than 4,200 American soldiers and some 16,000 to 20,000 Filipino soldiers died; modern estimates of Filipino civilian deaths, mostly from famine and disease, are around 200,000 to 250,000, with older estimates far higher."
countries: [ph, us]
