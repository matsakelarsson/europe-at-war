  - title: The guerrilla war
    date: 1900
    when: "1900-09-17"
    borders: "1900-09-17"
    countries: [ph, us]
    body:
      - With the army dispersed, the Republic’s generals fought on in their own provinces, among them Miguel Malvar in Batangas, Juan Cailles in Laguna, Mariano Trías in Cavite, Vicente Lukbán in Samar and Martín Delgado in Panay. In towns the Americans occupied, Filipino officials often served both the Americans by day and the guerrillas by night, collecting taxes and supplies for them, and the guerrillas punished those who sided with the Americans. The American army, which grew to about 70,000 men, spread out into hundreds of small garrisons.
      - In September 1900 the guerrillas won two of their best-known victories. On 13 September, at Pulang Lupa on the island of Marinduque, Colonel Maximo Abad’s men surrounded an American company and forced it to surrender. On 17 September, at Mabitac in Laguna, Juan Cailles’s men beat back an attack by about 300 American volunteers across flooded ground; by the American count 21 Americans were killed and 23 wounded. Many Filipinos hoped that William Jennings Bryan, an opponent of the war, would win the American presidential election of November 1900, but McKinley was re-elected.
      - The Americans then hardened their policy. In December 1900 General MacArthur, now military governor, proclaimed that guerrillas who fought out of uniform and civilians who helped them were outside the protection of the laws of war, and leaders of the resistance such as Apolinario Mabini and Artemio Ricarte were deported to Guam. At the same time the civilian commission under William Howard Taft set up town and provincial governments, and Filipinos who favoured American rule founded the Federal Party; Filipino scouts, such as the Macabebes of Pampanga, served in growing numbers with the American army.
