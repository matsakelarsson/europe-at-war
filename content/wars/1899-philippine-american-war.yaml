  - title: Aguinaldo captured
    date: March – April 1901
    when: "1901-03-23"
    borders: "1901-03-23"
    countries: [ph, us]
    body:
      - In February 1901 the Americans captured a courier carrying Aguinaldo’s letters and learned where he was. General Frederick Funston planned a ruse. About 80 Macabebe scouts, dressed as Filipino soldiers and accompanied by a few former officers of the Republic, were to pretend to be reinforcements bringing American prisoners, Funston and four other officers. The gunboat Vicksburg landed them at Casiguran Bay on 14 March, and they marched up the coast for more than a week, close to starving, sending forged letters ahead.
      - On 23 March 1901 they entered Palanan, where Aguinaldo’s guard welcomed them, opened fire on the guard and seized Aguinaldo. He was taken to Manila, swore allegiance to the United States on 1 April and on 19 April issued a proclamation calling on his countrymen to accept American rule. Many generals surrendered in the following months, but Malvar in Batangas and Lukbán in Samar fought on.
    facts:
