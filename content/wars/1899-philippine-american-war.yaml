  - title: Resistance after 1902
    date: 1902–1911
    when: "1902-07-04"
    borders: "1906-07-14"
    countries: [ph, us]
    body:
      - Fighting did not stop with Roosevelt’s proclamation. The American authorities and the new Philippine Constabulary treated those who fought on as bandits; the Brigandage Act of November 1902 made membership of an armed band a crime punishable by death or long imprisonment. Macario Sakay, a former member of the Katipunan, proclaimed a Tagalog Republic in 1902 and led guerrillas in the mountains of Rizal, Laguna, Cavite and Batangas. In July 1906 he came down on a promise of amnesty negotiated by the labour leader Dominador Gómez, was arrested, tried as a bandit and hanged in Manila on 13 September 1907.
      - On Samar and Leyte the Pulahanes, a religious movement of poor farmers named for the red they wore, rose from 1902 and fought the Constabulary and American troops until about 1907, and small bands held out until 1911. In Albay Simeón Ola surrendered in 1903; Artemio Ricarte, who had refused to swear allegiance, returned secretly in 1903 to start a new rising and was captured in 1904. In several provinces the Americans again concentrated the population.
      - In the Muslim south the Moros fought the Americans until 1913, in the Moro Rebellion. The Philippines elected its first assembly in 1907, was promised independence in the Jones Act of 1916, became a self-governing commonwealth in 1935 and became independent on 4 July 1946.
    facts:
      - [Brigandage Act, "November 1902"]
      - [Sakay surrenders, "July 1906"]
      - [Sakay hanged, "13 September 1907, Manila"]
