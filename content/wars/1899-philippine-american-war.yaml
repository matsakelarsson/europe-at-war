  - title: Malolos, Calumpit and the death of Luna
    date: February – June 1899
    when: "1899-03-31"
    borders: "1899-06-05"
    countries: [ph, us]
    body:
      - MacArthur’s division advanced north along the railway from Manila to Dagupan, the main road into central Luzon. Malolos, the Republic’s capital, was taken on 31 March 1899; the government moved to San Isidro and later to Cabanatuan and Tarlac. The Americans forced the crossings of the Bagbag and Pampanga rivers at Calumpit in late April and took San Fernando on 5 May, while General Henry Lawton’s column marched up the eastern side of the plain and took San Isidro on 17 May. South of Manila, Lawton beat the Filipinos at the Zapote river on 13 June.
      - In the Visayas, American troops took Iloilo on 11 February after a naval bombardment, and Cebu, whose leaders surrendered the town, later that month. On Negros the planters who had risen against Spain accepted American rule. The fighting moved to the countryside, where Martín Delgado’s forces on Panay and Arcadio Maxilom’s on Cebu held out.
      - Antonio Luna, a pharmacist and scientist who had studied in Europe and became the Republic’s ablest general, tried to stop the American advance with lines of trenches and strict discipline, which made him many enemies among Aguinaldo’s officers. On 5 June 1899, called to Aguinaldo’s headquarters at Cabanatuan, he was killed by soldiers of the Kawit company of Aguinaldo’s guard. Who ordered his killing is still debated. The rainy season then halted the American offensive.
    facts:
