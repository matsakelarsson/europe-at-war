  - title: Balangiga and Samar
    date: September 1901 – April 1902
    when: "1901-09-28"
    borders: "1901-09-28"
    countries: [ph, us]
    body:
      - On Samar, General Vicente Lukbán still led the resistance. In August 1901 Company C of the 9th Infantry, 74 men, was posted at the coastal town of Balangiga. Its captain had the town’s men detained, their rice and bolos confiscated and food crops cut down, and set them to work clearing the town. On the morning of 28 September 1901, planned by Captain Eugenio Daza of Lukbán’s forces and led by the town’s police chief Valeriano Abanador, townspeople and fighters, some disguised as women, attacked the soldiers at breakfast. By most counts 48 to 54 of the Americans were killed or died of their wounds; about 28 of the attackers were killed. American accounts call it the Balangiga massacre; many Filipino historians keep that name for what followed.
      - Brigadier General Jacob H. Smith ordered Major Littleton Waller’s marines to kill and burn, to kill everyone over the age of ten and to make the interior of Samar “a howling wilderness”. Towns, crops and boats were burned, and food was cut off. Estimates of the Filipinos killed on Samar in the months that followed range from about 2,000 to much higher figures given by some Filipino historians. On a march across the island in December 1901 and January 1902 Waller’s marines ran short of food, and he had eleven Filipino porters shot.
      - In the United States the reports caused an outcry. Waller was court-martialled for the killing of the porters and acquitted; Smith was court-martialled, admonished and retired. Lukbán was captured in February 1902 and his men surrendered in April. American soldiers took the bells of Balangiga’s church as trophies; they were returned to the town in December 2018.
    facts:
      - [Attack at Balangiga, "28 September 1901"]
      - [Americans killed, "48–54 of 74, by different counts"]
      - [Lukbán captured, "February 1902"]
