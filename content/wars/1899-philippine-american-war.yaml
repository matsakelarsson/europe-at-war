  - title: Batangas, Malvar and the end of the war
    date: December 1901 – July 1902
    when: "1901-12-25"
    borders: "1902-04-16"
    countries: [ph, us]
    body:
      - Miguel Malvar, the last of the Republic’s generals still fighting in Luzon, led the guerrillas of Batangas, Laguna and Tayabas, where the towns supported him. In December 1901 Brigadier General J. Franklin Bell ordered the people of Batangas and the neighbouring districts to move, by 25 December, into protected zones around the garrison towns. Outside them crops, livestock and houses were destroyed and men were treated as enemies; inside them, crowded and short of food, thousands died of malaria, dysentery and other diseases. The historian Andrea Pitzer puts the deaths caused by Bell’s policy at more than 11,000; other estimates of the war’s toll in Batangas are higher.
      - Malvar surrendered at Rosario, in Batangas, on 16 April 1902, citing the lack of food in the field caused by the concentration, and was then taken to Bell at Lipa. On 1 July 1902 the American Congress passed the Philippine Organic Act, which provided for an elected Philippine Assembly, and on 4 July President Theodore Roosevelt proclaimed the insurrection over everywhere except in the Moro lands of the south, with an amnesty for those who swore allegiance.
      - By then more than 4,200 American soldiers had died, about three-quarters of them of disease. American estimates put the Filipino soldiers killed at 16,000 to 20,000. Most modern historians estimate that 200,000 to 250,000 Filipino civilians died, chiefly of hunger and disease, in a war that had wrecked harvests and herds and was followed by a cholera epidemic; older estimates run to a million or more.
    facts:
      - [Protected zones ordered, "December 1901"]
      - [Malvar surrenders, "16 April 1902, Rosario, Batangas"]
      - [War declared over, "4 July 1902"]
      - [American dead, "more than 4,200"]
