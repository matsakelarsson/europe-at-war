notes:
  - The United States government long called the war the Philippine Insurrection, treating it as a rising against lawful American sovereignty; Filipino historians see it as the continuation of the Philippine Revolution and a war of national independence. Most historians now call it the Philippine–American War. Americans at the time also called the Filipino fighters insurgents and, after 1902, ladrones (bandits), the term of the Brigandage Act.
  - Numbers of dead are uncertain. The American army counted its own dead (1,020 killed in action and about 3,200 dead of disease); its counts of Filipino dead were guesses. Estimates of civilian deaths depend on how deaths from famine, disease and the cholera epidemic of 1902, which killed at least 150,000 people, are counted.
  - Both sides committed atrocities. American soldiers burned villages, tortured prisoners with the “water cure” and killed prisoners and civilians, as the Senate hearings of 1902 showed; Filipino guerrillas also killed prisoners and townspeople who worked with the Americans.
  - The base map shows Spain in the Philippines until the Treaty of Paris came into force on 11 April 1899, and the United States after; the land held by each side is drawn in the steps.
