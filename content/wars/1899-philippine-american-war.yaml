  - title: The northern offensive and Tirad Pass
    date: October – December 1899
    when: "1899-11-07"
    borders: "1899-12-02"
    countries: [ph, us]
    body:
      - When the rains ended, Otis, now with large reinforcements of volunteer regiments, tried to trap Aguinaldo in central Luzon with three columns. MacArthur pushed up the railway and took Tarlac, the Republic’s last capital, on 12 November 1899. Lawton swept up the eastern side of the plain to San José and the passes into the north. General Loyd Wheaton sailed from Manila and landed at San Fabian on the Lingayen Gulf on 7 November to close the roads to the north.
      - At Bayambang in Pangasinan, Aguinaldo and his generals decided on 12–13 November to disband the regular army and to fight on as guerrillas, each general in his own region. Aguinaldo fled north with his family, his cabinet and a small escort through La Union and Ilocos Sur. To cover his escape Gregorio del Pilar, a 24-year-old general, held the narrow Tirad Pass with 60 men against more than 500 of Major Peyton March’s 33rd Volunteer Infantry on 2 December 1899. Del Pilar and 52 of his men were killed; the Americans lost two or three killed.
      - Aguinaldo escaped into the Cordillera and, after months on the move, settled in September 1900 at Palanan, a remote town on the Pacific coast of Isabela. On 19 December 1899 Lawton, the highest-ranking American officer to die in the war, was killed by a sharpshooter of Licerio Gerónimo’s forces at Paye, near San Mateo.
