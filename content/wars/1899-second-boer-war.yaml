  - title: The Peace of Vereeniging
    date: April – May 1902
    when: "1902-05-31"
    borders: "1902-05-31"
    countries: [za, gb]
    body:
      - "By 1902 the Boer leaders knew that their people could not hold out much longer: their families were in camps or starving on the veld, and they feared an African rising in the Transvaal. Meeting at Klerksdorp in April, they opened talks with Kitchener and Milner in Pretoria. Sixty delegates of the commandos then met at Vereeniging from 15 May; the Transvalers wanted peace, the Free Staters to fight on. On 31 May they voted 54 to 6 to accept the British terms, and that night the leaders signed the treaty at Melrose House in Pretoria."
      - "The republics accepted the British Crown. The Boers who surrendered kept their property and their rifles for protection; Dutch was allowed in schools and courts; Britain paid £3 million towards rebuilding the farms and promised self-government in time, which came in 1906–1907. The Cape rebels lost the vote for five years. By article 8, the question of giving the vote to Africans was to be decided only after self-government, which in practice meant never: Africans who had hoped that a British victory would bring them equal rights were bitterly disappointed."
      - "About 22,000 soldiers of the empire died, two-thirds of them from disease, and some 6,000–7,000 Boer fighters; at least 14,000 Africans died in the camps, and an unknown number in the fighting and in service. About 24,000 Boer prisoners had been sent to camps in Ceylon, St Helena, Bermuda and India. In 1910 the two former republics joined the Cape and Natal as the Union of South Africa, governed by Botha and Smuts and by an electorate that was almost entirely white."
    facts:
      - [Delegates meet at Vereeniging, "15–31 May 1902"]
      - [Treaty signed, "31 May 1902, Melrose House, Pretoria"]
      - [Imperial deaths, "about 22,000"]
      - [Boer fighters killed or dead of disease, "about 6,000–7,000"]
