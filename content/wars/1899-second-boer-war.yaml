id: second-boer-war
name: Second Boer War
start: "1899-10-11"
end: "1902-05-31"
tier: A
summary: "The war in which the British Empire conquered the two Boer republics, the South African Republic (Transvaal) and the Orange Free State. The discovery of gold on the Witwatersrand in 1886 had made the Transvaal the richest state in southern Africa; Britain, pressed by the mining houses and by its high commissioner Alfred Milner, demanded the vote for the mostly British immigrants (Uitlanders), and the republics struck first in October 1899. Boer commandos besieged Ladysmith, Kimberley and Mafeking and defeated three British armies in “Black Week” (December 1899), but a huge imperial army under Lord Roberts relieved the towns and took Bloemfontein, Johannesburg and Pretoria by June 1900. The Boers then fought a guerrilla war for two more years. Lord Kitchener answered with blockhouse lines, the burning of farms and the internment of Boer and African civilians in camps, where some 28,000 Boers, most of them children, and at least 14,000 and probably more than 20,000 Africans died. The Peace of Vereeniging (31 May 1902) made the republics British colonies; in 1910 they joined the Union of South Africa. About 22,000 soldiers of the empire and some 6,000–7,000 Boer fighters died. Many South Africans now call it the South African War, since Africans fought, worked and died on both sides."
countries: [za, gb, au, ca, nz, ls, bw, sz]
sides:
  - id: boer
    name: The Boer republics (with Cape rebels)
    polities: [transvaal, orange-free-state]
    ink: orange
    moves: Boer moves
    success: Boer success
  - id: brit
    name: The British Empire
    polities: [united-kingdom, cape-colony, natal, rhodesia-bsac, canada, australia, new-zealand]
    ink: red
    moves: British moves
    success: British success
notes:
  - "Names: in Afrikaans the Tweede Vryheidsoorlog (Second War of Independence) or Anglo-Boereoorlog; in Britain the Boer War; many South African historians prefer the South African War."
  - "Britain annexed the Orange Free State as the Orange River Colony on 28 May 1900 and proclaimed the annexation of the Transvaal on 1 September 1900. The republics did not accept this and kept their governments in the field, so the base map shows them until the Peace of Vereeniging; the land held by British troops is drawn as an area."
  - "Figures: about 448,000 soldiers served on the imperial side, including some 82,000 colonial troops, about 52,000 of them raised in southern Africa and about 30,000 from Australia, Canada and New Zealand; the Boers mustered perhaps 87,000 men in all, including about 13,000 Cape rebels and foreign volunteers. Imperial deaths were about 22,000, two-thirds of them from disease. The figures for the camps follow the post-war registers and the work of historians cited below."
