  - title: The camps
    date: 1900–1902
    when: "1901-10-01"
    borders: "1901-10-01"
    countries: [za, gb]
    body:
      - "The British first set up camps in 1900 for the families of Boers who had surrendered. Under Kitchener’s sweeps they became a means of war: women, children and old men driven from burned farms were held in tented camps along the railways, 45 for Boers, which held more than 100,000 people at their height. Food was scarce, the tents were crowded, water and sanitation were poor and medical care was lacking, and measles, pneumonia, typhoid and dysentery spread fast. The death rate peaked in October 1901. By the registers kept after the war 27,927 Boers died in the camps: 22,074 children under sixteen, 4,177 women and 1,676 men; estimates by later historians range from about 26,000 to 28,000."
      - "Africans driven from Boer farms and from their own homes were held in separate camps, 64 to 66 of them by different counts, which held about 115,000 people by May 1902. They were made to grow their own food or to work for the army to earn rations. The records are incomplete: at least 14,154 deaths were registered, most of them children, and historians estimate that the true number was 20,000 or more. These camps were long left out of the history of the war, and are now remembered alongside the Boer camps."
      - "The welfare campaigner Emily Hobhouse visited the camps of the Orange River Colony in early 1901 and published a report in June that caused an outcry in Britain; the Liberal leader Henry Campbell-Bannerman called the policy “methods of barbarism”. The government sent a commission of women led by Millicent Fawcett, which confirmed the conditions in the Boer camps but did not visit the African camps. Civilian administrators took over the camps in November 1901, and the death rate fell sharply in 1902."
    facts:
      - [Camps for Boers, "45; more than 100,000 people at their height"]
      - [Recorded Boer deaths, "27,927, of them 22,074 children"]
      - [Camps for Africans, "64–66; about 115,000 people by May 1902"]
      - [African deaths, "at least 14,154 recorded; probably 20,000 or more"]
