  - title: Spion Kop and the relief of Ladysmith
    date: January – February 1900
    when: "1900-01-24"
    borders: "1900-01-24"
    countries: [za, gb]
    view:
      center: [29.67, -28.66]
      size: [70, 50]
    body:
      - "Buller tried again to break through to Ladysmith by crossing the Tugela upstream, west of Colenso. On the night of 23 January 1900 a force under General Charles Warren seized the summit of Spion Kop, a hill commanding the Boer line. At dawn the soldiers found that their shallow trench lay exposed to Boer guns and rifles on the surrounding heights. Boers led by Louis Botha counter-attacked, and all day both sides fought at close range on the crowded hilltop. That night both sides withdrew, but the Boers returned first. The British lost 243 killed and about 1,250 wounded, the Boers 68 killed and 267 wounded."
      - "Inside Ladysmith the garrison and the townspeople lived on horse meat; typhoid and dysentery killed more people than the shelling. Buller failed again at Vaal Krantz (5–7 February), and then, using his artillery to support each infantry attack, fought his way up the hills north of Colenso in the Battle of the Tugela Heights (14–27 February). On 27 February, the anniversary of Majuba, his troops took Pieters Hill and the Boer line broke. British cavalry rode into Ladysmith on 28 February, after a siege of 118 days."
    facts:
