steps:
  - title: Gold, the Uitlanders and the ultimatum
    date: 1886 – October 1899
    when: "1899-10-11"
    borders: "1899-10-11"
    countries: [za, gb]
    body:
      - "After the First Boer War the South African Republic was self-governing, and in 1886 gold was found on the Witwatersrand. Johannesburg grew within a decade into a city of some 100,000 people; tens of thousands of foreign miners and businessmen, the Uitlanders, mostly British, came to work the reefs, and about 100,000 African migrant workers laboured in the mines under contracts and pass laws. President Paul Kruger’s government taxed the industry, kept a monopoly on dynamite and gave the vote to newcomers only after fourteen years’ residence, fearing that the Uitlanders would outvote the burghers and hand the republic to Britain."
      - "Cecil Rhodes, prime minister of the Cape Colony and a mine owner, backed a plot for an Uitlander rising in Johannesburg. On 29 December 1895 his associate Leander Starr Jameson rode into the Transvaal from Bechuanaland with about 600 men, most of them company police, but the rising never came, and on 2 January 1896 the raiders surrendered to Boer commandos at Doornkop. The Jameson Raid drove the Orange Free State into a military alliance with the Transvaal, and both republics bought modern Mauser rifles and Krupp and Creusot artillery in Europe."
      - "Alfred Milner, British high commissioner from 1897, and the colonial secretary Joseph Chamberlain took up the Uitlanders’ grievances as a test of British supremacy in southern Africa. A conference between Milner and Kruger at Bloemfontein in May–June 1899 failed, and Britain sent reinforcements. On 9 October 1899 the Transvaal demanded that the troops on its borders be withdrawn and those at sea turned back within 48 hours. Britain rejected the ultimatum, and the war began on 11 October with the Orange Free State at the Transvaal’s side. The Boers had about 40,000 men under arms at the start, against some 27,000 British troops in South Africa."
    facts:
      - [Gold found on the Witwatersrand, "1886"]
      - [Jameson Raid, "29 December 1895 – 2 January 1896"]
      - [Bloemfontein conference, "31 May – 5 June 1899"]
      - [Boer ultimatum expires, "11 October 1899"]
