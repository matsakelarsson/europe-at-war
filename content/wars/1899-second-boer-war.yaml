  - title: Roberts’s advance
    date: February – October 1900
    when: "1900-02-27"
    borders: "1900-06-05"
    countries: [za, gb]
    body:
      - "Roberts gathered a large army on the western railway and in February 1900 swung east around the Boer lines at Magersfontein. General John French’s cavalry rode through to relieve Kimberley on 15 February. Cronjé, retreating east with several thousand men and many women and children in his wagon laager, was trapped on the Modder River at Paardeberg. A costly British attack on 18 February failed, but after nine days of shelling Cronjé surrendered with about 4,000 men on 27 February, the anniversary of Majuba."
      - "Roberts entered Bloemfontein on 13 March, where typhoid struck his army; Christiaan de Wet ambushed a British column at Sanna’s Post, near the city’s waterworks, on 31 March. In May the advance resumed along the railway north. Mafeking was relieved on 17 May by columns from the south and from Rhodesia, after a siege of 217 days in which the Barolong and other Africans in the town suffered most from hunger. Britain annexed the Free State as the Orange River Colony on 28 May; Roberts took Johannesburg on 31 May and Pretoria on 5 June, as the Transvaal government withdrew east along the railway to Mozambique."
      - "Roberts beat Botha at Diamond Hill (Donkerhoek) on 11–12 June and, joined by Buller’s army from Natal, at Bergendal on 27 August, the last set-piece battle of the war. On 1 September he proclaimed the annexation of the Transvaal. Kruger crossed into Mozambique and in October sailed for Europe on a Dutch warship to seek help that never came; British troops reached Komatipoort on the Mozambique border on 24 September. Believing the war won, Roberts handed over to Kitchener on 29 November 1900 and went home."
    facts:
      - [Kimberley relieved, "15 February 1900"]
      - [Cronjé surrenders at Paardeberg, "27 February 1900 (about 4,000 men)"]
      - [Mafeking relieved, "17 May 1900"]
      - [Pretoria taken, "5 June 1900"]
      - [Annexation of the Transvaal proclaimed, "1 September 1900"]
