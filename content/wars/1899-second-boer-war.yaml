  - title: Black Week
    date: November – December 1899
    when: "1899-12-11"
    borders: "1899-12-11"
    countries: [za, gb]
    body:
      - "General Sir Redvers Buller arrived with an army corps and split it into three. Lord Methuen advanced north along the western railway to relieve Kimberley and fought his way past Boer positions at Belmont (23 November), Graspan (25 November) and the Modder River (28 November), where the Boer general Koos de la Rey had his men dig in on the river banks rather than on the hills. In the northern Cape, General William Gatacre was to hold back the commandos and the Cape rebels, while Buller himself went to Natal to relieve Ladysmith."
      - "In a single week the three columns were defeated. On 10 December Gatacre’s night march on the Boer position at Stormberg went astray; more than 600 of his soldiers were left behind and captured. On 11 December Methuen’s Highland Brigade, advancing in close order before dawn, ran into Boer rifle pits dug by De la Rey and Cronjé at the foot of the hills of Magersfontein and lost some 950 men killed, wounded and missing. On 15 December Buller’s frontal attack across the Tugela at Colenso was stopped by Louis Botha’s riflemen, hidden in trenches along the river; the British lost about 1,100 men and ten guns."
      - "Black Week cost the British about 2,800 men killed, wounded and captured, and shocked public opinion across the empire. The government sent Field Marshal Lord Roberts, with Lord Kitchener as his chief of staff, to take over command, called up the reserves and accepted volunteers from Britain and contingents from Australia, Canada, New Zealand and other colonies."
    facts:
      - [Battle of Stormberg, "10 December 1899"]
      - [Battle of Magersfontein, "11 December 1899"]
      - [Battle of Colenso, "15 December 1899"]
      - [British losses in Black Week, "about 2,800 killed, wounded and captured"]
