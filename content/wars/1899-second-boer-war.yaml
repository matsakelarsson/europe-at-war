  - title: The guerrilla war
    date: 1900–1902
    when: "1901-06-01"
    borders: "1901-06-01"
    countries: [za, gb]
    body:
      - "Thousands of Boers laid down their arms in 1900, but the leaders who fought on, the “bitter-enders”, among them Christiaan de Wet and the Free State president Marthinus Steyn, Louis Botha, Koos de la Rey and the young Jan Smuts, broke their forces into mobile commandos that lived off the land, cut railways and telegraphs and attacked British convoys and columns. De Wet escaped one British drive after another; commandos raided into the Cape Colony, where several thousand Cape Afrikaners joined them as rebels, and in 1901–1902 Smuts led a commando through the Cape as far as the copper mines of Namaqualand."
      - "Kitchener answered by stripping the land. British columns burned tens of thousands of Boer farms and many African homesteads, killed or carried off the livestock and destroyed the crops, and the families left on the veld were taken to camps. More than 8,000 blockhouses linked by barbed-wire fences divided the country into sections, guarded by over 50,000 British soldiers and up to 16,000 armed Africans, and columns of mounted troops swept each section in turn in great drives. The commandos, perhaps 20,000–30,000 men by 1901, still won victories: Botha overran a British column at Bakenlaagte on 30 October 1901, and De la Rey routed and captured Lord Methuen at Tweebosch on 7 March 1902."
      - "Africans were drawn deeper into the fighting. The British army employed more than 100,000 Africans as wagon drivers, scouts, guards and labourers, and armed perhaps 10,000–30,000 of them, while the Boers executed many Africans they suspected of helping the British. Some African communities used the war to take back land and cattle from Boer farms. At the end of January 1902 a commando under Manie Maritz killed between about 35 and 43 Nama (Khoikhoi) residents of the mission at Leliefontein in Namaqualand, and on 6 May 1902 at Holkrans in the south-eastern Transvaal abaQulusi Zulu fighters, whose cattle had been seized, killed 56 men of a Boer commando."
    facts:
      - [Kitchener takes command, "29 November 1900"]
      - [Blockhouses, "more than 8,000"]
      - [Battle of Bakenlaagte, "30 October 1901"]
      - [Battle of Tweebosch, "7 March 1902; Methuen captured"]
    markers:
      - kind: battle
        side: boer
        name: Bakenlaagte
