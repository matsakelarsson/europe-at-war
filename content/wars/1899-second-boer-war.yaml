  - title: The Boer offensives and the sieges
    date: October – November 1899
    when: "1899-11-02"
    borders: "1899-11-02"
    countries: [za, gb]
    body:
      - "The Boers struck before British reinforcements could arrive. In the west, commandos under Piet Cronjé cut the railway and on 13 October began the siege of Mafeking, where Colonel Robert Baden-Powell held the town with about 1,500 soldiers, police and town guards and several hundred armed Africans; the Barolong of the adjoining African town (stadt) bore much of the hunger of the siege. On 14 October Free Staters began the siege of Kimberley, the diamond town, with Cecil Rhodes inside it."
      - "The main Boer army under Commandant-General Piet Joubert, some 15,000–20,000 men, invaded Natal from the north and west. At Talana Hill near Dundee on 20 October the British drove the Boers off the hill but lost their commander, General Penn Symons, and had to retreat; at Elandslaagte on 21 October British cavalry routed a commando of Germans, Hollanders and Transvalers. On 30 October, “Mournful Monday”, General Sir George White’s attack north of Ladysmith failed and more than 800 of his soldiers were captured at Nicholson’s Nek. From 2 November about 13,000 British troops were besieged in Ladysmith."
      - "In November Boer commandos crossed the Orange River into the north of the Cape Colony, where many Cape Afrikaners joined them, and a Boer force probed south of the Tugela towards Estcourt before withdrawing. Instead of driving on to the ports, the Boers settled down around the besieged towns. Commanders on both sides used African labour on a large scale, as drivers, scouts, diggers and servants; the Boers forbade Africans to bear arms, but both sides armed some of them."
    facts:
      - [Siege of Mafeking begins, "13 October 1899"]
      - [Siege of Kimberley begins, "14 October 1899"]
      - [Battle of Talana Hill, "20 October 1899"]
      - [Siege of Ladysmith begins, "2 November 1899"]
