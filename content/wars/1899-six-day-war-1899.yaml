id: six-day-war-1899
name: Six-Day War (1899)
start: "1899-04-14"
end: "1899-04-19"
tier: C
summary: "A brief war in April 1899 between British forces and the clans of the New Territories of Hong Kong, which China had leased to Britain for 99 years by the Convention of Peking of June 1898. Fearing the loss of their land rights, the powerful lineages of the Punti villages, led by the Tang clan, raised a militia of some 2,600 men. On 14 April 1899 they burned the matsheds put up for the flag-raising ceremony at Tai Po; British and Indian troops sent there were besieged on Flagstaff Hill until the destroyer HMS Fame shelled the militia. The British then drove the militia from Lam Tsuen and Sheung Tsuen on 17 and 18 April, and the villages surrendered on 19 April. About 500 militiamen were killed; the British suffered only a few wounded. The gates of the Tang walled village of Kat Hing Wai were removed and taken to the governor’s house in Ireland. In May British troops also expelled the Chinese officials from the Kowloon Walled City. Governor Henry Blake afterwards chose conciliation, and the villagers’ customary land and inheritance rights were respected under British rule."
