  - title: The Illig agreement and the stone forts
    date: 1905–1912
    when: "1905-03-05"
    borders: "1910-03-01"
    countries: [so, gb, it]
    body:
      - "On 5 March 1905, through the Italian consul Giulio Pestalozza, Hassan signed the Illig agreement, which let the Dervishes settle in the Nugal valley and on the coast at Illig under Italian protection and bound them to keep the peace with Italy, Britain and Ethiopia. Illig (Eyl) was the movement’s headquarters until 1909. By 1908 the Dervishes were raiding British-protected clans again, and a mediation by General Reginald Wingate failed in 1909, while in London Parliament debated a war whose cost was put at over £5 million."
      - "The British then gave up the interior. In 1909–1910 they withdrew their posts to the coastal towns of Berbera, Bulhar and Zeila and armed the clans opposed to Hassan, chiefly Isaaq, to defend themselves. The interior fell into years of raiding between the Dervishes and the clans and among the clans themselves, and with drought it brought famine; much of the war’s death toll fell in these years. The Dervishes built a state of stone forts, some raised by masons brought from Yemen: Taleh, from 1909–1910 their capital in the Dhulbahante country of the upper Nugal, with a great fortress and some fourteen forts, and outposts at Jidali, Shimbiris and other places, from which their raiders reached far to the west."
    facts:
      - [Illig (Pestalozza) agreement, "5 March 1905"]
      - [British withdrawal to the coast, "1909–1910"]
      - [Taleh, "Dervish capital from about 1910"]
    markers:
