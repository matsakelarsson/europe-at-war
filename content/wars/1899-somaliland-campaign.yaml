  - title: Gumburu and Daratoleh
    date: January – June 1903
    when: "1903-01"
    borders: "1903-04-17"
    countries: [so, et, gb, it]
    body:
      - "The third expedition, under Brigadier General William Manning, brought in British, Indian and King’s African Rifles battalions from Nyasaland and elsewhere. With Italy’s consent it landed at Obbia (Hobyo) on the Indian Ocean coast and marched inland to Galkayo and Galadi, while a column from Bohotle came down from the north and an Ethiopian army of about 5,000 men moved into the Ogaden, to trap the Dervishes between them."
      - "Instead the Dervishes struck the British advance guard. On 17 April 1903 at Gumburu, some 65 km west of Galadi, a detachment under Lieutenant Colonel Arthur Plunkett, about 200 men of the King’s African Rifles and the Sikhs, was surrounded by Dervish horsemen and riflemen, among them a cavalry force led by Sultan Nur, and killed almost to a man after its ammunition ran out: nine British officers and 187 African soldiers died. Five days later at Daratoleh a column under Major John Gough lost about a quarter of its men before it broke off the fight. Manning’s force withdrew to the coast by the end of June."
    facts:
      - [Landing at Obbia (Hobyo), "early 1903"]
      - [Gumburu, "17 April 1903, Dervish success"]
      - [Daratoleh, "22 April 1903"]
