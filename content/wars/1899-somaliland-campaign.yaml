        date: 9 February 1920
        text: Bombed on 2–3 February and taken on 9 February. Hassan escaped with a few followers; his commanders Haji Sudi and Ibrahim Boghol were killed.
        lonlat: [48.418, 9.147]
      - kind: event
        name: Imi
        date: 21 December 1920
        text: Hassan died here after fleeing into Ethiopia. His tomb is in the town.
        lonlat: [42.167, 6.467]
