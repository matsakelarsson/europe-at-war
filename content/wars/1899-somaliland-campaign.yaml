    polities: [ethiopia]
    ink: gold
    moves: Ethiopian moves
    success: Ethiopian success
notes:
  - "“Dervish” (Somali daraawiish) was the movement’s own name for its fighters. “Mad Mullah” was the British name for Mohammed Abdullah Hassan; Somalis call him Sayyid Mohammed. Somali place names are given in the forms of the English sources, with the Somali forms in brackets where they differ much (Bohotle for Buuhoodle, Illig for Eyl)."
  - "Most of what is written about the war comes from British and Italian officers and officials; Somali poetry and oral history, including Hassan’s own poems, give the Dervish side. Numbers of Dervish fighters and of their losses are British estimates. The estimate that about a third of the population of British Somaliland died in the war years (100,000–150,000 people by some counts) covers the deaths from inter-clan raiding, hunger and disease as well as the fighting."
  - Several battle sites (Erigo, Gumburu, Daratoleh) are known only from the officers’ reports; the markers give their approximate positions.
