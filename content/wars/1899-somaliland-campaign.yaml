  - title: Dul Madoba and the Dervish raids
    date: 1913–1919
    when: "1913-08-09"
    borders: "1913-08-09"
    countries: [so, et, gb, it]
    body:
      - "In 1912 the British raised a small Camel Constabulary under Richard Corfield to protect the clans near the coast. On 9 August 1913 Corfield, against his orders, attacked a Dervish force of about 2,000 men at Dul Madoba, some 40 km south-east of Burao. He was killed with 35 of his 110 men, and the Dervishes kept thousands of captured camels and sheep. They sacked the British station at Burao in September 1913 and in March 1914 raided the outskirts of Berbera itself."
      - "Britain rebuilt the force as the Somaliland Camel Corps, which in February 1915 took the Dervish forts on Mount Shimbiris. During the First World War the Ottoman and German governments wrote to Hassan as an ally, and Lij Iyasu, the uncrowned ruler of Ethiopia, sought ties with him; Iyasu’s overthrow in September 1916 ended that. In the south the Dervishes took the Italian fort at Bulo Burti on the Shebelle in March 1916 before Italian colonial troops drove them out, and in 1919 forces of the Hobyo sultanate beat them in the south. Hassan still ruled from Taleh, but his raids had made enemies of most of the clans around him."
    facts:
      - [Dul Madoba, "9 August 1913, Dervish success"]
      - [Burao sacked, "September 1913"]
      - [Shimbiris forts taken, "February 1915"]
      - [Iyasu deposed in Ethiopia, "September 1916"]
