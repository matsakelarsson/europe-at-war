  - title: Swayne’s expeditions and Erigo
    date: 1901–1902
    when: "1901-05"
    borders: "1901-06-01"
    countries: [so, et, gb]
    body:
      - "Britain answered with a levy of about 1,500 Somali soldiers under Lieutenant Colonel Eric Swayne, while Menelik II sent some 15,000 Ethiopian troops east from Harar to close the Ogaden. In the spring and summer of 1901 Swayne’s levies fought the Dervishes in the Haud, took thousands of their camels and drove them east, but after about three months Hassan crossed into the Majeerteen country claimed by Italy and escaped. By October 1901 the British put his following at about 12,000 men with 1,000 rifles."
      - "In the summer of 1902 the Dervishes took Galkayo in the Mudug. Swayne advanced again from his base at Bohotle with some 2,300 men. On 6 October 1902, in thick bush at Erigo, about 110 km north of Galkayo, the Dervishes ambushed his column at close range. Two British officers and some 140 soldiers and levies were killed, and the column fell back in disorder, leaving a Maxim gun behind; Swayne withdrew to Bohotle. London decided that a regular army was needed."
    facts:
      - [First expedition, "May–July 1901"]
      - [Ethiopian army from Harar, "about 15,000 men"]
      - [Battle of Erigo, "6 October 1902, Dervish success"]
    markers:
      - kind: event
        side: gb
        name: Bohotle (Buuhoodle)
        date: 1901–1903
        text: The British fortified post on the edge of the Haud, base of Swayne’s columns and later of the 1903 and 1904 expeditions.
        lonlat: [46.330, 8.240]
        lp: l
      - kind: taken
        side: der
        name: Galkayo
        date: Summer 1902
        text: Taken by the Dervishes in 1902; the wells of the Mudug gave them a base deep in the Italian sphere.
        lonlat: [47.430, 6.770]
      - kind: battle
        side: der
        name: Erigo
        date: 6 October 1902
        text: Swayne’s column of about 2,300 men was ambushed in thick bush. Two British officers and some 140 soldiers and levies were killed; the British counted 62 Dervish dead. The site is given as about 110 km north of Galkayo.
        lonlat: [47.350, 7.780]
