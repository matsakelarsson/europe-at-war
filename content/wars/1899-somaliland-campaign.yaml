  - title: Jidballi and Illig
    date: January – April 1904
    when: "1904-01-10"
    borders: "1904-01-10"
    countries: [so, gb, it]
    body:
      - "For the fourth expedition Major General Sir Charles Egerton gathered a much larger army of British, Indian, South African and Somali troops, with camel transport, and built a chain of posts into the interior. He united his field force at Badwein on 9 January 1904 and the next day attacked the Dervish army at Jidballi, some 65 km east of Eil Dab. The Dervishes charged the British square across open ground and were cut down by rifle and machine-gun fire in about forty minutes; 668 Dervish dead were counted, and British estimates of the total ran to about 1,000. It was the heaviest defeat of Hassan’s war, but he was not caught."
      - "Hassan withdrew east through the Nugal valley to the coast of the Majeerteen sultanate. On 21 April 1904 a Royal Navy landing party with three companies of the Hampshire Regiment stormed the Dervish forts at Illig (Eyl), losing three men killed; 58 Dervishes were killed. Italian warships arrived the next day. Hassan again slipped away, and the British and Italians looked for a settlement."
    facts:
      - [Battle of Jidballi, "10 January 1904, British success"]
      - [Dervish dead counted, "668 (estimates to about 1,000)"]
      - [Storming of Illig, "21 April 1904"]
