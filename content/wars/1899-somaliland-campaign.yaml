steps:
  - title: The Sayyid and the call of 1899
    date: 1895–1900
    when: "1899-09"
    borders: "1899-09-01"
    countries: [so, et, gb]
    body:
      - "By the 1890s the Somali lands were divided on paper between Britain, which had held a protectorate on the northern coast since 1884–1887 and governed it from Berbera, Italy, which claimed the east and south through treaties with the Majeerteen and Hobyo sultanates and the Benadir ports, France at Djibouti, and Ethiopia, whose armies had taken Harar in 1887 and were raiding and taxing the pastoral clans of the Ogaden. Mohammed Abdullah Hassan, born in 1856 to an Ogaden father and a Dhulbahante mother, had studied in Harar, Mogadishu and the Arabian peninsula and joined the Salihiyya, a reformist Sufi order. Back in Berbera in 1895, he preached a stricter Islam, against the rival Qadiriyya, against the use of khat and tobacco and against Christian missions and foreign rule."
      - "In 1897 he moved inland to Kirrit among the Dhulbahante, where his message found a following. In August 1899 he gathered some 5,000 armed men at Burao, about 200 of them with modern rifles, and on 1 September sent an ultimatum to the British at Berbera. His fighters called themselves daraawiish, dervishes; the British called him the Mad Mullah. Hassan attacked clans that refused to join him as well as the foreigners, and his movement was a war among Somalis as much as against the empires. In March 1900 about 6,000 Dervishes attacked an Ethiopian force of some 1,500 men under Gerazmach Bante at Jijiga; both sides claimed the victory."
    facts:
      - [Hassan returns to Berbera, "1895"]
      - [Gathering at Burao, "August 1899"]
      - [Ultimatum to Berbera, "1 September 1899"]
      - [Attack on Jijiga, "March 1900"]
