  - title: Z Force and the fall of Taleh
    date: January – December 1920
    when: "1920-01-21"
    borders: "1920-02-09"
    countries: [so, et, gb]
    body:
      - "After the First World War the colonial secretary, Lord Milner, wanted a quick end without the cost of a new army, and the new Royal Air Force offered to do it. Z Force, twelve DH.9A bombers with some 36 officers and 183 men under Group Captain Robert Gordon, arrived at Berbera from Egypt in January 1920. On 21 January its aircraft bombed the Dervish fort at Jidali and Hassan’s camp nearby; Hassan narrowly escaped. The Somaliland Camel Corps, a battalion of the King’s African Rifles and local levies then moved in, and the Camel Corps occupied Jidali on 28 January."
      - "Taleh was bombed on 2–3 February and taken on 9 February 1920; its garrison surrendered almost without a fight. Hassan escaped with a handful of followers into the Ogaden, where in the summer a force of some 3,000 men of the clans he had raided, under Haji Warabe, fell on his camp at Shineleh, killing about 700 and taking 60,000 camels. Hassan reached Imi on the upper Shebelle in Ethiopia and died there, most sources say on 21 December 1920, of influenza or malaria. The war had cost the protectorate perhaps a third of its people. Hassan is remembered in Somalia as a forerunner of Somali nationalism and as one of the great Somali poets, and in the north, among clans his raiders fought, more ambivalently."
    facts:
      - [First air raid, "21 January 1920"]
      - [Taleh taken, "9 February 1920"]
      - [Death of Hassan, "21 December 1920 (some sources 1921), at Imi"]
    markers:
      - kind: event
        side: gb
        name: Berbera
        date: January 1920
        text: Z Force flew its twelve DH.9A bombers from a temporary airfield here.
        lonlat: [45.014, 10.439]
        lp: b
