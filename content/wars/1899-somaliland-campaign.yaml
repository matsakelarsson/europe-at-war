id: somaliland-campaign
name: Somaliland campaign (the Dervish War)
start: "1899-09"
end: "1920-12"
tier: A
summary: "Twenty years of war between the Dervish movement of Mohammed Abdullah Hassan and the British, Italian and Ethiopian empires in the Somali lands. Hassan, a Somali religious teacher of the Salihiyya order, began preaching against foreign rule at Berbera in 1895 and in 1899 gathered several thousand armed men at Burao and called for a holy war; his followers called themselves daraawiish (dervishes), and the British called him the “Mad Mullah”. Four British expeditions, two of them with Ethiopian armies, failed to destroy him between 1901 and 1904, although his forces were beaten at Jidballi in January 1904. After a truce under Italian protection (1905) the Dervishes returned to the Nugal valley, built stone forts at Taleh and elsewhere, and in 1910 drove the British back to the coast, which left the interior to raiding and famine. In January and February 1920 a British campaign led by twelve aircraft of the Royal Air Force took the Dervish forts and Taleh, and Hassan died in the Ethiopian Ogaden at the end of the year. Estimates of the deaths in the war years, most of them from raiding, hunger and disease, run to about a third of the population of British Somaliland."
countries: [so, et, gb, it]
sides:
  - id: der
    name: Dervish movement (Mohammed Abdullah Hassan)
    polities: [dervish-state]
    ink: brown
    moves: Dervish moves
    success: Dervish success
  - id: gb
    name: Britain (Somaliland Protectorate) and allied Somali clans
    polities: [united-kingdom, british-somaliland]
    ink: red
    moves: British moves
