  - title: Zinder
    date: July – September 1899
    when: "1899-07-30"
    borders: "1899-09-15"
    countries: [ne]
    body:
      - Lieutenant Pallier, now in command, marched on Zinder, capital of Damagaram, the largest town in what is now Niger, whose sultan Amadou Kouran Daga had had the French officer Marius-Gabriel Cazemajou killed in May 1898. On 30 July the column defeated the sultan’s army at Tirmini, about 10 km from Zinder, and took the town. When Pallier set out for Lake Chad, his soldiers refused to go on and forced him back to Zinder; about 300 of them returned to the Sudan with him.
      - The 270 who agreed to stay served under Lieutenant Paul Joalland, with Meynier as his second. Amadou was killed in a skirmish on 15 September, and his brother, who had sided with the French, was placed on the throne. In October Joalland and Meynier marched east with 170 men to Lake Chad, where they joined the Foureau–Lamy mission and fought at Kousséri in April 1900. Joalland and the other surviving officers escaped court-martial, and Zinder became the capital of the French Niger Military Territory in 1911.
    facts:
      - [Zinder taken, "30 July 1899"]
      - [Sultan Amadou killed, "15 September 1899"]
    markers:
      - kind: taken
        side: fr
        name: Zinder
        date: 30 July 1899
        text: Capital of Damagaram, taken after the column defeated the sultan’s army at Tirmini nearby.
        lonlat: [8.988, 13.805]
    arrows:
