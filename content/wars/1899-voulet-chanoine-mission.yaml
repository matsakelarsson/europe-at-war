steps:
  - title: From the Niger to Lougou
    date: November 1898 – April 1899
    when: "1899-04-16"
    borders: "1899-04-16"
    countries: [ml, ne]
    body:
      - The mission left Dakar in November 1898 and divided at Koulikoro on the Niger. Chanoine led the larger part overland across the bend of the river, taking food from the villages and ordering that anyone who fled be shot; Voulet went down the river to Timbuktu, where Klobb, its commander, gave him 70 more tirailleurs and 20 spahis. The two halves met again in January 1899 at Say, the easternmost French post on the Niger, about 2,000 strong, far more than the country could feed. On 8 January, at Sansanné-Haoussa on the Niger, the column killed 101 people, among them 30 women and children, in revenge for the wounding of two of its soldiers. Lieutenant Péteau protested and was dismissed on 29 January; on 15 February he wrote to his fiancée describing what he had seen.
      - East of the Niger the column marched into the Hausa lands, burning villages that refused it food or porters. Near Dogondoutchi the Azna, the Hausa who had kept their old religion, were led by Sarraounia Mangou, their queen and priestess. On 16 April 1899 the column attacked her fortified town of Lougou, losing 4 killed and 6 wounded in its hardest fight so far. The Azna withdrew from the town into the bush and fought on, and the French never captured Sarraounia; she is honoured in Niger as a symbol of resistance.
    facts:
      - [Sansanné-Haoussa, "8 January 1899, 101 people killed"]
      - [Battle of Lougou, "16 April 1899"]
