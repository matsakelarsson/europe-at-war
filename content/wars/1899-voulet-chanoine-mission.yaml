id: voulet-chanoine-mission
name: Voulet–Chanoine Mission
start: "1899-01"
end: "1899-09-15"
tier: B
summary: "The march of the French Central Africa mission (mission Afrique centrale) from the Niger towards Lake Chad in 1899, under Captains Paul Voulet and Julien Chanoine, the officers who had taken Ouagadougou in 1896. Sent with vague orders and little money to put the lands between the Niger and Lake Chad “under French protection” and to meet the columns of Foureau and Lamy from Algeria and Gentil from the Congo, the column of some 600 soldiers and about 2,000 porters and followers lived off the country, and from January 1899 burned villages and killed those who resisted or failed to supply it, across what is now western and southern Niger. Sarraounia Mangou, the ruler of the Azna of Lougou, fought it in April. At Birni-N’Konni in May the column destroyed a town of more than 10,000 people. When reports reached Paris, the government sent Lieutenant-Colonel Jean-François Klobb to take command; on 14 July Voulet had his men fire on Klobb and kill him at Dankori. Two and three days later the African soldiers of the column killed Chanoine and then Voulet. Under new officers the mission took Zinder, capital of the sultanate of Damagaram, on 30 July, and went on as the Joalland–Meynier mission to join the battle of Kousséri in April 1900. The killings were one of the great scandals of the European conquest of Africa; in 2025 descendants of the victims in Niger asked France for reparations."
