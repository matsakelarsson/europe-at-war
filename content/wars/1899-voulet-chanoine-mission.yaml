notes:
  - "The main accounts are the letters of Lieutenant Louis Péteau, whom Voulet dismissed in January 1899, the reports of Klobb and his second Octave Meynier, and the agreed version of the surviving officers, which put much of the blame on African interpreters and soldiers who had been quickly executed. Oral traditions in Niger, and Abdoulaye Mamani’s novel Sarraounia (1980) and Med Hondo’s film (1986), keep the memory of the column and of Sarraounia’s resistance. The number killed at Birni-N’Konni is not known; estimates range from hundreds to thousands."
  - "An official French inquiry closed in 1902 by blaming “soudanite aiguë”, a madness supposedly brought on by heat. When Robert Delavignette, a colonial administrator, had the graves of Voulet and Chanoine opened in 1923, they were empty."
