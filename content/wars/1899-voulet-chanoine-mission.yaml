  - title: Birni-N’Konni and Dankori
    date: May – July 1899
    when: "1899-07-14"
    borders: "1899-07-14"
    countries: [ne]
    body:
      - In early May the column took Birni-N’Konni, a Hausa town of more than 10,000 people, killed a great many of its inhabitants as they fled, and destroyed it. By then Péteau’s letter had reached Paris, and on 20 April the government had decided to arrest Voulet and Chanoine and to put Klobb in command. Klobb left Timbuktu with fifty tirailleurs and Lieutenant Octave Meynier and followed the column for over 2,000 km along a trail of burned villages and hanged bodies. On 10 July, near Zinder, he sent Voulet a letter relieving him; Voulet kept it secret from his officers and answered that he had 600 rifles to Klobb’s fifty. On 13 July, after a villager killed two of his men, Voulet had about 150 women and children killed.
      - On 14 July Klobb came up to Voulet’s camp at Dankori in uniform and walked forward alone, ordering his own men not to fire; Voulet ordered his soldiers to shoot, and Klobb was killed and Meynier wounded. That evening Voulet told his officers, “I am no longer French, I am a black chief,” and that he would found an empire. The officers and the soldiers would not follow him. On 16 July, when Voulet and Chanoine fired on the assembled tirailleurs, the soldiers fired back and killed Chanoine; the next morning Voulet tried to re-enter the camp and was shot dead by a sentry.
    facts:
      - [Birni-N’Konni destroyed, "early May 1899"]
      - [Klobb killed at Dankori, "14 July 1899"]
      - [Chanoine and Voulet killed, "16 and 17 July 1899"]
