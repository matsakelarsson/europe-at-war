  - title: Five columns across Manchuria
    date: August – October 1900
    when: "1900-08"
    borders: "1900-10-01"
    countries: [cn, ru]
    body:
      - Russian columns advanced from five directions, from the Amur, from the Ussuri by way of Hunchun and Ningguta, from Transbaikalia by Hailar and over the Greater Khingan, from Harbin and from Port Arthur in the south, while the railway guard held out along the line. Russia eventually sent some 100,000 men into Manchuria. The Qing troops, among them many Manchu bannermen defending their home garrisons, were defeated in a series of battles; Yingkou, the main port of southern Manchuria, was taken on 4–5 August.
      - The military governor of Heilongjiang, Shoushan, killed himself before the Russians entered Qiqihar at the end of August. Jilin surrendered in September, and on 1 October Russian troops entered Mukden (Shenyang), the old Qing capital, from which the military governor had fled. Russian officers reported that villages were burned and Chinese civilians killed in reprisal for attacks on the railway; a few Cossacks were later court-martialled for crimes against civilians. By the end of the year the whole of Manchuria was in Russian hands.
    facts:
      - [Yingkou taken, "4–5 August 1900"]
      - [Qiqihar taken, "end of August 1900"]
      - [Mukden (Shenyang) entered, "1 October 1900"]
      - [Russian losses, "242 killed, about 1,280 wounded"]
