steps:
  - title: The railway and the Amur
    date: June – August 1900
    when: "1900-07-15"
    borders: "1900-07-20"
    countries: [cn, ru]
    body:
      - Since 1897 Russia had been building the Chinese Eastern Railway, a short cut for the Trans-Siberian line across Manchuria to Vladivostok, and from 1898 a southern branch to its leased base at Port Arthur (Lüshun), guarded by its own troops. In June 1900, as the Boxer rising spread, Boxers and Qing troops in Manchuria tore up the line, burned stations and besieged the railway headquarters at Harbin. Russia mobilised its Far Eastern forces.
      - On 15 July Qing batteries at Aigun and Heihe opened fire across the Amur on Blagoveshchensk and on Russian steamers. The Russian military governor, Konstantin Gribsky, ordered all Qing subjects out of the town. From 17 July police, Cossacks and armed volunteers drove the Chinese residents, several thousand people, into the Amur at a place with no boats; most drowned, and those who swam were shot. In the following days Cossacks burned the Sixty-Four Villages east of the river, a Qing enclave left under Qing jurisdiction by the Treaty of Aigun, and drove out or killed their Manchu, Daur and Han inhabitants. At the beginning of August Russian troops crossed the Amur, took Heihe and Aigun, and burned Aigun to the ground. A column from Khabarovsk sailed up the Sungari and relieved Harbin on 3 August.
    facts:
      - [Blagoveshchensk shelled, "15 July 1900"]
      - [Blagoveshchensk massacre, "17–21 July 1900, about 3,000 to more than 5,000 drowned"]
      - [Aigun taken and burned, "early August 1900"]
      - [Harbin relieved, "3 August 1900"]
