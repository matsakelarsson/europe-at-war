  - title: The occupation and the road to war with Japan
    date: 1900 – 1905
    when: "1902-04-08"
    borders: "1902-04-08"
    countries: [cn, ru, jp]
    body:
      - In November 1900 the Russian commander in the Far East, Admiral Yevgeny Alekseyev, made the Tartar general of Fengtian accept a Russian resident and the disbanding of his troops. Under pressure from Japan, Britain and the United States, Russia agreed on 8 April 1902 to withdraw from Manchuria in three stages over eighteen months. It carried out the first stage, in south-western Fengtian, in October 1902, but in 1903 it stopped and pressed new demands on China, while Russian timber concessions on the Yalu reached into Korea.
      - Japan, which had been forced by Russia, France and Germany to give up the Liaodong peninsula in 1895, saw Russian Manchuria as a threat to its plans in Korea. Talks broke down, and in February 1904 Japan attacked Port Arthur. Russian troops left southern Manchuria only after their defeat in the Russo-Japanese War, and the Treaty of Portsmouth of 1905 returned Manchuria, except for the Kwantung lease and the railway zones, to Qing administration. In the Sixty-Four Villages the inhabitants were never allowed to return.
    facts:
      - [Russian–Chinese evacuation agreement, "8 April 1902"]
      - [First stage of withdrawal, "October 1902"]
      - [Russo-Japanese War begins, "8 February 1904"]
