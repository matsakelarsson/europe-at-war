id: russian-invasion-of-manchuria
name: Russian invasion of Manchuria
start: "1900-06"
end: "1900-10"
tier: B
summary: "The Russian conquest of Manchuria during the Boxer Rebellion. When Boxers and Qing troops attacked the Chinese Eastern Railway, which Russia was building across Manchuria to Vladivostok and Port Arthur, and Qing guns at Aigun shelled Blagoveshchensk across the Amur in July 1900, Russia sent columns into Manchuria from the Amur, the Ussuri, Transbaikalia and the Liaodong peninsula. In Blagoveshchensk the Russian authorities drove the Chinese residents into the Amur, where thousands drowned, and the Sixty-Four Villages east of the river were emptied of their Manchu, Daur and Han inhabitants. The Russians took Aigun, relieved Harbin, and by October held Qiqihar, Jilin and Mukden (Shenyang), with all of Manchuria. Russia’s failure to withdraw as it had promised was a main cause of the Russo-Japanese War of 1904."
countries: [cn, ru]
sides:
  - id: ru
    name: Russian Empire
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
  - id: qing
    name: Qing troops and Boxers
    polities: [qing, boxers]
    ink: gold
    moves: Qing and Boxer moves
    success: Qing and Boxer success
notes:
  - Russia also took part in the Eight-Nation Alliance in Zhili (see the Boxer Rebellion), but the war in Manchuria was fought by Russia alone. Russian dates in the sources are often given in the Julian calendar, twelve days behind the Gregorian dates used here.
  - The number of people killed at Blagoveshchensk and in the Sixty-Four Villages is uncertain; estimates of the drowned at Blagoveshchensk range from about 3,000 to more than 5,000. Russian army losses in the campaign were reported as 242 killed and about 1,280 wounded; Chinese losses were not recorded and were much higher.
