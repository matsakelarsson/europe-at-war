steps:
  - title: The siege of the Kumasi fort
    date: March – June 1900
    when: "1900-05"
    borders: "1900-05-01"
    countries: [gh]
    body:
      - "Hodgson arrived in Kumasi on 25 March 1900 and on 28 March addressed the Asante chiefs, demanding the rest of the indemnity of 1874 and asking where the Golden Stool was, and why he, as the queen’s representative, was not sitting on it. The chiefs heard him in silence and went home to prepare for war. At a meeting of the chiefs, Yaa Asantewaa, queen mother of Ejisu and guardian of its stool, is remembered as shaming those who hesitated and pledging to lead the fight herself."
      - At the end of March a British party went out to search for the stool; early in April it was ambushed and fought its way back to Kumasi. By late April the governor, his wife, the British officials, missionaries and several hundred Hausa soldiers from Lagos and the Gold Coast, with refugees from the town, were shut up in the small stone fort and the stockade around it. The Asante made one assault on the fort, on 29 April, and then blockaded it, cutting the telegraph and closing the roads with log barricades. Two small relief columns fought their way in, on 29 April and 15 May, but only added to the hungry garrison.
      - On 23 June Hodgson broke out with most of the garrison, some 600 soldiers and carriers, leaving about a hundred men with a few weeks’ food. Avoiding the main Asante forces, the column reached the coast in July.
    facts:
      - [Hodgson’s speech in Kumasi, "28 March 1900"]
      - [Asante assault on the fort, "29 April 1900"]
      - [Hodgson’s breakout, "23 June 1900"]
