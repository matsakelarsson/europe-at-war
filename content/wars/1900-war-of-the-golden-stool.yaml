  - title: Relief, conquest and annexation
    date: July 1900 – January 1902
    when: "1900-07-15"
    borders: "1902-01-01"
    countries: [gh]
    body:
      - A relief force of about 1,000 men, drawn from British West African units and later reinforced with Sikh soldiers and the Central Africa Regiment, set out from the coast under Colonel James Willcocks and fought its way north, beaten back on the way at the stockade of Kokofu. From Bekwai, on 14 July, it attacked the barricades around Kumasi, and on the evening of 15 July it relieved the fort, whose last defenders were days from surrender. The garrison was replaced and the column withdrew south with the sick and wounded.
      - "Reinforcements took Kokofu by surprise on 22 July. In September Willcocks sent columns from Kumasi through the districts that had joined the rising, burning towns and food stores, and on 30 September 1900 an Asante force was defeated at Obassa, in what proved the last large battle of the war. Yaa Asantewaa was captured in March 1901. She and fifteen other leaders were exiled to the Seychelles, where she died in 1921."
      - By an Order in Council, Asante was annexed to the British Crown as a separate colony from 1 January 1902, ruled by a chief commissioner under the governor of the Gold Coast, and the Northern Territories became a British protectorate on the same day. Prempeh I was allowed to return in 1924, and the Asante Confederacy was restored under his successor in 1935. The Golden Stool stayed hidden; in 1921 road workers who found and stripped it were condemned by an Asante court, and the British had them exiled instead.
