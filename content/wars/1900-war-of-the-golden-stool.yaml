notes:
  - "British and allied deaths in the war are usually given as about 1,000, many of them from disease; Asante deaths are estimated at more than 2,000. Not all Asante states joined the war; some stayed neutral or sided with the British."
  - "Hodgson’s speech is known from the accounts of British officials and of his wife, Lady Mary Hodgson; Asante tradition remembers Yaa Asantewaa’s answer to the chiefs’ hesitation as a call to arms."
