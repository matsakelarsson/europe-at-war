id: war-of-the-golden-stool
name: War of the Golden Stool
start: "1900-03-28"
end: "1901-03"
tier: B
summary: "The last war between the Asante and the British, also called the Yaa Asantewaa War. After the British occupation of Kumasi in 1896 and the exile of the Asantehene Prempeh I, Asante was ruled by a British resident, and resentment grew over forced labour, taxes and the absence of the king. In March 1900 the governor of the Gold Coast, Sir Frederic Hodgson, told the assembled Asante chiefs in Kumasi that the Golden Stool, the sacred stool that embodies the soul of the Asante nation and on which not even the king sits, should be handed over so that he could sit on it. Led by Yaa Asantewaa, the queen mother of Ejisu, the Asante rose and besieged the British, the governor among them, in the Kumasi fort from April to July. A relief column under Colonel James Willcocks broke through on 15 July, and British columns spent the rest of the year breaking resistance across the country. Yaa Asantewaa was captured in March 1901 and exiled to the Seychelles with other leaders, and on 1 January 1902 Asante was annexed as a British colony. The Golden Stool itself was never found by the British; it remained hidden and is kept in Kumasi today."
countries: [gh, gb]
sides:
  - id: as
    name: Asante (Yaa Asantewaa and the allied chiefs)
    polities: [asante]
