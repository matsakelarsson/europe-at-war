id: anglo-aro-war
name: Anglo-Aro War
start: "1901-11-28"
end: "1902-03"
tier: B
summary: "The British conquest of the Aro Confederacy in what is now south-eastern Nigeria. The Aro, an Igbo people centred on Arochukwu, had built from the 17th century a network of trading settlements across Igboland and the Cross River region, held together by the prestige of their oracle, Ibini Ukpabi, which Europeans called the Long Juju, and by alliances with warrior communities such as Abam, Ohafia and Edda. Pilgrims came to the oracle from far and wide to settle disputes, and many of those it condemned were sold into slavery, making the Aro the leading suppliers of captives to the coastal ports during the Atlantic slave trade and of slaves to the region afterwards. As British rule spread inland from the coast in the 1890s, the Aro saw their trade, their influence and their oracle threatened by British officials, merchants and missionaries, and they and their allies attacked communities that had accepted British protection. After the Aro sacked Obegu, a British ally, in November 1901, the Southern Nigeria Protectorate sent four columns of about 1,550 soldiers and 2,100 carriers under Lieutenant-Colonel Arthur Montanaro converging on Arochukwu. They took the town on 28 December 1901 after four days of fighting and destroyed the oracle’s shrine; the last major Aro resistance was broken at Bende in March 1902. The Aro Confederacy collapsed, but resistance to British rule in Igboland went on for years."
countries: [ng, gb]
