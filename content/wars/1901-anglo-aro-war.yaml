steps:
  - title: The Aro and the British
    date: 1890s – November 1901
    when: "1901-11"
    borders: "1901-11-01"
    countries: [ng]
    body:
      - "Arochukwu was a cluster of towns in the forest just west of the Cross River, home to the Aro king and the priests of Ibini Ukpabi. Aro traders settled in communities across Igboland and beyond, and their markets fed the delta city-states of Bonny, Kalabari, Opobo and Calabar, first with captives for the Atlantic trade and later with palm oil. Communities that consulted the oracle often had to hand over those it found guilty, who disappeared from view; many were sold. The Aro could call on the armies of allied communities to back their interests."
      - In the 1890s the British Niger Coast Protectorate, and from 1900 the Southern Nigeria Protectorate, pushed inland from the coast, signing treaties and setting up stations. The Aro and their allies resisted, raiding communities that dealt with the British. Moor and the Royal Niger Company had planned an expedition against Arochukwu since 1899, but troops were not available until late 1901. In November 1901, as the British were preparing, an Aro force under Okoro Toti sacked Obegu, a town allied with the British, and about 400 people were reported killed.
    facts:
      - [Oracle of the Aro, "Ibini Ukpabi (the ‘Long Juju’)"]
      - [Sack of Obegu, "November 1901"]
