notes:
  - "British officials, above all the high commissioner Sir Ralph Moor, presented the war as a campaign to end the slave trade and the ‘Long Juju’; historians such as Adiele Afigbo have also stressed the British aim of opening the interior to trade and administration. The Aro story is known mainly from British reports and from oral traditions collected later."
