  - title: The four columns
    date: November 1901 – March 1902
    when: "1901-12-28"
    borders: "1902-03-31"
    countries: [ng]
    body:
      - "On 28 November 1901 Montanaro’s force of 87 British officers, about 1,550 African soldiers and 2,100 carriers set out in four columns from Oguta in the west, Akwete in the south, Unwana in the north and Itu on the Cross River in the east. All four met strong resistance, but the Aro and their allies, armed mostly with muzzle-loading guns, could not stand against rifles, Maxim guns and artillery. Arochukwu fell on 28 December after four days of fighting in and around the town, and the British blew up the shrine of Ibini Ukpabi."
      - "Fighting went on across the region until March 1902, when the last major Aro force was defeated at Bende. Okoro Toti and other Aro leaders were tried and hanged; the Aro king, Kanu Okoro, went into hiding and was later arrested. The Aro trading network and the oracle’s authority quickly collapsed, but Aro communities took part in later resistance, at Afikpo in 1902–1903 and Ezza in 1905, and the British fought many more campaigns before Igboland was under their control."
