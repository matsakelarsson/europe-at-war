notes:
  - Phu mi bun (Lao and Thai, “one who has merit”) was the term the movement and the villagers used; French and Siamese officials called its leaders sorcerers and rebels. The numbers of followers and dead come from French and Siamese reports and are uncertain.
  - The rising in Siam lasted from 1901 to 1902; in French Laos resistance continued, with pauses, until Ong Kommandam’s death in 1936.
