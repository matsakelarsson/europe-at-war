id: holy-mans-rebellion
name: Holy Man’s rebellion
start: "1901-03"
end: "1936-09-23"
tier: C
summary: "A millenarian rising in southern French Laos and north-eastern Siam, led by men who claimed to be phu mi bun, “people of merit” or holy men. In 1901 prophecies spread across the Mekong lands that a time of disaster was coming, when gravel would turn to gold and gold to gravel, and that a holy man would bring a just new order. They fell on ground prepared by French taxes and forced labour in Laos and by Siam’s new centralised provincial government, which was taking power from the old Lao lords of the Khorat plateau. In French Laos the movement was led by Ong Keo, a leader of the Mon-Khmer-speaking upland peoples (Lao Theung) of the Bolaven plateau, and his follower Ong Kommandam, an Alak; about 1,500 men ambushed a French column near Saravane in April 1901, and in April 1902 a crowd that marched on the French post at Savannakhet was fired upon, with about 150 killed. In Siam, Ong Man’s followers took Khemarat on 28 March 1902 and marched on Ubon, where Siamese troops with artillery, sent by the royal commissioner Prince Sanphasitthiprasong, routed them at Ban Saphue on 3–4 April, killing about 300 and capturing about 400; the leaders were executed and the rising in Siam ended that year. In Laos fighting went on in the uplands. Ong Keo was killed in 1910 during talks with the French commissioner, in circumstances the sources describe differently. Ong Kommandam escaped and led resistance from the Bolaven plateau for more than two decades, calling for the end of French rule and passing messages in a secret script he devised, until French troops killed him on 23 September 1936. His son Sithon Kommadam later became a leader of the Pathet Lao."
countries: [la, th]
