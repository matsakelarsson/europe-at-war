notes:
  - "Coppolani called his policy “peaceful penetration” and his plan a “plan of pacification”; these were French terms, and the occupation of the emirates also relied on military columns and posts. Dates for the submission of the emirates differ between sources: Trarza in 1902–1903, Brakna in 1903–1904 and Tagant in 1904–1905."
  - "Accounts of Coppolani’s death differ. English sources name a member of Ma al-Aynayn’s brotherhood as his killer; French ones name a band led by Sidi Seghir Ould Moulay Zein and suggest that Saint-Louis merchants who traded in arms and slaves wanted him gone."
