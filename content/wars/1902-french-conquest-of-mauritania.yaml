id: french-conquest-of-mauritania
name: French conquest of Mauritania
start: "1902"
end: "1934"
tier: B
summary: "The French occupation of the emirates of the western Sahara north of the Senegal river, which became the colony of Mauritania. Moorish (Bidan) society was divided between the warrior (hassane) lineages who ruled the emirates of Trarza, Brakna, Tagant and Adrar and the scholarly (zawaya) lineages whose marabouts led the Sufi brotherhoods, and both lived partly from the labour of slaves and dependants. Xavier Coppolani, a Corsican official from Algeria who knew Arabic and the brotherhoods, won over two great marabouts, Shaykh Sidiyya Baba and Shaykh Saad Bouh, by promising to protect the zawaya from the warriors’ raids, and with their help and some force brought Trarza, Brakna and Tagant under French rule in 1902–1905; France made Mauritania a territory of its own in 1904. A third marabout, Shaykh Ma al-Aynayn, Saad Bouh’s brother, who had built a base at Smara in the north with the help of the sultan of Morocco, proclaimed a holy war in 1904. Coppolani was killed at Tidjikja in May 1905. In 1908–1909 Colonel Henri Gouraud marched into the Adrar and took Atar, the emirs submitted, and Ma al-Aynayn withdrew to Morocco, where he died in 1910. Resistance in the Adrar ended by 1912, but raids by the northern nomads went on until 1934. The French ruled through the emirs and marabouts and left slavery largely in place; Morocco later based part of its claim to Mauritania on Ma al-Aynayn’s allegiance to the sultan."
countries: [mr, eh, ma, sn]
