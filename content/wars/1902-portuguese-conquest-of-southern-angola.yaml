notes:
  - "The main study of these wars, René Pélissier’s Les guerres grises (1978), rests largely on Portuguese military records; the Ovimbundu and Ovambo sides are known from oral tradition, missionary reports and the Portuguese sources. Casualty figures for the African armies are Portuguese estimates."
  - "The fighting at Naulila in 1914 and the German raids into southern Angola belong to the First World War; see the South West Africa campaign. Mandume’s last stand in 1917 was against South African forces, which then ruled South West Africa; the colonial border drawn in the 1880s ran through the middle of the Kwanyama kingdom."
