  - title: The Ikhwan revolt and the kingdom
    date: 1927–1932
    when: "1927-11"
    borders: "1932-09-23"
    countries: [sa, iq, kw]
    body:
      - Once the Hejaz was won, Ibn Saud and the Ikhwan leaders parted ways. Faisal al-Duwaish of the Mutair, Sultan bin Bajad of the Otaibah and Dhaidan bin Hithlain of the Ajman accused him of laxity, of allowing cars, telephones and the telegraph and of dealing with the British, and above all of forbidding raids on Iraq, Kuwait and Transjordan, whose tribes they regarded as unbelievers. On 5 November 1927 al-Duwaish’s men attacked a new Iraqi police post at Busayya and killed about 20 people, among them six policemen, and from January 1928 the British Royal Air Force bombed the raiders, even inside Najd. Ikhwan raids on Iraq and Kuwait went on through 1928.
      - Late in 1928 an assembly of religious scholars and tribal leaders in Riyadh backed Ibn Saud. On 29–31 March 1929, at Sabilla, about 30 km east of al-Zulfi, his army of townsmen and loyal tribesmen, with machine guns, some of them mounted on cars, defeated the rebel Ikhwan camel riders. Al-Duwaish was badly wounded, and Ibn Bajad surrendered and died in prison. The killing of Dhaidan bin Hithlain during talks in May 1929 brought the Ajman and Mutair back into revolt, but by the end of the year the rebels were hemmed in on the Kuwaiti border between Saudi forces and British aircraft and armoured cars. Al-Duwaish surrendered to the British on 10 January 1930 and was handed over to Ibn Saud on condition that his life be spared; he died in prison in Riyadh in 1931.
      - Ikhwan who had stayed loyal later formed the core of the forces that became the National Guard. On 23 September 1932 a royal decree joined the Kingdom of the Hejaz and Najd and its dependencies into the Kingdom of Saudi Arabia. Its southern border with Yemen was settled by war two years later (see the Saudi–Yemeni War).
    facts:
      - [Busayya raid, "5 November 1927"]
      - [Battle of Sabilla, "29–31 March 1929, Saudi victory"]
      - [Faisal al-Duwaish surrenders, "10 January 1930"]
      - [Kingdom of Saudi Arabia, "23 September 1932"]
    markers:
