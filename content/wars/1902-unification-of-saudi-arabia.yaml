id: unification-of-saudi-arabia
name: Unification of Saudi Arabia
start: "1902-01-15"
end: "1932-09-23"
tier: A
summary: The thirty years of wars in which Abdulaziz ibn Saud (Ibn Saud) rebuilt the Saudi state from exile in Kuwait. Starting with the capture of Riyadh by a small band in 1902, he defeated the Rashidi emirs of Ha’il, took al-Hasa from the Ottomans in 1913, conquered Ha’il in 1921 and the Hashemite Kingdom of the Hejaz in 1924–1925, and crushed the revolt of his own Ikhwan warriors in 1929–1930. In 1932 his lands were united as the Kingdom of Saudi Arabia.
countries: [sa, kw, iq]
