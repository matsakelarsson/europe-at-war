  - title: Turabah and Ha’il
    date: 1919–1922
    when: "1919-05-25"
    borders: "1922-12-02"
    countries: [sa, kw, iq]
    body:
      - Ibn Saud’s power rested more and more on the Ikhwan (“brethren”), Bedouin who from about 1912 settled in farming colonies (hijras) such as al-Artawiyah, took up the strict Wahhabi teaching and became fervent and feared fighters. Their spread to the oasis of al-Khurmah on the edge of the Hejaz brought him into conflict with Sharif Hussein, now King of the Hejaz. In May 1919 Hussein’s son Abdullah marched on al-Khurmah with an army of several thousand men and took Turabah. On the night of 25–26 May the Ikhwan of the Otaibah tribe under Sultan bin Bajad and Khalid bin Luay fell on his camp and destroyed his army; Abdullah barely escaped. British pressure kept Ibn Saud out of the Hejaz.
      - Ibn Saud turned south and north. In 1920 his forces took Abha in the highlands of Asir from its local rulers, the Al Aid. In Ha’il the Rashidi emir Saud bin Abdulaziz was murdered in 1920 and his successors were divided. A Saudi army besieged the city in 1921, and on 2 November 1921 Ha’il surrendered; the last emir, Muhammad bin Talal, was taken to Riyadh. Ibn Saud, who had taken the title Sultan of Najd that year, occupied al-Jawf in 1922 and reached the borders of the new British mandates of Iraq and Transjordan.
      - Ikhwan raids across those borders, and into Kuwait in 1919–1920 (see the Kuwait–Najd War), led to a conference at Uqair. There, in December 1922, the British High Commissioner in Iraq, Sir Percy Cox, drew the borders between Najd, Iraq and Kuwait, with two neutral zones; Kuwait lost about two-thirds of the land it had claimed.
    facts:
      - [Battle of Turabah, "25–26 May 1919, Ikhwan victory"]
      - [Ha’il surrenders, "2 November 1921"]
      - [Uqair Protocol, "2 December 1922"]
    markers:
