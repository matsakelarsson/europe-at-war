  - title: Qassim
    date: 1904–1906
    when: "1904"
    borders: "1906-12-01"
    countries: [sa]
    body:
      - Qassim, with its trading towns of Unaizah and Buraydah, lay between Riyadh and Ha’il and was the prize of the next round. Ibn Saud took both towns in the spring of 1904. Abdulaziz bin Mutaib turned to the Ottoman Empire, which claimed central Arabia, and several battalions of Ottoman regular troops with artillery were sent from Iraq to join him. Both sides lost heavily in a hard battle at al-Bukayriyah in the summer of 1904, where the Ottoman guns took a toll of the Saudis but the Rashidi and Ottoman army fell back; accounts differ over who had the better of it. On 29 September, worn down by heat and short of supplies, it was routed at al-Shinanah.
      - The Ottomans then tried diplomacy. In 1905 Qassim was made a buffer zone with Ottoman garrisons, and Ibn Saud accepted a nominal Ottoman overlordship. On 12 April 1906 (13 April in some accounts) he surprised the Rashidi camp at Rawdat Muhanna in a night attack, and Abdulaziz bin Mutaib was killed. The house of Rashid fell into feuds among its princes, and the Ottoman troops, sick and unpaid, left Qassim by the end of 1906. Ibn Saud was now master of southern and central Najd.
    facts:
      - [Unaizah and Buraydah taken, "spring 1904"]
      - [Battle of al-Shinanah, "29 September 1904, Saudi victory"]
      - [Battle of Rawdat Muhanna, "12 or 13 April 1906; Abdulaziz bin Mutaib killed"]
    markers:
      - kind: taken
        side: saud
        name: Unaizah
        date: "1904"
        text: The first of the Qassim towns to open its gates to Ibn Saud.
        lonlat: [43.987, 26.091]
        lp: b
      - kind: taken
        side: saud
        name: Buraydah
        date: "1904"
        text: Qassim’s other main town. Near it, at Rawdat Muhanna in April 1906, the Rashidi emir was killed in a Saudi night attack.
        lonlat: [43.967, 26.333]
      - kind: battle
        name: Al-Bukayriyah
        date: summer 1904
        text: Ottoman artillery inflicted heavy losses on the Saudis, but the Rashidi and Ottoman army also suffered badly and withdrew.
        lonlat: [43.655, 26.162]
        lp: l
      - kind: battle
        side: saud
        name: Al-Shinanah
        date: 29 September 1904
        text: The Rashidi and Ottoman army was broken; the Ottoman troops lost their guns and much of their strength.
        lonlat: [43.446, 25.813]
        lp: l
