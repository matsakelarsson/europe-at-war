  - title: The Hejaz
    date: 1924–1926
    when: "1924-09"
    borders: "1926-01-08"
    countries: [sa]
    body:
      - In March 1924, after the Turkish Republic abolished the caliphate, King Hussein proclaimed himself caliph. The claim found little support, Britain had stopped his subsidy, and Ibn Saud, whose subjects had been kept from the pilgrimage, decided to act. In late August Ikhwan forces under Sultan bin Bajad and Khalid bin Luay advanced on Taif, which they broke into in the first days of September. Several hundred of its people were killed, about 300 to 400 by most accounts.
      - Hussein abdicated on 3 October 1924 in favour of his son Ali and left for Aqaba. On 13 October the Ikhwan entered Mecca without a fight, dressed as pilgrims, and Ibn Saud arrived in December. Ali held out in Jeddah, besieged by land for a year. Medina surrendered to Ibn Saud’s son Muhammad in early December 1925 and Jeddah later that month, after which Ali went into exile in Iraq, where his brother Faisal was king. On 8 January 1926 Ibn Saud was proclaimed King of the Hejaz in the Great Mosque of Mecca.
      - The Ikhwan regarded the veneration of tombs as idolatry, and domed tombs in Mecca and, in 1925 and 1926, in the al-Baqi cemetery of Medina were demolished, which caused protests in much of the Muslim world. Ibn Saud called a Muslim congress in Mecca in 1926 to calm opinion. In October 1926 the Idrisid emirate of Asir on the Red Sea coast became a Saudi protectorate by the Treaty of Mecca, and by the Treaty of Jeddah of 20 May 1927 Britain recognised the full independence of his kingdom.
    facts:
      - [Taif taken, "early September 1924"]
      - [Mecca occupied, "13 October 1924"]
      - [Medina and Jeddah surrender, "December 1925"]
      - [Ibn Saud King of the Hejaz, "8 January 1926"]
