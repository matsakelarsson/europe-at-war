notes:
  - Dates are Gregorian. Arabic sources date events by the Hijri calendar, and conversions differ by a few days; the capture of Riyadh is given as anything from 13 to 16 January 1902, and the surrender of Jeddah as 17 or 23 December 1925.
  - The Ikhwan fought for Ibn Saud from about 1912 until 1927; the side “Ikhwan rebels” covers only the leaders who rose against him in 1927–1930.
  - Ibn Saud’s titles changed as his realm grew. He was Emir of Riyadh and then of Najd, Sultan of Najd from 1921, King of the Hejaz from January 1926 and King of the Hejaz and Najd from 1927, and King of Saudi Arabia from 1932.
