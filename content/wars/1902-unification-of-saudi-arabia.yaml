steps:
  - title: Riyadh
    date: 1901–1902
    when: "1902-01-15"
    borders: "1902-01-16"
    countries: [sa, kw]
    body:
      - In 1891 the Rashidi emirs of Ha’il, rulers of Jabal Shammar in northern Arabia, defeated the House of Saud at Mulayda and took Riyadh, ending the second Saudi state. The Saudi imam, Abdul Rahman bin Faisal, went into exile with his family and settled in Kuwait, where from 1896 its ruler, Mubarak al-Sabah, gave them his protection. In March 1901 Mubarak and his Saudi allies marched into Najd but were heavily defeated by the Rashidi emir Abdulaziz bin Mutaib at Sarif in Qassim.
      - Late in 1901 Abdul Rahman’s son Abdulaziz, known as Ibn Saud, then in his mid-twenties, rode out of Kuwait with a small band of relatives and followers, usually put at about 40 to 60 men. After weeks of raiding on the edge of the Empty Quarter he reached Riyadh. On the night of 15 January 1902 he and a few companions climbed into the town and waited in a house near the Masmak fort; when the Rashidi governor, Ajlan, came out in the morning, they attacked him at the gate and killed him, and the garrison surrendered.
      - The people of Riyadh accepted the Saudis back. Abdul Rahman kept the title of imam but left the rule to his son, and over the next year the districts of southern Najd, al-Kharj, al-Hariq and al-Aflaj, went over to him. A Rashidi army sent to retake the south was beaten at Dilam in January 1903 (late 1902 in some accounts).
    facts:
      - [Riyadh taken, "15 January 1902"]
      - [Ibn Saud’s band, "about 40–60 men"]
      - [Battle of Dilam, "January 1903, Saudi victory"]
