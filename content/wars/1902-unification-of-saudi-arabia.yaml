  - title: Al-Hasa and the British treaty
    date: 1913–1915
    when: "1913-05"
    borders: "1913-06-01"
    countries: [sa, bh]
    body:
      - Al-Hasa, the oasis province on the Gulf coast with the towns of Hofuf and Qatif, had been Saudi before and an Ottoman province since 1871. With the Ottoman Empire weakened by the Balkan Wars, Ibn Saud marched on Hofuf in May 1913. His men climbed the walls at night, and the Ottoman garrison surrendered in exchange for safe passage and was shipped out from the port of Uqair. Qatif submitted soon after. The Ottomans could not answer with force, and in a treaty of May 1914 they recognised Ibn Saud as their governor (wali) of Najd and al-Hasa, a title that left him in full control.
      - When the First World War began, Britain, which already controlled the foreign relations of Kuwait, Bahrain and the Trucial sheikhdoms, sought Ibn Saud’s help against the Ottomans and their Rashidi allies. At Jarrab in January 1915 the Rashidi army beat the Saudis, and the British political officer William Shakespear, who was with Ibn Saud, was killed. In the summer a rising of the Ajman tribe nearly broke his hold on al-Hasa; his brother Saad was killed at Kanzan and he himself was wounded.
      - By the Treaty of Darin, signed on 26 December 1915 on Tarut island off Qatif, Britain recognised Ibn Saud as ruler of Najd, al-Hasa, Qatif and Jubail under its protection. He promised not to attack Kuwait, Bahrain, Qatar or the Trucial coast and not to deal with other powers. In 1916 he received a British loan and arms, and from 1917 a monthly subsidy. Britain was at the same time backing his rival, Sharif Hussein of Mecca, whose Arab Revolt began in June 1916 (see the First World War).
    facts:
      - [Hofuf taken, "May 1913"]
      - [Battle of Jarrab, "24 January 1915, Rashidi victory"]
      - [Treaty of Darin, "26 December 1915"]
