id: british-expedition-to-tibet
name: British expedition to Tibet
start: "1903-12-12"
end: "1904-09-23"
tier: B
summary: "A British Indian military expedition into Tibet in 1903–1904, led by Colonel Francis Younghusband and Brigadier-General James Macdonald, also called the Younghusband expedition. The Viceroy, Lord Curzon, sent it to force Tibet to accept trade and border agreements, fearing Russian influence in Lhasa. About 3,000 soldiers and 7,000 porters and followers crossed the Jelep La from Sikkim in December 1903. At Guru (Chumik Shenko) on 31 March 1904 British and Indian troops killed some 600 to 700 Tibetans in minutes; Gyantse was besieged and its fortress stormed in July, and the force entered Lhasa on 3 August. The Dalai Lama had fled to Mongolia. The Convention of Lhasa of 7 September 1904 opened trade marts and imposed an indemnity, and the expedition withdrew. Some 2,000 to 3,000 Tibetans were killed."
countries: [cn, in]
sides:
  - id: gb
    name: British India
    polities: [british-india]
    ink: red
    moves: British moves
    success: British success
  - id: tb
    name: Tibet
    polities: [tibet]
    ink: purple
    moves: Tibetan moves
    success: Tibetan success
notes:
  - Tibet was under the nominal suzerainty of the Qing dynasty of China, whose representative (amban) in Lhasa had little power over the Dalai Lama’s government. In 1906 Britain and China signed a convention confirming the Lhasa agreement, in which Britain recognised China’s position in Tibet.
  - The Tibetan forces were mostly militia armed with matchlocks, swords and a few modern rifles, against a force with Maxim guns and artillery. British losses were about 200 killed in action and more than 400 dead of disease and cold.
