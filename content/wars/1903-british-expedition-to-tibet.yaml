  - title: Lhasa
    date: August – September 1904
    when: "1904-08-03"
    borders: "1904-09-07"
    countries: [cn, in]
    body:
      - The force entered Lhasa on 3 August 1904, the first European army to do so. The 13th Dalai Lama had fled north to Mongolia, leaving a regent, the Ganden Tripa. On 7 September, in the Potala, Tibetan officials signed the Convention of Lhasa. It recognised the Sikkim–Tibet border, opened trade marts at Gyantse, Gartok and Yatung, barred Tibet from dealing with other foreign powers without British consent, and imposed an indemnity of 7.5 million rupees, with British troops to hold the Chumbi valley until it was paid.
      - London thought Younghusband had gone too far. The indemnity was cut by two-thirds, and the Chumbi valley was handed back in 1908. The expedition left Lhasa on 23 September. By the Anglo-Chinese Convention of 1906 Britain confirmed China’s position in Tibet, and in 1910 Qing troops occupied Lhasa, sending the Dalai Lama into exile again, this time in British India.
    facts:
      - [Lhasa entered, "3 August 1904"]
      - [Convention of Lhasa, "7 September 1904"]
      - [Indemnity, "7.5 million rupees, later reduced to 2.5 million"]
      - [Tibetan dead in the war, "about 2,000–3,000"]
