steps:
  - title: Over the Jelep La to Guru
    date: December 1903 – March 1904
    when: "1904-03-31"
    borders: "1904-03-31"
    countries: [cn, in]
    body:
      - Lord Curzon believed that the young 13th Dalai Lama was turning to Russia, and Tibet had refused to deal with British letters or to honour the trade and border agreements Britain had made with China over Sikkim in 1890 and 1893. In 1903 he sent Younghusband to the border with an escort, and when the Tibetans would not negotiate there, the mission became an invasion. In December 1903 about 3,000 Indian and British soldiers, mostly Sikh and Gurkha, with thousands of porters and yaks, crossed the Jelep La into the Chumbi valley, took the fort at Phari and wintered at Tuna, over 4,500 metres up.
      - On 31 March 1904 a Tibetan force of some 2,000 men blocked the road at Guru, near the hot springs of Chumik Shenko, behind a stone wall. While officers tried to disarm them, a shot was fired, and the British and Indian troops opened fire with rifles and Maxim guns at close range. Some 600 to 700 Tibetans were killed in a few minutes; the British had a dozen wounded. The episode caused unease in Britain.
    facts:
      - [Jelep La crossed, "12 December 1903"]
      - [Massacre at Chumik Shenko, "31 March 1904"]
      - [Tibetan dead at Chumik Shenko, "about 600–700"]
