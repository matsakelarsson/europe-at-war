  - title: Gyantse
    date: April – July 1904
    when: "1904-07-06"
    borders: "1904-07-06"
    countries: [cn]
    body:
      - The expedition reached Gyantse on 11 April and camped near the town while waiting for negotiators who did not come. On 5 May Tibetan troops attacked the mission’s post at Changlo and besieged it for weeks; the next day or the day after (sources differ) a British column stormed a Tibetan wall at the Karo La pass, at about 5,000 metres one of the highest battles ever fought. Reinforcements arrived from India in June.
      - On 6 July, after a bombardment, Gurkha and Royal Fusilier troops stormed the great fortress of Gyantse Dzong on its rock above the town; Lieutenant John Grant won the expedition’s only Victoria Cross climbing the breach. With the way to Lhasa open, the column marched on, crossed the Karo La and the Tsangpo river at Chaksam, and met little further resistance.
    facts:
      - [Gyantse reached, "11 April 1904"]
      - [Battle of the Karo La, "6 or 7 May 1904"]
      - [Gyantse Dzong stormed, "6 July 1904"]
    markers:
      - kind: siege
        side: gb
        name: Gyantse Dzong
        date: 6 July 1904
        text: The fortress was breached by artillery and stormed. The Tibetan defenders who escaped fled into the hills.
        lonlat: [89.595, 28.925]
        lp: l
      - kind: battle
        side: gb
        name: Karo La
        date: May 1904
        text: A wall across the pass, held by some 2,500 to 3,000 Tibetans, was outflanked by Gurkhas climbing the slopes above it.
        lonlat: [90.150, 28.920]
    arrows:
