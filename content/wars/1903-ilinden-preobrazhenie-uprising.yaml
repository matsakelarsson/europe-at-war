id: ilinden-preobrazhenie-uprising
name: Ilinden–Preobrazhenie Uprising
start: "1903-08-02"
end: "1903-10"
tier: B
summary: A rising against Ottoman rule in Macedonia and the Adrianople region, organised by the Internal Macedonian-Adrianople Revolutionary Organisation. It began on Saint Elijah’s Day (Ilinden), 2 August 1903, when rebels held Kruševo for ten days, spread to the Strandzha mountains on the Feast of the Transfiguration (Preobrazhenie), and was crushed by the autumn with the burning of some 200 villages; it led the powers to impose the Mürzsteg reforms on the Ottoman government.
countries: [mk, gr, bg, tr]
sides:
  - id: imro
    name: Macedonian-Adrianople revolutionaries (IMARO)
    ink: red
    moves: Rebel moves
    success: Rebel success
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - The organisation, founded in Thessaloniki in 1893, changed its name several times and is usually called IMRO or IMARO in English. Both Bulgaria and North Macedonia celebrate the uprising as part of their national history, and they disagree over the national identity of its leaders and fighters.
  - The rising took place under the Julian calendar, by which Ilinden fell on 20 July and Preobrazhenie on 6 August; the dates here are New Style. Figures for villages burned and people killed come mainly from the organisation’s own reports and are approximate.
