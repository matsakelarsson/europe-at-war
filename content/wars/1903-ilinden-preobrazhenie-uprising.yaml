steps:
  - title: Ilinden and Preobrazhenie
    date: August – October 1903
    when: "1903-08-02"
    borders: "1903-08-02"
    countries: [mk, gr, bg, tr]
    body:
      - The revolutionary organisation had been preparing a rising for Macedonian and Thracian autonomy for years, but in 1903 arrests and the death of its best-known leader, Gotse Delchev, in May weakened it. A congress at Smilevo set the date anyway. On the night of 2 August, Saint Elijah’s Day, bands rose across the Manastır vilayet, cutting telegraph lines and attacking Ottoman posts. Some 800 rebels under Nikola Karev and Pitu Guli took the town of Kruševo and set up a provisional government, the Kruševo Republic. Rebels also held Smilevo and villages around Kastoria and Florina, and on 19 August a second rising broke out in the Strandzha mountains.
      - The Ottoman government sent tens of thousands of soldiers, with irregular bashi-bazouks. Kruševo was retaken after ten days, and Pitu Guli fell defending the approaches at Mečkin Kamen. By October the rising had been crushed. By the organisation’s count about 200 villages were burned, more than 4,000 civilians killed and some 70,000 people left homeless, and thousands fled to Bulgaria. The outcry led Austria-Hungary and Russia to agree the Mürzsteg reform programme in October 1903, which put foreign officers in charge of a reformed gendarmerie in Macedonia.
