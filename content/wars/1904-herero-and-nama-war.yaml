  - title: The Nama war
    date: October 1904 – 1906
    when: "1904-10-03"
    borders: "1904-10-03"
    countries: [na, de, za, bw]
    body:
      - "The Nama of the south had suffered the same loss of land as the Herero; Hendrik Witbooi, the leader of the ǀKhowesin at Gibeon, had fought the Germans in 1893–1894 and since then had served as their ally, sending men to fight the Herero. News of the slaughter in the Omaheke, rumours that the Nama would be disarmed next and the preaching of a prophet from the Cape convinced him to break with Germany. On 3 October 1904, in his seventies, he declared war; his men killed the district officer at Mariental and some forty German men in the south. Most Nama groups followed him, among them the Fransman Nama of Simon Kooper at Gochas, the Bethanie people of Cornelius Frederiks and the Veldskoendraers."
      - "The Nama did not risk a decisive battle like the Waterberg. They fought as mounted guerrillas, attacking convoys, patrols and farms and then vanishing into the dry hills and the Kalahari. In the far south Jakob Marengo, son of a Herero mother and a Nama father, led a mixed band from the Karas Mountains in more than fifty clashes. Germany had to bring in some 15,000 soldiers, and the war became a scandal in Berlin, where its costs led to the “Hottentot election” of 1907."
      - "Witbooi was mortally wounded on 29 October 1905 in an attack on a German supply column near Vaalgras, and his successor Samuel Isaak surrendered in November. Cornelius Frederiks surrendered in March 1906; Marengo, wounded in May 1906, crossed into the Cape Colony and was interned by the British. The Bondelswarts made peace at Ukamas in December 1906."
    facts:
      - [Witbooi declares war, "3 October 1904"]
      - [Witbooi killed, "29 October 1905, near Vaalgras"]
      - [German soldiers in the colony, "about 15,000 at the height of the war"]
