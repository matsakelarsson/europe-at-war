  - title: The Omaheke and the extermination order
    date: August – December 1904
    when: "1904-10-02"
    borders: "1904-10-02"
    countries: [na, de, bw]
    body:
      - "German columns pursued the Herero east, shooting men, women and children they caught and driving the rest away from the waterholes. Thousands died of thirst and hunger in the Omaheke; German patrols later reported wells dug deep into the sand where people had died searching for water. Trotha then closed the western edge of the sandveld with a cordon of posts some 250 km long, from Gobabis northwards, to stop the Herero returning."
      - "On 2 October 1904, at Osombo-Windimbe on the edge of the Omaheke, Trotha issued a proclamation: “Within the German borders, every Herero, with or without a gun, with or without cattle, will be shot. I shall no longer receive any women and children; I shall drive them back to their people or have them shot at.” He wrote that the Herero nation must be destroyed. In Germany the Social Democrats and churches protested, and settlers complained of the loss of labour and cattle; Chancellor Bernhard von Bülow persuaded the Kaiser to revoke the order, which was done in December 1904. Surviving Herero who gave themselves up were to be held in camps."
      - "Some 1,000 Herero, with Maharero, crossed the Omaheke and reached British Bechuanaland, where they were allowed to stay; Maharero died there in 1923, and his funeral at Okahandja became the yearly Herero Day. Others fled north to the Ovambo kingdoms, and small groups hid in the hills of the old Herero country."
    facts:
      - [Extermination order, "2 October 1904"]
      - [Order revoked, "December 1904"]
      - [Herero who reached Bechuanaland, "about 1,000"]
