notes:
  - "German writers of the time called the war the Herero and Hottentot uprising. That was the colonial term (Hottentot is now regarded as offensive); many Herero and Nama had signed protection treaties with Germany but had never accepted German rule over their land."
  - "Numbers are uncertain because no census was taken before the war. Most historians put the Herero population at 60,000–100,000 in 1904 and give a figure of about 15,000 surviving Herero in the census of 1911. About 1,000 Herero, Maharero among them, reached British Bechuanaland and a similar number the Ovambo kingdoms. About 1,500 German soldiers were killed or died of disease."
  - "Germany ruled the colony until South African troops conquered it in 1915; it was formally transferred in 1920."
