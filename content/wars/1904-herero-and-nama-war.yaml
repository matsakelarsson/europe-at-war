steps:
  - title: The Herero rising
    date: January – April 1904
    when: "1904-01-12"
    borders: "1904-01-12"
    countries: [na, de]
    body:
      - "The Herero were cattle herders of the central highlands of Namibia, divided among several chiefs, of whom Samuel Maharero at Okahandja was recognised by the Germans as paramount. Germany had made protection treaties with them in the 1880s and 1890s; under Governor Theodor Leutwein German rule spread through forts, roads and the railway from Swakopmund to Windhoek. The rinderpest of 1897 killed most of the Herero cattle; traders seized land and cattle for debts, settlers took the best grazing, and a German plan to confine the Herero to reserves, the abuse of Herero by settlers and the light sentences of German courts added to their anger."
      - "At the end of 1903 most of the colony’s 770 German soldiers marched south against a rising of the Bondelswarts Nama. On 12 January 1904 the Herero rose. They attacked farms, stores and posts across the centre of the colony, killed 123 or more German men, among them settlers, traders and soldiers, and drove off the German cattle. On Maharero’s orders women and children, missionaries, and the British, Boers and other non-Germans were mostly spared. The towns and forts of Okahandja, Windhoek, Omaruru, Otjimbingwe, Gobabis and Outjo were cut off; the Herero took the post at the Waterberg."
      - "Captain Victor Franke’s company hurried back from the south and broke through to Windhoek and Okahandja and, on 4 February, to Omaruru. Marines and reinforcements landed at Swakopmund from Germany. Leutwein, who wanted a negotiated end that would leave the Herero as a labour force, opened talks with Maharero, but settlers and the government in Berlin rejected any compromise. His columns were mauled at Owikokorero (13 March) and fought indecisive battles at Onganjira (9 April) and Oviumbo (13 April), after which he withdrew to wait for reinforcements; the Herero moved north-east towards the Waterberg."
    facts:
      - [Herero rising begins, "12 January 1904"]
      - [German men killed in the first days, "123 to about 160"]
      - [German soldiers in the colony, "about 770 at the start of 1904"]
      - [Omaruru relieved, "4 February 1904"]
