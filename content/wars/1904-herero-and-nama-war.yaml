  - title: The Waterberg (Ohamakari)
    date: June – August 1904
    when: "1904-08-11"
    borders: "1904-08-11"
    countries: [na, de]
    view:
      center: [17.40, -20.55]
      size: [90, 70]
    body:
      - "The government in Berlin, unhappy with Leutwein, sent Lieutenant-General Lothar von Trotha, a veteran of wars in East Africa and China, who arrived on 11 June 1904 with orders to crush the rising by all means. Trotha took military command from Leutwein and refused all offers to negotiate. Meanwhile Maharero had gathered his people, about 60,000 men, women and children with their herds, at the foot of the Waterberg plateau, where there was water and grazing; many Herero still expected to negotiate an end to the war."
      - "Trotha brought up some 1,500 soldiers with about 30 guns and 14 machine guns and closed in on the Herero from several sides. The battle was fought on 11 August 1904 around the waterholes of Ohamakari and the Waterberg. The Herero fought hard and held off the Germans in places, but under artillery and machine-gun fire their position broke, and that night and the next day the whole people, with their cattle, escaped through the weakest part of the German line, to the south-east, into the Omaheke, the dry sandveld that stretches to the border of British Bechuanaland. Whether Trotha left that gap on purpose is disputed. The Germans lost 26 killed and 60 wounded; the Herero losses in the battle are not known."
    facts:
      - [Trotha arrives in the colony, "11 June 1904"]
      - [Herero gathered at the Waterberg, "about 60,000 people with their cattle"]
      - [Battle of the Waterberg (Ohamakari), "11–12 August 1904"]
      - [German losses, "26 killed, 60 wounded"]
