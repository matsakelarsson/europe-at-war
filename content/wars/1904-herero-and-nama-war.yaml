id: herero-and-nama-war
name: Herero and Nama war and genocide
start: "1904-01-12"
end: "1908-03"
tier: A
summary: "The war of the Herero (Ovaherero) and Nama against German colonial rule in German South West Africa (Namibia), and the genocide with which Germany answered it. In January 1904 the Herero under Samuel Maharero rose against the loss of their land and cattle and the abuses of traders and settlers, killing more than a hundred German men. After the battle at the Waterberg (Ohamakari) on 11 August 1904 the German commander, General Lothar von Trotha, drove the Herero with their families and herds into the waterless Omaheke and ordered that every Herero found inside the colony be shot. In October 1904 the Nama under Hendrik Witbooi rose in the south and fought a guerrilla war that lasted, under leaders such as Jakob Marengo and Simon Kooper, into 1908. The survivors were held in concentration camps and made to work; about half of the prisoners died. Estimates of the dead range from 40,000 to 80,000 Herero, some 80 percent of the people, and about 10,000 Nama, half of them. The killings are widely regarded as the first genocide of the twentieth century; Germany acknowledged them as genocide in 2015."
countries: [na, de, bw]
sides:
  - id: her
    name: Herero (Ovaherero)
    polities: [herero]
