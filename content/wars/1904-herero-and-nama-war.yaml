  - title: The camps
    date: 1904 – 1908
    when: "1905-06-01"
    borders: "1905-06-01"
    countries: [na, de]
    body:
      - "From December 1904 Herero who surrendered or were rounded up, many of them brought in by missionaries who promised them safety, were held in concentration camps (Konzentrationslager, the word used at the time) at Windhoek, Okahandja, Karibib, Swakopmund and Lüderitz, and at smaller camps where labour was needed. Prisoners were hired out to the army, to the railways, to firms and to settlers and worked on short rations in the cold and damp of the coast. About half of the prisoners died of disease, hunger, exhaustion and abuse."
      - "The deadliest camp was on Shark Island off Lüderitz, used from 1905 for Herero and then for Nama prisoners, among them the Witbooi people and Cornelius Frederiks, who died there in February 1907. Estimates of the deaths on the island range from 1,032 to about 3,000. Major Ludwig von Estorff, who had promised the surrendering Nama their lives, protested, and the camp was closed in April 1907. Skulls and bones of the dead were sent to Germany for racial research; some have been returned to Namibia since 2011."
    facts:
      - [Main camps, "Windhoek, Okahandja, Karibib, Swakopmund, Lüderitz"]
      - [Deaths in the camps, "about half of the prisoners"]
      - [Deaths on Shark Island, "estimates range from 1,032 to about 3,000"]
