  - title: The end of the war and its legacy
    date: 1907 – 2021
    when: "1907-03-31"
    borders: "1908-03-01"
    countries: [na, de, za, bw]
    body:
      - "Germany declared the state of war over on 31 March 1907, but fighting went on. Marengo, released by the British in June 1907, returned to the borderlands and was killed by Cape police working with German troops on 20 September 1907. Simon Kooper fought on from the Kalahari; a German camel patrol attacked his people at Seatsub in March 1908 and killed most of them, but Kooper escaped to Bechuanaland, where an agreement between the British and German authorities paid him a yearly allowance on condition that he stayed there. The camps were closed and the prisoners released in 1908."
      - "The surviving Herero and Nama lost almost all their land, which was confiscated and sold to settlers, and were forbidden to own cattle; Africans over the age of seven had to carry passes and work for Europeans. Estimates of the dead range from 40,000 to 80,000 Herero, about 80 percent of the people, and some 10,000 Nama, about half of them; about 15,000 Herero and 10,000 Nama were counted in the colony in the early 1910s."
      - "Namibia, independent since 1990, counts Hendrik Witbooi and Jakob Marengo among its national heroes. In 2015 the German government acknowledged the killings as genocide, and in 2021 the two governments agreed that Germany would pay €1.1 billion in development aid over 30 years; many Herero and Nama leaders rejected the deal because they had not been party to the talks and because it was not called reparations."
    facts:
      - [State of war ended, "31 March 1907"]
      - [Marengo killed, "20 September 1907"]
      - [Herero deaths, "estimates range from 40,000 to 80,000"]
      - [Nama deaths, "about 10,000"]
      - [Germany acknowledges genocide, "2015"]
    markers:
