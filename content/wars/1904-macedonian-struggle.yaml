id: macedonian-struggle
name: Macedonian Struggle
start: "1904"
end: "1908-07"
tier: C
summary: An irregular war in Ottoman Macedonia after the failed Ilinden rising of 1903, in which armed bands backed by Greece and pro-Bulgarian bands, chiefly those of the Internal Macedonian-Adrianople Revolutionary Organisation (IMRO), fought each other, Serbian bands and Ottoman troops for the loyalty of the Slavic-speaking Christian villages. Villages were burned and priests, teachers and notables murdered on all sides until the Young Turk Revolution of July 1908 largely ended the fighting, though it went on at a lower level until the Balkan Wars.
countries: [gr, mk, bg, rs, tr]
sides:
  - id: gr
    name: Greek armed bands
    ink: navy
  - id: bg
    name: IMRO and Bulgarian-backed bands
    ink: green
  - id: rs
    name: Serbian bands (chetniks)
    ink: red
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
notes:
  - Known in Greece as the Makedonikos Agonas. The wider rivalry over Macedonia ran from the 1890s to 1912; 1904–1908 were the years of open guerrilla war between the bands.
  - Villages were pressed to declare for the Greek Patriarchate or the Bulgarian Exarchate. The death of the Greek officer Pavlos Melas in October 1904 drew many volunteers from Greece.
