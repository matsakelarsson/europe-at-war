  - title: Tsushima
    date: 27–28 May 1905
    when: "1905-05-27"
    borders: "1905-05-28"
    countries: [ru, jp]
    body:
      - In October 1904 Russia sent its Baltic Fleet, renamed the Second Pacific Squadron, around the world under Admiral Zinovy Rozhestvensky. On the way it fired on British fishing boats on the Dogger Bank, mistaking them for Japanese torpedo boats, and nearly caused a war with Britain. After a voyage of some 33,000 km, coaling from German colliers and waiting for weeks off Madagascar and in French Indochina, it entered the Tsushima Strait between Korea and Japan on 27 May 1905, heading for Vladivostok.
      - Tōgō’s fleet, faster, better trained and using better shells, met it in the strait that afternoon and crossed ahead of its line. Within an hour the Russian flagship Knyaz Suvorov was disabled and Rozhestvensky wounded. By the next day the Russians had lost all eight battleships engaged, sunk or captured, and most of their other ships; only a cruiser and two destroyers reached Vladivostok. About 5,000 Russian sailors were killed and some 6,000 captured; the Japanese lost three torpedo boats and about 117 men. It was one of the most complete naval victories in history.
    facts:
      - [Second Pacific Squadron sails, "October 1904"]
      - [Battle of Tsushima, "27–28 May 1905, Japanese victory"]
      - [Russian losses, "about 5,000 killed, 6,000 captured, 21 ships sunk"]
      - [Japanese losses, "about 117 killed, 3 torpedo boats"]
