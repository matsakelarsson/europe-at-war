  - title: Liaoyang and the Shaho
    date: August – October 1904
    when: "1904-08-24"
    borders: "1904-09-04"
    countries: [cn, ru, jp]
    body:
      - The three Japanese field armies of Kuroki, Oku and Nozu Michitsura, under Field Marshal Ōyama Iwao, converged on Liaoyang, where the Russian commander-in-chief, General Aleksey Kuropatkin, had built three lines of defences. The battle, from 24 August to 4 September 1904, involved some 125,000 Japanese and 158,000 Russians. When Kuroki crossed the Taizi river to threaten his line of retreat, Kuropatkin, although the Japanese had lost more men, withdrew in good order to Mukden. Each side lost some 17,000–23,000 men.
      - Reinforced by the Trans-Siberian Railway, Kuropatkin attacked south in October. In the battle of the Shaho, 5–17 October, the Russians were beaten back with about 40,000 casualties to the Japanese 20,000, and both armies dug in for the winter facing each other along the Shaho river. The fighting devastated the Chinese villages of the region, whose people were pressed into labour by both sides and lost their crops and houses.
    facts:
      - [Battle of Liaoyang, "24 August – 4 September 1904, Japanese victory"]
      - [Battle of the Shaho, "5–17 October 1904, Japanese victory"]
