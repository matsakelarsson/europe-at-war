  - title: Sakhalin and the Treaty of Portsmouth
    date: July – September 1905
    when: "1905-07-07"
    borders: "1905-09-05"
    countries: [ru, jp, cn, kr, us]
    body:
      - Tsushima and the revolution that had broken out in Russia in January 1905 made both governments ready to talk, and President Theodore Roosevelt offered to mediate. To have something more to bargain with, Japan landed troops on Sakhalin on 7 July 1905; by the end of the month the island’s small garrison and convict militia had surrendered. The talks opened at Portsmouth, New Hampshire, in August, with Sergei Witte for Russia and Komura Jutarō for Japan.
      - By the Treaty of Portsmouth of 5 September 1905 Russia recognised Japan’s paramount interests in Korea, transferred to Japan, with China’s consent, its lease of the Kwantung territory with Port Arthur and Dalny and the railway from Changchun to Port Arthur, and ceded Sakhalin south of the 50th parallel. Both sides were to leave the rest of Manchuria to China. Japan received no indemnity, and riots broke out in Tokyo at the news. In November Japan made Korea a protectorate. Roosevelt received the Nobel Peace Prize. Japan lost some 80,000 dead, more than a quarter of them from disease, and Russia 40,000–70,000; the number of Chinese civilians killed is unknown but was large.
    facts:
      - [Japanese landing on Sakhalin, "7 July 1905"]
      - [Treaty of Portsmouth, "5 September 1905"]
      - [Japanese dead, "about 80,000–86,000"]
      - [Russian dead, "about 43,000–71,000"]
