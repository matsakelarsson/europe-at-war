  - title: Mukden
    date: 20 February – 10 March 1905
    when: "1905-02-20"
    borders: "1905-03-10"
    countries: [cn, ru, jp]
    body:
      - With Nogi’s veterans freed from Port Arthur, Ōyama attacked the Russian lines south of Mukden in February 1905. It was the largest land battle fought anywhere before the First World War, with about 270,000 Japanese and some 300,000–330,000 Russians on a front of more than 100 km. A new Fifth Army under General Kawamura Kageaki attacked in the mountains on the east, drawing in Russian reserves, while Nogi’s Third Army swept round the western flank towards the railway north of the city.
      - Threatened with encirclement, Kuropatkin ordered a retreat on 9 March, and the Japanese entered Mukden the next day; the Russians fell back to Tieling and then to Siping. Russian losses are given as about 90,000 killed, wounded and captured, Japanese losses as about 70,000–75,000. Japan had won, but it had no more trained reserves and was running out of money, and the Russian army, still growing, had not been destroyed.
    facts:
      - [Battle of Mukden, "20 February – 10 March 1905, Japanese victory"]
      - [Troops engaged, "about 270,000 Japanese and 300,000–330,000 Russians"]
      - [Losses, "about 90,000 Russian and 70,000–75,000 Japanese"]
