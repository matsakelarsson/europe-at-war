steps:
  - title: Port Arthur and Chemulpo
    date: February – April 1904
    when: "1904-02-08"
    borders: "1904-02-10"
    countries: [cn, kr, ru, jp]
    body:
      - Russia had leased Port Arthur and Dalny on the Liaodong peninsula in 1898, three years after it had joined France and Germany in forcing Japan to hand the same peninsula back to China. It occupied Manchuria in 1900 and did not leave, and Russian interests reached into Korea, which Japan regarded as its own sphere. Backed by its alliance of 1902 with Britain, Japan offered to recognise Russia’s position in Manchuria in return for a free hand in Korea. Talks dragged on, and on 6 February 1904 Japan broke off relations.
      - On the night of 8–9 February Japanese destroyers made a torpedo attack on the Russian Pacific Squadron in the outer roads of Port Arthur, damaging two battleships and a cruiser. On 9 February a Japanese squadron covering troop landings at Chemulpo, the port of Seoul, forced the cruiser Varyag and the gunboat Korietz into action, and their crews scuttled them. Japan declared war on 10 February. The Japanese First Army under General Kuroki Tamemoto landed in Korea and marched north, and on 23 February Korea had to sign a protocol giving Japan military use of its territory. At Port Arthur the energetic Admiral Stepan Makarov took command of the fleet, but on 13 April his flagship, the Petropavlovsk, struck a mine and sank with him and most of its crew.
    facts:
      - [Attack on Port Arthur, "night of 8–9 February 1904"]
      - [Battle of Chemulpo Bay, "9 February 1904"]
      - [Japan declares war, "10 February 1904"]
      - [Makarov killed, "13 April 1904"]
