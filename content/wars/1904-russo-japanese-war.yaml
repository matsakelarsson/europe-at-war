id: russo-japanese-war
name: Russo-Japanese War
start: "1904-02-08"
end: "1905-09-05"
tier: A
summary: "A war between the Russian Empire and the Empire of Japan over Manchuria and Korea, fought mostly on Chinese soil and in the seas around Korea. Japan opened it with a surprise torpedo attack on the Russian fleet at Port Arthur (Lüshun) in February 1904, landed armies in Korea and on the Liaodong peninsula, crossed the Yalu and drove the Russians north at Liaoyang. After a five-month siege Port Arthur surrendered in January 1905; in March the Japanese won the vast battle of Mukden (Shenyang), and in May Admiral Tōgō Heihachirō destroyed the Russian Baltic Fleet at Tsushima. With both sides exhausted and Russia shaken by revolution, the Treaty of Portsmouth, mediated by President Theodore Roosevelt, gave Japan the Kwantung lease, the South Manchuria Railway and southern Sakhalin and a free hand in Korea. It was the first victory of an Asian power over a European great power in modern times. Some 80,000 Japanese and 40,000–70,000 Russian soldiers died, as did many Chinese civilians."
countries: [cn, ru, jp, kr, kp]
sides:
  - id: jp
    name: Empire of Japan
    polities: [japan]
    ink: red
    moves: Japanese moves
    success: Japanese success
  - id: ru
    name: Russian Empire
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
notes:
  - China and Korea were officially neutral. Most of the land war was fought in Manchuria, nominally Qing territory under Russian occupation since 1900, and Japan occupied Korea from the first days of the war; in 1905 it made Korea a protectorate and in 1910 annexed it.
  - Russia then still used the Julian calendar; dates here are Gregorian. Japanese and Russian casualty figures differ between sources; the ranges given are those of recent studies.
  - Places are given by their names of the time with today’s pinyin where it helps (Port Arthur, today Lüshun; Dalny, today Dalian; Mukden, today Shenyang; Chemulpo, today Incheon).
