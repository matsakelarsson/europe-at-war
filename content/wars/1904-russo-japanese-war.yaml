  - title: The Yellow Sea and Ulsan
    date: August 1904
    when: "1904-08-10"
    borders: "1904-08-14"
    countries: [cn, kr, ru, jp]
    body:
      - As Nogi’s guns came within range of the harbour, the tsar ordered the Port Arthur squadron to break out to Vladivostok. On 10 August 1904 Admiral Wilgelm Vitgeft sailed with six battleships and was intercepted by Tōgō’s fleet in the Yellow Sea. For hours the Russians seemed to be getting away, until two Japanese shells hit the bridge of the flagship Tsesarevich, killing Vitgeft and jamming its helm. The Russian line fell into confusion; most ships returned to Port Arthur, while others fled to neutral ports and were interned.
      - Four days later, on 14 August, Admiral Kamimura Hikonojō’s cruisers caught the Vladivostok cruiser squadron, which had come south to meet the Port Arthur ships, off Ulsan on the Korean coast. The Rurik was sunk and the other two cruisers were badly damaged. Japan now controlled the seas between its islands and the mainland, and the remaining Russian battleships were trapped in Port Arthur.
    facts:
      - [Battle of the Yellow Sea, "10 August 1904"]
      - [Battle off Ulsan, "14 August 1904"]
