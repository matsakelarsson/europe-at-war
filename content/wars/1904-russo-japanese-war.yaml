  - title: The siege of Port Arthur
    date: August 1904 – January 1905
    when: "1904-12-05"
    borders: "1905-01-02"
    countries: [cn, ru, jp]
    body:
      - Port Arthur was ringed by modern forts on the hills around the town and harbour, held by some 50,000 men under General Anatoly Stessel, with General Roman Kondratenko directing the defence. Nogi’s Third Army made its first general assault in August 1904 and lost about 15,000 men without taking the main forts. Further assaults in September, October and November, now supported by huge 280 mm howitzers brought from Japan, were also bloodily repulsed, while Japanese sappers tunnelled under the forts.
      - At the end of November Nogi turned on 203 Metre Hill, west of the town, from which the harbour could be seen. It was taken on 5 December after ten days of fighting that cost the Japanese about 8,000 casualties and the Russians some 5,000. Directed from its summit, the howitzers sank the trapped battleships one after another. Kondratenko was killed on 15 December, the eastern forts fell, and on 2 January 1905 Stessel surrendered with some 25,000 men, many of them sick or wounded. The siege cost the Japanese some 57,000–60,000 killed and wounded and the Russians about 31,000; Nogi lost both his sons in the war.
    facts:
      - [First general assault, "19–24 August 1904"]
      - [203 Metre Hill taken, "5 December 1904"]
      - [Port Arthur surrenders, "2 January 1905"]
      - [Japanese casualties, "some 57,000–60,000 killed and wounded"]
