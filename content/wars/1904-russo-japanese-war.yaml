  - title: The Yalu, Nanshan and the road to Port Arthur
    date: April – June 1904
    when: "1904-04-30"
    borders: "1904-05-30"
    countries: [cn, kp, ru, jp]
    body:
      - On 30 April – 1 May 1904 Kuroki’s First Army forced the crossing of the Yalu river at Jiuliancheng, opposite Uiju, against a Russian force less than half its size. It was the first major land battle of the war and showed that the Japanese could beat a European army. On 5 May the Second Army under General Oku Yasukata began landing at Pitzuwo (Pikou) on the Liaodong peninsula, cutting Port Arthur off by land.
      - On 26 May Oku stormed the Russian entrenchments on the Nanshan hill at the neck of the peninsula, losing some 4,000–6,000 men in a day against barbed wire and machine guns. The Russians abandoned the commercial port of Dalny, which the Japanese entered on 30 May and made their supply base. A Russian corps sent south to relieve Port Arthur under General Georgy Stackelberg was beaten at Telissu (Wafangou) on 14–15 June. A new Third Army under General Nogi Maresuke landed to besiege the fortress, while Oku turned north.
    facts:
      - [Battle of the Yalu, "30 April – 1 May 1904, Japanese victory"]
      - [Landing at Pitzuwo, "from 5 May 1904"]
      - [Battle of Nanshan, "25–26 May 1904, Japanese victory"]
      - [Battle of Telissu, "14–15 June 1904, Japanese victory"]
