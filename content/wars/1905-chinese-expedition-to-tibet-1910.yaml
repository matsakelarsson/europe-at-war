    success: Tibetan success
notes:
  - Zhao Erfeng’s campaigns are remembered in Tibetan sources for the destruction of monasteries and the killing of monks and lay people, and earned him the nickname “Butcher Zhao”; Chinese historians have often praised his reforms of the frontier. Numbers of the dead are not known.
  - The expulsion of the Qing garrisons from Tibet in 1912–1913 has its own entry, as does the British expedition to Tibet of 1903–1904.
