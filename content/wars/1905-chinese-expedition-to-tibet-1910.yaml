  - title: Revolution and the fall of Zhao Erfeng
    date: 1911 – 1912
    when: "1911-12-22"
    borders: "1911-12-22"
    countries: [cn]
    body:
      - In 1911 Zhao returned to Sichuan as governor-general, leaving his subordinate Fu Songmu in charge of the frontier. The railway protests in Sichuan grew into a revolution, and in November the province declared its independence. Zhao handed over power but stayed in Chengdu with his troops, and on 22 December 1911 the revolutionary officer Yin Changheng had him arrested and beheaded.
      - In Lhasa the news of the revolution split the Qing garrison. Soldiers turned on their officers and looted the city, and in 1912 Tibetan forces, organised from India by the Dalai Lama, rose against them; the end of Qing rule in Tibet is told in its own entry. Many of the counties Zhao had created in Kham remained under Chinese control and later became the province of Xikang.
    facts:
      - [Sichuan declares independence, "27 November 1911"]
      - [Zhao Erfeng executed, "22 December 1911"]
