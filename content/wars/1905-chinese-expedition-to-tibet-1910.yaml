id: chinese-expedition-to-tibet-1910
name: Zhao Erfeng’s campaigns and the Chinese expedition to Tibet
start: "1905-04"
end: "1912-01"
tier: B
summary: "The last Qing attempt to bring Tibet and the Tibetan lands of Kham under direct rule. After the British expedition to Lhasa in 1903–1904, the Qing court began to settle Chinese farmers and open mines in Kham. In April 1905 the people and monks of Batang rose and killed the assistant amban Feng Quan. Zhao Erfeng, sent from Sichuan, crushed the rising, besieged and destroyed the great monastery of Sampheling at Chatreng in 1906, and over the next five years abolished the Tibetan chiefdoms of Kham one by one, replacing them with Chinese counties. In 1909 a Sichuan army under Zhong Ying marched on Lhasa; it entered the city on 12 February 1910, and the 13th Dalai Lama fled to British India, where the Qing declared him deposed. Zhao’s troops took Chamdo and pushed into Pome and Zayul. After the Xinhai Revolution, revolutionaries in Chengdu executed Zhao in December 1911, and the Qing garrison in Lhasa fell apart."
countries: [cn, in]
sides:
  - id: qing
    name: Qing China
    polities: [qing]
    ink: gold
    moves: Qing moves
    success: Qing success
  - id: tib
    name: Tibet and the Tibetan chiefdoms and monasteries of Kham
    polities: [tibet, tibetan-chiefdoms]
    ink: slate
