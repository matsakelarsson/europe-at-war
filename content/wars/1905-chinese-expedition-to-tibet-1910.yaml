steps:
  - title: Batang and Chatreng
    date: 1905 – 1908
    when: "1905-04"
    borders: "1906-06"
    countries: [cn]
    body:
      - The road from Sichuan to Lhasa ran through Kham, a land of Tibetan chiefdoms and powerful monasteries that had acknowledged the Qing since the 1720s but governed themselves. In 1904 the new assistant amban Feng Quan stopped at Batang on his way to Chamdo and began to settle Chinese farmers on monastery land and to limit the number of monks. In April 1905 the monks and people of Batang rose, killed him and his escort, and destroyed the Catholic missions of the area, killing several missionaries.
      - Zhao Erfeng, a Sichuan official, retook Batang in mid-1905 and executed the chiefs and many monks. The rising spread to Litang and Chatreng, where the monks of Sampheling, one of the largest monasteries of Kham, held out for months against his siege. When it fell in 1906 the monastery was destroyed and many of its monks killed. Zhao began to abolish the hereditary chiefs and replace them with Chinese magistrates, and in 1908 he was made commissioner for the Sichuan–Yunnan frontier and also amban of Tibet.
    facts:
      - [Batang rising, "April 1905"]
      - [Sampheling monastery taken, "1906"]
      - [Zhao Erfeng made frontier commissioner, "1908"]
