  - title: The march on Lhasa
    date: 1909 – 1910
    when: "1910-02-12"
    borders: "1910-02-12"
    countries: [cn, in]
    body:
      - The 13th Dalai Lama, who had fled to Mongolia before the British reached Lhasa in 1904, returned to Lhasa in December 1909 after a visit to Beijing. By then Zhao had taken the large kingdom of Derge, and the amban Lianyu had called for troops. An army of about 2,000 men from Sichuan under Zhong Ying marched on Lhasa, while Zhao’s forces occupied Chamdo and the lands along the road. Tibetan troops tried to stop the column on the way but were pushed aside.
      - Zhong Ying’s troops entered Lhasa on 12 February 1910, firing shots in the streets. That night the Dalai Lama and his ministers fled south, through Phari to Sikkim and then to Darjeeling in British India; on 25 February the Qing declared him deposed. Britain protested but did not intervene. The Qing ruled Lhasa directly through the amban, and Zhao’s troops pushed on into Pome and Zayul in the south-east, close to the Assam frontier.
    facts:
