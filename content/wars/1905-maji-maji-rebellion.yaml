  - title: The Ngoni and the German counter-attack
    date: September – November 1905
    when: "1905-10-21"
    borders: "1905-11-30"
    countries: [tz]
    body:
      - "In September the rising spread south-west to the Ngoni of Songea, a powerful kingdom of warriors whose leaders, among them Nduna Songea Mbano, hoped to win back the power they had lost to the Germans in the 1890s. With the Ngoni, the war covered almost the whole south of the colony, from the Rufiji to the Ruvuma and west towards Lake Nyasa. The Hehe of Iringa, defeated by the Germans a few years before, refused to join, and many Yao chiefs stayed loyal to the Germans."
      - "The Germans rushed in reinforcements. Two cruisers brought marines to the coast, new askari and auxiliaries were recruited, and early in 1906 even a contingent of recruits from German New Guinea was shipped in. On 21 October a force from Mahenge attacked a camp of some 5,000 Ngoni warriors, who fell back under machine-gun fire; one is reported to have shouted that the maji was a lie. In early November the officer Robert von Krieg brought ammunition from Iringa to the hard-pressed station at Mahenge, and Major Kurt Johannes led a column from Kilwa through Liwale into the Ngoni country, reaching Songea at the end of November."
    facts:
      - [Ngoni join the rising, "September 1905"]
      - [Ngoni camp attacked, "21 October 1905"]
      - [Johannes reaches Songea, "end of November 1905"]
