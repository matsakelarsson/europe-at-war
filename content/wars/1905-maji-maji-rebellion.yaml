  - title: The great hunger
    date: 1906 – 1908
    when: "1907-08"
    borders: "1907-08-31"
    countries: [tz]
    body:
      - "The famine that the scorched earth caused killed far more people than the fighting. Estimates of the dead of the war and the hunger range from 75,000, the figure German officials gave, to 300,000; the German Historical Museum considers about 180,000 likely. The historian Gilbert Gwassa estimated that a third of the population of the war zone died, and a study of Ulanga, around Mahenge, found that the birth rate of surviving women fell by about a quarter. Large parts of the south were left thinly peopled for decades. The German side lost 15 Europeans and about 390 askari and auxiliaries killed."
      - "Together with the war against the Herero and Nama in German South West Africa, the war led to a debate in Germany about colonial rule and to reforms under the new colonial secretary, Bernhard Dernburg. In East Africa the new governor, Albrecht von Rechenberg, dropped the forced communal cotton fields and favoured African peasant farming over settler plantations. In independent Tanzania the war became a founding story of the nation. In November 2023 the German president, Frank-Walter Steinmeier, visited the Maji Maji museum at Songea and apologised for the crimes of German colonial rule."
    facts:
      - [Deaths, "estimates range from 75,000 to 300,000"]
      - [Population of the war zone, "fell by about a third"]
      - [German side killed, "15 Europeans, about 390 askari and auxiliaries"]
