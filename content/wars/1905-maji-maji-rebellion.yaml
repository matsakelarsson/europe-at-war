        lonlat: [39.40, -8.75]
  - title: The rising begins
    date: July – August 1905
    when: "1905-07-31"
    borders: "1905-08-17"
    countries: [tz]
    body:
      - "In mid-July 1905 the German authorities, alarmed by the pilgrimages, arrested several healers, Kinjikitile among them. Around 20 July men of Nandete, in the Matumbi hills, pulled up the cotton in the communal field, and the police sent to punish them were beaten off. On 31 July the Matumbi marched on Samanga on the coast and destroyed the cotton crop and the trading post. Kinjikitile was hanged for treason on 4 August, but the rising was already spreading. Fighters killed akidas, Arab and Indian traders, missionaries and the few German settlers, and burned stations, shops and mission churches."
      - "The Ngindo of the wide, thinly peopled country to the south-west rose next. In mid-August they took the German post at Liwale after a siege of three days, killing two Germans and several askari. On 14 August Ngindo fighters killed the Benedictine bishop Cassian Spiss and four companions who were travelling through the interior. On 16 August the rising reached the Kilombero valley, where fighters wiped out the small garrison at Ifakara; the road to the station at Mahenge lay open."
    facts:
      - [Cotton uprooted at Nandete, "about 20 July 1905"]
      - [Kinjikitile hanged, "4 August 1905"]
      - [Liwale and Ifakara taken, "mid-August 1905"]
