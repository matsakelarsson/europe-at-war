steps:
  - title: Cotton and the water
    date: 1898 – July 1905
    when: "1905-07"
    borders: "1905-07-01"
    countries: [tz]
    body:
      - "German rule in the south of the colony was thin: a few military stations, and below them akidas, mostly coastal Swahili or Arab agents, and village headmen (jumbes) who collected the taxes and called out labour. A head tax was introduced in 1898, payable in money, which forced men to work for wages on plantations or caravans. In 1902 Governor Gustav Adolf von Götzen ordered the villages of the south to grow cotton for export on communal fields. The work was forced, supervised by the akidas and their men with the whip, and the pay was tiny or nothing; it took people from their own fields. When the rains failed in 1905, hunger came on top of the anger."
      - "At Ngarambe, in the hinterland of the Rufiji delta, a healer named Kinjikitile Ngwale said in 1904 that he had been possessed by a spirit, Hongo, through whom he spoke for the deity Bokero (or Bokera). Pilgrims came to him from far away and took home maji, water mixed with millet and castor oil, which was to protect them from the Germans’ bullets and unite them against the foreigners. The medicine was carried from village to village by his agents and gave peoples who had often fought one another a common cause and a promise of victory."
    facts:
      - [Head tax introduced, "1898"]
      - [Communal cotton fields ordered, "1902"]
      - [Kinjikitile’s maji, "from 1904"]
