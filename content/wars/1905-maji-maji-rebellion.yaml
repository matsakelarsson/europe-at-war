        date: "1905"
        text: Capital of German East Africa and seat of Governor von Götzen.
        lonlat: [39.28, -6.82]
      - kind: event
        side: mm
        name: Matumbi hills
        date: 1904–1905
        text: Pilgrims from the surrounding country, the Matumbi among them, went to Kinjikitile at Ngarambe for the maji.
        lonlat: [38.92, -8.48]
      - kind: event
