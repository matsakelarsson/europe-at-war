  - title: Scorched earth
    date: November 1905 – 1907
    when: "1906-02-27"
    borders: "1906-04-30"
    countries: [tz]
    body:
      - "The Germans could not catch the bands in the bush, so they made war on the land that fed them. Columns of askari and auxiliaries marched through the south burning villages, looting granaries, destroying stores of food and cutting down or burning the crops in the fields; women and children were taken captive. “Only hunger and want can bring about a final submission,” Captain Wangenheim wrote in 1905. Von Krieg reported that his auxiliaries understood the burning of villages and fields “quite well”."
      - "Leaders who were captured were tried by court martial and hanged. At Songea in February 1906 the Germans hanged dozens of Ngoni leaders, among them Nduna Songea Mbano, whose name the town bears; the executions are commemorated there every year on 27 February. By April 1906 the heaviest fighting was over and most of the peoples of the south had submitted, but in parts of the south-east bands fought on until August 1907, and the last guerrilla leaders were captured and executed in 1908."
    facts:
      - [Ngoni leaders hanged at Songea, "February 1906"]
      - [Main fighting ends, "April 1906"]
      - [Last bands, "1907–1908"]
    markers:
      - kind: event
        side: de
        name: Songea
        date: February 1906
        text: The Germans hanged dozens of Ngoni leaders here, among them Nduna Songea Mbano. The Maji Maji Memorial Museum stands by their graves.
        lonlat: [35.65, -10.68]
      - kind: event
        side: de
        name: Liwale
        date: 1905–1906
        text: German columns marching through the Ngindo country burned villages and food stores.
        lonlat: [37.93, -9.77]
    areas:
