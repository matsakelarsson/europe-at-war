  - title: Mahenge
    date: 30 August 1905
    when: "1905-08-30"
    borders: "1905-08-30"
    countries: [tz]
    body:
      - "Mahenge, a German station on a plateau above the Kilombero valley, was held by Lieutenant Theodor von Hassel with about 60 askari, a few hundred local auxiliaries and two machine guns. On 30 August 1905 several thousand fighters, Pogoro and Mbunga men who had taken the maji, attacked it in two great columns. The machine guns opened fire at about a thousand metres; the first column broke, and the second, of about 1,200 men, was shot down close to the defenders’ line. At least 600 attackers were killed; the German side lost no more than about twenty men."
      - "Mahenge showed that the maji did not stop bullets. But the rising went on, and the station remained cut off and under threat for weeks, while bands controlled the country around it. Other German posts held out too, and the coastal towns could be supplied by sea."
    facts:
