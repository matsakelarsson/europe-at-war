id: maji-maji-rebellion
name: Maji Maji war
start: "1905-07"
end: "1907-08"
tier: A
summary: "The largest rising against German rule in Africa, fought across the south of German East Africa (mainland Tanzania). Head taxes, forced labour and above all the communal cotton fields that Governor Gustav Adolf von Götzen imposed from 1902 had made German rule hated, and the drought of 1905 brought hunger. The healer Kinjikitile Ngwale gave his followers maji, water that was to turn German bullets to water. In late July 1905 the Matumbi people of the hills north-west of Kilwa uprooted the cotton and attacked traders and officials, and within weeks the rising spread across much of the south of the colony, uniting peoples of many languages, among them the Ngindo, Pogoro, Mbunga and the Ngoni of Songea. The machine guns of the German stations, above all at Mahenge on 30 August, broke the great assaults, and from October German columns of African soldiers (askari) and auxiliaries burned villages, crops and food stores to starve the rebels into surrender. The main fighting ended in April 1906 and the last bands in 1907–1908. Estimates of the dead, most of whom died of the famine that followed, range from 75,000 to 300,000; German losses were 15 Europeans and about 390 African soldiers and auxiliaries."
countries: [tz, de]
sides:
  - id: mm
    name: Maji Maji fighters
    polities: [maji-maji]
    ink: green
    moves: Maji Maji moves
    success: Maji Maji success
  - id: de
    name: German East Africa
    polities: [german-east-africa, germany]
    ink: slate
    moves: German moves
    success: German success
notes:
  - "German officials called it the Maji-Maji-Aufstand (Maji Maji rising or rebellion). In Tanzania it is known as the Maji Maji war, and nationalists, Julius Nyerere among them, presented it as the first common struggle of the country’s peoples against colonial rule. Historians such as John Iliffe and Gilbert Gwassa have studied how the maji cult carried the rising across ethnic lines, and how far it was one war or many local ones."
  - "Most of the German side’s soldiers were Africans: askari of the Schutztruppe and auxiliaries (ruga-ruga) recruited locally. Some peoples stayed out of the rising or fought for the Germans, among them the Hehe, who had been defeated in the 1890s, and many Yao."
  - "Dates differ between sources: the first rising at Nandete is dated about 20 July, the attack on Liwale 13 or 15 August and that on Ifakara 16 or 17 August 1905. German figures for their own dead are 15 Europeans, 73 askari and 316 auxiliaries; the German Historical Museum gives about 450 African soldiers and porters."
