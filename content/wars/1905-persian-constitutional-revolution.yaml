steps:
  - title: Sanctuary and a parliament
    date: 1905–1907
    when: "1905-12"
    borders: "1907-08-31"
    countries: [ir]
    body:
      - Iran under the Qajar shahs was poor, deeply in debt to Russia and Britain, and had sold many of its revenues to foreign concessionaires. In December 1905 the governor of Tehran had two sugar merchants beaten on the soles of their feet for keeping prices high. Merchants and clerics took sanctuary (bast) in the shrine of Shah Abdol-Azim south of the city, and Mozaffar ad-Din Shah promised a “house of justice”. When nothing came of it and troops killed a seminary student in July 1906, leading clerics withdrew to Qom and some 12,000 to 14,000 merchants, guildsmen and students camped in the garden of the British legation.
      - On 5 August 1906 the ailing shah signed a decree for an elected national assembly. The first Majlis opened in Tehran on 7 October, and he signed the Fundamental Law on 30 December, a few days before his death. Elected councils (anjomans) sprang up in the provinces, above all in Tabriz. His son Mohammad Ali Shah disliked the constitution but signed the Supplementary Fundamental Law, which laid down civil rights and the powers of the Majlis, on 7 October 1907.
      - On 31 August 1907 Britain and Russia settled their rivalry in Asia by the Anglo-Russian Convention. Without consulting Iran, they divided it into a Russian sphere of influence in the north, a British sphere in the south-east and a neutral zone between them.
    facts:
      - [Bast in the British legation, "July 1906, about 12,000–14,000 people"]
      - [Decree for a Majlis, "5 August 1906"]
      - [Fundamental Law, "30 December 1906"]
      - [Anglo-Russian Convention, "31 August 1907"]
