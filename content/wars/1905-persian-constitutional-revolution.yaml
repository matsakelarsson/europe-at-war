  - title: The ex-shah’s return and the Russian ultimatum
    date: "1911"
    when: "1911-07-18"
    borders: "1911-12-24"
    countries: [ir]
    body:
      - The restored constitutional government struggled with an empty treasury, rival factions and armed militias; in August 1910 the government disarmed the fighters at Tehran’s Atabak Park, and Sattar Khan was wounded. In May 1911 the second Majlis hired the American financial expert Morgan Shuster as treasurer-general, and he set about collecting taxes with a new treasury gendarmerie. On 18 July 1911 the deposed Mohammad Ali Shah landed at Gomesh Tepe on the Turkmen coast of the Caspian with Russian connivance, while his brother Salar od-Dowleh raised the Kurds and Lurs in the west.
      - Government forces under Yeprem Khan and the Bakhtiaris defeated the ex-shah’s army near Varamin on 5 September 1911, and its commander, Arshad od-Dowleh, was captured and shot; Salar od-Dowleh was beaten later in the month. Mohammad Ali left Iran again in 1912.
      - Russia now turned on Shuster. On 29 November 1911 it demanded his dismissal and the right to approve foreign advisers, and sent troops from Rasht towards Qazvin. The Majlis refused, but on 24 December the regent and his cabinet, backed by the Bakhtiari chiefs, closed it, and Shuster left. Russian troops crushed the militias of Tabriz and Rasht in late December, and in Tabriz they hanged a number of constitutionalists, among them the cleric Seqat ol-Eslam, on 31 December, the day of Ashura. No Majlis met again until 1914.
    facts:
      - [Ex-shah lands, "18 July 1911"]
      - [Battle near Varamin, "5 September 1911, government victory"]
      - [Russian ultimatum, "29 November 1911"]
      - [Majlis closed, "24 December 1911"]
    markers:
