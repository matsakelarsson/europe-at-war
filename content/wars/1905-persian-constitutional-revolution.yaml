id: persian-constitutional-revolution
name: Persian Constitutional Revolution
start: "1905-12"
end: "1911-12-24"
tier: B
summary: The revolution that gave Iran its first constitution and parliament, and the civil war that followed. Protests by merchants, clerics and reformers forced Mozaffar ad-Din Shah to grant an elected assembly (Majlis) in 1906. His son Mohammad Ali Shah had the Majlis shelled in 1908, but Tabriz held out through a long siege, and in 1909 constitutionalist forces from Gilan and the Bakhtiari tribes took Tehran and deposed him. Russian intervention, with British acquiescence, ended the revolutionary period in December 1911.
