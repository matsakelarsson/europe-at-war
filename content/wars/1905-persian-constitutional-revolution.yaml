notes:
  - Dates are Gregorian. Persian sources of the time used the lunar Hijri calendar, and some dates differ by a day in modern accounts.
  - After July 1909 the constitutionalists formed the government; the side “Constitutionalists” then stands for the constitutional government and its forces.
