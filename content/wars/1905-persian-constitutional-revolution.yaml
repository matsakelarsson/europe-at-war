  - title: The coup and the siege of Tabriz
    date: 1908–1909
    when: "1908-06-23"
    borders: "1909-07-16"
    countries: [ir, az]
    body:
      - On 23 June 1908 the Persian Cossack Brigade, commanded by the Russian colonel Vladimir Liakhov, shelled the Majlis building on the shah’s orders. Deputies and journalists were arrested, several, among them the editor Mirza Jahangir Khan and the preacher Malek al-Motakallemin, were put to death in the shah’s garden, and the Majlis was closed. In Tabriz the council’s militia, led by the former horse dealer Sattar Khan and the bricklayer Baqer Khan, drove out the royalists from most of the city.
      - Royalist troops and tribal horsemen besieged Tabriz from the summer of 1908. Volunteers from the Russian Caucasus, Armenian, Georgian and Muslim revolutionaries, joined the defenders, and by early 1909 the blockade had brought famine; the American teacher Howard Baskerville was killed leading a sortie on 19 April. On 29 April 1909 Russian troops entered Tabriz, with British consent, to open the roads and bring in food. The siege was over, but the Russians stayed.
      - Meanwhile the revolution spread. Constitutionalists seized Rasht in February 1909, and a force of Gilan fighters under the Armenian Yeprem Khan and the landowner Sepahdar marched on Qazvin. In the south the Bakhtiari tribal chiefs took Isfahan in January, and Sardar Asad led their horsemen north. The two forces entered Tehran on 13 July 1909. Mohammad Ali Shah took refuge in the Russian legation on 16 July and was deposed in favour of his 11-year-old son, Ahmad Shah.
    facts:
      - [Majlis shelled, "23 June 1908"]
      - [Siege of Tabriz, "summer 1908 – 29 April 1909"]
      - [Tehran taken, "13 July 1909"]
      - [Mohammad Ali Shah deposed, "16 July 1909"]
