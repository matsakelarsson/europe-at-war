id: bambatha-rebellion
name: Bambatha rising
start: "1906-02-08"
end: "1906-07-11"
tier: C
summary: "The last armed Zulu resistance to colonial rule, in the British Colony of Natal in 1906, known in the colonial records as the Bambatha Rebellion or Zulu Rebellion. In 1905 Natal imposed a poll tax of £1 on every African man over eighteen, on top of the hut tax, to push men into wage labour at a time of depression, cattle disease and land loss. Protests at the tax collection led to the killing of two policemen near Richmond on 8 February 1906 and to martial law; the colonial militia burned homesteads and executed twelve men. Bambatha kaMancinza, chief of the Zondi in the Mpanza valley near Greytown, was deposed for resisting the tax. In April he attacked a police patrol and withdrew into the Nkandla forest of Zululand, where the elderly chief Sigananda of the Cube joined him, and many hoped for the support of Dinuzulu, son of the last Zulu king. A colonial force of over 4,000 men under Colonel Duncan McKenzie surrounded the main body of fighters in the Mome Gorge on 10 June 1906 and killed hundreds with machine guns and artillery; the colonial forces said Bambatha was among the dead and displayed a head as his, but many Zulu believe that he escaped to Mozambique. A rising under Meseni in the lower Thukela valley was crushed by 11 July. Between 3,000 and 4,000 Africans were killed, more than 7,000 imprisoned and some 4,000 flogged; 36 colonial soldiers died. Dinuzulu was tried for treason and imprisoned. Mohandas Gandhi led an Indian stretcher-bearer corps for the colonial forces and later called the campaign “no war but a man hunt”. In 2006 South Africa declared Bambatha a national hero."
