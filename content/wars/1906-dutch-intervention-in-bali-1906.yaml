notes:
  - Puputan (from puput, to end) was a ritual end chosen by a Balinese court facing defeat; Dutch accounts often described it as mass suicide, while Balinese tradition honours it as a choice of death over surrender. The Dutch never published an official count of the dead.
  - The puputan of Klungkung is dated 28 April 1908, the date commemorated in Bali; some accounts give 18 April.
