  - title: Klungkung, 1908
    date: April 1908
    when: "1908-04-28"
    borders: "1908-04-28"
    countries: [id]
    body:
      - By 1908 Karangasem and Gianyar were under Dutch protection, and only Klungkung and Bangli kept their independence. That year the Dutch began to impose a government opium monopoly, which the Dewa Agung of Klungkung, Dewa Agung Jambe II, opposed. On 16 April 1908 Cokorda Gelgel, a member of the Klungkung dynasty, led an attack on the Dutch opium store at Gelgel, near Klungkung, while the Dewa Agung ordered the opium store in Klungkung itself closed. Dutch troops killed about 100 people in Gelgel, Cokorda Gelgel fled to Klungkung, and Dutch warships and artillery bombarded the town.
      - On 28 April 1908 the Dewa Agung, dressed in white and carrying a kris, came out of his palace with about 200 followers and walked towards the Dutch troops. He was shot; his six wives killed themselves with their krisses, and others of the procession followed. Dutch figures give about 200 Balinese dead and a handful of Dutch casualties. The palace was burned except for its gate and the hall of justice, and Klungkung was placed under direct Dutch rule. The raja of Bangli accepted a Dutch protectorate in October 1908, and the conquest of Bali was complete.
    facts:
      - [Rising at Gelgel, "16 April 1908"]
      - [Puputan of Klungkung, "28 April 1908"]
      - [Balinese dead, "about 200 by Dutch figures"]
