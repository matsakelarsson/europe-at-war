id: dutch-intervention-in-bali-1906
name: Dutch intervention in Bali (1906–1908)
start: "1906-09-14"
end: "1908-04-28"
tier: B
summary: "The Dutch conquest of the last independent kingdoms of southern Bali. After a wrecked Chinese schooner was plundered off Sanur in 1904 and the raja of Badung refused compensation, a Dutch expedition landed at Sanur in September 1906. On 20 September the raja of Badung, his family, priests and followers, dressed in white, walked out of the palace at Denpasar towards the Dutch troops in a puputan, a ritual fight to the death; they were shot down or killed themselves and each other, and the court of Pemecutan did the same that afternoon. Estimates of the dead range from several hundred to more than 1,000. The raja of Tabanan surrendered and killed himself in prison two days later. In April 1908, after a rising against the new Dutch opium monopoly at Gelgel, the Dutch bombarded Klungkung, and the Dewa Agung, the highest-ranking ruler of Bali, led his court in a last puputan. All of Bali was now under Dutch rule. Photographs and reports of the killings shocked opinion in the Netherlands and abroad."
countries: [id]
