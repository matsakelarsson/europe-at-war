steps:
  - title: The puputan of Badung
    view:
      center: [115.18, -8.6]
      size: [80, 66]
    date: September 1906
    when: "1906-09-20"
    borders: "1906-09-20"
    countries: [id]
    body:
      - On 27 May 1904 the Chinese-owned schooner Sri Kumala ran aground on the reef off Sanur, on the coast of Badung, and was plundered. The Dutch demanded compensation, which the raja of Badung, I Gusti Ngurah Made Agung, refused, with the support of the rulers of Tabanan and Klungkung. In June 1906 the Dutch blockaded the southern coasts and sent ultimatums, and on 14 September an expedition under Major General Marinus Bernardus Rost van Tonningen landed at northern Sanur. Badung’s soldiers attacked its bivouac at Padang Galak the next day. On 20 September the troops reached the palace of Kesiman, whose lord had been killed by his own priest for refusing to lead an armed resistance, and marched on Denpasar.
      - As they approached the palace of Denpasar, a silent procession came out to meet them, led by the raja carried in a palanquin, with his family, priests, guards and servants, men, women and children, dressed in white cremation clothes and wearing their jewellery, armed with krisses and lances. A priest stabbed the raja, and the others began killing themselves and each other or ran at the soldiers, who opened fire. Estimates of the dead range from several hundred to more than 1,000. That afternoon the court at the Pemecutan palace, of the co-ruler Gusti Gede Ngurah, ended the same way. The troops looted the palaces and razed them.
      - In Tabanan the raja, Gusti Ngurah Agung, and his son gave themselves up and asked for terms; offered only exile to Madura or Lombok, they killed themselves in prison two days later, and the Tabanan palace was razed. The Dewa Agung of Klungkung agreed to dismantle his fortifications, give up his firearms and renounce his import and export duties, and the Dutch held back from Klungkung for the time.
    facts:
      - [Sri Kumala plundered, "27 May 1904"]
      - [Dutch landing at Sanur, "14 September 1906"]
      - [Puputan of Badung, "20 September 1906"]
      - [Dead at Denpasar and Pemecutan, "estimates from several hundred to more than 1,000"]
