id: french-conquest-of-wadai
name: French conquest of Wadai
start: "1906"
end: "1913-11-27"
tier: B
summary: "The French conquest of Wadai, the strongest sultanate of the eastern Sahel, in what is now eastern Chad. After the defeat of Rabih in 1900 France pushed east from Lake Chad and Baguirmi. Wadai, ruled from Abéché by the kolak Muhammad Salih, known as Dud Murra (“the lion of Murra”), was allied with the Senussi order, whose caravans linked it with Kufra and Benghazi, and drew its wealth from that trade and from slave raiding to the south. France backed his cousin Adam Asil as a rival, and in June 1909 a column under Captain Jean-Joseph Fiegenschuh took Abéché and installed Asil. Dud Murra withdrew to the north and then to Dar Masalit, whose sultan Taj ad-Din destroyed Fiegenschuh’s column in January 1910 and defeated another under Lieutenant-Colonel Henri Moll at Doroté in November 1910, where both Moll and Taj ad-Din were killed. Colonel Emmanuel Largeau, returned to command, pressed on, and Dud Murra surrendered at Abéché in October 1911; the French deposed Asil, abolished the sultanate and in 1913 took the Senussi lodge of Aïn Galakka in Borkou. Dar Masalit joined the Anglo-Egyptian Sudan in 1919, and the sultanate of Wadai was restored under French rule in 1935."
