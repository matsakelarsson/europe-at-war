notes:
  - "Dates differ between sources. French accounts give 2 June 1909 for the storming of Abéché, English ones 12 June; Doroté is dated 8 or 9 November 1910. French officers, who wrote most of the record, called their campaigns operations of “pacification”; the Wadai, Masalit and Senussi sides are known mainly from French reports and later oral history."
  - "The Daju sultan of Dar Sila, to the south, wrote to Fort-Lamy in 1909 offering his submission directly to France, to break free of Wadai, but the French treated Dar Sila as a dependency of Wadai."
