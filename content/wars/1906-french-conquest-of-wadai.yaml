steps:
  - title: Abéché
    date: 1906 – June 1909
    when: "1909-06-02"
    borders: "1909-06-15"
    countries: [td]
    body:
      - Dud Murra had won the throne of Wadai in 1901–1902 with Senussi help against a rival backed by Ali Dinar of Darfur, and repaid the order by letting its merchants trade freely. In 1906 the French opened hostilities, putting forward his cousin Adam Asil, who had fled Abéché after a failed coup, as their own candidate. They advanced east step by step, building fortified posts, and by 1907 were within about 160 km of Abéché. In 1908 a column under Captain Jérusalemy defeated the Wadai armies at Dokotchi on 29 May and at Djoua on 16 June, where the governors of two Wadai provinces were killed.
      - In June 1909 Captain Jean-Joseph Fiegenschuh, with about 180 men, two guns and Asil’s partisans, stormed Abéché and proclaimed Wadai French territory. Asil was made sultan, and Dud Murra escaped north to Kapka, where he spent ten months gathering loyal followers and Senussi allies. The French began to subject Wadai’s vassal states.
    facts:
      - [Battles of Dokotchi and Djoua, "29 May and 16 June 1908"]
      - [Abéché taken, "June 1909"]
    markers:
      - kind: taken
        side: fr
        name: Abéché
        date: June 1909
        text: Capital of Wadai, stormed by Fiegenschuh’s column; Adam Asil was installed as sultan.
        lonlat: [20.835, 13.833]
    arrows:
      - side: fr
        label: Fiegenschuh
        via: [[18.700, 12.900], [19.400, 13.300], [20.100, 13.700], [20.780, 13.830]]
  - title: Wadi Kadja and Doroté
    date: January – November 1910
    when: "1910-11-09"
    borders: "1910-11-09"
    countries: [td, sd]
    body:
      - On 4 January 1910 Fiegenschuh led a column into Dar Masalit, east of Wadai, where the followers of Sultan Taj ad-Din and of Dud Murra destroyed it at Wadi Kadja; Fiegenschuh was killed. That year Ali Dinar, Dud Murra and Taj ad-Din drove out the rulers the French had placed in Dar Tama and Dar Gimr. Ali Dinar backed Dud Murra only half-heartedly, and in April 1910 both were defeated in separate battles, Ali Dinar on 7 April and Dud Murra on 19 April. Many refugees from Wadai fled to Darfur, and the French put down a major rising in eastern Wadai.
      - In November Lieutenant-Colonel Henri Moll, commander of the French forces in Chad, advanced into Dar Masalit with about 300 men to avenge Fiegenschuh. At Doroté, on 8 or 9 November 1910, some 5,000 horsemen and soldiers of Taj ad-Din and Dud Murra surrounded and defeated the column. Moll was killed, and so was Taj ad-Din, Dud Murra’s strongest ally.
    facts:
      - [Fiegenschuh’s column destroyed at Wadi Kadja, "4 January 1910"]
      - [Battle of Doroté, "8 or 9 November 1910"]
