  - title: Dud Murra’s surrender and Aïn Galakka
    date: 1911–1913
    when: "1911-10-27"
    borders: "1913-11-27"
    countries: [td]
    body:
      - Colonel Emmanuel Largeau was sent back to Chad. In January 1911 the French invaded Dar Masalit, won several battles and destroyed its capital, Darjil. Dud Murra marched on Abéché with a Masalit escort, but was beaten at Chokoyan, two days’ march away, on 29 June 1911. Sultan Endoka of Dar Masalit, afraid of another French invasion, sent him away, and on 27 October 1911 Dud Murra surrendered at Abéché. He was held under house arrest at Fort-Lamy, on a French pension, until his death in 1928. The French deposed Asil, suspected of plotting during a revolt, and put Wadai under direct rule.
      - Largeau then turned north against the Senussi, who had given Dud Murra their full support and whose lodges in the oases of Borkou served the caravan trade with Kufra. On 27 November 1913 his troops took the Senussi lodge of Aïn Galakka and occupied Faya, which later took his name as Faya-Largeau. The Senussi kept up their resistance to the French and the Italians in the Sahara for years afterwards.
    facts:
      - [Battle of Chokoyan, "29 June 1911"]
      - [Dud Murra surrenders, "27 October 1911"]
      - [Aïn Galakka taken, "27 November 1913"]
    markers:
      - kind: event
        side: fr
        name: Abéché
        date: 27 October 1911
        text: Dud Murra surrendered here to the French; he was held at Fort-Lamy until his death in 1928.
        lonlat: [20.835, 13.833]
      - kind: taken
        side: fr
        name: Faya
        date: November 1913
        text: The main oasis of Borkou, occupied after the French took the nearby Senussi lodge of Aïn Galakka on 27 November 1913.
        lonlat: [19.117, 17.917]
