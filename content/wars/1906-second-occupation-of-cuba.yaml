id: second-occupation-of-cuba
name: Second Occupation of Cuba
start: "1906-09-29"
end: "1909-01-28"
tier: C
summary: "The American intervention of 1906–1909, also called the Provisional Government of Cuba or the Cuban Pacification. The Platt Amendment, which the United States made a condition of its withdrawal in 1902 and which Cuba wrote into its constitution and into a treaty of 1903, gave the United States a right to intervene to preserve Cuban independence and a stable government. In 1905 President Tomás Estrada Palma and his Moderates won re-election by fraud, and in August 1906 the Liberals rose in arms in the August revolution (the Little August War), with columns under Faustino “Pino” Guerra in Pinar del Río and other veterans of the war of independence; the old general Quintín Banderas was killed by the Rural Guard. Both sides appealed to Washington. President Theodore Roosevelt sent Secretary of War William Howard Taft and Assistant Secretary of State Robert Bacon, who arrived on 19 September 1906. When they proposed a compromise, Estrada Palma resigned on 28 September and Congress chose no successor, and on 29 September Taft proclaimed a provisional government with himself as governor, under the Cuban flag and laws. Charles E. Magoon succeeded him on 13 October 1906 and governed for more than two years, backed by an Army of Cuban Pacification that never exceeded about 6,600 American soldiers. The rebels disarmed without a battle. Magoon’s government built roads and drafted new laws, and Cuban critics blamed it for spreading government sinecures and debt. After elections in 1908 the Liberal José Miguel Gómez became president on 28 January 1909, and the last American troops left in the following weeks."
