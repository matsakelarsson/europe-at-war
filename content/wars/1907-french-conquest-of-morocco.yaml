id: french-conquest-of-morocco
name: French conquest of Morocco
start: "1907-03-29"
end: "1934-03"
tier: A
summary: "The French conquest of Morocco, from the occupation of Oujda in 1907 to the last campaigns in the Anti-Atlas in 1934. France, which already ruled Algeria, used the murder of a French doctor in Marrakesh and the killing of European workers at Casablanca in 1907 to occupy Oujda and bombard and land at Casablanca. The crisis helped Abd al-Hafid overthrow his brother Abd al-Aziz in the name of resistance, but he could not stop the French, who relieved Fez in 1911 and imposed the Treaty of Fez on 30 March 1912, making Morocco a protectorate; Spain received a zone in the north. Ahmed al-Hiba, proclaimed sultan in the south, took Marrakesh and was defeated at Sidi Bou Othman in September 1912. Under the first resident-general, Hubert Lyautey, France ruled through the sultan and the great qaids of the south while its columns, increasingly made up of Moroccan goumiers and colonial troops, fought the Zaian confederation of the Middle Atlas, the Rif Republic and the mountain tribes of the High Atlas, the Saghro and the Anti-Atlas. France declared the country conquered in 1934. The French army officially counted about 8,600 dead, and some 12,000 Moroccan auxiliaries died on the French side; Moroccan losses were never counted, but one estimate puts them at about 100,000."
