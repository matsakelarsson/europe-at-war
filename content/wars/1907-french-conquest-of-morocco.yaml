  - title: The Hafidiya
    date: August 1907 – 1909
    when: "1907-08-16"
    borders: "1908-08-19"
    countries: [ma]
    body:
      - The French landings turned many Moroccans against Abd al-Aziz. On 16 August 1907, at Marrakesh, the great qaids of the south, led by Madani al-Glaoui, proclaimed his elder brother Abd al-Hafid sultan, as a leader who would drive out the French and restore the country’s independence. In January 1908 the ulama of Fez deposed Abd al-Aziz and gave Abd al-Hafid their allegiance, on conditions, among them that he recover the occupied lands and end the Algeciras arrangements.
      - Abd al-Aziz, who held Rabat with French help, marched on Marrakesh in the summer of 1908, but his army was defeated near the city on 19 August and melted away. He fled to French-held Casablanca and abdicated. The powers recognised Abd al-Hafid in January 1909 once he had accepted the Act of Algeciras and his brother’s debts, and he could not fight France as he had promised. In 1909 his troops captured the pretender Bu Himara, who was paraded in a cage at Fez and executed.
    facts:
      - [Abd al-Hafid proclaimed at Marrakesh, "16 August 1907"]
      - [Allegiance of Fez, "January 1908"]
      - [Abd al-Aziz defeated, "19 August 1908"]
