notes:
  - "French officials called the conquest “pacification”, and from 1912 it was carried out in the name of the sultan, whose government (the makhzen) France controlled. Moroccan historians speak of resistance (muqawama). Many of the soldiers on the French side were Moroccans, Algerians and West Africans: goumiers, tirailleurs and the levies of the great qaids."
  - "Losses: the French army officially counted 8,628 dead between 1907 and 1934, from battle and disease, and some 12,000 Moroccan goumiers and other auxiliaries died on the French side. In the Middle Atlas alone, to 1933, the dead included 82 French officers, about 700 European soldiers, 1,400 African regulars and 2,200 goumiers and partisans. Moroccan losses were never recorded; one estimate (Gershovich) puts them at about 100,000, and estimates for the bombardment of Casablanca alone range from about 600 (French figures) to 7,000 dead."
  - The Spanish wars in the northern zone are told in the Second Melillan campaign and the Rif War, and the Middle Atlas war of 1914–1921 in the Zaian War.
