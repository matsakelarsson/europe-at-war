  - title: Al-Hiba, the Blue Sultan
    date: May – September 1912
    when: "1912-08-15"
    borders: "1912-09-07"
    countries: [ma, fr, eh]
    body:
      - In the south, the news of the protectorate brought a new claimant. Ahmed al-Hiba, a son of the Saharan religious leader Ma al-Aynayn, was proclaimed sultan at Tiznit in May 1912 as a leader of jihad against the French; from the blue cloth worn by his Saharan followers he was called the Blue Sultan. The tribes of the Sous and the Anti-Atlas joined him, and in August his army marched north over the High Atlas. On 15 August it entered Marrakesh, where the great qaids, playing for time, handed over several Frenchmen to him as prisoners.
      - Lyautey sent a column under Colonel Charles Mangin south from the Chaouia. On 6 September 1912, at Sidi Bou Othman, about 40 km north of Marrakesh, its artillery and machine guns broke al-Hiba’s much larger army, which by French accounts lost some 2,000 dead. Mangin entered Marrakesh the next day; the qaids freed the prisoners and went over to France. Al-Hiba fell back to the Sous and the Anti-Atlas and fought on until his death in 1919, and his brothers continued after him.
      - Lyautey then ruled the south through the great qaids, Madani and Thami al-Glaoui, al-Mtouggi and al-Goundafi, whose private armies helped extend French authority over the High Atlas in return for a free hand in their own lands.
    facts:
      - [Al-Hiba proclaimed at Tiznit, "May 1912"]
      - [Al-Hiba enters Marrakesh, "15 August 1912"]
      - [Battle of Sidi Bou Othman, "6 September 1912"]
    markers:
