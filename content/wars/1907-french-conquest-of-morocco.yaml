  - title: Fez and the protectorate
    date: April 1911 – November 1912
    when: "1911-05-21"
    borders: "1912-11-27"
    countries: [ma, fr, es]
    body:
      - Abd al-Hafid became as dependent on France as his brother had been. In the spring of 1911 the tribes around Fez rose against his taxes and his French advisers, besieged the capital and on 17 April proclaimed another brother, Mawlay al-Zayn, sultan at Meknes. A French column under General Moinier relieved Fez on 21 May and went on to take Meknes. Spain replied by occupying Larache and Ksar el-Kebir in June, and Germany sent the gunboat Panther to Agadir on 1 July. The crisis ended with the Franco-German convention of 4 November 1911, by which Germany accepted a French protectorate over Morocco in return for land in the French Congo.
      - On 30 March 1912, in the Mnebhi palace at Fez, Abd al-Hafid signed the Treaty of Fez, which made Morocco a French protectorate. On 17 April Moroccan soldiers of the Fez garrison revolted against their French instructors, and with crowds from the city killed French officers and civilians; the mellah, the Jewish quarter, was sacked and dozens of its people were killed. In late May the tribes besieged the city again and were driven off. Lyautey, resident-general from 28 April, made Abd al-Hafid abdicate in August in favour of his brother Mawlay Yusuf and moved the government to Rabat. A Franco-Spanish treaty of 27 November 1912 gave Spain a zone in the north and the far south; Tangier later became an international zone.
    facts:
      - [Fez relieved by Moinier, "21 May 1911"]
      - [Panther at Agadir, "1 July 1911"]
      - [Treaty of Fez, "30 March 1912"]
      - [Spanish zone, "Franco-Spanish treaty of 27 November 1912"]
    markers:
