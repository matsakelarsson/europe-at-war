  - title: The last campaigns
    date: 1929 – March 1934
    when: "1933-02"
    borders: "1934-03-31"
    countries: [ma, fr, es, dz]
    body:
      - The mountains of the High Atlas and the Saghro and the plains of the south-east were the last to be conquered. Columns of goumiers, Foreign Legion and colonial troops, supported by artillery, armoured cars and aircraft, closed in from Marrakesh, from the Middle Atlas and from Algeria in the east; in 1932 they took the Tafilalet oases, the old home of the Alaouite dynasty.
      - In February 1933 the Aït Atta of the Jebel Saghro, under Assou Oubasslam, retreated with their families and herds to the heights of Bou Gafer and held out there for weeks against bombardment from the ground and the air, while tribesmen who had already submitted were sent against them. On 25 March 1933 Assou Oubasslam laid down his arms before Generals Huré, Catroux and Giraud, on terms that let his people keep their lands. The last strongholds of the central High Atlas fell in the summer of 1933.
      - In February and March 1934 French columns from Morocco and Algeria occupied the Anti-Atlas and the Draa, where al-Hiba’s brothers had held out, and met in the far south; Spain occupied Ifni in April. France declared the conquest of Morocco complete at the end of March 1934, twenty-seven years after Oujda. Resistance turned to politics, and the nationalist movement grew in the cities.
    facts:
      - [Tafilalet occupied, "1932"]
      - [Bou Gafer, "February – 25 March 1933"]
      - [End of military operations, "March 1934"]
