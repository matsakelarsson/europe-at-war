steps:
  - title: Oujda and Casablanca
    date: March 1907 – 1908
    when: "1907-03-29"
    borders: "1907-08-07"
    countries: [ma, fr, dz]
    body:
      - At the start of the 20th century Morocco was the last independent state of North Africa. The young sultan Abd al-Aziz had borrowed heavily from European banks, a new tax had failed, and pretenders such as Bu Himara held parts of the north-east. France, which had bought British, Italian and Spanish consent to its ambitions, had its rights confirmed at the Algeciras conference in 1906, which gave France and Spain the police of the ports and set up a state bank under foreign control. Many Moroccans blamed the sultan for giving way to the Europeans.
      - On 19 March 1907 a French doctor, Émile Mauchamp, suspected of spying, was killed by a crowd in Marrakesh. Ten days later, on 29 March, General Hubert Lyautey’s troops crossed from Algeria and occupied Oujda. On 30 July, at Casablanca, men of the Chaouia tribes and townspeople angered by the building of a harbour railway across a cemetery killed nine European workers. From 5 August French cruisers bombarded the town, and troops under General Drude landed and took it in fighting that left much of Casablanca in ruins and looted; estimates of the Moroccan dead range from about 600 to 7,000.
      - The tribes of the Chaouia, the plain behind Casablanca, answered the call to jihad and attacked the French camps for months. In 1908 General d’Amade’s columns occupied the Chaouia, and in the east French troops subdued the Beni Snassen mountains near Oujda.
    facts:
      - [Mauchamp killed in Marrakesh, "19 March 1907"]
      - [Oujda occupied, "29 March 1907"]
      - [Bombardment of Casablanca, "5–7 August 1907, about 600 to 7,000 Moroccan dead"]
