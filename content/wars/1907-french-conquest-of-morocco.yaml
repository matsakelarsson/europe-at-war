  - title: Lyautey, Taza and the war years
    date: 1912–1918
    when: "1914-05"
    borders: "1914-05-10"
    countries: [ma, fr]
    body:
      - Lyautey’s method was to govern through the sultan and the existing elites, keep Moroccan institutions in place and build new European towns beside the old ones, while his columns advanced from post to post and won over tribes with markets, medical care and subsidies as well as with force, the “oil stain” that spread outward. Where tribes refused to submit, the columns burned crops and villages, and aircraft bombed the mountains.
      - In May 1914 columns from the west and from Algeria met at Taza, opening the corridor between Fez and Oujda that joined the French zone to Algeria. In June they took Khénifra, the stronghold of the Zaian confederation of the Middle Atlas, which began a war that lasted until 1921.
      - When the First World War began, France ordered Lyautey to send most of his troops to France; he sent 37 battalions, among them Moroccan tirailleurs who fought on the Western Front, but kept the posts he held by a defensive line along the edge of the mountains. German and Ottoman agents sent money and arms to the tribes, and the frontier with the Zaians and the tribes of the Atlas saw constant fighting.
    facts:
      - [Taza taken, "May 1914"]
      - [Khénifra taken, "12 June 1914"]
      - [Battalions sent to France in 1914, "37"]
