  - title: The Middle Atlas and the Rif front
    date: 1919–1926
    when: "1922-04"
    borders: "1925-06-01"
    countries: [ma, fr, es]
    body:
      - After the war France resumed the offensive. Around Khénifra it negotiated with the sons of the Zaian leader Mouha ou Hammou, who submitted in 1920; he was killed in 1921 fighting tribesmen who had gone over to the French, and the Zaian War ended that year. Further east, Moha ou Said of the Aït Ouirra was defeated at El Ksiba in April 1922 and died in 1924, but his followers kept up the fight from the High Atlas.
      - In April 1925 Abd el-Krim’s Rifian forces, at war with Spain since 1921, attacked the French posts on the Ouergha river north of Fez and broke through, and for a time the city was threatened. France sent Marshal Philippe Pétain with a large army and joined Spain in the campaign that defeated the Rif Republic in 1926. Lyautey, sidelined, resigned in September 1925.
    facts:
