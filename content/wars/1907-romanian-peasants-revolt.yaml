id: romanian-peasants-revolt
name: Romanian Peasants’ Revolt of 1907
start: "1907-02-21"
end: "1907-04-05"
tier: C
summary: A rising of Romanian peasants against the great landowners and the leaseholders (arendași) who sub-let their estates on harsh terms, which began in northern Moldavia in February 1907, at first directed largely against Jewish leaseholders, and in March spread south through Wallachia to Oltenia. The Liberal government of Dimitrie Sturdza mobilised 140,000 soldiers and crushed it by early April; the official count was about 420 dead, while a figure of some 10,000 peasants killed, widely accepted at the time, has never been proven.
countries: [ro]
