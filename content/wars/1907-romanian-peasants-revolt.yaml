    name: Romanian government and army
    polities: [romania]
    ink: navy
  - id: pe
    name: Peasant rebels
    ink: orange
notes:
  - Romania still used the Julian calendar in 1907; Romanian accounts date the start of the revolt, at Flămânzești, to 8 February. The dates here are New Style.
  - Land reform followed only after the First World War.
