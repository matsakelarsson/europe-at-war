id: second-melillan-campaign
name: Second Melillan campaign
start: "1909-07-09"
end: "1909-12-04"
tier: C
summary: A war between Spain and the Rifian tribes around Melilla in 1909, set off by a tribal attack on Spanish workers building a railway to iron mines in the Rif on 9 July. The government called up reservists, many of them working men with families, and the departure of troops from Barcelona set off the rising known as the Tragic Week. In Morocco a Spanish column suffered heavy losses at the Barranco del Lobo on 27 July, but reinforced to some 35,000–40,000 men the army took Mount Gurugú and the country south of Melilla by the end of the year.
countries: [es, ma]
sides:
