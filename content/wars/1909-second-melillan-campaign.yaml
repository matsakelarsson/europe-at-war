    name: Spain
    polities: [spain]
    ink: gold
  - id: rif
    name: Rifian tribes
    ink: olive
notes:
  - The Tragic Week in Barcelona, from 26 July to 2 August 1909, began as a general strike against the call-up and turned into riots in which dozens of churches and convents were burned; over 100 people were killed, and the anarchist educator Francesc Ferrer was executed afterwards, which caused protests across Europe.
