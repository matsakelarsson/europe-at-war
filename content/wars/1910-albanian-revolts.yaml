id: albanian-revolts
name: Albanian revolts of 1910–1912
start: "1910-04"
end: "1912-09-04"
tier: C
summary: A series of risings in the Albanian lands of the Ottoman Empire against the Young Turk government’s centralising policies, taxes, conscription and disarmament campaigns – in Kosovo in 1910, crushed by an Ottoman army that burned villages and closed Albanian schools; among the Catholic highlanders of Malësia in 1911; and in a general revolt in 1912, when the rebels took Skopje. On 4 September 1912 the government accepted most of the rebels’ demands, a settlement overtaken weeks later by the First Balkan War.
countries: [xk, al, mk, me]
sides:
