    name: Albanian rebels
    ink: red
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
notes:
  - Leaders included Isa Boletini in 1910 and Hasan Prishtina in 1912. The 1911 rising in Malësia, also called the Malissori uprising, won an amnesty and concessions.
