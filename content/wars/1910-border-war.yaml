id: border-war
name: Mexican Border War
start: "1910-11"
end: "1919-08"
tier: B
summary: "The armed clashes along and across the border between Mexico and the United States during the Mexican Revolution, from 1910 to 1919. The name is used in US unit and popular history; Mexican histories treat the same fighting as US involvement in Mexico’s civil war, and there was never a declared war. Battles between Mexican factions spilled over the line at Ciudad Juárez, Agua Prieta, Nogales and Naco, and the United States sent troops to the border from 1911. In 1915 raiders acting under the Plan of San Diego struck ranches and railways in the Lower Rio Grande Valley of Texas, and Texas Rangers, posses and some soldiers answered by killing hundreds, possibly thousands, of Mexicans and Mexican Americans, a time Tejanos remember as la matanza. After the United States recognised Venustiano Carranza’s government, Pancho Villa’s men killed American mining employees at Santa Isabel and on 9 March 1916 raided Columbus, New Mexico. General John J. Pershing led a punitive expedition of up to about 10,000 men into Chihuahua that never caught Villa and nearly led to war with Carranza’s government after the fight at Carrizal; more than 100,000 National Guardsmen were called to the border. Pershing withdrew in February 1917. The killings at Porvenir in 1918, the battle of Ambos Nogales in August 1918 and the US crossing to drive Villa from Ciudad Juárez in June 1919 were the last large clashes."
countries: [us, mx]
