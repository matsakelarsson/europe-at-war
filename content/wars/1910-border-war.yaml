  - title: Porvenir, Ambos Nogales and the last crossing at Juárez
    date: 1917–1919
    when: "1918-08-27"
    borders: "1919-06-16"
    countries: [us, mx]
    body:
      - "In January 1917 the German foreign secretary Arthur Zimmermann offered Mexico an alliance and the return of Texas, New Mexico and Arizona if the United States went to war with Germany. Carranza kept the offer open while Pershing was still in Mexico but turned it down in April 1917, and Mexico stayed neutral. The border stayed tense. On the night of 28 January 1918 Texas Rangers of Company B, local ranchers and soldiers of the 8th Cavalry took fifteen unarmed Mexican men and boys from the village of Porvenir in Presidio County and shot them. In 1919 hearings forced by the Tejano legislator José Tomás Canales exposed killings by the Rangers, and the force was reduced, but no one was convicted."
      - "On 27 August 1918 a shooting at the customs post between the twin towns of Nogales turned into a street battle between US infantry and cavalry and Mexican troops and armed townspeople. Several Americans and a larger but uncertain number of Mexicans, among them the mayor of Nogales, Sonora, Félix Peñaloza, were killed. After the battle the two towns built the first permanent fence along the border between them."
      - "Villa had kept up his war against Carranza in Chihuahua. On 15 June 1919 his men attacked Ciudad Juárez, and bullets killed and wounded people in El Paso. That night General James Erwin sent cavalry and the African American 24th Infantry across the river, while artillery shelled the Villistas at the Juárez racetrack; they drove Villa’s men out while the Carrancista garrison held its fort, and the Americans recrossed the river on 16 June. In August 1919 the 8th Cavalry crossed at Candelaria to pursue the captors of two army airmen, the last American expedition into Mexico. Villa made peace with the government of Adolfo de la Huerta in July 1920, after Carranza’s fall."
    facts:
      - [Zimmermann telegram, "January 1917; rejected by Mexico in April 1917"]
      - [Porvenir massacre, "28 January 1918, 15 men and boys killed"]
      - [Battle of Ambos Nogales, "27 August 1918"]
      - [Battle of Ciudad Juárez, "15–16 June 1919"]
