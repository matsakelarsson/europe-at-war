steps:
  - title: Revolution on the border and the Plan of San Diego
    date: 1910–1915
    when: "1911-05"
    borders: "1915-10-01"
    countries: [us, mx]
    body:
      - "When Francisco I. Madero called Mexicans to rise against Porfirio Díaz in November 1910, the border became a front line. Rebels bought arms in El Paso, San Antonio and Los Angeles, and US neutrality laws were enforced against them unevenly. In March 1911 President William Howard Taft gathered a “Maneuver Division” of regular troops at San Antonio, Texas, and sent more soldiers to patrol the line. In April 1911 fighting at Agua Prieta sent bullets into Douglas, Arizona, and American troops fired back; in May several thousand Americans watched from El Paso as Pascual Orozco and Pancho Villa took Ciudad Juárez. In Baja California the anarchist Partido Liberal Mexicano of Ricardo Flores Magón, with American volunteers of the Industrial Workers of the World, took Mexicali and Tijuana before federal troops drove them out in June 1911."
      - "The civil wars that followed brought more fighting to the line. In March 1913 the federal garrison of Nogales, Sonora, fled across to the US side after losing to Obregón’s Constitutionalists, and from October 1914 to January 1915 Villa’s allies besieged the Constitutionalist garrison of Naco, Sonora, for 119 days while US soldiers in Naco, Arizona, were hit by stray fire. Each faction depended on the border for arms and trade, and Washington’s embargoes and recognitions could decide its fate."
      - "In January 1915 the authorities in Texas found a manifesto dated at San Diego, Texas: the Plan of San Diego called on Mexicans, Tejanos, African Americans and Native Americans to rise, kill the Anglo men and set up a republic in the lands Mexico had lost in 1848. From July 1915 bands of raiders, the sediciosos, led by Luis de la Rosa and Aniceto Pizaña and joined by some Carrancista soldiers, attacked ranches, railways and irrigation works in the Lower Rio Grande Valley; on 8 August they attacked the Norias headquarters of the King Ranch. Texas Rangers, county posses and vigilantes answered by treating every person of Mexican descent as a suspect: they shot or hanged hundreds of men, citizens or not, often without any evidence, and photographs of Rangers posing with the dead were sold as postcards. Thousands of Tejanos fled to Mexico. After the United States recognised Carranza’s government on 19 October 1915, the large raids stopped."
    facts:
      - [Fall of Ciudad Juárez, "10 May 1911"]
      - [Siege of Naco, "October 1914 – January 1915"]
      - [Raids under the Plan of San Diego, "July – October 1915"]
      - [Killed in South Texas, "hundreds, possibly thousands, of Mexicans and Mexican Americans"]
