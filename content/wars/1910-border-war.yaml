notes:
  - "The Mexican Revolution itself, with the battles between Mexican factions, is told in its own story, as is the US occupation of Veracruz in 1914."
  - "Historians disagree about who stood behind the Plan of San Diego. Charles Harris and Louis Sadler argue that Carranza used the raids to win US recognition and then stopped them; Benjamin Heber Johnson sees a Tejano revolt against the loss of land and rights since 1848 that Carrancistas fed. German agents were suspected at the time, but no archive has shown that Germany wrote or paid for the raids, or that German officers led the Mexican troops at Nogales in 1918, as US accounts claimed."
  - "The number of Mexicans and Mexican Americans killed in South Texas in 1915–1920 is not known. A US Army list compiled afterwards named more than 300 people summarily executed in 1915–1916; Johnson writes of “hundreds, possibly thousands” killed, many of whom were never recorded."
