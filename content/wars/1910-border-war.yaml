  - title: Columbus and the Punitive Expedition
    date: January 1916 – February 1917
    when: "1916-03-09"
    borders: "1916-06-21"
    countries: [us, mx]
    view:
      center: [-106.6, 29.4]
      size: [620, 620]
    body:
      - "Villa took Wilson’s recognition of Carranza as a betrayal. At the second battle of Agua Prieta, on 1–3 November 1915, the United States let Carrancista reinforcements travel by rail through US territory, and Villa’s army was beaten. Friedrich Katz argued that Villa believed Carranza had agreed to make Mexico a US protectorate and wanted to provoke a war that would discredit him; an older view that German agents pushed him into it rests on little evidence. On 10 January 1916 Villistas stopped a train at Santa Isabel, Chihuahua, and shot 17 or 18 American mining employees. Before dawn on 9 March 1916 several hundred Villistas attacked Columbus, New Mexico, and the camp of the 13th Cavalry there. They burned part of the town and were driven out after hours of fighting; ten civilians and eight soldiers were killed, and at least 67 raiders."
      - "President Wilson sent Brigadier General John J. Pershing into Chihuahua with about 4,800 men, later about 10,000, with trucks, aircraft of the 1st Aero Squadron and Apache scouts. Carranza, who had not been asked, allowed the expedition only grudgingly. Cavalry columns pushed south as far as Parral, more than 600 km from the border. On 29 March Colonel George Dodd’s men routed a Villista band at Guerrero, and in May Lieutenant George S. Patton killed the Villista commander Julio Cárdenas in the first US motorised attack. But Villa, wounded in the leg, hid in the mountains and was never found, and the people of Chihuahua and the Carrancista army turned against the invaders. At Parral on 12 April townspeople, among them the schoolgirl Elisa Griensen, and soldiers drove out Major Frank Tompkins’s squadron; two Americans were killed, and accounts of the Mexican losses range from 14 to about 70 killed or wounded."
      - "On 5 May raiders killed three soldiers and a boy at Glenn Springs and Boquillas in the Big Bend of Texas, and Wilson called up the National Guard of Texas, New Mexico and Arizona, and in June that of almost every state; more than 100,000 guardsmen served on the border. On 21 June two troops of the African American 10th Cavalry attacked Carrancista troops at Carrizal against orders and were defeated; about a dozen Americans, among them Captain Charles Boyd, were killed and 24 captured, and the Mexican commander, General Félix Uresti Gómez, was killed with a number of his men. Both governments drew back from war and set up a joint commission. Villa recovered, raided Chihuahua City in September and took Torreón in December. The expedition was withdrawn, and its last troops crossed back at Columbus on 5 February 1917. In Mexico the campaign strengthened Carranza, who had stood up to the invaders; in the United States it made Pershing a national figure."
    facts:
      - [Raid on Columbus, "9 March 1916"]
      - [Killed at Columbus, "18 Americans, at least 67 Villistas"]
      - [Punitive Expedition, "15 March 1916 – 5 February 1917"]
      - [Battle of Carrizal, "21 June 1916"]
      - [National Guard on the border, "more than 100,000"]
