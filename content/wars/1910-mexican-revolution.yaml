steps:
  - title: Madero’s call to arms
    date: November 1910 – May 1911
    when: "1911-05-10"
    borders: "1911-05-25"
    countries: [mx]
    side_names: { fed: Díaz’s government and the Federal Army }
    body:
      - "Porfirio Díaz had ruled Mexico since 1876, apart from a pause in 1880–1884. His regime built railways and drew in foreign investment in mines and oil, but land was concentrated in great haciendas, many villages lost their common lands, and strikes such as those at Cananea in 1906 and Río Blanco in 1907 were put down by force. In 1910 the 80-year-old Díaz had himself re-elected after jailing his challenger, Francisco I. Madero, a wealthy landowner from Coahuila who campaigned for “effective suffrage, no re-election”. Madero escaped to Texas and in the Plan of San Luis Potosí called for a rising on 20 November 1910."
      - "In Puebla the police discovered the plot early; Aquiles Serdán and his family and followers fought them from his house on 18 November, and he was found and killed there the next morning. The rising took hold in the mountains of western Chihuahua, where Pascual Orozco and Pancho Villa led bands of rancheros, muleteers and miners against federal troops who seldom left the railways. Risings spread to Sonora, Coahuila, Durango and Baja California, where the anarchist followers of Ricardo Flores Magón took Mexicali and Tijuana. In Morelos, south of the capital, villagers led by Emiliano Zapata rose to recover lands taken by the sugar haciendas."
      - "Against Madero’s wishes, Orozco and Villa attacked Ciudad Juárez, across the river from El Paso, and took it on 10 May 1911; on 19 May Zapata’s men took Cuautla after six days of fighting. At Torreón, entered by Maderista troops on 15 May, soldiers and townspeople killed some 300 Chinese residents. Díaz’s government signed the Treaty of Ciudad Juárez on 21 May. Díaz resigned on 25 May and sailed for exile in France, leaving an interim president, Francisco León de la Barra, and the federal army intact."
    facts:
      - [Rising called for, "20 November 1910"]
      - [Ciudad Juárez taken, "10 May 1911"]
      - [Treaty of Ciudad Juárez, "21 May 1911"]
      - [Díaz resigns, "25 May 1911"]
