  - title: Celaya and León
    date: January – July 1915
    when: "1915-04-15"
    borders: "1915-07-10"
    countries: [mx]
    view: { center: [-101.4, 21.1], size: [300, 240] }
    side_names: { vil: "Villistas, the army of the Convention", con: Constitutionalists (Carranza and Obregón) }
    body:
      - "In January 1915 Obregón retook Mexico City, which he held for some weeks, and won over the anarcho-syndicalist Casa del Obrero Mundial, whose Red Battalions of workers fought for Carranza. Carranza’s decree of 6 January promised the return of village lands, and his generals controlled the oil of the Gulf coast and the henequen of Yucatán, whose exports paid for arms from the United States. Villa, whose army was larger, divided it among several fronts and failed to take the oil town of El Ébano."
      - "In April Obregón waited for Villa at Celaya in the Bajío with some 11,000 to 15,000 men behind trenches, barbed wire and machine guns, as on the Western Front in Europe. On 6–7 April and again on 13–15 April Villa’s cavalry charged the lines and was cut down; after the second battle the Villistas fled, leaving thousands of dead and prisoners, and Obregón had the captured officers shot. He followed them north, and after more than a month of fighting around León, in which he lost his right arm to a shell on 3 June, broke Villa’s army at Trinidad on 5 June. He took Aguascalientes on 10 July. Villa lost as many as 50,000 men in the battles of the Bajío, killed, captured or deserted, and never again threatened the capital."
    facts:
      - [Battles of Celaya, "6–7 and 13–15 April 1915"]
      - [Battle of Trinidad, near León, "5 June 1915"]
      - [Aguascalientes taken, "10 July 1915"]
    markers:
      - kind: battle
        side: con
        name: Celaya
        date: 6–7 and 13–15 April 1915
        text: Villa’s cavalry charges broke against Obregón’s trenches, barbed wire and machine guns; the second battle ended in a Villista rout.
        lonlat: [-100.812, 20.522]
      - kind: battle
        side: con
        name: Trinidad and León
        date: April – June 1915
        text: Weeks of fighting ended with Villa’s defeat on 5 June; two days earlier Obregón had lost his right arm to a shell.
        lonlat: [-101.683, 21.117]
        lp: l
      - kind: taken
        side: con
        name: Aguascalientes
        date: 10 July 1915
        text: Obregón took the city, and Villa’s army retreated north along the railway.
        lonlat: [-102.296, 21.876]
    arrows:
