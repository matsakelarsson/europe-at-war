  - title: Madero’s presidency, Zapata and Orozco
    date: June 1911 – October 1912
    when: "1912-05-23"
    borders: "1912-05-23"
    countries: [mx]
    side_names: { fed: Madero’s government and the Federal Army }
    body:
      - "Madero ordered the revolutionary forces to disband and kept the federal army. In Morelos, where the planters demanded order, the interim government sent General Victoriano Huerta against the Zapatistas, who refused to give up their arms before the land question was settled. Madero, elected president by a wide margin, took office on 6 November 1911 and asked for patience on land reform. On 28 November Zapata and his chiefs proclaimed the Plan of Ayala, which declared Madero a traitor to the revolution, demanded the return of stolen lands to the villages and the expropriation of a third of the haciendas’ land. Federal commanders, above all General Juvencio Robles in 1912, burned villages and moved their people, which drove more peasants to Zapata."
      - "In the north Orozco, passed over for the governorship of Chihuahua and backed by the state’s great landowners, rose in March 1912 with a plan promising land and labour reforms. His Colorados routed a federal army at Rellano on 23–24 March, and its commander, the war minister José González Salas, shot himself. Huerta took command, with Villa leading state irregulars on the government side until Huerta had him arrested and nearly shot, and beat Orozco at Rellano on 22–23 May and at Bachimba on 3 July; the Colorados broke up into guerrilla bands. In October Félix Díaz, the old dictator’s nephew, rose in Veracruz and was captured within a week."
    facts:
      - [Madero takes office, "6 November 1911"]
      - [Plan of Ayala, "28 November 1911"]
      - [Orozco’s rising, "March 1912"]
      - [Second battle of Rellano, "22–23 May 1912"]
