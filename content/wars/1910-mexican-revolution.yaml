  - title: Aguascalientes and the split
    date: October – December 1914
    when: "1914-12-06"
    borders: "1914-12-06"
    countries: [mx]
    side_names: { vil: "Villistas, the army of the Convention", zap: "Zapatistas, allied with the Convention", con: Constitutionalists (Carranza and Obregón) }
    body:
      - "The victors soon fell out. Villa’s generals and those of Pablo González had demanded more radical reforms in the Pact of Torreón in July, and Carranza’s attempt to control the revolution angered both Villa and Zapata. A convention of revolutionary generals, opened in Mexico City in October, moved to neutral Aguascalientes; joined by Zapatista delegates, it adopted the principles of the Plan of Ayala, voted to remove both Carranza as First Chief and Villa as commander of his division, and chose General Eulalio Gutiérrez as provisional president. Carranza rejected the convention’s authority, and Obregón, after trying to mediate, sided with him."
      - "Carranza withdrew his government to Veracruz, which the United States evacuated on 23 November, leaving large stocks of arms behind. Villa’s army, now the army of the Convention, marched south, and on 4 December Villa and Zapata met at Xochimilco and agreed to fight Carranza together; on 6 December their armies paraded through Mexico City, and Villa sat in the presidential chair for a famous photograph. In the following weeks Villista and Zapatista officers killed or kidnapped a number of opponents in the capital. The alliance went no further. Zapata went back to Morelos, where his chiefs divided hacienda land among the villages, and Villa turned his army north and west."
    facts:
      - [Convention moves to Aguascalientes, "10 October 1914"]
      - [Villa and Zapata meet at Xochimilco, "4 December 1914"]
      - [Convention armies enter Mexico City, "6 December 1914"]
    markers:
      - kind: event
        name: Aguascalientes
        date: October – November 1914
        text: The convention of revolutionary generals declared itself sovereign, removed Carranza and named Eulalio Gutiérrez provisional president.
