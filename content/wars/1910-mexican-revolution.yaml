  - title: The Constitutionalist rising
    date: March 1913 – March 1914
    when: "1913-11-25"
    borders: "1913-11-25"
    countries: [mx, us]
    side_names: { fed: Huerta’s government and the Federal Army, vil: Villa’s Division of the North (part of the Constitutionalist Army) }
    body:
      - "Most state governors accepted Huerta, but Venustiano Carranza, governor of Coahuila and a senator under Díaz, refused, and on 26 March 1913 issued the Plan of Guadalupe, naming himself First Chief of a Constitutionalist Army to restore constitutional rule. In Sonora the state government and officers such as Álvaro Obregón, a rancher who had fought Orozco in 1912, joined him. Villa, who had escaped from prison to Texas, crossed back into Chihuahua with eight men and raised a large force after Huerta’s men murdered Governor Abraham González. Zapata, who had refused Huerta’s offers, fought on separately under the Plan of Ayala, while Orozco joined Huerta. President Woodrow Wilson refused to recognise Huerta, and in February 1914 the United States lifted its embargo on arms for the northern rebels."
      - "Huerta expanded the army by forced conscription, the leva, to a nominal 250,000 men, dissolved Congress in October 1913 and ruled by force; Senator Belisario Domínguez, who had denounced him, was murdered. Villa’s Division of the North, built from cowboys, miners and railwaymen and moving on captured trains, took Torreón on 1 October, slipped into Ciudad Juárez on a captured coal train on 15 November and routed a federal army at Tierra Blanca on 23–25 November, where its prisoners were shot. Chihuahua City fell in December, and in January 1914 the last federal troops in the state fled across the border at Ojinaga into internment in the United States. Obregón meanwhile cleared Sonora and took Culiacán in Sinaloa in November."
    facts:
      - [Plan of Guadalupe, "26 March 1913"]
      - [Villa takes Ciudad Juárez, "15 November 1913"]
      - [Battle of Tierra Blanca, "23–25 November 1913"]
      - [Ojinaga taken, "January 1914"]
