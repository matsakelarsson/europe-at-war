notes:
  - "The number of deaths is uncertain, because the censuses of 1910 and 1921 are imperfect and many people emigrated. Most estimates of the deaths of 1910–1920 lie between about one million and 1.5 million, most of them civilians who died of hunger and disease, including the influenza of 1918, as well as violence. The demographer Robert McCaa estimated nearly 1.5 million excess deaths and a total population loss of about 2.1 million, counting births that did not take place and emigration. Some 200,000 people fled to the United States."
  - "When the revolution ended is debated; some historians carry it to 1940. This story ends with Obregón taking office in December 1920. The fighting on the US border, the US occupation of Veracruz in 1914, the de la Huerta rebellion of 1923–1924 and the Cristero War have their own stories."
  - "All sides killed prisoners at times, and the federal army forcibly conscripted men through the leva. The northern armies were followed by thousands of women, the soldaderas, who cooked, nursed and sometimes fought. Chinese immigrants in the north were attacked by several factions, worst at Torreón in May 1911."
