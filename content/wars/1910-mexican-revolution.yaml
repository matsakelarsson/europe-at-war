  - title: Agua Prieta and the end of the fighting
    date: April – December 1920
    when: "1920-05-21"
    borders: "1920-12-01"
    countries: [mx]
    side_names: { con: Carranza’s government, agua: "Rebels of the Plan of Agua Prieta (Obregón, Calles, de la Huerta)" }
    link: { href: "#/war/de-la-huerta-rebellion", text: The de la Huerta rebellion }
    body:
      - "As the 1920 election approached, Carranza chose a little-known civilian, Ignacio Bonillas, his ambassador in Washington, to succeed him, against Obregón, the most popular general. When Carranza sent troops into Sonora and had Obregón charged with conspiracy, Obregón escaped from Mexico City disguised as a railwayman, and on 23 April the Sonoran leaders, among them Governor Adolfo de la Huerta and Plutarco Elías Calles, issued the Plan of Agua Prieta. Most of the army, and Zapatista and other rebels, went over to them within weeks."
      - "On 7 May Carranza left Mexico City with his government and treasury in a long train bound for Veracruz. Attacked along the way and halted by torn-up track at Aljibes, the party went on horseback into the Sierra Norte de Puebla. In the early hours of 21 May men of a local chief, Rodolfo Herrero, who had joined Carranza’s escort, shot him dead in a hut at Tlaxcalantongo. Congress named de la Huerta interim president. He negotiated the surrender of Villa, who laid down his arms at Sabinas, Coahuila, on 28 July in exchange for the hacienda of Canutillo, and of Félix Díaz and other rebels. Obregón, elected in September, took office on 1 December 1920. Villa was assassinated in 1923, and the Sonoran leaders faced a revolt led by de la Huerta in 1923–1924."
    facts:
      - [Plan of Agua Prieta, "23 April 1920"]
      - [Carranza killed, "21 May 1920"]
      - [Villa’s surrender, "28 July 1920"]
      - [Obregón takes office, "1 December 1920"]
    markers:
