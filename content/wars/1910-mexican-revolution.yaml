  - title: The Ten Tragic Days
    date: 9–22 February 1913
    when: "1913-02-18"
    borders: "1913-02-22"
    countries: [mx]
    view: { center: [-99.14, 19.38], size: [55, 50] }
    side_names: { fed: "The coup: Félix Díaz, Bernardo Reyes and, from 18 February, Huerta", mad: Madero’s government and loyal troops }
    body:
      - "On 9 February 1913 army officers freed Generals Bernardo Reyes and Félix Díaz from prison in Mexico City and led cadets from the military school at Tlalpan and other troops against the National Palace. Loyal troops under General Lauro Villar held it; Reyes was killed in front of the palace, and Díaz withdrew into the Ciudadela, the arsenal a short distance to the south-west. Villar was wounded, and Madero gave command of the defence to Huerta."
      - "For ten days the two sides shelled each other across the city centre, killing hundreds of civilians, many of whose bodies were burned in the streets, while Huerta, in secret contact with the rebels, made no serious attempt to take the arsenal. The US ambassador Henry Lane Wilson, who had long worked against Madero, urged other diplomats to press him to resign. On 18 February Huerta’s men arrested Madero and Vice-President José María Pino Suárez, and that night Huerta and Díaz signed the Pact of the Embassy at the US embassy, agreeing that Huerta would become provisional president; Madero’s brother Gustavo was taken to the Ciudadela and killed. Madero and Pino Suárez resigned on the promise of safe exile, but on the night of 22 February they were shot while being moved to the Lecumberri penitentiary; the government claimed they had been killed in an attempt to free them."
    facts:
      - [Rising in the capital, "9 February 1913"]
      - [Pact of the Embassy, "18 February 1913"]
      - [Madero and Pino Suárez killed, "22 February 1913"]
    markers:
