  - title: Agua Prieta, Columbus and the Punitive Expedition
    date: August 1915 – February 1917
    when: "1916-03-09"
    borders: "1916-03-15"
    countries: [mx, us]
    side_names: { vil: Villistas, con: Constitutionalists (Carranza’s government) }
    link: { href: "#/war/border-war", text: The Border War }
    body:
      - "In August 1915 the Constitutionalists retook Mexico City for good, and in October the United States recognised Carranza’s government and stopped arms from reaching his enemies. Villa led what remained of his army over the mountains into Sonora. At Agua Prieta on 1–3 November his attacks failed against trenches lit by searchlights at night and held by troops whom the United States had allowed to travel there by rail through its territory; at Hermosillo on 22 November he was beaten again. Most of his men accepted an amnesty, and Villa returned to Chihuahua with a few hundred."
      - "Convinced that Carranza had made a secret bargain with Washington, Villa turned on Americans. His men killed 17 or 18 American mining employees taken from a train at Santa Isabel on 10 January 1916, and on 9 March some 500 Villistas raided Columbus, New Mexico. President Wilson sent General John J. Pershing with about 5,000 men, later about 10,000, into Chihuahua; they scattered the Villistas but never found Villa, clashed with Carranza’s troops at Parral and Carrizal, and withdrew in February 1917. Villa rebuilt his forces in the Chihuahua mountains, raided Chihuahua City in September 1916 and took Torreón in December."
    facts:
      - [Battle of Agua Prieta, "1–3 November 1915"]
      - [US recognition of Carranza, "October 1915"]
      - [Raid on Columbus, "9 March 1916"]
      - [Punitive Expedition, "March 1916 – February 1917"]
    markers:
      - kind: battle
        side: con
