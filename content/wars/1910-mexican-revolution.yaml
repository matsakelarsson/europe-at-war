id: mexican-revolution
name: Mexican Revolution
start: "1910-11-20"
end: "1920-12-01"
tier: A
summary: "A decade of risings and civil wars that ended the long rule of Porfirio Díaz, destroyed the old federal army and produced the constitution of 1917 and the state that ruled Mexico for most of the 20th century. Francisco I. Madero’s call to arms in November 1910 brought down Díaz in May 1911, but Madero kept the federal army and faced risings by Emiliano Zapata, who demanded the return of village lands in Morelos, and by Pascual Orozco in Chihuahua. In February 1913 General Victoriano Huerta overthrew Madero, who was murdered. Northern governors and revolutionaries rose under Venustiano Carranza as the Constitutionalists, with Francisco “Pancho” Villa and Álvaro Obregón as their best generals, while Zapata fought on in the south; with US pressure, including the occupation of Veracruz, they drove Huerta out in July 1914. The winners then split. Villa and Zapata, joined in the Convention of Aguascalientes, took Mexico City in December 1914, but Obregón crushed Villa’s army at Celaya and León in 1915, and the United States recognised Carranza. Villa’s raid on Columbus, New Mexico, in 1916 brought a US punitive expedition into Chihuahua. Carranza’s constitution of 1917 promised land reform, labour rights and national ownership of the subsoil, but fighting went on; Zapata was killed in 1919, and in 1920 the Sonoran generals rose under the Plan of Agua Prieta and Carranza was killed while fleeing. Obregón became president in December 1920. Between one million and 1.5 million people died, most of them civilians, of violence, hunger and disease."
countries: [mx, us]
