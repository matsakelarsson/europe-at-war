  - title: Torreón, Zacatecas and the fall of Huerta
    date: March – August 1914
    when: "1914-06-23"
    borders: "1914-08-20"
    countries: [mx]
    side_names: { fed: Huerta’s government and the Federal Army, vil: Villa’s Division of the North (part of the Constitutionalist Army) }
    link: { href: "#/war/united-states-occupation-of-veracruz", text: The US occupation of Veracruz }
    body:
      - "In spring 1914 the Constitutionalists advanced south along the railways. Villa took Torreón again in early April after almost two weeks of fighting and beat the federal survivors at San Pedro de las Colonias; Pablo González took Monterrey in April and the oil port of Tampico in May; Obregón moved down the Pacific coast. In the south the Zapatistas took Chilpancingo in March and much of Guerrero and Morelos, and federal garrisons went over to them. On 21 April US forces seized Veracruz to stop arms reaching Huerta, an act that Carranza too condemned."
      - "Carranza, wary of Villa’s power, tried to keep him away from Zacatecas, the railway junction on the road to the capital; Villa offered to resign, his generals refused to accept it, and on 23 June the Division of the North stormed the city. Of perhaps 12,000 defenders an estimated 6,000–7,000 were killed, many of them after they surrendered. Carranza then held back Villa’s coal supplies, and it was Obregón, after destroying a federal army at Orendáin near Guadalajara in early July, who reached the capital. Huerta resigned on 15 July and left from Puerto México for exile. By the Treaties of Teoloyucan of 13 August the federal army was disbanded; Obregón entered Mexico City on 15 August and Carranza on 20 August."
    facts:
      - [Torreón taken by Villa, "early April 1914"]
      - [Battle of Zacatecas, "23 June 1914"]
      - [Huerta resigns, "15 July 1914"]
      - [Treaties of Teoloyucan, "13 August 1914"]
