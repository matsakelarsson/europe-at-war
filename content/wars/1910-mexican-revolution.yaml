  - title: The constitution and the death of Zapata
    date: 1916 – 1919
    when: "1919-04-10"
    borders: "1919-04-10"
    countries: [mx]
    side_names: { con: Carranza’s government, vil: Villistas, zap: Zapatistas }
    body:
      - "Carranza called a constitutional congress at Querétaro, from which Villistas and Zapatistas were excluded. The delegates, many of them young officers, went far beyond his moderate draft. The constitution promulgated on 5 February 1917 gave the nation ownership of land, water and minerals and the power to expropriate them (Article 27), set the eight-hour day and the right to strike (Article 123), made primary education secular (Article 3) and restricted the Church. Carranza was elected president in March 1917, but he returned confiscated estates to their owners, carried out little land reform and broke strikes. Mexico stayed neutral in the World War, and Carranza did not take up Germany’s offer of an alliance in the Zimmermann telegram of January 1917."
      - "Fighting went on in many regions: the Villistas in Chihuahua, the followers of Félix Díaz in Veracruz and Oaxaca, landowners’ militias in Chiapas and Oaxaca, and the Zapatistas in Morelos, where General Pablo González’s troops burned villages, deported their people and shot prisoners from 1916; the influenza of 1918 and hunger killed many more. On 10 April 1919 Colonel Jesús Guajardo, pretending to change sides, lured Zapata to the hacienda of Chinameca, where his soldiers shot him dead. Felipe Ángeles, the former federal general who had returned from exile to join Villa, was captured, court-martialled and shot in Chihuahua in November 1919."
    facts:
      - [Constitution promulgated, "5 February 1917"]
      - [Carranza elected president, "March 1917"]
      - [Zapata killed, "10 April 1919"]
    markers:
      - kind: event
        side: con
        name: Querétaro
        date: 5 February 1917
        text: The constitutional congress adopted the constitution that is still, much amended, in force.
        lonlat: [-100.393, 20.587]
      - kind: capital
