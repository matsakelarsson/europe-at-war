id: bai-lang-rebellion
name: Bai Lang Rebellion
start: "1911"
end: "1914-08"
tier: C
summary: "A rising in central and north-western China against the government of Yuan Shikai, led by Bai Lang (1873–1914), a former officer of the New Army from Baofeng in western Henan. Bai took to arms in the disorder after the 1911 revolution with a few dozen men, survived a government purge of armed bands at Lushan in October 1912, and by 1913 led several thousand men who raided towns between the Beijing–Hankou railway and the Han River. Government papers wrote his name with the character for “wolf”, and the foreign press called him the “White Wolf”. In 1913–1914 his army, which took names such as the Citizens’ Punitive Army and claimed to fight Yuan Shikai, grew to 10,000 or more; Huang Xing and other Kuomintang leaders sent letters and arms after the failed Second Revolution, but their influence on it was small. In early 1914 it marched through Henan, Anhui and Hubei, crossed the Tongguan pass into Shaanxi and entered Gansu, where it met hard resistance from the Hui general Ma Anliang and from Hui, Tibetan and Han militias; at Taozhou thousands of Hui Muslims were killed, and Minzhou was plundered. Pressed by about 12,000 Beiyang troops under Duan Qirui’s command, the army broke up on its way back east. Bai was wounded near Lushan and died in August 1914, by most accounts in his home district; his head was shown at Kaifeng. Remnants were dispersed later that year."
