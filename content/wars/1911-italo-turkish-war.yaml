steps:
  - title: Libya
    date: September 1911 – 1912
    when: "1911-09-29"
    borders: "1912-10-17"
    countries: [ly, it, tr]
    body:
      - Italy had long claimed Libya, the last Ottoman province in North Africa, and had secured the consent of France and Britain. After the Agadir Crisis of 1911, and with nationalist newspapers promising an easy conquest, the government of Giovanni Giolitti sent an ultimatum and declared war on 29 September 1911. The navy shelled the forts of Tripoli and landed sailors, and in October troops took Tripoli, Tobruk, Derna, Benghazi and Homs. Instead of welcoming the Italians, many Arabs and Berbers joined the small Ottoman garrisons. On 23 October an attack at Shar al-Shatt, on the edge of Tripoli, killed some 500 Italian soldiers, and Italian troops took revenge on the people of the oasis, killing thousands of civilians.
      - On 5 November Italy declared Libya annexed, but its army, eventually some 100,000 men, held little more than the coast. Young Ottoman officers, among them Enver Bey and Mustafa Kemal, slipped into the country through Egypt and Tunisia to organise Arab and Berber fighters, including the Senussi religious order in Cyrenaica, and the war became one of trenches around the Italian-held towns. It was the first war in which aircraft were used. Captain Carlo Piazza flew the first reconnaissance flight on 23 October 1911, and on 1 November Lieutenant Giulio Gavotti dropped the first bombs from an aeroplane.
    facts:
      - [Italian declaration of war, "29 September 1911"]
      - [Annexation decreed by Italy, "5 November 1911"]
      - [First bombs dropped from an aeroplane, "1 November 1911"]
