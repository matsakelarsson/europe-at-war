id: italo-turkish-war
name: Italo-Turkish War
start: "1911-09-29"
end: "1912-10-18"
tier: B
summary: A war in which Italy seized the Ottoman provinces of Tripolitania and Cyrenaica, today’s Libya, and occupied the Dodecanese islands in the Aegean. The Ottomans gave up Libya by the Treaty of Ouchy in October 1912, but Libyan resistance to Italian rule went on for twenty years.
countries: [ly, it, tr, gr]
sides:
  - id: it
    name: Italy
    polities: [italy]
    ink: green
    moves: Italian moves
    success: Italian success
  - id: ot
    name: Ottoman Empire and Libyan fighters
    polities: [ottoman]
    ink: teal
    moves: Ottoman and Libyan moves
    success: Ottoman and Libyan success
notes:
  - Known in Italy as the Libyan War (Guerra di Libia) and in Turkey as the Tripolitanian War. The Treaty of Ouchy, signed in the lakeside quarter of Lausanne, is also called the First Treaty of Lausanne. Its quick Ottoman defeat encouraged the Balkan states, and the First Balkan War began days before the peace was signed.
  - Italian losses were about 3,400–6,000 dead, many of them from disease. Ottoman and Libyan losses are less certain; one estimate is about 14,000 killed in action or dead of disease and some 10,000 killed in reprisals and executions.
