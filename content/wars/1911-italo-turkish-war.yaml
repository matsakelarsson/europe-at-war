  - title: The Dodecanese and the Treaty of Ouchy
    date: February – October 1912
    when: "1912-02-24"
    borders: "1912-10-18"
    countries: [gr, tr, lb, it, ch, ly]
    body:
      - Unable to win in Libya, Italy carried the war to the eastern Mediterranean to force the Ottomans to make peace. In February 1912 Italian cruisers sank two Ottoman warships in the harbour of Beirut, killing civilians ashore, and in April they shelled the forts at the mouth of the Dardanelles, which the Ottomans closed to shipping. Between late April and May Italian forces occupied the Dodecanese islands off the Anatolian coast. On Rhodes troops landed on 4 May, and the Ottoman garrison surrendered in the mountains near Psithos on 16–17 May. In July Italian torpedo boats made a night raid into the Dardanelles.
      - Talks opened in Switzerland in the summer, and with the Balkan states about to attack, the Ottomans signed the Treaty of Ouchy, near Lausanne, on 18 October 1912. They withdrew their troops and officials from Libya, while the Sultan kept a religious role there. Italy promised to return the Dodecanese once the last Ottoman forces had left Libya, but never did, and Turkey gave up the islands in 1923. In Libya, the Senussi and other fighters kept up their resistance, and Italy was not in control of the whole country until 1932, after a brutal campaign in which tens of thousands of Libyans died.
    facts:
      - [Rhodes occupied, "4–17 May 1912"]
      - [Treaty of Ouchy, "18 October 1912"]
      - [Result, "Libya and the Dodecanese under Italian rule"]
