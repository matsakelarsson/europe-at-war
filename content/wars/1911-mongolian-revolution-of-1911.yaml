notes:
  - The revolution in Urga itself was almost bloodless. The main fighting was at Khovd in 1912, where the Mongols, including the Oirat leader Ja Lama, besieged the Chinese garrison and the Chinese merchant town; many Chinese were killed when the town fell.
  - Russian Cossacks of the consular guard took part in disarming the amban’s troops in Urga, and the Russian consul at Khovd negotiated the garrison’s surrender. Dates in Russian sources of the time are in the Julian calendar, 13 days behind.
