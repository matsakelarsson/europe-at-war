id: mongolian-revolution-of-1911
name: Mongolian Revolution of 1911
start: "1911-11-30"
end: "1912-08-20"
tier: B
summary: "The movement by which Outer Mongolia broke away from the Qing empire during the Xinhai Revolution. Qing plans in the 1900s to settle Chinese farmers in Mongolia, raise an army and govern it directly alarmed the Mongol nobles and the Buddhist clergy, and in 1911 a group of them sent a secret mission to Russia to ask for help. When the revolution broke out in China, they formed a provisional government in Urga (today Ulaanbaatar) on 30 November 1911, disarmed the small garrison of the Qing amban Sandowa and sent him away under Russian escort. On 29 December the Jebtsundamba Khutuktu, the head of the Buddhist church in Mongolia, was enthroned as Bogd Khan of an independent Mongolian state. Qing officials at Uliastai left under Russian protection, the Barga Mongols of Hulunbuir took Hailar in January 1912, and in August 1912 Mongol forces took Khovd, the last Qing post in western Mongolia. Russia backed Mongolian autonomy, not full independence, and by the agreements of 1913 and 1915 Outer Mongolia was recognised as autonomous under Chinese suzerainty."
countries: [mn, cn, ru]
