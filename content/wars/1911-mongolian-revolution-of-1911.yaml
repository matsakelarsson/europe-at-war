steps:
  - title: Independence in Urga
    date: July – December 1911
    when: "1911-12-01"
    borders: "1911-12-29"
    countries: [mn]
    body:
      - The Qing “New Policies” reached Mongolia in 1910 with a new amban, Sandowa, who set up offices for taxation, police and colonisation and began to raise an army, with barracks outside Urga. Mongol herds and nobles were deep in debt to Chinese merchants, and a quarrel between lamas and Chinese in Urga in 1910 ended with the monks driving off the amban’s soldiers. In July 1911 a group of nobles led by Tögs-Ochiryn Namnansüren met secretly and persuaded the Jebtsundamba Khutuktu to send a delegation to Saint Petersburg to ask for Russian protection.
      - After the Wuchang Uprising in October, the delegates came back and the nobles formed a provisional government. On 28 November it ordered each of the four aimags of Khalkha to raise 1,000 soldiers. Sandowa, who had only about 150 unpaid troops, was told to leave; his soldiers were disarmed by Mongol militia and Cossacks of the Russian consulate, and on 1 December the government proclaimed the end of Qing rule. Sandowa left under Russian escort a few days later, and on 29 December 1911 the Khutuktu was enthroned as Bogd Khan, the “holy ruler”, of Mongolia.
