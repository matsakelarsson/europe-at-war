  - title: Hulunbuir and Khovd
    date: January – August 1912
    when: "1912-08-20"
    borders: "1912-08-20"
    countries: [mn, cn]
    body:
      - The Barga Mongols of Hulunbuir, in the north-west of Manchuria, rose in January 1912, took Hailar and declared for the Bogd Khan. In the west, the Qing commander at Khovd refused to give up the town, hoping for help from Xinjiang. Mongol forces led by Damdinsüren, Magsarjav and the Oirat adventurer Ja Lama besieged it from the spring of 1912; a relief column from the Altai was defeated in early August.
      - Khovd fell on 20 August 1912 (7 August in the Julian calendar), after the Russian consul had arranged the garrison’s surrender; the Mongols looted the Chinese trading town and killed many of its people. With Khovd, all of Outer Mongolia was out of Chinese hands. The Republic of China claimed Mongolia as part of its territory, and in the Russo-Chinese declaration of 1913 and the Treaty of Kyakhta of 1915 Outer Mongolia was recognised as autonomous under Chinese suzerainty.
    facts:
      - [Hailar taken by the Barga, "January 1912"]
      - [Khovd taken, "20 August 1912"]
      - [Treaty of Kyakhta, "1915"]
