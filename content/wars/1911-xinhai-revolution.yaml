id: xinhai-revolution
name: Xinhai Revolution
start: "1911-10-10"
end: "1912-02-12"
tier: A
summary: "The revolution that ended the Qing dynasty and two thousand years of imperial rule in China, also called the 1911 Revolution. After a summer of protest in Sichuan against the nationalisation of the provincial railways, revolutionary soldiers of the New Army rose at Wuchang on 10 October 1911 and set up a military government for Hubei. Within two months most provinces of the south and centre had declared their independence of the Qing, often after killing or driving out the Manchu garrisons. The court recalled Yuan Shikai, whose Beiyang Army retook Hankou and Hanyang, but the revolutionaries took Nanjing in December, and on 1 January 1912 Sun Yat-sen was inaugurated there as provisional president of the Republic of China. Yuan negotiated with both sides, and on 12 February 1912 the empress dowager Longyu issued the abdication of the six-year-old Xuantong emperor, Puyi. Sun stepped down and Yuan became president of the Republic. Outer Mongolia and Tibet broke away from Chinese rule in the same months."
countries: [cn]
sides:
  - id: rev
    name: Revolutionaries (from 1 January 1912 the Republic of China)
    polities: [xinhai-revolutionaries, roc]
    ink: red
    moves: Revolutionary moves
    success: Revolutionary success
  - id: qing
    name: Qing dynasty
    polities: [qing]
    ink: gold
    moves: Qing moves
    success: Qing success
notes:
  - The revolution is named after the xinhai year of the Chinese sexagenary cycle (1911). 10 October, the day of the Wuchang Uprising, is still celebrated as National Day (Double Ten Day) in Taiwan.
  - Many provinces changed sides without fighting, when their governors, the provincial assemblies or the New Army commanders declared independence. In several cities the revolutionaries massacred the Manchu bannermen and their families, at Xi’an, Wuchang, Taiyuan, Zhenjiang, Nanjing and Fuzhou among other places; at Xi’an an estimated 10,000 to 20,000 were killed. There is no reliable count of the dead of the revolution as a whole.
  - The independence of Outer Mongolia (December 1911) and the expulsion of the Qing troops from Tibet (1912–1913) have their own entries.
