steps:
  - title: The railway protest in Sichuan
    date: May – September 1911
    when: "1911-09-07"
    borders: "1911-09-07"
    countries: [cn]
    body:
      - After the Boxer War the Qing court had begun reforms, building a modern New Army, abolishing the civil service examinations and promising a constitution, but in May 1911 it named a cabinet in which most ministers were Manchu princes. In the same month it nationalised the provincial railway companies, in which gentry and merchants had invested, in order to raise a foreign loan from a consortium of British, French, German and American banks for the Hankou–Guangzhou and Hankou–Sichuan lines. The terms offered to Sichuan’s shareholders were the worst, and a Railway Protection League there organised strikes, boycotts and tax refusal.
      - On 7 September 1911 the acting governor-general of Sichuan, Zhao Erfeng, arrested the league’s leaders, and his guards fired on the crowd that gathered outside his yamen in Chengdu, killing several dozen people. The countryside rose, armed bands of the Gelaohui secret society besieged Chengdu, and the court sent the official Duanfang with New Army troops from Hubei to restore order, leaving the garrison of Wuhan weakened. Revolutionary societies had long been organising among the Hubei soldiers. Sun Yat-sen’s Revolutionary Alliance (Tongmenghui), founded in Tokyo in 1905, had staged a series of failed risings in the south, the last at Guangzhou in April 1911.
    facts:
      - [Railways nationalised, "May 1911"]
      - [Chengdu shootings, "7 September 1911"]
      - [Last failed Tongmenghui rising, "Guangzhou, 27 April 1911"]
