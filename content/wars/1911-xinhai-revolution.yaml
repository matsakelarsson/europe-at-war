  - title: The Wuchang Uprising
    date: 9 – 12 October 1911
    when: "1911-10-10"
    borders: "1911-10-12"
    countries: [cn]
    body:
      - On 9 October 1911 a bomb went off by accident in a house in the Russian concession of Hankou where members of the Progressive Association were making explosives. The police found lists of members, and arrests and executions followed. Fearing they would all be caught, soldiers of the New Army’s 8th Engineer Battalion in Wuchang rose on the evening of 10 October, seized the arsenal and, joined by other units, attacked the governor-general’s yamen. The governor-general, Ruicheng, fled to a gunboat on the Yangtze, and by the morning of 11 October the city was in revolutionary hands.
      - Lacking a well-known leader, the soldiers made Li Yuanhong, a brigade commander, military governor of the new Hubei military government, reportedly at gunpoint. Hanyang, with its arsenal and ironworks, and Hankou were taken on 11 and 12 October. The new government proclaimed the Republic of China, called on the other provinces to rise, and promised the foreign consuls to respect the treaties; the powers declared themselves neutral. In Wuchang a number of Manchu residents were killed.
    facts:
      - [Bomb explodes in Hankou, "9 October 1911"]
      - [Wuchang Uprising, "10 October 1911"]
      - [Hubei military government, "11 October 1911, under Li Yuanhong"]
