  - title: The battle of Yangxia
    date: 18 October – 1 December 1911
    when: "1911-11-01"
    borders: "1911-11-27"
    countries: [cn]
    body:
      - The court sent the Beiyang Army, the best of the New Army divisions, south by the Beijing–Hankou railway, and on 14 October recalled Yuan Shikai, the general who had built that army and whom the regent had dismissed in 1909. Yuan took his time, accepted command only on his own terms, and on 1 November was made prime minister. Meanwhile his commander Feng Guozhang attacked Hankou, defended by Hubei troops and volunteers under Huang Xing, who arrived from Hong Kong at the end of October. Hankou fell on 1 November after days of street fighting, and much of the city was burned.
      - Huang Xing’s counter-attack across the Han river failed, and on 27 November the Beiyang troops took Hanyang and its arsenal, from which their guns could fire on Wuchang. The revolutionaries lost several thousand men in the fighting for the three cities. Yuan stopped there. On 1 December a truce was agreed at Wuhan with the help of the British consul, and Yuan, who wanted to be the arbiter between court and revolution, opened talks with the south.
