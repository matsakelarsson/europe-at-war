  - title: Nanjing and the Republic
    date: December 1911 – January 1912
    when: "1911-12-02"
    borders: "1912-01-01"
    countries: [cn]
    body:
      - At Nanjing the loyalist general Zhang Xun, whose troops had killed suspected revolutionaries in the city, held out against an allied army of New Army units from Jiangsu and Zhejiang under Xu Shaozhen. After the revolutionaries took the Purple Mountain (Zijin Shan) above the city, Zhang withdrew north across the Yangtze, and Nanjing fell on 2 December. Peace talks between Yuan’s envoy Tang Shaoyi and the south’s Wu Tingfang opened in Shanghai on 18 December.
      - Sun Yat-sen, who had learned of the Wuchang Uprising from a newspaper in Denver, returned to Shanghai on 25 December after seeking support in the United States and Europe. On 29 December delegates of seventeen provinces meeting in Nanjing elected him provisional president, and he was inaugurated there on 1 January 1912, the first day of the Republic of China, which also adopted the Gregorian calendar. In the north, officers at Luanzhou in Zhili called for a republic and were crushed in January.
    facts:
