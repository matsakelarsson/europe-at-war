  - title: The abdication
    date: January – March 1912
    when: "1912-02-12"
    borders: "1912-02-12"
    countries: [cn]
    body:
      - Sun Yat-sen had promised to give up the presidency to Yuan Shikai if Yuan brought about the end of the dynasty. Yuan pressed the court, while the princes who wanted to fight lost their support. On 26 January 1912 the Manchu leader of the war party, Liangbi, was mortally wounded by a revolutionary bomb, and on the same day more than forty Beiyang generals led by Duan Qirui telegraphed the court demanding a republic. The empress dowager Longyu accepted terms under which the emperor would keep his title, his palace and a large annual allowance.
      - On 12 February 1912 she issued the edict of abdication for the six-year-old Xuantong emperor, Puyi, which handed power to Yuan to form a republican government. Sun resigned the next day, and on 15 February the provisional senate in Nanjing elected Yuan provisional president; he was inaugurated in Beijing, which remained the capital, on 10 March. The Republic claimed all the lands of the Qing, but Outer Mongolia had declared its independence in December 1911, and in Tibet the Qing garrison was being driven out. Yuan’s rule soon turned into a struggle with the revolutionaries of the Nationalist Party (Kuomintang), the start of a long period of division and civil war.
    facts:
      - [Liangbi assassinated, "26 January 1912"]
      - [Abdication of the Xuantong emperor, "12 February 1912"]
      - [Yuan Shikai elected provisional president, "15 February 1912"]
      - [Yuan inaugurated in Beijing, "10 March 1912"]
    markers:
      - kind: event
        side: qing
        name: Forbidden City
        date: 12 February 1912
        text: The edict of abdication was issued in the name of Puyi, who was allowed to go on living in the inner palace until 1924.
        lonlat: [116.397, 39.917]
        lp: b
      - kind: capital
        side: rev
