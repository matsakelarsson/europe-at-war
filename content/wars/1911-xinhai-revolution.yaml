  - title: The provinces declare independence
    date: October – November 1911
    when: "1911-10-22"
    borders: "1911-11-27"
    countries: [cn]
    body:
      - The rising spread along the networks of the New Army, the secret societies and the provincial assemblies. On 22 October revolutionaries took Changsha in Hunan and Xi’an in Shaanxi, where they stormed the walled Manchu quarter and killed most of its inhabitants over three days; estimates of the dead range from 10,000 to 20,000. Jiangxi, Shanxi (29 October) and Yunnan, where Cai E led the New Army at Kunming (30 October), followed. On 3–4 November Chen Qimei’s fighters took Shanghai and its arsenal, and in the following days Zhejiang, Jiangsu (except Nanjing), Guizhou, Guangxi, Anhui, Fujian and Guangdong broke with Beijing. In Fuzhou the Manchu garrison resisted and was overcome with heavy loss of life.
      - In Sichuan, Chongqing declared independence on 22 November and Chengdu on 27 November. On the same day Duanfang was killed by his own troops, who had turned against him, at Zizhou, and in December Zhao Erfeng was executed by the new authorities in Chengdu. By the end of November fourteen provinces had renounced the Qing. In the north the court kept Zhili, Henan, Shandong (where independence was declared and then withdrawn), Gansu, Xinjiang and Manchuria.
    facts:
