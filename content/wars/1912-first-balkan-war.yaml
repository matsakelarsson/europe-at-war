  - title: Çatalca, the armistice and the London conference
    date: November 1912 – February 1913
    when: "1912-11-17"
    borders: "1913-02-09"
    countries: [bg, tr, gr, rs, me]
    body:
      - Ignoring Russian warnings to keep out of Constantinople, the Bulgarians attacked the Çatalca lines, which ran for some 30 kilometres from the Black Sea to the Sea of Marmara, on 17–18 November. The Ottoman defenders, reinforced from Asia and supported by the guns of their warships, threw them back, while cholera spread through both armies. On 3 December Bulgaria, for itself, Serbia and Montenegro, agreed an armistice with the Ottomans. Greece refused to sign so that its fleet could keep up the blockade, and the sieges of Adrianople, Ioannina and Scutari went on.
      - Peace talks opened in London on 16 December, alongside a conference of the Great Powers’ ambassadors that agreed on an autonomous Albania. When the government of Kâmil Pasha seemed ready to give up Adrianople, Enver Bey and other officers of the Committee of Union and Progress stormed the Sublime Porte on 23 January 1913 and shot the war minister, Nazım Pasha. The new government rejected the terms, and fighting resumed on 3 February. On 8 February an Ottoman attack at Bulair, at the neck of the Gallipoli peninsula, failed with heavy losses, and troops landed behind the Bulgarians at Şarköy soon re-embarked.
    facts:
      - [First Battle of Çatalca, "17–18 November 1912, Ottoman victory"]
      - [Armistice, "3 December 1912, without Greece"]
      - [Raid on the Sublime Porte, "23 January 1913"]
    markers:
      - kind: battle
        side: ot
        name: Battle of Çatalca
        date: 17–18 November 1912
        text: The Bulgarian assault on the old fortified lines failed, and the front stayed here until the armistice.
        lonlat: [28.462, 41.143]
        lp: l
      - kind: event
