  - title: Ioannina and Adrianople
    date: March 1913
    when: "1913-03-04"
    borders: "1913-03-26"
    countries: [gr, al, bg, rs, tr]
    body:
      - In Epirus the Greeks had stood since December before the fortified heights of Bizani, which guarded Ioannina. Crown Prince Constantine brought divisions over from Macedonia, and after a heavy bombardment the Greek army broke through on 5 March. The next day Esad Pasha surrendered the city and its garrison. Greek forces went on north into southern Albania, which Greeks called Northern Epirus, where they had taken Korçë in December, and occupied Gjirokastër and the country around it. Their presence there would be one of the hardest questions for the powers drawing Albania’s borders.
      - Adrianople had been besieged since November by the Bulgarian Second Army and two Serbian divisions, and in the war’s first air raids Bulgarian airmen dropped bombs on the city. On the night of 24–25 March the allies stormed the forts, and on 26 March Mehmed Şükrü Pasha surrendered with tens of thousands of men. Turkish accounts say that thousands of prisoners kept on the river island of Sarayiçi died of hunger and cold. The loss of the old Ottoman capital ended Ottoman hopes, and in April the Porte accepted the powers’ terms.
    facts:
      - [Battle of Bizani, "4–6 March 1913, Greek victory"]
      - [Ioannina surrenders, "6 March 1913"]
      - [Adrianople taken, "26 March 1913"]
    markers:
      - kind: battle
        side: gr
        name: Bizani
        date: 4–6 March 1913
        text: The German-designed forts south of Ioannina fell after a bombardment and an attack that took the defenders by surprise.
        lonlat: [20.83, 39.58]
        lp: l
      - kind: taken
        side: gr
        name: Ioannina
        date: 6 March 1913
        text: Esad Pasha surrendered the capital of Epirus and its garrison to Crown Prince Constantine.
        lonlat: [20.852, 39.664]
      - kind: taken
        side: gr
        name: Korçë
        date: 20 December 1912
        text: Taken by Greek troops advancing from western Macedonia; it later went to Albania.
        lonlat: [20.781, 40.618]
      - kind: taken
        side: gr
        name: Gjirokastër
        date: March 1913
        text: Occupied by the Greek army after the fall of Ioannina; Greece had to hand it to Albania in 1914.
        lonlat: [20.139, 40.076]
        lp: l
      - kind: taken
        side: bg
