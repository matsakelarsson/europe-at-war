steps:
  - title: The Balkan League goes to war
    date: March – October 1912
    when: "1912-10-08"
    borders: "1912-10-17"
    countries: [bg, rs, gr, me, tr, al]
    body:
      - Italy’s war for Libya and a wave of Albanian revolts had shown how weak Ottoman rule in Europe had become. On 13 March 1912 Bulgaria and Serbia signed an alliance whose secret annex divided Macedonia, the prize both wanted. Serbia was to have the north, Bulgaria the land south-east of a line from Kriva Palanka to Ohrid, and the Tsar of Russia was to arbitrate the zone between. Greece allied with Bulgaria on 29 May without any agreement on borders, and in late summer Montenegro came to terms with Bulgaria and Serbia, completing what became known as the Balkan League.
      - The allies mobilised at the end of September, although the Great Powers warned that they would accept no change to the map. Montenegro declared war first, on 8 October, and its troops crossed into northern Albania and the Sandžak of Novi Pazar. On 13 October Bulgaria, Serbia and Greece demanded autonomy for the Christian provinces of European Turkey under their supervision, knowing it would be refused. The Ottoman Empire, which was making peace with Italy, declared war on Bulgaria and Serbia on 17 October, and Greece declared war the next day.
    facts:
      - [Serbo-Bulgarian alliance, "13 March 1912"]
      - [Montenegro declares war, "8 October 1912"]
      - [Wider war, "17–18 October 1912"]
    markers:
      - kind: treaty
        name: Sofia
        date: 13 March 1912
        text: Bulgaria and Serbia signed their alliance here, with a secret annex dividing Macedonia between them.
        lonlat: [23.322, 42.698]
      - kind: event
        side: me
        name: Cetinje
        date: 8 October 1912
        text: Montenegro, the smallest of the allies, declared war first; King Nicholas’s son Prince Peter is said to have fired the first shot of the war.
        lonlat: [18.923, 42.391]
        lp: l
      - kind: taken
        side: me
        name: Bijelo Polje
        date: October 1912
        text: Taken by Montenegro’s Eastern Detachment in the first week of the war as it moved into the Sandžak.
        lonlat: [19.747, 43.038]
      - kind: taken
        side: me
        name: Tuzi
        date: October 1912
        text: The Ottoman border town south of Podgorica fell to the Zeta Detachment, opening the road to Scutari.
        lonlat: [19.331, 42.366]
    arrows:
