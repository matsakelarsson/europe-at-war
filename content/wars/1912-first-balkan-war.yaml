  - title: Kirk Kilisse and Lule Burgas
    date: October – November 1912
    when: "1912-10-22"
    borders: "1912-11-03"
    countries: [bg, tr, gr]
    body:
      - Bulgaria sent most of its army into Thrace, the shortest way to Constantinople. While the Second Army under General Nikola Ivanov closed on the fortress of Adrianople, the First and Third Armies pushed south-east past it. The Ottoman Eastern Army attacked them in the hills around Kirk Kilisse on 22 October and was routed within three days, its reserve units breaking under fire, and the Bulgarians entered the abandoned town on 24 October. From 3 November Adrianople, held by some 60,000 men under Mehmed Şükrü Pasha, was cut off and besieged.
      - The Ottomans rallied on a line from Lule Burgas to Pınarhisar, and from 28 October to 2 November well over 200,000 men fought there, the largest battle in Europe between 1871 and 1914. The Ottoman army, short of food and shells and soon struck by cholera, gave way and fell back in disorder to the Çatalca lines, the last defences of Constantinople. Further west, Bulgarian columns crossed the Rhodopes, reached the Aegean at Dedeagach on 19 November, and in late November forced the surrender of Yaver Pasha’s corps of about 10,000 men near the Maritsa.
    facts:
      - [Battle of Kirk Kilisse, "22–24 October 1912, Bulgarian victory"]
      - [Battle of Lule Burgas, "28 October – 2 November 1912, Bulgarian victory"]
      - [Siege of Adrianople, "from 3 November 1912"]
    markers:
      - kind: battle
        side: bg
        name: Battle of Kirk Kilisse
