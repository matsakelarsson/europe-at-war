  - title: Kumanovo and Bitola
    date: October – November 1912
    when: "1912-10-23"
    borders: "1912-11-30"
    countries: [rs, mk, xk, me, al, tr]
    body:
      - The main Serbian force, the First Army under Crown Prince Alexander, advanced up the Morava towards Skopje, the centre of Ottoman power in Kosovo and Macedonia. Zeki Pasha’s Vardar Army attacked it near Kumanovo on 23 October and after two days of fighting broke and retreated, leaving much of its artillery behind. Serbian troops entered Skopje on 26 October. The Serbian Third Army took Pristina and Prizren in Kosovo, while Serbian and Montenegrin troops divided the Sandžak and Montenegrins took Peć and Gjakova. Foreign reporters and the later Carnegie Commission described killings of Albanian civilians and burned villages in their wake.
      - The Ottoman army fell back south. The Serbs beat it again at Prilep on 3–5 November, and on 16–19 November, in the biggest battle of the Macedonian campaign, they broke its last stand before Bitola, the seat of the Manastır vilayet. The remnants fled into Albania. Serbian columns then marched across the Albanian mountains in winter and reached the Adriatic, taking Durrës on 29 November. Austria-Hungary and Italy, determined that Serbia should not have a port on the Adriatic, warned that they would not let it stay.
    facts:
      - [Battle of Kumanovo, "23–24 October 1912, Serbian victory"]
      - [Skopje entered, "26 October 1912"]
      - [Battle of Monastir (Bitola), "16–19 November 1912, Serbian victory"]
