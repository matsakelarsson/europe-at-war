  - title: Scutari and the Treaty of London
    date: November 1912 – May 1913
    when: "1913-04-23"
    borders: "1913-05-30"
    countries: [me, al, rs, gr, bg, tr]
    body:
      - As Serbian, Montenegrin and Greek troops occupied most of the land Albanians lived in, Albanian delegates meeting at Vlorë declared independence on 28 November 1912, with Ismail Qemali at the head of a provisional government. Austria-Hungary and Italy, unwilling to see Serbia on the Adriatic, backed an Albanian state, and in December the ambassadors in London accepted it in principle. Montenegro had besieged Scutari, the largest town of northern Albania, since 28 October, with Serbian help from February, but its costly assaults on the hills around the town failed.
      - The powers awarded Scutari to Albania, and in April an international fleet blockaded the Montenegrin coast. Even so, the garrison commander, Essad Pasha Toptani, surrendered the town to Montenegro on 23 April, in return for leaving with his troops and arms. Under threat of war from Austria-Hungary, King Nicholas gave it up, and an international force took over on 14 May. By the Treaty of London of 30 May the Ottomans ceded everything west of a line from Enos to Midia, as well as Crete, and left Albania and the Aegean islands to the powers. The victors had still to divide the spoils, and quarrelled at once.
    facts:
      - [Albanian declaration of independence, "Vlorë, 28 November 1912"]
      - [Scutari surrenders, "23 April 1913, to Montenegro"]
      - [Treaty of London, "30 May 1913"]
    markers:
      - kind: event
        name: Vlorë
        date: 28 November 1912
        text: Delegates from across the Albanian lands raised the flag and declared independence; the powers recognised Albania in July 1913 and drew its borders that December.
        lonlat: [19.49, 40.466]
      - kind: siege
        side: me
        name: Scutari
        date: 28 October 1912 – 23 April 1913
        text: After a six-month siege that cost Montenegro thousands of men, Essad Pasha handed the town over; Montenegro held it only until 14 May.
        lonlat: [19.512, 42.068]
      - kind: event
        name: International blockade
        date: April 1913
        text: Warships of the Great Powers blockaded the coast of Montenegro to force it to give up the siege of Scutari.
        lonlat: [19.08, 42.08]
        lp: l
      - kind: taken
        side: rs
        name: Durrës
        date: April 1913
        text: Serbian troops left the Adriatic coast under pressure from the powers, giving up Serbia’s hope of a port.
        lonlat: [19.449, 41.323]
        lp: l
