id: first-balkan-war
name: First Balkan War
start: "1912-10-08"
end: "1913-05-30"
tier: A
summary: A war in which the Balkan League of Bulgaria, Serbia, Greece and Montenegro drove the Ottoman Empire out of almost all its remaining lands in Europe. In eight months the allies won at Kirk Kilisse, Lule Burgas, Kumanovo and Bitola, took Thessaloniki, Ioannina, Adrianople and Scutari, and by the Treaty of London of May 1913 the Ottomans gave up everything west of a line from Enos to Midia, while the Great Powers created an independent Albania.
countries: [bg, rs, gr, me, tr, al, mk, xk]
sides:
  - id: bg
    name: Bulgaria
    polities: [bulgaria]
    ink: green
    moves: Bulgarian moves
    success: Bulgarian success
  - id: rs
    name: Serbia
    polities: [serbia]
    ink: red
    moves: Serbian moves
    success: Serbian success
  - id: gr
    name: Greece
    polities: [greece]
    ink: navy
    moves: Greek moves
    success: Greek success
  - id: me
    name: Montenegro
    polities: [montenegro]
    ink: magenta
    moves: Montenegrin moves
    success: Montenegrin success
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Bulgaria, Serbia, Montenegro and Greece still used the Julian (Old Style) calendar, 13 days behind the Gregorian; Greek and Bulgarian accounts often give Old Style dates (Thessaloniki surrendered on 26 October Old Style, 8 November New Style). All dates here are New Style.
  - Places are named as in most English accounts of the war, with today’s names where they differ; Kirk Kilisse is Kırklareli, Lule Burgas is Lüleburgaz, Adrianople is Edirne, Monastir is Bitola, Üsküp is Skopje, Scutari is Shkodër, Yenidje is Giannitsa and Dedeagach is Alexandroupoli.
  - The base map keeps Ottoman borders until the Treaty of London; the allied occupations of 1912–1913 are shown as approximate areas.
  - The war’s violence fell heavily on civilians. Muslim villagers in Macedonia, Kosovo and Thrace were killed or driven out by allied troops and irregulars, Christian villages suffered at the hands of retreating Ottoman troops and irregulars, and hundreds of thousands of refugees fled; the international Carnegie Commission described many of these crimes in 1914.
