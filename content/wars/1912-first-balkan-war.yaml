        lonlat: [26.756, 40.513]
        lp: l
      - kind: battle
        side: bg
        name: Şarköy
        date: February 1913
        text: An Ottoman corps landed on the Marmara coast behind the Bulgarian lines but was withdrawn by sea when the Bulair attack failed.
        lonlat: [27.107, 40.614]
