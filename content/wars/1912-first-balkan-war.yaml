  - title: The Greek advance and Thessaloniki
    date: October 1912 – January 1913
    when: "1912-10-18"
    borders: "1913-01-18"
    countries: [gr, tr, mk]
    body:
      - The Greek Army of Thessaly under Crown Prince Constantine crossed the frontier on 18 October and forced the Sarantaporo pass on 22–23 October. Constantine wanted to turn west towards Bitola, but the prime minister, Eleftherios Venizelos, insisted that Thessaloniki, the great port that Bulgaria also wanted, must come first. After a victory at Yenidje on 1–2 November the Greeks closed on the city, and on 8 November Hasan Tahsin Pasha surrendered it with about 26,000 men. A Bulgarian division arrived a day later, and the two allies shared the city uneasily. Meanwhile a separate Greek division in western Macedonia was routed at Sorovich.
      - At sea, the Greek navy kept Ottoman reinforcements from Asia off the European front. It took Lemnos on 21 October and made the bay of Moudros its base; Thasos, Imbros, Samothrace, Tenedos, Lesbos and Chios followed by early January. Rear Admiral Pavlos Kountouriotis, in the fast armoured cruiser Georgios Averof, beat the Ottoman fleet when it came out of the Dardanelles at Elli on 16 December and again off Lemnos on 18 January 1913, after which it stayed in the straits.
    facts:
      - [Battle of Sarantaporo, "22–23 October 1912, Greek victory"]
      - [Thessaloniki surrenders, "8 November 1912"]
      - [Naval battles, "Elli, 16 December 1912; Lemnos, 18 January 1913"]
    markers:
      - kind: battle
        side: gr
        name: Sarantaporo
        date: 22–23 October 1912
        text: Greek troops turned and broke the Ottoman positions in the pass leading from Thessaly into Macedonia.
        lonlat: [22.03, 40.04]
