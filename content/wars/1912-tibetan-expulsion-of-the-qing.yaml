id: tibetan-expulsion-of-the-qing
name: Expulsion of the Qing garrison from Tibet
start: "1912-04"
end: "1913-01"
tier: C
summary: "The fighting in which Tibetans drove the Chinese garrison out of Lhasa and central Tibet after the fall of the Qing dynasty. A Qing army of some 2,000 men had entered Lhasa in February 1910, and the 13th Dalai Lama had fled to British India. When news of the Wuchang uprising of October 1911 reached Tibet, the unpaid garrison mutinied, plundered and split into factions. In the spring of 1912 the Dalai Lama, still in India, called on Tibetans to rise; Tibetan militias under Tsarong Dazang Dramdul besieged the Chinese in Lhasa, where the mutineers had plundered the city and occupied Sera monastery, while the garrisons of Gyantse and Shigatse surrendered and were sent to India through the mediation of the British trade agent David Macdonald. An agreement of 12 August 1912, concluded in the presence of Nepalese representatives, required the Chinese in Lhasa to seal their arms and leave within fifteen days. Fighting broke out again in September; a second armistice on 14 November was followed on 12 December 1912 by the departure from Lhasa of the last troops under Zhong Ying, who went home by way of India. The Dalai Lama returned to Lhasa in January 1913 and on 13 February 1913 issued a proclamation that Tibetans regard as a declaration of independence. The Republic of China maintained its claim to Tibet; a Sichuan army that reoccupied much of Kham in 1912 did not advance into central Tibet after Britain protested in August 1912. From 1913 to 1950 the Dalai Lama’s government governed central and western Tibet itself, although no major state recognised it as independent."
