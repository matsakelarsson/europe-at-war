notes:
  - The Chinese and Tibetan accounts, and the British reports from Gyantse and Sikkim, differ on dates and numbers; casualties are not known.
  - Whether Tibet was an independent state between 1913 and 1950 is disputed. The Tibetan government in exile holds that it was; the governments of the Republic of China and the People’s Republic have held that Tibet remained part of China.
