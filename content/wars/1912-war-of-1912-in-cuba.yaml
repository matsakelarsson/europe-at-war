id: war-of-1912-in-cuba
name: War of 1912 in Cuba
start: "1912-05-20"
end: "1912-07-18"
tier: C
summary: "The armed protest of the Partido Independiente de Color (Independent Party of Colour) in 1912 and the government campaign that crushed it, in which thousands of Afro-Cubans were killed. It is also called the Little Race War (la Guerrita de las Razas), the Race War of 1912 and the Negro Rebellion, and in Cuba often the Massacre of 1912. Afro-Cubans had made up a large part of the Liberation Army in the wars of independence, but under the republic they were largely shut out of public jobs, land and political office. In 1908 veterans led by Evaristo Estenoz and Pedro Ivonnet founded the Partido Independiente de Color to press for equal rights. In 1910 Congress passed the Morúa Amendment to the electoral law, which banned parties formed on racial lines, and President José Miguel Gómez’s government had the party disbanded and its leaders jailed for a time. On 20 May 1912 party members took up arms to force the repeal of the ban, mainly in Oriente, where many Afro-Cubans worked on the sugar and coffee estates, with smaller groups in Las Villas. The government, the army under General José de Jesús Monteagudo and volunteer militias answered with a campaign of killings in the countryside of Oriente, where many Black Cubans who had not taken up arms were shot or hanged, while the press spread fear of a Black uprising. The United States landed marines to guard American sugar estates, mines and railways, with about 2,800 men in Cuba by June; the rebels fought them only once, at El Cuero. Estenoz was killed on 27 June and Ivonnet on 18 July, after he had surrendered, and the rising was over. Estimates of the dead range from about 2,000 to 6,000, nearly all Afro-Cubans; losses on the government side were small. The party was destroyed, and the last marines left on 2 August."
