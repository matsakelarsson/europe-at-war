notes:
  - The number killed was never counted; the estimates of about 2,000, 3,000 and up to 6,000 dead come from historians and from Afro-Cuban organisations, and Aline Helg’s Our Rightful Share (1995) is the main modern study in English. Cuban historians have called the events the Massacre of the Independientes de Color, rejecting the name “race war” given to them at the time.
