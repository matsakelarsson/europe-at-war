notes:
  - Death tolls vary because local records counted only some deaths and contemporary reports disagree; the range of 69 to 199 is the one given by recent studies. For Ludlow itself sources give from about 18 to 25 dead, including one to three Guardsmen (Britannica gives 25).
  - Federal troops stayed in the coalfield as a peacekeeping force until January 1915.
