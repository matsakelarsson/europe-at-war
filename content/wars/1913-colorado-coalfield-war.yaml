id: colorado-coalfield-war
name: Colorado Coalfield War
start: "1913-09-23"
end: "1914-12-10"
tier: C
summary: "A strike that became an armed conflict in the southern Colorado coalfields of Huerfano and Las Animas counties. On 23 September 1913 some 10,000–12,000 coal miners, most of them immigrants from Italy, Greece, the Balkans and Mexico, struck the Colorado Fuel and Iron Company, owned largely by John D. Rockefeller Jr., and the smaller Rocky Mountain Fuel and Victor-American companies. Led by the United Mine Workers of America, they demanded recognition of the union, higher pay, an eight-hour day, the enforcement of Colorado’s mine-safety laws and the right to live and shop outside the company towns. Evicted from company housing, they and their families moved into tent colonies, the largest at Ludlow with about 1,200 people. The companies hired guards from the Baldwin–Felts Detective Agency, who patrolled in an armoured car, and from 28 October the Colorado National Guard was deployed. On 20 April 1914 Guardsmen and company guards attacked the Ludlow colony with machine guns and burned it: about twenty people died, among them the Greek strike leader Louis Tikas, shot while in the Guard’s custody, and two women and eleven children who suffocated in a pit dug under a burning tent. In the “Ten Days’ War” that followed, armed strikers attacked mines, company towns and guards along a front of some 360 km, from Trinidad in the south to Louisville north of Denver, until President Woodrow Wilson sent federal troops, who arrived at the end of April and disarmed both sides. Estimates of the dead in the whole conflict range from 69 to 199. The union ran out of money and ended the strike on 10 December 1914 without winning recognition; Rockefeller answered with a company-run employee representation plan. Ludlow became a symbol of the labour movement and is a National Historic Landmark."
