id: second-balkan-war
name: Second Balkan War
start: "1913-06-29"
end: "1913-08-10"
tier: B
summary: A six-week war over the division of Macedonia, in which Bulgaria attacked its former allies Serbia and Greece and was defeated, while Romania and the Ottoman Empire invaded from the north and east. By the Treaty of Bucharest of August 1913 Bulgaria lost most of Macedonia to Serbia and Greece and Southern Dobruja to Romania, and in September it returned Adrianople to the Ottomans.
