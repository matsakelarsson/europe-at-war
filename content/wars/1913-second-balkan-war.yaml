notes:
  - Bulgaria, Serbia, Greece, Montenegro and Romania still used the Julian (Old Style) calendar; Bulgarian and Greek accounts often date the start of the war to 16–17 June and the Battle of Kilkis–Lachanas to 19–21 June. All dates here are New Style.
  - The Carnegie Commission of 1914 found that every army in the war, and the irregulars with them, had killed civilians and burned villages, Bulgarian, Greek, Muslim and others alike.
