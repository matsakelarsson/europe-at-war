steps:
  - title: Bregalnica and Kilkis–Lachanas
    date: June – July 1913
    when: "1913-06-29"
    borders: "1913-07-10"
    countries: [bg, rs, gr, mk, me]
    body:
      - The victors of the First Balkan War fell out over Macedonia. Serbia, denied a port in Albania, wanted to keep the central Macedonian lands its army held, which the 1912 treaty had promised to Bulgaria, and on 1 June 1913 it signed a secret alliance with Greece. Bulgaria, confident in its army, would not wait for Russian arbitration. On the night of 29–30 June, without a declaration of war, Bulgarian troops attacked Serbian positions on the Bregalnica river and Greek positions east of Thessaloniki. The Serbs held, and in a week of fighting along the Bregalnica drove the Bulgarians back.
      - In Thessaloniki, Greek troops overwhelmed the small Bulgarian garrison on 30 June and 1 July. The Greek army under King Constantine, who had come to the throne after his father’s assassination in March, attacked at Kilkis and Lachanas on 2–4 July and won after heavy losses on both sides. It pushed north past Lake Doiran and up the Struma valley. As they retreated, Bulgarian troops burned much of Serres, while Kilkis was burned by the Greeks, and civilians of every community were killed or driven from their homes.
    facts:
      - [Bulgarian attack, "night of 29–30 June 1913"]
      - [Battle of Bregalnica, "30 June – 8 July 1913, Serbian victory"]
      - [Battle of Kilkis–Lachanas, "2–4 July 1913, Greek victory"]
