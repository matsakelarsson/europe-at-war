  - title: Romania and the Ottomans join in
    date: July 1913
    when: "1913-07-10"
    borders: "1913-07-31"
    countries: [ro, bg, tr]
    body:
      - Romania had stayed out of the first war but claimed Southern Dobruja in return for Bulgaria’s gains. On 10 July it declared war, and its army occupied Southern Dobruja without a fight. On the night of 14–15 July Romanian troops crossed the Danube into northern Bulgaria and marched on Sofia almost unopposed, since the Bulgarian army was fighting in the south and west. Their cavalry reached Vrazhdebna, on the edge of the capital. Cholera, rather than the Bulgarians, caused most of the Romanian army’s losses.
      - The Ottoman Empire seized its chance. On 12 July its army crossed the Enos–Midia line and reoccupied Eastern Thrace, which had few Bulgarian troops left, and on 23 July Enver Bey rode into Adrianople unopposed, calling himself its second conqueror. Reprisals by Ottoman troops and irregulars drove most of the Bulgarians of Eastern Thrace from their homes. With enemies on every side, Bulgaria’s government resigned, and the new prime minister, Vasil Radoslavov, sought an armistice.
    facts:
      - [Romania declares war, "10 July 1913"]
      - [Romanians cross the Danube, "14–15 July 1913"]
      - [Adrianople retaken, "23 July 1913"]
