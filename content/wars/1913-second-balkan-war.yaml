  - title: Kresna and the Treaty of Bucharest
    date: July – September 1913
    when: "1913-07-21"
    borders: "1913-08-10"
    countries: [bg, gr, rs, ro, tr, mk]
    body:
      - The Greek army, advancing up the Struma valley into Bulgaria itself, was counter-attacked from both flanks in the Kresna Gorge from 21 July and came close to being surrounded, while the Serbs were held at Kalimanci on the Bregalnica. Both sides were exhausted, and King Constantine, who had planned to march on Sofia, accepted an armistice that came into force on 31 July. A peace conference met in Bucharest, where the Romanian prime minister, Titu Maiorescu, presided over the division of the spoils.
      - By the Treaty of Bucharest of 10 August Romania took Southern Dobruja. Serbia kept northern and central Macedonia, Greece the south with Thessaloniki and Kavala, and Bulgaria only the Pirin region, the Strumica valley and Western Thrace with an outlet to the Aegean at Dedeagach. In the Treaty of Constantinople of 29 September Bulgaria gave Adrianople and most of Eastern Thrace back to the Ottomans. Bulgarians called the outcome their first national catastrophe, and the quarrel over Macedonia helped draw Bulgaria into the First World War on the side of the Central Powers.
    facts:
      - [Battle of Kresna Gorge, "21–31 July 1913, inconclusive"]
      - [Armistice, "31 July 1913"]
      - [Treaty of Bucharest, "10 August 1913"]
    markers:
      - kind: battle
        name: Battle of Kresna Gorge
        date: 21–31 July 1913
        text: Bulgarian forces attacked the Greek army in the narrow Struma valley; the armistice ended the fighting before either side could claim a decisive result.
        lonlat: [23.16, 41.77]
      - kind: battle
        side: bg
        name: Kalimanci
        date: 17–24 July 1913
        text: Bulgarian troops held off repeated Serbian and Montenegrin attacks around the village on the upper Bregalnica, stopping the Serbian offensive.
        lonlat: [22.99, 41.98]
      - kind: treaty
        name: Treaty of Bucharest
        date: 10 August 1913
        text: Signed by Bulgaria, Romania, Serbia, Greece and Montenegro; the Ottomans were not admitted and made peace separately.
        lonlat: [26.1, 44.43]
      - kind: treaty
        name: Treaty of Constantinople
        date: 29 September 1913
        text: Bulgaria accepted the loss of Adrianople, Kirk Kilisse and most of the land it had won in Eastern Thrace.
        lonlat: [28.976, 41.009]
