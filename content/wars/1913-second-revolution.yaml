id: second-revolution
name: Second Revolution
start: "1913-07-12"
end: "1913-09-12"
tier: C
summary: "A short civil war in 1913 in which southern governors loyal to the Kuomintang rose against President Yuan Shikai. The Kuomintang had won the first parliamentary elections of the Republic in early 1913, and its leader Song Jiaoren, who was expected to become premier, was shot at Shanghai railway station on 20 March and died two days later; many suspected Yuan, though it was never proven. Yuan then took a large Reorganisation Loan from a consortium of foreign banks without the consent of parliament and dismissed the Kuomintang governors of Jiangxi, Guangdong and Anhui. On 12 July 1913 Li Liejun declared Jiangxi independent at Hukou, and Huang Xing in Nanjing, Anhui, Guangdong, Fujian, Shanghai, Hunan and Chongqing followed. The rising had little popular support and its armies were badly coordinated. The Beiyang army beat the rebels near Xuzhou on 22 July and repulsed attacks on the Jiangnan Arsenal in Shanghai in late July; Long Jiguang took Guangzhou on 13 August and Beiyang troops took Nanchang on 18 August. Zhang Xun’s troops stormed Nanjing on 1 September and plundered the city, and the revolt ended when Tang Jiyao’s Yunnan troops entered Chongqing on 12 September. Sun Yat-sen and Huang Xing fled to Japan. Yuan had himself elected president in October, banned the Kuomintang in November and dissolved parliament in January 1914."
