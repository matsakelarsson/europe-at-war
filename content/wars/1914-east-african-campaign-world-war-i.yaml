steps:
  - title: The war comes to East Africa
    date: August – September 1914
    when: "1914-09-20"
    borders: "1914-09-30"
    countries: [tz, ke]
    body:
      - "When war broke out in Europe, the governor of German East Africa, Heinrich Schnee, hoped to keep the colony out of it, and some British officials in Kenya felt the same. On 8 August 1914 the British cruiser Astraea shelled the wireless station at Dar es Salaam. The new commander of the Schutztruppe, Lieutenant-Colonel Paul von Lettow-Vorbeck, meant to fight: if he could draw British troops to East Africa, they would not be on the Western Front. His force had 260 Germans and about 2,470 askari in fourteen field companies, with settler reservists, and it began recruiting at once."
      - "On 15 August two companies seized the border town of Taveta, at the foot of Kilimanjaro, and German patrols began raiding the Uganda Railway, the British line from Mombasa to Lake Victoria. At sea the cruiser Königsberg, which had slipped out of Dar es Salaam before the war, surprised the British cruiser Pegasus in Zanzibar harbour on 20 September and sank it, then took refuge in the channels of the Rufiji delta."
    facts:
      - [Dar es Salaam wireless station shelled, "8 August 1914"]
      - [Taveta taken, "15 August 1914"]
      - [Pegasus sunk at Zanzibar, "20 September 1914"]
    markers:
      - kind: naval
        side: gb
