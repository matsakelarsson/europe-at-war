  - title: Into Mozambique
    date: November 1917 – September 1918
    when: "1918-07-03"
    borders: "1918-09-28"
    countries: [mz, tz]
    body:
      - "Portugal had been at war with Germany since March 1916 but its troops in northern Mozambique were few, badly supplied and spread thin. On 25 November 1917 Lettow-Vorbeck’s advance guard crossed the Rovuma and stormed the Portuguese post at Negomano, held by about 900 men under João Teixeira Pinto, who was killed. The Germans captured some 250,000 rounds of ammunition, six machine guns, hundreds of rifles, food and Portuguese uniforms. For the next ten months his force of some 2,000 Germans and askari, with carriers and camp followers, lived off the Portuguese posts and the villages of northern Mozambique, while British columns tried to corner it."
      - "In 1918 the Germans marched south almost to the Zambezi. In early July they attacked the Portuguese and British garrison at Nhamacurra, a sugar estate and railway station near Quelimane, and after three days captured it with large stocks of supplies; many of the defenders drowned trying to escape across a river. Then Lettow-Vorbeck turned north again, fought off British columns at Lioma and the Pere hills, and on 28 September 1918 crossed back into German East Africa. The population of northern Mozambique, already hit by Portuguese forced labour and recruiting, suffered heavily from the requisitions and fighting of both sides."
    facts:
      - [Negomano taken, "25 November 1917"]
      - [Nhamacurra taken, "early July 1918"]
      - [Back across the Rovuma, "28 September 1918"]
    markers:
      - kind: taken
        side: de
        name: Negomano
        date: 25 November 1917
        text: The Germans stormed the Portuguese post at the meeting of the Rovuma and the Lugenda, capturing arms, ammunition and food.
        lonlat: [38.49, -11.43]
      - kind: taken
        side: de
        name: Nhamacurra
        date: early July 1918
        text: The Germans captured the Portuguese and British garrison and its supplies after three days of fighting.
        lonlat: [37.02, -17.49]
      - kind: held
        side: pt
        name: Quelimane
        date: "1918"
        text: The Portuguese port nearest to the southernmost point of the German march.
        lonlat: [36.89, -17.88]
        lp: r
    arrows:
      - side: de
