  - title: Königsberg and the lakes
    date: 1915 – February 1916
    when: "1915-07-11"
    borders: "1916-02-09"
    countries: [tz, cd, ug]
    body:
      - "For more than a year the fighting on land was limited to raids and small actions on the Kenyan border and around the lakes. The Königsberg, trapped in the Rufiji delta, held down a British squadron until two shallow-draught monitors, Severn and Mersey, were brought out from Britain and, guided by spotter aircraft, wrecked it on 11 July 1915. Its crew and guns went ashore and joined the war on land."
      - "On Lake Victoria British steamers had the upper hand, and in June 1915 a British force raided the German port of Bukoba. On Lake Tanganyika the Germans ruled the water with armed steamers until the Royal Navy sent two motor boats, Mimi and Toutou, overland from the Cape by rail, road and river. From the Belgian base at Lukuga (Albertville) they captured the German Kingani on 26 December 1915 and sank the Hedwig von Wissmann on 9 February 1916."
    facts:
      - [Königsberg destroyed, "11 July 1915"]
      - [Kingani captured, "26 December 1915"]
      - [Hedwig von Wissmann sunk, "9 February 1916"]
    markers:
      - kind: naval
        side: gb
        name: Rufiji delta
        date: 11 July 1915
        text: The British monitors Severn and Mersey destroyed the Königsberg. Its guns were taken ashore for the war on land.
        lonlat: [39.27, -7.83]
      - kind: event
        side: gb
        name: Bukoba
        date: June 1915
        text: A British force crossing Lake Victoria raided the German port.
        lonlat: [31.81, -1.33]
      - kind: naval
        side: gb
        name: Lake Tanganyika
        date: December 1915 – February 1916
        text: The British motor boats Mimi and Toutou, operating from Lukuga (Albertville), captured the Kingani and sank the Hedwig von Wissmann.
        lonlat: [29.6, -6.0]
  - title: Smuts’s offensive
    date: February – May 1916
    when: "1916-03-13"
    borders: "1916-05-31"
    countries: [tz, ke, rw]
    body:
      - "Early in 1916 the general chosen to command the British forces, Horace Smith-Dorrien, fell ill, and the South African general and politician Jan Smuts was appointed in his place, bringing large South African reinforcements. Before he took command, an attack by newly arrived South African troops on the German positions at Salaita Hill, near Taveta, failed on 12 February. Smuts then outflanked the Germans around Kilimanjaro: after hard fighting at Latema Nek on 11–12 March, the Germans fell back, and Moshi and the northern railway fell to his troops on 13 March. Lettow-Vorbeck withdrew south towards the Pare and Usambara mountains, avoiding the decisive battle Smuts sought."
      - "Smuts sent Jacob van Deventer’s mounted brigade south-west across the Masai steppe to cut the central railway. Van Deventer took Kondoa Irangi on 19 April, but the rains came, horses died of tsetse-borne disease by the thousand, and on 7–10 May Lettow-Vorbeck, who had moved some 4,000 men by the central railway, attacked the town. The South Africans held on. In the west, Belgian troops of the Force Publique under General Charles Tombeur crossed from the Congo; they took Kigali on 6 May 1916 and had occupied Rwanda and Burundi by mid-June."
    facts:
      - [Repulse at Salaita Hill, "12 February 1916"]
      - [Moshi taken, "13 March 1916"]
      - [Kigali taken by the Belgians, "6 May 1916"]
