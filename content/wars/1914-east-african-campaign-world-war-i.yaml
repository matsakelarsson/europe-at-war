  - title: Tanga
    date: 2–5 November 1914
    when: "1914-11-04"
    borders: "1914-11-05"
    countries: [tz, ke]
    body:
      - "Britain sent an expeditionary force from India to seize the port of Tanga, the terminus of the German northern railway. Some 8,000 men under Major-General Arthur Aitken, most of them inexperienced Indian troops, began landing near the town on 2–3 November 1914, giving the Germans time to bring reinforcements down the railway. Lettow-Vorbeck gathered about 1,000 men. On 4 November the British attacked through plantations and bush; the German askari counter-attacked, several Indian units broke, and swarms of angry bees disturbed by the fighting attacked both sides. On 5 November the British re-embarked, leaving behind rifles, machine guns and some 600,000 rounds of ammunition."
      - "British losses were 360 killed, 487 wounded and 148 missing; the Germans lost 16 Germans and 55 askari killed, among them Captain Tom von Prince, and 76 wounded. At the same time a second British force failed to take Longido, north-west of Kilimanjaro. Tanga made Lettow-Vorbeck’s name, armed his growing army, and persuaded the British to stand on the defensive until they could assemble a much larger force."
    facts:
      - [British force, "about 8,000"]
      - [German force, "about 1,000"]
      - [Losses, "British 360 killed, 487 wounded, 148 missing; German 71 killed, 76 wounded"]
    markers:
      - kind: battle
        side: de
        name: Tanga
        date: 3–5 November 1914
        text: The German askari threw back a British landing several times their number. The British re-embarked, leaving their arms behind.
        lonlat: [39.10, -5.07]
      - kind: battle
        side: de
        name: Longido
        date: 3 November 1914
        text: A British attack from Kenya on the German post failed.
        lonlat: [36.68, -2.73]
    arrows:
