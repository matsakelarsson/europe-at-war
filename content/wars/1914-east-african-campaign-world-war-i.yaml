notes:
  - "German East Africa remains German on the base map until the Treaty of Versailles came into force on 10 January 1920; the areas taken by British and Belgian forces during the war are shown as occupied."
  - "Lettow-Vorbeck was celebrated in Germany after the war as the commander who was never defeated, and the legend was used by the Nazi regime. Historians such as Hew Strachan and Edward Paice have stressed the cost of his strategy to the people of East Africa, whose food, cattle and men both sides requisitioned."
  - "Casualty figures are uncertain, especially for carriers and civilians. Figures cited include 11,189 dead for British Empire soldiers and about 95,000 for its carriers, 2,620 Belgian soldiers and 15,650 carriers, 5,533 Portuguese soldiers, and about 2,000–2,500 dead on the German side (734 Europeans and 1,798 Africans by one count); estimates of civilian deaths from war-related famine and disease in the region run from about 300,000 to more than 350,000."
