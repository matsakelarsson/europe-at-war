  - title: Mahiwa
    date: 1917
    when: "1917-10-17"
    borders: "1917-11-28"
    countries: [tz]
    body:
      - "Smuts left for London in January 1917, claiming the campaign was all but over; it went on for almost two more years. His successors, Arthur Hoskins and from May 1917 Jacob van Deventer, pressed the Germans into the south-east of the colony. Their armies depended on tens of thousands of African carriers, recruited and often conscripted in Kenya, Uganda, Nyasaland and the occupied territory, who died in great numbers of disease, overwork and hunger. Both sides took the food of the country, and after the rains failed in 1917 famine spread through German East Africa."
      - "In October 1917 the Germans, under Lettow-Vorbeck and General Wahle, held a position near Mahiwa, west of Lindi. From 15 to 18 October British, Indian, African and Nigerian troops attacked it head-on and lost about 2,700 men, killed and wounded; the Germans lost about 500–600, a loss they could not replace. Belgian columns took Mahenge in October, and a German detachment under Theodor Tafel, cut off and starving, surrendered at the end of November. Lettow-Vorbeck chose to leave the colony with his fittest men rather than give up."
    facts:
      - [Battle of Mahiwa, "15–18 October 1917"]
      - [Losses at Mahiwa, "British about 2,700; German about 500–600"]
      - [Tafel’s detachment surrenders, "end of November 1917"]
