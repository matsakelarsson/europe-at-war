  - title: Northern Rhodesia and the surrender
    date: September – November 1918
    when: "1918-11-25"
    borders: "1918-11-25"
    countries: [tz, zm]
    body:
      - "Lettow-Vorbeck marched north-west through the south of German East Africa, then turned west round the north end of Lake Nyasa and in early November crossed into Northern Rhodesia, where the British had few troops. His men occupied Kasama, which the British had evacuated, and on 12 November captured a rubber factory on the Chambeshi river after a four-hour fight. On 14 November a British messenger brought word of the armistice that had been signed in Europe on 11 November. Lettow-Vorbeck agreed to a ceasefire, and on 25 November 1918 he surrendered at Abercorn to Brigadier-General William Edwards with 30 German officers, 125 other German ranks, 1,168 askari and about 3,500 carriers and camp followers."
      - "The campaign had cost East Africa dearly. About 11,000 soldiers of the British Empire died, more of disease than in battle, and some 95,000 of its African carriers; the Belgians lost about 2,600 soldiers and 15,650 carriers, the Portuguese about 5,500 soldiers, and the Schutztruppe about 2,000–2,500. Famine and disease caused by the war killed many more civilians: estimates for German East Africa alone run to about 300,000, and the influenza of 1918 followed. Under the Treaty of Versailles Germany gave up its colony. Most of it became the British mandate of Tanganyika, Rwanda and Burundi the Belgian mandate of Ruanda-Urundi, and the Kionga triangle south of the Rovuma went to Portugal."
    facts:
      - [Armistice news reaches the Germans, "14 November 1918"]
      - [Surrender at Abercorn, "25 November 1918"]
      - [Carriers of the British Empire who died, "about 95,000"]
    markers:
      - kind: taken
        side: de
        name: Kasama
        date: November 1918
        text: Occupied by the Germans after the British evacuated it. Nearby, at the Chambeshi river, Lettow-Vorbeck learned of the armistice on 14 November.
        lonlat: [31.18, -10.21]
      - kind: treaty
        name: Abercorn (Mbala)
        date: 25 November 1918
        text: Lettow-Vorbeck surrendered here with 155 Germans, 1,168 askari and about 3,500 carriers and camp followers.
        lonlat: [31.37, -8.84]
      - kind: toll
        name: German East Africa
        date: 1914–1918
        text: "Estimates of civilian deaths from war-related famine and disease in German East Africa run to about 300,000."
        lonlat: [34.5, -6.5]
    arrows:
      - side: de
        label: Lettow-Vorbeck, September – November 1918
        via: [[37.9, -11.2], [36.0, -10.4], [34.9, -9.5], [33.5, -9.3], [32.3, -9.6], [31.25, -10.15]]
      - side: de
        via: [[31.2, -10.1], [31.3, -9.4], [31.36, -8.9]]
