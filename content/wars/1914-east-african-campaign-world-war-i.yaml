        date: 15 August 1914
        text: Two German askari companies seized the border town, from which patrols raided the Uganda Railway.
        lonlat: [37.68, -3.40]
      - kind: naval
        side: de
        name: Zanzibar
        date: 20 September 1914
        text: The German cruiser Königsberg sank the British cruiser Pegasus in the harbour.
        lonlat: [39.19, -6.16]
        lp: r
