  - title: The railways fall
    date: May – September 1916
    when: "1916-09-04"
    borders: "1916-09-19"
    countries: [tz, rw, bi, mw, zm]
    body:
      - "In May Smuts’s main force advanced down the Pangani valley along the northern railway, then turned south through Handeni towards the central railway, the line from Dar es Salaam to Lake Tanganyika. Lettow-Vorbeck fought rearguard actions and withdrew each time Smuts tried to encircle him. Smuts took Morogoro on 26 August 1916, and Dar es Salaam surrendered to the Royal Navy on 4 September. British forces landed at the other ports, among them Kilwa and Lindi. The Germans fell back into the Uluguru mountains and then south to the Rufiji."
      - "From the west the Belgians advanced in two brigades: one took Kigoma on Lake Tanganyika on 28 July, the other reached Lake Victoria near Mwanza. Both converged on Tabora, the colony’s inland capital, which surrendered to them on 19 September after more than a week of fighting with the German western force under Major-General Kurt Wahle. A smaller British force under Charles Crewe, advancing from Lake Victoria, arrived too late. From the south a British column under Edward Northey advanced from Nyasaland and Northern Rhodesia and reached Iringa in August. Smuts’s troops, decimated by malaria and dysentery, were exhausted; from late 1916 most South African, Indian and Rhodesian units were sent home and replaced by African soldiers of the King’s African Rifles and the Nigerian and Gold Coast regiments."
    facts:
      - [Morogoro taken, "26 August 1916"]
      - [Dar es Salaam surrenders, "4 September 1916"]
      - [Tabora taken by the Belgians, "19 September 1916"]
