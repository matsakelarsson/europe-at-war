id: east-african-campaign-world-war-i
name: East African campaign (First World War)
start: "1914-08-08"
end: "1918-11-25"
tier: A
summary: "The First World War in East Africa, fought for four years over German East Africa (mainland Tanzania, Rwanda and Burundi) and the neighbouring British, Belgian and Portuguese colonies. The German commander, Paul von Lettow-Vorbeck, set out to tie down as many Allied troops as he could. His Schutztruppe, mostly African soldiers (askari), threw back a British landing at Tanga in November 1914. In 1916 the South African general Jan Smuts invaded from Kenya, while Belgian troops from the Congo took Rwanda, Burundi and Tabora and British forces came in from Nyasaland and Northern Rhodesia; by the end of the year the Allies held the north and centre of the colony and its railways. Lettow-Vorbeck withdrew south, fought a costly battle at Mahiwa in October 1917, and in November crossed the Rovuma into Portuguese Mozambique. He marched through Mozambique for ten months, came back through German East Africa into Northern Rhodesia and surrendered at Abercorn on 25 November 1918, two weeks after the armistice in Europe. The war was fought largely by Africans and borne by them: about 11,000 British Empire soldiers and some 95,000 of its African carriers died, and famine and disease caused by the war killed hundreds of thousands of civilians."
countries: [tz, ke, mz, zm, mw, rw, bi, ug, cd, de, gb, za, in, be, pt]
sides:
  - id: de
    name: German East Africa (Schutztruppe)
