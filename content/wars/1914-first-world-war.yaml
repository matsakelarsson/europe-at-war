  - title: Mesopotamia, the Arab Revolt and Palestine
    date: December 1915 – October 1918
    when: "1915-12-07"
    borders: "1918-10-01"
    countries: [iq, sa, jo, il, ps, lb, sy, eg, tr, gb]
    side_names:
      entente: British, Indian and Arab success
      central: Ottoman success
    move_names:
      entente: British, Commonwealth and Arab moves
      central: Ottoman moves
    body:
      - An Anglo-Indian force had landed at the head of the Persian Gulf in November 1914 to protect Britain’s oil supplies and taken Basra. In 1915 General Charles Townshend’s division advanced up the Tigris towards Baghdad, but after a costly battle at Ctesiphon in November it fell back to Kut, where Ottoman forces besieged it from 7 December. Relief attempts failed, and on 29 April 1916 Townshend surrendered with about 13,000 British and Indian soldiers, many of whom died of heat, disease and neglect on the march into captivity and in the camps. A larger and better supplied army under General Stanley Maude advanced again in December 1916, retook Kut and entered Baghdad on 11 March 1917.
      - In June 1916 Sharif Hussein of Mecca, promised British support for Arab independence, rose against Ottoman rule in the Hejaz. With British advisers such as T. E. Lawrence, the Arab forces of his son Faisal raided the Hejaz railway and took Aqaba in July 1917. Further west the British had beaten off an Ottoman attack on the Suez Canal in 1915 and crossed Sinai, but failed twice at Gaza in 1917. Under General Edmund Allenby they broke the Gaza–Beersheba line from 31 October, and on 9 December Jerusalem surrendered. Meanwhile Britain and France had secretly agreed, in the Sykes–Picot agreement of 1916, to divide the Arab lands between them, and the Balfour Declaration of November 1917 promised British support for a Jewish national home in Palestine.
      - On 19 September 1918, at Megiddo, Allenby’s infantry broke through on the coastal plain and his cavalry swept round behind the Ottoman armies, which collapsed. Australian and Arab troops entered Damascus on 1 October, and Aleppo fell later that month. War, blockade, requisitions and locusts also brought famine to Syria and Lebanon, where by some estimates about 200,000 people died of hunger and disease in Mount Lebanon alone.
    facts:
      - [Surrender at Kut, "29 April 1916, about 13,000 prisoners"]
      - [Jerusalem surrenders, "9 December 1917"]
      - [Damascus taken, "1 October 1918"]
