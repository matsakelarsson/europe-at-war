        via: [[21.9, 54.5], [21.2, 54.0], [20.75, 53.75]]
  - title: Galicia and Przemyśl
    date: August 1914 – March 1915
    when: "1914-08-23"
    borders: "1915-03-22"
    countries: [ua, pl, ru, at, de]
    side_names:
      entente: Russian success
      central: German and Austro-Hungarian success
    move_names:
      entente: Russian moves
      central: German and Austro-Hungarian moves
    body:
      - In Galicia the Austro-Hungarian army attacked into Russian Poland and won early battles at Kraśnik and Komarów, but the Russians broke its eastern wing and took Lemberg on 3 September 1914. Austria-Hungary lost perhaps 400,000 men killed, wounded or captured in the first weeks and fell back to the Carpathians, leaving the fortress of Przemyśl besieged. In the autumn German and Austro-Hungarian offensives towards Warsaw and around Łódź were held, and the front in Poland settled along the Bzura and the Rawka.
      - Through the winter the Austro-Hungarians tried to relieve Przemyśl by attacking over the Carpathian passes in snow and ice, and lost hundreds of thousands of men. On 22 March 1915 the starving garrison destroyed its guns and surrendered, and some 120,000 men went into captivity. In occupied Galicia the Russian authorities treated the land as a future part of Russia, pressed the Greek Catholic church and deported many Jews and Ukrainian activists; Jews also suffered pogroms by Russian troops.
    facts:
      - [Lemberg taken by Russia, "3 September 1914"]
      - [Siege of Przemyśl, "September 1914 – 22 March 1915"]
      - [Garrison of Przemyśl, "about 120,000 captured"]
    markers:
      - kind: battle
        side: central
        name: Battle of Kraśnik
        date: 23–25 August 1914
        text: The Austro-Hungarian First Army defeated a Russian army advancing on its flank.
        lonlat: [22.217, 50.933]
        lp: l
      - kind: battle
        side: central
        name: Battle of Komarów
        date: 26 August – 2 September 1914
        text: An Austro-Hungarian victory that nearly encircled the Russian Fifth Army, soon undone by defeats further east.
        lonlat: [23.5, 50.63]
      - kind: taken
        side: entente
