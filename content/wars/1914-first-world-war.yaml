  - title: The German spring offensives
    date: March – July 1918
    when: "1918-03-21"
    borders: "1918-07-17"
    countries: [fr, be, gb, de, us]
    side_names:
      entente: Allied success
      central: German success
    move_names:
      central: German moves
    body:
      - Peace in the east let Germany bring dozens of divisions west, and Erich Ludendorff resolved to win before the Americans arrived in strength. On 21 March 1918 Operation Michael struck the British Fifth and Third Armies near Saint-Quentin after a five-hour bombardment by some 6,600 guns. Storm troops slipped through the fog-bound defences, and within two weeks the Germans had advanced up to 60 kilometres, the largest gains in the west since 1914. The Allies named Ferdinand Foch to coordinate their armies, and the advance was stopped before Amiens in early April.
      - Further attacks followed on the Lys in Flanders in April, when Haig ordered his men to fight on “with our backs to the wall”, on the Chemin des Dames on 27 May, where the Germans broke through and reached the Marne at Château-Thierry, and on the Matz in June. American troops, arriving by the summer at some 10,000 a day, fought at Cantigny and Belleau Wood. Each offensive won ground but cost the Germans their best troops, and left them holding long, exposed salients. A last attack on both sides of Reims on 15 July crossed the Marne but was stopped within three days.
    facts:
      - [Operation Michael, "21 March – 5 April 1918"]
      - [Germans reach the Marne, "end of May 1918"]
      - [Last German offensive, "15–17 July 1918, near Reims"]
