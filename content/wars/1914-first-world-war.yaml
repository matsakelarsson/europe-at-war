  - title: The Treaty of Brest-Litovsk
    date: December 1917 – March 1918
    when: "1917-12-22"
    borders: "1918-03-03"
    countries: [pl, lt, lv, ee, by, ua, fi, tr, ge, am, ru, de, at]
    side_names:
      central: Central Powers’ success
    body:
      - Peace talks opened at Brest-Litovsk in December 1917. The Central Powers demanded that Russia give up the lands they occupied, and in February 1918 they signed a separate peace with the Ukrainian People’s Republic. When Leon Trotsky broke off the talks without accepting their terms, German and Austro-Hungarian troops advanced from 18 February almost unopposed, taking Dvinsk, Minsk, Pskov and Tallinn and entering Kyiv on 1 March.
      - Lenin insisted on accepting the even harsher terms that followed. By the treaty signed on 3 March 1918, Soviet Russia gave up Poland, Lithuania, Courland and Riga, agreed to leave Livonia and Estonia, recognised the independence of Finland and Ukraine, and ceded Kars, Ardahan and Batumi to the Ottoman Empire, whose troops took them in April. The lost lands held about a third of the empire’s population. Germany’s defeat in November 1918 brought the annulment of the treaty, but the new states it had helped to create remained.
    facts:
      - [Armistice on the Eastern Front, "15 December 1917"]
      - [Treaty of Brest-Litovsk, "3 March 1918"]
      - [Share of the empire’s population lost, "about a third"]
    markers:
      - kind: treaty
