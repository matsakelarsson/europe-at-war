  - title: Romania, 1916–1918
    date: August 1916 – May 1918
    when: "1916-08-27"
    borders: "1918-05-07"
    countries: [ro, bg, de, at, hu, ru, md]
    side_names:
      entente: Romanian and Russian success
      central: Central Powers’ success
    move_names:
      entente: Romanian moves
      central: German, Austro-Hungarian, Bulgarian and Ottoman moves
    body:
      - Romania stayed neutral in 1914. Encouraged by the Brusilov offensive and promised Transylvania, Bukovina and the Banat by the Entente, it declared war on Austria-Hungary on 27 August 1916 and sent its armies over the Carpathians into Transylvania. The Central Powers answered quickly. Field Marshal August von Mackensen’s German, Bulgarian and Ottoman army invaded Dobruja from the south and stormed the Danube fortress of Turtucaia on 6 September, while Erich von Falkenhayn’s Ninth Army drove the Romanians out of Transylvania at Sibiu and Brașov. In November Falkenhayn forced the mountain passes and Mackensen crossed the Danube at Svishtov, and on 6 December, after a battle on the Argeș, they entered Bucharest.
      - The king, the government and the remains of the army withdrew to Moldavia, where typhus and hunger killed many soldiers and refugees that winter, and with Russian help held a front along the Carpathians and the Siret. Rebuilt with French help, the army won at Mărăști in July 1917 and in August stopped Mackensen’s offensive at Mărășești. But Russia’s collapse left Romania alone, and it signed an armistice at Focșani on 9 December 1917. In April 1918 Bessarabia’s assembly voted to join Romania, and on 7 May Romania accepted the Treaty of Bucharest, which gave Dobruja to Bulgaria and the Central Powers, the mountain passes to Austria-Hungary and its oil to Germany on a 90-year lease. King Ferdinand refused to sign it, and Romania re-entered the war on 10 November 1918.
    facts:
      - [Romania declares war, "27 August 1916"]
      - [Bucharest taken, "6 December 1916"]
      - [Treaty of Bucharest, "7 May 1918, never in force"]
