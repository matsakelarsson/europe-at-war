  - title: Gorlice–Tarnów and the Great Retreat
    date: May – September 1915
    when: "1915-05-02"
    borders: "1915-09-19"
    countries: [pl, ua, lt, lv, by, ru, de, at]
    side_names:
      entente: Russian success
      central: German and Austro-Hungarian success
    move_names:
      entente: Russian moves
      central: German and Austro-Hungarian moves
    body:
      - On 2 May 1915 a German and Austro-Hungarian army under General August von Mackensen broke through the Russian front between Gorlice and Tarnów after a heavy bombardment. The Russian armies, short of shells and rifles, fell back across Galicia. Przemyśl was retaken on 3 June and Lemberg on 22 June. In July the Central Powers attacked Russian Poland from the north and south, and the Russian command ordered a withdrawal.
      - Warsaw fell on 5 August, followed by the fortresses of Kovno, Novogeorgievsk and Brest-Litovsk. Vilna was lost in September, when the front settled from the Gulf of Riga to the Romanian border. By some estimates Russia lost about two million men killed, wounded or captured in 1915, and Nicholas II took over as commander-in-chief. Retreating Russian troops burned villages and forced people east, and the army deported hundreds of thousands of Jews and ethnic Germans. Some estimates put the number of refugees in Russia at over three million by the end of 1915.
    facts:
