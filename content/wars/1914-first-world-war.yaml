  - title: "Serbia, 1914: Cer and the Kolubara"
    date: August – December 1914
    when: "1914-08-12"
    borders: "1914-12-15"
    countries: [rs, ba, me, at, hu]
    side_names:
      entente: Serbian success
      central: Austro-Hungarian success
    move_names:
      entente: Serbian moves
      central: Austro-Hungarian moves
    body:
      - Austria-Hungary declared war on Serbia on 28 July 1914, a month after the assassination of Archduke Franz Ferdinand in Sarajevo, and its river monitors shelled Belgrade from the Danube. On 12 August General Oskar Potiorek’s armies crossed the Drina and the Sava into north-western Serbia, expecting a short punitive campaign. Marshal Radomir Putnik’s Serbian army, hardened by the Balkan Wars, met them around Mount Cer and in a week of fighting drove them back across the rivers by 24 August, the first Allied victory of the war. In the towns and villages of the Mačva, among them Šabac, Austro-Hungarian troops shot and hanged many civilians as alleged guerrillas.
      - A second invasion in September won a foothold across the Drina after weeks of bloody fighting. A third, in November, pushed the exhausted Serbs, short of shells, back beyond the Kolubara, and on 2 December Austro-Hungarian troops entered Belgrade. The next day General Živojin Mišić’s First Army, with fresh ammunition, counter-attacked from the Suvobor heights. Within two weeks the Serbs had routed the invaders and retaken Belgrade on 15 December. The campaign cost Austria-Hungary some 270,000 men killed, wounded, captured or sick, and Serbia about 165,000. In the winter a typhus epidemic swept the country and killed tens of thousands of soldiers, civilians and prisoners.
    facts:
      - [Battle of Cer, "15–24 August 1914, Serbian victory"]
      - [Battle of the Kolubara, "16 November – 15 December 1914, Serbian victory"]
      - [Belgrade, "taken 2 December, retaken 15 December 1914"]
    markers:
      - kind: battle
        side: entente
        name: Battle of Cer
        date: 15–24 August 1914
        text: General Stepa Stepanović’s Second Army fought its way up the mountain in night attacks and drove the Austro-Hungarian Fifth Army back across the Drina.
        lonlat: [19.528, 44.554]
      - kind: event
        name: Šabac
        date: August 1914
        text: Austro-Hungarian troops occupied the town on the Sava and killed many of its people and those of the villages around it.
        lonlat: [19.694, 44.756]
      - kind: battle
        name: Battle of the Drina
        date: September – October 1914
        text: The second Austro-Hungarian invasion gained a narrow bridgehead in the hills above the river at a heavy cost to both sides.
        lonlat: [19.32, 44.29]
        lp: l
      - kind: battle
        side: entente
        name: Battle of the Kolubara
        date: 16 November – 15 December 1914
        text: Mišić’s First Army struck from the Suvobor heights on 3 December and broke the Austro-Hungarian centre.
        lonlat: [20.263, 44.382]
      - kind: taken
        side: entente
        name: Belgrade
        date: 15 December 1914
        text: The Serbs re-entered their capital, which Austro-Hungarian troops had occupied on 2 December.
        lonlat: [20.457, 44.817]
