notes:
  - "The steps follow all the main fronts in date order: the Western Front and the war at sea, the Eastern and Caucasus fronts, Serbia and Salonika, Gallipoli, Italy, Romania, and Mesopotamia and Palestine. Each step is tagged with the countries it involves, so a country view shows only its own fronts."
  - Dates are New Style (Gregorian). Russia used the Julian calendar, 13 days behind, until February 1918, so its revolutions of 1917 are named after February and October although they took place in March and November by the Western calendar. Serbia, Montenegro, Romania and Greece also used the Julian calendar throughout the war, and Bulgaria until 1916; the Ottoman Empire used its own Rumi calendar.
  - Numbers of dead, prisoners and refugees are estimates and vary widely between sources. Most genocide scholars and many states recognise the killing of the Armenians in 1915–1916 as genocide; the Turkish government rejects the term.
  - On the Western Front, places in Flanders are named in the forms used in most English accounts of the war, such as Ypres (Ieper), Passchendaele (Passendale) and Messines (Mesen).
  - "In the south and east, places are named as in most English accounts, with today’s names where they differ: Salonika is Thessaloniki, Monastir is Bitola, Caporetto is Kobarid, Turtucaia is Tutrakan and Constantinople is Istanbul."
  - The base map shows the borders recognised at the time. Occupied territory and the front lines are drawn as approximate areas from general accounts.
