  - title: "1918: Dobro Pole, Vittorio Veneto and the armistices"
    date: September – November 1918
    when: "1918-09-15"
    borders: "1918-11-04"
    countries: [mk, gr, bg, rs, al, it, at, hu, tr, fr, gb]
    side_names:
      entente: Entente success
      central: Central Powers’ success
    move_names:
      entente: Entente moves
      central: Central Powers’ moves
    body:
      - On the Salonika front a mixed Allied army of French, British, Serbian, Italian and, since Greece entered the war in June 1917, Greek troops had faced the Bulgarians and Germans across the mountains of Macedonia since 1916. On 15 September 1918 General Louis Franchet d’Espèrey attacked. Serbian, French and Greek troops broke the Bulgarian line on the mountain ridge of Dobro Pole, while a British and Greek attack at Lake Doiran failed with heavy losses. The breach widened, Bulgarian units mutinied, and French cavalry entered Skopje on 29 September. That day Bulgaria signed an armistice in Salonika, the first of the Central Powers to leave the war. The Serbian army pressed north and re-entered Belgrade on 1 November.
      - With Bulgaria out, the way to Constantinople lay open. The Ottoman Empire, also beaten in Syria and Mesopotamia, signed an armistice aboard the British battleship Agamemnon at Mudros on 30 October, and Allied fleets passed the Dardanelles in November. On the Piave the Italians, with British, French and American units, attacked on 24 October towards Vittorio Veneto. The Austro-Hungarian army, whose peoples were already declaring their own states, held for a few days and then fell apart, and hundreds of thousands of its soldiers were taken prisoner. Austria-Hungary signed an armistice at Villa Giusti near Padua on 3 November, to take effect the next day, and Italian troops entered Trento and Trieste. Germany followed on 11 November.
    facts:
      - [Breakthrough at Dobro Pole, "15–18 September 1918"]
      - [Battle of Vittorio Veneto, "24 October – 4 November 1918"]
      - [Armistices, "Salonika 29 September, Mudros 30 October, Villa Giusti 3 November 1918"]
    markers:
      - kind: battle
        side: entente
        name: Battle of Dobro Pole
        date: 15–18 September 1918
        text: After a day-long bombardment, Serbian, French and Greek troops stormed the Bulgarian trenches on the ridge and broke the front open.
        lonlat: [21.885, 41.035]
      - kind: battle
        side: central
        name: Battle of Doiran
        date: 18–19 September 1918
        text: British and Greek attacks on the Bulgarian hill positions west of the lake failed with heavy losses, but the Bulgarians soon had to retreat.
        lonlat: [22.69, 41.2]
      - kind: taken
        side: entente
        name: Skopje
        date: 29 September 1918
        text: French cavalry under General Jouinot-Gambetta reached the town after a ride through the mountains, cutting the Bulgarian and German line of retreat.
        lonlat: [21.431, 41.996]
      - kind: treaty
        name: Armistice of Salonika
        date: 29 September 1918
        text: Bulgaria agreed to demobilise and evacuate the Greek and Serbian lands it held. The ceasefire took effect at noon the next day.
        lonlat: [22.944, 40.64]
      - kind: taken
        side: entente
        name: Belgrade
        date: 1 November 1918
        text: The Serbian First Army re-entered the capital after a rapid advance from the Salonika front, pushing back German and Austro-Hungarian rearguards.
        lonlat: [20.457, 44.817]
      - kind: treaty
        name: Armistice of Mudros
        date: 30 October 1918
        text: Signed in the harbour of Lemnos. The Ottoman Empire opened the straits and agreed to demobilise its army.
        lonlat: [25.27, 39.87]
      - kind: battle
        side: entente
        name: Battle of Vittorio Veneto
        date: 24 October – 4 November 1918
        text: After days of hard fighting on Monte Grappa and the Piave, the Italians reached Vittorio on 30 October, splitting the Austro-Hungarian armies.
        lonlat: [12.297, 45.986]
      - kind: treaty
        name: Armistice of Villa Giusti
        date: 3 November 1918
        text: Signed at a villa outside Padua. The fighting stopped at 15:00 on 4 November.
        lonlat: [11.86, 45.37]
        lp: l
