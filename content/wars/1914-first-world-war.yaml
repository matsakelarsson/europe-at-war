  - title: Verdun
    date: February – December 1916
    when: "1916-02-21"
    borders: "1916-12-18"
    countries: [fr, de]
    view:
      center: [5.35, 49.12]
      size: [150, 130]
    side_names:
      entente: French success
      central: German success
    move_names:
      entente: French moves
      central: German moves
    body:
      - Falkenhayn chose to attack at Verdun, a fortress city in a salient of the French line that he believed France would defend at any cost. He later wrote that he had meant to bleed the French army white; historians still debate whether that was his plan from the start. On 21 February 1916, after a bombardment by some 1,200 guns, the German Fifth Army under Crown Prince Wilhelm attacked on the right bank of the Meuse. Fort Douaumont, the largest of the forts and almost unmanned, fell on 25 February.
      - General Philippe Pétain took over the defence. He rotated divisions through the battle and kept a single road from Bar-le-Duc, later called the Voie Sacrée, open for thousands of lorries a day. The Germans extended their attack to the left bank, where Le Mort Homme and Hill 304 were fought over for months, took Fort Vaux on 7 June and Fleury on 23 June, but were stopped short of Fort Souville in July. From October French counter-attacks retook Douaumont and Vaux, and by 18 December much of the lost ground on the right bank. About three-quarters of the French army passed through Verdun.
    facts:
      - [Battle of Verdun, "21 February – 18 December 1916"]
      - [Fort Douaumont, "taken 25 February, retaken 24 October 1916"]
      - [Casualties, "about 377,000 French and 337,000 German, by commonly cited estimates"]
