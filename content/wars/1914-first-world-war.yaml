  - title: Arras, the Chemin des Dames and Passchendaele
    date: February – December 1917
    when: "1917-04-09"
    borders: "1917-12-07"
    countries: [fr, be, gb, de]
    side_names:
      entente: British and French success
      central: German success
    move_names:
      entente: British and French moves
      central: German moves
    body:
      - In February and March 1917 the Germans gave up the great bulge between Arras and Soissons and withdrew to the shorter, heavily fortified Hindenburg Line, destroying villages, roads, bridges and wells and removing most of the inhabitants as they went. On 9 April the British attacked at Arras, and the Canadian Corps took Vimy Ridge. On 16 April the new French commander-in-chief, Robert Nivelle, who had promised a breakthrough within days, attacked the Chemin des Dames. The offensive gained little and cost the French well over 100,000 casualties, and Nivelle was replaced by Pétain.
      - In May and June mutinies broke out in about half the divisions of the French army; soldiers refused to attack, though most were still willing to hold the line. Pétain restored order with better leave and food, an end to hopeless attacks and courts-martial that passed over 500 death sentences, of which a few dozen were carried out. The British took over the main burden. Their mines blew the Germans off Messines Ridge on 7 June, and from 31 July Haig’s offensive at Ypres ground on through rain and mud until Canadian troops took the ruins of Passchendaele in November.
      - The Third Battle of Ypres gained about eight kilometres, and estimates of each side’s losses run from about 200,000 to over 400,000. On 20 November at Cambrai the British attacked with some 380 tanks and broke into the Hindenburg Line, but German counter-attacks from 30 November retook most of the ground. By then Russia was leaving the war and Italy had been routed at Caporetto, and Germany could bring its armies from the east.
    facts:
      - [Vimy Ridge taken, "9–12 April 1917"]
      - [Nivelle offensive, "16 April – 9 May 1917"]
      - [Third Battle of Ypres (Passchendaele), "31 July – 10 November 1917"]
