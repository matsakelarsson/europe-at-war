steps:
  - title: Tannenberg and the Masurian Lakes
    date: August – September 1914
    when: "1914-08-17"
    borders: "1914-08-30"
    countries: [pl, ru, de]
    side_names:
      entente: Russian success
      central: German success
    move_names:
      entente: Russian moves
      central: German moves
    body:
      - After the assassination of Archduke Franz Ferdinand in Sarajevo, Austria-Hungary declared war on Serbia on 28 July 1914. Russia mobilised in support of Serbia, and Germany declared war on Russia on 1 August and on France two days later. To help France, Russia invaded East Prussia before its mobilisation was complete. General Paul von Rennenkampf’s First Army advanced from the east and won a battle at Gumbinnen on 20 August, while General Alexander Samsonov’s Second Army marched north from Russian Poland.
      - The new German commanders, Paul von Hindenburg and Erich Ludendorff, moved most of their troops by rail against Samsonov. Russian radio orders sent without code helped them. Near Tannenberg on 26–30 August the Second Army was surrounded and destroyed; some 90,000 Russians were captured, and Samsonov shot himself. In September the Germans turned on Rennenkampf at the Masurian Lakes and drove him out of East Prussia with heavy losses. Hundreds of thousands of East Prussians had fled from the invasion.
    facts:
      - [Battle of Gumbinnen, "20 August 1914, Russian victory"]
      - [Battle of Tannenberg, "26–30 August 1914, German victory"]
      - [Russian prisoners at Tannenberg, "about 90,000"]
    markers:
      - kind: battle
        side: entente
        name: Battle of Gumbinnen
        date: 20 August 1914
        text: The first big battle in the east. The German Eighth Army attacked the Russian First Army and was beaten back.
        lonlat: [22.2, 54.6]
      - kind: battle
        side: central
        name: Battle of Tannenberg
        date: 26–30 August 1914
        text: German troops encircled the centre of Samsonov’s army in the forests south of Allenstein. The Germans named the battle after a medieval defeat nearby.
        lonlat: [20.5, 53.75]
      - kind: battle
        side: central
        name: First Battle of the Masurian Lakes
        date: 7–14 September 1914
        text: The Germans outflanked Rennenkampf’s army, which escaped across the border but lost about 100,000 men.
        lonlat: [22.0, 54.0]
    arrows:
      - side: entente
        label: Rennenkampf
        via: [[23.9, 54.85], [23.0, 54.7], [22.3, 54.6]]
      - side: entente
