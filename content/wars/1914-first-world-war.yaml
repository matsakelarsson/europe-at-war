        side: central
        name: Battle of Komarów
        date: 26 August – 2 September 1914
        text: An Austro-Hungarian victory that nearly encircled the Russian Fifth Army, soon undone by defeats further east.
        lonlat: [23.5, 50.63]
      - kind: taken
        side: entente
        name: Lemberg
        date: 3 September 1914
        text: The capital of Austrian Galicia, today’s Lviv, fell to the Russians after battles on the Gnila Lipa and at Rava Ruska.
        lonlat: [24.032, 49.843]
      - kind: siege
        side: entente
        name: Siege of Przemyśl
        date: 1914 – 22 March 1915
        text: The largest siege of the war. Cut off from 9 November, the fortress was starved into surrender.
        lonlat: [22.767, 49.783]
