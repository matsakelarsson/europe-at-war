  - title: "Italy at war: the Isonzo and Asiago"
    date: May 1915 – September 1917
    when: "1915-05-23"
    borders: "1916-09-01"
    countries: [it, si, at, hu]
    side_names:
      entente: Italian success
      central: Austro-Hungarian success
    move_names:
      entente: Italian moves
      central: Austro-Hungarian moves
    body:
      - Italy, allied with Germany and Austria-Hungary before the war, stayed neutral in 1914. By the secret Treaty of London of 26 April 1915 Britain, France and Russia promised it Trentino, South Tyrol up to the Brenner, Trieste, Istria and much of Dalmatia, and on 23 May Italy declared war on Austria-Hungary. Its chief of staff, General Luigi Cadorna, attacked eastwards across the Isonzo towards Gorizia and Trieste. The Austro-Hungarians held the mountains and the bare limestone plateau of the Karst, and in four battles in 1915 the Italians gained little ground at a heavy cost.
      - In May 1916 the Austro-Hungarian chief of staff, Franz Conrad von Hötzendorf, struck from Trentino across the Asiago plateau to cut off the Italian armies in the east. His offensive took Asiago by 28 May, but Italian reserves stopped it short of the plain, and the Russian Brusilov offensive forced him to send troops east. In August the Italians took Gorizia in the sixth battle of the Isonzo, and Italy declared war on Germany. Five more battles followed; in the eleventh, in August and September 1917, the Italians took most of the Bainsizza plateau. The battles had cost hundreds of thousands of lives on each side, and the Austro-Hungarian army was near breaking point.
    facts:
      - [Treaty of London, "26 April 1915"]
      - [Italy declares war on Austria-Hungary, "23 May 1915"]
      - [Battles of the Isonzo, "eleven, June 1915 – September 1917"]
