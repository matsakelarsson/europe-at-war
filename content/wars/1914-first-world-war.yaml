steps:
  - title: The July Crisis and the invasion of Belgium
    date: June – August 1914
    when: "1914-06-28"
    borders: "1914-08-24"
    countries: [ba, rs, at, de, ru, fr, be, lu, gb]
    side_names:
      entente: French, British and Belgian success
      central: German success
    move_names:
      entente: French moves
      central: German moves
    body:
      - On 28 June 1914 Gavrilo Princip, a young Bosnian Serb nationalist armed with the help of members of the Serbian secret society known as the Black Hand, shot dead Archduke Franz Ferdinand, the heir to the Austro-Hungarian throne, and his wife Sophie in Sarajevo. Assured of German support, Austria-Hungary sent Serbia an ultimatum on 23 July. Serbia accepted most of its demands but not all, and on 28 July Austria-Hungary declared war. Russia mobilised in support of Serbia, and Germany declared war on Russia on 1 August and on France, Russia’s ally, on 3 August.
      - Germany’s war plan, drawn up under Alfred von Schlieffen and revised by Helmuth von Moltke, sent most of its army through Luxembourg and neutral Belgium, round the French border fortresses, to defeat France within weeks. Belgium refused free passage. When German troops crossed its border on 4 August, Britain, a guarantor of Belgian neutrality since 1839, declared war on Germany. The forts of Liège held out until 16 August, Brussels fell on 20 August, and the Belgian army withdrew to the fortress of Antwerp.
      - In the Battle of the Frontiers the French offensives in Lorraine and the Ardennes were thrown back with enormous losses; on 22 August alone some 27,000 French soldiers were killed. The French Fifth Army was beaten at Charleroi, the British Expeditionary Force fought a delaying action at Mons on 23 August, and both began a long retreat. Convinced that civilians were firing on them, German troops killed some 6,500 Belgian and French civilians between August and October, among them 674 at Dinant, and burned much of Leuven.
    facts:
      - [Assassination in Sarajevo, "28 June 1914"]
      - [Germany invades Belgium, "4 August 1914; Britain declares war the same day"]
      - [Civilians killed by German troops, "about 6,500 in Belgium and France, August–October 1914"]
