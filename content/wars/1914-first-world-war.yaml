        lonlat: [5.438, 49.217]
      - kind: battle
        side: central
        name: Le Mort Homme
        date: March – May 1916
        text: The hill on the left bank and its neighbour, Hill 304, were attacked from March and taken by the Germans by the end of May. The French recaptured them in August 1917.
        lonlat: [5.267, 49.232]
        lp: l
      - kind: held
        side: entente
        name: Verdun
        date: "1916"
        text: The fortress city never fell. The last big German attack, on 11–12 July, was stopped at Fort Souville, some five kilometres from the city.
        lonlat: [5.384, 49.16]
        lp: l
      - kind: event
        name: Bar-le-Duc
        date: "1916"
        text: The start of the Voie Sacrée, the road that carried most of the troops and supplies for the battle to Verdun, some 70 kilometres away.
