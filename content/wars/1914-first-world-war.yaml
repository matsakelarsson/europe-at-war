  - title: Gallipoli
    date: February 1915 – January 1916
    when: "1915-02-19"
    borders: "1916-01-09"
    countries: [tr, gb, fr]
    view:
      center: [26.5, 40.3]
      size: [320, 260]
    side_names:
      entente: British and French success
      central: Ottoman success
    move_names:
      entente: British, French, Australian and New Zealand moves
      central: Ottoman moves
    body:
      - To open the straits to Russia and knock the Ottoman Empire out of the war, Britain and France tried to force the Dardanelles. Their warships began bombarding the forts at the entrance on 19 February 1915, and on 18 March the battleships attacked the Narrows in force. A line of mines laid ten days earlier sank the French Bouvet and the British Irresistible and Ocean and crippled others, and the fleet withdrew. The Allies decided to land an army on the Gallipoli peninsula instead. On 25 April British troops landed at Cape Helles and the Australian and New Zealand Army Corps further north, at what became Anzac Cove, while the French made a diversion at Kum Kale on the Asian shore.
      - Ottoman troops, among them a division under Lieutenant-Colonel Mustafa Kemal, held the heights above the beaches, and the fighting sank into trench warfare amid heat, flies and dysentery. In August a new landing at Suvla Bay and an offensive on the Sari Bair ridge briefly reached the summit of Chunuk Bair but failed. In December the Allies decided to leave, and they evacuated Anzac and Suvla by 20 December and Helles by 9 January 1916 almost without loss. Each side lost some 250,000–300,000 men killed, wounded, captured or sick, with perhaps 43,000–61,000 Allied and 57,000–87,000 Ottoman dead. The campaign became a founding story of national identity in Australia, New Zealand and Turkey.
    facts:
      - [Naval attack on the Narrows, "18 March 1915, three Allied battleships sunk"]
      - [Landings, "25 April 1915"]
      - [Evacuation completed, "9 January 1916"]
