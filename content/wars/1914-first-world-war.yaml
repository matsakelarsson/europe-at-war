id: first-world-war
name: First World War
start: "1914-07-28"
end: "1918-11-11"
tier: A
summary: A world war fought from 1914 to 1918 between the Entente powers, among them France, Britain, Russia, Italy and later the United States, and the Central Powers, Germany, Austria-Hungary, the Ottoman Empire and Bulgaria. It killed some nine to ten million soldiers and millions of civilians, and brought down the Russian, German, Austro-Hungarian and Ottoman empires. In the west the German invasion of Belgium and France was stopped on the Marne in 1914, and four years of trench warfare followed, at Ypres, Verdun, the Somme and Passchendaele, until the Allied offensives of 1918 forced Germany to sign the armistice of 11 November. The Treaty of Versailles and the other Paris peace treaties of 1919–1920 redrew the map of Europe.
countries: [ru, pl, ua, by, lt, lv, ee, fi, tr, am, ge, ro, de, at, fr, be, lu, gb, rs, me, al, mk, xk, gr, bg, it, si, ba, hu, iq, sy, lb, jo, il, ps, sa, eg, cz, hr, md]
