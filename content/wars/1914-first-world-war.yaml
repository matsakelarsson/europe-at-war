id: first-world-war
name: First World War
start: "1914-07-28"
end: "1918-11-11"
tier: A
summary: A world war fought from 1914 to 1918 between the Entente powers, among them France, Britain, Russia, Italy and later the United States, and the Central Powers, Germany, Austria-Hungary, the Ottoman Empire and Bulgaria. It killed some nine to ten million soldiers and millions of civilians, and brought down the Russian, German, Austro-Hungarian and Ottoman empires.
countries: [ru, pl, ua, by, lt, lv, ee, fi, tr, am, ge, ro, de, at]
sides:
  - id: entente
    name: Entente powers
    polities: [russia, france, united-kingdom, serbia, montenegro, belgium, italy, romania, greece]
    ink: green
    moves: Russian moves
    success: Russian success
  - id: central
    name: Central Powers
    polities: [germany, austria-hungary, ottoman, bulgaria]
    ink: slate
    moves: Central Powers’ moves
    success: Central Powers’ success
  - id: sr
    name: Soviet Russia
    polities: [ussr]
    ink: red
    moves: Soviet moves
    success: Soviet success
notes:
  - This version covers the Eastern Front and the Caucasus front, where the Russian Empire fought Germany, Austria-Hungary and the Ottoman Empire. The Western, Italian, Balkan and Middle Eastern fronts are not yet told here.
  - Dates are New Style (Gregorian). Russia used the Julian calendar, 13 days behind, until February 1918, so its revolutions of 1917 are named after February and October although they took place in March and November by the Western calendar.
  - Numbers of dead, prisoners and refugees are estimates and vary widely between sources.
