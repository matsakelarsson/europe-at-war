  - title: Caporetto and the Piave
    date: October 1917 – June 1918
    when: "1917-10-24"
    borders: "1918-06-23"
    countries: [it, si, at, hu, de, gb, fr]
    side_names:
      entente: Italian and Allied success
      central: Austro-Hungarian and German success
    move_names:
      entente: Italian moves
      central: Austro-Hungarian and German moves
    body:
      - In the autumn of 1917 Germany sent divisions to help the hard-pressed Austro-Hungarians on the Isonzo. On 24 October the new Fourteenth Army under General Otto von Below attacked in the upper Isonzo valley around Caporetto, today’s Kobarid, after a short bombardment with gas and high explosive, and its storm troops pushed along the valleys behind the Italian positions. Among them was Lieutenant Erwin Rommel, whose company took Monte Matajur. The Italian Second Army collapsed. Cadorna ordered a retreat to the Tagliamento and then to the Piave, which the armies reached by 10 November, abandoning Udine, all of Friuli and much of the Veneto.
      - Italy lost some 13,000 killed, 30,000 wounded and 265,000–275,000 taken prisoner, and hundreds of thousands of soldiers and civilians fled west. General Armando Diaz replaced Cadorna, British and French divisions arrived, and at Rapallo the Allies set up a Supreme War Council. The new line on the Piave and Monte Grappa held through November and December. In June 1918 Austria-Hungary attacked across the Piave and on the Asiago plateau in its last great offensive, but in eight days of fighting the Italians and their allies drove it back across the river with heavy losses.
    facts:
      - [Battle of Caporetto, "24 October – 19 November 1917"]
      - [Italian prisoners, "about 265,000–275,000"]
      - [Second Battle of the Piave, "15–23 June 1918, Italian victory"]
