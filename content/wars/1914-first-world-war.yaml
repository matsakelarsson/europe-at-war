  - title: Sarikamish and the Caucasus front
    date: November 1914 – 1916
    when: "1914-11"
    borders: "1915-01-17"
    countries: [tr, am, ge, ru]
    side_names:
      entente: Russian success
      central: Ottoman success
    move_names:
      entente: Russian moves
      central: Ottoman moves
    body:
      - The Ottoman Empire entered the war beside Germany in November 1914. Its war minister, Enver Pasha, led the Third Army through the snow-covered mountains to encircle the Russian army at Sarikamish. Many of his men lacked winter clothing, and about 25,000 are thought to have frozen to death before the main battle. Between 22 December 1914 and 17 January 1915 the Russians beat off the attack and destroyed most of the Ottoman force. Enver blamed the Armenians for the defeat.
      - From April 1915 the Ottoman government arrested Armenian leaders and deported the Armenian population of Anatolia towards the Syrian desert, with mass killings and death marches. Around a million Armenians died in what most historians and many states recognise as the Armenian genocide; the Turkish government rejects the term. Armenians in Van resisted until Russian troops arrived in May. In 1916 General Nikolai Yudenich’s army took Erzurum in February and Trabzon in April, and by the summer it held much of eastern Anatolia.
    facts:
      - [Battle of Sarikamish, "22 December 1914 – 17 January 1915, Russian victory"]
      - [Erzurum taken by Russia, "16 February 1916"]
      - [Armenian genocide, "1915–1916, around a million dead"]
    markers:
      - kind: battle
        side: entente
        name: Battle of Sarikamish
        date: 22 December 1914 – 17 January 1915
        text: The Ottoman Third Army was destroyed by Russian troops, cold and hunger.
        lonlat: [42.573, 40.338]
      - kind: battle
        side: central
        name: Köprüköy
        date: November 1914
        text: An Ottoman counter-attack drove back the first Russian advance into Anatolia.
        lonlat: [41.871, 39.976]
      - kind: held
        name: Van
        date: April – May 1915
        text: Armenians defended the city against Ottoman forces until Russian troops and Armenian volunteers relieved them.
        lonlat: [43.38, 38.494]
      - kind: taken
        side: entente
        name: Erzurum
        date: 16 February 1916
        text: Yudenich stormed the forts of the main Ottoman fortress in eastern Anatolia in winter.
        lonlat: [41.277, 39.909]
      - kind: taken
        side: entente
        name: Trabzon
        date: 18 April 1916
        text: The Black Sea port fell to Russian troops supported by landings from the sea.
        lonlat: [39.722, 41.005]
