  - title: The Somme
    date: July – November 1916
    when: "1916-07-01"
    borders: "1916-11-18"
    countries: [fr, gb, de]
    view:
      center: [2.6, 50.05]
      size: [230, 190]
    side_names:
      entente: British and French success
      central: German success
    move_names:
      entente: British and French moves
    body:
      - The Allies had planned a joint offensive astride the Somme for 1916. Verdun cut the French share, and the main attack fell to the British, many of them volunteers of Kitchener’s New Army. A week-long bombardment of about 1.5 million shells failed to cut much of the barbed wire or destroy the deep German dugouts, and when the British Fourth Army attacked on 1 July 1916 the defenders were ready. The British suffered 57,470 casualties that day, 19,240 of them killed, the worst day in the British army’s history. Only in the south, around Mametz and Montauban and beside the French, were the objectives taken.
      - The battle became a slow struggle of attrition. Australian troops took Pozières in July, South Africans held Delville Wood, and on 15 September tanks went into action for the first time, at Flers–Courcelette. Thiepval fell at the end of September and Beaumont-Hamel in November, before rain and mud ended the offensive on 18 November. The Allies had advanced up to about ten kilometres. British losses were about 420,000 and French about 200,000; estimates of German losses vary widely, from about 240,000 to 600,000. The battle relieved Verdun and wore down the German army, and historians still debate whether that justified its cost.
    facts:
      - [First day on the Somme, "1 July 1916, 57,470 British casualties"]
      - [Tanks first used, "15 September 1916, Flers–Courcelette"]
      - [Battle of the Somme, "1 July – 18 November 1916"]
