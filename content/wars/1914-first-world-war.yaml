  - title: Gas at Ypres, Artois and Loos
    date: March – October 1915
    when: "1915-03-10"
    borders: "1915-11-06"
    countries: [be, fr, gb, de]
    side_names:
      entente: French and British success
      central: German success
    move_names:
      entente: French and British moves
      central: German moves
    body:
      - In 1915 the French and British tried to break through the German trenches, while Germany stood mostly on the defensive in the west and sent its reserves east. A British attack at Neuve Chapelle in March took the village but could go no further. On 22 April, north of Ypres, the Germans released more than 150 tonnes of chlorine against French colonial and territorial troops, the first large-scale use of lethal gas. The line gave way over several kilometres, but Canadian and French troops closed the gap, and by late May the salient had shrunk to within a few kilometres of the town.
      - French offensives in Artois in May and September took the Lorette spur and the villages below Vimy Ridge, whose crest they reached only to be driven off, and cost the French over 100,000 casualties in the spring alone. On 25 September the British, using gas themselves for the first time, attacked at Loos while the French attacked in Champagne. Both offensives gained a few kilometres before they were stopped. The year’s attacks cost the French and British far more men than the defenders, and in December Sir Douglas Haig replaced Sir John French as commander of the British forces in France.
    facts:
      - [First gas attack at Ypres, "22 April 1915"]
      - [Second Battle of Ypres, "22 April – 25 May 1915"]
      - [Battle of Loos, "25 September – 8 October 1915"]
