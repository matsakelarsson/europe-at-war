        text: French troops took the spur, Carency, Ablain, Neuville-Saint-Vaast and Souchez in costly fighting, but not Vimy Ridge itself.
        lonlat: [2.719, 50.401]
        lp: l
      - kind: battle
        name: Battle of Loos
        date: 25 September – 8 October 1915
        text: The British took Loos and reached Hill 70, but reserves arrived too late and the gains were mostly lost. British casualties were some 59,000.
        lonlat: [2.794, 50.458]
