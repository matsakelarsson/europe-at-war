  - title: The blockade, Jutland and the U-boats
    date: 1914–1917
    when: "1917-02-01"
    borders: "1917-04-06"
    countries: [gb, de, dk, ie, us]
    side_names:
      entente: British success
      central: German success
    move_names:
      entente: British moves
      central: German moves
    body:
      - From the start of the war the Royal Navy blockaded Germany, closing the Channel and the northern exits of the North Sea and stopping food as well as war materials. Germany answered with submarines. In February 1915 it declared the waters around the British Isles a war zone in which merchant ships could be sunk without warning, and on 7 May a U-boat sank the British liner Lusitania off Ireland, killing nearly 1,200 people, among them 128 Americans. American protests led Germany to restrict its submarine campaign.
      - The German High Seas Fleet, smaller than the British Grand Fleet, hoped to trap and destroy part of it. On 31 May and 1 June 1916 the two fleets met off Jutland in the largest naval battle of the war, with about 250 ships. The British lost 14 ships and over 6,000 men, the Germans 11 ships and some 2,500 men, and both sides claimed victory. But the High Seas Fleet returned to port and never again seriously challenged British control of the North Sea.
      - As the blockade brought growing hunger in Germany, its leaders gambled that unrestricted submarine warfare could starve Britain into submission before American help could arrive. It began on 1 February 1917, and in April U-boats sank some 860,000 tons of shipping. Together with the Zimmermann telegram, in which Germany offered Mexico an alliance against the United States, the sinkings led the United States to declare war on Germany on 6 April 1917. Convoys, introduced from the summer, cut the losses sharply.
    facts:
      - [Sinking of the Lusitania, "7 May 1915, nearly 1,200 dead"]
      - [Battle of Jutland, "31 May – 1 June 1916"]
      - [United States declares war on Germany, "6 April 1917"]
