  - title: Revolution, Kerensky’s offensive and Riga
    date: 1917
    when: "1917-03-08"
    borders: "1917-09-03"
    countries: [ua, lv, ee, ru, de, at]
    side_names:
      entente: Russian success
      central: German and Austro-Hungarian success
    move_names:
      entente: Russian moves
      central: German and Austro-Hungarian moves
    body:
      - Hunger, war-weariness and the losses at the front led to strikes and mutinies in Petrograd in March 1917, and on 15 March Nicholas II abdicated. The Provisional Government kept Russia in the war. On 1 July its war minister, Alexander Kerensky, launched an offensive in Galicia. General Lavr Kornilov’s Eighth Army broke through and took Kalush and Halych, but many units refused to fight on, and a German counter-attack from 19 July drove the Russians out of nearly all of eastern Galicia and Bukovina.
      - On 1 September the German Eighth Army crossed the Daugava at Ikšķile using new infiltration tactics, and on 3 September it entered Riga; most of the Russian army escaped. In October German landings took the islands of Saaremaa, Muhu and Hiiumaa. On 7 November the Bolsheviks seized power in Petrograd and called for an immediate peace. Fighting stopped with a ceasefire, and an armistice was signed at Brest-Litovsk on 15 December.
