        name: Second Battle of Ypres
        date: 22 April – 25 May 1915
        text: After the gas attack the Germans took Langemarck, St Julien and the Frezenberg ridge, and pushed the salient back to within about four kilometres of Ypres.
        lonlat: [2.941, 50.899]
      - kind: battle
        name: Notre-Dame-de-Lorette
