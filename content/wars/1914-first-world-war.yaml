  - title: The Marne and the race to the sea
    date: September – November 1914
    when: "1914-09-05"
    borders: "1914-11-22"
    countries: [fr, be, gb, de, lu]
    side_names:
      entente: French, British and Belgian success
      central: German success
    move_names:
      entente: French and British moves
      central: German moves
    body:
      - The French and British armies fell back for two weeks, and on 2 September the French government left Paris for Bordeaux. But the German right wing was overstretched, and Alexander von Kluck’s First Army turned south-east to pass east of Paris, exposing its flank to a new French army gathered in the capital. On 5 September the French commander-in-chief, Joseph Joffre, attacked along the whole line, and some reinforcements reached the front in Paris taxis. When the British advanced into a gap between the German First and Second Armies, the Germans withdrew on 9 September to the heights north of the Aisne.
      - Moltke was replaced by Erich von Falkenhayn. Each side then tried to outflank the other to the north, in what became known as the race to the sea. Antwerp fell on 10 October, and the Belgian army held the last corner of its country on the Yser by flooding the land in front of it. At Ypres, British, French and Belgian troops beat off German attacks from 19 October to 22 November. By the end of the year a line of trenches ran from the North Sea to Switzerland, and Germany held most of Belgium and ten French departments, with much of France’s coal and heavy industry.
    facts:
      - [First Battle of the Marne, "5–12 September 1914, French and British victory"]
      - [Antwerp surrenders, "10 October 1914"]
      - [First Battle of Ypres, "19 October – 22 November 1914"]
