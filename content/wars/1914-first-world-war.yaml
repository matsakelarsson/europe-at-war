  - title: The fall of Serbia and the retreat through Albania
    date: October 1915 – February 1916
    when: "1915-10-06"
    borders: "1916-02-27"
    countries: [rs, xk, mk, me, al, gr, bg, at, hu, de, fr, gb, it]
    side_names:
      entente: Serbian, French and British success
      central: German and Austro-Hungarian success
    move_names:
      entente: Serbian, French and British moves
      central: German and Austro-Hungarian moves
    body:
      - In September 1915 Bulgaria, promised Serbian Macedonia, joined the Central Powers. On 6 October German and Austro-Hungarian armies under August von Mackensen crossed the Danube and the Sava, and Belgrade fell on 9 October after fierce street fighting. On 14 October the Bulgarian army attacked from the east, cutting the railway to Salonika and taking Skopje on 22 October and Niš on 5 November. At the invitation of the Greek prime minister, Eleftherios Venizelos, French and British troops had begun landing at Salonika on 5 October, but King Constantine forced him to resign and Greece stayed neutral. The Anglo-French force that advanced up the Vardar was too late to help, and in December the Bulgarians pushed it back into Greece.
      - Rather than surrender, the Serbian army, the old King Peter and the government set out on 25 November across the snow-covered mountains of Montenegro and Albania to the Adriatic, with civilians and Austro-Hungarian prisoners. Frost, hunger, disease and attacks by Albanian irregulars killed tens of thousands on the way and after they reached the coast. From January 1916 Italian, French and British ships carried more than 250,000 people from the Albanian ports, the soldiers mostly to Corfu; rebuilt there, the army returned to fight on the Salonika front. Austria-Hungary overran Montenegro in January, when King Nicholas went into exile, and occupied northern and central Albania, while Bulgaria took Macedonia and eastern Serbia.
    facts:
      - [Belgrade taken, "9 October 1915"]
      - [Bulgaria enters the war, "14 October 1915"]
      - [Retreat through Albania, "25 November 1915 – January 1916"]
