  - title: Versailles and the Paris peace settlement
    date: 1919–1920
    when: "1919-01-18"
    borders: "1920-09-20"
    countries: [fr, de, be, dk, pl, lt, gb, us, at, hu, bg, tr]
    body:
      - The peace conference opened in Paris on 18 January 1919. It was dominated by the leaders of France, Britain, the United States and Italy, Georges Clemenceau, David Lloyd George, Woodrow Wilson and Vittorio Emanuele Orlando, and the defeated powers were not invited to negotiate. Germany received the terms in May and, after bitter protests and a change of government, signed the Treaty of Versailles in the Hall of Mirrors on 28 June 1919, five years to the day after the assassination in Sarajevo. It came into force on 10 January 1920, the day the League of Nations was founded.
      - Germany lost about 13 per cent of its European territory and a tenth of its population. Alsace-Lorraine returned to France. Poland received most of Posen and West Prussia, giving it a corridor to the sea; Danzig became a free city, the Memel territory was placed under the Allies, and the Saar was put under the League of Nations for fifteen years, with its coal mines given to France. Plebiscites gave northern Schleswig to Denmark in 1920 and divided Upper Silesia in 1921, and Eupen-Malmedy passed to Belgium.
      - Germany’s army was limited to 100,000 men, without tanks, military aircraft or submarines. The Rhineland was occupied by Allied troops for up to fifteen years and was to remain demilitarised, and Article 231 made Germany accept responsibility for the loss and damage caused by the war, the basis for reparations, set in 1921 at 132 billion gold marks. Most Germans saw the treaty as a dictated peace. Separate treaties with Austria (Saint-Germain), Bulgaria (Neuilly), Hungary (Trianon) and the Ottoman Empire (Sèvres, later replaced by Lausanne) redrew the map of central and south-eastern Europe.
    facts:
      - [Treaty of Versailles, "signed 28 June 1919, in force 10 January 1920"]
      - [German territory lost in Europe, "about 13 per cent, with a tenth of the population"]
      - [Reparations, "132 billion gold marks (1921)"]
    link: { href: "#/war/silesian-uprisings", text: The Silesian Uprisings }
    markers:
      - kind: treaty
        name: Treaty of Versailles
        date: 28 June 1919
        text: Signed in the Hall of Mirrors of the palace, where the German Empire had been proclaimed in 1871.
        lonlat: [2.12, 48.805]
      - kind: event
        name: Strasbourg
        date: 22 November 1918
        text: French troops entered the city after the armistice. Alsace-Lorraine, annexed by Germany in 1871, returned to France.
        lonlat: [7.752, 48.573]
      - kind: event
        name: Saarbrücken
        date: 1920–1935
        text: The Saar territory was governed by the League of Nations, with its coal mines owned by France, until a plebiscite returned it to Germany in 1935.
        lonlat: [6.997, 49.234]
        lp: l
      - kind: event
        name: Eupen
        date: "1920"
        text: Eupen and Malmedy passed to Belgium after a public consultation in which those who objected had to sign their names in a register.
        lonlat: [6.036, 50.629]
      - kind: event
        name: Northern Schleswig
        date: February – March 1920
        text: In two plebiscite zones the northern one voted for Denmark and the southern one, with Flensburg, for Germany. The new border took effect on 15 June 1920.
        lonlat: [9.42, 55.044]
      - kind: event
        name: Danzig
        date: "1920"
        text: The mainly German port became a free city under the League of Nations, with rights for Poland; the Polish Corridor separated East Prussia from the rest of Germany.
        lonlat: [18.646, 54.352]
      - kind: event
        name: Memel
        date: "1920"
        text: The territory north of the Neman was put under Allied administration, run by France; Lithuania seized it in 1923.
        lonlat: [21.144, 55.712]
      - kind: event
        name: Upper Silesia
        date: 1921–1922
        text: A plebiscite in March 1921 was followed by a Polish rising. On the League of Nations’ advice the industrial district was divided between Germany and Poland, taking effect in 1922.
        lonlat: [19.023, 50.264]
