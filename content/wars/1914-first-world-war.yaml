  - title: The Brusilov offensive
    date: March – September 1916
    when: "1916-03-18"
    borders: "1916-09-20"
    countries: [ua, by, ru, at, de, ro]
    side_names:
      entente: Russian success
      central: German and Austro-Hungarian success
    move_names:
      entente: Russian moves
      central: German and Austro-Hungarian moves
    body:
      - In March 1916 a Russian offensive at Lake Naroch, launched to relieve the French at Verdun, failed with heavy losses. In the south-west General Aleksei Brusilov prepared a different kind of attack, striking on a wide front after short bombardments so that the enemy could not tell where the main blow would fall. On 4 June his four armies broke the Austro-Hungarian lines. Lutsk fell within days, and in the south the Russians took Chernivtsi and most of Bukovina and advanced to the Carpathians.
      - German reserves stopped the advance short of Kovel and Lemberg, and the offensive ended in late September. The Austro-Hungarian army lost hundreds of thousands of men, among them some 400,000 prisoners, and never fully recovered; Russian losses were also enormous and drained the army’s strength. The victory encouraged Romania to enter the war on the Entente side in August, but by December German, Austro-Hungarian, Bulgarian and Ottoman forces had taken Bucharest and most of the country.
    facts:
      - [Brusilov offensive, "4 June – late September 1916"]
      - [Austro-Hungarian prisoners, "about 400,000"]
      - [Romania enters the war, "27 August 1916"]
    markers:
      - kind: battle
        side: central
        name: Lake Naroch
        date: 18–30 March 1916
        text: A Russian offensive against the German lines gained almost nothing at a cost of some 100,000 casualties.
        lonlat: [26.776, 54.853]
      - kind: taken
        side: entente
        name: Lutsk
