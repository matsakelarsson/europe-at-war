  - title: The Armenian genocide
    date: 1915–1916
    when: "1915-04-24"
    borders: "1916-12-31"
    countries: [tr, sy, am]
    move_names:
      central: Deportation routes (approximate)
    body:
      - On the night of 24 April 1915 the Ottoman authorities arrested about 235–270 Armenian intellectuals and community leaders in Constantinople; most were later deported and killed. The ruling Committee of Union and Progress, which blamed the Armenians for the defeat at Sarikamish and feared they would side with Russia, then turned on the whole Armenian population of Anatolia. Armenian soldiers had already been disarmed and put into labour battalions, where many were killed. From late May, under a deportation law, Armenians were driven from their towns and villages towards the Syrian desert. Men were often shot soon after leaving; women, children and old people were marched for weeks, robbed, raped and attacked by gendarmes, irregulars and the paramilitary Special Organisation, and many died of hunger and exhaustion or were abducted.
      - Survivors were held in camps along the Euphrates and around Deir ez-Zor, where most were killed in a second wave of massacres in 1916. Estimates of the Armenian dead range from about 600,000 to 1.5 million, with around one million most often cited; Assyrian and Greek Christians were also killed and deported in large numbers. Some Armenians resisted, at Van and on Musa Dagh, and some Muslim officials and families sheltered them. After the war an Ottoman court-martial sentenced the regime’s leaders to death in their absence. Most genocide scholars and 36 states, among them Germany, France and the United States, recognise the killings as genocide. Turkey accepts that many Armenians died but rejects the term, attributing the deaths to war, disease, relocation and intercommunal fighting.
    facts:
      - [Arrests in Constantinople, "24 April 1915"]
      - [Deportations and massacres, "1915–1916"]
      - [Armenian dead, "estimates from about 600,000 to 1.5 million"]
    link: { href: "#/war/turkish-armenian-war", text: "The Turkish–Armenian War, 1920" }
    markers:
      - kind: event
        name: Constantinople
        date: 24 April 1915
        text: The arrest and deportation of Armenian leaders from the capital, remembered by Armenians as the start of the genocide.
        lonlat: [28.976, 41.009]
      - kind: event
        name: Harput
        date: 1915
        text: A gathering point for convoys from the north and east. The American consul there reported thousands of bodies around nearby Lake Hazar.
        lonlat: [39.25, 38.71]
      - kind: held
        name: Musa Dagh
        date: July – September 1915
        text: Armenians from six villages held out on the mountain for 53 days until French warships took some 4,000 of them to Egypt.
        lonlat: [35.95, 36.15]
        lp: l
      - kind: event
        name: Aleppo
        date: 1915–1916
        text: The main junction of the deportations, through which convoys passed on their way to the camps along the Euphrates.
        lonlat: [37.16, 36.2]
      - kind: event
        name: Deir ez-Zor
        date: 1916
        text: Tens of thousands of deportees gathered in the desert around the town were massacred in the summer and autumn of 1916.
        lonlat: [40.14, 35.336]
