  - title: The Hundred Days and the Armistice
    date: July – November 1918
    when: "1918-08-08"
    borders: "1918-11-11"
    countries: [fr, be, gb, de, us, lu]
    side_names:
      entente: Allied success
      central: German success
    move_names:
      entente: Allied moves
    body:
      - On 18 July French and American divisions, led by tanks, struck the western flank of the German salient on the Marne near Soissons, and by early August the Germans had fallen back to the Vesle. On 8 August the British Fourth Army, with Canadian and Australian corps in the lead and some 500 tanks, attacked east of Amiens and advanced about eleven kilometres in a day, taking thousands of prisoners. Ludendorff called it “the black day of the German army”. Further Allied offensives followed, and on 12 September the American First Army under John J. Pershing cut off the Saint-Mihiel salient.
      - In late September the Allies attacked from Flanders to the Meuse. Americans and French advanced in the Meuse–Argonne; British, Australian and American divisions crossed the Saint-Quentin canal, where the Hindenburg Line was broken on 29 September; and Belgian, British and French forces attacked in Flanders. The same day Bulgaria signed an armistice, and Ludendorff told the Kaiser that Germany must seek peace. A new government under Prince Max of Baden asked President Woodrow Wilson for an armistice on 4 October. The German army fell back fighting, and Ludendorff resigned on 26 October.
      - Mutiny and revolution spread through Germany in early November, and on 9 November William II’s abdication was announced. Early on 11 November German delegates signed the armistice in Foch’s railway carriage in the forest of Compiègne, and the guns fell silent at 11 a.m. Germany had to leave occupied France, Belgium, Luxembourg and Alsace-Lorraine within 15 days, give up its submarines and much of its weaponry, have its main fleet interned and accept Allied occupation of the Rhineland, while the blockade went on until peace was signed.
    facts:
      - [Battle of Amiens, "8–12 August 1918"]
      - [Hindenburg Line broken, "29 September 1918"]
      - [Armistice, "11 November 1918, 11 a.m."]
    link: { href: "#/war/german-revolution", text: The German Revolution of 1918–1919 }
    markers:
