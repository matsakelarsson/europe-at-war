  - title: Garua and the north
    date: April–June 1915
    when: "1915-06-10"
    borders: "1915-06-10"
    countries: [cm, ng]
    body:
      - "After their success at Garua the Germans held the north with confidence. In April 1915 Captain von Crailsheim led a raid from Garua deep into Nigeria, which was beaten off at Gurin on 29 April. The new British commander in the north, Colonel Frederick Cunliffe, brought up British and French troops and two heavy naval guns and laid siege to Garua on 31 May. Its forts had been strengthened with wire, earthworks and dugouts by some 2,000 labourers and were held with eleven machine guns and six field guns, but the shelling broke the garrison’s morale. On 9 June many of its African soldiers refused to fight; some tried to escape across the flooded Benue and about 70 drowned. On 10 June Crailsheim surrendered unconditionally with 37 Germans and 212 African soldiers."
      - "Cunliffe pushed south and took Ngaoundéré, on the edge of the Adamawa plateau, on 29 June after some fighting. The rains then halted the advance, and his troops joined the siege of Mora, whose defenders, short of food but not of ammunition, beat off assault after assault on the mountain while the Allies burned the villages that fed them."
    facts:
      - [Gurin, "29 April 1915, German raid beaten off"]
      - [Siege of Garua, "31 May – 10 June 1915"]
      - [Garua surrenders, "10 June 1915, 37 Germans and 212 African soldiers"]
      - [Ngaoundéré taken, "29 June 1915"]
    markers:
