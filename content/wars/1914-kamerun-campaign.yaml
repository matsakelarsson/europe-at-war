  - title: The first march on Yaoundé
    date: May–August 1915
    when: "1915-05-11"
    borders: "1915-05-11"
    countries: [cm, cf, cg]
    body:
      - "The Germans had moved their capital inland to Jaunde (Yaoundé), in the forested hills beyond the Sanaga and Nyong rivers, and raised their force to about 6,000 men. Pressed by the French government, Dobell agreed to march on it from the coast. On 1 May 1915 British and French columns advanced from the Edea line; they took the German position at Wum Biagas on 3–4 May, and Colonel Mechet’s French reached Eséka on the railway on 11 May. Then heavy rains, disease, ambushes and a supply line carried entirely on carriers’ heads brought them to a halt. Colonel Mayer’s column gained only a few miles a day and lost a quarter of its men killed or wounded; on 7 June the withdrawal was decided, and by 28 June the columns were back at posts near the coast."
      - "In the east Aymerich’s French columns, joined from late 1914 by a few hundred Belgian Force Publique soldiers from the Congo, advanced through Neukamerun along the Sangha and the other rivers; by late August 1915 they were established at Bertua and Dume, within reach of Yaoundé. At a conference in Duala on 25–26 August 1915 Dobell, Aymerich and the governor-general of French Equatorial Africa agreed to converge on Yaoundé from the west, the north and the east once the rains ended."
    facts:
      - [Advance begins, "1 May 1915"]
      - [Eséka reached, "11 May 1915"]
      - [Withdrawal ends, "28 June 1915"]
      - [Duala conference, "25–26 August 1915"]
    markers:
