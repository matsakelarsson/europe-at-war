steps:
  - title: Invasion on every border
    date: August–September 1914
    when: "1914-08-29"
    borders: "1914-08-29"
    countries: [cm, ng, td, cf, cg]
    body:
      - "Germany had claimed Kamerun in 1884 and extended its rule inland in a series of wars into the 1900s. In 1911, to settle the Agadir crisis, France ceded it Neukamerun, wide strips of Equatorial Africa that reached the Congo and Ubangi rivers, so that in 1914 the colony was surrounded by British Nigeria, French Equatorial Africa, the Belgian Congo and the small Spanish colony of Río Muni. Its defenders were about 1,855 Schutztruppe, African soldiers under German officers, and with the police and German reservists some 3,400 men, against much larger Allied forces next door. The governor, Karl Ebermaier, appealed to the neutrality clauses of the Berlin Act of 1885, but the Allies refused, and the French wanted Neukamerun back. On 8 August the Germans hanged Rudolf Duala Manga Bell, the Duala king who had led the opposition to the seizure of Duala land and sought foreign help, for high treason."
      - "French troops under General Joseph Aymerich crossed into the east on 6 August, moving up the rivers through swamp and forest that the Germans hardly defended, and in the far north troops from Chad under Colonel Largeau took Kusseri on 25 September. The British in Nigeria crossed the border on 25 August at three points. In the north Captain Fox’s attack on Mora failed, and Captain von Raben’s company dug in on the mountain above the town, where it would hold out for 18 months. In the centre Colonel MacLear took the border post at Tepe but was thrown back with heavy losses from the forts of Garua on 29–31 August. In the south a column from Ikom occupied Nsanakang on 30 August; on 6 September the Germans surrounded it and drove it back into Nigeria; the column lost about half its men, including 8 of its 11 British officers."
    facts:
      - [French invasion begins, "6 August 1914"]
      - [Duala Manga Bell hanged, "8 August 1914"]
      - [British cross from Nigeria, "25 August 1914"]
      - [First Battle of Garua, "29–31 August 1914, British repulsed"]
      - [Nsanakang, "6 September 1914, British driven out"]
