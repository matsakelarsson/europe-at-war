  - title: Río Muni and Mora
    date: January–February 1916
    when: "1916-02-18"
    borders: "1916-02-18"
    countries: [cm, gq]
    body:
      - "With the Allies closing on Yaoundé, the German commander, Colonel Carl Zimmermann, decided that the campaign was lost and that his force should not surrender but cross into neutral Spanish territory. Through January and February 1916 the German troops, officials and settlers marched south to Río Muni, followed by thousands of soldiers’ families, carriers and other Cameroonians, among them Karl Atangana and other Beti chiefs. One estimate puts the African soldiers at about 6,000, with thousands of women, servants and carriers; others are lower. In mid-February a French column drove the last German rearguard across the Campo river. Spain, with only about 180 colonial militiamen in Río Muni, could not have stopped them; it interned the Germans on Fernando Po and later in Spain, and the Beti chiefs lived in Madrid until they went home in 1920."
      - "In the north the garrison on Mora, which had held out for 18 months, had food for only a few more days but still had 37,000 rounds of ammunition. On 15 February Cunliffe offered to send the African soldiers safely home and the Europeans to internment in Britain. Captain von Raben accepted, on condition that the British give him £2,000 to pay his men, and surrendered with 155 men on 18 February 1916, the last German force in Kamerun."
    facts:
      - [Crossing into Río Muni, "January–February 1916"]
      - [Spanish militia in Río Muni, "about 180"]
      - [Mora surrenders, "18 February 1916, 155 men"]
    markers:
      - kind: taken
