notes:
  - "Nearly all the soldiers on both sides were Africans: the German Schutztruppe and police were recruited in Kamerun, the British force in Nigeria, the Gold Coast, Sierra Leone and the Gambia, with an Indian battalion from late 1915, and the French and Belgian forces in their Equatorial African and Congo colonies and in Senegal. Each side also forced or hired tens of thousands of carriers, and disease killed many more men than fighting. Allied losses were about 4,600 killed, wounded or dead of disease; German and Cameroonian losses, among soldiers, carriers and civilians, are less well known."
  - "The war fell heavily on Cameroonians. The Germans hanged the Duala king Rudolf Duala Manga Bell for treason on 8 August 1914 and treated the Duala as enemies, and German troops killed civilians at Jabassi and elsewhere; all armies requisitioned food and burned villages that supplied the enemy."
