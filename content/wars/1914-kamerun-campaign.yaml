        via: [[11.50, 3.80], [11.50, 3.52], [11.35, 2.75], [11.25, 2.20]]
  - title: Partition
    date: 1916–1922
    when: "1916-03"
    borders: "1922-07-20"
    countries: [cm, ng]
    body:
      - "Before the fighting ended, the British and French agreed in early 1916 on a provisional partition along the Picot line. Britain took about a fifth of the colony, two strips along the Nigerian border, and France the rest, with Duala, Yaoundé and the railways; the lands of Neukamerun went back to French Equatorial Africa. Germany renounced its colonies in the Treaty of Versailles, and on 20 July 1922 the League of Nations confirmed the two parts as mandates. Britain governed its Cameroons from Nigeria, France ruled Cameroun as a separate territory."
      - "French Cameroun became independent as Cameroon on 1 January 1960. In the plebiscites of February 1961 the British Northern Cameroons voted to join Nigeria and the Southern Cameroons to join Cameroon, a division whose consequences are still felt in the English-speaking regions of the country today."
    facts:
      - [Picot line, "early 1916"]
      - [League of Nations mandates, "20 July 1922"]
      - [Cameroon independent, "1 January 1960"]
      - [Plebiscites in British Cameroons, "February 1961"]
    markers:
      - kind: capital
        side: fr
        name: Yaoundé
        date: "1922"
        text: Capital of French Cameroun under the mandate.
        lonlat: [11.517, 3.867]
      - kind: capital
        side: gb
        name: Buea
        date: "1922"
        text: Seat of the British administration of the Southern Cameroons, governed from Nigeria.
        lonlat: [9.233, 4.167]
