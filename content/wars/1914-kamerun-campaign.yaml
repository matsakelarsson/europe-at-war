  - title: Yaoundé
    date: October 1915 – January 1916
    when: "1916-01-01"
    borders: "1916-01-01"
    countries: [cm]
    body:
      - "When the rains ended the Allies closed in from three sides. In the north-west Cunliffe’s columns took Bamenda on 22 October and Tibati on 3 November, and on 4–6 November stormed the German fort on the mountain at Banjo, where most of the defenders deserted and the rest surrendered, ending German resistance in the north. In the west the British and French took Wum Biagas again on 9 October and the Germans gave up Eséka on 30 October. By November 1915 the Allied forces in the west had grown to about 9,700 men, with an Indian battalion among them, and more than 7,000 carriers."
      - "The final advance began in late November. German resistance weakened after 22 December, and on 1 January 1916 Colonel Edmund Gorges’s British column entered Yaoundé, which the Germans had abandoned. French and Belgian columns from the east arrived in the first days of January, and on 19 January a French force under Faucon occupied Ebolowa, south of the capital."
    facts:
      - [Bamenda, "22 October 1915"]
      - [Banjo, "4–6 November 1915"]
      - [Yaoundé entered, "1 January 1916"]
      - [Ebolowa, "19 January 1916"]
