  - title: Duala and the coast
    date: September 1914 – January 1915
    when: "1914-09-27"
    borders: "1914-09-27"
    countries: [cm, gq, ga]
    body:
      - "The Germans blocked the estuary of the Wouri, the approach to Duala, the colony’s port and largest town, with mines and sunken ships. British and French warships cleared a channel through September, and on 21 September French troops took the German post at Ukoko, near Cocobeach on the southern coast. After a bombardment on 26 September Duala and Bonaberi across the river surrendered on 27 September to Brigadier-General Charles Dobell, commanding the Allied expeditionary force, and more than 400 German Europeans were shipped off as prisoners. The German force withdrew inland along the two railways."
      - "From Duala the Allies spread out along the rivers and railways. French tirailleurs forced the Japoma bridge in early October; a first British attack up the Wouri on Jabassi failed on 8 October but the town was taken on 14 October, and the French occupied Edea on 26 October. The British secured Buea, the old capital on the slopes of Mount Cameroon, and the port of Victoria on 15 November, and took Nkongsamba at the end of the northern railway, with two German aircraft, on 10 December. On 5 January 1915 the Germans attacked Edea and were beaten off, losing 23 Europeans and 190 African soldiers killed or wounded. Behind their lines the German authorities treated the Duala as enemies, burning their villages; German troops killed civilians around Jabassi."
    facts:
      - [Ukoko taken, "21 September 1914"]
      - [Duala surrenders, "27 September 1914"]
      - [Edea occupied, "26 October 1914"]
      - [Buea and Victoria, "15 November 1914"]
      - [German attack on Edea, "5 January 1915, repulsed"]
