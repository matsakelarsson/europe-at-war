id: kamerun-campaign
name: Kamerun campaign
start: "1914-08-06"
end: "1916-02-18"
tier: A
summary: "The British, French and Belgian conquest of the German colony of Kamerun in the First World War, a campaign of 18 months fought across forest, mountains and savanna by African soldiers under European officers and tens of thousands of African carriers. The French attacked from Equatorial Africa and Chad on 6 August 1914 and British columns from Nigeria on 25 August, but the Germans beat the British at Garua and Nsanakang and held the mountain of Mora. An Allied squadron took the port of Duala on 27 September 1914, and the Allies occupied the coast and the railways. In 1915 the British took Garua and Ngaoundéré in the north, while the Germans, who had raised their force to about 6,000 men, held the forested hills around their new capital at Yaoundé and threw back the first advance on it. French and Belgian columns overran the eastern lands Germany had gained from France in 1911. The converging advance of late 1915 took Yaoundé on 1 January 1916, and in January and February the German troops, officials and thousands of Cameroonians crossed into neutral Spanish Guinea, where they were interned. The last German garrison, on Mora, surrendered on 18 February 1916. Britain and France divided the colony, and in 1922 it became the League of Nations mandates of British and French Cameroons."
countries: [cm, ng, td, cf, cg, ga, gq]
sides:
