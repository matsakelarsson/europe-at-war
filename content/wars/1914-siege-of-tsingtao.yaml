  - title: The German islands in the Pacific
    date: October 1914
    when: "1914-10-03"
    borders: "1914-10-14"
    countries: [jp, de, mh, fm, pw, mp]
    body:
      - While the army besieged Tsingtao, the Japanese navy went after the German islands north of the equator, which had been bought from Spain in 1899 (the Carolines, Palau and the Marianas except American Guam) or annexed in 1885 (the Marshalls). They had small German administrations and no garrisons. The First South Seas Squadron under Vice-Admiral Yamaya Tanin occupied Jaluit, the seat of the Marshall Islands administration, on 3 October, Ponape (Pohnpei) on 7 October and Truk (Chuuk) by 12 October; the Second South Seas Squadron took Yap on 7 October and Palau, with the phosphate mines of Angaur, around 8 October. Saipan in the Marianas followed on 14 October. There was virtually no resistance.
      - Japan set up naval garrisons at Jaluit, Ponape, Truk, Palau and Saipan, and the British agreed in secret in 1917 that Japan should keep the islands north of the equator. At Versailles they were given to Japan as a League of Nations mandate, the South Seas Mandate, governed from Koror in Palau. Japanese settlers, sugar plantations and later naval bases followed, and in 1944 the islands became battlefields of the Pacific War.
    facts:
      - [Jaluit occupied, "3 October 1914"]
      - [Ponape and Yap occupied, "7 October 1914"]
      - [Truk occupied, "by 12 October 1914"]
      - [Saipan occupied, "14 October 1914"]
