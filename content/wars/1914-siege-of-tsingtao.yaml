steps:
  - title: Ultimatum and landings
    date: August – September 1914
    when: "1914-08-23"
    borders: "1914-09-01"
    countries: [cn, jp, de, gb]
    body:
      - When war broke out in Europe, Britain asked its ally Japan to help hunt German warships in East Asian waters. Japan saw a chance to take the German base in Shandong. Its ultimatum of 15 August demanded that Germany hand over the Kiautschou territory “with a view to its eventual restoration to China”; Germany did not answer, and Japan declared war on 23 August. A Japanese squadron under Vice-Admiral Katō Sadakichi, joined by the British battleship Triumph, blockaded Tsingtao from 27 August. Admiral von Spee’s East Asia Squadron had already sailed for the Pacific, leaving only the Kaiserin Elisabeth, a few gunboats and a torpedo boat in the harbour.
      - On 2 September the Japanese 18th Division under Lieutenant General Kamio Mitsuomi began landing at Longkou on the north coast of the peninsula, more than 150 km from Tsingtao, in heavy floods. China, neutral, protested but did not resist. A second landing at Laoshan Bay, about 30 km east of Tsingtao, followed on 18 September, and later that month the British contingent from Tianjin, the 2nd South Wales Borderers and then the 36th Sikhs, came ashore to join it. Japanese troops took Jimo and Jiaozhou and then, against Chinese protests, the whole Shandong railway to Jinan, which Japan claimed as German property.
