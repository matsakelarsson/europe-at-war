  - title: The siege and surrender
    date: September – November 1914
    when: "1914-09-26"
    borders: "1914-11-07"
    countries: [cn, jp, de, gb]
    body:
      - Governor Meyer-Waldeck gave up his outer lines and held the hills close to the town, where forts on Mount Moltke, Mount Bismarck and Mount Iltis covered the land approaches. On 26 September the Japanese pushed the Germans back across the Litsun River, and on 27 September they took Prince Heinrich Hill (Fushan), from which they could see the whole German position, in a costly assault supported by the fleet. In the harbour the Germans scuttled their gunboats. Seaplanes from the Japanese carrier Wakamiya bombed the port in one of the first air attacks launched from a ship, and the single German aeroplane flew reconnaissance over the besiegers. On 17 October the German torpedo boat S90 slipped out at night and sank the Japanese cruiser Takachiho with about 270 of her crew.
      - From 31 October about 100 Japanese siege guns, among them 28 cm howitzers, and the guns of the fleet bombarded the forts and the town for seven days while the infantry dug their trenches forward, as they had at Port Arthur in 1904. On the night of 6–7 November the Japanese stormed the central redoubts, and in the morning of 7 November Meyer-Waldeck surrendered. The Kaiserin Elisabeth had been scuttled. Japanese and British troops entered the town formally on 16 November. About 4,500 prisoners were taken to camps in Japan, where most stayed until 1920. Japan kept the territory and the railway, and in January 1915 presented China with the Twenty-One Demands.
    facts:
      - [German and Austro-Hungarian garrison, "about 3,700–4,500"]
      - [Takachiho sunk, "17 October 1914"]
      - [Bombardment begins, "31 October 1914"]
      - [Surrender, "7 November 1914"]
      - [Japanese losses, "733 killed, 1,282 wounded"]
      - [German losses, "199 killed, 504 wounded"]
