      - [Japanese ultimatum, "15 August 1914"]
      - [Japan declares war, "23 August 1914"]
      - [Landing at Longkou, "from 2 September 1914"]
      - [Landing at Laoshan Bay, "18 September 1914"]
      - [Japanese 18th Division, "about 23,000 men, 142 guns"]
