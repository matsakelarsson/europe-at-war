id: siege-of-tsingtao
name: Siege of Tsingtao
start: "1914-08-23"
end: "1914-11-07"
tier: B
summary: "The capture of Germany’s naval base at Tsingtao (Qingdao) in China by Japan and Britain in the first months of the First World War, together with Japan’s seizure of Germany’s islands in the northern Pacific. Germany had held the Kiautschou (Jiaozhou Bay) territory on the Shandong peninsula on a 99-year lease since 1898 and built Tsingtao into a fortified port and the base of its East Asia Squadron, with a railway to Jinan. Japan, Britain’s ally since 1902, sent Germany an ultimatum on 15 August 1914 demanding the surrender of the territory and declared war on 23 August. The German squadron had already left for the Pacific. The Japanese 18th Division, about 23,000 men with 142 guns, landed on the north coast of Shandong at Longkou from 2 September, in breach of China’s neutrality, and at Laoshan Bay east of Tsingtao on 18 September, while other troops occupied the Shandong railway as far as Jinan. A British force of about 1,500 men under Brigadier-General Nathaniel Barnardiston joined them. The garrison of about 3,700 to 4,500 German marines, sailors and reservists and the crew of the Austro-Hungarian cruiser Kaiserin Elisabeth under Governor Alfred Meyer-Waldeck fell back to the hills around the town. After a week-long bombardment from 31 October and a night assault, the garrison surrendered on 7 November. In October the Japanese navy took the Marshall, Caroline, Palau and Mariana Islands without a fight. At the Paris Peace Conference in 1919 Japan was given Germany’s rights in Shandong, which set off the May Fourth Movement in China; Japan returned the territory to China in 1922 and governed the islands as a League of Nations mandate, the South Seas Mandate, until 1945."
countries: [cn, jp, de, gb]
sides:
  - id: jp
    name: Japan and the United Kingdom
    polities: [japan, united-kingdom]
    ink: red
    moves: Japanese and British moves
    success: Japanese and British success
  - id: de
    name: Germany and Austria-Hungary
    polities: [germany, austria-hungary]
    ink: slate
    moves: German moves
    success: German success
notes:
  - China was neutral until 1917 and protested against the Japanese landings and the occupation of the Shandong railway, which lay outside the German leased territory.
  - "Casualty figures differ slightly between sources: Japanese losses are given as 733 killed and 1,282 wounded (or 727 and 1,335), British 12 killed and 53 wounded, German 199 killed and 504 wounded. Chinese officials counted 98 Chinese civilians killed and about 30 wounded by Japanese troops. About 4,500 prisoners were taken at Tsingtao (counts vary from about 3,000 to 4,500); with others from the Pacific islands they were held in camps in Japan until 1920."
  - The occupation of the German islands is told here in brief; the German colonies south of the equator (New Guinea, Nauru and Samoa) were taken by Australian and New Zealand forces.
