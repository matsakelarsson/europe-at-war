  - title: Botha’s and Smuts’s offensives
    date: February – May 1915
    when: "1915-04-26"
    borders: "1915-05-12"
    countries: [na, za]
    body:
      - "With the rising over, the Union attacked with a force many times larger than the German garrison of regular soldiers and reservists. Union troops had occupied Swakopmund in mid-January; Botha himself took command there in the north on 11 February 1915 and built up his force at Walvis Bay. In March his columns advanced up the Swakop valley and its railway, defeating the Germans at Riet, Pforte and Jakalswater on 20 March. A German attack on the railway station of Trekkopjes on 26 April was beaten off with the help of armoured cars. Botha took Karibib on 5 May and Okahandja on 7 May; Windhoek, the capital, was handed over to him without a fight on 12 May."
      - "In the south, Smuts directed three converging columns: from Lüderitz through Aus, from the Orange River through Warmbad and Kalkfontein, and from Kimberley across the Kalahari. Outnumbered, the Germans abandoned the south. Van Deventer’s column entered Keetmanshoop, abandoned by the Germans, on 19 April, and McKenzie’s mounted troops caught part of the retreating German force at Gibeon on 27–28 April; the Germans withdrew north to join their main force. Seitz proposed a truce that would have left the north of the colony in German hands until the end of the war; Botha refused."
    facts:
