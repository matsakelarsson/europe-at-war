steps:
  - title: Sandfontein and the Maritz Rebellion
    date: September 1914 – February 1915
    when: "1914-10-12"
    borders: "1914-10-12"
    countries: [na, za, ao]
    body:
      - "When Britain declared war in August 1914, Botha told London that South Africa would defend itself and agreed to invade the German colony. In September Union troops landed at Lüderitz, and a force under Henry Lukin crossed the Orange River from the Cape. On 26 September at Sandfontein, just north of the river, German troops under Joachim von Heydebreck surrounded an advance party of some 250 men with artillery, and after a day of fighting the South Africans surrendered."
      - "Many Afrikaners, twelve years after the Boer republics’ defeat, refused to fight Germany on Britain’s behalf. Lieutenant-Colonel Manie Maritz, commanding Union troops on the north-western border, went over to the Germans with part of his force in October 1914; General Christiaan Beyers, who had resigned as commander of the Union Defence Force, Christiaan de Wet and Jan Kemp raised commandos in the Free State and the Transvaal. About 12,000 men joined the rising. Botha declared martial law and led some 32,000 loyal troops, most of them Afrikaners, against them. He scattered De Wet’s commando at Mushroom Valley on 12 November; De Wet was captured on 1 December and Beyers drowned in the Vaal River on 8 December. Maritz and Kemp attacked Upington from German territory on 24 January 1915 and were beaten off; Kemp surrendered on 4 February and Maritz fled to Angola. Jopie Fourie, an officer who had joined the rebels without resigning, was the only one executed; the other leaders were jailed and released within two years."
      - "On the northern border a dispute at the Portuguese fort of Naulila on 19 October 1914 ended with the deaths of three members of a German party, an official and two officers, who had crossed the border. Franke led a German force into southern Angola and on 18 December defeated the Portuguese at Naulila. The Portuguese withdrew from the south, and the Kwanyama under their king Mandume ya Ndemufayo rose against them; Portugal reoccupied the region in 1915."
    facts:
