  - title: Otavi and the surrender at Khorab
    date: June – July 1915
    when: "1915-07-09"
    borders: "1915-07-09"
    countries: [na, za]
    view:
      center: [17.50, -19.78]
      size: [100, 130]
    body:
      - "Botha resumed the advance in mid-June with four columns, two on the flanks and two along the railway to the north, moving fast across the dry country with some 13,000 mounted men. On 1 July the Germans made a last stand at Otavifontein, but their positions were outflanked and they fell back to Khorab, a farm a few kilometres north of Otavi, while Union columns reached Tsumeb and the end of the railway and cut off their retreat."
      - "On 9 July 1915 Seitz and Franke surrendered at Khorab with some 3,500–4,000 men. The terms were generous: officers kept their swords and reservists could go home to their farms. South Africa ruled the territory under martial law; in 1920 the League of Nations gave it to the Union as a mandate, and South Africa governed it, from 1948 under apartheid laws, until Namibia’s independence in 1990."
    facts:
      - [Battle of Otavifontein, "1 July 1915"]
      - [German surrender at Khorab, "9 July 1915"]
      - [Union deaths in the campaign, "113 killed, 153 died of disease or accident"]
