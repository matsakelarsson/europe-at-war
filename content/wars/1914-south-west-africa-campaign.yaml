id: south-west-africa-campaign
name: South West Africa campaign
start: "1914-09-15"
end: "1915-07-09"
tier: B
summary: "The First World War campaign in which the Union of South Africa conquered German South West Africa (Namibia) for the British Empire. At Britain’s request to seize the colony’s ports and wireless stations, Prime Minister Louis Botha’s government sent troops in September 1914. The invasion was delayed by a defeat at Sandfontein and by an armed rising of Afrikaners who refused to fight Germany for Britain, the Maritz Rebellion, which Botha had largely crushed by the end of 1914. In 1915 Botha advanced inland from Swakopmund and Jan Smuts from the south, taking Windhoek in May. Outnumbered many times over, the German forces under Governor Theodor Seitz and Colonel Victor Franke surrendered at Khorab on 9 July 1915. On the colony’s northern border German troops had also fought the Portuguese in Angola, defeating them at Naulila in December 1914. South Africa ruled the territory under military law until 1920, and then as a League of Nations mandate."
