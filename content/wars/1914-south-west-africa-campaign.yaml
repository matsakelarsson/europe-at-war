notes:
  - "The base map keeps the colony German until the peace settlement took effect on 10 January 1920; the land held by the Union’s forces in 1915 is drawn as an area."
  - "Losses were light by the standards of the war: the Union lost 113 killed and 153 dead of disease or accidents, the Germans 103 killed and 890 taken prisoner before the surrender. At least 124 rebels were killed in battle in the rising of 1914. Many Black and Coloured South Africans served as drivers, labourers and scouts, but the Union did not let them carry arms."
