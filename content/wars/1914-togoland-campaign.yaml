id: togoland-campaign
name: Togoland campaign
start: "1914-08-06"
end: "1914-08-26"
tier: B
summary: "The British and French conquest of the German colony of Togoland in August 1914, the first Allied campaign of the First World War. Germany had ruled Togoland since 1884; its value to Berlin in 1914 lay in the new wireless station at Kamina, near Atakpamé, which linked Germany with its colonies, its warships and South America. The acting governor, Major Hans-Georg von Doering, had only about 1,500 police, reservists and levies, and offered neutrality, which Britain refused. French troops from Dahomey crossed the Mono on 6 August and took Aného; the British from the Gold Coast entered Lomé, which the Germans gave up without a fight, and advanced up the railway towards Kamina while smaller French and British columns closed in from the east, the west and the north. The German police delayed them at Agbeluvoe (15 August) and on the Khra river (22 August), then blew up the wireless masts and surrendered unconditionally on 26 August. Britain and France divided the colony between them; in 1922 it became the League of Nations mandates of British Togoland, which joined Ghana in 1957, and French Togoland, independent as Togo in 1960. The partition cut through the lands of the Ewe."
countries: [tg, gh, bj]
sides:
