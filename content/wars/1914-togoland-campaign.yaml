notes:
  - "The German force was not an army but the colonial police (Polizeitruppe), African soldiers under German officers, with settlers who had military training; most of its African members deserted before the surrender. The British force was the Gold Coast Regiment of the West African Frontier Force, the French force tirailleurs, police and mounted levies from Dahomey and French West Africa; both relied on thousands of African carriers."
  - "Most accounts come from British and French officers. Togolese civilians, many of whom helped the invaders with information and guides, left few written records of the campaign."
