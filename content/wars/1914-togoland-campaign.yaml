steps:
  - title: Lomé and the coast
    date: 6–12 August 1914
    when: "1914-08-08"
    borders: "1914-08-12"
    countries: [tg, gh, bj]
    body:
      - "German Togoland, a narrow colony of about a million people between the British Gold Coast and French Dahomey, had three railways running inland from Lomé, to Aného on the coast, to Kpalimé and to Atakpamé. Near Atakpamé, about 160 km inland, the Germans had just finished a great wireless station at Kamina, which relayed messages between the transmitter at Nauen near Berlin, the colonies, the navy and South America. There were no German army units in the colony, only 693 colonial police under Captain Georg Pfähler and about 300 settlers with military training; with reservists and levies the Germans raised about 1,500 men. The acting governor, Major Hans-Georg von Doering, proposed that the colony stay neutral, appealing to the Congo Act of 1885 and to the common interests of the European colonies in West Africa. London refused on 6 August, and the governor of Dahomey took the proposal as a declaration of war."
      - Late on 6 August French police occupied the German customs posts on the Mono river, and on 8 August a French column took Aného unopposed; Togolese townspeople burned down the government house at Sebe. On the British side, the acting commander of the Gold Coast Regiment, Captain Frederick Bryant, sent officers to Lomé with a demand for surrender. Doering had already decided to fight only at Kamina. He withdrew inland with his police, calling up reservists and taking civilians with him as carriers, and left the district officer of Lomé free to surrender the colony as far as the Khra river, about 120 km up the railway, so that the capital would not be shelled from the sea.
      - The British flag was raised over Lomé on 8 August, and British troops who had marched along the coast from the Gold Coast arrived the next day. Bryant brought the main force round by sea and landed it through the surf at Lomé on 12 August, and the British and French agreed to converge on Kamina. In all the invaders had about 2,500 soldiers, police and mounted levies, about half of them British and half French, with more than 2,300 African carriers.
    facts:
      - [French cross the Mono, "6–7 August 1914"]
      - [Aného taken, "8 August 1914"]
      - [Lomé surrendered, "8–9 August 1914"]
      - [German force, "about 1,500 police, reservists and levies"]
