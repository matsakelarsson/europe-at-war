  - title: Partition
    date: 1914–1922
    when: "1916-12-27"
    borders: "1922-07-20"
    countries: [tg, gh]
    body:
      - After the surrender the two allies governed the colony in separate zones, the British holding Lomé and running the railways. On 27 December 1916 they divided it into British and French administrative zones that cut across the German districts and the lands of its peoples, and at the peace conference both asked for a new line. Under the Treaty of Versailles Germany gave up its colonies, and in July 1922 the League of Nations made the two parts mandates. France received about 60 per cent of the colony, with Lomé, the coast and the railways (the British handed Lomé over at the end of September 1920); Britain received the smaller, poorer western strip, which it governed from the Gold Coast.
      - The border divided the Ewe, the largest people of the south, between British and French rule, and Ewe leaders campaigned for reunification at the United Nations after the Second World War. In a plebiscite in May 1956 a majority in British Togoland voted to join the Gold Coast, and the territory became part of Ghana at its independence on 6 March 1957; French Togoland became independent as Togo on 27 April 1960.
    facts:
      - [Administrative zones, "27 December 1916"]
      - [League of Nations mandates, "July 1922"]
      - [British Togoland joins Ghana, "6 March 1957"]
      - [Togo independent, "27 April 1960"]
