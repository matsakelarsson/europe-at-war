  - title: Kamina
    date: 13–26 August 1914
    when: "1914-08-22"
    borders: "1914-08-26"
    countries: [tg]
    body:
      - Bryant’s force, about 560 soldiers with more than 2,000 carriers, advanced up the railway and the road towards Atakpamé through swamp, high grass and scrub. Doering sent parties south by train to destroy bridges and slow it down. Early on 15 August, near Agbeluvoe, British soldiers guided by a Togolese villager blocked the line behind two German trains; one was derailed and the other stopped, and in the fighting that followed Captain Pfähler was killed and about a quarter of the German party became casualties. In the north-east a French company that had crossed from Dahomey was driven back near Bafilo on 13 August.
      - The Germans made their stand on the Khra river, where they had blown the railway bridge and mined the approaches. On 22 August Bryant attacked the trenches on the far bank with British and French troops and was repulsed with the loss of about 75 men, a sixth of those engaged; Lieutenant George Thompson, killed there, was the first British officer to die in action in the war. But French columns were advancing from Tchetti in Dahomey and from the north, where mounted troops from the French colonies of the Sahel reached Sansanné-Mango on 23 August, and a British column from Kete Krachi reached Kpalimé the same day. The Germans left their trenches in the night.
      - On the night of 24–25 August the Germans blew up the nine wireless masts at Kamina and smashed the equipment, after the station had passed 229 messages since the start of the war. Doering offered terms at Glei on 25 August; Bryant demanded unconditional surrender, and on 26 August Doering surrendered with about 200 men, the rest of his police having deserted. The campaign had cost the British 83 casualties, the French about 54 and the Germans 41.
    facts:
      - [Agbeluvoe, "15 August 1914"]
      - [Khra river, "22 August 1914, British and French attack repulsed"]
      - [Kamina destroyed, "night of 24–25 August 1914"]
      - [German surrender, "26 August 1914"]
