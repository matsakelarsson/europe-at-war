id: united-states-occupation-of-veracruz
name: United States occupation of Veracruz
start: "1914-04-21"
end: "1914-11-23"
tier: B
summary: "The seizure and seven-month occupation of Mexico’s main port by United States forces during the Mexican Revolution. President Woodrow Wilson had refused to recognise Victoriano Huerta, who had taken power in the coup of February 1913 in which President Francisco I. Madero was murdered. When soldiers of Huerta’s garrison briefly detained nine American sailors at Tampico on 9 April 1914, Admiral Henry Mayo demanded a 21-gun salute to the US flag, which Huerta refused, and on 21 April, told that the German steamer Ypiranga was about to land arms for Huerta, Wilson ordered the navy to seize the customs house at Veracruz. The Mexican commander withdrew his troops on orders from the capital, but naval cadets, freed prisoners and townspeople fought the landing parties in the streets for two days. Nineteen Americans were killed; Mexican losses are estimated at 150 to 200 dead, soldiers, cadets and civilians. The army under Frederick Funston governed the city until 23 November 1914, while Argentina, Brazil and Chile mediated at Niagara Falls. The occupation cut Huerta off from the customs revenue of the port and hastened his fall in July, and the Americans left the city, with the arms they had stored there, to Venustiano Carranza’s Constitutionalists. In Mexico it is remembered as an invasion, and it left lasting resentment."
countries: [mx, us]
