notes:
  - The arms on the Ypiranga had been bought in the United States and Europe by the American financier John Wesley De Kay and the arms dealer Leon Rasst, not by the German government, as newspapers reported at the time. The ship was held at Veracruz and landed its cargo a few weeks later at Puerto México (Coatzacoalcos), a port Huerta still held.
  - Mexican casualty figures vary. One common estimate is 150 to 170 soldiers killed and 195 to 250 wounded, besides civilians whose number is not known; other accounts give about 200 Mexican dead in all. The United States lost 19 killed and 72 wounded.
