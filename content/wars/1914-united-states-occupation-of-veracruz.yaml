  - title: Occupation, mediation and withdrawal
    date: April – November 1914
    when: "1914-07-15"
    borders: "1914-11-23"
    countries: [mx, us]
    body:
      - "Fletcher declared martial law, and on 30 April the army under Brigadier General Frederick Funston took over the city. A brigade of Marines and an army brigade held a perimeter a few kilometres inland, facing federal troops across it, but there was no more fighting. The occupiers collected the customs duties, ran the city’s government and courts and carried out a sanitation campaign. Navy fliers based in the harbour made the first operational flights of US naval aircraft, scouting the country around the port. Huerta lost the revenue of his largest port, but the Ypiranga landed its cargo at Puerto México on the isthmus in late May."
      - "Argentina, Brazil and Chile, the “ABC powers”, offered to mediate, and delegates of Huerta and the United States met at Niagara Falls, Ontario, from 20 May to early July; the Constitutionalists refused to join. The conference produced no agreement, but by then Huerta’s armies were collapsing before Villa, Obregón and Pablo González. Huerta resigned on 15 July and left Mexico from Puerto México on a German cruiser. Funston’s troops stayed while the revolutionaries split. When Carranza gave guarantees that the people who had worked with the occupiers would not be punished, the last Americans sailed on 23 November 1914 and Constitutionalist troops under Cándido Aguilar entered the city. They found the arms and munitions the Americans had stored there."
      - "A few days later Carranza, driven from Mexico City by Villa and Zapata, made Veracruz the seat of his government, and its customs revenue and arms helped him win the civil war of 1915. The occupation strengthened anti-American feeling in Mexico for decades and was one reason why Mexico stayed neutral in the First World War. It is told in more detail in the stories of the Mexican Revolution and the Mexican Border War."
