steps:
  - title: The Tampico affair and the landing at Veracruz
    date: 9–22 April 1914
    when: "1914-04-21"
    borders: "1914-04-22"
    countries: [mx, us]
    view:
      center: [-96.9, 20.6]
      size: [420, 520]
    body:
      - "Woodrow Wilson, who became president a few weeks after Huerta’s coup, would not recognise a government that had come to power through the murder of Madero. In 1913 he banned arms sales to Mexico, and in early 1914 he lifted the ban for the Constitutionalists who were fighting Huerta in the north. US warships lay off the oil port of Tampico, which the Constitutionalists were besieging. On 9 April 1914 soldiers of the federal garrison detained nine unarmed sailors from the gunboat Dolphin who had come ashore for fuel near a bridge on the front line. They were released within an hour with an apology, but Rear Admiral Henry Mayo demanded that the Mexicans also hoist the US flag and salute it with 21 guns. Huerta refused, calling the terms humiliating, and Wilson backed Mayo and sent the Atlantic Fleet."
      - "On 20 April Wilson asked Congress for authority to use force. That night he learned that the German steamer Ypiranga was due at Veracruz with arms for Huerta, and he ordered the port’s customs house seized. On the morning of 21 April Rear Admiral Frank Fletcher landed some 800 Marines and sailors on the waterfront. General Gustavo Maass, the Mexican commander, was ordered by the war ministry not to resist and withdrew his troops to Tejería, about 10 km inland; before leaving he had rifles handed out to volunteers and to prisoners freed from the military jail. Cadets of the Veracruz Naval Academy, encouraged by Commodore Manuel Azueta, defended their building, and soldiers who stayed behind, freed prisoners and townspeople fired on the Americans from roofs and windows."
      - "Fletcher landed more men during the night and on 22 April took the whole city, street by street; the warships Prairie, San Francisco and Chester shelled the naval academy before it was stormed. By the evening more than 6,000 Americans were ashore. The fighting cost 19 Americans killed and 72 wounded. Mexican dead are estimated at 150 to 200, among them the cadet Virgilio Uribe and the artillery lieutenant José Azueta, the commodore’s son, who are honoured in Mexico as the defenders of the port. The news set off anti-American riots in Mexico and elsewhere in Latin America; even Carranza, whom Wilson favoured, condemned the landing as an invasion."
