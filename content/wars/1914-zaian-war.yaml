id: zaian-war
name: Zaian War
start: "1914-06-10"
end: "1921-09"
tier: B
summary: "A war between France and the Zaian confederation of Berber tribes in the Middle Atlas of Morocco, part of the French conquest of the country. The Zaians, led since 1877 by Mouha ou Hammou Zayani, held the mountains around Khénifra, on the routes between Fez, Marrakesh and the south-east. French columns took Khénifra in June 1914, but on 13 November 1914 a French column that attacked the Zaian winter camp at El Herri was surrounded and lost 623 men killed, the heaviest French defeat in Morocco. During the First World War Lyautey, who had sent most of his troops to France, held a line of posts while the Zaians and their allies, aided with money and arms by German and Ottoman agents, raided it. After the war France won over Mouha ou Hammou’s sons, who submitted in 1920; he was killed in March 1921 fighting tribesmen who had gone over to the French, and a French offensive in September 1921 ended the war. His ally Moha ou Said and others fought on in the High Atlas into the 1930s."
countries: [ma, fr]
sides:
  - id: fr
    name: France and the protectorate government
    polities: [france, morocco]
    ink: blue
    moves: French moves
    success: French success
  - id: za
    name: Zaian confederation and its allies
    polities: [zaian-confederation]
    ink: olive
    moves: Zaian moves
    success: Zaian success
notes:
  - "The Zaians’ allies included Moha ou Said of the Aït Ouirra and the religious leader Ali Amhaouch of the Darqawa order, who died around 1918. Many of the soldiers on the French side were Moroccan goumiers and partisans, Algerian and Senegalese tirailleurs and the Foreign Legion."
  - "French dead in the Middle Atlas campaigns up to 1933 are given as 82 French officers, about 700 European soldiers, 1,400 African regulars and 2,200 goumiers and partisans. Zaian losses were not recorded except for single battles."
