steps:
  - title: Khénifra and El Herri
    date: June – November 1914
    when: "1914-06-10"
    borders: "1914-11-13"
    countries: [ma, fr]
    body:
      - The Zaian confederation, about 4,000 tents of Tamazight-speaking herders and farmers, held the Middle Atlas around Khénifra and the upper valley of the Oum Er-Rbia. Its leader, Mouha ou Hammou Zayani, had been made a qaid by the sultan before the protectorate. After taking Taza in May 1914, Lyautey wanted to secure the routes through the Middle Atlas. On 10 June about 14,000 men under General Paul Henrys advanced in three columns and took Khénifra on 12 June, but the Zaians kept attacking the new post and the convoys that supplied it.
      - In November, against his orders, Lieutenant-Colonel René Laverdure, commanding at Khénifra, set out with about 1,200 men to attack Mouha ou Hammou’s winter camp at El Herri, not far from the town. On 13 November his troops overran and burned the camp, but on the way back they were surrounded by thousands of Zaian fighters and their allies. Laverdure and 623 of his men were killed, and the column lost all its artillery and machine guns; the Zaians lost 182 dead by French counts. It was the bloodiest defeat of the French army in Morocco, and it came three months after most of Lyautey’s troops had been sent to fight in France.
    facts:
      - [Khénifra taken, "12 June 1914"]
      - [Battle of El Herri, "13 November 1914"]
      - [French dead at El Herri, "623, with Laverdure"]
