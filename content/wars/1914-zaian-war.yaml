  - title: The barrier and the end of the Zaian war
    date: 1915 – September 1921
    when: "1918"
    borders: "1921-09-30"
    countries: [ma, fr]
    body:
      - Through the First World War Lyautey kept a line of posts along the edge of the Middle Atlas, a “living barricade” held by far fewer troops, while Germany and the Ottoman Empire sent money and arms to the tribes. The Zaians and their allies raided the line constantly, and the French answered with columns that burned crops and seized herds. In 1917 columns crossed the Middle Atlas to the Moulouya valley, and in 1918–1919 fighting spread to the oases of the south-east, where a rising in January 1919 was put down with the help of the private army of Thami al-Glaoui.
      - After the war France turned to negotiation as well as force. Three of Mouha ou Hammou’s sons submitted on 2 June 1920 with many of their followers, and one of them, Hassan, was made pasha of Khénifra. The confederation split between those who had gone over and those who held out, and on 27 March 1921 Mouha ou Hammou was killed in a fight at Azlag n’Tazemmourt against Zaian tribesmen led by his son. In September 1921 a three-pronged French offensive broke the last Zaian resistance within days. Moha ou Said, defeated at El Ksiba in April 1922, died in 1924, and his followers kept up the fight in the High Atlas until the 1930s.
    facts:
      - [Sons of Mouha ou Hammou submit, "2 June 1920"]
      - [Mouha ou Hammou killed, "27 March 1921"]
      - [Final offensive, "September 1921"]
