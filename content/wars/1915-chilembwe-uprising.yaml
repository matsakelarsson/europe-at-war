id: chilembwe-uprising
name: Chilembwe uprising
start: "1915-01-23"
end: "1915-02-03"
tier: C
summary: "A short armed rising against British colonial rule in the Nyasaland Protectorate (Malawi) in January 1915, led by the Baptist minister John Chilembwe. Educated in the United States, Chilembwe ran the Providence Industrial Mission at Mbombwe in the Shire Highlands, where he and a small African middle class of teachers, traders and farmers resented the colour bar, the hut tax and above all thangata, the system by which Africans living on European estates paid their rent in unpaid labour. The neighbouring A. L. Bruce estate at Magomero, whose manager William Jervis Livingstone had burned Chilembwe’s churches on estate land, was notorious for it. The outbreak of the First World War, in which Nyasaland’s Africans were recruited by the thousands as soldiers and porters against German East Africa and died in battle at Karonga, led Chilembwe to protest in the press and then to plan a rising. On the night of 23 January 1915 his followers attacked Magomero, killed Livingstone and two other European men, and spared the women and children; another party raided an armoury in Blantyre for weapons. The rising found little wider support. Troops of the King’s African Rifles and settler volunteers failed to take Mbombwe on 25 January but occupied it the next day, after the rebels had burned the Catholic mission at Nguludi. Chilembwe fled towards Mozambique and was shot by a police patrol on 3 February. About 40 of his followers were executed and some 300 imprisoned. The rising was largely forgotten under colonial rule, but since Malawi’s independence in 1964 Chilembwe has been honoured as a national hero; 15 January is John Chilembwe Day."
