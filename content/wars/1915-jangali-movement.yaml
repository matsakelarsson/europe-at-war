notes:
  - The Soviet side fought alongside the Jangalis only in 1920–1921, and the Jangalis also fought Russian imperial troops in 1915–1917. Kuchik Khan broke with the communists in July 1920, and the communist faction under Ehsanollah Khan then held Rasht with Soviet backing.
