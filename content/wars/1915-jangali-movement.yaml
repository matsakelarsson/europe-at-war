id: jangali-movement
name: Jangali movement
start: "1915"
end: "1921-12"
tier: C
summary: "A rising in the forests of Gilan, on Iran’s Caspian coast, led by Mirza Kuchik Khan, a veteran of the Constitutional Revolution. His Jangalis (“men of the forest”) fought for reform and against foreign occupation, first the Russian troops in the north, then the British force that crossed Gilan in 1918, which they fought at Manjil on 12 June 1918 before coming to terms. In May 1920 the Soviet Red Fleet landed at Anzali in pursuit of White Russian ships, and in early June Kuchik Khan proclaimed the Persian Socialist Soviet Republic in Rasht with Soviet support. The alliance with the Iranian communists broke up within weeks. After the Soviet–Iranian treaty of February 1921 the Soviets withdrew, the Cossack forces of Reza Khan retook Gilan, and Kuchik Khan died of cold in the Talysh mountains on 2 December 1921; his head was cut off and sent to Reza Khan in Tehran."
