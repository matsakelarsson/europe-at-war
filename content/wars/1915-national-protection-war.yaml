id: national-protection-war
name: National Protection War
start: "1915-12-25"
end: "1916-07-14"
tier: C
summary: "The war, also called the Anti-Monarchy War or Third Revolution, that ended Yuan Shikai’s attempt to make himself emperor. In December 1915 Yuan accepted the throne of a new Empire of China, with the reign name Hongxian from 1 January 1916. On 25 December 1915 the military leaders of Yunnan, Cai E and Tang Jiyao, with Li Liejun, declared the province independent at Kunming and raised the National Protection Army; the scholar Liang Qichao, Cai E’s former teacher, was among the organisers. Cai E led a small army into Sichuan, where it held its own against a much larger Beiyang force, about 80,000 men, in hard fighting around Luzhou and Naxi in February and March 1916. Guizhou joined in January and Guangxi under Lu Rongting in March, and Yuan’s own generals refused to support him. On 22 March 1916 Yuan gave up the monarchy and returned to the presidency, but more provinces, Guangdong, Zhejiang, Shaanxi, Sichuan and Hunan among them, declared independence, and in May the southern provinces set up a military council at Zhaoqing in Guangdong. Yuan died on 6 June 1916; Li Yuanhong succeeded him as president, the 1912 constitution was restored, and the southern provinces withdrew their declarations by 14 July. The war left the provinces in the hands of their military governors and opened the warlord era."
