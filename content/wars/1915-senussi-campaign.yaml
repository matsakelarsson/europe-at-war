notes:
  - "The Senussiya, founded in the 1830s by Muhammad ibn Ali al-Senussi, had a network of lodges (zawiyas) across Cyrenaica and the Sahara as far as Kufra and Chad, and led the resistance in Cyrenaica after Italy’s invasion of 1911. Not all its leaders wanted war with Britain; Idris opposed it."
  - "Losses: the British counted 117 killed and 544 wounded in the battles on the Egyptian frontier and about 1,100 Senussi killed. Italian losses in Libya in the first half of 1915 alone are put at 5,600 killed and about 2,000 captured. The Senussi also inspired risings further south, in Darfur and in the Aïr, where Kaocen besieged Agadez in 1916–1917; those are told separately."
