  - title: War on the Egyptian frontier
    date: November 1915 – March 1916
    when: "1915-11"
    borders: "1916-03-17"
    countries: [eg, ly, gb, tr]
    body:
      - The Ottoman Empire, now at war with Britain, sent officers to the Senussi, among them Nuri Bey, a half-brother of Enver Pasha, and the Baghdadi officer Jafar al-Askari, and German submarines landed arms on the Cyrenaican coast. In the summer of 1915 Sayyid Ahmed was persuaded to declare jihad against Britain, though not all the leaders of the order agreed. In November U-boats torpedoed the British armed boarding steamer Tara and the transport Moorina and handed their crews to the Senussi. Senussi forces attacked the Egyptian posts on the frontier, and the British evacuated Sollum and fell back to Mersa Matruh.
      - A Western Frontier Force of British, Australian, New Zealand, Indian and South African troops was formed at Matruh. It defeated the Senussi at Wadi Senab on 11 December and at Wadi Majid on 25 December 1915, and fought a hard battle at Halazin on 23 January 1916. On 26 February at Agagia, south-east of Sidi Barrani, the Dorset Yeomanry charged the Senussi lines and Jafar al-Askari was taken prisoner. The British reoccupied Sollum on 14 March, and three days later the Duke of Westminster’s armoured cars drove more than 100 km into the desert to Bir Hakeim and freed 91 of the Tara’s crew; four had died in captivity.
    facts:
      - [Sollum evacuated, "November 1915"]
      - [Wadi Majid, "25 December 1915"]
      - [Agagia, "26 February 1916"]
      - [Rescue at Bir Hakeim, "17 March 1916, 91 prisoners freed"]
    markers:
