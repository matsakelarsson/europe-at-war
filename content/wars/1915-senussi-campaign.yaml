id: senussi-campaign
name: Senussi campaign
start: "1915-04-29"
end: "1917-04-14"
tier: B
summary: "The war of the Senussi, the Sufi order that led the resistance to Italy in Cyrenaica, against Italy and Britain during the First World War. Libyan fighters drove the Italians out of the Fezzan in 1914 and defeated a large Italian column at Gasr Bu Hadi near Sirte in April 1915, after which Italy held little more than a few coastal towns. Urged on by Ottoman officers and supplied by German submarines, the head of the order, Sayyid Ahmed al-Sharif, declared jihad and in November 1915 attacked Egypt, then a British protectorate. A British Empire force drove the Senussi back from the coast in battles from December 1915 to February 1916 and retook Sollum in March. Sayyid Ahmed’s occupation of the oases of the Western Desert was undone in 1916, and after a British raid on Siwa in February 1917 he handed the leadership to his cousin Muhammad Idris, who made peace with Britain and Italy at Akrama in April 1917. Idris became king of independent Libya in 1951."
