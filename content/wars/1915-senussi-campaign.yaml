steps:
  - title: Italy loses the interior
    date: 1914 – 1915
    when: "1915-04-29"
    borders: "1915-08-21"
    countries: [ly, it]
    body:
      - By the Treaty of Ouchy of 1912 the Ottoman Empire gave up Libya, but the war went on. In Cyrenaica the Senussi order, led by Sayyid Ahmed al-Sharif, kept up the fight from the Jebel Akhdar and the desert, and in Tripolitania local leaders resisted the Italian advance inland. In 1913–1914 a column under Colonel Antonio Miani pushed into the Fezzan and reached Murzuk, but in late 1914 risings cut it off and the Italians had to abandon the Fezzan.
      - On 29 April 1915, at Gasr Bu Hadi near Sirte, Miani’s column was routed when many of its Libyan auxiliaries, among them the Misratan leader Ramadan al-Suwayhili, turned on the Italians. The Libyans captured thousands of rifles, dozens of guns and millions of rounds of ammunition. Italy, which entered the First World War in May, pulled its garrisons back to the coast; by the end of the year it held little more than Tripoli, Homs and a few towns on the coast of Cyrenaica. Italian losses in the first half of 1915 are estimated at 5,600 killed and some 2,000 captured. Italy declared war on the Senussi on 21 August 1915.
    facts:
      - [Battle of Gasr Bu Hadi, "29 April 1915"]
      - [Italian losses, January – July 1915, "about 5,600 killed, 2,000 captured"]
      - [Italy declares war on the Senussi, "21 August 1915"]
