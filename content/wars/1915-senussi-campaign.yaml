  - title: The oases and the peace of Akrama
    date: February 1916 – April 1917
    when: "1916-02-11"
    borders: "1917-04-14"
    countries: [eg, ly, gb, it]
    body:
      - Pushed off the coast, Sayyid Ahmed turned south. In February 1916 he and some 500 followers occupied the oasis of Bahariya, and Senussi forces held Farafra and Dakhla, threatening the Nile valley. The British answered with aircraft, motor patrols and a light railway to Kharga, and by the end of 1916 the Senussi had withdrawn from the Egyptian oases except Siwa. On 3–5 February 1917 a column of armoured cars attacked the Senussi at Girba and entered Siwa, and Sayyid Ahmed fell back to Jaghbub.
      - Sayyid Ahmed’s cousin Muhammad Idris, who had opposed the war with Britain, took over the leadership of the order. At Akrama near Tobruk he accepted British terms on 12 April 1917, and on 14 April he reached a modus vivendi with Italy that left the Senussi the interior of Cyrenaica. Sayyid Ahmed left Libya by submarine for Istanbul in August 1918 and spent the rest of his life in exile. The Akrama accords and the later agreements of 1919–1920 gave Cyrenaica a few years of peace, until Fascist Italy renewed the war in 1923.
    facts:
      - [Bahariya occupied by the Senussi, "11 February 1916"]
      - [Raid on Siwa, "3–5 February 1917"]
      - [Accords of Akrama, "12–14 April 1917"]
