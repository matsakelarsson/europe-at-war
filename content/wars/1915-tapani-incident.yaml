id: tapani-incident
name: Tapani incident
start: "1915-07-06"
end: "1916-05-18"
tier: C
summary: "The last large armed rising of Han Taiwanese against Japanese rule, also called the Xilai Temple incident after the temple in Tainan where it was planned, and named after Tapani (today Yujing, in Tainan), where its main battle was fought. Its leader, Yu Qingfang, preached a millenarian message, raised money at the temple under the cover of repairs and proclaimed a state called Da Ming Cibei Guo, expecting “celestial troops” from China to come to his aid. When the police uncovered the plot and arrested his associate Luo Jun and others, Yu and the mountain leader Jiang Ding rose with Han farmers, camphor workers and Indigenous Taivoan fighters. In July 1915 they attacked Japanese police stations, beginning with the branch office at Kōbasen (Jiaxianpu) on 9 July, and killed officers and their families. On 6 August Japanese troops and police defeated them at Tapani, and in the following weeks they searched the surrounding villages, burning houses and killing villagers. A study for the Tainan city government in 2015 counted 1,412 dead; other estimates range from several hundred to 30,000. Yu was seized by villagers and handed over on 22 August 1915, and executed in September. Of 1,957 people arrested and tried, 866 were sentenced to death, about three-quarters of whom were later reprieved. Jiang Ding held out in the hills until he surrendered in April 1916 on a promise of pardon; he and his 272 men were arrested on 18 May 1916, and he was executed. After Tapani, Han Taiwanese opposition to Japanese rule took political rather than armed forms."
