steps:
  - title: The landing and the First Caco War
    date: July – November 1915
    when: "1915-07-28"
    borders: "1915-07-28"
    countries: [ht, us]
    body:
      - Between 1911 and 1915 Haiti had seven presidents, most of them carried to power by armies of cacos, peasant fighters from the north and the Central Plateau whom rival politicians paid to march on Port-au-Prince. American banks, led by the National City Bank of New York, had gained control of Haiti’s national bank, and in December 1914 Marines had carried its gold reserve off to New York. The Wilson government feared German influence and wanted control of Haiti’s customs. On 27 July 1915 President Vilbrun Guillaume Sam had 167 political prisoners executed; the next morning a crowd dragged him from the French legation and killed him, and that afternoon Rear Admiral William B. Caperton landed some 330 Marines and sailors at Port-au-Prince.
      - The United States kept from power Rosalvo Bobo, whose cacos had been about to take the capital, and on 12 August the National Assembly, under American pressure, elected Philippe Sudré Dartiguenave president. A treaty signed in September gave the United States control of Haiti’s customs and finances and of a new Gendarmerie d’Haïti officered by Marines. In the north the cacos fought on. Marines under Major Smedley Butler and others attacked their forts in the mountains, and on 17 November 1915 they stormed Fort Rivière, ending the First Caco War. About 200 cacos were killed in the fighting of 1915, against very few American losses.
    facts:
      - [Marines land at Port-au-Prince, "28 July 1915"]
      - [Haitian–American treaty, "September 1915"]
      - [Fall of Fort Rivière, "17 November 1915"]
