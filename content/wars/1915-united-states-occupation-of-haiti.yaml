  - title: Les Cayes and the end of the occupation
    date: 1921–1934
    when: "1929-12-06"
    borders: "1929-12-06"
    countries: [ht, us]
    body:
      - After the Senate inquiry the United States reorganised the occupation under a High Commissioner, General John H. Russell (1922–1930), who governed with President Louis Borno; there was no elected legislature. The occupation built roads, bridges, hospitals and schools and balanced the budget, but Haitians had little say, American officers practised racial segregation, and American companies acquired land. Opposition grew in the press, among students and in the Union Patriotique, which found allies in the United States in the NAACP.
      - In late 1929 a strike at the agricultural school at Damien grew into wider protests. On 6 December 1929 at Marchaterre, near Les Cayes, Marines fired on about 1,500 peasants protesting against taxes and hard times, killing between 12 and 22 and wounding about 50. President Herbert Hoover sent a commission under W. Cameron Forbes, which judged that the occupation had failed to prepare Haitians to govern themselves. Borno stepped down, elections in October 1930 returned nationalists, and Sténio Vincent became president. Under Franklin D. Roosevelt’s Good Neighbor policy the occupation ended on 1 August 1934, and the last Marines left on 15 August; American control of Haiti’s finances lasted until 1947.
    facts:
      - [Marchaterre (Les Cayes), "6 December 1929, 12–22 killed"]
      - [Forbes Commission, "1930"]
      - [Last Marines leave, "15 August 1934"]
