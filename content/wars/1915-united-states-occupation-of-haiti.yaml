id: united-states-occupation-of-haiti
name: United States occupation of Haiti
start: "1915-07-28"
end: "1934-08-15"
tier: B
summary: "The occupation of Haiti by the United States Marine Corps from 1915 to 1934, and the Caco wars fought against it. After years of political turmoil, in which rival politicians used peasant armies called cacos to seize power, and with American banks in control of Haiti’s national bank, President Woodrow Wilson sent Marines ashore at Port-au-Prince on 28 July 1915, the day after President Vilbrun Guillaume Sam was killed by a crowd. The United States installed President Philippe Sudré Dartiguenave, took control of Haiti’s customs and finances by a treaty of 1915 and created a Gendarmerie officered by Marines. The cacos of the north were defeated in the First Caco War, ending with the fall of Fort Rivière on 17 November 1915. Forced road labour (the corvée) and a constitution of 1918 that let foreigners own land provoked a larger rising in 1918–1920 under Charlemagne Péralte and, after Marines killed him in 1919, Benoît Batraville. The Marines reported 2,250 to 3,250 Haitians killed in the fighting of 1915–1920; Haitian estimates of the dead of the whole occupation run to 15,000. After the killing of protesters at Marchaterre near Les Cayes in 1929 and the Forbes Commission, the United States handed back power, and the last Marines left on 15 August 1934; US control of Haiti’s finances lasted until 1947."
