  - title: Charlemagne Péralte and the Second Caco War
    date: 1917–1920
    when: "1919-10-07"
    borders: "1919-10-07"
    countries: [ht, us]
    body:
      - The occupation revived the corvée, an old Haitian law requiring peasants to work on the roads; Marines and gendarmes rounded up labourers, roped them together and shot some who fled, and for many Haitians it recalled slavery. In 1917 the National Assembly refused a new constitution that would let foreigners own land, and Butler dissolved it; a constitution drafted under the supervision of Franklin D. Roosevelt, then Assistant Secretary of the Navy, was approved in a controlled referendum in 1918.
      - In September 1918 Charlemagne Péralte of Hinche, a former army officer sentenced to hard labour for a raid on a Gendarmerie payroll, escaped and raised the cacos of the Central Plateau and the north, calling on Haitians to drive the occupiers into the sea. By 1919 he led several thousand armed men, and the rising had many more supporters; some estimates of its strength reach 40,000. In October 1919 his men attacked Port-au-Prince and were driven off. On the night of 31 October Marine Sergeant Herman Hanneken and Corporal William Button, disguised as cacos and guided by a paid informer, reached his camp near Sainte-Suzanne and shot him. The Marines distributed a photograph of his body tied to a door, which made him a martyr.
      - Benoît Batraville took over and led another attack on Port-au-Prince on 15 January 1920; he was killed in May 1920, and the rising ended. The Marines used aircraft against the cacos and their villages, and a US Navy inquiry and a Senate committee in 1921–1922 heard evidence of summary executions and other abuses. The commandant of the Marine Corps reported 2,250 Haitians killed in the fighting, and in another report 3,250; the Haitian historian Roger Gaillard estimated at least 15,000 Haitians killed during the occupation, combatants and civilians. The Americans lost a few dozen Marines and gendarmes.
    facts:
