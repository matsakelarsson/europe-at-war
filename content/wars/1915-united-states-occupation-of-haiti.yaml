notes:
  - "The Haitian presidents of the occupation, Dartiguenave (1915–1922) and Louis Borno (1922–1930), governed under American control, and the Gendarmerie d’Haïti, officered by Marines, fought the cacos with them; they are counted with the US side here. Many Haitians, and the cacos, saw the occupation as a return to foreign rule and the corvée as a return to slavery."
  - "Death tolls are disputed. In 1921 the commandant of the Marine Corps told the Senate that 2,250 Haitian rebels had been killed in 20 months of unrest, and gave 3,250 in a report to the Secretary of the Navy; Michel-Rolph Trouillot put the deaths in labour camps at about 5,500, and Roger Gaillard estimated at least 15,000 Haitians killed during the occupation. Most historians outside Haiti accept lower figures."
  - The occupation of the Dominican Republic (1916–1924) is told separately.
