  - title: Molard’s campaign
    date: February 1916 – 1917
    when: "1916-04"
    borders: "1916-09-30"
    countries: [bf, ml]
    body:
      - At its height in the spring of 1916 the rising covered an area as large as several French departments, and the coalition could gather 20,000 to 30,000 fighters. General Pineau, commander of the troops of French West Africa, gave Colonel Molard the task of crushing it. In February 1916 a column of 750 men with two machine-gun sections began a campaign of systematic destruction, and in April, when the rising was at its peak, two more columns were sent in. In all France used about 5,000 troops, mostly Senegalese tirailleurs and local auxiliaries, with six guns and four machine-gun units.
      - The French troops did not distinguish between fighters and civilians, and razed about 110 villages. The last armed resistance was crushed in September 1916, though small pockets held out until 1917, and the leaders who were caught were imprisoned or executed. At least 30,000 Africans died, against about 300 soldiers on the French side. After the war France split seven districts from Haut-Sénégal-Niger to form the colony of Upper Volta in 1919; the rising was the main reason for the change.
    facts:
