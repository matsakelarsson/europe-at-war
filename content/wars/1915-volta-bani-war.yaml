steps:
  - title: Bona
    date: November – December 1915
    when: "1915-11-17"
    borders: "1915-12-31"
    countries: [bf, ml]
    body:
      - On 17 November 1915, after the rainy season, people from about a dozen villages gathered at Bona, a village in the bend of the Black Volta some 50 km south of the French post of Dédougou, and resolved to fight the colonial government. The colony of Haut-Sénégal-Niger was then recruiting soldiers by force for the war in Europe, and resentment of conscription was the main reason for the rising; many also believed that France, weakened by the war, could be beaten.
      - In December the fighters of Bona and their allies, armed with bows, flintlocks and a few outdated repeating rifles, drove back a French column of 24 tirailleurs and 200 auxiliaries, and then a second column of about 800 men. News of the victories spread, and village after village joined, from the Marka and Bwa to the Samo, Minianka, Bobo, Nuna, Toussian, Sambla, Winiama and others. Villages that refused to join or sided with the French were attacked by the coalition.
    facts:
      - [Meeting at Bona, "17 November 1915"]
      - [French columns repulsed, "December 1915"]
