id: volta-bani-war
name: Volta-Bani War
start: "1915-11-17"
end: "1917"
tier: B
summary: "A war against French colonial rule in the lands between the Bani and the Black Volta rivers, in what are now western Burkina Faso and south-eastern Mali, in 1915–1917, during the First World War. It began when representatives of about a dozen villages met at Bona in November 1915 and resolved to take up arms; the heavy forced recruitment of soldiers for the war in Europe was the main grievance, and many believed the colonial government could be beaten while France was weak. The movement spread to around a thousand villages with up to 900,000 people, among them Marka, Bwa, Samo, Minianka, Bobo, Nuna and others, without any single leader or state. Armed mostly with bows and flintlocks, the coalition threw back the first two French columns. In 1916 France brought in about 5,000 troops, mostly West African tirailleurs and auxiliaries, with artillery and machine guns, and waged a campaign of systematic destruction until the last strongholds fell in September 1916; scattered resistance went on into 1917. At least 30,000 Africans were killed, many of them civilians, against about 300 on the French side, and more than a hundred villages were razed; there was also fighting between the coalition and villages that sided with the French or tried to stay out. It was one of the largest armed challenges to colonial rule anywhere in Africa, and led France to create the colony of Upper Volta, today Burkina Faso, in 1919."
countries: [bf, ml]
