notes:
  - "The name Volta-Bani War was coined by the anthropologists Mahir Saul and Patrick Royer in their study West African Challenge to Empire (2001); French officials at the time spoke of a revolt, and it is also known as Bona Kele. Figures for the coalition’s strength (20,000–30,000 fighters at its peak, perhaps 130,000 in all) and for the dead are estimates. The writer and politician Nazi Boni made the war the subject of the first Burkinabè novel, Crépuscule des temps anciens (1962)."
