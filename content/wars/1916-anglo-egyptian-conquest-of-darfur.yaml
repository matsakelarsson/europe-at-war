notes:
  - The campaign is known mainly from British reports and from Sudan government histories. The Fur casualties at Beringia are given as 231 dead in the official count and 261 by the historian M. W. Daly.
  - "Sources differ on when Darfur was formally made a province of Sudan: some give 1 January 1917, others 1 November 1917. Dar Masalit, on the border with French Chad, kept its own sultan under British protection."
