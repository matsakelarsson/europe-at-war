  - title: The death of Ali Dinar
    date: May – November 1916
    when: "1916-11-06"
    borders: "1916-11-06"
    countries: [sd]
    body:
      - Ali Dinar withdrew to the Jebel Marra mountains, about 80 km south-west of El Fasher, and then further west. Talks for his surrender broke down on 1 August, by which time most of his men had left him. In October Major Hubert Huddleston set out with about 200 men, mostly mounted infantry, defeated the sultan’s followers at Dibbis on 13 October, and occupied his camp at Kulme on 3 November.
      - Ali Dinar fled south-west to Jebel Juba. Huddleston’s column reached his camp at dawn on 6 November 1916 and opened fire; the sultan’s body was found shot through the head. Darfur was annexed to Anglo-Egyptian Sudan and governed by British district officers through local chiefs, and it remained among the poorest and least developed regions of the country.
    facts:
