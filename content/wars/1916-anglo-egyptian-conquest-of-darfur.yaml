steps:
  - title: The march on El Fasher
    date: March – May 1916
    when: "1916-05-22"
    borders: "1916-05-22"
    countries: [sd]
    body:
      - After the battle of Omdurman in 1898, Ali Dinar, a grandson of an earlier sultan who had been held at the Khalifa’s court, returned to El Fasher and rebuilt the Keira sultanate. The British let him rule as a tributary and left Darfur alone. He sent the yearly covering for the Kaaba to Mecca, kept ties with the Senussi order in Libya and with Wadai, and quarrelled with the French over Dar Masalit and Dar Sila on his western border. When the Ottoman Empire entered the First World War and the sultan-caliph called for holy war, Ali Dinar declared for the Ottomans in April 1915 and stopped paying tribute. The British feared a rising that could spread to Kordofan and link up with the Senussi, who attacked Egypt that winter.
      - Wingate assembled a force of about 2,000 men at En Nahud in Kordofan under Lieutenant-Colonel Philip Kelly, with camel corps, mounted infantry, Sudanese battalions, artillery and machine guns. It crossed the frontier on 16 March 1916, occupied the wells of Um Shanga and moved on by Jebel el-Hilla, while four aircraft of the Royal Flying Corps dropped leaflets over El Fasher and bombed Fur troops at Mellit.
      - On 22 May, at the village of Beringia on the approach to El Fasher, a Fur army of over 3,600 under Ramadan Ali attacked Kelly’s square from a long crescent of trenches and was beaten off by rifle, machine-gun and artillery fire; at least 231 Fur were killed and about 1,000 wounded, against five dead and 22 wounded on the Anglo-Egyptian side. The next morning Kelly’s mounted troops rode into El Fasher and found it almost deserted. Ali Dinar had left with about 2,000 men.
