id: anglo-egyptian-conquest-of-darfur
name: Anglo-Egyptian conquest of Darfur
start: "1916-03-16"
end: "1916-11-06"
tier: B
summary: "The conquest of the Sultanate of Darfur, the last independent state in what is now Sudan, by the Anglo-Egyptian government of Sudan during the First World War. Sultan Ali Dinar of the Keira dynasty had restored the sultanate after the fall of the Mahdist State in 1898 and paid a yearly tribute to Khartoum. In 1915, after the Ottoman sultan called for holy war against the Allies, he renounced his allegiance and made contact with the Ottomans through the Senussi in Libya. The governor-general, Reginald Wingate, sent about 2,000 men under Lieutenant-Colonel Philip Kelly, supported by four aircraft of the Royal Flying Corps. They crossed into Darfur on 16 March 1916, defeated the Fur army at Beringia on 22 May and entered El Fasher the next day. Ali Dinar fled to Jebel Marra and the west, and on 6 November 1916 a small force under Major Hubert Huddleston found him at Jebel Juba, where he was shot dead. Darfur was annexed to Anglo-Egyptian Sudan."
