steps:
  - title: The labour decree
    date: July 1916
    when: "1916-07-17"
    borders: "1916-07-17"
    countries: [uz, tj, kg, kz]
    body:
      - With its armies short of men after two years of war, the Russian government decided to call up men aged 19 to 43 from the Muslim peoples of Turkestan and the steppe, who had never been liable for military service, to dig trenches and work behind the front. Nicholas II signed the decree on 8 July 1916. It came in the middle of the harvest, with no preparation, and the local headmen who drew up the lists were accused of sparing the rich for bribes. It fell on a region already angry at the loss of land to Russian and Ukrainian settlers and at wartime requisitions and prices.
      - The first blood was shed at Khujand on 17 July, when police and soldiers fired on a crowd protesting outside the district office. Within days there were protests and clashes across the Ferghana Valley and in Tashkent, Andijan and Namangan. The most violent rising was in the Jizzakh district from 26 July, where rebels killed officials, cut the railway and telegraph and attacked Russian settlements, killing 83 settlers and carrying off 70. Martial law was declared on 30 July. A punitive force from Tashkent retook Jizzakh and Zaamin in August and destroyed many villages. The former war minister, General Aleksey Kuropatkin, was made governor-general of Turkestan and postponed the call-up to mid-September, but by then the revolt had spread to the steppe.
    facts:
      - [Labour decree, "8 July 1916 (25 June Old Style)"]
      - [First clash, "Khujand, 17 July 1916"]
      - [Jizzakh rising, "from 26 July 1916"]
