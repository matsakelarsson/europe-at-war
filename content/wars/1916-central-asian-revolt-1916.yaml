  - title: Semirechye and the Urkun
    date: August–October 1916
    when: "1916-08-21"
    borders: "1916-08-21"
    countries: [kg, kz, cn]
    body:
      - In Semirechye, in the Chu valley and around Lake Issyk-Kul, Kyrgyz and Kazakh herders had lost much of their best land to settlers in the years before the war. In the second week of August they rose in the Pishpek, Przhevalsk and Verny districts. Near Tokmak the rebels of the Chu valley proclaimed Kanaat Abukin their khan. Rebels cut the telegraph and the roads, seized weapons from army convoys and attacked post stations and settler villages, and in the Przhevalsk district Dungans joined in. With most settler men away at the front, many of the dead were women, children and old people. Kuropatkin reported 3,478 settlers dead or missing in the Przhevalsk district alone.
      - Troops brought in from the front, with Cossacks and settler militias, crushed the revolt by the end of September. Military courts sentenced rebels to death, soldiers and settlers burned villages and killed people without distinction, and in Przhevalsk settlers killed Kyrgyz and Dungan men held in the town. Kuropatkin planned to clear the Kyrgyz from the land around Issyk-Kul and in the Chu valley and give it to Russian settlers.
      - From September whole communities fled with their herds south over the Tian Shan into Chinese Xinjiang, by the Bedel pass at more than 4,000 metres, by the Torugart and by other passes. Thousands died of cold and hunger on the way or were shot by pursuing troops, and bones still lay along the Bedel route decades later. Kyrgyz call the flight the Urkun, “the exodus”. Estimates of the number who fled run to the hundreds of thousands.
    facts:
      - [Rising in Semirechye, "from about 21 August 1916"]
      - [Revolt put down, "late September – October 1916"]
      - [Settlers dead or missing, "3,478 in the Przhevalsk district (Kuropatkin, August 1916)"]
