  - title: Turgai, and the toll
    date: October 1916 – February 1917
    when: "1916-11-04"
    borders: "1916-11-04"
    countries: [kz, kg, tm]
    link: { href: "#/war/basmachi-movement", text: The Basmachi movement }
    body:
      - On the Kazakh steppe the call-up met resistance in every province. The longest rising was in Turgai, where the rebel clans chose Abdulgafar Zhanbosynov as their khan and Amangeldy Imanov as their military leader. In November they besieged the town of Turgai. Troops relieved it, but Imanov’s horsemen kept up a guerrilla war in the steppe through the winter. In Transcaspia, Yomut Turkmen also rose, and the last fighting there ended in January 1917. The February Revolution of 1917 brought down the government that had ordered the call-up, and the revolt died away.
      - Russian officials counted 2,325 settlers killed and 1,384 missing. Nobody counted the Central Asian dead. Estimates of those killed by troops and settlers or who died in flight, of hunger or of disease range from about 40,000, the figure of the Kyrgyz historian Shayyrkul Batyrbaeva, to 270,000, the estimate of the American historian Edward Sokol in 1954, and some writers give higher figures still. Kyrgyz historians reckon that up to 40 per cent of the Kyrgyz people died. Refugees who came back from China from 1917 found their land in settlers’ hands, and many died in the famine that followed.
      - Soviet historians long treated the revolt as either a national liberation struggle or a reactionary rising, and the killings were little discussed. In 2016 a public commission in Kyrgyzstan called the repression a genocide, which Russian officials rejected. The anger left by 1916 fed the Basmachi movement that followed the Russian Revolution.
    facts:
      - [Siege of Turgai, "November 1916"]
      - [Settlers, "2,325 killed and 1,384 missing (official figures)"]
      - [Central Asian dead, "estimates from about 40,000 to 270,000 or more"]
    markers:
      - kind: siege
        side: ru
        name: Torgay
        date: November 1916
        text: Rebels led by Amangeldy Imanov besieged the town of Turgai. Its garrison held out until troops arrived.
        lonlat: [63.5, 49.63]
