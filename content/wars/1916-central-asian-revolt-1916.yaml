id: central-asian-revolt-1916
name: Central Asian revolt of 1916
start: "1916-07-17"
end: "1917-02"
tier: B
summary: A rising against Russian rule in Turkestan and the Kazakh steppe, set off by a wartime decree of July 1916 that called up the region’s Muslim men, until then exempt from military service, for labour behind the front. Rebels killed officials and Russian settlers, above all in Semirechye. The army, Cossacks and settler militias put the revolt down with mass killings, and hundreds of thousands of Kyrgyz and Kazakhs fled across the Tian Shan into China, the flight Kyrgyz remember as the Urkun. Estimates of the Central Asian dead range from about 40,000 to 270,000 or more.
countries: [kz, kg, uz, tj, tm]
sides:
  - id: ru
    name: Russian Empire
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
  - id: reb
    name: Rebels
    polities: [rebels-1916]
    ink: orange
    moves: Rebel moves and flight
    success: Rebel success
notes:
  - Dates are New Style (Gregorian). Russian documents use the Julian calendar, then 13 days behind, so the decree is dated 25 June 1916 and the first clash at Khujand 4 July in Russian sources.
  - Towns are shown under their present names. Russian sources call Karakol Przhevalsk, Bishkek Pishpek, Almaty Verny and Torgay Turgai.
  - The number of dead is very uncertain. Russian officials counted settler deaths; nobody counted the Central Asians who were killed or who died in flight, of hunger or of disease, and modern estimates differ widely.
