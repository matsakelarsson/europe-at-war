id: easter-rising
name: Easter Rising
start: "1916-04-24"
end: "1916-04-29"
tier: B
summary: An armed rising in Ireland, centred on Dublin, in which Irish republicans proclaimed an Irish Republic in Easter Week 1916, while Britain was fighting the First World War. British forces crushed it within six days, but the execution of sixteen of its leaders and mass arrests turned much of Irish opinion towards the separatist cause.
