    moves: Rebel moves
    success: Rebel success
  - id: uk
    name: United Kingdom
    polities: [united-kingdom]
    ink: red
    moves: British moves
    success: British success
notes:
  - All of Ireland was then part of the United Kingdom of Great Britain and Ireland. Sackville Street in Dublin is today’s O’Connell Street, Kingstown is Dún Laoghaire, and Kingsbridge station is Heuston station.
  - Figures for the dead are those of the Glasnevin Trust’s count, as given in most recent accounts. The rebels’ strength in Dublin is usually put at about 1,250; others mobilised in the provinces but did little fighting.
