steps:
  - title: Easter Week
    date: 24 April – 12 May 1916
    when: "1916-04-24"
    borders: "1916-04-29"
    countries: [ie, gb]
    body:
      - A secret military council of the Irish Republican Brotherhood planned a rising for Easter 1916, while Britain was at war, and hoped for German arms. The plan went wrong at once. The Royal Navy intercepted the arms ship Aud off Kerry, and its crew scuttled it; Roger Casement, landed from a German submarine, was arrested; and Eoin MacNeill, chief of staff of the Irish Volunteers, cancelled the manoeuvres that were to have begun it. The council struck a day later, on Easter Monday, 24 April, with about 1,250 Volunteers, Irish Citizen Army men and women of Cumann na mBan.
      - They seized the General Post Office in Sackville Street, where Patrick Pearse read the Proclamation of the Irish Republic, and other strongpoints around central Dublin, but failed to take Dublin Castle, the railway stations or the ports. The British brought in troops from the Curragh, Belfast and Britain until they had more than 16,000 men. At Mount Street Bridge on 26 April a handful of Volunteers killed or wounded some 240 soldiers marching in from Kingstown. Artillery and the gunboat Helga shelled the city centre, the GPO was set on fire, and on 29 April Pearse surrendered unconditionally.
      - Of the 485 people killed, 260 were civilians, many hit by shellfire or caught in crossfire, and in North King Street soldiers killed fifteen men in their homes. Secret courts martial sentenced 90 people to death. Fourteen were shot at Kilmainham Gaol between 3 and 12 May, among them all seven signatories of the Proclamation; Thomas Kent was shot in Cork, and Casement was hanged in London in August. About 3,500 people were arrested and 1,800 interned or imprisoned in Britain. The executions turned opinion, and in the 1918 election Sinn Féin won 73 of Ireland’s 105 seats.
    facts:
      - [Rising begins, "Easter Monday, 24 April 1916"]
      - [Surrender, "29 April 1916"]
      - [Killed, "485: 260 civilians, 143 soldiers and police, 82 rebels, including the 16 executed"]
