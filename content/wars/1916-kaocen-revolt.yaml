  - title: Relief and reprisals
    date: March 1917 – 1920
    when: "1917-03-03"
    borders: "1917-03-03"
    countries: [ne, ly]
    body:
      - On 3 March 1917 a large French force sent from Zinder relieved the garrison of Agadez and went on to retake the towns of the Aïr. The French took heavy reprisals, above all against local marabouts, many of whom were not Tuareg and had not supported the rising; summary public executions in Agadez and In-Gall alone numbered 130. Kaocen’s fighters had also killed civilians. Tegama and many others who had joined the rising fled; the French brought back the sultan who had reigned before him to mediate with the people.
      - Kaocen withdrew north to the Tibesti and went on raiding French and local towns until he was driven into the Fezzan, where local forces hostile to the Senussi captured him and hanged him at Murzuq in 1919. Mokhtar Kodogo was killed by the French in 1920 while leading a rising among the Toubou and Fulbe in Damagaram. Tuareg nationalists remember Kaocen as a hero, and his name is a popular given name.
    facts:
      - [Agadez relieved, "3 March 1917"]
      - [Executions in Agadez and In-Gall, "130"]
      - [Kaocen hanged at Murzuq, "1919"]
    markers:
