id: kaocen-revolt
name: Kaocen revolt
start: "1916"
end: "1917-03"
tier: B
summary: "A Tuareg rising against French rule in the Aïr mountains of northern Niger in 1916–1917, during the First World War, led by Kaocen ag Mohammed (Kawsen), a noble of the Ikazkazan of the Kel Owey confederation and a follower of the Senussi order, which had declared a holy war against the French in October 1914. Many Tuareg had fought the French since the 1890s; others were driven to revolt by the drought of 1911–1914, by French taxes and the seizure of camels, and by the end of the slave trade and the revolt of the settled peoples who had paid them tribute. In the west, the Iwellemmeden Kel Ataram of the Ménaka region under their amenokal Fihirun (Firhoun) rose in 1914–1916 and were crushed with the help of the Kel Adagh. In December 1916 Kaocen, with more than 1,000 fighters, repeating rifles and a cannon taken from the Italians in Libya, laid siege to the French garrison of Agadez with the help of the sultan of Aïr, Tegama, defeated French relief columns and took the towns of the Aïr. A large French force from Zinder relieved Agadez on 3 March 1917 and retook the towns, with heavy reprisals; Kaocen withdrew north and was hanged by local forces at Murzuq in Libya in 1919. Tuareg remember the rising as part of a longer struggle against colonial rule and for self-government."
