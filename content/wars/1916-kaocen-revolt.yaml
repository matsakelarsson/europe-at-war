notes:
  - "Kaocen’s name is also written Kaosen and Kawsen, and the war is known in Niger as the Kawousan war. The main studies are by Finn Fuglestad (1973), Salifou (1973) and Kimba Idrissa (2003). Sources give few exact dates for the fighting in the Aïr between December 1916 and March 1917, and they differ on Fihirun’s rising, which some date to 1911 and others to 1914–1916."
