steps:
  - title: The Senussi call and Fihirun’s rising
    date: 1909–1916
    when: "1916"
    borders: "1916-06-30"
    countries: [ne, ml, td, ly]
    body:
      - Kaocen, born about 1880 in the Aïr, had joined the Senussi order and fought the French from at least 1909, raiding their columns in what is now eastern Niger and western Chad and taking part in the fighting in Borkou and Ennedi; defeated there in 1910, he withdrew to Ounianga and then to the Fezzan, the centre of Senussi power, where he gathered Tuareg and other nomads loyal to the order. In October 1914, soon after the outbreak of the First World War, the Senussi leadership declared a holy war against the French.
      - Further west, the Iwellemmeden Kel Ataram, the dominant Tuareg confederation of western Niger and eastern Mali, who had made peace with the French in 1903, rose in 1914 under their amenokal Fihirun around Ménaka. The French put the rising down by 1916 with the help of the Kel Adagh (Ifoghas) of the Adrar des Ifoghas, and afterwards divided the Kel Ataram among several chiefs of their own choosing.
    facts:
      - [Senussi declare holy war on France, "October 1914"]
      - [Fihirun’s rising, "1914–1916"]
    markers:
      - kind: event
        side: iw
        name: Ménaka
        date: 1914–1916
        text: Centre of Fihirun’s rising among the Iwellemmeden Kel Ataram.
        lonlat: [2.400, 15.917]
    areas:
      - style: outline
        side: fr
        label: Adrar des Ifoghas, whose Kel Adagh fought with the French
        atoms: [ML-8]
  - title: The siege of Agadez
    date: December 1916 – March 1917
    when: "1916-12-17"
    borders: "1916-12-31"
    countries: [ne]
    body:
      - Sultan Tegama of Aïr assured the French that the Tuareg confederations remained loyal, while he awaited Kaocen’s arrival. Kaocen and his brother Mokhtar Kodogo came south from the Fezzan with more than 1,000 fighters, armed with repeating rifles and a cannon taken from the Italians in Libya, and with Tegama’s help laid siege to the French garrison in Agadez on 17 December 1916.
      - The besiegers defeated several French relief columns and took all the main towns of the Aïr, among them In-Gall, Assodé and Aouderas. For more than three months the mountains and much of what is now northern Niger were under their control, while the French held out in the fort at Agadez.
    facts:
      - [Siege of Agadez begins, "17 December 1916"]
      - [Kaocen’s force, "more than 1,000 fighters"]
    markers:
      - kind: siege
        side: kc
        name: Agadez
