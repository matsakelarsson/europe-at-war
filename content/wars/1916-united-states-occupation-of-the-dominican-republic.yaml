  - title: The withdrawal
    date: 1920–1924
    when: "1924-09-18"
    borders: "1924-07-12"
    countries: [do, us]
    body:
      - Opposition to the occupation grew. The Unión Nacional Dominicana and the Junta Patriótica de Damas, founded in 1920 by women writers, campaigned at home and abroad, Latin American governments protested, and in the United States a Senate committee heard Dominican witnesses describe abuses. Warren G. Harding, who had campaigned against the occupations of Haiti and the Dominican Republic, proposed a withdrawal in 1921 on terms the Dominicans rejected; in June 1922 Secretary of State Charles Evans Hughes and the Dominican envoy Francisco J. Peynado agreed on a provisional government and elections.
      - Juan Bautista Vicini Burgos became provisional president in October 1922. Horacio Vásquez won the election of March 1924 and took office on 12 July, and the last American forces left on 18 September 1924. A convention of December 1924 kept the customs under American control until 1941, and the National Guard trained by the Marines became the power base of one of its officers, Rafael Trujillo, who seized power in 1930 and ruled until he was assassinated in 1961.
    facts:
      - [Hughes–Peynado agreement, "30 June 1922"]
      - [Vásquez takes office, "12 July 1924"]
      - [Last US forces leave, "18 September 1924"]
