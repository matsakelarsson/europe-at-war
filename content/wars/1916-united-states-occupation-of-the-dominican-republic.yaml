id: united-states-occupation-of-the-dominican-republic
name: United States occupation of the Dominican Republic
start: "1916-05-05"
end: "1924-09-18"
tier: B
summary: "The occupation of the Dominican Republic by the United States from 1916 to 1924. The country had been under an American customs receivership since 1905, and in 1916, with Dominican politics in turmoil and the First World War raising American fears of German influence, President Woodrow Wilson’s government demanded control of Dominican finances and armed forces. When the Secretary of War, Desiderio Arias, broke with President Juan Isidro Jimenes, US Marines landed at Santo Domingo on 5 May 1916; Jimenes resigned rather than accept American terms, and the Marines occupied the capital on 15 May. Colonel Joseph H. Pendleton’s Marines marched inland from Monte Cristi and Puerto Plata, defeated Arias’s men at Las Trencheras (27 June) and Guayacanas (3 July) and entered Santiago. When the provisional Dominican government still refused American demands, a US military government was proclaimed on 29 November 1916. It ruled by decree, built roads, disarmed the population and created a National Guard, while in the eastern sugar provinces guerrillas whom the Americans called gavilleros fought the Marines from 1917 to 1922. Under pressure at home and from Latin America, the United States agreed in 1922 to withdraw; Horacio Vásquez was elected president in 1924, and the last American forces left on 18 September 1924. The National Guard that the Marines trained became the base of Rafael Trujillo’s dictatorship from 1930."
