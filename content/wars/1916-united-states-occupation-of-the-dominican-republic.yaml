steps:
  - title: The landing and the march on Santiago
    date: May – November 1916
    when: "1916-05-15"
    borders: "1916-05-15"
    countries: [do, us]
    body:
      - Since 1905 the United States had collected the Dominican customs to pay the country’s foreign debts, under a convention confirmed in 1907, and in 1915–1916 it pressed President Juan Isidro Jimenes to accept American control of the finances and of a new constabulary. In April 1916 the Secretary of War, Desiderio Arias, broke with Jimenes and held the capital. On 5 May Marines landed at Santo Domingo, and on 7 May Jimenes resigned rather than accept American help on those terms. Rear Admiral William B. Caperton demanded that Arias disarm; Arias and his men left the city, and the Marines occupied it on 15 May.
      - On 1 June Colonel Joseph H. Pendleton’s Marines took Monte Cristi without a fight and Puerto Plata against about 500 of Arias’s men, then marched inland towards Arias’s base at Santiago. Arias’s men, armed mostly with old rifles, pistols and shotguns, dug in across the road. At Las Trencheras on 27 June Marine artillery and a bayonet charge cleared two lines of trenches, and at Guayacanas on 3 July machine guns drove off the defenders. Arias came to terms, and the Marines entered Santiago in early July.
      - The Dominican Congress chose Francisco Henríquez y Carvajal as provisional president, but he refused the American demands, and the United States withheld the customs revenue. On 29 November 1916 Captain Harry S. Knapp proclaimed a military government; US naval officers took over the ministries, and Congress was suspended. The same day Marines stormed the fort at San Francisco de Macorís, whose governor had refused to disarm.
    facts:
      - [Marines occupy Santo Domingo, "15 May 1916"]
      - [Las Trencheras and Guayacanas, "27 June and 3 July 1916"]
      - [Military government proclaimed, "29 November 1916"]
