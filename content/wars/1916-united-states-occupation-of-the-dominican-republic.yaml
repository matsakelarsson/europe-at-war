  - title: The military government and the gavilleros
    date: 1917–1922
    when: "1918"
    borders: "1919-01-01"
    countries: [do, us]
    body:
      - The military government ruled by decree and censored the press. It balanced the budget, built roads linking Santo Domingo with Santiago, Azua and San Pedro de Macorís, opened schools, disarmed the population and created a Guardia Nacional under Marine officers. A land registration law of 1920 helped American and other sugar companies gain title to land in the east, where many peasants lost the land they had farmed.
      - In the eastern provinces of El Seibo and San Pedro de Macorís, armed bands that the Americans called gavilleros fought the Marines from 1917 to 1922, led by men such as Vicente Evangelista, who surrendered in 1917 and was shot soon after “while trying to escape”, Ramón Natera and Martín Peguero. They lived among the peasants and cane workers, and the Marines answered with sweeps, the burning of villages, the detention of civilians and, in some cases, torture, which a US Senate committee investigated in 1921–1922; from 1919 they also used aircraft. The Marines in the country never numbered more than about 3,000. In 1921–1922, with an amnesty offered and the withdrawal in sight, most of the gavilleros laid down their arms.
    facts:
      - [Guerrilla war in the east, "1917–1922"]
      - [Marines in the country, "never more than about 3,000"]
      - [Losses usually cited, "about 950 insurgents killed or wounded; 144 Marines dead"]
