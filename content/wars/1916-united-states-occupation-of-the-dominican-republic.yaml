notes:
  - "The military government called the eastern guerrillas gavilleros, bandits, and treated them as criminals; Dominican historians see them as a peasant resistance to the occupation and to the sugar companies that were taking over the land of the east. Figures usually cited for the whole occupation are about 950 Dominican insurgents killed or wounded and 144 Marines dead."
  - "From 29 November 1916 to 1922 the country was governed by the US military government, with US naval officers in the cabinet posts and the Dominican Congress suspended; the steps show it as an occupation."
  - The occupation of Haiti (1915–1934), which overlapped it, and the US intervention of 1965 are told separately.
