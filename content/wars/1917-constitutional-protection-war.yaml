id: constitutional-protection-war
name: Constitutional Protection War
start: "1917-07"
end: "1922-06-16"
tier: C
summary: "A series of wars between the Beiyang government in Beijing and the southern provinces that rallied to Sun Yat-sen’s Constitutional Protection Movement, fought mainly in Hunan, Guangdong, Fujian and Sichuan. In 1917 the premier Duan Qirui, who had put down Zhang Xun’s twelve-day restoration of the Qing emperor in July, refused to recall the parliament dissolved in June or to restore the provisional constitution of 1912. Sun went to Guangzhou with part of the navy, and about a hundred members of the old parliament set up a military government there, with Sun as generalissimo (August–September 1917), backed by the Old Guangxi clique of Lu Rongting and the Yunnan clique of Tang Jiyao. Duan’s attempt to take Hunan failed in November 1917, but in March–April 1918 the Zhili commanders Cao Kun and Wu Peifu took Yuezhou, Changsha and Hengyang. Wu then halted, made a truce with the south and in May 1920 withdrew from Hunan. In the south the Guangxi generals pushed Sun aside in May 1918. In 1920 Chen Jiongming’s Guangdong Army returned from southern Fujian and drove the Guangxi clique out of Guangzhou (October 1920), and in 1921 it conquered Guangxi itself. The revived parliament in Guangzhou elected Sun “extraordinary president” in April 1921, but Chen opposed Sun’s plans for a northern expedition, and on 16 June 1922 his troops shelled Sun’s residence in Guangzhou; Sun escaped to a gunboat and later to Shanghai. Sun then turned to the Soviet Union for help, which led to the first united front with the Chinese Communist Party and the Whampoa Military Academy."
