        line: [[32.55, 46.55], [33.25, 46.72], [33.45, 46.66], [33.78, 46.72], [34.05, 47.0], [34.4, 47.5], [35.1, 47.8], [35.9, 47.55], [36.8, 47.3], [37.5, 47.1]]
  - title: "The end: Kronstadt, the famine and the USSR"
    date: 1921–1922
    when: "1921-03-01"
    borders: "1922-12-30"
    countries: [ru, ua]
    body:
      - With the Whites beaten, the Bolsheviks faced revolt from their own supporters. Peasants rose against grain requisitioning, most widely in Tambov province under Alexander Antonov, where the Red Army under Mikhail Tukhachevsky crushed them in 1921 with mass hostage-taking and poison gas. In March 1921 the sailors of Kronstadt, once heroes of the revolution, demanded free elections and soviets without Bolshevik control. After failed first assaults, Red troops crossed the ice of the Gulf of Finland and took the fortress on 18 March. Thousands of rebels were shot or imprisoned, and about 8,000 escaped across the ice to Finland.
      - The same month Lenin replaced requisitioning with a tax in kind, the start of the New Economic Policy. Drought and years of seizures brought a famine to the Volga region and southern Ukraine in 1921–1922 that killed about five million people, despite food aid from the American Relief Administration and others. In the Far East the Japanese left Vladivostok in October 1922. On 30 December 1922 Soviet Russia, Ukraine, Belarus and the Transcaucasian republic formed the Union of Soviet Socialist Republics. With terror, hunger and epidemics, the war had cost an estimated 7–12 million lives, and one to two million people had left the country.
    facts:
      - [Kronstadt rebellion, "1–18 March 1921"]
      - [Famine deaths, "about 5 million, 1921–1922"]
      - [Soviet Union founded, "30 December 1922"]
    markers:
      - kind: battle
        side: ru
        name: Kronstadt
        date: 7–18 March 1921
        text: Red troops attacked across the sea ice, and the fortress fell on 18 March after heavy losses on both sides.
        lonlat: [29.775, 59.991]
        lp: l
      - kind: event
        side: ru
        name: Tambov
        date: 1920–1921
        text: Centre of the largest peasant uprising of the war, led by Alexander Antonov and crushed by the summer of 1921.
        lonlat: [41.454, 52.723]
      - kind: event
        name: Samara
        date: 1921–1922
        text: Samara province on the Volga was among the regions worst hit by the famine.
        lonlat: [50.141, 53.203]
      - kind: event
        name: Moscow
        date: 30 December 1922
        text: The First Congress of Soviets of the USSR approved the treaty creating the Soviet Union, meeting in the Bolshoi Theatre.
        lonlat: [37.619, 55.76]
