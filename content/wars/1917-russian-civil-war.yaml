  - title: The Czechoslovak Legion and the Whites
    date: May – November 1918
    when: "1918-05-25"
    borders: "1918-08-07"
    countries: [ru]
    body:
      - About 40,000 Czech and Slovak soldiers, most of them former Austro-Hungarian prisoners of war, were travelling east along the Trans-Siberian Railway to sail from Vladivostok to the Western Front. After a brawl at Chelyabinsk in May 1918, Leon Trotsky, the commissar for war, ordered them disarmed, and the Legion rose instead, seizing the railway towns from the Volga to the Pacific. Behind its lines anti-Bolshevik governments formed, among them the Socialist Revolutionaries’ Komuch at Samara. In early August Czechoslovak and Komuch troops took Kazan, with much of the imperial gold reserve.
      - As the Legion neared Yekaterinburg, local Bolsheviks shot the former tsar Nicholas II, his wife, their five children and four servants in the cellar of the Ipatiev House on the night of 16–17 July. Trotsky rebuilt the Red Army with conscripts and former tsarist officers watched by political commissars, and it retook Kazan on 10 September and Samara in October. In the south the Volunteer Army lost Kornilov, killed outside Yekaterinodar in April, but took the city in August under Anton Denikin, while Don Cossacks besieged Tsaritsyn on the Volga. In November Admiral Alexander Kolchak seized power over the Whites in Siberia at Omsk.
    facts:
      - [Legion’s revolt, "late May 1918"]
      - [Kazan, "taken 7 August, retaken by the Reds 10 September 1918"]
      - [Romanovs killed, "Yekaterinburg, night of 16–17 July 1918"]
    markers:
      - kind: event
        side: cz
        name: Chelyabinsk
        date: May 1918
        text: A clash with Hungarian prisoners at the station led to Trotsky’s order to disarm the Legion, which refused and turned on the Bolsheviks.
        lonlat: [61.376, 55.155]
      - kind: taken
        side: cz
        name: Samara
        date: 8 June 1918
        text: Taken by the Legion. The Committee of Members of the Constituent Assembly (Komuch) set up its government here.
        lonlat: [50.141, 53.203]
      - kind: taken
        side: cz
        name: Kazan
        date: 7 August 1918
        text: Czechoslovak and Komuch troops, with Vladimir Kappel, took the city and much of the imperial gold reserve stored there.
        lonlat: [49.109, 55.796]
      - kind: held
        side: ru
        name: Sviyazhsk
        date: August – September 1918
        text: Trotsky arrived here by armoured train to stop the retreat from Kazan and prepare the counter-attack that retook the city.
        lonlat: [48.653, 55.77]
        lp: l
      - kind: event
        name: Ipatiev House
        date: 16–17 July 1918
        text: The former tsar and his family were shot here, eight days before the Czechoslovaks and Whites took Yekaterinburg.
        lonlat: [60.61, 56.844]
      - kind: battle
        side: ru
        name: Yekaterinodar
        date: 9–13 April 1918
        text: Kornilov was killed by a shell during the Volunteer Army’s failed assault. Denikin’s army took the city in August.
        lonlat: [38.967, 45.033]
      - kind: held
        side: ru
        name: Tsaritsyn
        date: July 1918 – February 1919
        text: Held by the Reds, with Joseph Stalin among its defenders, against the Don Cossacks of Pyotr Krasnov. The city was later renamed Stalingrad.
        lonlat: [44.515, 48.709]
    arrows:
      - side: cz
        label: Kappel
