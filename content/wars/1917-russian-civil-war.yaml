        lonlat: [30.314, 59.94]
      - kind: battle
        side: ru
        name: Moscow
        date: 7–15 November 1917
        text: A week of street fighting between Bolshevik forces and officer cadets loyal to the Provisional Government. The city became the Soviet capital in March 1918.
        lonlat: [37.618, 55.751]
      - kind: treaty
