steps:
  - title: October 1917 and Brest-Litovsk
    date: November 1917 – March 1918
    when: "1917-11-07"
    borders: "1918-03-03"
    countries: [ru, ua, by, ee, lv]
    body:
      - On the night of 6–7 November 1917, 24–25 October in the Russian calendar of the time, the Bolsheviks’ Military Revolutionary Committee seized Petrograd’s bridges, stations and telegraph office, and then the Winter Palace, where the ministers of Alexander Kerensky’s Provisional Government were arrested. A Congress of Soviets approved a new government, the Council of People’s Commissars under Vladimir Lenin. In Moscow the Bolsheviks won only after a week of street fighting. Elections to a Constituent Assembly gave the Socialist Revolutionaries the most votes, and when the Assembly met in January 1918 the Bolsheviks dispersed it after a single day.
      - Lenin wanted peace with the Central Powers almost at any price. When talks at Brest-Litovsk stalled, German and Austro-Hungarian armies advanced from 18 February 1918 against little resistance, taking Minsk, Tallinn and Pskov and entering Kyiv on 1 March. In the treaty signed on 3 March, Soviet Russia gave up Poland, Lithuania and Courland, left Livonia and Estonia under German occupation, and recognised Finland and Ukraine, lands with about a third of the old empire’s population. The government moved to Moscow. On the Don, former tsarist generals were raising a Volunteer Army, which set out in February on its “Ice March” into the Kuban.
    facts:
      - [October Revolution, "7 November 1917 (25 October Old Style)"]
      - [Constituent Assembly dispersed, "19 January 1918"]
      - [Treaty of Brest-Litovsk, "3 March 1918"]
