    success: Central Powers success
notes:
  - Russia used the Julian (Old Style) calendar until 31 January 1918, which was followed by 14 February. The October Revolution of 25 October Old Style fell on 7 November New Style. Dates here are New Style.
  - The map shows European Russia and the Urals. The war in Siberia and the Far East, where Kolchak governed from Omsk and Japanese and American troops held Vladivostok, is described in the text.
  - The base map does not follow the moving fronts. Front lines are approximate, drawn from general accounts.
  - The Polish–Soviet War, the Finnish Civil War and the wars of independence of Estonia, Latvia and Lithuania have their own entries.
