id: russian-civil-war
name: Russian Civil War
start: "1917-11-07"
end: "1922-10-25"
tier: A
summary: A war for control of the former Russian Empire after the Bolshevik seizure of power in November 1917, fought between the Red Army and the anti-Bolshevik Whites, with peasant armies, national movements and foreign troops drawn in. The Reds had won in European Russia by the end of 1920 and in the Far East by 1922; with terror, famine and epidemics the war cost an estimated 7–12 million lives, most of them civilians, and ended in the founding of the Soviet Union.
countries: [ru, ua]
