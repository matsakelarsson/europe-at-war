  - title: "1920: Wrangel and the Crimea"
    date: March – November 1920
    when: "1920-03-26"
    borders: "1920-11-16"
    countries: [ua, ru]
    link: { href: "#/war/polish-soviet-war", text: The Polish–Soviet War }
    body:
      - Denikin’s armies fell back to the Black Sea in the winter of 1919–1920, and in late March tens of thousands of troops and refugees were shipped from Novorossiysk to the Crimea in chaos, leaving thousands behind. Denikin resigned, and Wrangel took command of what was left. While the Red Army was fighting Poland, Wrangel broke out of the Crimea in June 1920 into Northern Taurida, the grain lands north of the peninsula, and promised land to the peasants. The Reds held a bridgehead across the Dnieper at Kakhovka, where the fighting came close to the trench battles of the World War.
      - After the armistice with Poland in October, Frunze’s Southern Front, with Makhno’s insurgents as temporary allies, attacked the Crimea. On the night of 7–8 November Red troops crossed the shallow Sivash lagoon in freezing wind to outflank the fortified Perekop isthmus, and by 11 November the White lines had broken. Wrangel had prepared an evacuation, and between 13 and 16 November about 146,000 soldiers and civilians left the Crimean ports on 126 ships for Constantinople. In the months that followed, the Cheka shot former White soldiers and civilians in the Crimea; estimates of the dead run from about 12,000 to more than 50,000.
    facts:
      - [Kakhovka bridgehead, "August – October 1920"]
      - [Crossing of the Sivash, "night of 7–8 November 1920"]
      - [Evacuated from the Crimea, "about 146,000 people on 126 ships"]
    markers:
      - kind: event
        name: Novorossiysk
        date: 26–27 March 1920
        text: Denikin’s forces were shipped to the Crimea amid panic. Thousands of soldiers and refugees left on the quays were captured or killed.
        lonlat: [37.77, 44.72]
      - kind: held
        side: ru
        name: Kakhovka
        date: August – October 1920
        text: The Red bridgehead on the left bank of the Dnieper held against repeated attacks by Wrangel’s troops and tanks.
        lonlat: [33.475, 46.798]
      - kind: battle
        side: ru
        name: Perekop
        date: 8–11 November 1920
        text: Red troops stormed the Turkish Wall across the isthmus after others had outflanked it through the Sivash.
        lonlat: [33.693, 46.162]
        lp: l
      - kind: battle
        side: ru
        name: Chonhar
        date: 11–12 November 1920
        text: Red troops forced the crossings on the eastern route into the Crimea.
        lonlat: [34.546, 46.031]
      - kind: event
        side: wh
        name: Sevastopol
        date: 14 November 1920
        text: The main port of the evacuation. Wrangel’s fleet sailed for Constantinople and was later interned at Bizerte in Tunisia.
        lonlat: [33.523, 44.605]
    arrows:
