  - title: The Red Terror and the intervention
    date: 1918–1919
    when: "1918-09-05"
    borders: "1918-12-31"
    countries: [ru, ua]
    body:
      - On 30 August 1918 a young officer cadet shot Moisei Uritsky, head of the Petrograd Cheka, and the same day Lenin was badly wounded by shots blamed on the Socialist Revolutionary Fanny Kaplan. On 5 September the government decreed a Red Terror. The Cheka, the political police under Felix Dzerzhinsky, shot hostages and “class enemies” and set up concentration camps; 10,000–15,000 people were executed in the first two months alone, and estimates for the whole war run from about 50,000 to 200,000 or more. White forces also shot prisoners and suspected Bolsheviks, and in Ukraine soldiers of several armies, most often Ukrainian nationalist troops, murdered tens of thousands of Jews in pogroms.
      - The Allies first landed to keep war supplies from the Germans and to revive the Eastern Front, and after Germany’s defeat they stayed to help the Whites. British marines landed at Murmansk in March 1918, and British, French and American troops at Arkhangelsk in August. Japanese and American troops occupied Vladivostok, the Japanese eventually with some 70,000 men, and French and Greek troops held Odessa from December 1918 to April 1919. The Allies sent the Whites large stocks of weapons, but their own soldiers fought only in a few places, mainly in the north. Most had left by the end of 1919; the Japanese stayed in the Far East until 1922.
    facts:
      - [Red Terror decreed, "5 September 1918"]
      - [Executions, "estimates from about 50,000 to 200,000 or more"]
      - [Jews killed in pogroms, "estimates from about 35,000 to 250,000, 1918–1920"]
    markers:
      - kind: event
        name: Moscow
        date: 30 August 1918
        text: Lenin was shot and badly wounded after a speech at a factory. The Red Terror was decreed six days later.
        lonlat: [37.618, 55.751]
      - kind: event
        name: Petrograd
        date: 30 August 1918
        text: Uritsky was assassinated outside the headquarters of the city’s Cheka. Hundreds of hostages were shot in reprisal.
        lonlat: [30.31, 59.94]
      - kind: event
        side: al
        name: Murmansk
        date: March 1918
        text: British marines landed to guard Allied war stores and the railway south, at first with the agreement of the local soviet.
        lonlat: [33.075, 68.971]
      - kind: taken
        side: al
        name: Arkhangelsk
        date: 2 August 1918
        text: Allied troops landed after an anti-Bolshevik coup and fought along the Northern Dvina until they withdrew in the autumn of 1919.
        lonlat: [40.538, 64.543]
      - kind: event
        side: al
        name: Odessa
        date: December 1918 – April 1919
        text: French and Greek troops held the port until a Red advance and unrest in their own ranks led to a hurried evacuation.
        lonlat: [30.733, 46.484]
      - kind: event
        name: Proskurov
        date: 15 February 1919
        text: Soldiers of the Ukrainian People’s Republic murdered at least 1,500 Jews here in a few hours, one of the worst pogroms of the war.
        lonlat: [27.0, 49.417]
    arrows:
      - side: al
        label: Along the Dvina
        via: [[40.55, 64.5], [41.9, 63.6], [43.3, 62.7]]
  - title: "1919: Kolchak, Denikin and Yudenich"
    date: March – November 1919
    when: "1919-03-04"
    borders: "1919-10-14"
    countries: [ru, ua, ee]
    body:
      - In 1919 the Whites attacked from three sides. In March Kolchak’s armies advanced from Siberia across the Urals, took Ufa and came within reach of the Volga, but a Red counter-offensive under Mikhail Frunze retook Ufa on 9 June and Yekaterinburg and Chelyabinsk in July. In the south Denikin’s Armed Forces of South Russia, supplied by Britain, took Kharkiv and, under Pyotr Wrangel, Tsaritsyn at the end of June. On 3 July Denikin ordered an advance on Moscow. His armies took Kyiv, Kursk and Voronezh, and on 14 October entered Oryol, about 360 km from the capital.
      - In October Nikolai Yudenich’s Northwestern Army, based in Estonia, reached Gatchina and the Pulkovo Heights on the edge of Petrograd before Trotsky rallied the city’s defence and drove it back. In the south the Reds, who held the railway hub of central Russia and more men, counter-attacked. They retook Oryol on 20 October, and Semyon Budyonny’s cavalry took Voronezh on 24 October, while behind the White lines Nestor Makhno’s anarchist insurgents cut supply routes in Ukraine. Kolchak lost Omsk on 14 November; handed over at Irkutsk, he was shot by the Bolsheviks there on 7 February 1920.
    facts:
      - [Denikin’s Moscow directive, "3 July 1919"]
      - [Oryol, "taken by the Whites 14 October, retaken 20 October 1919"]
      - [Kolchak shot, "Irkutsk, 7 February 1920"]
    markers:
      - kind: taken
        side: wh
        name: Ufa
        date: March 1919
        text: Kolchak’s Western Army took the city at the start of its spring offensive. The Reds retook it on 9 June.
        lonlat: [55.947, 54.726]
      - kind: taken
        side: ru
        name: Yekaterinburg
        date: 14 July 1919
        text: Retaken by the Red Army as Kolchak’s forces fell back east of the Urals.
        lonlat: [60.613, 56.836]
      - kind: taken
        side: wh
        name: Tsaritsyn
        date: end of June 1919
        text: Wrangel’s Caucasian Army took the city, using tanks supplied by the British.
        lonlat: [44.515, 48.709]
      - kind: taken
        side: wh
        name: Kyiv
        date: 31 August 1919
        text: Denikin’s troops entered the city and forced out the Ukrainian republican forces that had reached it at the same time.
        lonlat: [30.523, 50.45]
      - kind: battle
        side: ru
        name: Oryol
        date: 14–20 October 1919
        text: The furthest point of the White advance on Moscow. The Reds retook the city after six days.
        lonlat: [36.069, 52.969]
      - kind: taken
        side: ru
        name: Voronezh
        date: 24 October 1919
        text: Budyonny’s cavalry beat the Cossacks of Konstantin Mamontov and Andrei Shkuro and took the city.
        lonlat: [39.211, 51.672]
      - kind: taken
        side: wh
        name: Gatchina
        date: 16 October 1919
        text: Taken by Yudenich’s army on its advance on Petrograd.
        lonlat: [30.133, 59.583]
        lp: l
      - kind: held
        side: ru
        name: Pulkovo Heights
        date: 20–21 October 1919
        text: The Northwestern Army came within sight of Petrograd here before being driven back to the Estonian border.
        lonlat: [30.326, 59.772]
