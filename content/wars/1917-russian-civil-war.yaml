        date: 3 March 1918
        text: Signed in the fortress, then the German eastern headquarters. Germany’s defeat in November 1918 voided it.
        lonlat: [23.658, 52.082]
      - kind: taken
        side: de
        name: Pskov
        date: 24 February 1918
        text: Taken in the German advance of February 1918, which met little organised resistance from the disintegrating Russian army.
        lonlat: [28.333, 57.817]
      - kind: taken
        side: de
        name: Kyiv
