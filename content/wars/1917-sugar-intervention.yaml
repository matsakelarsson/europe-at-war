id: sugar-intervention
name: Sugar Intervention
start: "1917-02-12"
end: "1922-02-15"
tier: C
summary: "The American military presence in eastern Cuba from 1917 to 1922. In November 1916 the Conservative president Mario García Menocal was re-elected in an election the Liberals said had been stolen, and on 11 February 1917 the Liberals rose under the former president José Miguel Gómez in the revolt called La Chambelona, after the Liberal campaign song; Alfredo Zayas, Gerardo Machado and Gómez’s son Miguel Mariano Gómez were among its leaders, and Liberal forces took up arms in Las Villas, Camagüey and Oriente. The United States announced that it would not recognise a government that took power by force, and from 12 February, at the request of American sugar planters, American sailors and then marines landed at Guantánamo, Santiago and other ports of Oriente to guard estates, mines and railways. Government troops defeated Gómez’s column near Placetas in Las Villas and captured him with his son and his escort at Caicaje on 8 March 1917. Fighting went on in Camagüey and Oriente into the spring, and by mid-1917 the revolt had been crushed; Menocal later pardoned the prisoners, Gómez after eleven months in prison. After the United States entered the First World War in April 1917, with Cuba declaring war on Germany the next day, the marines stayed, officially to train in a warm climate and to protect the sugar harvest the Allies depended on; the first contingent of under 1,000 arrived in August 1917, and more followed in 1918, among them 1,120 marines who reached Guantánamo in December. After a further disputed election in 1920 President Woodrow Wilson sent General Enoch Crowder, who arrived in January 1921 and for two years advised, and pressed, the Cuban government on its elections and finances. By 15 February 1922 the only American forces left in Cuba were at Guantánamo Bay."
