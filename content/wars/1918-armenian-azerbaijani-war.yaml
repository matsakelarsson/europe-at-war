id: armenian-azerbaijani-war
name: Armenian–Azerbaijani War
start: "1918-05-28"
end: "1920-11-29"
tier: C
summary: A war between the newly independent republics of Armenia and Azerbaijan over the mixed borderlands of Karabakh, Zangezur and Nakhchivan, in which both sides massacred and expelled civilians. It ended when the Red Army occupied Azerbaijan in April 1920 and Armenia that November; Soviet rule later placed Nagorno-Karabakh and Nakhchivan in Azerbaijan and Zangezur in Armenia.
countries: [am, az]
sides:
  - id: am
    name: Armenia
    polities: [armenia]
    ink: orange
  - id: az
    name: Azerbaijan
    polities: [azerbaijan]
    ink: teal
notes:
  - Among the worst killings were the March Days of 1918, when Bolshevik and Armenian forces in Baku killed thousands of Muslims, the killing of Armenians when Ottoman and Azerbaijani forces took Baku in September 1918, and the Shusha massacre of March 1920.
  - The Ottoman Army of Islam fought alongside Azerbaijan in 1918, and British troops occupied Baku and oversaw Karabakh from November 1918 to August 1919.
  - The numbers of victims are disputed. Estimates for the Shusha massacre range from about 500 to 30,000, depending on the source and the area counted, and for the killing of Armenians in Baku in September 1918 from about 10,000 to 20,000.
