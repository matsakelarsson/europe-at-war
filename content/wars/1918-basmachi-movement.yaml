  - title: The long end
    date: 1923–1934
    when: "1923-07"
    borders: "1929-04"
    countries: [tj, uz, tm, kg, af]
    body:
      - A Soviet offensive in the summer of 1923 drove the Basmachi out of Garm, and by 1924 Kurshirmat had given up in Ferghana and left for Afghanistan. Junaid Khan besieged Khiva in January 1924 but was driven off. In the national delimitation of October 1924 Bukhara and Khorezm were divided between the new Uzbek and Turkmen Soviet republics and the Tajik autonomous republic. In June 1926 Ibrahim Bek crossed into Afghanistan. The war had emptied eastern Bukhara; some 200,000 people had fled the Tajik lands, leaving two-thirds of the farmland abandoned.
      - From northern Afghanistan, where Ibrahim Bek settled with thousands of refugees around Kunduz, the exiles raided across the Amu Darya. In April 1929 Fuzail Maksum’s men crossed the Panj and held Garm for a day. That month a Soviet force under Vitaly Primakov, dressed as Afghans, crossed from Termez and took Mazar-i-Sharif, officially to help the deposed King Amanullah, before withdrawing in June; another Soviet raid struck the exiles’ camps in 1930. Collectivisation of farming set off new revolts, and Ibrahim Bek came back to Tajikistan in 1931, but he was taken by Tajik villagers in June and shot on 31 August. The last large bands were broken up in the Karakum desert in 1933, and the movement had ended by 1934.
      - Soviet histories presented the Basmachi as bandits and tools of foreign powers. Since independence they have been reassessed in Central Asia, where some see them as fighters for freedom and their faith; historians stress that the bands had no common programme and fought above all to defend their way of life against Soviet rule.
    facts:
      - [Garm retaken, "summer 1923"]
      - [Ibrahim Bek to Afghanistan, "June 1926"]
      - [Soviet raid into Afghanistan, "April–June 1929"]
      - [Ibrahim Bek captured, "June 1931; shot 31 August 1931"]
