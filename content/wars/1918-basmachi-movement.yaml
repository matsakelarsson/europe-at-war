id: basmachi-movement
name: Basmachi movement
start: "1918-02"
end: "1934"
tier: B
summary: An armed resistance to Soviet rule in Central Asia, made up of many separate bands rather than one organisation. It began in the Ferghana Valley after Soviet troops sacked Kokand, the seat of the short-lived Turkestan Autonomy, in February 1918, and spread to Bukhara and Khiva after the Red Army overthrew their rulers in 1920. The former Ottoman war minister Enver Pasha led part of it until he was killed in 1922. Red Army offensives, religious and economic concessions and war-weariness broke the movement by the mid-1920s, but exiles raided from Afghanistan and the collectivisation of farming set off new revolts until the early 1930s.
countries: [uz, tj, kg, tm, af]
