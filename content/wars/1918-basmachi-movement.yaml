    ink: red
    moves: Red Army moves
    success: Soviet success
notes:
  - “Basmachi” comes from a Turkic word for raider or bandit. It was the Soviet name for the rebels, who called themselves mujahidin or followed their own commanders (kurbashi). Some sources date the movement from the revolt of 1916, which has its own entry; the fighting described here began in 1918.
  - Estimates of the dead are uncertain. The sack of Kokand alone is said to have killed between 10,000 and 25,000 people, and some 200,000 people fled the Tajik lands in the early 1920s.
