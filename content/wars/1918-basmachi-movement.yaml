  - title: Enver Pasha in eastern Bukhara
    date: 1920–1922
    when: "1921-11"
    borders: "1922-06"
    countries: [tj, uz, tm, af]
    link: { href: "#/war/bukhara-operation-1920", text: The Soviet conquest of Khiva and Bukhara }
    body:
      - The Red Army’s overthrow of the khan of Khiva and the emir of Bukhara in 1920 spread the war. In Khorezm, Junaid Khan’s Turkmen raided from the Karakum desert. In eastern Bukhara, the emir’s followers fought on under Ibrahim Bek, a chief of the Lakai Uzbeks, while the emir directed them from exile in Afghanistan. Some Young Bukharans who had helped the Soviets, disappointed by Russian control of their republic, went over to the rebels.
      - In November 1921 Enver Pasha, the former Ottoman war minister and one of the main organisers of the Armenian genocide, arrived in Bukhara, sent by the Soviets, who hoped to use him. Within weeks he had gone over to the rebels. With Basmachi bands he took Dushanbe in February 1922 and styled himself commander-in-chief of the armies of Islam. His pan-Turkic aims meant little to most of the rebels, and Ibrahim Bek refused to serve under him. When Enver demanded in May that the Red Army leave Turkestan, Moscow sent reinforcements and aircraft, and at the same time gave back religious endowments, sharia courts and Quran schools and offered an amnesty. Defeated at Kafrun in June, Enver was driven east and was killed leading a cavalry charge near Baljuvon on 4 August 1922.
    facts:
