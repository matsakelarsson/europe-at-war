steps:
  - title: Kokand and the Ferghana Valley
    date: 1918–1920
    when: "1918-02-19"
    borders: "1918-03"
    countries: [uz, kg, tj]
    body:
      - After the October Revolution the Tashkent Soviet, run by Russian railway workers and soldiers, refused to share power with the Muslim majority; its leader Fyodor Kolesov declared that taking Muslims into the government was “unacceptable at the present time”. In reply a Muslim congress at Kokand proclaimed the Turkestan Autonomy on 27 November 1917. In February 1918 Red Guards from Tashkent, with Armenian Dashnak volunteers, stormed Kokand and sacked it. Estimates of the townspeople killed range from about 10,000 to 25,000. Ergash, the autonomy’s last commander, a former police chief, escaped to the countryside and began the armed resistance. Grain requisitions and famine drove thousands to join him.
      - By the end of 1918 bands totalling perhaps 20,000 men held much of the Ferghana countryside. Their leaders were rivals. Madamin Bek of Margilan, the most moderate, made an alliance in 1919 with Konstantin Monstrov’s Peasant Army, a militia of Russian settlers who had turned against the Bolsheviks, and the allies took Osh and Jalal-Abad and besieged Andijan in September. After the defeat of Admiral Kolchak opened the railway from Russia, Mikhail Frunze’s Turkestan Front brought in fresh troops, among them Volga Tatar units. Monstrov’s men made peace in January 1920 and Madamin Bek went over to the Soviets in March; he was killed by rival rebels soon after. When the Soviets began requisitioning food and calling up Muslims that summer, a new revolt broke out under Kurshirmat.
    facts:
      - [Turkestan Autonomy, "27 November 1917 – February 1918"]
      - [Kokand sacked, "February 1918"]
      - [Madamin Bek goes over to the Soviets, "March 1920"]
