  - title: Pskov and Cēsis
    date: May – July 1919
    when: "1919-05-13"
    borders: "1919-07-03"
    countries: [ee, lv, ru]
    body:
      - In the spring the Red Army attacked again along the Narva river and in the south-east, and Narva was heavily shelled, but the Estonian lines held. On 13 May the White Russian Northern Corps, based in Estonia and under Estonian command, went on the offensive along the Gulf of Finland, and Estonian forces took Pskov on 25 May. Estonian divisions also advanced into northern Latvia as the Red Army withdrew. There they met a new enemy, the Baltische Landeswehr of Baltic Germans and the German Iron Division under General Rüdiger von der Goltz, which had taken Riga on 22 May and was pushing north.
      - The Germans attacked Estonian armoured trains on 5 June and took Cēsis the next day. After a short truce, the Iron Division and the Landeswehr attacked the Estonian 3rd Division and the North Latvian Brigade near Cēsis on 19 June. On 23 June the Estonians and Latvians counter-attacked, took Cēsis and drove the Germans back towards Riga; the day is Estonia’s Victory Day. On 3 July, with Estonian troops on the outskirts of Riga, an armistice was signed at Strazdumuiža under Allied pressure, and Kārlis Ulmanis’s Latvian government returned to Riga a few days later.
    facts:
      - [Pskov taken, "25 May 1919"]
      - [Battle of Cēsis, "19–23 June 1919, Estonian and Latvian victory"]
      - [Armistice of Strazdumuiža, "3 July 1919"]
    markers:
      - kind: held
        side: ee
        name: Narva
        date: spring 1919
        text: Soviet shelling left about 2,000 people homeless, but the Estonian 1st Division and the Northern Corps held the town.
        lonlat: [28.196, 59.376]
      - kind: taken
        side: ee
        name: Pskov
        date: 25 May 1919
        text: Estonian troops took the city and left it to the Northern Corps. The Red Army retook it in August.
        lonlat: [28.333, 57.817]
      - kind: battle
        side: ee
        name: Battle of Cēsis
        date: 19–23 June 1919
        text: Estonian and Latvian troops beat the Landeswehr and the Iron Division, ending German hopes of controlling Latvia.
        lonlat: [25.275, 57.313]
      - kind: taken
        side: lw
        name: Riga
        date: 22 May 1919
        text: Taken from the Soviets by the Landeswehr and the Iron Division, who then shot suspected Bolsheviks, by different counts from under 200 to several thousand.
        lonlat: [24.106, 56.949]
        lp: b
      - kind: treaty
        name: Strazdumuiža
        date: 3 July 1919
        text: The armistice on Riga’s outskirts required the German troops to leave Latvia; many of them did not.
        lonlat: [24.2, 57.0]
        lp: t
