id: estonian-war-of-independence
name: Estonian War of Independence
start: "1918-11-28"
end: "1920-02-02"
tier: B
summary: A war in which the newly proclaimed Republic of Estonia, helped by Finnish volunteers and the British navy, drove out the Red Army in 1918–1919 and defeated the Baltic German Landeswehr in northern Latvia. It ended with the Treaty of Tartu of 2 February 1920, in which Soviet Russia recognised Estonia’s independence in perpetuity.
