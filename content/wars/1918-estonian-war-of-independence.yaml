notes:
  - Known in Estonia as the War of Independence or War of Liberation (Vabadussõda). Dates are New Style.
  - Places in Latvia are named in Latvian. The Battle of Cēsis is Võnnu lahing in Estonian. Petseri is today Pechory in Russia.
  - The front line is approximate, drawn from general accounts.
