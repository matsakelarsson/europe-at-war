steps:
  - title: The Red invasion and the counter-attack
    date: November 1918 – February 1919
    when: "1918-11-28"
    borders: "1919-02-24"
    countries: [ee, ru, lv]
    body:
      - Estonia had declared independence on 24 February 1918, a day before German troops entered Tallinn, and its Provisional Government took over only as the Germans began to leave in November. On 28 November the Red Army attacked Narva, where Estonian Bolsheviks proclaimed the Estonian Workers’ Commune. Soviet forces, many of them Latvian Riflemen, took Valga and Tartu at Christmas and by early January stood about 34 km from Tallinn. The new Estonian army, short of men and weapons, relied on volunteers, armoured trains and outside help. A British squadron reached Tallinn on 31 December with rifles and guns, and Finnish volunteers arrived from early January.
      - Under Colonel Johan Laidoner, the Estonians counter-attacked on 7 January 1919. Armoured trains and partisan units retook Tartu on 14 January, and Narva fell on 18 January after Estonian and Finnish troops landed behind the Soviet lines at Utria. At Paju near Valga on 31 January, Julius Kuperjanov’s partisans and Finnish volunteers drove back the Red Latvian Riflemen in a hard fight in which Kuperjanov was mortally wounded. By late February the Red Army had been pushed out of almost all of Estonia, and the front settled along the Narva river and the south-eastern border.
    facts:
      - [Soviet attack on Narva, "28 November 1918"]
      - [Estonian counter-offensive, "from 7 January 1919"]
      - [Battle of Paju, "31 January 1919, Estonian victory"]
