  - title: Narva and the Treaty of Tartu
    date: October 1919 – February 1920
    when: "1919-10-10"
    borders: "1920-02-02"
    countries: [ee, ru]
    body:
      - In October 1919 Nikolai Yudenich’s Northwestern Army advanced from Estonia on Petrograd, while Estonian forces attacked the coastal fort of Krasnaya Gorka, but the Whites were beaten back in November and fled to the Estonian border, where they were disarmed and interned; thousands of soldiers and refugees died of typhus that winter. Soviet Russia had offered Estonia peace talks. As they went on in Tartu, the Red 7th and 15th Armies attacked the fortified lines at Narva through November and December, and on 16 December some units crossed the river, but the Estonian defence held.
      - A ceasefire came into force on 3 January 1920, and on 2 February the Treaty of Tartu was signed. Soviet Russia recognised Estonia’s independence, renounced all claims to its territory in perpetuity and agreed to pay 15 million gold roubles from the old empire’s reserves. Estonia kept a strip east of the Narva river and the Petseri district in the south-east, both with many Russian or Setu inhabitants. About 3,600 Estonian soldiers had been killed. A land reform passed during the war broke up the estates of the Baltic German nobility, and much of the land went to veterans.
    facts:
      - [Ceasefire, "3 January 1920"]
      - [Treaty of Tartu, "2 February 1920"]
      - [Estonian dead, "about 3,600"]
