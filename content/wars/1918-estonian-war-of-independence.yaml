        side: ee
        name: Narva
        date: November – December 1919
        text: The Red Army attacked the town’s defences for weeks while the peace talks went on in Tartu.
        lonlat: [28.196, 59.376]
      - kind: treaty
        name: Treaty of Tartu
        date: 2 February 1920
        text: Soviet Russia recognised Estonia’s independence in perpetuity. The border it drew lasted until 1940.
        lonlat: [26.723, 58.38]
      - kind: event
        name: Petseri
        date: 1920
        text: The district around the Pskov-Caves Monastery passed to Estonia under the treaty. It is now Pechory in Russia.
        lonlat: [27.617, 57.817]
