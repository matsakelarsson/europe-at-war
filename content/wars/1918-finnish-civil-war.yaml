  - title: Tampere and the German landing
    date: March – April 1918
    when: "1918-03-15"
    borders: "1918-04-13"
    countries: [fi]
    body:
      - In mid-March Mannerheim attacked Tampere, Finland’s main industrial town, held by about 15,000 Red Guards. Some 16,000 Whites, among them Jägers and Swedish volunteers, surrounded the town and fought their way in street by street in the bloodiest battle of the war. Red attempts to break the siege along the railway from the south failed, and on 6 April the last Reds surrendered at Pyynikki and Pispala. About 11,000 were captured and hundreds shot, and much of the town lay in ruins.
      - The White government had asked Germany for help. On 3 April the Baltic Sea Division of about 10,000 men under General Rüdiger von der Goltz landed at Hanko and marched on Helsinki, which it took on 12–13 April with the help of local Whites. On 7 April another 3,000 Germans under Colonel Otto von Brandenstein landed at Loviisa and struck inland. Germany expected influence in return. In October 1918 a Finnish parliament without its socialist members elected a German prince, Frederick Charles of Hesse, king, but he gave up the throne after Germany’s defeat.
    facts:
      - [Battle of Tampere, "15 March – 6 April 1918, White victory"]
      - [German landing at Hanko, "3 April 1918"]
      - [Helsinki taken, "12–13 April 1918"]
