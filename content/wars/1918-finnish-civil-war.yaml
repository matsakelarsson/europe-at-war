  - title: Viipuri, the end and the prison camps
    date: April – May 1918
    when: "1918-04-29"
    borders: "1918-05-15"
    countries: [fi, ru]
    body:
      - As the Red front collapsed, columns of Red Guards and their families tried to escape east towards Russia. German troops had taken Lahti on 19 April, and around it some 30,000 people were trapped and surrendered on 1–2 May. In Karelia the Whites stormed Viipuri on 29 April, after the Red leaders had fled by sea to Petrograd. In Viipuri the Whites shot hundreds of captured Reds and, in the following days, some 360–420 Russian civilians and soldiers, killed for being Russian. The last Reds gave up in Kymenlaakso in early May, and on 16 May Mannerheim led a victory parade through Helsinki.
      - About 80,000 Reds, among them women, children and Russians, were held in camps such as Suomenlinna, Tammisaari, Hämeenlinna, Lahti and Tampere. Hunger and disease swept the camps, and about 12,500 prisoners died there. The White Terror killed about 9,000 Reds, and the Red Terror about 1,500 Whites. Some 38,000 people died in the war in all, in a country of three million. Most prisoners were released on parole within a year or two, but the bitterness between the two sides marked Finnish politics for a generation.
    facts:
      - [Viipuri taken, "29 April 1918"]
      - [War over, "15 May 1918; victory parade 16 May"]
      - [Died in prison camps, "about 12,500"]
