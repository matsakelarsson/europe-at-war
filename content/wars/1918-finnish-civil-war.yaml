steps:
  - title: Red Helsinki and the fronts
    date: January – March 1918
    when: "1918-01-27"
    borders: "1918-03-14"
    countries: [fi]
    body:
      - Finland had declared independence on 6 December 1917, but the country was split. Workers’ Red Guards and the bourgeois Civil Guards, the Whites, had armed themselves through 1917, and tens of thousands of Russian soldiers were still in the country, though few would fight. On 27 January 1918 the Reds lit a red lantern in the tower of the Helsinki Workers’ Hall as a signal and took over the capital, and a People’s Delegation under Kullervo Manner replaced the Senate. The same night Mannerheim’s Whites began disarming the Russian garrisons in Ostrobothnia, and part of the Senate escaped to Vaasa, which became the White capital.
      - The front soon settled across southern Finland, from the Gulf of Bothnia north of Pori past Tampere and along the lakes to the Karelian Isthmus. The Reds held the industrial south, with Helsinki, Turku, Tampere and Viipuri, and the Whites the rural north and centre. Both sides lacked trained officers. The Whites had Swedish volunteers and the Jäger battalion trained in Germany, most of whom landed at Vaasa on 25 February, while the Reds got weapons and some help from Russian soldiers. Both sides killed opponents behind the lines, and after taking Varkaus the Whites shot Red prisoners on the ice at Huruslahti, some reportedly chosen by lot.
    facts:
      - [War begins, "27–28 January 1918"]
      - [White capital, "Vaasa, 29 January – 3 May 1918"]
      - [Jägers land at Vaasa, "25 February 1918"]
