id: finnish-civil-war
name: Finnish Civil War
start: "1918-01-27"
end: "1918-05-15"
tier: B
summary: A war between the socialist Reds and the conservative Whites for the leadership of newly independent Finland, fought from January to May 1918. The Whites under Carl Gustaf Emil Mannerheim, helped by German troops, won; about 38,000 people died, among them some 12,500 Red prisoners who perished in camps after the fighting.
