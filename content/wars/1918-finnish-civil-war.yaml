notes:
  - The war has had several names in Finland, among them the War of Liberation, the Red Rebellion, the Class War and the Civil War, depending on the speaker’s side.
  - Places are named in Finnish. Viipuri is today Vyborg in Russia, Tammisaari is Ekenäs in Swedish, and Helsinki was Helsingfors to Swedish speakers.
  - The front line is approximate, drawn from general accounts.
