id: franco-turkish-war
name: Franco-Turkish War
start: "1918-11"
end: "1921-10-20"
tier: C
summary: The war between French occupation forces, including the Armenian Legion, and Turkish nationalists in Cilicia and south-eastern Anatolia after the First World War, in which the French gave up Maraş after street fighting in early 1920 that killed thousands of Armenian civilians, and later Urfa, but held Adana and took Aintab after a long siege. Wishing to cut costs and secure Syria, France made peace with the Ankara government in the Agreement of Ankara of 20 October 1921 and left Cilicia by January 1922, and most of the region’s Armenians left with it.
countries: [tr, fr, sy]
sides:
  - id: fr
    name: France and the Armenian Legion
    polities: [france]
    ink: purple
  - id: tr
    name: Turkish nationalists (Ankara government)
    polities: [turkey]
    ink: teal
notes:
  - Known in France as the Cilicia campaign and in Turkey as the Southern Front of the War of Independence. French troops took over the region from the British in late 1919, and many Armenian survivors of the deportations had returned there.
  - Maraş is today’s Kahramanmaraş and Aintab today’s Gaziantep, both renamed after the war in honour of their defence.
