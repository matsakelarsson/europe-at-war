steps:
  - title: Kiel and the fall of the monarchy
    date: 29 October – 11 November 1918
    when: "1918-10-29"
    borders: "1918-11-11"
    countries: [de, nl]
    side_names:
      rev: Mutinous sailors and the councils
      gov: Imperial authorities
    body:
      - By October 1918 Germany’s generals knew the war was lost, and Prince Max of Baden’s new government had asked President Wilson for an armistice. The naval command nonetheless planned a last sortie against the British fleet. In the Schillig Roads off Wilhelmshaven crews on several battleships refused orders, and the operation was called off. One squadron was sent back to Kiel, where sailors demanded the release of comrades arrested for the mutiny. On 3 November a patrol fired on their demonstration, killing seven men. The next day sailors and workers took control of the port and elected councils.
      - Sailors spread the revolt by rail, and by 7 November workers’ and soldiers’ councils held Hamburg, Bremen, Lübeck, Cologne and many other cities. In Munich, on the night of 7–8 November, the Independent Socialist Kurt Eisner proclaimed a Bavarian republic, and the king fled. On 9 November, with Berlin on general strike, Prince Max announced the Kaiser’s abdication on his own authority and handed over to the Social Democrat Friedrich Ebert. Philipp Scheidemann proclaimed a republic from the Reichstag, and Karl Liebknecht a socialist republic at the palace. William II left for the Netherlands the next day; the armistice followed on 11 November.
    facts:
      - [Sailors refuse orders, "Schillig Roads, late October 1918"]
      - [Kiel taken over, "4 November 1918"]
      - [Republic proclaimed, "9 November 1918, Berlin"]
