id: german-revolution
name: German Revolution of 1918–1919
start: "1918-10-29"
end: "1919-08-11"
tier: B
summary: The revolution that ended the German Empire in the last days of the First World War. A naval mutiny at Kiel spread across Germany, the Kaiser and the other German princes abdicated, and a Social Democrat-led government took power; it then used the army and Freikorps volunteers to crush the radical left in Berlin and the Bavarian Soviet Republic, and the Weimar Constitution of August 1919 founded a parliamentary republic.
countries: [de, nl]
sides:
  - id: rev
    name: Revolutionaries
    polities: [revolutionaries-1918]
    ink: red
    moves: Revolutionary moves
    success: Revolutionary success
  - id: gov
    name: Government and army
    polities: [germany]
    ink: slate
    moves: Government moves
    success: Government success
notes:
  - The sides changed as the revolution went on. The Social Democrats who led the new government in November 1918 came to power on the back of the revolution, but from December they relied on the old army and on Freikorps volunteers against the radical left.
  - The First World War, which ended with the armistice of 11 November 1918, is told separately.
