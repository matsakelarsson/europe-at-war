  - title: Spartacists and the Bavarian Soviet Republic
    date: December 1918 – August 1919
    when: "1918-12-24"
    borders: "1919-05-03"
    countries: [de]
    side_names:
      rev: Spartacists and the Bavarian Soviet Republic
      gov: Government, army and Freikorps
    body:
      - Ebert’s Council of People’s Deputies, formed with the Independent Socialists (USPD) on 10 November, wanted elections to a National Assembly, and Ebert secretly agreed with General Wilhelm Groener that the army would back the government. After troops attacked revolutionary sailors in Berlin at Christmas, the USPD left the government and the Spartacists founded the Communist Party. On 5 January 1919, after Berlin’s left-wing police chief was dismissed, armed workers occupied newspaper offices, among them the SPD’s Vorwärts. Gustav Noske, the minister responsible for the army, sent in troops and Freikorps volunteers, who crushed this “Spartacist uprising” by 12 January; some 150–200 people were killed.
      - On 15 January Freikorps officers murdered Rosa Luxemburg and Karl Liebknecht. Elections on 19 January, the first in which German women voted, gave the SPD and its Catholic and liberal allies a large majority, and the National Assembly met at Weimar. In Munich Eisner was shot dead by a nationalist on 21 February. On 6–7 April anarchists and Independent Socialists proclaimed a Bavarian Soviet Republic, which the communists took over a week later. Army and Freikorps troops took Munich on 1–3 May, after its Red Guards had shot ten hostages; at least 606 people were killed, 335 of them civilians. The Weimar Constitution was signed on 11 August 1919.
    facts:
      - [Spartacist uprising, "5–12 January 1919"]
      - [Luxemburg and Liebknecht murdered, "15 January 1919"]
      - [Munich taken, "1–3 May 1919"]
    markers:
      - kind: battle
        side: gov
        name: Berlin newspaper quarter
        date: 5–12 January 1919
        text: Troops retook the occupied buildings with machine guns, artillery and flamethrowers; several of the Vorwärts occupiers were shot after surrendering.
        lonlat: [13.398, 52.505]
      - kind: event
        name: Eden Hotel
        date: 15 January 1919
        text: Luxemburg and Liebknecht were questioned here by officers of the Guards Cavalry Rifle Division and murdered after leaving; Luxemburg’s body was thrown into the Landwehr Canal.
        lonlat: [13.338, 52.505]
        lp: l
      - kind: event
        name: Weimar
        date: 6 February 1919
        text: The National Assembly met here, away from the unrest in Berlin, and elected Ebert president on 11 February.
        lonlat: [11.329, 50.981]
      - kind: event
        side: gov
        name: Bamberg
        date: April – May 1919
        text: The elected Bavarian government under Johannes Hoffmann fled here from Munich and called in troops to retake the city.
        lonlat: [10.887, 49.891]
      - kind: taken
        side: gov
        name: Munich
        date: 1–3 May 1919
        text: Government troops and Freikorps broke into the city in heavy street fighting; Gustav Landauer was murdered and Eugen Leviné later executed.
        lonlat: [11.575, 48.138]
