id: greater-poland-uprising
name: Greater Poland Uprising
start: "1918-12-27"
end: "1919-02-16"
tier: C
summary: A Polish rising against German rule in the Prussian Province of Posen, which broke out in Poznań on 27 December 1918, the day after a patriotic speech there by Ignacy Paderewski. By mid-January 1919 the insurgents held most of the province; fighting ended with the renewed Allied–German armistice of Trier on 16 February, and the Treaty of Versailles gave most of the region to Poland.
