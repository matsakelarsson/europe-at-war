id: heimosodat
name: Kinship Wars (Heimosodat)
start: "1918-03"
end: "1922-03-21"
tier: C
summary: A series of expeditions by Finnish volunteers, and local uprisings they backed, in the Finnic-speaking borderlands of Soviet Russia in 1918–1922; the Viena expedition to White Karelia in 1918, the Petsamo expeditions of 1918 and 1920 and the Aunus expedition to Olonets Karelia in 1919 all failed, and the Treaty of Tartu of 14 October 1920 gave Finland Petsamo but returned the parishes of Repola and Porajärvi to Soviet Russia. An East Karelian uprising supported by Finnish volunteers from November 1921 was crushed by the Red Army in February 1922, and some 30,000 East Karelians fled to Finland.
countries: [fi, ru]
sides:
  - id: fi
    name: Finnish volunteers and East Karelian insurgents
    polities: [finland]
    ink: teal
  - id: ru
    name: Soviet Russia
    polities: [ussr]
    ink: red
notes:
  - Finnish historians do not count these expeditions as wars between Finland and Soviet Russia, since most were private ventures of volunteers, with varying degrees of official backing. Finnish volunteers also fought for Estonia in 1919 and supported the Ingrian Finns’ uprising of 1919–1920.
  - Finnish names are used, as in the sources. Viena is White Karelia, around Kalevala (Uhtua) and Kem; Aunus is Olonets Karelia, east of Lake Ladoga.
