  - title: The Far Eastern Republic and the Japanese withdrawal
    date: April 1920 – November 1922
    when: "1920-04-06"
    borders: "1922-10-25"
    countries: [ru, jp]
    body:
      - To avoid open war with Japan, Moscow set up a nominally independent buffer state. The Far Eastern Republic was proclaimed at Verkhneudinsk on 6 April 1920; its People’s Revolutionary Army was in effect the Red Army under another name. Under the Gongota agreement of 15 July 1920 the Japanese withdrew from Transbaikalia, and by October the republic’s troops and partisans had driven Semyonov out of Chita, which became its capital. On 26 May 1921 Whites under the Merkulov brothers seized Vladivostok under Japanese protection and formed the Provisional Priamur Government; in December their army advanced north and took Khabarovsk on 22 December.
      - In February 1922 the People’s Revolutionary Army under Vasily Blyukher stormed the White positions at Volochayevka in hard frost; the main fighting was on 10–12 February, and Khabarovsk was retaken a few days later. Talks with Japan at Dairen failed, but the Washington Conference, the cost of the occupation and opposition at home led Japan to announce on 24 June 1922 that it would leave the mainland by October. The Whites, now under General Mikhail Diterikhs, were beaten at Spassk on 8–9 October. The last Japanese troops sailed from Vladivostok on 25 October 1922 and the republic’s troops entered the city the same day.
      - On 15 November 1922 the Far Eastern Republic was merged into Soviet Russia. Japan kept northern Sakhalin until May 1925, when it withdrew under the Soviet–Japanese convention signed in Beijing that January. The expedition had cost Japan about 900 million yen and several thousand dead and brought it no gains on the mainland.
    facts:
      - [Far Eastern Republic proclaimed, "6 April 1920, Verkhneudinsk"]
      - [Battle of Volochayevka, "10–12 February 1922, Red victory"]
      - [Last Japanese troops leave Vladivostok, "25 October 1922"]
      - [Republic merged into Soviet Russia, "15 November 1922"]
