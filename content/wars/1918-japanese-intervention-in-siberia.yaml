  - title: Partisans, Ivanovka and Nikolayevsk
    date: 1919 – July 1920
    when: "1919-03-22"
    borders: "1920-04-05"
    countries: [ru, jp]
    body:
      - Behind the Japanese lines a partisan war grew in the Amur region and Primorye, fed by anger at requisitions and at the killings carried out by Semyonov’s and Kalmykov’s men, which the American commander, General William Graves, denounced. The Japanese answered with punitive raids. On 22 March 1919, after partisans fired on Japanese soldiers near Ivanovka in the Amur region, Japanese troops attacked and burned the village; a Soviet commission counted 208 men, 9 women, 4 children and 7 Chinese killed, and later Russian accounts give about 290 dead in Ivanovka and nearby villages.
      - After Kolchak’s defeat the other Allies left. The Canadians sailed in June 1919, the British by November, and the last Americans on 1 April 1920, while the Czechoslovaks were evacuated through Vladivostok. On 31 January 1920 a coalition including the Bolsheviks took over Vladivostok, and Kalmykov fled from Khabarovsk into China. At Nikolayevsk-on-Amur, taken by Yakov Tryapitsyn’s partisans in February, fighting broke out with the Japanese garrison on 12 March 1920, and the garrison, the consulate and most of the town’s Japanese residents, several hundred people, were killed; in May, before abandoning the town, the partisans killed their remaining prisoners and many Russian residents and burned the town. Estimates of the dead range into the thousands, most of them Russians. Tryapitsyn was shot by his own side in July.
      - On the night of 4–5 April 1920 Japanese troops attacked the Russian forces in Vladivostok, Nikolsk-Ussuriysky, Spassk and Khabarovsk and disarmed them, with heavy losses on the Russian side. The Red commander Sergei Lazo was arrested in Vladivostok and disappeared; by the most common account he was burned alive in a locomotive firebox. Citing Nikolayevsk, Japan occupied the Russian north of Sakhalin that summer.
    facts:
      - [Ivanovka burned, "22 March 1919"]
      - [Last American troops leave, "1 April 1920"]
      - [Nikolayevsk garrison destroyed, "12–13 March 1920"]
      - [Japanese attacks across Primorye, "4–5 April 1920"]
