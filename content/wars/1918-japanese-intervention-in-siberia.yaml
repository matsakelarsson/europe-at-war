steps:
  - title: Vladivostok and the advance to Lake Baikal
    date: April – November 1918
    when: "1918-04-05"
    borders: "1918-09-15"
    countries: [ru, jp, us]
    body:
      - Vladivostok, the Pacific end of the Trans-Siberian Railway, held hundreds of thousands of tonnes of war supplies sent by the Allies to Russia, and after the Bolshevik seizure of power and the peace of Brest-Litovsk the Allies feared they would fall to the Bolsheviks or the Germans. Japanese and British warships anchored in the harbour from January 1918, and on 5 April, after Japanese shopkeepers had been killed in the city, Japanese and British marines landed. In June the Czechoslovak Legion, strung out along the railway on its way to the Western Front, overthrew the Soviet in Vladivostok. In July the United States proposed a joint expedition of about 7,000 men each to help the Legion; Japan agreed to send 12,000 and eventually sent about 70,000.
      - A British battalion landed on 3 August, the main Japanese force from mid-August, about 3,000 Americans of the 27th and 31st Infantry from the Philippines on 15–21 August, and French colonial troops, Italians, Canadians and about 2,300 Chinese soldiers in the following weeks. General Ōtani Kikuzō took command of the Allied troops on 18 August. Japanese and Allied troops and the Czechoslovaks drove the Red forces north along the Ussuri railway, and on 5 September Kalmykov’s Ussuri Cossacks took Khabarovsk. On 6 September Semyonov, advancing from Manchuria with Japanese support, entered Chita, where his men killed several hundred residents. Japanese troops took Blagoveshchensk on the Amur in September, and by November they held every port and large town east of Chita.
    facts:
      - [Japanese and British marines land, "5 April 1918"]
      - [Main Allied landings, "August 1918"]
      - [Khabarovsk taken, "5 September 1918"]
      - [Japanese troops, "about 70,000 at the peak; the United States sent about 8,000"]
