notes:
  - Dates are New Style. In Japan the operation is known as the Siberian Expedition (Shiberia shuppei); Soviet and Russian histories call it the intervention.
  - Troop numbers and losses vary between sources. Japan’s own figures give about 3,100 Japanese dead, some 1,400 of them killed in action and the rest dead of disease; other estimates reach 5,000. Losses among Russian partisans and civilians are not known with any precision.
  - The Russian Civil War has its own entry, which covers the Czechoslovak Legion and Kolchak’s government in Omsk. The Japanese occupation of northern Sakhalin (1920–1925) and the Mongolian revolution of 1921 are told in their own entries.
