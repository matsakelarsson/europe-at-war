id: japanese-intervention-in-siberia
name: Japanese intervention in Siberia
start: "1918-04-05"
end: "1922-10-25"
tier: B
summary: "The occupation of the Russian Far East and eastern Siberia by Japanese troops, alongside smaller American, British, French, Canadian, Italian and Chinese contingents, during the Russian Civil War. The Allies landed at Vladivostok in 1918 to guard war stores and help the Czechoslovak Legion leave Russia; Japan, which sent some 70,000 men, far more than agreed, occupied the ports and railway towns from the Pacific to Lake Baikal and backed the Cossack atamans Grigory Semyonov and Ivan Kalmykov. The other Allies left in 1919–1920, after Kolchak’s fall, while the Japanese fought a growing partisan war: they burned the village of Ivanovka in 1919, partisans destroyed their garrison at Nikolayevsk-on-Amur in 1920, and in April 1920 they struck at Russian forces across Primorye. Moscow set up the Far Eastern Republic as a buffer state; its army defeated the Whites at Volochayevka in February 1922, and when the last Japanese troops sailed from Vladivostok on 25 October 1922 it marched in. The republic joined Soviet Russia three weeks later. Japan held northern Sakhalin until 1925."
countries: [ru, jp, us]
