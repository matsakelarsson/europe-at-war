notes:
  - Also called Latvia’s freedom battles (brīvības cīņas). Dates are New Style.
  - The Landeswehr fought the Red Army alongside the Latvians in early 1919 and fought them at Cēsis in June; from July 1919 it served under Latvian command.
  - The taking of Daugavpils in January 1920 was also part of the Polish–Soviet War, which has its own entry. Front lines are approximate.
