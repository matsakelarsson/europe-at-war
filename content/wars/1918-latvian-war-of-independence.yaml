  - title: Latgale and the Treaty of Riga
    date: January – August 1920
    when: "1920-01-03"
    borders: "1920-08-11"
    countries: [lv, pl, ru]
    body:
      - The Red Army still held Latgale, Latvia’s eastern province. In January 1920 Latvian troops and Polish forces under Edward Rydz-Śmigły attacked together, crossing the frozen Daugava, and Daugavpils fell on 3 January. Poland handed the town to Latvia. By the end of January the Latvians had cleared the rest of Latgale, and on 1 February a ceasefire with Soviet Russia came into force. Latvia and Lithuania, meanwhile, disputed the border between them, which a British arbitrator settled in 1921.
      - Peace talks began in April, and on 11 August 1920, as the Red Army was advancing on Warsaw, Soviet Russia and Latvia signed the Treaty of Riga. Soviet Russia recognised Latvia’s independence and renounced all claims to its territory for ever, and Latvia received the Abrene district around Pytalovo, formerly part of Pskov province. About 3,000 Latvian soldiers had been killed in the war. As in Estonia, a land reform broke up the large estates, most of them owned by Baltic German nobles, and gave the land to soldiers and landless peasants.
    facts:
      - [Daugavpils taken, "3 January 1920"]
      - [Ceasefire with Soviet Russia, "1 February 1920"]
      - [Treaty of Riga, "11 August 1920"]
    markers:
