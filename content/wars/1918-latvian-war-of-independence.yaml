  - title: Bermondt’s attack on Riga
    date: October – December 1919
    when: "1919-10-08"
    borders: "1919-11-11"
    countries: [lv, lt]
    body:
      - The German troops did not leave. Many joined the West Russian Volunteer Army of Pavel Bermondt-Avalov, some 30,000 men or more, most of them German Freikorps soldiers with Russian former prisoners of war. Nominally it was to fight the Bolsheviks for the Whites, but its aim was to keep the Baltic under German control. On 8 October 1919 it attacked Riga from Jelgava and took Pārdaugava, the part of the city on the left bank of the Daugava. The Latvian government left the city, but the army held the right bank and the bridges, helped by British and French warships at the river mouth.
      - Estonian armoured trains came to help, and after a month of fighting the Latvians counter-attacked. On 11 November they drove the Bermontians out of Pārdaugava; the day is now Lāčplēsis Day, when Latvia remembers its soldiers. The Latvians pursued the Bermontians south and took Jelgava on 21 November, while Lithuanian troops beat them at Radviliškis on 21–22 November. By mid-December the last of Bermondt’s troops had withdrawn to Germany under Allied supervision.
    facts:
      - [Attack on Riga, "8 October 1919"]
      - [Pārdaugava retaken, "11 November 1919 (Lāčplēsis Day)"]
      - [Bermondt’s army, "some 30,000 or more, mostly Germans"]
    markers:
      - kind: battle
        side: lv
        name: Riga
        date: 8 October – 11 November 1919
        text: The Latvians held the right bank for a month and then drove the Bermontians out of the left-bank suburbs.
        lonlat: [24.106, 56.949]
      - kind: naval
