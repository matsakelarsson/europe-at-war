steps:
  - title: Soviet Latvia, Riga and Cēsis
    date: December 1918 – July 1919
    when: "1918-12-05"
    borders: "1919-07-03"
    countries: [lv, ee]
    body:
      - Latvia was proclaimed independent in Riga on 18 November 1918, with Kārlis Ulmanis as head of a provisional government, but it had almost no army. The Red Army, with the Latvian Riflemen at its core, invaded in December and took Riga on 3 January 1919. Pēteris Stučka’s Latvian Socialist Soviet Republic ruled most of the country through revolutionary tribunals, requisitions and terror, and Riga went hungry. Ulmanis’s government fell back to Liepāja, where the remaining German troops, the Baltic German volunteers of the Landeswehr and a small Latvian force held the line of the Venta.
      - In March the Germans under General Rüdiger von der Goltz and the Latvians counter-attacked. On 16 April Baltic Germans staged a coup in Liepāja and set up a puppet government under Andrievs Niedra, and Ulmanis’s ministers took refuge on the steamer Saratov under British protection. The Landeswehr and the Iron Division took Riga on 22 May and shot suspected Bolsheviks, then pushed north, where Estonian troops and the North Latvian Brigade beat them at Cēsis on 19–23 June. Under the armistice of 3 July the Germans were to leave Latvia, and Ulmanis returned to Riga on 8 July.
    facts:
      - [Independence proclaimed, "18 November 1918"]
      - [Riga taken by the Red Army, "3 January 1919"]
      - [Battle of Cēsis, "19–23 June 1919, Estonian and Latvian victory"]
