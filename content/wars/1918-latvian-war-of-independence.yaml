        text: About 30,000 Polish and 10,000 Latvian troops took the town across the frozen river, and Poland handed it to Latvia.
        lonlat: [26.536, 55.875]
      - kind: treaty
        name: Treaty of Riga
        date: 11 August 1920
        text: Soviet Russia recognised Latvia’s independence. Not to be confused with the Polish–Soviet Peace of Riga of 1921.
        lonlat: [24.106, 56.949]
      - kind: event
        name: Abrene
        date: 1920
        text: The district around the railway town of Pytalovo went to Latvia under the treaty. It is now part of Russia’s Pskov region.
        lonlat: [27.917, 57.067]
