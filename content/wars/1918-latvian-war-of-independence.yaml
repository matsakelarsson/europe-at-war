id: latvian-war-of-independence
name: Latvian War of Independence
start: "1918-12-05"
end: "1920-08-11"
tier: B
summary: A war for the new Republic of Latvia, proclaimed in November 1918, against Soviet Russia and its Latvian Soviet Republic and against German Freikorps, the Baltic German Landeswehr and the Bermontians, who sought to keep the country under German control. With Estonian, Polish and British help, Latvia drove out its enemies by early 1920, and Soviet Russia recognised its independence in the Treaty of Riga of 11 August 1920.
