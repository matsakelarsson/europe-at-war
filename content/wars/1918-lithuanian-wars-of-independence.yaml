id: lithuanian-wars-of-independence
name: Lithuanian Wars of Independence
start: "1918-12"
end: "1920-07-12"
tier: C
summary: The wars the new Lithuanian state fought for its independence against the Red Army in 1918–1919 and against the German-led Bermontians in the autumn of 1919. Lithuanian volunteers, with Saxon help, drove the Red Army back to the Daugava by the end of August 1919 and beat the Bermontians at Radviliškis in November, and in the treaty of 12 July 1920 Soviet Russia recognised Lithuania’s independence and its claim to Vilnius, which Poland seized that October.
