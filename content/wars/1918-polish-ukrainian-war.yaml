id: polish-ukrainian-war
name: Polish–Ukrainian War
start: "1918-11-01"
end: "1919-07-18"
tier: C
summary: A war for eastern Galicia between the new Polish state and the West Ukrainian People’s Republic, proclaimed in Lwów (Lviv) on 1 November 1918. Polish defenders, many of them students and schoolchildren, held part of the city until relief arrived on 21–22 November, after which Polish soldiers and civilians killed an estimated 52–150 Jews in a pogrom; in July 1919 a Polish offensive, reinforced by Józef Haller’s army from France, drove the Ukrainian Galician Army across the Zbruch.
countries: [pl, ua]
