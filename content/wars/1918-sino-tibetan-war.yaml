id: sino-tibetan-war
name: Sino-Tibetan War
start: "1918-01"
end: "1933"
tier: B
summary: "Two wars between the Dalai Lama’s government and Chinese forces in Kham, the eastern Tibetan borderland, after Tibet expelled the Qing garrison in 1912–1913. In 1918 the Tibetan army under the Kalon Lama Jampa Tendar defeated the Sichuan frontier troops of the Republic of China and took Chamdo, whose garrison surrendered on 29 April; truces mediated by the British consul Eric Teichman at Chamdo and Rongbatsa left Chamdo, Riwoche, Drayab, Markham, Gonjo and Derge with Tibet. In 1930 a dispute between the chief of Beri and the monastery of Dargye brought Tibetan troops east of the upper Yangtze, where they took Kandze and Nyarong, and in 1932 they attacked Qinghai and besieged Jyekundo. Counter-offensives by the Sichuan warlord Liu Wenhui and the Qinghai army of Ma Bufang drove them back across the Yangtze, and truces in 1932–1933 made the river the line between Chinese- and Tibetan-held Kham until 1950."
