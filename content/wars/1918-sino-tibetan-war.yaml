steps:
  - title: Chamdo and the truce of Rongbatsa
    date: 1917–1918
    when: "1918-04-29"
    borders: "1918-10-10"
    countries: [cn]
    body:
      - After the Qing garrison left central Tibet, Kham stayed divided. Chinese troops of the Sichuan frontier army, built up by Zhao Erfeng before 1911, held Chamdo and most of the land east of it, while the Dalai Lama’s governor-general of eastern Tibet, the Kalon Lama Jampa Tendar, faced them from the west. The Simla Conference of 1913–1914 had tried to settle a border, but China rejected its convention. By 1917 Jampa Tendar had turned his levies into regiments armed with British Lee–Metford rifles.
      - In the autumn of 1917 the Chinese arrested and killed two Tibetan soldiers, and early in 1918 the Chinese commander at Chamdo, Peng Risheng, attacked along the northern, main and southern roads. The Tibetans held, then counter-attacked. They took Riwoche, drove the southern column back to Drayab and, helped by local risings in Markham, Gonjo and Derge, closed in on Chamdo, where the Chinese had retreated into the ruins of the monastery. Relief columns from Batang and Kandze were beaten off. After more than half of its thousand men had been killed or died of hunger and disease, the garrison surrendered unconditionally on 29 April 1918.
      - The Tibetan army pushed on across the upper Yangtze towards Kandze and Batang, and the Chinese asked the British consul Eric Teichman to mediate. At Chamdo on 19 August 1918 Teichman, the Kalon Lama and the Chinese representative Liu Zanting signed an agreement, followed on 10 October by a truce at Rongbatsa, near Kandze, under which both armies withdrew. The line left Chamdo, Riwoche, Drayab, Markham, Gonjo and Derge with Tibet, and Batang, Litang, Nyarong and Kandze with China. China later repudiated it, and many Tibetans believed Britain had pressed Lhasa into the truce by threatening to stop selling it ammunition.
