  - title: Dargye, Kandze and Jyekundo
    date: 1930–1933
    when: "1932-08-20"
    borders: "1932-10-01"
    countries: [cn]
    body:
      - The line of 1918 held for twelve years. In 1930 the chief of Beri, a district under Sichuan’s control, seized property belonging to the incarnate lama of Nyarong monastery, who turned for support to the great monastery of Dargye nearby. Beri called in the troops of Liu Wenhui, the Sichuan warlord who ruled Chinese-held Kham, and Dargye appealed to Lhasa. In the summer of 1930 Tibetan troops crossed the upper Yangtze, drove Liu’s forces out of Beri and went on to take Kandze and Nyarong. A ceasefire arranged by the Nationalist government’s envoy Tang Kesan broke down.
      - In 1932 the Tibetans extended the war north into Qinghai after a dispute over a monastery in Yushu. They attacked the Qinghai posts at Surmang and laid siege to Jyekundo (Jiegu), the seat of Yushu, which Ma Biao held for over two months until a relief force under La Pingfu broke the siege on 20 August 1932. Ma Bufang’s Qinghai troops then counter-attacked together with Liu Wenhui’s army, which retook Kandze and Nyarong; the Qinghai troops took Sershul and Derge, and joint attacks drove the Tibetans back across the Yangtze. Both sides were accused of killing prisoners and civilians.
      - The Dalai Lama appealed to the British, whose pressure led the Nationalist government to order a ceasefire, and Liu Wenhui and Ma Bufang made separate truces with the Tibetans in 1932–1933. The upper Yangtze became the line between Chinese- and Tibetan-held Kham until 1950, with Chamdo the seat of Lhasa’s governor of eastern Tibet. In 1939 the Nationalist government made Chinese-held Kham the province of Xikang.
    facts:
      - [Tibetan army crosses the upper Yangtze, "1930"]
      - [Siege of Jyekundo broken, "20 August 1932"]
