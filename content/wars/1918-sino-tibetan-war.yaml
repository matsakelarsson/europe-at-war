notes:
  - Tibetan and Chinese accounts differ on the causes of both wars, and casualty figures are not known. Chinese histories describe the Chinese forces as defending Chinese territory; Tibetan histories describe the 1918 war as the defeat of a Chinese invasion and the recovery of Tibetan land.
  - Place names are given in their Tibetan forms, with Chinese names where readers may know them (Kandze for Garzê, Jyekundo for Jiegu in Yushu, Dartsedo for Kangding).
