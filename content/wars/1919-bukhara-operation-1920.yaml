id: bukhara-operation-1920
name: Soviet conquest of Khiva and Bukhara
start: "1919-12"
end: "1921-03"
tier: B
summary: The overthrow of the last two Central Asian monarchies by the Red Army in 1920. Khiva and Bukhara had been Russian protectorates and became independent in practice after the Russian Revolution. In Khiva, the Turkmen leader Junaid Khan was driven into the desert and the khan abdicated in February 1920; in Bukhara, Mikhail Frunze’s troops stormed the city on 2 September 1920 and the emir fled east and then to Afghanistan. Local reformers, the Young Khivans and Young Bukharans, headed the people’s soviet republics that replaced them, which were divided between new Soviet republics in 1924.
