steps:
  - title: Khiva
    date: December 1919 – April 1920
    when: "1919-12"
    borders: "1920-04-27"
    countries: [uz, tm]
    body:
      - After the Russian Revolution, power in Khiva passed to Junaid Khan, a chief of the Yomut Turkmen whom the khan made commander of his army in January 1918. Junaid had the khan, Asfandiyar, killed later that year and put the khan’s elderly uncle Sayyid Abdullah on the throne, ruling in his name. He suppressed the reformist Young Khivans and drove out rival Turkmen chiefs, but his attack on the Bolshevik garrison of Petro-Aleksandrovsk, across the Amu Darya, failed.
      - At the end of 1919 rival Turkmen and Uzbek leaders and the Young Khivans rose against Junaid and called on the Bolsheviks for help. Red Army detachments crossed the Amu Darya from Petro-Aleksandrovsk, and by the end of January 1920 Junaid’s forces were beaten. He withdrew into the Karakum desert with his followers. On 2 February Sayyid Abdullah abdicated, ending the Khanate of Khiva. On 26 April an assembly at Khiva proclaimed the Khorezm People’s Soviet Republic. Within a year its first Young Khivan leaders had been pushed aside by Soviet officials, while Junaid fought on from the desert.
    facts:
      - [Khan abdicates, "2 February 1920"]
      - [Khorezm People’s Soviet Republic, "proclaimed 26 April 1920"]
