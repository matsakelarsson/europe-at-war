notes:
  - Russia made Bukhara a protectorate in 1868 and Khiva in 1873, keeping the land it had annexed, such as Samarkand and the right bank of the Amu Darya. After the Russian Revolution both states were independent in practice; the Soviet government recognised Bukhara’s independence after a failed attack in March 1918.
  - The people’s soviet republics were formally independent states allied with Soviet Russia, but Soviet officials and the Red Army held the real power. Chardzhou is today Türkmenabat, Kagan (New Bukhara) is Kogon and Petro-Aleksandrovsk is Turtkul.
