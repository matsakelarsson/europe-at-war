  - title: Bukhara
    date: August 1920 – March 1921
    when: "1920-08-28"
    borders: "1920-10-09"
    countries: [uz, tm, tj, af]
    body:
      - In March 1918 a small Bolshevik force from Tashkent under Fyodor Kolesov, joined by the reformist Young Bukharans, had marched on Bukhara and been driven off; the emir, Sayyid Alim Khan, then had many reformers killed, and Soviet Russia recognised his independence. After the defeat of Admiral Kolchak in 1919 opened the railway from European Russia, the new Turkestan Front under Mikhail Frunze prepared to finish the emirate. The emir mobilised an army that Soviet sources put at about 35,000 men, but with only a few machine guns and old cannon.
      - On the night of 28 August 1920 the Young Bukharans and their communist allies rose at Chardzhou and called on the Red Army. Red columns advanced on Bukhara along the railway from Chardzhou, by way of Qarakul, and from Kagan, the Russian settlement next to the old city, while others moved on the eastern towns. From 30 August heavy guns and aircraft bombarded the walls; Soviet accounts speak of 12,000 shells. On 2 September Red troops broke in, and the defenders of the Ark, the emir’s citadel, surrendered the same day after a bombardment that left it in ruins. Much of the old city burned and hundreds of civilians were killed. Frunze reported to Lenin that “the red flag of world revolution flies victoriously over the Registan”.
      - The emir had fled east with about 1,000 men on 31 August and held out through the winter in eastern Bukhara. On 8 October an assembly proclaimed the Bukharan People’s Soviet Republic, headed by the Young Bukharan Fayzulla Khodzhayev. A Red Army expedition took Dushanbe in February 1921, and in March the emir crossed the Amu Darya into Afghanistan, where he lived until his death in Kabul in 1944. His supporters fought on as part of the Basmachi movement.
