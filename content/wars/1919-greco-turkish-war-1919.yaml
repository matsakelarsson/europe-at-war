  - title: İnönü and Kütahya–Eskişehir
    date: January – July 1921
    when: "1921-01-06"
    borders: "1921-07-24"
    countries: [tr, gr]
    body:
      - The new Greek government kept up the war, hoping to break the nationalists before the Allies made peace without Greece. In January 1921 a Greek corps advancing from Bursa towards the railway junction of Eskişehir was stopped at İnönü by the new regular army of İsmet Pasha. Talks in London failed, and in late March the Greeks attacked again on two fronts; at İnönü they were beaten back after a week of fighting, and in the south they took Afyonkarahisar but soon gave it up. The battles made the nationalists’ name, and İsmet later took İnönü as his surname.
      - Abroad, the Ankara government gained ground. It signed a treaty of friendship with Soviet Russia in March, which brought gold and arms, and Italy began to pull out of its zone. In July the Greek Army of Asia Minor under General Anastasios Papoulas launched its largest offensive yet. In the battles of Kütahya–Eskişehir it took Afyonkarahisar on 13 July, Kütahya on 17 July and Eskişehir on 19 July. Mustafa Kemal ordered his army to fall back east of the Sakarya river, trading land for time.
    facts:
      - [First Battle of İnönü, "6–11 January 1921, Turkish victory"]
      - [Second Battle of İnönü, "23 March – 1 April 1921, Turkish victory"]
      - [Battle of Kütahya–Eskişehir, "10–24 July 1921, Greek victory"]
