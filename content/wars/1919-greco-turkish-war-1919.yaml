  - title: Sèvres and the Greek advance
    date: March – December 1920
    when: "1920-03-16"
    borders: "1920-12-19"
    countries: [tr, gr, gb, fr, it]
    body:
      - When the Ottoman parliament declared its support for the national movement, Allied troops formally occupied Constantinople on 16 March 1920, arrested nationalist deputies and sent many to Malta. The nationalists answered by opening a Grand National Assembly in Ankara on 23 April, which claimed to govern in the sultan’s name while he was a prisoner of the Allies. That summer, with British approval, the Greek army struck out of its zone, took Bursa on 8 July and pushed east as far as Uşak, while another Greek force occupied Eastern Thrace and entered Adrianople on 25 July.
      - On 10 August the sultan’s government signed the Treaty of Sèvres. Greece was to have Eastern Thrace and to govern Smyrna for five years before a plebiscite, the Straits were put under international control, and Armenia and a possible Kurdistan were carved from the east. The Ankara government rejected the treaty, and it was never ratified. Then fortune turned against Venizelos. King Alexander died of a monkey bite in October, Venizelos lost the elections of November, and King Constantine, whom the Allies distrusted, returned in December.
    facts:
      - [Allied occupation of Constantinople, "formalised 16 March 1920"]
      - [Grand National Assembly opens in Ankara, "23 April 1920"]
      - [Treaty of Sèvres, "10 August 1920, never ratified"]
    markers:
      - kind: event
        side: gb
