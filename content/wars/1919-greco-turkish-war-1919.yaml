notes:
  - Known in Greece as the Asia Minor Campaign, ending in the Asia Minor Catastrophe, and in Turkey as the western front of the War of Independence (Kurtuluş Savaşı). Greece adopted the Gregorian calendar in 1923, and Greek accounts often give Old Style dates for 1919–1922; all dates here are New Style.
  - The base map shows the Ottoman Empire until the sultanate was abolished on 1 November 1922. From 1920 most of Anatolia was held by the Grand National Assembly in Ankara, whose government became the Republic of Turkey in October 1923; the Greek, Allied, Italian and French zones are shown as approximate areas.
  - Places are named in their present-day forms, with the names used at the time where accounts usually give them; Smyrna is İzmir, Brusa is Bursa, Afyon Karahisar is Afyonkarahisar and Chanak is Çanakkale.
  - Civilians suffered on all sides. Greek troops and irregulars killed Turkish villagers and burned towns, above all during the retreat of 1922; Turkish forces and irregulars killed and deported Greek and Armenian civilians, including the Pontic Greeks of the Black Sea coast; and the burning of Smyrna and the expulsions that followed ended three thousand years of Greek life in Anatolia. Greece and a number of scholars regard the killings and deportations of Ottoman Greeks from 1914 to 1923 as genocide, which Turkey rejects. Numbers are disputed and the subject is still bitterly contested.
