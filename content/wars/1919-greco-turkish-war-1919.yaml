  - title: Sakarya
    date: August – October 1921
    when: "1921-08-23"
    borders: "1921-10-20"
    countries: [tr, gr, fr]
    body:
      - With King Constantine at the front, the Greek army set out in mid-August to destroy the Turkish army and take Ankara. Its columns crossed a waterless salt steppe, with supply lines stretching back hundreds of kilometres, and met Turkish positions in the hills east of the Sakarya river, some 80 kilometres from Ankara. The Assembly had made Mustafa Kemal commander-in-chief. The battle lasted from 23 August to 13 September along a front of about 100 kilometres; the Greeks took several ridges, but each side lost more than 20,000 men killed or wounded, and the Greeks could go no further.
      - The Greek army fell back to a line running from Eskişehir to Afyonkarahisar, burning villages as it went, and the front stayed there for almost a year. The Assembly gave Mustafa Kemal the title of Gazi, “the victorious”. France made peace with Ankara in the Ankara Agreement of 20 October 1921 and left Cilicia, Soviet Russia settled the eastern border in the Treaty of Kars, and Italy was withdrawing its troops. Greece was left alone, short of money and without Allied support, to hold a long front deep in Anatolia.
    facts:
      - [Battle of the Sakarya, "23 August – 13 September 1921, Turkish victory"]
      - [Losses, "each side over 20,000 killed or wounded"]
      - [Ankara Agreement with France, "20 October 1921"]
    markers:
