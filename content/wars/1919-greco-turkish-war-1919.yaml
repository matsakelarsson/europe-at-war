  - title: Dumlupınar
    date: August – September 1922
    when: "1922-08-26"
    borders: "1922-09-09"
    countries: [tr, gr]
    body:
      - In July 1922 Greece moved troops from Anatolia to Thrace and asked the Allies to let it occupy Constantinople, which they refused. Mustafa Kemal had spent months building up his army in secret. Before dawn on 26 August his artillery opened fire on the Greek positions south of Afyonkarahisar, and Turkish infantry broke through on the heights. Cavalry poured through the gap behind the Greek lines. In the battle at Dumlupınar on 30 August the main Greek force was surrounded and destroyed, and on 2 September its commander, General Nikolaos Trikoupis, was taken prisoner.
      - The Greek army fell apart and retreated more than 300 kilometres to the coast in two weeks. Retreating troops and irregulars burned towns and villages on their way, among them Uşak, Alaşehir and Manisa, and killed Turkish civilians. Turkish troops and irregulars following them killed Greek civilians and prisoners. Greek soldiers and tens of thousands of refugees crowded into the ports of Smyrna and Çeşme, from which the army was shipped away. Turkish cavalry rode into Smyrna on 9 September.
    facts:
      - [Great Offensive begins, "26 August 1922"]
      - [Battle of Dumlupınar, "30 August 1922, Turkish victory"]
      - [Turkish troops enter Smyrna, "9 September 1922"]
