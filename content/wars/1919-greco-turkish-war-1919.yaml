        text: Twenty-two days of fighting near Polatlı ended the Greek advance; the Turkish army held the ridge of Duatepe and forced the Greeks to retreat.
        lonlat: [32.146, 39.584]
      - kind: event
        side: tr
        name: Ankara
        date: August – September 1921
        text: The Greek objective, then a small town of some 20,000 people that had become the nationalists’ capital.
        lonlat: [32.854, 39.92]
