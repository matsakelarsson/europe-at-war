  - title: Smyrna burns and Mudanya
    date: September – November 1922
    when: "1922-09-13"
    borders: "1922-10-11"
    countries: [tr, gr, gb]
    body:
      - In Smyrna, Turkish troops and mobs killed Greeks and Armenians, and the Orthodox metropolitan, Chrysostomos, was handed over to a crowd and murdered. On 13 September fire broke out in the Armenian quarter and destroyed the Greek, Armenian and European quarters over the next days, while hundreds of thousands of refugees were trapped on the quayside and Allied warships looked on. Most eyewitnesses blamed Turkish soldiers, while Turkish accounts blamed Armenians and Greeks. Estimates of the dead run from about 10,000 to 100,000 or more; ships organised by Greece and an American, Asa Jennings, carried the survivors away.
      - Turkish troops then advanced on the neutral zone of the Straits, where British troops held Chanak (Çanakkale), and for some days Britain came close to war. On 11 October the Armistice of Mudanya gave Eastern Thrace up to the Maritsa back to Turkish rule, and Greece accepted it three days later. In Greece, army officers had forced King Constantine to abdicate, and six politicians and generals blamed for the defeat were shot in November. On 1 November the Assembly abolished the sultanate, and Mehmed VI left on a British warship.
    facts:
      - [Burning of Smyrna, "13–22 September 1922"]
      - [Armistice of Mudanya, "11 October 1922"]
      - [Sultanate abolished, "1 November 1922"]
    markers:
      - kind: event
        name: Smyrna
        date: 13–22 September 1922
        text: The fire destroyed most of the city except the Turkish and Jewish quarters; tens of thousands of refugees waited on the quay for rescue.
        lonlat: [27.142, 38.419]
        lp: l
      - kind: event
        side: gb
        name: Chanak
        date: September – October 1922
        text: British troops faced Turkish cavalry across the wire of the neutral zone, but the British commander, General Charles Harington, held back an ultimatum and talks followed.
        lonlat: [26.408, 40.155]
        lp: l
      - kind: treaty
        name: Armistice of Mudanya
        date: 11 October 1922
        text: Signed by Turkey, Britain, France and Italy; the Greek army had 15 days to leave Eastern Thrace, and Greek civilians left with it.
        lonlat: [28.883, 40.375]
      - kind: event
