id: greco-turkish-war-1919
name: Greco-Turkish War (1919–1922)
start: "1919-05-15"
end: "1922-10-11"
tier: A
summary: The war that followed the Greek landing at Smyrna in May 1919, when Greece, backed at first by Britain, tried to win western Anatolia and Eastern Thrace from the defeated Ottoman Empire. The Turkish nationalist movement led by Mustafa Kemal stopped the Greek army at the Sakarya in 1921 and routed it in August 1922; Smyrna burned, the Armistice of Mudanya ended the fighting, and the Treaty of Lausanne and the exchange of populations of 1923 uprooted some 1.6 million people.
countries: [gr, tr, gb, fr, it]
