  - title: Lausanne and the exchange of populations
    date: November 1922 – October 1923
    when: "1922-11-20"
    borders: "1923-07-24"
    countries: [tr, gr, ch]
    body:
      - A peace conference opened at Lausanne in November 1922, with İsmet Pasha leading the Turkish delegation. On 30 January 1923 Greece and Turkey agreed to a compulsory exchange of populations defined by religion, the first of its kind. About 1.2 million Orthodox Christians, most of whom had already fled, lost their homes in Turkey, and some 400,000 Muslims had to leave Greece. The Greeks of Constantinople, Imbros and Tenedos and the Muslims of Western Thrace were exempted. Refugees made up about a fifth of Greece’s population and transformed Macedonia and the cities, where many lived in poverty for decades.
      - The Treaty of Lausanne, signed on 24 July 1923, replaced Sèvres. Turkey kept all of Anatolia and Eastern Thrace up to the Maritsa, with Imbros, Tenedos and Karaağaç, a suburb of Adrianople, ceded by Greece instead of reparations; Greece kept the other Aegean islands and Italy the Dodecanese. The Straits were demilitarised, and the foreign privileges of the capitulations were abolished. The last Allied troops left Constantinople in early October, Ankara became the capital, and on 29 October 1923 the Assembly proclaimed the Republic of Turkey with Mustafa Kemal as its president.
    facts:
      - [Exchange convention, "30 January 1923"]
      - [Treaty of Lausanne, "24 July 1923"]
      - [People exchanged, "about 1.2 million Christians and 400,000 Muslims"]
    markers:
      - kind: event
        name: Thessaloniki
        date: 1922–1924
        text: The city’s Muslims left for Turkey, and tens of thousands of refugees from Anatolia and Thrace settled in and around it.
        lonlat: [22.944, 40.64]
      - kind: event
        name: Piraeus and Athens
        date: from 1922
        text: Refugee settlements such as Nea Smyrni, Nea Ionia and Kokkinia grew into new suburbs of the capital.
        lonlat: [23.65, 37.95]
      - kind: treaty
        name: Karaağaç
        date: 24 July 1923
        text: Greece ceded this railway suburb of Adrianople on the west bank of the Maritsa to Turkey in place of war reparations.
        lonlat: [26.53, 41.655]
