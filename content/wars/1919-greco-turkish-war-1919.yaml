steps:
  - title: The landing at Smyrna
    date: May – September 1919
    when: "1919-05-15"
    borders: "1919-07-04"
    countries: [tr, gr, gb, fr, it]
    body:
      - After the Ottoman surrender at Mudros in October 1918, Allied troops occupied the Straits and Constantinople, Italy landed at Antalya, and British and then French troops took over Cilicia. The Greek prime minister, Eleftherios Venizelos, claimed Smyrna and its region, where Greeks were numerous, and Britain’s David Lloyd George persuaded the peace conference in Paris to let Greece occupy it, partly to forestall Italy. On 15 May 1919 Greek troops landed under the guns of Allied warships. A shot fired at them set off shooting and lynchings in which many Turkish soldiers and civilians were killed, and an Allied inquiry later blamed the Greek command.
      - The Greeks spread out to Manisa, Ayvalık and Aydın, where Turkish irregulars retook the town at the end of June and it was burned amid massacres of Greek and Turkish civilians. The landing turned scattered Turkish resistance into a national movement. Mustafa Kemal Pasha, sent to the Black Sea as an army inspector, landed at Samsun on 19 May, broke with the sultan’s government, and at congresses in Erzurum and Sivas that summer rallied the resistance behind a programme of keeping the Turkish-majority lands undivided.
    facts:
      - [Greek landing at Smyrna, "15 May 1919"]
      - [Mustafa Kemal at Samsun, "19 May 1919"]
      - [Sivas Congress, "4–11 September 1919"]
