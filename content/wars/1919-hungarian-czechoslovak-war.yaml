id: hungarian-czechoslovak-war
name: Hungarian–Czechoslovak War
start: "1918-11"
end: "1919-08"
tier: B
summary: A war over Upper Hungary, today’s Slovakia, after the break-up of Austria-Hungary. Czechoslovak troops took over Slovakia in the winter of 1918–1919 and pushed into northern Hungary in May 1919, until the Hungarian Soviet Republic’s Northern Campaign drove them back deep into Slovakia; under Allied pressure the Hungarians withdrew in early July, and the Treaty of Trianon confirmed Czechoslovakia’s southern border.
countries: [sk, hu, cz, ua]
sides:
  - id: hu
    name: Hungary (the Hungarian Soviet Republic from March 1919)
    polities: [hungary]
    ink: olive
    moves: Hungarian moves
    success: Hungarian success
  - id: cs
    name: Czechoslovakia
    polities: [czechoslovakia]
    ink: navy
    moves: Czechoslovak moves
    success: Czechoslovak success
notes:
  - Known in Hungary as the war for Upper Hungary, and the 1919 offensive as the Northern Campaign (északi hadjárat). Places are named in their present-day forms; Bratislava was Pozsony (Pressburg), Košice was Kassa and Prešov was Eperjes.
  - The base map shows Slovakia as part of Czechoslovakia from 28 October 1918; land the two armies held beyond the demarcation lines is shown as approximate areas.
