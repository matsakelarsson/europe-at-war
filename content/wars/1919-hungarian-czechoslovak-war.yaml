steps:
  - title: Upper Hungary changes hands
    date: November 1918 – May 1919
    when: "1918-11-02"
    borders: "1919-05-02"
    countries: [sk, hu, cz, ua]
    body:
      - Czechoslovakia declared independence on 28 October 1918 and claimed the Slovak-inhabited north of the Kingdom of Hungary. Small Czechoslovak units crossed into Upper Hungary in early November, and Hungarian troops drove some of them back, but the Allies backed the Czechoslovak claim and drew a demarcation line. In December Czechoslovak forces, among them legionaries returned from Italy, took Žilina, Nitra, Banská Bystrica and, at the end of the month, Košice. On 1 January 1919 they entered Bratislava, whose largely German and Hungarian population had hoped to make it a free city.
      - After the Hungarian Soviet Republic was proclaimed in March, its enemies moved together. In late April, as the Romanian army advanced to the Tisza, Czechoslovak troops occupied Subcarpathian Ruthenia with the Romanians and pushed south over the demarcation line into northern Hungary, entering Miskolc on 2 May. The two armies threatened to meet and cut off the young Soviet Republic from the north-east. Instead, Budapest’s government signed a truce with Romania and turned its new Red Army against Czechoslovakia.
    facts:
      - [Czechoslovak independence, "28 October 1918"]
      - [Bratislava occupied, "1 January 1919"]
      - [Miskolc occupied, "2 May 1919"]
