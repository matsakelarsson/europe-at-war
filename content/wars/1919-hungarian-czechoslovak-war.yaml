        atoms: [HU-BZ, HU-MI]
  - title: The Northern Campaign
    date: May – July 1919
    when: "1919-05-20"
    borders: "1919-07-04"
    countries: [sk, hu]
    body:
      - The Hungarian Red Army, with Colonel Aurél Stromfeld as its chief of staff, attacked in force on 20 May. It retook Miskolc and the industrial towns of the north, then advanced deep into Slovakia, taking Košice on 6 June and pushing on to Prešov and Bardejov, and drove a wedge between the Czechoslovak and Romanian armies. Many former officers of the old army fought for the Soviet Republic in the hope of restoring Hungary’s borders. On 16 June a Slovak Soviet Republic was proclaimed in Prešov, dependent on Budapest.
      - The Allies stepped in. In notes of 7 and 13 June, Georges Clemenceau ordered the Hungarians to leave Slovakia and promised that the Romanians would then pull back from the Tisza. Kun accepted, Stromfeld resigned in protest, and by the first days of July the Hungarian Red Army had withdrawn behind the demarcation line. The Slovak Soviet Republic collapsed on 7 July, and the Romanians stayed where they were. The Treaty of Trianon in June 1920 confirmed a border that left about a million Hungarians in Czechoslovakia.
