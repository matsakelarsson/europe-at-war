id: hungarian-romanian-war
name: Hungarian–Romanian War
start: "1918-11-13"
end: "1919-08-03"
tier: B
summary: A war fought as the Kingdom of Hungary broke up after the First World War. Romanian troops advanced through Transylvania to the Tisza in the spring of 1919, defeated the Hungarian Soviet Republic’s offensive in July and occupied Budapest in August, staying in Hungary until early 1920; the Treaty of Trianon then gave Romania Transylvania and the lands to its west.
countries: [hu, ro]
sides:
  - id: hu
    name: Hungary (the Hungarian Soviet Republic from March 1919)
    polities: [hungary]
    ink: olive
    moves: Hungarian moves
    success: Hungarian success
  - id: ro
    name: Romania
    polities: [romania]
    ink: gold
    moves: Romanian moves
    success: Romanian success
notes:
  - Places are named in their present-day forms; Oradea was Nagyvárad, Satu Mare was Szatmárnémeti and Cluj was Kolozsvár to Hungarians.
  - The base map follows the borders recognised at the time; land the Romanian army held beyond them is shown as approximate areas. Losses were small compared with the World War, about 3,670 Romanian soldiers killed and, by most estimates, between 2,000 and 6,000 Hungarians.
