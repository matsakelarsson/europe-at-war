steps:
  - title: Transylvania and the road to the Tisza
    date: November 1918 – May 1919
    when: "1918-11-13"
    borders: "1919-05-01"
    countries: [ro, hu]
    body:
      - As Austria-Hungary collapsed, Romania re-entered the war on 10 November 1918, and its troops crossed into Transylvania three days later. On 1 December an assembly of Transylvanian Romanians at Alba Iulia declared union with Romania, and the Romanian army moved west to lines set by the Allies. Hungary’s new government under Mihály Károlyi had demobilised most of its army. When the Allied Vix note of 20 March 1919 demanded a further Hungarian withdrawal, Károlyi resigned, and on 21 March communists and social democrats proclaimed the Hungarian Soviet Republic, led in practice by Béla Kun.
      - Kun’s government promised to defend Hungary’s borders and hoped for help from Soviet Russia. On 16 April, before the new Hungarian Red Army was ready, the Romanian army attacked. It took Oradea on 20 April and Debrecen on 23 April, the Székely Division of Transylvanian Hungarians laid down its arms, and by 1 May the Romanians stood along the Tisza. With Czechoslovak troops advancing from the north at the same time, the Soviet Republic seemed close to collapse, but a mass mobilisation of Budapest’s workers saved it.
    facts:
      - [Union declared at Alba Iulia, "1 December 1918"]
      - [Hungarian Soviet Republic proclaimed, "21 March 1919"]
      - [Romanian spring offensive, "16 April – 1 May 1919"]
