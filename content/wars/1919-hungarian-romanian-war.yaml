  - title: The Tisza and Budapest
    date: July 1919 – March 1920
    when: "1919-07-20"
    borders: "1919-08-04"
    countries: [hu, ro]
    body:
      - After withdrawing from Slovakia under Allied pressure, the Hungarian Red Army turned on the Romanians, whom the Allies had promised to pull back but who had not moved. On 20 July it crossed the Tisza at several points and pushed east for a few days, but the Romanians stopped it, counter-attacked and crossed the river on the night of 29–30 July. The Hungarian army fell apart. Kun’s government resigned on 1 August and its leaders fled to Austria, and on 3–4 August Romanian troops entered Budapest.
      - The Romanian army occupied Budapest and most of Hungary as far as Győr. It took rolling stock, livestock, grain and factory equipment as reparations, in defiance of protests from the Allied Supreme Council in Paris. Short-lived governments followed in Budapest, while officers of the counter-revolutionary National Army carried out a White Terror against communists, Jews and others. The Romanians left Budapest on 14 November, Admiral Miklós Horthy rode in two days later, and the last Romanian troops left Hungary in March 1920, before the Treaty of Trianon fixed the new border.
    facts:
      - [Hungarian Tisza offensive, "from 20 July 1919"]
      - [Romanian troops enter Budapest, "3–4 August 1919"]
      - [Romanians leave Budapest, "14 November 1919"]
