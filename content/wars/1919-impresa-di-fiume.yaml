id: impresa-di-fiume
name: Impresa di Fiume
start: "1919-09-12"
end: "1920-12-29"
tier: C
summary: The seizure of the Adriatic port of Fiume (now Rijeka, Croatia) by the nationalist poet Gabriele D’Annunzio and some 2,500 mutinous Italian soldiers and volunteers in September 1919, to force its annexation to Italy while the peace conference was still deciding its fate. D’Annunzio ruled the city for over a year, proclaiming the Italian Regency of Carnaro in September 1920, and refused to accept the Treaty of Rapallo, by which Italy and Yugoslavia made Fiume a free state. In the “Bloody Christmas” of 24–29 December 1920 the Italian army and navy forced him out, at the cost of about 60 dead.
countries: [hr, it]
