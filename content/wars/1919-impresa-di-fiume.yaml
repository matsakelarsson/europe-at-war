    name: Italy
    polities: [italy]
    ink: green
  - id: dan
    name: D’Annunzio’s legionaries
    ink: slate
notes:
  - The regency’s style, with its balcony speeches, black shirts and mass rallies, was later copied by Mussolini’s Fascists. The Free State of Fiume was ended in 1924, when Italy annexed the city by agreement with Yugoslavia.
