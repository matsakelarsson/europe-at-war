steps:
  - title: The Dáil, Soloheadbeg and the guerrilla war
    date: January 1919 – October 1920
    when: "1919-01-21"
    borders: "1920-10-25"
    countries: [ie, gb]
    body:
      - In the general election of December 1918 Sinn Féin won 73 of Ireland’s 105 seats. Its members refused to sit at Westminster, and on 21 January 1919 they met in Dublin’s Mansion House as Dáil Éireann and declared independence. The same day, at Soloheadbeg in County Tipperary, Volunteers led by Seán Treacy and Dan Breen, acting on their own initiative, shot dead two policemen guarding a cart of gelignite. Through 1919 the Volunteers, now called the Irish Republican Army, mostly raided for arms and freed prisoners, while Michael Collins’s “Squad” killed police detectives in Dublin. In September the British government banned the Dáil.
      - In 1920 the IRA moved on to attacking police barracks and ambushing patrols, and the RIC abandoned many isolated stations. Britain reinforced it with ex-servicemen recruited in Britain, from March the “Black and Tans” and from July the Auxiliary Division of former officers, who answered IRA attacks by killing suspects and burning creameries, homes and towns, among them Balbriggan. In March Tomás Mac Curtain, the Lord Mayor of Cork, was shot dead at home by men with blackened faces, and in October his successor, Terence MacSwiney, died on hunger strike in Brixton prison in London.
      - In Ulster the conflict took a sectarian turn. In July 1920 loyalists drove about 8,000 Catholics and left-wing Protestants out of the Belfast shipyards, and rioting, shootings and burnings in the city killed nearly 500 people by 1922, most of them Catholics. A mainly Protestant Ulster Special Constabulary was raised to support the police, and some of its members took part in reprisals.
    facts:
      - [First Dáil, "21 January 1919, Mansion House, Dublin"]
      - [Soloheadbeg ambush, "21 January 1919, two policemen killed"]
      - [Police reinforcements from Britain, "Black and Tans from March 1920, Auxiliaries from July 1920"]
    markers:
      - kind: event
        name: Mansion House
        date: 21 January 1919
        text: The first Dáil met here, adopted a declaration of independence and claimed the authority of the republic proclaimed in 1916.
        lonlat: [-6.258, 53.34]
      - kind: battle
        side: ira
        name: Soloheadbeg
        date: 21 January 1919
        text: Constables James McDonnell and Patrick O’Connell were shot dead; the ambush is usually taken as the first act of the war.
        lonlat: [-8.163, 52.51]
      - kind: event
        name: Cork
        date: 20 March 1920
        text: Tomás Mac Curtain was killed in front of his wife at his home. The inquest jury returned a verdict of wilful murder against the British prime minister, Lloyd George, and police officers.
        lonlat: [-8.47, 51.898]
      - kind: event
        name: Balbriggan
        date: 20–21 September 1920
        text: After a police head constable was shot dead, Black and Tans burned dozens of houses and a hosiery factory and killed two local men.
        lonlat: [-6.183, 53.609]
      - kind: event
        name: Belfast
        date: July 1920
        text: The shipyard expulsions began two years of sectarian violence in the city; many thousands of Catholics were driven from their jobs and homes.
        lonlat: [-5.93, 54.596]
  - title: Bloody Sunday, the burning of Cork and the Treaty
    date: November 1920 – December 1921
    when: "1920-11-21"
    borders: "1921-12-06"
    countries: [ie, gb]
    body:
      - On the morning of 21 November 1920, Bloody Sunday, Collins’s men shot dead about 15 men in Dublin, most of them British officers believed to be intelligence agents. That afternoon police and Auxiliaries opened fire on the crowd at a Gaelic football match in Croke Park, killing 14 civilians. A week later Tom Barry’s West Cork flying column wiped out a patrol of Auxiliaries at Kilmichael. Martial law was declared in four Munster counties on 10 December, and the next night, after an ambush in the city, Auxiliaries, Black and Tans and soldiers burned the centre of Cork.
      - About 1,000 people were killed between January and July 1921, the worst months of the war, most of them in Munster, Dublin and Belfast. Flying columns ambushed troops, as at Crossbarry in March; Britain executed IRA prisoners and burned houses in reprisal. In May the IRA burned the Custom House in Dublin, but five of its men were killed and more than 80 captured. Under the Government of Ireland Act, Northern Ireland was set up on 3 May 1921, and George V opened its parliament in Belfast on 22 June.
      - A truce began on 11 July 1921. Talks in London led to the Anglo-Irish Treaty, signed on 6 December, which created the Irish Free State, a self-governing dominion within the British Empire, and allowed Northern Ireland to opt out. The Dáil approved it on 7 January 1922 by 64 votes to 57, but the split over it, above all over the oath of fidelity to the king, led to civil war. In all, about 2,300 people had been killed, some 900 of them civilians.
    facts:
      - [Bloody Sunday, "21 November 1920, more than 30 killed in Dublin"]
      - [Truce, "11 July 1921"]
      - [Anglo-Irish Treaty, "signed 6 December 1921; approved by the Dáil 64–57"]
    markers:
      - kind: event
        name: Croke Park
        date: 21 November 1920
        text: During a raid on a football match between Dublin and Tipperary, police fired into the crowd, killing 14 civilians, among them the Tipperary player Michael Hogan and three children.
        lonlat: [-6.251, 53.361]
      - kind: battle
        side: ira
        name: Kilmichael
        date: 28 November 1920
        text: Barry’s column killed 17 of the 18 Auxiliaries in the patrol, and three of its own men died. Whether the IRA killed Auxiliaries after a false surrender is still disputed.
        lonlat: [-9.057, 51.812]
      - kind: event
        name: Cork
        date: 11–12 December 1920
        text: More than 40 businesses, 300 homes, the City Hall and the Carnegie Library were burned; firemen said British forces cut their hoses and shot at them.
        lonlat: [-8.465, 51.897]
      - kind: battle
        side: ira
        name: Crossbarry
        date: 19 March 1921
        text: Barry’s column of about 100 men fought its way out of an attempt by some 1,200 British troops to surround it.
        lonlat: [-8.645, 51.802]
        lp: l
      - kind: event
        name: Belfast
        date: 22 June 1921
        text: George V opened the Parliament of Northern Ireland in the City Hall and appealed for reconciliation; the truce followed three weeks later.
        lonlat: [-5.93, 54.596]
