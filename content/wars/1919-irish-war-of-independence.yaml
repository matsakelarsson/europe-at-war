id: irish-war-of-independence
name: Irish War of Independence
start: "1919-01-21"
end: "1921-07-11"
tier: B
summary: A guerrilla war between the Irish Republican Army, fighting for the Irish Republic declared by Dáil Éireann in January 1919, and British forces, including the police reinforcements known as the Black and Tans and the Auxiliaries. It ended in a truce in July 1921; the Anglo-Irish Treaty of December 1921 created the self-governing Irish Free State, while Northern Ireland, set up earlier that year, stayed in the United Kingdom.
countries: [ie, gb]
sides:
  - id: ira
    name: Irish Republic (Dáil Éireann and the IRA)
    ink: green
    moves: IRA moves
    success: IRA success
  - id: uk
    name: United Kingdom
    polities: [united-kingdom]
    ink: red
    moves: British moves
    success: British success
notes:
  - Also called the Anglo-Irish War and, in Ireland, the Tan War. Britain did not recognise the Irish Republic, and all of Ireland remained part of the United Kingdom until the Irish Free State was established on 6 December 1922.
  - The British forces were the army and the Royal Irish Constabulary (RIC), reinforced by recruits from Britain, and in the north the mainly Protestant Ulster Special Constabulary. The figure of about 2,300 dead is based on research by the historian Eunan O’Halpin; other counts differ.
