id: kuwait-najd-war
name: Kuwait–Najd War
start: "1919"
end: "1920-10"
tier: C
summary: "A border war between Kuwait and Ibn Saud’s Sultanate of Najd, fought mainly by the Ikhwan warriors of Faisal al-Duwaish. After the death of Kuwait’s ruler Mubarak al-Sabah in 1915, relations with his former protégé Ibn Saud soured over the border and over tribes and trade. In May 1920 about 2,000 Ikhwan routed a Kuwaiti force of a few hundred at Hamdh, and Kuwait’s people built a mud wall around the town in a few weeks. On 10 October 1920 several thousand Ikhwan attacked Jahra, west of the town; its defenders under Sheikh Salim al-Mubarak held out in the Red Fort, and the Ikhwan withdrew as British warships, aircraft and troops arrived. The Uqair Protocol of December 1922, drawn up by Britain, gave Najd about two-thirds of the land Kuwait had claimed, and a Saudi trade blockade of Kuwait followed from 1923 to 1937."
