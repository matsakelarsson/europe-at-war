  - title: The Red Army in Urga
    date: May – September 1921
    when: "1921-06-11"
    borders: "1921-07-11"
    countries: [mn, ru]
    body:
      - In May 1921 Ungern, hoping to raise Transbaikalia against the Bolsheviks, ordered an attack on Soviet territory. One brigade under General Boris Rezukhin raided across the border west of the Selenga, while Ungern’s own brigade moved on Troitskosavsk, the Russian half of Kyakhta, where Soviet and Mongolian troops beat it in fighting on 11–13 June. Soviet troops of the 5th Army and of the Far Eastern Republic, with Sükhbaatar’s partisans, crossed into Mongolia on 28 June and entered Urga with little resistance on 6 July 1921.
      - On 10 July the party proclaimed a people’s government under Dogsomyn Bodoo, with the Bogd Khan as a monarch with limited powers; he was enthroned again on 11 July, which became Mongolia’s national day. Ungern made a last raid north in July and reached Novoselenginsk on 1 August before turning back. His officers rose against him, his Mongol escort left him, and on 20 August he was taken by a Red partisan detachment under Petr Shchetinkin. After a six-hour trial in Novonikolayevsk (today Novosibirsk) on 15 September 1921 he was shot the same night.
      - Soviet troops stayed in Mongolia until 1925. Sükhbaatar died in 1923, and after the Bogd Khan’s death in May 1924 the Mongolian People’s Republic was proclaimed on 26 November 1924, a one-party state closely tied to the Soviet Union. China did not recognise the new order.
    facts:
      - [Ungern defeated at Troitskosavsk, "11–13 June 1921"]
      - [Red Army and partisans enter Urga, "6 July 1921"]
      - [People’s government and limited monarchy, "10–11 July 1921"]
      - [Ungern shot, "15 September 1921, Novonikolayevsk"]
