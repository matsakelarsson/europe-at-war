  - title: Ungern takes Urga
    date: February – March 1921
    when: "1921-02-04"
    borders: "1921-02-22"
    countries: [mn, cn, ru]
    body:
      - Ungern attacked again at the start of February 1921. Fighting for the Chinese outer lines began on 2 February, and on 4 February his troops stormed the barracks and the Chinese trading quarter; the city fell that evening. The Chinese garrison, perhaps 7,000 men by one account, lost about 1,500 dead, Ungern about 60, and many of the Chinese fled north towards the Russian border. In the following weeks the Chinese garrisons and officials in Uliastai and Khovd withdrew to Xinjiang. On 22 February Ungern restored the Bogd Khan as monarch of an independent Mongolia. His men looted the Chinese shops and killed the Russian Jews of Urga, some 43–50 people, and suspected Bolsheviks; a list of the deaths ordered by or in the name of Ungern during his time in Mongolia counts 846 people.
      - The Mongolian People’s Party, with Soviet weapons and advisers, held its first congress in secret at Kyakhta on 1–3 March 1921 and formed a provisional government on 13 March. On 18 March its partisan army, about 400 men under Sükhbaatar, took the Chinese garrison of Kyakhta Maimaicheng, just across the border; the date is still celebrated as the founding day of the Mongolian army. By April the partisans numbered about 800.
    facts:
