notes:
  - Under the Kyakhta agreement of 1915 Outer Mongolia was an autonomous state under Chinese suzerainty, ruled by the Bogd Khan (the Eighth Jebtsundamba Khutughtu). The Republic of China regarded the abolition of autonomy in 1919 as the restoration of its sovereignty; Mongolian nationalists saw it as an occupation. The Republic of China recognised Mongolia’s independence only in 1946, after a plebiscite, and the People’s Republic of China in 1949.
  - Mongolian and Soviet histories long presented the events as a people’s revolution; many historians stress the decisive role of the Red Army and of Comintern advisers. Some sources date the revolution from the party conference of 1 March 1921 to the enthronement of 11 July 1921.
  - Urga is today’s Ulaanbaatar. Kyakhta Maimaicheng, the Chinese trading town opposite Russian Kyakhta (then Troitskosavsk), is today’s Altanbulag.
