steps:
  - title: Xu Shuzheng and the end of autonomy
    date: October 1919 – November 1920
    when: "1919-10"
    borders: "1920-02-01"
    countries: [mn, cn, ru]
    body:
      - The Russian Revolution removed the power that had protected Mongolia’s autonomy. A few hundred Chinese soldiers came to Urga in 1918 at the request of Mongolian ministers worried by the Russian civil war, and in 1919 the pan-Mongol plans of the Cossack ataman Grigory Semyonov alarmed both the Mongolian nobility and Beijing. In October 1919 Xu Shuzheng, a general of the Anhui clique that then dominated the Beiyang government, arrived in Urga with about 4,000 troops, followed by more. On 17 November he accepted a petition from Mongolian ministers, which the Bogd Khan did not sign, renouncing autonomy, and at a ceremony that followed (sources date it to December 1919 or February 1920) the Bogd Khan’s government had to bow before Xu and the Chinese flag. Xu was recalled after the Anhui clique lost the Zhili–Anhui war in July 1920, but the troops stayed.
      - In Urga two secret circles of young Mongols, among them the soldier Damdin Sükhbaatar and Khorloogiin Choibalsan, merged on 25 June 1920 into the Mongolian People’s Party, and that summer a party delegation travelled to Soviet Russia to ask for help. In October 1920 a new force entered Mongolia from Transbaikalia, the Asiatic Cavalry Division of the Baltic German general Roman von Ungern-Sternberg, about 1,500 Cossacks, Buryats, Mongols and others who had served under Semyonov. Its attacks on Urga on 26–27 October and 2–4 November were beaten off by the Chinese garrison with heavy losses.
    facts:
      - [Xu Shuzheng arrives in Urga, "October 1919, with about 4,000 troops"]
      - [Autonomy renounced, "17 November 1919"]
      - [Mongolian People’s Party founded, "25 June 1920"]
      - [Ungern repulsed at Urga, "26 October – 4 November 1920"]
