id: mongolian-revolution-of-1921
name: Mongolian Revolution of 1921
start: "1919-10"
end: "1921-09-15"
tier: B
summary: "The struggle over Outer Mongolia after the Russian Revolution, which ended with a Soviet-backed revolutionary government in Urga. In 1919 the Beiyang government of the Republic of China sent troops under Xu Shuzheng, who made the Mongolian nobles give up the autonomy Mongolia had won in 1911–1915. In February 1921 the White general Roman von Ungern-Sternberg and his Asiatic Cavalry Division drove the Chinese out of Urga and restored the Bogd Khan, the head of the Mongolian Buddhist church, as monarch, while killing Jews and suspected Bolsheviks. In March the Mongolian People’s Party, under Damdin Sükhbaatar, formed a provisional government on the Soviet border and took the Chinese post at Kyakhta. When Ungern attacked Soviet territory in June, the Red Army and the Mongolian partisans defeated him and entered Urga on 6 July 1921. The Bogd Khan stayed on as a limited monarch under a people’s government, Ungern was captured and shot, and Soviet troops remained until 1925; after the Bogd Khan’s death in 1924 the Mongolian People’s Republic was proclaimed."
