notes:
  - Teschen is Cieszyn in Polish and Těšín in Czech. The town itself was divided in 1920, into Cieszyn in Poland and Český Těšín in Czechoslovakia. The 1920 decision also divided the small regions of Spiš and Orava between the two states.
  - A ceasefire agreement followed in Paris on 3 February 1919, setting a new demarcation line until the final division.
