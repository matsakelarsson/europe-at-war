id: polish-czechoslovak-war
name: Polish–Czechoslovak War
start: "1919-01-23"
end: "1919-01-30"
tier: C
summary: A short war, known in Czech as the Seven-Day War, over Teschen (Cieszyn Silesia), a former Austrian duchy with valuable coal mines and the railway linking Bohemia with Slovakia. Czechoslovak troops attacked the Polish-administered part of the region on 23 January 1919, while most of Poland’s army was fighting in eastern Galicia, and advanced to the Vistula before Allied pressure stopped them on 30–31 January. About 140 soldiers were killed, and Czechoslovak troops killed some 20 Polish prisoners at Stonava. A plebiscite planned for 1920 was abandoned, and on 28 July 1920 the Allied Conference of Ambassadors divided Teschen along the Olza, leaving the coalfield and a large Polish minority in Czechoslovakia. Poland seized that part, Zaolzie, in October 1938.
countries: [cz, pl]
