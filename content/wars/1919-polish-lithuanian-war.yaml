id: polish-lithuanian-war
name: Polish–Lithuanian War
start: "1919-05"
end: "1920-11-29"
tier: C
summary: An undeclared war between Poland and Lithuania over Vilnius and the Suwałki region, fought alongside the Polish–Soviet War and ended by a League of Nations ceasefire on 29 November 1920. Two days after the Suwałki Agreement of 7 October 1920 had left Vilnius on the Lithuanian side, General Lucjan Żeligowski, with Józef Piłsudski’s secret backing, staged a “mutiny” and took the city, where the Republic of Central Lithuania was proclaimed; Poland annexed it in 1922, and Lithuania refused diplomatic relations until 1938.
