        lonlat: [27.559, 53.901]
      - kind: taken
        side: ru
        name: Vilnius
        date: 14 July 1920
        text: Taken by the Red Army, which handed the city to Lithuania in August under the Soviet–Lithuanian peace treaty.
        lonlat: [25.28, 54.687]
      - kind: taken
