        lonlat: [30.523, 50.45]
      - kind: taken
        side: ru
        name: Zhytomyr
        date: 7 June 1920
        text: Budyonny’s cavalry broke into the town far behind the Polish front.
        lonlat: [28.667, 50.25]
      - kind: taken
