  - title: The Red Army advances
    date: May – August 1920
    when: "1920-05-14"
    borders: "1920-08-01"
    countries: [pl, by, ua, lt]
    body:
      - On 14 May Mikhail Tukhachevsky’s Western Front attacked in northern Belarus and drove about 100 km into Polish-held territory before a Polish counter-attack pushed it back by 8 June. In the south Semyon Budyonny’s First Cavalry Army broke the Polish front on 5 June and wrecked Zhytomyr behind it. The Poles abandoned Kyiv on 10 June, destroying its bridges and power stations, and fell back west with Petliura’s army.
      - Tukhachevsky attacked again on 4 July with a much larger force. His order of the day declared that “over the corpse of White Poland lies the path to world conflagration”. Minsk fell on 11 July, Vilnius on 14 July, Grodno on 19 July and Brest on 29 July. On 11 July Britain proposed an armistice along a line later named after its foreign secretary, Lord Curzon, but the Soviet leadership pressed on. A Provisional Polish Revolutionary Committee, set up on 23 July, began to govern captured Polish territory from Białystok.
    facts:
      - [Tukhachevsky’s second offensive, "from 4 July 1920"]
      - [Curzon note, "11 July 1920"]
      - [Brody–Berestechko, "29 July – 3 August 1920"]
    markers:
