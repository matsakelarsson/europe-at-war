  - title: Komarów and the Niemen
    date: August – October 1920
    when: "1920-08-29"
    borders: "1920-10-12"
    countries: [pl, by, lt, ua]
    body:
      - Budyonny’s cavalry army, ordered north too late to help at Warsaw, turned on Zamość, which a Ukrainian division and Polish units held from 29 to 31 August. On 31 August Polish cavalry under Juliusz Rómmel beat Budyonny at Komarów, often called the greatest cavalry battle of the 20th century. In the north Tukhachevsky, reinforced, tried to hold a new line on the Niemen. From 20 September the Poles attacked at Grodno, while a flanking force marched through Lithuanian-held ground to Druskininkai and on towards Lida, behind the Soviet lines.
      - Grodno fell on 26 September and the Western Front fell back east in disorder, some of its divisions breaking up; Polish troops entered Minsk in mid-October. Both governments were exhausted. A preliminary peace was signed in Riga on 12 October and an armistice came into force on 18 October, with the front far east of the Curzon Line. Meanwhile, on 9 October, Polish troops under General Lucjan Żeligowski staged a “mutiny” and seized Vilnius from Lithuania.
    facts:
      - [Battle of Komarów, "31 August 1920, Polish victory"]
      - [Battle of the Niemen, "September 1920, Polish victory"]
      - [Armistice, "18 October 1920"]
    markers:
      - kind: held
