id: polish-soviet-war
name: Polish–Soviet War
start: "1919-02-14"
end: "1921-03-18"
tier: A
summary: A war between the reborn Polish state and Soviet Russia for the lands between them, today in Belarus, Lithuania and Ukraine. After Polish forces reached Kyiv and the Red Army reached the gates of Warsaw, Poland won the Battle of Warsaw in August 1920, and the Peace of Riga in March 1921 divided Belarus and Ukraine between Poland and the Soviet republics.
countries: [pl, by, ua, lt, lv, ru]
sides:
  - id: pl
    name: Poland
    polities: [poland]
    ink: magenta
    moves: Polish and allied moves
    success: Polish success
  - id: ua
    name: Ukrainian People’s Republic
    polities: [ukraine]
    ink: gold
    moves: Ukrainian moves
    success: Ukrainian success
  - id: ru
    name: Soviet Russia
    polities: [ussr]
    ink: red
    moves: Red Army moves
    success: Soviet success
notes:
  - Also called the Polish–Bolshevik War. Soviet Russia had adopted the Gregorian calendar in February 1918, so all dates are New Style.
  - Lwów is today’s Lviv in Ukraine, and Vilnius was Wilno to Poles. Other places are named in their present-day forms.
  - The base map does not follow the moving front, which is shown instead by approximate front lines drawn from general accounts.
