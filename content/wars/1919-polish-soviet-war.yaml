  - title: The Peace of Riga
    date: 18 March 1921
    when: "1921-03-18"
    borders: "1921-03-18"
    countries: [pl, by, ua, lv]
    body:
      - The Peace of Riga was signed on 18 March 1921 by Poland and by Soviet Russia, acting also for Soviet Belarus, and Soviet Ukraine. It fixed a border far east of the Curzon Line, leaving western Belarus and western Volhynia in Poland, while Minsk and central Ukraine stayed Soviet. Poland recognised the Soviet republics and abandoned its alliance with Petliura, whose soldiers in Poland were interned. Belarusians and Ukrainians, who had hoped for states of their own, were divided between Poland and the Soviet Union.
      - About 100,000 Polish soldiers had been killed or gone missing, and Soviet losses were also heavy. Prisoners on both sides died in large numbers of disease, hunger and neglect, among them some 16,000–20,000 of about 80,000 Soviet prisoners held in Polish camps. Jewish communities suffered pogroms by soldiers of several armies, among them the shooting of 35 Jews by Polish troops in Pinsk in April 1919 and massacres by Budyonny’s cavalry in Ukraine.
    facts:
      - [Peace of Riga, "18 March 1921"]
      - [Polish dead and missing, "about 100,000"]
      - [Soviet prisoners who died in Polish camps, "about 16,000–20,000"]
    markers:
      - kind: treaty
        name: Peace of Riga
        date: 18 March 1921
        text: Negotiated by Jan Dąbski for Poland and Adolph Joffe for the Soviet side. The border it drew lasted until 1939.
        lonlat: [24.106, 56.949]
      - kind: event
        name: Pinsk massacre
        date: 5 April 1919
        text: Polish troops shot 35 Jewish residents of the town, whom their commander accused of supporting the Bolsheviks.
        lonlat: [26.103, 52.115]
