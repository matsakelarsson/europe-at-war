steps:
  - title: Into Belarus and Ukraine
    date: February 1919 – May 1920
    when: "1919-02-14"
    borders: "1920-05-07"
    countries: [pl, by, ua, lt, lv]
    body:
      - As German troops withdrew from the east after the First World War, Polish and Soviet forces moved into the lands between them, and they first clashed at Bereza Kartuska on 14 February 1919. Poland’s head of state, Józef Piłsudski, hoped to build a federation with Lithuania, Belarus and Ukraine that would keep Russia at a distance. Polish troops took Vilnius in April 1919 and Minsk in August, and in January 1920, with Latvian forces, Daugavpils on the Daugava.
      - On 21 April 1920 Piłsudski allied with Symon Petliura’s Ukrainian People’s Republic, which gave up its claim to eastern Galicia in return for military help against the Soviets. Polish and Ukrainian troops attacked four days later, took Zhytomyr on 26 April and entered Kyiv on 7 May. Many towns fell without a fight, because the Red Army withdrew rather than give battle. Its forces had not been destroyed, and few Ukrainians came forward to join Petliura.
    facts:
      - [First clash, "Bereza Kartuska, 14 February 1919"]
      - [Treaty of Warsaw, "21 April 1920, Poland and the Ukrainian People’s Republic"]
      - [Kyiv entered, "7 May 1920"]
