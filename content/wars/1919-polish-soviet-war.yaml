  - title: The Battle of Warsaw
    date: 12–25 August 1920
    when: "1920-08-12"
    borders: "1920-08-13"
    countries: [pl]
    body:
      - By mid-August three Soviet armies were closing on Warsaw from the east and north-east, while the 4th Army and a cavalry corps swung west along the East Prussian border towards the lower Vistula. Piłsudski and his chief of staff, Tadeusz Rozwadowski, planned to hold the bridgehead before the capital while a strike force gathered to the south-east on the Wieprz. Polish codebreakers were reading Soviet radio messages. The assault began on 12 August. Radzymin changed hands several times, and on 14 August General Władysław Sikorski’s 5th Army counter-attacked across the Wkra.
      - On 16 August Piłsudski’s strike force attacked north from the Wieprz into the thinly held Soviet flank, scattered the Mozyr Group and cut behind the armies before Warsaw. The Red Army fell back in disorder. By 25 August the pursuit had reached the East Prussian border, where the Soviet 4th Army and the cavalry corps crossed and were interned. Poland took more than 50,000 prisoners. Piłsudski’s political opponents called the victory the “Miracle on the Vistula”, crediting providence rather than him.
    facts:
      - [Battle of Warsaw, "12–25 August 1920, Polish victory"]
      - [Counter-offensive from the Wieprz, "16 August 1920"]
      - [Interned in East Prussia, "about 45,000 Soviet troops"]
    markers:
