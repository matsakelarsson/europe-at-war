id: silesian-uprisings
name: Silesian Uprisings
start: "1919-08-16"
end: "1921-07-05"
tier: C
summary: Three risings by Polish insurgents in German Upper Silesia, in August 1919, August 1920 and May–July 1921, against German police, army and Freikorps units. After a plebiscite on 20 March 1921 gave about 60 per cent of the vote to Germany, the third and largest rising seized much of the region; the Allies then divided it in October 1921, giving Poland the smaller share of the land but most of the coal mines and heavy industry.
countries: [pl, de]
