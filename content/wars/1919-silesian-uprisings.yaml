    moves: Insurgent moves
    success: Insurgent success
  - id: de
    name: Germany
    polities: [germany]
    ink: slate
    moves: German moves
    success: German success
notes:
  - Several thousand people may have died in the fighting of 1919–1921, most of them in the third rising. Poland took over its share of Upper Silesia in June 1922.
