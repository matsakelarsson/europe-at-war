id: third-anglo-afghan-war
name: Third Anglo-Afghan War
start: "1919-05-03"
end: "1919-08-08"
tier: B
summary: A short war between Afghanistan and British India in 1919. The new emir, Amanullah Khan, proclaimed Afghanistan fully independent and sent troops across the frontier, where they took the springs at Bagh in the Khyber Pass. The British drove them back, advanced to Dakka, took Spin Boldak and relieved Thal, which Nadir Khan had besieged, and their aircraft bombed Jalalabad and Kabul. Afghanistan asked for an armistice in June. By the Treaty of Rawalpindi Britain gave up control of Afghan foreign policy, and Afghanistan accepted the existing border with India.
countries: [af, pk]
sides:
  - id: af
    name: Afghanistan and frontier tribes
    polities: [afghanistan]
    ink: green
    moves: Afghan and tribal moves
    success: Afghan success
  - id: gb
    name: British India
    polities: [united-kingdom]
    ink: red
    moves: British and Indian moves
    success: British success
notes:
  - In Afghanistan the war is remembered as the War of Independence, and 19 August is celebrated as Independence Day. British accounts call it the Third Afghan War and mostly treat it as a defensive victory; historians differ on whether it was a military stalemate or an Afghan defeat that still won Afghanistan its diplomatic aim.
  - The frontier districts in today’s Pakistan were part of British India.
