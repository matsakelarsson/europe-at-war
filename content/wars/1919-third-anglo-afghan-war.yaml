steps:
  - title: Bagh and the Khyber
    date: May 1919
    when: "1919-05-03"
    borders: "1919-05-11"
    countries: [af, pk]
    body:
      - Emir Habibullah had kept Afghanistan neutral in the First World War, though an Ottoman-German mission spent months in Kabul urging him to attack India. After the war he asked for a seat at the peace conference and was refused, and in February 1919 he was murdered on a hunting trip. His son Amanullah took the throne in Kabul, had his uncle Nasrullah imprisoned, and declared Afghanistan fully independent, rejecting the British control of its foreign relations that dated from the Treaty of Gandamak of 1879. Facing opponents at home and seeing unrest in India after the Amritsar massacre in April, he called for a holy war and sent armies towards the frontier from Jalalabad, from Khost under his commander-in-chief Nadir Khan, and from Kandahar.
      - On 3 May Afghan troops crossed the frontier at the western end of the Khyber Pass and occupied Bagh, whose springs supplied the British fort at Landi Kotal. A rising planned in Peshawar for 8 May was forestalled when troops cordoned off the city. Britain declared war on 6 May. A first attack on Bagh failed on 9 May, but on 11 May British and Gurkha battalions drove the Afghans back over the border, killing about 100. British and Indian troops occupied Dakka, inside Afghanistan, on 13 May and beat off Afghan attacks there until 17 May. Behind them the local Khyber Rifles began to desert and were disbanded. Aircraft bombed Dakka and Jalalabad, and on 24 May a single Handley Page bomber flew from India to Kabul and dropped bombs near the royal palace. It did little damage but shook the city.
    facts:
