  - title: Spin Boldak, Thal and the peace
    date: May – August 1919
    when: "1919-05-27"
    borders: "1919-08-08"
    countries: [af, pk]
    body:
      - In the south, troops from Quetta stormed the Afghan fort of Spin Boldak with scaling ladders on 27 May. In the centre the war went worse for the British. The posts in the Kurram valley and Waziristan were given up, and many men of the Waziristan militias deserted; at Wana the South Waziristan Militia turned on its officers. Nadir Khan, with some 14 battalions and tribal fighters, came down from Khost and from 28 May besieged and shelled the fort of Thal, held by four inexperienced Indian battalions. On 1 June a relief brigade under Brigadier-General Reginald Dyer, the officer responsible for the Amritsar massacre, broke through the tribesmen blocking the road.
      - Amanullah had already asked for an armistice, which came into force on 3 June. The Treaty of Rawalpindi, signed on 8 August 1919, ended the British subsidy and with it Britain’s claim to direct Afghan foreign policy, while Afghanistan accepted the frontier, the Durand Line, as it stood. A further treaty in 1921 confirmed full independence. About 1,000 Afghans were killed in action. The British and Indian forces lost 236 killed and 615 wounded, and another 566 men died of cholera and 344 of other causes. Weapons left behind and deserters from the militias fuelled a tribal revolt in Waziristan that lasted into the 1920s.
    facts:
