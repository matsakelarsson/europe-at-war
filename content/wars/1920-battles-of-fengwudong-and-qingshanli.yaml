id: battles-of-fengwudong-and-qingshanli
name: Battles of Fengwudong and Qingshanli
start: "1920-06-04"
end: "1921-05"
tier: B
summary: "The largest clashes between Korean independence armies and the Japanese army, fought in 1920 in Jiandao (Gando), the region of China’s Jilin province north of the Tumen River where hundreds of thousands of Koreans lived. After the March First Movement of 1919, armed Korean groups based there raided Japanese posts across the river in Korea. On 7 June 1920 Hong Beom-do’s and Choe Jin-dong’s forces ambushed a pursuing Japanese battalion in the valley of Fengwudong (Bongo-dong). In October, after an attack on the Japanese consulate at Hunchun, Japan sent a large force, by Korean estimates 18,000–20,000 men, into Jiandao with China’s reluctant consent, and from 21 to 26 October the units of Kim Jwa-jin and Hong Beom-do fought a series of actions in the forests around Qingshanli (Cheongsan-ri) before slipping away north. Korean accounts count these as great victories with hundreds or more than a thousand Japanese dead; Japanese army records give only a handful. Japanese troops then burned Korean villages and killed thousands of their people in what Koreans call the Gyeongsin massacre or Gando massacre, and the independence armies withdrew towards Soviet Russia."
countries: [cn, kr, kp, jp]
sides:
  - id: ki
    name: Korean independence armies (Northern Korean Army Command, Northern Military Administration Office and allies)
    polities: [korean-independence-armies]
    ink: teal
    moves: Korean independence army moves
    success: Korean success
  - id: jp
    name: Empire of Japan (Korea Army and units from the Russian Far East)
    polities: [japan]
    ink: red
    moves: Japanese moves
    success: Japanese success
notes:
  - The figures for both battles are among the most disputed of the period. Korean accounts, starting with the reports of the Provisional Government of the Republic of Korea in Shanghai in 1920, give Japanese losses of 157 killed at Fengwudong and from about 1,200 killed to 3,300 killed and wounded at Qingshanli; Japanese army reports give 1 killed at Fengwudong and 11 killed in the whole Jiandao expedition. One Korean veteran later wrote that the Korean claims were greatly exaggerated. Historians generally agree that both were Korean tactical successes, whatever the numbers.
  - Jiandao belonged to the Chinese province of Jilin, ruled by Zhang Zuolin’s Fengtian clique. China protested against the entry of Japanese troops but agreed to it under pressure on 16 October 1920. Place names are given in pinyin with the Korean reading in brackets.
