steps:
  - title: Fengwudong
    date: 4–7 June 1920
    when: "1920-06-07"
    borders: "1920-06-07"
    countries: [cn, kp, kr, jp]
    body:
      - After the March First Movement of 1919, Korean nationalists in Jiandao, the Korean-settled borderland of China’s Jilin province, formed armed units with weapons bought from Czechoslovak legionaries and Russians in the Far East. In the spring of 1920 they crossed the Tumen River into Korea dozens of times to attack Japanese police and gendarmerie posts. On 4 June a platoon attacked a gendarmerie patrol near Jongseong and withdrew to Samdunja on the Chinese bank; a Japanese company crossed the river after it and was ambushed.
      - The Japanese 19th Division at Nanam then sent a pursuit battalion under Major Yasukawa Jirō across the Tumen. On 7 June it followed the Korean units into the valley of Fengwudong (Bongo-dong), a Korean village and base of the independence army about 16 km north of the river, where some 1,200–1,300 men of the Northern Korean Army Command under Hong Beom-do and Choe Jin-dong waited on the hills around the evacuated village. Caught in a crossfire, the Japanese withdrew after several hours. The Korean side reported 157 Japanese killed and its own losses as four killed; Japanese reports admitted one killed and two wounded. It was the first open victory of the independence armies over the Japanese army, and it led Japan to plan a full-scale operation in Jiandao.
