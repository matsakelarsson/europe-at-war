  - title: Hunchun and Qingshanli
    date: October 1920
    when: "1920-10-21"
    borders: "1920-10-21"
    countries: [cn, kr, kp, jp]
    body:
      - On 2 October 1920 an armed band of several hundred men, mostly Chinese, attacked the town of Hunchun and burned the branch of the Japanese consulate, killing thirteen Japanese, among them the head of the consular police. Korean historians regard the attack as instigated by Japan, which they say had hired the band’s leader; Japanese accounts blamed Koreans among the attackers. Japan used it to send a force, by Korean estimates some 18,000–20,000 men, from the 19th Division in Korea and from units returning from Siberia into Jiandao, after forcing the Jilin authorities to agree on 16 October.
      - The Korean units, warned in time, moved west into the forests at the foot of Mount Baekdu. On 21 October Kim Jwa-jin’s Northern Military Administration Office Army, with some 600 men in the narrow valley of Baiyunping (Baegunpyeong) near Qingshanli, ambushed the vanguard of the Japanese Azuma (Higashi) column. Over the next five days Kim Jwa-jin’s and Hong Beom-do’s forces fought further actions at Wanlougou, Yulangcun (Eorangchon), the largest of the battles, and other places, then broke contact and marched north. Korean sources give their own losses as about 60 killed. Qingshanli became the best-known battle of the armed independence movement in Korea, celebrated as the “great victory of Cheongsan-ri”.
    facts:
