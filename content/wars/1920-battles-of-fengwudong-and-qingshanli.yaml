  - title: The Gando massacre and the retreat to Russia
    date: October 1920 – 1921
    when: "1920-10-30"
    borders: "1920-11-05"
    countries: [cn, kr, kp, jp, ru]
    body:
      - Unable to catch the armed units, the Japanese troops turned on the Korean villages that had supported them. Soldiers surrounded villages, shot or bayoneted the men, burned houses, churches and schools, and in places burned the bodies. At Jangam-dong (Norubawi), a Christian village north of Longjing, troops from the Russian Far East killed some 33 men on 30 October and set fire to the church; a Canadian missionary, Stanley Martin, came the next day and reported what he saw. The Provisional Government counted 3,469 Koreans killed between 9 October and 5 November alone; with the killings of the following months, estimates of the dead reach 5,000 or more. Japan withdrew most of its troops in December 1920 and the last in May 1921.
      - The independence armies regrouped at Mishan near the Russian border as the Korean Independence Corps and crossed into Soviet Russia in early 1921, hoping for Soviet arms. At Svobodny (Alekseyevsk) on the Zeya, the “Free City”, quarrels among the Korean groups ended on 28 June 1921 with Red Army troops and a rival Korean unit disarming them by force; hundreds were killed, captured or drowned. Hong Beom-do stayed in the Soviet Union and died in Kazakhstan in 1943; Kim Jwa-jin returned to Manchuria and was assassinated in 1930.
    facts:
      - [Jangam-dong massacre, "30 October 1920"]
      - [Koreans killed, "3,469 counted for 9 October – 5 November 1920; at least 5,000 in all"]
      - [Free City incident, "28 June 1921"]
