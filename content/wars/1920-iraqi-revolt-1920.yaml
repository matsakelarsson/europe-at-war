  - title: Reconquest, and a king
    date: September 1920 – August 1921
    when: "1920-09"
    borders: "1920-11"
    countries: [iq]
    body:
      - The commander in Iraq, General Aylmer Haldane, received reinforcements from India and Persia, and the War Secretary, Winston Churchill, sent more aircraft. In September British columns cleared the Diyala and retook Shahraban. In October they relieved Kufa and, coming up the Euphrates from Ur, Samawah, and Karbala and Najaf submitted, handing over rifles and paying fines. Troops burned villages on the way, and the Royal Air Force bombed and machine-gunned tribesmen and villages, flying some 4,000 hours and dropping 97 tons of bombs. Some tribes fought on into November, and unrest flared in places until 1922.
      - Between about 2,000 and 10,000 Iraqis and around 1,000 British and Indian soldiers died. The revolt cost Britain some £40 million, twice the yearly budget for Iraq. Britain decided to rule through Iraqis. Sir Percy Cox returned as high commissioner in October 1920 and set up an Arab council of ministers, and at the Cairo Conference of March 1921 Churchill, now Colonial Secretary, chose Faisal, whom the French had just driven out of Syria, as king. Faisal was crowned in Baghdad on 23 August 1921. The mandate lasted until 1932, and the Royal Air Force kept order from the air. For Iraqis the revolt became a founding event of their nation, a time when Shia and Sunni had stood together.
    facts:
      - [Najaf and Karbala submit, "October 1920"]
      - [Dead, "about 2,000–10,000 Iraqis; around 1,000 British and Indian soldiers"]
      - [Faisal I crowned, "23 August 1921"]
