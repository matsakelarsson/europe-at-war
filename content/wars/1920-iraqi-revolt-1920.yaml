steps:
  - title: The Euphrates rises
    date: June–August 1920
    when: "1920-06-30"
    borders: "1920-07"
    countries: [iq]
    body:
      - British and Indian troops had taken Basra in 1914, Baghdad in 1917 and Mosul after the armistice of 1918. At the San Remo conference in April 1920 the Allies gave Britain a League of Nations mandate over the country. Its administration under the acting civil commissioner, Arnold Wilson, was run by British and Indian officials and collected taxes far more strictly than the Ottomans had. Iraqi officers who had served the Arab government of Faisal in Damascus wanted an Arab state, and the leading Shia cleric, Muhammad Taqi al-Shirazi of Karbala, ruled that serving the British administration was forbidden. In May Sunni and Shia townspeople met together in the mosques of Baghdad and chose delegates to demand independence; Wilson dismissed their demands. On 4 June tribesmen and Arab officers from Syria killed the British political officer and others at Tal Afar in the north before a British column retook the town.
      - The armed revolt began on 30 June at Rumaitha, when tribesmen broke into the jail and freed Shaalan Abu al-Jun, a sheikh of the Zawalim whom the British had arrested; the small garrison was besieged until relieved on 20 July. The tribes of the middle Euphrates rose one after another, encouraged by a new fatwa of al-Shirazi allowing the use of force. On 24 July a British column of the Manchester Regiment on its way from Hillah to al-Kifl was attacked at night and lost heavily, many of its men taken prisoner. By August the rebels held most of the middle Euphrates and had the British garrisons of Kufa and Samawah under siege, and in mid-August tribes rose along the Diyala, north-east of Baghdad, taking Shahraban. On 12 August Lieutenant-Colonel Gerard Leachman, a political officer, was shot dead near Fallujah during a meeting with Sheikh Dhari al-Mahmud.
    facts:
      - [Tal Afar rising, "4 June 1920"]
      - [Revolt begins at Rumaitha, "30 June 1920"]
      - [Manchester column ambushed, "24 July 1920"]
