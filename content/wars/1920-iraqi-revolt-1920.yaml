id: iraqi-revolt-1920
name: Iraqi revolt of 1920
start: "1920-06"
end: "1920-10"
tier: B
summary: A rising against British rule in Iraq, which Britain had conquered from the Ottoman Empire in the First World War and received as a League of Nations mandate in April 1920. Shia clerics, tribal sheikhs of the Euphrates and nationalist former Ottoman officers, Shia and Sunni together, demanded an Arab government. The tribes held most of the middle Euphrates for weeks before British and Indian reinforcements and the Royal Air Force put the revolt down by the end of October. Its cost led Britain to rule Iraq indirectly, through King Faisal I, from 1921.
countries: [iq]
sides:
  - id: gb
    name: British forces (United Kingdom and British India)
    polities: [united-kingdom]
    ink: red
    moves: British moves
    success: British success
  - id: reb
    name: Iraqi rebels
    polities: [iraqi-rebels-1920]
    ink: olive
    moves: Rebel moves
    success: Rebel success
notes:
  - In Iraq the revolt is called the Great Iraqi Revolution (al-Thawra al-Iraqiyya al-Kubra). Most British troops in Iraq were Indian soldiers of the British Indian Army; Assyrian levies also fought on the British side.
  - Casualty figures differ widely between British and Iraqi sources. Estimates of the Iraqi dead range from about 2,000 to 10,000.
