id: turkish-armenian-war
name: Turkish–Armenian War
start: "1920-09-24"
end: "1920-12-02"
tier: C
summary: A war in the autumn of 1920 in which the army of the Turkish nationalist government in Ankara, under Kâzım Karabekir, invaded the Republic of Armenia, took Sarıkamış, Kars and Alexandropol (now Gyumri) and killed tens of thousands of Armenian civilians. In the Treaty of Alexandropol, signed on the night of 2–3 December 1920 as Armenia’s government handed power to the Bolsheviks, Armenia gave up Kars and its claims under the Treaty of Sèvres, and the Treaty of Kars of October 1921 confirmed the new border.
countries: [am, tr]
sides:
  - id: tr
    name: Turkish nationalists (Ankara government)
    polities: [turkey]
    ink: teal
  - id: am
    name: Armenia
    polities: [armenia]
    ink: orange
notes:
  - The Ankara government of the Grand National Assembly became the Republic of Turkey in 1923.
  - Kars and Ardahan had been Russian from 1878 to 1918; Armenia held Kars from 1919 to 1920.
