id: vlora-war
name: Vlora War
start: "1920-06-04"
end: "1920-08-02"
tier: C
summary: A conflict in the summer of 1920 in which Albanian nationalists besieged the Italian garrison of Vlorë, held since 1914, whose troops were weakened by malaria and could not be reinforced after soldiers in Ancona mutinied rather than sail for Albania. By the Treaty of Tirana of 2 August 1920 Italy agreed to leave Vlorë, keeping only the island of Sazan (Saseno), and gave up its hopes of a mandate over Albania; the war is remembered in Albania as a turning point in securing its independence.
