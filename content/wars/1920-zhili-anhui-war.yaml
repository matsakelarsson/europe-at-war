id: zhili-anhui-war
name: Zhili–Anhui War
start: "1920-07-14"
end: "1920-07-23"
tier: C
summary: "A ten-day war in July 1920 for control of the Beijing government, fought in Zhili (today Hebei) between the Anhui clique of Duan Qirui and an alliance of the Zhili clique and Zhang Zuolin’s Fengtian clique. Duan had dominated the Beiyang government since 1916 through his army, the Anfu Club in parliament and large Japanese loans; the Zhili generals opposed his wish to conquer the south by force, and Zhang Zuolin was alarmed when Duan’s ally Xu Shuzheng took Outer Mongolia in 1919. On 12 July the Zhili and allied generals denounced Duan and the Anfu Club, and on 14 July the Anhui army, about 42,000 men, attacked on two fronts south and south-east of Beijing. Its western army under Duan Zhigui and Qu Tongfeng first pushed the Zhili troops back near Gaobeidian, but on 17 July Wu Peifu outflanked it, captured Qu Tongfeng and took Zhuozhou, and the eastern army under Xu Shuzheng, which had advanced along the railway to Yangcun, collapsed when the Fengtian troops attacked it the same day; Xu fled to Beijing. Duan resigned on 19 July, and on 23 July Zhili and Fengtian troops entered Beijing. The Anhui army lost about 35,000 men killed or scattered and 6,500 captured. Cao Kun, Wu Peifu and Zhang Zuolin shared the Beijing government until they fell out in 1922."
