id: battle-of-blair-mountain
name: Battle of Blair Mountain
start: "1921-08-25"
end: "1921-09-02"
tier: C
summary: "The largest armed uprising in the United States since the Civil War, the climax of the West Virginia Mine Wars. Coal operators in Logan and Mingo counties in southern West Virginia kept out the United Mine Workers of America with mine guards, evictions and the Baldwin–Felts Detective Agency, and Logan County’s sheriff, Don Chafin, was paid by the operators to keep organisers out. After the Matewan shootout of May 1920 and martial law in Mingo County, Baldwin–Felts agents shot dead Sid Hatfield, Matewan’s police chief and a hero to the miners, on the courthouse steps at Welch on 1 August 1921. In late August some 10,000 armed miners (estimates run from about 7,000 to 20,000), white, Black and immigrant, many of them First World War veterans wearing red bandanas, gathered at Marmet near Charleston and set out to march through Logan County to Mingo, to free jailed strikers and unionise the southern coalfield. Union officials and Mother Jones tried to stop them. Chafin’s forces, some 3,000 deputies, mine guards, state police and volunteers (one account says more than 5,000), dug in with machine guns along the ridge of Spruce Fork and Blair Mountain, and private aircraft hired by the defenders dropped homemade bombs on the miners. Fighting along the ridge lasted from about 29 August to 2 September. President Warren G. Harding ordered the marchers to disperse and sent some 2,100–2,500 federal troops, with Army Air Service bombers for reconnaissance; when they arrived on 2–3 September, most miners laid down their arms rather than fight the army and went home. The dead were never counted: low estimates are about 20, while the highest give 50 to 100 miners and some 30 defenders. Afterwards 985 miners were indicted for murder, conspiracy and treason against West Virginia; the miners’ leader Bill Blizzard was acquitted of treason in 1922, but union membership in the state collapsed until the New Deal. Blair Mountain was listed on the National Register of Historic Places, and its preservation against surface mining remains contested."
