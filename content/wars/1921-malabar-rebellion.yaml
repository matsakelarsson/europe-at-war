notes:
  - The character of the rising is contested. Many historians see it chiefly as a peasant revolt against landlords and colonial rule; others stress its religious side and the attacks on Hindus. The Arya Samaj claimed about 600 Hindus killed and 2,500 forcibly converted; other estimates of conversions range from about 200 to 2,500. The Indian National Congress distanced itself from the rising at the time, while the government of Kerala recognised its participants as freedom fighters in 1971.
  - Kunjahammad Haji was captured and shot by a firing squad at Malappuram in January 1922; Ali Musliyar was hanged at Coimbatore in February 1922. Thousands of prisoners were transported to the Andaman Islands.
