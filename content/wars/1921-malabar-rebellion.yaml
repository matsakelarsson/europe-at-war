id: malabar-rebellion
name: Malabar rebellion
start: "1921-08-20"
end: "1922-02"
tier: C
summary: "An armed rising of Mappila Muslims in the southern taluks of Malabar district, in the Madras Presidency, in 1921–1922, also called the Moplah rebellion or the Mappila rebellion. It grew out of the Khilafat movement and long-standing grievances of Mappila tenants against Hindu landlords (jenmis) backed by British courts. On 20 August 1921 a police raid on a mosque at Tirurangadi to arrest Khilafat leaders led to clashes, and rebels under Ali Musliyar and then Variyankunnath Kunjahammad Haji attacked police stations, courts and treasuries and for some months ruled much of Eranad and Valluvanad. Martial law was declared and troops and the Malabar Special Police suppressed the rising by early 1922. By official figures 43 soldiers and police and about 2,337 rebels were killed and some 45,000 people imprisoned; unofficial estimates of all deaths reach about 10,000. Rebels also killed Hindus and forced conversions, and on 19–20 November 1921 some 70 Mappila prisoners died after being shut in a railway goods wagon."
