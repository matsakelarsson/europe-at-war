  - title: Alhucemas
    date: September – October 1925
    when: "1925-09-08"
    borders: "1925-10-02"
    countries: [ma, es, fr]
    view:
      center: [-4.1, 35.0]
      size: [150, 110]
    body:
      - On 8 September 1925 about 13,000 Spanish troops, supported by the Spanish and French fleets, aircraft and tanks, landed on the beaches of Cebadilla and Ixdain west of the bay of Alhucemas, in the heart of the Aith Waryaghar country. It is often called the first amphibious landing to use tanks and air support together. The Rifians counter-attacked for weeks, but on 2 October the Spanish took Ajdir and burned it.
      - At the same time French forces under Pétain advanced from the south, retook the Ouergha posts and pushed into the Rif, and American volunteer pilots in French service bombed Chefchaouen. Winter halted the offensives, but the Rif Republic, short of food and blockaded by land and sea, was now on the defensive on every front.
    facts:
      - [Alhucemas landing, "8 September 1925, about 13,000 men"]
      - [Ajdir taken, "2 October 1925"]
