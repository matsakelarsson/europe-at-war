  - title: The war with France
    date: April – July 1925
    when: "1925-04-12"
    borders: "1925-06-01"
    countries: [ma, fr, es]
    body:
      - The Rif Republic needed the grain of the Ouergha valley, which France was occupying with a line of new posts on the edge of the Spanish zone. On 12 April 1925 about 8,000 Rifian fighters attacked the French line. Within weeks dozens of posts were overrun or abandoned, tribes in the French zone rose, and Rifian forces came within about 30 km of Fez and threatened Taza. By the summer French losses exceeded 1,000 killed, 3,700 wounded and 1,000 missing.
      - Paris sent Marshal Philippe Pétain, the victor of Verdun, and built up an army of about 160,000 men in northern Morocco; Lyautey, sidelined, resigned in September. In July France and Spain agreed in Madrid to fight together and to refuse any peace that left the Rif independent. Abd el-Krim’s offers to negotiate came to nothing, and many on the European left, including the French Communist Party, campaigned against the war.
    facts:
