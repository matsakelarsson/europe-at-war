  - title: Surrender
    date: April 1926 – July 1927
    when: "1926-05-27"
    borders: "1926-05-27"
    countries: [ma, es, fr]
    body:
      - Peace talks at Oujda in April and May 1926 failed. In May the two armies, more than 120,000 men with some 150 aircraft, attacked from the south, the east and Alhucemas against perhaps 12,000 Rifian fighters. The tribes, exhausted by hunger, bombing and gas, began to submit one by one.
      - On 27 May 1926 Abd el-Krim gave himself up to the French near Targuist rather than to the Spanish. France exiled him to the island of Réunion, where he stayed until 1947; on his way to France that year he left the ship at Port Said and lived in Cairo, supporting the independence movements of the Maghreb, until his death in 1963. Spanish troops occupied the last centres of resistance in the Jebala in July 1927, and Spain declared the war over.
    facts:
      - [Final offensive, "May 1926"]
      - [Abd el-Krim surrenders, "27 May 1926"]
      - [End of operations, "July 1927"]
