  - title: The Republic of the Rif
    date: September 1921 – 1923
    when: "1921-09-18"
    borders: "1923-01-27"
    countries: [ma, es]
    body:
      - On 18 September 1921 an assembly of Rifian representatives proclaimed independence. The Republic of the Rif had its capital at Ajdir, a national assembly of tribal delegates, a president, Abd el-Krim, and ministers of finance, foreign affairs, war and the interior; it raised taxes, ran courts under Islamic law, built roads and telephone lines and kept a standing force of a few thousand regulars beside the tribal levies. In 1922 it appealed to the League of Nations in the name of “the forty-one tribes of the Rif and Ghomara”. Abd el-Krim also used the title of emir, and his aims, between an independent Rif and the liberation of all Morocco, are still debated.
      - Spain sent large reinforcements; on 24 October 1921 its troops retook Monte Arruit, where they found the bodies of some 2,600 men of the garrison, and by January 1922 they had retaken the country around Melilla. But it could not reach Ajdir, and the war settled into a stalemate along a new front. Hundreds of Spanish soldiers and civilians were held prisoner in the Rif; on 27 January 1923, on the beach at Ajdir, about 330 of them were freed for a ransom of about 4 million pesetas, negotiated by the Basque businessman Horacio Echevarrieta.
    facts:
      - [Republic proclaimed, "18 September 1921"]
      - [Monte Arruit retaken, "24 October 1921"]
      - [Ransom of the prisoners, "27 January 1923, about 330 freed"]
