steps:
  - title: Annual
    date: June – August 1921
    when: "1921-06-01"
    borders: "1921-08-09"
    countries: [ma, es]
    body:
      - In 1920–21 General Manuel Fernández Silvestre, the commander at Melilla, pushed west into the Rif with a chain of small, badly supplied outposts, aiming for the bay of Alhucemas. The tribes of the central Rif united under Abd el-Krim, a former official of the Spanish administration and a leader of the Aith Waryaghar. On 1 June 1921 they overran a new outpost on Mount Abarrán, and in July they besieged Igueriben, which fell on 21 July. The next day, with water and ammunition running out, Silvestre ordered the main camp at Annual to retreat, and the retreat turned into a rout in which he was killed.
      - The whole Spanish line east of Annual collapsed as outposts fell one after another and local tribes rose. Survivors gathered at Monte Arruit, 35 km south of Melilla, which surrendered on 9 August; most of its garrison was then massacred. By the official count about 13,000 soldiers of the Spanish army died. Melilla itself was almost undefended, but the Rifians did not attack it, and reinforcements from the Spanish Legion arrived by sea. Abd el-Krim proclaimed the Republic of the Rif in September. In Spain the disaster and the inquiry into it shook the monarchy and helped bring about General Miguel Primo de Rivera’s coup of 1923.
    facts:
      - [Battle of Annual, "22 July – 9 August 1921, Rifian victory"]
      - [Spanish dead, "about 13,000 (official count)"]
      - [Republic of the Rif proclaimed, "18 September 1921"]
