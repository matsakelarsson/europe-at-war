steps:
  - title: Spain’s protectorate and the Rif
    date: 1912 – June 1921
    when: "1920-10"
    borders: "1921-06-01"
    countries: [ma, es]
    body:
      - By the Franco-Spanish treaty of 1912 Spain received a protectorate over the north of Morocco, a strip of mountains from the Atlantic to the Moulouya, with its capital at Tetuán. Spain had held Ceuta and Melilla for centuries, but most of the zone had never been under its control, nor fully under the sultan’s. In the west Spanish troops fought for years against Ahmed al-Raisuni, the powerful chief of the Jebala. In 1919 the high commissioner, General Dámaso Berenguer, began a campaign to subdue the whole zone, and in October 1920 his troops entered Chefchaouen (Xauen), the holy city of the western mountains.
      - In the east General Manuel Fernández Silvestre, commanding at Melilla, pushed west in 1920–1921 towards the bay of Alhucemas, the heart of the central Rif, spreading his troops over about 144 small posts and blockhouses with poor supply lines. The tribes of the central Rif, led by the Aith Waryaghar, found a leader in Muhammad ibn Abd al-Karim al-Khattabi, Abd el-Krim, the son of a qadi of Ajdir. He had been a judge and journalist in Melilla in Spain’s service until he was imprisoned in 1915–1916, and he returned to the Rif in 1919 determined to keep the Spanish out. He warned Silvestre not to cross the Amekran river. On 1 June 1921 his fighters overran the new Spanish post on Mount Abarrán, beyond the river, killing most of its garrison.
    facts:
      - [Spanish protectorate, "1912, capital Tetuán"]
      - [Chefchaouen taken by Spain, "October 1920"]
      - [Spanish posts in the eastern zone, "about 144"]
      - [Abarrán, "1 June 1921, Rifian victory"]
