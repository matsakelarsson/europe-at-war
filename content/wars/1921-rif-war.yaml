id: rif-war
name: Rif War
start: "1921-06-01"
end: "1926-05-27"
tier: A
summary: "A colonial war in northern Morocco in which the Berber tribes of the Rif, led by Muhammad ibn Abd al-Karim al-Khattabi, known as Abd el-Krim, destroyed a Spanish army at Annual in 1921 and set up the Republic of the Rif. Spain, which held northern Morocco as a protectorate, lost about 13,000 soldiers in the disaster of 1921, retook the land around Melilla but could not defeat the Rif, and from 1924 its army dropped mustard gas and other chemical weapons on Rifian villages and markets. In late 1924 it withdrew from the western interior around Chefchaouen. After the Rifians attacked the French zone in April 1925 and came close to Fez, France sent Marshal Pétain with a large army and joined Spain. A Spanish landing at Alhucemas in September 1925 and converging French and Spanish offensives forced Abd el-Krim to surrender to the French on 27 May 1926; he was exiled to Réunion. The last resistance ended in July 1927."
countries: [ma, es, fr]
sides:
  - id: es
    name: Spain
    polities: [spain, spanish-morocco]
    ink: gold
    moves: Spanish moves
    success: Spanish success
  - id: rif
    name: Republic of the Rif
    polities: [rif-republic]
    ink: olive
    moves: Rifian moves
    success: Rifian success
  - id: fr
    name: France and the French protectorate
    polities: [france, morocco]
    ink: blue
    moves: French moves
    success: French success
notes:
  - "Northern Morocco was a Spanish protectorate from 1912, with its capital at Tetuán; the rest of the country, except Tangier, was a French protectorate. Some accounts date the war from Spain’s campaigns in the Rif in 1920, and fighting against the last Rifian holdouts went on until July 1927. Sources give 26 or 27 May 1926 for Abd el-Krim’s surrender."
  - "Spain and France lost tens of thousands of men killed, wounded, missing or sick, Spain about 43,500–63,000 and France 10,000–18,000 by different counts. Rifian losses were about 30,000, some 10,000 of them dead, by one estimate; others put the Rifian dead, civilians included, at 40,000 or more. Civilian deaths from the bombing and gas attacks were never counted."
  - Many of the soldiers on both European sides were Moroccans, the regulares of the Spanish army and the tirailleurs and goumiers of the French; Spain also used its new Foreign Legion. Many officers who later led the Nationalists in the Spanish Civil War, Francisco Franco among them, made their careers in this war.
