  - title: Annual
    date: July – August 1921
    when: "1921-07-22"
    borders: "1921-08-09"
    countries: [ma, es]
    body:
      - In July 1921 the Rifians besieged the post of Igueriben, south of Silvestre’s main camp at Annual, and it fell on 21 July after its garrison ran out of water. The next day, with water and ammunition running short and the tribes rising around him, Silvestre ordered the camp at Annual to retreat. The retreat turned into a rout in which he was killed, perhaps by his own hand; his body was never found.
      - The whole Spanish line east of Annual collapsed as posts fell one after another and tribes that had submitted rose. Survivors gathered at Monte Arruit, 35 km south of Melilla, under General Felipe Navarro. After a siege of twelve days the garrison surrendered on 9 August, and most of its men were killed after laying down their arms. By the count reported to the Cortes 13,192 soldiers of the Spanish army died. Melilla itself was almost undefended, but the Rifians did not attack it, and reinforcements, among them the new Spanish Legion, arrived by sea.
      - In Spain the disaster of Annual shook the monarchy. An inquiry under General Juan Picasso documented the failures of the army, and the debate in the Cortes over who was responsible for the defeat was one of the reasons for General Miguel Primo de Rivera’s coup of 13 September 1923.
    facts:
      - [Igueriben falls, "21 July 1921"]
      - [Retreat from Annual, "22 July 1921"]
      - [Monte Arruit surrenders, "9 August 1921"]
      - [Spanish dead, "13,192 (count reported to the Cortes)"]
