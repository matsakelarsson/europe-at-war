  - title: Gas, Xauen and the height of the Rif Republic
    date: 1923 – January 1925
    when: "1924-11"
    borders: "1925-01-27"
    countries: [ma, es]
    body:
      - Unable to win on the ground, the Spanish army turned to chemical weapons, first reported in use in late 1921. From 1924 aircraft dropped bombs filled with mustard gas, phosgene and other agents, made at a factory near Madrid with German help, on villages, markets and rivers as well as on fighters. Many Rifians today link the high rates of cancer in the region to the gas, though this has not been established.
      - Primo de Rivera, who had once favoured abandoning Morocco, decided to shorten the lines. In late 1924 the Spanish evacuated Chefchaouen and dozens of posts in the western mountains and fell back to a fortified line nearer the coast, the “Primo line”. The Rifians and the Jebala tribes harried the columns all the way, and the retreat cost heavy losses. Abd el-Krim’s authority now reached across the whole interior of the Spanish zone. In January 1925 his forces took Raisuni’s stronghold at Tazrut; the old chief, who had dealt with Spain, died in captivity a few months later.
    facts:
      - [Chemical weapons used, "from 1921, on a large scale from 1924"]
      - [Evacuation of Chefchaouen, "November – December 1924"]
      - [Raisuni captured, "January 1925"]
