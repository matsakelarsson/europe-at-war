id: rif-war
name: Rif War
start: "1921"
end: "1926-05-27"
tier: B
summary: A colonial war in northern Morocco in which the Berber tribes of the Rif, led by Abd el-Krim, destroyed a Spanish army at Annual in 1921 and set up the Republic of the Rif. After the Rifians attacked the French zone in 1925, France joined Spain; a Spanish landing at Alhucemas and a French offensive from the south forced Abd el-Krim to surrender in May 1926.
countries: [ma, es, fr]
sides:
  - id: es
    name: Spain
    polities: [spain]
    ink: gold
    moves: Spanish moves
    success: Spanish success
  - id: rif
    name: Republic of the Rif
    polities: [rif-republic]
    ink: olive
    moves: Rifian moves
    success: Rifian success
  - id: fr
    name: France
    polities: [france]
    ink: blue
    moves: French moves
    success: French success
notes:
  - Northern Morocco had been a Spanish protectorate since 1912, while the rest of the country was a French protectorate; the base map cannot show the protectorates, so the areas in the steps show approximate zones of control. Some accounts date the war from Spain’s campaigns in the Rif in 1920, and fighting against the last Rifian holdouts went on until July 1927.
  - Spain and France lost tens of thousands of men killed, wounded, missing or sick, Spain about 43,500–63,000 and France 10,000–18,000 by different counts; Rifian losses were about 30,000, some 10,000 of them dead. Civilian deaths are not known. Sources give 26 or 27 May 1926 for Abd el-Krim’s surrender.
