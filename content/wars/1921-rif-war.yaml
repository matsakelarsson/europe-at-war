  - title: Alhucemas and Abd el-Krim’s surrender
    date: 1924 – May 1926
    when: "1924-09"
    borders: "1926-05-27"
    countries: [ma, es, fr]
    body:
      - The Spanish retook the country around Melilla but could not defeat the Rif, and from 1924 their army used chemical weapons, among them mustard gas, which aircraft dropped on villages, markets and rivers as well as on fighters. In late 1924 Primo de Rivera withdrew the troops in the west from Chefchaouen to a fortified line nearer the coast, a retreat that cost heavy losses. In April 1925 Abd el-Krim, at the height of his power, attacked the French posts on the Ouergha river, overran many of them and threatened Fez. France then sent Marshal Philippe Pétain with a large army and agreed to act together with Spain.
      - On 8 September 1925 about 13,000 Spanish troops, supported by the Spanish and French fleets, aircraft and tanks, landed on the beaches west of Alhucemas Bay, in what is considered the first amphibious landing to use tanks and aircraft, and on 2 October they took Ajdir. French forces advanced from the south. Surrounded and short of supplies, Abd el-Krim surrendered to the French on 27 May 1926 and was exiled to the island of Réunion. The last resistance ended in 1927. Many officers who later led the Nationalists in the Spanish Civil War, Francisco Franco among them, made their careers in this war.
    facts:
      - [Alhucemas landing, "8 September 1925"]
      - [Ajdir taken, "2 October 1925"]
      - [Abd el-Krim surrenders, "27 May 1926"]
