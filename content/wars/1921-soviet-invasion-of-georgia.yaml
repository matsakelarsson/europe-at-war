id: soviet-invasion-of-georgia
name: Soviet invasion of Georgia
start: "1921-02-12"
end: "1921-03-17"
tier: C
summary: The Red Army’s conquest of the Democratic Republic of Georgia in February–March 1921, the last step in the Soviet takeover of the Caucasus after the occupation of Azerbaijan in April 1920 and of Armenia in late 1920. Soviet troops took Tbilisi on 25 February, and by mid-March the Georgian government had gone into exile from Batumi, which Turkish troops had briefly entered and which the Soviet–Turkish Treaty of Moscow of 16 March 1921 left to Soviet Georgia.
countries: [ge, ru]
sides:
  - id: su
    name: Soviet Russia
    polities: [ussr]
    ink: red
  - id: ge
    name: Georgia
    polities: [georgia]
    ink: purple
notes:
  - Soviet Russia had recognised Georgia’s independence in the Treaty of Moscow of 7 May 1920.
  - The 11th Red Army had entered Baku on 28 April 1920, ending the Azerbaijan Democratic Republic, and entered Armenia at the end of November 1920; the Armenian government handed power to the Bolsheviks on 2 December.
