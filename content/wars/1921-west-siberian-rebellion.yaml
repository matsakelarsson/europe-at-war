notes:
  - Soviet historiography called the rising the West Siberian mutiny and blamed it on the Socialist Revolutionaries and kulaks; most of the rebels were ordinary peasants and Cossacks, and the rebel committees called for “Soviets without Communists”. The number of rebels and the death toll are uncertain, and Soviet figures from the time may be exaggerated or incomplete.
  - Tobolsk, Petropavlovsk and Kokchetav changed hands on dates that differ slightly between sources. Petropavlovsk and Kokchetav are today Petropavl and Kokshetau in Kazakhstan.
