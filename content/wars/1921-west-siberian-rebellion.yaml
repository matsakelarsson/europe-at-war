id: west-siberian-rebellion
name: West Siberian rebellion
start: "1921-01-31"
end: "1922-12"
tier: C
summary: "The largest peasant rising against Soviet rule, in western Siberia and the north of today’s Kazakhstan. After Kolchak’s defeat the Bolsheviks sent some 35,000 men of the food detachments to requisition grain in Siberia, where peasants had never known serfdom. The revolt began on 31 January 1921 in the Ishim district and spread within weeks across the Tyumen, Omsk, Akmolinsk and Chelyabinsk provinces, from Obdorsk (Salekhard) on the Arctic coast to Karkaralinsk in the steppe; estimates of the rebels in arms range from 30,000 to 150,000, with 55,000–100,000 the most often given. They took Petropavlovsk (briefly), Kokchetav, Tobolsk, Surgut, Berezovo and Obdorsk, and for about three weeks in February cut both lines of the Trans-Siberian Railway, stopping grain trains to central Russia. The Red Army, under a commission of Ivan Smirnov, Vasily Shorin and Ivan Pavlunovsky, reopened the railway in early March, retook Tobolsk on 8 April and crushed the main rebel army at Aromashevo at the end of April; the northern towns were retaken in May and June. Repression was severe, with hostages taken and villages shelled; Smirnov reported some 22,000 peasants killed in the Ishim and Petropavlovsk districts in the first six weeks alone. The end of requisitioning under the New Economic Policy helped bring the revolt to an end, though the last bands in the Ishim region were broken only at the end of 1922."
