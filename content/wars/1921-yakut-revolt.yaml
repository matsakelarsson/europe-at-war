notes:
  - Sources disagree on several dates and on whether the insurgents took Yakutsk in March 1922 or only besieged it; Russian accounts describe a siege of the city in the winter and spring of 1922. The fighting at Okhotsk is dated 6 or 10 June 1923, and Pepelyayev’s surrender 16, 18 or 19 June.
  - Soviet histories called the rising the Yakut mutiny and Pepelyayev’s campaign the Pepelyayevshchina. Pepelyayev was imprisoned and shot in 1938; Strod, who received the Order of the Red Banner for the defence of Sasyl-Sysyy, was shot the same year in the Great Purge. The siege is the subject of Leonid Yuzefovich’s history The Winter Road (2015).
