id: yakut-revolt
name: Yakut revolt
start: "1921-09"
end: "1923-06-18"
tier: C
summary: "The last campaign of the Russian Civil War, fought in Yakutia and on the Okhotsk coast. In September 1921 about 200 men under the White cornet Mikhail Korobeinikov rose in the Maya district east of Yakutsk, and Yakut and Tungus (Evenk) herders angered by requisitions and arrests joined them; a small White detachment landed at Okhotsk from Vladivostok. In March 1922 Yakut intellectuals formed the Provisional Yakut Regional People’s Administration at Churapcha, and its People’s Army drove the Reds from most of Yakutia and besieged Yakutsk. Moscow answered by proclaiming the Yakut Autonomous Soviet Socialist Republic on 27 April 1922 and sending about 5,000 troops, who by September had pushed the insurgents back to Ayan and Nelkan near the Pacific. In September 1922 General Anatoly Pepelyayev landed at Ayan with about 750 volunteers of the Siberian Volunteer Druzhina, sailing from White-held Vladivostok just before it fell. He took Amga in early 1923 but failed to take the Red detachment of Ivan Strod at the Sasyl-Sysyy farmstead in an eighteen-day siege in February and March, and fell back to the coast. A Red expedition under Stepan Vostretsov sailed from Vladivostok in April, took Okhotsk in early June, and on 18 June 1923 surrounded Ayan, where Pepelyayev surrendered without a fight. Losses are estimated at about 1,000 on the Red side and 500–1,000 killed among the insurgents, with more than 1,000 captured."
