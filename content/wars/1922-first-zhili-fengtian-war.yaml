id: first-zhili-fengtian-war
name: First Zhili–Fengtian War
start: "1922-04"
end: "1922-06-18"
tier: C
summary: "A war for control of the Beijing government between the Zhili clique of Cao Kun and Wu Peifu and the Fengtian clique of Zhang Zuolin, the former allies of 1920. Their quarrel came to a head when Zhang had his candidate, Liang Shiyi, made premier in December 1921 and Wu forced him out. Each side brought about 100,000–120,000 men into Zhili (today Hebei), and fighting began at the end of April 1922. On the western front, along the railway south-west of Beijing at Changxindian and Liulihe, Wu Peifu ambushed and outflanked the Fengtian army and broke it in early May; on the eastern front, near Machang and Junliangcheng south and east of Tianjin, Zhili reinforcements arriving by rail defeated the Fengtian reserves. The Fengtian army lost about 20,000 dead and 40,000 captured or surrendered, and Zhang withdrew beyond the Shanhai Pass, which became the line between the two cliques. A British consul arranged talks, and peace was signed on 18 June aboard a British warship off Qinhuangdao. Zhang went on to govern the three north-eastern provinces independently of Beijing and to rebuild his army, while the Zhili clique dominated the Beijing government until 1924."
