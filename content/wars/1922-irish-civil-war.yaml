id: irish-civil-war
name: Irish Civil War
start: "1922-06-28"
end: "1923-05-24"
tier: C
summary: A war between the government of the new Irish state, which accepted the Anglo-Irish Treaty of 1921, and the republicans of the anti-Treaty IRA, who saw the Treaty as a betrayal of the Irish Republic. Anti-Treaty fighters had occupied the Four Courts in Dublin in April 1922, and on 28 June the National Army began shelling them with field guns lent by Britain. The government took Dublin within a week and the towns of the self-styled “Munster Republic” in the south by August, but a bitter guerrilla war went on for months. Michael Collins, the army’s commander-in-chief, was killed in an ambush at Béal na Bláth in County Cork on 22 August 1922. Republicans killed a member of the Dáil and burned the houses of senators; the government executed 81 republican prisoners, and its troops killed others out of hand, as at Ballyseedy in Kerry. After the IRA’s chief of staff, Liam Lynch, was killed in April 1923, his successor Frank Aiken ordered his men on 24 May to dump their arms. Estimates of the dead range from about 1,500 to just under 2,000. The split shaped Irish politics for generations; Fine Gael and Fianna Fáil both trace their origins to the two sides.
