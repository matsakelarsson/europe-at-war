id: corfu-incident
name: Corfu incident
start: "1923-08-27"
end: "1923-09-27"
tier: C
summary: A crisis between Greece and Fascist Italy in 1923, after the Italian general Enrico Tellini, marking the Greek–Albanian border for the Conference of Ambassadors, was murdered with members of his staff on Greek soil. Italian warships shelled Corfu, killing some 16 civilians, many of them refugees from Anatolia, and Italian troops occupied the island until Mussolini, defying the League of Nations, won an apology and 50 million lire from Greece through the Conference of Ambassadors, an early sign of the League’s weakness against a great power.
countries: [gr, it, al]
