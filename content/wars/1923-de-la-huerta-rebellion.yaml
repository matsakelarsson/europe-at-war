id: de-la-huerta-rebellion
name: De la Huerta rebellion
start: "1923-12-06"
end: "1924-06-17"
tier: C
summary: "A military revolt against President Álvaro Obregón after he chose Plutarco Elías Calles to succeed him in the election of 1924. Adolfo de la Huerta, interim president in 1920 and then Obregón’s finance minister, had broken with him over the Bucareli agreements with the United States and over the succession, and became the candidate of the Partido Nacional Cooperatista. On 6 December 1923 General Guadalupe Sánchez rose with the troops in Veracruz, and the next day de la Huerta, who had gone to the port, issued the Plan of Veracruz, accusing Obregón of imposing his successor. Generals Enrique Estrada in Jalisco and Fortunato Maycotte in Oaxaca, with Manuel Diéguez, Salvador Alvarado, Cándido Aguilar and others, joined; between two-fifths and half of the army, some 23,000 men by one count, rebelled, and by mid-December the rebels held most of Veracruz, Tabasco, Jalisco and Oaxaca. But they had no common command or plan. Obregón armed workers’ and peasants’ battalions, the CROM labour federation and agrarista leaders backed the government, and the United States, which had recognised Obregón’s government in 1923, sold it rifles and aircraft. In Yucatán rebel officers shot the socialist governor Felipe Carrillo Puerto and three of his brothers on 3 January 1924, against de la Huerta’s orders. Government troops under Eugenio Martínez beat Sánchez at Esperanza, on the border of Puebla and Veracruz, on 28 January, and in February Obregón defeated Estrada at Ocotlán, on the Lerma, and took Guadalajara. De la Huerta withdrew to Frontera in Tabasco and left for the United States in March; the rebels abandoned Villahermosa, their last stronghold, in June 1924. Thousands died. Many captured rebel generals were shot, among them Maycotte and Diéguez, and Alvarado was killed in Tabasco; the purge left the army more loyal to the Sonoran leaders, and Calles won the election of July 1924."
