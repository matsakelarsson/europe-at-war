  - title: The Fezzan
    date: 1929 – February 1930
    when: "1930-01"
    borders: "1930-02-20"
    countries: [ly, it]
    body:
      - With Tripolitania held, Badoglio sent Graziani to take the Fezzan, the oasis country of the south-west, where the last Tripolitanian and Fezzani leaders had gathered. In the winter of 1929–1930 motorised columns supported by aircraft crossed the desert and occupied Brak, Sabha and Murzuk, the old capital of the Fezzan, and on 20 February 1930 Italian troops reached the southern frontier with French Africa, raising the flag at Tummo, on today’s border with Niger.
      - Many of the defeated fighters and their families fled south into French territory or west into Algeria. Graziani’s success in the Fezzan won him the command in Cyrenaica.
    facts:
