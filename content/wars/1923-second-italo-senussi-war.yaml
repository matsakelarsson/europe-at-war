  - title: Tripolitania and the Sirtica
    date: 1923 – 1928
    when: "1924"
    borders: "1928-12-31"
    countries: [ly, it]
    body:
      - In 1923–1924 Italian forces, led in the field by Colonel Rodolfo Graziani, retook Tripolitania north of a line from Ghadames through Mizda to Bani Walid, which held about four-fifths of the people of Tripolitania and the Fezzan. The Italians relied on aircraft, armoured cars and trucks, on Eritrean and Libyan troops, and on rivalries among the Tripolitanian leaders, many of whom had fallen out with one another after 1918.
      - In 1924 a campaign in the Sirtica, the desert between Tripolitania and Cyrenaica, brought some 150,000 km² under Italian control in five months and cut the links between the resistance in the two provinces. In 1928 Italian columns took the Jufra oases and the Ghibla, the steppe south of Tripoli, and disarmed its tribes. Many resistance leaders and their followers retreated to the Fezzan or crossed into Egypt, Tunisia, Algeria and Chad.
    facts:
      - [Line reached by 1924, "Ghadames – Mizda – Bani Walid"]
      - [Sirtica campaign, "1924, about 150,000 km² in five months"]
      - [Jufra and the Ghibla taken, "1928"]
