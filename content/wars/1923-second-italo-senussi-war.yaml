  - title: The death of Omar al-Mukhtar
    date: September 1931 – January 1932
    when: "1931-09-11"
    borders: "1931-09-16"
    countries: [ly, it]
    body:
      - Cut off from its people, its herds and Egypt, the resistance dwindled to a few hundred men. On 11 September 1931 Omar al-Mukhtar, then about 73, was wounded and captured by Libyan troops of the Italian army in a clash near Slonta in the Jebel Akhdar. He was tried by a special court in Benghazi on 15 September and sentenced to death, and on 16 September he was hanged at the camp of Suluq, before thousands of internees who were made to watch.
      - Badoglio proclaimed the war over on 24 January 1932, and the last of al-Mukhtar’s companions were executed later that year. Italy went on to settle tens of thousands of colonists in Libya. Omar al-Mukhtar became a symbol of resistance in Libya and across the Arab world; Idris, who returned with the British in the Second World War, became king of independent Libya in 1951.
    facts:
      - [Omar al-Mukhtar captured, "11 September 1931"]
      - [Hanged at Suluq, "16 September 1931"]
      - [War declared over, "24 January 1932"]
