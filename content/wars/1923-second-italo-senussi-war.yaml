  - title: The deportations and the camps
    date: March 1930 – September 1933
    when: "1930-06-25"
    borders: "1930-06-25"
    countries: [ly, it]
    body:
      - Graziani took over as vice-governor of Cyrenaica in Benghazi on 27 March 1930. He closed the Senussi lodges, confiscated their lands, deported their sheikhs and disarmed the tribes. On 20 June Badoglio wrote to him that the course chosen “must be carried out to the end, even if the entire population of Cyrenaica must perish”, and on 25 June he ordered the evacuation of the Jebel Akhdar and the plateau.
      - From late June 1930 some 100,000 to 110,000 people, about half the population of Cyrenaica, men, women and children of the herding tribes, were marched or driven, some hundreds of kilometres, to concentration camps on the coastal plain and the edge of the desert. Of about 600,000 sheep, goats, camels and horses taken with them, only about 100,000 survived. By 1931 the internees were held in some fifteen camps behind barbed wire; the largest, at Suluq and Sidi Ahmed al-Magrun near Benghazi, held about 33,000 people each, and at al-Agaila on the Gulf of Sirte the families of fighters were held under the harshest rules.
      - Hunger, typhus and other diseases, forced labour and executions killed about 40,000 of the internees before the camps closed in September 1933. With the people gone, the Jebel was turned over to Italian settlers, who came in large numbers in the late 1930s.
    facts:
      - [Evacuation of the Jebel ordered, "25 June 1930"]
      - [People deported, "about 100,000–110,000"]
      - [Died in the camps, "about 40,000 by September 1933"]
      - [Livestock, "about 600,000 taken, about 100,000 survived"]
