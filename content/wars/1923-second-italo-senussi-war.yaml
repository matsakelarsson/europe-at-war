id: second-italo-senussi-war
name: Italian reconquest of Libya
start: "1923-01-26"
end: "1932-01-24"
tier: A
summary: "The war in which Fascist Italy reconquered Libya, which it had invaded in 1911 but held only along the coast after 1915. Also called the Second Italo-Senussi War and, in Italy, the “pacification” of Libya. From 1922 Italian columns with aircraft and motor transport retook Tripolitania, the Sirtica and in 1929–1930 the Fezzan, while in Cyrenaica the guerrilla bands of the Senussi order, led by the elderly sheikh Omar al-Mukhtar, held out in the Jebel Akhdar with the support of the population. In 1930 General Rodolfo Graziani had the people of the Jebel and the plateau, some 100,000 men, women and children, marched into concentration camps on the coast, where about 40,000 of them died; their herds were destroyed, a barbed-wire fence was built along the Egyptian border to cut off supplies, and in January 1931 the Senussi oasis of Kufra was taken. Omar al-Mukhtar was captured in September 1931 and hanged before thousands of internees, and Italy declared the war over in January 1932. Estimates of the Libyan dead range from about 20,000 to 100,000; perhaps a quarter of the people of Cyrenaica died."
countries: [ly, it, eg]
