notes:
  - "The war’s dates vary: the infobox date of 26 January 1923 marks the start of the war in Cyrenaica, but the reconquest of Tripolitania began in January 1922, and the last camps closed only in September 1933. Italian sources long called it the “pacification” or “reconquest” of Libya; Libyans remember the deportation as al-Rihlan, the “path of tears”, and some historians describe what happened in Cyrenaica as genocide."
  - "Losses: Italian forces lost about 2,600 dead, wounded and missing, many of them Eritrean and Libyan troops. Estimates of Libyan deaths from fighting, executions, deportation, hunger and disease range from about 20,000 to 100,000; the historian Angelo Del Boca puts them at 40,000 to 70,000, and about a quarter of Cyrenaica’s 225,000 people died. In 2008 Italy apologised and agreed to pay Libya compensation."
