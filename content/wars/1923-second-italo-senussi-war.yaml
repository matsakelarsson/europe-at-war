  - title: The wire and Kufra
    date: December 1930 – September 1931
    when: "1931-01-19"
    borders: "1931-01-31"
    countries: [ly, it, eg]
    body:
      - In the winter of 1930–1931 Graziani sent a force of about 4,000 men with trucks, aircraft and 5,000 camels from Ajdabiya across the desert to Kufra, the last Senussi stronghold, some 800 km from the coast. On 19 January 1931 it defeated the oasis’s few hundred defenders at al-Hawari, and the next day Kufra was occupied. Aircraft strafed fighters and families who fled into the desert, and many who tried to cross the Great Sand Sea to Egypt or reach Chad died on the way; survivors told of executions, looting and the destruction of the lodges and their books. The fall of Kufra broke the power of the Senussi.
      - To cut the remaining bands off from Egypt, the Italians then built a barrier of barbed wire, some 270 km long, from the Gulf of Sollum near Bardia south to Jaghbub, between April and September 1931. It was patrolled by armoured cars and aircraft and watched from forts along its length.
    facts:
      - [Battle of al-Hawari, "19 January 1931"]
      - [Kufra occupied, "20 January 1931"]
      - [Frontier wire, "about 270 km, Gulf of Sollum to Jaghbub, April – September 1931"]
