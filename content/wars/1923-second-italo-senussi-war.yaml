  - title: Omar al-Mukhtar’s war in the Jebel Akhdar
    date: 1923 – 1929
    when: "1926"
    borders: "1929-06-01"
    countries: [ly, it, eg]
    body:
      - In Cyrenaica the war was fought in the Jebel Akhdar, the wooded upland behind the coast, and on the plateau and desert to the south. Its leader was Omar al-Mukhtar, a teacher of the Koran and sheikh of a Senussi lodge, already in his sixties, whom Idris had made commander of the order’s fighters. His forces were small bands (adwar) of a few hundred men each, drawn from the tribes and fed, sheltered and informed by them; even people living under Italian control paid them tithes. Arms and supplies came across the frontier from Egypt, and the Senussi lodges and the oases of Jaghbub and Kufra were their rear.
      - Italian columns, with aircraft and Eritrean and Libyan troops, could not catch the bands, and the war became one of ambushes and reprisals. Jaghbub, the old seat of the Senussi, which Egypt had ceded to Italy by a treaty of December 1925, was occupied in February 1926. In January 1929 Marshal Pietro Badoglio became governor of both Tripolitania and Cyrenaica and opened talks; a truce held for some months in 1929, but the two sides could not agree, and al-Mukhtar took up arms again in the autumn.
    facts:
      - [Omar al-Mukhtar, "born 1858, led the Senussi fighters from 1923"]
      - [Jaghbub occupied, "February 1926"]
      - [Badoglio governor of both colonies, "January 1929"]
      - [Truce, "1929, broken in the autumn"]
