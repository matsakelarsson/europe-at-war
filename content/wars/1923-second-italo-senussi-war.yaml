steps:
  - title: The end of the truces
    date: 1917 – 1923
    when: "1922-01"
    borders: "1923-04-01"
    countries: [ly, it]
    body:
      - The accords of Akrama in 1917 left Italy only the coast of Libya. In Tripolitania local leaders proclaimed a Tripolitanian Republic in 1918, and Italy, weakened by the First World War, granted Libyans a statute with local parliaments in 1919. In Cyrenaica the accord of al-Rajma of 1920 recognised Muhammad Idris, head of the Senussi order, as emir of the interior, with his seat at Ajdabiya. In 1922 leaders from Tripolitania offered Idris the emirate of their province as well.
      - Italy’s governors and then the Fascist government that came to power in October 1922 set out to end these arrangements. In January 1922 the governor of Tripolitania, Giuseppe Volpi, landed troops at Misrata and began the reconquest of the province, and Italian columns pushed into the Jebel south of Tripoli. Idris, fearing Italian reprisals, left for exile in Egypt in December 1922. In April 1923 Italy renounced its accords with the Senussi and occupied Ajdabiya, and in Cyrenaica the war began again.
    facts:
      - [Accord of al-Rajma, "1920"]
      - [Reconquest of Tripolitania begins, "January 1922"]
      - [Idris leaves for Egypt, "December 1922"]
      - [War resumes in Cyrenaica, "1923"]
