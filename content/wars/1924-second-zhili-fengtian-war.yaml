id: second-zhili-fengtian-war
name: Second Zhili–Fengtian War
start: "1924-09-15"
end: "1924-11-03"
tier: B
summary: "The largest of the warlord wars of the 1920s, fought in the autumn of 1924 between the Zhili clique of Cao Kun and Wu Peifu, which controlled the Beijing government, and Zhang Zuolin’s Fengtian clique from the north-east. A war in the lower Yangtze between the Zhili governor of Jiangsu and the Anhui-aligned governor of Zhejiang, which began on 3 September, gave Zhang the occasion for revenge for his defeat of 1922. About 250,000 Fengtian troops, rearmed with Japanese help, attacked the Zhili positions at the Shanhai Pass and in Rehe; Wu Peifu commanded about 200,000. The fighting at the pass was deadlocked when, on the night of 22–23 October, the Zhili general Feng Yuxiang, sent to the Rehe front, marched back to Beijing, seized the capital and arrested President Cao Kun. With Fengtian troops breaking through to the railway behind them, more than 40,000 Zhili soldiers surrendered between Shanhaiguan and Qinhuangdao, and Wu Peifu escaped by sea from Tanggu on 3 November. Feng and Zhang made Duan Qirui provisional chief executive, Feng expelled the last Qing emperor, Puyi, from the Forbidden City, and the Fengtian clique spread its power to the Yangtze."
