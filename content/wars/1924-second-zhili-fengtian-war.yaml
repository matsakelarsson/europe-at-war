  - title: Feng Yuxiang’s coup and the Zhili collapse
    date: October – November 1924
    when: "1924-10-23"
    borders: "1924-11-03"
    countries: [cn]
    body:
      - Feng Yuxiang, a Zhili general known for drilling his troops hard and for his Christian faith, had been sent with his army north of Beijing towards Rehe. He had long resented Wu Peifu and had been secretly in touch with the Fengtian side, which is said to have paid him. In mid-October he turned back, and in the early hours of 23 October his troops occupied Beijing, cut the railway and telegraph and put Cao Kun under house arrest. Feng renamed his army the Guominjun, the National People’s Army, and called for an end to the war.
      - Wu Peifu left the front to deal with Feng, but his armies broke behind him. Fengtian troops under Zhang Zongchang had already come through the Wall at the Lengkou pass and reached Luanzhou on the railway to Tianjin, and at the end of October more than 40,000 Zhili soldiers caught between Shanhaiguan and Qinhuangdao surrendered. Guominjun troops took Yangcun and Beicang near Tianjin on 2 November, and on 3 November Wu sailed from Tanggu with about 2,000 men for the Yangtze, where he later rebuilt his power in Hubei and Henan.
      - "Zhang and Feng met at Tianjin and agreed to make Duan Qirui, the old Anhui leader, provisional chief executive of a new government in Beijing (24 November). On 5 November Feng’s troops had expelled Puyi, the last Qing emperor, from the Forbidden City, where he had lived under the abdication agreement of 1912. The alliance did not last: Fengtian forces moved south to the Yangtze in 1925 and were driven back by Sun Chuanfang, and in late 1925 Feng and the Fengtian general Guo Songling turned against Zhang Zuolin."
    facts:
