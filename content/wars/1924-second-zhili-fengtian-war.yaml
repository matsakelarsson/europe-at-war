steps:
  - title: The Shanhai Pass and Rehe
    date: September – October 1924
    when: "1924-09-15"
    borders: "1924-10-01"
    countries: [cn]
    body:
      - After his defeat in 1922 Zhang Zuolin ran the three north-eastern provinces on his own, rebuilt his army with Japanese arms and advisers and set up an air force and an arsenal at Shenyang (Mukden). In Beijing, Cao Kun had bought his election as president in October 1923, and the Zhili clique held most of northern and central China. When the Zhili governor of Jiangsu, Qi Xieyuan, went to war with Lu Yongxiang of Zhejiang over Shanghai on 3 September 1924, Zhang and Sun Yat-sen in Guangzhou declared for Lu, and on 15 September the Fengtian armies marched.
      - The Fengtian 1st and 3rd Armies, under Jiang Dengxuan, Zhang Zuolin’s son Zhang Xueliang and Guo Songling, attacked the Zhili lines at the Shanhai Pass, where the Great Wall meets the sea. The 2nd Army under Li Jinglin and Zhang Zongchang advanced into Rehe, taking Chaoyang, Lingyuan and Pingquan, while cavalry under Wu Junsheng rode west towards Chifeng. Wu Peifu came from Beijing to command at the pass himself. On 7 October Fengtian troops broke through at Jiumenkou, the gate in the Wall north of the pass, and the same week took Chifeng, but the main Zhili line held, and the fighting turned into a costly deadlock. In the south Lu Yongxiang lost Shanghai and Hangzhou to Qi Xieyuan and Sun Chuanfang and fled in mid-October.
