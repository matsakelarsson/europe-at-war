id: sheikh-said-rebellion
name: Sheikh Said rebellion
start: "1925-02-13"
end: "1925-04-15"
tier: C
summary: A Kurdish rising in south-eastern Turkey in 1925 against the new secular republic, led by the Naqshbandi sheikh Said with the backing of the Kurdish nationalist society Azadî, which spread across the region around Diyarbakır before tens of thousands of troops and aircraft crushed it; Sheikh Said was captured in April and hanged in Diyarbakır with 47 others on 29 June. The government used the rising to pass the Law on the Maintenance of Order, which silenced the opposition press and parties, and historians still debate how far the revolt was nationalist and how far religious.
