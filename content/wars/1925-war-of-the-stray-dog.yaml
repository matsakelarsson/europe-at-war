id: war-of-the-stray-dog
name: War of the Stray Dog
start: "1925-10-18"
end: "1925-10-29"
tier: C
summary: A brief Greek invasion of Bulgaria in October 1925, also called the Incident at Petrich, after a Greek soldier was shot at the border on Mount Belasitsa – by one account while chasing his dog across it – and the Greek dictator Theodoros Pangalos sent troops towards the town of Petrich. Bulgaria appealed to the League of Nations, which ordered a ceasefire and the withdrawal of Greek troops and made Greece pay £45,000 in compensation, a quick success that contrasted with the League’s failure in the Corfu incident two years earlier.
countries: [gr, bg]
