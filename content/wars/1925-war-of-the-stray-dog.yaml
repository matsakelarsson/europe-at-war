    polities: [greece]
    ink: navy
  - id: bg
    name: Bulgaria
    polities: [bulgaria]
    ink: green
notes:
  - Greece’s version was that Bulgarian soldiers had crossed the border and attacked a Greek outpost. Greek troops entered Bulgaria on 22 October; the League’s ceasefire came hours before their planned attack on Petrich.
