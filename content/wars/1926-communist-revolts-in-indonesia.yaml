id: communist-revolts-in-indonesia
name: Communist revolts in the Dutch East Indies
start: "1926-11-12"
end: "1927-01"
tier: C
summary: "Risings called by the Communist Party of Indonesia (PKI) against Dutch colonial rule in West Java in November 1926 and West Sumatra in January 1927. The party, founded in 1920 as one of the first communist parties in Asia, had grown among railway, port and plantation workers and in the villages of Banten and West Sumatra, and faced arrests and bans on its meetings. At a meeting at Prambanan in December 1925 its leaders decided on a revolution starting with strikes; Tan Malaka, the party’s representative abroad, opposed it as premature, and the plan was postponed and split the party. On the night of 12–13 November 1926 armed groups attacked the prison, the telephone exchange and police posts in Batavia and were dispersed by the morning; in Banten bands of several hundred men, many led by local religious teachers, killed the district head of Menes and several police officers, gathered at Labuan and held out in places until December, and there were smaller attacks in the Priangan and around Surakarta. In West Sumatra the rising began on the night of 31 December 1926 at Silungkang, near the coal mines of Sawahlunto, and was crushed within days. The colonial government arrested some 13,000 people. About 4,500 were sentenced to prison and a few to death, the party was banned in 1927, and from 1927 some 1,300 people judged dangerous were interned without trial at Boven-Digoel, a camp built for the purpose about 450 km up the Digul River in New Guinea."
