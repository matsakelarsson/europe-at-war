notes:
  - "Historians differ on the character of the risings. Dutch officials at the time blamed them on Moscow, and later Indonesian accounts treated them as the first armed struggle for independence. Studies of Banten and Silungkang stress local grievances (taxes, forced labour, land and the colonial village heads) and the leading part of religious teachers and of members of the Sarekat Islam, so that some historians call the Silungkang rising as much an Islamic as a communist movement."
  - "Figures for those arrested and interned differ between sources: about 13,000 were arrested and questioned, about 4,500 imprisoned, and the camp at Boven-Digoel held at most 1,308 internees, with some 700 family members, in 1930; other accounts give 823 people sent there."
