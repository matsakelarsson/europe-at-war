  - title: War in Los Altos
    date: 1927–1928
    when: "1927-04-19"
    borders: "1927-12-31"
    countries: [mx]
    body:
      - "In January 1927 bands of rancheros in Los Altos, the high plateau north-east of Guadalajara, began to seize villages, armed with old rifles, machetes and whatever they could take from the army. Their leaders were local men, among them the ranch hand Victoriano Ramírez, called “El Catorce”, the pharmacist Jesús Degollado and two priests, Aristeo Pedroza and José Reyes Vega. On 23 February 1927 they defeated federal troops at San Francisco del Rincón, and on 15 March at San Julián. The government answered with force. Anacleto González Flores, leader of the Catholic civic movement in Jalisco, was arrested, tortured and shot on 1 April. On 19 April Reyes Vega’s men attacked a train carrying money for the Bank of Mexico near La Barca; the escort was killed and the cars were set on fire, and many passengers died. In the spring the army ordered the people of Los Altos into the towns and treated those who stayed as rebels, a reconcentration that drove thousands more to join the Cristeros."
      - "From the summer of 1927 the rising grew. The League hired Enrique Gorostieta, a former federal general of Huerta’s time and a liberal rather than a devout Catholic, who organised the scattered bands into a disciplined force, and in Zapopan women founded the Feminine Brigades of Saint Joan of Arc, which grew to some 25,000 members who smuggled ammunition, carried messages and nursed the wounded. The federal army, about 80,000 strong, held the towns and railways, and agrarista militias of peasants who had received land fought for the government. Both sides killed prisoners: soldiers hanged suspected Cristeros from telegraph poles and shot priests, and Cristeros killed agraristas and rural schoolteachers. In Mexico City the Jesuit Miguel Pro was shot without trial on 23 November 1927 after a bomb attack on Obregón. On 17 July 1928 Obregón, just re-elected president, was shot dead at a banquet in San Ángel by José de León Toral, a young Catholic militant."
    facts:
      - [Cristero victory at San Julián, "15 March 1927"]
      - [Death of Anacleto González Flores, "1 April 1927"]
      - [Execution of Miguel Pro, "23 November 1927"]
      - [Assassination of Obregón, "17 July 1928"]
