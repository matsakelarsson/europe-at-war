steps:
  - title: The Calles Law and the first risings
    date: June 1926 – January 1927
    when: "1926-08-03"
    borders: "1926-08-03"
    countries: [mx]
    body:
      - "The constitution of 1917 had written the revolution’s distrust of the Church into law: Church property belonged to the nation, primary education was to be secular, religious orders and worship outside churches were banned, priests could not vote or criticise the government, and the states could limit their number. Carranza and Obregón had enforced these articles unevenly. Calles, president from December 1924, set out to apply them in full. In 1925 his government backed a schismatic Mexican Catholic Church, and Catholics founded the National League for the Defence of Religious Liberty. In June 1926 Calles signed a law, known as the Calles Law, that set fines and prison terms for priests who wore clerical dress in public or criticised the government and required every priest to register with the civil authorities."
      - "In protest the bishops, with the consent of Pope Pius XI, suspended all public worship from 31 July 1926, the day the law came into force, and the League organised an economic boycott. For the first time since the Spanish conquest no priest said Mass in public anywhere in Mexico. Fighting broke out at once. On 3 August some 400 armed Catholics barricaded themselves in the Sanctuary of Guadalupe in Guadalajara and surrendered when their ammunition ran out; about 18 people were killed. The next day soldiers stormed the parish church of Sahuayo, Michoacán, and the priest and his vicar were killed. In mid-August the army shot Father Luis Bátiz Sainz and three young Catholic activists at Chalchihuites, Zacatecas, and the rancher Pedro Quintanar rose in revolt; in the autumn there were risings in Guanajuato, Durango and Jalisco. On 1 January 1927 the League’s young leader René Capistrán Garza issued a manifesto, “To the Nation”, calling for a general rising."
    facts:
      - [Calles Law in force, "31 July 1926"]
      - [Public worship suspended, "31 July 1926 – June 1929"]
      - [Siege of the Sanctuary of Guadalupe, Guadalajara, "3 August 1926"]
      - [Call to arms, "1 January 1927"]
