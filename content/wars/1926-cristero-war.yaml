id: cristero-war
name: Cristero War
start: "1926-08-01"
end: "1929-06-21"
tier: B
summary: "A Catholic rising against the anticlerical laws of the Mexican revolutionary state, fought mainly in the west-central states of Jalisco, Michoacán, Guanajuato, Colima, Zacatecas and Aguascalientes. The 1917 constitution barred the Church from owning property and from running schools, banned religious orders and public worship outside churches and let the states limit the number of priests. President Plutarco Elías Calles enforced these articles strictly, and when the Calles Law of June 1926 set penalties for breaking them, the bishops suspended public worship from 31 July 1926. Armed risings began in August and spread after a call to arms on 1 January 1927. The rebels, mostly rancheros and peasants, called themselves Cristeros after their cry “¡Viva Cristo Rey!” (Long live Christ the King); by 1929 they had perhaps 50,000 men under arms, supplied with ammunition by the women of the Brigades of Saint Joan of Arc, and held much of the countryside of Jalisco. The federal army, with agrarista militias and arms from the United States, held the towns. Both sides killed prisoners and civilians. After the assassination of President-elect Álvaro Obregón by a Catholic militant in 1928, the US ambassador Dwight Morrow brokered the arreglos (arrangements) of 21 June 1929 between the bishops and President Emilio Portes Gil, which allowed worship to resume without repealing the laws. The Cristeros, who had not been consulted, laid down their arms. About 90,000 combatants died, and many civilians; hundreds of Cristero leaders were killed after the amnesty, and a second, smaller rising followed in the 1930s."
countries: [mx]
