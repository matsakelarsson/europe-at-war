  - title: Tepatitlán and the arreglos
    date: 1929
    when: "1929-06-21"
    borders: "1929-06-21"
    countries: [mx]
    body:
      - "By 1929 the Cristeros held most of the countryside of Jalisco and parts of Michoacán, Colima, Guanajuato, Zacatecas and Nayarit, and Gorostieta set up a civil administration in the areas they controlled. In March part of the army rose against the government under General José Gonzalo Escobar, and federal troops were withdrawn from the west to crush the rebellion, but the Cristeros could not take a large city. On 19 April they took Tepatitlán in Los Altos after a hard fight, in which Reyes Vega was killed. On 2 June Gorostieta was killed by federal troops at the hacienda of El Valle near Atotonilco el Alto."
      - "Peace came from above. The US ambassador Dwight Morrow, who wanted stability on the border and a settlement of American oil claims, had met Calles over breakfast since late 1927, and with the American priest John J. Burke he brought together the interim president Emilio Portes Gil and Archbishop Leopoldo Ruiz y Flores and Bishop Pascual Díaz. In the arreglos of 21 June 1929 the government promised not to use the laws against the Church as an institution: priests named by their bishops would register, religious teaching would be allowed inside churches, and the Church could use its buildings. The laws stayed on the books. Church bells rang again at the end of June. The Cristeros had not been consulted and many felt betrayed, but the bishops ordered them to lay down their arms, and most did so under an amnesty."
      - "The war had cost some 90,000 combatant lives and many civilian ones. After the amnesty hundreds of Cristero leaders were hunted down and killed, and many families emigrated to the United States. When the government pressed socialist education in the 1930s a second, smaller rising, la Segunda, broke out, during which rural teachers were killed; it faded after President Lázaro Cárdenas stopped enforcing the anticlerical laws in the late 1930s."
    facts:
      - [Cristeros take Tepatitlán, "19 April 1929"]
      - [Death of Gorostieta, "2 June 1929"]
      - [Arreglos, "21 June 1929"]
      - [Dead, "about 90,000 combatants, besides civilians"]
