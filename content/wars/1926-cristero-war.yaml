notes:
  - "Figures are uncertain. The count most often quoted gives about 90,000 combatant dead, 56,882 on the federal side and some 30,000 Cristeros (other estimates of Cristero dead reach 50,000), besides many civilians, most of them in Jalisco; some estimates put all deaths, civilians included, as high as 250,000. The historian Jean Meyer, whose interviews with surviving Cristeros in the 1960s are a main source, estimated that the Cristeros had about 50,000 men in arms by 1929."
  - "The bishops never formally backed the rising, and most of them condemned armed rebellion, though a few, such as Archbishop Francisco Orozco y Jiménez of Guadalajara, stayed hidden among the rebels. Many Cristeros also fought for land and against the agrarian reform as it was carried out by the government’s local allies, and many Catholics, and many peasants who received land, fought against them."
  - "The Catholic Church has beatified or canonised dozens of priests and laymen killed during the war, among them the Jesuit Miguel Pro and the fourteen-year-old José Sánchez del Río. The government side remembered the teachers and agraristas killed by Cristeros."
