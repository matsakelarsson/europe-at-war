  - title: Longtan and the reunion of the Nationalists
    date: May 1927 – February 1928
    when: "1927-05-28"
    borders: "1927-09-01"
    countries: [cn]
    body:
      - Both Nationalist governments carried the war north. Wuhan’s armies under Tang Shengzhi and Zhang Fakui pushed up the Beijing–Hankou railway into Henan and beat Zhang Zuolin’s Fengtian troops in bloody battles in May, while Feng Yuxiang’s Guominjun came out of the north-west and took Luoyang and Zhengzhou. Nanjing’s armies took Bengbu and Xuzhou in May and early June. Feng met the Wuhan leaders at Zhengzhou and then Chiang at Xuzhou on 19–21 June, and declared for Nanjing. Yan Xishan of Shanxi joined the Nationalists the same month.
      - "The divided Nationalists then lost ground. Sun Chuanfang and Zhang Zongchang retook Xuzhou on 24 July, and Chiang, under pressure from Wuhan and the Guangxi generals, resigned on 12 August. Sun Chuanfang struck at Nanjing itself: on 26 August his troops crossed the Yangtze at Longtan, east of the city, and cut the railway to Shanghai. In six days of fighting Li Zongren, Bai Chongxi and He Yingqin drove them back into the river; Sun lost more than 10,000 dead and tens of thousands captured, and never recovered."
      - In September the Wuhan and Nanjing governments merged. The Communists, now outlawed, began their own armed risings with the Nanchang Uprising of 1 August (see the Chinese Civil War). Tang Shengzhi, who refused to submit to Nanjing, was driven from Hubei in November. Chiang, who married Soong Mei-ling in December, was recalled in January 1928 and on 18 February became commander-in-chief again, with the army reorganised into four group armies under himself, Feng Yuxiang, Yan Xishan and Li Zongren.
    facts:
      - [Feng Yuxiang sides with Nanjing, "June 1927"]
      - [Chiang resigns, "12 August 1927"]
      - [Battle of Longtan, "26–31 August 1927"]
      - [Chiang commander-in-chief again, "18 February 1928"]
