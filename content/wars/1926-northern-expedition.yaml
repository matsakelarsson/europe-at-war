  - title: Jinan
    date: April – May 1928
    when: "1928-04-07"
    borders: "1928-05-11"
    countries: [cn, jp]
    body:
      - On 7 April 1928 Chiang Kai-shek relaunched the expedition with about a million men against Zhang Zuolin’s National Pacification Army. His own First Group Army advanced up the Tianjin–Pukou railway into Shandong, the province of Zhang Zongchang, while Feng Yuxiang’s Second Group Army advanced on its left, Yan Xishan’s Third Group Army came out of Shanxi along the railways towards Beijing, and Li Zongren’s Fourth moved up from Wuhan. Shandong was taken quickly, and Nationalist troops entered Jinan, its capital, on 30 April–1 May.
      - Japan’s prime minister Tanaka Giichi had sent troops to Shandong to protect about 2,000 Japanese residents of Jinan. On the morning of 3 May fighting broke out between Japanese and Chinese soldiers. The Nationalist negotiator Cai Gongshi and members of his staff were killed by Japanese troops, and Japanese residents were also killed. Chiang ordered his armies to avoid a war with Japan and to bypass the city, but on 8 May the Japanese attacked the Chinese garrison left in Jinan and took the city by 11 May. Chinese figures put Chinese deaths at over 6,000, most of them civilians; Japan occupied Jinan until May 1929.
      - The Jinan Incident turned Chinese anger towards Japan. The Nationalist armies crossed the Yellow River west of the city and continued north, taking Dezhou on 13 May.
    facts:
