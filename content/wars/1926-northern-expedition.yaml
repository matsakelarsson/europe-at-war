  - title: Beijing, Huanggutun and the flag of the north-east
    date: May – December 1928
    when: "1928-06-04"
    borders: "1928-06-08"
    countries: [cn, jp]
    body:
      - In May the Nationalist armies closed on Beijing from the south and west. Yan Xishan’s troops took Zhangjiakou and the Nankou pass in late May, and Zhang Zuolin’s last counter-offensive failed. Japan warned both sides that it would act if the fighting spread to Manchuria. On 3 June Zhang Zuolin left Beijing by train for Shenyang. Early on 4 June, as the train passed under a railway bridge at Huanggutun outside Shenyang, a bomb planted by officers of the Japanese Kwantung Army under Colonel Kōmoto Daisaku exploded; Zhang died of his wounds within hours. The plotters had hoped to provoke disorder and a Japanese takeover of Manchuria, but the Japanese government did not follow them.
      - Yan Xishan’s Third Group Army entered Beijing in early June, and Tianjin surrendered on 11 June. The Nationalist government kept its capital in Nanjing and renamed Beijing (“northern capital”) Beiping (“northern peace”). The remnants of Zhang Zongchang’s army, which had tried to break into Manchuria, were destroyed in eastern Hebei in August and September.
      - Zhang Xueliang succeeded his father in Manchuria. Resisting Japanese pressure to keep the north-east apart, he negotiated with Nanjing, and on 29 December 1928 the Nationalist flag was raised over Shenyang and the north-eastern provinces. China was united under one government in name, but Feng, Yan, the Guangxi clique and Zhang kept their own armies and provinces, and they fought Chiang again in 1929–1930.
    facts:
