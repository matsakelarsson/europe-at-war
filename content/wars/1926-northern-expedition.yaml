  - title: Shanghai, Nanjing and the split
    date: March – July 1927
    when: "1927-03-21"
    borders: "1927-04-18"
    countries: [cn]
    body:
      - In March 1927 the Nationalists closed on the lower Yangtze. In Shanghai, Communist-led unions called a general strike and rose against the garrison on 21–22 March, and Bai Chongxi’s troops entered a city already largely in the hands of the workers’ pickets. Zhang Zongchang’s troops abandoned Nanjing, and on 24 March Cheng Qian’s 6th Army entered it. Soldiers, among them deserters from the northern army, looted the foreign consulates, homes and missions and killed six foreigners, and British and American warships shelled the city to cover the evacuation; about 40 people died in all. The Nanjing Incident hardened foreign opinion against the Nationalists.
      - Chiang Kai-shek, backed by Shanghai bankers and the Green Gang of Du Yuesheng, now turned on his allies. Before dawn on 12 April gang members and troops attacked the union headquarters and disarmed the workers’ pickets; on 13 April soldiers fired on a protest march, killing about a hundred people. Hundreds were executed and thousands disappeared in the following weeks, and the purge spread to Guangzhou and other cities under Chiang’s generals. On 18 April Chiang set up his own national government in Nanjing, rival to the one in Wuhan.
      - In Wuhan, the left-wing Kuomintang under Wang Jingwei kept the alliance with the Communists for a few more months, while peasant unrest grew and its own officers turned against it; in Changsha on 21 May an officer, Xu Kexiang, began a purge in which an estimated 10,000 people were killed in and around the city over three weeks. In June Stalin’s instructions to the Communists to arm workers and peasants and purge the Kuomintang leadership became known to Wang, and on 15 July the Wuhan government expelled the Communists. Of the party’s roughly 60,000 members, only about 10,000 remained by the end of the year.
