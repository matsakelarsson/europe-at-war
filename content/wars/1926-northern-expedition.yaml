  - title: Hunan and Hubei
    date: July – October 1926
    when: "1926-07-11"
    borders: "1926-10-10"
    countries: [cn]
    body:
      - The army marched north from Guangdong into Hunan, where Tang Shengzhi’s troops had already held out against Wu Peifu’s generals. Changsha was taken on 11 July and Yuezhou, the port where the Xiang River enters the Yangtze, on 22 August. Wu Peifu, who had been fighting the Guominjun north of Beijing, hurried south.
      - The road to Wuhan ran along the Canton–Hankou railway through two river crossings. At Tingsi Bridge on 26–27 August the 4th Army, the “Ironsides” of Zhang Fakui with Ye Ting’s Communist-led independent regiment in the lead, broke Wu’s defences, and at Hesheng Bridge on 29–30 August Wu’s counter-attack collapsed with the loss of about 8,000 men, at least 5,000 of them captured. Hanyang and Hankou fell in early September after one of Wu’s commanders changed sides, but the walled city of Wuchang held out under siege until its starving garrison surrendered on 10 October 1926, the anniversary of the 1911 revolution that had begun there.
      - Wu Peifu’s power was broken; he withdrew to Henan with the remnants of his army. Peasant associations spread through Hunan and Hubei behind the troops, and in the countryside they attacked landlords and seized land, which alarmed many officers whose families owned land.
