id: northern-expedition
name: Northern Expedition
start: "1926-07-09"
end: "1928-12-29"
tier: A
summary: "The campaign in which the Kuomintang’s National Revolutionary Army marched from Guangzhou to Beijing in 1926–1928, defeated the warlord armies of Wu Peifu, Sun Chuanfang and Zhang Zuolin, and brought China under the Nationalist government in Nanjing. Launched on 9 July 1926 with about 100,000 men, Soviet advisers and Chinese Communists inside the alliance of the first united front, it took Hunan and Hubei in the summer and autumn of 1926 and Jiangxi, Fujian and Zhejiang by early 1927. When it reached Shanghai and Nanjing in March 1927, the movement split: Chiang Kai-shek turned on the Communists in the Shanghai massacre of 12 April and set up his own government in Nanjing, against the left-wing Kuomintang government in Wuhan, which broke with the Communists in July. Reunited under Chiang and joined by Feng Yuxiang, Yan Xishan and the Guangxi clique, the Nationalist armies, about a million men, resumed the advance in April 1928. Japanese troops clashed with them at Jinan in May, killing thousands of Chinese, and on 4 June officers of Japan’s Kwantung Army killed Zhang Zuolin by blowing up his train as he withdrew to Manchuria. Beijing was taken in June and renamed Beiping, and on 29 December 1928 Zhang’s son Zhang Xueliang raised the Nationalist flag over the north-east. Estimates of deaths, including civilians, range from about 370,000 to over 900,000."
countries: [cn, jp]
