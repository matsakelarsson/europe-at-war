steps:
  - title: Guangzhou and the united front
    date: 1923 – July 1926
    when: "1926-07-09"
    borders: "1926-07-09"
    countries: [cn]
    body:
      - After the warlords had divided China, Sun Yat-sen looked for help abroad and found it in the Soviet Union. In 1923–1924 he reorganised the Kuomintang on Soviet lines with the adviser Mikhail Borodin, admitted members of the young Chinese Communist Party into it as individuals, the first united front, and opened the Whampoa Military Academy near Guangzhou in June 1924 with Chiang Kai-shek as its commandant and Soviet money, weapons and instructors. Sun died in Beijing on 12 March 1925. The May Thirtieth Movement of 1925, when police of the Shanghai International Settlement shot demonstrators, brought strikes and boycotts across China and recruits to both parties.
      - In July 1925 the Kuomintang formed a Nationalist government in Guangzhou. Its new army, the National Revolutionary Army, defeated Chen Jiongming in eastern Guangdong in 1925, and in 1926 the Guangxi clique of Li Zongren and Bai Chongxi joined it. Chiang rose to the top of the army; after the Zhongshan Warship Incident of March 1926 he curbed the Communists and Soviet advisers in Guangzhou, but kept the alliance. When the Hunanese general Tang Shengzhi came over to the Nationalists and was attacked by Wu Peifu, Chiang was appointed commander-in-chief on 5 June, and on 9 July 1926 the Northern Expedition was formally launched.
      - The National Revolutionary Army had about 100,000 men in eight armies, with the Soviet general Vasily Blyukher (known in China as Galen) as chief adviser. Against it stood Wu Peifu in Hubei, Henan and Hunan, Sun Chuanfang in the five provinces of the lower Yangtze, and Zhang Zuolin, who held Manchuria, Beijing and much of the north with his allies, in all perhaps 700,000 men or more. Political workers, many of them Communists, went ahead of the troops to organise peasant and labour unions.
