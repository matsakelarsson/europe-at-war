notes:
  - Until 1928 the internationally recognised government of the Republic of China was the Beiyang government in Beijing, controlled in turn by the northern cliques; the Nationalist government in Guangzhou (from 1925), Wuhan and Nanjing was recognised abroad only after the expedition.
  - Feng Yuxiang joined the Nationalists in 1926 and brought his Guominjun into the campaign from the north-west in 1927; Yan Xishan of Shanxi joined in June 1927. Sun Chuanfang, a Zhili general, allied himself with Zhang Zuolin from late 1926.
  - The Communists were members of the Kuomintang and of its army and government during the first united front (1924–1927); their role in the campaign is described differently in Nationalist and Communist histories.
