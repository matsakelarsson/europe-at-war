      - [Whampoa Military Academy opens, "June 1924"]
      - [Death of Sun Yat-sen, "12 March 1925"]
      - [Nationalist government formed in Guangzhou, "1 July 1925"]
      - [Northern Expedition launched, "9 July 1926"]
      - [National Revolutionary Army, "about 100,000 men"]
