  - title: Jiangxi, Fujian and Zhejiang
    date: September 1926 – February 1927
    when: "1926-09-19"
    borders: "1927-02-23"
    countries: [cn]
    body:
      - Sun Chuanfang had waited while Wu Peifu was beaten. The Nationalists now turned east into Jiangxi, where Chiang Kai-shek took personal command. Nanchang was taken on 19 September with the help of a defecting garrison but lost again days later when Sun arrived with reinforcements, and the fighting around the city cost the Nationalists about 20,000 casualties. After regrouping, they took Jiujiang on the Yangtze in early November and entered Nanchang for good on 8–9 November 1926.
      - In the south-east He Yingqin’s column marched from eastern Guangdong into Fujian and entered Fuzhou on 9 December. In Zhejiang, Sun had crushed a rising by the governor Xia Chao in October, but other commanders went over to the Nationalists, and in January–February 1927 Bai Chongxi advanced down the Qiantang valley; Hangzhou was abandoned by Sun’s troops on 17 February. Zhang Zuolin, alarmed, formed the National Pacification Army on 1 December 1926 with Sun Chuanfang and Zhang Zongchang as his deputies and sent Shandong troops into Anhui and Jiangsu.
      - The Nationalist government moved from Guangzhou to Wuhan in December 1926 and January 1927. In January crowds in Hankou and Jiujiang overran the British concessions, which Britain then handed back by agreement. A rift grew between the Wuhan government, dominated by the Kuomintang left, the Communists and Borodin, and Chiang at his headquarters in Nanchang.
    facts:
