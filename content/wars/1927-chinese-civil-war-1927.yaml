      - [Zhu De joins Mao, "April 1928"]
      - [Changsha taken by the Red Army, "27 July 1930"]
      - [Futian incident, "December 1930"]
      - [Chinese Soviet Republic proclaimed at Ruijin, "7 November 1931"]
