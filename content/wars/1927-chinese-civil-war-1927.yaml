  - title: The fifth campaign
    date: September 1933 – October 1934
    when: "1933-09-25"
    borders: "1934-10-10"
    countries: [cn]
    body:
      - For the fifth campaign, launched on 25 September 1933, Chiang changed his method. Advised by German officers, among them Hans von Seeckt, and drawing on his own commanders’ experience, he surrounded the base with perhaps 500,000 men and advanced slowly behind lines of stone and concrete blockhouses linked by new roads, some 14,000 of them by the autumn of 1934, while a blockade cut off salt and other supplies. Peasant militias and political control kept the population in the areas taken back.
      - The Red Army, with about 100,000 regulars, was directed by Bo Gu and Otto Braun, who rejected Mao’s mobile tactics and tried to hold the line in positional battles it could not win. When the 19th Route Army in Fujian rebelled against Chiang in November 1933 and set up a People’s Government at Fuzhou, the Communists gave it little help, and it was crushed in January 1934. In April 1934 the Nationalists took Guangchang, one of the gates to the base, after a battle that cost the Red Army over 5,000 casualties. By the late summer the base was shrinking, and the leaders decided to break out.
