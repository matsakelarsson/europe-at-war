  - title: Xi’an and the second united front
    date: December 1936 – September 1937
    when: "1936-12-12"
    borders: "1937-09-22"
    countries: [cn]
    body:
      - Chiang Kai-shek had ordered Zhang Xueliang’s Northeastern Army, driven out of Manchuria by Japan, and Yang Hucheng’s Northwestern Army to destroy the Communists in Shaanxi. Many of their officers wanted to fight Japan instead, and over 1936 they had come to a secret truce with the Red Army. When Chiang flew to Xi’an to push them into action, Zhang and Yang had him seized at the hot springs of Huaqing Pool in the early hours of 12 December 1936 and demanded an end to the civil war and a united front against Japan.
      - Zhou Enlai came to Xi’an to negotiate, and the Soviet Union, which wanted a strong China against Japan, urged the Communists to keep Chiang alive. Chiang was released on 25 December without signing anything, but the civil war in effect stopped. Zhang Xueliang flew with him to Nanjing and was kept under arrest for more than half a century. In January 1937 the Communists made Yan’an their capital.
      - After the Japanese attack at the Marco Polo Bridge in July 1937 the two parties agreed terms. The Red Army in the north became the Eighth Route Army of the National Revolutionary Army in August, and on 22 September 1937 the Communists announced that they were dissolving the Chinese Soviet Republic; its base became the Shaan-Gan-Ning Border Region. The guerrillas left behind in the south became the New Fourth Army. Both armies stayed under Communist command, and the second united front broke down in the 1940s.
    facts:
      - [Xi’an Incident, "12–25 December 1936"]
      - [Yan’an becomes the Communist capital, "January 1937"]
      - [Eighth Route Army formed, "August 1937"]
      - [Chinese Soviet Republic dissolved, "22 September 1937"]
    markers:
