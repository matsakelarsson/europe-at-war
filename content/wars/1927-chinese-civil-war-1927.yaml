  - title: The red bases and the Chinese Soviet Republic
    date: 1928 – 1931
    when: "1928-04"
    borders: "1931-11-07"
    countries: [cn]
    body:
      - In April 1928 Zhu De and Chen Yi brought the remnants of the Nanchang army to the Jinggang Mountains, and with Mao they formed the Fourth Red Army. Short of food, they moved in early 1929 to the hills of southern Jiangxi and western Fujian, where they built a base around Ruijin and Tingzhou, redistributed land and recruited peasants. Other bases grew up on the borders of Hubei, Henan and Anhui (Eyuwan), around Honghu in the Hubei marshes and western Hunan under He Long, and in north-eastern Jiangxi under Fang Zhimin. Mao developed a guerrilla doctrine summed up as “the enemy advances, we retreat; the enemy halts, we harass; the enemy tires, we attack; the enemy retreats, we pursue”.
      - The party’s leaders in Shanghai, led by Li Lisan, ordered attacks on cities in 1930. Peng Dehuai’s army took Changsha on 27 July 1930 and held it for about ten days, but attacks on Nanchang and a second attempt on Changsha failed. Inside the Jiangxi base Mao’s supporters purged local Communists accused of belonging to the “AB League”, a Kuomintang group; the Futian incident of December 1930 led to a revolt by Red Army units against the party leadership, and thousands of people were killed in the purges of 1930–1931.
      - On 7 November 1931, the anniversary of the Russian revolution, a congress at Ruijin proclaimed the Chinese Soviet Republic, with Mao as chairman and Zhu De as commander of the Red Army. At its height in 1933 it governed about 3.4 million people in scattered territories covering some 70,000 square kilometres.
