  - title: The Long March to Zunyi
    date: October 1934 – January 1935
    when: "1934-10-16"
    borders: "1935-01-15"
    countries: [cn]
    body:
      - In mid-October 1934 the Central Red Army, about 86,000 soldiers with some 11,000 party and government staff and thousands of porters carrying presses, archives and machinery, crossed the rivers near Yudu and broke out to the west, leaving behind a rearguard of some 16,000 men. It slipped through the first blockade lines, partly by a secret arrangement with the Guangdong general Chen Jitang, but the slow column was caught at the Xiang River in northern Guangxi, where Guangxi and Hunan troops attacked it during the crossing in late November; by 1 December it was down to perhaps 30,000–40,000 men.
      - Instead of marching north to join He Long, the army turned west into Guizhou, where the provincial troops were weaker. It crossed the Wu River at the start of January 1935 and took Zunyi. At a meeting of the party leadership there on 15–17 January, Bo Gu and Otto Braun were blamed for the defeats, and Mao, with Zhou Enlai, gained a leading role in military affairs. Communist histories later made Zunyi the moment of Mao’s rise to power; his full control came later.
