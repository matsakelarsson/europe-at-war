  - title: The rivers of the south-west
    date: January – June 1935
    when: "1935-01-28"
    borders: "1935-06-12"
    countries: [cn]
    body:
      - From Zunyi the army, perhaps 30,000 men, spent three months manoeuvring through northern Guizhou to shake off its pursuers, crossing and recrossing the Chishui River four times; after a costly fight at Tucheng in late January it threatened Guiyang, where Chiang Kai-shek had flown to direct the pursuit, and then turned into Yunnan. Between 29 April and 9 May it crossed the Jinsha, the upper Yangtze, by a few boats at Jiaopingdu, out of reach of the Nationalist armies.
      - In the Yi country of south-western Sichuan, Liu Bocheng made a pact of brotherhood with a Yi chief that let the army pass. The Dadu River was crossed at Anshunchang on 24–25 May, and on 29 May an advance party seized the chain bridge at Luding further upstream, crossing under fire on the chains after the planks had been removed. Communist accounts celebrated the crossing; some historians doubt that there was much of a fight. In June the army crossed the Jiajin Mountain, a pass of over 4,000 metres where many died of cold and altitude, and on 12 June met the vanguard of Zhang Guotao’s Fourth Front Army near Maogong.
    facts:
      - [Four crossings of the Chishui, "January–March 1935"]
      - [Crossing of the Jinsha at Jiaopingdu, "29 April – 9 May 1935"]
      - [Luding Bridge, "29 May 1935"]
      - [Meeting with the Fourth Front Army, "12 June 1935"]
