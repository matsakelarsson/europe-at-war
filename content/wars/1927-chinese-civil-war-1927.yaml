  - title: The other Red armies
    date: November 1935 – March 1937
    when: "1935-11-19"
    borders: "1936-10-22"
    countries: [cn]
    body:
      - Zhang Guotao’s army spent the winter of 1935–1936 in the Tibetan lands of western Sichuan, where it set up its own party centre and lost many men fighting Sichuanese troops. He Long’s Second Front Army left its base on the Hunan–Hubei border on 19 November 1935 and made its own long march west through Guizhou and Yunnan, crossed the Jinsha at Shigu in April 1936 and joined Zhang near Garzê in July. Under pressure from the party centre and the Comintern, the combined armies marched north, and the three Red armies met at Huining in Gansu on 9 October 1936 and at Jiangtaibao, to the east, on 22 October, ending the Long March.
      - In late October 1936 about 21,800 men of the Fourth Front Army crossed the Yellow River to open a route to the Soviet Union through the Hexi Corridor. This West Route Army was destroyed over the winter by the Hui cavalry of Ma Bufang and Ma Buqing; thousands were killed in battle or after capture, and many women soldiers were taken as captives. About 400 survivors under Li Xiannian reached Xinjiang in the spring of 1937. Zhang Guotao lost his standing, and in 1938 he defected to the Nationalists.
    facts:
      - [Second Front Army leaves Hunan, "19 November 1935"]
      - [Red armies meet at Huining, "9 October 1936"]
      - [West Route Army, "about 21,800 men, destroyed by March 1937"]
