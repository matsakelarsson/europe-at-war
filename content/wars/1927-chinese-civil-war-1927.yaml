id: chinese-civil-war-1927
name: Chinese Civil War (1927–1937)
start: "1927-08-01"
end: "1937-09-22"
tier: A
summary: "The first phase of the war between the Kuomintang’s Nationalist government and the Chinese Communist Party, from the Communists’ first armed risings in 1927 to the second united front against Japan in 1937. After the Kuomintang turned on its Communist allies in 1927, the Communists rose at Nanchang, in the Autumn Harvest Uprising and at Guangzhou, and were beaten; the survivors built rural bases, the largest in southern Jiangxi and western Fujian, where Mao Zedong and Zhu De formed the Red Army and the Chinese Soviet Republic was proclaimed at Ruijin in November 1931. Chiang Kai-shek’s government launched five encirclement campaigns against the Jiangxi base. The Red Army beat the first four, but the fifth, with about half a million men and lines of blockhouses, forced it to break out in October 1934 on the Long March: of about 86,000 who left Jiangxi, some 8,000 reached northern Shaanxi a year later, and the other Red armies followed in 1936. There, at Bao’an and Yan’an, Mao became the party’s leading figure. In December 1936 Chiang was seized at Xi’an by his own generals, who wanted an end to the civil war, and after Japan invaded in July 1937 the two parties formed a second united front; the Red Army became the Eighth Route Army and the New Fourth Army."
countries: [cn]
