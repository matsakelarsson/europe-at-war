  - title: The grasslands and northern Shaanxi
    date: June – October 1935
    when: "1935-06-26"
    borders: "1935-10-19"
    countries: [cn]
    body:
      - Zhang Guotao’s Fourth Front Army, about 80,000 men, was far stronger than Mao’s battered First Front Army, and Zhang demanded a larger share of the leadership. At meetings at Lianghekou in June and Maoergai in August the leaders agreed to move north but disagreed on where, and the two armies were mixed into two columns. In August Mao’s column crossed the high marshes of the Zoigê grasslands, where many died of exposure, hunger and drowning. In September Zhang, with the western column, refused to follow and turned back south; Mao’s men went on alone.
      - On 16–17 September the column forced the Lazikou pass in southern Gansu against provincial troops. At Hadapu the leaders read in newspapers that a Communist base still existed in northern Shaanxi, built by Liu Zhidan and joined by Xu Haidong’s 25th Army, and they made for it. On 19 October 1935 about 8,000 men reached Wuqi in northern Shaanxi. Mao later spoke of a march of 25,000 li (12,500 km); two researchers who retraced the route in 2003 measured about 6,000 km.
    facts:
      - [Lianghekou meeting, "June 1935"]
      - [Zoigê grasslands, "August 1935"]
      - [Lazikou pass, "16–17 September 1935"]
      - [Arrival at Wuqi, "19 October 1935, about 8,000 men"]
