steps:
  - title: Nanchang, the Autumn Harvest and Guangzhou
    date: August – December 1927
    when: "1927-08-01"
    borders: "1927-08-01"
    countries: [cn]
    body:
      - After the Kuomintang in Nanjing and then in Wuhan had turned against them in 1927, the Communists, on instructions from the Comintern, turned to armed revolt. At Nanchang on 1 August 1927 troops of the Nationalist army led by Communist officers, among them He Long, Ye Ting, Zhu De and Liu Bocheng, with Zhou Enlai as party secretary, rose against the garrison, more than 20,000 men in all. They held the city for a few days and then marched south through eastern Jiangxi towards the Guangdong coast, hoping for Soviet arms by sea; they took Shantou in late September but were scattered by Guangdong troops in early October. The day is still kept as the founding day of the People’s Liberation Army.
      - In September Mao Zedong led the Autumn Harvest Uprising on the border of Hunan and Jiangxi with a mixed force of soldiers, miners and peasants. It failed to take any city, and in October Mao led about a thousand survivors into the Jinggang Mountains on the Hunan–Jiangxi border, where he allied himself with two local leaders of armed bands. On 11 December Communists in Guangzhou rose and set up a commune, which was crushed within three days; thousands of people were killed in the reprisals.
      - By the end of 1927 the party had lost most of its members in the cities. Peng Pai’s soviet in Haifeng and Lufeng on the Guangdong coast lasted until early 1928, but the future lay in remote rural bases.
