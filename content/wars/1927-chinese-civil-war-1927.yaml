  - title: The first four encirclement campaigns
    date: December 1930 – March 1933
    when: "1930-12-30"
    borders: "1933-03-01"
    countries: [cn]
    body:
      - With the Central Plains War over, Chiang Kai-shek turned on the Jiangxi base. In the first campaign, from late 1930, the Red Army of about 40,000 drew the Nationalist columns into the hills and on 30 December 1930 destroyed the 18th Division at Longgang, capturing its commander Zhang Huizan, who was later executed; a second division was beaten at Dongshao days later. In the second campaign, April–May 1931, about 200,000 Nationalist troops under He Yingqin were beaten in a series of battles in fifteen days. In the third, from July 1931, Chiang took command himself with 300,000 men and pressed the Red Army hard, but called it off in September when a revolt in Guangdong and the Japanese seizure of Manchuria intervened.
      - The other bases fared worse. In 1932 Nationalist offensives drove Zhang Guotao’s Fourth Front Army out of Eyuwan into northern Sichuan, where it built a new base, and He Long’s army lost Honghu and moved to the Hunan–Hubei–Sichuan border. In Jiangxi the fourth campaign, from January to March 1933, ended with two Nationalist divisions destroyed at Huangpi and further losses at Caotaigang. Mao had already been removed from command of the army in October 1932; in early 1933 the party’s leaders, led by the young Bo Gu, moved from Shanghai to Ruijin, and the Comintern’s military adviser Otto Braun followed in the autumn.
    facts:
