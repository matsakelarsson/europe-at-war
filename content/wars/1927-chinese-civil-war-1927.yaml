notes:
  - The Communists called their bases soviets and their areas “red areas”; the Nationalists called their campaigns “encirclement and suppression” and the Communists “red bandits”. Both parties wrote the history of these years to suit their later needs, and many figures, above all for the Long March, are uncertain.
  - The Nationalists often fought the Communists with the armies of provincial governors only loosely loyal to Nanjing, in Guangdong, Guangxi, Hunan, Guizhou, Yunnan, Sichuan and the north-west.
