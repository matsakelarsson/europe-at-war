notes:
  - Habibullah Kalakani was called Bacha-i Saqao, “son of the water-carrier”, by his enemies, after his father’s trade; his followers are called Saqqawists after this name. He took the title Habibullah Ghazi as emir.
  - Saqqawist resistance went on in places until 1931, when their last stronghold, Herat, fell.
