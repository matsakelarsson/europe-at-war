id: afghan-civil-war-1928
name: Afghan civil war of 1928–1929
start: "1928-11-14"
end: "1929-10-13"
tier: C
summary: A civil war that overthrew King Amanullah Khan, whose reforms, among them women’s rights, Western dress and conscription, had angered tribal and religious leaders. It began with a revolt of the Shinwari tribe around Jalalabad in November 1928. Habibullah Kalakani, a Tajik from the Koh-i Daman north of Kabul whose followers are known as the Saqqawists, attacked Kabul in December and took it on 17 January 1929, after Amanullah had abdicated and fled to Kandahar. Habibullah ruled as emir for nine months and took Kandahar in June, after Amanullah had left the country, while a Soviet detachment briefly entered the north. Nadir Khan, a former commander-in-chief, raised the tribes of the south-east and took Kabul on 13 October 1929. He became king, and Habibullah was executed in November. Each side is estimated to have lost about 7,500 fighters.
