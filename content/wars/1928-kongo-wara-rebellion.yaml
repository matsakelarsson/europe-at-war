notes:
  - "French officials called the war a revolt or a jacquerie and blamed “fetishism”; historians have debated whether it was a messianic movement or village self-defence against colonial demands (Thomas O’Toole, 1984), and how far the fighting after Karnou’s death was directed by his movement rather than by local reactions to French reprisals. The figures for the movement’s following (some 350,000 people and 60,000 fighters) and for its dead are colonial estimates."
  - "The rising is still told in Gbaya folk tales and songs in the Central African Republic and Cameroon, and dates for its end differ: 1931 in most accounts, 1932 or 1933 if the last scattered resistance is counted, and 1935 for the capture of Karnou’s lieutenants Bissi and Yandjere."
