  - title: The war spreads
    date: 1929–1931
    when: "1929-06"
    borders: "1931-01-01"
    countries: [cf, cm, td, cg]
    body:
      - Karnou’s death did not end the war. It spread unevenly from the Sangha basin into the Mbéré and Vina valleys of French Cameroon, around Baïbokoum and Moïssala in southern Chad, around Yaloké, Boda and Bambio in the Lobaye and Mambéré-Kadéï regions of Ubangi-Shari, and to Berandjoko in the French Congo. Much of this fighting was a local response to the French repression, linked to Karnou’s movement in name more than in fact, and not every Gbaya group joined it. Gbaya chiefs who owed their recognition to the colonial state, at Alim, Gbangen and Lokoti in Cameroon and at Abba and Gaza in Ubangi-Shari, and the Mbum chief of Mboula, sided with the French, as did the Fulbe.
      - French troops burned villages, imprisoned the movement’s followers and moved whole populations into designated villages, such as Ngoundi in the Sangha, where they could be supervised. Attempts to conscript local men against the insurgents largely failed; many groups, such as the Ngando, left their villages for camps deep in the forest until the fighting ended. The last phase, in 1931, was known as the “war of the caves”. Leaders were imprisoned or executed, and Karnou’s lieutenants Bissi and Yandjere were captured only in 1935.
      - It was the largest armed rising of the interwar years in French Equatorial Africa and French Cameroon. France divided the Kadéï-Sangha department in 1933 to tighten its control, and did not renew the leases of the concession companies, though European plantations were still encouraged, and, stung by bad press, the administration eased the worst abuses. Barthélemy Boganda, the first leader of the autonomous Central African Republic, compared himself to Karnou in the 1940s and 1950s, and the rising remains part of Central African national memory.
    facts:
      - [Rising spreads to Cameroon, Chad and the Congo, "1929–1930"]
      - [“War of the caves”, "1931"]
      - [Insurgents killed, "Estimated at more than 10,000"]
