steps:
  - title: Karnou and the rising of 1928
    date: 1924–1928
    when: "1928-06"
    borders: "1928-12-11"
    countries: [cf, cm]
    body:
      - The upper Sangha, home of the Gbaya, had been divided between French Equatorial Africa and German Kamerun, and after the First World War most of it lay in Ubangi-Shari, French Cameroon and the Middle Congo. Much of it had been handed to concession companies, whose agents forced villagers to collect wild rubber; the colonial state levied a head tax and demanded porters; and from 1921 it recruited men from Ubangi-Shari and Chad to build the Congo–Ocean railway from Brazzaville to the coast, where an estimated 17,000 to more than 20,000 died of disease, hunger and ill-treatment. In parts of Cameroon the French governed Gbaya districts through the Fulbe (Fulani) lamidates, whose raids had enslaved many Gbaya in the 19th century.
      - Karnou, born Barka Ngaïnoumbey, was a healer of Nahing, a village between Bouar and Baboua. From about 1924 he preached a non-violent refusal of colonial rule, telling his followers not to work for Europeans or pay taxes, to boycott European goods and to stand together, and promising that the departure of the Europeans and the Fulbe would come. He gave those who came to him the kongo wara, a small hooked stick like the handle of a hoe, which was to make them safe from bullets. Delegations of chiefs travelled to Nahing to receive it. The administration, thinly spread, took little notice until 1927, when his followers began to arm.
      - In mid-1928 his followers fought Fulbe herders between Baboua and Bouar, attacked a Hausa merchant caravan near Gankombon and a French agricultural agent with a police escort at Nahing, and then turned on traders, government posts and the chiefs and soldiers who served the French; they occupied and burned Bouar. In October 1928 Lieutenant Boutin’s company of the Régiment de tirailleurs sénégalais du Tchad began operations, backed by General Thiry and the governor of Ubangi-Shari, Auguste Lamblin. On 11 December 1928 the troops reached Nahing and killed Karnou in an unequal fight in which his followers, with spears and trade muskets, faced three machine guns and 120 modern rifles.
