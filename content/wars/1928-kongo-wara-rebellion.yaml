id: kongo-wara-rebellion
name: Kongo-Wara rebellion
start: "1928-06"
end: "1931"
tier: B
summary: "The largest rising in French Equatorial Africa and French Cameroon between the world wars, also called the War of the Hoe Handle or the Gbaya (Baya) war. In the western part of today’s Central African Republic and the neighbouring parts of Cameroon, Chad and the Republic of the Congo, the Gbaya and their neighbours suffered under concession companies that forced them to collect rubber, under head tax and porterage, and from 1921 under the recruitment of forced labourers for the Congo–Ocean railway, whose construction killed an estimated 17,000 to more than 20,000 workers. From about 1924 the Gbaya healer and prophet Karnou (Barka Ngaïnoumbey) of Nahing, between Bouar and Baboua, preached refusal of work for Europeans and of taxes, a boycott of European goods and solidarity among Black people, and gave his followers a small hooked stick shaped like a hoe handle (kongo wara) as a medicine against bullets. Fighting broke out in mid-1928; Karnou’s followers burned Bouar, and the French sent troops. Karnou was killed at Nahing on 11 December 1928, but the rising spread to the Lobaye, southern Chad, eastern Cameroon and the northern French Congo and lasted until 1931, ending with the “war of the caves”. The insurgents’ dead have been estimated at more than 10,000; French losses are not known. France imprisoned and executed the movement’s leaders, forced villagers into designated settlements where they could be watched, and afterwards did not renew the leases of the concession companies in the region. The war was little noticed in France, where communists used it to attack colonial rule; Barthélemy Boganda later presented himself as Karnou’s heir."
countries: [cf, cm, td, cg]
