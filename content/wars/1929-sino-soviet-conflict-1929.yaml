        lonlat: [132.510, 47.650]
      - kind: taken
        side: su
        name: Fujin
        date: 30 October – 2 November 1929
        text: The last Chinese river ships were sunk here, and Soviet troops held the town for three days.
        lonlat: [132.030, 47.250]
