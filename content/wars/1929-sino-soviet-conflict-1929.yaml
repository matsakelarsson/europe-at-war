  - title: Lahasusu and Fujin
    date: 12 October – 3 November 1929
    when: "1929-10-12"
    borders: "1929-10-12"
    countries: [cn, ru]
    body:
      - The Soviet blows came where the railway was not. On 12 October the Amur Flotilla, with infantry and aircraft, attacked the Chinese Sungari river flotilla at Lahasusu (today’s Tongjiang), where the Sungari flows into the Amur. Most of the Chinese gunboats were sunk or burnt, and Soviet troops landed, took the town and destroyed the stores and fortifications before withdrawing.
      - On 30 October the flotilla sailed up the Sungari to Fujin, where the remaining Chinese ships had gathered. It sank them, and Soviet troops held the town until 2 November; Soviet accounts give the Chinese losses as some hundreds killed, against a handful of Soviet dead. With its river forces gone, the Northeast Army could not stop Soviet troops moving up the Sungari towards Harbin.
    facts:
      - [Battle of Lahasusu, "12 October 1929"]
      - [Fujin taken, "30 October – 3 November 1929"]
