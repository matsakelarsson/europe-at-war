id: sino-soviet-conflict-1929
name: Sino-Soviet conflict of 1929
start: "1929-07-10"
end: "1929-12-22"
tier: B
summary: "An undeclared war in northern Manchuria over the Chinese Eastern Railway, the Russian-built line across Manchuria that the Soviet Union and China had run jointly since 1924. In May–July 1929 the Manchurian ruler Zhang Xueliang, who had just joined Chiang Kai-shek’s Nationalist government, raided the Soviet consulate in Harbin, seized the railway and expelled its Soviet managers. The Soviet Union broke off relations and formed a Special Far Eastern Army under Vasily Blyukher, which in October and November destroyed the Chinese river flotilla on the Sungari, took Lahasusu and Fujin, and routed Zhang’s troops at Zhalainuoer and Manzhouli, taking some 8,000 prisoners. By the Khabarovsk Protocol of 22 December China accepted joint management again. The war showed the weakness of the Chinese army in Manchuria, which Japan attacked two years later."
countries: [cn, ru]
sides:
  - id: su
    name: Soviet Union
    polities: [ussr]
    ink: red
    moves: Soviet moves
    success: Soviet success
  - id: cn
    name: Republic of China (Northeast Army of Zhang Xueliang)
    polities: [roc]
    ink: blue
    moves: Chinese moves
    success: Chinese success
notes:
  - Also called the Chinese Eastern Railway incident (in Chinese the Zhongdong Railway incident). The Chinese forces were Zhang Xueliang’s Northeast Army, which had come under the Nationalist government at Nanjing in December 1928; Russian White émigré detachments fought on the Chinese side in places.
  - Figures differ widely. Soviet official figures give 281 killed and 729 wounded, but other Soviet and later counts are higher (812 killed in one); Chinese figures give about 2,000 killed, 1,000–2,000 wounded and 6,900–8,550 captured. The Khabarovsk Protocol is usually dated 22 December 1929; some sources give 13 or 20 December.
