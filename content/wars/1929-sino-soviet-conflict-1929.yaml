steps:
  - title: The railway seized
    date: May – September 1929
    when: "1929-05-27"
    borders: "1929-07-10"
    countries: [cn, ru]
    body:
      - The Chinese Eastern Railway was built by the Russian Empire in 1897–1903 as a short cut for the Trans-Siberian line across Manchuria, from Manzhouli in the west to Suifenhe in the east, with a branch south from Harbin. In 1924 the Soviet Union agreed with the government in Beijing and with the Manchurian warlord Zhang Zuolin to run it jointly, but in practice its Soviet general manager controlled it. After Zhang Zuolin was killed by Japanese officers in 1928, his son Zhang Xueliang brought Manchuria under the Nationalist government, which wanted to recover China’s rights from foreign powers and saw the Soviet railway staff as a channel for communist agitation.
      - On 27 May 1929 Chinese police raided the Soviet consulate general in Harbin, arrested dozens of people and seized documents. On 10 July Chinese authorities took over the railway’s telegraph and closed Soviet trade and union offices along the line, and on 11 July the Chinese president of the railway dismissed the Soviet general manager and department heads; hundreds of Soviet employees were arrested or deported. Moscow broke off relations on 17 July. On 6 August it formed the Special Far Eastern Army under Vasily Blyukher, with headquarters at Khabarovsk. Through August and September there were raids and artillery duels along the border, while the Chinese gathered troops and Russian White émigré units near the railway.
    facts:
      - [Raid on the Soviet consulate in Harbin, "27 May 1929"]
      - [Railway seized, "10–11 July 1929"]
      - [Relations broken off, "17 July 1929"]
      - [Special Far Eastern Army formed, "6 August 1929"]
