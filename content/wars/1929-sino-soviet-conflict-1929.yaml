  - title: Zhalainuoer, Manzhouli and the Khabarovsk Protocol
    date: 17 November – 22 December 1929
    when: "1929-11-17"
    borders: "1929-11-20"
    countries: [cn, ru]
    body:
      - On the night of 17 November the Special Far Eastern Army, with tanks, aircraft and cavalry, crossed the border in the west. It cut the railway east of Zhalainuoer, took the town on 18 November after fierce fighting in which the Chinese brigade commander Han Guangdi was killed, and surrounded Manzhouli, which surrendered on 20 November. The western front commander, Liang Zhongjia, was captured with some 250 officers. At the same time a smaller Soviet force took Mishan in the east. Soviet aircraft bombed Hailar, and Soviet troops entered the town later in November. In these battles the Chinese lost about 1,500 killed and more than 8,000 prisoners.
      - Zhang Xueliang asked for terms. On 3 December his envoy signed a preliminary agreement at Nikolsk-Ussuriysky, and on 22 December the Khabarovsk Protocol restored the joint management of the railway and its Soviet general manager, released the prisoners on both sides and reopened consulates. Nanjing later said the envoy had no authority to sign, but the terms stood. The last Soviet units withdrew on 25 December, except from Bolshoy Ussuriysky (Heixiazi) and Tarabarov islands at the mouth of the Ussuri, which the Soviet Union and Russia kept until 2008, when Tarabarov and half of Bolshoy Ussuriysky were handed to China. The United States invoked the Kellogg–Briand Pact against the use of force, to Moscow’s anger. The war had exposed the weakness of the Northeast Army; in 1931 Japan’s Kwantung Army seized Manchuria, and in 1935 the Soviet Union sold the railway to Manchukuo.
    facts:
      - [Zhalainuoer taken, "18 November 1929"]
      - [Manzhouli surrenders, "20 November 1929"]
      - [Khabarovsk Protocol, "22 December 1929"]
      - [Chinese losses, "about 2,000 killed, 1,000–2,000 wounded, 6,900–8,550 captured"]
      - [Soviet losses, "281 killed and 729 wounded by official count; other counts higher"]
