id: ararat-rebellion
name: Ararat rebellion
start: "1930-06-11"
end: "1931"
tier: C
summary: A Kurdish rising around Mount Ararat in eastern Turkey, organised by the Kurdish nationalist league Xoybûn, which had proclaimed a Republic of Ararat there in 1927, and led by Ihsan Nuri Pasha; Turkish offensives and heavy air bombardment crushed it in the summer of 1930, with many civilians killed in the Zilan valley in July. The last rebels were defeated or fled into Persia by 1931, and in 1932 Persia ceded the slopes of Lesser Ararat to Turkey in exchange for land elsewhere on the border, to close the rebels’ refuge.
