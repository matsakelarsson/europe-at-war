steps:
  - title: Three armies against Nanjing
    date: May – August 1930
    when: "1930-05-11"
    borders: "1930-06-25"
    countries: [cn]
    body:
      - The Northern Expedition of 1926–1928 had unified China under the Nationalist government in name, but four great armies remained. Chiang Kai-shek’s Central Army held the lower Yangtze; Feng Yuxiang’s Northwest Army held Henan, Shaanxi and Gansu; Yan Xishan’s Shanxi Army held Shanxi, Hebei, Beiping (as Beijing was now called) and Tianjin; and the Guangxi clique of Li Zongren and Bai Chongxi had held Guangxi and the middle Yangtze. When Chiang proposed to disband most of the regional troops, the Guangxi clique rose and was beaten in the spring of 1929, and Feng’s generals rose and were beaten in the autumn. In February 1930 Yan demanded that Chiang step down, and in April Yan, Feng and Li, with Wang Jingwei’s Reorganisation faction of the Kuomintang, formed a coalition with Yan as commander-in-chief.
      - The decisive front was the Longhai railway, which runs west from Xuzhou through Guide (Shangqiu) and Kaifeng to Zhengzhou. Chiang’s offensive began on 11 May and reached the outskirts of Kaifeng, but Feng’s veterans fought hard on the flat, open plain; in late May his cavalry raided the railway near Guide and nearly captured Chiang. On the Tianjin–Pukou railway in Shandong the Shanxi Army advanced south and took Jinan on 25 June. Far to the south, the Guangxi army marched north into Hunan and took Changsha and Yuezhou in June, but Cantonese troops loyal to Nanjing cut its line behind it, and it was beaten near Hengyang and driven back into Guangxi.
    facts:
      - [Chiang’s general offensive, "11 May 1930"]
      - [Jinan taken by the Shanxi Army, "25 June 1930"]
      - [Coalition strength, "about 700,000 on paper"]
      - [Government strength, "about 300,000 Central Army troops, with southern allies"]
