id: central-plains-war
name: Central Plains War
start: "1930-05"
end: "1930-11-04"
tier: B
summary: "A civil war in 1930 between Chiang Kai-shek’s Nationalist government in Nanjing and a coalition of the generals who had fought beside him in the Northern Expedition: Yan Xishan of Shanxi, Feng Yuxiang of the Northwest Army and Li Zongren of the Guangxi clique, with Wang Jingwei’s faction of the Kuomintang. It grew out of Chiang’s plans to cut the regional armies and the wars of 1929 against the Guangxi clique and Feng. From May to October 1930 well over a million men fought along the railways of Henan, Shandong and Anhui, on the plains of the middle Yellow River, in the largest war of the warlord era. The coalition took Jinan and set up a rival national government in Beiping in September, but Chiang held the Longhai railway and retook Jinan, and the war was decided when Zhang Xueliang, ruler of the north-east, declared for Nanjing on 18 September and sent his army through the Shanhai Pass to occupy Beiping and Tianjin. Feng’s army fell apart and Yan withdrew to Shanxi; both resigned their posts on 4 November. The government admitted 30,000 dead and 60,000 wounded on its own side; losses on both sides and among civilians were much higher. Chiang emerged as China’s leading figure, but the war drained his government, and Zhang’s move south left Manchuria weakly defended a year before the Japanese invasion."
