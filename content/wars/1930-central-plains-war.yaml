notes:
  - The war’s dates are given differently. Some historians count the fighting against the Guangxi clique and Feng Yuxiang in 1929 as its first phase; the main war began with Chiang’s offensive of 11 May 1930.
  - Troop figures on paper were much larger than the forces that actually fought, and casualty figures are rough.
