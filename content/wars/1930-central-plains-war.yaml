  - title: Zhang Xueliang decides
    date: August – November 1930
    when: "1930-08-15"
    borders: "1930-11-04"
    countries: [cn]
    body:
      - In August Chiang’s troops, landed at Qingdao and advancing west along the railway, retook Jinan on 15 August, and the Shanxi Army fell back across the Yellow River. A last offensive by Feng on the Longhai railway failed. On 9 September the coalition’s Enlarged Conference set up a rival national government in Beiping, with Yan Xishan as its chairman and Wang Jingwei as its leading civilian.
      - Both sides had courted Zhang Xueliang, the young ruler of the north-east, whose army of several hundred thousand men had stayed out of the war. On 18 September he declared for Nanjing, and within days his Northeastern Army came through the Shanhai Pass and occupied Tianjin and Beiping without a fight. The Beiping government fled to Taiyuan. Yan’s troops withdrew into Shanxi, and Feng’s Northwest Army broke up as one commander after another went over to Chiang, who took Zhengzhou and Luoyang in October. On 4 November Yan and Feng gave up all their posts.
      - The war confirmed Chiang Kai-shek as China’s leading figure and gave Zhang Xueliang control of North China, but it cost the government dearly. The Shanxi and Guangxi cliques kept their provinces, and many of Feng’s troops, reorganised under Song Zheyuan and others, would later defend the north against Japan. With much of the Northeastern Army now south of the Great Wall, Manchuria was left lightly defended when Japan struck a year later.
    facts:
      - [Jinan retaken, "15 August 1930"]
      - [Beiping government proclaimed, "9 September 1930"]
      - [Zhang Xueliang declares for Nanjing, "18 September 1930"]
      - [Yan Xishan and Feng Yuxiang resign, "4 November 1930"]
