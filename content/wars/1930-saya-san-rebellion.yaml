steps:
  - title: Rice, taxes and the Galon king
    date: May – December 1930
    when: "1930-12-22"
    borders: "1930-12-22"
    countries: [mm]
    body:
      - Lower Burma had become one of the world’s great rice exporters under British rule, but much of its land was mortgaged to moneylenders, many of them Chettiars from South India, and tenancy was spreading. When the world depression struck in 1930 the price of paddy fell by about half, and the capitation tax on adult men in Lower Burma and the household tax (thathameda) in Upper Burma had to be paid all the same. Tension between Burmese and the large Indian population of the towns grew. In May 1930 Indian dockworkers in Rangoon struck for higher wages and were replaced by Burmese labourers; when the strikers returned, fighting broke out at the docks on 26 May. Colonial figures put the dead at about 120, most of them Indians; later estimates run to more than 200.
      - Saya San, born in the Shwebo district in 1876, had been a monk and practised traditional medicine, and in the 1920s he toured the countryside for the General Council of Burmese Associations, collecting complaints about taxes and the forest laws. In October 1930 he was crowned as Thupannaka Galuna Raja, the Galon king, named after the mythical bird that defeats the Naga, the serpent his followers took as the symbol of the British. He set up a jungle palace on Alaungtaung hill in the Pegu Yoma, above the Tharrawaddy district, and on the night of 22 December 1930 his followers, armed mostly with swords, spears and a few guns and protected by tattoos and charms, began killing village headmen and forest officers and attacking police posts.
    facts:
      - [Rangoon dock riots, "26 May 1930"]
      - [Saya San crowned, "October 1930"]
      - [Outbreak in Tharrawaddy, "22 December 1930"]
