notes:
  - Burma was governed as a province of British India until 1 April 1937. The government’s forces were Indian Army troops, British battalions and the Burma military police.
  - The colonial government’s report of 1934 blamed the rising largely on superstition, pointing to the tattoos and charms that were meant to make Saya San’s followers invulnerable. Later historians, from D. G. E. Hall on, put more weight on the economic crisis and on nationalist politics.
  - Accounts differ on details of Saya San’s life, such as the date and place of his coronation and of his arrest. The government counted rebels killed, captured and executed; estimates of all who died in the rising and its suppression range from about 1,000 to more than 10,000.
