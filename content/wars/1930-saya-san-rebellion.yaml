        lonlat: [95.790, 17.650]
  - title: The spread and the suppression
    date: January 1931 – 1932
    when: "1931-01"
    borders: "1931-06-01"
    countries: [mm]
    body:
      - In the first months of 1931 the rising spread through the districts of Insein, Pegu, Toungoo, Prome and Thayetmyo and across the Irrawaddy to Henzada and the delta district of Pyapon, and later to the northern Shan states. The bands were usually small and poorly armed, and in many clashes they charged troops and police armed with rifles and machine guns, trusting in their charms. The government brought in Indian Army reinforcements, appointed a special rebellion commissioner in June and promulgated an Emergency Powers Ordinance on 1 August 1931; villages that had supported the rebels were fined and searched.
      - Saya San fled to the Shan states, where he was arrested by officials of Hsipaw State on 2 August 1931. A special tribunal at Tharrawaddy sentenced him to death; his defence was led by the lawyer Ba Maw, who later became Burma’s first premier. His appeal failed, and he was hanged in Tharrawaddy jail on 28 November 1931. Smaller risings went on into 1932. By the government’s count more than 1,000 rebels had been killed and about 9,000 had surrendered or been captured; Britannica puts the number of peasants who died at more than 10,000. In all 126 men, Saya San among them, were hanged, and almost 1,400 were sentenced to prison or transportation. The rising added weight to the nationalist case in the debate on separating Burma from India, which took effect in 1937, and Saya San later appeared on Burmese banknotes.
    facts:
      - [Emergency Powers Ordinance, "1 August 1931"]
      - [Saya San arrested, "2 August 1931"]
      - [Saya San hanged, "28 November 1931"]
      - [Rebel losses by the government’s count, "over 1,000 killed, about 9,000 captured or surrendered, 126 hanged"]
