id: saya-san-rebellion
name: Saya San rebellion
start: "1930-12-22"
end: "1932"
tier: B
summary: "A peasant rising against British rule in Burma, then a province of British India, led by Saya San, a former monk and healer who had been crowned as a Buddhist king. The Great Depression halved the price of rice, Burma’s main export, while the capitation and household taxes stayed the same, and many cultivators were losing their land to moneylenders. Saya San, who had investigated rural grievances for the nationalist General Council of Burmese Associations, took the title of Galon (Garuda) king in October 1930, and on 22 December 1930 his followers rose in the Tharrawaddy district north of Rangoon, attacking headmen, forest officers and police posts. The rising spread in 1931 to Insein, Pegu, Toungoo, Prome, Thayetmyo, Henzada and Pyapon and into the Shan states. The colonial government brought in troops from India and gave itself emergency powers. Saya San was arrested in the Shan states in August 1931, tried by a special tribunal and hanged at Tharrawaddy on 28 November 1931. By the government’s count, more than 1,000 rebels had been killed by the end of 1932, about 9,000 had surrendered or been captured, and Saya San and 125 others had been hanged; other estimates of the dead run to more than 10,000. The rising is remembered in Myanmar as an early stand of the independence movement."
countries: [mm]
