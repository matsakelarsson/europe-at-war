id: wushe-incident
name: Wushe incident
start: "1930-10-27"
end: "1930-12-08"
tier: C
summary: "An uprising of Seediq people against Japanese rule at Wushe (Musha), a police and administrative centre in the mountains of central Taiwan, today in Ren’ai Township, Nantou County. Forced labour, police abuses and contempt for Seediq customs had built up resentment, and after a quarrel at a wedding feast in which a Japanese policeman was struck, the Tgdaya chief Mona Rudao led more than 300 warriors in attacks on police posts on 27 October 1930 and then on the elementary school where Japanese residents had gathered for a sports meet. About 134 Japanese were killed, and two Han Taiwanese by mistake. The colonial government sent about 2,000 troops and police with artillery and aircraft, which dropped bombs and, by many accounts, poison gas, which some describe as the first use of chemical weapons in Asia; it also set rival Seediq groups, notably the Toda, against the rebels. Mona Rudao shot himself in a cave in late November, and his son Tado Mona and the last fighters killed themselves on 8 December. Of the rising villages’ people, about 644 died, many of them by suicide. On 25 April 1931 Toda men, encouraged by the Japanese, attacked the shelters of the survivors and killed about 200 more (the second Wushe incident), and in May the 298 who remained were moved to Kawanakajima, today Qingliu. The governor-general resigned in January 1931. The incident is remembered in Taiwan as an act of resistance and was the subject of the film Seediq Bale (2011)."
