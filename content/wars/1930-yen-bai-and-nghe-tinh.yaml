notes:
  - The French called the rising at Yên Bái a mutiny; Vietnamese histories call it the Yên Bái uprising. The number of French killed there is given as five, two officers and three NCOs, in most accounts.
  - The word “soviet” was used by the French and later by the party; the village bodies called themselves peasant sections or associations. Historians disagree on how far the party directed the Nghệ-Tĩnh movement and how far it followed it.
