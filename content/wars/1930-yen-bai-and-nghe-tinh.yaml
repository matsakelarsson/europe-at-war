id: yen-bai-and-nghe-tinh
name: Yên Bái uprising and the Nghệ-Tĩnh soviets
start: "1930-02-10"
end: "1931"
tier: C
summary: "Two risings against French rule in Vietnam in 1930–1931, one nationalist and one communist, both crushed. The Vietnamese Nationalist Party (Việt Nam Quốc Dân Đảng, VNQDĐ), founded in Hanoi in 1927 on the model of the Chinese Kuomintang and led by Nguyễn Thái Học, lost about 1,000 members to arrests after the killing of the labour recruiter Bazin in February 1929. It planned a general rising among the Vietnamese troops of Tonkin. On the night of 9–10 February 1930 about 50 Vietnamese riflemen of the Yên Bái garrison and about 60 party members attacked their French officers and killed five of them, but most of the 550 Vietnamese soldiers there did not join, and the rising was put down within the day; attacks at Hưng Hóa and Lâm Thao and bombs in Hanoi also failed. On 16 February French aircraft bombed the village of Cổ Am, killing about 200 people, most of them civilians. Courts tried 547 people and passed 80 death sentences, and on 17 June 1930 Nguyễn Thái Học and twelve others were guillotined at Yên Bái. From May 1930 strikes and peasant marches spread through the provinces of Nghệ An and Hà Tĩnh, led by local cadres of the Communist Party founded in February 1930 under Nguyễn Ái Quốc (later Ho Chi Minh) and renamed the Indochinese Communist Party in October. On 12 September aircraft bombed a march at Hưng Nguyên, killing an estimated 140 to 200 people. In many villages peasant associations, later called the Nghệ-Tĩnh soviets, drove out officials, cancelled taxes and shared out communal land and rice, until French troops, the Foreign Legion and new military posts broke them by late 1931. The historian Martin Bernal estimates that over 1,300 Vietnamese were killed and about 1,000 more died in prisons and camps; the party lost most of its cadres, but it soon replaced the VNQDĐ as the main force of Vietnamese resistance."
