  - title: Ma Zhanshan and the Nenjiang bridge
    date: October – November 1931
    when: "1931-10-13"
    borders: "1931-11-19"
    countries: [cn, jp]
    body:
      - In Heilongjiang the acting governor Ma Zhanshan refused to submit. When Zhang Haipeng’s troops advanced north on Qiqihar in mid-October, Ma’s men drove them back and blew up the railway bridge over the Nen River at Jiangqiao. In early November the Kwantung Army sent a party to repair the bridge, escorted by troops; fighting broke out on 4 November and went on for days in freezing weather.
      - Ma rejected a Japanese ultimatum to give up Qiqihar, and on 17 November about 3,500 men of the Japanese 2nd Division under Tamon Jirō, with aircraft and artillery, attacked his positions at Angangxi south of the city. Ma’s troops gave way after two days of fighting, and on 19 November the Japanese entered Qiqihar. Ma withdrew north to Hailun. His stand, the first open resistance to the invasion, made him famous across China, and donations poured in from Chinese at home and abroad.
    facts:
      - [Nenjiang bridge destroyed, "mid-October 1931"]
      - [Fighting at the bridge, "4–6 November 1931"]
      - [Qiqihar taken, "19 November 1931"]
