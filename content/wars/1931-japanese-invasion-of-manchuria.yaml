  - title: Jilin, Jinzhou and the League
    date: September – October 1931
    when: "1931-09-21"
    borders: "1931-10-24"
    countries: [cn, jp]
    body:
      - On 21 September the 39th Mixed Brigade of the Korea Army crossed the Yalu River into Manchuria on the order of its commander, Hayashi Senjūrō, without the emperor’s sanction. The same day the Kwantung Army took Jilin, whose acting governor Xi Qia went over to the Japanese and declared the province independent of China; in the west Zhang Haipeng did the same at Taonan. The government in Tokyo of Wakatsuki Reijirō and the foreign minister Shidehara Kijūrō tried to limit the fighting but accepted each step after the event.
      - Zhang Xueliang set up a provincial government for Liaoning at Jinzhou, on the railway between Shenyang and the Great Wall. On 8 October Kwantung Army aircraft, with Ishiwara Kanji on board, bombed Jinzhou. China had appealed to the League of Nations on 21 September, and on 24 October the League Council called on Japan to withdraw its troops by 16 November; Japan voted against, and the army did not move back.
    facts:
      - [Korea Army crosses the Yalu, "21 September 1931"]
      - [Jilin occupied, "21 September 1931"]
      - [Bombing of Jinzhou, "8 October 1931"]
      - [League Council resolution, "24 October 1931"]
