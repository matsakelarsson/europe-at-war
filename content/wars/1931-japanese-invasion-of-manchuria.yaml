  - title: Jinzhou and Harbin
    date: December 1931 – February 1932
    when: "1932-01-03"
    borders: "1932-02-27"
    countries: [cn, jp]
    body:
      - In late November the Kwantung Army moved on Jinzhou but was recalled by the war minister after protests from the League and the United States. In December, with reinforcements from Japan and a new government in Tokyo under Inukai Tsuyoshi, it advanced again. Zhang Xueliang, without support from a Nanjing government in crisis, withdrew his troops behind the Great Wall, and the Japanese entered Jinzhou without a fight on 3 January 1932. On 7 January the United States announced, in the Stimson Doctrine, that it would not recognise changes brought about by force.
      - In the north the Jilin general Ding Chao and Li Du gathered troops at Harbin, the railway city of the Chinese Eastern Railway, which was jointly run with the Soviet Union. Xi Qia’s Japanese-backed Jilin troops advanced on the city in late January and were beaten by Ding at Shuangcheng on 26 January, but the Japanese 2nd Division and a brigade from Qiqihar then closed in, and after a day of fighting under artillery fire and air attack Harbin fell on 4–5 February 1932. At the end of January Japan had also attacked Shanghai, far to the south, in the January 28 Incident. Ma Zhanshan agreed to cooperate with the Japanese on 14 February, and on 27 February Ding Chao offered to end the fighting, the end of organised Chinese resistance.
    facts:
      - [Jinzhou occupied, "3 January 1932"]
      - [Stimson Doctrine, "7 January 1932"]
      - [Harbin taken, "4–5 February 1932"]
      - [End of organised resistance, "27 February 1932"]
