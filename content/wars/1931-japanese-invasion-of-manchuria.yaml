id: japanese-invasion-of-manchuria
name: Japanese invasion of Manchuria
start: "1931-09-18"
end: "1932-02-27"
tier: A
summary: "The conquest of China’s three north-eastern provinces by Japan’s Kwantung Army in 1931–1932. On the night of 18 September 1931 officers of the Kwantung Army, which guarded Japan’s leased territory and the South Manchuria Railway, set off a small explosion on the railway near Shenyang (Mukden) and blamed Chinese soldiers. Acting without the approval of the government in Tokyo, the army seized Shenyang and the towns along the railway within a day, and troops from Japanese-ruled Korea crossed the border to join it. Zhang Xueliang’s Northeastern Army, far larger but ordered by Zhang and Chiang Kai-shek to avoid open war while China appealed to the League of Nations, mostly withdrew. Ma Zhanshan resisted at the Nenjiang bridge in November, but Qiqihar fell on 19 November, Jinzhou on 3 January 1932 and Harbin in early February, and organised Chinese resistance ended in late February. On 1 March 1932 Japan set up the state of Manchukuo, with the last Qing emperor, Puyi, at its head. Volunteer armies fought on for years. The League’s Lytton Commission refused to recognise Manchukuo, and Japan left the League in 1933. Clodfelter estimates about 50,000 Chinese military and civilian dead and about 10,000 Japanese dead, including the conquest of Rehe in 1933."
countries: [cn, jp]
sides:
  - id: jp
    name: Japan (Kwantung Army and Korea Army) and its Chinese allies
    polities: [japan, manchukuo]
    ink: red
    moves: Japanese moves
    success: Japanese success
  - id: cn
    name: China (Northeastern Army, provincial troops and volunteer armies)
    polities: [roc, fengtian-clique]
    ink: blue
    moves: Chinese moves
    success: Chinese success
notes:
  - The incident of 18 September is known in China as the 9·18 Incident and in Japan as the Manchurian Incident. The Kwantung Army’s responsibility for the explosion was established after the war by the International Military Tribunal for the Far East and is accepted by historians in Japan and China.
  - Several Chinese generals, Xi Qia in Jilin, Zhang Haipeng at Taonan and Zang Shiyi in Liaoning among them, went over to the Japanese and later served Manchukuo.
