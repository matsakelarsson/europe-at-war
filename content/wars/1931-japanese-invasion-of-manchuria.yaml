steps:
  - title: The Mukden Incident
    date: 18–19 September 1931
    when: "1931-09-18"
    borders: "1931-09-18"
    countries: [cn, jp]
    body:
      - Since the Russo-Japanese War of 1904–1905 Japan had held the Kwantung Leased Territory at the tip of the Liaodong peninsula and the South Manchuria Railway from Dalian to Changchun, with a zone along it guarded by the Kwantung Army, about 10,000 men. The rest of Manchuria was ruled by Zhang Xueliang, who had joined the Nationalist government in 1928; his Northeastern Army had perhaps 160,000 men in the north-east, but Zhang himself and many of his best troops were south of the Great Wall after the Central Plains War. Tension over railways, Korean settlers and Japanese rights had risen through 1931, with the Wanpaoshan affair in July and the killing of a Japanese army officer, Nakamura Shintarō, by Chinese soldiers in June.
      - "Two staff officers of the Kwantung Army, Itagaki Seishirō and Ishiwara Kanji, planned to seize Manchuria. At about 10.20 pm on 18 September 1931 a small charge was exploded beside the railway at Liutiaohu, just north of Shenyang and close to the Chinese barracks at Beidaying; it did so little damage that a train passed soon after. Japanese troops attacked the barracks at once and shelled the walled city. The Chinese garrison had been told not to resist, and by the next morning Shenyang was in Japanese hands. The Kwantung Army commander, Honjō Shigeru, ordered operations along the whole railway: by the end of 19 September Japanese troops held Changchun, after fighting at the barracks of Nanling and Kuanchengzi, and Yingkou, Liaoyang, Fushun, Siping and Andong (Dandong)."
    facts:
      - [Explosion at Liutiaohu, "about 10.20 pm, 18 September 1931"]
      - [Shenyang occupied, "19 September 1931"]
      - [Kwantung Army, "about 10,000 men in September 1931"]
      - [Northeastern Army in Manchuria, "about 160,000 men"]
