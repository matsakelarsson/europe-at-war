  - title: Manchukuo and the resistance
    date: March 1932 – March 1933
    when: "1932-03-01"
    borders: "1932-03-01"
    countries: [cn, jp]
    body:
      - On 18 February 1932 a Northeast Administrative Committee of collaborating Chinese officials, among them Zhang Jinghui, Xi Qia and Ma Zhanshan, declared the north-east independent, and on 1 March the state of Manchukuo was proclaimed, with Changchun, renamed Xinjing (“new capital”), as its capital. Puyi, the last Qing emperor, who had been brought from Tianjin by the Japanese, became chief executive on 9 March; in 1934 he was made emperor. Real power lay with the Kwantung Army and Japanese officials.
      - "Resistance continued. In April Ma Zhanshan left the new government and took up arms again from Heihe, and volunteer armies of former soldiers, police, peasants and members of secret societies, at their strongest in the summer of 1932, attacked Japanese garrisons and the railways. In the far west Su Bingwen rose at Manzhouli in September and held out until December, when he crossed into the Soviet Union. The Kwantung Army answered with large sweeps against the volunteers and reprisals on villages: at Pingdingshan near Fushun, on 16 September 1932, Japanese troops killed most of the villagers after an attack on the mines, an estimated 3,000 people by Chinese counts. By 1933 most of the volunteer armies had been broken up, though Communist-led guerrillas fought on into the 1940s."
      - The League of Nations sent a commission under Lord Lytton, whose report of October 1932 found that Manchukuo was not a genuine independent state and that the Japanese operations of 18 September could not be regarded as self-defence. On 24 February 1933 the League Assembly adopted the report by 42 votes to one, Japan’s. The Japanese delegation walked out, and on 27 March 1933 Japan announced its withdrawal from the League. Japanese and Manchukuo troops had already begun the conquest of Rehe (see the Defence of the Great Wall).
    facts:
      - [Manchukuo proclaimed, "1 March 1932"]
      - [Puyi installed as chief executive, "9 March 1932"]
      - [Pingdingshan massacre, "16 September 1932"]
      - [Lytton Report adopted by the League, "24 February 1933"]
      - [Japan announces withdrawal from the League, "27 March 1933"]
