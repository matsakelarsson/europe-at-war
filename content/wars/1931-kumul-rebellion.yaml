id: kumul-rebellion
name: Kumul rebellion
start: "1931-02-20"
end: "1937-10-15"
tier: B
summary: "A series of wars in Xinjiang in 1931–1937 that began with a rising of the Uyghurs of Kumul (Hami) against the provincial governor Jin Shuren. The revolt drew in the Hui commander Ma Zhongying and his 36th Division from Gansu and spread to the oases of the south, where Uyghur and Kyrgyz leaders proclaimed the Turkic Islamic Republic of East Turkestan in Kashgar in November 1933. Jin was overthrown in April 1933 by his own officers, and his successor Sheng Shicai turned to the Soviet Union, whose troops invaded in January 1934 and drove Ma Zhongying from the north. Ma’s Hui troops destroyed the East Turkestan Republic in 1934, and he himself crossed into the Soviet Union. A second rising in the south in 1937 was crushed by Sheng with Soviet help. Fighting and massacres between Uyghurs, Kyrgyz, Hui and Han killed thousands, and Sheng Shicai was left ruling Xinjiang as a Soviet client within the Republic of China."
