notes:
  - Xinjiang remained part of the Republic of China throughout; the Nationalist government in Nanjing recognised each provincial ruler in turn and gave Ma Zhongying’s troops the number of a division of its army, but had no forces in the province. It played down the Soviet interventions.
  - Accounts of the fighting, many of them by foreign travellers, consuls and missionaries, differ on dates and numbers; casualty figures are estimates.
  - The East Turkestan Republic of 1933–1934 is also called the First East Turkestan Republic, to tell it apart from the republic founded in Ghulja in 1944 (see the Ili rebellion).
