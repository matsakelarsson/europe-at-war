  - title: The East Turkestan Republic and the Soviet invasion
    date: 1933–1934
    when: "1934-01"
    borders: "1934-02-06"
    countries: [cn, ru]
    body:
      - In the south the rebels set up governments of their own. On 12 November 1933 Sabit Damulla proclaimed the Turkic Islamic Republic of East Turkestan in Kashgar, with Khoja Niyaz, who stayed in Aksu, as its president. It sought independence and an Islamic state, raised an army of perhaps 22,000 men and asked the Soviet Union, Afghanistan, Turkey, Iran and British India for recognition, which none gave. Kashgar itself was divided, its New City held by the Hui troops of Ma Zhancang. The fighting brought massacres on all sides, of Han and Hui by Uyghur and Kyrgyz fighters, and of Uyghurs by Hui troops; Hindu traders and Swedish missionaries in the south were also attacked.
      - In the north Ma Zhongying besieged Ürümqi again from December 1933, joined by Zhang Peiyuan, the commander at Ghulja, who changed sides. Sheng Shicai turned to Moscow, and in January 1934 about 7,000 Soviet OGPU and Red Army troops with aircraft, armoured cars and artillery crossed the border. Zhang Peiyuan was defeated and killed himself. On the frozen Tutung River west of Ürümqi Ma’s troops fought the Soviets for weeks before withdrawing; at Dawancheng they destroyed most of a Soviet armoured column, but Soviet bombing, reportedly with mustard gas, forced them back to Turfan in February.
      - Ma Zhongying’s army retreated south-west along the Tarim basin. On 6 February 1934 its Hui troops under Ma Fuyuan stormed the Old City of Kashgar and killed about 1,700 to 2,000 Uyghur civilians; the East Turkestan government fled to Yengisar, which fell on 16 April, and Khoja Niyaz came to terms with the Soviets and Sheng Shicai. Ma Zhongying reached Kashgar in April and in July 1934 crossed into the Soviet Union, from which he never returned. His officer Ma Hushan took Khotan and ruled the southern oases as a Hui fief, while Sheng Shicai, backed by Soviet advisers and loans, ruled the rest of Xinjiang.
    facts:
