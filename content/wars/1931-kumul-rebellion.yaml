  - title: The rising of 1937
    date: April – October 1937
    when: "1937-04-02"
    borders: "1937-10-15"
    countries: [cn, ru]
    body:
      - Sheng Shicai ruled with Soviet advisers and Soviet loans. In April 1937 he moved against Mahmut Muhiti, the Uyghur commander of the 6th Division at Kashgar, who fled to British India on 2 April. Uyghur troops then rose at Yengisar, Yarkand and Artush, killing pro-Soviet officials and several Soviet advisers, and the officers Kichik Akhund and Abdul Niyaz set up their own administration. Ma Hushan’s 36th Division joined in for its own ends; it attacked Kashgar in May and occupied the city on 2 June.
      - In August about 5,000 Red Army troops with aircraft and an armoured regiment entered Xinjiang at Sheng’s request. With White Russian and provincial troops they defeated Kichik Akhund near Aksu in late August. Ma Hushan, whose officer Ma Shenggui had been bribed to turn against him, fled with his gold to India on 7 September; Yarkand fell on 9 September and Abdul Niyaz was executed on 15 September. On 15 October Soviet aircraft bombed Khotan, reportedly with some gas bombs. Casualties in the rising are put at about 2,000.
      - Sheng Shicai now controlled all of Xinjiang as a Soviet client. He purged many real and supposed opponents, until he broke with Moscow and turned to the Nationalist government in 1942.
    facts:
      - [Mahmut Muhiti flees, "2 April 1937"]
      - [Soviet troops enter, "August 1937, about 5,000 men"]
      - [Ma Hushan flees to India, "7 September 1937"]
