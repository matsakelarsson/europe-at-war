steps:
  - title: The Kumul rising and the fall of Jin Shuren
    date: 1931–1933
    when: "1931-02-20"
    borders: "1933-04-12"
    countries: [cn]
    body:
      - Jin Shuren had governed Xinjiang since the murder of Yang Zengxin in 1928, through Han relatives and officials, with heavy taxes, restrictions on travel and frequent executions. When Maqsud Shah, the last khan of Kumul (Hami), died in March 1930, Jin abolished the semi-autonomous Kumul Khanate, raised its taxes and gave its land to Han settlers. On 20 February 1931 the Uyghurs of Kumul rose and killed many of the settlers and Han soldiers; accounts of the spark differ, one being a Han officer’s attempt to force a Uyghur girl to marry him. Their leaders, Khoja Niyaz and the former chancellor of the khanate, Yulbars Khan, asked for help from Ma Zhongying, a young Hui commander in Gansu.
      - Ma Zhongying’s troops crossed the desert and besieged the provincial forces in the old town of Kumul but could not take it. In October 1931 Ma was wounded and withdrew to Gansu, and on 30 November the siege was lifted. Jin bought aircraft from the Soviet Union, signed a secret agreement with it, and enlisted White Russian émigrés. The revolt went on spreading. In February 1933 a committee at Khotan set up a government under Sabit Damulla and Muhammad Amin Bughra, rebels entered Aksu and killed its Han and Hui inhabitants, and in the spring Uyghur and Kyrgyz forces marched on Kashgar. Ma Zhongying returned, and his officer Ma Shiming led Hui and Uyghur forces to the walls of Ürümqi.
      - On 12 April 1933 White Russian troops and provincial officers in Ürümqi overthrew Jin Shuren, who fled the province. The army’s chief of staff, Sheng Shicai, a Manchurian officer, took power and made Khoja Niyaz his deputy for a time, while fighting Ma Zhongying’s forces.
