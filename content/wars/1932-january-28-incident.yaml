id: january-28-incident
name: January 28 Incident
start: "1932-01-28"
end: "1932-05-05"
tier: C
summary: "Five weeks of fighting between Japan and China in and around Shanghai in early 1932, also called the Shanghai Incident or the Shanghai War of 1932. Anger at the Japanese seizure of Manchuria had brought a boycott of Japanese goods in Shanghai. On 18 January five Japanese Nichiren monks were beaten by a crowd in the city and one of them died; a Japanese officer, Tanaka Ryūkichi, later said he had paid for the attack. Japanese residents retaliated, Japan sent warships and demanded that the boycott end, and on the night of 28 January Japanese naval landing troops moved into the Chinese district of Zhabei. The Cantonese 19th Route Army under Jiang Guangnai and Cai Tingkai fought back, joined in February by the Fifth Army under Zhang Zhizhong. Japanese aircraft and guns bombed Zhabei, where the Commercial Press and the Oriental Library burned, and Japan brought in army divisions under Shirakawa Yoshinori, about 30,000 men against about 50,000 Chinese. After a landing at Liuhe on 1 March outflanked them, the Chinese armies withdrew, and Japan halted the fighting on 3 March. Japan reported 738 dead and 2,257 wounded; the Chinese reported 14,801 soldiers killed, wounded or missing, and Western estimates put civilian deaths at about 10,000. The Shanghai Ceasefire Agreement of 5 May 1932, brokered with League of Nations and Western help, made a zone around Shanghai in which China could keep no troops, only police. On 29 April the Korean independence activist Yun Bong-gil threw a bomb at a celebration in Hongkou Park; Shirakawa died of his wounds."
