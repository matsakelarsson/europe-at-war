notes:
  - Casualty figures differ widely between sources. Soviet troops were not sent, but Soviet tanks, aircraft and advisers took part in the fighting. Smaller risings had broken out in 1930 in Uvs and elsewhere.
  - Lkhümbe, who led the suppression and became the party’s first secretary in July 1932, was himself accused of a Japanese-backed plot and shot in 1934.
