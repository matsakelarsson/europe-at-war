id: mongolian-armed-uprising-1932
name: Armed uprising of 1932 in Mongolia
start: "1932-04-10"
end: "1932-11"
tier: C
summary: "A rising of herders, lamas and local officials in western and central Mongolia against the “leftist” policies of the Mongolian People’s Revolutionary Party. From 1929 the party, guided by the Comintern, confiscated the herds and property of nobles and monasteries, executed some 700 heads of households, forced herders into collectives and pressed young lamas to leave the monasteries; many herders slaughtered their animals rather than give them up. On 10–11 April 1932 lamas and herders rose at the Khyalganat monastery in Rashaant district of Khövsgöl province, and the revolt spread to Arkhangai, Zavkhan, Övörkhangai and Dörvöd. The insurgents, more than 3,000 of them with old rifles and flintlocks, killed party members and officials and destroyed 35 district centres and 45 cooperatives; some hoped for help from the Ninth Panchen Lama or Japan, though archives show no such support. Government troops under Jambyn Lkhümbe, with machine guns, armoured cars and aircraft supplied by the Soviet Union and Soviet advisers in some battles, defeated them in about fifteen battles by July; a second wave in southern Khövsgöl and northern Arkhangai in August was put down by the autumn. More than 1,500 people were killed, by most estimates; one Soviet document gives 8,000–10,000. In June 1932, on Moscow’s instructions, the party abandoned the leftist course for a “New Turn” policy, suspending collectivisation and easing the pressure on the monasteries, and blamed the leaders it had expelled in May."
