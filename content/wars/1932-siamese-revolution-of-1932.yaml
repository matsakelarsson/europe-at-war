id: siamese-revolution-of-1932
name: Siamese revolution of 1932 and the Boworadet rebellion
start: "1932-06-24"
end: "1933-10-25"
tier: C
summary: "The end of absolute monarchy in Siam and the royalist attempt to undo it. The People’s Party (Khana Ratsadon) was founded in Paris in February 1927 by seven Siamese students and officers, among them the lawyer Pridi Banomyong and the army officer Plaek Phibunsongkhram, and later joined by senior officers led by Phraya Phahon Phonphayuhasena and Phraya Songsuradet. At dawn on 24 June 1932, while King Prajadhipok was at the seaside palace of Hua Hin, they took control of Bangkok, held Prince Paribatra and other royal officials hostage and announced the end of absolute rule at the Royal Plaza. The seizure of power was almost bloodless. The king returned to Bangkok on 26 June and signed a temporary charter on 27 June, and a permanent constitution, which restored some royal powers, on 10 December 1932. Quarrels over Pridi’s economic plan led the prime minister, Phraya Manopakorn Nititada, to close the assembly in April 1933, and Phraya Phahon removed him in a second coup on 20 June 1933. On 11 October 1933 Prince Boworadet, a former minister of defence, led garrisons from Nakhon Ratchasima and other provinces in a royalist rising; they took Don Mueang airfield north of Bangkok, but the navy stayed neutral and government troops under Phibun retook the airfield on 16 October and beat the rebels at Hin Lap on 23 October, where their commander Phraya Si Sitthisongkhram was killed. Boworadet fled to French Indochina on 25 October. Many rebels were jailed but none was executed. The failure strengthened the People’s Party and Phibun’s career, and King Prajadhipok, who had left for Europe, abdicated on 2 March 1935."
