id: cuban-revolution-of-1933
name: Cuban Revolution of 1933
start: "1933-08-12"
end: "1934-01-18"
tier: C
summary: "The overthrow of Gerardo Machado, the Sergeants’ Revolt and the brief revolutionary government of Ramón Grau San Martín. Machado, president since 1925, had extended his term in 1928 and ruled through the police and the army while the Great Depression ruined the sugar economy; students of the Directorio Estudiantil Universitario, the clandestine ABC society and the communists fought him with strikes, bombs and assassinations, and his police killed many opponents. In 1933 the new US ambassador Sumner Welles pressed Machado to step down, and a general strike in August led army officers to withdraw their support; Machado fled on 12 August and Welles’s candidate Carlos Manuel de Céspedes y Quesada became president, with the ABC in his cabinet. On 4 September sergeants and enlisted men at Camp Columbia in Havana, led by the stenographer-sergeant Fulgencio Batista, took over the army and, with the students, replaced Céspedes with a five-man Pentarchy; on 10 September Grau became president. His “Hundred Days” government, with Antonio Guiteras as minister of the interior, decreed the eight-hour day, a minimum wage for cane cutters, autonomy for the university and a law that half of all workers must be Cuban-born, cut electricity rates and repudiated the Platt Amendment. The United States refused to recognise it and sent some thirty warships to Cuban waters, though no troops landed. Batista’s soldiers crushed the deposed officers, about 400 of whom had gathered in the Hotel Nacional, in a battle on 2 October, after which some of the officers who surrendered were killed, and put down a rising of the ABC and army officers that ended at the Atarés fortress in Havana on 8–9 November. On 15 January 1934 Batista, now a colonel and chief of staff, forced Grau out, and after a few days Carlos Mendieta became president and was recognised by Washington within a week. In May 1934 a new treaty abrogated the Platt Amendment. Batista remained the real power in Cuba until 1944; Guiteras was killed in 1935 after a failed general strike."
