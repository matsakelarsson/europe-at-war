  - title: The passes of the Wall and the Tanggu Truce
    date: March – May 1933
    when: "1933-03-07"
    borders: "1933-05-31"
    countries: [cn, jp]
    body:
      - The Chinese now defended the Wall itself, along the mountain passes north-east of Beiping. At Xifengkou the 29th Army of Song Zheyuan, former troops of Feng Yuxiang armed largely with rifles and broadswords, made night raids on the Japanese positions on 11 and 12 March that Chinese newspapers celebrated as a great victory. At Gubeikou, on the road from Chengde to Beiping, the Central Army divisions of Guan Linzheng and others, sent north by Chiang Kai-shek, fought the Japanese 16th Brigade from 7 March; they lost the pass itself within a week but held the hills to the south of it until the end of April. The 32nd Army held Lengkou until 11 April, when the Japanese took it and the Chinese abandoned Jielingkou.
      - "In April Japanese troops crossed the Wall into eastern Hebei as far as the Luan River and then withdrew. In May they came again, through the passes from Lengkou to Gubeikou, and by the third week of the month were approaching Miyun and Tongzhou, close to Beiping, while aircraft flew over the city. Chiang, who held that the Communists in Jiangxi had to be defeated first, chose to negotiate. On 31 May 1933 at Tanggu, the port of Tianjin, the Chinese representative Xiong Bin and the Kwantung Army’s Okamura Yasuji signed a truce: Chinese troops were to stay south and west of a line from Yanqing through Changping, Shunyi, Tongzhou and Baodi to Lutai, and the land between that line and the Wall became a demilitarised zone policed by Chinese police, under Japanese aerial watch."
      - Chinese records list 518 officers and 15,248 men killed and about 22,600 wounded from January to May. The truce left the Wall as the de facto border of Manchukuo. Japanese pressure on North China continued, with the He–Umezu Agreement of 1935 and a Japanese-sponsored autonomous government in the demilitarised zone. In the summer of 1933 Feng Yuxiang and Ji Hongchang raised an anti-Japanese army in Chahar and retook Duolun, but they were dispersed under pressure from both Japan and the Nationalist government.
    facts:
