notes:
  - Rehe (Jehol) was a province of the Republic of China north of the Great Wall, between Manchuria and Beiping, with its capital at Chengde. It was divided among Hebei, Liaoning and Inner Mongolia after 1955.
  - Chinese accounts of the sword attacks of the 29th Army at Xifengkou, celebrated at the time, exaggerated their effect.
