steps:
  - title: Shanhaiguan and the fall of Rehe
    date: January – March 1933
    when: "1933-01-01"
    borders: "1933-02-23"
    countries: [cn, jp]
    body:
      - Manchukuo, the state Japan had set up in Manchuria in March 1932, claimed Rehe, the mountainous province between Manchuria and the Great Wall. Its governor, Tang Yulin, a former Fengtian general, was better known for his opium revenues than for his soldiering. On 1 January 1933 a staged incident at the Shanhai Pass, where the Wall meets the sea, gave the Japanese 8th Division a pretext to attack the Chinese garrison with armoured trains, aircraft and naval guns; the pass fell on 3 January after the defending regiment had lost about half its men.
      - On 23 February Japanese and Manchukuo troops invaded Rehe from the east and north. The next day the League of Nations adopted the Lytton Report, which refused to recognise Manchukuo, and the Japanese delegation walked out; Japan announced its withdrawal from the League on 27 March. The Chinese forces in Rehe, perhaps 100,000 or more, were divided and poorly supplied. Chaoyang and Kailu fell on 25 February, and Chifeng after several days of fighting against Sun Dianying’s troops in early March. Tang Yulin requisitioned trucks for his belongings and fled, and on 4 March a small Japanese vanguard of cavalry and tanks entered Chengde unopposed. Rehe was made part of Manchukuo. Zhang Xueliang, blamed for the loss, resigned his command on 12 March and went abroad.
    facts:
      - [Shanhai Pass taken, "3 January 1933"]
