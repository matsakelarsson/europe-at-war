id: defense-of-the-great-wall
name: Defence of the Great Wall
start: "1933-01-01"
end: "1933-05-31"
tier: B
summary: "The Japanese conquest of the province of Rehe (Jehol) and the fighting at the passes of the Great Wall in the first months of 1933, which ended with the Tanggu Truce. After the conquest of Manchuria the Kwantung Army claimed Rehe for Manchukuo. It took the Shanhai Pass on 1–3 January 1933, and on 23 February Japanese and Manchukuo troops invaded Rehe, whose governor Tang Yulin fled; Chengde fell on 4 March and Rehe was joined to Manchukuo. Chinese armies, the Northeastern Army of Zhang Xueliang, Song Zheyuan’s 29th Army and divisions of the Central Army, then held the passes of the Great Wall north-east of Beiping for two months, at Xifengkou, Gubeikou, Lengkou and Jielingkou, with heavy losses. In May the Japanese came through the Wall and advanced to within reach of Beiping and Tianjin, and on 31 May 1933 the two sides signed a truce at Tanggu that made the land between the Wall and Beiping a demilitarised zone. Chinese records give about 15,800 soldiers killed and 22,600 wounded from January to May. The truce left the Wall as the de facto border of Manchukuo and opened North China to Japanese pressure."
countries: [cn, jp]
