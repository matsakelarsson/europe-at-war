id: asturian-revolution
name: Asturian Revolution of 1934
start: "1934-10-04"
end: "1934-10-19"
tier: C
summary: A revolutionary general strike called by the Socialists and other left-wing groups across Spain in October 1934, when the Catholic conservative CEDA entered the government of the Second Republic. It failed in most of the country, and in Barcelona Lluís Companys’s proclamation of a Catalan State lasted only ten hours, but in Asturias the miners rose in arms, took the mining valleys and most of Oviedo, and set up revolutionary committees, which killed several dozen priests and others. The government sent the Spanish Legion and Moroccan troops under General Eduardo López Ochoa and Colonel Juan Yagüe, with General Francisco Franco advising the war minister in Madrid, and after two weeks of fighting and a harsh repression about 1,500–2,000 people were dead and 15,000–30,000 imprisoned.
