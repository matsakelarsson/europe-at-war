notes:
  - Also called the Revolution of 1934 or the Asturian miners’ strike. Much of the old centre of Oviedo, including the university, was burned or damaged, and the Cámara Santa of the cathedral was blown up. Many historians see the rising and its suppression as a prelude to the Civil War of 1936–1939.
