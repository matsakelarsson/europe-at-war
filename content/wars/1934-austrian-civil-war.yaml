id: austrian-civil-war
name: Austrian Civil War
start: "1934-02-12"
end: "1934-02-15"
tier: C
summary: Four days of fighting between the authoritarian government of Engelbert Dollfuss, backed by the army, the police and the right-wing Heimwehr militia, and the Republican Protection League (Schutzbund), the banned militia of the Social Democrats. It began in Linz on 12 February 1934, when Schutzbund members resisted a police search for weapons at the party’s headquarters, and spread to Vienna and the industrial towns of Upper Austria and Styria. In Vienna the army shelled the Karl-Marx-Hof and other municipal housing estates. Between about 350 and 370 people were killed, some 130 of them uninvolved civilians. Nine Schutzbund members were executed, the Social Democratic Party was banned, and the constitution of May 1934 made Austria a one-party corporative state.
