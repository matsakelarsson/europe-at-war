notes:
  - Also called the February Uprising or the February Fights (Februarkämpfe). Dollfuss had governed without parliament since March 1933 and had banned the Schutzbund and the Communist and Nazi parties.
  - The government gave official figures of 193 civilians and 104 soldiers and police killed; estimates by later writers have varied widely.
