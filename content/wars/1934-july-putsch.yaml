id: july-putsch
name: July Putsch
start: "1934-07-25"
end: "1934-07-30"
tier: C
summary: A failed coup by Austrian Nazis against the government of Engelbert Dollfuss. On 25 July 1934 about 150 members of the SS-Standarte 89, disguised as soldiers and police, seized the Federal Chancellery in Vienna and shot Dollfuss, who died of his wounds, while others took the radio station and falsely announced a change of government. The putsch collapsed in Vienna within hours, but fighting went on in Carinthia, Styria and other provinces until 30 July. Mussolini moved troops to the Brenner Pass, and Hitler, whose regime had encouraged the Austrian Nazis, disowned them. Between about 220 and 270 people were killed. Thirteen putschists were executed, and Kurt Schuschnigg succeeded Dollfuss as chancellor.
