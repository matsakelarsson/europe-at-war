steps:
  - title: Asir, Najran and the northern mountains
    date: 1932–1934
    when: "1934-03"
    borders: "1934-04-21"
    countries: [sa, ye]
    body:
      - When the Ottomans left Yemen in 1918, the Zaydi imam Yahya Muhammad Hamid al-Din claimed all the lands of historic Yemen, including Asir and Najran. Ibn Saud had made the Idrisid emirate of Asir, on the Red Sea coast north of Yemen, a protectorate in 1926 and annexed it in 1930. In November 1932 its former ruler, Hasan al-Idrisi, rose against the Saudis with Yemeni help; the revolt was crushed early in 1933 and he fled to Yemen, and Yahya’s troops occupied the oasis of Najran. Talks failed, and on 20 March 1934 Ibn Saud declared war and sent two armies into Yemen.
      - The eastern army under Crown Prince Saud took the border towns of the highlands and, on 21 April, Najran, and laid siege to Baqim on the way to Sa’dah. In the rugged mountains, though, the Zaydi tribesmen held the passes, and the advance made little headway; the imam’s kingdom was not threatened in its mountain heartland.
    facts:
      - [Idrisid revolt, "November 1932 – early 1933"]
      - [Saudi declaration of war, "20 March 1934"]
      - [Najran taken, "21 April 1934"]
