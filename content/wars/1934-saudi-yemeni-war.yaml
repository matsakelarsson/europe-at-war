  - title: Faisal on the Tihama and the Treaty of Taif
    date: April – May 1934
    when: "1934-04"
    borders: "1934-05-20"
    countries: [sa, ye]
    body:
      - The western army under Prince Faisal, Ibn Saud’s second son, advanced from Jizan down the hot coastal plain of the Tihama, where the Yemeni forces were thin. It took Midi and al-Luhayyah and, at the beginning of May, entered Hodeidah, Yemen’s main port, without serious resistance. A British sloop took off foreign residents, Italian warships arrived to protect Italian interests, and Britain and Italy, rivals in the Red Sea, both pressed for a quick peace.
      - Imam Yahya asked for terms, and Ibn Saud, wary of a long war in the mountains and of foreign intervention, offered a moderate settlement. By the Treaty of Taif, signed on 20 May 1934, Yemen recognised Saudi rule over Asir, Jizan and Najran and agreed to pay an indemnity, and Saudi Arabia withdrew from Hodeidah and the other places it had taken; the last Saudi troops left in early July. The treaty was concluded for twenty years. The border it drew in the west lasted, and the whole frontier was settled only by the Treaty of Jeddah in 2000.
    facts:
      - [Hodeidah taken, "late April or early May 1934"]
      - [Treaty of Taif, "20 May 1934"]
