id: saudi-yemeni-war
name: Saudi–Yemeni War
start: "1934-03-20"
end: "1934-05-20"
tier: B
summary: A short war between Saudi Arabia and the Mutawakkilite Kingdom of Yemen over Asir and Najran. After Imam Yahya sheltered the Idrisid ruler of Asir and occupied Najran, Saudi armies invaded Yemen in the spring of 1934. Crown Prince Saud’s advance in the northern mountains stalled, but Prince Faisal swept down the Tihama coast and took Hodeidah. By the Treaty of Taif, Yemen accepted Saudi rule over Asir, Jizan and Najran, and the Saudis withdrew from the Tihama.
countries: [sa, ye]
sides:
  - id: sa
    name: Saudi Arabia
    polities: [saudi-arabia]
    ink: green
    moves: Saudi moves
    success: Saudi success
  - id: ye
    name: Kingdom of Yemen
    polities: [yemen]
    ink: red
    moves: Yemeni moves
    success: Yemeni success
notes:
  - The size of the armies and the losses are poorly known. One estimate puts the dead at about 2,100 soldiers and civilians; figures for the armies range up to some 30,000 Saudi and 37,000 Yemeni fighters, most of them tribal levies.
  - Accounts differ on some dates. Hodeidah is said to have fallen on 28 April or on 4 or 5 May, and the treaty, signed on 20 May 1934 and ratified on 22 June, is dated 14 June in some sources.
