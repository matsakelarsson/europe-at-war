steps:
  - title: Walwal and the road to war
    date: December 1934 – September 1935
    when: "1934-12-05"
    borders: "1934-12-05"
    countries: [et, so, er, it]
    body:
      - "Ethiopia was the one African state that had kept its independence through the scramble for Africa, after Menelik II’s victory over Italy at Adwa in 1896. Haile Selassie, regent from 1916 and emperor from 1930, had brought it into the League of Nations in 1923 and was modernising its government, but its army was still mostly the levies of the provincial lords (rases), armed with old rifles, with a small Imperial Guard trained by Belgian officers and almost no aircraft. Mussolini wanted an empire, revenge for Adwa and land for Italian settlers, and from 1932 his ministers planned an invasion from the colonies of Eritrea and Italian Somaliland."
      - "The pretext came at Walwal, wells in the Ogaden used by Somali herders, where Italy had kept a fort since 1930 although the place lay well inside Ethiopia by the treaties. In November 1934 an Anglo-Ethiopian boundary commission and its Ethiopian escort met the Italian garrison there, and on 5 December fighting broke out: about 107 Ethiopians and some 30 Somali soldiers of the Italian side were killed. Italy demanded an apology and compensation; Ethiopia appealed to the League. In January 1935 the French foreign minister Pierre Laval privately gave Mussolini a free hand, and through 1935 Italy shipped hundreds of thousands of men through the Suez Canal. On 3 September an arbitration commission held neither side responsible for Walwal."
    facts:
      - [Walwal incident, "5 December 1934"]
      - [Franco-Italian agreements, "7 January 1935"]
      - [Walwal arbitration, "3 September 1935"]
    markers:
