notes:
  - "Many accounts end the war with the fall of Addis Ababa on 5 May 1936 and the annexation of 9 May. This story follows it to February 1937, when the last Ethiopian armies in the field were destroyed and the Yekatit 12 massacre took place; the resistance of 1936–1941 has its own story."
  - "Casualty figures vary widely. Official Italian figures of June 1936 gave 1,148 Italian soldiers killed, with some 1,600 Eritrean troops and 450 workmen; the historian Angelo Del Boca put Italian deaths to the end of 1936 at about 4,350 (soldiers and civilians) with some 4,500 colonial soldiers. For Ethiopia, the Italian estimate was 70,000 killed in battle; an Ethiopian government memorandum of 1946 gave 760,300 deaths for the whole occupation; other estimates for the war are about 250,000–270,000 deaths, civilians included."
  - "Ethiopian dates are given in the Gregorian calendar; Yekatit 12 in the Ethiopian calendar is 19 February 1937."
  - "Only a few states never recognised the annexation, among them the United States, the Soviet Union, China, Mexico and New Zealand; Britain and France recognised it in 1938. The map shows Italian East Africa in Ethiopia from 9 May 1936, as the map of its time."
