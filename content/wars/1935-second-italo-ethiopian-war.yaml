  - title: The last armies and Yekatit 12
    date: May 1936 – February 1937
    when: "1936-07-28"
    borders: "1936-08-01"
    countries: [et, it]
    body:
      - "Ethiopian forces fought on. At the end of July 1936 the sons of Ras Kassa, Abebe Aregai and other leaders attacked Addis Ababa and were driven back; Abune Petros, a bishop who had joined them, was executed by the Italians. In the west, Ras Imru held out around Gore with cadets of the Black Lions, until Italian columns pressed him south and he surrendered on 19 December 1936; Ras Kassa’s sons Aberra and Asfawossen were shot after surrendering, and Wondosson was killed. In the south Ras Desta Damtew’s last force was destroyed at Gogetti on 19 February 1937, and he was executed on 24 February."
      - "On the same 19 February, Yekatit 12 in the Ethiopian calendar, two young Eritreans, Abraham Deboch and Mogus Asgedom, threw grenades at Graziani, now viceroy, during an alms-giving at the Genete Leul palace in Addis Ababa. He was wounded and survived. The Fascist federal secretary Guido Cortese told the Italians to kill for three days, and Italian civilians, Blackshirts and soldiers burned houses and killed people across the city. Estimates of the dead range from a few hundred (Italian accounts) and 1,400–6,000 (contemporary foreign reports) to about 3,000 (Del Boca), 19,200 (Ian Campbell, 2017) and 30,000 (Ethiopian sources). Educated Ethiopians, many of them trained abroad, were hunted down and shot, and thousands were sent to camps at Danane in Somalia and Nocra in the Dahlak islands. The massacre at Debre Libanos followed in May (see Ethiopian resistance to Italian rule)."
    facts:
      - [Attack on Addis Ababa, "end of July 1936"]
      - [Ras Imru surrenders, "19 December 1936"]
      - [Gogetti, "19 February 1937"]
      - [Yekatit 12, "19–21 February 1937"]
