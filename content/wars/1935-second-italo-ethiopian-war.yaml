  - title: The Christmas offensive and the gas
    date: December 1935 – January 1936
    when: "1935-12-15"
    borders: "1936-01-20"
    countries: [et, so, it]
    body:
      - "In December the Ethiopian armies came north. Ras Imru crossed the Takazze and on 15 December routed an Italian force at the Dembeguina Pass, threatening Adwa and the road to Eritrea, while the armies of Ras Kassa and Ras Seyum pushed into the Tembien. In the First Battle of Tembien (20–24 January 1936) they nearly cut the Italian line before Badoglio held them. Badoglio answered with gas. Italian aircraft dropped mustard gas on the Ethiopian armies in Tigray from 22 December, first on Ras Imru’s men at the Takazze, and on 28 December Mussolini gave formal approval for its use; the Italian air force dropped more than 300 tonnes in the following months, on soldiers, villages, herds and water, and also bombed Red Cross units."
      - "In the south Ras Desta Damtew led an army down from Sidamo towards Italian Somaliland. Graziani met it on the Genale Doria river in mid-January 1936, bombed it with gas and high explosive, and destroyed it; his motorised columns took Negele Borana on 20 January. A Swedish Red Cross ambulance near Dolo had been bombed on 30 December, and Haile Selassie protested to the League about the bombing of hospitals and the gas."
    facts:
      - [Dembeguina Pass, "15 December 1935, Ethiopian success"]
      - [First Battle of Tembien, "20–24 January 1936"]
      - [Genale Doria, "12–16 January 1936, Italian success"]
