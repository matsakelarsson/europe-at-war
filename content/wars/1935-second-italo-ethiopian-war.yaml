  - title: Addis Ababa and the annexation
    date: May – July 1936
    when: "1936-05-05"
    borders: "1936-05-09"
    countries: [et, dj, it, fr]
    body:
      - "On 26 April Badoglio set out from Dessie for Addis Ababa with a column of motor lorries, the “March of the Iron Will”. Haile Selassie, persuaded by his council, left the capital by train for French Djibouti on 2 May and sailed into exile. Addis Ababa was looted and burned for three days, and hundreds of people were killed, until Badoglio entered the city on 5 May 1936. On 9 May Mussolini proclaimed the annexation of Ethiopia and King Victor Emmanuel III its emperor; on 1 June Ethiopia, Eritrea and Somalia were joined as Italian East Africa. Graziani’s columns reached Harar on 8 May, and the northern and southern armies met at Dire Dawa on 10 May."
      - "On 30 June 1936 Haile Selassie addressed the League of Nations in Geneva, asking what answer he should take back to his people and ending, “God and history will remember your judgment.” Days later the League voted to end the sanctions, which lapsed by 15 July. Most states recognised the conquest within a few years, Britain and France in 1938, but the United States, the Soviet Union, China, Mexico and New Zealand did not. Italy controlled the main roads and towns; much of the west and south had not yet seen an Italian soldier."
    facts:
      - [Haile Selassie leaves, "2 May 1936"]
      - [Badoglio enters Addis Ababa, "5 May 1936"]
      - [Annexation, "9 May 1936"]
      - [Speech to the League, "30 June 1936"]
