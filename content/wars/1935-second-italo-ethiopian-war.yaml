id: second-italo-ethiopian-war
name: Second Italo-Ethiopian War
start: "1935-10-03"
end: "1937-02"
tier: A
summary: "Fascist Italy’s conquest of Ethiopia, a member of the League of Nations. After a clash at the wells of Walwal in the Ogaden in December 1934, Italy invaded from Eritrea and Italian Somaliland on 3 October 1935 without a declaration of war. The League named Italy the aggressor but its sanctions left out oil and the Suez Canal. With far more aircraft, artillery and motor transport, and with mustard gas dropped from the air on soldiers and civilians in breach of the Geneva Protocol, the armies of Pietro Badoglio in the north and Rodolfo Graziani in the south destroyed the Ethiopian armies at Amba Aradam, Tembien, Shire and Maychew and in the Ogaden in the first months of 1936. Emperor Haile Selassie left for exile on 2 May, Badoglio entered Addis Ababa on 5 May, and on 9 May Mussolini proclaimed Ethiopia part of the Italian empire, joined with Eritrea and Somalia as Italian East Africa. Ethiopian armies and nobles fought on in the west and south until their last forces were destroyed in February 1937. On 19 February 1937, after an attempt on Graziani’s life, Italians killed thousands of people in Addis Ababa in three days of reprisals, remembered as Yekatit 12. Estimates of Ethiopian deaths in the war run from about 70,000 soldiers killed (an Italian estimate) to 275,000 killed in battle by the Ethiopian government’s count; Italian and colonial troops lost some 8,000–9,000 killed. Resistance continued until 1941 (see Ethiopian resistance to Italian rule and the East African campaign)."
countries: [et, er, so, it]
sides:
