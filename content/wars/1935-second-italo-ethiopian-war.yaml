  - title: The invasion
    date: October – December 1935
    when: "1935-10-03"
    borders: "1935-11-08"
    countries: [et, er, so, it]
    body:
      - "On 3 October 1935 General Emilio De Bono’s army crossed the Mareb river from Eritrea without a declaration of war, while aircraft bombed Adwa and Adigrat. Haile Selassie proclaimed general mobilisation. The Italians took Adwa, the battlefield of 1896, on 6 October; De Bono proclaimed the end of slavery in the occupied lands, and Aksum fell on 15 October. On 11 October Dejazmach Haile Selassie Gugsa, the emperor’s son-in-law and lord of eastern Tigray, went over to the Italians with his men, and Mekele fell on 8 November. In the south Graziani’s forces advanced from Italian Somaliland up the Shebelle and took the Ethiopian post of Gorrahei in November."
      - "On 7 October the League of Nations declared Italy the aggressor, and from 18 November its members applied economic sanctions; they did not include oil, and Britain did not close the Suez Canal. In December the British and French foreign ministers, Samuel Hoare and Pierre Laval, drew up a plan that would have given Italy much of Ethiopia; when it leaked to the press a few days later the outcry in Britain forced Hoare to resign. Mussolini, impatient with De Bono’s slow advance, replaced him with Marshal Pietro Badoglio in November."
    facts:
      - [Invasion, "3 October 1935"]
      - [Adwa taken, "6 October 1935"]
      - [League sanctions, "from 18 November 1935"]
      - [Mekele taken, "8 November 1935"]
