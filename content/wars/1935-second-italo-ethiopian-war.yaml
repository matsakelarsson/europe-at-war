  - title: Maychew and the retreat
    date: March – April 1936
    when: "1936-03-31"
    borders: "1936-04-15"
    countries: [et, it]
    body:
      - "Haile Selassie now led his last army, some 31,000 men with six battalions of the Imperial Guard, against the Italian positions at Maychew. On 31 March 1936 they attacked for thirteen hours and were thrown back by about 40,000 Italian and Eritrean troops; the emperor ordered the retreat on the night of 2 April. Italian aircraft and Raya and Azebo Oromo fighters, who had turned against the government, harried the columns; on 4 April aircraft bombed and gassed the thousands crowded on the shores of Lake Ashenge. Ethiopian casualties at Maychew are put at about 11,000, and the Imperial Guard lost more men in the retreat than in the battle."
      - "An Italian motorised column under the Fascist party secretary Achille Starace reached Gondar on 1 April, and Dessie fell on 15 April. In the south, Graziani attacked the defences that Ras Nasibu Zeamanuel and his Turkish adviser Wehib Pasha had built around Degehabur and Sasabaneh, the “Hindenburg Wall”. In the Battle of the Ogaden (14–25 April) the line was broken, at a cost of about 2,000 Italian and colonial casualties and some 5,000 Ethiopian, and the way to Jijiga and Harar was open."
    facts:
