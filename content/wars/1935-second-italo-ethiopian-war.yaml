id: second-italo-ethiopian-war
name: Second Italo-Ethiopian War
start: "1935-10-03"
end: "1936-05-05"
tier: C
summary: Fascist Italy’s invasion of Ethiopia, a member of the League of Nations, from its colonies of Eritrea and Italian Somaliland in October 1935. With overwhelming superiority in aircraft, armour and artillery, and the use of mustard gas against soldiers and civilians in breach of the Geneva Protocol, the Italian armies under Pietro Badoglio and Rodolfo Graziani defeated the Ethiopian forces, and Addis Ababa fell on 5 May 1936. Emperor Haile Selassie went into exile and appealed in vain to the League, whose sanctions against Italy had been limited and soon lifted; Ethiopia was joined to Eritrea and Somalia as Italian East Africa, and resistance continued until British and Ethiopian forces liberated the country in 1941.
