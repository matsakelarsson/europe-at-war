  - title: Amba Aradam, Tembien and Shire
    date: February – March 1936
    when: "1936-02-10"
    borders: "1936-03-01"
    countries: [et, it]
    body:
      - "With his supply roads built and some 70,000 men in the line, Badoglio struck the army of the war minister Ras Mulugeta Yeggazu on the mountain of Amba Aradam south of Mekele (10–19 February 1936). Encircled by two corps and pounded by artillery, aircraft and arsine shells, the Ethiopian army broke; Italian figures put its losses at some 6,000 killed and 12,000 wounded. Aircraft dropped about forty tonnes of mustard gas on the retreating columns, and Ras Mulugeta was killed by an aircraft as he turned back to find his son’s body."
      - "Badoglio then turned on Ras Kassa and Ras Seyum, whose armies were destroyed in the Second Battle of Tembien (27–29 February), and on Ras Imru in the west, who was driven back across the Takazze in the Battle of Shire (29 February – 2 March). In three weeks the northern Ethiopian armies had ceased to exist, and the road south lay open."
    facts:
      - [Amba Aradam, "10–19 February 1936, Italian success"]
      - [Second Tembien, "27–29 February 1936"]
      - [Shire, "29 February – 2 March 1936"]
