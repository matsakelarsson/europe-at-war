  - title: Mission 101, Gideon Force and the emperor’s return
    date: June 1940 – May 1941
    when: "1940-08-12"
    borders: "1941-05-05"
    countries: [et, sd, gb, it]
    body:
      - "Italy’s entry into the Second World War on 10 June 1940 made the Patriots Britain’s allies. Haile Selassie flew from exile in England to Khartoum, arriving on 2 July. On 12 August Mission 101, a small party of British, Sudanese and Ethiopian soldiers under Colonel Daniel Sandford, crossed into Gojjam to bring the Patriot leaders money, arms and the emperor’s letters, and in November Major Orde Wingate flew in to plan a campaign. With the Patriots the Italian garrisons of Gojjam were soon cut off in their forts."
      - "On 20 January 1941 Haile Selassie crossed the border with Gideon Force, some 800 Sudanese and 800 Ethiopian soldiers under Wingate. Harried by the Patriots, the Italians abandoned the forts of Burye in early March, and the emperor entered Debre Markos on 6 April, the day British troops from the south reached Addis Ababa. On 5 May 1941, five years to the day after Badoglio, Haile Selassie entered his capital, escorted by some 7,000 of Abebe Aregai’s Patriots. The Patriots fought on with the British against the Italian forces that held out until November (see East African campaign)."
    facts:
      - [Mission 101 enters Gojjam, "12 August 1940"]
      - [Emperor crosses the border, "20 January 1941"]
      - [Debre Markos, "6 April 1941"]
      - [Return to Addis Ababa, "5 May 1941"]
