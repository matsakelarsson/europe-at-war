notes:
  - "Arbegnoch (singular arbegna) is the Amharic name, “patriots”, that the resistance fighters gave themselves. The Italians called them rebels or bandits (shifta). Italian forces in the occupied country were largely Eritrean, Somali, Libyan and Ethiopian colonial troops (askari) and irregulars (banda) under Italian officers."
  - "Numbers of Patriots and of the dead rest on scattered Italian reports, Ethiopian testimony and later estimates, and often differ widely; they are given here as the sources give them."
