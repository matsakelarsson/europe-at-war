steps:
  - title: The first resistance and the massacres
    date: May 1936 – May 1937
    when: "1936-06"
    borders: "1937-05-21"
    countries: [et, it]
    body:
      - "When the emperor left, much of Ethiopia had not yet seen an Italian soldier. In the west, officers and cadets of the Holeta military school formed the Black Lions, who on 26 June 1936 attacked the airfield at Nekemte, burning aircraft and killing the Italian officers who had landed there, among them the air force general Vincenzo Magliocco. At the end of July the sons of Ras Kassa, Abebe Aregai and other leaders attacked Addis Ababa from the north and were driven back; Abune Petros, a bishop who had joined them, was shot in public. As the Italians spread out, the leaders were hunted down. Ras Imru surrendered in the south-west on 19 December 1936, Ras Kassa’s sons were executed, and Ras Desta Damtew was caught and shot in February 1937."
      - "On 19 February 1937 (Yekatit 12) two Eritreans threw grenades at Viceroy Rodolfo Graziani in Addis Ababa, and for three days Italians killed the city’s people (see Second Italo-Ethiopian War). Graziani then had educated Ethiopians, diviners and wandering singers rounded up and killed, and believing that the monks of Debre Libanos, the great monastery of the Ethiopian Church north of the capital, had sheltered the attackers, he ordered them killed. On 21 May 1937 Italian-led colonial troops shot 297 monks and 23 laymen there, and on the following days 129 deacons, 449 dead by Italian count; later research by Ian Campbell and Degife Gabre-Tsadik puts the dead of the Debre Libanos killings at about 1,700–2,100. Survivors and thousands of others were deported to camps at Danane in Somalia, where about half of the prisoners died, and Nocra in the Dahlak islands."
    facts:
      - [Attack on Nekemte airfield, "26 June 1936"]
      - [Attack on Addis Ababa, "end of July 1936"]
      - [Ras Imru surrenders, "19 December 1936"]
      - [Debre Libanos massacre, "21–29 May 1937"]
