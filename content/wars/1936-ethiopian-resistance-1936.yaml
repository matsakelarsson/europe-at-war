id: ethiopian-resistance-1936
name: Ethiopian resistance to Italian rule
start: "1936-05"
end: "1941-05-05"
tier: B
summary: "Five years of guerrilla war against the Italian occupation of Ethiopia. After the fall of Addis Ababa in May 1936, nobles, soldiers and peasants fought on as the Arbegnoch, the Patriots. Their first attempts, an attack on the capital in July 1936 and the stand of Ras Imru and the Black Lions in the west, ended in surrender and executions, and after the attempt on Viceroy Graziani’s life in February 1937 the Italians answered with mass killings in Addis Ababa and at the monastery of Debre Libanos. The killings drove more people to the Patriots. From 1937 risings in Lasta, Begemder and Gojjam, and the bands of Abebe Aregai in Shewa, kept large parts of the highlands out of Italian control; a more conciliatory viceroy, the Duke of Aosta, could not end the war, and Italian troops used gas in the Zeret cave in 1939. When Italy entered the Second World War in June 1940, Britain armed the Patriots, and in January 1941 Haile Selassie re-entered Ethiopia with Gideon Force. He returned to Addis Ababa on 5 May 1941, five years to the day after the Italians had taken it, escorted by thousands of Patriots."
countries: [et, it]
