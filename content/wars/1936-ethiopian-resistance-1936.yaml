  - title: The Patriots in the mountains
    date: 1937–1940
    when: "1937-08"
    borders: "1938-06-01"
    countries: [et, it]
    body:
      - "The massacres drove more people to the mountains. From the summer of 1937 risings spread through Lasta, Begemder and Gojjam; their leader in Lasta, Hailu Kebede, was captured and beheaded on 24 September 1937, but in Gojjam Belay Zeleke and Mengesha Gembere fought on, and in December 1937 Mengesha’s men ambushed a column under Colonel Barbacini and destroyed two colonial battalions. In Shewa the bands of Abebe Aregai held the country between Addis Ababa and the escarpment, Haile Mariam Mammo fought until he was killed in June 1938, and Geresu Duki held out in the south. An Italian offensive in Gojjam from January to April 1938 claimed over 2,300 Patriot casualties for 350 Italian dead, but did not catch the leaders."
      - "Mussolini recalled Graziani, and from December 1937 the new viceroy, Prince Amedeo, Duke of Aosta, tried conciliation, roads and settlement alongside force. The war went on. In April 1939 Italian troops besieged Patriots and villagers who had taken refuge in the Zeret cave in Menz, used gas and machine guns, and killed about 1,200–1,500 people, most of them civilians. Large parts of the highlands remained beyond Italian reach, and from 1939 British and French officers began to send arms across the Sudanese border."
    facts:
      - [Hailu Kebede executed, "24 September 1937"]
      - [Duke of Aosta takes office, "22 December 1937"]
      - [Zeret cave massacre, "9–11 April 1939"]
