        lonlat: [-5.995, 37.389]
      - kind: event
        side: nat
        name: Pamplona
        date: 19 July 1936
        text: Mola, who had directed the conspiracy, declared a state of war; thousands of Carlist militiamen, the requetés, joined him.
        lonlat: [-1.645, 42.817]
      - kind: taken
        side: nat
        name: Zaragoza
        date: 19 July 1936
        text: General Miguel Cabanellas declared for the rising and broke the general strike called by the anarchist trade union, the CNT.
        lonlat: [-0.889, 41.649]
      - kind: held
        side: rep
        name: Barcelona
        date: 19–20 July 1936
        text: Assault and Civil Guards and armed workers of the CNT defeated the troops marching into the city; General Manuel Goded was captured and later executed.
        lonlat: [2.177, 41.383]
      - kind: held
        side: rep
        name: Montaña barracks, Madrid
        date: 20 July 1936
        text: Crowds and loyal troops stormed the barracks where General Joaquín Fanjul had shut himself in; many of the defenders were killed after they surrendered.
        lonlat: [-3.718, 40.424]
      - kind: held
        side: nat
        name: Oviedo
        date: from 19 July 1936
        text: Colonel Antonio Aranda declared for the rising and held the Asturian capital against miners’ militias until a column from Galicia relieved him in October.
        lonlat: [-5.849, 43.361]
      - kind: held
        side: nat
        name: Córdoba
        date: from 18 July 1936
        text: Colonel Ciriaco Cascajo took the city for the rising; it held out against Republican militias in the surrounding countryside.
        lonlat: [-4.779, 37.884]
      - kind: held
        side: nat
        name: Granada
        date: from 20 July 1936
        text: Isolated for a month in Republican territory; the rebels shot thousands in the city, among them the poet Federico García Lorca in August.
        lonlat: [-3.6, 37.178]
