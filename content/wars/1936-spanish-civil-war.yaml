steps:
  - title: The July coup
    date: 17–31 July 1936
    when: "1936-07-17"
    borders: "1936-07-31"
    countries: [es, ma]
    body:
      - Spain had been a republic since 1931. After the Popular Front, an alliance of the left, won the elections of February 1936, strikes, land seizures and killings by militants of left and right deepened the divide, and a group of generals led by Emilio Mola in Pamplona planned a coup. On 13 July Assault Guards and socialist gunmen murdered the monarchist leader José Calvo Sotelo. The rising began in Spanish Morocco on 17 July and spread to garrisons across the mainland over the next two days. Francisco Franco, the commander in the Canary Islands, flew to Tetuán to lead the Army of Africa, Spain’s best troops.
      - The coup took Seville, Zaragoza and most of Old Castile, León, Galicia and Navarre, but it failed in Madrid, Barcelona, Valencia, Asturias and the Basque coast, where the government armed the workers’ parties and trade unions. Most of the navy’s crews turned on their officers, leaving the Army of Africa stranded in Morocco, and Mola’s columns were stopped in the passes of the Guadarrama north of Madrid. Behind the lines both sides began to kill their enemies. The rebels shot trade unionists, left-wing politicians and officials, and in the Republican zone militias murdered priests, landowners and suspected right-wingers.
    facts:
      - [Rising in Melilla, "17 July 1936"]
      - [Montaña barracks stormed, "20 July 1936"]
      - [Coup leader José Sanjurjo killed, "20 July 1936, in an air crash in Portugal"]
