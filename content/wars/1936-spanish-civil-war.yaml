  - title: The Ebro
    date: July – November 1938
    when: "1938-07-25"
    borders: "1938-11-16"
    countries: [es]
    body:
      - On the night of 24–25 July 1938 the Republican Army of the Ebro under Juan Modesto crossed the river in boats and on pontoon bridges between Mequinenza and Amposta, to rejoin the two halves of the Republic and draw Franco away from Valencia. The crossing took the Nationalists by surprise, and in a few days the Republicans pushed into the great bend of the river as far as the outskirts of Gandesa. They could not take the town, and the offensive stalled. Nationalist aircraft bombed the bridges again and again, and dams upstream were opened to flood the river behind the Republicans.
      - Franco chose to wear the Republican army down where it stood. For more than three months Nationalist artillery and aircraft pounded its positions in the bare hills of the Sierra de Pàndols and Cavalls, and counter-attack after counter-attack slowly retook the ground. By 16 November the last Republican troops had crossed back over the river. The battle, the longest of the war, cost each side tens of thousands of casualties and destroyed the Republic’s last effective army. Meanwhile the Munich Agreement of 30 September ended Negrín’s hope of help from Britain and France, and the International Brigades were withdrawn, holding a farewell parade in Barcelona on 28 October.
    facts:
      - [Crossing of the Ebro, "night of 24–25 July 1938"]
      - [Last Republicans withdraw, "16 November 1938"]
      - [International Brigades’ farewell, "Barcelona, 28 October 1938"]
    markers:
      - kind: event
        side: rep
        name: Móra d’Ebre
        date: 25 July 1938
        text: One of the main crossing points; boats, footbridges and pontoon bridges carried the Army of the Ebro over in the first night and day.
        lonlat: [0.643, 41.093]
      - kind: battle
        side: nat
        name: Gandesa
        date: late July – early August 1938
        text: The Republican attacks on the town, defended by Nationalist troops on the heights around it, failed and the offensive came to a halt.
        lonlat: [0.44, 41.055]
        lp: l
      - kind: battle
        side: nat
        name: Sierra de Pàndols
        date: August – November 1938
        text: Some of the hardest fighting of the battle took place on these rocky heights, where the Republicans had little cover from artillery.
        lonlat: [0.465, 40.985]
