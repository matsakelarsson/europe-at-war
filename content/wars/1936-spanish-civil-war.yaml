  - title: Teruel
    date: December 1937 – February 1938
    when: "1937-12-15"
    borders: "1938-02-22"
    countries: [es]
    body:
      - To forestall a new Nationalist offensive against Madrid, the Republican army attacked the Nationalist salient of Teruel on 15 December 1937, in snow, during the worst Spanish winter in twenty years. Within a week Republican troops were in the town, where Colonel Domingo Rey d’Harcourt’s garrison held out in a few strongpoints. Franco, unwilling to let any provincial capital fall, cancelled his Madrid offensive and sent relief forces under Generals José Enrique Varela and Antonio Aranda. They attacked on 29 December but were halted by blizzards and severe frost, and on 8 January 1938 Rey d’Harcourt surrendered.
      - Teruel was the only provincial capital the Republic took during the war, and it did not keep it long. The Nationalists brought up far more artillery and aircraft, broke the Republican lines on the Alfambra north of the town in early February, and closed in from three sides. On 22 February they retook the ruined town as the last Republican units broke out. Each side lost around 60,000 men killed, wounded, sick or frostbitten, and the battle used up the reserves of the Republican army just before the Nationalists struck in Aragon.
    facts:
      - [Republican attack, "15 December 1937"]
      - [Garrison surrenders, "8 January 1938"]
      - [Nationalists retake Teruel, "22 February 1938"]
    markers:
      - kind: siege
        side: nat
