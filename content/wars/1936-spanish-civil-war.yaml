  - title: Madrid holds
    date: November 1936 – March 1937
    when: "1936-11-06"
    borders: "1937-03-23"
    countries: [es, it, de]
    body:
      - By early November the Army of Africa stood at the western and southern edge of Madrid. On 6 November the government of Francisco Largo Caballero left for Valencia, leaving General José Miaja in charge of a defence junta, with Vicente Rojo as his chief of staff. The main assault, through the Casa de Campo park and the University City, began on 8 November. Militias and new units of the Republican army, the first International Brigades of foreign volunteers, and Soviet tanks and fighters held the line, and Franco called off the frontal attack on 23 November. Through November and December some 2,000 or more prisoners taken from the city’s jails were killed at Paracuellos de Jarama and Torrejón de Ardoz.
      - The Nationalists then tried to cut Madrid off. They gained ground on the Corunna road to the north-west in January 1937, and in February crossed the Jarama south-east of the city, but in three weeks of costly fighting failed to cut the road to Valencia. In March the Italian Corps of Volunteer Troops attacked from the north-east towards Guadalajara and was routed near Brihuega. In the south Nationalist and Italian troops took Málaga on 8 February. Refugees fleeing along the coast road to Almería were bombed from the air and shelled from the sea, and estimates of the dead run up to several thousand.
    facts:
      - [Assault on Madrid, "8–23 November 1936"]
      - [Battle of the Jarama, "6–27 February 1937"]
      - [Battle of Guadalajara, "8–23 March 1937, Republican victory"]
    markers:
      - kind: held
        side: rep
        name: Madrid
        date: November 1936
        text: The Nationalists broke into the University City on the north-western edge of the city but got no further; the front there stayed almost unchanged until 1939.
        lonlat: [-3.704, 40.417]
      - kind: event
        name: Paracuellos de Jarama
        date: November – December 1936
        text: Prisoners taken from Madrid’s jails, among them officers, priests and right-wing politicians, were shot here and at Torrejón de Ardoz; the number of dead is still disputed.
        lonlat: [-3.528, 40.504]
      - kind: battle
        name: Battle of the Jarama
        date: 6–27 February 1937
        text: The Nationalists crossed the river but were stopped in bitter fighting around the Pingarrón heights; the British Battalion of the XV International Brigade lost more than half its men on its first day in action.
        lonlat: [-3.47, 40.25]
      - kind: battle
        side: rep
        name: Battle of Guadalajara
        date: 8–23 March 1937
        text: Republican counter-attacks, helped by aircraft flying from airfields not flooded by the rain, routed the Italian divisions around Brihuega.
        lonlat: [-2.869, 40.76]
      - kind: taken
        side: nat
        name: Málaga
        date: 8 February 1937
        text: Taken by Spanish and Italian troops; thousands of people were executed in the city in the following weeks.
        lonlat: [-4.421, 36.721]
      - kind: event
        name: Málaga–Almería road
        date: February 1937
        text: Tens of thousands of refugees on the coast road were attacked by aircraft and warships as they fled east.
        lonlat: [-3.2, 36.73]
        lp: b
