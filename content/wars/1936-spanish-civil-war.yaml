  - title: Catalonia and the end of the war
    date: December 1938 – April 1939
    when: "1938-12-23"
    borders: "1939-04-01"
    countries: [es, fr]
    body:
      - On 23 December 1938 the Nationalists attacked Catalonia with overwhelming artillery and air power. The worn-out Republican army could not hold, Tarragona fell on 15 January 1939 and Barcelona on 26 January, almost without a fight. Hundreds of thousands of soldiers and civilians fled north through snow and air raids to the French border, which France opened to civilians on 28 January and to soldiers on 5 February. Nearly 500,000 people crossed in what Spaniards call La Retirada (the retreat), and many were held behind barbed wire in camps on the beaches of Roussillon. Nationalist troops reached the border on 10 February.
      - The Republic still held Madrid, Valencia and the south-east, but Britain and France recognised Franco’s government on 27 February and President Manuel Azaña resigned. On 5 March Colonel Segismundo Casado, commanding the Army of the Centre, rose against Negrín’s government, which he accused of serving the communists, and set up a National Defence Council to negotiate peace, setting off a week of fighting in Madrid. Franco would accept only unconditional surrender. His troops entered Madrid on 28 March, and on 1 April he declared the war over. The victors executed many thousands of Republicans and held hundreds of thousands in camps and prisons.
    facts:
      - [Barcelona taken, "26 January 1939"]
      - [Casado’s coup, "5 March 1939"]
      - [End of the war, "1 April 1939"]
