  - title: The war in the north
    date: March – October 1937
    when: "1937-03-31"
    borders: "1937-10-21"
    countries: [es, de, it]
    body:
      - In spring 1937 Franco turned against the Republican north, cut off from the rest of the Republic. Mola’s offensive against the Basque Country began on 31 March, when the town of Durango was bombed. On 26 April aircraft of the German Condor Legion, joined by Italian bombers, destroyed much of Guernica, the historic seat of the Basque assemblies, killing perhaps 200 to 300 people. The Nationalists claimed the retreating Basques had burned the town, but reports by foreign journalists, and Pablo Picasso’s painting, made it known across the world. Mola was killed in an air crash on 3 June, and on 19 June the Nationalists entered Bilbao after breaking through its fortified ring.
      - To relieve the north the Republic attacked at Brunete, west of Madrid, in July and towards Zaragoza in August, but took only a few villages and the ruined town of Belchite, at heavy cost. Santander fell on 26 August; many Basque troops surrendered to the Italians at Santoña on terms that the Nationalists did not honour. Asturias held out until 21 October, when Gijón fell. With the northern coast, its coal and iron mines and its heavy industry, Franco had the stronger economy and could move his whole army south and east. Some of the defeated took to the mountains as guerrillas.
    facts:
      - [Bombing of Guernica, "26 April 1937"]
      - [Bilbao taken, "19 June 1937"]
      - [Gijón taken, "21 October 1937"]
    markers:
      - kind: air
        name: Durango
        date: 31 March 1937
        text: German and Italian aircraft bombed the town on the first day of the offensive, killing about 250 people, among them a priest and 14 nuns at mass.
        lonlat: [-2.633, 43.17]
      - kind: air
        name: Guernica
        date: 26 April 1937
        text: Bombed in waves for about three hours on the afternoon of Monday, the town’s market day; the attack became a symbol of the bombing of civilians.
        lonlat: [-2.678, 43.314]
        lp: l
      - kind: taken
