  - title: Aragon and the road to the sea
    date: March – July 1938
    when: "1938-03-07"
    borders: "1938-07-24"
    countries: [es, it, de]
    body:
      - On 7 March 1938 the Nationalists, with Italian divisions and German and Italian aircraft, opened an offensive in Aragon against a Republican army worn out at Teruel. The front gave way. Belchite was retaken on 10 March, and within a month Nationalist columns had overrun eastern Aragon, taken Lleida on 3 April and reached the Segre and the Ebro. On 15 April Navarrese troops under General Camilo Alonso Vega reached the Mediterranean at Vinaròs, cutting the Republic in two and separating Catalonia from Valencia and Madrid. In March Italian bombers from Mallorca had struck Barcelona for three days, killing about a thousand people.
      - Instead of attacking Catalonia, Franco turned south against Valencia. His troops took Castellón on 14 June, but in July they were stopped with heavy losses on the fortified XYZ line in the mountains north of Sagunto. The Republican prime minister, Juan Negrín, had offered peace terms on 1 May, his Thirteen Points, which Franco ignored; Negrín hoped that the Republic could hold out until a wider European war brought it allies. On 5 April Franco abolished Catalonia’s autonomy.
    facts:
      - [Aragon offensive opens, "7 March 1938"]
      - [Vinaròs reached, "15 April 1938"]
      - [Castellón taken, "14 June 1938"]
