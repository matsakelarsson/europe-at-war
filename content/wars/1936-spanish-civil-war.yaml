  - title: The Army of Africa crosses the Strait
    date: August – October 1936
    when: "1936-08-05"
    borders: "1936-10-01"
    countries: [es, ma, de, it, pt]
    body:
      - With the strait closed by the Republican navy, Franco asked Hitler and Mussolini for aircraft. From the end of July German Junkers Ju 52 transports and Italian Savoia-Marchetti bombers flew thousands of Spanish legionaries and Moroccan Regulares from Tetuán to Seville, in the first long-range airlift of troops in history, and a convoy crossed under air cover on 5 August. Columns under Lieutenant Colonel Juan Yagüe drove north through Extremadura by lorry, routing the militias that stood in their way. On 14 August they stormed Badajoz, where estimates of the prisoners and civilians shot in the following days, many of them in the bullring, range from 500 to 4,000.
      - Badajoz joined the two Nationalist zones along the border with Portugal, whose dictator, António de Oliveira Salazar, openly favoured them. Yagüe’s men took Talavera de la Reina on 3 September, but Franco turned aside to relieve the Alcázar of Toledo, where Colonel José Moscardó, with Civil Guards, cadets and their families, had held out since July; his troops reached it on 27 September. In the north Mola’s forces took Irun on 5 September, cutting the Basque Country and Asturias off from France, and San Sebastián a week later. On 1 October Franco took office in Burgos as Generalísimo and head of the Nationalist state.
    facts:
      - [Badajoz stormed, "14 August 1936"]
      - [Alcázar of Toledo relieved, "27 September 1936"]
      - [Franco takes office as head of state, "1 October 1936"]
