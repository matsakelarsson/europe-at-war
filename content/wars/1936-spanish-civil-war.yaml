id: spanish-civil-war
name: Spanish Civil War
start: "1936-07-17"
end: "1939-04-01"
tier: A
summary: A war between the government of the Second Spanish Republic, backed by the parties of the left, the trade unions and the Basque and Catalan autonomists, and the Nationalists, army rebels joined by monarchists, Carlists and the fascist Falange, who were led from October 1936 by General Francisco Franco. With troops, aircraft and arms from Fascist Italy and Nazi Germany the Nationalists won, while the Republic depended on the Soviet Union and the International Brigades; Franco then ruled Spain as dictator until his death in 1975. Estimates of the dead differ widely, but by many counts some 200,000 died at the front and about as many were murdered or executed behind the lines and after the war, most of them by the Nationalists.
countries: [es, ma, it, de, fr]
sides:
  - id: rep
    name: Republicans
    polities: [spain]
    ink: red
    moves: Republican moves
    success: Republican success
  - id: nat
    name: Nationalists
    polities: [nationalist-spain]
    ink: blue
    moves: Nationalist moves
    success: Nationalist success
  - id: ax
    name: Italian and German forces
    polities: [italy, germany]
    ink: slate
    moves: Italian moves
    success: Italian and German success
notes:
  - The Republicans were also called loyalists, and their enemies called them “Reds”; the Nationalists (nacionales) were also called rebels or insurgents. The base map shows Spain undivided, under the Republic, which Britain and France recognised until 27 February 1939; the areas held by each side are drawn in the steps, approximately, from general accounts.
  - Places in Catalonia and the Basque Country are named in their present official forms, such as Lleida (Lérida), Girona (Gerona) and Vinaròs (Vinaroz); Guernica is Gernika in Basque.
  - Italy sent some 70,000–75,000 troops in all, as the Corps of Volunteer Troops (CTV), and Germany some 16,000, many of them in the Condor Legion’s air units. The Soviet Union sold the Republic aircraft, tanks and arms and sent a few thousand advisers, pilots and tank crews, and about 35,000 foreign volunteers served in the International Brigades.
