        name: Bilbao
        date: 19 June 1937
        text: The Nationalists broke through the “Iron Ring” of fortifications, whose plans a defecting engineer had brought them, and took the city.
        lonlat: [-2.934, 43.263]
      - kind: battle
        name: Battle of Brunete
        date: 6–25 July 1937
        text: The Republican offensive west of Madrid took Brunete, but Nationalist counter-attacks retook it, and both sides lost heavily in the summer heat.
        lonlat: [-3.998, 40.405]
      - kind: taken
        side: rep
        name: Belchite
        date: 6 September 1937
        text: Taken after a siege by Republican troops; the ruined town was never rebuilt, and a new one was built beside it after the war.
        lonlat: [-0.753, 41.306]
      - kind: taken
