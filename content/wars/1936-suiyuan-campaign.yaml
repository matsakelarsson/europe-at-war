id: suiyuan-campaign
name: Suiyuan Campaign
start: "1936-10"
end: "1936-12-19"
tier: C
summary: "An attempt in late 1936 by Japanese-backed Mongol and Chinese forces to take the province of Suiyuan (today central Inner Mongolia), and its defeat by the provincial army of Fu Zuoyi. After the Japanese conquest of Rehe, the Kwantung Army encouraged the Mongol prince Demchugdongrub (De Wang), who set up a Mongol Military Government in northern Chahar in May 1936. Its Inner Mongolian Army, about 10,000 men, and the Grand Han Righteous Army of Wang Ying, about 6,000, advanced into Suiyuan in the autumn with Japanese advisers, armoured cars and aircraft; the operation was planned by Kwantung Army staff officers, among them Tanaka Ryūkichi. Fu Zuoyi’s 35th Army and allied troops, about 45,000 in all, held the village of Hongort against attacks on 15 and 16 November, counter-attacked on 17 November and then, in a surprise night attack with motor transport, took the Mongol base at Bailingmiao on 24 November. Most of Wang Ying’s army was destroyed or went over to the Chinese side in December. Captured equipment showed Japanese involvement, which the Japanese government denied. The victory was celebrated across China and added to the pressure on Chiang Kai-shek to stop fighting the Communists and resist Japan, which came to a head in the Xi’an Incident of 12 December 1936."
