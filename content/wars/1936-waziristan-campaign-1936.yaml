id: waziristan-campaign-1936
name: Waziristan campaign of 1936–1939
start: "1936-11-25"
end: "1939"
tier: C
summary: "A series of British Indian operations in Waziristan, on the North-West Frontier, against the followers of Mirzali Khan, a religious leader the British called the Faqir of Ipi. In 1936 a court in Bannu annulled the marriage of a Hindu girl who had converted to Islam, Islam Bibi, and the Faqir proclaimed a holy war against British interference in religion. In November 1936 a column sent through the Khaisora valley was ambushed and withdrew, and the rising spread among the Tori Khel Wazirs, Mahsuds and Bhittanis. At the height of the campaign in 1937 about 40,000 to 60,000 troops, with aircraft, armoured cars and artillery, faced perhaps 4,000 tribal fighters; villages were destroyed and the Royal Air Force bombed hostile areas. In April 1937 a convoy was ambushed in the Shahur Tangi gorge with the loss of 52 officers and men. The fighting died down by 1939, but the Faqir was never caught, and he kept up his resistance against Pakistan after 1947 until his death in 1960."
