notes:
  - By British figures, about 30 British and 133 Indian soldiers and more than 650 tribesmen were killed in 1936–1937 alone. Tribal and civilian losses for the whole campaign are not known.
  - A tribal raid on Bannu in July 1938 killed many townspeople. During the Second World War the Faqir received money from Axis agents, and in 1949–1950 he was proclaimed leader of a Pashtunistan movement backed by Afghanistan.
