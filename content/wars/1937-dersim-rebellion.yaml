id: dersim-rebellion
name: Dersim rebellion and massacre
start: "1937-03"
end: "1938-12"
tier: C
summary: The Turkish state’s military campaign of 1937–1938 in Dersim, a mountainous region of Alevi Kurds and Zazas renamed Tunceli in 1935, which followed a local rising under Seyid Riza, hanged in Elazığ in November 1937; with air bombardment, village burnings and reportedly poison gas, thousands of people were killed, many of them civilians, and thousands more deported. Estimates of the dead range from about 13,000, the figure in a 1938 Turkish government document, to tens of thousands, and whether the events should be called a rebellion, a massacre or a genocide remains disputed.
