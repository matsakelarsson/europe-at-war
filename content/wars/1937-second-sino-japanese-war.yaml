  - title: Surrender
    date: April – October 1945
    when: "1945-04-09"
    borders: "1945-09-09"
    countries: [cn, jp, tw]
    body:
      - In the spring of 1945 Chinese armies, many of them trained and equipped by the Americans, defeated a Japanese attack on the air base of Zhijiang in western Hunan (April–June), and as Japan pulled troops back towards the coast they retook Nanning, Liuzhou and Guilin in May–July. On 9 August the Soviet Union invaded Manchuria (see the Soviet invasion of Manchuria), after the American atomic bombing of Hiroshima on 6 August; Nagasaki was bombed the same day. On 15 August Emperor Hirohito announced Japan’s surrender. The Communist commander Zhu De ordered his armies to take the surrender of the Japanese wherever they could, and the race between the Nationalists and the Communists for the occupied cities began at once.
      - On 9 September 1945 at Nanjing, General Okamura Yasuji, commander of the China Expeditionary Army, surrendered more than a million Japanese troops in China, Taiwan and northern Indochina to General He Yingqin. On 25 October the last Japanese governor-general of Taiwan, Andō Rikichi, surrendered the island to the Nationalist governor Chen Yi in Taipei, and the Republic of China took over its administration. The war had cost China, by different estimates, between 14 and over 20 million dead and created tens of millions of refugees; about 450,000–700,000 Japanese soldiers had died in China.
    facts:
      - [Battle of West Hunan, "April–June 1945, Chinese victory"]
      - [Japan announces surrender, "15 August 1945"]
      - [Surrender ceremony at Nanjing, "9 September 1945"]
      - [Taiwan handed over, "25 October 1945"]
