  - title: Behind the lines
    date: 1938 – 1941
    when: "1940-08-20"
    borders: "1940-08-20"
    countries: [cn, jp]
    body:
      - Behind the Japanese front, which held the cities and railways, the Eighth Route Army in the north and the New Fourth Army in the lower Yangtze built base areas in the mountains and on the plains, with their own governments, militias, taxes and rent reductions. From some 50,000 men in 1937 the Communist forces grew to several hundred thousand by 1940. Nationalist guerrillas and provincial troops also stayed behind the lines, and from 1939 clashes between them and the Communists became frequent.
      - On 20 August 1940 Peng Dehuai launched the Hundred Regiments Offensive, in which more than 100 Communist regiments attacked railways, roads, bridges and coal mines across North China; it did great damage until it petered out in December. The Japanese North China Area Army answered in 1941–1942 with campaigns of destruction against the base areas, called by the Chinese the “Three Alls” (“kill all, burn all, loot all”), with blockhouses, ditches and forced resettlement. Estimates of the civilians killed in these campaigns range from about 2 to over 3 million, and by Communist records the population of their base areas fell from about 44 million to 25 million, though how many of them fled, were deported or died is unknown.
      - The united front broke down in January 1941. Ordered to move its headquarters north of the Yangtze, the New Fourth Army’s column of about 9,000 men was surrounded near Maolin in southern Anhui by some 80,000 Nationalist troops; after a week of fighting about 2,000 broke out, its commander Ye Ting was detained when he went to negotiate, and the political commissar Xiang Ying escaped but was murdered by one of his own officers in March. Chiang ordered the army disbanded, but the Communists rebuilt it north of the river under Chen Yi and Liu Shaoqi. From then on each side kept large forces to watch the other.
    facts:
      - [Hundred Regiments Offensive, "20 August – 5 December 1940"]
      - [Three Alls campaigns, "1941–1942"]
      - [New Fourth Army Incident, "January 1941"]
