  - title: Wuhan and Guangzhou
    date: June – December 1938
    when: "1938-06-11"
    borders: "1938-10-27"
    countries: [cn, jp]
    body:
      - The battle for Wuhan, the temporary seat of government on the middle Yangtze, was the largest of the war. From June to October 1938 more than a million Chinese troops under Chen Cheng, Li Zongren and Xue Yue fought about 350,000 Japanese under Hata Shunroku, advancing up the Yangtze and through the Dabie Mountains north of it. Anqing fell in June, Jiujiang in July. South of the river Xue Yue’s armies surrounded the Japanese 106th Division at Wanjialing in October and nearly destroyed it, but the Japanese took the river fortress of Tianjiazhen with poison gas, which they used repeatedly in the battle. Soviet volunteer pilots flew for China over the city. Wuchang and Hankou fell on 26 October and Hanyang on 27 October.
      - On 12 October a Japanese force landed at Bias Bay (Daya Bay) east of Hong Kong and took Guangzhou on 21 October, cutting China’s railway link to the sea. The Chinese government had already moved to Chongqing, protected by the gorges of the Yangtze; Wuhan’s factories were carried upriver by boat. On 13 November, fearing a Japanese advance, the Nationalist authorities set fire to Changsha, and much of the city burned. In December Wang Jingwei, the deputy leader of the Kuomintang, left Chongqing for Hanoi to seek peace with Japan.
      - Chinese losses at Wuhan were at least 200,000 and by some estimates 400,000–500,000; Japanese losses were over 30,000 killed and wounded by Japanese figures, with many more sick. Japan now held most of China’s great cities and railways but was stretched thin, and it turned to holding what it had.
    facts:
      - [Battle of Wuhan, "11 June – 27 October 1938"]
      - [Strength at Wuhan, "over 1 million Chinese, about 350,000 Japanese"]
      - [Guangzhou taken, "21 October 1938"]
      - [Wuhan taken, "26–27 October 1938"]
