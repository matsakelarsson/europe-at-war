  - title: Allies, famine and the Zhejiang–Jiangxi campaign
    date: December 1941 – 1943
    when: "1941-12-09"
    borders: "1942-07-01"
    countries: [cn, jp]
    body:
      - After Japan attacked Pearl Harbor and the European colonies in South-East Asia in December 1941, China formally declared war on Japan, Germany and Italy on 9 December and became one of the major Allies, with Chiang Kai-shek as supreme commander of the China theatre and the American general Joseph Stilwell as his chief of staff. A third Japanese attack on Changsha failed in January 1942. In 1942 Japan conquered Burma, cutting the Burma Road, after Chinese armies sent to help the British were defeated; for three years American transport planes flew supplies to Kunming over the Himalayas, the “Hump”.
      - In April 1942 American bombers under James Doolittle raided Tokyo and flew on to land in eastern China. In revenge and to destroy the airfields, the Japanese launched the Zhejiang–Jiangxi campaign from May to September 1942, destroying airfields and towns, spreading cholera, plague and other diseases with the biological warfare Unit 731, and killing many civilians who had helped the American airmen; estimates of the civilian dead run as high as 250,000. In Henan, already ruined by the flood of 1938, drought, locusts and the grain demands of the armies brought a famine in 1942–1943 that killed, by different estimates, from about 700,000 to two or three million people.
      - Japanese offensives in western Hubei in May–June 1943 and against Changde in Hunan in November–December 1943 were driven back after heavy fighting. In January 1943 Britain and the United States gave up their extraterritorial rights in China, and at Cairo in November 1943 Roosevelt, Churchill and Chiang declared that Manchuria, Taiwan and the Penghu Islands were to be returned to the Republic of China.
    facts:
      - [China declares war on Japan, Germany and Italy, "9 December 1941"]
      - [Zhejiang–Jiangxi campaign, "May–September 1942"]
      - [Henan famine, "1942–1943"]
      - [Cairo Declaration, "1 December 1943"]
