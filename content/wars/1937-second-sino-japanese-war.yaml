steps:
  - title: The Marco Polo Bridge
    date: July – August 1937
    when: "1937-07-07"
    borders: "1937-07-07"
    countries: [cn, jp]
    body:
      - By 1937 Japan held Manchuria and Rehe, dominated the demilitarised zone of 1933 in eastern Hebei through a collaborationist council, and kept a garrison near Beiping and Tianjin under the treaty that had ended the Boxer war. The Chinese 29th Army of Song Zheyuan held the region in an uneasy balance. On the night of 7 July 1937, during a Japanese night exercise near the Marco Polo Bridge (Lugou Bridge) south-west of Beiping, a Japanese soldier was missing for a time and shots were fired; the Japanese demanded to search the walled town of Wanping, were refused, and fighting broke out on the morning of 8 July. Who fired first has never been settled.
      - Local truces failed. Tokyo sent reinforcements from Manchuria, Korea and Japan, and on 17 July Chiang Kai-shek declared at Lushan that China would fight if it had to. On 26–28 July the Japanese attacked; at Nanyuan, south of Beiping, the 29th Army lost thousands of men, among them the generals Tong Linge and Zhao Dengyu, and Song withdrew his army south. Beiping was given up without a fight on 29 July and Tianjin was bombed and taken on 30 July. At Tongzhou, east of Beiping, the collaborationist militia turned on the Japanese garrison on 29 July and killed more than 200 Japanese and Korean civilians and soldiers. In August Japanese troops forced the Nankou pass north-west of Beiping and took Zhangjiakou.
    facts:
      - [Marco Polo Bridge Incident, "7–8 July 1937"]
      - [Chiang Kai-shek’s Lushan speech, "17 July 1937"]
      - [Beiping abandoned, "29 July 1937"]
      - [Tianjin taken, "30 July 1937"]
