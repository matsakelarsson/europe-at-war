id: second-sino-japanese-war
name: Second Sino-Japanese War
start: "1937-07-07"
end: "1945-09-09"
tier: A
summary: "The war between China and Japan from 1937 to 1945, known in China as the War of Resistance against Japan. It began with a clash at the Marco Polo Bridge near Beiping on 7 July 1937 and grew into full-scale war when fighting spread to Shanghai in August. Japan took Beiping, Tianjin, Shanghai and the Nationalist capital Nanjing in 1937, where its troops massacred prisoners and civilians, and Xuzhou, Wuhan and Guangzhou in 1938, but China did not surrender: Chiang Kai-shek’s government moved to Chongqing, Communist guerrillas spread behind the Japanese lines, and the war settled into a long stalemate. Japan ruled the occupied east through collaborationist governments, from 1940 Wang Jingwei’s in Nanjing. From December 1941 the war became part of the Second World War, with American and British aid to China. Japan’s last great offensive, Ichi-Go, overran Henan, Hunan and Guangxi in 1944, but Japan surrendered in August 1945 after the atomic bombings and the Soviet invasion of Manchuria, and its armies in China surrendered at Nanjing on 9 September. Estimates of Chinese deaths, military and civilian, range from about 14 to over 20 million, and tens of millions became refugees; Japanese military deaths in China were about 450,000–700,000."
countries: [cn, jp, tw]
sides:
