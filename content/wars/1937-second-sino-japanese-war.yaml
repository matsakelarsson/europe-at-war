  - title: Shanghai
    date: August – November 1937
    when: "1937-08-13"
    borders: "1937-11-12"
    countries: [cn, jp]
    body:
      - Chiang Kai-shek chose to open a second front at Shanghai, where Japan had a naval landing force of a few thousand men and where China could bring its best German-trained divisions to bear and draw in foreign attention. After a Japanese naval officer was killed at Hongqiao airfield on 9 August, fighting began on 13 August. On 14 August Chinese aircraft attacking the Japanese flagship Izumo dropped bombs by mistake on crowded streets of the International Settlement, near the Great World amusement centre and on Nanjing Road; estimates of the dead range from about 700 to 2,000, and about 3,000 people were killed or wounded.
      - The Chinese failed to drive the Japanese into the river, and from 23 August Japanese divisions landed on the Yangtze shore north of the city at Wusong, Baoshan and Chuanshakou. Through September and October some 700,000 Chinese troops and about 300,000 Japanese fought over a flat land of creeks and villages under constant Japanese air, naval and artillery fire, at Luodian and then at Dachang, which fell on 26 October. As the Chinese pulled back, a battalion under Xie Jinyuan held the Sihang Warehouse beside the Settlement for four days in full view of foreign observers. On 5 November a Japanese army landed at Jinshanwei on Hangzhou Bay, behind the Chinese right flank, and the Chinese retreat turned into a rout; Suzhou fell on 19 November.
      - The Chinese government counted 187,000 killed and wounded by early November, and its losses in the whole battle were perhaps 250,000–300,000, including much of the German-trained army. Japanese losses, by Japanese records and modern estimates, were about 40,000–60,000 killed and wounded.
