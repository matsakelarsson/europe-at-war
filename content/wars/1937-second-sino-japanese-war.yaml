  - title: Nanjing
    date: November 1937 – January 1938
    when: "1937-12-13"
    borders: "1937-12-13"
    countries: [cn, jp]
    body:
      - The Japanese armies pursued the broken Chinese forces west from Shanghai along the railway and around both sides of Lake Tai, and on 1 December Tokyo approved an attack on Nanjing. The government announced its move to Chongqing in Sichuan, though most offices went first to Wuhan. Tang Shengzhi undertook to hold the capital with about 80,000–100,000 mostly exhausted or untrained troops; the Japanese reached the outer defences in early December, the defence collapsed on the night of 12 December, and Japanese troops entered the city on 13 December. Hangzhou fell on 24 December.
      - For about six weeks, and in the surrounding districts for longer, Japanese soldiers killed disarmed Chinese soldiers and civilians in large numbers, by mass shootings and bayonetings, raped tens of thousands of women and girls, and looted and burned much of the city. The International Military Tribunal for the Far East estimated after the war that more than 200,000 people were killed; the Nanjing War Crimes Tribunal of 1947 gave over 300,000, the figure used by the Chinese government. Historians’ estimates range from about 40,000 to over 300,000 depending on the area, the period and the counting of soldiers, and many give 100,000–200,000; estimates of the rapes range from 20,000 to 80,000. A Safety Zone run by Westerners, among them the German businessman John Rabe, sheltered some 200,000 people. The commanders Matsui Iwane and Tani Hisao were executed after the war; Prince Asaka, who commanded at Nanjing, was not tried.
      - Japan expected China to make peace. German mediation failed, and on 16 January 1938 the Japanese prime minister Konoe Fumimaro declared that Japan would no longer deal with the Nationalist government.
