    name: Republic of China (Nationalist government)
    polities: [roc]
    ink: blue
    moves: Nationalist moves
    success: Chinese success
  - id: ccp
    name: Chinese Communist Party (Eighth Route Army and New Fourth Army)
    polities: [ccp]
    ink: red
    moves: Communist moves
    success: Communist success
  - id: jp
    name: Japan and the collaborationist governments
    polities: [japan, manchukuo, mengjiang, wang-jingwei-regime]
    ink: purple
    moves: Japanese moves
    success: Japanese success
notes:
  - The Nationalists and the Communists fought Japan as allies in the second united front from 1937, but clashed with each other from 1939 and above all after the New Fourth Army Incident of 1941. Their histories of the war give very different weight to each other’s part in it.
  - Casualty figures are uncertain. Official Nationalist figures give 1.32 million Chinese soldiers killed; Western estimates give over two million. Estimates of civilian deaths from fighting, massacres, famine, flood and disease run from about 10 million to well over 15 million.
  - The areas shown as held by Japan are approximate. Japan controlled the cities and railways; much of the countryside behind its lines was contested by Nationalist and Communist guerrillas.
