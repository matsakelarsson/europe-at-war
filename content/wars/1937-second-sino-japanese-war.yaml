  - title: North China and Taiyuan
    date: August – November 1937
    when: "1937-09-13"
    borders: "1937-11-08"
    countries: [cn, jp]
    body:
      - In the north the Japanese advanced down the railways from Beiping and Tianjin across the Hebei plain, taking Baoding on 24 September and Shijiazhuang on 10 October. In Shandong the governor Han Fuju gave up Jinan without a fight in December and was executed for it by the Nationalist government. In the north-west Kwantung Army units took Datong (13 September), Guisui (Hohhot) and Baotou in October, and in their wake Japan set up a Mongol United Autonomous Government under Prince Demchugdongrub, the later Mengjiang.
      - Shanxi was the hardest fight. On 25 September the Communist 115th Division of the new Eighth Route Army, under Lin Biao, ambushed a Japanese supply column in the defile of Pingxingguan, the first Chinese victory of the war, though a small one by Japanese records. The main Chinese armies under Wei Lihuang and Yan Xishan held the Japanese at Xinkou for three weeks in October, and General Hao Mengling was killed there. When the Japanese broke through the Niangziguan pass from Hebei in late October, the line collapsed, and Taiyuan fell on 8 November. The Eighth Route Army withdrew into the mountains to build bases behind the Japanese lines.
    facts:
