  - title: Taierzhuang, Xuzhou and the Yellow River
    date: January – June 1938
    when: "1938-03-24"
    borders: "1938-06-12"
    countries: [cn, jp]
    body:
      - In 1938 Japan tried to join its northern and central fronts at Xuzhou, where the Tianjin–Pukou and Longhai railways cross. Li Zongren’s Fifth War Zone gathered a large army to stop it. At Linyi in March Chinese troops held off Itagaki’s 5th Division, and at Taierzhuang, a walled town on the Grand Canal, Sun Lianzhong’s men fought a Japanese detachment from house to house from late March while Tang Enbo’s corps came round its flank; on 7 April the Japanese withdrew with heavy losses. It was China’s first major victory of the war, though accounts of the Japanese losses range from under 2,500 killed and wounded by Japanese records to over 20,000 by Chinese claims.
      - Japan then brought up reinforcements from the north and the south, some 400,000 men in the whole campaign, to encircle Xuzhou. The Chinese armies slipped away to the west and south, and the city fell on 19 May. As Japanese columns moved west along the Longhai railway and took Kaifeng on 6 June, threatening Zhengzhou and the road to Wuhan, Chiang Kai-shek approved breaching the dikes of the Yellow River. Chinese troops dug through the dike at Huayuankou, north of Zhengzhou, on 5–7 June, and the river poured south-east across Henan, Anhui and Jiangsu to the Huai.
      - The flood halted the Japanese advance on Zhengzhou, but it drowned thousands of villages. Estimates of the deaths from flooding, famine and disease range from about 400,000 to 500,000 by modern Chinese studies; the Nationalist government’s figure of 1948, 893,303, is often quoted but its methods are unclear. Millions lost their homes, and the river did not return to its old bed until the breach was closed in 1947.
    facts:
      - [Battle of Taierzhuang, "22 March – 7 April 1938, Chinese victory"]
      - [Xuzhou taken, "19 May 1938"]
      - [Dikes breached at Huayuankou, "5–7 June 1938"]
      - [Deaths from the flood, "estimates from about 400,000 to 900,000"]
