  - title: Ichi-Go
    date: April – December 1944
    when: "1944-04-17"
    borders: "1944-12-10"
    countries: [cn, jp]
    body:
      - In April 1944 Japan launched its largest offensive of the war, Operation Ichi-Go, with about 510,000 men, to open a land route from Korea to Indochina and to destroy the American air bases in southern China from which bombers struck Japanese shipping and the home islands. In Henan the Chinese First War Zone under Tang Enbo collapsed in a few weeks; peasants embittered by the famine and by army levies attacked and disarmed retreating soldiers. Luoyang fell on 25 May.
      - In Hunan Changsha fell on 18 June. At Hengyang the 10th Army under Fang Xianjue, about 17,000–18,000 men, held the city for 47 days against repeated assaults, until 8 August, when Fang surrendered with the remnant. In the autumn the Japanese overran Guangxi, taking Guilin and Liuzhou in November with their air bases, and Nanning, and early in December their vanguards reached Dushan in Guizhou, about 400 km south of Chongqing, before supply problems forced them to stop.
      - Chinese losses were about 500,000–600,000 by Western estimates, and the defeats badly weakened Chiang Kai-shek’s army and standing with the Americans. After Chiang refused to give Stilwell command of all Chinese forces, Roosevelt recalled him in October 1944 and replaced him with Albert Wedemeyer. The American B-29 bombers based around Chengdu were moved early in 1945 to the Mariana Islands, from which Japan was easier to reach.
    facts:
