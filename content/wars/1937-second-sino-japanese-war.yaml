  - title: The long stalemate
    date: 1939 – 1941
    when: "1939-03-27"
    borders: "1940-06-12"
    countries: [cn, jp]
    body:
      - From 1939 the front moved little. Japan took Hainan Island in February 1939, Nanchang in March and Shantou in June, and from November 1939 to October 1940 held Nanning, cutting the road from French Indochina; Chinese armies won a hard fight at Kunlun Pass north of the city in December 1939 – January 1940. Xue Yue beat back Japanese attacks on Changsha in September–October 1939 and again in 1941, and a Chinese winter offensive in 1939–1940 regained little. In the Zaoyang–Yichang campaign of May–June 1940 General Zhang Zizhong was killed and the Japanese took Yichang, the gateway to the Yangtze gorges, from where their aircraft could reach Chongqing more easily.
      - Japanese aircraft bombed Chongqing and other cities in the interior from 1938 to 1943, killing thousands of civilians; in a raid on 5 June 1941 a crowd sheltering in an air-raid tunnel suffocated, and estimates of the dead range from about 1,000 to 4,000. China fought largely alone, with Soviet aircraft, volunteer pilots and loans from 1937 until the Soviet–Japanese neutrality pact of 1941, and supplies by the Burma Road and through Indochina, which Japan cut by pressure on Britain and France in 1940 and by occupying northern Indochina in September 1940. On 30 March 1940 Wang Jingwei formed a Reorganized National Government in Nanjing, which absorbed the earlier collaborationist governments in Beiping and Nanjing; Japan recognised it in November 1940, but it never had a strong army or popular following.
    facts:
      - [Nanchang taken, "27 March 1939"]
      - [Battle of Kunlun Pass, "December 1939 – January 1940"]
      - [Wang Jingwei’s government in Nanjing, "30 March 1940"]
      - [Yichang taken, "12 June 1940"]
