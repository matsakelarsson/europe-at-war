id: battle-of-lake-khasan
name: Battle of Lake Khasan
start: "1938-07-29"
end: "1938-08-11"
tier: C
summary: "A border battle between the Soviet Union and Japan over two hills west of Lake Khasan, where the borders of the Soviet Maritime Province, Japanese-ruled Korea and Manchukuo met near the mouth of the Tumen River, about 120 km south-west of Vladivostok. In July 1938 Soviet border guards fortified Zaozernaya hill (Changkufeng to the Japanese), which Japan and Manchukuo said lay on their side of a boundary drawn in the Russo-Chinese treaties of 1860 and 1886. After a clash at the neighbouring Bezymyannaya hill on 29 July, troops of the Japanese 19th Division from Korea under Lieutenant General Suetaka Kamezō took both hills in a night attack on 31 July. The Soviet 39th Rifle Corps under Grigory Shtern, with Vasily Blyukher in overall command, counter-attacked from 2 August with infantry, tanks and aircraft over marshy ground, at heavy cost, and retook most of the heights. After talks in Moscow between the Soviet foreign commissar Maxim Litvinov and the Japanese ambassador Shigemitsu Mamoru, fighting stopped at 13:30 local time on 11 August, with Soviet troops on the heights and the border where the Soviet Union claimed it. Russian figures give 792 Soviet dead and missing and 3,279 wounded and sick; Japanese records give 526 dead and missing and 913 wounded, while Soviet sources claimed about 3,000 Japanese killed. Blyukher, blamed for the losses, was arrested in October and died in custody in November 1938. The Kwantung Army fought the Soviet Union again, on a larger scale, at Khalkhin Gol in 1939."
countries: [ru, cn, jp]
