notes:
  - Known in Japan and China as the Changkufeng (Zhanggufeng) incident, and in Russia as the fighting at Lake Khasan. The fighting covered an area of only a few square kilometres between the lake and the Tumen.
  - The Japanese troops came from the Korea Army, not the Kwantung Army; Tokyo kept the fighting local and refused to commit aircraft or tanks. Casualty figures differ by source.
