id: battles-of-khalkhin-gol
name: Battles of Khalkhin Gol
start: "1939-05-11"
end: "1939-09-16"
tier: A
summary: "An undeclared war between the Soviet Union and Mongolia on one side and Japan and its client state Manchukuo on the other, fought over a strip of steppe on the Khalkhin Gol, the river that the Japanese said was the border between Manchukuo and the Mongolian People’s Republic, while Mongolia and the Soviet Union placed the border some 16–20 km further east, near the cairn of Nomonhan. Clashes between border patrols in May 1939 grew into a battle of divisions. A Japanese offensive across the river at Bain-Tsagan in early July was thrown back by Soviet armour, and on 20 August Georgy Zhukov’s army group attacked with some 500 tanks and 500 aircraft, encircled the Japanese 23rd Division and destroyed it by the end of the month. A ceasefire agreed in Moscow took effect on 16 September, and the border was fixed roughly where Mongolia had claimed it. Japan lost some 17,000–20,000 killed, wounded and sick, the Soviet Union about 25,000. The defeat turned Japan away from war with the Soviet Union and towards South-East Asia and the Pacific."
countries: [mn, cn, ru, jp]
sides:
