  - title: Ceasefire and the turn south
    date: September 1939 – April 1941
    when: "1939-09-15"
    borders: "1939-09-16"
    countries: [mn, cn, ru, jp]
    body:
      - The Kwantung Army brought up two more divisions and wanted to fight on, but Tokyo had had enough. In early September there were more air battles and some local attacks, while in Moscow the Soviet foreign minister Vyacheslav Molotov and the Japanese ambassador Tōgō Shigenori negotiated. On 15 September they agreed that both sides would stop fighting on 16 September, at 2 p.m. Moscow time, and stay on the positions they held the day before. Prisoners and the dead were exchanged. On 17 September, the day after the ceasefire, Soviet troops invaded eastern Poland. A mixed commission met at Chita and Harbin, and an agreement initialled by Molotov and Tōgō on 9 June 1940 fixed the border roughly where Mongolia had claimed it.
      - Japanese army records count about 17,000–20,000 dead, wounded, missing and sick, among them some 8,000 killed; about 500–600 Japanese and Manchukuo soldiers were taken prisoner. Russian figures published after the Soviet era give about 9,700 Soviet dead and missing and 15,000 wounded, and Mongolia lost between 556 and 990 men killed and wounded. Zhukov was made a Hero of the Soviet Union; he went on to command at Moscow, Stalingrad and Berlin. Smushkevich and the front commander Grigory Shtern, also decorated, were shot in the purges of 1941.
      - The defeat discredited the army faction that had urged a war against the Soviet Union (the northern advance). Japan and the Soviet Union signed a neutrality pact on 13 April 1941, in which the Soviet Union promised to respect Manchukuo and Japan the Mongolian People’s Republic, and Japan turned south, towards French Indochina and war with the United States and Britain. In 1941 the Soviet Union could move divisions from the Far East to the defence of Moscow. In August 1945 the Soviet Union broke the pact and invaded Manchuria.
    facts:
      - [Ceasefire agreed in Moscow, "15 September 1939"]
      - [Fighting stops, "16 September 1939"]
      - [Japanese losses, "about 17,000–20,000 dead, wounded, missing and sick (about 8,000 killed)"]
      - [Soviet losses, "about 9,700 dead and missing, 15,000 wounded"]
      - [Soviet–Japanese Neutrality Pact, "13 April 1941"]
