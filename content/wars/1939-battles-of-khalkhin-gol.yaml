steps:
  - title: A border on the steppe
    date: 1932 – May 1939
    when: "1939-01"
    borders: "1939-05-01"
    countries: [mn, cn, ru, jp]
    body:
      - After Japan seized Manchuria in 1931–1932 and set up the state of Manchukuo, its Kwantung Army faced the Soviet Union along the Amur and the Ussuri and the Mongolian People’s Republic, a close Soviet ally, along the steppe frontier to the west. Neither border was clearly marked. In the remote grassland where the Khalkhin Gol flows north-west towards Lake Buir, the Japanese and Manchukuo held that the river itself was the boundary. Mongolia, relying on old Qing-era markers, placed it some 16–20 km east of the river, near the cairn of Nomonhan Burd Obo. Mongolian herders and border guards used the grazing on the east bank; Manchukuo’s Barga Mongol cavalry patrolled it too.
      - In the 1930s there were hundreds of incidents on these frontiers, among them clashes at Khalkhin Sume in 1935 and the battle at Lake Khasan near Korea in 1938. In March 1936 the Soviet Union and Mongolia signed a pact of mutual assistance, and from 1937 Soviet troops, the 57th Special Corps, were stationed in Mongolia. In April 1939 the Kwantung Army issued its own rules for border disputes, which told commanders to fix the border themselves where it was unclear and to destroy any intruders. The 23rd Division, newly formed and inexperienced, held the sector from its headquarters at Hailar, some 170 km away.
    facts:
      - [Japanese and Manchukuo claim, the Khalkhin Gol]
      - [Mongolian and Soviet claim, "a line about 16–20 km east of the river, near Nomonhan"]
      - [Soviet–Mongolian mutual assistance pact, "12 March 1936"]
