  - title: Bain-Tsagan and the July offensive
    date: 2–25 July 1939
    when: "1939-07-02"
    borders: "1939-07-05"
    countries: [mn, cn, ru, jp]
    body:
      - The Japanese plan had two prongs. On the night of 2–3 July a northern force of three infantry regiments under Major General Kobayashi Kōichi crossed the Khalkhin Gol on a single pontoon bridge, took Bain-Tsagan hill on the west bank and pushed south to cut off the Soviet and Mongolian troops on the east bank. At the same time a southern force under Lieutenant General Yasuoka Masaomi, with two tank regiments, nearly 90 tanks and tankettes, attacked the Soviet bridgehead on the east bank.
      - "Zhukov threw in his armour without waiting for infantry: on 3 July the 11th Tank Brigade, the 7th Motorised Armoured Brigade and the Mongolian 8th Armoured Car Division, some 450 tanks and armoured cars, attacked the Japanese on Bain-Tsagan from three sides. They lost many vehicles to anti-tank guns and petrol bombs, but the Japanese, with only the one bridge behind them, could not hold, and by 5 July they had withdrawn to the east bank. Yasuoka’s tanks lost more than half their number against Soviet anti-tank guns and were withdrawn on 9 July."
      - The Japanese then tried to break the Soviet bridgehead with infantry and heavy artillery brought up from the rear. Their attack of 23–25 July, after a bombardment that used over half the division’s artillery ammunition, failed, and the front settled down. By then the Japanese had lost more than 5,000 men. The Kwantung Army formed a Sixth Army under General Ogisu Rippei and planned a new offensive for late August.
    facts:
      - [Japanese cross at Bain-Tsagan, "night of 2–3 July 1939"]
      - [Japanese back across the river, "5 July 1939"]
      - [Failed Japanese offensive, "23–25 July 1939"]
