  - title: Zhukov’s August offensive
    date: 20–31 August 1939
    when: "1939-08-20"
    borders: "1939-08-31"
    countries: [mn, cn, ru, jp]
    body:
      - Zhukov meant to finish the battle before the autumn, and before a war in Europe might begin. Under strict secrecy, with false radio traffic and loudspeakers playing the noise of tanks and pile-drivers night after night, he brought up rifle divisions, tank and motorised armoured brigades and two Mongolian cavalry divisions; on 20 August his army group had some 50,000–57,000 men, about 500 tanks, nearly 350 armoured cars and some 550 aircraft. The Japanese had 25 infantry battalions, from the 23rd Division and part of the 7th, but only about 120 tanks and armoured cars, and were themselves preparing to attack on 24 August.
      - The Soviet offensive opened at 5:45 on Sunday 20 August with bombing and artillery. A central group under D. E. Petrov held the Japanese in front, while a southern group under M. I. Potapov and a northern group under I. P. Alekseenko, with most of the tanks, swept round both flanks. The wings met near Nomonhan on 25 August, closing the ring around the 23rd Division. A Japanese relief attack on 26 August and a breakout on 27 August failed, and the Japanese on the Fui heights and the Remizov heights fought until they were destroyed. By 31 August no organised Japanese force remained on the Mongolian side of the claimed border.
      - "On 23 August, in the middle of the battle, the Soviet Union signed its non-aggression pact with Germany. The news, as much as the defeat, shook Tokyo: the government of Hiranuma Kiichirō, which had been negotiating an alliance with Germany against the Soviet Union, resigned on 28 August."
    facts:
      - [Offensive begins, "20 August 1939, 5:45"]
      - [Soviet and Mongolian forces, "about 50,000–57,000 men, 498 tanks, 346 armoured cars, about 550 aircraft"]
      - [Encirclement closed, "25 August 1939, near Nomonhan"]
      - [Last Japanese pockets destroyed, "31 August 1939"]
