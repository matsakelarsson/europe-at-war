  - title: The May clashes
    date: 11–31 May 1939
    when: "1939-05-11"
    borders: "1939-05-28"
    countries: [mn, cn, ru, jp]
    body:
      - On 11 May 1939 a Mongolian cavalry patrol of 70–90 men crossed the Khalkhin Gol to graze its horses on the east bank and was driven back by Manchukuo cavalry. The Mongolians returned in greater numbers, and the commander of the 23rd Division, Komatsubara Michitarō, sent the division’s reconnaissance regiment under Lieutenant Colonel Azuma Yaozō, with Manchukuo cavalry, to clear the east bank. The Mongolians fell back across the river and the Japanese withdrew, but Soviet units moved up from the 57th Special Corps.
      - "Komatsubara struck again in late May with a larger force under Colonel Yamagata Takemitsu. On 28 May Azuma’s detachment, sent ahead to cut off the Soviet and Mongolian troops on the east bank, was itself surrounded by Soviet armoured cars and artillery firing from the higher west bank. It was almost wiped out: 8 officers and 97 men were killed and 34 wounded, about two-thirds of its strength. Both sides then pulled back, and each reinforced. In the air, Soviet and Japanese fighters fought large battles over the river from late May."
    facts:
      - [First clash, "11 May 1939"]
      - [Azuma detachment destroyed, "28 May 1939"]
      - [Azuma detachment losses, "105 killed and 34 wounded"]
    markers:
