  - title: Zhukov and the air war
    date: June 1939
    when: "1939-06-05"
    borders: "1939-06-27"
    countries: [mn, cn, ru, jp]
    body:
      - Moscow sent Georgy Zhukov, then a corps commander, to inspect the 57th Special Corps. He arrived on 5 June, reported that its leadership was poor, and was given command; the corps became the 1st Army Group. With him came Yakov Smushkevich with experienced pilots from Spain, and the Mongolian forces under Marshal Khorloogiin Choibalsan and Zhamyangiin Lkhagvasüren were placed under his direction. Everything the army needed came by truck from the railway at Borzya in Siberia, some 700 km away, and Zhukov began to build up a force that the Japanese, fighting about 200 km from their own railhead, did not expect.
      - The air war over the river grew through June, with dozens of fighters on each side. On 27 June the Japanese 2nd Air Brigade bombed the Soviet airfield at Tamsag-Bulag and others deep inside Mongolia. The Kwantung Army had ordered the raid without telling Tokyo, and the General Staff, afraid of a wider war, forbade further raids into Mongolia. The Kwantung Army instead prepared a ground offensive to drive the Soviets and Mongolians off the east bank and destroy them across the river.
    facts:
      - [Zhukov arrives, "5 June 1939"]
      - [Japanese raid on Tamsag-Bulag, "27 June 1939"]
      - [Soviet supply line, "about 700 km by road from Borzya"]
    markers:
