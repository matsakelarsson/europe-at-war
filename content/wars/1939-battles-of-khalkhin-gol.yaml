notes:
  - In Japan the fighting is called the Nomonhan Incident (Nomonhan jiken), after the border cairn of Nomonhan Burd Obo; in Russia and Mongolia it is the Battles of Khalkhin Gol (Khalkhyn Gol). The Japanese army in Manchuria, the Kwantung Army, fought largely on its own initiative and often against the wishes of the government and General Staff in Tokyo.
  - Casualty figures differ between Soviet, Mongolian and Japanese records and later studies; the ranges given here are those of the sources. Soviet losses were long understated in the Soviet Union.
  - The disputed strip and the movements on the maps are approximate.
