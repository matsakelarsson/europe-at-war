id: italian-invasion-of-albania
name: Italian invasion of Albania
start: "1939-04-07"
end: "1939-04-12"
tier: C
summary: Italy’s occupation of Albania, long an Italian client state, in April 1939. On Good Friday, 7 April, some 22,000 Italian troops landed at Durrës, Vlorë, Shëngjin and Sarandë against brief resistance, and King Zog fled to Greece with his family. Tirana was occupied on 8 April, an Albanian assembly offered the crown to King Victor Emmanuel III on 12 April, and Albania became a protectorate in personal union with Italy, from which Mussolini attacked Greece in October 1940.
