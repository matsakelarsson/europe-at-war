  - title: Across the Rhine and the end in Italy
    date: February – May 1945
    when: "1945-03-07"
    borders: "1945-04-01"
    countries: [de, it, fr, nl]
    body:
      - In February and March 1945 the Western Allies cleared the Rhineland, and French and American troops wiped out the German pocket around Colmar, freeing the last of Alsace. On 7 March American troops found the railway bridge at Remagen still standing and crossed the Rhine. Further north British, Canadian and American troops crossed at Rees and Wesel on 23–24 March, with a vast airborne landing, and the Americans encircled the Ruhr, where 317,000 Germans surrendered in mid-April. The Canadians freed the north-east of the Netherlands, while American and British columns raced towards the Elbe.
      - As they advanced, the Allies uncovered the concentration camps. British troops entering Bergen-Belsen on 15 April found thousands of unburied bodies and some 60,000 starving and sick prisoners; more than 35,000 people, Anne Frank among them, had died there in the first months of 1945, and thousands more died after liberation. American troops reached Buchenwald on 11 April and Dachau on 29 April. On 4 May the German forces in north-west Germany, the Netherlands and Denmark surrendered at Lüneburg Heath, and on 7 May General Jodl signed the surrender of all German forces at Reims.
      - In Italy the Allies had spent the winter halted on the Gothic Line, while German troops and Fascist units fought a brutal war against the partisans; at Marzabotto in autumn 1944 the SS killed some 770 civilians. The April offensive broke into the Po valley, Bologna fell on 21 April, and partisans rose in Milan, Turin and Genoa. Partisans caught Mussolini near Lake Como as he tried to flee and shot him on 28 April; his body was hung in Milan’s Piazzale Loreto. The German surrender in Italy, signed at Caserta on 29 April, took effect on 2 May.
    facts:
      - [Rhine crossed at Remagen, "7 March 1945"]
      - [Surrender in Italy, "signed 29 April, in force 2 May 1945"]
      - [Surrender at Reims, "7 May 1945, in force 8 May"]
