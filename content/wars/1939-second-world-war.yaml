  - title: Occupation, collaboration and resistance in the west
    date: 1940–1944
    when: "1942-11-11"
    borders: "1942-11-27"
    countries: [fr, be, nl, lu, it, de]
    body:
      - In the occupied west Germany ruled through military or civilian administrations and relied on local officials. Pétain met Hitler at Montoire in October 1940, and his regime at Vichy chose collaboration and passed its own anti-Jewish laws. The Netherlands was run by a German Reich Commissioner through Dutch civil servants, Belgium and northern France by a German military governor in Brussels. Luxembourg was annexed in August 1942, and when a general strike broke out against conscription into the German army, 21 strikers were sentenced to death. Between 600,000 and 650,000 French workers were sent to work in Germany.
      - The deportation of the Jews of the west began in 1942. In Paris French police arrested 13,152 Jews in the Vel d’Hiv round-up of 16–17 July, and trains left the camp at Drancy for Auschwitz-Birkenau. Of about 340,000 Jews in France some 72,500 were killed; most survived, many hidden by neighbours. From Westerbork about 97,800 Jews were sent to Auschwitz and Sobibór in occupied Poland, and about three-quarters of the Jews of the Netherlands died, among them Anne Frank. From Mechelen more than 25,000 Jews and Roma were deported; about 1,240 returned.
      - Resistance grew from small beginnings. In February 1941 some 300,000 people in and around Amsterdam struck in protest at the first round-ups of Jews. When the Allies landed in French North Africa, Germany occupied the rest of France on 11 November 1942 and Italy most of the south-east and Corsica, and on 27 November, as German troops entered Toulon, the French navy scuttled 77 ships. Forced labour drove thousands of young men into the maquis, and Jean Moulin united the main resistance movements under de Gaulle before his arrest in June 1943.
    facts:
      - [Germany occupies all of France, "11 November 1942"]
      - [Jews deported from France, "more than 75,000; about 72,500 killed"]
      - [Jews deported from Westerbork, "about 97,800"]
