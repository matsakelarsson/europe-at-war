  - title: The Battle of the Atlantic
    date: September 1939 – May 1945
    when: "1943-05-01"
    borders: "1943-05-24"
    countries: [gb, de, fr, is]
    body:
      - Britain depended on imports by sea, and Germany set out to cut them off. A U-boat sank the liner Athenia on the day Britain declared war, killing 117, and in October 1939 U-47 sank the battleship Royal Oak at anchor in Scapa Flow, killing 835. After the fall of France the U-boats operated from new bases on the Biscay coast, at Brest, Lorient, Saint-Nazaire and La Rochelle, hunting the convoys in “wolf packs”. In May 1941 the battleship Bismarck sank HMS Hood, killing all but three of her crew of 1,418, before British ships hunted her down three days later.
      - Merchant ships sailed in escorted convoys, and from September 1941 the United States, still neutral, escorted them in the western Atlantic. Losses peaked in 1942, when U-boats also struck off the American coast and the Arctic convoys to the Soviet Union suffered disasters such as PQ 17, of whose 35 ships only 11 arrived. In spring 1943 more escorts, long-range aircraft closing the mid-Atlantic air gap, radar and the breaking of German naval codes at Bletchley Park turned the battle. In “Black May” 43 U-boats were lost, and on 24 May Admiral Dönitz withdrew them from the North Atlantic.
    facts:
      - [Allied ships lost, "about 3,500 merchant ships and 175 warships"]
      - [U-boats lost, "783"]
      - [Dead, "about 72,000 Allied sailors and merchant seamen; 28,000–30,000 U-boat crew"]
