  - title: Partition, terror and uprising in Yugoslavia
    date: April 1941 – spring 1942
    when: "1941-07-04"
    borders: "1941-11-30"
    countries: [hr, ba, rs, me, de, it]
    body:
      - In the Independent State of Croatia, which included Bosnia and Herzegovina, Ante Pavelić’s Ustaša regime set out to rid the state of its nearly two million Serbs, and of its Jews and Roma. From late April 1941 Ustaša units massacred Serb villagers, as at Glina, many of them in its Orthodox church; others were forced to convert, expelled or sent to camps. At Jasenovac, opened in August 1941, some 77,000–99,000 people were killed by the USHMM’s estimate, about half of them Serbs; far higher and far lower figures are still argued over. In all the regime killed some 320,000–340,000 Serbs, and more than 30,000 of its Jews were murdered in its camps or at Auschwitz.
      - Resistance grew in the summer. In Serbia Colonel Draža Mihailović’s royalist Chetniks gathered on Ravna Gora, and after Germany invaded the Soviet Union the Communist Party under Josip Broz Tito called for a rising. Serbs in Bosnia and Croatia rose against the Ustaše, and Montenegro rose against the Italians on 13 July. Partisans and Chetniks together freed much of western Serbia, with its centre at Užice. The Germans answered with a rule of 100 hostages shot for every German soldier killed and 50 for every one wounded, and in October they shot about 2,000 people at Kraljevo and some 2,800 at Kragujevac, among them schoolboys.
      - Mihailović feared the cost of reprisals and distrusted the communists, and in November the two movements turned on each other. A German offensive then retook Užice and drove the Partisans into Bosnia and Montenegro. Most of the Jewish men of Serbia had been shot as hostages that autumn; in the spring of 1942 the women and children held at the Sajmište camp in Belgrade were murdered in a gas van. Chetnik units, some of them working with the Italians, massacred Muslims and Croats in eastern Bosnia and the Sandžak, as at Foča, and killed tens of thousands by the end of the war.
    facts:
      - [Independent State of Croatia proclaimed, "10 April 1941"]
      - [Killed at Jasenovac, "about 77,000–99,000 (USHMM estimate)"]
      - [Kragujevac massacre, "21 October 1941, about 2,800 killed"]
