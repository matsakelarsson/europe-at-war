        text: The casemates at the end of the Afsluitdijk stopped a German advance across the dike towards North Holland.
        lonlat: [5.333, 53.073]
      - kind: battle
        side: de
        name: Grebbeberg
        date: 11–13 May 1940
        text: German troops broke through the main Dutch defence line after three days of fighting.
        lonlat: [5.6, 51.954]
      - kind: air
        side: de
        name: Rotterdam
        date: 14 May 1940
        text: Bombing destroyed the old city centre, killing 711 people and leaving about 85,000 homeless. The Netherlands surrendered that evening.
        lonlat: [4.48, 51.92]
        lp: l
      - kind: battle
