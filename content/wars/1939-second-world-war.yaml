notes:
  - The Soviet Union was Germany’s partner under the Molotov–Ribbentrop Pact from August 1939 until Germany invaded it on 22 June 1941, and then fought on the Allied side.
  - Numbers of dead are estimates, and the sources give ranges for most of them. Places in present-day Poland are named in their Polish forms, with German names of the time where useful.
  - "The map shows the annexations recognised in practice at the time: Germany’s in Poland and the General Government, Alsace-Moselle, Luxembourg and Eupen-Malmedy; the German and Romanian occupation of the Soviet Union at six dates between July 1941 and December 1944; the partition of Yugoslavia from April 1941, region by region until its liberation in 1944–45; and the Bulgarian annexation of eastern Macedonia and Western Thrace. Other occupations are drawn as approximate areas in the steps: Denmark, Norway, the Low Countries and France, the German, Italian and Bulgarian zones in Greece, Italy after September 1943, Hungary in 1944, Partisan territory and the fronts."
  - "Places in the former Yugoslavia are named in their present forms, with Italian, German or Hungarian names of the time where useful; Albanian places are named in Albanian, with Greek names where the Greek army used them."
  - "The numbers of people killed in the Ustaša camps, by the Chetniks, in German and Bulgarian reprisals and after the surrender at Bleiburg are disputed, sometimes bitterly, between the countries of the former Yugoslavia and between historians. The figures given here are those of the United States Holocaust Memorial Museum where it gives them, or the range given by the sources listed, and are approximate."
