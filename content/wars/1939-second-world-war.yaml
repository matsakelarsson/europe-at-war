        lonlat: [21.0, 52.25]
        lp: l
      - kind: event
        name: Treblinka
        date: July 1942 – 1943
        text: Estimates of the Jews murdered here range from about 700,000 to 925,000, among them most of the Warsaw Ghetto.
        lonlat: [22.053, 52.631]
      - kind: event
