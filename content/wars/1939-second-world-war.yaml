steps:
  - title: The invasion of Poland
    date: 1 September 1939
    when: "1939-09-01"
    borders: "1939-09-01"
    countries: [pl, de]
    body:
      - On 23 August 1939 Germany and the Soviet Union signed a non-aggression pact whose secret protocol divided eastern Europe between them, Poland included. A week later, after SS men staged a fake Polish attack on a German radio station at Gleiwitz, Germany invaded. Early on 1 September German aircraft bombed the small town of Wieluń, and the old battleship Schleswig-Holstein opened fire on the Polish depot at Westerplatte in the Free City of Danzig.
      - German and Slovak forces attacked from the west, from East Prussia in the north and from Slovakia in the south. Britain and France declared war on Germany on 3 September but gave Poland little practical help. The Polish army, spread along a long frontier and outmatched in tanks and aircraft, fought hard in places, as at Mokra, where a cavalry brigade held off a panzer division for a day. Within a week, though, German armoured columns had broken through.
    facts:
      - [German invasion, "1 September 1939"]
      - [Britain and France declare war, "3 September 1939"]
      - [Westerplatte surrenders, "7 September 1939"]
    markers:
      - kind: air
        side: de
        name: Wieluń
        date: 1 September 1939
        text: Bombed from about 04:40, one of the first acts of the war. About 70 per cent of the town was destroyed; estimates of the dead range from 127 to several hundred.
        lonlat: [18.57, 51.221]
      - kind: siege
        side: de
        name: Westerplatte
        date: 1–7 September 1939
        text: A garrison of about two hundred held the Polish military depot for a week against shelling, bombing and assaults.
        lonlat: [18.671, 54.408]
        lp: t
      - kind: taken
        side: de
        name: Polish Post Office, Danzig
        date: 1 September 1939
        text: Polish postal staff held the building for some 15 hours. Most survivors were sentenced to death by a German court martial and shot in October.
        lonlat: [18.657, 54.355]
        lp: l
      - kind: event
        name: Gleiwitz incident
        date: 31 August 1939
        text: SS men disguised as Polish insurgents seized a German radio station to give Germany a pretext for war.
        lonlat: [18.67, 50.29]
      - kind: battle
        side: pl
        name: Battle of Mokra
        date: 1 September 1939
        text: The Wołyńska Cavalry Brigade held off the German 4th Panzer Division for a day before withdrawing.
        lonlat: [18.917, 50.967]
    arrows:
      - side: de
        label: 4th Army
        via: [[16.9, 53.75], [17.9, 53.55], [18.75, 53.35]]
      - side: de
