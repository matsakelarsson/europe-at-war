  - title: The Bzura and the siege of Warsaw
    date: 8–29 September 1939
    when: "1939-09-09"
    borders: "1939-09-16"
    countries: [pl]
    body:
      - German armour reached the outskirts of Warsaw on 8 September, but the city’s defenders beat off the first attacks. The next day General Tadeusz Kutrzeba, whose Poznań and Pomorze armies had been bypassed in the west, struck south across the Bzura into the flank of the German 8th Army. It became the largest battle of the campaign. After early success the Poles were surrounded and pounded from the air, and by 19 September the pocket had collapsed, though some units broke through the Kampinos Forest to Warsaw.
      - Warsaw, defended by soldiers and civilians alike, was shelled and bombed for three weeks. About 18,000 civilians died before the city surrendered on 28 September, its water and power cut. The fortress of Modlin held out until 29 September and the Hel peninsula until 2 October. By then the Polish government and high command had left the country.
    facts:
      - [Battle of the Bzura, "9–19 September 1939"]
      - [Civilian dead in Warsaw, "about 18,000"]
      - [Warsaw surrenders, "28 September 1939"]
    markers:
      - kind: battle
        side: de
        name: Battle of the Bzura
        date: 9–19 September 1939
        text: The Polish counter-attack from the west threw the Germans back some 20 km before the Poles were encircled. It was the largest battle of the campaign.
        lonlat: [19.65, 52.15]
      - kind: siege
        side: de
        name: Warsaw
        date: 8–28 September 1939
        text: The capital held out for three weeks under siege, shelling and bombing.
        lonlat: [21.01, 52.23]
      - kind: siege
        side: de
        name: Modlin
        date: until 29 September 1939
        text: The fortress north-west of Warsaw surrendered a day after the capital.
        lonlat: [20.682, 52.438]
      - kind: held
        side: pl
        name: Hel
        date: until 2 October 1939
        text: The fortified peninsula on the Baltic was one of the last places to give up.
        lonlat: [18.808, 54.612]
    arrows:
      - side: pl
        label: Kutrzeba
        via: [[19.3, 52.4], [19.6, 52.15], [19.9, 51.9]]
      - side: pl
        via: [[20.2, 52.25], [20.6, 52.32], [20.92, 52.27]]
      - side: de
        label: 4th Panzer Division
        via: [[19.5, 51.35], [20.35, 51.8], [20.93, 52.2]]
  - title: The Soviet invasion
    date: 17 September – October 1939
    when: "1939-09-17"
    borders: "1939-09-17"
    countries: [pl, by, ua]
    body:
      - On 17 September the Red Army crossed Poland’s eastern border with between about 450,000 and more than 800,000 men, by different estimates, claiming that the Polish state had ceased to exist and that Ukrainians and Belarusians needed protection. The Polish commander-in-chief, Marshal Edward Rydz-Śmigły, ordered his troops not to fight the Soviets except in self-defence, and the government and high command crossed into Romania. Up to 120,000 Polish soldiers escaped into Romania, and others into Hungary and Lithuania, many of them later to fight on in France.
      - Some units fought anyway. Grodno was defended for three days, and afterwards Soviet troops murdered about 300 of its defenders, including teenage boys. On 22 September Lwów, besieged first by the Germans and then by the Soviets, surrendered to the Red Army, and German and Soviet troops held a joint parade in Brest the same day. At Szack on 28 September Polish border troops beat a Soviet division. Some captured Polish officers were shot on the spot, and thousands of others were murdered at Katyn the following spring.
    facts:
      - [Soviet invasion, "17 September 1939"]
      - [Lwów surrenders, "22 September 1939"]
      - [Polish soldiers captured by the USSR, "about 240,000"]
    markers:
      - kind: battle
        side: su
        name: Grodno
        date: 20–22 September 1939
        text: Soldiers, police and civilians, among them schoolboys, held the city for three days against Soviet tanks.
        lonlat: [23.833, 53.667]
      - kind: event
        name: Brest
        date: 22 September 1939
        text: German troops, who had taken the fortress, handed it to the Red Army after a joint parade.
        lonlat: [23.658, 52.082]
      - kind: battle
        side: pl
        name: Battle of Szack
        date: 28 September 1939
        text: The Border Protection Corps beat the Soviet 52nd Rifle Division as it fought its way west to join the remaining Polish forces.
        lonlat: [23.93, 51.488]
      - kind: battle
        side: de
        name: Tomaszów Lubelski
        date: 18–20 September 1939
        text: The second-largest battle of the campaign and its largest tank battle. Army Kraków, trying to break through to the south-east, surrendered on 20 September.
        lonlat: [23.417, 50.45]
      - kind: taken
        side: su
        name: Lwów
        date: 22 September 1939
        text: After a German siege, the city surrendered to the Red Army, which had arrived from the east.
        lonlat: [24.032, 49.843]
      - kind: event
        name: Kuty
        date: 17–18 September 1939
        text: The Polish president, government and high command crossed the bridge into Romania here and were interned.
        lonlat: [25.167, 48.257]
    arrows:
      - side: su
        label: Belarusian Front
        via: [[27.5, 54.0], [25.5, 53.8], [23.95, 53.68]]
      - side: su
        label: Ukrainian Front
        via: [[27.0, 50.0], [25.8, 50.0], [24.15, 49.85]]
  - title: Surrender and partition
    date: 28 September – November 1939
    when: "1939-09-28"
    borders: "1939-10-06"
    countries: [pl, by, ua, lt]
    body:
      - Warsaw surrendered on 28 September. The same day Germany and the Soviet Union signed a Boundary and Friendship Treaty that moved the line between them east from the Vistula to the Bug, while most of Lithuania passed to the Soviet sphere. The last Polish field force, General Franciszek Kleeberg’s group, fought German troops at Kock until 5 October and surrendered the next day. About 65,000 Polish soldiers had been killed, and about 420,000 captured by Germany.
      - Germany annexed western Poland, including Danzig, Pomerania, Greater Poland and Upper Silesia, and ruled the centre as the General Government under Hans Frank from Kraków. The Soviet Union held staged elections in the east and annexed it to Soviet Belarus and Ukraine in November, giving Vilnius to Lithuania. A Polish government-in-exile formed in France under General Władysław Sikorski, and an underground army began to organise at home.
    facts:
      - [Boundary and Friendship Treaty, "28 September 1939, Moscow"]
      - [Battle of Kock, "2–5 October 1939"]
      - [General Government, "set up 26 October 1939"]
    markers:
      - kind: taken
        side: de
        name: Warsaw
        date: 28 September 1939
        text: The capital surrendered after three weeks of siege, and German troops entered on 1 October.
        lonlat: [21.01, 52.23]
      - kind: battle
        name: Battle of Kock
        date: 2–5 October 1939
        text: Kleeberg’s group, formed from units still fighting in the east, fought the last battle of the campaign and surrendered on 6 October.
        lonlat: [22.433, 51.633]
      - kind: event
        side: de
        name: Kraków
        date: 26 October 1939
        text: Seat of the General Government, the German-ruled rump of central Poland under Governor-General Hans Frank.
        lonlat: [19.937, 50.061]
      - kind: event
        name: Vilnius
        date: 28 October 1939
        text: The Soviet Union handed the city and its region to Lithuania, in return for Soviet bases there.
        lonlat: [25.28, 54.687]
  - title: Two occupations and Katyn
    date: 1939–1941
    when: "1939-10"
    borders: "1940-05-01"
    countries: [pl, by, ua, ru]
    body:
      - Both occupiers set out to destroy Poland’s leaders and educated class. In the annexed lands German units and local ethnic German militias shot tens of thousands of Poles in 1939 and 1940, many of them in the Piaśnica forest in Pomerania, and the AB-Aktion of 1940 killed thousands more in the General Government, among them those shot at Palmiry near Warsaw. Hundreds of thousands of Poles were expelled from the annexed lands, Jews were forced into ghettos, and in June 1940 the first prisoners arrived at a new camp at Auschwitz.
      - In the Soviet zone the NKVD arrested officials, officers, landowners and community leaders, and from February 1940 deported whole families to Siberia and Kazakhstan; estimates of the number range from about 350,000 to 1.5 million. On 5 March 1940 the Soviet Politburo ordered the shooting of Polish officers, police and others held in its camps. In April and May nearly 22,000 were killed, at Katyn near Smolensk, at Kalinin and at Kharkiv. The Soviet Union blamed Germany until 1990.
    facts:
      - [Katyn massacre, "April–May 1940, nearly 22,000 killed"]
      - [Soviet deportations, "about 350,000 to 1.5 million (estimates)"]
      - [First prisoners at Auschwitz, "14 June 1940"]
    markers:
      - kind: event
        name: Katyn
        date: April–May 1940
        text: Prisoners from the Kozelsk camp, most of them officers, were shot in the forest here. Germany announced the discovery of the graves in 1943; the Soviet Union admitted responsibility in 1990.
        lonlat: [31.79, 54.772]
      - kind: event
        name: Piaśnica
        date: autumn 1939
        text: Thousands of Poles, Kashubians and others from Pomerania were shot in the forest here in the first months of occupation.
        lonlat: [18.063, 54.834]
      - kind: event
        name: Palmiry
        date: 1940–1941
        text: A forest north-west of Warsaw where the Germans secretly shot politicians, athletes, writers and other prisoners.
        lonlat: [20.783, 52.367]
      - kind: event
        name: Auschwitz
        date: 14 June 1940
        text: The camp opened with a transport of Polish political prisoners. It later became the largest German killing centre.
        lonlat: [19.178, 50.036]
    arrows:
      - side: su
        label: Deportations east
        via: [[25.0, 52.6], [28.5, 53.6], [32.2, 54.4]]
  - title: Denmark and Norway invaded
    date: 9 April – 10 June 1940
    when: "1940-04-09"
    borders: "1940-04-09"
    countries: [dk, no, de, gb, fr]
    body:
      - Early on 9 April 1940 Germany invaded Denmark and Norway, to secure the shipping route for Swedish iron ore and bases on the North Atlantic before Britain could. German troops crossed the Danish border at 04:15 and landed in Copenhagen, and paratroopers took the airfields at Aalborg. After brief fighting the Danish government accepted the occupation within hours. In Norway, landings from sea and air took Bergen, Trondheim and Narvik, but in the Oslofjord the guns and torpedoes of Oscarsborg fortress sank the cruiser Blücher, delaying the capture of Oslo long enough for the king and government to escape.
      - King Haakon VII refused German demands to appoint the Norwegian fascist leader Vidkun Quisling as prime minister, and Norway fought on. British, French and Polish troops landed in central Norway but were evacuated by early May; in the north some 38,000 landed near Narvik. The Royal Navy sank ten German destroyers there on 10 and 13 April, and Allied and Norwegian troops retook the town on 28 May. By then Germany had invaded France, and the Allies withdrew. The king left Tromsø for Britain on 7 June, and the Norwegian forces capitulated on 10 June, after 62 days.
    facts:
      - [Invasion, "9 April 1940"]
      - [Danish resistance, "about six hours"]
      - [Norwegian capitulation, "10 June 1940"]
    markers:
      - kind: taken
        side: de
        name: Copenhagen
        date: 9 April 1940
        text: Troops landed from a ship at Langelinie and took the Citadel almost unopposed. The king and government accepted the occupation that morning.
        lonlat: [12.594, 55.691]
      - kind: taken
        side: de
        name: Aalborg
        date: 9 April 1940
        text: German paratroopers seized the airfields, which became a base for the attack on Norway.
        lonlat: [9.849, 57.093]
      - kind: naval
        side: no
        name: Oscarsborg
        date: 9 April 1940
        text: The fortress in the Drøbak Sound sank the heavy cruiser Blücher; an estimated 650–800 Germans died.
        lonlat: [10.607, 59.674]
        lp: b
      - kind: taken
        side: de
        name: Fornebu
        date: 9 April 1940
        text: Airborne troops took Oslo’s airport, and the capital was occupied that afternoon.
        lonlat: [10.598, 59.89]
        lp: l
      - kind: battle
        side: no
        name: Midtskogen
