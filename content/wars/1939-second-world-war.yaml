  - title: Romania and Bulgaria change sides
    date: August – October 1944
    when: "1944-08-23"
    borders: "1944-10-20"
    countries: [ro, bg, hu, de]
    body:
      - Romania had sent its armies against the Soviet Union in 1941, and two of them were shattered at Stalingrad. Under Marshal Ion Antonescu, Romanian forces and officials also murdered Jews on a vast scale, in the Iași pogrom of June 1941 and in Bessarabia, Bukovina and Transnistria; most estimates of the dead range from 250,000 to 380,000. When the Soviet offensive broke through near Iași in August 1944, King Michael had Antonescu arrested on 23 August and took Romania over to the Allies. German aircraft bombed Bucharest in reply, Romania declared war on Germany, and the Red Army reached the Ploiești oilfields on 30 August and Bucharest the next day.
      - Bulgaria had joined the Axis but never declared war on the Soviet Union, and its army occupied parts of Yugoslavia and Greece rather than fighting in the east. After protests by members of parliament and church leaders in 1943 it did not hand over its own 48,000 Jews, but it deported more than 11,000 from the occupied lands to be murdered at Treblinka. On 5 September 1944 the Soviet Union declared war on Bulgaria, and Soviet troops crossed the border three days later without meeting resistance. On 9 September the communist-led Fatherland Front seized power in Sofia, Bulgaria changed sides, and its army fought on against the Germans in Yugoslavia and Hungary.
      - With Romania’s turn the German front in the Balkans fell apart. Romanian and Soviet troops pushed into northern Transylvania, held by Hungary since 1940, fought for a month around Turda and took Cluj on 11 October. On the plains of eastern Hungary a great tank battle around Debrecen in October slowed the Soviet advance but did not stop it. In both Romania and Bulgaria Soviet occupation opened the way to communist rule.
    facts:
      - [Romanian coup, "23 August 1944"]
      - [Fatherland Front coup in Bulgaria, "9 September 1944"]
      - [Jews killed under Romanian rule, "about 250,000–380,000 (estimates)"]
    markers:
      - kind: event
        side: ro
        name: Bucharest
        date: 23 August 1944
        text: King Michael had Antonescu arrested at the palace and announced the change of sides on the radio. German bombers struck the city on 24–26 August.
        lonlat: [26.104, 44.433]
      - kind: taken
        side: su
        name: Ploiești
        date: 30 August 1944
        text: The refineries that had supplied much of Germany’s oil, bombed by the Americans since 1943, fell to Soviet and Romanian troops.
        lonlat: [26.023, 44.941]
      - kind: event
        name: Iași
        date: June – July 1941
        text: Romanian police and soldiers, with German troops, killed more than 13,000 Jews in the city and in sealed ‘death trains’.
        lonlat: [27.589, 47.162]
      - kind: event
        name: Sofia
        date: 9 September 1944
        text: The Fatherland Front, with army officers of the Zveno group, took power overnight, and Kimon Georgiev became prime minister.
        lonlat: [23.33, 42.7]
      - kind: battle
        side: su
        name: Turda
        date: 5 September – 8 October 1944
        text: Soviet and Romanian troops fought for a month against Hungarian and German forces holding the approaches to Cluj.
        lonlat: [23.786, 46.569]
      - kind: battle
        side: su
        name: Debrecen
        date: 6–29 October 1944
        text: One of the largest tank battles of the war in the south. The Soviets took Debrecen on 20 October, though German counter-attacks around Nyíregyháza cost them heavily.
        lonlat: [21.624, 47.532]
