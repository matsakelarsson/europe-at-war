  - title: The end in Yugoslavia, Trieste and Bleiburg
    date: January – June 1945
    when: "1945-04-12"
    borders: "1945-05-15"
    countries: [rs, hr, ba, si, it, at, de, gb]
    move_names:
      ndh: Retreat of the Croatian forces and civilians
    body:
      - Through the winter of 1944–45 the Partisans, renamed the Yugoslav Army in March, fought a costly positional war against German and Croatian forces on the Syrmian Front west of Belgrade, while the German Army Group E withdrew from Greece through Bosnia. Mostar was taken in February and Sarajevo on 6 April. On 12 April the Yugoslav 1st Army broke through in Syrmia, and in the west the 4th Army advanced up the Adriatic coast and into Istria. It reached Trieste on 1 May, a day before New Zealand troops of the Eighth Army, and held the city for forty days, arresting thousands of people, many of whom were killed, until an agreement in June left it under Allied control.
      - At the end of the war the government and army of the Independent State of Croatia, with tens of thousands of civilians, Slovene Home Guards and Montenegrin Chetniks, fled north to surrender to the British in Austria. On 15 May the British at Bleiburg refused the surrender of the main Croatian column and directed it to the Partisans, and later they handed back many who had already reached Austria. The Yugoslav authorities shot prisoners without trial in their tens of thousands, at Tezno near Maribor, Kočevski Rog, Macelj and many other places, and others died on forced marches to camps. Most of the dead had served in the Axis-aligned forces, but there were civilians among them.
      - The number of victims is not known. Estimates range widely, from 20,000–40,000 in some historians’ work to 70,000–80,000 in others; the demographer Vladimir Žerjavić calculated 57,000–65,000, and émigré accounts gave figures in the hundreds of thousands. Slovenia has registered more than 600 concealed mass graves from the war and its aftermath. Under communist rule the killings could not be spoken of; since the 1990s the yearly commemoration at Bleiburg has been disputed, over both the numbers and the Ustaša symbols displayed there.
    facts:
      - [Syrmian Front broken, "12 April 1945"]
      - [Yugoslav troops enter Trieste, "1 May 1945"]
      - [Surrender at Bleiburg, "15 May 1945"]
