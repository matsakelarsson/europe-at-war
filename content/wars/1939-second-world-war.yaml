  - title: The Holocaust and the Warsaw Ghetto Uprising
    date: 1940–1943
    when: "1942-07-22"
    borders: "1942-07-22"
    countries: [pl, by, ua, lt]
    body:
      - Before the war about 3.3 million Jews lived in Poland, the largest Jewish community in Europe. Under German rule they were forced into ghettos. In Warsaw some 400,000 people were shut into about 3.4 km², and tens of thousands died there of hunger and typhus. After Germany invaded the Soviet Union in June 1941, its mobile killing units shot Jews in hundreds of thousands across the east. In some places local people joined in, as at Jedwabne on 10 July 1941, where Polish inhabitants, working with the Germans, murdered hundreds of their Jewish neighbours.
      - From December 1941 Germany opened death camps to murder the Jews of Poland and of Europe. Chełmno came first, then Bełżec, Sobibór and Treblinka, and gas chambers were built at Auschwitz-Birkenau and Majdanek. Between 22 July and 21 September 1942 more than 250,000 people from the Warsaw Ghetto were taken to Treblinka and gassed. About 3 million Polish Jews, some 90 per cent, were murdered. Poles who hid Jews risked death with their families; from late 1942 the underground Council to Aid Jews, Żegota, helped thousands, while others betrayed Jews to the Germans.
      - When German forces entered the Warsaw Ghetto on 19 April 1943 to deport its last inhabitants, the Jewish Combat Organisation under Mordechai Anielewicz and the Jewish Military Union fought back with pistols, a few rifles and home-made bombs. It was the largest Jewish revolt of the war. SS General Jürgen Stroop’s troops burned the ghetto building by building, and on 16 May he blew up the Great Synagogue. Stroop reported 56,065 Jews killed or captured; most of those captured were sent to Treblinka, Majdanek and labour camps.
    facts:
      - [Polish Jews murdered, "about 3 million, some 90 per cent"]
      - [Deportations from Warsaw, "22 July – 21 September 1942"]
      - [Warsaw Ghetto Uprising, "19 April – 16 May 1943"]
    markers:
