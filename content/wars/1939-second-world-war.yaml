  - title: The Slovak National Uprising
    date: 29 August – 28 October 1944
    when: "1944-08-29"
    borders: "1944-09-15"
    countries: [sk, cz, pl, de]
    side_names:
      sk: Insurgent success
    move_names:
      sk: Insurgent moves
    body:
      - Slovakia, a German client state under the priest Jozef Tiso, had handed some 58,000 of its Jews over to the Germans in 1942, nearly all of whom were murdered. By 1944 army officers, communists and democrats had formed an underground Slovak National Council and planned a rising for when the Red Army reached the Carpathians. Partisan attacks brought German troops into the country first, and on 29 August 1944 the council called the rising from Banská Bystrica. Some 60,000 soldiers and up to 18,000 partisans held much of central Slovakia, but the two divisions in the east that were to open the Carpathian passes to the Soviets were disarmed by the Germans.
      - The Soviet army and the 1st Czechoslovak Army Corps attacked across the Dukla Pass on 8 September to reach the insurgents, but it took them until 6 October to fight their way through, with heavy losses, and they could not break through to central Slovakia. Supplies and the 2nd Czechoslovak Parachute Brigade were flown in to the Tri Duby airfield. Reinforced German forces closed in during October, and Banská Bystrica fell on 27 October. The insurgent army dissolved into the mountains; its commanders, Generals Ján Golian and Rudolf Viest, were captured and died in German hands.
      - Reprisals followed. Einsatzkommando 14 and the Hlinka Guard’s emergency units shot 747 people at Kremnička, near Banská Bystrica, and killed and burned some 900 at Nemecká; many of the dead were Jews and Roma. The rising gave the Germans a pretext to deport most of Slovakia’s remaining Jews, more than 10,000 of them, to Auschwitz and other camps. In the insurgent area itself up to 1,500 people, most of them local Germans, had been killed.
    facts:
      - [Slovak National Uprising, "29 August – 28 October 1944"]
