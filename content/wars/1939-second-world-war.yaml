        text: The German 9th Army, trapped south-east of Berlin, was destroyed as a fighting force trying to break out to the west.
        lonlat: [13.701, 52.107]
      - kind: taken
        side: su
        name: Reichstag
        date: 30 April – 2 May 1945
        text: The photograph of a Soviet flag raised over the building became the best-known image of the victory.
        lonlat: [13.376, 52.519]
        lp: l
      - kind: treaty
        name: Karlshorst
        date: 8 May 1945
        text: German commanders signed the final unconditional surrender before Soviet, British, American and French representatives.
        lonlat: [13.54, 52.486]
