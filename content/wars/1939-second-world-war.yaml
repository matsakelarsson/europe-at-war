  - title: The bombing of Germany and the V-weapons
    date: 1942–1945
    when: "1943-07-24"
    borders: "1943-07-28"
    countries: [de, gb, be, nl]
    body:
      - From February 1942 RAF Bomber Command, led by Arthur Harris, bombed German cities at night, aiming at whole urban areas to destroy industry and break civilian morale. A thousand bombers struck Cologne on 30–31 May 1942. In 1943 the US Eighth Air Force joined by day, though its raids on the ball-bearing factories of Schweinfurt cost heavy losses, and in May British bombers breached the Möhne and Eder dams; the floods killed about 1,600 people, most of them forced labourers. In late July 1943 raids on Hamburg raised a firestorm that killed some 35,000–40,000 people.
      - The bombing grew heavier until 1945, against Berlin from November 1943, oil plants and railways, and cities such as Dresden, where raids on 13–15 February 1945 killed up to 25,000 people. Estimates of German civilian deaths range from about 305,000 to 350,000 or more, and Bomber Command lost 55,573 aircrew. Germany struck back with “vengeance weapons”. From June 1944 V-1 flying bombs killed about 6,200 people in the London area, and from September V-2 rockets hit London, Antwerp and Liège, killing about 9,000; some 12,000 forced labourers died building them.
    facts:
      - [German civilians killed, "about 305,000–350,000 or more"]
      - [Bomber Command aircrew killed, "55,573"]
      - [Killed by V-2 rockets, "about 9,000, and some 12,000 forced labourers in their production"]
    markers:
      - kind: air
        side: allies
        name: Cologne
        date: 30–31 May 1942
        text: The first raid by a thousand bombers burned out much of the city.
        lonlat: [6.958, 50.941]
      - kind: air
        side: allies
        name: Möhne Dam
        date: 16–17 May 1943
        text: Bouncing bombs breached the dam; the floods from it and the Eder dam killed about 1,600 people, most of them forced labourers.
        lonlat: [8.072, 51.483]
      - kind: air
        side: allies
        name: Hamburg
        date: 24 July – 3 August 1943
        text: In Operation Gomorrah a firestorm on the night of 27–28 July killed most of the 35,000–40,000 dead.
        lonlat: [10.0, 53.55]
      - kind: air
        side: allies
        name: Dresden
        date: 13–15 February 1945
        text: British and American raids raised a firestorm; a historians’ commission put the dead at up to 25,000.
        lonlat: [13.742, 51.052]
      - kind: air
        side: allies
        name: Peenemünde
        date: 17–18 August 1943
        text: Bombers struck the rocket research centre, delaying the V-2 programme and moving production underground.
        lonlat: [13.8, 54.15]
      - kind: event
        name: Mittelbau-Dora
        date: 1943–1945
        text: Prisoners built V-2s in tunnels under the Kohnstein hill; about one in three of some 60,000 prisoners died.
        lonlat: [10.749, 51.535]
      - kind: air
        side: de
        name: London
        date: June 1944 – March 1945
        text: V-1 flying bombs, launched from northern France, killed about 6,200 people in the London area, and V-2 rockets thousands more.
        lonlat: [-0.12, 51.51]
      - kind: air
        side: de
        name: Antwerp
        date: October 1944 – March 1945
        text: The port was the main target of V-weapons after London. On 16 December 1944 a V-2 hit the Cinema Rex and killed 567 people.
        lonlat: [4.417, 51.218]
