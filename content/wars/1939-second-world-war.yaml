      - kind: battle
        side: su
        name: Seelow Heights
        date: 16–19 April 1945
        text: Zhukov’s frontal assault on the fortified heights above the Oder broke through only after heavy losses on both sides.
        lonlat: [14.426, 52.53]
      - kind: event
        name: Torgau
        date: 25 April 1945
        text: American and Soviet soldiers met at the damaged Elbe bridge, celebrated since as Elbe Day.
        lonlat: [13.006, 51.56]
