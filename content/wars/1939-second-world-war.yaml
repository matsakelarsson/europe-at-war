  - title: The Neretva, the Sutjeska and the Italian surrender
    date: January – November 1943
    when: "1943-01-20"
    borders: "1943-11-29"
    countries: [ba, hr, me, gr, al, de, it, gb]
    body:
      - By 1943 the Partisans held large parts of Bosnia and Croatia, and the Axis set out to destroy them. In Operation Weiss, from January to March, German, Italian and Croatian troops, with Chetnik units fighting alongside the Italians, drove Tito’s main force south-east through Bosnia. Rather than abandon some 4,000 sick and wounded, the Partisans crossed the Neretva at Jablanica on a makeshift bridge and scattered the Chetniks waiting on the far bank. In May the Axis struck again with about 127,000 men in Operation Schwarz. Surrounded on the Sutjeska, the Partisans broke out in June, losing some 7,000 killed and wounded, about a third of their force, and Tito himself was wounded.
      - Italy’s armistice, announced on 8 September 1943, left its armies in the Balkans and Greece without orders. The Germans disarmed most of them and sent many of the men to Germany as forced labourers. On Cephalonia the Acqui Division fought back; after it surrendered on 22 September German troops shot about 5,000 of its men, among them General Antonio Gandin. The Partisans seized Italian weapons and, for a time, much of the Dalmatian coast. Germany took over Albania, Montenegro and the Italian zone of Greece, and in November it took Leros in the Dodecanese from its British and Italian garrison.
      - On 29 November, at Jajce in Partisan-held Bosnia, the Anti-Fascist Council for the National Liberation of Yugoslavia (AVNOJ) declared itself the country’s supreme legislative and executive body, set up a provisional government under Tito, now a marshal, and barred King Peter II from returning until the people had decided. At Tehran the same week the Allied leaders agreed to support the Partisans, and Britain ended its support for Mihailović in early 1944, as his Chetniks were by then working with the Germans in many places.
    facts:
      - [Battle of the Sutjeska, "15 May – 16 June 1943"]
      - [Italian armistice announced, "8 September 1943"]
      - [Second session of AVNOJ, "29–30 November 1943, Jajce"]
