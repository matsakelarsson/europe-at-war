  - title: The liberation of Greece, Belgrade and Albania
    date: May – November 1944
    when: "1944-10-12"
    borders: "1944-11-29"
    countries: [gr, rs, al, mk, ba, de, bg, gb]
    side_names:
      partisans: Partisan and resistance success
    link: { href: "#/war/greek-civil-war", text: The December fighting in Athens and the Greek Civil War }
    body:
      - In May 1944 German paratroopers landed at Drvar in an attempt to seize Tito, who escaped and moved to the Adriatic island of Vis, protected by the Allies. Britain and the United States now supplied the Partisans and flew out their wounded, and King Peter’s government in exile came to terms with Tito. In September, as Romania and Bulgaria changed sides, Germany ordered its armies in Greece and the southern Balkans to withdraw north before they were cut off. Tito flew secretly to Moscow and agreed with Stalin that the Red Army would help to free Belgrade and leave the civil administration to the Partisans.
      - The Germans left Athens on 12 October, British troops landed at Piraeus two days later, and the government of national unity under Georgios Papandreou arrived on 18 October. ELAS entered Thessaloniki on 30 October, and by early November the Germans had left mainland Greece, though they held western Crete and some islands until May 1945. In Albania communist-led partisans under Enver Hoxha took Tirana on 17 November and the whole country by the end of the month. In Greece the uneasy truce between ELAS and the government lasted only weeks.
      - In Serbia the Soviet 3rd Ukrainian Front and the Partisans’ 1st Army Group, with Bulgarian armies to the south, attacked in October, and after a week of street fighting Belgrade was freed on 20 October. Soviet troops then turned north into Hungary, while the Partisans faced a German front across Syrmia. Behind the front the new authorities shot thousands of people accused of collaboration across Serbia, and in Vojvodina Partisan units killed thousands of ethnic Hungarians and interned the local Germans in camps, where many died.
    facts:
      - [Athens freed, "12 October 1944"]
      - [Belgrade freed, "20 October 1944"]
      - [Tirana freed, "17 November 1944"]
