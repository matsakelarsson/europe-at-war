  - title: The Warsaw Uprising
    date: 1 August – 2 October 1944
    when: "1944-08-01"
    borders: "1944-08-01"
    countries: [pl]
    body:
      - By the end of July 1944 the Red Army had reached the Vistula south of Warsaw and was approaching the eastern suburb of Praga. The Home Army, the underground force loyal to the government-in-exile in London, rose in the city on 1 August, hoping to free it before the Soviets arrived and to show that Poland meant to be independent. Between 20,000 and 49,000 fighters, few of them well armed, took much of the centre and Old Town, but failed to capture the bridges and the main German strongpoints.
      - Germany sent SS and police units to crush the rising, and in the Wola district they massacred some 40,000–50,000 civilians in the first days. The Soviet army halted east of the river and at first refused Allied supply aircraft the use of its airfields. It took Praga in mid-September, and Polish troops under Soviet command crossed to Czerniaków but were driven back. The Home Army surrendered on 2 October after 63 days. The Germans then drove out the remaining inhabitants and systematically destroyed the city.
    facts:
      - [Warsaw Uprising, "1 August – 2 October 1944"]
      - [Insurgents killed, "about 16,000"]
      - [Civilians killed, "about 150,000–200,000"]
    markers:
      - kind: siege
        side: de
        name: Warsaw
        date: 1 August – 2 October 1944
        text: The Home Army held parts of the city for 63 days. In the first days German units massacred tens of thousands of civilians in Wola.
        lonlat: [21.0, 52.24]
        lp: l
      - kind: taken
        side: su
        name: Praga
        date: mid-September 1944
        text: The Red Army and Polish units took the east-bank suburb, but did not cross in strength to help the insurgents.
        lonlat: [21.07, 52.25]
      - kind: event
        name: Pruszków
        date: from August 1944
        text: Hundreds of thousands of Warsaw’s inhabitants were driven through a transit camp here; many were sent on to concentration camps or forced labour.
        lonlat: [20.8, 52.167]
        lp: l
