  - title: The fall of Berlin
    date: April – May 1945
    when: "1945-04-16"
    borders: "1945-05-08"
    countries: [de, pl]
    body:
      - By the spring of 1945 the Red Army stood on the Oder and the Neisse, about 70 km from Berlin, while the Western Allies were advancing across western Germany. On 16 April Georgy Zhukov’s 1st Belorussian Front attacked across the Oder at the Seelow Heights, and Ivan Konev’s 1st Ukrainian Front across the Neisse further south. The heights cost Zhukov days and heavy losses, but by 25 April the two fronts had encircled Berlin, and on the same day Soviet and American soldiers met on the Elbe near Torgau, cutting Germany in two. In the city the remnants of the army and the SS, old men of the Volkssturm militia and boys of the Hitler Youth fought on street by street.
      - Hitler killed himself in his bunker on 30 April, as Soviet soldiers stormed the Reichstag, and the Berlin garrison surrendered on 2 May. Germany’s armed forces surrendered unconditionally at Reims on 7 May and again, at Soviet insistence, in Berlin-Karlshorst late on 8 May, when it was already 9 May in Moscow. The battle had cost some 80,000 Soviet soldiers their lives, and tens of thousands of German civilians died. Soviet troops raped very large numbers of women in Berlin and across eastern Germany. The Soviet Union had lost about 27 million people in the war, more than any other country.
    facts:
      - [Battle of Berlin, "16 April – 2 May 1945"]
      - [Soviet and American troops meet at Torgau, "25 April 1945"]
      - [German surrender, "8 May 1945 (9 May in Moscow)"]
