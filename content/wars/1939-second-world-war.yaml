  - title: Bagration and the Baltic
    date: June – December 1944
    when: "1944-06-22"
    borders: "1944-12-31"
    countries: [by, lt, lv, ee, ru, pl, md, ro, de]
    body:
      - By the spring of 1944 the Red Army had freed most of Ukraine and the Crimea and lifted the siege of Leningrad. On 22 June, three years to the day after the German invasion and two weeks after the Allied landings in Normandy, it opened Operation Bagration against Army Group Centre in Belarus, where the Germans had not expected the main blow. Their front collapsed. Soviet armies encircled German forces at Vitebsk and Bobruisk and east of Minsk, which they took on 3 July, and destroyed 28 German divisions. On 17 July some 57,000 German prisoners were marched through Moscow. By August the Red Army stood on the Vistula and at the border of East Prussia.
      - In the north the Red Army pushed into the Baltic states. German troops and Estonian units held the Narva isthmus at the Tannenberg Line in July and August, but in September the Germans left Estonia, and Soviet troops entered Tallinn on 22 September and Riga on 13 October. Tens of thousands of Estonians and Latvians fled by sea to Sweden and Germany, and the returning Soviet rule brought new arrests and deportations. Army Group North, cut off in western Latvia, held out in the Courland pocket until the end of the war. In the south the Jassy–Kishinev offensive broke through in August, and on 23 August King Michael of Romania deposed Ion Antonescu and changed sides.
    facts:
      - [Operation Bagration, "22 June – 19 August 1944"]
      - [German divisions destroyed, "28, from Army Group Centre"]
      - [Tallinn and Riga retaken, "22 September and 13 October 1944"]
    markers:
      - kind: battle
        side: su
        name: Vitebsk
        date: 23–27 June 1944
        text: The German corps holding the city was encircled in the first days of the offensive and almost entirely killed or captured.
        lonlat: [30.206, 55.192]
      - kind: battle
        side: su
        name: Bobruisk
        date: June 1944
        text: Soviet armour and aircraft destroyed the German forces trapped around the town on the Berezina.
        lonlat: [29.233, 53.15]
      - kind: taken
        side: su
        name: Minsk
        date: 3 July 1944
        text: Freed after three years of occupation. The day is now Belarus’s Independence Day.
        lonlat: [27.567, 53.9]
        lp: l
      - kind: taken
        side: su
        name: Vilnius
        date: 13 July 1944
        text: Taken by the Red Army with the help of the Polish Home Army, whose soldiers the Soviets then disarmed and arrested.
        lonlat: [25.28, 54.687]
      - kind: battle
        side: de
        name: Tannenberg Line
        date: 25 July – 10 August 1944
        text: German and Estonian troops held the Blue Hills (Sinimäed) on the Narva isthmus against repeated Soviet attacks.
        lonlat: [27.867, 59.375]
      - kind: taken
        side: su
        name: Tallinn
        date: 22 September 1944
        text: The Germans had already left. An Estonian government that had raised the national flag in the city was swept aside by the Soviet troops.
        lonlat: [24.745, 59.437]
      - kind: taken
        side: su
        name: Riga
        date: 13 October 1944
        text: Taken by the 3rd Baltic Front as the German army withdrew into Courland.
        lonlat: [24.106, 56.949]
      - kind: held
        side: de
        name: Courland pocket
        date: October 1944 – May 1945
        text: Army Group North, cut off in western Latvia, held out against six Soviet offensives and surrendered only after Germany’s capitulation.
        lonlat: [22.3, 56.85]
        lp: l
      - kind: taken
        side: su
        name: Chișinău
        date: 24 August 1944
        text: The Jassy–Kishinev offensive trapped German and Romanian armies, and Romania changed sides the day before the city fell.
        lonlat: [28.835, 47.023]
