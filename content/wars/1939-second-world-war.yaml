        name: Road of Life
        date: 1941–1943
        text: In winter lorries crossed the frozen lake to the city under German air attack; in summer barges and boats carried supplies.
        lonlat: [31.4, 60.08]
        lp: t
      - kind: battle
        side: su
        name: Tikhvin
        date: 9 December 1941
        text: The Red Army retook the railway town, ending the German attempt to close a second ring east of Lake Ladoga and meet the Finns on the Svir.
        lonlat: [33.533, 59.65]
      - kind: battle
        side: su
        name: Operation Iskra
        date: 12–18 January 1943
        text: Soviet troops attacking from the city and from the east met south of Lake Ladoga, opening a land corridor 8–10 km wide, still under German guns.
