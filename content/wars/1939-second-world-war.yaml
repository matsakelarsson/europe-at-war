  - title: El Alamein, Torch and Tunisia
    date: October 1942 – May 1943
    when: "1942-10-23"
    borders: "1943-05-13"
    countries: [eg, ly, tn, dz, ma, gb, fr, de, it]
    move_names:
      allies: British, American and French moves
      de: German and Italian moves
    side_names:
      de: German and Italian success
    body:
      - By October 1942 General Bernard Montgomery’s Eighth Army at El Alamein had about 195,000 men and more than 1,000 tanks, against some 116,000 German and Italian troops who were short of fuel. Montgomery attacked on the night of 23 October behind a huge artillery barrage. After twelve days of fighting through deep minefields the Axis line broke on 4 November, and Rommel retreated across Libya, giving up Tripoli on 23 January 1943 and falling back into southern Tunisia.
      - On 8 November 1942 American and British troops landed in Vichy French Morocco and Algeria, at Casablanca, Oran and Algiers. The French fought back for up to three days before Admiral François Darlan ordered a ceasefire and brought French North Africa over to the Allies. Germany and Italy rushed troops into Tunisia and won the race for Tunis. During the six months of their occupation the Germans forced some 5,000 Tunisian Jewish men into labour camps.
      - In February 1943 Rommel defeated inexperienced American troops at the Kasserine Pass, but in March the Eighth Army broke through the Mareth Line, and the Axis armies were caught between two Allied armies. Their bridgehead collapsed in early May. Tunis and Bizerte fell on 7 May, and on 13 May some 250,000 German and Italian soldiers surrendered, more than at Stalingrad.
    facts:
      - [Second Battle of El Alamein, "23 October – 4 November 1942"]
      - [Operation Torch landings, "8 November 1942"]
      - [Axis surrender in Tunisia, "13 May 1943, about 250,000 prisoners (estimates differ)"]
