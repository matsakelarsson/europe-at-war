  - title: Barbarossa and the Battle of Moscow
    date: June – December 1941
    when: "1941-06-22"
    borders: "1941-12-05"
    countries: [ru, by, ua, lt, lv, ee, md, de, ro]
    body:
      - On 22 June 1941 Germany broke its pact with the Soviet Union and invaded it with more than three million German soldiers, soon joined by Romanian, Finnish, Hungarian, Italian and Slovak troops. Stalin had dismissed many warnings, and on the first day the Luftwaffe destroyed much of the Soviet air force on the ground. German armoured groups encircled whole Soviet armies, near Białystok and Minsk in June and July, at Smolensk in July and August, and east of Kyiv in September, where more than 600,000 Soviet soldiers were killed, captured or went missing. Romanian troops retook Bessarabia and besieged Odesa until October.
      - Behind the front, SS Einsatzgruppen, German police battalions and local collaborators shot Jewish men, women and children by the hundreds of thousands, 33,771 of them at Babi Yar outside Kyiv on 29–30 September. Soviet prisoners of war were left to starve, and some 3.3 million of them died in German hands during the war. In October the Germans encircled more armies at Vyazma and Bryansk and pushed on towards Moscow, but autumn mud, then frost and stiffening resistance slowed them, and by early December they had stalled at the city’s outskirts. On 5 December the Red Army, reinforced with divisions from Siberia and the Far East, counter-attacked and drove them back.
    facts:
      - [Operation Barbarossa begins, "22 June 1941"]
      - [Kyiv encirclement, "September 1941, more than 600,000 Soviet soldiers lost"]
      - [Soviet counter-offensive at Moscow, "from 5 December 1941"]
    markers:
      - kind: held
        side: su
        name: Brest Fortress
        date: 22 June – July 1941
        text: Cut off on the first day, the border fortress held out much longer than the Germans expected, and its last defenders fought on in the ruins for weeks.
        lonlat: [23.657, 52.083]
      - kind: taken
        side: de
        name: Minsk
        date: 28 June 1941
        text: The Belarusian capital fell within a week, as German armour closed a vast pocket around the Soviet armies to the west.
        lonlat: [27.567, 53.9]
      - kind: battle
        side: de
        name: Kyiv
        date: August – September 1941
        text: The largest encirclement in history by number of troops. Kyiv itself fell on 19 September.
        lonlat: [30.523, 50.45]
        lp: l
      - kind: event
        side: de
        name: Babi Yar
        date: 29–30 September 1941
        text: SS and police units shot 33,771 Jews in this ravine in two days. Tens of thousands more people were killed here during the occupation.
        lonlat: [30.449, 50.471]
        lp: t
      - kind: siege
        side: ro
        name: Odesa
        date: 8 August – 16 October 1941
        text: Romanian and German troops besieged the port until the Soviets evacuated it by sea. On 22–24 October Romanian and German forces shot or burned some 25,000–34,000 of the city’s Jews.
        lonlat: [30.733, 46.483]
      - kind: battle
        side: de
        name: Vyazma
        date: October 1941
        text: Two great encirclements, at Vyazma and Bryansk, trapped hundreds of thousands of Soviet soldiers and opened the road to Moscow.
        lonlat: [34.291, 55.211]
      - kind: battle
        side: su
        name: Moscow
        date: October 1941 – January 1942
        text: The Germans came within sight of the city. The Soviet counter-offensive from 5 December pushed them back and ended hopes of a quick victory.
        lonlat: [37.617, 55.756]
