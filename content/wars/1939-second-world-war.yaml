  - title: Crete
    date: 20 May – 1 June 1941
    when: "1941-05-20"
    borders: "1941-06-01"
    countries: [gr, de, gb]
    body:
      - Crete was held by about 42,000 British, Australian, New Zealand and Greek troops under the New Zealander Bernard Freyberg, many of them men evacuated from the mainland without their heavy weapons. On 20 May 1941 Germany launched the first invasion in history carried out mainly from the air. Paratroopers and glider troops landed around Maleme, Chania, Rethymno and Heraklion and were killed in their hundreds, but on the first night the New Zealand defenders withdrew from Hill 107 above Maleme airfield, and transport aircraft began to fly in mountain troops.
      - The Royal Navy broke up the German seaborne convoys but lost three cruisers and six destroyers to German aircraft. From 28 May the Allies retreated over the mountains to Sfakia on the south coast, and more than 16,000 men were taken off by sea; some 12,000 Commonwealth and 5,000 Greek soldiers were captured. Cretan civilians had fought the invaders with whatever weapons they had, and the Germans answered with reprisals, shooting men at Kondomari on 2 June and razing the village of Kandanos the next day. German losses were so heavy that Hitler never again ordered a large airborne operation.
    facts:
      - [Operation Mercury, "20 May – 1 June 1941"]
      - [German losses, "about 6,000 killed, wounded or missing"]
      - [Allied soldiers captured, "about 17,500"]
    markers:
      - kind: battle
        side: de
        name: Maleme
        date: 20–22 May 1941
        text: The loss of the airfield after the withdrawal from Hill 107 decided the battle, as German reinforcements were flown in under fire.
        lonlat: [23.848, 35.522]
        lp: l
      - kind: battle
        side: de
        name: Chania and Galatas
        date: 20–26 May 1941
        text: New Zealand, British and Greek troops fought for a week west of the town before their line broke.
        lonlat: [24.017, 35.517]
      - kind: held
        side: allies
        name: Rethymno
        date: 20–30 May 1941
        text: Australian and Greek troops held the airfield east of the town until, cut off, they were forced to surrender.
        lonlat: [24.474, 35.369]
      - kind: held
        side: allies
        name: Heraklion
        date: 20–29 May 1941
        text: British, Australian and Greek defenders held the town and airfield until warships took the garrison off on the night of 28–29 May.
        lonlat: [25.134, 35.34]
      - kind: naval
        side: de
        name: Naval battles off Crete
        date: 21–23 May 1941
        text: German aircraft sank the cruisers Gloucester and Fiji and several destroyers, among them Lord Louis Mountbatten’s Kelly.
        lonlat: [23.3, 35.95]
      - kind: event
        name: Sfakia
        date: 28 May – 1 June 1941
        text: Allied troops retreated across the White Mountains to this small port, from which most of the evacuated men left for Egypt. Thousands left behind were captured.
        lonlat: [24.137, 35.201]
      - kind: event
        name: Kandanos
        date: 2–3 June 1941
        text: In reprisal for civilian resistance, German paratroopers shot men of Kondomari, near Maleme, on 2 June and razed Kandanos on 3 June.
        lonlat: [23.742, 35.327]
