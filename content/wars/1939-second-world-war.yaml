      - kind: taken
        side: de
        name: Channel Islands
        date: 30 June – 1 July 1940
        text: German troops landed unopposed on the islands, which Britain had demilitarised, and held them until 9 May 1945.
        lonlat: [-2.13, 49.21]
      - kind: air
