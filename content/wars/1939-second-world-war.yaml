  - title: The Battle of Britain and the Blitz
    date: July 1940 – May 1941
    when: "1940-07-10"
    borders: "1940-10-31"
    countries: [gb, de, pl, cz]
    body:
      - With France defeated, Britain under Winston Churchill, prime minister since 10 May, refused to negotiate. Hitler ordered preparations for an invasion, Operation Sea Lion, which needed control of the air over the Channel. From July the Luftwaffe attacked convoys and ports, and from 13 August the airfields and radar stations of RAF Fighter Command. The British fighters, guided by radar and a network of observers, were stretched but never broken; among their pilots were 145 Poles and 88 Czechoslovaks. After heavy German losses on 15 September, Hitler postponed the invasion indefinitely two days later.
      - From 7 September the Luftwaffe turned to bombing London and then other cities, mostly at night. London was bombed on 56 of the next 57 days and nights, and a raid on Coventry on 14–15 November killed about 568 people. Liverpool, Birmingham, Clydebank, Belfast, Plymouth and other cities were hit until the last great raid on London on 10–11 May 1941, after which Germany moved its bombers east. More than 40,000 British civilians were killed, almost half of them in London. The Channel Islands, the only British soil Germany occupied, were held from 30 June 1940 until May 1945.
    facts:
      - [Battle of Britain, "10 July – 31 October 1940"]
      - [The Blitz, "7 September 1940 – 11 May 1941"]
      - [Civilians killed, "more than 40,000"]
