  - title: Liberation in Denmark and Norway
    date: October 1944 – May 1945
    when: "1944-10-25"
    borders: "1945-05-08"
    countries: [dk, no]
    body:
      - In October 1944 the Soviet army drove the Germans out of the far north-east of Norway and freed Kirkenes on 25 October. As they withdrew, the Germans forced thousands of people in Finnmark and northern Troms to leave and burned their homes, harbours and bridges. In Denmark the resistance stepped up sabotage of railways and factories. On 21 March 1945 British bombers destroyed the Gestapo headquarters in Copenhagen, but in the raid a school was also hit, and 87 children and 18 adults there were killed.
      - On 4 May 1945 the German forces in north-west Germany, the Netherlands and Denmark surrendered to Field Marshal Montgomery at Lüneburg Heath, and those in Norway capitulated on 8 May. The large German garrison in Norway laid down its arms without fighting. King Haakon returned on 7 June, five years to the day after he had left. Bornholm was bombed by Soviet aircraft on 7–8 May; Soviet troops landed on 9 May and stayed until April 1946.
    facts:
      - [German surrender for Denmark, "4 May 1945, in force 5 May"]
      - [German capitulation in Norway, "8 May 1945"]
      - [Soviet troops leave Bornholm, "5 April 1946"]
    markers:
      - kind: taken
        side: su
        name: Kirkenes
        date: 25 October 1944
        text: The first Norwegian town to be freed, taken in the Soviet Petsamo–Kirkenes offensive.
        lonlat: [30.046, 69.727]
        lp: l
      - kind: event
        side: de
        name: Finnmark
        date: October 1944 – February 1945
        text: The retreating Germans burned towns and villages and forced the population south. Thousands hid in the hills rather than leave.
        lonlat: [25.5, 70.0]
      - kind: air
        side: allies
        name: Copenhagen
        date: 21 March 1945
        text: RAF Mosquitoes destroyed the Gestapo headquarters in the Shellhus. A crashed aircraft set fire near a school, which later bombers hit.
        lonlat: [12.577, 55.68]
      - kind: treaty
        name: Lüneburg Heath
        date: 4 May 1945
        text: German commanders signed the surrender of their forces in north-west Germany, the Netherlands and Denmark to Montgomery.
        lonlat: [10.467, 53.217]
      - kind: event
        name: Oslo
        date: 8 May 1945
        text: The German command in Norway accepted the surrender, and the Norwegian resistance took over key points as the occupiers laid down their arms.
        lonlat: [10.739, 59.913]
      - kind: taken
        side: su
        name: Rønne
        date: 9 May 1945
        text: After bombing Rønne and Nexø, Soviet troops landed and took the surrender of the German garrison of about 12,000.
        lonlat: [14.701, 55.099]
    areas:
      - style: occupied
        side: su
        label: Soviet-occupied until April 1946
        atoms: [DK-84~bornholm]
  - title: Poland moved west
    date: January – August 1945
    when: "1945-01-17"
    borders: "1945-08-02"
    countries: [pl, de, ru, by, ua, lt]
    move_names:
      de: Flight and expulsion of Germans
      pl: Resettlement of Poles from the east
    body:
      - The Red Army’s winter offensive reached the ruins of Warsaw on 17 January 1945 and Auschwitz on 27 January, where it found about 7,000 prisoners left behind; tens of thousands more had been driven west on death marches. Breslau, declared a fortress, held out until 6 May. At Yalta in February the Allied leaders agreed that Poland’s eastern border would follow roughly the Curzon Line, leaving the Soviet Union the lands it had annexed in 1939, and that Poland would be compensated in the west.
      - At Potsdam in August the Allies placed German territory east of the Oder and the Lusatian Neisse under Polish administration, leaving the final border to a peace settlement, and gave northern East Prussia with Königsberg to the Soviet Union. They approved the transfer of the remaining Germans “in an orderly and humane manner”. Millions of Germans had already fled before the Red Army; most who stayed were expelled by 1950, many in brutal conditions, and large numbers died.
      - In the east more than a million Poles were moved out of the lands annexed by the Soviet Union, while Ukrainians were sent from Poland to Soviet Ukraine. In 1947 Operation Vistula forcibly resettled most of the Ukrainians left in south-eastern Poland in the former German lands. Many of the new inhabitants of Wrocław, Szczecin and Gdańsk came from Lwów, Vilnius and the eastern countryside.
    facts:
      - [Potsdam Agreement, "2 August 1945"]
      - [Germans fled, evacuated or expelled from the new Poland, "about 8 million by 1950 (German figures)"]
      - [Poles moved from the east, "more than 1 million"]
