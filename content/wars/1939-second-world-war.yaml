        lonlat: [2.352, 48.857]
      - kind: event
        name: Oradour-sur-Glane
        date: 10 June 1944
        text: SS troops killed 642 men, women and children and burned the village, which has been left in ruins as a memorial.
        lonlat: [1.032, 45.933]
      - kind: battle
