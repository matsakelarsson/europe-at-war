      - kind: taken
        side: su
        name: Warsaw
        date: 17 January 1945
        text: Soviet and Polish troops entered the empty, destroyed city.
        lonlat: [21.01, 52.23]
      - kind: event
        name: Auschwitz
        date: 27 January 1945
        text: Soviet soldiers found about 7,000 sick and starving prisoners left behind by the SS.
        lonlat: [19.178, 50.036]
