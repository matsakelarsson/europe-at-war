  - title: Occupation and resistance in Denmark and Norway
    date: 1940–1944
    when: "1943-08-29"
    borders: "1943-08-29"
    countries: [dk, no]
    body:
      - Denmark’s government stayed in office under German occupation and cooperated to shield the population, but resistance grew. In August 1943, after strikes and sabotage, it refused German demands for martial law and the death penalty for saboteurs, and on 29 August the Germans dissolved it and took full control; the navy scuttled 32 of its ships. When the Germans prepared to deport Denmark’s Jews, a warning leaked by the German diplomat Georg Duckwitz let Danes hide them and ferry about 7,500 across the Øresund to neutral Sweden. The 464 who were caught were sent to Theresienstadt.
      - Norway was ruled by the German Reichskommissar Josef Terboven, with Quisling heading a collaborationist government from 1942, while the king and government in London kept Norway’s large merchant fleet in Allied service. The Milorg resistance grew to about 40,000 men, and in February 1943 saboteurs trained in Britain wrecked the heavy-water plant at Vemork. Reprisals were harsh. On 26 November 1942 the ship Donau took 532 Jews from Oslo to Auschwitz; at least 765 Jews from Norway were murdered.
    facts:
      - [Danish government dissolved, "29 August 1943"]
      - [Danish Jews who reached Sweden, "about 7,500 of 8,000"]
      - [Jews from Norway murdered, "at least 765"]
    markers:
      - kind: event
        side: dk
        name: Copenhagen
        date: 29 August 1943
        text: The government resigned rather than accept German demands. The Germans declared martial law and tried to seize the fleet, but most of it was scuttled.
        lonlat: [12.568, 55.676]
        lp: l
      - kind: event
        name: Gilleleje
        date: 6 October 1943
        text: About 80 Jews hiding in the church loft while waiting for boats to Sweden were found by the Gestapo and arrested.
        lonlat: [12.317, 56.117]
        lp: l
      - kind: event
        side: no
        name: Vemork
        date: 27–28 February 1943
        text: Norwegian commandos destroyed the plant’s heavy-water stocks, needed for German nuclear research, without loss.
        lonlat: [8.491, 59.871]
      - kind: event
        side: de
        name: Telavåg
        date: 30 April 1942
        text: After two Gestapo officers were killed here, the Germans razed the fishing village and deported 72 of its men to Sachsenhausen, where 31 died.
        lonlat: [4.986, 60.263]
      - kind: event
        name: Oslo
        date: 26 November 1942
        text: Norwegian police helped round up Jews for the Donau, which sailed for Stettin on the way to Auschwitz. Only a handful survived.
        lonlat: [10.739, 59.913]
    arrows:
      - side: dk
        label: To Sweden, October 1943
        via: [[12.45, 55.85], [12.65, 55.95], [12.85, 56.02]]
    areas:
