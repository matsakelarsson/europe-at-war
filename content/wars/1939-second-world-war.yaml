  - title: D-Day and Normandy
    date: 6 June – 21 August 1944
    when: "1944-06-06"
    borders: "1944-08-21"
    countries: [fr, gb, de, pl]
    body:
      - On 6 June 1944, D-Day, the Western Allies landed in Normandy in the largest seaborne invasion in history. After airborne landings in the night, nearly 160,000 American, British and Canadian troops, with Free French and other Allied contingents, came ashore on five beaches, codenamed Utah, Omaha, Gold, Juno and Sword. At Omaha the Americans were pinned down under heavy fire before they forced their way inland. Allied casualties on the day were at least 10,000, with some 4,400 dead. By 12 June the beachheads had been joined into a single front.
      - The fighting in the bocage, small fields walled by thick hedges, was slow and costly. The Americans took Cherbourg at the end of June, but its port had been wrecked, while the British and Canadians fought for Caen until July. Operation Cobra broke the German line west of Saint-Lô on 25 July, and Patton’s Third Army raced south through Avranches. A German counter-attack at Mortain failed, and in August the Allies closed a pocket near Falaise. When Polish and American troops met at Chambois on 19 August, some 50,000 Germans were trapped, though perhaps 20,000–50,000 had escaped.
      - The campaign cost the Allies about 226,000 casualties, and German losses were as heavy. Between about 13,600 and 19,900 French civilians were killed, many by Allied bombing and shelling of towns such as Caen and Saint-Lô, which were largely destroyed. In the first days soldiers of the 12th SS Panzer Division murdered Canadian prisoners near Caen, among them at the Ardenne Abbey; about one in seven of the Canadians killed between 6 and 11 June died after they had surrendered.
    facts:
      - [Troops landed on D-Day, "nearly 160,000"]
      - [Allied casualties on D-Day, "at least 10,000, about 4,400 dead"]
      - [French civilians killed, "about 13,600–19,900"]
    markers:
      - kind: taken
        side: allies
        name: Pegasus Bridge
        date: 6 June 1944
        text: British glider troops seized the bridges over the Caen Canal and the Orne in the first minutes of D-Day.
        lonlat: [-0.274, 49.242]
        lp: t
      - kind: battle
        side: allies
        name: Omaha Beach
        date: 6 June 1944
        text: The Americans suffered some 2,400 casualties here before they fought their way off the beach.
        lonlat: [-0.869, 49.369]
        lp: b
      - kind: taken
        side: allies
        name: Sainte-Mère-Église
        date: 6 June 1944
        text: American paratroopers took the town in the night, one of the first in France to be freed.
        lonlat: [-1.318, 49.409]
        lp: l
      - kind: taken
        side: allies
        name: Cherbourg
        date: 26–29 June 1944
        text: The port fell to the Americans after a week of fighting, but the Germans had wrecked the harbour.
