        side: su
        name: Breslau
        date: February – 6 May 1945
        text: The city, now Wrocław, was held as a fortress until four days after Berlin fell, and much of it was destroyed.
        lonlat: [17.033, 51.11]
      - kind: taken
        side: su
        name: Königsberg
        date: 9 April 1945
        text: The East Prussian capital fell after a siege. Renamed Kaliningrad, it became part of Soviet Russia.
        lonlat: [20.453, 54.7]
      - kind: event
