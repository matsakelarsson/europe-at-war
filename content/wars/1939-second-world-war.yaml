    areas:
      - style: gained
        side: pl
        label: German lands placed under Polish administration
        atoms: [PL-DS, PL-LB, PL-OP, PL-ZP, PL-PM~de1930, PL-PM~pomE~de1930, PL-PM~eprussia, PL-PM~danzig, PL-WN!, PL-WN~warm, PL-WP~de1930, PL-SL~de1930]
