        date: 4 September 1944
        text: The British took the port almost undamaged with help from the Belgian resistance, but it could not be used until the Scheldt was cleared.
        lonlat: [4.4, 51.218]
      - kind: taken
        side: allies
        name: Luxembourg
        date: 10 September 1944
        text: American troops freed the capital, ending two years of German annexation.
        lonlat: [6.13, 49.611]
