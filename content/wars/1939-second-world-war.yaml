id: second-world-war
name: Second World War
start: "1939-09-01"
end: "1945-09-02"
tier: A
summary: The deadliest war in history, fought between the Axis powers led by Germany, Italy and Japan and the Allies, among them Britain, the Soviet Union, the United States and China. In Europe it began with the German invasion of Poland on 1 September 1939 and ended with Germany’s surrender in May 1945; it brought the Holocaust, the murder of some six million Jews, and left Europe divided. In the west Germany overran the Low Countries and France in 1940, while Britain held out; the Western Allies returned through Italy in 1943 and Normandy in 1944.
