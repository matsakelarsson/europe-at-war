  - title: Market Garden and the hunger winter
    date: September 1944 – May 1945
    when: "1944-09-17"
    borders: "1944-09-26"
    countries: [nl, de, gb, pl, be]
    body:
      - Montgomery hoped to end the war in 1944 by outflanking the German frontier defences through the Netherlands. In Operation Market Garden, launched on 17 September, some 35,000 American, British and Polish airborne troops were landed to seize the bridges between Eindhoven and Arnhem, while the British XXX Corps drove north along a single road to join them. The Americans took most of their bridges, and the Waal bridge at Nijmegen fell on 20 September. But at Arnhem the British 1st Airborne Division had landed close to two SS panzer divisions, and only one battalion reached the Rhine bridge.
      - The battalion held the north end of the bridge for four days, and XXX Corps could not break through in time. On the night of 25–26 September about 2,400 survivors of the 1st Airborne were taken back across the Rhine; the division had lost nearly three-quarters of its men. Further west, Canadian and British troops cleared the Scheldt estuary between October and early November, opening Antwerp to Allied shipping. In reprisal for a resistance attack, German troops rounded up the men of Putten on 1–2 October and deported 602 of them to camps; only 48 came back.
      - The north and west of the Netherlands stayed occupied. After the Dutch government in exile called a railway strike in support of the offensive, the Germans blocked food transport, and in the “hunger winter” of 1944–1945 about 20,000 people died of hunger and cold, most of them in the cities of Holland. People walked into the countryside to barter for food and ate tulip bulbs. In late April 1945, under a truce with the Germans, Allied bombers dropped food in Operation Manna, and on 5 May the German forces in the Netherlands surrendered.
    facts:
      - [Market Garden, "17–25 September 1944"]
      - [Dead in the hunger winter, "about 20,000"]
      - [Liberation of the western Netherlands, "5 May 1945"]
