        name: Biggin Hill
        date: August – September 1940
        text: One of the Fighter Command airfields south of London that bore the brunt of the German attacks in August and early September.
        lonlat: [0.033, 51.331]
      - kind: air
        side: de
        name: London
        date: 7 September 1940 – 11 May 1941
        text: Bombed on 56 of 57 days and nights from 7 September; the fire raid of 29 December burned much of the City.
        lonlat: [-0.12, 51.51]
        lp: t
      - kind: air
        side: de
        name: Coventry
        date: 14–15 November 1940
        text: About 568 people were killed and the medieval cathedral was destroyed.
        lonlat: [-1.507, 52.408]
      - kind: air
        side: de
        name: Liverpool
        date: August 1940 – May 1941
        text: About 4,000 people were killed on Merseyside, more than anywhere outside London; the heaviest raids came in the first week of May 1941.
        lonlat: [-2.98, 53.41]
