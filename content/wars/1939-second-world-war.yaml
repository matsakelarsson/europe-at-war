  - title: The siege of Budapest and the road to Vienna
    date: December 1944 – April 1945
    when: "1944-12-26"
    borders: "1945-04-13"
    countries: [hu, at, sk, ro, de]
    body:
      - The Red Army reached the outskirts of Budapest in early November 1944, but Hitler ordered the city held as a fortress. On 26 December Soviet forces completed its encirclement, trapping tens of thousands of German and Hungarian soldiers and some 800,000 civilians. Three German relief attacks in January failed. Soviet and Romanian troops took Pest street by street, and on 18 January its last defenders withdrew across the Danube to the castle hill of Buda, blowing up the bridges behind them. On 11 February some 28,000 tried to break out; only about 700 reached the German lines. The last resistance ended on 13 February.
      - About 38,000 civilians died in the siege, from shelling, bombing, hunger and disease, and Arrow Cross killings went on almost to the end. Soviet soldiers looted, raped very large numbers of women and rounded up tens of thousands of civilians for forced labour in the Soviet Union. In Debrecen a provisional government formed under Soviet protection had declared war on Germany, and it signed an armistice in Moscow on 20 January 1945.
      - In March Hitler threw his last reserves, the 6th SS Panzer Army, into Operation Spring Awakening between Lake Balaton and the Danube, to protect the last oilfields left to Germany, around Nagykanizsa. It gained up to 30 km before stalling in mud and Soviet defences. On 16 March the Soviets counter-attacked, and within weeks they crossed into Austria. Bratislava fell on 4 April and Vienna, after a week of fighting, on 13 April. A provisional Austrian government under Karl Renner was set up in Vienna on 27 April.
    facts:
      - [Siege of Budapest, "26 December 1944 – 13 February 1945"]
      - [Civilian dead in Budapest, "about 38,000"]
      - [Vienna taken, "13 April 1945"]
