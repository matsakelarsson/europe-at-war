      - kind: taken
        side: de
        name: Eben-Emael
        date: 10–11 May 1940
        text: Paratroopers landed by glider on the fortress and blew up its guns with hollow charges; the garrison surrendered the next day.
        lonlat: [5.679, 50.798]
      - kind: held
        side: nl
        name: The Hague
        date: 10 May 1940
        text: Dutch troops retook the airfields at Ypenburg, Ockenburg and Valkenburg from German airborne troops sent to seize the government and the queen.
        lonlat: [4.394, 52.053]
      - kind: held
        side: nl
        name: Kornwerderzand
