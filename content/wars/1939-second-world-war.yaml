  - title: The fall of the Low Countries
    date: 10–21 May 1940
    when: "1940-05-10"
    borders: "1940-05-21"
    countries: [nl, be, lu, fr, de, gb]
    body:
      - On 10 May 1940 Germany invaded the neutral Netherlands, Belgium and Luxembourg. Airborne troops seized bridges and airfields ahead of the tanks, and at Eben-Emael, the Belgian fortress guarding the Albert Canal, 78 paratroopers landed by glider on its roof and put its guns out of action within a day. An attempt to capture the Dutch government at The Hague failed, and Queen Wilhelmina and her ministers left for London on 13 May. On 14 May German bombers destroyed the centre of Rotterdam, and the Dutch army surrendered that evening; Zeeland held out until 17 May.
      - The British Expeditionary Force and the best French armies advanced into Belgium to meet what they took to be the main attack. But the main German thrust came further south, through the wooded Ardennes, which the French had thought unsuitable for tanks. Guderian’s panzer corps crossed the Meuse at Sedan on 13 May, broke through and raced west, reaching the Channel near Abbeville on 20 May. The Allied armies in Belgium were cut off from the main French forces, and a British counter-attack at Arras on 21 May could not reopen the way south.
    facts:
      - [Invasion, "10 May 1940"]
      - [Killed in Rotterdam, "at least 1,150, 711 of them in the bombing of 14 May"]
      - [Dutch surrender, "14 May 1940 (Zeeland 17 May)"]
