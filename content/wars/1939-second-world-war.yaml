        lonlat: [3.058, 50.628]
      - kind: taken
        side: de
        name: Paris
        date: 14 June 1940
        text: The government had declared Paris an open city, and German troops entered it without a fight.
        lonlat: [2.352, 48.857]
      - kind: air
        side: de
        name: Lancastria
