  - title: Yugoslavia and Greece invaded
    date: 6–30 April 1941
    when: "1941-04-06"
    borders: "1941-05-18"
    countries: [rs, hr, si, ba, me, mk, gr, de, it, hu, bg, gb]
    body:
      - Hitler wanted his southern flank secure before he invaded the Soviet Union. Bulgaria joined the Axis on 1 March 1941 and let German armies in, and on 25 March Yugoslavia’s regent, Prince Paul, also signed the Tripartite Pact. Two days later officers overthrew him in a coup, cheered by crowds in Belgrade, and Hitler ordered Yugoslavia destroyed. On 6 April the Luftwaffe bombed Belgrade without a declaration of war. Estimates of the dead range from about 1,500 to 17,000; many historians think 3,000–4,000 the likeliest. German, Italian and Hungarian armies attacked from all sides, Croatian units mutinied, and the army capitulated on 17 April, as the victors divided the country between them.
      - Greece was attacked the same day from Bulgaria. The forts of the Metaxas Line held for several days, but German armour came round through Yugoslav Macedonia and took Thessaloniki on 9 April. Some 60,000 British, Australian and New Zealand troops, sent to Greece in March, fell back with the Greeks through Vevi, Olympus and Thermopylae. The Greek army in Albania, cut off, surrendered on 20 April, two days after Prime Minister Alexandros Koryzis had killed himself. German troops entered Athens on 27 April, and the Royal Navy took some 50,000 Allied soldiers off the beaches to Crete and Egypt.
    facts:
      - [Bombing of Belgrade, "6–7 April 1941"]
      - [Yugoslav capitulation, "17 April 1941, in force 18 April"]
      - [Athens occupied, "27 April 1941"]
