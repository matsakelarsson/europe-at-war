  - title: The Greco-Italian War
    date: 28 October 1940 – April 1941
    when: "1940-10-28"
    borders: "1941-03-01"
    countries: [gr, al, it]
    body:
      - Mussolini, eager to match Germany’s conquests, decided to attack Greece without telling Hitler first. Early on 28 October 1940 the Italian minister in Athens delivered an ultimatum demanding passage for Italian troops. The dictator Ioannis Metaxas refused, a moment Greeks still mark every year as Ohi (“No”) Day, and within hours Italian forces crossed from Albania, which Italy had occupied in 1939. Their main thrust in Epirus was stopped on the Kalamas river, and in the Pindus mountains Greek troops cut off and mauled the Julia Alpine Division in early November.
      - The Greeks then went over to the attack and drove the Italians back into Albania. They took Korçë on 22 November, Sarandë and Gjirokastër early in December, Himarë just before Christmas and the Klisura pass in January 1941. It was one of the first Allied victories of the war on land. In the snow of the Albanian mountains, where many soldiers on both sides lost limbs to frostbite, the front then stalled. An Italian spring offensive in March, watched by Mussolini, failed with heavy losses, but Greece had sent almost its whole army to Albania, leaving Macedonia thinly held when Germany attacked in April.
    facts:
      - [Italian ultimatum, "28 October 1940, rejected by Metaxas"]
      - [Korçë taken by the Greeks, "22 November 1940"]
      - [Dead, "about 13,700 Italian and 13,300 Greek soldiers"]
