  - title: Sicily and the fall of Mussolini
    date: July – October 1943
    when: "1943-07-10"
    borders: "1943-10-01"
    countries: [it, de, gb, fr]
    body:
      - After the Axis surrender in Tunisia, American, British and Canadian troops landed in Sicily on 10 July 1943. Patton’s Seventh Army took Palermo on 22 July while Montgomery’s Eighth Army fought its way up the east coast past Catania and Mount Etna. On 24–25 July the Fascist Grand Council turned against Mussolini, and the king dismissed and arrested him; Marshal Pietro Badoglio formed a government that secretly sought terms. Allied troops entered Messina on 17 August, but by then the Germans and Italians had ferried more than 100,000 men across the strait to the mainland.
      - The armistice signed at Cassibile on 3 September, the day the Eighth Army crossed into Calabria, was announced on 8 September, as the Allies prepared to land at Salerno. Germany was ready. Its troops disarmed the Italian army, occupied Rome and the north, and sent some 600,000 Italian soldiers who refused to fight on to Germany as military internees, where tens of thousands died. The king and Badoglio fled south. German paratroopers freed Mussolini from the Gran Sasso on 12 September to head a new Fascist state, the Italian Social Republic, governed from Salò on Lake Garda.
      - At Salerno the Germans counter-attacked the beachhead hard before withdrawing north. In Naples the population rose against the occupiers in the Four Days of 27–30 September, and Allied troops entered the city on 1 October. By early October the front ran along the Volturno and across to Termoli on the Adriatic. In Corsica the resistance, Free French troops and Italian units drove out the Germans by the start of October. On 16 October the SS raided the Rome ghetto and deported 1,023 Jews to Auschwitz; only 16 survived.
    facts:
      - [Fall of Mussolini, "25 July 1943"]
