  - title: Kursk and the road to the Dnieper
    date: July – December 1943
    when: "1943-07-05"
    borders: "1943-12-31"
    countries: [ru, ua, by, de]
    body:
      - After Stalingrad the Red Army pushed west, and the Germans gave up the Caucasus, but in March 1943 Erich von Manstein’s counter-attack retook Kharkiv and left a large Soviet salient around Kursk. Hitler launched Operation Citadel against it on 5 July, attacking its northern and southern sides with the new Tiger and Panther tanks. Warned in advance, the Soviets had built deep belts of minefields, trenches and anti-tank guns. The northern attack stalled within days. In the south German armour pushed further, and on 12 July Soviet tank armies met the SS panzer corps near Prokhorovka in one of the largest tank battles in history.
      - In mid-July Hitler called off the offensive, partly because the Western Allies had landed in Sicily on 10 July. The Red Army had already gone over to the attack north of the salient, and it freed Oryol and Belgorod on 5 August, celebrated with the first artillery salute in Moscow, and Kharkiv on 23 August. From then on it held the initiative. Through the autumn it advanced across eastern Ukraine to the Dnieper, crossed the river and on 6 November took Kyiv. The retreating Germans burned villages and drove civilians west, and the freed lands bore the marks of two years of mass murder, hunger and deportation for forced labour.
    facts:
      - [Operation Citadel, "5 July 1943"]
      - [Battle of Prokhorovka, "12 July 1943"]
      - [Kyiv retaken, "6 November 1943"]
    markers:
      - kind: battle
        side: su
        name: Prokhorovka
        date: 12 July 1943
        text: The 5th Guards Tank Army attacked the II SS Panzer Corps here. Soviet losses were heavy, but the German drive from the south soon came to a halt.
        lonlat: [36.736, 51.036]
      - kind: held
        side: su
        name: Ponyri
        date: 5–12 July 1943
        text: The German attack on the northern side of the salient stalled in the Soviet defences around this railway village.
        lonlat: [36.3, 52.3]
      - kind: taken
        side: su
        name: Oryol
        date: 5 August 1943
        text: Freed on the same day as Belgorod. Moscow fired its first artillery salute of the war to mark the victories.
        lonlat: [36.067, 52.967]
      - kind: taken
        side: su
        name: Kharkiv
        date: 23 August 1943
        text: The city changed hands for the last time after heavy fighting.
        lonlat: [36.231, 49.993]
      - kind: taken
        side: su
        name: Kyiv
        date: 6 November 1943
        text: Retaken from a bridgehead north of the city after crossing the Dnieper.
        lonlat: [30.523, 50.45]
