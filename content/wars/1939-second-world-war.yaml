        lonlat: [18.723, 52.154]
      - kind: event
        name: Auschwitz-Birkenau
        date: 1942–1945
        text: The largest killing centre. About 1.1 million people were murdered here, about a million of them Jews from across Europe.
        lonlat: [19.178, 50.036]
      - kind: event
        name: Bełżec
        date: March – December 1942
        text: The first camp of Operation Reinhard, with fixed gas chambers. Some 430,000 or more Jews were killed, mostly from southern Poland.
        lonlat: [23.458, 50.372]
