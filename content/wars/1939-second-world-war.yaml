  - title: The liberation of France and Belgium
    date: 15 August – September 1944
    when: "1944-08-15"
    borders: "1944-09-15"
    countries: [fr, be, lu, de]
    body:
      - On 15 August 1944 American and French troops landed in Provence between Toulon and Cannes. The French under General de Lattre took Toulon and Marseille by 28 August, far sooner than planned, and the Allies drove up the Rhône valley to meet the forces from Normandy near Dijon in mid-September. In Paris the police and the Resistance rose on 19 August. Eisenhower sent General Leclerc’s French 2nd Armoured Division ahead, and on 25 August the German commander, Dietrich von Choltitz, surrendered the city, which Hitler had ordered him to destroy. De Gaulle walked down the Champs-Élysées the next day.
      - As the Germans retreated, the British and Canadians crossed the Seine and raced north, reaching Brussels on 3 September and Antwerp, with its port intact, on 4 September. The Americans freed Liège and Luxembourg, and by mid-September they stood on the German border near Aachen and on the Moselle. But supplies were stretched, the approaches to Antwerp along the Scheldt stayed in German hands until November, and German garrisons held Dunkirk, Lorient, Saint-Nazaire and La Rochelle until the end of the war. Royan and the Pointe de Grave were retaken by French forces in April 1945.
      - The retreat was marked by massacres. In June, after Resistance attacks following D-Day, the SS division Das Reich hanged 99 men in Tulle and killed 642 people at Oradour-sur-Glane, burning the women and children in the church. In July German troops crushed the maquis on the Vercors plateau, killing more than 600 fighters and some 200 civilians. After liberation some 9,000–10,000 people accused of collaboration were killed without trial and about 20,000 women had their heads shaved in public, before the courts took over the purge.
    facts:
      - [Provence landings, "15 August 1944"]
      - [Paris liberated, "25 August 1944"]
      - [Brussels and Antwerp freed, "3 and 4 September 1944"]
