  - title: Greece under occupation
    date: 1941–1944
    when: "1941-10"
    borders: "1942-11-25"
    countries: [gr, de, it, bg, gb]
    side_names:
      partisans: Greek resistance success
    body:
      - Greece was divided into three zones. Germany kept Athens, Thessaloniki and Central Macedonia, most of Crete and some islands; Bulgaria annexed eastern Macedonia and Western Thrace and crushed a rising at Drama in September 1941; Italy occupied the rest. With food requisitioned by the occupiers, transport wrecked and a British naval blockade, famine struck in the winter of 1941–42, when hundreds died each day in Athens. Estimates of the deaths from hunger during the occupation run as high as 300,000. Food from Turkey, and after the blockade was eased in 1942 Red Cross wheat carried in Swedish ships, saved many lives.
      - Resistance grew from 1942, led by the communist-dominated National Liberation Front (EAM) and its army, ELAS, and by smaller groups such as Napoleon Zervas’s EDES. On the night of 25 November 1942 ELAS and EDES fighters and British saboteurs blew up the Gorgopotamos railway viaduct, on the line that carried supplies bound for Rommel’s army. The occupiers answered with mass reprisals. German troops killed 317 villagers at Kommeno in August 1943, nearly 700 people in and around Kalavryta in December 1943 and 228 at Distomo in June 1944. From 1943 ELAS and EDES also fought each other.
      - In March 1943 the Germans began deporting the Jews of Thessaloniki, one of the great Sephardic communities of Europe. By August some 45,000–50,000 had been sent to Auschwitz, where almost all were murdered. In the same month Bulgaria deported more than 4,000 Jews from its zone in Thrace and Macedonia to Treblinka. After Italy’s surrender in 1943 the Germans hunted down Jews in the former Italian zone as well, and by the end of the occupation more than 80 per cent of the Jews of Greece had been murdered.
    facts:
      - [Famine deaths, "up to about 300,000 during the occupation (estimates)"]
      - [Gorgopotamos viaduct destroyed, "25–26 November 1942"]
      - [Jews deported from Thessaloniki, "about 45,000–50,000, March–August 1943"]
