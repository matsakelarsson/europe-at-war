  - title: The desert war and the siege of Malta
    date: September 1940 – July 1942
    when: "1940-09-13"
    borders: "1942-07-01"
    countries: [eg, ly, mt, it, gb, de, fr]
    move_names:
      allies: British and Commonwealth moves
      de: German and Italian moves
    side_names:
      de: German and Italian success
    body:
      - Italy entered the war on 10 June 1940, as France was collapsing, and from its colony of Libya it invaded Egypt, where British forces guarded the Suez Canal. Marshal Rodolfo Graziani’s 10th Army advanced about 100 km in September and dug in around Sidi Barrani. In November British carrier aircraft crippled three Italian battleships in harbour at Taranto. On 9 December General Richard O’Connor’s Western Desert Force, some 36,000 men, attacked. In two months it took Sidi Barrani, Bardia and Tobruk, cut off the retreating Italians at Beda Fomm and captured more than 130,000 prisoners.
      - In February 1941 Hitler sent Erwin Rommel to Libya with the first units of what became the Afrika Korps, while many of O’Connor’s troops left for Greece. Rommel drove the British back to the Egyptian border, though an Australian-led garrison held Tobruk through an eight-month siege until it was relieved in November. In May 1942 Rommel struck again at Gazala, where Free French troops held Bir Hakeim for two weeks. Tobruk fell on 21 June with some 33,000 prisoners, and the Axis advance was stopped only at El Alamein, about 100 km from Alexandria, in July.
      - Everything turned on supplies. From Malta British aircraft and submarines attacked the convoys carrying fuel and troops to Libya, and German and Italian aircraft bombed the island from June 1940 until late 1942, most heavily in the spring of 1942, when its people and garrison came close to starvation. King George VI awarded the island the George Cross in April 1942. In August a convoy fought its way through, Operation Pedestal; most of its ships were sunk, but the tanker Ohio and four freighters reached Valletta.
    facts:
      - [Operation Compass, "9 December 1940 – 9 February 1941, more than 130,000 Italian prisoners"]
      - [Siege of Tobruk, "April – November 1941"]
      - [Siege of Malta, "June 1940 – November 1942, about 1,300 civilians killed"]
