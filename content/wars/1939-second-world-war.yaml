  - title: Cassino, Anzio and Rome
    date: October 1943 – June 1944
    when: "1944-01-17"
    borders: "1944-06-04"
    countries: [it, de, pl, gb, fr]
    body:
      - South of Rome the Germans under Field Marshal Kesselring held fortified lines across the mountains, the strongest the Gustav Line, anchored on Monte Cassino. Through a wet winter the Allies, among them American, British, Canadian, French, Indian, New Zealand and Polish troops, made slow and costly progress. On 22 January 1944 American and British troops landed at Anzio, behind the line, but their commander dug in instead of striking inland, and German counter-attacks pinned the beachhead down for four months. On 15 February Allied bombers destroyed the abbey on Monte Cassino, and the Germans then fortified its ruins.
      - Three assaults on Cassino failed between January and March. In the fourth, launched on 11 May, French colonial troops broke through the Aurunci mountains, and on 18 May soldiers of the Polish II Corps raised their flag over the abbey ruins after a week of heavy losses. The Anzio force broke out on 23 May, but General Clark turned it towards Rome rather than cutting off the retreating German Tenth Army, and the Americans entered Rome on 4 June. In the advance goumiers of the French Expeditionary Corps committed mass rapes of Italian civilians, remembered as the marocchinate.
      - Behind the lines the occupation grew harsher. In Rome, after a partisan bomb killed 33 German police in the Via Rasella on 23 March, the Germans shot 335 men and boys, prisoners and hostages, at the Ardeatine Caves the next day. Partisan bands formed in the mountains of central and northern Italy, and German troops and Fascist militia answered them with reprisals against villages.
    facts:
      - [Battles of Monte Cassino, "17 January – 18 May 1944"]
      - [Rome entered, "4 June 1944"]
      - [Casualties in Italy, 1943–1945, "about 330,000 Allied, over 330,000 German"]
