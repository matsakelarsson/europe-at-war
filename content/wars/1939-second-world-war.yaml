  - title: The Battle of the Bulge
    date: 16 December 1944 – 25 January 1945
    when: "1944-12-16"
    borders: "1944-12-26"
    countries: [be, lu, de]
    body:
      - On 16 December 1944 Germany launched its last great offensive in the west, through the thinly held Ardennes, aiming to split the Allied armies and retake Antwerp. Fog and low cloud grounded Allied aircraft, and three German armies broke through the American lines. On 17 December men of the SS battle group Peiper shot 84 captured American soldiers at Baugnez near Malmedy, and the group killed Belgian civilians around Stavelot. American troops held the northern shoulder at Elsenborn and delayed the Germans at St. Vith, which fell on 21 December.
      - Surrounded at Bastogne from 20 December, the US 101st Airborne Division and other units refused to surrender. The skies cleared on 23 December, letting Allied aircraft attack the German columns and drop supplies, and on 24 December the US 2nd Armored Division stopped the German spearhead near Celles, a few kilometres short of the Meuse at Dinant. Patton’s Third Army turned north and broke through to Bastogne on 26 December. The Allies then pushed the bulge back, and by 25 January the line had been restored. Each side lost some 80,000 men or more, killed, wounded or captured.
    facts:
      - [Battle of the Bulge, "16 December 1944 – 25 January 1945"]
      - [American casualties, "about 77,000–83,000 or more"]
      - [German casualties, "about 82,000–125,000"]
