  - title: Stalingrad
    date: August 1942 – February 1943
    when: "1942-08-23"
    borders: "1942-11-18"
    countries: [ru, ua, de, ro]
    body:
      - In the summer of 1942 Germany struck south-east instead of at Moscow, aiming for the oil of the Caucasus. The offensive began on 28 June, after a Soviet attack near Kharkiv had been crushed in May. German armies, with Romanian, Italian and Hungarian armies guarding their long northern flank on the Don, took Rostov on 23 July and pushed into the Caucasus, where they took the wrecked oilfields at Maykop and raised their flag on Mount Elbrus, but were stopped short of Grozny. Further north the 6th Army reached the Volga at Stalingrad on 23 August, the day a massive air raid reduced much of the city to rubble.
      - In the ruins Vasily Chuikov’s 62nd Army held a narrow strip along the river, fighting for every factory, street and house, while reinforcements crossed the Volga under fire. By November the Germans held about 90 per cent of the city. On 19 November the Red Army struck the Romanian armies on either side of it in Operation Uranus, and on 23 November its pincers met near Kalach, trapping the 6th Army and other units, some 250,000–330,000 men by different counts. Hitler forbade a breakout, a relief attack failed in December, and the last troops surrendered on 2 February 1943. Of about 91,000 prisoners, only some 6,000 ever returned home.
    facts:
      - [Germans reach the Volga, "23 August 1942"]
      - [Operation Uranus, "19–23 November 1942"]
      - [German surrender, "31 January – 2 February 1943, about 91,000 prisoners"]
