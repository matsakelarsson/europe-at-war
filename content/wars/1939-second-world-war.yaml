  - title: The siege of Leningrad
    date: September 1941 – January 1944
    when: "1941-09-08"
    borders: "1942-11-18"
    countries: [ru, fi, de]
    body:
      - Army Group North swept through the Baltic states in the summer of 1941 and reached the approaches to Leningrad in August, while the Finnish army advanced towards the city from the north. On 8 September German troops took Shlisselburg at the source of the Neva and cut Leningrad off by land. Hitler decided not to storm the city but to starve it and then raze it. The Germans shelled and bombed it almost daily, and with food stocks small, rations were cut again and again. From November 1941 to February 1942 many people received only 125 grams of bread a day, much of it sawdust and other fillers.
      - In the hunger winter that followed, deaths peaked at about 100,000 a month in January and February 1942, and people died at home, at work and in the streets. Supplies came only across Lake Ladoga, by boat in summer and from November on the ice road known as the Road of Life. Some 1.4 million people, mainly women and children, were evacuated during the siege. In August 1942 the city’s radio orchestra performed Shostakovich’s Seventh Symphony in the besieged city. The Red Army opened a narrow land corridor along the lake shore in January 1943 and drove the Germans back on 27 January 1944, after 872 days.
    facts:
      - [Siege of Leningrad, "8 September 1941 – 27 January 1944 (872 days)"]
      - [Lowest bread ration, "125 grams a day, November 1941 – February 1942"]
      - [Civilian dead, "about 1 million by one count, 640,000 in the city and 400,000 during evacuation"]
    markers:
      - kind: siege
        side: su
        name: Leningrad
        date: 8 September 1941 – 27 January 1944
        text: Besieged by German troops from the south and Finnish troops from the north, the city never fell.
        lonlat: [30.309, 59.938]
        lp: l
      - kind: taken
        side: de
        name: Shlisselburg
