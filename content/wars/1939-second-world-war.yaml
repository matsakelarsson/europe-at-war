  - title: Dunkirk and the fall of France
    date: 24 May – 25 June 1940
    when: "1940-05-26"
    borders: "1940-06-25"
    countries: [fr, be, gb, de, it]
    body:
      - Trapped against the coast, the British, French and Belgian armies fell back on Dunkirk. On 24 May Hitler confirmed an order halting the panzers outside the town, lifted only on 26 May, and the defenders used the pause to strengthen the perimeter. King Leopold III surrendered the Belgian army on 28 May, after 18 days of fighting. Between 26 May and 4 June Operation Dynamo carried about 338,000 soldiers, some 199,000 British and 139,000 French, to England in warships, ferries and hundreds of small boats, under constant air attack. About 40,000 French troops holding the perimeter were taken prisoner.
      - Germany attacked south across the Somme and the Aisne on 5 June. Italy declared war on France and Britain on 10 June, and German troops entered Paris unopposed on 14 June. Marshal Philippe Pétain became prime minister and asked for an armistice, while in London General Charles de Gaulle broadcast an appeal on 18 June to fight on. The armistice was signed on 22 June in the railway carriage at Compiègne where Germany had signed in 1918. About 1.8 million French soldiers were prisoners, and Germany occupied the north and the Atlantic coast, some three-fifths of France.
      - On 10 July the National Assembly, meeting at Vichy, voted full powers to Pétain by 569 votes to 80, ending the Third Republic. His “French State” governed the unoccupied south from the spa town and, in name, the whole country, while Alsace and Moselle were annexed by Germany in all but name. In Britain, de Gaulle began to build the Free French forces from the few thousand soldiers and sailors who had joined him.
    facts:
      - [Evacuated from Dunkirk, "about 338,000 (26 May – 4 June 1940)"]
      - [Armistice, "signed 22 June, in force 25 June 1940"]
      - [French prisoners of war, "about 1.8 million"]
