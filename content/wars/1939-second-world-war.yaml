        text: The government resigned rather than accept German demands. The Germans declared martial law and tried to seize the fleet, but most of it was scuttled.
        lonlat: [12.568, 55.676]
        lp: l
      - kind: event
        name: Gilleleje
        date: 6 October 1943
        text: About 80 Jews hiding in the church loft while waiting for boats to Sweden were found by the Gestapo and arrested.
        lonlat: [12.317, 56.117]
        lp: l
      - kind: event
