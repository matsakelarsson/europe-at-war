  - title: Hungary occupied
    date: March – December 1944
    when: "1944-03-19"
    borders: "1944-05-15"
    countries: [hu, ro, ua, sk, rs, pl, de]
    move_names:
      de: Deportations and death marches
    body:
      - Hungary had fought beside Germany against the Soviet Union since June 1941 and lost much of its Second Army on the Don in January 1943. Its troops had also killed some 3,000–4,000 Serbs and Jews in the Novi Sad raid of January 1942, many of them shot and pushed under the ice of the Danube. When Germany learned that the regent, Miklós Horthy, was seeking a separate peace, its forces occupied the country on 19 March 1944. Horthy stayed in office, but a pro-German government took over, and Adolf Eichmann arrived with an SS team to deport Hungary’s Jews, some 760,000 of whom were still alive within its wartime borders.
      - With the help of the Hungarian gendarmerie, Jews were forced into ghettos from April, beginning in Carpathian Ruthenia and northern Transylvania. Between 15 May and 9 July 1944 some 437,000 people were deported in 147 trains, nearly all to Auschwitz-Birkenau, where most were gassed on arrival. Under pressure from abroad Horthy halted the deportations in early July, before the Jews of Budapest could be taken. On 15 October, as the Red Army fought its way into eastern Hungary, he announced an armistice. German commandos kidnapped his son, and Horthy was forced to hand power to Ferenc Szálasi, leader of the fascist Arrow Cross.
      - Arrow Cross rule brought a new wave of terror. Tens of thousands of Budapest Jews were driven on foot towards the Austrian border in November, and militiamen shot 10,000–15,000 on the banks of the Danube over the winter. Diplomats such as the Swede Raoul Wallenberg and the Swiss Carl Lutz saved thousands with protective passes and safe houses. About 565,000 of Hungary’s Jews were killed in the war; some 119,000 survived in Budapest.
    facts:
      - [German occupation, "19 March 1944"]
      - [Jews deported, "about 437,000, 15 May – 9 July 1944"]
      - [Arrow Cross takeover, "15–16 October 1944"]
    markers:
      - kind: event
