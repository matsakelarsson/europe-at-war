    moves: Polish moves
    success: Polish success
  - id: allies
    name: Western Allies
    polities: [united-kingdom, france]
    ink: navy
    moves: British, French and Polish moves
    success: Allied success
  - id: no
    name: Norway
    polities: [norway]
    ink: teal
    moves: Norwegian moves
    success: Norwegian success
  - id: dk
    name: Denmark
    polities: [denmark]
    ink: orange
    moves: Danish moves
    success: Danish success
notes:
  - The Soviet Union was Germany’s partner under the Molotov–Ribbentrop Pact from August 1939 until Germany invaded it on 22 June 1941, and then fought on the Allied side.
  - Numbers of dead are estimates, and the sources give ranges for most of them. Places in present-day Poland are named in their Polish forms, with German names of the time where useful.
  - From 1941 the map does not show the German occupation of the Soviet-annexed lands as a border change; steps that need it draw it as an occupied area.
