  - title: Suomussalmi and the Raate road
    date: December 1939 – January 1940
    when: "1939-12-07"
    borders: "1940-01-08"
    countries: [fi, ru]
    body:
      - In the wilderness along the eastern border, from Lake Ladoga to Lapland, Soviet divisions trained for open country advanced along the few roads in long columns. The Finns, on skis and at home in the forest, cut them into isolated pockets they called motti, after the word for a stacked cubic metre of firewood, and destroyed them piece by piece in temperatures that fell below –40 °C. On 12 December a much smaller Finnish force under Paavo Talvela beat two Soviet divisions at Tolvajärvi, the first Finnish victory, and on the Kollaa river the Finns held their line throughout the war.
      - At Suomussalmi the Soviet 163rd Division was trying to cut Finland in half at its narrow waist and reach Oulu on the Gulf of Bothnia. Colonel Hjalmar Siilasvuo’s troops surrounded and destroyed it by the end of December, and in the first week of January they destroyed the 44th Division, sent to relieve it, along the Raate road. Thousands of Soviet soldiers were killed or froze to death, and the Finns captured tanks, guns and lorries they badly needed. In Lapland the Soviet advance on Kemijärvi was stopped at Salla and Pelkosenniemi. The victories made Finland’s fight famous abroad, and volunteers came to help, among them about 8,000 Swedes.
    facts:
      - [Battle of Tolvajärvi, "12 December 1939, Finnish victory"]
      - [Battle of Suomussalmi, "7 December 1939 – 8 January 1940, Finnish victory"]
      - [Raate road, "1–8 January 1940, Soviet 44th Division destroyed"]
    markers:
      - kind: battle
        side: fi
        name: Battle of Suomussalmi
        date: 7 December 1939 – 8 January 1940
        text: Siilasvuo’s troops cut the Soviet 163rd Division into pockets and destroyed it.
        lonlat: [28.889, 64.888]
        lp: l
      - kind: battle
        side: fi
        name: Raate road
        date: 1–8 January 1940
        text: The Soviet 44th Division, strung out along the forest road towards Suomussalmi, was cut up and destroyed.
        lonlat: [29.326, 64.848]
      - kind: battle
        side: fi
        name: Tolvajärvi
        date: 12 December 1939
        text: Talvela’s small force beat two Soviet divisions in the first Finnish victory of the war.
        lonlat: [31.488, 62.288]
      - kind: held
        side: fi
        name: Kollaa
        date: December 1939 – March 1940
        text: “Kollaa holds” became a Finnish byword. The line on the river held against repeated attacks until the end of the war.
        lonlat: [32.256, 62.028]
      - kind: battle
        side: fi
        name: Salla
        date: December 1939
        text: Finnish troops stopped the Soviet divisions advancing west from the border towards Kemijärvi and pushed them back.
        lonlat: [28.667, 66.833]
      - kind: battle
        side: fi
        name: Pelkosenniemi
        date: 17 December 1939
        text: Finnish troops turned back a second Soviet column heading for Kemijärvi from the north-east.
        lonlat: [27.517, 67.108]
