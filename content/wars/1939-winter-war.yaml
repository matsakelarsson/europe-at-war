        via: [[28.45, 64.72], [28.8, 64.82], [29.2, 64.85]]
  - title: The Mannerheim Line
    date: December 1939 – February 1940
    when: "1939-12-17"
    borders: "1940-02-15"
    countries: [fi, ru]
    body:
      - On the Karelian Isthmus the main Soviet effort ran into the Mannerheim Line, a chain of trenches, concrete bunkers and anti-tank obstacles from the Gulf of Finland to Taipale on Lake Ladoga. It was weaker than its later fame, but in December the Red Army attacked it in poorly coordinated waves and lost heavily, at Summa and at Taipale, where Finnish artillery broke assaults across the frozen river. Soviet tanks broke through at Summa on 19 December, but without infantry following they were destroyed or turned back.
      - Stalin replaced the commanders and gave the front to Semyon Timoshenko, who brought up fresh divisions, heavy artillery and tanks, until by February about 460,000 Soviet soldiers faced the Finns on the Isthmus. The new offensive opened on 1 February with days of bombardment, and on 11 February the Red Army broke through at Lähde near Summa. The exhausted Finnish troops fell back to an intermediate line and then, by the end of the month, to a rear line covering Viipuri. They were short of shells and reserves, and the help discussed in Britain and France had not come.
    facts:
      - [First Soviet offensive on the Isthmus, "December 1939, repulsed"]
      - [Breakthrough at Summa, "11 February 1940"]
      - [Soviet troops on the Isthmus, "about 460,000 by February 1940"]
    markers:
      - kind: battle
        side: su
        name: Summa
        date: December 1939 – 11 February 1940
        text: The Finns held here in December, but Timoshenko’s February offensive broke through at Lähde on 11 February.
        lonlat: [29.012, 60.507]
      - kind: held
        side: fi
        name: Taipale
        date: December 1939 – March 1940
        text: Finnish troops at the eastern end of the line held out under constant shelling until the end of the war.
        lonlat: [30.52, 60.62]
    arrows:
