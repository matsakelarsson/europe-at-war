id: winter-war
name: Winter War
start: "1939-11-30"
end: "1940-03-13"
tier: A
summary: A war in which the Soviet Union invaded Finland after Finland refused to cede territory near Leningrad and lease a naval base. The Finnish army held out for three and a half months against a much larger Red Army, but in the Moscow Peace of March 1940 Finland ceded about a tenth of its territory, including Viipuri, and more than 400,000 Karelians lost their homes.
countries: [fi, ru]
sides:
  - id: fi
    name: Finland
    polities: [finland]
    ink: teal
    moves: Finnish moves
    success: Finnish success
  - id: su
    name: Soviet Union
    polities: [ussr]
    ink: red
    moves: Soviet moves
    success: Soviet success
notes:
  - Places are named in Finnish as they were then. Viipuri is now Vyborg, Terijoki is Zelenogorsk, Koivisto is Primorsk and Käkisalmi is Priozersk, all in Russia.
  - Losses are estimates. Finnish dead and missing numbered about 26,000; Soviet figures range from about 127,000 to 168,000 dead and missing.
  - Front lines and the area ceded around Salla are approximate.
