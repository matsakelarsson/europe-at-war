steps:
  - title: Mainila and the invasion
    date: October – December 1939
    when: "1939-11-26"
    borders: "1939-11-30"
    countries: [fi, ru]
    body:
      - Under the secret protocol of the Molotov–Ribbentrop Pact, Finland fell in the Soviet sphere. In October 1939 Stalin demanded that Finland move its border on the Karelian Isthmus back from Leningrad, cede islands in the Gulf of Finland and its part of the Rybachy peninsula, and lease the Hanko peninsula as a naval base, offering larger but remote lands in East Karelia in return. Finland offered smaller concessions and refused Hanko. On 26 November the Soviet Union claimed that Finnish artillery had shelled its troops at the border village of Mainila. Finnish border posts reported that the shots came from the Soviet side, and most historians regard the incident as staged.
      - On 30 November the Red Army invaded along the whole border with about 450,000 men, and Soviet aircraft bombed Helsinki, killing about 100 people. The next day a puppet “Finnish Democratic Republic” under the exiled communist Otto Wille Kuusinen was proclaimed at Terijoki, the first town the Soviets took. The League of Nations expelled the Soviet Union on 14 December. Finland did not collapse, as Moscow had expected. The government was widened, Mannerheim took command, and the army fell back on the Isthmus to its main defences, while smaller forces met the Soviet columns in the northern forests.
    facts:
      - [Shelling of Mainila, "26 November 1939"]
      - [Soviet invasion, "30 November 1939"]
      - [Soviet Union expelled from the League of Nations, "14 December 1939"]
    markers:
      - kind: event
