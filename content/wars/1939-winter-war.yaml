        line: [[29.05, 60.33], [29.0, 60.45], [29.05, 60.52], [29.3, 60.55], [29.57, 60.58], [29.62, 60.68], [29.9, 60.7], [30.2, 60.66], [30.52, 60.62]]
  - title: The Bay of Viipuri
    date: February – March 1940
    when: "1940-02-28"
    borders: "1940-03-12"
    countries: [fi, ru]
    body:
      - By the end of February the Finns held a last line from Viipuri to the Vuoksi river and Taipale. The Red Army attacked Viipuri from the south and in early March sent troops across the frozen Bay of Viipuri, from the Koivisto islands the Finns had given up, to land on the western shore behind the city. Finnish coastal troops and hastily gathered units fought them on the ice and in the shore villages, while Viipuri itself, bombed almost to ruins, held out. Further east Soviet troops crossed the Vuoksi at Vuosalmi, and the defence was close to breaking.
      - At the end of January Moscow had let it be known, through Sweden, that it would negotiate with the Finnish government after all. Britain and France offered an expedition, but it would have had to cross Norway and Sweden, which refused transit, and the Finnish government judged it too small and too late. A delegation under Prime Minister Risto Ryti travelled to Moscow and accepted terms harsher than those Finland had refused in the autumn. The peace was signed late on 12 March, and the fighting ended the next day, with Viipuri still in Finnish hands.
    facts:
      - [Soviet landings across the Bay of Viipuri, "early March 1940"]
      - [Peace signed, "12 March 1940, Moscow"]
      - [Ceasefire, "13 March 1940"]
    markers:
      - kind: held
        side: fi
        name: Viipuri
        date: February – 13 March 1940
        text: Bombed almost to ruins, the city was still held by Finnish troops at the ceasefire, but it was ceded in the peace.
        lonlat: [28.767, 60.717]
      - kind: battle
        side: su
        name: Bay of Viipuri
        date: early March 1940
        text: Soviet troops crossed the ice from the Koivisto islands and gained a foothold on the western shore.
        lonlat: [28.517, 60.583]
