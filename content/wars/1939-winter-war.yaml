  - title: The Moscow Peace
    date: 13 March 1940
    when: "1940-03-13"
    borders: "1940-03-13"
    countries: [fi, ru]
    body:
      - Under the Moscow Peace Finland ceded the Karelian Isthmus with Viipuri, the northern shores of Lake Ladoga with Sortavala and Käkisalmi, the area around Salla and part of Kuusamo in the north, its part of the Rybachy peninsula and islands in the Gulf of Finland. It also leased Hanko to the Soviet Union for 30 years as a naval base. The ceded lands were about a tenth of Finland’s territory and held much of its industry. Rather than live under Soviet rule, almost all their inhabitants, more than 400,000 people, moved to the rest of Finland, many of them already evacuated during the fighting.
      - Finland had kept its independence and avoided occupation, but at a heavy cost. About 26,000 Finns were dead or missing, and Soviet losses were several times higher, by different counts from about 127,000 to 168,000 dead or missing. The Red Army’s poor showing strengthened Hitler’s belief that it could be quickly beaten, while in Moscow it led to reforms. In Finland the loss, the resettlement of the Karelians and continued Soviet pressure pushed the government towards Germany, and in June 1941 Finland joined the German war against the Soviet Union.
    facts:
      - [Moscow Peace, "signed 12 March, in force 13 March 1940"]
      - [Territory ceded, "about 9 per cent of Finland"]
      - [Karelians resettled, "about 420,000–450,000"]
    markers:
      - kind: event
        name: Viipuri
