        name: Terijoki
        date: 1 December 1939
        text: Kuusinen’s puppet government was proclaimed here. Moscow dropped it at the end of January 1940 to negotiate with the Finnish government.
        lonlat: [29.7, 60.2]
        lp: l
      - kind: taken
        side: su
        name: Petsamo
        date: December 1939
        text: The Soviet 14th Army took Finland’s Arctic port and the area around it in the first days of the war.
        lonlat: [31.228, 69.561]
