steps:
  - title: Italy enters the war
    date: June – July 1940
    when: "1940-06-10"
    borders: "1940-07-15"
    countries: [et, er, sd, ke, it, gb]
    body:
      - "Mussolini declared war on Britain and France on 10 June 1940. Prince Amedeo, Duke of Aosta, viceroy of Italian East Africa, had an army of some 250,000–290,000 men, about four-fifths of them colonial troops, with over 300 aircraft; around him the British had only a few battalions in Sudan, Kenya, British Somaliland and Aden. But with the Suez Canal closed to Italian ships and the sea routes in British hands, his army could not be reinforced or resupplied, and it was still fighting Ethiopian Patriots across much of the highlands. He stayed mostly on the defensive."
      - "Italian aircraft bombed the British airfield at Wajir in Kenya on 13 June, and Port Sudan and Aden in the following weeks. On 4 July Italian columns attacked across the Sudanese frontier and took Kassala, whose small garrison of the Sudan Defence Force withdrew after a fight, and the border post of Gallabat; in Kenya the Italians took the post of Moyale in July. After the fall of France, French Somaliland (Djibouti) went over to the Vichy government, and British Somaliland lost its ally on the western flank."
    facts:
      - [Italian declaration of war, "10 June 1940"]
      - [Kassala and Gallabat taken, "4 July 1940"]
      - [Moyale taken, "July 1940"]
