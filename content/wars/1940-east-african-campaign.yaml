  - title: The conquest of British Somaliland
    date: 3–19 August 1940
    when: "1940-08-03"
    borders: "1940-08-19"
    countries: [so, et, dj, it, gb]
    body:
      - "On 3 August 1940 some 24,000 Italian and colonial troops under General Guglielmo Nasi and General Carlo De Simone invaded British Somaliland in three columns: in the west towards Zeila and along the coast, in the centre from Jijiga through Hargeisa towards Berbera, and in the east towards Odweina. The British had about 4,500 men, most of them King’s African Rifles, Somaliland Camel Corps and Indian troops, with a battalion of the Black Watch arriving from Aden, under Brigadier Arthur Chater and then Major General Reade Godwin-Austen."
      - "The British stood at the Tug Argan gap, where the road from Hargeisa to Berbera crosses the Assa hills. From 11 to 15 August they held their hilltop posts against repeated attacks, but the Italians worked round their flanks, and Godwin-Austen was allowed to withdraw. The garrison and many civilians were taken off to Aden from Berbera by the Royal Navy by 18 August, and the Italians entered the town on 18–19 August. The British lost about 260 men, the Italian side about 2,000, most of them askari. It was the Italians’ greatest success of the campaign."
    facts:
