  - title: Amba Alagi
    date: April – May 1941
    when: "1941-05-04"
    borders: "1941-05-19"
    countries: [et, er, it, gb, za, in]
    body:
      - "The Duke of Aosta took his remaining troops in the north to the mountain fortress of Amba Alagi, on the road from Asmara to Addis Ababa, where Italy had lost a battle to Menelik II in 1895. Major General Mosley Mayne’s force of the 5th Indian Division came down from Eritrea, and Brigadier Dan Pienaar’s 1st South African Brigade, which had taken Dessie on 20 April, came up from the south. Ethiopian Patriots under Ras Seyum Mengesha joined them."
      - "The attacks began on 4 May, and by 14 May the mountain was surrounded. A shell set fire to a fuel dump and its oil fouled the last drinking water. Talks began on 16 May, and on 19 May 1941 the Duke and some 5,000 men of his garrison of about 7,000 marched out with the honours of war. He died a prisoner in Kenya the next year. Italian forces still held Gondar and the lands of Galla-Sidamo in the south-west."
    facts:
      - [Dessie taken, "20 April 1941"]
      - [Battle of Amba Alagi, "4–19 May 1941"]
      - [Surrender of the Duke of Aosta, "19 May 1941"]
