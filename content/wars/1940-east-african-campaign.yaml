  - title: Gondar
    date: August – November 1941
    when: "1941-11-13"
    borders: "1941-11-27"
    countries: [et, it, gb]
    body:
      - "The last Italian army, some 40,000 men under General Guglielmo Nasi, held Gondar and the passes around it through the rainy season. Ethiopian Patriots with a few British officers besieged the northern outpost at the Wolchefit Pass, whose commander, Colonel Mario Gonella, surrendered on 28 September 1941 when his food ran out. Major General Charles Fowkes’s 12th African Division, with Patriots and Indian, South African and Kenyan units, attacked the Kulkaber position on the road from Debre Tabor on 13 November and took it on 21 November."
      - "The final assault on Gondar began on the morning of 27 November 1941. By midday the attackers had taken Azezo airfield and reached the castles of Fasiladas, and that afternoon Nasi surrendered; some outposts held out until 30 November. About 22,000 Italian and colonial soldiers were taken prisoner. Small groups of Italians, among them officers like Amedeo Guillet, kept up a guerrilla war until 1943. Ethiopia was free again; Eritrea and Somalia stayed under British military administration until their future was settled after the war."
    facts:
      - [Wolchefit surrenders, "28 September 1941"]
      - [Kulkaber taken, "21 November 1941"]
      - [Surrender of Gondar, "27 November 1941"]
