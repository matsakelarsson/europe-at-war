  - title: Keren and the conquest of Eritrea
    date: November 1940 – April 1941
    when: "1941-01-19"
    borders: "1941-04-08"
    countries: [er, sd, it, gb, in, fr]
    body:
      - "A first British attack, on Gallabat on 6 November 1940, failed. Lieutenant General William Platt then massed the 4th and 5th Indian Divisions in Sudan. On 18 January 1941 the Italians evacuated Kassala, and Platt’s columns pursued them into Eritrea, through Agordat, taken after a battle from 28 January to 1 February, and Barentu, abandoned on the night of 31 January. The Italians fell back to Keren, where the road and railway to Asmara climb through the Dongolaas Gorge between steep granite peaks, and dug in on the heights under General Nicolangelo Carnimeo, with their best troops, Italian and Eritrean."
      - "The Battle of Keren lasted from 3 February to 27 March 1941. Indian, British and Free French troops attacked up the peaks of Sanchil, Brig’s Peak and Dologorodoc again and again and were thrown back, and some Eritrean battalions counter-attacked many times. After a new offensive from 15 March, a night attack through the gorge on 25 March cleared the road block, and on 27 March the Italians withdrew. The British lost 536 killed and 3,229 wounded; Italian losses are put at about 3,000 killed and more wounded, among them General Orlando Lorenzini. Asmara, declared an open city, was entered on 1 April, and on 8 April Massawa surrendered with 9,590 prisoners, after the Italians had scuttled the ships in its harbour."
    facts:
      - [Kassala evacuated, "18 January 1941"]
      - [Battle of Keren, "3 February – 27 March 1941"]
      - [Asmara, "1 April 1941"]
      - [Massawa surrenders, "8 April 1941"]
