  - title: Jimma and Saïo
    date: May – July 1941
    when: "1941-06-21"
    borders: "1941-07-06"
    countries: [et, it, gb, cd, be]
    body:
      - "In the south-west General Pietro Gazzera, who had succeeded the Duke of Aosta as acting viceroy, held the lakes and forests of Galla-Sidamo. The 11th and 12th African Divisions, East and West African and South African troops, attacked from Addis Ababa and from the south in heavy rains, with Ethiopian Patriots harrying the Italians on the way. Gazzera abandoned Jimma on 21 June, and some 15,000 men surrendered there."
      - "He fell back west to the Saïo plateau near Dembidolo, where a force of the Belgian Congo’s Force Publique, which had come across Sudan and had fought the Italians on the western border since March, closed the road. On 3 July 1941 Gazzera asked for terms, and on 6 July he surrendered to Major General Auguste Gilliaert with eight other generals and some 6,450 men, about 3,500 of them askari."
    facts:
      - [Jimma abandoned, "21 June 1941"]
      - [Gazzera surrenders at Saïo, "3–6 July 1941"]
