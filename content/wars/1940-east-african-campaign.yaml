  - title: From Kenya to Addis Ababa
    date: January – April 1941
    when: "1941-01-24"
    borders: "1941-04-06"
    countries: [so, et, ke, it, gb]
    body:
      - "From Kenya Lieutenant General Alan Cunningham attacked with the 11th and 12th African Divisions, East and West African and South African troops. After Operation Canvas began on 24 January 1941 they took Afmadu on 11 February and the port of Kismayo on 14 February, forced the line of the Juba at Jelib on 22 February, scattering the Italian army of the south, and on 25 February the Nigerian brigade entered Mogadishu unopposed. The Italian divisions in Somalia melted away."
      - "Cunningham’s columns then drove north up the road through the Ogaden, reaching Jijiga, about 1,000 km from Mogadishu, on 17 March. The day before, in Operation Appearance, Indian troops from Aden landed at Berbera and retook British Somaliland, taking Hargeisa on 20 March. The Italians tried to hold the Marda Pass and the hills before Harar but fell back; Harar was taken on 26 March and Dire Dawa on 29 March. On 6 April 1941 South African and African troops entered Addis Ababa, declared an open city; the viceroy and his army had gone north to Amba Alagi and south-west to Jimma."
    facts:
