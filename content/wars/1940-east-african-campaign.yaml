  - title: Gideon Force and the emperor’s return
    date: January – May 1941
    when: "1941-01-20"
    borders: "1941-04-06"
    countries: [et, sd, it, gb]
    body:
      - "In the west the British had armed the Ethiopian Patriots since the summer of 1940 through Colonel Daniel Sandford’s Mission 101. On 20 January 1941 Haile Selassie crossed the Sudanese frontier into Gojjam with Gideon Force, some 800 Sudanese and 800 Ethiopian soldiers under Major Orde Wingate, with camel trains and no artillery. Wingate’s bluff and the Patriots’ ambushes persuaded a far larger Italian force to give up the forts of Burye in early March; on 4 March the 2nd Ethiopian Battalion overran a retreating column west of Dembecha, taking about 2,000 prisoners. The emperor entered Debre Markos on 6 April."
      - "On 5 May 1941, five years to the day after Badoglio had entered it, Haile Selassie returned to Addis Ababa, escorted by some 7,000 Patriots of Ras Abebe Aregai. Gideon Force and the Patriots pursued Colonel Saverio Maraventano’s column from Debre Markos towards the Blue Nile gorge, and on 23 May he surrendered with 1,100 Italian and 7,000 colonial soldiers. The British treated Ethiopia at first as occupied enemy territory; only the Anglo-Ethiopian agreement of January 1942 gave the emperor back most of his authority."
    facts:
      - [Emperor crosses into Gojjam, "20 January 1941"]
      - [Debre Markos, "6 April 1941"]
      - [Emperor enters Addis Ababa, "5 May 1941"]
      - [Maraventano surrenders, "May 1941"]
    markers:
