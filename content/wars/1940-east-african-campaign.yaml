notes:
  - "Most soldiers on both sides were Africans and Indians. The Italian army was about four-fifths colonial troops (askari) and irregulars (banda) from Eritrea, Somalia, Ethiopia and Libya; the Commonwealth forces included the 4th and 5th Indian Divisions, the 1st South African Division, the King’s African Rifles of East Africa, the Royal West African Frontier Force from Nigeria and the Gold Coast, the Sudan Defence Force and the Somaliland Camel Corps."
  - "Casualty figures (Wikipedia, after the British official history and Italian sources): the British Commonwealth lost about 1,150 killed in battle and some 74,500 wounded or sick; Ethiopian Patriots about 5,000 killed; the Belgian Congolese force 462 dead; Italy about 17,000 killed, some 5,500 of them Italians, and about 230,000 taken prisoner."
  - "The map shows Italian East Africa until 1941 in Ethiopia and until the peace treaty of 1947 in Eritrea and Somalia, which were under British military administration from 1941; the British advance is drawn as areas."
