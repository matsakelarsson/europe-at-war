id: east-african-campaign
name: East African campaign
start: "1940-06-10"
end: "1941-11-27"
tier: A
summary: "The Second World War in the Horn of Africa. When Italy entered the war in June 1940, the Duke of Aosta’s army in Italian East Africa, some 250,000–290,000 men, most of them Eritrean, Somali and Ethiopian colonial troops, outnumbered the British forces around it many times over. It took Kassala and Gallabat in Sudan and Moyale in Kenya, and in August 1940 conquered British Somaliland. But cut off from Italy by the closure of the Suez Canal and short of fuel and spares, it could only wait. In January 1941 British, Indian, South African, East and West African, Sudanese, Free French and Belgian Congolese forces attacked from three sides, with Ethiopian Patriots rising in the highlands: from Sudan into Eritrea, where the Italians held the mountain fortress of Keren for eight weeks; from Kenya through Italian Somaliland to Addis Ababa, which fell on 6 April; and with Gideon Force and Emperor Haile Selassie into Gojjam. Haile Selassie returned to his capital on 5 May 1941, the Duke of Aosta surrendered at Amba Alagi on 19 May, and the last Italian army surrendered at Gondar on 27 November 1941. It restored Ethiopia’s independence."
countries: [et, er, so, sd, ke, dj, gb, it]
