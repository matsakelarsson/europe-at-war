  - title: The Thai offensive, Ban Phrao and Ko Chang
    date: 5–24 January 1941
    when: "1941-01-05"
    borders: "1941-01-20"
    countries: [th, kh, la]
    body:
      - On 5 January 1941, after reporting a French attack on the border town of Aranyaprathet, Thailand sent its Burapha Army into western Cambodia and its Isan Army across the Mekong into the Lao lands of Champasak. The French in Laos gave way quickly, and Thai troops occupied the right bank of the Mekong opposite Pakse. In Cambodia the Thai took Poipet and advanced along the road towards Sisophon, where the French regrouped.
      - On 16 January the French counter-attacked the villages of Yang Dang Khum and Phum Préav, which the Thai had taken and entrenched. The attack was poorly coordinated, and the French columns withdrew; the Thai did not follow up, held back by the artillery of the Foreign Legion. Thailand remembers the battle, which it calls Ban Phrao, as its victory.
      - At sea the outcome was the reverse. Before dawn on 17 January a French squadron under Captain Régis Bérenger, the light cruiser Lamotte-Picquet and four sloops, surprised Thai ships at anchor off the island of Ko Chang. The torpedo boats Chonburi and Songkhla were sunk and the coastal defence ship Thonburi was set on fire and beached, with 36 Thai sailors killed; the French lost no ships. Thai aircraft attacked the squadron as it withdrew. In the air the Thai kept the upper hand, and on 24 January their bombers raided the French airfield at Angkor.
    facts:
      - [Thai offensive, "5 January 1941"]
      - [Yang Dang Khum and Phum Préav (Ban Phrao), "16 January 1941, Thai victory"]
      - [Battle of Ko Chang, "17 January 1941, French victory"]
