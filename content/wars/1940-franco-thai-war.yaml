steps:
  - title: Phibun’s claims and the border war
    date: June 1940 – early January 1941
    when: "1940-11"
    borders: "1940-12-01"
    countries: [th, la, kh]
    body:
      - Siam had ceded the left bank of the Mekong to France after the crisis of 1893, and the right-bank lands of Sainyabuli and Champasak and the Cambodian provinces of Battambang, Siem Reap and Sisophon in the treaties of 1904 and 1907. Plaek Phibunsongkhram, prime minister since 1938, built his government on Thai nationalism, renamed the country Thailand in 1939 and made the recovery of the “lost territories” a national cause. On 12 June 1940, days before France’s defeat, the two countries signed a non-aggression pact in Bangkok. Thailand then made its ratification conditional on new borders, asking for the Mekong as the frontier in Laos and later for Battambang and Siem Reap. The Governor-General, Admiral Jean Decoux, refused.
      - Japan’s entry into Tonkin in September 1940 showed how weak the French were, and in October crowds in Bangkok demonstrated for the lost lands. From November there were skirmishes and artillery duels across the Mekong and the Cambodian border, and air raids on both sides. The Thai air force, more modern and more numerous than the French, bombed military targets in Vientiane, Phnom Penh, Sisophon and Battambang by day.
    facts:
      - [Franco-Thai non-aggression pact, "signed 12 June 1940, not ratified"]
      - [Thai army, "about 60,000 men"]
      - [French forces in Indochina, "about 50,000 men"]
