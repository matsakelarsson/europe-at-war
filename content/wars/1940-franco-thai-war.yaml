  - title: Japanese mediation and the Tokyo convention
    date: 28 January – 9 May 1941
    when: "1941-01-28"
    borders: "1941-05-10"
    countries: [th, kh, la]
    body:
      - Japan, which needed both Thailand and the French administration of Indochina for its plans in Southeast Asia, offered to mediate, and a ceasefire took effect at 10 a.m. on 28 January 1941. A preliminary armistice was signed on 31 January aboard the Japanese cruiser Natori at Saigon, and peace talks followed in Tokyo. Under Japanese pressure France signed the Tokyo convention on 9 May 1941. It ceded Battambang and Pailin, Siem Reap, Sisophon and the lands north of the Dangrek range in Cambodia, and Sainyabuli and the right bank of Champasak in Laos; Thailand paid France six million piastres. The new lands were organised as the provinces of Phra Tabong, Phibunsongkhram, Nakhon Champassak and Lan Chang.
      - The Thai government hailed the result as a victory, though it received only part of what it had claimed, and in June 1942 opened the Victory Monument in Bangkok. Japan gained most, as the arbiter of the region and with new influence in Bangkok. When Japan invaded Thailand on 8 December 1941, the Thai government agreed after a few hours of fighting to let Japanese troops pass, and it later became Japan’s ally. After the war France threatened to veto Thailand’s entry to the United Nations, and by the Washington settlement of 17 November 1946 Thailand returned all the territories to French Indochina.
    facts:
      - [Ceasefire, "28 January 1941"]
      - [Armistice aboard the Natori, "31 January 1941"]
      - [Tokyo convention, "9 May 1941"]
      - [Territories returned, "Washington settlement, 17 November 1946"]
    markers:
