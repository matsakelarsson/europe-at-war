id: franco-thai-war
name: Franco-Thai War
start: "1940-10"
end: "1941-05-09"
tier: B
summary: "A war between Thailand and the Vichy French administration of Indochina over the lands Siam had ceded to France in 1893, 1904 and 1907. After France’s defeat in Europe in June 1940 and Japan’s entry into northern Indochina in September, the government of Plaek Phibunsongkhram demanded the return of the right bank of the Mekong in Laos and of the Cambodian provinces of Battambang and Siem Reap. Clashes and air raids across the border from November 1940 were followed on 5 January 1941 by a Thai offensive into Cambodia and Laos. The Thai army held off a French counter-attack at Yang Dang Khum and Phum Préav (Ban Phrao) on 16 January, but the next day a French naval squadron sank or disabled three Thai warships off Ko Chang. Japan, which had bases in Indochina and courted Thailand, imposed a ceasefire on 28 January and mediated a settlement. By the Tokyo convention of 9 May 1941 France ceded Battambang, Siem Reap and the lands north of the Dangrek range in Cambodia, and Sainyabuli and the right bank of Champasak in Laos. Thailand celebrated a victory and built the Victory Monument in Bangkok, but returned the territories to France after the Second World War, in November 1946."
countries: [th, kh, la]
sides:
  - id: th
    name: Thailand
    polities: [thailand]
    ink: purple
    moves: Thai moves
    success: Thai success
  - id: fr
    name: Vichy France (French Indochina)
    polities: [french-indochina]
    ink: blue
    moves: French moves
    success: French success
notes:
  - The French forces in Indochina, about 50,000 men of whom some 12,000 were Europeans, obeyed the Vichy government. The Thai army had about 60,000 men and nearly 100 tanks and armoured cars; the Thai air force was stronger than the French.
  - "Losses as given in the sources: on the French side 321 killed or wounded and 178 missing, with estimates of prisoners ranging from 20 to 222; on the Thai side 54 killed on land and 36 at sea, with about 300 wounded."
  - Thai accounts call the battle of 16 January the battle of Ban Phrao; French accounts name the villages of Yang Dang Khum and Phum Préav. Its position on the map, between Poipet and Sisophon, is approximate.
