id: japanese-invasion-of-french-indochina
name: Japanese invasion of French Indochina and the coup of 1945
start: "1940-09-22"
end: "1945-05-15"
tier: C
summary: "Japan’s entry into French Indochina in 1940–1941 and its overthrow of the French administration in March 1945. After the fall of France in June 1940, Japan, at war with China, demanded that the colony stop supplies reaching China by the railway from Haiphong to Kunming. Governor-General Catroux gave way, and his successor, Admiral Decoux, loyal to the Vichy government, negotiated with General Nishihara Issaku over bases and troops. On 22 September 1940, hours after an agreement allowing 6,000 Japanese troops in Tonkin had been signed in Hanoi, the Japanese 5th Division crossed the Chinese border at Đồng Đăng and attacked the French posts; Lạng Sơn surrendered on 25 September, and on 26 September about 4,500 Japanese troops landed south of Haiphong while aircraft bombed the port. About 100 Japanese and several hundred French and Vietnamese soldiers were killed before Tokyo called a halt; Japan returned Lạng Sơn on 5 October and kept its bases in the north. On 28 July 1941, under an agreement with Vichy, some 140,000 Japanese troops occupied southern Indochina, and the United States answered by freezing Japanese assets and cutting off oil. The French administration stayed in place under Japanese military control for four more years; during the war Indochina was the base for the Japanese invasions of Malaya, Thailand and Burma. In 1944–1945 a famine in northern Vietnam, caused by Japanese and French requisitions of rice, Allied bombing of transport, the switch to industrial crops and floods and drought, killed an estimated 400,000 to 2 million people. On 9 March 1945 Japan disarmed the French in a surprise coup (Operation Meigō). The garrisons of Hanoi, Huế and Lạng Sơn resisted; at Lạng Sơn and Đồng Đăng hundreds of prisoners were executed, and General Lemonnier was beheaded after refusing to sign a surrender. General Alessandri’s column fought its way to China, where more than 3,000 colonial troops arrived by May. French losses were about 4,200 killed and 15,000 interned. Under Japanese sponsorship Emperor Bảo Đại declared the independence of the Empire of Vietnam on 11 March 1945, King Norodom Sihanouk that of Cambodia on 13 March, and King Sisavang Vong of Luang Prabang that of Laos on 8 April. The vacuum this left opened the way for the Viet Minh’s August Revolution after Japan’s surrender."
countries: [vn, kh, la, jp]
