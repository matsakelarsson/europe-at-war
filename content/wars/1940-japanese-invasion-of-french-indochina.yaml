notes:
  - The French in Indochina recognised the Vichy government from 1940 to 1944. Most of the soldiers on the French side were Vietnamese, Cambodian and Lao colonial troops.
  - Casualty figures for 1940 differ; Japanese reports gave 67 to 71 of their own killed, and French and Vietnamese losses are estimated at about 900 killed, wounded and captured. Estimates of the famine dead range from about 400,000 to 2 million.
  - The Japanese occupation of Thailand, Malaya and Burma, the Viet Minh’s August Revolution and the return of the French are told in other wars.
