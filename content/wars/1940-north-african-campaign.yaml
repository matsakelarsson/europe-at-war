  - title: Operation Crusader
    date: November 1941 – February 1942
    when: "1941-11-18"
    borders: "1942-02-01"
    countries: [ly, eg, de, it, gb]
    body:
      - On 18 November 1941 the new Eighth Army under General Alan Cunningham, and later General Neil Ritchie, attacked across the frontier to relieve Tobruk. The tank battles around the airfield of Sidi Rezegh, south-east of Tobruk, were among the most confused of the war; Rommel’s dash to the frontier late in November nearly broke the British nerve, but the Eighth Army held on. The garrison broke out to meet the relieving troops, and on 7 December Rommel, short of tanks and fuel, began to withdraw. By early January 1942 he was back at El Agheila, and the British held Cyrenaica again.
      - The swing came back within weeks. With fresh tanks landed at Tripoli, Rommel attacked again on 21 January 1942, retook Benghazi on 29 January and drove the British back to a line running south from Gazala, west of Tobruk, where both sides prepared for the next round. For the people of Cyrenaica, the towns of Benghazi and Derna changed hands for the fourth time in a year, and Italian reprisals followed against people accused of helping the British. In January 1942 the British foreign secretary, Anthony Eden, praised the Senussi’s part in the war and declared that they would not again fall under Italian rule.
    facts:
      - [Operation Crusader, "18 November – 30 December 1941"]
      - [Tobruk relieved, "late November – 10 December 1941"]
      - [Rommel’s second offensive, "21 January 1942"]
      - [Eden’s statement on the Senussi, "8 January 1942"]
