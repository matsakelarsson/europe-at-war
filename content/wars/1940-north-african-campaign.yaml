steps:
  - title: Italy invades Egypt
    date: June – September 1940
    when: "1940-09-13"
    borders: "1940-09-16"
    countries: [ly, eg, it, gb]
    body:
      - Italy declared war on Britain and France on 10 June 1940. Its colony of Libya bordered French Tunisia in the west and Egypt in the east, where British forces guarded the Suez Canal under the treaty of 1936. With the French armistice later that month the western threat disappeared, and Mussolini pressed Marshal Rodolfo Graziani, governor of Libya and the conqueror of the Senussi a decade earlier, to attack Egypt. Graziani had far more men than the British Western Desert Force, but few tanks and trucks.
      - On 13 September 1940 the Italian 10th Army crossed the frontier at Sollum and advanced about 100 km along the coast to Sidi Barrani, which it took on 16 September, and then stopped to build a chain of fortified camps and a road. In Cairo, Sayyid Muhammad Idris, the exiled head of the Senussi order, met Libyan leaders in August 1940 and agreed to raise volunteers to fight with the British against Italy; the battalions of the Libyan Arab Force were formed by the end of the year.
    facts:
      - [Italy declares war, "10 June 1940"]
      - [Italian invasion of Egypt, "13 September 1940"]
      - [Sidi Barrani taken, "16 September 1940"]
