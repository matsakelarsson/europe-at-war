  - title: Tunisia
    date: November 1942 – 13 May 1943
    when: "1943-02-19"
    borders: "1943-05-13"
    countries: [tn, dz, de, it, us, gb, fr]
    body:
      - Germany and Italy built up an army of about 250,000 men in Tunisia. During the six months of their occupation the Germans imposed heavy fines on the Jewish community and forced about 5,000 Jewish men into labour camps near the front. Moncef Bey, who had come to the throne in 1942 and tried to keep Tunisia out of the war, was deposed by the French in May 1943, accused of collaboration. In Algeria, Ferhat Abbas and other nationalists presented their Manifesto of the Algerian People in February 1943, asking for equality and self-government.
      - In February 1943 Rommel turned on the inexperienced American troops in the west. German armour broke through at Sidi Bouzid on 14 February and at the Kasserine Pass on 19–22 February, routing the US II Corps before it was stopped. In the south the Eighth Army beat off an Axis attack at Medenine on 6 March, outflanked the old French fortifications of the Mareth Line in late March and broke the Axis line at Wadi Akarit on 6 April. French troops of the Army of Africa, most of them Algerian, Moroccan and Tunisian soldiers, fought beside the British and Americans.
      - The final Allied offensive began in April. British troops entered Tunis and American troops Bizerte on 7 May 1943, and the last Axis forces, cornered on Cape Bon and around Enfidaville, surrendered on 13 May. Some 250,000 German and Italian soldiers were taken prisoner. North Africa became the base for the invasion of Sicily in July, and many of its soldiers went on to fight in Italy and France.
    facts:
      - [Kasserine Pass, "19–22 February 1943"]
      - [Mareth Line, "20–27 March 1943"]
      - [Tunis and Bizerte taken, "7 May 1943"]
      - [Axis surrender in Tunisia, "13 May 1943, some 250,000 prisoners"]
