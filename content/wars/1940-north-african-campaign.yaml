  - title: El Alamein
    date: July – November 1942
    when: "1942-10-23"
    borders: "1942-11-04"
    countries: [eg, ly, de, it, gb]
    body:
      - At El Alamein the desert narrows to about 60 km between the sea and the impassable Qattara Depression, and there General Claude Auchinleck stopped the exhausted Axis armies in the First Battle of El Alamein in July 1942. In Alexandria and Cairo the British burned papers, and many Egyptians waited to see who would win; in February 1942 British tanks had surrounded the royal palace to force King Farouk to appoint a government Britain trusted. General Bernard Montgomery took over the Eighth Army in August and beat off Rommel’s last attempt to break through, at Alam el Halfa ridge, on 30 August – 5 September. Everything turned on supplies. British aircraft and submarines from Malta and Egypt sank much of the fuel sent to Rommel across the Mediterranean.
      - By October Montgomery had about 195,000 men and more than 1,000 tanks against some 116,000 German and Italian troops who were short of fuel. He attacked on the night of 23 October behind a huge artillery barrage. After twelve days of fighting through deep minefields the Axis line broke on 4 November, and Rommel retreated, leaving behind much of the Italian infantry, who had no transport. Tobruk was retaken on 13 November and Benghazi on 20 November, and the Eighth Army entered Tripoli on 23 January 1943. The minefields of El Alamein and the desert battlefields of Libya left millions of mines behind, which still kill and maim people.
    facts:
      - [First Battle of El Alamein, "1–27 July 1942"]
      - [Alam el Halfa, "30 August – 5 September 1942"]
      - [Second Battle of El Alamein, "23 October – 11 November 1942"]
      - [Tripoli taken, "23 January 1943"]
    markers:
