notes:
  - "The Commonwealth forces included British, Australian, New Zealand, South African and Indian divisions, with Polish, Czechoslovak and Greek units and the Libyan Arab Force raised from Libyan exiles. Italy’s army in Libya included Libyan divisions, and the French armies of North Africa, which fought against the Allies for up to three days in November 1942 and then joined them, were made up largely of Algerian, Moroccan and Tunisian soldiers. Egypt, occupied by British forces under the treaty of 1936, stayed formally neutral until February 1945."
  - "Losses, by the usual counts: the British Commonwealth about 35,500 killed and some 220,000 casualties in all; the United States about 2,700 killed; Free France about 16,000 casualties; Italy about 22,300 killed; Germany about 18,600 killed and 3,400 missing. Hundreds of thousands of Italian and German soldiers were taken prisoner, some 250,000 of them in Tunisia in May 1943. Civilian deaths in the region were not counted. The campaign’s steps in the Second World War story are short; this story tells it in full."
