  - title: The Fezzan and the fall of Tripoli
    date: March 1941 – January 1943
    when: "1943-01-12"
    borders: "1943-01-23"
    countries: [ly, td, fr, gb]
    body:
      - In the south the war came from French Equatorial Africa, which had joined de Gaulle’s Free France in August 1940. Colonel Philippe Leclerc led a small motorised column across the desert from Chad and, after a siege, took the Italian fort at Kufra on 1 March 1941; there his men swore not to lay down their arms until the French flag flew over Strasbourg. In December 1942 Leclerc set out again from Chad, and in January 1943 his troops took the Italian posts of the Fezzan, among them Sabha on 12 January and Murzuk on 13 January. They then drove north to join the Eighth Army, which entered Tripoli on 23 January.
      - With Libya taken, the Italian colony came to an end in practice. Tripolitania and Cyrenaica were placed under British military administration and the Fezzan under French. In the far west of Tripolitania the British found the camp of Giado, where the Italian authorities had interned about 2,600 Jews from Cyrenaica in 1942; about 560 had died of hunger and typhus. Thousands of Libyan Jewish men had also been sent to labour camps, and Jews of British nationality to camps in Italy and Germany.
    facts:
      - [Kufra taken by the Free French, "1 March 1941"]
      - [Sabha and Murzuk taken, "12–13 January 1943"]
      - [Tripoli taken, "23 January 1943"]
      - [Giado camp, "about 2,600 interned, about 560 died"]
