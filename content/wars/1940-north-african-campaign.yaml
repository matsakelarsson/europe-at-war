  - title: Rommel and the siege of Tobruk
    date: February – November 1941
    when: "1941-04-10"
    borders: "1941-06-17"
    countries: [ly, eg, de, it, gb]
    body:
      - Hitler sent German troops to save his ally. General Erwin Rommel landed at Tripoli on 12 February 1941 with the first units of what became the Afrika Korps, and at the end of March, against his orders to wait, he attacked the thin British screen at El Agheila. The British fell back across Cyrenaica; Benghazi was abandoned on 4 April, and O’Connor was captured by a German patrol. By mid-April Rommel was at the Egyptian frontier.
      - Tobruk held out behind him. From 10 April its garrison, at first the 9th Australian Division with British and Indian troops and battalions of the Libyan Arab Force, later British, Polish and Czechoslovak units, held the perimeter for eight months, supplied by sea at night by the Royal Navy. Rommel’s assaults in April and May failed, and so did two British attempts to relieve the port, Operations Brevity in May and Battleaxe in June, which broke down against German anti-tank guns at Halfaya Pass and on the frontier.
    facts:
      - [Rommel lands at Tripoli, "12 February 1941"]
      - [Benghazi abandoned, "4 April 1941"]
      - [Siege of Tobruk, "10 April – 27 November 1941"]
      - [Operation Battleaxe, "15–17 June 1941"]
    markers:
