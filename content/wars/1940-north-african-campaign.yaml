  - title: Operation Compass
    date: December 1940 – February 1941
    when: "1940-12-09"
    borders: "1941-02-09"
    countries: [ly, eg, it, gb]
    body:
      - On 9 December 1940 General Richard O’Connor’s Western Desert Force, about 36,000 men, attacked the Italian camps around Sidi Barrani from the rear and took them within three days, with tens of thousands of prisoners. What had been planned as a five-day raid became a pursuit. Australian and British troops stormed Bardia on 3–5 January 1941 and Tobruk on 21–22 January, and took Derna.
      - As the Italians fell back along the coast road around the bulge of Cyrenaica, O’Connor sent his armour straight across the desert by way of Mechili. On 5 February it cut the road at Beda Fomm, south of Benghazi, ahead of the retreating 10th Army, which surrendered after two days of fighting. In two months the British had advanced about 800 km and taken more than 130,000 prisoners, with fewer than 2,000 casualties of their own. They stopped at El Agheila, as troops were sent to Greece.
    facts:
      - [Operation Compass, "9 December 1940 – 9 February 1941"]
      - [Bardia taken, "5 January 1941"]
      - [Tobruk taken, "22 January 1941"]
      - [Italian prisoners, "more than 130,000"]
