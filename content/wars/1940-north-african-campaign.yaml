  - title: Operation Torch
    date: November – December 1942
    when: "1942-11-08"
    borders: "1942-11-11"
    countries: [ma, dz, tn, us, gb, fr, de]
    body:
      - On 8 November 1942 American and British troops, about 107,000 men under General Dwight D. Eisenhower, landed in French North Africa, which was governed by Vichy France and had stayed out of the war since 1940. The Western Task Force, sailing straight from the United States, came ashore in Morocco at Safi, Fedala near Casablanca and Mehdia near Port Lyautey; the Centre and Eastern Task Forces, from Britain, landed around Oran and Algiers. French troops and ships resisted, fiercely at Oran and Casablanca, where the battleship Jean Bart and much of the French fleet were sunk or disabled. Admiral François Darlan, who happened to be in Algiers, ordered a ceasefire on 10 November, and fighting ended in Morocco on 11 November.
      - Under Vichy, the French authorities in Algeria had abolished the Crémieux decree in October 1940, taking French citizenship from the Jews of Algeria, and had applied Vichy’s anti-Jewish laws across North Africa, interning Jews, foreign refugees and opponents in camps in the south. Many of these measures stayed in place for months after the landings. Darlan was assassinated in Algiers in December, and General Henri Giraud took his place.
      - Germany answered by occupying the rest of France on 11 November and flying troops into Tunisia from 9 November, with the consent of the Vichy resident-general. The Allies raced east from Algiers, but German and Italian forces won the race for Tunis and stopped them in December in the hills at Medjez el Bab and Tebourba, about 30 km from the city.
    facts:
      - [Torch landings, "8 November 1942, about 107,000 men"]
      - [Darlan’s ceasefire, "10 November 1942"]
      - [First German troops in Tunisia, "9 November 1942"]
