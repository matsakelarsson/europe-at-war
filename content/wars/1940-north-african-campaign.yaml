id: north-african-campaign
name: North African campaign
start: "1940-06-10"
end: "1943-05-13"
tier: A
summary: "The Second World War in North Africa, fought from June 1940 to May 1943 between the British Commonwealth, Free France and from 1942 the United States on one side and Italy and Germany on the other. Italy invaded Egypt from Libya in September 1940 and was routed in Operation Compass. German forces under Erwin Rommel arrived in 1941, and for two years the armies swung back and forth along the coast road of Libya and western Egypt, around the besieged port of Tobruk, until the Axis advance was stopped at El Alamein in July 1942. Bernard Montgomery’s Eighth Army broke the Axis line at El Alamein in November 1942, just as American and British troops landed in Vichy French Morocco and Algeria in Operation Torch. Germany and Italy poured troops into Tunisia, where they held out until 13 May 1943, when some 250,000 of their soldiers surrendered. The war was fought across the lands of Libyans, Egyptians, Tunisians, Algerians and Moroccans, many of whom served in the armies on both sides; the Jews of Libya and Tunisia suffered persecution, internment and forced labour."
