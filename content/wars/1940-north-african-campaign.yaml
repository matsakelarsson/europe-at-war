  - title: Gazala and the fall of Tobruk
    date: May – June 1942
    when: "1942-05-26"
    borders: "1942-06-21"
    countries: [ly, eg, de, it, gb, fr]
    body:
      - On 26 May 1942 Rommel struck first, sending his armour around the southern end of the Gazala line while Italian infantry attacked its front. At its southern end, at the old well of Bir Hakeim, General Marie-Pierre Koenig’s 1st Free French Brigade, some 3,700 men including the Foreign Legion and battalions from the Pacific and French Africa, held out for two weeks against German and Italian attacks and air raids before breaking out on the night of 10–11 June. Behind the line Rommel’s forces, caught in the area the British called the Cauldron, beat off the British counter-attacks and destroyed much of their armour.
      - The Eighth Army fell back towards Egypt, and on 21 June Tobruk, which had held for eight months the year before, fell in a day with some 33,000 prisoners and large stores of fuel and supplies. Hitler made Rommel a field marshal. The Axis armies pursued the British into Egypt, beat them again at Mersa Matruh at the end of June and reached the narrow passage between the sea and the Qattara Depression at El Alamein, about 100 km from Alexandria.
    facts:
