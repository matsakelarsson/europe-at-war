notes:
  - Since the autumn of 1939 all three states had been forced to accept Soviet military bases under mutual assistance pacts. None of their governments ordered armed resistance in June 1940.
  - Many Western states, the United States among them, never recognised the annexation, and the three states regained their independence in 1990–1991. Deportation figures are from official NKVD reports and later estimates, about 10,000 from Estonia, 15,000 from Latvia and 17,500 from Lithuania in June 1941.
