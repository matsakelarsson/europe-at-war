id: soviet-occupation-of-the-baltic-states
name: Soviet occupation of the Baltic states
start: "1940-06-14"
end: "1940-08-06"
tier: C
summary: The occupation and annexation of Estonia, Latvia and Lithuania by the Soviet Union in the summer of 1940, under the secret protocols of the Molotov–Ribbentrop Pact. After Soviet ultimatums in mid-June the Red Army marched in unopposed, staged elections in July were followed by annexation on 3–6 August, and on 14 June 1941 about 40,000 people were deported from the three countries to Siberia and Kazakhstan.
