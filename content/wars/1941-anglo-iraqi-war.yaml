  - title: Fallujah, Baghdad and the Farhud
    date: May – June 1941
    when: "1941-05-13"
    borders: "1941-05-31"
    countries: [iq, jo, sy]
    body:
      - In mid-May German aircraft, about 20 to 30 fighters and bombers under the command known as Fliegerführer Irak, reached Mosul by way of airfields in Vichy French Syria, and a few Italian fighters followed later in the month. They had little fuel or spares and made no difference to the fighting. A relief force, Habforce, came from Palestine and Transjordan across 800 km of desert; its flying column, Kingcol, with the Arab Legion under John Bagot Glubb, passed Rutbah, which the Legion and British armoured cars had taken, and reached Habbaniya on 18 May.
      - On 19 May British troops took Fallujah and its bridge over the Euphrates after heavy bombing, and beat off an Iraqi counter-attack there on 22 May. On 27–28 May two small columns closed on Baghdad from the west and the north. Rashid Ali, the Golden Square officers and the Mufti of Jerusalem, Amin al-Husseini, fled to Iran, and on 31 May an armistice was signed at the edge of the city. The regent returned on 1 June.
      - On 1–2 June, in the gap before the regent’s authority was restored, mobs and some soldiers and police attacked Baghdad’s Jews in the Farhud. Most estimates of the Jewish dead range from about 180 to several hundred, with hundreds more wounded and much property looted, before troops loyal to the regent restored order. British forces occupied Iraq until 1947. The German use of Syrian airfields led to the British invasion of Syria and Lebanon in June, and Iraq became the base for the invasion of Iran in August.
    facts:
      - [Kingcol reaches Habbaniya, "18 May 1941"]
      - [Fallujah taken, "19 May 1941"]
      - [Armistice, "31 May 1941"]
      - [Farhud, "1–2 June 1941"]
    markers:
