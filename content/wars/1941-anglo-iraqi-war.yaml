notes:
  - The Iraqi polity on the map is the Kingdom of Iraq. The pro-British regent, Abd al-Ilah, and the government of Rashid Ali both claimed to speak for it; the side “Rashid Ali’s government” stands for the coup government and the Iraqi army that served it.
  - The Arab Legion was the army of the Emirate of Transjordan, under British command.
