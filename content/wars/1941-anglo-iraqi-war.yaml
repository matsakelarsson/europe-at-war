steps:
  - title: The coup and the siege of Habbaniya
    date: April – May 1941
    when: "1941-04-01"
    borders: "1941-05-07"
    countries: [iq]
    body:
      - Iraq had been independent since 1932 but was bound to Britain by the treaty of 1930, which gave the British two air bases, at Habbaniya west of Baghdad and Shaibah near Basra, and the right to move troops across the country. On 1 April 1941 four army colonels known as the Golden Square, who hoped for a German victory and an end to British influence, forced out the government, and Rashid Ali al-Gaylani became head of a “Government of National Defence”. The regent for the young King Faisal II, Abd al-Ilah, fled to Habbaniya and then to a British warship at Basra.
      - Britain invoked the treaty. Indian troops landed at Basra from 18 April, and Rashid Ali, who had been promised German help, refused to let more arrive. On 30 April the Iraqi army, by 1 May some 9,000 men with about 50 guns, occupied the plateau overlooking RAF Habbaniya, a flying school with mostly old training aircraft, a small British infantry force and Assyrian levies. At dawn on 2 May the base’s improvised squadrons, joined by bombers from Shaibah, attacked the Iraqi positions.
      - For five days the aircraft bombed and strafed the plateau while Iraqi guns shelled the base. On 6 May British infantry and Assyrian levies drove the Iraqis out of the village of Sin el Dhibban, taking over 300 prisoners, an Iraqi column coming up from Fallujah was broken up from the air, and that night the Iraqi army left the plateau.
    facts:
