id: anglo-iraqi-war
name: Anglo-Iraqi War
start: "1941-05-02"
end: "1941-05-31"
tier: B
summary: A month-long war in the Second World War between Britain and the government of Rashid Ali al-Gaylani, who had taken power in Iraq in a coup by nationalist officers in April 1941 and sought German help. Iraqi troops besieged the British air base at Habbaniya, but the base’s aircraft drove them off, a relief column crossed the desert from Transjordan, and German and Italian air support came too late. Rashid Ali fled as British forces approached Baghdad, and an armistice was signed on 31 May. The anti-Jewish riots of the Farhud followed in Baghdad.
