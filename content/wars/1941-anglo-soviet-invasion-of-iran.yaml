id: anglo-soviet-invasion-of-iran
name: Anglo-Soviet invasion of Iran
start: "1941-08-25"
end: "1941-09-17"
tier: B
summary: The joint invasion of neutral Iran by Britain and the Soviet Union in the Second World War. Wanting to secure the oil fields and the Trans-Iranian Railway as a supply route to the Soviet Union, and to expel German nationals, the two powers attacked on 25 August 1941, British and Indian troops from Iraq and the Gulf, Soviet armies from the Caucasus and Central Asia. Iran ordered a ceasefire after four days. Reza Shah abdicated in favour of his son Mohammad Reza on 16 September, and Iran stayed under Allied occupation until 1946.
