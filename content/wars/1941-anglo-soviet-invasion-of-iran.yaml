notes:
  - Most of the British force was from the Indian Army; the Royal Australian Navy also took part at Khorramshahr and Bandar Shahpur.
  - Casualty figures vary between sources. Iranian military deaths are usually put at about 800 to 850, with some hundreds of civilians killed (about 450 by one count), many in air raids; the British lost 22 killed and the Soviets about 40.
