  - title: The shah abdicates
    date: September 1941 – January 1942
    when: "1941-09-16"
    borders: "1941-09-17"
    countries: [ir]
    body:
      - Britain and the Soviet Union divided Iran into two zones of occupation, the Soviets in the north and the British in the south-west, and demanded the closing of the Axis legations and the handing over of German nationals. As Soviet troops moved towards Tehran, Reza Shah abdicated on 16 September 1941 in favour of his 21-year-old son, Mohammad Reza, who was sworn in the next day as British and Soviet troops entered the capital. The old shah was taken into exile by the British, to Mauritius and then South Africa, where he died in 1944.
      - By the Tripartite Treaty of Alliance of 29 January 1942, Britain and the Soviet Union promised to respect Iran’s independence and to withdraw within six months of the end of the war. The Trans-Iranian Railway, run by British and later American troops, became the Persian Corridor, by which about a quarter of Western aid to the Soviet Union was delivered. In 1943 Roosevelt, Churchill and Stalin met at the Tehran Conference. British and American troops left by early 1946; Soviet troops stayed until May 1946, after a crisis over Soviet-backed autonomous governments in Iranian Azerbaijan and Kurdistan.
    facts:
      - [Reza Shah abdicates, "16 September 1941"]
      - [Allied troops enter Tehran, "17 September 1941"]
      - [Tripartite Treaty, "29 January 1942"]
