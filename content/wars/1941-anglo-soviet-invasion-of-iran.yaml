steps:
  - title: Four days in August
    date: 25–29 August 1941
    when: "1941-08-25"
    borders: "1941-08-29"
    countries: [ir]
    body:
      - After Germany invaded the Soviet Union in June 1941, Iran became vital to the Allies. Its new Trans-Iranian Railway ran from the Gulf to the Caspian, the Anglo-Iranian Oil Company’s refinery at Abadan was the largest in the world, and Reza Shah’s government, which had close trade ties with Germany, refused British and Soviet demands to expel the German residents, counted at anything from several hundred to some 3,000. The shah declared Iran neutral.
      - At dawn on 25 August British and Australian warships attacked the ports at the head of the Gulf. At Abadan the sloop HMS Shoreham sank the Iranian sloop Palang, and at Khorramshahr the Australian HMAS Yarra sank the Babr and the Iranian naval commander, Rear Admiral Gholamali Bayandor, was killed; at Bandar Shahpur German and Italian merchant ships were seized. Indian troops took Khorramshahr and Abadan and moved on Ahvaz, while a second column from Iraq took Qasr-e Shirin and forced the Paitak pass towards Kermanshah.
      - The same morning Soviet armies crossed the northern border, from Julfa towards Tabriz, along the Caspian coast from Astara, with landings at Bandar Pahlavi, and from Turkmenistan towards Mashhad, while Soviet aircraft bombed Tabriz, Rasht, Qazvin and other towns. The Iranian army, built up by Reza Shah but untested, gave way almost everywhere. The prime minister resigned, and on 29 August the new government of Mohammad Ali Foroughi ordered the army to stand down; the last fighting ended the next day.
