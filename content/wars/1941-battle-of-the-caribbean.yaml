  - title: Convoys and Martinique
    date: 1942–1945
    when: "1943-07-14"
    borders: "1943-07-14"
    countries: [cu, ht, tt, fr, cw]
    view: { center: [-69.0, 16.4], size: [2100, 1450] }
    body:
      - "From the summer of 1942 the US Navy and the Royal Navy linked their convoys into one interlocking system, with main routes from Key West to Guantánamo Bay and from Guantánamo to Trinidad, and feeder convoys to the oil ports and Panama. Escorts and aircraft, among them Canadian corvettes and US blimps, sank or drove off the U-boats. On 28 August 1942 the Canadian corvette Oakville rammed U-94 off Haiti and a boarding party captured its crew; in November U-163 torpedoed the US gunboat Erie off Curaçao. Losses dropped sharply in 1943, and after that only a few U-boats came south."
      - "The French West Indies stayed outside the war under Admiral Georges Robert, the Vichy government’s high commissioner, who kept the aircraft carrier Béarn, two cruisers and a large part of the Bank of France’s gold reserve at Martinique. Under agreements with Washington the ships were immobilised and US ships watched the islands. In Martinique and Guadeloupe Robert’s rule, remembered as “an tan Robè” (in Robert’s time), brought shortages and repression, and thousands of young people left in small boats for Dominica and Saint Lucia to join the Free French, a movement called the dissidence. French Guiana rallied to the Free French in March 1943; after demonstrations in Fort-de-France and a mutiny of the garrison at Balata on 29 June 1943, Robert gave up power, and on 14 July 1943 Henri Hoppenot arrived to take over the islands for the French Committee of National Liberation."
    facts:
      - [U-94 captured, "28 August 1942"]
      - [Martinique and Guadeloupe join the Free French, "July 1943"]
