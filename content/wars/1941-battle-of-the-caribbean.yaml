  - title: Tankers in the Gulf of Mexico
    date: May 1942 – May 1943
    when: "1942-05-22"
    borders: "1942-05-22"
    countries: [mx, us, cu]
    view: { center: [-88.5, 24.2], size: [2300, 1400] }
    body:
      - "In May 1942 U-boats entered the Gulf of Mexico through the Florida Strait and the Yucatán Channel. Tankers carrying oil from Texas and Louisiana to the east coast sailed alone, often silhouetted against the lights of the coast, and in May and June 1942 dozens of ships were sunk in the Gulf. Mexico, which had seized German and Italian ships in its ports in 1941 and was selling its oil to the United States, protested when U-564 sank the Mexican tanker Potrero del Llano off Florida in the night of 13–14 May; on 21 May U-106 sank a second tanker, the Faja de Oro, off Key West. On 22 May President Manuel Ávila Camacho asked Congress for authority to declare war, and Mexico entered a state of war with Germany, Italy and Japan from that day. More Mexican tankers were sunk later in the year, the Amatlán off the coast of Tamaulipas in September."
      - "Losses fell once the US Navy began running convoys in the Gulf in the summer of 1942 and patrol aircraft and blimps flew over the shipping lanes. On 13 June the Coast Guard cutter Thetis sank U-157 off Key West. On 30 July U-166 torpedoed the passenger freighter Robert E. Lee south of the Mississippi delta, and the escort PC-566 sank the U-boat with depth charges; the wreck, the only U-boat lost in the Gulf, was found in 2001. On 15 May 1943 the Cuban submarine chaser CS-13, guided by a US aircraft, sank U-176 off the north coast of Cuba with all hands."
    facts:
      - [Potrero del Llano sunk, "13–14 May 1942"]
      - [Faja de Oro sunk, "21 May 1942"]
      - [Mexico at war from, "22 May 1942"]
      - [Ships sunk in the Gulf of Mexico, "56 (1942–1943)"]
