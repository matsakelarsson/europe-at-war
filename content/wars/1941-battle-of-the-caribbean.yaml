steps:
  - title: Operation Neuland
    date: February–April 1942
    when: "1942-02-16"
    borders: "1942-02-16"
    countries: [aw, cw, tt, lc, ve, pr]
    view: { center: [-65.5, 13.3], size: [1500, 1150] }
    body:
      - "Before the war the US Navy had patrolled the Caribbean as a neutrality zone, Britain had stationed troops on Trinidad and, after Germany overran the Netherlands in May 1940, on Aruba and Curaçao, and in the Destroyers for Bases deal of September 1940 the United States leased sites for air and naval bases in the British islands. But anti-submarine forces were thin when the first five long-range U-boats arrived. In the night of 16 February 1942 U-156 entered the harbour of San Nicolaas on Aruba, beside the Lago refinery, and torpedoed three tankers; when its crew tried to shell the refinery, the gun burst because the muzzle plug had been left in. U-67 fired six torpedoes at tankers off Willemstad on Curaçao, but four failed to explode, and U-502 sank three of the small lake tankers that carried crude oil from Lake Maracaibo. On 18 February U-161 slipped into the Gulf of Paria, Trinidad’s guarded anchorage, and torpedoed two ships; on 10 March it did the same in the harbour of Castries on Saint Lucia."
      - "The U-boats then hunted along the shipping lanes, joined by five Italian submarines on the Atlantic side of the Lesser Antilles, while U-126 sank ships in the Windward Passage within sight of the US base at Guantánamo. Many of the lake-tanker crews, among them Chinese seamen, refused to sail without escorts, and refinery output fell for a time. On 3 March a U-boat shelled Mona Island off Puerto Rico, and on 19 April U-130 shelled the oil tanks at Bullenbaai on Curaçao until Dutch shore guns drove it off. US troops had taken over the defence of Aruba and Curaçao from the British on 11 February."
    facts:
      - [Start of Operation Neuland, "16 February 1942"]
      - [U-boats in the first wave, "five German, with five Italian submarines"]
