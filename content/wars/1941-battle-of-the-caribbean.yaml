notes:
  - "The story starts on the day Germany declared war on the United States, which opened the western Atlantic to U-boat attack; the first attacks in the Caribbean came in February 1942. The Second World War, including the wider Battle of the Atlantic, has its own story."
  - "Counts of the ships lost depend on where the region is said to end. The figure of about 400 ships includes the Bahamas and the approaches to the Caribbean; within the Gulf of Mexico, 17 U-boats sank 56 merchant ships and damaged 14 others between May 1942 and spring 1943, and only one U-boat, U-166, was lost there."
  - "Mexico also sent a fighter squadron, Escuadrón 201, to the Philippines in 1945, and about 300,000 Mexican braceros worked on US farms and railways under the agreement of 1942."
