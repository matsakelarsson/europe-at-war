id: battle-of-the-caribbean
name: Battle of the Caribbean
start: "1941-12-11"
end: "1945-05-08"
tier: B
summary: "The German and Italian submarine campaign against Allied shipping in the Caribbean Sea and the Gulf of Mexico during the Second World War, part of the Battle of the Atlantic. The region mattered because of the oil of Venezuela, refined on the Dutch islands of Aruba and Curaçao and in Trinidad, the bauxite of the Guianas, needed for aircraft aluminium, and the Panama Canal. After Germany declared war on the United States on 11 December 1941, U-boats opened Operation Neuland on 16 February 1942, torpedoing tankers in the harbours of Aruba and Curaçao and in Trinidad’s Gulf of Paria. Ships sailing alone along lit coasts were easy targets, and in 1942 the Caribbean and the Gulf of Mexico saw some of the heaviest losses of the whole Atlantic war. The sinking of two Mexican tankers in May 1942 brought Mexico into the war. Losses fell sharply once the United States and Britain organised interlocking convoys from mid-1942 and covered them with aircraft from new bases leased in the British islands; by 1943 few U-boats came to the region, and several were sunk there, one of them by a Cuban submarine chaser. In all about 400 ships were sunk in the wider Caribbean, including 56 in the Gulf of Mexico. French Martinique and Guadeloupe, held for the Vichy government by Admiral Georges Robert under a US watch, went over to the Free French in July 1943."
countries: [aw, cw, tt, lc, mx, us, cu, ht, fr, ve, pr]
