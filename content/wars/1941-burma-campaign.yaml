        text: The steel and wooden bridges at Tha Makham near Kanchanaburi, built by prisoners and labourers, were bombed by British and American aircraft in February, April and June 1945. The war cemetery at Kanchanaburi holds some 7,000 prisoners’ graves.
        lonlat: [99.50, 14.04]
