  - title: The Admin Box
    date: February 1944
    when: "1944-02-04"
    borders: "1944-02-15"
    countries: [mm, bd, in, gb, jp]
    body:
      - Through 1943 the Allies reorganised. A South East Asia Command was set up under Admiral Lord Louis Mountbatten, and the Fourteenth Army was formed under Slim. Its divisions, mostly Indian with British and Gurkha units, and later East and West African divisions, were trained to stand fast when the Japanese surrounded them and to be supplied from the air. In the Arakan, XV Corps advanced again late in 1943 towards Maungdaw and Buthidaung, on either side of the Mayu range.
      - On 4 February 1944 the Japanese 55th Division struck first (Operation Ha-Go), sending a column under Major General Sakurai Tokutarō round the flank of the 7th Indian Division to cut it off from behind. The division’s administrative area at Sinzweya, at the eastern end of the Ngakyedauk Pass, became a defended “box” held by clerks, drivers, muleteers and gunners together with infantry and tanks, and was supplied by Dakota transport aircraft. On the night of 7 February Japanese troops overran its main dressing station and killed some 35 patients and medical staff. The Japanese, who had counted on capturing British supplies, ran short of food and ammunition, and on 23 February they withdrew.
      - The British counted 5,000 Japanese dead on the battlefield; Allied casualties were about 3,500. The battle of the Admin Box was the first time British and Indian troops had held and beaten a major Japanese attack in Burma, and it showed that air supply could defeat the Japanese tactic of encirclement. It also drew Allied reserves to the Arakan as the Japanese prepared their main offensive further north.
    facts:
      - [Operation Ha-Go, "from 4 February 1944"]
      - [Admin Box, "5–23 February 1944"]
      - [Main dressing station overrun, "night of 7 February 1944"]
    markers:
      - kind: battle
        side: allies
        name: Admin Box (Sinzweya)
