  - title: Arakan and the first Chindit expedition
    date: December 1942 – May 1943
    when: "1942-12-17"
    borders: "1943-03-01"
    countries: [mm, bd, in, gb, jp]
    body:
      - The first British counter-offensive was a limited advance down the Arakan coast from Chittagong towards Akyab (Sittwe) and its airfields, by the 14th Indian Division from December 1942. It reached the end of the Mayu peninsula but was stopped at Donbaik, where attacks from January to March 1943 failed against Japanese bunkers. A Japanese counter-offensive in March and April, through the hills and across the Mayu river, drove the British back by May to about where they had started. The failure, and the sickness and low morale of the troops, led to reforms in training, jungle tactics and medical care.
      - In February 1943 Brigadier Orde Wingate led the 77th Indian Infantry Brigade, some 3,000 British, Gurkha and Burmese soldiers in columns supplied from the air, from Imphal across the Chindwin deep into Japanese-held Burma (Operation Longcloth). The Chindits, named after the chinthe, the lion that guards Burmese temples, cut the Mandalay–Myitkyina railway in several places and crossed the Irrawaddy, but they were then trapped between the rivers and had to break up into small parties to get back in April. About a third of them did not return, and many survivors were too sick to fight again.
      - The damage to the railway was soon repaired, but the raid was publicised as a success in Britain and India. It also persuaded Lieutenant General Mutaguchi Renya, commander of the Japanese Fifteenth Army, that the hills along the Indian border could be crossed by an army, in either direction.
    facts:
      - [Attacks at Donbaik, "January – March 1943"]
      - [Chindits cross the Chindwin, "February 1943"]
      - [Chindits’ losses, "about a third of some 3,000 men"]
