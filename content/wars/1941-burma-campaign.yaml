notes:
  - The country was called Burma in English until 1989. Places are given by the names of the time, with today’s names in brackets at first mention (Rangoon (Yangon), Moulmein (Mawlamyine), Pegu (Bago), Akyab (Sittwe)). Japanese names are given family name first, Chinese names in pinyin (Sun Liren is better known as Sun Li-jen).
  - The Burma National Army fought on the Japanese side until 27 March 1945 and against the Japanese afterwards; it is shown as one side throughout. Thailand, allied with Japan from December 1941, occupied part of the Shan States from May 1942. The Fourteenth Army was mostly Indian, with British, Gurkha, and East and West African divisions; Kachin, Karen and Chin levies fought with the Allies.
  - Imphal and Kohima, where the Japanese offensive of 1944 was stopped, are in India (Manipur and Nagaland). The Indian side of the story, and the Indian National Army, are told here in brief.
  - "Casualty figures are uncertain. The British Empire lost about 86,600 men killed, wounded, missing and dead of disease (28,878 killed and missing); Chinese losses are put at 122,000–143,000, American at about 3,250. Estimates of Japanese dead in Burma range from 144,000 to 164,500, most of them from disease and starvation. Estimates of Burmese civilian deaths range from about 250,000 to 1 million, not counting the Bengal famine of 1943."
