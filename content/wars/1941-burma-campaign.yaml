  - title: The longest retreat
    date: late April – May 1942
    when: "1942-04-29"
    borders: "1942-05-31"
    countries: [mm, in, cn, th, gb, jp]
    body:
      - The Japanese 56th Division took Lashio on 29 April 1942, cutting the Burma Road, and drove on along it into Yunnan, until the Chinese stopped it on the Salween, where they blew up the Huitong Bridge on 5 May; Tengchong, west of the river, fell on 10 May. The British blew up the Ava Bridge over the Irrawaddy on 30 April, and the Japanese entered Mandalay on 1 May. Myitkyina, in the north, fell on 8 May. China was now cut off by land, and for three years American transport aircraft supplied it from Assam over the eastern Himalayas, “the Hump”.
      - Burma Corps retreated north-west to the Chindwin, crossed it at Shwegyin and Kalewa around 10 May under Japanese attack, leaving behind most of its tanks and vehicles, and reached Imphal in Manipur as the monsoon broke, after a retreat of some 1,600 km, the longest in the history of the British Army. Of the Chinese armies, some divisions fell back along the Burma Road into Yunnan; the 38th Division reached Imphal, while the 22nd Division and the Fifth Army’s headquarters under Du Yuming went through the Hukawng valley and the Naga hills to Assam, losing thousands of men to hunger and disease. Stilwell walked out to India with a small party, arriving on 20 May. British losses in the conquest were about 13,500, most of them missing or captured; Chinese losses are put at 40,000–61,000; Japanese losses were far lighter.
      - Hundreds of thousands of civilians fled to India, most of them Indians, who had made up much of the population of Rangoon and of the trading and working classes, and who feared the Japanese and attacks by Burmese. Some went by sea or air, but most walked over the mountain tracks into Manipur and Assam or over the Taungup pass from Arakan. Estimates of the numbers who died on the way range from about 10,000 to 80,000. In the east, Thailand, allied with Japan since December 1941, sent its Phayap Army into the Shan States, and took Kengtung (Kyaingtong) on 27 May.
    facts:
      - [Lashio taken, Burma Road cut, "29 April 1942"]
      - [Mandalay taken, "1 May 1942"]
      - [Burma Corps reaches Imphal, "May 1942"]
      - [Kengtung taken by Thailand, "27 May 1942"]
