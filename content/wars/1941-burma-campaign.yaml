  - title: Rangoon and the Chinese armies
    date: March – April 1942
    when: "1942-03-07"
    borders: "1942-04-20"
    countries: [mm, cn, jp, gb, in]
    body:
      - General Sir Harold Alexander, sent out to take command, ordered Rangoon abandoned on 7 March 1942, after the oil refinery at Syriam and the port installations had been destroyed. His troops escaped northwards only because the Japanese lifted a roadblock at Taukkyan, north of the city, to carry out their orders to take Rangoon itself, which the 33rd Division entered on 8 March. With the port lost, no more supplies could reach the defenders or China by sea, while the Japanese landed two more divisions there.
      - Chiang Kai-shek sent the Chinese Expeditionary Force, the Fifth and Sixth Armies and later the 66th Army, about 100,000 men, into Burma under the nominal command of the American general Joseph Stilwell, his chief of staff, although Chinese commanders still took their orders from Chiang. At Toungoo (Taungoo) the Chinese 200th Division under Dai Anlan held the Japanese 55th Division for some ten days in late March before breaking out.
      - In the Irrawaddy valley the British, now Burma Corps under Lieutenant General William Slim, lost Prome (Pyay) early in April. As they fell back, they blew up the wells and plant of the Yenangyaung oilfields on 15–16 April. The 1st Burma Division, cut off there by the Japanese 33rd Division and short of water in the heat, was freed on 19 April by an attack of the Chinese 38th Division under Sun Liren. Further east, the Japanese 56th Division, newly landed at Rangoon, drove from Toungoo through the Karenni and southern Shan hills towards Lashio, behind the Chinese lines. Japanese aircraft set much of Mandalay on fire on 3 April.
    facts:
      - [Rangoon abandoned, "7 March 1942"]
      - [Battle of Toungoo, "late March 1942"]
      - [Yenangyaung oilfields destroyed, "15–16 April 1942"]
    markers:
