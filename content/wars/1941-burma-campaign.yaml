  - title: Meiktila and Mandalay
    date: December 1944 – March 1945
    when: "1944-12-03"
    borders: "1945-03-20"
    countries: [mm, gb, in, jp]
    body:
      - After Imphal the Fourteenth Army followed the Japanese across the Chindwin and into central Burma. General Kimura Hyōtarō, the new commander of the Burma Area Army, chose to fight behind the Irrawaddy. Slim’s answer (Operation Extended Capital) was to make a show of crossing the river north and west of Mandalay with XXXIII Corps, while IV Corps moved in secret down the Gangaw valley to the south and crossed at Nyaungu, near Pagan, on 14 February 1945. The 19th Indian Division crossed north of Mandalay in January and the 20th west of the city in February, drawing the Japanese reserves to them.
      - From the Nyaungu bridgehead the 17th Indian Division and an armoured brigade drove some 130 km east to Meiktila, the main Japanese supply and communications centre in central Burma, attacked it on 28 February and took it in about four days of fighting, house by house; the garrison fought almost to the last man. Japanese counter-attacks cut off the town for most of March, but the division, supplied by air, held it. In the north, the 19th Division stormed Mandalay Hill on the night of 8–9 March and entered Fort Dufferin, the walled citadel of the old royal palace, on 20 March after the Japanese had left it; the palace burned in the fighting. By the end of March the Japanese armies in central Burma were broken. The battles cost the Japanese about 6,500 killed and 6,300 wounded and missing, the Allies about 2,300 killed and 15,900 wounded and missing.
      - On the coast, XV Corps took the Arakan in a third campaign there. It occupied Akyab, which the Japanese had left, on 3 January 1945, and landed at Myebon, at Kangaw, where the Japanese counter-attacked Hill 170 for days, and on Ramree Island on 21 January. On Ramree most of the Japanese garrison died trying to escape through the mangrove swamps. Airfields on the coast and islands were then used to supply the drive south.
    facts:
      - [Crossing at Nyaungu, "14 February 1945"]
      - [Meiktila taken, "28 February – early March 1945"]
      - [Fort Dufferin entered, "20 March 1945"]
      - [Akyab occupied, "3 January 1945"]
