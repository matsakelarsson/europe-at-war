id: burma-campaign
name: Burma campaign
start: "1941-12-14"
end: "1945-09-13"
tier: A
summary: "The fighting for Burma in the Second World War. Japan invaded the British colony from Thailand in December 1941 and January 1942, to cut the Burma Road that carried Allied supplies to China and to guard the flank of its conquests in Malaya, and Burmese nationalists of the Burma Independence Army under Aung San marched in with it, hoping for independence. By May 1942 the British, Indian, Burmese and Chinese armies had been driven out to India and Yunnan, and hundreds of thousands of refugees had fled on foot. Japan built the Burma Railway from Thailand with the forced labour of Allied prisoners and Asian workers, tens of thousands of whom died, and in 1943 declared Burma independent under Ba Maw. Allied counter-attacks in Arakan and Wingate’s Chindit raids in 1943 achieved little, but in 1944 the Japanese offensive into India was broken at Imphal and Kohima, while Chinese and American troops under Stilwell took Myitkyina and reopened the road to China. In 1945 Slim’s Fourteenth Army crossed the Irrawaddy, won at Meiktila and Mandalay and reached Rangoon in May; in March the Burma National Army had turned against the Japanese. Japan’s dead in Burma are estimated at 144,000–164,500, and estimates of Burmese civilian deaths range from about 250,000 to 1 million."
countries: [mm, in, jp, gb, cn, us, th, bd]
