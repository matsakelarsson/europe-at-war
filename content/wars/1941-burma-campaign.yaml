  - title: Rangoon and the end of the war
    date: April – September 1945
    when: "1945-04-10"
    borders: "1945-05-03"
    countries: [mm, jp, gb, in]
    body:
      - With the monsoon due in May, Slim sent IV Corps racing down the road and railway from Meiktila, through Pyawbwe (10 April) and Toungoo (22 April) to Pegu (Bago), which the 17th Indian Division reached on 29 April, while XXXIII Corps went down the Irrawaddy valley towards Prome. Kimura ordered Rangoon evacuated from 22 April; the Japanese command, Ba Maw’s government and Bose left for Moulmein, and the INA garrison under A. D. Loganathan kept order in the city until it surrendered to the British.
      - In Operation Dracula a Gurkha parachute battalion landed at Elephant Point, at the mouth of the Rangoon river, on 1 May, and the 26th Indian Division came ashore the next day, as the monsoon broke; on 3 May it entered Rangoon unopposed, where Allied prisoners had painted on the roof of the jail that the Japanese had gone. Troops from Pegu and Rangoon met at Hlegu on 6 May.
      - The Japanese 28th Army under Lieutenant General Sakurai Shōzō, cut off in the Pegu Yoma, tried to break out across the flooded Sittang in July to join the Japanese forces in Tenasserim. Warned by captured plans, British and Indian troops and Burmese guerrillas were waiting; nearly 10,000 men, about half of those who tried, were killed or drowned. Japanese troops took reprisals against villages they suspected of helping guerrillas, and at Kalagon near Moulmein on 7 July they killed an estimated 600 to 1,000 villagers.
      - Japan announced its surrender on 15 August. A preliminary agreement was signed in Rangoon on 28 August, the Japanese forces in South-East Asia surrendered formally at Singapore on 12 September, and those in Burma at Rangoon on 13 September. The British governor returned to a country whose towns, ports, railways and oilfields lay in ruins. Burma became independent on 4 January 1948, under the AFPFL that Aung San had led; he had been assassinated in July 1947.
    facts:
      - [Toungoo taken, "22 April 1945"]
      - [Rangoon entered, "3 May 1945"]
      - [Sittang breakout, "July 1945, nearly 10,000 Japanese dead"]
      - [Surrender in Burma, "13 September 1945"]
