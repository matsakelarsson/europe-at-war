  - title: Myitkyina and the road to China
    date: October 1943 – January 1945
    when: "1944-03-05"
    borders: "1944-08-03"
    countries: [mm, cn, us, gb, in, jp]
    body:
      - In the north, Stilwell’s Northern Combat Area Command, built around Chinese divisions trained and equipped by the Americans in India, advanced from Ledo in Assam into the Hukawng valley from late 1943, while American engineers and Indian, Chinese and African labourers built the Ledo Road behind them to link up with the Burma Road. The Chinese 22nd and 38th Divisions were joined in February 1944 by an American long-range unit of some 3,000 men, the 5307th Composite Unit, known as Merrill’s Marauders, and Kachin guerrillas raised by OSS Detachment 101 scouted ahead.
      - In the second Chindit operation (Operation Thursday), Wingate’s force, now some 20,000 men, was flown in by gliders and transport aircraft from 5 March 1944 to clearings behind the Japanese lines, “Broadway” and “Chowringhee”, and set up strongholds such as White City across the railway near Mawlu to cut the supplies of the Japanese 18th Division facing Stilwell. Wingate was killed in an air crash on 24 March. The Chindits were then put under Stilwell and used as ordinary infantry through the monsoon; the 77th Brigade under Michael Calvert, with Chinese troops, took Mogaung on 26 June, by which time disease had worn out many of its columns.
      - On 17 May the Marauders and Chinese troops seized the airfield at Myitkyina by surprise, but the town held out for 78 days, until 3 August; its commander, Major General Mizukami Genzō, ordered the last survivors to escape and took his own life. From May 1944 the Chinese armies in Yunnan under Wei Lihuang crossed the Salween, and after months of fighting took Songshan, the fortified mountain above the Burma Road, on 7 September and Tengchong on 14 September; both Japanese garrisons fought almost to the last man. Bhamo fell to Stilwell’s Chinese divisions on 15 December, and on 27 January 1945 the two Chinese forces met at Mong Yu near the border. The first convoy from Ledo reached Kunming on 4 February, on what Chiang Kai-shek named the Stilwell Road; Stilwell himself had been recalled in October 1944.
    facts:
      - [Operation Thursday, "from 5 March 1944"]
      - [Mogaung taken, "26 June 1944"]
      - [Siege of Myitkyina, "17 May – 3 August 1944"]
      - [Songshan taken, "7 September 1944"]
      - [First convoy reaches Kunming, "4 February 1945"]
