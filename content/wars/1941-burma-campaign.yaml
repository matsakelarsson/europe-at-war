  - title: Occupied Burma and the State of Burma
    date: 1942–1944
    when: "1942-07-24"
    borders: "1943-08-18"
    countries: [mm, th, jp, bd]
    body:
      - The Japanese set up a military administration and, in August 1942, a Burmese executive under Ba Maw, a former premier whom the British had jailed for opposing the war. The BIA, which had grown to 10,000–20,000 men or more, had taken over local government in many districts as the British withdrew. Some of its units, joined by armed men out for loot, turned on the Karen people, many of whom had been loyal to the British; in the Irrawaddy delta around Myaungmya in mid-1942 they destroyed some 400 Karen villages, with a death toll of about 1,800, and Burmese were killed in reprisals, until Japanese officers stopped the fighting. On 24 July the Japanese disbanded the BIA and replaced it with a smaller, disciplined Burma Defence Army under Aung San.
      - On 1 August 1943 Japan declared Burma independent as the State of Burma, with Ba Maw as head of state and Aung San as minister of war. The new state declared war on Britain and the United States, and its army became the Burma National Army (BNA). Real power stayed with the Japanese army and its military police, the Kempeitai, and Burmese were conscripted as labourers, many of them for the Burma Railway. In August 1943 Japan also handed Kengtung and the eastern part of Möngpan, occupied by Thailand since 1942, to Thailand, which ruled them as the United Original Thai State (Saharat Thai Doem), along with four northern Malay states; Thailand gave them back in 1945.
      - In Arakan, where the British retreat left no authority, Rakhine Buddhists and Muslims attacked each other’s villages in 1942; the British had armed some Muslim villagers in the north as a screen, the V Force. Both communities suffered massacres, and some 20,000–40,000 Muslims fled to Bengal; the number of dead is not known. The loss of Burma’s rice exports was also one of the causes of the Bengal famine of 1943, in which estimates of the dead range from about 0.8 to 3.8 million. In the far north, Fort Hertz (Putao) stayed in British hands throughout, supplied by air, and Kachin levies and guerrillas raised by the American OSS Detachment 101 fought the Japanese in the hills.
    facts:
      - [Burma Independence Army disbanded, "24 July 1942"]
      - [State of Burma proclaimed, "1 August 1943"]
      - [Kengtung handed to Thailand, "August 1943"]
