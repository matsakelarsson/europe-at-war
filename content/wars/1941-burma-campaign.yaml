  - title: Imphal and Kohima
    date: March – July 1944
    when: "1944-03-08"
    borders: "1944-04-20"
    countries: [in, mm, jp, gb]
    body:
      - Mutaguchi’s plan, Operation U-Go, was to destroy the British forces at Imphal before they could invade Burma, and perhaps to carry the war into India. Subhas Chandra Bose, head of the Provisional Government of Free India (Azad Hind) based in Singapore and Rangoon, hoped that the Indian National Army (INA), raised mostly from Indian soldiers taken prisoner in Malaya, would set off a rising against British rule once it crossed the border. From 8 March 1944 three Japanese divisions, some 85,000 men with INA units, crossed the Chindwin with little transport and food for about three weeks, counting on capturing British stores.
      - Slim pulled IV Corps back into the plain of Imphal, in the princely state of Manipur, where it was supplied by air, and the Japanese cut the roads to it. At Sangshak, north-east of Imphal, the 50th Indian Parachute Brigade held up part of the 31st Division for six days (20–26 March). The 31st Division under Lieutenant General Satō Kōtoku then reached Kohima, in the Naga Hills, on 4 April, cutting the road from the railhead at Dimapur. The small garrison held the ridge for two weeks, at the end around the tennis court of the deputy commissioner’s bungalow, until it was relieved on 18 April, and the fighting on the ridge went on until mid-May. INA troops fought on the southern and eastern approaches to Imphal; by Indian accounts they raised their flag at Moirang on 14 April.
      - The monsoon, hunger and disease broke the offensive. Satō withdrew from Kohima on 31 May without orders; troops from Kohima and Imphal met at Milestone 109 on the road on 22 June, and on 3 July Mutaguchi called off the offensive. The retreat to the Chindwin through the rains became a disaster. Of some 85,000 men, about 53,000–60,000 were killed, wounded, missing or sick; estimates of the Japanese dead range from about 13,400 to more than 30,000, most of them from starvation and disease. British and Indian casualties were about 17,000.
      - The battles were fought on Indian soil, among the Meitei of the Imphal valley and the Naga and Kuki peoples of the hills, whose villages were requisitioned, bombed and fought over. Many Nagas worked for the British as guides, porters and scouts, while some Kuki chiefs and Manipuris sided with the Japanese and the INA. When the British put INA officers on trial for treason at the Red Fort in Delhi in 1945–1946, the trials set off protests across India, and in independent India the INA came to be honoured as part of the freedom struggle.
    facts:
      - [Japanese cross the Chindwin, "from 8 March 1944"]
      - [Siege of Kohima, "4–18 April 1944, fighting to 22 June"]
      - [Road to Imphal reopened, "22 June 1944"]
      - [Offensive called off, "3 July 1944"]
