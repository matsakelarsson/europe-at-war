        text: Units of the Burma Independence Army and armed bands destroyed some 400 Karen villages in the delta, with a death toll of about 1,800; Burmese were killed in reprisals.
        lonlat: [94.93, 16.60]
        lp: l
      - kind: toll
        name: Northern Arakan
        date: 1942
        text: Rakhine Buddhists and Muslims attacked each other’s villages after the British withdrawal. Tens of thousands of Muslims fled to Bengal; the number of dead is not known.
        lonlat: [92.37, 20.82]
