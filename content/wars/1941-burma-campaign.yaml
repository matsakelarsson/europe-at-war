  - title: The Burma Railway
    date: 1942–1945
    when: "1942-09-16"
    borders: "1943-10-17"
    countries: [th, mm, jp, gb, au, nl, id, my, us]
    body:
      - To supply its army in Burma without the long sea route round Malaya, open to Allied submarines, Japan built a railway 415 km long from Nong Pladuk near Ban Pong in Thailand, up the valley of the Khwae Noi and over the Three Pagodas Pass, to Thanbyuzayat in Burma. Work began at both ends on 16 September 1942, after preparations from June; the two lines met at Konkoita on 17 October 1943, and the railway opened on 25 October.
      - The work was done by Allied prisoners of war and by Asian labourers, the rōmusha. Of some 61,800 prisoners, British, Dutch, Australian and American, 12,621 died, one in five. The Asian labourers, recruited with promises or forced from Burma, Thailand, Malaya and Java, among them many Tamils from the Malayan plantations, numbered at least 250,000 by most estimates; estimates of how many of them died range from about 75,000 to more than 90,000, and the true number is not known, since few records were kept for them. About 1,000 of the 12,000 Japanese and Korean soldiers and guards also died.
      - Men worked through the monsoon of 1943 in the “speedo” to finish the line on time, cutting rock by hand at places such as the Konyu cutting, later called Hellfire Pass, on short rations and under beatings by guards. Cholera, dysentery, malaria, beriberi and tropical ulcers caused most of the deaths. Allied aircraft attacked the line from 1943, and bombed the bridges over the Khwae Yai at Tha Makham near Kanchanaburi, which a novel and a film later made famous as the “bridge on the River Kwai”, in 1945. After the war 111 Japanese were tried for war crimes on the railway, and 32 were sentenced to death.
    facts:
      - [Length, "415 km"]
      - [Built, "16 September 1942 – 17 October 1943"]
      - [Allied prisoners, "about 61,800, of whom 12,621 died"]
      - [Asian labourers, "at least 250,000; estimates of the dead range from about 75,000 to more than 90,000"]
