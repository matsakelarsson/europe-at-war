        date: August 1943
        text: Handed by Japan to Thailand, with eastern Möngpan, as part of the United Original Thai State.
        lonlat: [99.61, 21.29]
      - kind: held
        side: allies
        name: Fort Hertz (Putao)
        date: 1942–1945
        text: The British outpost in the far north, held with Kachin levies and supplied by air.
        lonlat: [97.40, 27.33]
    areas:
      - style: occupied
