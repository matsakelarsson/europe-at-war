        text: The supply area of the 7th Indian Division, held for almost three weeks with supplies dropped from the air.
        lonlat: [92.449, 20.932]
      - kind: held
        side: allies
        name: Maungdaw
        date: 1944
        text: The small port on the Naf estuary, the base of the 5th Indian Division west of the Mayu range.
        lonlat: [92.37, 20.82]
        lp: l
