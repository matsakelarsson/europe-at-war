steps:
  - title: The invasion of Tenasserim
    date: December 1941 – February 1942
    when: "1941-12-14"
    borders: "1942-02-23"
    countries: [mm, th, jp, gb, in]
    body:
      - Burma had been separated from British India in 1937 and had its own government under a British governor, Sir Reginald Dorman-Smith. Japan wanted it in order to cut the Burma Road, the route by which Britain and the United States supplied Chiang Kai-shek’s China from the port of Rangoon (Yangon) by rail to Lashio and by road to Kunming, and to guard the flank of its invasion of Malaya; Burma’s rice and oil were further prizes. Burmese nationalists of the Thakin movement hoped to use Japan to win independence. Thirty young men, the Thirty Comrades, among them Aung San and Ne Win, had been trained by the Japanese on Hainan, and on 28 December 1941 they founded the Burma Independence Army (BIA) in Bangkok, a few hundred men under the Japanese colonel Suzuki Keiji. The British arrested the premier, U Saw, in January 1942 for his contacts with Japan.
      - Japanese troops crossing the Kra isthmus occupied Victoria Point (Kawthaung), at the southern tip of Burma, in mid-December 1941. On 23 December Japanese bombers struck Rangoon; estimates of the dead in the first raid range from about 1,000 to 2,000, and much of the city’s population fled. RAF fighters and the American Volunteer Group (the “Flying Tigers”), American pilots in Chinese service, fought over the city until the end of February. The Japanese Fifteenth Army under Lieutenant General Iida Shōjirō, two divisions strong, took Tavoy (Dawei) on 19 January 1942, cutting off Mergui (Myeik), which the British evacuated, and from 20 January crossed the hills from Thailand at Kawkareik. Moulmein (Mawlamyine) fell on 31 January.
      - The 17th Indian Division under Major General John Smyth fell back from river to river, from the Salween to the Bilin, where it fought from 14 to 19 February, and to the Sittang. In the early morning of 23 February, with Japanese troops close to the only bridge over the Sittang and most of the division still on the east bank, Smyth had the bridge blown. Many men swam the river or were lost; the division came out with about 3,500 infantry, some 40 percent of its strength, and without most of its guns and vehicles. The BIA, swelled by volunteers, marched in with the Japanese and set up its own local administrations behind them.
    facts:
      - [Burma Independence Army founded, "28 December 1941, Bangkok"]
      - [First bombing of Rangoon, "23 December 1941"]
      - [Moulmein taken, "31 January 1942"]
      - [Sittang bridge blown, "23 February 1942"]
