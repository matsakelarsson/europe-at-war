  - title: The Burma National Army changes sides
    date: August 1944 – June 1945
    when: "1945-03-27"
    borders: "1945-03-27"
    countries: [mm, jp, gb]
    body:
      - Japanese rule had disappointed many Burmese nationalists. Independence had brought conscription, forced labour, requisitions and the Kempeitai. In August 1944 Aung San, the communist leaders Thakin Soe and Thakin Than Tun and the socialists formed a secret Anti-Fascist Organisation, later the Anti-Fascist People’s Freedom League (AFPFL), and made contact with the Allies through Force 136, the British special operations organisation. Mountbatten backed working with them, against the objections of the Burmese government in exile at Simla and of officers who saw Aung San as a traitor.
      - On 17 March 1945 the BNA paraded in Rangoon before the Japanese and marched out, as if to fight the British. On 27 March it turned on the Japanese across the country, a day Myanmar marks as Armed Forces Day. BNA units and local guerrillas attacked Japanese garrisons, columns and stragglers in the Irrawaddy delta, the Pegu Yoma and central Burma. On 16 May Aung San met Slim at Meiktila, and on 23 June the army, renamed the Patriotic Burmese Forces, marched in the Allied victory parade in Rangoon.
      - In the hills east of Toungoo, Karen levies armed and led by Force 136 (Operation Character) ambushed the Japanese 15th Division in April as it tried to reach Toungoo before the Fourteenth Army. Kachin and Chin levies fought with the Allies in the north and west. Who had fought for whom in the war shaped the bitter politics of the years before and after independence.
    facts:
      - [Anti-Fascist Organisation formed, "August 1944"]
      - [BNA rises against the Japanese, "27 March 1945"]
      - [Aung San meets Slim, "16 May 1945"]
