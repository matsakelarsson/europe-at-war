  - title: The Vyborg–Petrozavodsk offensive and Tali-Ihantala
    date: June – August 1944
    when: "1944-06-09"
    borders: "1944-07-15"
    countries: [fi, ru, de]
    body:
      - On 9 June 1944, three days after the Allied landings in Normandy, the Red Army opened a massive offensive on the Karelian Isthmus with one of the heaviest bombardments of the war, at Valkeasaari. It broke the first Finnish line at once and the second, the VT line, at Kuuterselkä within a week, and on 20 June retook Viipuri almost without a fight. President Risto Ryti then gave Germany his personal pledge not to make a separate peace, in return for German anti-tank weapons, assault guns and aircraft. Further north the Red Army attacked in East Karelia from 21 June, and the Finns withdrew, giving up Petrozavodsk on 28 June.
      - North-east of Viipuri, between Tali and Ihantala, Finnish troops with German air support stopped the Soviet advance in the largest battle in Nordic history, fought from 25 June to 9 July. The Finns also held the Vuoksi at Vuosalmi and the Bay of Viipuri, and in August they encircled and mauled two Soviet divisions at Ilomantsi. The front stabilised, and with its forces needed for the advance on Germany, the Soviet leadership agreed to talks. Ryti resigned on 1 August and Mannerheim became president, which freed Finland from Ryti’s pledge.
    facts:
      - [Soviet offensive, "from 9 June 1944"]
      - [Viipuri lost, "20 June 1944"]
      - [Battle of Tali-Ihantala, "25 June – 9 July 1944, Finnish defensive victory"]
    markers:
