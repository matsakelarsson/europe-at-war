id: continuation-war
name: Continuation War
start: "1941-06-25"
end: "1944-09-19"
tier: A
summary: A war between Finland and the Soviet Union fought alongside Germany’s war in the east, in which Finland retook the lands lost in the Winter War and occupied much of East Karelia in 1941. A Soviet offensive in 1944 drove the Finns back until it was stopped at Tali-Ihantala, and in the Moscow Armistice of 19 September 1944 Finland restored the 1940 border, ceded Petsamo and leased Porkkala to the Soviet Union.
countries: [fi, ru]
sides:
  - id: fi
    name: Finland
    polities: [finland]
    ink: teal
    moves: Finnish moves
    success: Finnish success
  - id: su
    name: Soviet Union
    polities: [ussr]
    ink: red
    moves: Soviet moves
    success: Soviet success
  - id: de
    name: Germany
    polities: [germany, german-occupied-ussr]
    ink: slate
    moves: German moves
    success: German success
notes:
  - Finland was never formally allied to Germany. It fought as a co-belligerent and coordinated its operations with the German army, and Finnish writers long presented the war as a separate conflict that continued the Winter War.
  - Places in the lands ceded in 1940 are given their Finnish names. Viipuri is now Vyborg in Russia. The Finnish administration called Petrozavodsk Äänislinna and Medvezhyegorsk Karhumäki.
  - The base map shows the lands retaken in 1941 as Finnish until 1944. The occupation of East Karelia beyond the 1939 border is drawn as an area, and it and the front lines are approximate.
