  - title: The blockade of Leningrad from the north
    date: September 1941 – January 1944
    when: "1941-09-08"
    borders: "1942-11-18"
    countries: [fi, ru, de]
    body:
      - On the Karelian Isthmus the Finnish army halted at the end of August 1941, roughly at the old border and some 30 km from the centre of Leningrad. On 8 September German troops took Shlisselburg on the southern shore of Lake Ladoga, closing the land blockade of the city. Hitler wanted the Finns to attack Leningrad from the north, but Mannerheim and the government refused, and the Finnish line stayed where it was until 1944. Whether Finland thereby spared the city or helped to starve it is still debated. Its army closed the northern side of the ring and tied down Soviet troops.
      - Leningrad’s only link with the rest of the country ran across Lake Ladoga, between the German and Finnish lines, by boat in summer and over the ice, on the “Road of Life”, in winter. Finnish, German and Italian boats tried to cut the lake route in 1942 without success. By one widely cited count about 640,000 civilians died in the city and some 400,000 more during evacuation, most of them of hunger in the winter of 1941–1942. The Red Army opened a narrow land corridor south of the lake in January 1943 and broke the German siege lines in January 1944, after 872 days.
    facts:
      - [Land blockade closed, "8 September 1941"]
      - [Finnish line on the Isthmus, "about 30 km from the centre of Leningrad"]
      - [Siege lifted, "27 January 1944, after 872 days"]
    markers:
      - kind: siege
        side: su
