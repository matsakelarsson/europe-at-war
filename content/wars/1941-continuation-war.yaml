steps:
  - title: June 1941 and the reconquest
    date: June – September 1941
    when: "1941-06-25"
    borders: "1941-09-01"
    countries: [fi, ru, de]
    body:
      - Finland’s leaders had secretly coordinated with Germany since late 1940, and German troops were already in northern Finland when Germany invaded the Soviet Union on 22 June 1941. When Soviet aircraft bombed Finnish towns and airfields on 25 June, the government declared that Finland was at war. In the far north, German and Finnish troops attacked towards Murmansk and the railway south of it in Operation Silver Fox, but they were stopped on the Litsa river and in the forests east of Salla, short of their goals. The Soviet base at Hanko, cut off, was besieged until its garrison left by sea in December.
      - The Finnish Army of Karelia attacked north of Lake Ladoga on 10 July, reached the lake’s shore within a week and took Sortavala in mid-August. On the Karelian Isthmus the Finns attacked in August, surrounded Soviet divisions on the north-western shore of Ladoga, which escaped by boat, and retook Viipuri on 29 August. By the end of the month they had reached the 1939 border and in places gone beyond it. Most Finns saw this as winning back what had been taken in 1940. The army, however, went further.
    facts:
      - [Finland at war, "25 June 1941"]
      - [Viipuri retaken, "29 August 1941"]
      - [Hanko evacuated by the Soviets, "December 1941"]
    markers:
      - kind: air
