  - title: The Moscow Armistice
    date: September 1944
    when: "1944-09-19"
    borders: "1944-09-19"
    countries: [fi, ru]
    body:
      - Finland broke off relations with Germany on 2 September, and a ceasefire came into force on 4–5 September. The armistice, signed in Moscow on 19 September, restored the border of 1940 and gave Petsamo, Finland’s outlet to the Arctic Ocean, to the Soviet Union. Porkkala, a peninsula just west of Helsinki, was leased to the Soviet Union for 50 years as a naval base in place of Hanko. Finland agreed to pay reparations, later fixed at 300 million US dollars in goods over six years, and to disarm or expel the German troops still in the country, which led to the Lapland War.
      - Finland also had to legalise the Communist Party, ban organisations the Soviet Union considered fascist, put its wartime leaders on trial and accept an Allied Control Commission led by the Soviet Union. About 63,000 Finns had been killed or gone missing in the war, and Soviet losses are put at 250,000–305,000 dead or missing. The Karelians who had returned home, some 260,000 people, had to leave again. Finland was not occupied and kept its democratic institutions. The Paris Peace Treaty of 1947 confirmed the new border, and the Soviet Union gave Porkkala back in January 1956.
    facts:
      - [Ceasefire, "4–5 September 1944"]
      - [Moscow Armistice, "19 September 1944"]
      - [Finnish dead and missing, "about 63,000"]
