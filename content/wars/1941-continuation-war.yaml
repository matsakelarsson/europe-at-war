  - title: East Karelia and the Svir
    date: September – December 1941
    when: "1941-09-09"
    borders: "1941-12-06"
    countries: [fi, ru]
    body:
      - The Finnish army did not stop at the old border. In September the Army of Karelia advanced into Soviet East Karelia, reached the Svir river between Lakes Ladoga and Onega and crossed it to hold a bridgehead on the southern bank, where it expected to meet German troops coming from the south. They never arrived. The German drive took Tikhvin in November but was thrown back in December. The Finns took Petrozavodsk, the Karelian capital, on 1 October and Medvezhyegorsk at the northern end of Lake Onega in early December, after which Mannerheim halted the offensive.
      - Many Finnish leaders hoped to annex East Karelia, home to Finnic Karelians and Vepsians, as part of a Greater Finland. A military administration ran the occupied area. Its Finnic inhabitants were favoured, while many of its ethnic Russians, nearly a third of those who had stayed, were held in internment camps, where thousands died of hunger and disease, most of them in 1942. Of about 64,000 Soviet prisoners of war taken by Finland, at least 18,000 died in Finnish camps. From 1942 the front settled into trench warfare that lasted until the summer of 1944.
    facts:
      - [Petrozavodsk taken, "1 October 1941"]
      - [Medvezhyegorsk taken, "early December 1941"]
      - [Soviet prisoners who died in Finnish camps, "at least 18,000 of about 64,000"]
    markers:
      - kind: held
        side: fi
        name: Svir river
        date: September 1941 – June 1944
        text: The Finnish front ran along the Svir for almost three years, with a bridgehead on its southern bank.
        lonlat: [33.55, 60.75]
      - kind: taken
        side: fi
        name: Petrozavodsk
        date: 1 October 1941
        text: The capital of Soviet Karelia, renamed Äänislinna by the Finnish administration. Several internment camps for Russian civilians were set up here.
        lonlat: [34.333, 61.783]
      - kind: taken
        side: fi
        name: Medvezhyegorsk
        date: December 1941
        text: Taken after heavy fighting in the cold. Soviet attempts to retake it in 1942 failed.
        lonlat: [34.467, 62.9]
      - kind: held
        side: fi
        name: Rukajärvi
        date: 1941–1944
        text: The northernmost Finnish front in East Karelia, near the village of Rugozero, held until the armistice.
        lonlat: [32.783, 64.083]
      - kind: taken
        side: de
        name: Tikhvin
        date: 8 November 1941
        text: German troops took the railway town on their way towards the Svir but were driven out on 9 December.
        lonlat: [33.533, 59.65]
