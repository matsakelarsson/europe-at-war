  - title: The Java Sea and the fall of Java
    date: 27 February – 9 March 1942
    when: "1942-02-27"
    borders: "1942-03-08"
    countries: [id, nl, gb, us, au, jp]
    body:
      - "Two Japanese invasion fleets now converged on Java. Doorman sailed from Surabaya with five cruisers and nine destroyers of four navies to meet the eastern one, and on the afternoon and night of 27 February fought the escorting Japanese cruisers and destroyers north of Surabaya, in the largest naval battle since Jutland. Japanese long-range torpedoes and gunnery broke up his force: the Dutch cruisers De Ruyter and Java and three destroyers were sunk, and Doorman went down with his flagship, with about 2,300 Allied sailors killed; the Japanese lost no ships. The surviving cruisers, USS Houston and HMAS Perth, ran into the western invasion fleet in Bantam Bay on the night of 28 February and were sunk in the battle of the Sunda Strait, and the damaged HMS Exeter and two destroyers were sunk on 1 March."
      - "On 1 March the Japanese 16th Army under Lieutenant General Imamura Hitoshi landed at three places, at Merak and Bantam Bay in the west, at Eretan Wetan, from where a detachment seized the airfield at Kalijati the same day, and at Kragan in the east. The Dutch declared Batavia an open city and the Japanese entered it on 5 March; the army fell back on Bandung, and the last Allied ships and aircraft escaped from Tjilatjap to Australia. On 8 March, at Kalijati, Governor-General Tjarda van Starkenborgh Stachouwer and the army commander, Lieutenant General Hein ter Poorten, accepted Imamura’s demand for unconditional surrender, which took effect on 9 March. About 80,000 Dutch, British, Australian and American soldiers went into captivity."
      - "The Japanese interned some 100,000 European civilians, women and children among them, in camps where many thousands died, and sent Allied prisoners to the Burma Railway and Japan. Indonesians, who at first had often welcomed the Japanese, came to know the occupation through forced deliveries of rice and the labour of the romusha, millions of Indonesians called up for work; of the 200,000–500,000 sent from Java to other islands and abroad, few survived. The famine of 1944–1945 in Java was among the worst of the war. At the same time the Japanese let the nationalists organise, trained Indonesian youth and a volunteer army, PETA, and in 1945 allowed preparations for independence, which Sukarno and Hatta proclaimed on 17 August 1945 (see the Indonesian National Revolution)."
    facts:
      - [Battle of the Java Sea, "27 February 1942, about 2,300 Allied sailors killed"]
      - [Battle of the Sunda Strait, "28 February – 1 March 1942"]
      - [Japanese landings on Java, "1 March 1942"]
      - [Surrender at Kalijati, "8 March 1942, effective 9 March"]
