id: dutch-east-indies-campaign
name: Dutch East Indies campaign
start: "1941-12-16"
end: "1942-03-09"
tier: B
summary: "Japan’s conquest of the Dutch East Indies and British Borneo in 1941–1942, the goal of its southern advance: the oil of Borneo and Sumatra, which Japan had been denied by the American, British and Dutch embargo of 1941, and the rubber, tin and rice of the islands. From mid-December 1941 Japanese forces took the oil towns of British Borneo, then from January 1942 Tarakan and Balikpapan in Dutch Borneo, Manado, Kendari and Makassar in Celebes and Ambon in the Moluccas, in a series of amphibious and airborne landings that closed in on Java from east and west. The Allies formed a joint command, ABDA (American–British–Dutch–Australian), but it had too few ships and aircraft. Japanese paratroopers seized the refineries at Palembang in Sumatra on 14 February, the day before Singapore fell, and the Japanese landed on Bali and Timor. The Allied fleet under Rear Admiral Karel Doorman was destroyed in the battle of the Java Sea on 27 February, the Japanese landed on Java on 1 March, and on 8 March the Dutch commander and the governor-general surrendered at Kalijati. Australian commandos and Timorese fought on in Portuguese Timor until early 1943. The Japanese occupation that followed lasted until 1945; a later UN report estimated that some four million people in the Indies died of famine and forced labour."
countries: [id, my, bn, tl, nl, gb, us, au, jp]
