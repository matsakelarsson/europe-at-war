steps:
  - title: Borneo, Celebes and Ambon
    date: December 1941 – February 1942
    when: "1941-12-16"
    borders: "1942-01-24"
    countries: [my, bn, id, nl, gb, us, au, jp]
    body:
      - "The first targets were the oilfields. A Japanese force from Cam Ranh Bay landed at Miri in Sarawak and Seria in Brunei on 16 December 1941, after the British had wrecked the wells, and took Kuching, the capital of the Brooke Raj, on 24–25 December against a small Punjabi garrison. Labuan, Jesselton and Sandakan in North Borneo followed in January. On 11 January 1942 Japanese troops from Mindanao landed on Tarakan, an oil island off north-eastern Borneo; the Dutch garrison surrendered the next day, and when Dutch coastal guns, not told of the surrender, sank two Japanese minesweepers, the Japanese executed some 200 Dutch prisoners. The same day naval paratroopers, the first Japanese airborne troops used in the war, dropped on the airfield at Langoan near Manado in northern Celebes while troops landed on the coast."
      - "The next landings came down the Makassar Strait and the Molucca Sea. At Balikpapan, the great refinery town of eastern Borneo, four American destroyers attacked the Japanese transports at night on 24 January and sank four of them, the first American surface action of the war, but the town fell; the Dutch had set the oil installations on fire, and in February the Japanese killed dozens of Dutch soldiers and civilians there in reprisal. Kendari in south-eastern Celebes, with its airfield, fell on 24 January. On Ambon the Dutch garrison and the 1,100 Australians of Gull Force held out from 30 January to 3 February; in the following weeks the Japanese killed more than 300 of the Australian and Dutch prisoners at Laha airfield. Makassar fell on 9 February and Banjarmasin on 10 February."
    facts:
      - [Miri and Seria, "16 December 1941"]
      - [Tarakan and Manado, "11–12 January 1942"]
      - [Balikpapan, "23–24 January 1942"]
      - [Ambon, "30 January – 3 February 1942"]
