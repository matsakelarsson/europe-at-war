notes:
  - "The Dutch colonial army (KNIL) had some 85,000 men in the Indies in early 1942, most of them Indonesian soldiers, many with little training; with the British, American and Australian forces the Allies had perhaps 140,000–150,000 men on land. The Japanese 16th Army and the forces landed in Borneo and the east were smaller, but held command of the air and sea throughout."
  - "Indonesian attitudes to the invasion were mixed. Many welcomed the end of Dutch rule, and in some places, as in Aceh, local people rose against the Dutch before the Japanese arrived; others served loyally in the KNIL. The Japanese released the nationalist leaders Sukarno and Mohammad Hatta, whom the Dutch had exiled, and worked with them during the occupation."
  - Place names are given in modern Indonesian spelling, with the colonial names where the English sources use them (Batavia for Jakarta, Tjilatjap for Cilacap).
