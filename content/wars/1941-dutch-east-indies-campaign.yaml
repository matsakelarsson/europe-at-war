  - title: Palembang, Bali and Timor
    date: February 1942 – February 1943
    when: "1942-02-14"
    borders: "1942-02-20"
    countries: [id, tl, nl, gb, au, jp]
    body:
      - "On 14 February some 300–400 Japanese army paratroopers dropped on the airfield and the oil refineries at Pladju near Palembang in southern Sumatra, the largest in the Indies. They took the airfield and the Pladju refinery, which the Dutch managed only partly to destroy, and held on until the 38th Division came up the Musi river the next day. Singapore surrendered on 15 February, and the Allied forces withdrew from Sumatra to Java. Ships fleeing Singapore were sunk in the Bangka Strait; on 16 February Japanese soldiers on Bangka Island killed dozens of soldiers and sailors who had come ashore on Radji Beach and shot 22 Australian army nurses, of whom one survived. On 19 February the Japanese landed at Sanur on Bali, and in the night that followed Dutch and American ships failed to break up the landing in the battle of the Badung Strait."
      - "Timor was divided between the Dutch west and Portuguese Timor in the east. In December 1941 a small Dutch and Australian force had landed at Dili against the protests of neutral Portugal. On the night of 19–20 February 1942 the Japanese landed at Dili and on the south-west coast of the island, and dropped paratroopers near Kupang; the Australian Sparrow Force in the west surrendered on 23 February. On the same day as the landings, 19 February, Japanese carrier aircraft bombed Darwin in northern Australia. In Portuguese Timor about 300 Australian commandos of the 2/2nd Independent Company, with Dutch troops and Timorese helpers, fought a guerrilla campaign in the mountains until the last of them were taken off by sea on 10 February 1943. The Japanese burned villages and killed in reprisal, and estimates of the Timorese who died during the occupation range from 40,000 to 70,000."
    facts:
      - [Paratroopers at Palembang, "14 February 1942"]
      - [Bangka Island massacre, "16 February 1942"]
      - [Landings on Bali and Timor, "19–20 February 1942"]
      - [Last Australians leave Timor, "10 February 1943"]
