  - title: The battle of Singapore
    view:
      center: [103.82, 1.37]
      size: [70, 56]
    date: 8–15 February 1942
    when: "1942-02-08"
    borders: "1942-02-15"
    countries: [sg, my, gb, au, in, jp]
    body:
      - "Singapore’s great coastal guns pointed out to sea, though most could also fire landwards, and the north shore of the island facing Johor had few defences. Percival had some 85,000 men, many of them newly arrived, against about 30,000–36,000 Japanese, who were short of ammunition. Expecting the attack in the north-east, he spread his troops along the whole coast. After a feint by the Imperial Guards at Pulau Ubin and days of shelling, the Japanese 5th and 18th Divisions crossed the Johor Strait in boats on the night of 8 February and landed in the north-west around Sarimbun, held thinly by the Australian 22nd Brigade. About 13,000 men were ashore by morning. On 9 February the Imperial Guards attacked at Kranji, where they suffered heavily from burning oil on the water, but the Australian 27th Brigade withdrew."
      - "The Japanese took Bukit Timah, the highest ground, with the island’s main food and fuel depots, on 11 February, and the reservoirs that supplied the city with water. Over the next days the British were pressed back into a perimeter around the city, crowded with a million civilians and refugees and shelled and bombed day and night. On 13–14 February the 1st Malay Brigade, with the Malay Regiment, fought the 18th Division along the Pasir Panjang ridge; at Bukit Chandu Lieutenant Adnan Saidi’s company fought until it was overrun, and he was killed after his capture. On 14 February Japanese soldiers entering the Alexandra Hospital killed about 200 patients and staff, some in a surgery during an operation."
      - "With water about to run out and his commanders against a counter-attack, Percival went under a flag of truce to the Ford factory at Bukit Timah on the afternoon of 15 February, the first day of the Chinese New Year, and accepted Yamashita’s demand for unconditional surrender. The fighting stopped at 20:30. Some 80,000 British, Indian, Australian and local troops went into captivity, in addition to about 50,000 taken in Malaya. Churchill called it “the worst disaster and largest capitulation in British history”. The loss of Singapore shook British prestige across Asia, and Indian prisoners were urged by the Japanese and by Indian nationalists to join a new Indian National Army; tens of thousands did."
    facts:
      - [Japanese landing in the north-west, "8 February 1942, about 20:30"]
      - [Bukit Timah taken, "11 February 1942"]
      - [Alexandra Hospital massacre, "14–15 February 1942, about 200 killed"]
      - [Surrender, "15 February 1942, at the Ford factory, Bukit Timah"]
      - [Prisoners at Singapore, "about 80,000"]
    markers:
      - kind: battle
        side: jp
        name: Sarimbun
        date: 8–9 February 1942
        text: The first Japanese landings, in the mangroves and creeks of the north-west, against the Australian 22nd Brigade.
        lonlat: [103.694, 1.426]
        lp: l
      - kind: battle
        side: jp
        name: Kranji
        date: 9–10 February 1942
        text: The Imperial Guards landed here, west of the causeway, against the Australian 27th Brigade.
        lonlat: [103.758, 1.430]
        lp: t
      - kind: event
        side: jp
        name: Pulau Ubin
        date: 7–8 February 1942
        text: The Imperial Guards occupied the island as a feint, confirming the British in their belief that the attack would come in the north-east.
        lonlat: [103.960, 1.410]
      - kind: treaty
        side: jp
