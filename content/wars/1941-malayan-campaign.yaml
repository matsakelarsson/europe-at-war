  - title: Kampar, Slim River and Kuala Lumpur
    date: 30 December 1941 – 11 January 1942
    when: "1941-12-30"
    borders: "1942-01-07"
    countries: [my, jp, gb, in]
    body:
      - "At Kampar, where the road ran between the Kinta hills and the swamps, the 11th Division made a stand. From 30 December 1941 to 2 January 1942 the British Battalion, made up of the survivors of the Leicestershire and East Surrey regiments, held Green Ridge and Thompson’s Ridge against the Japanese 41st Regiment, and Gurkha and Sikh battalions counter-attacked. But the Japanese, who had captured boats at Penang, landed troops along the coast behind the position at Telok Anson (Teluk Intan) and the British had to withdraw again."
      - "On 7 January a Japanese column of tanks under Major Shimada Toyosaku broke through the positions of the 12th and 28th Indian brigades at Trolak and Slim River in a night attack, rolling down the road for 30 km and seizing the bridge over the Slim River intact. The two brigades were destroyed as fighting units, and more than 3,000 men were captured. General Sir Archibald Wavell, who had just been named Allied supreme commander in the region, ordered Percival to give up central Malaya and hold Johor. The Japanese entered Kuala Lumpur, the capital of the Federated Malay States, on 11 January. On the east coast they had taken Kuantan and its airfield on 3 January."
    facts:
      - [Battle of Kampar, "30 December 1941 – 2 January 1942"]
      - [Battle of Slim River, "7 January 1942"]
      - [Kuala Lumpur taken, "11 January 1942"]
