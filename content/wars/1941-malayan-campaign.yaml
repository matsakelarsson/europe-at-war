  - title: Occupation, resistance and the return of the British
    date: 1942–1945
    when: "1942-03"
    borders: "1943-10-18"
    countries: [my, sg, th, jp, gb]
    body:
      - "Singapore became Syonan-to, “Light of the South”, and Malaya was ruled by the Japanese army. The occupiers favoured the Malays and Indians over the Chinese, recruited Malay volunteers and police, and backed the Indian independence movement: the Indian National Army, formed from prisoners taken in Malaya and Singapore, and from October 1943 the Provisional Government of Free India (Azad Hind) of Subhas Chandra Bose, proclaimed in Singapore. Shortages, the forced labour of tens of thousands of Malayans, many of whom died on the Burma Railway, and the Kempeitai’s brutality marked the occupation. Most of the Allied prisoners were held at Changi and from 1942 sent in thousands to the Burma Railway and to Borneo and Japan. Under a treaty signed in Bangkok in August 1943 Japan handed the four northern Malay states, Kedah, Perlis, Kelantan and Terengganu, to Thailand on 18 October 1943."
      - "The armed resistance came mostly from the Chinese and was led by the Malayan Communist Party. Its Malayan People’s Anti-Japanese Army (MPAJA), formed in the jungle from early 1942 out of groups that British officers of the 101st Special Training School had armed and trained just before the fall of Singapore, grew to some 7,000 fighters by 1945. Its secretary general, Lai Teck, was later found to have worked for the Japanese, and on 1 September 1942 Japanese troops surrounded a meeting of the party’s leaders at the Batu Caves and killed many of them. From 1943 officers of the British Force 136, among them John Davis and the Chinese agent Lim Bo Seng, who died in Japanese hands in 1944, reached the MPAJA by submarine, and in 1945 it was armed and supplied by air. There was also a smaller Malay resistance, the Wataniah of Pahang."
      - "Japan surrendered on 15 August 1945 before the planned British invasion of Malaya, Operation Zipper, could take place. British troops landed unopposed at Morib and Port Dickson on 9 September, and on 12 September Lord Louis Mountbatten received the surrender of all Japanese forces in South-East Asia in the Municipal Building in Singapore. The MPAJA had come out of the jungle and taken over many towns, where it held courts and executed people it called collaborators, and Malays and Chinese clashed in several places. It was disbanded in December 1945, but its men and their hidden weapons formed the core of the army the Malayan Communist Party took back to the jungle in 1948 (see the Malayan Emergency). Thailand gave the four states back after the war."
    facts:
      - [Four northern states handed to Thailand, "18 October 1943"]
      - [Azad Hind proclaimed in Singapore, "21 October 1943"]
      - [Batu Caves ambush, "1 September 1942"]
      - [Japanese surrender in Singapore, "12 September 1945"]
    markers:
      - kind: treaty
        side: bc
        name: Singapore (Syonan-to)
        date: 12 September 1945
        text: Renamed by the Japanese in 1942. Azad Hind was proclaimed here in 1943, and Mountbatten received the Japanese surrender in the Municipal Building in 1945.
        lonlat: [103.851, 1.290]
        lp: l
      - kind: event
        side: jp
        name: Changi
