notes:
  - "Times and dates are local. The landing at Kota Bharu began at about 00:30 Malayan time on 8 December 1941, when it was still the morning of 7 December in Hawaii; the attack on Pearl Harbor began about an hour later. Japan’s declaration of war was delivered afterwards."
  - "The Commonwealth forces in Malaya were British, Indian (the largest part, including Gurkhas), Australian (the 8th Division) and Malayan (the Malay Regiment, the volunteer forces and, in Singapore, the Chinese volunteers of Dalforce). Figures for the campaign vary. The Commonwealth lost about 7,500–8,000 killed and 10,000–11,000 wounded, and some 120,000–130,000 men were captured, about 80,000 of them at Singapore; Japanese losses are given as about 3,500–5,200 killed and 6,000–9,500 wounded."
  - Places in southern Thailand are given by the names in the English sources of the time, with today’s names in brackets (Singora for Songkhla, Patani for Pattani).
