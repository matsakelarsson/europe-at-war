steps:
  - title: The landings of 8 December
    date: 8 December 1941
    when: "1941-12-08"
    borders: "1941-12-08"
    countries: [my, th, sg, jp, gb, in]
    body:
      - "Japan’s plan for the southern advance put the conquest of Malaya and Singapore first. Singapore was Britain’s main naval base in the East, built in the 1920s and 1930s, and Malaya produced much of the world’s rubber and tin. The British had planned to send a fleet to Singapore in a crisis, but with the war in Europe none was available, and the defence of Malaya fell to an army of some 85,000–90,000 men, many of them half-trained Indian and Australian troops, with fewer than 250 aircraft, most of them outdated, and no tanks. Yamashita’s 25th Army had three divisions, the 5th, the 18th and the Imperial Guards, with tanks and the support of some 600 army and navy aircraft based in southern Indochina, which Japan had occupied in July 1941."
      - "The invasion convoys sailed from Hainan and Cam Ranh Bay on 4 December. At about 00:30 on 8 December the Takumi Detachment of the 18th Division began landing on the beaches at Badang and Sabak near Kota Bharu, in Kelantan. The Indian 8th Brigade fought on the beaches and Australian Hudson bombers sank a transport, but by evening the airfield had been abandoned and the Japanese held the town. The main body of the 5th Division landed unopposed on the beaches of Singora and Patani in Thailand, the routes towards the west coast of Malaya. A British plan to forestall them by moving into southern Thailand, Operation Matador, had been called off too late to be of use. At 04:15 Japanese bombers struck Singapore, which was still lit up; 61 people were killed."
      - "Thailand had tried to stay neutral. Thai soldiers, police and youth volunteers fought the Japanese landings at Patani, Singora, Nakhon Si Thammarat, Prachuap Khiri Khan and other places on the gulf, and lost some 180 killed by Thai figures, while the Imperial Guards Division crossed into Thailand from Cambodia. Around noon the government of Field Marshal Plaek Phibunsongkhram ordered the fighting to stop and agreed to let Japanese troops pass through the country. On 21 December Thailand signed a treaty of alliance with Japan, and on 25 January 1942 it declared war on Britain and the United States."
    facts:
      - [Landing at Kota Bharu, "8 December 1941, about 00:30 local time"]
      - [First air raid on Singapore, "8 December 1941, 04:15"]
      - [Thai–Japanese alliance, "21 December 1941"]
