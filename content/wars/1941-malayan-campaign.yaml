id: malayan-campaign
name: Malayan campaign and the fall of Singapore
start: "1941-12-08"
end: "1942-02-15"
tier: A
summary: "Japan’s conquest of British Malaya and Singapore in seventy days. In the first hours of 8 December 1941, about an hour before the attack on Pearl Harbor, the Japanese 25th Army under Lieutenant General Yamashita Tomoyuki landed at Kota Bharu in Malaya and at Singora (Songkhla) and Patani in southern Thailand, which let the Japanese through after a few hours of resistance. Two days later Japanese naval aircraft sank the battleships Prince of Wales and Repulse off Kuantan. With command of the air and sea, light tanks and troops on bicycles, the Japanese drove the British, Indian, Australian and Malay forces of Lieutenant General Arthur Percival down the peninsula, through the defeats at Jitra and Slim River and the battles of Gemas and Muar, and across the causeway to Singapore, the great naval base on which British strategy in the East had rested. They crossed the Johor Strait on 8 February 1942, and on 15 February Percival surrendered some 80,000 men, the largest surrender in British military history. In the following weeks the Japanese killed tens of thousands of Chinese men in Singapore and Malaya in the Sook Ching massacre. Malaya and Singapore stayed under Japanese occupation until September 1945."
countries: [my, sg, th, jp, gb, au, in]
