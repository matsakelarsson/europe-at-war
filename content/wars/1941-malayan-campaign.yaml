  - title: The sinking of Prince of Wales and Repulse
    date: 8–10 December 1941
    when: "1941-12-10"
    borders: "1941-12-10"
    countries: [my, sg, gb, jp]
    body:
      - "The battleship HMS Prince of Wales and the battlecruiser HMS Repulse had reached Singapore on 2 December, sent by Winston Churchill against the advice of the Admiralty as a deterrent to Japan. The aircraft carrier meant to go with them had run aground in the West Indies. On the evening of 8 December Admiral Sir Tom Phillips sailed with the two ships and four destroyers, Force Z, to attack the Japanese landings at Singora and Kota Bharu, without fighter cover. Spotted by a Japanese submarine and aircraft on 9 December, he turned back, and then turned towards Kuantan on a false report of a landing there."
      - "On 10 December, some 110 km east of Kuantan, some 85 bombers and torpedo bombers of the Genzan, Mihoro and Kanoya air groups, flying from airfields near Saigon, attacked the ships in waves from about 11:00. Repulse capsized at 12:33 and Prince of Wales sank at 13:18. The destroyers picked up over 2,000 men, but about 840 were lost, among them Phillips; the Japanese lost three or four aircraft. They were the first capital ships sunk by aircraft alone while under way at sea. With the American fleet crippled at Pearl Harbor, the Allies had no battleships left in the western Pacific, and Japan commanded the seas around Malaya."
    facts:
      - [Force Z sails from Singapore, "8 December 1941, evening"]
      - [Repulse sunk, "10 December 1941, 12:33"]
      - [Prince of Wales sunk, "10 December 1941, 13:18"]
      - [Dead, "about 840 (Repulse 513, Prince of Wales 327)"]
    markers:
