  - title: Jitra and the fall of the north
    date: 9–28 December 1941
    when: "1941-12-11"
    borders: "1941-12-20"
    countries: [my, th, jp, gb, in]
    body:
      - "From Singora the Japanese 5th Division drove south along the main road into Kedah, led by light and medium tanks and by infantry who moved fast on bicycles, many of them taken locally. The Indian 11th Division had spent the days before the invasion preparing to advance into Thailand under Matador and then digging a defensive line at Jitra in the rain. On 11–12 December a Japanese force of a few battalions with tanks under Lieutenant Colonel Saeki Shizuo broke into the line; the division, outflanked and its communications broken, fell back in disorder on the night of 12–13 December, leaving guns and vehicles behind. Another column, Krohcol, which was meant to hold a position called the Ledge on the road from Patani, was stopped by Thai police and then by Japanese troops, who pushed on to Kroh."
      - "The British fell back to Gurun and then behind the Muda and Krian rivers. Japanese aircraft had destroyed most of the British planes in the north in the first days, and the airfields of Kedah were abandoned. Penang, bombed from 11 December, was evacuated on 13–16 December; the authorities took away the European population but not the Asian, which caused lasting resentment, and left boats and a radio station that the Japanese put to use. Japanese troops entered George Town on 19 December. In Kelantan the Indian 8th Brigade withdrew south along the railway. By the end of December the British had given up Perak north of the Perak River, and the Japanese took Ipoh on 28 December."
    facts:
      - [Battle of Jitra, "11–13 December 1941"]
      - [Penang taken, "19 December 1941"]
      - [Ipoh taken, "28 December 1941"]
    markers:
