  - title: Gemas, Muar and the retreat to Singapore
    date: 14–31 January 1942
    when: "1942-01-14"
    borders: "1942-01-20"
    countries: [my, au, in, gb, jp]
    body:
      - "Percival planned to hold a line across northern Johor, with the Australian 8th Division under Major General Gordon Bennett in the centre. On 14 January the Australian 2/30th Battalion ambushed the leading Japanese troops at the Gemencheh bridge west of Gemas, killing several hundred, and held them for two days. On the coast, however, the Imperial Guards Division crossed the Muar River on 15–16 January and overran the newly arrived and inexperienced Indian 45th Brigade. Two Australian battalions, the 2/19th and 2/29th, were sent to help, and the force fought for a week around Bakri and back along the road to Parit Sulong, where it found the bridge held by the Japanese. On 22 January its commander, Lieutenant Colonel Charles Anderson, ordered the able-bodied to break out through the jungle. Only a small part of the force got through."
      - "The wounded who had to be left behind at Parit Sulong, about 110 Australians and 40 Indians, were beaten and then shot or burned by soldiers of the Imperial Guards on 22 January; two men survived. The commander of the Guards, Lieutenant General Nishimura Takuma, was convicted by an Australian military court in 1950 and hanged in 1951. At Endau on the east coast British aircraft and destroyers attacked a Japanese landing on 26–27 January and lost heavily. Threatened along the whole line, Percival ordered the withdrawal to Singapore Island. The last troops crossed the causeway on the night of 30–31 January, the Argyll and Sutherland Highlanders last of all to the sound of their pipes, and the causeway was blown up behind them on the morning of 31 January."
    facts:
      - [Gemencheh bridge ambush, "14 January 1942"]
      - [Battle of Muar, "14–22 January 1942"]
      - [Parit Sulong massacre, "22 January 1942, about 150 wounded prisoners killed"]
      - [Causeway blown, "31 January 1942"]
