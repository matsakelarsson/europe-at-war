  - title: The Sook Ching massacre
    date: February – March 1942
    when: "1942-02-18"
    borders: "1942-02-18"
    countries: [sg, my, jp]
    body:
      - "Three days after the surrender the Japanese army began what it called a purge of anti-Japanese elements among the Chinese of Singapore, known in Chinese as Sook Ching (“purge through cleansing”). The Chinese community had raised money for China’s war against Japan since 1937, and Chinese volunteers, communists among them, had fought in Dalforce during the battle. The operation was planned by the 25th Army staff, with Lieutenant Colonel Tsuji Masanobu among its driving forces, and carried out by the Kempeitai, the military police, under Lieutenant Colonel Oishi Masayuki, with soldiers in support. From 18 February Chinese men aged 18 to 50 were ordered to screening centres around the city. Hooded informers and Japanese officers picked out those they took to be anti-Japanese, with no consistent criteria: volunteers, communists, members of China relief funds, Hainanese, men with tattoos, or simply those who looked educated."
      - "Those picked out were taken by lorry to beaches and lonely places and machine-gunned, at Changi Beach, Punggol Point, Tanah Merah, along the east coast and on Blakang Mati (Sentosa), among others. The operation in Singapore lasted until about 4 March, and in February and March it was extended to Malaya, above all to Johor and Negeri Sembilan, where whole villages were killed, and to Penang. The number of dead is not known. Japan acknowledged about 5,000–6,000 after the war; the Chinese community in Singapore put the figure at 50,000 or more, Lee Kuan Yew at about 70,000 including Malaya, and most historians estimate 40,000–50,000. The Japanese then forced the Chinese of Malaya and Singapore to raise a “gift” of 50 million Straits dollars as atonement for their support of China."
      - "In 1947 a British military court in Singapore tried seven officers for the massacre. Lieutenant General Kawamura Saburo, who had commanded the operation in the city, and Oishi were sentenced to death and hanged, and the other five to life imprisonment. Mass graves found in the 1960s led to a campaign for compensation, and in 1966 Japan paid Singapore 50 million dollars, half as a grant and half as a loan, as a “gesture of atonement”, without accepting legal responsibility. The Civilian War Memorial in Singapore stands over the remains of many of the dead."
    facts:
      - [Screening in Singapore, "18 February – about 4 March 1942"]
      - [Dead, "estimates range from about 5,000 (the Japanese figure) to 70,000; most historians give 40,000–50,000"]
      - [Trial in Singapore, "March–April 1947, two death sentences"]
    markers:
