steps:
  - title: Clark Field and the landings
    date: 8 December 1941 – early January 1942
    when: "1941-12-08"
    borders: "1941-12-22"
    countries: [ph, us, jp]
    body:
      - "The Philippines lay across Japan’s routes to the oil and rubber of the Indies, and American bombers there could reach Formosa. In July 1941 the United States had recalled MacArthur, who had been building up the Philippine Army as the Commonwealth’s military adviser, to active service as commander of USAFFE, and rushed out B-17 bombers and P-40 fighters. On 8 December 1941, after fog over Formosa had delayed them, some 200 Japanese naval bombers and fighters struck Clark Field and Iba at about 12:40, catching most of the American aircraft on the ground. Half of the Far East Air Force was destroyed in a day, and within a week the rest had been shot down or withdrawn. Two days later the naval base at Cavite was wrecked, and the US Asiatic Fleet sailed south."
      - "Japanese troops took Batan Island in the far north on 8 December and landed at Aparri and Vigan on 10 December, at Legazpi in southern Luzon on 12 December, and at Davao on Mindanao on 20 December. The main body of the 14th Army, with the 48th Division and tanks, landed at Lingayen Gulf on 22 December, and the 16th Division at Lamon Bay, south-east of Manila, from 24 December. MacArthur gave up his plan to fight on the beaches and fell back on War Plan Orange: his North and South Luzon Forces withdrew into the Bataan peninsula, while rearguards held the bridges and roads around San Fernando. On 24 December he moved his headquarters, with President Manuel Quezon and the Commonwealth government, to Corregidor. Manila was declared an open city on 26 December, but Japanese aircraft bombed it the next day, and Japanese troops entered it on 2 January 1942."
    facts:
      - [Clark Field bombed, "8 December 1941, about 12:40"]
      - [Main landing at Lingayen Gulf, "22 December 1941"]
      - [Manila declared an open city, "26 December 1941"]
      - [Japanese troops enter Manila, "2 January 1942"]
