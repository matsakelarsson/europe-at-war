id: philippines-campaign-1941
name: Philippines campaign (1941–1942)
start: "1941-12-08"
end: "1942-06-09"
tier: B
summary: "Japan’s conquest of the Philippines, then a self-governing Commonwealth under American sovereignty, promised independence in 1946. Hours after the attack on Pearl Harbor, Japanese bombers from Formosa destroyed much of the American air force in the islands on the ground at Clark Field on 8 December 1941. The Japanese 14th Army under Lieutenant General Homma Masaharu landed in northern Luzon and on 22 December at Lingayen Gulf, and General Douglas MacArthur withdrew his United States Army Forces in the Far East (USAFFE), most of them Filipino soldiers, to the Bataan peninsula and the island fortress of Corregidor, leaving Manila an open city. Short of food and medicine and with no hope of relief, the defenders of Bataan held out until 9 April 1942, when some 76,000 Filipino and American soldiers surrendered, the largest surrender in American history; thousands of them died on the Bataan Death March. Corregidor fell on 6 May, and the last forces in the southern islands surrendered by early June. Many Filipino soldiers who escaped the surrender became guerrillas, and the islands stayed under Japanese occupation until the American return in October 1944."
countries: [ph, us, jp]
sides:
  - id: usaffe
    name: United States and the Philippine Commonwealth (USAFFE)
    polities: [united-states, philippines]
    ink: blue
    moves: American and Filipino moves
    success: American and Filipino success
  - id: jp
    name: Japan
    polities: [japan]
    ink: purple
    moves: Japanese moves
    success: Japanese success
notes:
  - "Dates are local. The attack on Clark Field came about nine hours after the first news of Pearl Harbor reached Manila; why the bombers were still on the ground has been argued over ever since, and MacArthur and his air commander, Major General Lewis Brereton, gave conflicting accounts."
  - "Of the roughly 150,000 men under MacArthur’s command, about 120,000 were Filipino, most of them in the newly mobilised and poorly equipped Philippine Army divisions; the best units were the Philippine Scouts, Filipino soldiers of the US Army. Japanese figures give 4,130 Japanese killed and 6,808 wounded in the campaign. Some 25,000 American and Filipino soldiers were killed and about 100,000 captured."
  - "Estimates of the deaths on the Bataan Death March vary widely, from about 5,000 to 18,000 Filipinos and 500 to 650 Americans; many thousands more died in the following months at Camp O’Donnell."
