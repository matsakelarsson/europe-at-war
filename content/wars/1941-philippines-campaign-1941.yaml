  - title: Bataan and the Death March
    date: January – April 1942
    when: "1942-01-09"
    borders: "1942-04-09"
    countries: [ph, us, jp]
    body:
      - "Some 80,000 soldiers and 26,000 civilian refugees crowded into the peninsula, with food for only a few weeks; from 5 January the troops were on half rations, and malaria, dysentery and beriberi spread. Homma attacked the first line, from Mabatang near Abucay on Manila Bay to Mauban on the west coast, on 9 January. After two weeks of fighting the Japanese found a way round both ends, and on 22–26 January the defenders fell back to the Orion–Bagac line across the middle of the peninsula. Japanese landings behind the lines on the west coast, the battle of the Points, and attacks on the new line, the battle of the Pockets, were destroyed in heavy fighting by early February, and on 8 February Homma, his army worn down by battle and disease, broke off the attack and asked for reinforcements."
      - "On orders from President Franklin Roosevelt, MacArthur left Corregidor by torpedo boat on 11 March and flew from Mindanao to Australia, where he promised “I shall return”; Lieutenant General Jonathan Wainwright took command. Reinforced with fresh troops and heavy artillery, the Japanese opened their final offensive on 3 April at Mount Samat and broke the starving defence in a few days. On 9 April Major General Edward King surrendered the forces on Bataan, against orders, to spare his men. Some 76,000 Filipino and American soldiers became prisoners."
      - "The Japanese, who had expected far fewer prisoners and had made no proper plans for them, marched them from Mariveles and Bagac about 100 km north in the tropical heat, from 9 to 17 April, with little food or water, to San Fernando in Pampanga, then packed them into railway boxcars to Capas and marched them on to Camp O’Donnell. Guards beat, bayoneted or shot those who fell behind, and executed some groups of Filipino officers. Estimates of the dead on the march range from about 5,000 to 18,000 Filipinos and from 500 to 650 Americans; at Camp O’Donnell, by one report, as many as 20,000 more died in the following months. Homma was tried by an American military commission in Manila, sentenced to death and shot on 3 April 1946."
    facts:
      - [First Japanese attack on Bataan, "9 January 1942"]
      - [MacArthur leaves Corregidor, "11 March 1942"]
      - [Bataan surrenders, "9 April 1942, about 76,000 men"]
      - [Death March, "9–17 April 1942; estimates 5,500–18,650 dead"]
