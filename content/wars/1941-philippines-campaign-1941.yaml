  - title: Corregidor and the surrender of the islands
    date: April – June 1942
    when: "1942-05-06"
    borders: "1942-05-06"
    countries: [ph, us, jp]
    body:
      - "Corregidor, the fortified island at the mouth of Manila Bay, held about 11,000 American and Filipino troops, with the US 4th Marine Regiment, and thousands more lived in the tunnels under Malinta Hill. After the fall of Bataan, Japanese guns on the peninsula and aircraft shelled and bombed the island day after day. On the night of 5–6 May Japanese troops landed on its eastern tail and, although they lost heavily in the water, brought tanks ashore. Fearing a massacre in the tunnels, which sheltered the wounded, Wainwright surrendered on 6 May. The Japanese refused to accept the surrender of Corregidor alone, and on 7 May Wainwright ordered all American and Filipino forces in the islands to give up."
      - "In the south the Japanese had landed on Cebu on 10 April, on Panay on 16 April and on Mindanao at the end of April. Major General William Sharp surrendered the Visayan–Mindanao Force on 10 May, and the last units laid down their arms by 9 June. Thousands of Filipino soldiers, and some Americans, refused to surrender and took to the hills, forming the guerrilla bands that fought the occupation over the next three years, in Panay, Mindanao, northern Luzon and elsewhere; in Central Luzon peasant organisers and communists founded the Hukbalahap on 29 March 1942. Quezon had left Corregidor in February and set up a government in exile in Washington. In Manila the Japanese set up a Philippine Executive Commission under Jorge Vargas in January 1942, and in October 1943 a nominally independent republic under José P. Laurel."
    facts:
      - [Japanese landing on Corregidor, "night of 5–6 May 1942"]
      - [Corregidor surrenders, "6 May 1942"]
      - [Visayan–Mindanao Force surrenders, "10 May 1942"]
      - [Last organised resistance ends, "9 June 1942"]
