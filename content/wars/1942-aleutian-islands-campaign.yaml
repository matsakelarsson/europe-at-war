steps:
  - title: Dutch Harbor, Kiska and Attu
    date: 3–7 June 1942
    when: "1942-06-07"
    borders: "1942-06-07"
    countries: [us]
    view: { center: [-177.0, 52.6], size: [1900, 950] }
    body:
      - "Japan’s plan to take Midway included a northern force under Vice Admiral Boshirō Hosogaya, with the light carriers Ryūjō and Jun’yō, to strike the Aleutians and seize islands at the western end of the chain. The aim was to guard the northern flank of Japan’s defensive perimeter and to keep the United States from using the islands as a route to Japan. The Americans had broken enough of the Japanese naval code to expect the attack, and had built air bases at Cold Bay and on Umnak, but fog hid the Japanese ships. On 3 June 1942 carrier aircraft bombed the naval base at Dutch Harbor on Unalaska, and they returned the next day to set oil tanks, a hospital and a barracks ship on fire. Bad weather and the American fighters from Umnak led the Japanese to cancel a planned landing on Adak."
      - "On 6 June about 500 Japanese naval troops landed on Kiska and captured the ten-man US Navy weather station; on 7 June an army battalion landed on Attu, the westernmost island, and took the village at Chichagof Harbor. Its 42 Unangax̂ (Aleut) inhabitants and the teacher Etta Jones were taken prisoner; her husband, the radio operator Charles Foster Jones, died the next day; the villagers said he was killed by the soldiers, while Japanese accounts spoke of suicide. In September the Attuans were shipped to Otaru in Hokkaido. The US government removed 881 Unangax̂ from Atka, the Pribilof Islands and other villages east of the Japanese-held islands; on 12 June Navy crews burned the village of Atka so that it could not be used by the enemy. The evacuees, US citizens, were held for up to three years in abandoned canneries, an old mine camp and a work camp in southeast Alaska, while their white neighbours were allowed to stay."
    facts:
      - [Air raids on Dutch Harbor, "3–4 June 1942"]
      - [Japanese landings, "Kiska 6 June, Attu 7 June 1942"]
      - [Unangax̂ removed to southeast Alaska, "881"]
