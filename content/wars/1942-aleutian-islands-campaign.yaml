id: aleutian-islands-campaign
name: Aleutian Islands campaign
start: "1942-06-03"
end: "1943-08-15"
tier: B
summary: "The fight for the western Aleutian Islands of Alaska, then a US territory, during the Second World War. In June 1942, as part of the operation against Midway, Japanese carrier aircraft bombed the US base at Dutch Harbor on 3 and 4 June, and Japanese troops landed unopposed on Kiska on 6 June and on Attu on 7 June, the only US soil in the Americas occupied by a foreign enemy during the war. The Attu villagers were taken to Japan as prisoners, and the US government removed nearly 900 Unangax̂ (Aleut) people from their island villages to camps in southeast Alaska, where many died. Through the following year US and Canadian aircraft bombed the islands from bases built westward along the chain, at Adak and Amchitka, and US ships and submarines cut the Japanese supply lines; after the naval Battle of the Komandorski Islands on 26 March 1943 Japan supplied the garrisons only by submarine. In May 1943 the US 7th Infantry Division retook Attu in nearly three weeks of fighting in fog, snow and mud, ending in a mass charge by the last Japanese troops on 29 May; nearly the whole garrison of about 2,600 died. In late July Japanese ships evacuated the 5,000-man garrison of Kiska under cover of fog, unseen, and when 34,000 US and Canadian troops landed there on 15 August they found the island empty. From Attu and Shemya US aircraft raided Japan’s Kuril Islands until the end of the war."
countries: [us, ru, jp]
sides:
  - id: us
    name: United States and Canada
    polities: [united-states, canada]
    ink: navy
    moves: US and Canadian moves
    success: US and Canadian success
  - id: jp
    name: Japan
    polities: [japan]
    ink: red
    moves: Japanese moves
    success: Japanese success
notes:
  - "Losses on Attu: US forces counted 549 killed and 1,148 wounded in battle and about 1,200 serious cold injuries; burial teams counted 2,351 Japanese dead, and only 28 Japanese were taken prisoner. At Kiska, US and Canadian troops shooting at each other in the fog killed 28 Americans and 4 Canadians, and 71 men died when the destroyer USS Abner Read struck a mine; with booby traps, accidents, disease and frostbite, the unopposed landing cost more than 300 casualties."
  - "Of the 42 Attuans held in Hokkaido, about 40 per cent died, mainly of hunger and disease. In the US camps in southeast Alaska, about one in ten of the interned Unangax̂ died. The Attuans were not allowed to return to their island after the war. In 1988 the US Congress apologised and paid compensation to the survivors of the removal."
