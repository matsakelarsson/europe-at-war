  - title: Attu retaken, Kiska abandoned
    date: May–August 1943
    when: "1943-05-29"
    borders: "1943-08-15"
    countries: [us]
    view: { center: [175.4, 52.4], size: [640, 360] }
    body:
      - "On 11 May 1943 the US 7th Infantry Division, trained for the desert, landed on Attu at Holtz Bay in the north and Massacre Bay in the south. Colonel Yasuyo Yamasaki had pulled his 2,600 men back from the beaches to the ridges between them, and the Americans had to fight uphill through fog, snow and mud, without proper cold-weather boots and clothing. Frostbite and trench foot caused almost as many casualties as Japanese fire. By late May the garrison was trapped around Chichagof Harbor. Before dawn on 29 May Yamasaki led his remaining men in a charge that broke through the American lines to the rear-area camps at Engineer Hill, where it was stopped in hand-to-hand fighting; many of the survivors then killed themselves with grenades. Burial teams counted 2,351 Japanese dead; 28 were taken prisoner. Small groups held out in the hills into the summer."
      - "Kiska, with more than 5,000 men, was now cut off. On the foggy night of 28–29 July a Japanese force under Rear Admiral Masatomi Kimura slipped through the US blockade while the American ships were refuelling, embarked the whole garrison in less than an hour and took it to the Kuril Islands. Unaware, US aircraft and ships went on bombing the island for two weeks. On 15 August 34,426 US and Canadian troops, among them about 5,300 Canadians and the Canadian-American First Special Service Force, landed on Kiska and found it empty; more than 300 were killed or wounded by friendly fire, mines and booby traps. US aircraft based on Attu and Shemya raided the Japanese bases at Paramushir in the Kurils until 1945. The interned Unangax̂ were allowed home only in 1944 and 1945, to find their houses looted and churches damaged."
    facts:
      - [US landings on Attu, "11 May 1943"]
      - [Japanese final charge, "29 May 1943"]
      - [Japanese evacuation of Kiska, "28–29 July 1943"]
      - [US and Canadian landing on Kiska, "15 August 1943"]
