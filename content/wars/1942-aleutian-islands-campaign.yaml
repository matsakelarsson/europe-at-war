  - title: Bombers, blockade and the Komandorski Islands
    date: June 1942 – March 1943
    when: "1943-03-26"
    borders: "1943-03-26"
    countries: [us, ru]
    view: { center: [175.5, 52.5], size: [2300, 1000] }
    body:
      - "Fog, rain and the williwaw winds of the Aleutians made flying dangerous and grounded aircraft for days at a time; more planes were lost to the weather than to the enemy. The US Eleventh Air Force and Royal Canadian Air Force squadrons bombed Kiska whenever the weather allowed, at first from Umnak, some 1,000 km away, and US submarines attacked the ships supplying the garrisons; on 5 July 1942 the submarine Growler sank a destroyer off Kiska. To bring their bombers closer, the Americans built airfields westward along the chain, landing on Adak on 30 August 1942 and on Amchitka, about 130 km from Kiska, in January 1943. In July 1942 they also salvaged a nearly intact Zero fighter that had crashed on Akutan, and test-flying it helped American pilots learn how to fight it."
      - "To cut Japanese supplies completely, a small US force of cruisers and destroyers under Rear Admiral Charles McMorris patrolled west of Attu. On 26 March 1943, near the Soviet Komandorski Islands, it met a Japanese convoy escorted by Hosogaya’s much stronger force of four cruisers and four destroyers. In a gunnery duel of more than three hours, with no aircraft on either side, the US heavy cruiser Salt Lake City was crippled, but Hosogaya, fearing an air attack, turned back without pressing his advantage. Japan never again tried to supply the islands by surface ship."
    facts:
      - [US landing on Adak, "30 August 1942"]
      - [US landing on Amchitka, "January 1943"]
      - [Battle of the Komandorski Islands, "26 March 1943"]
