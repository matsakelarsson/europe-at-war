id: battle-of-the-st-lawrence
name: Battle of the St. Lawrence
start: "1942-05-12"
end: "1944-11-25"
tier: C
summary: "The German U-boat campaign in the Gulf of St. Lawrence and the lower St. Lawrence River during the Second World War, part of the Battle of the Atlantic and the first fighting in Canada’s inland waters since the War of 1812. On 12 May 1942 U-553 sank the British freighter Nicoya and the Dutch Leto near Anticosti Island, at the mouth of the river. In July U-132 sank three ships of a convoy off Cap-Chat, and in late August and September U-517 sank nine ships, among them the corvette HMCS Charlottetown, and U-165 sank the armed yacht HMCS Raccoon and badly damaged other ships, while residents of the Gaspé coast watched ships burn and bodies wash ashore under wartime censorship. In September 1942 Ottawa closed the river and the gulf to ocean shipping, sending cargoes by rail to Halifax and Sydney, until 1944. On 14 October 1942 U-69 sank the Newfoundland Railway ferry Caribou in the Cabot Strait; 137 of the 237 people aboard died, many of them women and children. On the Atlantic side of Newfoundland, then a separate dominion, U-boats sank four ore carriers at the anchorage of Bell Island in September and November 1942, and U-518 landed the spy Werner von Janowski at New Carlisle, Quebec, where he was arrested the same day. In September 1943 the navy and police foiled Operation Kiebitz, a plan for U-536 to pick up German naval officers escaping from a prisoner-of-war camp at Bowmanville, Ontario, at Pointe de Maisonnette. In autumn 1944 U-1223 damaged the frigate HMCS Magog beyond repair and U-1228 sank the corvette HMCS Shawinigan in the Cabot Strait with all 91 men aboard. In all, U-boats sank more than 20 merchant ships and four Canadian warships in and around the gulf, without losing a U-boat there; the Royal Canadian Navy, the Royal Canadian Air Force and the convoys kept most shipping moving."
