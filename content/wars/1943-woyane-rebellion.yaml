id: woyane-rebellion
name: Woyane rebellion
start: "1943-05"
end: "1943-11"
tier: C
summary: "A rising in Tigray against the restored government of Emperor Haile Selassie in 1943. After the Italian defeat in 1941 the emperor’s government centralised power, sent Shewan officials into the provinces and raised new taxes, while the countryside was full of weapons left from the war and unrest among the Raya and Azebo and other groups. In May 1943 peasants and local nobles in eastern Tigray rose under the name woyane (Tigrinya, roughly “revolt” or “popular movement”), led by Fitawrari Yeebio Woldai, Dejazmach Negusse Bezabih and Blatta Haile Mariam Redda. Their aims, as the sources give them, were self-administration within Ethiopia, Tigrayan customary law and lower taxes, not separation. They defeated government forces at Quiha and Ara and took Mekelle, but the government, under Ras Abebe Aregai, gathered a larger army, and in early October British Blenheim bombers from Aden struck Mekelle, Hintalo and Corbetta, killing about 70 people by one account. The rebels were beaten in fighting around Amba Alagi, Alaje, Wukro and the Tembien and the rising was crushed by November. Abebe Aregai’s repression, with killings, land confiscations and heavy taxes, was long remembered in Tigray; the nobles were mostly pardoned within a few years, but Haile Mariam Redda spent 22 years in prison. The Tigray People’s Liberation Front later called its own struggle the second woyane."
