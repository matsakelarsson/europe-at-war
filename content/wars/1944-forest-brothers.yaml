id: forest-brothers
name: Forest Brothers
start: "1944"
end: "1956"
tier: B
summary: An armed resistance against Soviet rule in Estonia, Latvia and Lithuania after the Red Army returned in 1944. Tens of thousands of partisans, the “Forest Brothers”, fought from forest bases, strongest in Lithuania, until mass deportations such as Operation Priboi in March 1949, forced collectivisation and infiltration by the security services broke the movement by the mid-1950s.
