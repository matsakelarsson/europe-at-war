steps:
  - title: Into the forests
    date: 1944–1948
    when: "1944-07-13"
    borders: "1946-01-01"
    countries: [lt, lv, ee]
    body:
      - The Red Army drove the Germans out of most of the Baltic states in 1944, taking Vilnius in July, Tallinn in September and Riga in October, and Soviet rule, first imposed in 1940, returned with arrests and conscription. Tens of thousands of men, and some women, went into the forests. Some were former soldiers of German-raised units, others had fled call-up into the Red Army, and many hoped that the Western Allies, who had never recognised the annexation, would restore independence. Estimates put the armed partisans at about 30,000 in Lithuania at the end of 1945 and some 10,000–15,000 each in Latvia and Estonia.
      - The resistance was largest and best organised in Lithuania, where partisan districts held much of the countryside after dark until 1949. They ambushed troops, killed Soviet officials and people they regarded as collaborators, among them civilians, and printed underground newspapers. In the biggest battles partisans fought NKVD regiments from fortified forest camps, as at Stompaki in Latvia in March 1945 and at Kalniškės in southern Lithuania that May. The NKVD and local “destruction battalions” answered with sweeps, informers and reprisals against families, and laid out the bodies of dead partisans in town squares. In May 1948 about 40,000 Lithuanians were deported in Operation Vesna.
    facts:
      - [Armed partisans at the peak, "about 30,000 in Lithuania, 10,000–15,000 each in Latvia and Estonia (estimates)"]
      - [Battle of Stompaki, "2–3 March 1945, the largest in Latvia"]
      - [Battle of Kalniškės, "16 May 1945, about 44 partisans killed"]
    markers:
      - kind: taken
        side: su
        name: Vilnius
        date: 13 July 1944
        text: The Red Army took the city from the Germans, helped by the Polish Home Army, whose officers were then arrested by the NKVD.
        lonlat: [25.28, 54.687]
      - kind: taken
        side: su
        name: Tallinn
        date: 22 September 1944
        text: Taken by the Red Army days after the Germans withdrew; an Estonian government proclaimed in the interval was soon dispersed.
        lonlat: [24.745, 59.437]
      - kind: taken
        side: su
        name: Riga
        date: 13 October 1944
        text: The Red Army entered the city, while German forces held out in the Courland Pocket in western Latvia until May 1945.
        lonlat: [24.106, 56.949]
      - kind: battle
        name: Battle of Stompaki
        date: 2–3 March 1945
        text: NKVD troops and a destruction battalion attacked a camp of some 350 partisans in the Stompaki bog. Most broke out in a snowstorm at night, but 28 were killed.
        lonlat: [27.52, 57.143]
      - kind: battle
        name: Battle of Kalniškės
        date: 16 May 1945
        text: Between about 60 and 120 partisans, by different counts, fought a much larger NKVD border regiment in the Kalniškės forest. About 44 were killed and some 20 broke out of the encirclement.
        lonlat: [23.549, 54.34]
      - kind: event
        side: fb
        name: Võru County
        date: 1944–1953
        text: The Estonian Forest Brothers were most active here in the south-east and in western Estonia, carrying out hundreds of attacks by 1947.
        lonlat: [26.993, 57.849]
  - title: Deportations and defeat
    date: 1949–1956
    when: "1949-02-16"
    borders: "1949-03-25"
    countries: [lt, lv, ee, ru]
    body:
      - In February 1949 Lithuanian partisan commanders met in a bunker at Minaičiai and united as the Union of Lithuanian Freedom Fighters under Jonas Žemaitis, declaring on 16 February that they were the lawful authority of an independent, democratic Lithuania. Five weeks later, on 25–28 March, Soviet security forces carried out Operation Priboi. More than 90,000 people, about 20,000 from Estonia, 42,000 from Latvia and 29,000–32,000 from Lithuania, were loaded onto freight trains and sent to settlements in Siberia as “kulaks”, “nationalists” and families of “bandits”. Over 70 per cent were women and children under 16.
      - The deportations drove the remaining farmers into collective farms and stripped the partisans of food and shelter. Agents planted among them, and the betrayal of British intelligence operations to the Soviets, destroyed many bands. Žemaitis was captured in 1953 and shot in Moscow in 1954, and the partisan commander Adolfas Ramanauskas was arrested in Kaunas in October 1956 and executed the next year. After amnesties following Stalin’s death many survivors gave up, although a few held out for decades. The resistance cost at least 50,000 lives, most of them in Lithuania.
    facts:
      - [Operation Priboi, "25–28 March 1949"]
      - [Deported, "more than 90,000 people, over 70 per cent of them women and children"]
      - [Lives lost in the resistance, "at least 50,000 (estimates)"]
    markers:
      - kind: event
        side: fb
        name: Minaičiai
        date: 16 February 1949
        text: The partisan leaders signed their declaration in a bunker here. Lithuania’s parliament gave it the force of law in 1999.
        lonlat: [23.553, 55.631]
      - kind: event
        name: Deportations from Estonia
        date: 25–28 March 1949
        text: About 20,000 people were deported from Estonia, among them families from the islands of Saaremaa and Hiiumaa, taken to the trains by ship.
        lonlat: [24.745, 59.437]
      - kind: event
        name: Deportations from Latvia
        date: 25–28 March 1949
        text: About 42,000 people, the largest group, were deported from Latvia. By the end of the year 93 per cent of Latvian farms had been collectivised.
        lonlat: [24.106, 56.949]
      - kind: event
        name: Deportations from Lithuania
        date: 25–28 March 1949
        text: Between 29,000 and 32,000 people were deported from Lithuania, which had already lost about 40,000 people in the deportations of May 1948.
        lonlat: [25.28, 54.687]
        lp: l
      - kind: taken
        side: su
        name: Kaunas
        date: October 1956
        text: Adolfas Ramanauskas (“Vanagas”), chief commander of the Union of Lithuanian Freedom Fighters, was arrested here, tortured and executed in 1957.
        lonlat: [23.886, 54.897]
        lp: l
