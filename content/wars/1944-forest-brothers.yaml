notes:
  - The Soviet Union annexed the Baltic states in 1940, and the map shows them as Soviet republics. Most Western states never recognised the annexation.
  - Numbers of partisans, dead and deported come from Soviet records and later research, and differ between sources; they are given as estimates.
  - The partisans were called metsavennad in Estonia, mežabrāļi in Latvia and partizanai or žaliukai in Lithuania.
