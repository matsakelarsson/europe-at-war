notes:
  - Chinese histories call the rising the Three Districts Revolution and count it as part of the Chinese revolution against the Nationalists; Uyghur nationalists regard the East Turkestan Republic as an independent state ended by Soviet and Chinese communist agreement. Historians describe it as heavily dependent on the Soviet Union, which supplied officers, arms and advisers and decided when the fighting stopped.
  - The republic was proclaimed on 12 November 1944 by most accounts; some give 15 November. The air crash of August 1949 is dated 22 or 27 August in different sources, and its cause has never been established.
  - Casualty totals are not known. Many Han civilians and Nationalist soldiers were killed in Ghulja in November 1944.
