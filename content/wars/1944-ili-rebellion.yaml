  - title: To the Manas River
    date: April – October 1945
    when: "1945-09"
    borders: "1945-09-15"
    countries: [cn]
    body:
      - On 8 April 1945 the republic formed the Ili National Army, with Soviet officers and arms; Soviet aircraft and artillery helped it take towns and airfields, among them the airfield of Airambek near Ghulja. During 1945 it took the Tarbagatai district around Tacheng (Chuguchak) and the Altai district, where Ospan Batyr, who had joined the republic, was made governor. In September 1945 its detachments reached the Manas River, little more than 100 km west of Ürümqi, and the city was gripped by panic, but an attack on it was called off under pressure from Moscow. In the south, a Soviet-backed rising around Sarikol and Yarkand was put down by government troops from August 1945.
      - On 14 August 1945 the Soviet Union and the Nationalist government signed a treaty of friendship in which Moscow undertook to support only the Nationalists in China, and it now pressed both sides to talk. Peace talks with Soviet mediation opened in Ürümqi on 14 October 1945, under the Nationalist general Zhang Zhizhong, and a preliminary agreement was signed on 2 January 1946.
