  - title: Coalition, Beitashan and the end of the republic
    date: 1946–1949
    when: "1947-06-05"
    borders: "1949-10-12"
    countries: [cn, mn]
    body:
      - Under an agreement of 6 June 1946 the Ili National Army was cut to 11,000–12,000 men and kept in the Three Districts, and on 27 June the republic’s government turned itself into the Ili District Council. On 1 July a coalition government of Xinjiang was formed in Ürümqi under Zhang Zhizhong, with the Ili leader Ehmetjan Qasimi as vice-chairman. Zhang’s concessions to the Uyghurs and Kazakhs were reversed when Nanjing replaced him in 1947 with Masud Sabri, a Uyghur opponent of the Ili leaders; there were riots and unrest in Ürümqi and Turfan, and on 12 August 1947 the coalition collapsed and the Three Districts went back to governing themselves.
      - Ospan Batyr broke with the Ili leaders and at the end of 1946 joined the government side. On the disputed Mongolian border at Beitashan (Baytik Bogd), where Ospan’s Kazakhs and the Hui cavalry of Ma Xizhen were posted, Ospan raided into Mongolia; on 5 June 1947 Mongolian troops with Soviet air support drove his men back and attacked the Chinese positions, where they were repulsed, and raids went on until 1948. In September 1947 Ospan, with government help, invaded the Altai district and defeated the Ili forces there, but in 1948 they drove him out and he fled east.
      - When the People’s Liberation Army reached the north-west in 1949, Mao Zedong invited the Ili leaders to the Political Consultative Conference in Beijing. In late August Ehmetjan Qasimi and four other leaders died when their Soviet aircraft crashed near Lake Baikal. Seypidin Azizi led a new delegation that agreed to join the People’s Republic. On 25 September the Nationalist commander Tao Zhiyue and the governor Burhan Shahidi declared for the Communists, PLA troops entered Xinjiang in October, and on 20 December 1949 the Ili National Army became the PLA’s 5th Army. The Xinjiang Uyghur Autonomous Region was set up in 1955.
