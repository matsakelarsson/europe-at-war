steps:
  - title: Ghulja and the East Turkestan Republic
    date: November 1944
    when: "1944-11-07"
    borders: "1944-11-12"
    countries: [cn]
    body:
      - Sheng Shicai, who had ruled Xinjiang with Soviet backing since 1934, broke with Moscow in 1942, expelled the Soviet advisers and technicians and accepted the authority of the Nationalist government, whose troops and officials moved into the province. Heavy taxes, requisitions of horses for the war against Japan and the arrest of local leaders turned many Uyghurs and Kazakhs against the new order, while the Soviet Union, now hostile to Sheng, secretly armed and organised opponents in the Ili valley next to its border. Sheng himself was removed from Xinjiang in 1944. In the Altai mountains the Kazakh leader Ospan Batyr had been fighting the provincial government since 1940.
      - On 7 November 1944 rebels attacked Ghulja, took most of the town and killed many of the Nationalist troops; the power station and the central police station held out until 13 November, and other posts longer. On 12 November the rebels proclaimed the East Turkestan Republic, with Elihan Tore, an Uzbek religious scholar, as president and the Uyghur Hakim Beg Khoja as vice-president. Its Kulja Declaration of 5 January 1945 called for driving out the Han Chinese and for close ties with the Soviet Union. Han civilians were killed in large numbers in the first weeks.
