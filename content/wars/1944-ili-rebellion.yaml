id: ili-rebellion
name: Ili rebellion
start: "1944-11-07"
end: "1949-12-20"
tier: B
summary: "A Soviet-backed revolt against Nationalist rule in northern Xinjiang that created the second East Turkestan Republic. On 7 November 1944 Uyghur, Kazakh and other rebels rose in Ghulja (Kulja), the main town of the Ili valley, and on 12 November proclaimed the East Turkestan Republic with the Uzbek scholar Elihan Tore as president. Its Ili National Army, with Soviet officers, arms and aircraft, took the Ili, Tarbagatai (Tacheng) and Altai districts, and in September 1945 reached the Manas River, little more than 100 km from Ürümqi, before Moscow called a halt. Soviet-mediated talks led in 1946 to a coalition provincial government, which broke down in 1947; the Three Districts governed themselves until 1949, while the Kazakh leader Ospan Batyr (Osman Batur) fought them for the Nationalists and clashed with Mongolian and Soviet forces at Beitashan. In 1949 the Ili leaders agreed to join the People’s Republic; five of them died in an air crash on the way to Beijing, and in December 1949 their army became part of the People’s Liberation Army."
