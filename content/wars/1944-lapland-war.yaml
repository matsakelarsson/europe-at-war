  - title: Retreat to Norway
    date: October 1944 – April 1945
    when: "1944-10-17"
    borders: "1945-04-27"
    countries: [fi, de]
    body:
      - After Rovaniemi the Germans withdrew along two roads, north-west through Muonio towards Norway and north through Ivalo towards the Norwegian Arctic. The Red Army, meanwhile, drove them out of Petsamo in October and followed them some way into Finnish territory along Lake Inari. The Finnish army followed slowly. Under the armistice it also had to demobilise much of its own force, and the retreating Germans destroyed the roads, bridges and buildings as they left. By November most German troops had left Finland, but from late November a rearguard held a fortified line on the Lätäseno river in the far north-west, and later positions near Kilpisjärvi, through the winter.
      - On 27 April 1945 the last German troops left Finnish soil near Kilpisjärvi, and Finnish soldiers raised the flag on the cairn where Finland, Sweden and Norway meet. About 1,000 Finns had been killed or gone missing, and some 1,300 German prisoners were handed over to the Soviet Union under the armistice. Lapland was devastated. Around 40 per cent of its buildings had been destroyed, with hundreds of bridges and thousands of kilometres of road, Rovaniemi had to be rebuilt almost from scratch, and the clearing of mines and explosives went on for decades.
    facts:
      - [Last Germans leave Finland, "27 April 1945"]
      - [Finnish dead and missing, "about 1,000"]
      - [People evacuated from Lapland, "about 168,000"]
    markers:
