steps:
  - title: From allies to enemies
    date: September – October 1944
    when: "1944-09-15"
    borders: "1944-10-16"
    countries: [fi, de]
    body:
      - Under the Moscow Armistice Finland had to disarm or expel the German 20th Mountain Army, some 200,000 men under General Lothar Rendulic, which held northern Finland. At first the two armies kept up a staged “autumn manoeuvre”, the Germans pulling back north and the Finns following without fighting, while most of Lapland’s civilians were evacuated, some 56,000 of them to Sweden. The Germans’ attempt to seize the island of Suursaari on 15 September, which the Finns beat off, and pressure from the Soviet Control Commission ended the pretence. The first shots in Lapland were fired near Pudasjärvi on 28 September.
      - On 1 October Finnish troops landed at Tornio, at the head of the Gulf of Bothnia, behind the German lines. A week of hard fighting followed around Tornio and Kemi before the Germans withdrew. On 13 October German commanders ordered the burning of everything of military use, which in practice meant whole towns and villages. When Finnish troops reached Rovaniemi, the capital of Lapland, on 16 October, almost all of it was in ashes, and the roads and bridges behind the retreating Germans had been mined and blown up.
    facts:
      - [German attack on Suursaari, "15 September 1944, repulsed"]
      - [Landing at Tornio, "1 October 1944"]
      - [Rovaniemi reached, "16 October 1944, burned"]
