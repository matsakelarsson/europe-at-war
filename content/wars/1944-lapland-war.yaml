id: lapland-war
name: Lapland War
start: "1944-09-15"
end: "1945-04-27"
tier: B
summary: A war between Finland and Germany in northern Finland, fought because the Moscow Armistice required Finland to drive out the German troops still in the country. The Germans withdrew to Norway, burning much of Lapland as they went, and the last of them left Finnish soil in April 1945.
countries: [fi, de]
sides:
  - id: fi
    name: Finland
    polities: [finland]
    ink: teal
    moves: Finnish moves
    success: Finnish success
  - id: de
    name: Germany
    polities: [germany]
    ink: slate
    moves: German moves
    success: German success
notes:
  - The war began with a German attempt to seize the island of Suursaari (Gogland) in the Gulf of Finland on 15 September 1944, which failed. Fighting in Lapland began at the end of September.
  - Finnish dead numbered 774, with 262 missing; the Germans lost about 1,000 dead and some 1,300 missing or captured.
