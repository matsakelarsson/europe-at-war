  - title: The battle and massacre of Manila
    date: 3 February – 3 March 1945
    when: "1945-02-03"
    borders: "1945-02-20"
    countries: [ph, us, jp]
    body:
      - "Yamashita meant to leave Manila, but Rear Admiral Iwabuchi Sanji, with some 12,500 sailors and naval troops and about 4,500 soldiers, chose to defend it to the end. A flying column of the 1st Cavalry Division entered the city on the evening of 3 February and freed the 3,700 civilian internees, most of them American, at the University of Santo Tomas; the 37th Division came in from the north. Iwabuchi’s men blew up the bridges over the Pasig River and the port, set fire to much of the city north of the river and fortified the government buildings, churches and the old walled city of Intramuros south of it. MacArthur forbade bombing from the air, but American artillery shelled the Japanese positions building by building. By 12 February the 11th Airborne had taken Nichols Field and closed the ring from the south."
      - "Trapped and expecting to die, the Japanese turned on the civilians in the area they held. In Ermita, Malate and Intramuros they killed men, women and children in houses, churches, hospitals and schools, among them the De La Salle College, St. Paul’s College and the German Club, raped women and girls, and burned buildings with people inside; at Fort Santiago some 3,000 men were killed. The assault on Intramuros began on 23 February after a barrage that razed most of the old city; Iwabuchi killed himself on 26 February, and the last resistance ended on 3 March. About 1,000 Americans and some 16,000 Japanese died."
      - "At least 100,000 civilians were killed in the battle, many of them in the massacres and many by the shelling of both sides; one estimate holds American artillery responsible for about 40 percent of the civilian deaths. Much of Manila was destroyed, with its old churches, its university and its government buildings; it was among the most devastated cities of the war. On 27 February MacArthur handed the government of the Commonwealth back to Osmeña in the ruined Malacañang Palace. The killings, known as the Manila massacre, were a main charge at Yamashita’s trial."
    facts:
      - [Santo Tomas internees freed, "3 February 1945"]
      - [Intramuros assaulted, "23 February 1945"]
      - [End of resistance, "3 March 1945"]
      - [Civilian dead, "at least 100,000"]
