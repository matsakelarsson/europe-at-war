  - title: Corregidor, Los Baños and the Shimbu line
    date: February – May 1945
    when: "1945-02-16"
    borders: "1945-02-23"
    countries: [ph, us, jp]
    body:
      - "To open Manila Bay, the XI Corps landed at Mariveles on the tip of Bataan on 15 February, and on 16 February the 503rd Parachute Infantry Regiment dropped on the narrow plateau of Topside on Corregidor while an infantry battalion landed from the sea. The Japanese garrison, far larger than American intelligence had estimated, fought from the tunnels; in the last days of February they blew up their own ammunition stores inside Malinta Hill and at Monkey Point, killing hundreds of their own men and some Americans. Almost the whole garrison of over 5,000 died, and on 2 March MacArthur raised the flag again on the island he had left three years before."
      - "On 23 February paratroopers of the 11th Airborne, with Filipino guerrillas and amphibious tractors that crossed the Laguna de Bay, freed 2,147 civilian internees from the camp at Los Baños, south-east of Manila. In reprisal, Japanese troops later killed some 1,500 Filipino civilians in the area. East of Manila the Shimbu Group, some 80,000 men, held a line in the Sierra Madre foothills that included the dams supplying the city’s water; the 43rd Division and the guerrillas of Marking’s Fil-American Guerrillas took the Ipo Dam on 17 May, and the Wawa Dam fell at the end of May."
    facts:
      - [Corregidor retaken, "16 February – 2 March 1945"]
      - [Raid on Los Baños, "23 February 1945, 2,147 internees freed"]
      - [Ipo Dam taken, "17 May 1945"]
