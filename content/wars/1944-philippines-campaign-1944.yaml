  - title: Mindoro and Lingayen Gulf
    date: December 1944 – January 1945
    when: "1944-12-15"
    borders: "1945-01-31"
    countries: [ph, us, jp, au]
    body:
      - "To get airfields within fighter range of Luzon, American troops landed on the south-west coast of Mindoro on 15 December 1944 against little resistance. On 9 January 1945 the Sixth Army landed at Lingayen Gulf, where the Japanese had landed three years before, with some 175,000 men put ashore over the following days on a front of about 30 km. The fleet that brought them through the islands had been attacked again and again by kamikaze aircraft, which sank the escort carrier Ommaney Bay and damaged dozens of ships, among them the Australian cruiser HMAS Australia."
      - "Yamashita, with about 260,000 men on Luzon but little air or naval support, did not try to hold the central plain or Manila. He divided his army into three groups to fight a long defence in the mountains: the Shobu Group, the largest, under his own command in the north, the Kembu Group in the hills west of Clark Field, and the Shimbu Group in the mountains east of Manila. The American divisions advanced down the plain towards Manila and fought the Kembu Group for Clark Field in late January. On 29 January the XI Corps landed in Zambales to cut off Bataan, and on 31 January the 11th Airborne Division landed at Nasugbu, south-west of Manila."
      - "On 30 January the 6th Ranger Battalion, with Alamo Scouts and Filipino guerrillas under Captains Juan Pajota and Eduardo Joson, raided the prison camp near Cabanatuan, deep behind the Japanese lines, and freed more than 500 American and Allied prisoners, many of them survivors of Bataan; the guerrillas held off Japanese reinforcements at a river crossing while the prisoners were carried away on carabao carts."
    facts:
      - [Landing on Mindoro, "15 December 1944"]
      - [Landing at Lingayen Gulf, "9 January 1945"]
      - [Raid on Cabanatuan, "30 January 1945"]
      - [Landings in Zambales and at Nasugbu, "29 and 31 January 1945"]
