  - title: The battle of Leyte Gulf
    date: 23–26 October 1944
    when: "1944-10-23"
    borders: "1944-10-25"
    countries: [ph, us, jp, au]
    body:
      - "Japan’s plan, Shō-Gō (Operation Victory), committed nearly all its remaining fleet. Vice Admiral Ozawa Jisaburō’s carriers, with few aircraft left, were to draw Admiral William Halsey’s Third Fleet away to the north, while two forces of battleships and cruisers converged on the landing area: Vice Admiral Kurita Takeo’s Centre Force, with the giant battleships Yamato and Musashi, through the San Bernardino Strait north of Samar, and Vice Admiral Nishimura Shōji’s force, followed by Vice Admiral Shima Kiyohide’s, through the Surigao Strait to the south. On 23 October American submarines in the Palawan Passage sank two of Kurita’s heavy cruisers, among them his flagship. On 24 October aircraft from Halsey’s carriers sank Musashi in the Sibuyan Sea, while a Japanese bomber from Luzon set fire to the light carrier Princeton, which had to be scuttled."
      - "In the night of 24–25 October Nishimura’s force steamed into the Surigao Strait, where Rear Admiral Jesse Oldendorf’s battleships and cruisers, five of the battleships veterans of Pearl Harbor and two of them raised from its mud, waited at its northern end with torpedo boats and destroyers along the way. Both of Nishimura’s battleships, Fusō and Yamashiro, were sunk, and Nishimura with them; it was the last battle between battleships. Halsey meanwhile took the bait and steamed north after Ozawa, and on 25 October off Cape Engaño his aircraft sank all four of Ozawa’s carriers."
      - "That left the San Bernardino Strait unguarded. On the morning of 25 October Kurita’s battleships fell on a group of six escort carriers and their destroyers, Taffy 3, off Samar. The small ships fought back with torpedo attacks and the aircraft of nearby groups attacked, sinking or crippling three Japanese cruisers; the Americans lost the escort carrier Gambier Bay and three destroyers and destroyer escorts. Kurita, unsure what he faced, turned back. The same morning the first planned kamikaze attacks, by the Special Attack Units formed by Vice Admiral Ōnishi Takijirō, sank the escort carrier St. Lo. In all Japan lost four carriers, three battleships, ten cruisers and nine destroyers and some 12,000 men; the Americans lost six warships and about 3,000 men."
    facts:
      - [Palawan Passage, "23 October 1944"]
      - [Sibuyan Sea, "24 October 1944"]
      - [Surigao Strait, "24–25 October 1944"]
      - [Samar and Cape Engaño, "25 October 1944"]
      - [Losses, "Japan 26 ships and about 12,000 men; United States 6 ships and about 3,000 men"]
