  - title: The southern islands
    date: February – August 1945
    when: "1945-02-28"
    borders: "1945-04-17"
    countries: [ph, us, jp]
    body:
      - "While the Sixth Army fought on Luzon, Lieutenant General Robert Eichelberger’s Eighth Army made more than fifty landings in the central and southern islands, many of them where guerrillas already held the countryside. On Palawan, where American troops landed on 28 February, they found the remains of the prisoners of war at Puerto Princesa: on 14 December 1944, fearing an American landing, Japanese soldiers had driven about 150 of them into air-raid trenches, doused them with petrol and set them alight, and shot those who ran; 11 escaped. The 41st Division landed at Zamboanga on 10 March, the 40th Division on Panay on 18 March, where Colonel Macario Peralta’s guerrillas met them on the beaches, and on Negros on 29 March, and the Americal Division on Cebu on 26 March. Jolo and Bohol followed in April."
      - "On Mindanao, where the guerrillas of Colonel Wendell Fertig controlled much of the island and held the airstrip at Malabang, the X Corps landed at Parang on 17 April and crossed the island; Davao fell on 3 May, but the Japanese fought on in the mountains and the abaca plantations around it until the end of the war. In the mountains of Cebu, Negros and Mindanao tens of thousands of Japanese soldiers and civilians held out, dying of hunger and disease, until Japan’s surrender."
    facts:
      - [Palawan massacre, "14 December 1944"]
      - [Landing at Zamboanga, "10 March 1945"]
      - [Landings on Panay, Cebu and Negros, "18–29 March 1945"]
      - [Landing on Mindanao, "17 April 1945"]
