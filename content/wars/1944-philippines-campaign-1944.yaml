  - title: The battle for Leyte
    date: October – December 1944
    when: "1944-11-05"
    borders: "1944-12-10"
    countries: [ph, us, jp]
    body:
      - "Japan decided to fight the decisive battle on Leyte. Yamashita, the conqueror of Malaya, who had taken command of the 14th Area Army in the Philippines in early October, was ordered against his judgement to reinforce the island, and convoys brought some 45,000 men from Luzon and the Visayas into the port of Ormoc on the west coast. The X Corps took Carigara on the north coast on 2 November and fought for weeks in monsoon rains for the mountain road south into the Ormoc valley, at Breakneck Ridge and Kilay Ridge. American aircraft and torpedo boats sank many of the convoys, but the Japanese air forces, reinforced and using kamikaze attacks, contested the skies, and the heavy rains slowed the building of American airfields."
      - "On 6 December Japanese paratroopers and infantry attacked the American airfields around Burauen and briefly held one of them. The next day the 77th Division landed south of Ormoc, behind the Japanese lines, and took the town on 10 December. The Ormoc valley was cleared and the two American corps met; the last Japanese port, Palompon, fell on 25 December, and MacArthur declared the island secured. About 49,000 Japanese soldiers had been killed by then, and thousands more died in the mountains in the months of mopping-up that followed; the Americans lost about 3,500 killed. Filipino guerrillas under Colonel Ruperto Kangleon fought with the Americans throughout."
    facts:
      - [Carigara taken, "2 November 1944"]
      - [Breakneck Ridge, "5–16 November 1944"]
      - [Landing at Ormoc Bay, "7 December 1944"]
      - [Ormoc taken, "10 December 1944"]
