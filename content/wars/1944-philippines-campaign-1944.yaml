steps:
  - title: The return to Leyte
    date: 20 October 1944
    when: "1944-10-20"
    borders: "1944-10-20"
    countries: [ph, us, jp]
    body:
      - "For two and a half years the Philippines had been under Japanese rule. In October 1943 Japan declared the islands independent as a republic under José P. Laurel, who governed with little real power under the Japanese army while food grew scarce, prices soared and the Kempeitai hunted the guerrillas and those suspected of helping them. In Washington the Commonwealth government in exile carried on; President Manuel Quezon died there on 1 August 1944 and Sergio Osmeña succeeded him. American planners had debated whether to bypass the Philippines for Formosa, but MacArthur argued that the United States owed it to the Filipinos to free them, and in September 1944, after carrier raids found Japanese air power in the islands weak, the landing on Leyte was brought forward by two months."
      - "On 20 October 1944, after Rangers had taken the islands at the mouth of the gulf, the Sixth Army under Lieutenant General Walter Krueger landed four divisions on the east coast of Leyte, the X Corps near Palo and Tacloban and the XXIV Corps near Dulag, about 200,000 men in all in the following weeks. The Japanese 16th Division, which held the island, withdrew inland. That afternoon MacArthur waded ashore at Red Beach with Osmeña and broadcast: “People of the Philippines, I have returned.” Tacloban was taken the next day, and on 23 October MacArthur restored the Commonwealth government there."
    facts:
      - [Landing on Leyte, "20 October 1944"]
      - [Commonwealth government restored at Tacloban, "23 October 1944"]
