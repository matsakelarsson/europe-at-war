id: philippines-campaign-1944
name: Philippines campaign (1944–1945)
start: "1944-10-20"
end: "1945-09-03"
tier: A
summary: "The American and Filipino reconquest of the Philippines from Japan. On 20 October 1944 the US Sixth Army landed on Leyte, and General Douglas MacArthur, who had left in 1942 promising to return, waded ashore with President Sergio Osmeña of the Commonwealth. Japan threw its navy against the landing, and in the battle of Leyte Gulf on 23–26 October, the largest naval battle in history, the Japanese fleet was defeated and ceased to be a fighting force; the first organised kamikaze attacks were made there. After two months of fighting on Leyte, American forces landed on Mindoro in December and at Lingayen Gulf on Luzon on 9 January 1945. Manila was retaken in a month of street fighting in February, in which Japanese naval troops killed many thousands of civilians and the old city was destroyed; some 100,000 people died. While the Eighth Army and Filipino guerrillas took the southern islands, General Yamashita Tomoyuki’s army held out in the mountains of northern Luzon until Japan’s surrender, and Yamashita surrendered at Baguio on 3 September 1945. The campaign cost Japan over 300,000 dead, many of them from hunger and disease, and devastated the islands; the Philippines became independent on 4 July 1946."
countries: [ph, us, jp, au]
sides:
  - id: us
    name: United States, the Philippine Commonwealth and the Filipino guerrillas
    polities: [united-states, philippines, australia, mexico]
    ink: blue
    moves: American and Filipino moves
    success: American and Filipino success
  - id: jp
    name: Japan and the Second Philippine Republic
    polities: [japan, second-philippine-republic]
    ink: purple
    moves: Japanese moves
    success: Japanese success
notes:
  - "The Filipino guerrillas, organised in dozens of bands under Filipino and American officers, many of them in touch with MacArthur’s headquarters by radio and supplied by submarine, numbered over 200,000 by some counts by 1945. They provided intelligence before the landings, fought alongside the American divisions and took some islands largely by themselves. The Hukbalahap in Central Luzon fought the Japanese independently and clashed with other guerrilla units (see the Hukbalahap rebellion)."
  - "Casualty figures vary. Japanese deaths in the campaign are given as about 330,000–420,000, many of them from hunger and disease in the mountains in 1945, and some 12,000 were taken prisoner. American battle deaths, including the navy and air forces, are given as about 20,700. Australian ships and aircraft took part at Leyte Gulf and Lingayen, and a Mexican fighter squadron, Escuadrón 201, flew over Luzon and Formosa from June 1945. Estimates of the Filipinos who died during the whole war range from about 500,000 to over a million."
