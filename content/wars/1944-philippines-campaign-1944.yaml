  - title: Northern Luzon and Yamashita’s surrender
    date: February – September 1945
    when: "1945-04-26"
    borders: "1945-08-15"
    countries: [ph, us, jp]
    body:
      - "In the north Yamashita’s Shobu Group, with over 150,000 men, held the mountain passes into the Cagayan valley and the Cordillera around Baguio, where the Laurel government had moved before fleeing to Japan. The American I Corps fought from February to the end of May for the Villa Verde Trail and the Balete Pass on the main road into the valley, and took Baguio on 26–27 April. In the north-west the US Army Forces in the Philippines–Northern Luzon (USAFIP-NL), Filipino guerrillas under the American Colonel Russell Volckmann, took the Ilocos coast and on 14 June stormed Bessang Pass. American paratroopers landed near Aparri on 23 June, and the Cagayan valley was cleared. MacArthur declared the Luzon campaign over on 5 July, but Yamashita, with some 50,000 men short of food and medicine, fought on in the Asin valley and around Kiangan."
      - "After Japan’s surrender on 15 August, Yamashita came down from the mountains to Kiangan on 2 September and signed the surrender of the Japanese forces in the Philippines at Camp John Hay in Baguio on 3 September, with Generals Arthur Percival, whom he had defeated at Singapore, and Jonathan Wainwright, the defender of Corregidor, present. Tried by an American military commission in Manila for the atrocities committed by troops under his command, among them the Manila massacre, he was convicted although it was not shown that he had ordered or known of them, and hanged at Los Baños on 23 February 1946. The verdict, upheld by the US Supreme Court over two dissents, shaped the law of command responsibility. Some Japanese soldiers never heard of the surrender or refused to believe it; Lieutenant Onoda Hiroo held out on Lubang Island until 1974."
    facts:
      - [Baguio taken, "26–27 April 1945"]
      - [Bessang Pass, "14 June 1945"]
      - [Yamashita surrenders, "2–3 September 1945"]
      - [Yamashita hanged, "23 February 1946"]
