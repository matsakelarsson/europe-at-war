id: borneo-campaign
name: Borneo campaign (1945)
start: "1945-05-01"
end: "1945-08-15"
tier: C
summary: "The Allied reconquest of parts of Borneo from Japan in the last months of the Second World War, codenamed Oboe and fought mainly by the Australian I Corps, with American naval and air support and Dutch colonial troops. The 26th Brigade landed on the oil island of Tarakan on 1 May 1945 and took it in weeks of hard fighting; the 9th Division landed on Labuan and around Brunei Bay on 10 June and took Brunei town, Beaufort and the oilfields of Seria and Miri; and the 7th Division landed at Balikpapan on 1 July in the largest amphibious operation carried out by Australian forces. Australian special forces parachuted into the interior, where Dayak and other peoples fought the Japanese with them. The campaign cost about 570 Australian dead and several thousand Japanese; its strategic value was disputed then and since, as the war ended before the oilfields could be used. Before the landings the Japanese had marched the Allied prisoners of Sandakan inland to Ranau in the Sandakan death marches of January–June 1945; of some 2,400 Australian and British prisoners, only six, all Australians who escaped, survived. Japanese forces in Borneo surrendered in September 1945."
