notes:
  - "Operation casualties: Tarakan cost the Australians 225 killed and the Japanese about 1,540 killed; in North Borneo the 9th Division lost 114 killed; at Balikpapan the Australians lost 229 killed and the Japanese over 2,000. Many Borneans died in the fighting and the bombing, and thousands of Javanese labourers (romusha) brought to Borneo by the Japanese died of hunger and disease."
  - "The Sandakan prisoners were mostly survivors of the fall of Singapore. About 2,434 died at Sandakan, on the three marches through the jungle to Ranau and at Ranau itself, of hunger, disease and killings. The camp commandant, Captain Hoshijima Susumi, was hanged in 1946. Local people who helped escapers were also killed."
