  - title: Pingjin
    date: November 1948 – January 1949
    when: "1948-12-22"
    borders: "1949-01-31"
    countries: [cn]
    body:
      - After Liaoshen Lin Biao’s army moved south through the Shanhai Pass much sooner than the Nationalists expected and joined the North China armies of Nie Rongzhen against Fu Zuoyi, who held Beiping, Tianjin, Zhangjiakou and the railway between them with more than half a million men. The Pingjin campaign began on 29 November 1948 with attacks around Zhangjiakou. On 22 December Fu’s best unit, the 35th Army, was destroyed at Xinbao’an as it tried to get back to Beiping, and Zhangjiakou fell on 24 December.
      - On 14–15 January 1949 the People’s Liberation Army took Tianjin by storm in 29 hours and captured its commander, Chen Changjie. Fu Zuoyi, surrounded in Beiping, agreed on 21–22 January to hand the city over to spare it, and his troops marched out to be reorganised into the People’s Liberation Army. Communist troops entered Beiping on 31 January. The Communist leadership, at Xibaipo in Hebei since 1948, moved to Beiping in March. On 21 January Chiang Kai-shek had stepped down as president in favour of the vice-president, Li Zongren, who sought peace talks.
    facts:
      - [Pingjin campaign, "29 November 1948 – 31 January 1949"]
      - [Tianjin taken, "15 January 1949"]
      - [Beiping handed over, "31 January 1949"]
      - [Chiang Kai-shek steps down, "21 January 1949"]
