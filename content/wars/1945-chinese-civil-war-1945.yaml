  - title: Huaihai
    date: November 1948 – January 1949
    when: "1948-11-06"
    borders: "1949-01-10"
    countries: [cn]
    body:
      - The Huaihai campaign, named after the Huai River and the town of Haizhou, was the largest of the war. Some 600,000 Communist troops of the East China and Central Plains Field Armies under Su Yu, Chen Yi, Liu Bocheng and Deng Xiaoping fought about 800,000 Nationalists defending the approaches to Nanjing around Xuzhou. The campaign opened on 6 November 1948; two days later two Nationalist generals who were secret Communist members, He Jifeng and Zhang Kexia, took about 23,000 men over to the Communists at Jiawang, opening the way to cut off Huang Baitao’s 7th Army as it withdrew towards Xuzhou. It was surrounded at Nianzhuang and destroyed, and Huang killed himself on 22 November.
      - The Nationalist 12th Army under Huang Wei, sent from Henan to relieve Xuzhou, was in turn surrounded at Shuangduiji south-west of Suxian in late November and destroyed on 15 December, and Huang Wei was captured. Du Yuming’s armies, ordered to leave Xuzhou and break out to the south-west, were trapped at Chenguanzhuang, and after weeks of siege in snow and hunger they were destroyed between 6 and 10 January 1949; Du was captured and Qiu Qingquan killed. The Nationalists lost about 555,000 men, the Communists about 134,000. Millions of peasants from the Communist areas carried supplies to the front by wheelbarrow and on foot.
    facts:
