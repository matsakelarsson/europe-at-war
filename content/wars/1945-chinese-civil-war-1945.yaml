  - title: General war
    date: June 1946 – March 1947
    when: "1946-06-26"
    borders: "1947-03-19"
    countries: [cn]
    body:
      - At the end of June 1946 Nationalist troops attacked the Communist Central Plains base around Xuanhuadian on the border of Hubei and Henan, and the war became general. The Nationalists, with about 4.3 million men against perhaps 1.2 million, took one Communist town after another in North China and Jiangsu. Su Yu won a series of small battles in central Jiangsu in July–August, but Huaiyin fell in September, and Fu Zuoyi took Zhangjiakou, the largest town the Communists held south of the Great Wall, on 11 October. Marshall left China in January 1947, saying that extremists on both sides had wrecked his efforts.
      - In Manchuria Lin Biao’s armies crossed the frozen Songhua three times in the winter of 1946–1947 while troops in the south-east held off four Nationalist attacks on their base at Linjiang. In Shandong Chen Yi and Su Yu surrounded and destroyed a Nationalist army at Laiwu in February 1947, capturing its commander, Li Xianzhou. On 19 March 1947 Hu Zongnan’s army took Yan’an, the Communist capital since 1937; the Communist leaders had left a few days earlier and stayed in northern Shaanxi, where Peng Dehuai’s small army won several actions against Hu’s troops.
    facts:
      - [Attack on the Central Plains base, "26 June 1946"]
      - [Zhangjiakou taken by the Nationalists, "11 October 1946"]
      - [Laiwu, "20–23 February 1947, Communist victory"]
      - [Yan’an taken by the Nationalists, "19 March 1947"]
