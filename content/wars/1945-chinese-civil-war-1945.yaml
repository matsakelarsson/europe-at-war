  - title: Liaoshen
    date: September – November 1948
    when: "1948-10-14"
    borders: "1948-11-02"
    countries: [cn]
    body:
      - By 1948 the Nationalists in Manchuria held only Changchun, Shenyang and the corridor to Jinzhou and the coast, cut off from each other and supplied partly by air. Changchun had been under siege since May, with the population left to starve; estimates of the civilians who died there range from about 150,000 to 200,000. On 12 September Lin Biao’s Northeast Field Army, about 700,000 men, opened the Liaoshen campaign by attacking the railway between Jinzhou and the Great Wall, cutting off Manchuria from North China.
      - Jinzhou was stormed on 14–15 October and its commander Fan Hanjie captured, while a Nationalist relief force from Huludao was held at Tashan. In Changchun the 60th Army changed sides on 16–17 October and the rest of the garrison surrendered on 19–21 October. A Nationalist army of about 100,000 men under Liao Yaoxiang that had set out from Shenyang to retake Jinzhou was surrounded west of the Liao River near Heishan and destroyed on 26–28 October. Shenyang fell on 2 November, and the Nationalists who could escaped by sea from Yingkou and Huludao. The Nationalists lost about 470,000 men, the Communists about 69,000.
    facts:
