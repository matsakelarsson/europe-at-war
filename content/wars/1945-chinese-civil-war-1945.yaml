id: chinese-civil-war-1945
name: Chinese Civil War (1945–1949)
start: "1945-08-10"
end: "1949-12-27"
tier: A
summary: "The second phase of the war between the Nationalist government of the Kuomintang and the Chinese Communist Party, fought after the defeat of Japan. In August 1945 both sides raced to take over the territory Japan had held, and the Communists moved large forces into Manchuria, where the Soviet army had just driven out the Japanese. American mediation under George Marshall brought a ceasefire in January 1946, but fighting resumed in Manchuria in the spring, and in the summer of 1946 the war became general. The Nationalists, with far larger and better-equipped armies, took many cities, Yan’an among them, in 1946–1947. From mid-1947 the Communist People’s Liberation Army went over to the attack, and in three great campaigns in the autumn and winter of 1948–1949, Liaoshen, Huaihai and Pingjin, it destroyed the main Nationalist armies in Manchuria, on the plains north of Nanjing and around Beiping. In April 1949 it crossed the Yangtze and took Nanjing; Mao Zedong proclaimed the People’s Republic of China in Beijing on 1 October 1949, and on 7 December the Nationalist government moved to Taipei. By the end of 1949 the Republic of China held only Taiwan, Hainan and a few islands off the coast. The Nationalists lost an estimated 1.5–1.7 million men killed, wounded, captured or missing, and the People’s Liberation Army about 1.3 million, including some 260,000 killed; estimates of civilian deaths run from about 2.5 million upwards."
countries: [cn, tw]
sides:
  - id: ccp
    name: Chinese Communist Party (People’s Liberation Army)
    polities: [ccp]
    ink: red
    moves: Communist moves
    success: Communist success
  - id: roc
    name: Republic of China (Nationalist government)
    polities: [roc, kmt, shanxi-clique, ma-clique]
    ink: blue
    moves: Nationalist moves
    success: Nationalist success
notes:
  - The first phase of the civil war, from 1927 to the second united front of 1937, is told in the Chinese Civil War (1927–1937). The Soviet invasion of Manchuria in August 1945, the 228 incident in Taiwan in 1947, the battle of Guningtou on Kinmen in October 1949 and the taking of Hainan in 1950 have their own pages.
  - The areas shown as held by the Communists are approximate. Until 1948 both sides held towns and railways inside the other’s territory, and much of the countryside changed hands several times.
  - Casualty figures for the war are uncertain; the totals in the summary are those most often cited and many soldiers taken prisoner were taken into the other side’s army.
