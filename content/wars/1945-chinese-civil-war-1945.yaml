  - title: The tide turns
    date: May – December 1947
    when: "1947-05-13"
    borders: "1947-11-12"
    countries: [cn]
    body:
      - In May 1947 the Nationalist Reorganised 74th Division, one of the best-equipped units in the army, pushed into the hills of southern Shandong and was surrounded at Menglianggu by Chen Yi’s and Su Yu’s armies. After three days of fighting it was destroyed on 16 May and its commander Zhang Lingfu was killed. From the summer of 1947 the People’s Liberation Army, as the Communist armies were now called, went over to the offensive.
      - On 30 June Liu Bocheng and Deng Xiaoping crossed the Yellow River with about 120,000 men and marched south across the flooded plain of 1938 to the Dabie Mountains between Hubei, Henan and Anhui, where they arrived in late August, losing many men and most of their heavy equipment on the way. Two more armies under Chen Geng and Chen Yi followed into the Central Plains, drawing Nationalist troops away from Shandong and Shaanxi. In North China Nie Rongzhen’s troops took Shijiazhuang on 12 November, the first large city the Communists stormed. In the land they held, the Communists carried out land reform, giving land to poor peasants; the campaigns were often violent, and many landlords and richer peasants were killed. In Nationalist China inflation and corruption eroded support for the government.
    facts:
      - [Menglianggu, "13–16 May 1947, Communist victory"]
      - [Liu and Deng cross the Yellow River, "30 June 1947"]
      - [Shijiazhuang taken, "12 November 1947"]
