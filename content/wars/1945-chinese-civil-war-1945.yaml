  - title: The south-west and the retreat to Taiwan
    date: November – December 1949
    when: "1949-11-30"
    borders: "1949-12-27"
    countries: [cn, tw]
    body:
      - In November Liu Bocheng and Deng Xiaoping’s Second Field Army struck west from Hunan into Guizhou and Sichuan, while He Long’s troops advanced south from Shaanxi. Guiyang fell on 15 November and Chongqing on 30 November; Guilin was taken on 22 November and Nanning on 4 December, and Bai Chongxi’s remaining troops were destroyed or escaped into French Indochina. On 7 December the Nationalist government decided to move to Taipei. On 9 December the governors of Yunnan and Xikang, Lu Han and Liu Wenhui, declared for the Communists, and Chengdu was taken on 27 December, after Chiang Kai-shek had flown out on 10 December and Hu Zongnan’s army had broken up.
      - Between about 900,000 and 1.1 million soldiers, officials and civilians went to Taiwan with the Nationalists in 1948–1950, along with gold reserves and art treasures of the Palace Museum. The Republic of China kept Taiwan, Penghu, Kinmen and Matsu; Hainan was taken by the Communists in 1950 (see the Hainan campaign), and fighting with Nationalist remnants in the south-west went on for years. No peace treaty was signed, and the two governments both claimed to be the government of China.
    facts:
      - [Chongqing taken, "30 November 1949"]
      - [Nationalist government moves to Taipei, "7 December 1949"]
      - [Chengdu taken, "27 December 1949"]
      - [People who went to Taiwan, "about 0.9–1.1 million"]
