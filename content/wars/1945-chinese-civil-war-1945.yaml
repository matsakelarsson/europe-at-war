steps:
  - title: The race for the north and the Chongqing talks
    date: August – October 1945
    when: "1945-08-28"
    borders: "1945-10-10"
    countries: [cn]
    body:
      - When Japan surrendered in August 1945 the Communists held some 19 base areas, mostly in the countryside of North China, with about a quarter of China’s territory and a third of its population, and armies of about 1.27 million men backed by militia. The Nationalist armies were mostly in the south-west. On 10–11 August Zhu De ordered the Communist forces to take the surrender of the Japanese wherever they could; Chiang Kai-shek ordered them to stay where they were and the Japanese and the collaborationist troops to surrender only to the government. American aircraft and ships carried Nationalist divisions to the great cities of the east and north, and some 50,000 American marines landed to hold Beiping, Tianjin and the ports until they arrived.
      - In Manchuria, occupied by the Soviet army since its invasion of 9 August, the Communists moved fast. Tens of thousands of troops and cadres went north on foot through the Shanhai Pass and by junk from Shandong, and by early 1946 Lin Biao commanded more than 200,000 men there, many armed with captured Japanese weapons that the Soviets let them take. The Soviets stripped Manchuria of much of its industry before they left.
      - At American urging Mao Zedong flew to Chongqing on 28 August for talks with Chiang Kai-shek, which ended on 10 October in an agreement on principles but settled nothing on armies and territory. While they talked, Liu Bocheng and Deng Xiaoping defeated a force of Yan Xishan’s Shanxi army that had advanced into the Shangdang region around Changzhi, destroying some 35,000 men, most of them taken prisoner, in September–October.
    facts:
      - [Communist forces in autumn 1945, "about 1.27 million men"]
      - [Chongqing talks, "28 August – 10 October 1945"]
      - [Shangdang campaign, "10 September – 12 October 1945, Communist victory"]
