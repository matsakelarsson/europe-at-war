  - title: The Marshall mission and Manchuria
    date: December 1945 – June 1946
    when: "1946-04-18"
    borders: "1946-05-23"
    countries: [cn]
    body:
      - In December 1945 President Truman sent General George Marshall to China to bring the two sides into a coalition government. A ceasefire was signed on 10 January 1946 and a Political Consultative Conference agreed on a constitution and the merging of the armies, but neither side carried the agreements out, and the ceasefire did not cover Manchuria in practice. Nationalist troops, carried north in American ships, advanced from Shanhaiguan to Shenyang, which the Soviets handed over in March.
      - As the Soviet army withdrew, completing its departure on 3 May, the Communists moved into Changchun, Harbin and Qiqihar. At Siping, on the railway between Shenyang and Changchun, Lin Biao’s army held the town against the Nationalist New 1st Army and other American-trained divisions from mid-April for a month. When the Nationalists outflanked the position, the Communists withdrew on the night of 18–19 May, and the Nationalists took Changchun on 23 May and Jilin soon after, but they stopped at the Songhua (Sungari) River when Marshall persuaded Chiang to agree to a truce in June. North Manchuria, with Harbin, stayed in Communist hands and became their main base.
    facts:
      - [Ceasefire, "10 January 1946"]
      - [Soviet withdrawal from Manchuria completed, "3 May 1946"]
      - [Siping, "April – 19 May 1946"]
      - [Changchun taken by the Nationalists, "23 May 1946"]
