  - title: The People’s Republic
    date: June – October 1949
    when: "1949-10-01"
    borders: "1949-10-14"
    countries: [cn]
    body:
      - Through the summer the People’s Liberation Army advanced south and north-west. In Hunan the governor Cheng Qian and the general Chen Mingren changed sides on 4 August, and Fuzhou was taken on 17 August. In the north-west Peng Dehuai’s First Field Army stormed Lanzhou, held by Ma Bufang’s Hui troops, on 26 August and took Xining on 5 September; the Nationalist commanders in Xinjiang and Suiyuan declared for the Communists in late September.
      - On 1 October 1949 Mao Zedong proclaimed the People’s Republic of China from the Gate of Heavenly Peace in Beijing, as Beiping was renamed again. The Soviet Union recognised the new state the next day. Lin Biao’s armies defeated Bai Chongxi’s troops in the Hengyang–Baoqing campaign in southern Hunan in September–October, and Guangzhou, where the Nationalist government had sat since early 1949, was taken on 14 October; the government moved to Chongqing. Xiamen fell on 17 October, but a Communist landing on Kinmen failed on 25–27 October (see the battle of Guningtou).
    facts:
      - [Changsha changes sides, "4 August 1949"]
      - [Lanzhou taken, "26 August 1949"]
      - [People’s Republic proclaimed, "1 October 1949"]
      - [Guangzhou taken, "14 October 1949"]
