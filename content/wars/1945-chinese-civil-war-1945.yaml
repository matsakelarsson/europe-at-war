  - title: Across the Yangtze
    date: April – May 1949
    when: "1949-04-21"
    borders: "1949-05-27"
    countries: [cn]
    body:
      - Peace talks in Beiping between the Communists and a delegation from Li Zongren’s government broke down in April 1949 when Nanjing refused the Communist terms. On the night of 20–21 April about a million Communist troops of the Second and Third Field Armies crossed the Yangtze on a front of hundreds of kilometres between Hukou and Jiangyin, in thousands of junks and small boats. The Nationalist defence collapsed; a fortress commander at Jiangyin changed sides and the navy’s Second Fleet went over to the Communists. Nanjing was taken on 23 April, Hangzhou on 3 May and Nanchang on 22 May, and in the west Lin Biao’s Fourth Field Army took Wuhan on 16–17 May.
      - On 20 April the British frigate HMS Amethyst, sailing up the Yangtze to Nanjing, came under fire from Communist batteries near Sanjiangying and ran aground; British ships sent to help it were also hit, and more than 40 British sailors were killed. The Amethyst stayed trapped until it slipped away down the river on 30 July. Shanghai, defended by Tang Enbo, fell on 27 May after two weeks of fighting. Taiyuan, besieged since 1948, had fallen on 24 April, and Xi’an was taken on 20 May.
    facts:
