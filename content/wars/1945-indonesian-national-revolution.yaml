id: indonesian-national-revolution
name: Indonesian National Revolution
start: "1945-08-17"
end: "1949-12-27"
tier: A
summary: "The war and the negotiations through which Indonesia won its independence from the Netherlands. Two days after Japan’s surrender, on 17 August 1945, Sukarno and Mohammad Hatta proclaimed the Republic of Indonesia in Jakarta. British and Indian troops landed from late September to take the Japanese surrender, and the Dutch returned with them; in the months that followed, armed youth groups killed thousands of Dutch, Eurasian, Chinese and other civilians in the violence known as the bersiap, and the British fought a three-week battle for Surabaya. After the British left in 1946 the Dutch, who had recognised the Republic’s authority over Java, Madura and Sumatra in the Linggadjati Agreement, launched two great offensives, which they called “police actions”, in July 1947 and December 1948; the second took the Republican capital, Yogyakarta, and its leaders. In between, the Republic put down a communist rising at Madiun. A guerrilla war, the pressure of the United Nations and the United States, and the failure of the Dutch to build a federation without the Republic led to the Round Table Conference in The Hague, and on 27 December 1949 the Netherlands transferred sovereignty over the Indies, except western New Guinea, to the Republic of the United States of Indonesia. About 100,000 Indonesians died, along with some 5,000 Dutch soldiers and several thousand Dutch-side civilians."
countries: [id, nl, gb, in, jp]
