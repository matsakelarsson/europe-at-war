  - title: Westerling in South Sulawesi
    date: December 1946 – February 1947
    when: "1946-12-11"
    borders: "1946-12-24"
    countries: [id, nl]
    body:
      - Outside Java and Sumatra the Republic was weaker. The Australian forces that had taken the Japanese surrender in Borneo and the eastern islands handed them over to Dutch administration early in 1946, and Republican groups that resisted were fought down; in Bali Lieutenant Colonel I Gusti Ngurah Rai died with nearly all his men in a last stand at Marga on 20 November 1946. Van Mook built his federation from the regions the Dutch held, and the State of East Indonesia was founded with its capital at Makassar on 24 December 1946.
      - In South Sulawesi, Republican guerrilla and youth groups attacked Dutch posts and officials and killed people who worked with them; one estimate puts the deaths they caused at about 1,500. In December 1946 the colonial government sent in Captain Raymond Westerling and his Depot Special Troops (DST), a counter-insurgency unit of the KNIL, and declared a state of war in the region. Westerling’s method, applied from the villages around Makassar north to Pare-Pare and Mandar, was to surround a village at night, gather its people in the morning, and shoot men named by informers as rebels, or merely suspected, on the spot and without trial. Other KNIL units, police and village guards did the same. On 1 February 1947 DST soldiers under Westerling’s deputy killed hundreds of people at Galung Lombok in Mandar. The campaign ended on 21 February 1947.
      - How many died is disputed. The Republic first spoke of 15,000 dead and later of 40,000, the number on the monument to the victims in Makassar, which Dutch historians regard as propaganda. The Dutch historian Willem IJzereef estimated in 1984 that the DST killed about 1,500 people, other army units about 1,500 and police and village guards about 900. Westerling was not prosecuted; he was relieved of his command in November 1948. In 2013 the Dutch ambassador apologised for the killings in South Sulawesi, and since 2015 Dutch courts have ordered the state to pay compensation to widows and children of men who were executed.
    facts:
      - [Westerling’s campaign, "December 1946 – 21 February 1947"]
      - [Galung Lombok, "1 February 1947"]
      - [Killed by Dutch forces, "about 3,900 (IJzereef, 1984) to 40,000 (Republican figure)"]
    markers:
      - kind: toll
        side: nl
        name: Makassar
        date: December 1946 – February 1947
        text: The DST’s base. Its first operations were in villages around the city in December 1946. The monument to the “40,000 victims” stands here.
        lonlat: [119.420, -5.140]
      - kind: toll
        side: nl
        name: Pare-Pare
        date: January 1947
        text: The operations spread north to the Pare-Pare region in January 1947.
        lonlat: [119.627, -4.013]
      - kind: toll
        side: nl
        name: Galung Lombok
        date: 1 February 1947
        text: DST soldiers gathered the people of the area near Majene and shot hundreds of them.
        lonlat: [119.010, -3.495]
        lp: l
  - title: The first Dutch offensive
    date: 21 July – 5 August 1947
    when: "1947-07-21"
    borders: "1947-07-21"
    countries: [id, nl]
    body:
      - The two sides fell out over how to carry out Linggadjati. The Dutch blockaded the Republic’s ports, the cost of their army grew, and they wanted the plantations and oil fields of Java and Sumatra back in production. When the Republic rejected Dutch demands for a joint police force and an interim government under Dutch authority, the Netherlands renounced the agreement on 20 July 1947, and that night it attacked with three divisions in Java and three brigades in Sumatra. The Dutch government called the offensive, code-named Operation Product, a “police action” (politionele actie), presenting it as the restoring of order in its own territory; in Indonesia it is called the first Dutch military aggression (Agresi Militer Belanda I).
      - In two weeks the Dutch took most of West Java and the west of Central Java, and in East Java they landed troops at Pasir Putih and Meneng Bay and advanced from Surabaya to Malang, which the Republicans burned before they left; they also took half of Madura. In Sumatra they occupied the plantation belt around Medan, the oil fields and refineries around Palembang, and the country around Padang. The Republican army, with no answer to tanks and aircraft, fell back, burned what it could not hold, and turned to guerrilla warfare behind the Dutch lines.
      - India and Australia brought the war to the UN Security Council, which called for a ceasefire on 1 August. The Dutch halted on 4–5 August, and later that month the Council set up a Committee of Good Offices of three states, Australia chosen by the Republic, Belgium by the Netherlands and the United States by both. On 29 August the Dutch proclaimed a demarcation line joining their furthest positions, including pockets well beyond the front, which became known as the Van Mook line. Inside it the Republic kept Banten, the centre and east of Java around Yogyakarta, Surakarta, Madiun and Kediri, and most of Sumatra outside the Dutch enclaves, with fewer of its people and less of its food.
    facts:
      - [Offensive begins, "night of 20–21 July 1947"]
      - [UN Security Council Resolution 27, "1 August 1947"]
      - [Ceasefire, "4–5 August 1947"]
      - [Van Mook line proclaimed, "29 August 1947"]
    markers:
      - kind: taken
        side: nl
        name: Cirebon
        date: July 1947
        text: The Dutch advance from Jakarta along the north coast took the port and the country around it.
        lonlat: [108.557, -6.732]
      - kind: taken
        side: nl
        name: Purwokerto
        date: July 1947
        text: The Dutch took the Banyumas region in western Central Java.
        lonlat: [109.240, -7.424]
      - kind: taken
        side: nl
        name: Malang
        date: late July 1947
        text: Republican forces set much of the town on fire before the Dutch entered it.
        lonlat: [112.630, -7.980]
      - kind: event
        side: nl
