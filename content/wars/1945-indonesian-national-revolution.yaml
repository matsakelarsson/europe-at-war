steps:
  - title: The proclamation
    date: 16–17 August 1945
    when: "1945-08-17"
    borders: "1945-08-17"
    countries: [id, jp]
    body:
      - Japan had conquered the Dutch East Indies in March 1942. Its army ruled Java and Sumatra and its navy the eastern islands, and Dutch civilians were interned in camps where many died. The occupiers courted the nationalist leaders the Dutch had jailed or exiled, among them Sukarno and Mohammad Hatta, and used them to raise labour and rice; from 1943 they trained a volunteer army in Java, the Defenders of the Homeland (PETA), and youth corps. Hundreds of thousands of Javanese were taken away as forced labourers (rōmusha), many never to return, and requisitions brought famine to parts of Java in 1944–1945.
      - In September 1944 Japan promised independence at a later date, and in 1945 it allowed a committee to prepare a constitution; in a speech to it on 1 June Sukarno set out the five principles, the Pancasila, that became the state’s philosophy. Japan announced its surrender on 15 August. Young radicals (pemuda) such as Sukarni, Chaerul Saleh and Wikana wanted independence proclaimed at once, owing nothing to Japan, and on 16 August they took Sukarno and Hatta to the garrison town of Rengasdengklok to press them. That night, back in Jakarta at the house of the Japanese naval liaison officer, Rear Admiral Maeda Tadashi, the leaders drafted a short text.
      - At 10 a.m. on 17 August 1945, in front of Sukarno’s house at Pegangsaan Timur 56, Sukarno read the proclamation, signed by himself and Hatta “in the name of the people of Indonesia”, and the red-and-white flag was raised. The next day a preparatory committee adopted a constitution and chose Sukarno as president and Hatta as vice-president. The Japanese command, bound by the Allies to keep things as they were until Allied troops arrived, banned the news, but it spread by radio, telegraph and word of mouth. In September Republican officials took over offices across much of Java and Sumatra, the sultan of Yogyakarta, Hamengkubuwono IX, and Paku Alam VIII declared their principalities part of the Republic, a mass rally filled the Ikada field in Jakarta on 19 September, and armed youths began to take weapons from the Japanese. The People’s Security Army (TKR), formed on 5 October, grew out of a security agency set up in August.
    facts:
      - [Proclamation of independence, "17 August 1945, 10 a.m., Jakarta"]
      - [Sukarno president, Hatta vice-president, "18 August 1945"]
      - [Yogyakarta joins the Republic, "5 September 1945"]
