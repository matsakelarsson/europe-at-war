  - title: Rawagede and the Renville agreement
    date: December 1947 – February 1948
    when: "1947-12-09"
    borders: "1948-01-17"
    countries: [id, nl]
    body:
      - Behind the Van Mook line Republican units and militias fought on, and Dutch troops hunted them in “mopping-up” operations in which villagers suspected of hiding them were often killed. On 9 December 1947 Dutch soldiers searching for the Republican officer Lukas Kustario surrounded the village of Rawagede, east of Jakarta, and shot the men they found. The village counted 431 dead, a Dutch government report of 1969 about 150. In 2011 a Dutch court held the state liable, and the Dutch ambassador apologised in the village on the anniversary of the killings.
      - Under the Committee of Good Offices the two delegations met aboard the American transport USS Renville, anchored in Jakarta Bay, and signed the Renville Agreement on 17 January 1948. It confirmed the ceasefire along the Van Mook line and promised plebiscites in the occupied regions, to decide whether they would join the Republic or another state of the future federation. The Republic had to withdraw its troops from the pockets behind the line, and in February some 35,000 soldiers of the Siliwangi Division left West Java for the Republic’s territory in Central Java, by train and by sea. The agreement was unpopular in the Republic. Amir Sjarifuddin’s cabinet, which had signed it, fell, and at the end of January Hatta formed a government that set out to cut down the swollen army.
      - The plebiscites were never held. The Dutch went on creating federal states in the occupied territory, among them East Sumatra (December 1947), Pasundan in West Java (February 1948), Madura and East Java, and kept up the blockade of the Republic, now crowded with soldiers and refugees. In the hills of West Java, Islamic militias that refused to leave rallied around Sekarmadji Maridjan Kartosuwiryo, who in May 1948 formed an Islamic council near Tasikmalaya, the beginning of the Darul Islam rebellion.
    facts:
      - [Rawagede, "9 December 1947, 150 to 431 killed"]
      - [Renville Agreement, "17 January 1948"]
      - [Siliwangi Division leaves West Java, "February 1948"]
    link: { href: "#/war/darul-islam-rebellion", text: Darul Islam rebellion }
