        name: Jakarta
        date: 17 August 1945
        text: Sukarno read the proclamation of independence in front of his house in the Menteng quarter. The rally on the Ikada field, now Merdeka Square, followed on 19 September.
        lonlat: [106.845, -6.202]
        lp: l
      - kind: event
        side: ri
        name: Rengasdengklok
        date: 16 August 1945
        text: Youth leaders brought Sukarno and Hatta to the PETA garrison here to press them to proclaim independence without waiting for Japan.
        lonlat: [107.297, -6.155]
      - kind: event
        side: ri
        name: Yogyakarta
        date: 5 September 1945
        text: The sultan, Hamengkubuwono IX, declared his principality part of the Republic. Yogyakarta became the Republic’s capital in January 1946.
        lonlat: [110.365, -7.801]
  - title: The Allied landings and the bersiap
    date: September 1945 – early 1946
    when: "1945-09-29"
    borders: "1945-10-15"
    countries: [id, gb, in, nl, jp]
    body:
      - The Dutch East Indies had passed shortly before the surrender to Lord Louis Mountbatten’s South East Asia Command, which had few troops to spare. The cruiser HMS Cumberland reached Batavia (Jakarta) on 15 September 1945, and the first troops of the Allied Forces Netherlands East Indies under Lieutenant General Sir Philip Christison landed on 29 September, followed by Indian divisions. Their tasks were to disarm and repatriate the Japanese and to free the Allied prisoners and internees, tens of thousands of them still in the camps. They occupied only Batavia, Bandung, Semarang and Surabaya in Java and Medan, Padang and Palembang in Sumatra, while Australian forces took over Borneo and the eastern islands. With them came officials of the Netherlands Indies Civil Administration (NICA) and soldiers of the colonial army (KNIL), which Republicans took as proof that the Allies meant to restore Dutch rule; Christison, for his part, dealt with the Republic’s leaders as the authority in fact.
      - From October the revolution turned violent. In what Dutch and Eurasian survivors came to call the bersiap, after the cry “Siap!” (“Get ready!”) of the armed youth groups, internees leaving the camps, Eurasians, and Indonesians seen as loyal to the Dutch, among them Ambonese, Menadonese and Christian communities such as that of Depok, were attacked, abducted and killed, as were many Chinese. The Dutch war documentation institute NIOD estimates 3,500–5,500 European and Eurasian dead, and no more than 10,000; other historians have put the Dutch-side civilian dead to 1947 at 20,000–30,000. Republican militias and local movements also overthrew and often killed officials and aristocrats in “social revolutions”, in the Tiga Daerah on the north coast of Central Java in late 1945, in Aceh, and in East Sumatra in March 1946, where many members of the Malay and Simalungun royal families were killed, among them the poet Amir Hamzah. British, Dutch and Japanese troops in turn killed thousands of Indonesians in fighting and reprisals.
      - The Japanese, ordered by the Allies to keep order until they could be shipped home, were caught between the two. In Semarang, after Republican youths killed Japanese prisoners (estimates range from about 130 to 300), the Japanese garrison fought the Republicans from 15 to 19 October; some 2,000 Indonesians and 500 Japanese are said to have died before British troops arrived. British and Indian troops sent inland to evacuate internees from Magelang and Ambarawa were driven back to Semarang in November–December by Republican forces under Colonel Sudirman, a former PETA battalion commander who had been elected commander of the TKR on 12 November. Sutan Sjahrir, who had refused to work with the Japanese, became prime minister on 14 November and sought negotiations, and after attacks on Republican leaders in Jakarta the government moved to Yogyakarta on 4 January 1946.
    facts:
      - [Allied landing in Batavia, "29 September 1945"]
      - [Battle of Semarang, "15–19 October 1945"]
      - [Ambarawa, "November – 15 December 1945"]
      - [Bersiap dead, "estimates from 3,500 to 30,000"]
      - [Government moves to Yogyakarta, "4 January 1946"]
