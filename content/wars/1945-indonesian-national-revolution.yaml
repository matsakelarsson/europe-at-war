  - title: The Round Table Conference and the transfer of sovereignty
    date: August – December 1949
    when: "1949-12-27"
    borders: "1949-12-27"
    countries: [id, nl]
    body:
      - The Round Table Conference met in The Hague from 23 August to 2 November 1949, with delegations of the Netherlands, of the Republic under Hatta, and of the federal states under Sultan Hamid II of Pontianak, and the UN Commission for Indonesia. It agreed that the Netherlands would transfer sovereignty to a Republic of the United States of Indonesia, a federation of sixteen states and territories in which the Republic was the largest, joined to the Netherlands in a loose union under the Dutch crown. Indonesia took over 4.3 billion guilders of the colonial government’s debts. Western New Guinea was left out, to be settled within a year; it was not, and the dispute over it lasted until 1962. The KNIL was to be dissolved, and its soldiers could join the new federal army or leave.
      - On 27 December 1949 Queen Juliana signed the act of transfer with Hatta at the Royal Palace in Amsterdam, and in Jakarta the Dutch High Representative, A. H. J. Lovink, handed over to Hamengkubuwono IX at the palace on the former Koningsplein. Sukarno, elected president of the federation, returned to Jakarta the next day. Within months the federal states, seen by many Indonesians as Dutch creations, dissolved themselves into the Republic, amid a coup attempt in Bandung by Westerling’s private army (APRA) in January 1950 and risings in Makassar and Ambon in April, and on 17 August 1950 Indonesia became a unitary republic.
      - The war had cost about 100,000 Indonesian lives by the estimate used in the Dutch–Indonesian research of 2022, with other estimates higher, besides some 5,000 Dutch soldiers and thousands of Dutch-side civilians, Japanese and British and Indian soldiers. The Netherlands long dated Indonesia’s independence from the transfer, Indonesia from the proclamation of 1945; only in 2023 did the Dutch government recognise 17 August 1945 without reservation.
    facts:
      - [Round Table Conference, "23 August – 2 November 1949, The Hague"]
      - [Transfer of sovereignty, "27 December 1949"]
      - [Unitary Republic of Indonesia, "17 August 1950"]
