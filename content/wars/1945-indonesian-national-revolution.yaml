  - title: The Madiun affair
    date: September – December 1948
    when: "1948-09-18"
    borders: "1948-09-18"
    countries: [id]
    body:
      - The left-wing parties, gathered since early 1948 in the People’s Democratic Front (FDR) under Amir Sjarifuddin, turned against the Renville agreement that Amir’s own cabinet had signed and against Hatta’s plans to demobilise part of the army, which threatened units loyal to the left. On 11 August 1948 Musso, a leader of the communist rising of 1926 who had lived mostly in the Soviet Union since, returned to Indonesia and called for a “new road” under a single party of the working class; the FDR parties merged into the Communist Party of Indonesia (PKI), and Amir announced that he had long been a communist. In early September pro-FDR units and the Siliwangi Division fought each other in Surakarta.
      - At 3 a.m. on 18 September pro-FDR troops and militias seized the town of Madiun and set up a new local government. Sukarno told the nation by radio the next evening to choose between “Musso and his PKI” and “Sukarno–Hatta”, and Musso answered with a call to resist. The government sent the Siliwangi Division from the west and East Java units from the east; they retook Madiun on 30 September and spent the next weeks hunting down the rebels, who withdrew through the mountains. Both sides killed prisoners and civilians; the rebels killed officials, officers and Muslim leaders, and government troops and Muslim militias executed suspected communists. Musso was shot dead near Ponorogo on 31 October, and Amir, captured early in December, was executed with ten others on 19 December, the day the Dutch attacked.
      - Estimates of the dead vary widely, from about 2,000 in the Madiun and Magetan districts to some 24,000 in the whole region, and about 35,000 people, most of them soldiers, were arrested. The army and, later, the New Order regime remembered the affair as a communist stab in the back of the Republic at war; the PKI called it a provocation by the Hatta government to destroy the left. It persuaded the United States that the Republic was anti-communist, which weighed in its favour in 1949.
    facts:
      - [Madiun seized, "18 September 1948"]
      - [Madiun retaken, "30 September 1948"]
      - [Musso killed, "31 October 1948"]
      - [Amir Sjarifuddin executed, "19 December 1948"]
