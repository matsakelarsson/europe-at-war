  - title: Surabaya
    date: October – November 1945
    when: "1945-10-25"
    borders: "1945-11-10"
    countries: [id, gb, in]
    body:
      - Surabaya, the largest port and naval base of the Indies, was the most radical city of the revolution. On 19 September 1945 Dutch former internees raised the Dutch flag over the Hotel Yamato (now the Hotel Majapahit); Indonesian youths climbed the roof, tore off the blue stripe and raised the red and white. In the weeks that followed the Republicans took over the weapons of the Japanese garrison, one of the largest stocks in Java, and dozens of Eurasians and Dutch were killed in the city’s prisons and at the Simpang Club. On 25 October the 49th Indian Infantry Brigade, some 6,000 men under Brigadier A. W. S. Mallaby, landed to evacuate the internees. When leaflets dropped on 27 October ordered the Indonesians to give up their arms, tens of thousands of TKR soldiers and militia attacked the brigade’s scattered posts on 28 October and came near to overwhelming it.
      - On 30 October Sukarno, Hatta and Amir Sjarifuddin, flown in by the British, agreed a ceasefire, but that evening Mallaby was killed in a firefight at the Internatio building near the Red Bridge (Jembatan Merah); who killed him has never been established. The British brought in the 5th Indian Division under Major General Robert Mansergh, who on 9 November ordered the Indonesians to surrender their arms by 6 a.m. the next day. They refused. From 10 November British and Indian troops, supported by naval guns, aircraft and tanks, fought their way through the city street by street against fierce resistance, urged on by the radio speeches of Sutomo (Bung Tomo); it took some three weeks to take the city, and the shelling went on into early December.
      - Estimates of the Indonesian dead range from about 6,300 to 15,000 or more, many of them civilians, and perhaps 200,000 people fled the city; British and Indian losses are given as 295 killed and missing in British accounts and higher in others. The Republican forces withdrew south and west and held a front near Sidoarjo and Mojokerto. The battle was a British victory, but it showed the Allies how wide and determined the Republic’s support was, and Britain pressed the Dutch to negotiate. Indonesia commemorates 10 November as Heroes’ Day (Hari Pahlawan).
    facts:
      - [Hotel Yamato flag incident, "19 September 1945"]
      - [Mallaby killed, "30 October 1945"]
      - [British assault, "from 10 November 1945, about three weeks"]
      - [Indonesian dead, "estimates from 6,300 to 15,000 or more"]
    markers:
      - kind: battle
        side: uk
        name: Surabaya
        date: 28 October – late November 1945
        text: The fighting of 28–30 October, in which Mallaby was killed near the Red Bridge, and the British assault from 10 November, which destroyed much of the city. The flag incident of September took place at the Hotel Yamato on Tunjungan street.
        lonlat: [112.738, -7.250]
      - kind: event
        side: ri
        name: Mojokerto
        date: December 1945 – March 1947
        text: The Republican forces fell back to lines south and west of Surabaya, near Sidoarjo and Mojokerto, which held until 1947.
        lonlat: [112.434, -7.472]
        lp: l
