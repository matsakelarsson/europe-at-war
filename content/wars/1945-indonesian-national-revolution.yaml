  - title: The second Dutch offensive
    date: 19 December 1948 – January 1949
    when: "1948-12-19"
    borders: "1948-12-19"
    countries: [id, nl]
    body:
      - Talks under the Committee of Good Offices broke down over the shape of the federation and the future of the Republic’s army. On 18 December 1948 the Dutch declared that they were no longer bound by the Renville agreement, and at dawn on 19 December aircraft bombed Maguwo airfield outside Yogyakarta and paratroopers of the Korps Speciale Troepen took it within half an hour from a few dozen air force cadets. Some 2,600 troops were flown in, and Yogyakarta fell the same day. The cabinet chose to stay and was captured. Sukarno, Hatta, Sjahrir, Agus Salim and other ministers were flown into internment at Prapat in North Sumatra and on Bangka. The sultan, Hamengkubuwono IX, shut himself in his palace and refused to work with the Dutch. The Dutch called the offensive, Operation Kraai (Crow), their second “police action”; Indonesians call it the second Dutch military aggression.
      - Dutch columns crossed the Van Mook line all over Java and in Sumatra, where they took Bukittinggi on 22 December. But Sjafruddin Prawiranegara, a minister then in Bukittinggi, formed an Emergency Government of the Republic in the hills of West Sumatra on 22 December, and the army fought on. Sudirman, gravely ill with tuberculosis, left Yogyakarta and for seven months led the guerrilla war, often carried in a litter, on a route of about 1,000 km through Central and East Java. Under Nasution’s plan the army divided Java into guerrilla districts (Wehrkreise), and the Siliwangi Division marched back across the hills to West Java.
      - Abroad the offensive turned opinion against the Netherlands. The UN Security Council called for a ceasefire and the release of the Republic’s leaders on 24 December and on 28 January 1949 demanded the return of the Republican government to Yogyakarta and a transfer of sovereignty by 1 July 1950. India hosted a conference of Asian states on Indonesia in New Delhi in January, and the United States suspended aid to the Dutch administration in Indonesia and threatened the Marshall Plan aid on which the Netherlands depended.
    facts:
      - [Operation Kraai begins, "19 December 1948"]
      - [Bukittinggi taken, "22 December 1948"]
      - [Emergency Government formed, "22 December 1948"]
      - [UN Security Council Resolution 67, "28 January 1949"]
