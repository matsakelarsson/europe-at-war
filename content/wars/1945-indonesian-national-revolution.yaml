notes:
  - "Indonesians call the war the Indonesian National Revolution (Revolusi Nasional Indonesia) or the War of Independence (Perang Kemerdekaan). The Dutch government called its offensives of July 1947 and December 1948 “police actions” (politionele acties), a term that presented them as the restoring of order in Dutch territory; in Indonesia they are called the first and second Dutch military aggressions (Agresi Militer Belanda I and II)."
  - "For decades the Netherlands dated Indonesia’s independence from the transfer of sovereignty on 27 December 1949, Indonesia from the proclamation of 17 August 1945. In 2005 the Dutch foreign minister Ben Bot said that the Netherlands accepted the proclamation politically and morally, and in June 2023 Prime Minister Mark Rutte recognised 17 August 1945 fully and without reservation. In February 2022, after a research programme by Dutch and Indonesian historians concluded that the Dutch armed forces had used extreme violence systematically and widely, and that governments and courts had tolerated and concealed it, Rutte apologised to Indonesia; the study also described the violence of the Indonesian side."
  - "Casualty figures are uncertain. Indonesian deaths, soldiers, fighters and civilians, are usually put at about 100,000, and some estimates are considerably higher. Dutch military deaths are given as about 4,600–5,300, many of them from disease and accidents; British and Indian deaths as about 600–1,200; Japanese deaths after the surrender as about 1,000. Estimates of the European, Eurasian and other civilians killed on the Dutch side in the bersiap range from 3,500 to 30,000."
  - Names are given in modern spelling; documents of the time write Soekarno, Djokjakarta and Linggadjati (the village is now Linggarjati), and the capital was called Batavia by the Dutch until 1949 and Jakarta (Djakarta) by the Republic.
