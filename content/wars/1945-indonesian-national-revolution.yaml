  - title: The general offensive and the return to Yogyakarta
    date: March – August 1949
    when: "1949-03-01"
    borders: "1949-03-01"
    countries: [id, nl]
    body:
      - The Dutch held the towns and the main roads; the Republican army and its local militias held much of the countryside, ambushing convoys and cutting railways and telephone lines, while Dutch patrols searched and burned villages and killed suspected guerrillas. These months were the bloodiest of the war. The leaders of the federal states, shocked by the offensive, began to look for a settlement with the Republic.
      - At 6 a.m. on 1 March 1949 Republican troops of the Yogyakarta district under Lieutenant Colonel Soeharto, later President Suharto, attacked Yogyakarta from all sides and held the city for about six hours before withdrawing. The aim was to show the world, and the United Nations then debating Indonesia, that the Republic and its army still existed, and the news was spread by radio through the Emergency Government and India. Under Suharto’s New Order the offensive was presented as his idea; other accounts credit the sultan, Hamengkubuwono IX, who sheltered the planners in his palace, or the regional commander, Colonel Bambang Sugeng, and the question is still argued over.
      - Talks under the UN Commission for Indonesia led to the Roem–Van Roijen statements of 7 May 1949, in which the Republic agreed to a ceasefire and to a round table conference, and the Netherlands to restore the Republican government in Yogyakarta. Dutch troops left the city by 30 June, Sukarno and Hatta returned on 6 July and Sudirman on 10 July, and the Emergency Government handed back its mandate. The ceasefire took effect on 11 August in Java and 15 August in Sumatra; in its last days Republican troops under Lieutenant Colonel Slamet Riyadi fought for four days in Surakarta.
    facts:
      - [General Offensive, "1 March 1949, about six hours in Yogyakarta"]
      - [Roem–Van Roijen statements, "7 May 1949"]
      - [Sukarno and Hatta back in Yogyakarta, "6 July 1949"]
      - [Ceasefire, "11 August (Java) and 15 August 1949 (Sumatra)"]
