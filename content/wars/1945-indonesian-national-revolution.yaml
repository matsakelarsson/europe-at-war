  - title: Bandung Lautan Api and Linggadjati
    date: March 1946 – March 1947
    when: "1946-03-24"
    borders: "1946-11-15"
    countries: [id, nl, gb]
    body:
      - In Bandung the British held the north of the city, divided from the Republican south by the railway, and clashes went on through the winter. On 23 March 1946 the British commander demanded that Republican forces withdraw 11 km from the city centre by midnight the next day. The Republican commander in West Java, Colonel A. H. Nasution, chose to evacuate the south and set it on fire rather than hand it over intact. Between a third and half of the city was burned, and estimates of the people who left with the troops range from 200,000 to 500,000. The event is remembered in Indonesia as Bandung Lautan Api, the “Bandung sea of fire”.
      - Dutch troops arrived in growing numbers from March 1946 and took over from the British, who left Java and Sumatra by 30 November 1946; within a year the Netherlands had more than 100,000 soldiers in the islands, many of them conscripts. Sjahrir’s government negotiated throughout, against the opposition of those who, like the veteran communist Tan Malaka and his Struggle Union, demanded “100 percent independence”; Sjahrir was briefly kidnapped by opponents in June 1946.
      - Talks with a Dutch Commission-General under the former prime minister Willem Schermerhorn opened in October 1946, a ceasefire was agreed on 14 October, and in November the delegations met at the hill resort of Linggarjati south of Cirebon. In the Linggadjati Agreement, initialled on 15 November 1946, the Netherlands recognised the Republic’s authority in fact over Java, Madura and Sumatra, and the two sides agreed to form by 1 January 1949 a federal United States of Indonesia, with the Republic as one of its three states, linked to the Netherlands in a union under the Dutch crown. It was formally signed on 25 March 1947, but each side read it differently, the Dutch as a framework for a federation they would shape, the Republic as a step to full independence. In the east, where the Dutch had taken over from the Australians, Lieutenant Governor-General Hubertus van Mook’s conference at Denpasar created the first federal state, East Indonesia, in December 1946.
    facts:
      - [Bandung Lautan Api, "23–24 March 1946"]
      - [British withdrawal completed, "30 November 1946"]
      - [Linggadjati Agreement, "initialled 15 November 1946, signed 25 March 1947"]
      - [State of East Indonesia, "24 December 1946"]
