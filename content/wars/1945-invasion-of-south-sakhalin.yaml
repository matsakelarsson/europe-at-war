  - title: Maoka, Toyohara and the end of Karafuto
    date: 20–25 August 1945
    when: "1945-08-20"
    borders: "1945-08-25"
    countries: [ru, jp, kr]
    body:
      - On 20 August a Soviet landing force of about 3,400 men from the 113th Rifle Brigade and a naval infantry battalion came ashore at Maoka, the port from which civilians were leaving for Hokkaido and which was crowded with some 15,000 residents and refugees. Japanese troops had been withdrawn inland. Soviet reports describe fighting in the streets; Japanese accounts say the town was not defended and that most of the dead were civilians shot in the streets and in air-raid shelters. At the post and telegraph office nine of the young women who kept the telephone exchange working took poison rather than be captured. Inland, Japanese and Soviet troops fought for the passes on the road to Toyohara. Near Maoka, in the village of Mizuho, Japanese farmers and former soldiers killed some 27 Korean neighbours, women and children among them, on suspicion of spying; a Soviet military court later sentenced several of them to death.
      - On 22 August, as the 88th Division at last received orders to lay down its arms, its chief of staff signed a ceasefire with the Soviet commanders, but Soviet aircraft bombed Toyohara station, where evacuees had gathered under white flags. The same morning Soviet submarines torpedoed or shelled three ships carrying evacuees from Ōtomari off Rumoi and Mashike on Hokkaido; the Ogasawara Maru and the Taitō Maru sank. The Soviets banned all departures from the island on 23 August, occupied Toyohara on 24 August and landed unopposed at Ōtomari on 25 August, completing the conquest of South Sakhalin. Stalin had meanwhile dropped his plan to land on northern Hokkaido after President Truman refused him a Soviet occupation zone there.
