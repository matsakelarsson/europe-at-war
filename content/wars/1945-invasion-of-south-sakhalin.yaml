notes:
  - Soviet and Japanese accounts disagree about many events of the campaign, among them who fired first at Maoka on 20 August and whether Japanese envoys were shot while trying to negotiate. The English Wikipedia article on the invasion is a rough translation from Japanese and is marked as unreliable in places; the figures here are those given in several sources.
  - "Losses: Soviet sources give at least 527 killed and 845 wounded in the 56th Rifle Corps; Japanese military dead are estimated at 700 to 2,000, and about 18,200 Japanese soldiers were taken prisoner, many of them to labour camps in Siberia. Estimates of Japanese civilian deaths in the fighting are about 3,500 to 3,700. Estimates of the dead in the sinking of the evacuation ships range from about 1,700 to more than 2,400."
  - Japan renounced its claim to South Sakhalin in the San Francisco Peace Treaty of 1951 but has not recognised Soviet or Russian sovereignty in a treaty; Japanese maps show the southern half of the island as of undetermined status.
