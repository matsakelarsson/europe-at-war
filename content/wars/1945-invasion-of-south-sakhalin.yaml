steps:
  - title: Koton and the west coast
    date: 11–19 August 1945
    when: "1945-08-11"
    borders: "1945-08-11"
    countries: [ru, jp]
    body:
      - Karafuto had been a quiet rear area. Its defence rested on the 88th Division under Lieutenant General Mineki Jūichirō, about 20,000 men with some reservists and volunteers, part of the 5th Area Army under Lieutenant General Higuchi Kiichirō in Sapporo, which expected an American rather than a Soviet attack. Along the 50th parallel the Japanese had built the Koton fortified zone in the valley of the Poronai, the only road south through the forested hills. On the morning of 11 August the Soviet 79th Rifle Division, with tanks of the 214th Tank Brigade, crossed the border. About a hundred soldiers and border police held the frontier village of Handa for a day and a night and were almost all killed on 12 August; the Soviets then attacked the Koton positions held by the Japanese 125th Infantry Regiment.
      - The 125th Regiment held its bunkers for a week, even after the emperor’s broadcast of 15 August; a Soviet general assault on 16 August failed to take the main line, and the regiment laid down its arms on 19 August when it received the order to cease fire. On the west coast a Soviet naval landing force sailed from Sovetskaya Gavan and came ashore at Tōro on the morning of 16 August, then took the coal port of Esutoru against fierce resistance by local defence units and civilian volunteers. Before the Soviets arrived, Japanese volunteers in the Esutoru area had executed Koreans whom they suspected of spying.
