id: invasion-of-south-sakhalin
name: Soviet invasion of South Sakhalin
start: "1945-08-11"
end: "1945-08-25"
tier: B
summary: "The Soviet conquest of Karafuto, the Japanese southern half of Sakhalin, in the last weeks of the Second World War. Japan had held Sakhalin south of the 50th parallel since the Treaty of Portsmouth of 1905, and by 1945 nearly 400,000 Japanese, Koreans and indigenous people lived there. At Yalta the Allies had promised South Sakhalin to the Soviet Union, which declared war on Japan on 8 August 1945. On 11 August the 56th Rifle Corps of the Soviet 16th Army attacked across the border into the fortified zone at Koton, defended by the Japanese 88th Division. Fighting went on after Emperor Hirohito announced Japan’s surrender on 15 August: the Soviet command wanted the island taken quickly, as a step towards a landing on Hokkaido that Stalin called off on 22 August, and the Japanese 5th Area Army in Sapporo ordered the division to keep defending it. The Koton garrison held out until it was ordered to lay down its arms on 19 August; Soviet troops landed at Tōro on 16 August and at Maoka on 20 August, where many civilians died, among them nine telephone operators who took their own lives. Soviet aircraft bombed Toyohara, the capital, on 22 August, the day a ceasefire was signed, and Soviet submarines sank or damaged three ships carrying evacuees off Rumoi on Hokkaido. Toyohara was occupied on 24 August and Ōtomari on 25 August. Japanese civilians in Karafuto also killed Korean neighbours suspected of spying, most notoriously at Mizuho. About 76,000 to 80,000 people had escaped to Hokkaido before the Soviets closed the island; most of the remaining Japanese were repatriated in 1946–1949, while some 43,000 Koreans were left behind. The Soviet Union annexed South Sakhalin on 2 February 1946."
countries: [ru, jp, kr]
sides:
  - id: su
    name: Soviet Union
    polities: [ussr]
    ink: red
    moves: Soviet moves
    success: Soviet success
  - id: jp
