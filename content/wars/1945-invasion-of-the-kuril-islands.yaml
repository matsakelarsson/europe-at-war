steps:
  - title: The battle for Shumshu
    date: 18–23 August 1945
    when: "1945-08-18"
    borders: "1945-08-18"
    countries: [ru, jp]
    body:
      - On 15 August, the day of Emperor Hirohito’s surrender broadcast, Marshal Aleksandr Vasilevsky ordered the occupation of Shumshu and Paramushir, the two northern Kuril islands just off the tip of Kamchatka, as the first step towards taking the whole chain. Major General Aleksei Gnechko gathered about 8,800 men of the Kamchatka Defence Area and some 60 ships and craft, many of them American-built vessels handed over under the secret Project Hula, at Petropavlovsk. Shumshu was held by part of the Japanese 91st Division under Lieutenant General Tsutsumi Fusaki, with the 11th Tank Regiment, some 8,500 men in all; most of the Japanese troops in the northern Kurils were on Paramushir.
      - Before dawn on 18 August, in thick fog, Soviet troops waded ashore at Takeda beach on the north-east coast under fire from the Japanese batteries, which sank or damaged several landing craft, and pushed inland towards the heights in the north of the island. The Japanese counter-attacked with tanks and reinforcements from Paramushir; the tank regiment lost about 20 tanks and its commander, Colonel Ikeda Sueo. The Japanese troops had been ordered by the 5th Area Army to cease all hostilities by four o’clock that afternoon, except in self-defence, and had begun to disarm when the Soviets landed. Fighting went on while the two sides negotiated, and the Japanese forces on Shumshu and Paramushir formally laid down their arms on 23 August. It was the only large battle of the Kuril campaign and, as it is often called, the last battle of the Second World War.
    facts:
      - [Soviet landing force, "about 8,800 men, about 60 ships and craft"]
      - [Japanese on Shumshu, "about 8,500 men, with tanks"]
      - [Landing, "18 August 1945"]
      - [Japanese surrender in the northern Kurils, "23 August 1945"]
