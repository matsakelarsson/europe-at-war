id: invasion-of-the-kuril-islands
name: Soviet invasion of the Kuril Islands
start: "1945-08-18"
end: "1945-09-05"
tier: B
summary: "The Soviet occupation of the Kuril Islands, the chain of volcanic islands between Kamchatka and Hokkaido, at the very end of the Second World War, and the expulsion of their Japanese inhabitants. The northern Kurils had been Japanese since the Treaty of Saint Petersburg of 1875, the southern islands since the Treaty of Shimoda of 1855, and at Yalta the Allies had promised the Kurils to the Soviet Union. Three days after Japan announced its surrender, on 18 August 1945, Soviet troops from Kamchatka landed on Shumshu, the northernmost island, where the Japanese 91st Division fought back with tanks until it was ordered to lay down its arms; the fighting, the last large battle of the war, ended on 23 August with heavy losses on the Soviet side. Soviet forces then occupied the islands southwards to Urup without resistance, and ships from Sakhalin landed troops on Iturup on 28 August, on Kunashir and Shikotan on 1 September and on the Habomai islets by 5 September, after Japan had signed the instrument of surrender on 2 September. About 50,000 Japanese soldiers were taken prisoner. Of the roughly 17,000 Japanese living on the four southern islands, about half fled to Hokkaido in small boats; the rest were deported to Japan in 1947–1949. The Soviet Union annexed the islands on 2 February 1946. Japan claims the four southern islands, Etorofu (Iturup), Kunashiri, Shikotan and the Habomai islands, as its Northern Territories, while Russia holds that they became Soviet by the post-war settlement; the dispute has prevented a peace treaty between the two countries."
countries: [ru, jp]
sides:
  - id: su
    name: Soviet Union
    polities: [ussr]
    ink: red
    moves: Soviet moves
    success: Soviet success
  - id: jp
    name: Empire of Japan
    polities: [japan]
    ink: navy
    moves: Japanese moves
    success: Japanese success
notes:
  - "Casualty figures for Shumshu differ widely. Figures for the Soviet dead range from 516 to about 2,400, and for total Soviet losses, with the wounded, from about 1,500 to 3,500; Japanese figures give the Japanese side 191 killed and about 409 wounded, while Soviet accounts claimed 1,018 Japanese killed and wounded. Japanese accounts put Soviet losses at 3,000 or more."
  - The dates of the occupation of the southern islands follow the Japanese government (28 August – 5 September 1945); Soviet accounts date the occupation of the last Habomai islets to 3–4 September.
  - The English Wikipedia article on the Battle of Shumshu is a rough translation from Japanese and is marked as partly unreliable; the facts here have been checked against other sources where possible.
