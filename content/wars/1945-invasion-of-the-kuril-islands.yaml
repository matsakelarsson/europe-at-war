  - title: Expulsion and the Northern Territories dispute
    date: 1946–1949, and the dispute to today
    when: "1946-02-02"
    borders: "1946-02-02"
    countries: [ru, jp]
    body:
      - The Soviet Union annexed South Sakhalin and the Kurils by decree on 2 February 1946 and settled them with Soviet citizens. About 17,000 Japanese had lived on the four southern islands. According to the Japanese government, about half escaped to Hokkaido in small boats; the rest lived for a time alongside the newcomers and were then deported, by way of camps on Sakhalin, to Japan in 1947–1949. The Japanese communities of the islands came to an end.
      - Japan’s position is that Etorofu, Kunashiri, Shikotan and the Habomai islands were never Russian before 1945, having been recognised as Japanese in the treaty of 1855, that they are not part of the “Kurile Islands” which Japan renounced in the San Francisco Peace Treaty of 1951, and that their occupation is illegal. Russia’s position is that the islands passed to the Soviet Union under the Yalta agreement and the post-war settlement, as a result of the Second World War. In the Soviet–Japanese Joint Declaration of 1956 the Soviet Union agreed to hand over Shikotan and the Habomai islands once a peace treaty was signed, but no treaty has been concluded. In March 2022, after Japan joined the sanctions over Russia’s invasion of Ukraine, Russia broke off the peace treaty talks.
    facts:
      - [Annexation by the Soviet Union, "2 February 1946"]
      - [Japanese residents of the four southern islands, "about 17,000 (1945)"]
      - [Deportation to Japan, "1947–1949"]
      - [Soviet–Japanese Joint Declaration, "19 October 1956"]
