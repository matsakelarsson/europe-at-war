  - title: The southern islands
    date: 22 August – 5 September 1945
    when: "1945-08-22"
    borders: "1945-09-05"
    countries: [ru, jp]
    body:
      - From 22 August troops of the Kamchatka Defence Area moved down the chain, accepting the surrender of the Japanese garrisons on Onekotan, Matua, Simushir and the other central islands; the 129th Independent Mixed Brigade on Urup gave up at the end of August. The Japanese garrisons had been told to surrender and did not resist. In the south, ships of the Soviet Pacific Fleet sailing from Ōtomari in newly occupied Sakhalin landed troops on Iturup on 28 August, where the Japanese 89th Division surrendered.
      - On 1 September Soviet troops landed on Kunashir and Shikotan, and between 3 and 5 September they occupied the small Habomai islands off the tip of Hokkaido’s Nemuro peninsula, after Japan had signed the instrument of surrender in Tokyo Bay on 2 September. Some 50,000 Japanese soldiers from the Kurils were taken prisoner, most of them to labour camps in the Soviet Union. The Soviet Union had asked for a Soviet occupation zone in northern Hokkaido as well, which the United States refused. The Kuril landings were the last Soviet operation of the war.
    facts:
      - [Iturup occupied, "28 August 1945"]
      - [Kunashir and Shikotan occupied, "1 September 1945"]
      - [Japan signs the surrender, "2 September 1945"]
      - [Habomai islands occupied, "3–5 September 1945"]
      - [Japanese prisoners in the Kurils, "about 50,000"]
