notes:
  - The Azerbaijan People’s Government and the Republic of Mahabad were never recognised by any state; they are drawn as areas, and the base map shows the whole region as Iranian. Their borders are approximate; the Mahabad republic held only the towns of Mahabad, Bukan, Naqadeh, Oshnavieh and Piranshahr and the country around them.
  - Casualty figures are uncertain. The fighting itself was limited, but hundreds of the Democrats’ supporters were killed by crowds and in reprisals as the Iranian army returned, and many more were imprisoned or fled to the Soviet Union.
  - President Truman later said that he had sent Stalin an ultimatum over Iran in March 1946; historians have found no record of one, though the United States did protest strongly.
