steps:
  - title: Two governments under Soviet protection
    date: November 1945 – May 1946
    when: "1945-11-16"
    borders: "1946-01-22"
    countries: [ir, ru]
    body:
      - Britain and the Soviet Union had invaded Iran in August 1941 to secure its oil and a supply route to the Soviet Union, and promised in a treaty of 1942 to withdraw within six months of the end of the war, that is, by 2 March 1946. In 1944 the Iranian parliament refused the Soviet Union an oil concession in the north. In September 1945 Ja’far Pishevari, a veteran communist, founded the Azerbaijan Democratic Party in Tabriz, and in November its armed volunteers, supported by the Red Army, took over the government offices and police posts of the province. Soviet troops stopped an Iranian army column sent from Tehran near Qazvin. On 12 December 1945 a National Assembly in Tabriz proclaimed an autonomous government with Pishevari as prime minister, which made Azerbaijani Turkish the official language and began land reform.
      - On 22 January 1946, in Mahabad, Qazi Muhammad proclaimed a Kurdish republic, defended by local tribesmen and by Mustafa Barzani’s Kurdish fighters from Iraq. Iran complained to the UN Security Council, its first case, and the Soviet troops stayed past the 2 March deadline. Prime Minister Ahmad Qavam negotiated in Moscow and, on 4 April 1946, agreed that the Soviet troops would leave, that a joint Soviet–Iranian oil company would be set up if the next parliament approved it, and that Azerbaijan was an internal Iranian matter. The last Soviet troops left in early May.
