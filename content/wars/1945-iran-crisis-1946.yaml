id: iran-crisis-1946
name: Iran crisis of 1946
start: "1945-11-16"
end: "1946-12-15"
tier: B
summary: One of the first crises of the Cold War. Soviet troops, who had occupied northern Iran with the British since 1941, stayed on after the war, and under their protection the Azerbaijan Democratic Party of Ja’far Pishevari set up an autonomous Azerbaijan People’s Government in Tabriz in December 1945, while Kurdish nationalists under Qazi Muhammad proclaimed the Republic of Mahabad in January 1946. Iran took its case to the new UN Security Council, and Prime Minister Ahmad Qavam persuaded Stalin to withdraw his troops in return for the promise of an oil concession. Once the Soviet troops had left, in May 1946, the Iranian army moved in; the Tabriz government collapsed and Iranian troops entered Tabriz on 13 December and Mahabad on 15 December 1946. Qazi Muhammad was hanged in 1947, and the Iranian parliament rejected the Soviet oil concession.
