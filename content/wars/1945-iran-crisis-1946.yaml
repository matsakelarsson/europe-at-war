  - title: The army returns to Tabriz and Mahabad
    date: December 1946 – 1947
    when: "1946-12-10"
    borders: "1946-12-15"
    countries: [ir]
    body:
      - In June 1946 Tehran and Tabriz reached an agreement that left the Democrats in charge of the province, and Qavam took three ministers from the communist Tudeh party into his cabinet. But after a tribal revolt in the south he dropped them, and in November he announced that the army would enter Azerbaijan to supervise elections. Without Soviet support the Democrats’ militia melted away; on 10 December the army advanced from Zanjan, Pishevari fled to Soviet Azerbaijan, and crowds in Tabriz turned on the party’s followers before Iranian troops entered the city on 13 December 1946.
      - Qazi Muhammad surrendered Mahabad, and the army entered it on 15 December. He was hanged there with his brother and cousin on 31 March 1947. Barzani and his fighters fought their way across Iran, Iraq and Turkey and crossed into the Soviet Union in June 1947. In October 1947 the new parliament rejected the Soviet oil agreement. The crisis showed that the Soviet Union could be made to back down, and became an early lesson of the Cold War.
