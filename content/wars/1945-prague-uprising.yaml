id: prague-uprising
name: Prague uprising
start: "1945-05-05"
end: "1945-05-09"
tier: C
summary: A rising by the people of Prague against the German occupation in the last days of the Second World War in Europe. It broke out on 5 May 1945 around the radio building, and the insurgents, most of them civilians with few weapons, put up hundreds of barricades. German forces, reinforced by Waffen-SS units, counter-attacked. On 6–7 May the 1st Division of the Russian Liberation Army, former Soviet prisoners who had served Germany, turned against the Germans before withdrawing west, while the US Third Army, which had reached Plzeň, was ordered not to advance. On 8 May the Czech National Council agreed a ceasefire that let the Germans leave the city, but some SS units fought on until the Red Army arrived on 9 May. Between about 1,700 and 2,900 insurgents and many civilians were killed, as were 1,000 or more German soldiers. Both sides committed massacres, and violence against German civilians went on after the fighting.
