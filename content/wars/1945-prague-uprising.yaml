notes:
  - The Russian Liberation Army (ROA) was led by Andrey Vlasov, a captured Soviet general. Its men left Prague before the Red Army arrived, hoping to surrender to the Americans; many were handed over to the Soviet Union and executed or imprisoned.
  - Numbers of dead are uncertain. The lower figure for the insurgents is the official count of 1946, which included only identified dead.
