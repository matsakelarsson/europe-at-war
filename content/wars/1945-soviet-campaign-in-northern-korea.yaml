id: soviet-campaign-in-northern-korea
name: Soviet campaign in northern Korea
start: "1945-08-09"
end: "1945-08-26"
tier: C
summary: "The part of the Soviet war against Japan fought in Korea in August 1945. From 9 August, the day after the Soviet declaration of war, aircraft and torpedo boats of the Pacific Fleet attacked the ports of Unggi (Yuki), Najin (Rashin) and Chongjin (Seishin) in the north-east of Japanese-ruled Korea, while Colonel General Ivan Chistyakov’s 25th Army crossed the Tumen from Primorye. With small marine landings the Soviets took Unggi on 11–12 August and Najin on 12 August. At Chongjin a few hundred marines landed on 13 August and fought for three days against a larger Japanese garrison reinforced by retreating troops until more Soviet forces arrived on 16 August; about 227 Japanese and 230–300 Soviet soldiers were killed or went missing. Japan announced its surrender on 15 August, but fighting in the north-east lasted until about 18 August. Soviet marines landed at Wonsan on 21 August and airborne detachments flew into Hamhung and Pyongyang on 24 August, where the Japanese garrisons laid down their arms; Chistyakov reached Pyongyang on 26 August. On 16 August Stalin had accepted the American proposal, made in General Order No. 1, to divide the occupation of Korea at the 38th parallel, and Soviet troops halted there; American troops landed at Incheon on 8 September. The Soviet Civil Administration set up by the 25th Army governed the North until 1948 and brought Kim Il-sung, who arrived at Wonsan in September, to power. Koreans in the South mark 15 August as Gwangbokjeol, the day of the “restoration of light”, and in the North as the day of liberation (haebang); Soviet troops are remembered there as liberators, while Japanese and many Korean accounts also record looting and rape by Soviet soldiers and the flight of Japanese civilians southwards."
