  - title: Across the Greater Khingan
    date: 9–19 August 1945
    when: "1945-08-09"
    borders: "1945-08-15"
    countries: [cn, mn, ru, jp]
    body:
      - The Transbaikal Front’s main blow came where the Japanese least expected it. Malinovsky’s 6th Guards Tank Army under Andrei Kravchenko crossed the waterless steppe from Mongolia and climbed the passes of the Greater Khingan, a range the Japanese thought impassable for tanks, and came down onto the Manchurian plain around Lubei and Tuquan by 12 August. It had outrun its fuel, some 700 km from its railheads, and waited nearly two days while aircraft flew in 940 tonnes of fuel and oil. On its left the 39th Army took the Halun-Arshan fortified area and drove through Solun to Wangyemiao (today’s Ulanhot) and Taonan.
      - In the north the 36th Army crossed the Argun and bypassed Hailar, whose garrison held out in its bunkers until 18 August, and fought its way over the Khingan to Zhalantun and on to Qiqihar. At Gegenmiao near Wangyemiao on 14 August, soldiers of the 39th Army attacked a camp of about 1,800 Japanese refugees, mostly women and children; well over a thousand were killed, and local people looted the dead and took children. By 15 August the Soviet and Mongolian armies were 250–450 km inside Manchuria and Inner Mongolia, and on 19 August they stood on a line through Chengde, Chifeng, Shenyang, Changchun and Qiqihar.
    facts:
      - [6th Guards Tank Army reaches the plain, "12 August 1945"]
      - [Fuel airlifted, "940 tonnes, 12–13 August 1945"]
      - [Hailar garrison surrenders, "18 August 1945, about 3,800 men"]
      - [Gegenmiao massacre, "14 August 1945"]
