  - title: Mudanjiang, Hutou and the Sungari
    date: 9–26 August 1945
    when: "1945-08-12"
    borders: "1945-08-16"
    countries: [cn, ru, jp]
    body:
      - In the east Meretskov’s 1st Far Eastern Front broke through the belt of Japanese fortifications along the Maritime border. The 5th Army and the 1st Red Banner Army converged on Mudanjiang, the main city of eastern Manchuria, where the Japanese 5th Army made a determined stand from 12 to 16 August, using suicide squads with explosive charges against Soviet tanks. The city fell on 16 August. The Japanese lost more than 9,000 killed there and the Soviets, by some counts, about 12,000 killed and wounded; but most of the Japanese army got away to the south-west. Further south the 25th Army advanced through Dongning and Wangqing and into north-eastern Korea, where Soviet marines landed at Chongjin on 13–16 August.
      - At Hutou on the Ussuri, the 15th Border Guard Brigade, about 1,400 men with Japanese civilians sheltering in its tunnels, held out against the 35th Army long after the emperor’s broadcast. The fortress fell on 26 August; only about 50 of the garrison survived. In the north Purkayev’s 2nd Far Eastern Front crossed the Amur. The 15th Army and the Amur Flotilla sailed up the Sungari, took Fujin and Jiamusi and reached Harbin, while the 2nd Red Banner Army fought for the fortified area of Sunwu and pushed south towards Qiqihar and Harbin.
    facts:
      - [Battle of Mudanjiang, "12–16 August 1945"]
      - [Hutou falls, "26 August 1945"]
      - [Hutou garrison, "about 1,400; some 50 survived"]
