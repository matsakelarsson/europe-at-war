  - title: Surrender and the airborne landings
    date: 15–22 August 1945
    when: "1945-08-15"
    borders: "1945-08-19"
    countries: [cn, ru, jp]
    body:
      - On 15 August Emperor Hirohito announced Japan’s acceptance of the Allied terms. The Soviet command declared that a broadcast was not a capitulation and kept advancing. On 17 August Yamada asked to negotiate, and on 18 August his order to lay down arms went out by radio; on 19 August his chief of staff, Lieutenant General Hata Hikosaburō, met Vasilevsky and was given his terms. Puyi, who had fled Changchun on 11 August, renounced the throne of Manchukuo on 17–18 August at Dalizigou near the Korean border.
      - To take the cities before the Japanese could destroy anything or slip away, the Soviets flew in small airborne detachments, a few hundred men each. They landed at Harbin on 18 August, at Changchun, Shenyang (Mukden) and Jilin on 19 August, and at Lüshun (Port Arthur) and Dalian on 22 August, and took the surrender of garrisons many times their size. At Mukden airfield on 19 August the paratroopers found Puyi waiting for a plane to Japan and took him prisoner; he was flown to the Soviet Union and later handed over to the People’s Republic of China. The tank armies arrived behind them, the 6th Guards Tank Army reaching Lüshun by 26 August. Isolated Japanese units fought on in places until the end of the month.
    facts:
      - [Emperor’s broadcast, "15 August 1945"]
      - [Yamada’s ceasefire order, "18 August 1945"]
      - [Airborne landings, "Harbin 18 August; Changchun, Shenyang, Jilin 19 August; Lüshun and Dalian 22 August"]
      - [Puyi captured, "19 August 1945, at Shenyang (Mukden)"]
