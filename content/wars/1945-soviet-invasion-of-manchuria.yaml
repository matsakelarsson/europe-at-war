  - title: Inner Mongolia and Kalgan
    date: 9–26 August 1945
    when: "1945-08-10"
    borders: "1945-08-19"
    countries: [cn, mn, ru, jp]
    body:
      - On the southern flank the Soviet–Mongolian Cavalry-Mechanised Group under Issa Pliyev, with four Mongolian cavalry divisions and a Mongolian armoured brigade beside Soviet tank and mechanised units, crossed the Gobi into Inner Mongolia, the land of Mengjiang. Further east the Soviet 17th Army marched on Chifeng. Mongolia’s leader, Khorloogiin Choibalsan, hoped to unite Inner Mongolia with his country. By 14–15 August the cavalry had reached Dolon Nor (Duolun), and one column turned south-west towards Zhangjiakou (Kalgan), the Mengjiang capital, another south-east towards Rehe.
      - Prince Demchugdongrub left Zhangjiakou for Beijing on 19 August, and Mengjiang ceased to exist. Soviet and Mongolian troops broke into the city on 20 August, but the Japanese 2nd Independent Mixed Brigade, which had not accepted the surrender, drove them back on 21 August, covering the flight of the Japanese residents towards Beijing, and then withdrew to Nankou near the Great Wall, which it reached on 26 August. The Soviet and Mongolian forces halted, and Chinese Communist troops of the Eighth Route Army took over Zhangjiakou, which became the capital of their Shanxi–Chahar–Hebei border region.
    facts:
      - [Dolon Nor reached, "about 14–15 August 1945"]
      - [Demchugdongrub leaves Zhangjiakou, "19 August 1945"]
      - [Japanese rearguard leaves for Nankou, "21–26 August 1945"]
