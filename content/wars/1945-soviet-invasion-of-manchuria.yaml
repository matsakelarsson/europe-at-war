notes:
  - In Soviet and Russian usage this was the Manchurian strategic offensive operation, made up of the Khingan–Mukden, Harbin–Kirin and Sungari operations; Western writers often call it Operation August Storm, a name coined by the American historian David Glantz. Soviet landings in northern Korea, South Sakhalin and the Kuril Islands belong to the same war and will be told in later entries.
  - Figures for the forces and losses differ widely. Soviet sources counted Japanese dead at about 84,000, Japanese sources at about 21,000–24,000; the Soviet Union reported about 9,800–12,000 of its own soldiers killed.
  - Chinese place names are given in pinyin, with the names used at the time in brackets where they are well known (Shenyang (Mukden), Lüshun (Port Arthur), Zhangjiakou (Kalgan)). Changchun was Xinjing, the capital of Manchukuo.
