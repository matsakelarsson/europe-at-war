id: soviet-invasion-of-manchuria
name: Soviet invasion of Manchuria
start: "1945-08-09"
end: "1945-09-02"
tier: A
summary: "The Soviet Union’s attack on Japan’s Kwantung Army and the client states of Manchukuo and Mengjiang in August 1945, the last great campaign of the Second World War. Stalin had promised at Yalta to enter the war against Japan within three months of Germany’s defeat, in return for South Sakhalin, the Kurils and Japan’s rights in Manchuria. The Soviet Union declared war on 8 August, between the atomic bombings of Hiroshima and Nagasaki, and at midnight some 1.5 million Soviet troops with Mongolian allies attacked from three sides: across the Gobi and the Greater Khingan from Mongolia, through the fortified border at Mudanjiang from the east, and over the Amur and up the Sungari from the north. The Kwantung Army, stripped of its best units, was broken within a week. After Emperor Hirohito’s surrender broadcast of 15 August most Japanese units laid down their arms, Soviet airborne troops seized the cities, and the Manchukuo emperor Puyi was captured at Mukden. About 600,000 Japanese were taken to labour camps in the Soviet Union. The Soviet army stayed until May 1946 and stripped Manchuria’s industry; on leaving, it let much of the countryside and the captured Japanese arms pass to the Chinese Communists, while the Nationalists took over the southern cities."
countries: [cn, ru, mn, jp]
