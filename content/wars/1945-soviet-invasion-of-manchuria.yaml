  - title: Occupation, prisoners and the race for Manchuria
    date: August 1945 – May 1946
    when: "1945-08-20"
    borders: "1945-09-02"
    countries: [cn, ru, mn, jp]
    body:
      - The Soviet Union reported taking about 600,000 prisoners in Manchuria and Korea. Most were sent to labour camps in Siberia, Central Asia and elsewhere in the Soviet Union, where they cut timber, built railways and worked in mines; estimates of the number taken range from about 560,000 to 760,000, and of the deaths in captivity from about 60,000, the number the Soviet authorities certified, to several hundred thousand. The last were released in 1956. More than a million Japanese civilians had lived in Manchuria. Many settlers in the north were abandoned by the retreating army; thousands died in flight, by suicide or in attacks, and many more of hunger, cold and disease in the winter of 1945–1946, before repatriation through Huludao began in 1946. Soviet troops looted and raped on a large scale in the occupied cities, against Japanese and Chinese alike, and dismantled much of Manchuria’s industry and shipped it to the Soviet Union as war booty.
      - On 14 August China and the Soviet Union had signed a treaty of friendship in Moscow, by which the Soviet Union recognised Chiang Kai-shek’s government, promised to withdraw within three months and received the rights promised at Yalta; China agreed to recognise Outer Mongolia’s independence if a plebiscite approved it, which it did on 20 October 1945. In practice the Soviet army delayed its withdrawal, kept Nationalist troops out of the ports and let the Chinese Communists, who sent tens of thousands of soldiers and cadres into Manchuria from the autumn of 1945, take over many Japanese arsenals. When the last Soviet troops left in early May 1946, Communists and Nationalists fought for the region, and Manchuria became the base from which the Communists won the civil war. The Soviet Union kept its naval base at Lüshun until 1955.
    facts:
      - [Japanese prisoners, "about 600,000 by Soviet count"]
      - [Sino-Soviet Treaty of Friendship and Alliance, "14 August 1945"]
      - [Mongolian independence plebiscite, "20 October 1945"]
      - [Last Soviet troops leave Manchuria, "May 1946"]
      - [Lüshun returned to China, "1955"]
    markers:
      - kind: event
        side: su
        name: Shenyang (Mukden)
