steps:
  - title: Yalta and the Soviet build-up
    date: February – 8 August 1945
    when: "1945-02-11"
    borders: "1945-08-08"
    countries: [cn, ru, mn, jp]
    body:
      - At the Yalta Conference in February 1945 Stalin promised Roosevelt and Churchill that the Soviet Union would enter the war against Japan two or three months after Germany surrendered. In a secret agreement of 11 February the Allies promised him in return the status quo in Outer Mongolia, the return of South Sakhalin, the Kuril Islands, a lease on Port Arthur (Lüshun) as a naval base, a leading role in the port of Dalian (Dairen) and joint Soviet–Chinese control of the Manchurian railways, subject to the agreement of Chiang Kai-shek’s government, which was not told. On 5 April the Soviet Union announced that it would not renew its neutrality pact with Japan of 1941.
      - After Germany’s surrender in May the Soviet Union moved hundreds of thousands of men, guns and tanks along the Trans-Siberian Railway, many of them veterans of the war in Europe. Marshal Aleksandr Vasilevsky took command of all Soviet forces in the Far East, with three fronts under Rodion Malinovsky (Transbaikal), Kirill Meretskov (1st Far Eastern) and Maksim Purkayev (2nd Far Eastern). By August they had about 1.5 million men, more than 5,500 tanks and self-propelled guns and some 3,700 aircraft.
      - The Kwantung Army under General Yamada Otozō had once been Japan’s elite, but most of its best divisions had been sent to the Pacific and to China. Its strength in Manchuria, about 700,000 men by most counts, had been made up with reservists and Japanese settlers called up in the summer, and it had few modern tanks or aircraft. With it stood the armies of Manchukuo (170,000–200,000 men) and of Prince Demchugdongrub’s Mengjiang in Inner Mongolia (about 44,000). Its plan was to fight a delaying battle on the borders and fall back on a redoubt in the mountains around Tonghua, near Korea. It did not expect an attack before the autumn, nor across the Greater Khingan from Mongolia.
    facts:
      - [Yalta agreement on Japan, "11 February 1945"]
      - [Neutrality pact denounced, "5 April 1945"]
      - [Soviet forces, "about 1.5 million men, 5,500 tanks and self-propelled guns, 3,700 aircraft"]
      - [Kwantung Army, "about 700,000 men in Manchuria (estimates vary)"]
