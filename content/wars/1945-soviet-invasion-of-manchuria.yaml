  - title: Three fronts attack
    date: 8–10 August 1945
    when: "1945-08-08"
    borders: "1945-08-09"
    countries: [cn, ru, mn, jp]
    body:
      - On the afternoon of 8 August, two days after the atomic bombing of Hiroshima, Molotov handed the Japanese ambassador, Satō Naotake, a declaration that the Soviet Union would consider itself at war with Japan from 9 August. The attack began a few minutes after midnight, Transbaikal time, before Tokyo had even heard the news. Vasilevsky’s plan was a vast double envelopment. The Transbaikal Front was to strike east from Mongolia and Transbaikalia across the Greater Khingan to the central Manchurian plain, the 1st Far Eastern Front west from the Maritime Province through the fortified border, and the 2nd Far Eastern Front south across the Amur and up the Sungari, the three meeting at Changchun, Shenyang and Harbin.
      - In the west the Soviet armies met little resistance at first; the 6th Guards Tank Army covered about 150 km on the first day. In the east the 1st Far Eastern Front attacked at night in heavy rain, without an artillery barrage, and slipped between the Japanese border forts, leaving them to be reduced later. On 9 August the United States dropped its second atomic bomb on Nagasaki. On 10 August the Mongolian People’s Republic declared war on Japan, a day after its troops had crossed the border with the Soviet army.
    facts:
      - [Soviet declaration of war, "8 August 1945"]
      - [Invasion begins, "just after midnight, 9 August 1945"]
      - [Mongolian declaration of war, "10 August 1945"]
