notes:
  - "In Vietnam the war is called the Resistance War against the French (Kháng chiến chống Pháp), in France the Indochina War (guerre d’Indochine). Its start is usually given as the Viet Minh attack in Hanoi on 19 December 1946, but many historians date it from the fighting in Saigon in September 1945. The ceasefire agreed at Geneva took effect in stages, in the north on 27 July, in central Vietnam on 1 August and in the south on 11 August 1954."
  - "The Viet Minh (League for the Independence of Vietnam) was founded in 1941 by the Indochinese Communist Party, which formally dissolved itself in November 1945 and reappeared as the Vietnam Workers’ Party in 1951. The French Union forces were French regulars and volunteers (France did not send conscripts to Indochina), the Foreign Legion, North and West African troops, and a growing number of Vietnamese, Lao and Cambodian soldiers, including from 1950 the Vietnamese National Army of the State of Vietnam. Laos, Cambodia and the State of Vietnam were Associated States of the French Union from 1949."
  - "Casualty figures are uncertain. France counted 74,220 dead in the French Union forces, 20,685 of them French; the State of Vietnam lost 58,877 dead or missing. Western historians estimate Viet Minh dead at 175,000–300,000, and the Vietnamese government gives 191,605 dead or missing. Estimates of civilian deaths range from 125,000 to 400,000."
  - The areas shown as held by the Viet Minh are approximate. The French held the towns, roads and posts; much of the countryside, even in the Red River and Mekong deltas, was contested, governed by day by one side and by night by the other.
