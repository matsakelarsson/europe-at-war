  - title: Haiphong and Hanoi
    date: "November – December 1946"
    when: "1946-11-20"
    borders: "1946-12-19"
    countries: [vn, fr]
    body:
      - "The agreement of March did not last. At Dalat in April–May 1946 and at Fontainebleau in July–September the two sides could not agree on what independence meant or on Cochinchina, where the high commissioner, Admiral Thierry d’Argenlieu, proclaimed a separate Autonomous Republic of Cochinchina on 1 June 1946, while Ho Chi Minh was on his way to France. Ho signed a provisional modus vivendi on 14 September and went home, but fighting went on in the south, and in the north both sides prepared for war. As the Chinese troops left, the Viet Minh turned on the nationalist parties they had protected and drove them out of their strongholds."
      - "On 20 November 1946 a French patrol boat seized a Chinese junk carrying contraband into Haiphong, and Vietnamese militia fired on the French. Fighting spread through the town and 23 French soldiers were killed, and six more in an ambush. A ceasefire was arranged, but on d’Argenlieu’s orders General Jean-Étienne Valluy told the local commander to make himself “complete master of Haiphong”. On 23 November, after an ultimatum had expired, French warships and artillery shelled the Vietnamese quarters, and troops took the city in several days of fighting. The number killed is disputed: the sociologist Paul Mus’s estimate of about 6,000 is the most often cited; Valluy gave about 300, the American consul about 2,000, Ho Chi Minh about 3,000 and the Viet Minh later 10,000–20,000. French troops also took Lạng Sơn."
      - "In Hanoi tension grew over French demands to take charge of the city’s security. At 8 p.m. on 19 December 1946 Viet Minh militia blew up the power station and attacked French posts and homes across the city; about 100 French civilians were killed and some 600 carried off, of whom over 200 were never found. The next day Ho Chi Minh called on all Vietnamese to resist the French by every means. The government withdrew to the Việt Bắc hills north of Hanoi, while the militia and the Capital Regiment held out in the Old Quarter for two months, slipping out across the Red River under the Paul Doumer bridge on 18 February 1947. The attack in Hanoi is usually taken as the start of the war."
    facts:
      - [Haiphong bombarded, "23 November 1946, estimates from about 300 to 6,000 or more dead"]
      - [Attack in Hanoi, "19 December 1946, 8 p.m."]
      - [Capital Regiment leaves Hanoi, "18 February 1947"]
