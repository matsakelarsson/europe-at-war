  - title: Operation Léa and the Việt Bắc
    date: "1947"
    when: "1947-10-07"
    borders: "1947-10-07"
    countries: [vn, fr]
    body:
      - "In the first months of 1947 the French broke out of Hanoi and Haiphong, took the main towns of the Red River delta, lifted the siege of their garrison in Huế and held the road up to Lạng Sơn and Cao Bằng along the Chinese border. The Viet Minh avoided pitched battles. Its government and army moved into the Việt Bắc, the forested limestone hills of Thái Nguyên, Tuyên Quang and Bắc Kạn, which remained its base for the rest of the war, and in the villages of the deltas it kept its hold through committees, militia and guerrillas. Large parts of central Vietnam, from Thanh Hóa to Hà Tĩnh and from Quảng Nam to Phú Yên, stayed under Viet Minh government throughout the war."
      - "In October 1947 the French tried to end the war at a stroke. In Operation Léa, from 7 October to 8 November, 1,100 paratroopers dropped on Bắc Kạn, where the Viet Minh leaders were thought to be, while a road column of some ten battalions drove from Lạng Sơn up Route Coloniale 4 to Cao Bằng and on towards Bắc Kạn, and a river force moved up the Clear River (sông Lô) towards Tuyên Quang. The paratroopers narrowly missed Ho Chi Minh, and Giáp and the main forces slipped away through the gaps between the columns, while the river convoys were delayed and ambushed. Léa and the operation that followed it, Ceinture, killed several thousand Viet Minh soldiers (Western estimates go up to 7,200) for some 240 French dead, and reopened the road to Cao Bằng, but they left the Việt Bắc base intact. In Vietnam the campaign is remembered as the Việt Bắc victory of autumn–winter 1947."
    facts:
      - [Operation Léa, "7 October – 8 November 1947"]
      - [Paratroopers at Bắc Kạn, "7 October 1947, 1,100 men"]
      - [French dead, "242 (Léa)"]
