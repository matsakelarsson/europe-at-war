  - title: The Bảo Đại solution, China and the United States
    date: "1948 – 1950"
    when: "1949-03-08"
    borders: "1949-07-01"
    countries: [vn, fr, la, kh, cn, us]
    body:
      - "Unable to defeat the Viet Minh, France looked for a Vietnamese government that could compete with it for nationalist support. After long talks with the former emperor Bảo Đại, then living in Hong Kong, it promised Vietnam independence within the French Union in the Hạ Long Bay agreement of 5 June 1948 and the Élysée Accords of 8 March 1949. The State of Vietnam was formed with Bảo Đại as head of state on 1 July 1949, and Cochinchina was joined to it in June. Laos in July and Cambodia in November 1949 became Associated States of the French Union on similar terms. France kept control of defence, foreign affairs and much else, and the Viet Minh and many non-communist nationalists dismissed the new state as a French creation; from 1950 it built its own army, the Vietnamese National Army."
      - "In the south the war was one of ambushes, assassinations and reprisals. The French relied on the armed religious movements of the Mekong delta, the Cao Đài and the Hòa Hảo, and on the Bình Xuyên of Saigon, all of which had fallen out with the Viet Minh, and let them run their own districts. The Viet Minh kept bases in the Plain of Reeds and the U Minh forest. Both sides killed civilians they suspected of working for the other."
      - "The Communist victory in China changed the war. The People’s Liberation Army reached the Vietnamese border in December 1949; the People’s Republic of China recognised the Democratic Republic of Vietnam on 18 January 1950 and the Soviet Union on 30 January, and China began to train and equip Viet Minh divisions in Yunnan and Guangxi and sent military advisers. The United States and Britain recognised the State of Vietnam on 7 February 1950. American military aid began in May 1950 and grew quickly after the outbreak of the Korean War in June, as Washington came to see Indochina as a front in the containment of communism; by 1954 the United States was paying for nearly 80 percent of the cost of France’s war."
    facts:
      - [Élysée Accords, "8 March 1949"]
      - [State of Vietnam formed, "1 July 1949"]
      - [China recognises the Democratic Republic of Vietnam, "18 January 1950"]
      - [United States recognises the State of Vietnam, "7 February 1950"]
