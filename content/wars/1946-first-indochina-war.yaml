  - title: Geneva and partition
    date: "April 1954 – May 1955"
    when: "1954-07-21"
    borders: "1954-07-21"
    countries: [vn, la, kh, fr, cn, us, gb]
    body:
      - "The Geneva Conference, called by the four powers to discuss Korea and Indochina, opened on 26 April 1954. Its talks on Indochina began on 8 May, the day after Điện Biên Phủ fell, with France, the Democratic Republic of Vietnam, the State of Vietnam, Laos, Cambodia, Britain, the Soviet Union, China and the United States at the table. Pierre Mendès France, who became prime minister on 18 June, promised to resign if he had no settlement within a month, and under pressure from Moscow and Beijing, which wanted to avoid American intervention, the Viet Minh accepted less than its armies held. The agreements on the cessation of hostilities, dated 20 July and signed early on 21 July by the French and Viet Minh commands, divided Vietnam at a provisional military demarcation line near the 17th parallel, along the Bến Hải River, with a demilitarised zone on either side. French Union forces were to regroup to the south and Viet Minh forces to the north within 300 days, civilians could move freely between the zones, and an International Control Commission of India, Poland and Canada was to supervise. An unsigned Final Declaration called for elections throughout Vietnam in July 1956. The State of Vietnam rejected the agreements and the United States only “took note” of them. In Laos the Pathet Lao regrouped in the provinces of Phongsaly and Sam Neua; in Cambodia the Khmer Issarak were to disband."
      - "The ceasefire took effect in the north on 27 July and in the south on 11 August. A French mobile group, Groupe Mobile 100, had been destroyed at the Mang Yang Pass in the Central Highlands on 24 June, one of the last battles. French troops left Hanoi on 9 October 1954 and the People’s Army entered the city the next day; the French left Haiphong in May 1955, and the last French soldiers left Vietnam in April 1956. Some 900,000 people, most of them Catholics, moved from the north to the south, many of them on French and American ships, while about 100,000 Viet Minh fighters and their families and tens of thousands of civilians went north. The elections of 1956 were never held, and the two states that emerged, the Democratic Republic of Vietnam in the north and the State of Vietnam, from 1955 the Republic of Vietnam, in the south, went on to fight the Vietnam War."
    facts:
      - [Geneva agreements, "20–21 July 1954"]
      - [Demarcation line, "near the 17th parallel, along the Bến Hải River"]
      - [French troops leave Hanoi, "9 October 1954"]
      - [Moved from north to south, "about 900,000 people"]
    markers:
