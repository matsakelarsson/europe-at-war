  - title: The border campaign
    date: "September – October 1950"
    when: "1950-09-16"
    borders: "1950-10-18"
    countries: [vn, fr, cn]
    body:
      - "By 1950 Giáp had formed his first regular divisions, the 304th and 308th, soon followed by the 312th, armed with Chinese and captured weapons. In the Border Campaign (Chiến dịch Biên giới) he struck at the chain of French posts along Route Coloniale 4, the road that ran beside the Chinese frontier from Lạng Sơn to Cao Bằng, with the help of Chinese advisers under General Chen Geng; Ho Chi Minh followed the battle from a command post nearby. On 16 September Viet Minh troops attacked Đông Khê, halfway along the road, and took it two days later; only a handful of its Foreign Legion garrison escaped."
      - "The French command decided to evacuate Cao Bằng. Colonel Marcel Le Page’s group of Moroccan and Legion battalions advanced from Thất Khê to retake Đông Khê and meet the garrison of Cao Bằng under Colonel Pierre Charton, which left on 3 October, abandoning its heavy equipment on the way. Both columns were caught in the limestone hills around Đông Khê, and by 7 October they had been destroyed in and around the Cốc Xá gorge; paratroopers dropped to help them were also lost. The French then gave up Thất Khê and, on 17–18 October, Lạng Sơn with its large stores. They lost about 4,800 men killed or missing; the historian Bernard Fall called it France’s greatest colonial defeat since the loss of Quebec in 1759. The Viet Minh gave its own losses as 1,000 dead and 1,550 wounded. The whole frontier with China, and the supply routes from it, were now in Viet Minh hands."
    facts:
      - [Đông Khê taken, "16–18 September 1950"]
      - [Charton and Le Page columns destroyed, "3–7 October 1950"]
      - [Lạng Sơn abandoned, "17–18 October 1950"]
      - [French losses, "about 4,800 killed or missing"]
