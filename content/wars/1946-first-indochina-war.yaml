id: first-indochina-war
name: First Indochina War
start: "1946-12-19"
end: "1954-08-11"
tier: A
summary: "The war between France and the Viet Minh, the Communist-led front that had proclaimed the independence of Vietnam as the Democratic Republic of Vietnam in September 1945, fought mainly in Vietnam but also in Laos and Cambodia. After Japan’s surrender the Viet Minh took power in Hanoi in the August Revolution, while British troops helped the French back into Saigon and Chinese troops occupied the north. A compromise of March 1946 broke down, and after the French bombardment of Haiphong in November the Viet Minh attacked the French in Hanoi on 19 December 1946. The French held the cities and the Red River delta; the Viet Minh held the hills of the Việt Bắc and much of central Vietnam and waged guerrilla war everywhere else. France set up the State of Vietnam under the former emperor Bảo Đại in 1949. From 1950 China armed and advised the Viet Minh and the United States paid an ever larger share of France’s costs. Võ Nguyên Giáp’s regular divisions drove the French from the Chinese border in 1950, were beaten back from the delta in 1951, and took the north-west and pushed into Laos in 1952–1953. The fall of the French garrison at Điện Biên Phủ on 7 May 1954 led to the Geneva agreements of 21 July, which divided Vietnam at the 17th parallel. Estimates of the dead range from about 400,000 to over 800,000 soldiers and civilians."
countries: [vn, fr, la, kh, cn, gb, us]
