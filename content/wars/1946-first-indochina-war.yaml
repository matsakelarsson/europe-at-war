  - title: Hòa Bình
    date: "November 1951 – February 1952"
    when: "1951-11-14"
    borders: "1952-01-01"
    countries: [vn, fr]
    body:
      - "To force the Viet Minh into a battle on his terms and cut its links between the Việt Bắc and central Vietnam, de Lattre sent paratroopers to seize Hòa Bình, the main town of the Mường country on the Black River south-west of Hanoi, on 14 November 1951; mobile groups opened Route Coloniale 6 behind them and river flotillas came up the Black River. Giáp answered by attacking the posts on the river and the convoys on the road with three divisions, while two more slipped into the delta behind the De Lattre Line and spread the guerrilla war there. De Lattre, ill with cancer, had already gone back to France; he died in Paris on 11 January 1952 and was made a Marshal of France after his death."
      - "His successor, General Raoul Salan, judged the position too costly and withdrew from Hòa Bình under constant attack, the last troops leaving on 24–25 February 1952. The French lost about 900 killed or missing; Viet Minh losses were higher, 5,000 or more by Western estimates. The battle showed that the Viet Minh could now fight long battles against French strongpoints and supply lines, and that the delta behind the De Lattre Line was far from secure."
    facts:
      - [Hòa Bình taken, "14 November 1951"]
      - [De Lattre dies, "11 January 1952"]
      - [Hòa Bình evacuated, "24–25 February 1952"]
      - [French losses, "about 900 killed or missing"]
