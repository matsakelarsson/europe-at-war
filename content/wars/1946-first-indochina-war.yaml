  - title: Điện Biên Phủ
    date: "13 March – 7 May 1954"
    when: "1954-03-13"
    borders: "1954-05-07"
    countries: [vn, fr, la, us, cn]
    body:
      - "Navarre expected that the Viet Minh could not bring heavy artillery and enough supplies over the mountains, and that his garrison, supplied by air through two airstrips, would break any assault. Instead Giáp massed four infantry divisions and a heavy division of artillery and engineers around the valley, about 50,000 combat troops, supplied by tens of thousands of porters who carried rice and ammunition on foot and on bicycles and hauled guns, among them 105 mm howitzers from China, onto the surrounding hills, where they were dug into the slopes facing the French positions. Chinese advisers helped plan the siege. The garrison, about 10,800 men at the start under Colonel Christian de Castries, held a ring of strongpoints with women’s names: Béatrice, Gabrielle, Anne-Marie, Huguette, Dominique, Éliane, Claudine and, to the south, Isabelle."
      - "The assault began on 13 March 1954. Béatrice fell that night, Gabrielle on 15 March and Anne-Marie on 17 March, when most of its Thái soldiers left; Viet Minh guns closed the airstrip, and the French artillery commander, Colonel Charles Piroth, killed himself. From then on the garrison could only be supplied and reinforced by parachute, through heavy anti-aircraft fire. From 30 March the Viet Minh fought for the hills of Dominique and Éliane in weeks of close combat, while their trenches crept ever closer to the centre. The rains came in April, flooding the trenches and the dressing stations where thousands of wounded lay. A relief column from Laos (Operation Condor) turned back. The United States considered air strikes to save the garrison (Operation Vulture) but would not act without Britain and Congress, and decided against it."
      - "The final assault came on 7 May; the headquarters fell in the late afternoon and Isabelle surrendered in the night. Of the roughly 14,000 men who served in the garrison, between about 1,100 and 2,300 had been killed and some 11,700 were captured. They were marched hundreds of kilometres to prison camps, and only about 3,300 were returned four months later; many of the others died of wounds, disease and hunger. The Viet Minh gave its losses as 4,020 dead and 9,118 wounded, and Western estimates are higher, about 8,000 dead. In Vietnam the victory is remembered as the end of French colonial rule."
    facts:
      - [Siege, "13 March – 7 May 1954"]
      - [Garrison, "about 10,800 at the start, some 14,000 in all"]
      - [French losses, "about 1,100–2,300 killed, some 11,700 captured"]
      - [Viet Minh losses, "4,020 dead and 9,118 wounded (Vietnamese figures)"]
    markers:
      - kind: battle
        side: vm
        name: Điện Biên Phủ
        date: "13 March – 7 May 1954"
        text: "The French camp in the valley, with its strongpoints Béatrice, Gabrielle and Anne-Marie to the north and Isabelle 6 km to the south. De Castries’ headquarters fell on 7 May."
        lonlat: [103.017, 21.390]
        lp: l
      - kind: event
        side: vm
        name: Tuần Giáo
        date: "1953–1954"
        text: "The road junction where the Viet Minh supply route from the Việt Bắc turned south towards Điện Biên Phủ."
        lonlat: [103.420, 21.590]
