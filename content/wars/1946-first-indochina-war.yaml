  - title: De Lattre’s year
    date: "December 1950 – June 1951"
    when: "1951-01-13"
    borders: "1951-06-01"
    countries: [vn, fr]
    body:
      - "Panic spread in Hanoi, and the families of French officials were sent away. In December 1950 Paris sent General Jean de Lattre de Tassigny, one of France’s best-known commanders of the Second World War, as both high commissioner and commander-in-chief. He restored the army’s morale, brought in reinforcements, began building a belt of concrete blockhouses around the Red River delta, the De Lattre Line, and pressed the State of Vietnam to raise a larger army of its own."
      - "Giáp, believing the time had come for a general counter-offensive, attacked the delta three times in 1951. At Vĩnh Yên, north-west of Hanoi, from 13 to 17 January, two divisions attacked in waves and were broken by artillery, aircraft and napalm, losing an estimated 5,000–6,000 dead. At Mạo Khê, by the coal mines north of Haiphong, an attack from 23 to 28 March was beaten off with the help of naval gunfire. On the Đáy River at the southern edge of the delta, from 29 May, three divisions struck at Ninh Bình and Phủ Lý while regional forces rose behind the French lines; using river flotillas to move troops and cut supply routes, the French drove them back by 18 June. De Lattre’s only son, Lieutenant Bernard de Lattre, was killed at Ninh Bình on 30 May. Giáp went back to guerrilla war in the delta and to campaigns in the hills, where French aircraft and artillery counted for less."
    facts:
      - [De Lattre arrives, "December 1950"]
      - [Vĩnh Yên, "13–17 January 1951"]
      - [Mạo Khê, "23–28 March 1951"]
      - [Đáy River, "29 May – 18 June 1951"]
