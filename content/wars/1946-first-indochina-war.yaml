  - title: The north-west and Laos
    date: "October 1952 – December 1953"
    when: "1952-10-14"
    borders: "1953-04-30"
    countries: [vn, la, kh, fr]
    body:
      - "In October 1952 Giáp turned to the highlands of the north-west, between the Red and Black rivers, held by small French posts and by the Thái federation allied to France. Three divisions took Nghĩa Lộ on 17–18 October and swept the posts away, and the French pulled back to an airhead at Nà Sản, south-east of Sơn La. To draw Giáp back, Salan launched Operation Lorraine, the largest French operation of the war so far, up the Clear River towards the Viet Minh depots at Phú Đoan and Phú Yên Bình, but it achieved little and was ambushed on its way back. At Nà Sản about 15,000 men in some 30 hilltop strongpoints, supplied by air and covered by artillery and aircraft, beat off Viet Minh assaults from 23 November to 2 December. The French saw in this “hedgehog” a way to make the Viet Minh attack on unfavourable ground; they evacuated Nà Sản by air in August 1953."
      - "In April 1953 three Viet Minh divisions with Pathet Lao forces under Prince Souphanouvong invaded Laos. The French garrison of Sam Neua was destroyed as it retreated, the Viet Minh came close to the royal capital Luang Prabang, which the French and King Sisavang Vong refused to leave, and the French held an airhead on the Plain of Jars. With the rains coming the Viet Minh withdrew in May, leaving the Pathet Lao and its “resistance government” in control of Sam Neua (Houaphanh) and much of Phongsaly. France granted Laos full sovereignty within the French Union on 22 October 1953, and Cambodia, after King Norodom Sihanouk’s “royal crusade for independence”, became independent on 9 November."
      - "In May 1953 General Henri Navarre took command, with a plan to build up the Vietnamese National Army and the French mobile reserves and to win a decisive battle by 1955. To protect Laos and to lure Giáp into battle, he sent paratroopers on 20 November 1953 to reoccupy Điện Biên Phủ, a valley on the route into northern Laos that the Viet Minh had taken a year before (Operation Castor). In December the French evacuated Lai Châu, the seat of the Thái federation, and Viet Minh troops pushed into central Laos and reached the Mekong at Thakhek."
    facts:
      - [Nghĩa Lộ taken, "17–18 October 1952"]
      - [Nà Sản, "23 November – 2 December 1952"]
      - [Invasion of Laos, "April – May 1953"]
      - [Cambodian independence, "9 November 1953"]
      - [Operation Castor, "20 November 1953"]
