steps:
  - title: The August Revolution
    date: "March – 2 September 1945"
    when: "1945-08-19"
    borders: "1945-09-02"
    countries: [vn]
    body:
      - "Japan had stationed troops in French Indochina since 1940–1941 while leaving the French administration in place, and on 9 March 1945 it overthrew the French and let Emperor Bảo Đại declare Vietnam independent under a government led by Trần Trọng Kim (both are told in the Japanese invasion of French Indochina). Four years earlier, in May 1941, the Indochinese Communist Party under Ho Chi Minh, back in Vietnam after thirty years abroad, had founded the League for the Independence of Vietnam (Việt Nam Độc lập Đồng minh Hội), the Viet Minh, at Pác Bó near the Chinese border, as a broad national front against both the French and the Japanese. In 1944–1945 a famine in the north, caused by the war, Japanese and French requisitions of rice, the breakdown of transport and floods, killed between about 400,000 people and 2 million, the figure given in Vietnam; the Viet Minh won support by seizing rice stores and handing out grain. By June 1945 its guerrillas, led by Võ Nguyên Giáp and helped from July by a small American OSS team, the “Deer Team”, held what it called a “liberated zone” of six provinces in the hills of the north."
      - "When Japan surrendered on 15 August, a party conference and a national congress at Tân Trào launched a general uprising. Viet Minh supporters took over Hanoi on 19 August without resistance from the Japanese, Huế on 23 August and Saigon on 25 August, where they shared power uneasily with other groups. Bảo Đại abdicated and on 30 August handed over the seal and sword of the Nguyễn emperors in Huế. On 2 September 1945, before a great crowd in Ba Đình Square in Hanoi, Ho Chi Minh read the declaration of independence of the Democratic Republic of Vietnam, which opened with words from the American Declaration of Independence. In the following weeks the Viet Minh also killed or imprisoned rivals, among them the Trotskyist leader Tạ Thu Thâu and the conservative scholar and former minister Phạm Quỳnh."
    facts:
      - [Viet Minh founded, "May 1941, at Pác Bó"]
      - [Hanoi taken over, "19 August 1945"]
      - [Bảo Đại abdicates, "25–30 August 1945"]
      - [Declaration of independence, "2 September 1945"]
