  - title: The return of the French
    date: "September 1945 – March 1946"
    when: "1945-09-13"
    borders: "1946-03-06"
    countries: [vn, fr, gb, cn, la, kh]
    body:
      - "At Potsdam the Allies had divided Indochina at the 16th parallel for the Japanese surrender: Chinese Nationalist troops were to take it in the north, British troops in the south. Major General Douglas Gracey arrived in Saigon on 13 September 1945 with the 20th Indian Division, declared martial law and rearmed French soldiers who had been interned by the Japanese. On 23 September they seized the public buildings of Saigon and ousted the Viet Minh committee. The Vietnamese answered with a general strike and attacks; on 24–25 September a crowd in the Cité Hérault quarter killed about 150 French and Eurasian civilians and carried off as many more, and on 26 September the American OSS officer Peter Dewey was shot, the first American to die in Vietnam. Short of men, Gracey also used Japanese troops against the Viet Minh. The French expeditionary corps under General Philippe Leclerc arrived from October and retook the towns of the south by early 1946, while the Viet Minh in the south, under Nguyễn Bình, turned to guerrilla war. The British, who lost about 40 dead, handed over to the French and left by the end of March 1946."
      - "In the north some 150,000–200,000 Chinese troops under the Yunnan general Lu Han occupied the country down to the 16th parallel from September 1945. They lived off the land and backed the nationalist parties opposed to the Viet Minh, the VNQDĐ and the Đồng Minh Hội, but left Ho Chi Minh’s government in place. Ho took the nationalists into a coalition, held elections to a National Assembly on 6 January 1946, and formally dissolved the Communist Party in November 1945, though it went on working in secret. In Laos the Lao Issara (Free Lao) government of Prince Phetsarath declared independence on 12 October 1945; the French retook Thakhek in March 1946, Vientiane in April and Luang Prabang in May, and the Lao Issara went into exile in Thailand. In Cambodia the British arrested the nationalist prime minister Son Ngoc Thanh in October 1945, King Norodom Sihanouk accepted the return of the French, and Khmer Issarak (Free Khmer) bands took to the countryside."
      - "By the Chongqing agreement of 28 February 1946 China agreed to withdraw its troops in return for France giving up its concessions and special rights in China. On 6 March 1946 Ho Chi Minh and the French envoy Jean Sainteny signed an agreement by which France recognised the Democratic Republic of Vietnam as a “free state” with its own government, parliament, army and finances within the Indochinese Federation and the French Union, and promised a referendum on uniting Cochinchina with the rest of Vietnam; in return 15,000 French troops could enter the north to replace the Chinese. That morning Chinese guns at Haiphong fired on the ships bringing Leclerc’s troops, and the two sides exchanged fire for hours before the landing went ahead. French troops entered Hanoi on 18 March."
    facts:
      - [British in Saigon, "13 September 1945"]
      - [French take over Saigon, "23 September 1945"]
      - [Chongqing agreement, "28 February 1946"]
      - [Ho–Sainteny agreement, "6 March 1946"]
      - [French troops enter Hanoi, "18 March 1946"]
