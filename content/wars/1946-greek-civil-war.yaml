  - title: Grammos and Vitsi
    date: June 1948 – August 1949
    when: "1948-06-16"
    borders: "1949-08-30"
    countries: [gr, al, mk]
    body:
      - In June 1948 the government army opened Operation Koronis against Grammos, with aircraft and heavy artillery. After two months of fighting the Democratic Army slipped away through Albania to Vitsi and in the autumn beat off attacks there. The split between Tito and Stalin that summer divided the communist camp. The KKE sided with Moscow, its leader Nikos Zachariadis removed Markos Vafiadis and committed the Democratic Army to holding ground in pitched battles. In January 1949 Marshal Alexandros Papagos took command of the government army, which first cleared the Peloponnese and central Greece.
      - In July 1949 Yugoslavia closed its border to the Democratic Army. In August the government army, now far larger and supported by American-supplied aircraft dropping bombs and napalm, launched Operation Pyrsos (“Torch”). It took Vitsi between 10 and 16 August and then Grammos between 24 and 30 August. The surviving guerrillas, several thousand men and women, crossed into Albania, whose government threatened to cut off their supplies if they went back into Greece.
    facts:
      - [Operation Koronis, "June – August 1948"]
      - [Commander-in-chief, "Alexandros Papagos from January 1949"]
      - [Operation Pyrsos, "Vitsi 10–16 August, Grammos 24–30 August 1949"]
    markers:
      - kind: battle
        side: gov
        name: Grammos
        date: summer 1948 and 24–30 August 1949
        text: Taken by the government army in 1948 after the Democratic Army withdrew, reoccupied by the guerrillas, and stormed in the last battle of the war.
        lonlat: [20.87, 40.37]
        lp: l
      - kind: battle
        side: gov
        name: Vitsi
        date: 10–16 August 1949
        text: The main attack of Operation Pyrsos broke the Democratic Army’s defences in a week.
        lonlat: [21.27, 40.66]
      - kind: taken
        side: gov
        name: Peloponnese
        date: December 1948 – March 1949
        text: Operation Peristera destroyed the Democratic Army’s units in the south, cut off from the northern bases.
        lonlat: [22.1, 37.5]
