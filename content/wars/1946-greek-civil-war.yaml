  - title: The Democratic Army and the mountain fronts
    date: 1948 – early 1949
    when: "1948-03-01"
    borders: "1949-02-12"
    countries: [gr, al, mk, bg]
    body:
      - At its height in 1948 the Democratic Army had more than 20,000 fighters, many of them women and some conscripted in the villages it held. It controlled the mountains from Grammos and Vitsi on the northern border down the Pindus to Agrafa, with bands on Olympus, in Central Greece and the Peloponnese. It raided towns, mined roads and executed people it saw as informers. The government army, enlarged and re-equipped by the United States, cleared villagers from the mountains to cut the guerrillas off from food and recruits, and by 1949 about 700,000 people had been uprooted inside Greece.
      - From March 1948 the Democratic Army took about 25,000 children from the areas it held to Yugoslavia, Albania, Bulgaria and other communist countries. The KKE called it a rescue from the war; the government and most Greeks called it the paidomazoma, a seizure of children. The government in turn placed thousands of children in homes run under Queen Frederica. Tens of thousands of leftists and suspects were sent to island camps such as Makronisos, and courts martial passed thousands of death sentences. In January and February 1949 the Democratic Army raided Naousa and Karpenisi but failed to take Florina.
    facts:
      - [Democratic Army strength, "over 20,000 fighters at its height, 1948"]
      - [Children taken abroad, "about 25,000"]
      - [People displaced inside Greece, "about 700,000 by 1949"]
    markers:
      - kind: held
        side: dse
        name: Grammos
        date: 1947–1949
        text: The Democratic Army’s main stronghold, a fortified mountain massif on the Albanian border.
        lonlat: [20.87, 40.37]
        lp: l
      - kind: held
        side: dse
        name: Vitsi
        date: 1947–1949
        text: The second stronghold, near Kastoria and Florina, with supply routes to Yugoslavia and Albania.
        lonlat: [21.27, 40.66]
      - kind: held
        side: dse
        name: Agrafa
        date: 1947–1949
        text: Bands in the southern Pindus kept the war alive in central Greece until 1949.
        lonlat: [21.65, 39.15]
