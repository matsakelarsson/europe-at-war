  - title: The end and its legacy
    date: October 1949 and after
    when: "1949-10-16"
    borders: "1949-10-16"
    countries: [gr, al, mk]
    body:
      - On 16 October 1949 the KKE’s radio station announced a “ceasefire”, presenting it as a pause rather than a defeat, and the war was over. Most estimates put the dead of 1946–1949 at around 50,000 soldiers, guerrillas and civilians, and some much higher. Thousands of fighters and party members, with their families and the children taken in 1948, went into exile in the Soviet Union and Eastern Europe, many of them for decades. Those captured in Greece faced courts martial and island camps; some, such as the communist Nikos Beloyannis in 1952, were executed.
      - The victory kept Greece in the Western camp, and it joined NATO in 1952, but it also left a deeply divided country. For a quarter of a century the left was shut out of public life by certificates of political reliability, internal exile and the ban on the KKE, which the military dictatorship of 1967–1974 tightened. The KKE was legalised after the junta fell in 1974. In 1982 political refugees “Greek by birth” were allowed back, a rule that excluded many Slavic Macedonians, and in 1989 parliament recognised the war officially as a civil war.
    facts:
      - [KKE ceasefire, "16 October 1949"]
      - [Dead, "around 50,000 in most estimates"]
      - [KKE legalised, "1974"]
    markers:
      - kind: event
        side: dse
        name: Into Albania
        date: August – October 1949
        text: The remains of the Democratic Army crossed the border here and were later moved on to the Soviet Union and Eastern Europe.
        lonlat: [20.62, 40.48]
        lp: l
      - kind: event
        name: Athens
        date: 1952
        text: Nikos Beloyannis, a communist leader who had returned to Greece, was executed after a trial that drew protests across Europe.
        lonlat: [23.727, 37.984]
