id: greek-civil-war
name: Greek Civil War
start: "1946-03-30"
end: "1949-10-16"
tier: A
summary: A war between the Greek government, backed first by Britain and then by the United States, and the Democratic Army of Greece led by the Communist Party (KKE), with bases in Yugoslavia, Albania and Bulgaria. Rooted in the wartime split of the resistance and the December 1944 fighting in Athens, it was fought mainly in the northern mountains and ended with the government victories at Grammos and Vitsi in August 1949, after tens of thousands of deaths and the uprooting of some 700,000 people.
countries: [gr, al, mk, bg]
sides:
  - id: gov
    name: Greek government (with British and American support)
    polities: [greece]
    ink: navy
    moves: Government moves
    success: Government success
  - id: dse
    name: Democratic Army of Greece (KKE)
    ink: red
    moves: Democratic Army moves
    success: Democratic Army success
notes:
  - Greek governments called the conflict the “bandit war” (Symmoritopolemos) until 1989, when a law recognised it as a civil war. The Democratic Army is often called by its Greek initials, DSE.
  - Many Slavic-speaking Macedonians of northern Greece fought in the Democratic Army, some in the National Liberation Front (NOF), and thousands of them left Greece for good after 1949; the place of this community in the war is still disputed between Greece and North Macedonia.
  - Figures for fighters, deaths, children and refugees vary widely between sources and between the two sides’ accounts; the numbers here are approximate.
