steps:
  - title: The December fighting and Varkiza
    date: December 1944 – 1946
    when: "1944-12-03"
    borders: "1945-02-12"
    countries: [gr, gb]
    body:
      - When the Germans left Greece in October 1944, the left-wing National Liberation Front (EAM) and its army, ELAS, controlled most of the countryside. The government of national unity under Georgios Papandreou came back from exile with British troops under General Ronald Scobie. A dispute over disarming the resistance armies led EAM’s ministers to resign, and on 3 December police fired on an EAM demonstration in Syntagma Square in Athens, killing more than 28 people. Weeks of fighting followed in Athens and Piraeus between ELAS on one side and government forces and British troops, reinforced and backed by aircraft, on the other. Both sides killed prisoners and hostages.
      - ELAS agreed to a truce in January 1945, and by the Varkiza Agreement of 12 February it handed in its weapons in return for an amnesty for political offences and the promise of a plebiscite and elections. The amnesty was hardly kept. In what the left called the White Terror, gendarmes and right-wing bands such as Grivas’s Organisation X killed, beat and imprisoned thousands of leftists, while some former ELAS fighters hid their weapons or fled to Yugoslavia. The KKE boycotted the elections of March 1946, and a plebiscite in September brought back King George II.
    facts:
      - [Syntagma Square shootings, "3 December 1944"]
      - [Fighting in Athens, "3 December 1944 – 11 January 1945"]
      - [Varkiza Agreement, "12 February 1945"]
    markers:
      - kind: event
        name: Syntagma Square
        date: 3 December 1944
        text: Police opened fire on a banned EAM rally below the parliament building, the start of the December events (Dekemvriana).
        lonlat: [23.735, 37.976]
        lp: l
      - kind: battle
        side: gov
        name: Athens and Piraeus
        date: December 1944 – January 1945
        text: British paratroopers and tanks, with RAF aircraft, fought ELAS block by block until it withdrew from the capital.
        lonlat: [23.66, 37.95]
        lp: b
      - kind: treaty
        name: Varkiza
        date: 12 February 1945
        text: The government and the KKE signed the agreement at this seaside village; ELAS disbanded and handed over its weapons.
        lonlat: [23.806, 37.817]
    side_names:
      gov: Greek government and British forces
      dse: EAM-ELAS
  - title: The war begins
    date: March 1946 – January 1948
    when: "1946-03-30"
    borders: "1947-12-24"
    countries: [gr, al, mk, bg]
    body:
      - On the night before the elections of 31 March 1946, about 30 former ELAS fighters attacked the police station at Litochoro, below Mount Olympus, the event usually taken as the start of the civil war. Armed bands, many formed by men escaping persecution, regrouped in the northern mountains with bases and supplies across the border in Yugoslavia, Albania and Bulgaria. In October 1946 the KKE set up a general headquarters under Markos Vafiadis, renamed the Democratic Army of Greece in December. By the end of the year it had about 16,000 fighters.
      - Britain, short of money, told Washington in February 1947 that it could no longer support Greece. On 12 March President Harry Truman asked Congress for aid to Greece and Turkey, and American money, weapons and military advisers took Britain’s place. On 24 December 1947 the KKE announced a Provisional Democratic Government in the mountains, and the government in Athens outlawed the party. The next day the Democratic Army attacked Konitsa, near the Albanian border, hoping to make it a capital, but was beaten off with heavy losses by early January.
    facts:
      - [Attack on Litochoro, "30–31 March 1946"]
      - [Truman Doctrine, "12 March 1947"]
      - [Battle of Konitsa, "25 December 1947 – January 1948, government victory"]
    markers:
      - kind: event
        side: dse
        name: Litochoro
        date: 30–31 March 1946
        text: Former ELAS fighters overran the police post in the village and killed policemen there, on the eve of elections the left was boycotting.
        lonlat: [22.503, 40.103]
      - kind: battle
        side: gov
        name: Battle of Konitsa
        date: 25 December 1947 – January 1948
        text: The Democratic Army’s attempt to take a town for its Provisional Democratic Government failed after two weeks in the snow.
        lonlat: [20.749, 40.046]
      - kind: event
        side: dse
        name: Yugoslav border
        date: 1946–1949
        text: Fighters and supplies crossed from camps and hospitals in Yugoslavia, Albania and Bulgaria, out of reach of the Greek army.
        lonlat: [21.4, 40.98]
        lp: l
