id: hukbalahap-rebellion
name: Hukbalahap rebellion
start: "1946"
end: "1954-05-17"
tier: B
summary: "A communist-led peasant rebellion in Central Luzon against the government of the newly independent Philippines. The Hukbalahap (Hukbo ng Bayan Laban sa Hapon, the People’s Army against the Japanese) had been founded in 1942 by the Communist Party of the Philippines (PKP) and the peasant unions of the rice plains around Mount Arayat, where tenant farmers had long struggled with the landlords of the great estates, and it fought the Japanese occupation. After the war it was denied recognition, its elected congressmen, among them its commander Luis Taruc, were unseated in 1946, and the landlords’ private armies and the military police turned on its followers. From mid-1946 the Huks took up arms again, and by 1950, as the People’s Liberation Army (HMB), they had some 11,000–13,000 fighters and raided towns close to Manila. Mass arrests of the party leadership in Manila in October 1950, a reformed army, American aid and the policies of Defence Secretary and later President Ramon Magsaysay, who combined military pressure with offers of land, amnesty and resettlement, broke the movement. Taruc surrendered on 17 May 1954. Army figures give about 9,700 Huks and 1,600 soldiers killed."
countries: [ph, us]
