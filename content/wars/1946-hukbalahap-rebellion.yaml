  - title: Magsaysay and the end of the rebellion
    date: 1950–1954
    when: "1951"
    borders: "1954-05-17"
    countries: [ph, us]
    body:
      - "Magsaysay purged corrupt and abusive officers, raised soldiers’ pay, and reorganised the army into mobile battalion combat teams that pursued the Huks into the mountains and swamps; he toured the countryside himself and put a price on the heads of Huk leaders. His slogan was “all-out force and all-out friendship”: Huks who surrendered were offered amnesty, and from 1951 the army’s Economic Development Corps (EDCOR) resettled some of them with their families on farms in Mindanao, at Kapatagan in Lanao and Buldon in Cotabato. Army lawyers took up tenants’ cases in court, and soldiers guarded the polls in the clean elections of 1951. The American officer Edward Lansdale, of the CIA and the US military advisory group, advised Magsaysay and ran psychological warfare against the Huks."
      - "Cut off from its leaders and from its villages, which were tired of war, the movement shrank. Magsaysay was elected president in November 1953. Taruc, who had broken with the party leadership, negotiated with Magsaysay’s emissary, the young journalist Benigno Aquino Jr., and surrendered on 17 May 1954; he was sentenced to prison and pardoned in 1968. The last party leaders held out in small bands for another decade. But land reform remained limited, and the grievances of the tenant farmers did not go away; in 1969 a new communist party founded the New People’s Army (see the New People’s Army rebellion)."
    facts:
      - [EDCOR farms opened, "from 1951"]
      - [Magsaysay elected president, "10 November 1953"]
      - [Taruc surrenders, "17 May 1954"]
      - [Dead (army figures), "about 9,700 Huks and 1,600 soldiers"]
