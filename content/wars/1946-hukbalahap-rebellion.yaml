  - title: The height of the rebellion
    date: 1949–1950
    when: "1949-04-28"
    borders: "1950-08-26"
    countries: [ph]
    body:
      - "On 28 April 1949 Huk fighters ambushed a convoy on the road near Bongabon in Nueva Ecija and killed Aurora Quezon, the widow of President Manuel Quezon, her daughter, the mayor of Quezon City and others; the killings turned much of the public against the movement, and Huk leaders later denied having ordered them. The elections of November 1949, in which Quirino was returned amid fraud and violence, drove many more into the movement. In January 1950 the party’s leaders judged that a revolutionary situation had come and set out to take power within two years; the army was renamed the People’s Liberation Army (HMB) and grew to an estimated 11,000–13,000 armed fighters with a much larger mass base, spreading from Central Luzon into southern Luzon and Panay."
      - "On 29 March 1950, the anniversary of the movement’s founding, Huk units raided towns across Central Luzon, and on 26 August 1950 they attacked Camp Makabulos, an army base and hospital in Tarlac, killing soldiers and patients, and raided Santa Cruz in Laguna. Manila itself seemed under threat. The government’s forces, the army and the Philippine Constabulary, were poorly paid and led, and their abuses of villagers drove many to the Huks. In September 1950 Quirino appointed the congressman and former guerrilla Ramon Magsaysay secretary of national defence, and the United States, now at war in Korea, increased its military aid. On 18 October 1950, acting on a tip from an informer, police and soldiers raided houses in Manila and arrested José Lava and most of the party’s secretariat, with its documents."
    facts:
