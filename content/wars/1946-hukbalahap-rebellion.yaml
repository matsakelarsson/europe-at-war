steps:
  - title: From resistance to rebellion
    date: 1942–1948
    when: "1946-08-24"
    borders: "1946-08-24"
    countries: [ph, us]
    body:
      - "The Hukbalahap was founded on 29 March 1942 by some 300 peasant leaders and communists in the forests of Central Luzon, with Luis Taruc as commander and Casto Alejandrino as his deputy. Rooted in the tenant farmers’ unions of Pampanga, Nueva Ecija, Tarlac and Bulacan, it grew into a guerrilla force of several thousand fighters that attacked the Japanese and their Filipino collaborators, set up its own local governments in the villages and drove away or killed many landlords. Its relations with the American-led USAFFE guerrillas were hostile. When American troops returned in 1945, US Army counter-intelligence arrested Taruc and Alejandrino and disarmed Huk units, and in February 1945 at Malolos a USAFFE guerrilla unit shot 109 men of a Huk squadron. The Huks were refused the recognition and back pay given to other guerrillas."
      - "In the elections of April 1946 the Democratic Alliance, backed by the peasant unions, won six seats in Congress in Central Luzon, Taruc’s among them. The new majority of President Manuel Roxas refused to seat them, on charges of fraud and terrorism, which also gave it the votes it needed to pass the parity amendment granting Americans equal rights to Philippine resources under the Bell Trade Act. Meanwhile the military police and the landlords’ civilian guards raided villages and killed peasant leaders. On 24 August 1946 the peasant leader Juan Feleo, travelling under government safe-conduct to help negotiate a truce, was seized by armed men near Gapan and killed. Taruc went back to the hills, and the war began again. Roxas answered with a “mailed fist” policy and outlawed the Huks in 1948; his successor, Elpidio Quirino, offered an amnesty in June 1948, and Taruc came to Manila and took his seat in Congress, but the talks broke down over the surrender of weapons, and by the end of August he was back in the field."
    facts:
      - [Hukbalahap founded, "29 March 1942"]
      - [Malolos killings, "February 1945, 109 Huks shot"]
      - [Juan Feleo killed, "24 August 1946"]
      - [Quirino’s amnesty, "21 June 1948"]
