notes:
  - "The movement’s names changed: the wartime Hukbalahap took the name Hukbong Mapagpalaya ng Bayan (HMB), the People’s Liberation Army, in 1950, but it continued to be called the Huks. The government and the American press called its fighters dissidents, bandits or communists; the Huks called themselves a peasant army fighting for land reform and against the landlords’ violence. Historians such as Benedict Kerkvliet stress the agrarian roots of the rebellion, others the leadership of the communist party."
  - Casualty figures are those of the Philippine army and are uncertain. Civilians were killed by both sides, by the Huks, by the army and the police and by the landlords’ civilian guards; no total is known.
