id: telangana-rebellion
name: Telangana rebellion
start: "1946-07-04"
end: "1951-10"
tier: C
summary: "A communist-led peasant insurrection in the Telangana region of the princely state of Hyderabad, also called the Telangana armed struggle. It grew out of the movements of the Andhra Mahasabha against the great landlords (deshmukhs and jagirdars), forced labour (vetti), illegal levies and debt bondage. On 4 July 1946 a landlord’s men shot dead a village activist, Doddi Komarayya, at Kadavendi in Warangal district, and the movement turned into an armed rising led by the Communist Party of India. Peasant squads (dalams) fought the landlords, the Nizam’s police and the Razakar militia, set up village communes and redistributed land; by 1948 they held some 3,000 to 4,000 villages in Nalgonda, Warangal and Khammam. After India took over Hyderabad in September 1948 the Indian army turned against the communists, and thousands were killed or detained. The party called off the struggle in October 1951."
