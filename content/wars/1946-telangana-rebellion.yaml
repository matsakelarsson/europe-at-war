notes:
  - The communist leader Puchalapalli Sundarayya later wrote that about 4,000 communists and peasant fighters were killed and more than 10,000 held in detention camps, and that about a million acres of land were redistributed; these are the movement’s own figures. The rising led to land reform laws in Hyderabad and later Andhra Pradesh.
  - Among those remembered from the movement is Chakali Ilamma, a washerwoman whose defence of her land against a deshmukh in the mid-1940s became a rallying cause.
