id: 228-incident
name: February 28 incident
start: "1947-02-27"
end: "1947-05"
tier: C
summary: "An uprising in Taiwan against the Nationalist administration and its violent suppression. Japan had handed Taiwan to the Republic of China in October 1945, and the government of Chen Yi, staffed mostly by officials from the mainland, was resented for corruption, state monopolies, inflation and discrimination against Taiwanese. On 27 February 1947 agents of the Tobacco Monopoly in Taipei beat a widow, Lin Jiang-mai, while seizing her cigarettes, and one of them fired into the crowd, killing a bystander. The next day soldiers fired on protesters outside the governor’s office, and the unrest spread across the island. Taiwanese took over local offices, police stations and a radio station in Taipei, some mainlanders were beaten or killed by crowds, and settlement committees presented 32 demands for reform and self-government. Armed groups fought government troops at Chiayi and Kaohsiung, and in Taichung the Twenty-Seven Brigade, formed by the communist Xie Xuehong, took up arms. Chen Yi negotiated while asking Nanjing for troops. On 6 March the Kaohsiung garrison under Peng Meng-chi arrested and executed a peace delegation led by the city’s mayor and attacked the city, and on 8 March the 21st Division began landing at Keelung. In the following weeks troops killed protesters, students, lawyers, doctors and local leaders across the island; the last armed group was dispersed near Puli on 16 March. The number of dead is unknown: a government commission in 1992 estimated 18,000 to 28,000, the figure adopted officially in 2007, while other estimates are around 10,000 or lower. The incident was followed by martial law (1949–1987) and the White Terror, when it could not be discussed in public. President Lee Teng-hui apologised in 1995, and 28 February is now Peace Memorial Day."
