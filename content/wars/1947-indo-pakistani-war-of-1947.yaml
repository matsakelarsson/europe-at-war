  - title: Gilgit and the north
    date: November 1947 – August 1948
    when: "1947-11-01"
    borders: "1948-08-14"
    countries: [in, pk]
    body:
      - The state’s far north, the Gilgit Agency, had been leased to the British and handed back to the Maharaja only on 1 August 1947. On the night of 31 October 1947, after the news of the accession to India, the local Gilgit Scouts under their British commander, Major William Brown, arrested the Maharaja’s governor, and on 1 November local leaders declared for Pakistan. A Pakistani political agent took over in mid-November.
      - In 1948 forces from Gilgit, the Scouts and local volunteers, pushed up the Indus into Baltistan. They besieged the state garrison at Skardu from February; it surrendered on 14 August 1948, and many of its soldiers and the Sikh and Hindu civilians with it were killed. In May they took Kargil, Dras and the Zoji La pass, cutting the road to Ladakh, and came within reach of Leh. India held Leh by flying troops in; on 24 May Air Commodore Mehar Singh landed a Dakota on an improvised airstrip at 3,500 metres.
    facts:
      - [Gilgit Scouts seize Gilgit, "31 October – 1 November 1947"]
      - [Siege of Skardu, "February – 14 August 1948"]
      - [First landing at Leh, "24 May 1948"]
