  - title: The tribal invasion and the accession
    date: October – November 1947
    when: "1947-10-22"
    borders: "1947-10-27"
    countries: [in, pk]
    body:
      - On 22 October 1947 several thousand Pashtun tribesmen, Mahsuds, Afridis and others from the North-West Frontier, crossed into the state at Muzaffarabad in lorries, with the help of Pakistani officials and officers. Muslim soldiers of the state forces there joined them. They took Domel and Uri and on 26 October reached Baramulla, which they plundered for days, killing many inhabitants, among them nuns and patients at a Catholic mission. The delay probably cost them Srinagar, 55 km away.
      - On 24 October the Maharaja appealed to India for help. India required him to accede first. He signed the Instrument of Accession, dated 26 October, and the Governor-General, Lord Mountbatten, accepted it on 27 October with the proviso that the people would be consulted once order was restored. Sheikh Abdullah was made head of an emergency administration. On the morning of 27 October Indian troops of the 1st Sikh Regiment landed at Srinagar airfield, and an airlift began.
      - The Indian battalions held the approaches to Srinagar, and on 7 November an Indian force with armoured cars routed the main tribal lashkar at Shalateng on the city’s edge. Baramulla was retaken on 8 November and Uri on 14 November. The Kashmir valley stayed in Indian hands, but west of Uri the front settled in the mountains above the Jhelum.
    facts:
