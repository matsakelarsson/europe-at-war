  - title: The regular armies
    date: May – November 1948
    when: "1948-05-15"
    borders: "1948-11-24"
    countries: [in, pk]
    body:
      - India’s spring offensive took Tithwal in the Kishanganga valley in May 1948 and threatened Muzaffarabad. Pakistan’s commander-in-chief, General Douglas Gracey, had warned that an Indian advance to the Pakistani border would endanger the country, and in May Pakistani regular brigades moved into Azad Kashmir and stopped it. In July Pakistan’s foreign minister admitted to the UN commission that its army was in Kashmir. On 13 August the UN Commission for India and Pakistan proposed a ceasefire, a truce and then a plebiscite.
      - In the autumn India cleared the north. Troops took Gurais in June, and in Operation Bison on 1 November light tanks of the 7th Cavalry, dismantled and brought up the mountain road, broke through the Zoji La at 3,500 metres. Dras and then Kargil fell by 24 November, reopening the road to Leh. In the south a relief force reached Poonch on 20 November, ending its year-long siege.
    facts:
