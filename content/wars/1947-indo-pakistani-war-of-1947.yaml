  - title: The ceasefire line
    date: January – July 1949
    when: "1949-01-01"
    borders: "1949-01-01"
    countries: [in, pk]
    body:
      - Both governments accepted the UN commission’s proposals, and the ceasefire came into force one minute before midnight on 31 December 1948. The Karachi Agreement of 27 July 1949 fixed a ceasefire line along the positions held, ending in the glaciers north of Kargil, and a UN Military Observer Group in India and Pakistan (UNMOGIP) was set up to watch it. India held the Kashmir valley, Jammu and Ladakh, about two-thirds of the state. Pakistan held Azad Kashmir and the Gilgit and Baltistan areas, about a third.
      - Indian figures give about 1,100 Indian soldiers killed and 3,150 wounded, and estimate Pakistani and allied losses at about 6,000 killed and 14,000 wounded. Hundreds of thousands of people had been driven from their homes on both sides of the new line.
      - The plebiscite was never held. Pakistan said the Indian army was never reduced as agreed; India said Pakistan never withdrew its forces as the resolutions required first. With small changes after 1965 and 1971 the ceasefire line remains the de facto border, renamed the Line of Control by the Simla Agreement of 1972.
    facts:
      - [Ceasefire, "23:59, 31 December 1948"]
      - [Karachi Agreement, "27 July 1949"]
      - [Indian losses (Indian figures), "about 1,100 killed and 3,150 wounded"]
