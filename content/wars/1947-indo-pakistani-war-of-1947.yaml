  - title: The winter war in Jammu
    date: November 1947 – April 1948
    when: "1947-11-25"
    borders: "1948-04-12"
    countries: [in, pk]
    body:
      - In the Jammu hills the Azad Kashmir forces and tribesmen took Mirpur on 25 November 1947, where thousands of Hindu and Sikh refugees were killed or abducted, and besieged Poonch, whose garrison and some 40,000 refugees were supplied by air for a year. Kotli was relieved and then abandoned. On 24 December Indian troops lost Jhangar, a road junction north of Naushera.
      - On 1 January 1948 India took the dispute to the UN Security Council, accusing Pakistan of aggression; Pakistan answered that the accession was a fraud and accused India of genocide against Muslims. On 21 April the Council passed Resolution 47, calling for the withdrawal of the tribesmen and Pakistani nationals, a reduction of Indian forces and a plebiscite under the UN. Neither side accepted its terms in full.
      - Meanwhile the fighting went on. Brigadier Mohammad Usman’s brigade beat off a large attack on Naushera on 6 February 1948, retook Jhangar on 18 March and took Rajouri on 12 April, where Indian troops found the bodies of many of its Hindu and Sikh inhabitants. Usman was killed by a shell at Jhangar in July.
