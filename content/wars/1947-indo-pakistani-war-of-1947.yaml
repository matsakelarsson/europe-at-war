id: indo-pakistani-war-of-1947
name: Indo-Pakistani War of 1947–1948
start: "1947-10-22"
end: "1949-01-01"
tier: A
summary: "The first war between India and Pakistan, also called the First Kashmir War, fought over the princely state of Jammu and Kashmir after the partition of British India. A revolt in Poonch, communal massacres in Jammu and an invasion by Pashtun tribal forces from Pakistan in October 1947 led the Maharaja, Hari Singh, to accede to India, which flew troops into Srinagar. Pakistan disputed the accession, its officers directed the irregular forces and from May 1948 its regular army fought in Kashmir. In the north the Gilgit Scouts rose and joined Pakistan. A UN-arranged ceasefire on 1 January 1949 left India holding about two-thirds of the state, including the Kashmir valley, Jammu and Ladakh, and Pakistan about one-third, Azad Kashmir and Gilgit-Baltistan. The plebiscite both sides accepted in principle was never held, and the ceasefire line, now the Line of Control, still divides Kashmir."
countries: [in, pk]
sides:
  - id: in
    name: India and the forces of the Maharaja
    polities: [india, jammu-kashmir]
    ink: orange
    moves: Indian moves
    success: Indian success
  - id: pk
    name: Pakistan, the Azad Kashmir forces and the tribal lashkars
    polities: [pakistan, pashtun-tribes]
    ink: green
    moves: Pakistani and allied moves
    success: Pakistani and allied success
notes:
  - "The status of Kashmir is disputed. India holds that the Maharaja’s accession of 26 October 1947 was legal and final and that Pakistan organised the invasion. Pakistan holds that the accession was invalid, made under pressure and against the will of a Muslim-majority people, that the tribesmen came to defend Muslims being killed in Jammu and Poonch, and that Kashmiris should decide their future by plebiscite. The timing of the signing of the Instrument of Accession is itself debated by historians."
  - Pakistan denied that its army was involved until July 1948, though Pakistani officers, among them Colonel Akbar Khan under the name “General Tariq”, planned and led parts of the campaign from the start. Both armies still had British commanders-in-chief, who tried to keep their forces from fighting each other.
  - Casualty figures come mostly from Indian sources and vary. The numbers killed in the massacres of 1947 are even less certain.
