steps:
  - title: Partition and the Poonch rising
    date: August – October 1947
    when: "1947-08-15"
    borders: "1947-10-21"
    countries: [in, pk]
    body:
      - When British India was partitioned on 14–15 August 1947, the rulers of the princely states were expected to join India or Pakistan. Jammu and Kashmir, the largest of them, had a Hindu Dogra Maharaja, Hari Singh, and a population about three-quarters Muslim. It bordered both new states. The Maharaja hoped to stay independent and signed a standstill agreement with Pakistan, which India did not sign. The most popular Kashmiri leader, Sheikh Abdullah of the National Conference, was in prison until the end of September and favoured a secular link with India; the rival Muslim Conference favoured Pakistan.
      - In the western district of Poonch, home of many Muslim ex-soldiers of the British Indian Army, a revolt against the Maharaja’s taxes and troops turned in August and September into an armed rising, supplied with weapons through Pakistan. By October the rebels held much of Poonch and Mirpur, and on 24 October they proclaimed a provisional Azad (“free”) Kashmir government. Pakistan cut supplies of fuel and food to the state.
      - At the same time the violence of partition reached Jammu. In October and November 1947 Muslims in the Jammu region were killed in large numbers by Dogra state troops, armed Hindu and Sikh bands and refugees from West Punjab, and hundreds of thousands fled to Pakistan. Estimates of the dead range from about 20,000 to more than 100,000. In the areas the rebels and tribesmen took, Hindus and Sikhs were killed and driven out in turn.
    facts:
      - [Partition of British India, "14–15 August 1947"]
      - [Azad Kashmir government proclaimed, "24 October 1947"]
      - [Muslims killed in Jammu, "estimates from about 20,000 to over 100,000"]
