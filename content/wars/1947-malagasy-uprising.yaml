steps:
  - title: The rising of 29 March 1947
    date: March – July 1947
    when: "1947-03-29"
    borders: "1947-03-29"
    countries: [mg, fr]
    body:
      - "Madagascar had been a French colony since 1896, and the forced labour, land seizures and requisitions of the Second World War had left deep anger, above all on the east coast, where Europeans held the coffee and vanilla plantations. In 1946 the island elected its first deputies to the French National Assembly, and the MDRM, founded in Paris in February 1946 by Raseta, Ravoahangy and Rabemananjara, won the seats reserved for Malagasy voters. Their bill for an independent Madagascar within the French Union was set aside, and the colonial administration encouraged a rival party of coastal peoples, PADESM. Alongside the MDRM, secret nationalist societies, Panama (Parti nationaliste malgache) and Jiny, prepared for armed struggle. On 27 March 1947 the three deputies issued a call for “absolute calm”."
      - "On the night of 29 March 1947 bands armed mostly with spears and machetes attacked the Tristani camp of colonial troops at Moramanga, on the railway from Antananarivo (Tananarive) to the coast, the town of Manakara and plantations along the lower Faraony river near Vohipeno; planned attacks on Diego-Suarez and other towns did not take place. The insurgents killed French settlers and Malagasy officials and supporters of PADESM, cut the railway and spread through the eastern forests. By mid-1947 they controlled about a third of the island, home to some 1.6 million people, with a northern zone led by Victorien Razafindrabe and a southern zone led by Michel Radaoroson. They had fewer than 150 rifles."
      - "The French government of Paul Ramadier treated the rising as a plot of the MDRM. The deputies Ravoahangy and Rabemananjara were arrested on 12 April 1947 despite their parliamentary immunity, and Raseta in June. French forces were raised from about 8,000 to 18,000 by April, many of them Senegalese and other African troops, and later to about 30,000 with North African battalions. On 6 May 1947 soldiers at Moramanga machine-gunned MDRM suspects held in railway wagons, killing between 124 and 160; at Mananjary prisoners were thrown alive from aircraft; there were massacres at Farafangana, Manakara and Mahanoro."
