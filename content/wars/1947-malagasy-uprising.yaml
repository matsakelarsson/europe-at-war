  - title: Repression, the end of the rising and the trial
    date: July 1947 – 1958
    when: "1948-10-04"
    borders: "1948-10-04"
    countries: [mg, fr]
    body:
      - "From July 1947 the French army went over to the offensive with the “oil stain” method used in the conquest half a century before, retaking the railway and the towns and then pushing into the forests. Villages were burned, suspects executed without trial and tortured, and tens of thousands of people who had fled into the forest died of hunger and disease. In August 1947 Razafindrabe lost his headquarters at Beparasy; Radaoroson was killed on 20 July 1948, Razafindrabe captured on 2 September 1948 and his successor Lehoaha surrendered on 11 November 1948. The last insurgent leader, Ralaivao, was captured in February 1949."
      - "The MDRM was dissolved. At a trial in Antananarivo from 22 July to 4 October 1948 Ravoahangy and Raseta were sentenced to death with four others and Rabemananjara to forced labour for life; the death sentences were commuted in 1949, and all three deputies were amnestied in 1958, two years before Madagascar became independent. The principal prosecution witness had been shot dead three days before the trial, and much of the evidence was obtained through torture. Courts martial and criminal courts convicted 5,765 people."
      - "France kept silent on the repression for decades. In 1967 the Malagasy government made 29 March a national day of remembrance, now Martyrs’ Day. On a visit to Madagascar on 21 July 2005 President Jacques Chirac called the repression “unacceptable”, and in 2012 a national museum of the uprising opened at Moramanga. In April 2025 France announced a joint commission of historians on the atrocities of the colonial period."
