notes:
  - "The role of the MDRM is disputed. Its deputies had appealed for calm two days before the rising and denied any part in it; the French authorities held the party responsible, and some historians argue that local MDRM militants and the secret societies overlapped. France kept most of its records closed for decades."
  - "Death toll estimates range from 11,342 “known dead” (colonial administration, 1950) and 30,000–40,000 (Jean Fremigacci) to the 89,000 first given by the French government and over 100,000 cited by the High Commissioner in 1949. About 550 French nationals, 350 of them soldiers, and some 1,900 Malagasy supporters of the administration were killed."
