id: malagasy-uprising
name: Malagasy Uprising
start: "1947-03-29"
end: "1949-02"
tier: B
summary: "An armed nationalist rising against French colonial rule in eastern Madagascar, and its suppression. After the Second World War, Madagascar’s elected deputies in the French National Assembly, Joseph Raseta, Joseph Ravoahangy and Jacques Rabemananjara of the Democratic Movement for Malagasy Renewal (MDRM), sought independence by legal means and were rebuffed. On the night of 29 March 1947 fighters organised by the secret societies Panama and Jiny attacked French military posts and plantations around Moramanga and Manakara; at its height the rising held about a third of the island. France raised its forces from about 8,000 to 18,000 and later to about 30,000, mostly colonial troops from Africa, and crushed it with summary executions, torture, the burning of villages and massacres such as that at Moramanga station on 6 May 1947. The last leaders were taken in late 1948 and early 1949. The French authorities blamed the MDRM, dissolved it and had its deputies tried and sentenced, two of them to death, though their role in the rising remains disputed. The death toll is one of the most debated questions of French colonial history: the first official estimate was 89,000 Malagasy dead, revised in 1950 to 11,342 “known dead”, while the historian Jean Fremigacci estimates 30,000–40,000, many of them victims of hunger and disease among people who fled to the forests."
countries: [mg, fr]
