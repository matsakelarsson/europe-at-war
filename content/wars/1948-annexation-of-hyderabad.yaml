id: annexation-of-hyderabad
name: Annexation of Hyderabad
start: "1948-09-13"
end: "1948-09-18"
tier: B
summary: "India’s military takeover of the princely state of Hyderabad in September 1948, code-named Operation Polo and officially called a “police action”. The Nizam, Mir Osman Ali Khan, ruled the largest princely state, a mostly Hindu land in the middle of the Deccan, and after independence in 1947 refused to join India or Pakistan. While talks dragged on under a standstill agreement, the Razakars, a militia of the Majlis-e-Ittehadul Muslimeen led by Qasim Razvi, terrorised opponents, and a communist-led peasant rising held much of Telangana. On 13 September 1948 Indian forces invaded from west and east, and after four days the Nizam ordered a ceasefire; his army surrendered on 18 September. The fighting was brief, but in the violence that followed tens of thousands of people, most of them Muslims, were killed."
countries: [in]
sides:
  - id: in
    name: India
    polities: [india]
    ink: orange
    moves: Indian moves
    success: Indian success
  - id: hy
