steps:
  - title: The Nizam and the Razakars
    date: August 1947 – September 1948
    when: "1948-08-21"
    borders: "1948-09-12"
    countries: [in]
    body:
      - Hyderabad had about 16 million people, some 85 per cent of them Hindus, and a Muslim ruler and aristocracy. When the British left in August 1947 the Nizam, one of the world’s richest men, claimed independence. On 29 November 1947 he signed a one-year standstill agreement with India, leaving the state’s defence and foreign affairs as they had been under the British, while negotiations continued. India saw an independent Hyderabad in the heart of the country as unacceptable; the Nizam sought help from Pakistan and Britain and bought arms abroad.
      - Inside the state the Razakars, a volunteer militia tens of thousands strong led by Qasim Razvi, attacked Hindu villages, Congress activists and the communists, and raided across the borders. In Telangana the Communist Party of India led an armed peasant rising against the landlords and the Nizam’s rule that controlled thousands of villages. India accused Hyderabad of breaking the standstill agreement and tightened an economic blockade. On 21 August 1948 Hyderabad complained to the UN Security Council.
    facts:
      - [Standstill agreement, "29 November 1947"]
      - [Population, "about 16 million, some 85 per cent Hindu"]
      - [Complaint to the UN Security Council, "21 August 1948"]
