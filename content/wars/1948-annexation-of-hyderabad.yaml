  - title: Operation Polo
    date: 13–18 September 1948
    when: "1948-09-13"
    borders: "1948-09-18"
    countries: [in]
    body:
      - Before dawn on 13 September 1948 Indian forces under Major-General J. N. Chaudhuri, about 35,000 men, crossed into Hyderabad. The main armoured thrust came from Solapur in the west, taking Naldurg on the first day and pushing east along the road to the capital; a second force advanced from Vijayawada in the east through Kodad and Suryapet, and smaller columns came from the north and south. The Hyderabad State Forces, about 22,000 men under Major-General Syed Ahmed El Edroos, fought delaying actions and blew bridges, and the Razakars were scattered.
      - At 5 p.m. on 17 September the Nizam announced a ceasefire on the radio, and on 18 September El Edroos surrendered to Chaudhuri, who became military governor. By Indian figures 807 soldiers of the State Forces and 1,373 Razakars were killed; Indian losses were light. Razvi was arrested and later went to Pakistan. The Nizam stayed on as head of state under India until 1956, when Hyderabad was divided between the new linguistic states of Andhra Pradesh, Bombay and Mysore.
      - In the weeks after the surrender Hindu mobs, in places joined by soldiers, killed Muslims in revenge for the Razakars’ violence, especially in Marathwada and the Gulbarga region. The Sunderlal Committee estimated 27,000 to 40,000 deaths.
