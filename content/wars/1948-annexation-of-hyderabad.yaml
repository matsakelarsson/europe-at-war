notes:
  - India called the operation a police action to restore order and stop Razakar violence; the Nizam’s government and its supporters, and later Pakistan, saw it as the invasion of an independent state. Hyderabad’s complaint to the UN Security Council was withdrawn after the takeover, on the Nizam’s instructions, though his delegation said the withdrawal was made under duress.
  - "The Sunderlal Committee, sent by the Indian government to investigate, estimated that 27,000 to 40,000 people were killed in and after the operation, mostly Muslims killed by Hindu mobs, sometimes with the help or acquiescence of soldiers. Its report was kept secret until 2013. Other observers gave much higher figures."
