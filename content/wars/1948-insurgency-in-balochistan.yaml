steps:
  - title: Kalat and the early risings
    date: 1948–1969
    when: "1948-07"
    borders: "1948-04-01"
    countries: [pk]
    body:
      - "The Khanate of Kalat, the largest princely state in Baluchistan, declared itself independent when British rule ended in August 1947. Under pressure from Pakistan, whose troops moved in, and after its feudatories Kharan, Las Bela and Makran had joined Pakistan, the Khan, Ahmad Yar Khan, signed the instrument of accession on 27 March 1948. In July his brother, Prince Abdul Karim, took up arms with a few hundred followers and fought in the Jhalawan hills, with little support from the tribes, until he surrendered in 1950 and was imprisoned."
      - "In 1955 the provinces of West Pakistan were merged into One Unit, and in October 1958 the army arrested the Khan of Kalat, accusing him of planning secession. Nauroz Khan, an aged chief of the Zarakzai, led a guerrilla rising in Jhalawan; he came down from the hills in 1959, by Baloch accounts on a promise of amnesty sworn on the Quran, but five of his sons and nephews were hanged in 1960 and he died in prison. From 1963 Sher Muhammad Marri’s Parari guerrillas fought in the Marri and Mengal country, blowing up railway lines and ambushing army convoys, until a ceasefire in 1969; in 1970 One Unit was dissolved and Balochistan became a province."
    facts:
      - [Accession of Kalat, "27 March 1948"]
      - [Prince Abdul Karim’s revolt, "1948–1950"]
      - [Nauroz Khan’s rising, "1958–1959"]
      - [Parari guerrillas, "1963–1969"]
