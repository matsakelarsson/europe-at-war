notes:
  - "The insurgents have never been one movement. The risings before 1977 were led by tribal chiefs, above all of the Marri, Mengal and Bugti tribes; since 2000 the main groups have been the Balochistan Liberation Army (BLA), the Balochistan Liberation Front (BLF), led by Allah Nazar Baloch and drawing on the educated young of Makran, and the Baloch Republican Army (BRA). Pakistan, the United Kingdom and the United States list the BLA as a terrorist organisation. Since 2025 the Pakistani government officially calls the Baloch armed groups Fitna al-Hindustan, accusing India of sponsoring them; India denies it."
  - "Casualty figures are uncertain: both sides’ claims cannot be checked, journalists have little access, and the number of the disappeared is disputed, with Baloch activists counting thousands and officials far fewer. The Baloch insurgency in Iran’s Sistan and Baluchestan province is a separate conflict."
  - The base map shows Kalat as part of Pakistan from its accession in 1948. Zones of insurgency are drawn in the steps and are approximate.
