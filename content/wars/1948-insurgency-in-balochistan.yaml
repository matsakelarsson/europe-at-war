  - title: The war of 1973–1977
    date: 1973–1977
    when: "1973-02-14"
    borders: "1973-02-14"
    countries: [pk]
    body:
      - "In the elections of 1970 the National Awami Party won Balochistan, and in 1972 it formed the first elected provincial government, under Chief Minister Ataullah Mengal. In February 1973, after weapons were found in the Iraqi embassy in Islamabad, which the government said were meant for Baloch separatists, Prime Minister Zulfikar Ali Bhutto dismissed the provincial government and arrested its leaders. Marri and Mengal tribesmen took to the hills, joined by young leftists of the Balochistan People’s Liberation Front, and the war became the largest Baloch rising."
      - "At its height some 80,000 Pakistani troops fought tens of thousands of guerrillas. The Shah of Iran, fearing for his own Baloch provinces, sent Cobra helicopter gunships with Iranian crews and money. The American scholar Selig Harrison estimated that about 3,300 soldiers and 5,300 guerrillas were killed, and many civilians died in army sweeps through the Marri country. Thousands of Marris fled to Afghanistan. After General Zia-ul-Haq overthrew Bhutto in July 1977, he released the Baloch leaders and declared an amnesty, and the fighting ended."
    facts:
