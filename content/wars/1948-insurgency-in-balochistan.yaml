id: insurgency-in-balochistan
name: Insurgency in Balochistan
start: "1948-07"
end: ongoing
tier: B
summary: "The armed struggle of Baloch nationalists against the Pakistani state in Balochistan, Pakistan’s largest and poorest province, rich in gas and minerals. It began with a revolt against the accession of the Khanate of Kalat in 1948 and flared in risings in 1958–1959, 1963–1969 and 1973–1977, the last a full-scale war in which the army, helped by Iran, fought tens of thousands of tribal guerrillas. The current insurgency began in the early 2000s, led by the Balochistan Liberation Army (BLA) and the Balochistan Liberation Front (BLF), and gained force after the army killed the tribal leader Akbar Bugti in 2006. The insurgents attack soldiers, police, settlers from other provinces and Chinese-funded projects; the security forces are accused of thousands of enforced disappearances. Pakistan accuses India of backing the insurgents, which India denies. Since 2024 the attacks have grown larger, with the hijacking of a passenger train in 2025 and coordinated offensives across the province. Last updated 27 November 2026."
countries: [pk]
