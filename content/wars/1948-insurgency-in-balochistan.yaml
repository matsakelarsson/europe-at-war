  - title: The insurgency since 2004
    date: 2004–2026
    when: "2006-08-26"
    borders: "2026-11-27"
    countries: [pk]
    body:
      - "Last updated 27 November 2026. The insurgency revived in the early 2000s, fed by anger at the way Balochistan’s gas and minerals benefited the rest of the country, at new army cantonments, and at the building of the port of Gwadar with Chinese help. In January 2005 the rape of a doctor, Shazia Khalid, at the Sui gas plant set off fighting around Sui and Dera Bugti. On 26 August 2006 the army killed Nawab Akbar Bugti, a 79-year-old tribal chief and former governor and chief minister, in his mountain hideout in Kohlu district, together with dozens of soldiers. His death made him a symbol of resistance even for Baloch who had opposed him. In the years that followed thousands of Baloch activists and students disappeared; their families and rights groups accuse the security agencies of abductions and of dumping bodies, which the state denies."
      - "From 2015 the China–Pakistan Economic Corridor, with Gwadar at its heart, became a main target. The BLA attacked the Chinese consulate in Karachi in 2018, and in 2022 a woman suicide bomber killed three Chinese teachers at Karachi University. The attacks grew larger: on 26 August 2024 the BLA’s coordinated “Operation Herof” killed at least 74 people, among them bus passengers shot on the highway; on 9 November 2024 a suicide bomber killed more than 30 people, many of them soldiers, at Quetta’s railway station; and on 11 March 2025 the BLA hijacked the Jaffar Express, with some 400 passengers, in the Bolan Pass. After an operation lasting more than 30 hours, officials said 31 passengers, railway staff and soldiers had died and 33 militants had been killed; the BLA claimed far higher figures without evidence. In August 2025 the United States listed the BLA’s Majeed Brigade as a foreign terrorist organisation."
      - "On 31 January 2026 the BLA launched “Operation Herof 2.0”, days of coordinated attacks on security posts, police stations, a prison and banks across several districts; the army said it killed more than 200 militants in its response. On 24 May a car bomb near Quetta’s railway station killed 24 people, and in July the army began a new operation, in which it said 129 insurgents were killed by mid-month. On 3 November the BLA announced that its commander since 2018, Bashir Zeb, had stepped down, and on 14 November it named Rehman Gul, a former Pakistani army captain who had led the Majeed Brigade, in his place. In mid-November the BLA and BLF claimed dozens of attacks, among them ambushes of army convoys near Khuzdar; the casualty figures they gave could not be confirmed. Whether the leadership change will alter the insurgents’ tactics is uncertain."
    facts:
      - [Akbar Bugti killed, "26 August 2006"]
      - [Operation Herof, "26 August 2024"]
      - [Jaffar Express hijacking, "11–12 March 2025"]
      - [Operation Herof 2.0, "from 31 January 2026"]
