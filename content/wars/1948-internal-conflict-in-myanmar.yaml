  - title: The end of the CPB and the ceasefires
    date: 1989–2011
    when: "1989-03-12"
    borders: "1995-01-27"
    countries: [mm, cn, th]
    body:
      - "In March and April 1989 the ethnic Kokang and Wa troops who made up most of the CPB’s army rose against its ageing Burmese leadership, took Panghsang on 17 April and sent the leaders into exile in China. The party’s army split into four forces, among them the Myanmar National Democratic Alliance Army (MNDAA) in Kokang and the United Wa State Army, which signed ceasefires with the military intelligence chief Khin Nyunt; they kept their arms and territory, and the Wa army grew into the largest non-state army in the country, rich from the drug trade. Over the next years some 20 groups agreed ceasefires, including the Kachin Independence Organisation in 1994."
      - "The army turned on those who fought on. A Buddhist faction broke from the KNU in December 1994 as the Democratic Karen Buddhist Army, and with its help the army took Manerplaw on 27 January 1995; some 10,000 refugees, most of them Karen, fled to Thailand. The Shan warlord Khun Sa surrendered his Mong Tai Army in January 1996. The Saffron Revolution of monks in 2007 was put down with force, and after Cyclone Nargis killed some 138,000 people in May 2008 the military pushed through a new constitution that reserved a quarter of parliament for the army. In August 2009 the army took Kokang from the MNDAA, and 30,000 to 37,000 refugees fled to China; in June 2011 the 17-year Kachin ceasefire broke down."
    facts:
      - [CPB leadership overthrown, "March–April 1989"]
      - [Fall of Manerplaw, "27 January 1995"]
      - [Kokang incident, "August 2009"]
    markers:
      - kind: taken
        name: Panghsang
        date: 17 April 1989
        text: Wa troops seized the CPB headquarters, ending the party’s armed struggle.
        lonlat: [99.183, 22.167]
      - kind: treaty
        name: Laukkai
        date: March 1989 and August 2009
        text: The Kokang rising against the CPB began here in March 1989; the MNDAA then made a ceasefire. The army took the town in August 2009.
        lonlat: [98.764, 23.695]
      - kind: taken
        side: mm
        name: Manerplaw
        date: 27 January 1995
        text: The KNU headquarters fell to the army and the Democratic Karen Buddhist Army.
        lonlat: [97.735, 17.725]
