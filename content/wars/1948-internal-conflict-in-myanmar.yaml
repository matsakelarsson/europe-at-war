steps:
  - title: Independence and the risings of 1948–1949
    date: 1948–1950
    when: "1948-03-28"
    borders: "1949-03-15"
    countries: [mm]
    body:
      - "Burma became independent on 4 January 1948 under a government of the Anti-Fascist People’s Freedom League (AFPFL), led by U Nu after the assassination of Aung San and six of his ministers in July 1947. The Communist Party of Burma (CPB), expelled from the League in 1946, went underground on 28 March 1948, after the government ordered the arrest of its leaders, and began an armed rising in central Burma; a smaller Red Flag communist party had already taken up arms in 1946. In July the majority of the People’s Volunteer Organisation, Aung San’s former veterans’ militia, joined the revolt, and battalions of the Burma Rifles went over to the communists. In Arakan, Muslim Mujahid fighters demanded autonomy for the north of the province."
      - "The Karen, many of whom had fought for the British in the Second World War, had asked in vain for a state of their own. Clashes between Karen and Burmese militias grew through 1948, and on 31 January 1949 fighting broke out at Insein, on the edge of Rangoon, between the government and the Karen National Defence Organisation (KNDO), the armed wing of the Karen National Union (KNU). The Karen Rifles and other Karen units of the army went over to the rising; the Karen commander-in-chief, General Smith Dun, was replaced by Ne Win. Karen forces took Toungoo and much of the Irrawaddy delta and, with communist troops, held Mandalay for several weeks in March and April 1949. For 112 days they besieged Insein, before withdrawing in May."
      - "At its lowest point in early 1949 the government held little more than Rangoon and a few towns, and it was mockingly called the “Rangoon government”. It survived because its enemies were divided, and with arms from Britain and India and the loyal Chin, Kachin and Gurkha battalions it won back the main towns and roads by 1950–1951. The Karen and the communists kept up their wars in the hills, the delta and the Pegu Yoma for decades."
    facts:
      - [Independence, "4 January 1948"]
      - [Communist rising, "from 28 March 1948"]
      - [Battle of Insein, "31 January – May 1949"]
