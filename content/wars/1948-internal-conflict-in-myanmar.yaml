        name: Laiza
        date: 24 February 1994 – June 2011
        text: The Kachin Independence Organisation kept its army and territory under a ceasefire that lasted 17 years.
        lonlat: [97.563, 24.760]
  - title: The Rohingya
    date: 2012–2019
    when: "2016-10-09"
    borders: "2017-09-15"
    countries: [mm, bd]
    body:
      - "The Rohingya, a Muslim people of northern Rakhine State (Arakan), were excluded from Burmese citizenship by a law of 1982, and most Burmese governments have called them illegal immigrants from Bangladesh, the “Bengalis”. In 2012 violence between Rakhine Buddhists and Muslims left some 140,000 people, most of them Rohingya, in camps around Sittwe. On 9 October 2016 a new armed group, later called the Arakan Rohingya Salvation Army (ARSA), attacked border police posts near Maungdaw, and the army answered with “clearance operations” in which villages were burned and some 87,000 people fled."
      - "On 25 August 2017 ARSA fighters attacked some 30 police posts and an army base. Within days the army and local militias launched operations across northern Rakhine in which hundreds of Rohingya villages were burned and men, women and children were shot, raped and killed; at Tula Toli on 30 August hundreds of villagers were killed on a riverbank, and at Inn Din ten men were killed on 2 September, a killing exposed by two Reuters journalists who were then jailed. Médecins Sans Frontières estimated that at least 6,700 Rohingya were killed by violence in the first month. ARSA fighters also killed civilians, among them about 99 Hindus at Kha Maung Seik on 25 August. By 2018 more than 700,000 Rohingya had fled to Bangladesh, where the camps around Kutupalong near Cox’s Bazar became the largest refugee settlement in the world."
      - "In 2018 a UN fact-finding mission concluded that the army’s top generals, Min Aung Hlaing among them, should be investigated and prosecuted for genocide, crimes against humanity and war crimes. The Gambia brought a case under the Genocide Convention to the International Court of Justice in November 2019, and Aung San Suu Kyi, then the head of the civilian government, defended Myanmar in person; the court heard the merits in January 2026, and on 19 November 2026 it ruled, by nine votes to six, that Myanmar had committed genocide against the Rohingya in the operations of 2016–2017 and must make reparation. Myanmar’s governments have denied genocide and say the operations were directed against ARSA, which they call a terrorist organisation. About 600,000 Rohingya remain in Rakhine, many in camps, and the refugees in Bangladesh have not been able to return."
    facts:
      - [ARSA attacks, "9 October 2016 and 25 August 2017"]
      - [Rohingya dead in the first month, "at least 6,700 (MSF estimate)"]
      - [Refugees in Bangladesh, "more than 700,000 by 2018"]
      - ["The Gambia v. Myanmar (ICJ)", "filed 11 November 2019; genocide found 19 November 2026"]
