  - title: The coup of 2021 and the uprising
    date: February 2021 – 2023
    when: "2021-02-01"
    borders: "2021-09-07"
    countries: [mm]
    body:
      - "After the National League for Democracy won the election of November 2020 by a landslide again, the army, claiming fraud, seized power on 1 February 2021, the day the new parliament was to meet. Aung San Suu Kyi and President Win Myint were arrested, and Min Aung Hlaing, the commander-in-chief, headed a State Administration Council. Millions joined strikes and protests in a civil disobedience movement. Security forces shot protesters in the streets: on 14 March some 60 or more people were killed in the industrial township of Hlaingthaya in Yangon, and on 27 March, Armed Forces Day, more than 100 across the country."
      - "Members of the deposed parliament formed a National Unity Government (NUG) on 16 April 2021 and a People’s Defence Force (PDF) on 5 May, and on 7 September the NUG declared a “people’s defensive war”. Young people trained in the territories of the ethnic armies, and local defence forces sprang up across the Burman heartland of Sagaing and Magway, in Chin State, where Mindat rose in April and May 2021, and in Karenni (Kayah) State. The military answered with air strikes, artillery and the burning of villages: on 24 December 2021 soldiers killed at least 35 people, among them two Save the Children staff, near Mo So in Kayah State, and on 11 April 2023 an air strike on a gathering at Pazigyi in Sagaing Region killed more than 160."
    facts:
      - [Coup, "1 February 2021"]
      - [National Unity Government formed, "16 April 2021"]
      - [“People’s defensive war” declared, "7 September 2021"]
    markers:
      - kind: event
        side: mm
        name: Naypyidaw
        date: 1 February 2021
        text: The army arrested the elected leaders in the capital on the morning the new parliament was to meet.
        lonlat: [96.120, 19.750]
      - kind: toll
