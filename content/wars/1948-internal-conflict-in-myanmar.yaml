  - title: The 8888 uprising
    date: 1988–1990
    when: "1988-08-08"
    borders: "1988-09-18"
    countries: [mm]
    body:
      - "Economic collapse and a currency reform of September 1987 that made most banknotes worthless set off student protests in Rangoon, which were met with force; in March 1988 dozens of students arrested by riot police suffocated in a police van. Ne Win resigned in July. On 8 August 1988, a date chosen for its numbers, a general strike brought hundreds of thousands into the streets of Rangoon and towns across the country, calling for democracy. Soldiers fired on the crowds that night and in the following days. Aung San Suu Kyi, Aung San’s daughter, addressed half a million people at the Shwedagon Pagoda on 26 August."
      - "On 18 September the army took power again as the State Law and Order Restoration Council (SLORC) and cleared the streets with gunfire. Estimates of the dead of the uprising range from about 3,000 to 10,000; the government gave a figure of about 350. Thousands of students fled to the border areas held by the KNU and other ethnic armies, where some formed the All Burma Students’ Democratic Front. The SLORC renamed the country Myanmar in 1989 and held elections on 27 May 1990, which Aung San Suu Kyi’s National League for Democracy won with 392 of 485 seats, but it never handed over power. Aung San Suu Kyi spent 15 of the following 21 years under house arrest."
    facts:
      - [General strike, "8 August 1988"]
      - [SLORC takes power, "18 September 1988"]
      - [Dead of the uprising, "estimates range from about 3,000 to 10,000"]
      - [Election, "27 May 1990, NLD 392 of 485 seats"]
