  - title: Ne Win, the ethnic armies and the communist base area
    date: 1958–1988
    when: "1962-03-02"
    borders: "1975-01-01"
    countries: [mm, cn]
    body:
      - "General Ne Win ran a caretaker government in 1958–1960 and seized power for good on 2 March 1962, abolishing the federal constitution and promising a “Burmese Way to Socialism”; on 7 July troops shot dead students at Rangoon University and blew up the Students’ Union building. Fear that the Shan and Karenni states would use their constitutional right to secede had been one reason for the coup, and the ethnic wars spread. The Kachin Independence Organisation, founded on 5 February 1961, and a number of Shan armies took up arms, along with Karenni, Mon, Chin, Pa-O, Palaung and other groups; the KNU set up its headquarters at Manerplaw on the Moei River in 1975."
      - "From the late 1960s the army fought these wars with its Four Cuts (pya ley pya) strategy, cutting the rebels off from food, funds, information and recruits by moving or burning villages and treating whole districts as hostile; tens of thousands of villagers were killed, forced to work as porters or driven from their homes. On 1 January 1968 communist forces trained and armed in China crossed from Yunnan at Mong Ko, and with Chinese support the CPB built a base area along the Chinese border from Kokang to the Wa hills and Mong La, with its headquarters at Panghsang. Its old strongholds in central Burma were destroyed: its chairman, Thakin Than Tun, was killed by a party member in 1968, and the army overran its last base in the Pegu Yoma in 1975."
    facts:
      - [Ne Win’s coup, "2 March 1962"]
      - [Kachin Independence Organisation founded, "5 February 1961"]
      - [CPB invasion from Yunnan, "1 January 1968"]
