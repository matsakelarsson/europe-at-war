        text: Kuomintang soldiers crossed into Thailand here on their way to the evacuation flights from Chiang Rai.
        lonlat: [99.884, 20.449]
      - kind: event
        side: mm
        name: Kengtung
        date: 1950–1961
        text: The chief town of the eastern Shan State, east of the Salween, the region worst affected by the Kuomintang occupation.
        lonlat: [99.603, 21.292]
