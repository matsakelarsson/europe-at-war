        text: Security forces killed some 60 or more protesters and residents in this industrial township of Yangon.
        lonlat: [96.067, 16.850]
        lp: l
      - kind: battle
        side: nug
        name: Mindat
        date: April – May 2021
        text: Local fighters with hunting rifles held off the army for weeks before withdrawing into the hills; it was one of the first armed risings against the coup.
        lonlat: [93.983, 21.367]
      - kind: toll
        side: mm
        name: Mo So
        date: 24 December 2021
        text: At least 35 people, among them women, children and two Save the Children staff, were killed and their bodies burned.
        lonlat: [97.101, 19.425]
      - kind: toll
        side: mm
        name: Pazigyi
        date: 11 April 2023
        text: An air strike on the opening of a local resistance office killed more than 160 people, many of them children.
        lonlat: [95.921, 23.004]
  - title: Operation 1027 and the resistance offensive
    date: October 2023 – December 2024
    when: "2023-10-27"
    borders: "2024-12-20"
    countries: [mm, cn, th]
    body:
      - "On 27 October 2023 the Three Brotherhood Alliance of the MNDAA, the Ta’ang National Liberation Army (TNLA) and the Arakan Army, with PDF units, attacked across northern Shan State in Operation 1027. Within weeks they took dozens of towns and border crossings to China, and on 5 January 2024 the army’s regional command at Laukkai surrendered with six generals. China, angered by the scam centres that had grown up in Kokang under the army’s allies, brokered a ceasefire at Haigeng on 11 January. Elsewhere the resistance took Kawlin and towns in Chin, Karenni and Karen states, besieged Loikaw and briefly entered Myawaddy, the main crossing to Thailand, in April. In February 2024 the military began conscripting young men and women."
      - "The Arakan Army attacked in Rakhine State in November 2023, took Paletwa in Chin State in January 2024 and then town after town, Buthidaung in May (whose Rohingya inhabitants said the Arakan Army burned their homes, which it denied) and Maungdaw in December. On 20 December it took Ann and the army’s Western Command, leaving the junta only Sittwe, Kyaukphyu and Manaung of Rakhine’s 17 townships. In northern Shan State the MNDAA took Lashio, with the army’s North-Eastern Command, on 3 August 2024, and the Kachin Independence Army took the rare-earth mines on the Chinese border and attacked Bhamo. By the end of 2024 the army had lost control of much of the country’s border regions, though it held the main cities and the centre."
    facts:
      - [Operation 1027 begins, "27 October 2023"]
      - [Surrender at Laukkai, "5 January 2024"]
      - [Lashio taken, "3 August 2024"]
      - [Arakan Army takes the Western Command at Ann, "20 December 2024"]
