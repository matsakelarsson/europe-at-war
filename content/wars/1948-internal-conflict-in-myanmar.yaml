notes:
  - The country was renamed from Burma to Myanmar in English on 18 June 1989, and Rangoon became Yangon; the new names are used here for events after 1989. The armed forces are called the Tatmadaw. Most ethnic armed organisations are a political organisation with an army, such as the Karen National Union and its Karen National Liberation Army (KNLA) or the Kachin Independence Organisation (KIO) and its Kachin Independence Army (KIA). Their aims have ranged from independence to autonomy in a federal union.
  - “Internal conflict in Myanmar” is a collective name for many separate wars with different aims, alliances and ceasefires. The governments in Rangoon and Naypyidaw have called their opponents insurgents, separatists or, since 2021, terrorists; the groups call themselves revolutionaries, resistance or ethnic armed organisations, and call the conflict the Spring Revolution (since 2021) or by their own names.
  - Casualty figures are uncertain. The Uppsala Conflict Data Program and other estimates put the dead of 1948–2020 in the hundreds of thousands; the data project ACLED counted more than 100,000 people killed in political violence from 2021 to mid-2026, and the UN counted some 3.5 million internally displaced people in Myanmar in 2025.
