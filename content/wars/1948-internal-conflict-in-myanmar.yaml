  - title: The junta’s counter-offensive and the election
    date: 2025 – November 2026
    when: "2025-03-28"
    borders: "2026-11-27"
    countries: [mm, cn, bd, th]
    body:
      - "Last updated 27 November 2026. On 28 March 2025 an earthquake of magnitude 7.7 on the Sagaing fault killed more than 3,700 people around Mandalay and Sagaing; both sides declared ceasefires, but the military’s air strikes went on. China, which wanted the trade routes reopened and feared a collapse of the state, pressed the northern armies to stop fighting: the MNDAA handed Lashio back to the junta in April 2025, and the TNLA, short of ammunition and cut off from the Chinese border, agreed on 29 October to give up Mogok and Mongmit. With conscripts, drones and Chinese and Russian weapons, the army retook Nawnghkio in July and Kyaukme and Hsipaw in October, and at the end of November its troops entered Mogok, handed over by the TNLA. In March 2026 the MNDAA turned on its former ally the TNLA and took Kutkai."
      - "The junta held an election in three phases between 28 December 2025 and 25 January 2026, without the dissolved National League for Democracy and in only part of the country; the army’s Union Solidarity and Development Party won a large majority, and the UN, Western governments and the opposition rejected the vote. On 3 April 2026 the new parliament elected Min Aung Hlaing president; his successor as commander-in-chief, Ye Win Oo, has stepped up the air war, which killed 12 civilians in Rakhine State on 1 November 2026 alone. Aung San Suu Kyi remains in detention. ASEAN still excludes Myanmar’s leaders from its summits."
      - "The war goes on. The Arakan Army holds most of Rakhine State and is fighting for Sittwe and Kyaukphyu, site of a Chinese deep-sea port and pipelines; the Kachin Independence Army is fighting at Bhamo, and the KNU and other Karen forces on the Thai border around Myawaddy, where the army retook ground in 2025. The PDF and local forces still hold much of the countryside of Sagaing and Magway. The data project ACLED counts more than 100,000 people killed since the coup, and the UN some 3.5 million displaced inside the country. How much territory each side holds is disputed: the resistance has taken some 90 towns since 2021, but the army keeps nearly all the cities, and by late 2025 it had won back part of what it lost in 2023–2024."
    facts:
      - [Earthquake, "28 March 2025, more than 3,700 dead"]
      - [Lashio returned to the junta, "April 2025"]
      - [Election, "28 December 2025 – 25 January 2026"]
      - [Min Aung Hlaing elected president, "3 April 2026"]
