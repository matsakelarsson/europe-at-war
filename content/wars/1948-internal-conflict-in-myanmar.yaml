id: internal-conflict-in-myanmar
name: Internal conflict in Myanmar
start: "1948-03-28"
end: ongoing
tier: A
summary: "The armed conflicts that have gone on in Myanmar (Burma) almost without pause since independence, among the longest in the world. Within months of independence in January 1948 the Communist Party of Burma and then the Karen National Union took up arms, and for a time in 1949 the government held little more than Rangoon. Kuomintang troops driven out of China occupied much of the Shan State in the 1950s. From the 1960s, under the military rule of Ne Win, the army fought the communists, who held a base area on the Chinese border until 1989, and a growing number of ethnic armies, Kachin, Karen, Karenni, Shan, Mon and others, seeking independence or a federal union. Ceasefires from 1989 ended much of the fighting but not the conflict. The army crushed the democracy uprising of 1988 and the protests of 2007, and in 2016–2017 drove more than 700,000 Rohingya into Bangladesh in operations that UN investigators said should be examined as genocide, and that the International Court of Justice found in November 2026 to have been genocide. The coup of 1 February 2021 turned the conflict into a nationwide civil war between the military government and the resistance of the National Unity Government and the ethnic armies, which made large gains in 2023–2024; the army won back ground in 2025–2026. Hundreds of thousands have been killed since 1948, and millions displaced."
countries: [mm, cn, tw, th, bd, us]
