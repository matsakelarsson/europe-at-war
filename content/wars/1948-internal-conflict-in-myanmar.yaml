  - title: The Kuomintang in the Shan State
    date: 1950–1961
    when: "1950-01"
    borders: "1953-03-01"
    countries: [mm, cn, tw, th, us]
    body:
      - "After the communist victory in China, remnants of the Nationalist (Kuomintang) army, among them the 93rd Division, crossed from Yunnan into the Shan State of Burma in early 1950. Under General Li Mi, and with arms flown in from Taiwan and secretly from the American Central Intelligence Agency, they set up a base at Mong Hsat near the Thai border, recruited local men and grew to some 12,000 by 1952. Their raids into Yunnan in 1951 and 1952 were driven back. They lived off the Shan State, taxed the opium trade and allied with the Karen rebels."
      - "Burma’s army could not dislodge them, and in March 1953 the government took its complaint to the United Nations, which called for their withdrawal. Some 7,000 soldiers and dependants were flown to Taiwan from Thailand in 1953–1954, but thousands stayed. In late 1960 and early 1961 Burmese troops, with Chinese People’s Liberation Army units operating inside Burma by agreement, overran the remaining Kuomintang bases near the Mekong; after a Burmese aircraft shot down a Nationalist supply plane carrying American-made weapons, the United States pressed Taipei to evacuate some 4,000 more. The rest moved into northern Thailand, where they settled at Mae Salong and became major opium traders."
    facts:
      - [Kuomintang troops enter Burma, "early 1950"]
      - [Burmese complaint to the UN, "March 1953"]
      - [Evacuations to Taiwan, "1953–1954 and 1961"]
    markers:
      - kind: held
        side: kmt
        name: Mong Hsat
        date: 1951–1953
        text: Li Mi’s headquarters and airstrip, supplied by air from Taiwan and Thailand.
        lonlat: [99.250, 20.533]
      - kind: event
