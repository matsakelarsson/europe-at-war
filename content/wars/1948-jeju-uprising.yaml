  - title: The end of the insurgency and its aftermath
    date: March 1949 – 2003
    when: "1949-03-02"
    borders: "1949-06-07"
    countries: [kr]
    body:
      - In March 1949 a new combined command offered an amnesty while army battalions combed the mountains, and thousands of people came down. The election in Jeju was held again on 10 May 1949, and on 7 June the insurgent leader Yi Deok-gu was killed, which ended the organised rising. Thousands of islanders were sentenced by summary military courts and sent to mainland prisons. When the Korean War broke out in June 1950, many of them, and hundreds of people held in “preventive detention” on Jeju, were executed without trial. The last insurgent was captured in 1957; the mountain was reopened on 21 September 1954, the date Korean usage takes as the end of 4·3.
      - For decades survivors could not speak of the killings, and relatives of those labelled communists were barred from many jobs. After democratisation, a special law of 2000 set up a government investigation, whose report of 2003 estimated 25,000–30,000 dead; President Roh Moo-hyun apologised that year for the state’s wrongful acts, and in 2019 the police and the defence ministry apologised for their part. Since 2014, 3 April has been a national day of remembrance, and courts have overturned the military verdicts of 1948–1949.
    facts:
      - [Yi Deok-gu killed, "7 June 1949"]
      - [Mount Halla reopened, "21 September 1954"]
      - [Government report and apology, "October 2003"]
      - [Estimated dead, "25,000–30,000 (other estimates up to 80,000)"]
