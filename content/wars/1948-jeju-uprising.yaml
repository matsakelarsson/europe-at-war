  - title: Scorched earth
    date: October 1948 – March 1949
    when: "1948-10-17"
    borders: "1948-11-17"
    countries: [kr]
    body:
      - The Republic of Korea was proclaimed on 15 August 1948, and the new government of Syngman Rhee resolved to end the rising by force. On 17 October Major Song Yo-chan, commander of the 9th Regiment, proclaimed that anyone found more than 5 km inland from the coast without permission would be shot as a rebel. Two days later a regiment ordered to Jeju rose in rebellion at Yeosu rather than sail, which turned the government against all suspected leftists; martial law was declared on the island on 17 November. Through the winter the army, the police and the Northwest Youth League burned most of the villages of the mid-mountain zone and killed those who stayed or fled into the hills, along with families of suspected insurgents and anyone accused of helping them. The committee recorded 9,709 deaths between 11 October 1948 and 1 March 1949 alone, about two-thirds of all those it could confirm.
      - On 17 January 1949, after insurgents ambushed soldiers of the 2nd Regiment near the village of Bukchon on the north-east coast and killed two, troops gathered the villagers at the school and shot some 300–400 of them over two days, the worst single massacre on the island. The insurgents, now led by Yi Deok-gu after Kim Dal-sam had left for the North, also raided villages, killing police families, officials and others they counted as enemies.
    facts:
