id: jeju-uprising
name: Jeju uprising
start: "1948-04-03"
end: "1949-06-07"
tier: B
summary: "An armed rising on Jeju Island led by the Workers’ Party of South Korea, and its suppression by the South Korean army and police, the US military government and right-wing youth groups, known in Korea as Jeju 4·3 after its first day, 3 April 1948. Tension had grown since police shot six people at a rally on 1 March 1947 and the mass arrests and beatings that followed. Opposing the separate election in the South, several hundred insurgents attacked police stations across the island; the election of 10 May 1948 failed in two of Jeju’s three districts. From October 1948 the army declared the interior of the island a free-fire zone and burned most of the mountain villages; the winter of 1948–1949 was the deadliest period. The insurgency was broken by mid-1949, when its leader Yi Deok-gu was killed, though the island’s mountains stayed closed until 1954. A government committee in 2003 estimated 25,000–30,000 dead, about a tenth of the island’s people, and attributed some 86 percent of the deaths it could identify to the security forces and 14 percent to the insurgents. The subject was suppressed for decades; President Roh Moo-hyun apologised for the state’s actions in 2003."
