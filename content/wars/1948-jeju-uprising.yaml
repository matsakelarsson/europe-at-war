steps:
  - title: From the March 1947 shooting to the rising
    date: March 1947 – May 1948
    when: "1948-04-03"
    borders: "1948-04-03"
    countries: [kr]
    body:
      - Jeju, an island of some 280,000 people, many of them recently returned from Japan, had strong left-wing people’s committees after 1945 and resented the police, many of whom had served under Japanese rule. On 1 March 1947, at a rally in Jeju town marking the 1919 independence movement, a mounted policeman knocked down a child; when the crowd threw stones, police opened fire and killed six people. A general strike followed. The US military government answered with police from the mainland and members of the Northwest Youth League, militant anti-communists who had fled the North; some 2,500 islanders were arrested over the next year, and three died under torture in March 1948.
      - The Workers’ Party of South Korea opposed the election that the United Nations had called for 10 May 1948 in the South alone, which it saw as sealing the division of Korea. At about 2 a.m. on 3 April 1948 several hundred armed insurgents led by the party’s Jeju chief Kim Dal-sam attacked 12 of the island’s 24 police stations and the homes of right-wing leaders. Lieutenant Colonel Kim Ik-ryeol, commander of the 9th Regiment of the constabulary, met Kim Dal-sam on 28 April and agreed a truce, but it broke down within days, after right-wing youths set fire to houses in the village of Ora-ri on 1 May and the authorities blamed the insurgents. On 10 May the election failed in two of Jeju’s three districts, the only places in the South where it did.
    facts:
      - [Police shooting in Jeju town, "1 March 1947, six killed"]
      - [Start of the rising, "3 April 1948"]
      - [Truce talks, "28 April 1948"]
      - [Election fails in two of three districts, "10 May 1948"]
