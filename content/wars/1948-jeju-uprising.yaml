notes:
  - Korean usage dates the Jeju 4·3 incident more widely, from the shooting of 1 March 1947 to the reopening of Mount Halla on 21 September 1954; the armed rising and its suppression lasted from April 1948 to mid-1949.
  - The National Committee for Investigation of the Truth about the Jeju April 3 Incident (report of 2003) is the main source for the figures. It recorded more than 14,000 victims by name and estimated the total dead at 25,000–30,000; other estimates range up to 80,000. About 40,000 people fled to Japan.
  - Both sides killed civilians. The committee found that most victims, many of them women, children and old people, were killed by the army, police and the Northwest Youth League, above all in the scorched-earth campaign of the winter of 1948–1949, and that the US military government and the US military advisers shared responsibility for its beginning.
