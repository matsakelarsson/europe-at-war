  - title: The Briggs Plan and the New Villages
    date: "1950 – 1952"
    when: "1950-06-01"
    borders: "1950-06-01"
    countries: [my, gb]
    body:
      - "In April 1950 the retired general Sir Harold Briggs became Director of Operations. His plan, carried out from mid-1950, aimed to cut the guerrillas off from the people who supplied them rather than to chase them through the jungle, and to bring the army, the police and the civil administration together in war executive committees at every level. Its core was the forced resettlement of the squatters, overwhelmingly Chinese, into “New Villages”, fenced with barbed wire, lit at night, guarded by police and home guards and closed by curfews. By 1952 some 500,000 people, about a tenth of Malaya’s population, had been moved into more than 450 New Villages, often at a few hours’ notice, their old homes and crops burned. Rice was rationed, tins were punctured when sold so that food could not be stored, and people going out to work were searched at the gates."
      - "Conditions varied. Many villages began with little more than huts and wire, and the moves were bitterly resented; in time others gained schools, clinics, piped water and land titles. Working with the Malayan Chinese Association, founded in 1949, the government tried to draw the Chinese community to its side. Many Orang Asli, the indigenous peoples of the interior on whom the guerrillas also relied, were moved into camps where many died before the policy was reversed in favour of jungle forts. The results came slowly, and 1951 was the worst year of the war."
    facts:
      - [Briggs Director of Operations, "April 1950"]
      - [People resettled, "about 500,000 by 1952"]
      - [New Villages, "more than 450"]
    markers:
      - kind: event
        side: gov
        name: Jinjang
        date: "1950–1952"
        text: "One of the largest New Villages, on the northern edge of Kuala Lumpur."
        lonlat: [101.655, 3.210]
        lp: l
      - kind: event
        side: gov
        name: Kinta Valley
        date: "1950–1952"
        text: "Perak, with its tin-mining valley around Ipoh, had more New Villages than any other state."
        lonlat: [101.100, 4.550]
  - title: Gurney’s death and the height of the war
    date: "1951"
    when: "1951-10-06"
    borders: "1951-10-06"
    countries: [my, gb]
    body:
      - "In 1951 the war reached its height. More soldiers, police and civilians were killed than in any other year, and in the rubber and tin districts of Perak, Selangor, Pahang, Negeri Sembilan and Johor travel by road was dangerous. On 6 October 1951 a unit of 38 guerrillas led by Siu Mah ambushed the car of the High Commissioner, Sir Henry Gurney, on the winding road up to Fraser’s Hill and killed him; his wife and his private secretary survived. Chin Peng later said that the ambush had been routine and that the guerrillas only learned from the news whom they had killed. In November the authorities removed the whole population of the nearby New Village of Tras, about 2,000 people, accused of feeding the guerrillas, to a detention camp near Ipoh; they were not allowed back until 1958."
      - "The killing shook the colonial government and the planters, and in Britain the new Conservative government decided on a change of command. Within the MCP the leadership had already concluded that its campaign was turning the population against it. Its directives of October 1951 told the guerrillas to stop burning New Villages, attacking buses, trains and post offices and slashing rubber trees, to avoid harming civilians, and to concentrate on political work and on attacks on the security forces; the guerrillas pulled back deeper into the jungle. The directives took months to reach the units in the field."
    facts:
      - [Gurney killed, "6 October 1951"]
      - [Tras villagers detained, "8–9 November 1951, about 2,000"]
      - [MCP October directives, "October 1951"]
    markers:
      - kind: toll
        side: mcp
        name: Fraser’s Hill road
        date: "6 October 1951"
        text: "Sir Henry Gurney was killed in an ambush at Mile 56½ of the road from Kuala Kubu to the hill station."
        lonlat: [101.755, 3.680]
    areas:
      - style: contested
        side: mcp
        label: Main areas of guerrilla activity, 1948–1951 (approximate)
        atoms: [MY-01, MY-08, MY-06, MY-10, MY-14, MY-16, MY-05]
  - title: Templer and “hearts and minds”
    date: "1952 – 1954"
    when: "1952-02-07"
    borders: "1953-09-03"
    countries: [my, gb, au, nz, th]
    body:
      - "General Sir Gerald Templer arrived on 7 February 1952 as both High Commissioner and Director of Operations. He became known for saying that the answer lay “in the hearts and minds of the people”, and he pressed on with citizenship for more Chinese and Indians, eased in 1952, with local elections, schools and land titles for the New Villages, and with training Malayans for higher posts in government. He could also be harsh. After guerrillas killed twelve men of a water-pipe repair party near Tanjong Malim in March 1952, he put the town under a 22-hour curfew and cut its rice ration until its people gave information, and other villages were collectively fined or punished. From 1952 the government called the guerrillas “communist terrorists” instead of “bandits”."
      - "The security forces grew to some 40,000 regular troops, from Britain, the Gurkha regiments, the Malay Regiment, Fiji, East Africa and Rhodesia, and from 1955 Australian and New Zealand infantry and special forces (Australian aircraft had flown in Malaya since 1950), besides about 24,000 police, 37,000 special constables and some 250,000 home guards. Small patrols guided by Iban trackers from Sarawak and by surrendered guerrillas, and the Special Air Service in the deep jungle, took the place of large sweeps, while bombers struck suspected camps and aircraft sprayed herbicides on the guerrillas’ food crops. In April 1952 the British communist newspaper the Daily Worker published photographs of Royal Marines posing with the severed heads of guerrillas, cut off by Iban trackers for identification. By 1953 the MNLA was much weakened, and its leaders had moved to the jungle across the Thai border near Betong."
      - "On 3 September 1953 Templer declared the first “white area” in Malacca, where no guerrillas were thought to remain and the curfews, food controls and Emergency Regulations were lifted. By March 1955 there were white areas in every state, holding more than a third of the population. Templer left Malaya in 1954."
    facts:
      - [Templer arrives, "7 February 1952"]
      - [Tanjong Malim curfew, "March – April 1952"]
      - [First white area, "3 September 1953, Malacca"]
