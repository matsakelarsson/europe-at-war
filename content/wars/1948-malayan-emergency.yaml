steps:
  - title: Sungai Siput and the declaration of the Emergency
    date: "1945 – July 1948"
    when: "1948-06-16"
    borders: "1948-06-16"
    countries: [my, gb]
    body:
      - "During the Japanese occupation the Malayan Communist Party (MCP), founded in 1930 and drawing its members mostly from the Chinese community, had led the main armed resistance, the Malayan People’s Anti-Japanese Army (MPAJA), with British arms and training from Force 136. After the war it disbanded the MPAJA in December 1945 and turned to the trade unions, leading waves of strikes on the rubber estates, in the tin mines and at the docks. Britain’s plan for a Malayan Union with equal citizenship for all, launched in April 1946, was dropped after mass Malay protests and the founding of the United Malays National Organisation (UMNO); the Federation of Malaya that replaced it on 1 February 1948 kept the Malay rulers and made citizenship much harder for Chinese and Indians to obtain. In March 1947 the MCP’s secretary-general Lai Teck, who had worked for the French, British and Japanese police, vanished with the party’s funds. His young successor Chin Peng led the party towards armed struggle as the government cracked down on the unions in the first half of 1948."
      - "On the morning of 16 June 1948 three young Chinese men shot Arthur Walker, manager of the Elphil estate near Sungai Siput in Perak, and a larger group killed John Allison, manager of the nearby Phin Soon estate, and his assistant Ian Christian. The killers were MCP members, but historians disagree over whether the party leadership had ordered the killings or was taken by surprise. That day the government declared a state of emergency in parts of Perak and Johor, extended to the whole Federation on 18 June. The Emergency Regulations allowed detention without trial, death sentences for carrying arms, searches and curfews, and the MCP was banned in July. Thousands of party members and union activists were arrested, and the party moved its armed units into the jungle."
    facts:
      - [Federation of Malaya, "1 February 1948"]
      - [Sungai Siput killings, "16 June 1948, three planters killed"]
      - [Emergency declared in all of Malaya, "18 June 1948"]
