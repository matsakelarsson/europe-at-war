        date: "11–12 December 1948"
        text: "Soldiers of the Scots Guards shot dead 24 unarmed villagers at Sungai Rimoh; one man survived by feigning death."
        lonlat: [101.455, 3.475]
        lp: l
      - kind: battle
        side: mcp
