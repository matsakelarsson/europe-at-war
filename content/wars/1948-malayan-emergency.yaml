        atoms: [MY-08, MY-01]
  - title: War in the jungle
    date: "1948 – 1950"
    when: "1948-12-12"
    borders: "1949-02-01"
    countries: [my, gb]
    body:
      - "The MCP formed its fighters into the Malayan People’s Anti-British Army, renamed on 1 February 1949 the Malayan National Liberation Army, a few thousand men and women at first and over 7,000 at its peak in 1951, organised in regiments by state. Many had fought in the MPAJA. It relied on the Min Yuen (“masses movement”), a civilian network among the half-million Chinese squatters who had settled on the jungle fringes during the Depression and the occupation, for food, money, recruits and information. Its aim was to drive the planters and miners out of the countryside, set up what it called “liberated areas” and spread from them. It attacked estates, mines, police posts, buses and trains, slashed rubber trees, and killed managers, workers, officials and people it accused of informing."
      - "The government at first had few troops, and much of the burden fell on the police and on tens of thousands of hastily recruited special constables guarding estates and mines. The army swept the jungle in large operations with little result, and in the first years the security forces burned squatter settlements suspected of feeding the guerrillas; thousands of people were detained without trial, and many Chinese detainees and their families were deported to China. On 11–12 December 1948 a patrol of the Scots Guards at the village of Sungai Rimoh near Batang Kali in Selangor shot dead 24 unarmed rubber tappers. The army said they had been killed while trying to escape; later testimony by soldiers and by the one survivor, Chong Hong, pointed to a deliberate killing. In 2012 the High Court in London found evidence supporting this, but British courts and in 2018 the European Court of Human Rights ruled that no public inquiry could be required."
      - "On 23 February 1950 about 180 guerrillas attacked the police station at Bukit Kepong on the Muar River in Johor before dawn and overran it after five hours, killing most of its policemen and auxiliaries and several of their wives and children. The station’s defence became a symbol for the government side."
    facts:
      - [MNLA founded, "1 February 1949"]
      - [Batang Kali, "11–12 December 1948, 24 villagers killed"]
      - [Bukit Kepong, "23 February 1950"]
    markers:
