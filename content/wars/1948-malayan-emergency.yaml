        atoms: [MY-04]
  - title: Elections, amnesty and Baling
    date: "1955 – February 1956"
    when: "1955-12-28"
    borders: "1955-12-28"
    countries: [my, gb, sg, th]
    body:
      - "Malaya moved quickly towards self-government. The Alliance of the United Malays National Organisation, the Malayan Chinese Association and the Malayan Indian Congress, led by Tunku Abdul Rahman, won 51 of the 52 elected seats in the Federal Legislative Council on 27 July 1955, and the Tunku became chief minister. On 8 September the governments of the Federation and of Singapore offered an amnesty. The MCP had been calling for talks, and on 28–29 December 1955 Chin Peng, Rashid Maidin and Chen Tien met the Tunku, Tan Cheng Lock of the Malayan Chinese Association and David Marshall, chief minister of Singapore, at a school in Baling in Kedah."
      - "The Tunku demanded that the guerrillas surrender, that the party be dissolved and that its members accept investigation; Chin Peng asked for the MCP to be recognised as a legal party and for its members to be free from detention and restrictions. Neither side would give way. Chin Peng said that the guerrillas would lay down their arms once an elected Malayan government controlled internal security and defence. The talks failed and Chin Peng went back to Thailand. The amnesty was withdrawn on 8 February 1956, the day an agreement in London set 31 August 1957 as the date of Malaya’s independence."
    facts:
      - [Federal election, "27 July 1955, Alliance 51 of 52 seats"]
      - [Amnesty offered, "8 September 1955"]
      - [Baling talks, "28–29 December 1955"]
    markers:
      - kind: treaty
        name: Baling
        date: "28–29 December 1955"
        text: "Chin Peng, Rashid Maidin and Chen Tien met the Tunku, Tan Cheng Lock and David Marshall at the Government English School. The talks failed."
        lonlat: [100.917, 5.677]
      - kind: held
        side: mcp
        name: Betong
        date: "1955"
        text: "Chin Peng came from his base across the border to Baling under safe conduct and went back after the talks."
        lonlat: [101.280, 5.770]
      - kind: capital
        side: gov
        name: Kuala Lumpur
        date: "27 July 1955"
        text: "Seat of the Federal Legislative Council, in which the Alliance won 51 of the 52 elected seats."
        lonlat: [101.695, 3.147]
  - title: Merdeka and the end of the Emergency
    date: "1957 – 1960"
    when: "1957-08-31"
    borders: "1957-08-31"
    countries: [my, gb, au, nz, th]
    body:
      - "The Federation of Malaya became independent on 31 August 1957, when Tunku Abdul Rahman proclaimed Merdeka (independence) in the new stadium in Kuala Lumpur. The war became the new state’s, and British, Gurkha, Australian and New Zealand troops stayed under the Anglo-Malayan Defence Agreement of October 1957. Independence took away the MCP’s main cause, and renewed offers of amnesty and rewards brought a wave of surrenders. In April 1958 Hor Lung, head of the party’s South Malaya Bureau, surrendered and brought out some 160 of his followers, and the guerrilla organisation in Johor, long its strongest, collapsed in 1958–1959."
      - "By 1960 only some 500 guerrillas remained, most of them with Chin Peng in the jungle around Betong and Sadao across the Thai border. The government declared the Emergency over on 31 July 1960, though the border area stayed under special security laws. Chin Peng moved to Beijing in 1961. The MCP took up arms again from the Thai border in 1968 (see the communist insurgency in Malaysia) and signed peace agreements with Malaysia and Thailand only at Hat Yai on 2 December 1989. Chin Peng was never allowed back into Malaysia and died in Bangkok in 2013."
      - "About 11,000 people had been killed: by official count 6,710 guerrillas, some 2,800 soldiers and police of the government side, and 2,478 civilians, with 810 more missing. More than 450 New Villages remain, home to many of Malaysia’s Chinese. Malaysia’s official history honours the police and soldiers who fought the communists, while former guerrillas and some historians see the war above all as a struggle against colonial rule."
    facts:
      - [Independence, "31 August 1957"]
      - [Emergency ends, "31 July 1960"]
      - [Hat Yai agreements, "2 December 1989"]
    markers:
