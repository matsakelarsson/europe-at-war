        text: "After an ambush that killed twelve men nearby, Templer imposed a 22-hour curfew and cut the town’s rice ration as a collective punishment."
        lonlat: [101.520, 3.685]
      - kind: event
        side: gov
        name: Malacca
        date: "3 September 1953"
        text: "The first “white area”, covering about a third of the settlement, where the Emergency Regulations were lifted."
        lonlat: [102.250, 2.195]
