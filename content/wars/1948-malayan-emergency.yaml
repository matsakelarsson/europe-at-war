notes:
  - "The colonial government called the conflict an “Emergency”, not a war, partly because the London insurers of the rubber estates and tin mines would not have covered losses in a civil war. The MCP called it the Anti-British National Liberation War. Until 1952 the government called the guerrillas “bandits”; from 1952 its official term was “communist terrorists” (CTs). The MCP’s army was known in English at the time as the Malayan Races Liberation Army (MRLA); its Chinese name means Malayan National Liberation Army (MNLA)."
  - "Most of the MNLA’s fighters were ethnic Chinese, but it also had Malay and Indian members, among them the Malay 10th Regiment in Pahang under Abdullah C. D. and Rashid Maidin. Most of the soldiers and police on the government side were Malays; Chinese, Indians and Orang Asli served on both sides."
  - "Official casualty figures give 6,710 MNLA killed, 1,287 captured and 2,702 surrendered; 1,346 Malayan and 1,443 British members of the security forces killed, with 39 Australians, 15 New Zealanders and 8 Rhodesians; and 2,478 civilians killed and 810 missing."
  - "The Emergency was long held up as a model of counter-insurgency won by winning “hearts and minds”. Later historians have put more weight on mass resettlement, detention without trial, deportation, food control and collective punishment, and on the MCP’s own mistakes, and the balance between these remains debated."
