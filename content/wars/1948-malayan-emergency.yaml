id: malayan-emergency
name: Malayan Emergency
start: "1948-06-16"
end: "1960-07-31"
tier: A
summary: "The guerrilla war between the Malayan Communist Party’s army, the Malayan National Liberation Army, and the British colonial government of the Federation of Malaya, with troops from across the Commonwealth, and from 1957 the independent Federation. The MCP, which had led the armed resistance to the Japanese occupation and drew most of its members from the Chinese community, turned to armed struggle in 1948, and after the killing of three European planters at Sungai Siput on 16 June the government declared a state of emergency. The guerrillas, a few thousand strong and supplied by a civilian network among the rural Chinese, attacked estates, mines, police posts and roads; the war reached its height in 1951, when they killed the High Commissioner, Sir Henry Gurney. Under the Briggs Plan some half a million people, most of them Chinese squatters, were forcibly resettled into guarded “New Villages”, and under General Sir Gerald Templer political concessions went together with food control, collective punishments and small-unit jungle warfare. Malaya’s march to independence in 1957 took away the communists’ main cause; talks at Baling in 1955 failed, but surrenders grew, and the government declared the Emergency over on 31 July 1960, with the remaining guerrillas across the Thai border. About 11,000 people were killed."
countries: [my, gb, sg, au, nz, th]
sides:
