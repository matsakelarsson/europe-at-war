id: yeosu-suncheon-rebellion
name: Yeosu–Suncheon rebellion
start: "1948-10-19"
end: "1948-10-27"
tier: C
summary: "A rebellion of the South Korean army’s 14th Regiment in South Jeolla in October 1948, known in Korea as the Yeosu–Suncheon 10·19 incident. On the night of 19 October, as the regiment prepared to sail from Yeosu to fight the Jeju uprising, members of the Workers’ Party of South Korea among its soldiers, led by Staff Sergeant Ji Chang-su and Lieutenant Kim Ji-hoe, seized the armoury and called on the troops to refuse to fight fellow Koreans. Some 2,000–3,000 soldiers joined them, with local leftists; they took Yeosu and Suncheon and spread to Gwangyang, Gurye, Boseong and other towns, killing police officers, officials and right-wing civilians. The government declared martial law and sent loyal regiments: Suncheon was retaken on 23 October and Yeosu, after two days of street fighting, on 27 October. In the reprisals that followed, troops and police screened the townspeople and executed many suspected of helping the rebels, often without trial. Estimates of the dead range from about 3,000 to more than 10,000, most of them killed by government forces. The surviving rebels withdrew to Mount Jiri and fought as guerrillas into the Korean War. The rebellion led to the National Security Act of December 1948 and a purge of suspected leftists in the army, in which Major Park Chung-hee, later president, was convicted and spared after cooperating with investigators. A special law of 2021 provided for investigating the killings and restoring the honour of the victims."
