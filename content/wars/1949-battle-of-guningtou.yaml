id: battle-of-guningtou
name: Battle of Guningtou
start: "1949-10-25"
end: "1949-10-27"
tier: C
summary: "A failed amphibious attack by the People’s Liberation Army on Kinmen (Quemoy), the island off Xiamen held by the Republic of China, in the last months of the Chinese Civil War. After taking Xiamen on 17 October 1949, Ye Fei’s 10th Corps sent the first echelon of its 28th Army, over 9,000 men in about 200 fishing boats and junks, across the strait on the night of 24–25 October. They landed along some 10 km of the north-west coast between Longkou and Guningtou, but the boats were stranded by the falling tide and set on fire, and no second wave could follow. The defenders, more than 40,000 men of Li Liangrong’s 22nd Army and of Hu Lien’s 12th Corps, which had just arrived, counter-attacked with M5A1 light tanks, aircraft and naval guns, and by 27 October the landing force had been destroyed. By ROC figures the PLA lost 3,873 killed and 5,175 to 7,364 captured, the higher count including boatmen and porters, while the defenders lost 1,267 killed and 1,982 wounded. It was one of the PLA’s few defeats in the last stage of the civil war; Kinmen stayed in ROC hands, plans to invade Taiwan were set back, and the island became the front line of the Taiwan Strait crises of 1954 and 1958."
countries: [tw, cn]
