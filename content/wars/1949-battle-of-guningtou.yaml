notes:
  - The People’s Republic had been proclaimed on 1 October 1949; the PLA fought the battle as the army of the new state. Mainland accounts acknowledge at least 5,175 captured.
  - Since 2025 Taiwan has marked 25 October as Taiwan Retrocession Day and the anniversary of the battle.
