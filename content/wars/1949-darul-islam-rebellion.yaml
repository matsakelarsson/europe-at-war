notes:
  - "The number of dead is not known. Figures cited range from more than 13,000 civilians, soldiers and village guards killed in West Java to about 22,900 dead in all; one contemporary report counted 1,836 murders and 6,934 houses burned in West Java in 1952 alone. The rebellions in South Sulawesi and Aceh had local causes, among them the demobilisation of guerrillas, the place of regional leaders and the demand for Islamic law, and their leaders joined Kartosuwiryo’s state partly as a banner for these."
  - The underground Negara Islam Indonesia network survived the defeat of the rebellion, and some later Indonesian Islamist groups, among them founders of Jemaah Islamiyah, came from it.
