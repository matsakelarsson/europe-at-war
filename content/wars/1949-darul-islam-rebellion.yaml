id: darul-islam-rebellion
name: Darul Islam rebellion
start: "1949-08-07"
end: "1965-02-03"
tier: C
summary: "The armed movement for an Islamic state in Indonesia, led by Sekarmadji Maridjan Kartosuwiryo, against the Republic. Darul Islam (“house of Islam”) grew out of the Hizbullah and Sabilillah militias that had fought the Dutch in West Java. When the Renville agreement of January 1948 obliged the Republic’s army to leave West Java for Central Java, these units stayed behind, and in May 1948 Kartosuwiryo formed an Islamic council around Tasikmalaya. On 7 August 1949, as the Republic negotiated with the Dutch, he proclaimed the Islamic State of Indonesia (Negara Islam Indonesia) with himself as imam, and his Islamic Army of Indonesia (TII) fought both the Dutch and the returning Republican army. Other risings, each with grievances of its own, joined it: Amir Fatah in the Brebes and Tegal area of Central Java (1949), Ibnu Hadjar in South Kalimantan (from 1950, in Darul Islam from 1954), Kahar Muzakkar, whose guerrillas had been refused entry into the army as units, in South Sulawesi (from 1950, proclaiming the region part of the Islamic State on 7 August 1953), and Daud Beureu’eh in Aceh (from September 1953), angered when Aceh was merged into the province of North Sumatra. For a decade the rebels controlled much of the hill country of West Java at night and taxed, raided and burned villages that would not support them, while army operations also cost many civilian lives. The army gained the upper hand from about 1959–1960 with the pagar betis (“fence of legs”), in which villagers were made to form human cordons that swept the mountains and drove the rebels before the troops. Kartosuwiryo was captured on Mount Geber near Garut on 4 June 1962, sentenced by a military court and executed in September 1962 on an island in the Bay of Jakarta, and the last bands in West Java surrendered that year. Aceh had already been made a special region in 1959, and Daud Beureu’eh came down from the hills under an amnesty in 1962; Ibnu Hadjar surrendered in 1963 and was executed in 1965, and the movement ended in Sulawesi when Kahar Muzakkar was killed by soldiers in Southeast Sulawesi on 3 February 1965."
