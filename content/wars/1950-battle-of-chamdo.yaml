steps:
  - title: The road to Chamdo
    date: January – October 1950
    when: "1950-07-22"
    borders: "1950-10-05"
    countries: [cn]
    body:
      - The People’s Republic made the incorporation of Tibet one of its first aims, and at the end of 1949 Mao Zedong ordered preparations for a march into Tibet. Lhasa sought arms and support from India, Britain and the United States, with little result, and sent envoys to talk to the Chinese through India. In September 1950 China’s envoy set out its terms, that Tibet be regarded as part of China and that China take charge of its defence, trade and foreign relations; Lhasa did not accept them.
      - The PLA’s 18th Army under Zhang Guohua, of the South-West Military Region of Liu Bocheng and Deng Xiaoping, reached Ya’an in February 1950 and Kangding (Dartsedo) in March, building a road as it went, and by the end of July had gathered at Garzê (Kandze), while a cavalry detachment from Qinghai reached Jyekundo (Gyegu) on 22 July, ready to strike from the north. In June a PLA unit seized the Tibetan radio post at Dengko on the Yangtze, which Khampa militia raided in July. On the Tibetan side the governor of Chamdo, Ngabo Ngawang Jigme, had about 8,500 troops and local levies along the river. Many Khampas resented rule from Lhasa, and the Chinese offered some of their leaders favourable terms to stay neutral.
    facts:
