notes:
  - From 1913 to 1950 the Dalai Lama’s government governed central and western Tibet and the part of Kham west of the upper Yangtze itself, with its own army, currency, posts and officials. The Republic of China and then the People’s Republic regarded Tibet as part of China, and no major state recognised it as independent. The Tibetan government in exile holds that Tibet was an independent state invaded in 1950; the People’s Republic holds that it was always part of China.
  - Casualty figures differ widely. Chinese figures give 114 PLA and 180 Tibetan soldiers killed or wounded, with about 3,000 Tibetans captured; other Chinese accounts give over 5,700 Tibetan troops put out of action, and the Peace Research Institute Oslo estimates about 2,000 deaths on each side, including civilians.
  - The Dalai Lama later said he had accepted the Seventeen Point Agreement under pressure, and repudiated it after his flight to India in 1959.
