  - title: The Seventeen Point Agreement
    date: November 1950 – October 1951
    when: "1951-05-23"
    borders: "1951-10-26"
    countries: [cn]
    body:
      - In November 1950 the Tibetan government appealed to the United Nations. El Salvador asked for the appeal to be placed on the agenda of the General Assembly, but on 24 November its General Committee postponed the question, with Britain and India urging a peaceful settlement. In Lhasa the Dalai Lama, then 15, was given full powers, and in December he moved to Dromo (Yadong), near the border with Sikkim, ready to leave the country.
      - In the spring of 1951 a Tibetan delegation led by Ngabo went to Beijing, where on 23 May it signed the Agreement on Measures for the Peaceful Liberation of Tibet, known as the Seventeen Point Agreement. Tibet was to “return to the big family of the motherland”, the PLA was to enter Tibet, and Beijing was to handle its foreign affairs, while the Dalai Lama’s position and the existing political system were not to be changed. Tibetan accounts say the delegates had not been authorised to sign a final agreement and signed under threat of a further advance.
      - The Dalai Lama returned to Lhasa in the summer of 1951, and after debate in Tibet’s National Assembly he accepted the agreement in a telegram to Mao on 24 October 1951. PLA advance units had reached Lhasa in September, and the main force under Zhang Guohua entered the city on 26 October 1951. The Dalai Lama’s government continued to run central Tibet alongside a growing Chinese administration until 1959.
    facts:
      - [Tibet’s appeal to the UN postponed, "24 November 1950"]
      - [Seventeen Point Agreement signed, "23 May 1951, Beijing"]
      - [Dalai Lama accepts the agreement, "24 October 1951"]
      - [PLA main force enters Lhasa, "26 October 1951"]
