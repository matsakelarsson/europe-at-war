  - title: The fall of Chamdo
    date: 6–24 October 1950
    when: "1950-10-19"
    borders: "1950-10-24"
    countries: [cn]
    body:
      - On 6–7 October 1950 the PLA crossed the upper Yangtze at five places. The main force of the 18th Army struck west towards Chamdo, other columns moved on the south, and the Qinghai cavalry swung round to the north and west to cut the roads to Lhasa. Some Tibetan units fought, but the Tibetan army was outnumbered, and many local Khampas gave it little help.
      - Two PLA units entered Chamdo on 19 October, and Ngabo surrendered with about 2,700 men; the PLA released most of its prisoners after lectures on socialism and a small payment. All operations ended on 24 October. The PLA did not advance further; it sent its terms to Lhasa through Ngabo, while Chinese troops occupied the whole of the Chamdo region.
