id: battle-of-chamdo
name: Battle of Chamdo
start: "1950-10-06"
end: "1951-10-26"
tier: B
summary: "The People’s Liberation Army’s campaign of October 1950 against the Tibetan army at Chamdo, in eastern Tibet, and the incorporation of Tibet into the People’s Republic of China that followed. After failed talks, between 20,000 and 30,000 PLA troops of the 18th Army and a cavalry force from Qinghai crossed the upper Yangtze (Drichu) on 6–7 October 1950 and in less than two weeks surrounded the Tibetan army in Kham; its commander, the governor Ngabo Ngawang Jigme, surrendered with about 2,700 men after Chamdo fell on 19 October. The PLA halted there and offered talks. Tibet’s appeal to the United Nations was shelved, and on 23 May 1951 a Tibetan delegation led by Ngabo signed the Seventeen Point Agreement in Beijing, accepting that Tibet was part of China while keeping the Dalai Lama’s government in place. The Dalai Lama accepted it in October 1951, and the PLA entered Lhasa. The People’s Republic calls these events the “peaceful liberation of Tibet”; the Tibetan government in exile calls them an invasion and the start of an occupation."
countries: [cn]
sides:
