id: hainan-island-campaign
name: Battle of Hainan Island
start: "1950-03"
end: "1950-05-01"
tier: C
summary: "The People’s Liberation Army’s capture of Hainan Island from the Republic of China in the spring of 1950, at the end of the Chinese Civil War. The Nationalist general Xue Yue held the coast with forces estimated at 100,000 to 200,000 troops and militia, with about 50 ships and 25 aircraft, while communist guerrillas of the Qiongya Column under Feng Baiju, allied with the Indigenous Hlai, controlled much of the interior. The 40th and 43rd Armies of Deng Hua’s 15th Corps trained for months on the Leizhou peninsula and, from late February and March, slipped small forces across the Qiongzhou Strait in junks to join the guerrillas. On the night of 16 April about 300 junks carried the main force across; it landed on the north-west coast, around Lingao, and took Haikou on 23 April. The defence collapsed, the ROC evacuated about 70,000 troops and civilians to Taiwan, Sanya and Yulin in the south fell within a week, and the PRC declared the island taken on 1 May; the ROC announced its withdrawal the next day. The PLA lost about 4,000 men, most of them during the crossing."
