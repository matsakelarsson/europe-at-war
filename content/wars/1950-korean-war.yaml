  - title: Seoul lost and retaken
    date: January – April 1951
    when: "1951-01-04"
    borders: "1951-03-15"
    countries: [kr, cn, us, fr]
    body:
      - The Chinese and North Koreans attacked across the parallel on New Year’s Eve, and UN forces abandoned Seoul on 4 January 1951, most of its people fleeing across the frozen Han. The offensive stopped in late January along a line from Pyeongtaek through Wonju to Samcheok. Ridgway restored the morale of the Eighth Army and began a series of slow, methodical advances meant to kill Chinese soldiers rather than to take ground. A Chinese counter-attack in February was halted at Chipyong-ni, where the US 23rd Infantry Regiment and a French battalion held out surrounded for three days, and Seoul was retaken without a fight on 14–15 March, the fourth time it had changed hands. By the end of March the UN forces were back at the 38th parallel.
      - Behind the lines, the South Korean army fought communist guerrillas in the mountains of the south. From 9 to 11 February 1951 soldiers of the 11th Division killed 719 people, among them 385 children, in villages of Sinwon-myeon in Geochang county, accusing them of helping the guerrillas; two days earlier the division had killed hundreds in Sancheong and Hamyang. The government tried to hide the killings, and a National Assembly investigation team was fired on by soldiers posing as guerrillas.
      - In April Truman dismissed MacArthur, who had publicly called for attacks on China and for Chiang Kai-shek’s troops in Taiwan to join the war. Ridgway replaced him on 11 April, and Lieutenant General James Van Fleet took over the Eighth Army.
    facts:
      - [Seoul lost, "4 January 1951"]
      - [Chipyong-ni, "13–15 February 1951"]
      - [Geochang massacre, "9–11 February 1951, 719 killed"]
      - [Seoul retaken, "14–15 March 1951"]
      - [MacArthur dismissed, "11 April 1951"]
