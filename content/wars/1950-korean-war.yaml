notes:
  - South Koreans call the war the 6·25 War (Yugio jeonjaeng) after the day it began, North Korea calls it the Fatherland Liberation War, and China the War to Resist America and Aid Korea. Sixteen countries sent combat forces to the UN Command and five sent medical units (Denmark, India, Italy, Norway and Sweden). The Soviet Union sent no ground troops, but Soviet air divisions fought over the Yalu from November 1950 in Chinese and North Korean markings.
  - "How the war began. North Korea has always held that South Korea attacked first, across the parallel near Haeju on 25 June 1950, and that its army struck back. Soviet and Chinese documents opened in the 1990s show that Kim Il-sung planned the invasion and won Stalin’s approval in the spring of 1950 and Mao Zedong’s support in May, and most historians accept that the North began the war. They also stress that it grew out of a civil conflict already under way, with hundreds of clashes along the parallel in 1949, many of them started by South Korean units, and a guerrilla war in the South."
  - The armistice was signed by the commanders of the UN Command, the Korean People’s Army and the Chinese People’s Volunteers; South Korea did not sign it. The Geneva Conference of 1954 failed to agree on a political settlement, and no peace treaty has been concluded. The war is formally not over.
  - "Casualty figures are uncertain. South Korea gives 137,899 military dead and the United States about 36,500 dead in the theatre (33,700 of them in battle); the other UN contingents lost about 3,700. North Korean military dead are estimated at 215,000–317,000, and Chinese at 183,108 (the official figure of 2010) to 400,000 or more. Estimates of civilian deaths in both Koreas range from about 1.5 to 3 million. Soviet losses, mainly airmen, were 299."
