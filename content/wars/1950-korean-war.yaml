  - title: The spring offensives and the Kansas line
    date: April – June 1951
    when: "1951-04-22"
    borders: "1951-06-15"
    countries: [kr, cn, gb, au, ca, us]
    body:
      - On 22 April 1951 the Chinese launched their largest offensive of the war, with some 300,000 or more men, to retake Seoul. On the Imjin River the British 29th Brigade held for three days; its 1st Battalion of the Gloucestershire Regiment was surrounded on a hill near Seolma-ri, and almost all its men were killed or captured. At Gapyeong Australian and Canadian battalions blocked a Chinese advance down the valley. The offensive was halted north of Seoul by the end of April.
      - A second Chinese offensive in mid-May struck farther east and broke through the South Korean III Corps near Hyeon-ri, but it was contained, and in the UN counter-attack that followed the Chinese lost heavily, thousands of them surrendering. By mid-June the UN forces held a line a little north of the 38th parallel in the centre and east, the Kansas line, with outposts on the edge of the Iron Triangle around Cheorwon and Gimhwa. Both sides now accepted that neither could win outright at a cost it was willing to pay, and on 23 June the Soviet ambassador to the UN, Yakov Malik, proposed talks on a ceasefire.
    facts:
      - [Chinese spring offensive, "22–30 April 1951"]
      - [Imjin River and Gapyeong, "22–25 April 1951"]
      - [Second spring offensive, "16–22 May 1951"]
      - [Malik’s ceasefire proposal, "23 June 1951"]
