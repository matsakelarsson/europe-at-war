  - title: Talks and the war for the hills
    date: July 1951 – 1953
    when: "1951-07-10"
    borders: "1952-10-14"
    countries: [kr, kp, cn, us]
    body:
      - Armistice talks opened on 10 July 1951 at Kaesong, then held by the North Koreans, and in October moved to tents at Panmunjom on the line between the armies. In November 1951 the negotiators agreed that the demarcation line would follow the line of contact, but the talks then stuck for more than a year on the return of prisoners. Many of the Chinese and North Korean prisoners held by the UN did not want to go home, and the United States refused to send them back by force; China and North Korea demanded the return of all. In the crowded camps on Geoje Island, communist and anti-communist prisoners fought for control, and in May 1952 communist prisoners seized the American camp commander. Many prisoners died in the riots and their suppression.
      - Meanwhile the front became a line of trenches, bunkers and tunnels much like those of the First World War. Each side fought for hills that would improve its position, in 1951 at Bloody Ridge and Heartbreak Ridge near the Punchbowl, in 1952 at Triangle Hill near Gimhwa, where the Chinese held out in tunnels for six weeks, and at outposts such as Old Baldy, Pork Chop Hill and the Hook. The UN offensive of the autumn of 1951 alone cost about 60,000 casualties for a few kilometres of ground. In December 1952 the UN General Assembly adopted an Indian proposal for a commission of neutral nations to take charge of prisoners who refused to go home, which in the end broke the deadlock.
    facts:
      - [Talks open at Kaesong, "10 July 1951"]
      - [Talks move to Panmunjom, "25 October 1951"]
      - [Heartbreak Ridge, "September – October 1951"]
      - [Triangle Hill, "14 October – 25 November 1952"]
      - [UN General Assembly Resolution 610, "3 December 1952"]
