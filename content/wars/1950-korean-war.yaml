  - title: The retreat to the south
    date: 29 June – July 1950
    when: "1950-07-05"
    borders: "1950-07-20"
    countries: [kr, us]
    body:
      - From Seoul the main North Korean force pushed south along the road and railway towards Suwon, Cheonan and Daejeon, while other divisions advanced through the central mountains and down the east coast. Within a week the South Korean army had fewer than 22,000 of its 95,000 men under command; it was rebuilt from stragglers as it fell back. On 7 July the Security Council created a unified command under the United Nations flag, headed by General Douglas MacArthur in Tokyo, and on 14 July Rhee placed the South Korean forces under his command.
      - The first American ground troops, Task Force Smith of the 24th Infantry Division, some 540 men flown in from Japan, met North Korean tanks north of Osan on 5 July and were scattered within hours. The division fought a series of delaying actions back to Daejeon, which fell on 20 July after a battle in which its commander, Major General William Dean, was cut off; he was captured a month later. Meanwhile a North Korean division swept round through the south-west, taking Gwangju and Mokpo and turning east towards Jinju, and by the end of July the American and South Korean forces were falling back behind the Naktong River.
    facts:
      - [Task Force Smith at Osan, "5 July 1950"]
      - [UN Command created (Resolution 84), "7 July 1950"]
      - [Daejeon taken, "20 July 1950"]
