  - title: Incheon and the recapture of Seoul
    date: 15–29 September 1950
    when: "1950-09-15"
    borders: "1950-09-28"
    countries: [kr, us]
    body:
      - MacArthur planned a landing far behind the North Korean lines at Incheon, the port of Seoul, against the doubts of the US Navy and the Joint Chiefs of Staff about its great tides, narrow channel and sea walls. On 15 September 1950 US Marines took the island of Wolmido on the morning tide and landed against the sea walls of the city on the evening tide. The X Corps, with the 1st Marine and 7th Infantry Divisions and South Korean marines, took Gimpo airfield and crossed the Han. Seoul was taken in a week of street fighting that destroyed much of the city, and on 29 September MacArthur handed it back to Rhee.
      - On 16 September the Eighth Army attacked out of the perimeter. The North Korean army, cut off from its supplies, broke up; some units fled north through the mountains and others stayed behind as guerrillas, and on 26 September troops from the perimeter met the 7th Division near Osan. Only some 25,000–30,000 North Korean soldiers are thought to have made their way back north. As they withdrew, North Korean troops and security forces killed prisoners in Daejeon, Seoul and other towns.
    facts:
      - [Landing at Incheon, "15 September 1950"]
      - [Breakout from the perimeter, "16 September 1950"]
      - [Seoul retaken, "28 September 1950"]
