  - title: Across the 38th parallel
    date: October – November 1950
    when: "1950-10-01"
    borders: "1950-11-24"
    countries: [kp, cn, kr, us]
    body:
      - South Korean troops crossed the 38th parallel on the east coast on 1 October 1950, and on 7 October the UN General Assembly called for a unified, independent and democratic Korea, which Washington took as authority to occupy the North. China had warned through India that it would intervene if American troops crossed the parallel. South Korean troops took Wonsan on 10 October and the Eighth Army entered Pyongyang on 19 October; on 26 October, the day the X Corps landed at Wonsan, a South Korean regiment reached the Yalu River at Chosan. Some 135,000 North Korean soldiers were taken prisoner, and the North Korean government withdrew to the mountains near the Chinese border.
      - On 19 October the first armies of the Chinese People’s Volunteers under Peng Dehuai crossed the Yalu at night. Their first offensive, from 25 October, mauled South Korean divisions and the US 8th Cavalry Regiment at Unsan and then broke off on 6 November. MacArthur judged the Chinese force to be small and on 24 November ordered a final advance to the border, which he hoped would end the war by Christmas. US troops had already reached the Yalu at Hyesanjin on 21 November, and South Korean troops were approaching Chongjin in the north-east.
      - In the occupied North, South Korean police and army units, anti-communist youth groups and local security units (chiandae) hunted down members of the Workers’ Party and their families, while the retreating communists killed prisoners and anti-communists. In Sinchon county in Hwanghae many thousands were killed between 17 October and 7 December 1950. North Korea says that American troops killed 35,383 people there and has made the site a museum of American war atrocities. Most researchers outside North Korea, among them the novelist Hwang Sok-yong, who drew on survivors’ accounts for his novel The Guest, attribute the killings mainly to Korean right-wing security units and to reprisals on both sides, rather than to American troops.
    facts:
      - [38th parallel crossed, "1 October 1950 (South Korean troops)"]
      - [Pyongyang taken, "19 October 1950"]
      - [Chinese troops cross the Yalu, "19 October 1950"]
      - [Sinchon killings, "17 October – 7 December 1950"]
