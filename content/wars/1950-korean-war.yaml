  - title: Killings behind the lines
    date: June – September 1950
    when: "1950-06-28"
    borders: "1950-08-01"
    countries: [kr, us]
    body:
      - From the first days of the war, the South Korean authorities killed people they suspected of siding with the North. On orders from the top of the government, military police, the army’s counter-intelligence corps and the police shot political prisoners and members of the Bodo League, a state organisation into which some 300,000 former leftists and many others had been enrolled, as the front came near. The killings began at Hoengseong on 28 June and spread across the South. In the valley of Golryeong-gol at Sannae, near Daejeon, an estimated 4,000–7,000 prisoners were shot in late June and July, some of it photographed by American officers. The Truth and Reconciliation Commission verified 4,934 victims by name; historians estimate that between 60,000 and 200,000 people were killed in the summer of 1950. The killings were kept secret for four decades.
      - American troops also killed refugees, fearing that North Korean soldiers were hidden among them. From 26 to 29 July, near the village of Nogeun-ri, aircraft strafed a column of refugees and soldiers of the US 7th Cavalry Regiment fired on those sheltering under a railway bridge. Estimates of the dead range from 163 dead or missing, the number a South Korean government committee confirmed by name in 2005, to about 400 given by survivors. After the killings were reported by the Associated Press in 1999, the US Army acknowledged them but found no order to shoot, and President Bill Clinton expressed regret in 2001.
      - In the areas it occupied, the North Korean side carried out its own killings. On 28 June North Korean soldiers killed an estimated 700–900 patients, wounded soldiers and staff at the Seoul National University Hospital. People’s committees and security units held public trials of officials, police officers, landowners and Christians, and tens of thousands of South Koreans were taken north or forced into the army. On 17 August soldiers of the KPA shot 41 captured Americans on Hill 303 above Waegwan. The Truth and Reconciliation Commission found that at least 129,000 South Korean civilians were killed by North Korean forces during the war. Of the wartime massacres it was asked to investigate, about 82 percent had been committed by South Korean forces and 18 percent by North Korean forces.
    facts:
      - [Bodo League killings, "from 28 June 1950, an estimated 60,000–200,000 dead"]
      - [Nogeun-ri, "26–29 July 1950, 163 to about 400 dead"]
      - [Seoul National University Hospital, "28 June 1950, an estimated 700–900 dead"]
    markers:
