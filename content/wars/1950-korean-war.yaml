steps:
  - title: The attack of 25 June
    date: 25–28 June 1950
    when: "1950-06-25"
    borders: "1950-06-25"
    countries: [kr, kp, us]
    body:
      - Korea had been divided at the 38th parallel since 1945, when the United States and the Soviet Union split the occupation of the Japanese colony between them. In 1948 two states were proclaimed, the Republic of Korea under Syngman Rhee in the South and the Democratic People’s Republic of Korea under Kim Il-sung in the North, each claiming the whole peninsula, and the occupying troops withdrew by mid-1949. Through 1949 the two armies fought hundreds of clashes along the parallel, some of them battles of several battalions on the Ongjin peninsula and around Kaesong, while communist guerrillas fought in the mountains of the South.
      - Kim Il-sung won Stalin’s approval for an invasion in the spring of 1950 and Mao Zedong’s in May, and Soviet advisers helped draw up the plan. Before dawn on 25 June 1950, from about 4 a.m., the Korean People’s Army attacked along the whole parallel with seven divisions and some 150 T-34 tanks, and landed troops on the east coast. The South Korean army, about 95,000 men without tanks and with few anti-tank weapons, gave way. North Korea announced that the South had attacked first and that its army was striking back, which it still maintains.
      - The UN Security Council, which the Soviet Union was boycotting over China’s seat, called on 25 June for North Korea to withdraw, and on 27 June asked member states to help South Korea; President Harry Truman ordered American air and naval forces into action the same day. North Korean tanks entered Seoul on 28 June. In the early hours, as the government fled south, the South Korean army blew up the Han River bridge while it was crowded with refugees and soldiers, killing hundreds of them and leaving much of its own army stranded north of the river.
    facts:
      - [North Korean attack, "25 June 1950, about 4 a.m."]
      - [UN Security Council resolutions 82 and 83, "25 and 27 June 1950"]
      - [Seoul taken, "28 June 1950"]
