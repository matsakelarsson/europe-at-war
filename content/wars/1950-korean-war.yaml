  - title: The bombing of the North
    date: 1950–1953
    when: "1952-06-23"
    borders: "1952-06-23"
    countries: [kp, us, cn, ru]
    body:
      - UN aircraft, overwhelmingly American, controlled the air over Korea almost completely, although from November 1950 Soviet pilots flying MiG-15s in Chinese and North Korean markings contested the area along the Yalu that American pilots called MiG Alley. After the Chinese entered the war, MacArthur authorised the burning of North Korean towns near the border. On 5 November 1950 B-29s destroyed most of Kanggye, and on 8 November they dropped incendiaries on Sinuiju. During the war the United States dropped some 635,000 tons of bombs and 32,557 tons of napalm in Korea, mostly on the North, more than it had dropped in the whole Pacific war against Japan.
      - As the armistice talks dragged on, bombing was used to put pressure on the North. Pyongyang was attacked again and again. In June 1952 aircraft struck the hydroelectric plants on the Yalu, among them the great dam at Supung, and in May 1953 they breached the irrigation dams at Toksan and Chasan, flooding farmland and rice fields; the Toksan flood destroyed 700 buildings in Pyongyang. A US Air Force survey after the war found that 18 of the North’s 22 major cities had been at least half destroyed, Pyongyang to 75 percent. North Koreans moved factories, schools and homes underground. A Soviet estimate gave 282,000 people killed by the bombing.
      - The UN navies blockaded the North’s coasts and shelled its ports. The siege of Wonsan, from February 1951 to the armistice, lasted 861 days.
    facts:
      - [Bombs dropped, "about 635,000 tons, and 32,557 tons of napalm"]
      - [Supung and the Yalu power plants, "23–24 June 1952"]
      - [Toksan dam, "13 May 1953"]
      - [Pyongyang destroyed, "75 percent (US Air Force estimate)"]
