  - title: The Pusan Perimeter
    date: August – mid-September 1950
    when: "1950-08-04"
    borders: "1950-09-01"
    countries: [kr, us, gb]
    body:
      - By early August the US Eighth Army under Lieutenant General Walton Walker and the South Korean army held an area about 160 km from north to south and 80 km across in the south-east, bounded by the Naktong River in the west and the mountains north of Daegu and Pohang, with the port of Busan at its back. Walker used the short interior lines to move his reserves from one threatened point to the next, while reinforcements, tanks and supplies arrived through Busan; the first British brigade landed at the end of August. By September the UN forces outnumbered the North Koreans, whose supply lines were long and under constant air attack.
      - The North Koreans attacked again and again through August and early September, across the Naktong at the bulge west of Yongsan, down the valley towards Daegu at Tabu-dong, from the west towards Masan and along the east coast, where they briefly took Pohang. Their last offensive, from 31 August, broke through in several places and came within a few kilometres of Daegu, but the line held. The battles of the perimeter cost both sides tens of thousands of casualties. The South Korean government moved to Busan on 18 August, and it and Daegu filled with refugees.
    facts:
      - [Perimeter formed, "4 August 1950"]
      - [Last North Korean offensive, "31 August – mid-September 1950"]
      - [Busan the provisional capital, "18 August 1950 – 1953"]
