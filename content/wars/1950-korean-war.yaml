id: korean-war
name: Korean War
start: "1950-06-25"
end: "1953-07-27"
tier: A
summary: "The war between North Korea, backed by China and the Soviet Union, and South Korea, backed by the United States and a United Nations Command of sixteen countries. On 25 June 1950 the North Korean army crossed the 38th parallel, the line along which the Soviet Union and the United States had divided Korea in 1945, and within six weeks it had pressed the South Korean and American forces into a perimeter around Busan. The landing at Incheon in September turned the war. UN forces crossed the parallel and drove towards the Chinese border, until Chinese armies entered the war in October and November and pushed them back south of Seoul. From mid-1951 the front settled near the parallel, and two years of armistice talks, deadlocked over the return of prisoners, went on alongside costly fighting for hills and a bombing campaign that destroyed most of the North’s towns. Both sides killed large numbers of civilians they suspected of supporting the other. The armistice of 27 July 1953 ended the fighting and created the Demilitarized Zone, but no peace treaty has ever been signed, and the war has formally never ended. Perhaps 3 million Koreans died, most of them civilians, along with some 180,000–400,000 Chinese and about 36,500 Americans."
countries: [kr, kp, cn, us, ru, gb, ca, tr, au, ph, nz, th, et, gr, fr, co, be, za, nl, lu]
