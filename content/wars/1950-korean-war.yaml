  - title: The armistice
    date: June – July 1953
    when: "1953-07-27"
    borders: "1953-07-27"
    countries: [kr, kp, cn, us]
    body:
      - After Stalin’s death in March 1953 the new Soviet leaders and China pressed for an end, and in June the negotiators settled the question of the prisoners. Syngman Rhee, who opposed any armistice that left Korea divided, tried to wreck the agreement, and on 18 June South Korean guards released some 27,000 anti-communist North Korean prisoners from the camps. The Chinese answered with a last offensive on 13 July against the Kumsong salient, held mainly by South Korean divisions, and pushed the line back several kilometres before they were stopped.
      - The armistice was signed at Panmunjom at 10 a.m. on 27 July 1953 by Lieutenant General William Harrison for the UN Command and General Nam Il for the Korean People’s Army and the Chinese People’s Volunteers, and countersigned by General Mark Clark, Kim Il-sung and Peng Dehuai. The fighting stopped at 10 p.m. A military demarcation line along the front, with a demilitarised zone 2 km deep on each side of it, replaced the 38th parallel; the South gained ground in the east and the North in the west around Kaesong. South Korea did not sign. In the exchanges that followed, some 75,000 North Korean and Chinese prisoners and 12,700 UN prisoners went home, and about 22,000 who refused, most of them Chinese, went elsewhere, mainly to Taiwan.
      - No peace treaty followed. A conference in Geneva in 1954 failed to agree on a settlement, and the armistice, a ceasefire between military commanders, remains the only agreement ending the fighting; the war has formally never ended. Perhaps 3 million Koreans had died, most of them civilians, and millions had lost their homes or been separated from their families by the new line.
    facts:
      - [Prisoners released by Rhee, "18 June 1953, some 27,000"]
      - [Kumsong offensive, "13–20 July 1953"]
      - [Armistice signed, "27 July 1953, 10 a.m."]
      - [Peace treaty, "none"]
