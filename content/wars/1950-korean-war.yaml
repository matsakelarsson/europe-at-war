  - title: The Chinese counter-offensive and Chosin
    date: 25 November – 24 December 1950
    when: "1950-11-25"
    borders: "1950-12-24"
    countries: [kp, cn, us, kr]
    body:
      - The Chinese opened their second offensive on the night of 25 November with some 300,000 men. In the west they broke the South Korean II Corps on the Eighth Army’s right flank and fell on the US 2nd Infantry Division as it withdrew south from Kunu-ri on 30 November along a road lined with Chinese troops; the division lost thousands of men. The Eighth Army retreated more than 200 km, abandoning Pyongyang on 5 December, and by the middle of the month it stood near the 38th parallel.
      - In the north-east, Chinese armies surrounded the 1st Marine Division and units of the 7th Infantry Division at the Chosin (Changjin) Reservoir on the night of 27 November, in temperatures down to −30 °C. The Marines fought their way out from Yudam-ni to Hagaru-ri and down the mountain road to the coast over two weeks, while an army task force on the east side of the reservoir was destroyed. The Chinese Ninth Army Group took the area but lost tens of thousands of men in battle and to frostbite, and needed months to recover.
      - From 15 to 24 December the X Corps was evacuated by sea from Hungnam, about 105,000 troops with their vehicles, together with some 98,000 civilians who wanted to leave the North; one freighter, the Meredith Victory, carried 14,000 refugees. The port was blown up on 24 December. Walker had been killed in a road accident on 23 December, and Lieutenant General Matthew Ridgway took over the Eighth Army.
    facts:
      - [Chinese second offensive, "from 25 November 1950"]
      - [Pyongyang abandoned, "5 December 1950"]
      - [Chosin Reservoir, "27 November – 13 December 1950"]
      - [Hungnam evacuation, "15–24 December 1950, about 105,000 troops and 98,000 civilians"]
