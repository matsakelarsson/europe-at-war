id: kuomintang-islamic-insurgency
name: Kuomintang Islamic insurgency
start: "1950"
end: "1958"
tier: C
summary: "Armed resistance to the People’s Republic in north-west China after 1949 by remnants of the Nationalist armies of the Hui Ma clique, by Kazakh fighters and by other anti-communist groups, in Gansu, Qinghai, Ningxia and Xinjiang. When the PLA took the north-west in 1949, the Ma clique’s leaders Ma Bufang and Ma Hongkui left China and the Nationalist commanders in Xinjiang declared for the Communists, but some officers took to the mountains. The ROC government on Taiwan sent agents and gave them ranks and commands, and the CIA dropped arms, radios and gold to one of them, Ma Liang. In Xinjiang the Kazakh leader Ospan Batyr (Osman Batur) and Yulbars Khan, the former chancellor of Kumul, fought the PLA in 1950. Yulbars Khan escaped through Tibet and India to Taiwan, where he served as the ROC’s governor of Xinjiang in exile; Ospan was captured in Qinghai and executed at Ürümqi on 29 April 1951, and many of his followers fled across Tibet and the Himalayas and were later resettled in Turkey. In Qinghai and Gansu Ma Yuanxiang was killed in battle in Tongde county on 16 May 1953, and Ma Hushan, the former ruler of southern Xinjiang, was captured and executed at Lanzhou in 1954. The main bands had been destroyed by the mid-1950s; some sources date the last fighting to 1958, when revolts broke out among the Tibetans and Hui of Amdo."
