id: nepalese-revolution-of-1951
name: Nepalese revolution of 1950–1951
start: "1950-11-06"
end: "1951-02-18"
tier: C
summary: "The rising that ended the rule of the Rana family, hereditary prime ministers who had governed Nepal since 1846 while the Shah kings were kept as figureheads. On 6 November 1950 King Tribhuvan took refuge in the Indian embassy in Kathmandu and was flown to Delhi four days later; the Ranas declared his three-year-old grandson Gyanendra king. On 11 November the Liberation Army of the Nepali Congress, formed in India by B. P. Koirala and others, attacked from across the Indian border and took Birgunj, and fighting spread to the Terai towns and the hills of the east and west, where some local garrisons and officials went over to the rebels. Under Indian pressure the Rana prime minister, Mohan Shumsher, accepted a settlement negotiated in Delhi. Tribhuvan returned to Kathmandu on 15 February 1951 and on 18 February proclaimed a new order under a coalition of Ranas and the Nepali Congress, with elections promised."
countries: [np, in]
