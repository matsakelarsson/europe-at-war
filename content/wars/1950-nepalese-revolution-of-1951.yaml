notes:
  - India, which feared instability on its border after the Chinese entry into Tibet in 1950, sheltered the king and the Nepali Congress and brokered the Delhi settlement. Nepal marks 18 February as Democracy Day.
  - Casualty figures for the fighting are uncertain; estimates in the sources run to several hundred or more on each side.
