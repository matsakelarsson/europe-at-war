id: puerto-rican-nationalist-revolts
name: Puerto Rican Nationalist revolts of 1950
start: "1950-10-30"
end: "1950-11-10"
tier: C
summary: "Armed risings by the Puerto Rican Nationalist Party of Pedro Albizu Campos, which sought independence from the United States. The party rejected the commonwealth status that Public Law 600, signed by President Harry S. Truman on 3 July 1950, allowed Puerto Ricans to adopt under a constitution of their own, and called it a continuation of colonial rule; it had been under pressure since the Ponce massacre of 1937, and the Gag Law (Ley de la Mordaza) of 1948 made it a crime even to display the Puerto Rican flag. After a police raid at Peñuelas on 29 October, Nationalists rose in several towns on 30 October 1950. In Jayuya, Blanca Canales proclaimed the Republic of Puerto Rico in the town square while her followers burned the police station and post office, and the town was held for some days until the Puerto Rico National Guard retook it after attacks by P-47 fighter-bombers and artillery. In Utuado guardsmen shot nine Nationalists who had surrendered, killing five, and aircraft strafed the town. In San Juan four Nationalists were killed attacking La Fortaleza, the residence of Governor Luis Muñoz Marín, and police and guardsmen besieged the barber Vidal Santiago Díaz in his shop, the Salón Boricua, in a gunfight broadcast live on the radio. There was fighting in Arecibo, Mayagüez, Ponce and Naranjito, where a guerrilla band under José Antonio Negrón held out in the hills until 6 November; Negrón was arrested on 10 November. On 1 November two Nationalists from New York, Oscar Collazo and Griselio Torresola, attacked Blair House in Washington to kill Truman; Torresola and the White House policeman Leslie Coffelt were killed. The risings left 28 dead (16 Nationalists, 7 policemen, a National Guardsman and 4 civilians) and 49 wounded, and hundreds of independence supporters, Albizu Campos among them, were imprisoned. In 1952 about 82 per cent of voters approved the constitution of the Commonwealth (Estado Libre Asociado); the Nationalists rejected the vote, which offered neither independence nor statehood, and in 1954 four of them opened fire in the US House of Representatives, wounding five congressmen."
