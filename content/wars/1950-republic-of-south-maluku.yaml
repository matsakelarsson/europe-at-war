notes:
  - "Losses are uncertain. Indonesian army records give about 2,600 soldiers killed in the campaign of 1950, and other accounts more; estimates of the RMS fighters killed are in the hundreds, and of civilians killed range from about 5,000 to 8,000."
  - "The RMS based its claim on the right of the federal states, under the Round Table agreement, to decide their own status; Indonesia regarded the proclamation as a rebellion within its territory, and no state recognised the RMS. The Netherlands, which had promised the Moluccan soldiers protection, did not support the RMS either."
