id: republic-of-south-maluku
name: Republic of South Maluku
start: "1950-04-25"
end: "1963-12-02"
tier: C
summary: "The attempt to make the southern Moluccas an independent state, and its suppression by Indonesia. Under the Round Table agreement of 1949 Indonesia became a federation, the Republic of the United States of Indonesia, in which the Moluccas belonged to the State of East Indonesia. In 1950 the federal states were rapidly absorbed into a unitary Republic. In Makassar, the capital of East Indonesia, the former colonial army captain Andi Aziz seized the city on 5 April 1950 to stop the landing of Republican troops; he was arrested when he went to Jakarta to negotiate on 14 April, and fighting between former Dutch colonial (KNIL) soldiers and the Indonesian army went on in Makassar into August. On Ambon, where many Christian Ambonese had served in the KNIL and feared their place in a Javanese-dominated republic, former East Indonesian justice minister Chris Soumokil and other leaders, backed by some 1,700 KNIL soldiers stationed there, proclaimed the Republic of South Maluku (Republik Maluku Selatan, RMS) on 25 April 1950, with J. H. Manuhutu as president. Indonesia blockaded the islands, landed on Buru and Seram in July and on Ambon on 28 September 1950, and took the town of Ambon in November after heavy fighting, in which the Indonesian commander Lieutenant Colonel Slamet Riyadi was killed. The RMS government withdrew to Seram and kept up a guerrilla war in its forests until Soumokil was captured there on 2 December 1963; a few fighters held out longer. Soumokil was sentenced to death by a military court and executed in April 1966. In 1951 the Netherlands shipped some 12,500 Moluccan KNIL soldiers and their families to the Netherlands, intending a temporary stay; a government in exile was formed among them, and in the 1970s young Moluccans seized trains, a school and buildings in the Netherlands in protest at Dutch policy."
