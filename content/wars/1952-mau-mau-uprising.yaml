  - title: Villagisation and the end of the forest war
    date: June 1954 – February 1957
    when: "1956-10-21"
    borders: "1956-10-21"
    countries: [ke]
    body:
      - "In June 1954 the colonial War Council ordered the forced resettlement of the Kikuyu, Embu and Meru reserves. Within eighteen months 1,050,899 people had been moved into 804 villages surrounded by spiked trenches, barbed wire and watchtowers and guarded by the Home Guard. Officials called them protected villages; for many inhabitants they were places of curfews, forced communal labour and hunger, and medical officers reported alarming death rates among children, above all in villages run as a collective punishment. At the same time the Swynnerton Plan of 1954 consolidated land holdings, gave titles to farmers and allowed Africans to grow coffee, which rewarded loyalists with land confiscated from detainees and fighters."
      - "Cut off from food and recruits, the forest armies broke up into small bands. An amnesty offered in January 1955 brought in few fighters and was withdrawn in June. Large sweeps through the Aberdares and Mount Kenya forests in 1955 killed or captured hundreds, and the army began to leave the operations to the police and the pseudo-gangs. By the end of 1955 the military campaign was largely over."
      - "Dedan Kimathi, the last major leader still at large, was shot and captured by Ndirangu Mau, a member of the Tribal Police, on the edge of the Aberdare forest near Nyeri on 21 October 1956, after a long hunt led by Ian Henderson. He was tried for possessing a firearm, sentenced to death and hanged at Nairobi Prison (Kamiti) on 18 February 1957, where he was buried in an unmarked grave. Kenya remembers him as the leader of the struggle; a statue of him was unveiled in Nairobi in 2007."
    facts:
      - [People moved into villages, "1,050,899 into 804 villages by late 1955"]
      - [Dedan Kimathi captured, "21 October 1956"]
      - [Kimathi hanged, "18 February 1957"]
      - [Mau Mau suspects hanged during the Emergency, "1,090"]
