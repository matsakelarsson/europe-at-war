steps:
  - title: Land, oaths and the Emergency
    date: 1946 – January 1953
    when: "1952-10-20"
    borders: "1952-10-20"
    countries: [ke, gb]
    body:
      - "Kenya’s colonial government had set aside some 7 million acres of the best land in the central highlands and the Rift Valley, the “White Highlands”, for European settlers. Kikuyu families crowded into reserves in Kiambu, Fort Hall (Murang’a) and Nyeri, and tens of thousands lived as squatters on settler farms, where new rules after 1945 cut their plots and herds and evicted many. Africans had no elected seats in the Legislative Council, had to carry a pass, the kipande, and earned a fraction of European wages. The Kenya African Union (KAU), led from 1947 by Jomo Kenyatta, pressed for land and representation without result, and younger militants in Nairobi, in the trade unions and among the squatters turned to an older Kikuyu practice: the oath. Oaths of unity, given first to squatters at Olenguruone and then to hundreds of thousands of Kikuyu, Embu and Meru, bound people to fight for land and freedom and to keep the movement secret."
      - "From 1950 the colonial authorities banned “Mau Mau” and arrested oath administrators, while killings of chiefs and informers grew. On 7 October 1952 Senior Chief Waruhiu, the most prominent African supporter of the government, was shot dead in his car near Nairobi. The new governor, Sir Evelyn Baring, declared a State of Emergency on 20 October 1952, and in Operation Jock Scott police arrested about 180 alleged leaders that night, Kenyatta among them; a British battalion was flown in from Egypt. Kenyatta and five others, the Kapenguria Six, were tried at the remote town of Kapenguria and sentenced in April 1953 to seven years’ hard labour, at a trial whose chief witness later admitted he had been bribed. Kenyatta had publicly condemned Mau Mau, and historians doubt that he directed it."
      - "The arrests removed the moderate leaders and left the militants in charge. Thousands of young men, many of them evicted squatters and Nairobi workers, went into the forests. Killings of settlers, among them the Ruck family in January 1953, and of African loyalists turned settler opinion towards demands for ruthless measures."
