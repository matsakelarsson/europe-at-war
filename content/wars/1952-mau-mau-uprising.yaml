  - title: Independence and the reckoning
    date: 1963 – 2015
    when: "1963-12-12"
    borders: "1963-12-12"
    countries: [ke, gb]
    body:
      - "Kenya became independent on 12 December 1963 with Jomo Kenyatta as prime minister. Some fighters who had stayed in the forests came out for the independence celebrations; others, led by Field Marshal Musa Mwariama and General Baimungi in the Meru forests, held out for land, and on 28 January 1965 Kenyatta’s government sent the army against them; Baimungi was killed. Kenyatta preached forgiveness and forgetting, and the new government gave little land to former fighters. Mau Mau remained a banned organisation until 2003."
      - "The number of deaths has long been disputed. Officially at least 11,000 Mau Mau were killed, 1,090 men were hanged, which David Anderson calls the largest number of executions anywhere in Britain’s empire in the twentieth century, and Mau Mau killed 1,819 African civilians, 32 European and 26 Asian civilians; 95 British military personnel died. David Anderson estimates that more than 20,000 Mau Mau were killed and that about 5,000 Africans were killed by Mau Mau. Estimates of all deaths caused by the Emergency, including those from hunger and disease in the camps and villages, range from about 25,000 (Anderson) to 50,000 (John Blacker), while Caroline Elkins argued that tens or even hundreds of thousands died."
      - "In 2009 five elderly Kenyans sued the British government for torture in the camps. During the case, thousands of files that had been flown out of Kenya in 1963 were found in a Foreign Office store. On 6 June 2013 the Foreign Secretary, William Hague, told Parliament that Britain “sincerely regrets” that Kenyans had been subjected to torture and ill-treatment by the colonial administration, and the government paid £19.9 million to 5,228 claimants. A memorial to the victims, funded by Britain, was unveiled in Nairobi’s Uhuru Park in September 2015."
    facts:
      - [Independence of Kenya, "12 December 1963"]
      - [Ban on Mau Mau lifted, "2003"]
      - [Settlement of the Mau Mau claims, "6 June 2013, £19.9 million to 5,228 Kenyans"]
      - [Memorial in Uhuru Park, "12 September 2015"]
