notes:
  - "The fighters called themselves the Land and Freedom Army or simply “the forest fighters”; “Mau Mau” was the name used by the colonial government and the press, and its origin is uncertain. The colonial authorities called the war the Emergency. Many Kikuyu fought on the government side in the Home Guard and as chiefs and headmen, and historians such as David Anderson and Daniel Branch describe the conflict as both an anti-colonial war and a civil war among the Kikuyu, Embu and Meru."
  - "Numbers are disputed. Official figures give at least 11,000 Mau Mau killed, 1,819 African civilians killed by Mau Mau (Anderson estimates about 5,000), 32 European and 26 Asian civilians, and 95 British military personnel dead. The demographer John Blacker estimated about 50,000 excess deaths, half of them children under ten, from violence, hunger and disease; Anderson about 25,000; Caroline Elkins argued that between 130,000 and 300,000 Kikuyu were “unaccounted for”, a figure Blacker and others have rejected."
  - Much of the record of the detention camps was destroyed or removed from Kenya in 1963. The removed files, the “migrated archives”, were revealed during the compensation case in 2011 and released at the UK National Archives in 2012–2013.
