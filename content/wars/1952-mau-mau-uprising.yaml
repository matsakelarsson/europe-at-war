  - title: Operation Anvil and the Pipeline
    date: 1954 – 1955
    when: "1954-04-24"
    borders: "1954-04-24"
    countries: [ke, gb]
    body:
      - "Erskine decided to cut the forest armies off from Nairobi, where Mau Mau committees collected money, weapons and recruits. On 24 April 1954 about 25,000 soldiers and police sealed the city in Operation Anvil and searched it sector by sector. Africans were herded into barbed-wire enclosures, and Kikuyu, Embu and Meru were screened, often by hooded informers. In two weeks about 20,000 men were sent to the Langata screening camp and on to detention, and some 30,000 women and children were sent to the reserves. Mau Mau never recovered its urban organisation."
      - "The detainees entered what officials called the Pipeline, a chain of screening centres, detention camps and work camps through which they were to move as they confessed their oaths. Men classed as “hard core” were sent to camps such as Manyani and Mackinnon Road on the railway to Mombasa and to islands in Lake Victoria; women were held at Kamiti. By official figures some 80,000 people were held without trial; Caroline Elkins has estimated between 160,000 and 320,000. Forced labour, beatings and torture were widespread and were later documented in the colonial government’s own files."
      - "In the forests the RAF bombed suspected camps from 1953 to 1955, with Harvard trainers and Avro Lincoln heavy bombers. The capture of General China in January 1954 gave the British detailed intelligence, and his attempt to negotiate a surrender of the forest armies failed in April. Small “pseudo-gangs” of former fighters and loyalists, led by officers such as Ian Henderson and Frank Kitson, hunted the remaining bands."
    facts:
      - [General China captured, "15 January 1954"]
      - [Operation Anvil, "from 24 April 1954, about two weeks"]
      - [Suspects sent to detention from Nairobi, "about 20,000"]
