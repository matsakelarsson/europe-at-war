  - title: Hola and the end of the Emergency
    date: 1959 – 1960
    when: "1959-03-03"
    borders: "1959-03-03"
    countries: [ke, gb]
    body:
      - "By 1959 most detainees had been released, but about a thousand “hard core” prisoners remained in special camps. At Hola, a remote camp on the Tana River, officials put into effect a plan to force detainees who refused to work to do so. On 3 March 1959 guards beat them with clubs; 11 men were killed and dozens more were badly injured. The camp authorities first claimed the men had died from drinking contaminated water. When the truth came out, the killings caused an outcry in Britain; in the House of Commons in July 1959 the Conservative MP Enoch Powell warned that Britain could not have “African standards in Africa” and British standards at home."
      - "Hola helped convince the British government that colonial rule in Kenya could no longer be held by force. At the first Lancaster House conference in London in January 1960, Britain accepted that Kenya would have an African majority in its legislature, and the State of Emergency was lifted on 12 January 1960. The detention camps were closed, the last detainees freed, and in August 1961 Kenyatta was released."
    facts:
      - [Hola massacre, "3 March 1959, 11 detainees killed"]
      - [State of Emergency lifted, "12 January 1960"]
      - [First Lancaster House conference, "January – February 1960"]
      - [Kenyatta released, "August 1961"]
    markers:
