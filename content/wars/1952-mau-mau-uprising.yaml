id: mau-mau-uprising
name: Mau Mau war
start: "1952-10-20"
end: "1960-01-12"
tier: A
summary: "The armed rising of the Kenya Land and Freedom Army, known as Mau Mau, against British colonial rule and the African chiefs and “loyalists” who supported it, and the State of Emergency the British government imposed to defeat it. The rising grew out of the Kikuyu, Embu and Meru peoples’ loss of land to European settlers in the “White Highlands”, the eviction of squatters from settler farms and the failure of peaceful politics; from the late 1940s hundreds of thousands took oaths of unity. After the killing of Senior Chief Waruhiu, Governor Evelyn Baring declared an Emergency on 20 October 1952 and had Jomo Kenyatta and other leaders arrested. Fighters went into the forests of the Aberdares and Mount Kenya under leaders such as Dedan Kimathi and Waruhiu Itote (“General China”). Mau Mau killed loyalists and their families, most notoriously at Lari in March 1953, and 32 European settlers. British and colonial forces, a Kikuyu Home Guard and RAF bombers fought the forest armies; Operation Anvil emptied Nairobi of Kikuyu in 1954, tens of thousands of suspects were held without trial in a system of detention camps known as the Pipeline, where torture was widespread, and more than a million people were forced into fortified villages. Kimathi’s capture in October 1956 ended the forest war, and 1,090 Kenyans were hanged. Official figures counted at least 11,000 Mau Mau killed; estimates of all deaths caused by the Emergency range from about 25,000 to 50,000, and some historians argue for far more. The Emergency ended on 12 January 1960, the year Britain accepted African majority rule; Kenya became independent in 1963. In 2013 the British government paid compensation to 5,228 Kenyans who had been tortured and abused."
countries: [ke, gb]
