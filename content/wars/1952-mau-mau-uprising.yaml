        side: br
        name: Hola
        date: 3 March 1959
        text: Guards beat 11 detainees to death and injured dozens more who had refused to work.
        lonlat: [40.033, -1.500]
      - kind: capital
        side: br
        name: Nairobi
        date: "1960"
        text: The Emergency was lifted on 12 January 1960, as the Lancaster House conference opened the way to African majority rule.
        lonlat: [36.817, -1.286]
