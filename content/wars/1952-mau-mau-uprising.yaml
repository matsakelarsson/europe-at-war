  - title: The forest armies and Lari
    date: 1953
    when: "1953-03-26"
    borders: "1953-03-26"
    countries: [ke]
    body:
      - "The forest fighters gathered in the Aberdare range and on the slopes of Mount Kenya, in bands that grew into loosely organised armies: Dedan Kimathi, a former clerk and teacher, led in the Aberdares and later formed the Kenya Defence Council, while Waruhiu Itote, known as General China, led on Mount Kenya. They had few firearms, mostly homemade or captured, and relied on supplies and recruits from the reserves and from Nairobi. Their attacks, mostly at night, fell on police posts, Home Guard posts and loyalists, the chiefs, headmen and Christians who refused the oath."
      - "On the night of 25–26 March 1953 Mau Mau fighters attacked the loyalist families of Lari, a location on the edge of the Aberdares whose people had been divided by an old land dispute. They set fire to huts and killed those who tried to escape; the official count was 74 dead, most of them women and children, among them the family of the loyalist chief Luka Wakahangara. The same night another band raided Naivasha police station and freed prisoners. In the days after Lari, Home Guard and security forces killed perhaps twice as many people in reprisal, killings the government did not publicise. Lari was used in British propaganda, and 71 men were later hanged for it."
      - "The government armed a Kikuyu Home Guard of loyalists and brought in British battalions alongside the King’s African Rifles and the settler Kenya Regiment. In June 1953 General Sir George Erskine took command. Abuses by the security forces were common; at Chuka in June 1953 a King’s African Rifles company killed some twenty unarmed people, most of them local Home Guards; the soldiers were placed under open arrest but never prosecuted. Prohibited areas were declared along the forest edges, where anyone could be shot on sight."
    facts:
      - [Lari massacre, "night of 25–26 March 1953, 74 killed (official count)"]
      - [Reprisal killings after Lari, "about 150 killed (official estimate)"]
      - [Erskine takes command, "June 1953"]
