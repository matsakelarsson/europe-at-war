notes:
  - "Fellagha, from an Arabic word, was the French name for the Tunisian and Algerian guerrillas; in Tunisia it is now the usual name for the fighters of 1952–1954. Moroccans call the events after Mohammed V’s exile the Revolution of the King and the People. Losses in both countries were not reliably counted."
