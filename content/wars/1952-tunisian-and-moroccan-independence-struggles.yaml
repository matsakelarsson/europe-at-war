id: tunisian-and-moroccan-independence-struggles
name: Armed struggles for Tunisian and Moroccan independence
start: "1952-01-18"
end: "1956-04-07"
tier: C
summary: "The armed phase of the independence movements in the French protectorates of Tunisia and Morocco. In Tunisia the arrest of Habib Bourguiba and other leaders of the Neo-Destour party on 18 January 1952 set off strikes, riots and a harsh French sweep of Cap Bon, and armed bands, the fellaghas, took to the hills of the centre and south. The murder of the trade union leader Farhat Hached on 5 December 1952 by La Main Rouge, a secret group linked to French intelligence, brought protests across North Africa. By 1954 several thousand fellaghas were in the field, and in October 1954 they defeated a French force at Tamerza; after the French prime minister Pierre Mendès France promised internal autonomy in his Carthage speech of 31 July 1954, many of them handed in their arms in late 1954 under an agreement with the French. In Morocco, France deposed Sultan Mohammed V on 20 August 1953 and exiled him to Corsica and Madagascar, which turned the nationalist movement into an urban armed resistance of bombings and assassinations, answered by settler counter-terror. On 20 August 1955 risings at Oued Zem and in the Khouribga mining region killed dozens of Europeans and were followed by reprisals that killed far more Moroccans, and on 1–2 October 1955 the Moroccan Army of Liberation attacked French posts on the edge of the Rif. France brought Mohammed V back on 16 November 1955. Morocco became independent on 2 March 1956, with the Spanish zone following on 7 April, and Tunisia on 20 March 1956; the war in Algeria went on until 1962."
