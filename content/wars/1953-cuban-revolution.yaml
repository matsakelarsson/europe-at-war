  - title: Santa Clara and the fall of Batista
    date: December 1958 – January 1959
    when: "1959-01-01"
    borders: "1959-01-08"
    countries: [cu]
    view: { center: [-79.3, 21.7], size: [1150, 500] }
    link: { href: "#/war/escambray-rebellion", text: The Escambray rebellion }
    body:
      - "In mid-December Guevara’s column and the Directorio took the towns around the Escambray, Fomento, Cabaiguán, Placetas, Remedios and the port of Caibarién, cutting the island’s central highway and railway, while Cienfuegos besieged the garrison of Yaguajay, which held out under Captain Alfredo Abon Lee until 30 December. On 28 December about 300 of Guevara’s men entered Santa Clara, the capital of Las Villas, with the Directorio under Cubela attacking from another direction. On the 29th they derailed an armoured train that Batista had sent with troops and arms, and its men surrendered; with the help of townspeople the rebels took the city’s barracks one by one, and Santa Clara fell on 31 December."
      - "That night Batista told his generals he was leaving and flew from Camp Columbia to the Dominican Republic in the early hours of 1 January 1959, leaving General Cantillo in charge. Castro rejected any military junta and called a general strike, which shut down the country. On 1–2 January the garrison of Santiago gave up without a fight, and Castro proclaimed Manuel Urrutia provisional president there; Morgan’s fighters took Cienfuegos. Guevara and Cienfuegos reached Havana on 2–3 January and took over the fortress of La Cabaña and Camp Columbia unopposed. Castro travelled the length of the island in a victory caravan, cheered by crowds, and entered Havana on 8 January. In the following months revolutionary tribunals tried members of Batista’s army and police, and several hundred were shot, among them some 70 at San Juan Hill near Santiago on 12 January; in February Castro became prime minister."
    facts:
      - [Yaguajay surrenders, "30 December 1958"]
      - [Santa Clara taken, "31 December 1958"]
      - [Batista flees, "1 January 1959"]
      - [Castro enters Havana, "8 January 1959"]
