notes:
  - "How many died is disputed. The figure of 20,000 dead, first published by the magazine Bohemia in January 1959 and long repeated by the revolutionary government, is rejected by many historians as propaganda; the French historian Jeannine Verdès-Leroux judged 2,000 a high maximum, and other estimates, which count the opponents killed by the police and army as well as those killed in the fighting, range from several hundred to a few thousand."
  - "Several opposition groups fought Batista: besides the 26th of July Movement and the Directorio Revolucionario there were the Auténticos of former president Carlos Prío, the Second National Front of the Escambray, which split from the Directorio in 1958, and, late in the war, the communist Popular Socialist Party, which had at first rejected armed struggle. Their rivalries continued after the victory; the rising in the Escambray mountains against Castro’s government from 1959 has its own story."
  - "The United States sold Batista aircraft, tanks and other arms for hemisphere defence and protested when they were used against Cubans; it imposed an arms embargo on 14 March 1958 and in late 1958 tried, without success, to find a third force to replace him."
