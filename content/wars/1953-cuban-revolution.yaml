        lonlat: [-76.943, 20.169]
        lp: t
      - kind: battle
        side: m26
        name: Santo Domingo
        date: late June 1958
        text: In the valley below Castro’s headquarters at La Plata, army columns pushing south from the Estrada Palma sugar mill were ambushed and turned back in late June.
        lonlat: [-76.905, 20.043]
