id: cuban-revolution
name: Cuban Revolution
start: "1953-07-26"
end: "1959-01-08"
tier: A
summary: "The armed struggle that overthrew Fulgencio Batista, who had seized power in Cuba in a coup in March 1952. It began with Fidel Castro’s failed attack on the Moncada Barracks in Santiago de Cuba on 26 July 1953, which gave his 26th of July Movement its name. After prison and exile in Mexico, Castro landed in eastern Cuba from the yacht Granma with 81 men in December 1956; most were killed or captured within days, but the survivors built a guerrilla army in the Sierra Maestra with the help of the peasants there and of an urban underground led by Frank País. In the cities the movement, the students of the Directorio Revolucionario and other groups fought with strikes, sabotage, bombs and assassinations, and Batista’s police and army answered with torture and killings. The United States, which had armed Batista, stopped selling him weapons in March 1958. A general strike called for April 1958 failed, but the army’s summer offensive against the Sierra Maestra, about 12,000 men against some 300 guerrillas, collapsed by August. Rebel columns under Che Guevara and Camilo Cienfuegos then crossed to central Cuba, where with the Directorio Revolucionario they took Santa Clara on 31 December. Batista fled to the Dominican Republic early on 1 January 1959, a general strike called by Castro paralysed resistance, and Castro arrived in Havana on 8 January. The revolutionary government, which Castro soon dominated, tried and executed hundreds of members of Batista’s forces in 1959 and in the following years transformed Cuba into a one-party socialist state allied with the Soviet Union."
countries: [cu]
