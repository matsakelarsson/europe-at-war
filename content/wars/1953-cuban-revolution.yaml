        side: gov
        name: Las Mercedes
        date: 29 July – 8 August 1958
        text: Cantillo’s trap cost the rebels about 70 dead, but a ceasefire let Castro’s men slip back into the mountains, ending the offensive.
        lonlat: [-77.005, 20.067]
        lp: l
