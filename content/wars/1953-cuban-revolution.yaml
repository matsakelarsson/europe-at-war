  - title: The Granma landing and the Sierra Maestra
    date: November 1956 – May 1957
    when: "1957-01-17"
    borders: "1957-01-17"
    countries: [cu]
    view: { center: [-76.75, 20.0], size: [240, 130] }
    body:
      - "On 30 November 1956 Frank País led young members of the movement in a rising in Santiago de Cuba, meant to coincide with the landing; they held parts of the city for a day before the army crushed them. The overloaded Granma arrived two days late, on 2 December, and ran aground in the mangroves near Playa Las Coloradas, west of the Sierra Maestra. Three days later the army surprised the exhausted men in a cane field at Alegría de Pío. Most of the 82 were killed or captured; perhaps twenty survivors, among them Fidel and Raúl Castro, Guevara and Camilo Cienfuegos, found each other with the help of peasants and regrouped at Cinco Palmas in mid-December."
      - "In the mountains the guerrillas lived off the help of the poor peasants and squatters, whom the rural guard had long mistreated, and of supplies sent by País’s underground and by Celia Sánchez. On 17 January 1957 they took the small army post at La Plata on the coast. In February Herbert Matthews of The New York Times interviewed Castro in the Sierra, and his articles told the world, which had been told by the government that Castro was dead, that a rebel army was fighting in Oriente. On 28 May 1957 some 80 guerrillas overran the army garrison at El Uvero on the coast, their first major victory. The army answered by moving peasants out of parts of the Sierra and bombing suspected rebel areas."
    facts:
      - [Rising in Santiago, "30 November 1956"]
      - [Granma landing, "2 December 1956"]
      - [Ambush at Alegría de Pío, "5 December 1956"]
      - [Attack on El Uvero, "28 May 1957"]
