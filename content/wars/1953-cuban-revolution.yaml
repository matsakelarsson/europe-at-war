        polygon: [[-77.30, 19.88], [-77.15, 20.10], [-76.80, 20.15], [-76.45, 20.05], [-76.40, 19.95], [-76.90, 19.88]]
  - title: The April strike and the summer offensive
    date: April – August 1958
    when: "1958-07-21"
    borders: "1958-07-21"
    countries: [cu]
    view: { center: [-76.95, 20.03], size: [120, 90] }
    body:
      - "By early 1958 the Rebel Army controlled much of the Sierra Maestra, broadcast on Radio Rebelde from February and opened new fronts: in March Raúl Castro crossed with a column to the Sierra Cristal in northern Oriente to found the Second Front “Frank País”. The movement’s leaders in the cities then called a general strike for 9 April 1958, but it was poorly prepared, the communists and many unions stayed aloof, and the police crushed it within hours; many of its organisers were killed. The failure shifted power within the movement from the city leaders to Fidel Castro in the Sierra."
      - "In late May Batista sent about 12,000 soldiers, more than half of them new recruits, against the Sierra Maestra in Operation Verano, planned by General Eulogio Cantillo; Castro had about 300 armed men. The army pushed into the mountains from the north and landed troops on the coast, but the guerrillas, who knew the ground and had peasant informants, ambushed the columns on the narrow trails. In late June attacks from the Estrada Palma sugar mill were turned back with heavy losses in the valleys below Castro’s headquarters at La Plata. On 11 July the army landed Battalion 18 at the mouth of the La Plata River; surrounded at El Jigüe, it surrendered on 21 July with about 240 men, whom the rebels handed over to the Red Cross. At Las Mercedes from 29 July Cantillo trapped Castro’s forces, killing about 70, among them René Ramos Latour, but during a ceasefire that Castro proposed on 1 August the guerrillas slipped away, and by 8 August the offensive had failed."
    facts:
      - [Failed general strike, "9 April 1958"]
      - [Operation Verano, "May – August 1958"]
      - [Battalion 18 surrenders at El Jigüe, "21 July 1958"]
    markers:
      - kind: held
        side: gov
