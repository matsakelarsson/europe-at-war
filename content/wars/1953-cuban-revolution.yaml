steps:
  - title: The coup, Moncada and exile
    date: March 1952 – November 1956
    when: "1953-07-26"
    borders: "1953-07-26"
    countries: [cu, mx]
    view: { center: [-87.4, 21.3], size: [2750, 1050] }
    body:
      - "On 10 March 1952, three months before an election he was expected to lose, the former president Fulgencio Batista seized power in a nearly bloodless coup from the army’s headquarters at Camp Columbia in Havana. The constitution of 1940 was suspended. Fidel Castro, a 25-year-old lawyer who had been a candidate for Congress, asked the courts to declare the coup illegal, and when they refused he began to organise an armed group among young members of the Ortodoxo party."
      - "Before dawn on 26 July 1953 about 160 of his followers, driving from a farm at Siboney, attacked the Moncada Barracks in Santiago de Cuba, the second largest in the country, and the barracks at Bayamo, hoping to seize arms and spark a rising in Oriente. Both attacks failed within hours. Nineteen soldiers and policemen were killed. Nine rebels died in the fighting, but many more, between about 40 and 56 by different counts, were tortured and killed after they were captured, among them Castro’s deputy Abel Santamaría. At his trial in October Castro defended himself in a speech that ended “History will absolve me”; he was sentenced to fifteen years and imprisoned on the Isle of Pines."
      - "Under public pressure Batista, elected unopposed in 1954, amnestied political prisoners in May 1955. Castro went into exile in Mexico, named his movement after the date of the attack, and trained a small force with the help of the Spanish Civil War veteran Alberto Bayo; there he met the Argentine doctor Ernesto “Che” Guevara. In Havana the university students’ federation under José Antonio Echeverría founded the Directorio Revolucionario, which agreed with Castro in the Pact of Mexico of August 1956 to coordinate their struggle. On 25 November 1956 Castro sailed from Tuxpan with 81 men in the small yacht Granma, built for a dozen passengers."
    facts:
      - [Batista’s coup, "10 March 1952"]
      - [Moncada attack, "26 July 1953"]
      - [Amnesty, "15 May 1955"]
      - [Granma sails from Tuxpan, "25 November 1956"]
