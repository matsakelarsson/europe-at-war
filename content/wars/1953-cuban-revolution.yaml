  - title: The columns march west
    date: August – December 1958
    when: "1958-12-01"
    borders: "1958-12-01"
    countries: [cu]
    view: { center: [-77.7, 21.15], size: [620, 340] }
    body:
      - "After the offensive Castro sent two columns west to carry the war out of Oriente: Column 2 under Camilo Cienfuegos left on 21 August and Column 8 under Guevara on 31 August, together some 230 men. For six weeks they marched across the plains and swamps of Camagüey, harried by aircraft and short of food, and reached Las Villas province in October, where Guevara set up his base in the Escambray mountains and Cienfuegos in the north. There Guevara found rival groups: the Directorio Revolucionario, the Second National Front of the Escambray under Eloy Gutiérrez Menoyo and the American William Morgan, and communist fighters. On 1 December at El Pedrero he and Rolando Cubela of the Directorio signed a pact to fight together."
      - "In the east Raúl Castro’s Second Front held much of the Sierra Cristal, set up schools, clinics and a civil administration, and in June and July kidnapped about 50 US citizens, among them sailors and marines from the Guantánamo base, to stop the bombing of rebel areas with US-supplied arms; they were released after talks with the US consul. Batista held elections on 3 November 1958 amid abstention and fraud, won by his candidate Andrés Rivero Agüero, but they settled nothing; the United States declined to back the result. From 20 November Fidel Castro’s forces besieged Guisa, near the army’s headquarters at Bayamo, and took it on 30 November after beating off relief columns with tanks; one after another the towns of Oriente fell to the rebels in December."
    facts:
      - [Columns leave the Sierra Maestra, "21 and 31 August 1958"]
      - [Pact of El Pedrero, "1 December 1958"]
      - [Guisa taken, "30 November 1958"]
