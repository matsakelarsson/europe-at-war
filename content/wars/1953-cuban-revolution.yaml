  - title: Palace, streets and barracks
    date: March – September 1957
    when: "1957-07-30"
    borders: "1957-07-30"
    countries: [cu]
    view: { center: [-79.3, 21.7], size: [1150, 500] }
    body:
      - "On 13 March 1957 about 50 members of the Directorio Revolucionario stormed the Presidential Palace in Havana to kill Batista, while Echeverría seized the Radio Reloj station to announce his death. The attackers reached the third floor but did not find Batista, and many of them were killed; Echeverría was shot dead by police after leaving the radio station. On 20 April police under Esteban Ventura Novo killed four survivors of the attack, unarmed, in an apartment at Humboldt 7 in Havana after an informer betrayed them. The Directorio, renamed after the date of the attack, later opened a guerrilla front in the Escambray mountains of central Cuba."
      - "The underground of the 26th of July Movement, led from Santiago by Frank País, organised sabotage and supplies and sent recruits to the Sierra. Police in Santiago killed his younger brother Josué on 30 June and País himself on 30 July 1957, shooting him in a street after his arrest; his funeral turned into a spontaneous general strike in Santiago that spread to other towns of Oriente. On 5 September junior naval officers allied with the movement seized the naval base at Cienfuegos and armed townspeople; the army retook the city with tanks and US-supplied B-26 bombers, and many of the rebels were killed after they surrendered. Bodies of young men killed by the police were left in the streets of the cities as a warning."
    facts:
      - [Attack on the Presidential Palace, "13 March 1957"]
      - [Death of Frank País, "30 July 1957"]
      - [Cienfuegos naval rising, "5 September 1957"]
    markers:
      - kind: battle
        side: gov
        name: Presidential Palace, Havana
        date: 13 March 1957
        text: The Directorio Revolucionario’s attack failed; José Antonio Echeverría and many of the attackers were killed. On 20 April police killed four survivors in a flat at Humboldt 7.
        lonlat: [-82.357, 23.142]
      - kind: toll
        side: gov
        name: Santiago de Cuba
        date: 30 July 1957
        text: Police killed Frank País, leader of the movement’s urban underground; a general strike followed his funeral.
        lonlat: [-75.829, 20.022]
        lp: b
      - kind: battle
        side: gov
        name: Cienfuegos
        date: 5 September 1957
        text: Naval officers and members of the movement held the city for a day before the army retook it with tanks and bombers; dozens of rebels were killed after surrendering.
        lonlat: [-80.436, 22.146]
        lp: b
