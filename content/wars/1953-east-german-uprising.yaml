id: east-german-uprising
name: East German uprising of 1953
start: "1953-06-16"
end: "1953-06-17"
tier: C
summary: A wave of strikes and protests across East Germany. It began on 16 June 1953, when construction workers on East Berlin’s Stalinallee struck against a compulsory 10 per cent rise in work quotas, and on 17 June more than a million people in some 700 towns and villages joined strikes and demonstrations, many of them demanding free elections and the government’s resignation. Soviet forces declared martial law and put the rising down with tanks, helped by the East German police. At least 55 people were killed, and some estimates are well over 100. Up to 10,000 people were detained, and Soviet and East German courts passed death sentences. West Germany made 17 June a national holiday, the Day of German Unity, until reunification in 1990.
countries: [de]
