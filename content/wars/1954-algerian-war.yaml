        text: French bombers struck this Tunisian village, said to shelter the ALN, on market day. Over 70 people were killed, among them 12 children in the school.
        lonlat: [8.356, 36.224]
      - kind: battle
        side: fr
        name: Souk Ahras
        date: April – May 1958
        text: The largest ALN attempt to break through the Morice Line ended in heavy losses.
        lonlat: [7.951, 36.286]
        lp: l
