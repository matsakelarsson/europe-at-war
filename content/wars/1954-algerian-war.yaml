        text: The first round of talks between France and the GPRA was held in this spa town on Lake Geneva.
        lonlat: [6.590, 46.400]
      - kind: event
        side: fr
        name: Paris
        date: 17 October 1961
        text: The police attacked a peaceful march of Algerians against a curfew; estimates of the dead range from about 40 to 300.
        lonlat: [2.352, 48.857]
  - title: Évian and the ceasefire
    date: March – July 1962
    when: "1962-03-19"
    borders: "1962-03-19"
    countries: [dz, fr]
    body:
      - "The Évian Accords were signed on 18 March 1962 by Louis Joxe for France and Krim Belkacem for the GPRA, and the ceasefire took effect at noon on 19 March. They provided for a referendum on independence, guarantees for the Europeans, who could keep French nationality, a French naval base at Mers el-Kébir for fifteen years, French use of nuclear test sites in the Sahara and French oil interests. A Provisional Executive under Abderrahmane Farès governed from Rocher Noir until independence. Voters in France approved the accords on 8 April with about 91 per cent."
      - "The OAS fought on to wreck the settlement. In Algiers its gunmen killed French conscripts, and the army sealed off the European district of Bab El Oued. On 26 March soldiers of a tirailleur regiment fired on a crowd of Europeans marching to Bab El Oued in the rue d’Isly, killing some 50 to 80 people. OAS bombings killed hundreds of Algerians, among them some 60 dockers at the port of Algiers on 2 May, and its men burned the library of the University of Algiers in June. Jouhaud and Salan were caught, and on 17 June the OAS in Algiers reached a truce with the FLN."
      - "In the referendum of 1 July 1962 Algerians voted for independence by 5,975,581 votes to 16,534. France recognised it on 3 July, and Algeria celebrated on 5 July, the anniversary of the French capture of Algiers in 1830. That day in Oran, after shots were fired, crowds and armed men attacked Europeans while the French troops in the city stayed in their barracks; estimates of the dead range from under a hundred to several hundred, most of them Europeans."
    facts:
      - [Évian Accords signed, "18 March 1962"]
      - [Ceasefire, "19 March 1962, noon"]
      - [Rue d’Isly shooting, "26 March 1962"]
      - [Independence referendum, "1 July 1962; 99.7 per cent yes"]
      - [Independence Day, "5 July 1962"]
