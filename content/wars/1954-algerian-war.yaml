          - [[-2.150, 35.050], [-1.800, 34.750], [-1.700, 34.200], [-1.200, 33.200], [-1.050, 32.550], [-1.300, 32.050], [-2.100, 31.650]]
  - title: 13 May 1958 and de Gaulle
    date: May – October 1958
    when: "1958-05-13"
    borders: "1958-05-13"
    countries: [dz, fr]
    body:
      - "The war wore down the governments of the Fourth Republic. On 13 May 1958, as Pierre Pflimlin, who was thought ready to negotiate, sought the National Assembly’s approval as prime minister, crowds of Europeans in Algiers stormed the building of the Government-General. Generals Jacques Massu and Raoul Salan put themselves at the head of a Committee of Public Safety and called for Charles de Gaulle to take power. On 24 May paratroopers from Algeria took over Corsica, and the army prepared an operation against Paris. On 1 June the Assembly voted de Gaulle in as prime minister with full powers."
      - "On 4 June de Gaulle told a huge crowd in Algiers: “Je vous ai compris” (I have understood you). The settlers heard a promise to keep Algeria French; he chose his words to promise nothing. In the referendum of 28 September on the constitution of the Fifth Republic, all Algerians, Muslim women for the first time, voted in a single college. In October he announced the Constantine Plan to build housing, schools and industry, and offered the ALN a “peace of the brave” that it rejected."
      - "The FLN answered by proclaiming the Provisional Government of the Algerian Republic (GPRA) in Cairo on 19 September 1958, with Ferhat Abbas as its president. It moved to Tunis and was soon recognised by Arab and Asian states, among them Morocco, Tunisia and China. In August the FLN had opened a front in France itself with attacks on police and oil depots."
    facts:
      - [Rising in Algiers, "13 May 1958"]
      - [De Gaulle prime minister, "1 June 1958"]
      - [GPRA proclaimed, "19 September 1958"]
      - [Fifth Republic constitution approved, "28 September 1958"]
    markers:
      - kind: event
        name: Algiers
        date: 13 May 1958
        text: Settlers stormed the Government-General building, and the army set up a Committee of Public Safety that called for de Gaulle. On 4 June he spoke to the crowd from its balcony.
        lonlat: [3.059, 36.754]
      - kind: event
        name: Ajaccio
        date: 24 May 1958
        text: Paratroopers flown in from Algeria took over Corsica without bloodshed, a warning to Paris.
        lonlat: [8.738, 41.919]
      - kind: event
        side: fr
        name: Constantine
        date: 3 October 1958
        text: De Gaulle announced here a five-year plan to develop Algeria.
        lonlat: [6.614, 36.365]
      - kind: event
        side: fln
        name: Tunis
        date: from September 1958
        text: Seat of the GPRA, the FLN’s provisional government, proclaimed in Cairo on 19 September 1958.
        lonlat: [10.181, 36.806]
  - title: The Challe Plan
    date: February 1959 – December 1960
    when: "1959-07-22"
    borders: "1959-07-22"
    countries: [dz, fr]
    body:
      - "De Gaulle’s new commander-in-chief, General Maurice Challe, used the mobile reserves, paratroopers and legionnaires carried by helicopter, to sweep the ALN’s strongholds one after another from west to east, while units of harkis and commandos stayed on the trail of the scattered bands: in Oranie in February 1959, the Ouarsenis and the Algérois in the spring, the Hodna in July, Kabylia from 22 July in Operation Jumelles, and North Constantine in the autumn. The ALN inside Algeria lost thousands of men and most of its larger units. On 28 March 1959 Colonel Amirouche, the feared commander of Kabylia, and Si El Haouès, commander of the Sahara wilaya, were killed in a battle near Bou Saâda. In Kabylia French intelligence had fed Amirouche false lists of traitors, and his purges had killed hundreds of his own fighters."
      - "Yet de Gaulle moved the other way in politics. On 16 September 1959 he offered Algerians self-determination, a choice between secession, full integration with France and association. In January 1960 settler activists in Algiers rose against him in the week of the barricades; about twenty people were killed, most of them gendarmes, before the rising collapsed on 1 February. In June 1960 three leaders of the Algérois wilaya were secretly received at the Élysée to discuss a ceasefire, without result, and talks with the GPRA at Melun failed."
      - "In December 1960, during a visit by de Gaulle, tens of thousands of Algerians demonstrated in Algiers and other cities with FLN flags; more than a hundred people were killed. Days later the UN General Assembly recognised Algeria’s right to independence. The army had won on the ground, but the FLN had won the political war at home and abroad."
    facts:
      - [Operation Jumelles, "from 22 July 1959, Kabylia"]
      - [Amirouche killed, "28 March 1959"]
      - [Self-determination speech, "16 September 1959"]
