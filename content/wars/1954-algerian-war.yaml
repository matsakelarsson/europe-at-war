  - title: Independence, the exodus and the harkis
    date: 1962
    when: "1962-07-05"
    borders: "1962-07-05"
    countries: [dz, fr]
    body:
      - "Between May and August 1962 most of the pieds-noirs left for France, many with only a suitcase each, under the slogan of the time, “the suitcase or the coffin”. By the end of the year some 900,000 had gone, among them most of Algeria’s Jews, who had been French citizens since 1870. France had not planned for so many, and they arrived in Marseille and other ports with little help. Most of the farms, homes and businesses they left became state property in independent Algeria."
      - "Tens of thousands of Algerian Muslims had served with the French as harkis and in other auxiliary units, besides those in the regular army. The French government ordered that they should not be brought to France in large numbers, and only some 90,000 harkis and their families got there, where many were housed for years in camps. Those left behind were killed in large numbers in the months after the ceasefire, by the ALN, by local committees and in personal revenge; estimates range from about 30,000 to 150,000. In 2021 President Emmanuel Macron asked the harkis for forgiveness, and a French law of 2022 recognised the state’s responsibility."
      - "Independence brought a struggle for power. The GPRA under Benyoucef Benkhedda was opposed by Ben Bella, freed in March, who set up a Political Bureau at Tlemcen with the backing of the frontier army of Houari Boumediene. The frontier army marched on Algiers and fought the wilayas that sided with the GPRA in August and September, and Ben Bella became prime minister at the end of September 1962. The FLN became the only party. Algeria had lost a large share of its people to death, camps and exile, and the war left memories on both sides of the Mediterranean that are still contested."
    facts:
      - [Pieds-noirs who left, "about 900,000 in 1962"]
      - [Harkis and families reaching France, "about 90,000"]
      - [Harkis killed, "estimates from about 30,000 to 150,000"]
      - [Ben Bella prime minister, "September 1962"]
    markers:
