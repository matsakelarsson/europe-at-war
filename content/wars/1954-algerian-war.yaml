id: algerian-war
name: Algerian War
start: "1954-11-01"
end: "1962-07-05"
tier: A
summary: "The war of independence fought by Algeria’s National Liberation Front (FLN) and its army, the ALN, against French rule. Algeria, conquered from 1830, was governed as part of France, with a million settlers of European descent and some nine million Muslim Algerians who had few political rights. After the bloody repression of the Sétif and Guelma rising in May 1945 and years of blocked reform, the FLN began the war with coordinated attacks on 1 November 1954. It became a guerrilla war in the mountains and a campaign of bombings and assassinations in the cities, as in the Battle of Algiers in 1957. France sent some 400,000 soldiers, most of them conscripts, sealed the borders with Tunisia and Morocco with electrified barriers, moved more than two million villagers into camps and made wide use of torture and summary executions; the FLN killed many civilians, European and Algerian, and fought a bitter war with its rival, the MNA. The crisis brought down the Fourth Republic in May 1958 and returned Charles de Gaulle to power. His army all but defeated the ALN inside Algeria, but he turned towards self-determination, survived an army putsch in April 1961 and the bombings of the OAS, a secret army of settlers and officers, and signed the Évian Accords, which brought a ceasefire on 19 March 1962. Algeria voted for independence on 1 July and celebrated it on 5 July 1962. Some 900,000 Europeans, the pieds-noirs, left for France within months, and tens of thousands of harkis, Algerians who had served with the French army, were killed. Estimates of the Algerian dead range from about 300,000 to the 1.5 million of official Algerian figures; about 25,000 French soldiers died."
countries: [dz, fr, tn, ma]
