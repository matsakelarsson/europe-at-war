id: algerian-war
name: Algerian War
start: "1954-11-01"
end: "1962-03-19"
tier: C
summary: The war of independence fought by Algeria’s National Liberation Front (FLN) against French rule. It began with coordinated attacks on 1 November 1954 and became a guerrilla war in the countryside and a campaign of bombings in the cities, as in the Battle of Algiers in 1957. The French counter-insurgency made wide use of torture, summary executions and the forced resettlement of some two million villagers, and the FLN also killed many civilians, Algerian and European. The war brought down the Fourth Republic in 1958 and returned Charles de Gaulle to power, and it reached France itself, where the Paris police killed dozens of Algerian demonstrators on 17 October 1961, by some estimates as many as two hundred. After a failed army putsch in Algiers in April 1961 and a campaign of bombings and murders by the OAS, a secret army opposed to independence, the Évian Accords brought a ceasefire on 19 March 1962, and Algeria became independent on 5 July. Some 900,000 Europeans, the pieds-noirs, left for France within months, and many thousands of harkis, Algerians who had served with the French army, were killed. Estimates of the Algerian dead range from a few hundred thousand to the 1.5 million of official Algerian figures; about 25,000 French soldiers died.
