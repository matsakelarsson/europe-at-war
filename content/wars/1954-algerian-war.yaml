  - title: Philippeville and the widening war
    date: August 1955 – October 1956
    when: "1955-08-20"
    borders: "1955-08-20"
    countries: [dz, fr, ma, tn]
    body:
      - "France declared a state of emergency in April 1955, and the new governor-general, Jacques Soustelle, combined reforms with repression. By the summer the FLN feared it was losing ground. On 20 August 1955 Youcef Zighoud, its commander in North Constantine, sent his fighters and armed peasants against the towns and villages around Philippeville (Skikda). They killed 123 people, among them 71 Europeans; at the mine of El Halia 37 Europeans, women and children among them, were killed. The army, the police and settler militias took revenge. The French authorities counted 1,273 Muslims killed and the FLN said 12,000; the historian Charles-Robert Ageron estimated 3,000 to 5,000. The massacres on both sides opened a gulf between the communities, and moderate nationalists such as Ferhat Abbas joined the FLN."
      - "In February 1956 the new Socialist prime minister, Guy Mollet, was pelted with tomatoes by settlers in Algiers and gave up his plan for reform. In March the National Assembly, the Communists included, voted the government special powers, and conscripts were sent to Algeria; by the end of 1956 there were more than 400,000 French troops there. Morocco and Tunisia became independent in March 1956, and the FLN set up bases, training camps and supply routes on their soil."
      - "On 20 August 1956 FLN leaders met secretly at Ifri in the Soummam valley in Kabylia. The Soummam Congress, led by Abane Ramdane and Larbi Ben M’hidi, gave the movement a structure: six wilayas, a parliament (the CNRA) and an executive committee, with the primacy of the political over the military and of the leaders inside the country over those abroad. On 22 October the French air force forced down a Moroccan airliner carrying Ben Bella, Aït Ahmed, Boudiaf and Khider from Rabat to Tunis, and they spent the rest of the war in French prisons. Days later France joined Britain and Israel in attacking Egypt at Suez, in part to end Nasser’s support for the FLN."
    facts:
      - [Philippeville attacks, "20 August 1955; 123 killed, 71 of them Europeans"]
      - [Reprisals, "1,273 Muslims killed by French count, 12,000 by the FLN’s, 3,000–5,000 by Ageron’s estimate"]
      - [Soummam Congress, "20 August 1956"]
      - [French troops in Algeria, "more than 400,000 by the end of 1956"]
    markers:
      - kind: event
        side: fln
        name: Philippeville (Skikda)
        date: 20–25 August 1955
        text: Youcef Zighoud’s offensive killed 123 people here and at El Halia, east of the town. The reprisals that followed killed well over a thousand Muslims.
        lonlat: [6.909, 36.876]
      - kind: event
        side: fln
        name: Ifri (Soummam Congress)
        date: 20 August 1956
        text: The FLN leaders of the interior met in this village in the Soummam valley and gave the movement its political and military structure.
        lonlat: [4.552, 36.551]
        lp: b
      - kind: event
        side: fr
        name: Algiers airport
        date: 22 October 1956
        text: The plane carrying Ben Bella, Aït Ahmed, Boudiaf and Khider was forced to land here, and the four were arrested.
        lonlat: [3.215, 36.691]
        lp: l
      - kind: event
        side: fln
        name: Tunis
        date: from 1956
        text: Independent Tunisia let the FLN set up bases and camps on its territory; the FLN’s leaders later made Tunis their capital in exile.
        lonlat: [10.181, 36.806]
    areas:
      - style: contested
        side: fln
