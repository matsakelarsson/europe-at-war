  - title: The generals’ putsch and the OAS
    date: January 1961 – February 1962
    when: "1961-04-22"
    borders: "1961-04-22"
    countries: [dz, fr]
    body:
      - "In a referendum on 8 January 1961 three quarters of the voters in France and Algeria approved self-determination for Algeria. Settler leaders and officers who would not accept it founded the Secret Army Organisation (OAS) early in the year. On the night of 21–22 April four retired generals, Maurice Challe, Edmond Jouhaud, André Zeller and Raoul Salan, seized Algiers with the 1st Foreign Parachute Regiment and other elite units. De Gaulle went on television on 23 April to condemn “a handful of retired generals” and ordered soldiers to disobey them; most of the conscripts, listening on transistor radios, did, and the putsch collapsed on 25–26 April. Challe and Zeller gave themselves up; Salan and Jouhaud went into hiding to lead the OAS."
      - "Talks with the GPRA began at Évian in May 1961 and broke down over the Sahara, which de Gaulle conceded in September. Meanwhile the OAS waged a campaign of bombings and murders in Algeria and France, killing Algerians, liberal Europeans and officials, and tried to kill de Gaulle in September 1961."
      - "The FLN also fought in France, where some 350,000 Algerians lived. On 17 October 1961 tens of thousands of Algerian men, women and children marched peacefully in Paris against a curfew imposed on them; the police under prefect Maurice Papon attacked them, beat and shot people and threw some into the Seine. Estimates of the dead range from the 40 that the French government acknowledged in 1998 to 200–300 by some historians’ counts. On 8 February 1962 police killed nine people at the Charonne metro station during a demonstration against the OAS."
    facts:
      - [Referendum on self-determination, "8 January 1961"]
      - [Generals’ putsch, "21–26 April 1961"]
      - [First Évian talks, "May – June 1961"]
      - [Paris massacre, "17 October 1961"]
    markers:
      - kind: event
        side: fr
        name: Algiers
        date: 21–26 April 1961
        text: The putschist generals held the city for four days before the army and the conscripts turned against them.
        lonlat: [3.059, 36.754]
