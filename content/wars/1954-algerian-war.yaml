steps:
  - title: Sétif and Guelma
    date: 8 May – June 1945
    when: "1945-05-08"
    borders: "1945-05-08"
    countries: [dz, fr]
    body:
      - "A century after the French conquest, Algeria was a settler colony. About a million people of European descent, the pieds-noirs, French, Spanish, Italian and Maltese in origin, lived alongside some eight million Muslim Algerians, Arabs and Berbers. The north was divided into French departments, the settlers held most of the best land and controlled local government, and most Muslims were French subjects without the rights of citizens. Between the wars a nationalist movement grew: Messali Hadj’s Algerian People’s Party (PPA), which demanded independence, Ferhat Abbas’s liberal reformers and the Islamic reformists of the Association of Ulema."
      - "On 8 May 1945, the day the war ended in Europe, nationalists marched in Sétif with Algerian flags and banners calling for freedom. When a policeman shot a young man carrying a flag, the march turned into a riot, and the rising spread through the countryside around Sétif and Kherrata and to Guelma. About 102 Europeans were killed. The repression lasted for weeks: the army, including the Foreign Legion and Senegalese and Moroccan troops, carried out sweeps and summary executions, aircraft bombed villages, a cruiser shelled the coast near Kherrata, and settler militias around Guelma shot and lynched Muslims. The official French inquiry counted 1,020 Algerian dead; historians’ estimates mostly range from 3,000 to 8,000, some go much higher, and the Algerian state gives 45,000."
      - "For many Algerians, Sétif ended hope of change by peaceful means. A new statute in 1947 created an Algerian Assembly elected in two separate colleges with sixty members each, one for the Europeans and a small Muslim elite and one for the Muslim majority, and the 1948 elections to it were openly rigged. Messali’s movement, now the MTLD, built a secret armed wing, the Special Organisation (OS), which the police broke up in 1950. In 1954, with the MTLD split between Messali and its central committee and France defeated at Dien Bien Phu in Indochina, young former members of the OS formed a committee for action and prepared an insurrection."
    facts:
      - [Rising at Sétif, "8 May 1945"]
      - [European dead, "about 102"]
      - [Algerian dead, "1,020 (official French figure) to 45,000 (Algerian state); historians mostly 3,000–8,000"]
    markers:
      - kind: event
        name: Sétif
        date: 8 May 1945
        text: A nationalist march on VE Day turned into a riot after a policeman shot a young man carrying an Algerian flag. Europeans were killed in the town and the countryside, and the army’s repression followed.
        lonlat: [5.410, 36.190]
        lp: l
      - kind: event
        name: Kherrata
        date: 9–11 May 1945
        text: The rising spread to this mountain town. Aircraft bombed the villages around it, and the cruiser Duguay-Trouin shelled the nearby coast.
        lonlat: [5.277, 36.494]
      - kind: event
        name: Guelma
        date: May – June 1945
        text: Settler militias formed with the backing of the sub-prefect shot and lynched hundreds of Muslims in the weeks after the rising.
        lonlat: [7.430, 36.460]
  - title: Toussaint Rouge
    date: 1 November 1954
    when: "1954-11-01"
    borders: "1954-11-01"
    countries: [dz, fr]
    body:
      - "In the early hours of 1 November 1954, All Saints’ Day, the new National Liberation Front (FLN) carried out some seventy attacks in about thirty places across Algeria: on police stations and barracks, farms, bridges, a gasworks and telephone lines. The French called the night the Toussaint Rouge, the Red All Saints’ Day. About ten people were killed. In the Tighanimine gorge in the Aurès, fighters stopped a bus and killed a local caïd, Hadj Sadok, and a young French schoolteacher, Guy Monnerot, whose wife was wounded. A proclamation broadcast from Cairo called for the restoration of a sovereign, democratic and social Algerian state within the framework of Islamic principles, and offered talks on that basis."
      - "The FLN was the work of nine leaders, among them Mostefa Ben Boulaïd, Larbi Ben M’hidi, Mourad Didouche, Krim Belkacem and Mohamed Boudiaf inside Algeria and Ahmed Ben Bella, Hocine Aït Ahmed and Mohamed Khider in Cairo. They divided the country into zones, later called wilayas. Their armed men numbered perhaps a few hundred to a thousand, with old hunting rifles and wartime weapons. The rising was strongest in the Aurès, the mountain country of the Chaoui Berbers under Ben Boulaïd, where the French army had to fight for months; elsewhere it was quickly contained."
      - "The French government of Pierre Mendès France answered that Algeria was France and that there could be no negotiation. Its interior minister, François Mitterrand, sent troops and paratroopers, and the police arrested hundreds of members of Messali’s movement, most of whom had had nothing to do with the attacks. Messali, who had not been told of the rising, founded his own movement, the MNA, which became the FLN’s rival."
    facts:
      - [Attacks, "about 70, in some 30 places"]
      - [Dead, "about 10"]
      - [ALN fighters, "a few hundred to about 1,000"]
    markers:
