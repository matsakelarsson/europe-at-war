notes:
  - "Algeria was divided into French departments and counted in law as part of France. French governments called the fighting “the events” or “operations to maintain order”; France officially called it a war only in 1999. Algerians call it the Revolution or the War of National Liberation, and the FLN called its fighters mujahideen; the French called them rebels, outlaws or fellaghas."
  - "The death toll is disputed. French historians have mostly estimated the Algerian dead at about 300,000–400,000, including civilians and the Algerians killed by the FLN; the Algerian state has long spoken of 1.5 million martyrs, and Alistair Horne gave about a million. French military deaths were about 25,000, including deaths from accidents and disease. Several thousand European civilians were killed or went missing. The FLN’s war with the MNA killed thousands of Algerians in Algeria and in France, and estimates of the harkis and their families killed after the ceasefire range from about 30,000 to 150,000."
  - "Places are given by their names of the time, with today’s names in brackets where they differ: Philippeville (Skikda), Bône (Annaba), Colomb-Béchar (Béchar), Rocher Noir (Boumerdès)."
