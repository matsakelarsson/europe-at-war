        atoms: [DZ-15, DZ-06, DZ-18, DZ-21]
        polygon: [[5.90, 35.62], [6.60, 35.62], [7.25, 35.45], [7.15, 35.00], [6.40, 34.90], [5.80, 35.10]]
  - title: The Battle of Algiers
    date: September 1956 – October 1957
    when: "1957-01-07"
    borders: "1957-01-07"
    countries: [dz, fr]
    body:
      - "In Algiers the FLN’s Autonomous Zone, led by Yacef Saadi under Larbi Ben M’hidi, built a network of fighters, bomb-makers and couriers in the Casbah, the old town of some 80,000 people. After the guillotining of FLN prisoners from June 1956 and a bomb planted by European extremists in the rue de Thèbes in the Casbah in August, which killed dozens, the FLN turned to bombings in the European city. On 30 September 1956 young women of the network, among them Zohra Drif, left bombs in the Milk Bar and the Cafétéria, cafés popular with young pieds-noirs, killing three and wounding dozens. Bombings and shootings of Europeans and police followed through the winter."
      - "On 7 January 1957 the governor-general, Robert Lacoste, gave police powers in Algiers to General Jacques Massu and the 10th Parachute Division. The paratroopers broke the eight-day general strike the FLN called at the end of January for a debate at the United Nations, sealed off the Casbah, searched house by house and arrested thousands. Torture, with electric shocks and water, was systematic. Ben M’hidi, captured in February, was killed in custody in March, as one of Massu’s officers, Paul Aussaresses, admitted decades later; the lawyer Ali Boumendjel was thrown from a building; the mathematician Maurice Audin disappeared in June. The secretary-general of the Algiers police, Paul Teitgen, resigned, counting 3,024 people missing among those arrested."
      - "The FLN’s leaders fled Algiers for Tunisia, and after a second wave of bombings in the summer the paratroopers captured Yacef Saadi on 24 September and killed Ali la Pointe and his companions on 8 October 1957 by blowing up their hiding place. The battle was a military victory for the French army. But accounts of torture, such as Henri Alleg’s book La Question in 1958, turned much opinion in France and abroad against the war. In 2018 France acknowledged that Audin had died under a system of torture that the state had allowed."
    facts:
      - [Milk Bar and Cafétéria bombings, "30 September 1956"]
      - [Police powers to Massu, "7 January 1957"]
      - [General strike, "28 January – 4 February 1957"]
      - [Ben M’hidi killed, "4 March 1957"]
      - [Ali la Pointe killed, "8 October 1957"]
    markers:
      - kind: siege
        side: fr
        name: Casbah of Algiers
        date: January – October 1957
        text: The old town, home to the FLN’s Autonomous Zone, was sealed off and searched by the 10th Parachute Division. The Milk Bar, bombed on 30 September 1956, stood a few hundred metres away in the European city, and detainees were tortured in villas at El Biar in the heights above. Ali la Pointe was killed in a house in the rue des Abderames on 8 October 1957.
        lonlat: [3.060, 36.785]
    view:
      center: [3.050, 36.740]
      size: [80, 60]
  - title: The Morice Line and the camps
    date: 1957–1958
    when: "1957-09"
    borders: "1958-02-08"
    countries: [dz, fr, tn, ma]
    body:
      - "By 1957 the ALN had tens of thousands of fighters inside Algeria, and its main supply of arms and recruits came over the borders from Tunisia and Morocco, where its frontier armies trained. To cut them off, France built barriers named after the defence minister André Morice: an electrified fence carrying 5,000 volts, with barbed wire, minefields, radar and a patrol road, about 460 km long on the Tunisian border and some 700 km on the Moroccan. From January to May 1958 the ALN tried to force the eastern line in the battle of the frontiers, above all around Souk Ahras, and lost heavily; few large units got through after that."
      - "On 11 January 1958 an ALN unit operating from Tunisia ambushed a French patrol and killed 14 soldiers. On 8 February French aircraft bombed the Tunisian border village of Sakiet Sidi Youssef on market day; more than 70 people were killed, among them 12 schoolchildren, and 148 were wounded. The raid caused an international outcry, Tunisia took the matter to the UN, and an Anglo-American mediation helped bring down the French government in April."
      - "Inside Algeria the army cleared the mountains, declaring forbidden zones where anyone could be shot, and moved their people into regroupment camps under military control. By 1960 more than two million Algerians, about a quarter of the rural population, had been moved, and thousands of villages had been destroyed. A report by a young civil servant, Michel Rocard, in 1959 described hunger and child deaths in the camps. The FLN fought its rival as well: on 28–29 May 1957 ALN fighters killed some 300 men of the village of Melouza, which supported the MNA, and in France the FLN and the MNA fought a long war of assassinations among Algerian workers, which killed thousands."
    facts:
      - [Morice Line, "from summer 1957; about 460 km (Tunisia) and 700 km (Morocco)"]
      - [Battle of the frontiers, "January – May 1958"]
      - [Sakiet Sidi Youssef bombed, "8 February 1958; over 70 dead"]
      - [Regrouped villagers, "over 2 million by 1960"]
      - [Melouza, "28–29 May 1957"]
