notes:
  - The People’s Republic regarded the islands, like Taiwan, as Chinese territory held by a defeated regime; the ROC, which governed Taiwan, Penghu and the offshore islands, regarded itself as the government of all China. By the official figures cited in most accounts the crisis cost the ROC 519 killed, the United States 2 and the PRC 393.
  - The ROC long said that all 720 men of the Yijiangshan garrison died; historians regard that figure as symbolic, and Chinese figures give 519 killed and 567 captured.
