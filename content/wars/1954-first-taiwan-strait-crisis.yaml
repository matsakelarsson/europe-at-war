  - title: Yijiangshan
    date: 18–19 January 1955
    when: "1955-01-18"
    borders: "1955-01-19"
    countries: [tw, cn, us]
    body:
      - The PLA’s East China command formed a front command under Zhang Aiping to attack the Yijiangshan islands, 13 km north of the Dachens. On 18 January 1955 aircraft struck the ROC artillery and communications from 8 in the morning until 1 in the afternoon; then four battalions of the 60th Division landed on 20 beaches under the cover of gunboats and shore batteries, while aircraft kept ROC warships away. In all some 10,000 men, 184 aircraft and 186 vessels took part, and the PLA counts it as its first joint operation. By the evening of 19 January the islands were taken. The garrison of about 1,100 men was destroyed, and its commander, Wang Shengming, was killed.
      - Nine days later, at the end of January, the US Congress passed the Formosa Resolution, authorising President Eisenhower to use American forces to defend Taiwan and Penghu and “related positions and territories”.
    facts:
      - [Landing on Yijiangshan, "18 January 1955"]
      - [Islands taken, "19 January 1955"]
      - [Formosa Resolution, "January 1955"]
    markers:
