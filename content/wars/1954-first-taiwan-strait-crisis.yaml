  - title: The Dachen evacuation and the end of the crisis
    date: February – May 1955
    when: "1955-02-08"
    borders: "1955-05-01"
    countries: [tw, cn, us]
    body:
      - Chiang Kai-shek agreed to give up the Dachens in return for a private American promise to help defend Kinmen and Matsu. In Operation King Kong, from 8 to 11 February 1955, the US Seventh Fleet, with 132 ships and 400 aircraft, covered the evacuation of about 14,500 civilians, 10,000 ROC soldiers and 4,000 guerrillas to Keelung, and the PLA occupied the islands without a fight.
      - In March Eisenhower and his secretary of state, John Foster Dulles, said publicly that the United States might use tactical nuclear weapons against military targets. At the Bandung Conference of Asian and African states on 23 April Zhou Enlai said that the Chinese people did not want war with the United States and were willing to negotiate. The shelling of Kinmen and Matsu stopped on 1 May 1955, and American and Chinese ambassadors began talks in Geneva in August. The crisis is often said to have led Mao to start China’s nuclear weapons programme; the islands question came back in 1958.
    facts:
      - [Dachen evacuation, "8–11 February 1955"]
      - [Evacuated, "about 14,500 civilians, 10,000 soldiers and 4,000 guerrillas"]
      - [Zhou Enlai at Bandung, "23 April 1955"]
      - [Shelling stops, "1 May 1955"]
