id: first-taiwan-strait-crisis
name: First Taiwan Strait Crisis
start: "1954-09-03"
end: "1955-05-01"
tier: B
summary: "An armed confrontation in 1954–1955 between the People’s Republic of China and the Republic of China on Taiwan over the islands the ROC still held off the mainland coast. The PLA shelled Kinmen (Quemoy) from 3 September 1954 and later Matsu and the Dachen islands; the United States and the ROC signed a mutual defence treaty in December. On 18–19 January 1955 the PLA took the Yijiangshan islands in its first joint operation of land, sea and air forces, and the US Congress passed the Formosa Resolution. In February the US Seventh Fleet covered the evacuation of the Dachens, which the PLA then occupied. After American leaders spoke openly of using nuclear weapons, Zhou Enlai offered talks at the Bandung Conference in April, and the shelling stopped on 1 May 1955. Kinmen and Matsu stayed with the ROC."
