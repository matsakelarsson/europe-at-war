steps:
  - title: The shelling of Kinmen
    date: September – December 1954
    when: "1954-09-03"
    borders: "1954-09-03"
    countries: [tw, cn, us]
    body:
      - After its retreat to Taiwan in 1949 the Republic of China still held chains of islands close to the mainland, Kinmen and Matsu off Fujian and the Dachen islands and their outliers off Zhejiang, which it used as bases for raids, blockades and intelligence work. The end of the fighting in Korea in 1953 freed PLA forces, and in 1954 the United States was building alliances in Asia and discussing a defence treaty with Chiang Kai-shek, which Beijing saw as a threat.
      - On 3 September 1954 PLA batteries around Xiamen opened fire on Kinmen, killing two American military advisers; the ROC answered with artillery fire and air raids on the mainland. The shelling spread to Matsu and the Dachens. The US Joint Chiefs of Staff recommended that nuclear weapons be used if the PRC attacked the islands. On 2 December 1954 the United States and the ROC signed a Mutual Defense Treaty covering Taiwan and Penghu, but not, explicitly, the offshore islands.
    facts:
      - [Shelling of Kinmen begins, "3 September 1954"]
      - [Sino-American Mutual Defense Treaty, "2 December 1954"]
