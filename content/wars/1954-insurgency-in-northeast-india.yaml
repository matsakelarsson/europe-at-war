notes:
  - "“Insurgency in Northeast India” is a collective name for separate conflicts with different aims, from independence to statehood or autonomy, and for the ethnic violence between the region’s peoples. The Mizo rising of 1966–1986 has its own entry. Some of the groups (the NSCN-K, ULFA-I, the Meitei PLA and UNLF factions) have had camps in Myanmar, Bhutan or Bangladesh."
  - "The Armed Forces (Special Powers) Act of 1958 gives the army wide powers of arrest and the use of lethal force with immunity from prosecution; rights groups have documented killings, torture and rape by security forces under it, and it has been withdrawn from parts of the region since 2015. The insurgents have killed civilians, settlers and rival ethnic groups, and extorted money widely."
  - The base map shows India’s internal and international borders; zones of the conflicts are drawn in the steps and are approximate.
