  - title: Manipur since 2023
    date: 2023–2026
    when: "2023-05-03"
    borders: "2026-11-27"
    countries: [in, mm]
    body:
      - "Last updated 27 November 2026. In April 2023 the Manipur High Court seemed to recommend that the Meitei, the majority in the Imphal valley, be given the protected status of a Scheduled Tribe, which the Kuki-Zo and Naga peoples of the hills opposed. On 3 May a tribal solidarity march in Churachandpur was followed by clashes, and within days mobs burned thousands of homes, churches and temples, thousands of weapons were looted from police armouries, and the state split into a Meitei valley and Kuki-Zo hills divided by buffer zones guarded by central forces. Armed volunteers and militant groups fought on both sides. The government counted 175 dead by September 2023, and some 60,000 people were displaced."
      - "Chief Minister N. Biren Singh resigned on 9 February 2025, and the state was put under president’s rule, during which the Meitei–Kuki fighting largely subsided. On 4 February 2026 a new government took office under Yumnam Khemchand Singh, with a Kuki deputy chief minister, and in March he held the first direct talks with Kuki-Zo representatives in three years. But from February a new conflict between Kuki and Naga groups spread through the hill districts, killing about 50 people by November, and the ceasefire agreement with the Kuki-Zo armed groups lapsed in September without being renewed. On 19 October three Meitei men were killed in an ambush in the hills between Imphal East and Kangpokpi, and on 13 November four Naga civilians, two of them women, were killed when gunmen fired on two vehicles in Ukhrul district; each attack led to strikes and protests. The South Asia Terrorism Portal counted 95 deaths in Manipur in 2026 by late October, more than in either of the two previous years, and the official toll since May 2023 had reached 306. Elsewhere in the north-east violence was far lower than in earlier decades, but the Naga talks remained unresolved."
    facts:
      - [Violence begins, "3 May 2023"]
      - [President’s rule, "13 February 2025 – 4 February 2026"]
      - [Official death toll, "306 (September 2026)"]
      - [Displaced, "about 60,000"]
