  - title: "Assam: ULFA and the Bodo groups"
    date: 1979–2023
    when: "1990-11-28"
    borders: "1990-11-28"
    countries: [in, bt, mm, bd]
    body:
      - "The Assam movement of 1979–1985 against immigration from Bangladesh, which ended with the Assam Accord, also produced the United Liberation Front of Asom (ULFA), founded at Sivasagar on 7 April 1979 to win independence for Assam. By the late 1980s it ran a parallel administration in parts of Upper Assam and extorted money from tea companies; in November 1990 the government imposed president’s rule and sent in the army in Operation Bajrang, followed by Operation Rhino in 1991. ULFA moved its camps to Bhutan, Bangladesh and Myanmar. Bodo groups, among them the National Democratic Front of Bodoland (NDFB), fought for a Bodo homeland north of the Brahmaputra and were blamed for massacres of Adivasi and Bengali Muslim settlers."
      - "In December 2003 the Royal Bhutan Army destroyed the camps of ULFA, the NDFB and the Kamtapur Liberation Organisation in southern Bhutan in Operation All Clear. ULFA bombings killed many civilians, among them schoolchildren at an Independence Day parade in Dhemaji on 15 August 2004, and serial bombings blamed on the NDFB killed about 80 people across Assam on 30 October 2008. Bangladesh handed ULFA leaders over to India in 2009, and the conflicts wound down in accords: with the Bodo groups in January 2020, with ULFA’s pro-talks faction on 29 December 2023 and with Tripura’s last insurgents in 2024. ULFA (Independent), led by Paresh Baruah, fights on from Myanmar."
    facts:
      - [ULFA founded, "7 April 1979"]
      - [Operation Bajrang, "November 1990"]
      - [Operation All Clear in Bhutan, "December 2003"]
      - [Accord with ULFA’s pro-talks faction, "29 December 2023"]
