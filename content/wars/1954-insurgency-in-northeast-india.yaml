id: insurgency-in-northeast-india
name: Insurgency in Northeast India
start: "1954"
end: ongoing
tier: B
summary: "The many armed conflicts in India’s north-eastern states, a region of hills and valleys linked to the rest of India only by a narrow corridor and home to peoples with their own languages and histories. The Naga National Council, which declared Naga independence in 1947, took up arms in the mid-1950s, the longest of the insurgencies; it was followed by the Mizo rising of 1966, Meitei insurgents in Manipur, tribal groups in Tripura, the United Liberation Front of Asom (ULFA) and Bodo groups in Assam, and many smaller movements. The Indian army fought them under the Armed Forces (Special Powers) Act, and most of the conflicts ended in ceasefires and accords, though the Naga talks are unresolved and ULFA’s hard-line faction fights on from Myanmar. Since May 2023 ethnic violence between Meitei and Kuki-Zo in Manipur, and from 2026 between Kuki and Naga groups, has killed hundreds and displaced some 60,000 people. Last updated 27 November 2026."
