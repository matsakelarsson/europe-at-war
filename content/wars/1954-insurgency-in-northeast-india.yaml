steps:
  - title: The Naga rising
    date: 1947–1997
    when: "1956-03-22"
    borders: "1956-03-22"
    countries: [in, mm]
    body:
      - "The Naga National Council (NNC), led by Angami Zapu Phizo, declared the Naga Hills independent on 14 August 1947 and in 1951 held a plebiscite in which, it said, almost all Nagas voted for independence. After the Nagas boycotted India’s first elections, arrests and clashes led the NNC to armed struggle, and in March 1956 Phizo proclaimed a Federal Government of Nagaland. The Indian army was sent in; villages were burned and their people regrouped, and the Armed Forces (Special Powers) Act was passed in 1958 for the Naga Hills. Phizo escaped to London in 1960. In 1963 Nagaland became a state of India, and a ceasefire arranged by a Peace Mission of churchmen and politicians held from 1964 to 1967."
      - "In the Shillong Accord of 11 November 1975 part of the NNC accepted the Indian constitution. Those who rejected it formed the National Socialist Council of Nagaland (NSCN) in 1980 under Isak Chishi Swu, Thuingaleng Muivah and S. S. Khaplang, and fought for a greater Nagalim including Naga areas of Manipur, Assam, Arunachal Pradesh and Myanmar. The NSCN split in 1988 into the NSCN (IM) and Khaplang’s NSCN (K), based in Myanmar, which fought each other. The NSCN (IM) agreed a ceasefire with India on 1 August 1997 and signed a Framework Agreement in 2015, but a final settlement has stalled over its demands for a separate Naga flag and constitution. In Manipur, Meitei insurgent groups such as the UNLF (1964) and the PLA (1978) fought for independence from India."
    facts:
      - [Naga declaration of independence, "14 August 1947"]
      - [Federal Government of Nagaland proclaimed, "March 1956"]
      - [Nagaland becomes a state, "1 December 1963"]
      - [NSCN (IM) ceasefire, "1 August 1997"]
