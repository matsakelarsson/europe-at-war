notes:
  - Casualty figures vary. One study gives 13 British and sultanate soldiers and 176 Omanis killed in the final offensive of 1958–1959; estimates for the whole war range from about 100 to more than 500 dead. The imamate was backed by Saudi Arabia and Egypt, which were in dispute with Britain over the Buraimi oasis.
