id: jebel-akhdar-war
name: Jebel Akhdar War
start: "1954-10-10"
end: "1959-01-30"
tier: C
summary: A war in the interior of Oman between the Imamate of Oman, which had ruled the inland tribes under the Treaty of Seeb of 1920, and Sultan Said bin Taimur of Muscat, supported by Britain. After the imam Muhammad al-Khalili died in May 1954 and Ghalib bin Ali al-Hinai was elected in his place, the sultan’s British-officered forces occupied the oil prospect at Fahud in October 1954 and took Nizwa, the imamate’s capital, in December 1955; Ghalib withdrew to his village. In 1957 his brother Talib returned from Saudi Arabia with several hundred trained fighters and raised the tribes again, and British troops and aircraft were called in to retake Nizwa in August 1957. The rebels held out on the high plateau of Jebel Akhdar (the “Green Mountain”), supplied from Saudi Arabia, until two squadrons of the British Special Air Service, with the sultan’s troops, climbed the mountain by night in late January 1959 and took the plateau. Ghalib and Talib went into exile in Saudi Arabia, and the imamate ended; its cause was raised at the United Nations for years afterwards. Estimates of the dead range from about 100 to several hundred.
countries: [om, gb, sa]
