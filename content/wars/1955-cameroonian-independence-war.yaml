notes:
  - "Death toll. No count was made, and the war was long passed over in silence in both countries. General Max Briand, the French commander, reported some 20,000 people killed in 1960 alone; a British embassy estimate of 1964 put civilian deaths at 61,300–76,300, about 80% of them in the Bamileke region; the historian Bernard Droz estimated about 10,000 deaths for 1955–1959; and some writers give figures of 100,000 to 400,000 for 1959–1964, which other historians, such as Meredith Terretta, consider not credible."
  - "In January 2025 a commission of French and Cameroonian historians, set up in 2022, submitted its report on France’s role in the repression of the independence movement, and on 12 August 2025 a letter from President Emmanuel Macron to President Paul Biya was published in which France acknowledged that it had waged a war in Cameroon from 1945 to 1971."
  - Cameroon was a German colony divided in 1919 into French and British mandates, later UN trust territories; the UPC appealed to the United Nations for independence and reunification throughout the 1950s.
