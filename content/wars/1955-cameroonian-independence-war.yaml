  - title: War in the Bamileke country
    date: 1959–1964
    when: "1960-01-01"
    borders: "1961-10-01"
    countries: [cm, fr]
    body:
      - "From exile the UPC’s president, Félix-Roland Moumié, launched the National Liberation Army of Kamerun (ALNK) in 1959. Its fighters, many of them young Bamileke angered by land shortage and by chiefs who sided with the administration, attacked chiefs, officials, missions and plantations in the Bamileke highlands and the Mungo valley, and sometimes Douala. Cameroon became independent on 1 January 1960 under Ahmadou Ahidjo, whom the UPC rejected as France’s choice, and in October 1961 the southern British Cameroons joined it."
      - "Under defence agreements French troops under General Max Briand fought alongside the new Cameroonian army. They moved the population into guarded villages, burned settlements and used aircraft against the guerrillas; Briand reported some 20,000 people killed in 1960 alone, and estimates for the whole period range much higher. On 15 October 1960 Moumié was poisoned with thallium in Geneva by an agent of the French secret service and died on 3 November. By 1964 the large guerrilla bands had been broken up."
    facts:
