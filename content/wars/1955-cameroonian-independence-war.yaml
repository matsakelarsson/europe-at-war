  - title: Ouandié and the end of the maquis
    date: 1964 – January 1971
    when: "1970-08"
    borders: "1971-01-15"
    countries: [cm]
    body:
      - Ernest Ouandié, the UPC’s vice-president, who had returned from exile in 1961, kept up the guerrilla war with small groups in the forests of the west and the Mungo for years after the main bands were broken. Hunted and isolated, he surrendered to the authorities near Loum on 19 August 1970. Albert Ndongmo, the Catholic bishop of Nkongsamba, who had sheltered him, was arrested and accused of conspiring with him.
      - After a trial by a military court, Ouandié was shot by a firing squad on the main square of Bafoussam on 15 January 1971, before his appeals had been heard. Ndongmo was also sentenced to death; his sentence was commuted to life imprisonment, and after his release in 1975 he went into exile. The UPC remained banned until the return of multi-party politics in 1991, and the war was rarely spoken of in Cameroon or France until historians began to publish on it in the 2000s.
    facts:
      - [Ouandié surrenders, "August 1970"]
      - [Ouandié executed, "15 January 1971, Bafoussam"]
