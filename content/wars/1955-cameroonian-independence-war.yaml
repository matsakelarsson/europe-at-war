id: cameroonian-independence-war
name: Cameroonian independence war
start: "1955-05-22"
end: "1971-01-15"
tier: B
summary: "The war between the Union of the Peoples of Cameroon (UPC), the nationalist party that demanded immediate independence and the reunification of the French and British Cameroons, and the French colonial authorities and, after independence in 1960, the government of Ahmadou Ahidjo with French military support. France banned the UPC after riots in May 1955; its leader Ruben Um Nyobè took to the forests of the Sanaga-Maritime in 1956 and was killed by a French-led patrol in September 1958. From 1959 the UPC’s army fought in the Bamileke country of western Cameroon and in the Mungo, where French and Cameroonian troops waged a counter-insurgency of resettlement camps, burned villages and air strikes into the mid-1960s. Félix-Roland Moumié, the UPC’s president in exile, was poisoned by a French agent in Geneva in 1960, and the last guerrilla leader, Ernest Ouandié, was executed in Bafoussam in January 1971. Estimates of the dead range from about 10,000 to well over 100,000; most historians give figures in the tens of thousands. In 2025 France officially acknowledged that it had waged a war in Cameroon."
countries: [cm, fr]
