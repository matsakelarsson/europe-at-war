steps:
  - title: The UPC and the maquis of the Sanaga-Maritime
    date: May 1955 – September 1958
    when: "1955-05-22"
    borders: "1958-09-13"
    countries: [cm, fr]
    body:
      - "The UPC, founded in 1948 by Ruben Um Nyobè and others, became the largest nationalist party in French Cameroon, demanding independence and reunification with the British Cameroons and petitioning the United Nations. In May 1955 meetings and strikes turned into riots in Douala, Yaoundé and other towns from 22 to 30 May; the security forces put them down, killing dozens of people by official figures and more by other accounts. The French High Commissioner, Roland Pré, blamed the UPC, which was banned on 13 July 1955; its leaders fled to the British Cameroons and abroad."
      - "Um Nyobè stayed and, after the UPC was excluded from the elections of December 1956, organised an armed movement, the National Organisation Committee (CNO), in his home region of the Sanaga-Maritime, among the Bassa. In December 1957 the French set up a military “pacification zone” there under Lieutenant Colonel Jean Lamberton, moving villagers into guarded camps along the roads. On 13 September 1958 a French army patrol, guided to his hiding place, found and shot Um Nyobè in the forest near Boumnyébel, his home village."
