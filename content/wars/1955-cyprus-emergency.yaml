id: cyprus-emergency
name: Cyprus Emergency
start: "1955-04-01"
end: "1959-02-19"
tier: B
summary: The armed campaign of EOKA, a Greek Cypriot guerrilla organisation led by George Grivas, against British rule in Cyprus and for union with Greece (enosis). It was fought with bombings, ambushes and assassinations, met by emergency rule, detention camps and the deportation of Archbishop Makarios, and fed rising violence between Greek and Turkish Cypriots; the Zurich and London agreements of 1959 ended it and made Cyprus an independent republic in 1960.
