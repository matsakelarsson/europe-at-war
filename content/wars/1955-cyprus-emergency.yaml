notes:
  - EOKA stands for Ethniki Organosis Kyprion Agoniston (National Organisation of Cypriot Fighters). Grivas used the code name “Digenis”.
  - About 370 British servicemen were killed, and EOKA lost around a hundred fighters; several hundred civilians died, among them Greek Cypriots killed by EOKA as alleged collaborators and victims of the intercommunal violence of 1958. Allegations that British forces tortured detainees were the subject of a court case in London that the British government settled in 2019.
