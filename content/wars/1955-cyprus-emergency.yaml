steps:
  - title: EOKA and the road to independence
    date: April 1955 – August 1960
    when: "1955-04-01"
    borders: "1960-08-16"
    countries: [cy, gb, gr, tr]
    body:
      - Most Greek Cypriots, about four-fifths of the island’s people, wanted union with Greece, but Britain, which planned to base its Middle East command on Cyprus, refused. On 1 April 1955 EOKA, led by George Grivas, a Cypriot-born colonel of the Greek army, and backed politically by Archbishop Makarios III, set off bombs across the island. The governor, Field Marshal Sir John Harding, declared a state of emergency in November and in March 1956 deported Makarios to the Seychelles. Some tens of thousands of British troops hunted a few hundred guerrillas in the Troodos and Kyrenia mountains, with curfews, collective fines and detention camps, and nine EOKA members were hanged.
      - Turkish Cypriots, about a fifth of the population, opposed enosis, and Turkey called for partition. In 1958 the Turkish Resistance Organisation (TMT) and EOKA turned on each other’s communities, and intercommunal killings that summer began the separation of the two peoples. Britain, Greece and Turkey then agreed a compromise. Under the Zurich and London agreements of February 1959, Cyprus became an independent republic on 16 August 1960, with Makarios as president, a Turkish Cypriot vice-president, power shared between the communities, Britain, Greece and Turkey as guarantors, and two British sovereign base areas.
    facts:
      - [EOKA campaign begins, "1 April 1955"]
      - [Zurich and London agreements, "11 and 19 February 1959"]
      - [Independence, "16 August 1960"]
