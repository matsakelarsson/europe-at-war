  - title: Nimeiry, Israel and Joseph Lagu
    date: 1969–1971
    when: "1971"
    borders: "1971-06-01"
    countries: [ss, sd, ug]
    body:
      - On 25 May 1969 a group of army officers led by Colonel Gaafar Nimeiry took power in Khartoum, with communist support. On 9 June the new government recognised the south’s right to regional autonomy and appointed a southern communist, Joseph Garang, as minister for southern affairs, but the fighting went on. Israel, which saw Sudan as an ally of Egypt, began in 1969 to supply the Anyanya with arms, training and advisers through Uganda and Ethiopia, and arms were dropped by air in Equatoria.
      - Joseph Lagu, a former army officer from Equatoria, controlled the Israeli supplies and used them to bring the rebel commanders under his command. In 1971 he pushed aside the exile politicians of the Nile Provisional Government under Gordon Muortat Mayen and united the guerrillas as the Southern Sudan Liberation Movement (SSLM), with the Anyanya as its army. In Uganda, Milton Obote had cut off help to the rebels after 1969, but Idi Amin, who seized power in January 1971, at first let it flow again.
      - In July 1971 communist officers briefly overthrew Nimeiry; after his return he executed their leaders, Joseph Garang among them, broke with the communists and turned to the West and to a settlement in the south, where the war was costly and could not be won.
    facts:
      - [Nimeiry takes power, "25 May 1969"]
      - [Declaration on southern autonomy, "9 June 1969"]
      - [Southern Sudan Liberation Movement founded, "1971"]
      - [Communist coup attempt, "19–22 July 1971"]
