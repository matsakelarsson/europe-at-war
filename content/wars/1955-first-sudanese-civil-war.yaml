  - title: Abboud and the Anyanya
    date: 1958–1964
    when: "1963-09"
    borders: "1964-03-01"
    countries: [ss, sd, ug]
    body:
      - On 17 November 1958 the army commander, General Ibrahim Abboud, seized power in Khartoum. His regime saw the south’s distinct identity as a threat to national unity and set out to make it Arabic and Muslim. It opened Islamic institutes, made Friday instead of Sunday the day of rest in 1960, restricted the missions by the Missionary Societies Act of 1962, and in February and March 1964 expelled all foreign missionaries from the south. Students and officials who protested were arrested, and many educated southerners fled.
      - In exile in Uganda and the Congo, southern politicians led by Joseph Oduho, Father Saturnino Lohure and William Deng founded the Sudan African National Union (SANU) in 1963. The same year former mutineers, students and new recruits formed the Anyanya, a guerrilla force that took its name from a Madi word for snake venom. Short of arms, it attacked police posts and small garrisons, among them Wau in January 1964, and raided for weapons. The army answered by burning villages suspected of helping the rebels, and tens of thousands of southerners fled to Uganda, the Congo, the Central African Republic and Ethiopia.
      - In October 1964 a student protest at the University of Khartoum, set off by a seminar on the southern problem, grew into a general strike that brought down Abboud’s regime. The new civilian government released southern prisoners and offered talks.
