id: first-sudanese-civil-war
name: First Sudanese Civil War
start: "1955-08-18"
end: "1972-03-27"
tier: A
summary: "The war between the government of Sudan and southern Sudanese rebels, the first of the two civil wars that led to South Sudan’s independence. Under British rule the south had been governed apart from the Arabic-speaking, Muslim north, and when Sudan moved towards independence southerners feared domination by northern officials. On 18 August 1955 southern soldiers of the Equatoria Corps mutinied at Torit and killed northern officers, traders and their families. After independence in 1956, and especially under the military regime of Ibrahim Abboud (1958–1964), which pressed Arabic and Islam on the south and expelled foreign missionaries, scattered resistance grew into a guerrilla war led from 1963 by the Anyanya. Massacres of southern civilians by government troops in Juba and Wau in 1965 deepened it. From 1969 Israel armed the rebels, and in 1971 Joseph Lagu united them as the Southern Sudan Liberation Movement. Gaafar Nimeiry’s government made peace by the Addis Ababa Agreement of 1972, which gave the south self-government as one region. Estimates of the dead run from 500,000 to a million, most of them civilians, and hundreds of thousands fled to neighbouring countries."
countries: [sd, ss, ug]
sides:
  - id: sd
    name: Sudan (the government in Khartoum)
    polities: [sudan, anglo-egyptian-sudan]
    ink: red
    moves: Government moves
    success: Government success
  - id: any
    name: Southern rebels (the Anyanya, from 1971 the Southern Sudan Liberation Movement)
    polities: [anyanya]
    ink: green
    moves: Anyanya moves
    success: Anyanya success
notes:
  - "The name Anyanya comes from a word in the Madi language meaning snake venom. Its forces were never a single army before 1971: local commanders, exile politicians in Kampala, Kinshasa and Nairobi and several rival “governments” competed for leadership."
  - Casualty figures are rough estimates; there was no count, and most deaths were of civilians from violence, hunger and disease.
