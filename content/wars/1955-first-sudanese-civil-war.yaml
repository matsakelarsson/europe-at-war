  - title: The Round Table and the massacres of 1965
    date: 1965–1968
    when: "1965-07-08"
    borders: "1965-07-08"
    countries: [ss, sd]
    body:
      - In March 1965 the transitional government held a Round Table Conference in Khartoum with northern parties and southern representatives. The northern parties offered regional self-government at most, while SANU’s exiles under Aggrey Jaden demanded self-determination and William Deng’s wing a federation; the conference ended without agreement. After elections in 1965 the new prime minister, Mohamed Ahmed Mahgoub, chose a military solution.
      - On 8–9 July 1965 government troops went through the southern quarters of Juba, shooting civilians and burning houses; estimates of the dead range from about 1,000 to 3,000, with 1,400 often cited. Two days later in Wau soldiers surrounded a house where educated southerners were celebrating a wedding and opened fire, killing 76. The government said the guests were rebels. Thousands more southerners fled, and many of the educated young men who had hoped for a political settlement joined the guerrillas.
      - The Anyanya spread from Equatoria into Upper Nile and Bahr el Ghazal and grew to perhaps 10,000–18,000 fighters by the late 1960s, though they remained divided among local commanders and rival exile governments, among them the Southern Sudan Provisional Government and the Nile Provisional Government. The army held the towns; the guerrillas held much of the countryside. William Deng, who had returned to take part in elections, was killed by soldiers in May 1968.
