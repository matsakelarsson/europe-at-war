steps:
  - title: Torit
    date: July – August 1955
    when: "1955-08-18"
    borders: "1955-08-18"
    countries: [ss, sd]
    body:
      - For most of the Anglo-Egyptian condominium the British ran the south as a separate world. From 1930 their Southern Policy closed it to northern traders, favoured English and Christian mission schools over Arabic and Islam, and left it far behind the north in education and development. In 1946 the policy was reversed and the south was joined to the north on the road to self-government, but when the departing British officials were replaced by Sudanese in 1954, southerners received only a handful of the some 800 posts. Northern administrators, teachers and officers took over the south, and rumours spread that southerners were to be made slaves again.
      - In July 1955, at the Zande cotton scheme of Nzara, troops and police fired on protesting workers and killed several. On 18 August 1955 No. 2 Company of the Equatoria Corps, ordered north to Khartoum, mutinied at Torit, fearing they were to be disarmed and killed. The mutiny spread to Juba, Yei and Maridi, and in Torit and elsewhere northern officers, officials, traders and their families were hunted down. A commission of inquiry counted at least 261 northerners and 75 southerners killed.
      - Troops flown in from the north put down the rising within weeks. Many mutineers surrendered, and some were tried and executed; others took their weapons into the bush or across the border into Uganda, where they formed the first nucleus of later resistance. Sudan became independent on 1 January 1956 with the southern question unresolved; the promise that the south’s demand for a federation would be considered was not kept.
