  - title: The Addis Ababa Agreement
    date: February – March 1972
    when: "1972-02-27"
    borders: "1972-03-27"
    countries: [ss, sd, et]
    body:
      - Secret contacts, helped by the World Council of Churches and the All Africa Conference of Churches, led to talks in Addis Ababa under the patronage of Emperor Haile Selassie. Abel Alier led the government delegation and Ezboni Mondiri the SSLM’s. The agreement signed on 27 February 1972 made the three southern provinces a self-governing Southern Region with its own elected assembly and a High Executive Council in Juba, recognised English as its principal language, and provided for 6,000 Anyanya fighters to be taken into the national army. Nimeiry decreed it on 3 March, and the ceasefire took effect when the agreement was ratified on 27 March 1972.
      - Abel Alier became the first president of the High Executive Council and Lagu a major-general in the army. Hundreds of thousands of refugees and displaced people returned home. The peace lasted eleven years, worn down by disputes over the border districts, over oil found near Bentiu in 1978 and over the Jonglei Canal. In 1983 the Bor mutiny in May began the second civil war, and Nimeiry divided the Southern Region in June and imposed Islamic law in September.
    facts:
      - [Agreement signed, "27 February 1972"]
      - [Agreement ratified, "27 March 1972"]
      - [Anyanya integrated into the army, "6,000 men"]
