  - title: Vietnamization, Cambodia and Laos
    date: 1969–1971
    when: "1969-03-18"
    borders: "1970-05-15"
    countries: [vn, us, kh, la]
    body:
      - "Richard Nixon, president from January 1969, set out to withdraw American troops while building up the South Vietnamese army, a policy he called Vietnamization; the first 25,000 Americans left in the summer of 1969, and the ARVN grew to more than a million men. In May 1969 American paratroopers took Hill 937 in the A Sầu valley, the “Hamburger Hill”, in ten days of fighting, and abandoned it soon after. Ho Chi Minh died on 2 September 1969; Lê Duẩn led the party. On 18 March 1969 American B-52s began the secret bombing of PAVN and NLF bases inside Cambodia, Operation Menu, which was hidden from Congress and the public."
      - "On 18 March 1970 Lon Nol deposed Prince Norodom Sihanouk, who had tolerated the Vietnamese bases in eastern Cambodia. On 29 April South Vietnamese troops crossed into the Parrot’s Beak, and on 1 May American and South Vietnamese forces entered the Fishhook, to destroy the bases and the Front’s headquarters. They captured large stores of weapons and rice but not the headquarters, and the Americans withdrew by 30 June. The incursion set off protests across the United States; on 4 May National Guardsmen shot dead four students at Kent State University. The PAVN moved deeper into Cambodia, where it fought Lon Nol’s army and helped the Khmer Rouge (see the Cambodian Civil War)."
      - "Congress now barred American ground troops from Cambodia and Laos. In Operation Lam Sơn 719, from 8 February to 25 March 1971, some 17,000 South Vietnamese troops with American air support drove along Route 9 into Laos to cut the Ho Chi Minh trail at Tchepone. The PAVN counter-attacked with tanks and much larger forces; the South Vietnamese reached the ruins of Tchepone by helicopter on 6 March and then retreated in disorder. Officially they lost 1,529 dead and 625 missing, and the Americans 253 dead and 107 helicopters destroyed; other estimates are far higher. Hanoi hailed it as a great victory, and the trail was soon working again."
    facts:
      - [Operation Menu, "18 March 1969 – May 1970"]
      - [Coup in Cambodia, "18 March 1970"]
      - [Cambodian incursion, "29 April – 30 June 1970 (US), to July 1970 (ARVN)"]
      - [Lam Sơn 719, "8 February – 25 March 1971"]
