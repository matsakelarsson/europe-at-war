  - title: The fall of Saigon
    date: January – 30 April 1975
    when: "1975-01-06"
    borders: "1975-04-29"
    countries: [vn, us]
    body:
      - "The PAVN took the province of Phước Long on 6 January 1975, and when the United States did not respond, Hanoi launched its spring offensive. General Văn Tiến Dũng attacked Buôn Ma Thuột in the Central Highlands on 10 March and took it the next day. Thiệu ordered the highlands abandoned to save his forces for the coast, but the retreat down Route 7B became a rout in which soldiers and civilians alike were killed by PAVN attacks and fell by the roadside; of some 60,000 troops who set out, only about 20,000 reached the coast. In the north, Quảng Trị and Huế fell by 26 March, and Da Nang, crowded with refugees, fell on 29–30 March amid panic. Nha Trang and Cam Ranh were given up in early April."
      - "At Xuân Lộc, on the road to Saigon, the South Vietnamese 18th Division held out from 9 to 21 April against three PAVN divisions before withdrawing. Thiệu resigned on 21 April and left the country; on 28 April General Dương Văn Minh took over, hoping to negotiate. Some fifteen PAVN divisions closed on Saigon in what Hanoi called the Ho Chi Minh Campaign. As rockets hit Tân Sơn Nhứt airport on 29 April, the Americans began Operation Frequent Wind, flying some 7,000 people, Americans and Vietnamese, by helicopter from the airport and the embassy roof to ships offshore; tens of thousands more left by sea."
      - "Around noon on 30 April PAVN tanks broke through the gates of the Independence Palace, and Minh announced the surrender on the radio. Saigon was renamed Ho Chi Minh City, and Vietnam was formally reunited as the Socialist Republic of Vietnam on 2 July 1976. Vietnam celebrates 30 April as the day of reunification; for many Vietnamese abroad it is “Black April”. Hundreds of thousands of former officers and officials of the South were sent to re-education camps, some for many years, and from 1975 to the 1990s some 800,000 people reached other countries by boat; estimates of those who died at sea range from 200,000 to 400,000. Cambodia and Laos fell to the Khmer Rouge and the Pathet Lao in the same weeks."
    facts:
      - [Phước Long taken, "6 January 1975"]
      - [Buôn Ma Thuột taken, "11 March 1975"]
      - [Da Nang taken, "29–30 March 1975"]
      - [Battle of Xuân Lộc, "9–21 April 1975"]
      - [Surrender of Saigon, "30 April 1975"]
