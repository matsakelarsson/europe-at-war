id: vietnam-war
name: Vietnam War
start: "1955-11-01"
end: "1975-04-30"
tier: A
summary: "The war for the south of Vietnam between the communist Democratic Republic of Vietnam (North Vietnam) and the National Liberation Front it directed in the South, on one side, and the Republic of Vietnam (South Vietnam) and the United States with its allies on the other. The Geneva Accords of 1954 divided Vietnam at the 17th parallel pending elections that were never held. From 1959 Hanoi backed an armed rising in the South, and the United States, which saw South Vietnam as a barrier against the spread of communism in Asia, sent first advisers and money, then, after the Gulf of Tonkin incident of August 1964, bombers and from March 1965 combat troops, more than half a million by 1968. The war of attrition that followed, fought in the villages, jungles and highlands of the South and in the air over the North, Laos and Cambodia, could not be won by either side. The Tết Offensive of 1968 failed militarily but turned American opinion against the war. Under Richard Nixon the United States handed the fighting to the South Vietnamese army, carried the war into Cambodia and Laos and withdrew after the Paris Peace Accords of January 1973. Two years later the North Vietnamese army overran the South, and Saigon fell on 30 April 1975. Estimates of the Vietnamese dead range from about 1 million to more than 3 million; some 58,000 Americans died."
countries: [vn, us, kh, la, kr, au, nz, th, ph, cn]
