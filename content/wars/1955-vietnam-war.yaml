  - title: Rolling Thunder and the American build-up
    date: 1965–1966
    when: "1965-02-07"
    borders: "1965-12-31"
    countries: [vn, us, kr, au, nz, th, ph, cn]
    body:
      - "On 7 February 1965 the NLF attacked the American base at Camp Holloway near Pleiku, killing eight Americans; Johnson ordered reprisal raids, and on 2 March began Operation Rolling Thunder, a bombing campaign against North Vietnam that lasted with pauses until 1 November 1968. Its aims were to break Hanoi’s will and cut the flow of men and supplies to the South. Aircraft flew from carriers in the Gulf of Tonkin and from bases in South Vietnam and Thailand, which let the Americans use its airfields at Udon, Ubon, Korat, Takhli and later U-Tapao. The North built one of the densest air defences in the world with Soviet missiles, guns and MiG fighters; China sent anti-aircraft and engineering troops to man guns and repair railways. The Americans lost about 900 aircraft over the North, and tens of thousands of North Vietnamese were killed."
      - "On 8 March 1965 some 3,500 US Marines came ashore at Da Nang, the first American combat troops in Vietnam. In July Johnson announced that American strength would rise to 125,000; it reached 184,000 at the end of 1965, 385,000 at the end of 1966 and a peak of 543,000 in April 1969. General William Westmoreland planned a war of attrition, using American firepower and mobility to “search and destroy” the main enemy units while the South Vietnamese army guarded the populated areas. South Korea sent two divisions and a marine brigade, about 50,000 men at the peak; Australia sent a battalion in 1965 and from 1966 a task force at Núi Đất in Phước Tuy province, with New Zealand artillery and infantry; Thailand sent a division and the Philippines a civic action group. Cam Ranh Bay was turned into a vast port and air base."
      - "Hanoi answered by sending regular PAVN regiments down the Ho Chi Minh trail, which grew into a network of roads through eastern Laos. In Saigon the generals Nguyễn Văn Thiệu and Nguyễn Cao Kỳ took power in June 1965 and put down a Buddhist uprising in Da Nang and Huế in the spring of 1966; Thiệu was elected president in 1967."
    facts:
      - [Rolling Thunder, "2 March 1965 – 1 November 1968"]
      - [First US combat troops land, "Da Nang, 8 March 1965"]
      - [American troops in Vietnam, "184,000 (end 1965), 385,000 (end 1966), 543,000 (April 1969)"]
