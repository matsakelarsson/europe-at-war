  - title: The Easter Offensive
    date: March – September 1972
    when: "1972-03-30"
    borders: "1972-06-01"
    countries: [vn, us]
    body:
      - "By the spring of 1972 fewer than 100,000 American troops remained in Vietnam, and they no longer fought on the ground. On 30 March the PAVN launched its largest offensive yet, which it called the Nguyễn Huệ campaign: some 120,000 men with several hundred tanks attacked on three fronts. Across the demilitarised zone they overran the South Vietnamese bases and took Quảng Trị on 1 May; South Vietnamese troops and thousands of refugees fleeing south on Route 1 were shelled on the road, which became known as the Highway of Horror. From Cambodia, PAVN divisions took Lộc Ninh and besieged An Lộc, about 100 km from Saigon, from 13 April. In the Central Highlands they attacked Kon Tum in May."
      - "The South Vietnamese held An Lộc, Kon Tum and Huế, with massive help from American aircraft, B-52s above all. Nixon, who had visited Beijing in February and was about to go to Moscow, ordered the mining of Haiphong and other northern ports on 8 May and a new bombing campaign against the North, Operation Linebacker, from 10 May to 23 October. In a counter-offensive from late June, South Vietnamese marines and paratroopers retook the ruined citadel of Quảng Trị on 16 September after 81 days of fighting. Both sides lost tens of thousands of men. The PAVN kept a strip of territory in northern Quảng Trị, around Lộc Ninh and in the highlands, where the Provisional Revolutionary Government would set up its administration."
    facts:
      - [PAVN offensive begins, "30 March 1972"]
      - [Quảng Trị taken, "1 May 1972"]
      - [Siege of An Lộc, "13 April – July 1972"]
      - [Quảng Trị citadel retaken, "16 September 1972"]
