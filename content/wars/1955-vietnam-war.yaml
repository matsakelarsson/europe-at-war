        lonlat: [106.695, 10.777]
        lp: l
  - title: The Gulf of Tonkin
    date: August 1964
    when: "1964-08-02"
    borders: "1964-08-07"
    countries: [vn, us]
    body:
      - From early 1964 South Vietnamese commandos, trained and equipped by the Americans under a programme called OPLAN 34A, raided the North Vietnamese coast by sea, while American destroyers sailed the Gulf of Tonkin on electronic intelligence patrols. On the night of 30–31 July, commando boats shelled two North Vietnamese islands, Hòn Mê and Hòn Ngư. On the afternoon of 2 August three North Vietnamese torpedo boats attacked the destroyer USS Maddox in international waters off the coast. The Maddox and aircraft from the carrier Ticonderoga drove them off and damaged all three, killing four sailors; the destroyer was hit by a single bullet.
      - On the night of 4 August, in heavy weather, the Maddox and the Turner Joy reported a second attack and fired for hours at radar and sonar contacts. Doubts were raised the same night by the Maddox’s captain, and a study by the National Security Agency’s historian, published in 2005, concluded that no attack took place and that intercepts had been misread. President Lyndon Johnson ordered air strikes on torpedo-boat bases and the oil depot at Vinh on 5 August; two American aircraft were shot down, and Lieutenant Everett Alvarez became the first American pilot held prisoner in the North.
      - "On 7 August Congress passed the Gulf of Tonkin Resolution, by 416 votes to none in the House and 88 to 2 in the Senate, authorising the president to “take all necessary measures” to repel attacks and prevent further aggression in South-East Asia. It became the legal basis for the war and was repealed in January 1971. North Vietnam admitted the attack of 2 August, saying the ship was in its waters in support of the raids, and has always denied the second. In the South the NLF kept gaining ground; at Bình Giã, east of Saigon, its first full division defeated South Vietnamese troops in December 1964 and January 1965."
    facts:
      - [Attack on the Maddox, "2 August 1964"]
      - [Reported second attack, "4 August 1964 (did not happen)"]
      - [Retaliatory air strikes, "5 August 1964"]
      - [Gulf of Tonkin Resolution, "7 August 1964"]
