  - title: The Christmas bombing and the Paris accords
    date: December 1972 – 1974
    when: "1972-12-18"
    borders: "1973-01-27"
    countries: [vn, us]
    body:
      - "In secret talks in Paris, Henry Kissinger and Lê Đức Thọ reached a draft agreement in October 1972, but Thiệu rejected it, and the talks broke down in December. From 18 to 29 December Nixon sent B-52s against Hanoi and Haiphong in Operation Linebacker II, the heaviest bombing of the war. North Vietnam’s air defences shot down 15 B-52s, and Hanoi said 1,624 civilians were killed, among them those in Khâm Thiên street and at Bạch Mai hospital. North Vietnamese call it the “Điện Biên Phủ in the air”."
      - "The Paris Peace Accords were signed on 27 January 1973 by the United States, North Vietnam, South Vietnam and the Provisional Revolutionary Government. They provided for a ceasefire in place, the withdrawal of all American troops within 60 days and the exchange of prisoners; 591 American prisoners were flown home, many from the Hỏa Lò prison in Hanoi. PAVN troops were allowed to stay in the South, and a council of reconciliation was to arrange elections; it was never formed. The last American combat troops left on 29 March 1973. Kissinger and Lê Đức Thọ were awarded the Nobel Peace Prize; Thọ refused it."
      - "The ceasefire never held. Both sides fought for land and villages through 1973 and 1974, while Congress banned all American military action in Indochina from 15 August 1973 and cut aid to Saigon. Nixon resigned in August 1974. With inflation and the oil crisis hurting the South’s economy and its army short of fuel and ammunition, Hanoi decided to test American resolve."
    facts:
      - [Linebacker II, "18–29 December 1972"]
      - [Paris Peace Accords, "27 January 1973"]
      - [Last American combat troops leave, "29 March 1973"]
