  - title: Tết and Huế
    date: January – March 1968
    when: "1968-01-30"
    borders: "1968-02-15"
    countries: [vn, us]
    body:
      - "Hanoi’s leaders, with Lê Duẩn foremost, planned a “general offensive and general uprising” to break the stalemate, bring down the Saigon government and push the Americans to negotiate. From 21 January 1968 PAVN divisions besieged the US Marine base at Khe Sanh, which drew American attention and reserves to the north. In the night of 30–31 January, during the truce for Tết, the lunar new year, some 80,000 NLF and PAVN troops attacked more than 100 towns and cities, among them 36 of the 44 provincial capitals. In Saigon a team of 19 sappers broke into the grounds of the American embassy and held out for six hours, and fighting raged at the airport, the presidential palace and in the Chinese district of Chợ Lớn. A photograph of the national police chief, Nguyễn Ngọc Loan, shooting a captured NLF officer in the street went round the world."
      - "In Huế, PAVN and NLF troops took most of the city, including the old imperial Citadel, on 31 January. US Marines and South Vietnamese troops retook it in nearly four weeks of house-to-house fighting, with heavy shelling and bombing; the Citadel was cleared on 24 February. Much of the city was destroyed and most of its 140,000 people were left homeless. During their occupation the communist forces arrested and killed officials, officers, teachers, Catholic priests, foreigners and others they considered enemies; mass graves were found in and around the city over the following months. Estimates of those killed range from about 2,800 to almost 6,000. Hanoi has said that many of the dead were killed in the American bombardment and has not acknowledged the scale of the killings."
      - "Militarily the offensive failed: no uprising took place, the attackers were driven out of nearly every town within days, and the NLF lost much of its southern cadre. But it shocked American opinion, which had been told that the war was being won. On 31 March Johnson limited the bombing of the North, offered talks and announced that he would not seek re-election; talks began in Paris in May. Khe Sanh was relieved in April and abandoned in July. More Americans died in 1968, about 16,900, than in any other year of the war."
    facts:
      - [Siege of Khe Sanh, "21 January – 8 April 1968"]
      - [Tết attacks, "30–31 January 1968"]
      - [Battle of Huế, "31 January – 2 March 1968"]
      - [Killings in Huế, "estimates range from about 2,800 to almost 6,000"]
