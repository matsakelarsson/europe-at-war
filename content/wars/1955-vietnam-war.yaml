  - title: Ia Drang and the war of attrition
    date: November 1965 – 1967
    when: "1965-11-14"
    borders: "1967-01-01"
    countries: [vn, us, au, nz, kr]
    body:
      - "In November 1965 the American 1st Cavalry Division, which moved by helicopter, met three PAVN regiments in the valley of the Ia Drang below the Chu Pong massif, near the Cambodian border in the Central Highlands. At Landing Zone X-Ray, from 14 to 16 November, Lieutenant Colonel Harold Moore’s battalion held off repeated attacks with the help of artillery and B-52 strikes; on 17 November another battalion marching to Landing Zone Albany was ambushed and lost more than half its men. About 230 Americans were killed in the battle; American estimates of the PAVN dead ran to more than 1,000, while Vietnamese accounts give fewer. Both sides drew lessons from it: the Americans that their firepower could win by attrition, the North Vietnamese that they could limit it by fighting at close quarters."
      - "For the next two years American and allied units swept the countryside in search of the main enemy forces, measuring success by the number of enemy dead counted. In Operation Cedar Falls in January 1967, in the Iron Triangle north-west of Saigon, the village of Bến Súc was razed and its people moved to camps while engineers searched the NLF tunnels; in Junction City from February to May, the largest American operation of the war, troops swept War Zone C along the Cambodian border without finding the Front’s headquarters. Battles near the demilitarised zone, at Con Thiên and in the hills around Khe Sanh, and at Đắk Tô in November 1967 cost both sides heavily. Large areas were declared free-fire zones, and the bombing and shelling drove millions of South Vietnamese from their villages into camps and towns."
      - "On 18 August 1966, in a rubber plantation at Long Tân near the Australian base at Núi Đất, a company of 108 men, among them three New Zealanders, fought much larger NLF and PAVN forces in a monsoon downpour until relieved at nightfall. Eighteen Australians were killed; the Australians counted 245 enemy dead, a figure Vietnamese accounts dispute. In the United States, opposition to the war grew with the draft and the casualty lists, and tens of thousands of protesters marched on the Pentagon in October 1967."
    facts:
      - [Battle of the Ia Drang, "14–18 November 1965"]
      - [Battle of Long Tân, "18 August 1966"]
      - [Cedar Falls and Junction City, "January–May 1967"]
