    moves: South Vietnamese moves
    success: South Vietnamese success
  - id: us
    name: The United States and its allies
    polities: [united-states, south-korea, australia, new-zealand, thailand, philippines]
    ink: blue
    moves: American and allied moves
    success: American and allied success
notes:
  - In Vietnam the war is called the Resistance War against America (Kháng chiến chống Mỹ) or simply the American War; it is also known as the Second Indochina War. “Viet Cong”, short for Việt Nam Cộng sản (“Vietnamese communist”), was the name the Saigon government and the Americans gave to the National Front for the Liberation of South Vietnam (NLF), founded in 1960, and to its army, the People’s Liberation Armed Forces (PLAF). From 1969 the Front’s government was the Provisional Revolutionary Government (PRG). North Vietnam’s army was the People’s Army of Vietnam (PAVN), which the Americans called the NVA; South Vietnam’s was the Army of the Republic of Vietnam (ARVN).
  - The war has no agreed starting date. The United States counts it from 1 November 1955, when its Military Assistance Advisory Group took over the training of the South Vietnamese army; others date it from Hanoi’s decision for armed struggle in 1959, the founding of the NLF in 1960 or the arrival of American combat troops in 1965. Vietnamese historians date the resistance against America from 1954.
  - "How the war is seen. Hanoi and the NLF presented it as a war of national reunification and against foreign intervention, the continuation of the war against France; the governments in Saigon and Washington presented it as the defence of an independent state against invasion and subversion directed from the North, backed by the Soviet Union and China. Historians have stressed that it was at once a civil war among Vietnamese, a war of decolonisation and a battleground of the Cold War."
  - "Casualty figures are uncertain. In 1995 the Vietnamese government gave the dead of 1955–1975 as about 1.1 million North Vietnamese and NLF soldiers and 2 million civilians in North and South; other estimates of all Vietnamese deaths range from about 1 million to 3.8 million. South Vietnam’s army lost an estimated 250,000–313,000 dead. The United States lost 58,220 dead, South Korea about 5,100, Australia 521, Thailand about 350 and New Zealand 37. The Soviet Union and China supplied the North with weapons, and some 320,000 Chinese anti-aircraft, engineering and railway troops served there in turn between 1965 and 1973."
