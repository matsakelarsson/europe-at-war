steps:
  - title: Two Vietnams
    date: 1954–1960
    when: "1955-10-26"
    borders: "1958-01-01"
    countries: [vn, us]
    body:
      - The Geneva Accords of 21 July 1954 ended the First Indochina War. Vietnam was divided, as a temporary military line, at the 17th parallel along the Bến Hải river, with a demilitarised zone on either side; the Democratic Republic of Vietnam of Ho Chi Minh took the North, and the French and the State of Vietnam of the former emperor Bảo Đại the South. The conference’s final declaration called for elections throughout Vietnam in July 1956, but neither the State of Vietnam nor the United States endorsed it. In the 300 days during which people could move between the zones, some 800,000 to 1 million northerners went south, most of them Catholics, many carried by the US Navy in Operation Passage to Freedom, while some 90,000 Viet Minh fighters and their families regrouped to the North. Thousands of Viet Minh members stayed behind in the South.
      - "In the South, Ngô Đình Diệm, a Catholic nationalist whom Bảo Đại had made prime minister, broke the private armies of the Cao Đài and Hòa Hảo sects and the Bình Xuyên in 1955 with American support, deposed Bảo Đại in a referendum on 23 October 1955 with an implausible 98 percent of the vote, and proclaimed the Republic of Vietnam three days later. On 1 November 1955 an American advisory group took over the training of his army. Diệm refused to hold the 1956 elections, arguing that his state had not signed the accords and that no free vote was possible in the North, and Washington backed him. His campaign against the communists and other opponents put tens of thousands in prison camps, and a law of 1959 set up military courts that could sentence them to death. In the North, a land reform of 1953–1956 executed people classed as landlords; estimates range from several thousand to about 15,000 dead, and the party later admitted “errors”."
      - "In January 1959 the Central Committee of the ruling Workers’ Party in Hanoi decided to add armed struggle to political struggle in the South. From May 1959 a special unit, Group 559, began to open a supply route through the mountains of eastern Laos, the Ho Chi Minh trail, and from 1960 thousands of southerners who had gone north in 1954 returned along it. In January 1960 villagers led by communist cadres rose against the government in Bến Tre province in the Mekong delta, the Đồng Khởi (“simultaneous uprising”), and the revolt spread. On 20 December 1960, in a forest base in Tây Ninh province near the Cambodian border, the National Front for the Liberation of South Vietnam was founded, a coalition led by the communists but open to all opponents of Diệm. Hanoi described it as an independent southern movement; it was directed by the party, through a Central Office for South Vietnam set up in 1961."
    facts:
      - [Geneva Accords, "21 July 1954"]
      - [Republic of Vietnam proclaimed, "26 October 1955"]
      - [American advisory group takes over training, "1 November 1955"]
      - [National Liberation Front founded, "20 December 1960"]
