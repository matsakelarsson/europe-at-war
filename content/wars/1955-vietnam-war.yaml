  - title: Advisers, strategic hamlets and Diệm’s fall
    date: 1961–1963
    when: "1961"
    borders: "1963-11-01"
    countries: [vn, us]
    body:
      - President John F. Kennedy raised the number of American military advisers in South Vietnam from about 900 at the end of 1960 to some 16,000 at the end of 1963, and sent helicopter units to carry the South Vietnamese army into battle. In January 1962 American aircraft began spraying herbicides on forests and crops to deny the guerrillas cover and food. From March 1962 the Saigon government’s Strategic Hamlet Programme moved millions of peasants into fortified villages to cut them off from the NLF; many resented being uprooted, and the Front often turned the hamlets to its own use. The Front’s armed forces grew from a few thousand to tens of thousands of fighters.
      - "At Ấp Bắc in the Mekong delta on 2 January 1963, a guerrilla battalion of a few hundred men stood its ground against about 1,400 South Vietnamese troops backed by American helicopters and armoured personnel carriers, shot down five helicopters and slipped away at night. More than 80 South Vietnamese soldiers and three Americans were killed, against some 18 dead on the NLF side. American advisers and reporters described the battle as a sign that the South Vietnamese army could not win."
      - "In May 1963 a political crisis began in Huế, when government forces fired on Buddhists protesting a ban on flying their flag on the Buddha’s birthday, killing nine people. On 11 June the monk Thích Quảng Đức burned himself to death at a Saigon crossroads in protest against the Catholic-dominated regime, and in August troops loyal to Diệm’s brother Ngô Đình Nhu raided pagodas across the country. With Washington’s knowledge, a group of generals led by Dương Văn Minh overthrew Diệm on 1 November 1963; he and Nhu were killed the next day. Kennedy was assassinated three weeks later. A succession of coups and short-lived governments followed in Saigon, while the NLF expanded its hold on the countryside."
    facts:
      - [American advisers, "about 900 (1960) to about 16,000 (1963)"]
      - [Battle of Ấp Bắc, "2 January 1963"]
      - [Coup against Diệm, "1 November 1963"]
    markers:
