  - title: My Lai and the war on civilians
    date: 1966–1969
    when: "1968-03-16"
    borders: "1968-03-16"
    countries: [vn, us, kr]
    body:
      - "On 16 March 1968 soldiers of C Company, 1st Battalion, 20th Infantry, of the Americal Division, under Lieutenant William Calley, entered the hamlets of My Lai and My Khe in the village of Sơn Mỹ in Quảng Ngãi province, where they had been told to expect NLF fighters. They met no resistance and over some four hours killed unarmed villagers, most of them women, children and old men, and raped women and girls. The US Army counted 347 dead in My Lai; the memorial at Sơn Mỹ lists 504 names from both hamlets. A helicopter pilot, Hugh Thompson, put his aircraft between the soldiers and some villagers and flew out the survivors. The killings were covered up until a former soldier, Ron Ridenhour, wrote to Congress and the journalist Seymour Hersh published the story in November 1969. Of the soldiers charged, only Calley was convicted, in 1971; his life sentence was reduced, and he spent three and a half years under house arrest."
      - "My Lai was the worst known massacre by American troops, but not the only killing of civilians by the allied forces. South Korean marines killed between 69 and 79 villagers at Phong Nhị and Phong Nhất in Quảng Nam province on 12 February 1968, and South Korean troops were accused of other massacres, such as that at Bình Hòa in Quảng Ngãi in December 1966; South Korea has not acknowledged them, though a Seoul court ordered compensation for a survivor of Phong Nhị in 2023. In Operation Speedy Express in the Mekong delta, from December 1968 to May 1969, the US 9th Division reported nearly 11,000 enemy killed but recovered only about 750 weapons, and later inquiries concluded that thousands of the dead were civilians. The Phoenix Programme, aimed at the NLF’s political network, killed more than 20,000 people by official count."
      - "The NLF and PAVN also killed civilians on a large scale. Their campaign against the Saigon government in the villages killed tens of thousands of village chiefs, teachers, officials and their families from the late 1950s on, and mines and rocket attacks on towns killed many more. At Đắk Sơn, a village of Stieng Montagnards in Phước Long province, NLF troops using flamethrowers killed 252 people, most of them women and children, on 5 December 1967. From 1962 to 1971 American aircraft sprayed some 75 million litres of herbicides, more than half of it Agent Orange, contaminated with dioxin, over forests and crops in the South. Vietnam says millions of people were exposed and that hundreds of thousands of children were born with birth defects; the United States disputes the numbers but has paid since 2012 for clean-up at the former air bases of Da Nang and Biên Hòa."
    facts:
      - [My Lai massacre, "16 March 1968, 347 (US Army count) to 504 (Vietnamese memorial) dead"]
      - [Phong Nhị and Phong Nhất, "12 February 1968, 69–79 dead"]
      - [Đắk Sơn, "5 December 1967, 252 dead"]
      - [Herbicide spraying, "1962–1971, about 75 million litres"]
