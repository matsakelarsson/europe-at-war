id: hungarian-revolution-of-1956
name: Hungarian Revolution of 1956
start: "1956-10-23"
end: "1956-11-11"
tier: B
summary: A nationwide revolt against Hungary’s communist government and Soviet domination, which began with a student demonstration in Budapest on 23 October 1956, brought the reform communist Imre Nagy to power and briefly ended one-party rule. On 4 November the Soviet army returned in force and crushed it within a week, installing János Kádár; about 2,500 Hungarians and 700 Soviet soldiers were killed, and some 200,000 people fled the country.
countries: [hu, at]
sides:
  - id: hu
    name: Hungarian revolutionaries and the Nagy government
    polities: [hungary]
    ink: olive
    moves: Hungarian moves
    success: Revolutionary success
  - id: su
    name: Soviet Union and Hungarian state security, then the Kádár government
    polities: [ussr]
    ink: red
    moves: Soviet moves
    success: Soviet success
notes:
  - Casualty figures vary; Hungarian research gives about 2,500–3,000 Hungarians killed, and Soviet figures about 720 Soviet soldiers killed.
  - Imre Nagy, Pál Maléter and others were tried in secret and hanged on 16 June 1958. Their reburial on 16 June 1989 helped bring about the end of communist rule, and 23 October is now a national holiday in Hungary.
