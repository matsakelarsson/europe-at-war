  - title: Operation Whirlwind
    date: 4–11 November 1956
    when: "1956-11-04"
    borders: "1956-11-11"
    countries: [hu, at]
    body:
      - At dawn on 4 November Soviet forces attacked Budapest and the other cities. Nagy broadcast a last appeal and took refuge in the Yugoslav embassy, and a radio station announced Kádár’s new government. Armed groups fought on for days at the Corvin Passage, in the industrial district of Csepel and in the new steel town of Sztálinváros, which both held out until 11 November, and in the Mecsek hills near Pécs, but they had no chance against tanks and artillery. Workers’ councils kept up a general strike into December.
      - About 2,500 Hungarians, most of them young workers, and some 700 Soviet soldiers were killed. Around 200,000 people fled, most of them across the Austrian border, many over the small bridge at Andau, until the border was closed again. Tens of thousands were arrested. Nagy left the embassy under a promise of safe conduct on 22 November and was seized by Soviet troops; after a secret trial he was hanged with Maléter and others in 1958, among some 230 people executed for their part in the revolution.
    facts:
      - [Second Soviet intervention, "4 November 1956"]
      - [Last organised resistance, "Csepel, 11 November 1956"]
      - [Refugees, "about 200,000"]
