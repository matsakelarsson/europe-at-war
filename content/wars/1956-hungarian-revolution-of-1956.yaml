  - title: Days of freedom
    date: 28 October – 3 November 1956
    when: "1956-10-28"
    borders: "1956-11-03"
    countries: [hu, ua, ro]
    body:
      - Soviet troops withdrew from Budapest on 30 October, and Nagy announced the end of one-party rule and brought non-communist politicians into his government. The state security police was dissolved, political prisoners such as Cardinal József Mindszenty were freed, and new parties and newspapers appeared. There was also revenge. On 30 October insurgents stormed the Budapest party headquarters on Republic Square and lynched several of its defenders. In Moscow, the Soviet leadership first issued a conciliatory declaration, then on 31 October decided to crush the revolution, at a moment when the West was divided by the Suez crisis.
      - New Soviet divisions crossed the border from Ukraine and Romania. On 1 November Nagy declared Hungary neutral, announced its withdrawal from the Warsaw Pact and appealed to the United Nations. János Kádár, a member of his government, slipped away to the Soviets, who prepared to install him at the head of a new government. On the night of 3–4 November the defence minister, Pál Maléter, who had gone to talks on the Soviet withdrawal at the Soviet base at Tököl, was arrested there by the KGB.
    facts:
      - [Soviet troops leave Budapest, "30 October 1956"]
      - [Neutrality and withdrawal from the Warsaw Pact, "1 November 1956"]
      - [Maléter arrested at Tököl, "night of 3–4 November 1956"]
