steps:
  - title: The rising
    date: 23–28 October 1956
    when: "1956-10-23"
    borders: "1956-10-28"
    countries: [hu]
    body:
      - Encouraged by the reforms in Poland that month, students in Budapest drew up sixteen demands, among them free elections, the withdrawal of Soviet troops and the return of Imre Nagy, a reform communist expelled from power in 1955. On 23 October a march in support of Poland grew into a crowd of some 200,000 outside parliament. Demonstrators pulled down the huge statue of Stalin, and outside the radio building, where students had gone to broadcast their demands, the state security police (ÁVH) opened fire. By the morning the city was in armed revolt, and Soviet tanks rolled in at the request of the party leadership.
      - Nagy was made prime minister, but the fighting spread. Young workers and students with rifles and petrol bombs held out in the narrow streets around the Corvin Passage and Széna Square. On 25 October shooting into a crowd in front of parliament killed dozens, perhaps more than a hundred, and the next day state security men fired on a crowd at Mosonmagyaróvár. Revolutionary councils and workers’ councils took over towns and factories across the country. On 28 October Nagy announced a ceasefire, called the rising a national democratic movement and said Soviet troops would leave Budapest.
    facts:
      - [Demonstration and siege of the radio building, "23 October 1956"]
      - [Soviet tanks enter Budapest, "24 October 1956"]
      - [Ceasefire announced, "28 October 1956"]
