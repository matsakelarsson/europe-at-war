id: suez-crisis
name: Suez Crisis
start: "1956-10-29"
end: "1956-11-07"
tier: C
summary: An attack on Egypt by Israel, Britain and France after President Gamal Abdel Nasser nationalised the Suez Canal Company in July 1956. Under a secret plan agreed at Sèvres, Israel invaded the Sinai on 29 October; Britain and France, claiming to separate the two sides, bombed Egyptian airfields from 31 October and landed paratroops and marines at Port Said on 5–6 November, while Egypt blocked the canal by sinking ships in it. The United States, which put heavy financial pressure on Britain, and the Soviet Union, which threatened to intervene, both opposed the attack, and Britain and France accepted a UN ceasefire that came into force on the night of 6–7 November. Their troops left by 22 December, replaced by the first UN peacekeeping force, and Israel withdrew from Sinai and Gaza in March 1957. Israel lost 172 dead and Britain and France a few dozen; the Egyptian dead, soldiers and civilians, were never reliably counted but ran into thousands by most estimates. Nasser’s standing rose across the Arab world, and the British prime minister, Anthony Eden, resigned in January 1957.
