id: tibetan-resistance
name: Tibetan armed resistance
start: "1956"
end: "1974"
tier: C
summary: "Guerrilla resistance to Chinese rule by Tibetans, chiefly Khampas from Kham, from 1956 to 1974. Kham and Amdo lay outside the territory of the Lhasa government and were governed as parts of Sichuan, Qinghai, Gansu and Yunnan, where land reform and campaigns against monasteries and chiefs began in the mid-1950s. Revolts broke out across eastern Kham early in 1956; the PLA besieged monasteries and in March 1956 bombed the monastery of Lithang from the air. Refugees and fighters moved west into central Tibet, and on 16 June 1958 the Khampa trader Andrug Gompo Tashi formed the Chushi Gangdruk (“Four Rivers, Six Ranges”) in Lhoka, south of Lhasa, while revolts spread through Amdo. From 1957 the CIA trained Tibetans on Saipan and at Camp Hale in Colorado, 259 there in all, and dropped some of them with arms into Tibet, where most were killed. The guerrillas held much of Lhoka in 1958–1959 and escorted the Dalai Lama to India in March 1959 (see the 1959 Tibetan uprising). After the PLA crushed the revolt inside Tibet, the CIA funded a base in Mustang in northern Nepal, where about 2,000 fighters under Baba Yeshi gathered from 1960 and raided across the border; a raid in 1961 captured a satchel of PLA documents. American support was reduced as the United States sought better relations with China and ended in 1974. That year, under Chinese pressure, Nepal’s army moved into Mustang; the Dalai Lama urged the guerrillas to lay down their arms, most surrendered, and their commander Gyatotsang Wangdu was killed in an ambush near the Tinkar pass as he tried to reach India. The number of people killed in Kham and Amdo is not known."
