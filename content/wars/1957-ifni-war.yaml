id: ifni-war
name: Ifni War
start: "1957-11-23"
end: "1958-06-30"
tier: B
summary: "A war between Spain and the Moroccan Army of Liberation, irregular forces that newly independent Morocco tolerated and in part armed, over the Spanish enclave of Ifni and the Spanish Sahara. After Morocco became independent in 1956, the southern units of the Army of Liberation, which had fought the French protectorate, turned on the Spanish territories that the Istiqlal party and the king claimed as part of a Greater Morocco, and many Sahrawi tribesmen joined them. On 23 November 1957 the irregulars attacked Sidi Ifni and the Spanish posts inland; Spain relieved the besieged posts of Tiliouine and Telata with paratroopers and the Legion, then pulled back to a perimeter around the town, which stayed under siege until June 1958. In the Sahara the irregulars drove the Spanish back to the coast, and Spanish legionnaires were ambushed at Edchera in January 1958. In February 1958 some 9,000 Spanish and 5,000 French troops with about 150 aircraft, the Spanish Operation Teide and the French Operation Écouvillon, swept the desert from El Aaiún, Villa Cisneros, Tindouf and Fort Gouraud and broke the irregulars. By the Treaty of Angra de Cintra of 1 April 1958 Spain handed Cape Juby, the Tarfaya Strip, to Morocco, but it kept Sidi Ifni until 1969 and Western Sahara until 1976. Spain lost about 200 dead and 80 missing; the irregulars lost an estimated 800–1,000 dead."
countries: [ma, eh, es, fr, mr]
