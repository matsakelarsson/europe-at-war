  - title: Angra de Cintra and the cession of Tarfaya
    date: April 1958 – June 1969
    when: "1958-04-10"
    borders: "1958-04-10"
    countries: [ma, es, eh]
    body:
      - "With the irregulars beaten in the desert, Spain was ready to give up what mattered least to it. By the Treaty of Angra de Cintra, signed on 1 April 1958 after talks between the foreign ministers Fernando María Castiella and Ahmed Balafrej on the Bay of Cintra in Río de Oro, Spain handed over its southern protectorate zone of Cape Juby, the Tarfaya Strip between the Draa and the parallel 27°40′ N, which it had not given up with the rest of its protectorate in 1956. The handover took place at Villa Bens, the town of Tarfaya, on 10 April, in the presence of the crown prince, the future Hassan II. In the same months the Moroccan government took the Army of Liberation’s units in the south into the Royal Armed Forces or disbanded them."
      - "Spain kept Sidi Ifni and its perimeter, and made both Ifni and the Sahara Spanish provinces in January 1958. Under pressure from the United Nations, which called for the decolonisation of Ifni and the Spanish Sahara from 1965, Spain ceded Ifni to Morocco by the Treaty of Fez of January 1969 and left on 30 June 1969. The Spanish Sahara remained Spanish until 1975–1976, when the Green March and the Madrid Accords opened the Western Sahara War."
    facts:
      - [Treaty of Angra de Cintra, "1 April 1958"]
      - [Tarfaya handed to Morocco, "10 April 1958"]
      - [Ifni handed to Morocco, "30 June 1969"]
    markers:
