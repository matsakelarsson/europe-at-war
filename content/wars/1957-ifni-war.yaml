id: ifni-war
name: Ifni War
start: "1957-11-23"
end: "1958-06-30"
tier: C
summary: A war between Spain and the Moroccan Army of Liberation, irregular forces backed by newly independent Morocco, over the Spanish enclave of Ifni and the Spanish Sahara. In November 1957 the irregulars attacked Sidi Ifni and the Spanish posts inland, and Spain withdrew to a small perimeter around the town, which was besieged; in the Sahara, a joint Spanish–French offensive in February 1958 broke the insurgents. By the Treaty of Angra de Cintra of April 1958 Spain ceded Cape Juby (the Tarfaya Strip) to Morocco, but it kept Sidi Ifni until 1969 and Western Sahara until 1975.
