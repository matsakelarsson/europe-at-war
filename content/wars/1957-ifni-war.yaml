steps:
  - title: The attack on Ifni
    date: November – December 1957
    when: "1957-11-23"
    borders: "1957-11-23"
    countries: [ma, es]
    body:
      - "Ifni, a strip of coast and mountains some 60 km long around the port of Sidi Ifni, had been Spanish since 1934, under a claim going back to the treaty that ended the war of 1859–1860. When France and Spain ended their protectorates in 1956, Spain kept Ifni, its southern protectorate zone of Cape Juby (Tarfaya) and the Spanish Sahara to the south. Moroccan nationalists, led by the Istiqlal party and Allal al-Fassi’s idea of a Greater Morocco that reached to the Senegal River, claimed them all. Demonstrations against Spanish rule broke out in Ifni in April 1957, and units of the Army of Liberation gathered at Goulimine and Bouizakarne, just outside the enclave."
      - "On 23 November 1957 some 2,000 irregulars, many of them local Aït Ba Amrane tribesmen, attacked Sidi Ifni and the small posts inland, cutting telephone lines and seizing ammunition. The attack on the town failed, but several posts were cut off. At Tiliouine some 60 Ifni riflemen held out until paratroopers were dropped to them and a Legion column broke through on 3 December; at Telata a paratroop platoon sent to relieve the post fought its way back through repeated ambushes. Spain then gave up the interior and held only a perimeter of about 8 km around Sidi Ifni, with 7,500 men by 9 December. The siege lasted until June 1958 but saw little fighting after December."
    facts:
      - [Attack on Sidi Ifni and the posts, "23 November 1957"]
      - [Tiliouine relieved, "3 December 1957"]
      - [Spanish garrison of Sidi Ifni, "about 7,500 by 9 December 1957"]
