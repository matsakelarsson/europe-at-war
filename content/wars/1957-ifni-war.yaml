  - title: The Sahara and Operation Écouvillon
    date: January – February 1958
    when: "1958-01-12"
    borders: "1958-02-10"
    countries: [eh, ma, es, fr, mr]
    body:
      - "In the Spanish Sahara, a land of a few tens of thousands of nomads, the irregulars and the Sahrawi tribesmen who joined them attacked the scattered Spanish posts in late 1957. Spain abandoned Smara and the interior and held only the coastal towns of El Aaiún, Villa Cisneros (Dakhla) and Cape Juby. On 12 January 1958 the irregulars attacked El Aaiún and were driven off; on 13 January they ambushed two companies of the Legion’s 13th Battalion at Edchera, on the Saguia el-Hamra east of the town, in a fight that lasted until nightfall."
      - "France feared the war would spread to Mauritania and Algeria, where the Army of Liberation also raided, and agreed to a joint campaign. On 10 February 1958 some 9,000 Spanish troops (Operation Teide) and 5,000 French (Operation Écouvillon), with about 150 aircraft, attacked from El Aaiún and Villa Cisneros and from Tindouf and Fort Gouraud. The Spanish drove the irregulars from the Tarfaya Strip and from Edchera and retook Smara, and on 21 February Spanish and French columns met near Bir Anzarane and Aousserd. By the end of February the irregulars had been scattered and driven north of the Draa, and many Sahrawi families fled to Morocco with them."
    facts:
      - [Attack on El Aaiún, "12 January 1958"]
      - [Ambush at Edchera, "13 January 1958"]
      - [Operations Teide and Écouvillon, "10–24 February 1958"]
      - [Forces, "about 9,000 Spanish and 5,000 French troops, 150 aircraft"]
