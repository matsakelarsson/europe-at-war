notes:
  - Spain called the irregulars “bands” and treated the war as a rebellion; in Morocco they are remembered as the Army of Liberation in the South (Jaysh al-Tahrir fi al-Janub). The Moroccan government denied directing them, though the king and the Istiqlal party openly backed the claim to the Spanish territories, and in 1958 the units in the south were taken into the Royal Armed Forces or disbanded.
  - Spanish losses are given as about 190–200 killed, about 500 wounded and 80 missing; Moroccan losses are estimates. In Spain the war was little reported at the time and is sometimes called the forgotten war.
