id: prri-permesta-rebellion
name: PRRI and Permesta rebellions
start: "1958-02-15"
end: "1961-10-20"
tier: C
summary: "The regional rebellions in Sumatra and Sulawesi against the central government of President Sukarno. Army commanders and politicians in the outer islands resented Jakarta’s control of their export earnings, the growing influence of the Communist Party (PKI) and Sukarno’s turn towards “Guided Democracy”; from December 1956 military councils took over local government in Sumatra, and on 2 March 1957 Lieutenant Colonel Ventje Sumual proclaimed the Permesta charter in Makassar. On 15 February 1958, after a five-day ultimatum, Lieutenant Colonel Ahmad Husein proclaimed the Revolutionary Government of the Republic of Indonesia (PRRI) in Padang, with Sjafruddin Prawiranegara as prime minister and the support of leaders of the Masyumi and Socialist parties such as Mohammad Natsir and Sumitro Djojohadikusumo; Permesta, by then based in Manado, joined it two days later. The American CIA secretly supplied the rebels with arms and a small air force. General Abdul Haris Nasution’s army answered with seaborne and airborne landings: Pekanbaru and its oil fields were taken on 12 March, Padang on 17 April and Bukittinggi on 4 May 1958. On 18 May an American pilot, Allen Pope, was shot down and captured after a bombing raid on Ambon, and Washington dropped the rebels. Manado fell at the end of June 1958, and the rebels fought on as guerrillas in the hills of Sumatra and Minahasa until an amnesty brought their surrender in 1961: Husein in May, Natsir on 28 September and Sumual on 20 October. Estimates of the dead range from about 7,000, the figure Nasution gave, to more than 30,000 in both rebellions, many of them civilians. The defeat strengthened the army and Sukarno, who banned Masyumi and the Socialist Party in 1960 and turned to the Soviet Union for arms."
