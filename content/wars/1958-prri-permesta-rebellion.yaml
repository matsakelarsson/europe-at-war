notes:
  - The PRRI and Permesta did not seek to break away from Indonesia; they demanded a new cabinet under Mohammad Hatta and the Sultan of Yogyakarta, regional autonomy and action against the PKI. The central government treated them as a separatist rebellion. Government troops were accused of summary killings of suspected rebel supporters in West Sumatra, and the rebel air force’s raids killed civilians in eastern Indonesia.
