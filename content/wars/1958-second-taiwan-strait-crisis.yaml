  - title: Convoys, air battles and the even-day ceasefire
    date: September – December 1958
    when: "1958-09-24"
    borders: "1958-10-25"
    countries: [tw, cn, us]
    body:
      - President Eisenhower reinforced the Seventh Fleet and ordered it to protect the supply lines, and by 11 September American warships were escorting ROC convoys to the edge of Kinmen’s waters, breaking the blockade. The United States also sent fighters and bombers to Taiwan and supplied 203 mm howitzers, which could fire nuclear shells, and Sidewinder missiles. On 24 September ROC F-86 Sabres used Sidewinders in the first air-to-air missile combat in history; by ROC figures 31 PLA fighters were shot down during the crisis for the loss of two F-86s.
      - On 6 October the PRC announced a one-week ceasefire, in a message to “compatriots in Taiwan” issued in the name of the defence minister Peng Dehuai. It resumed shelling on 20 October, when an American warship entered waters it claimed, and on 25 October declared that it would not shell on even-numbered days if there were no American escorts. On 23 October Chiang Kai-shek and Dulles issued a joint communiqué in which the ROC said the principal means of restoring freedom to the mainland would not be force. The United States quietly withdrew its extra warships on 2 December. The alternate-day shelling, mostly of propaganda leaflets, went on until the United States and the PRC established diplomatic relations on 1 January 1979.
