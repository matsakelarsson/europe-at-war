notes:
  - Casualty figures are the official figures of each side. By ROC figures 514 soldiers were killed or missing and about 2,200 wounded, and 80 civilians were killed and 221 wounded; the ROC government gives 439 soldiers and 80 civilians killed on Kinmen in the 44 days of heavy shelling. The PRC gave 460 troops killed or wounded.
  - Historians still debate Mao Zedong’s aims; the bombardment came weeks after the American landing in Lebanon and as the Great Leap Forward began.
