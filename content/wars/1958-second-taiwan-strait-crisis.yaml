steps:
  - title: The bombardment and blockade
    date: 23 August – early September 1958
    when: "1958-08-23"
    borders: "1958-08-23"
    countries: [tw, cn, us]
    body:
      - Since the first crisis Chiang Kai-shek had strengthened the garrisons of Kinmen and Matsu, which lay a few kilometres off the mainland ports of Xiamen and Fuzhou. In the summer of 1958, while the United States was occupied with its landing in Lebanon, the PLA moved aircraft to new airfields on the Fujian coast and massed artillery around Xiamen.
      - On the evening of 23 August 1958 hundreds of guns around Xiamen and on the nearby islands opened fire on Kinmen, firing tens of thousands of shells in the first hours. Three deputy commanders of the garrison were killed or mortally wounded, among them Ji Xingwen. The bombardment went on daily, and PLA artillery and torpedo boats attacked the landing beaches and supply ships, cutting the islands off from Taiwan. On 24–25 August PLA and ROC forces clashed at sea near Dongding island, south of Kinmen, in what was seen as a landing attempt; it was driven off, and none followed. Matsu was shelled too.
    facts:
      - [Bombardment begins, "23 August 1958"]
      - [Landing attempt near Dongding, "24–25 August 1958"]
