id: second-taiwan-strait-crisis
name: Second Taiwan Strait Crisis
start: "1958-08-23"
end: "1958-12-02"
tier: B
summary: "An artillery bombardment and blockade of the ROC-held islands of Kinmen (Quemoy) and Matsu by the People’s Republic of China from 23 August 1958, meant to cut them off and test the American commitment to the Republic of China on Taiwan. The United States reinforced its Seventh Fleet, escorted ROC supply convoys to the islands and sent modern weapons, among them heavy howitzers and Sidewinder air-to-air missiles, which ROC pilots used for the first time in combat on 24 September. With the blockade broken, Beijing announced a ceasefire on 6 October and on 25 October declared that it would not shell on even-numbered days, beginning two decades of alternate-day shelling that ended only in 1979. About 600 ROC soldiers and civilians were killed and some 460 PLA troops were killed or wounded."
