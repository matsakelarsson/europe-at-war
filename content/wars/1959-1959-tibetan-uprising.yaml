  - title: The flight to India
    date: 17 March – 18 April 1959
    when: "1959-03-31"
    borders: "1959-03-31"
    countries: [cn, in]
    body:
      - The Dalai Lama’s party crossed the Tsangpo and rode south through Lhoka, guarded by Chushi Gangdruk fighters, across high passes towards the Indian border. At Lhuntse Dzong he declared the Seventeen Point Agreement void and announced a temporary government. After two weeks on the road the party crossed into India at Khenzimane, near Tawang, on 31 March 1959, and India gave him asylum.
      - On 18 April he reached Tezpur in Assam, where he issued a statement on the events, and on 29 April he set up a government in exile at Mussoorie, which moved to Dharamsala in 1960. About 80,000 Tibetans followed him into exile. The International Commission of Jurists and the UN General Assembly took up the question of Tibet, and the flight soured relations between India and China in the years before the war of 1962.
    facts:
      - [Crosses into India, "31 March 1959, at Khenzimane"]
      - [Reaches Tezpur, "18 April 1959"]
      - [Refugees, "about 80,000"]
