id: 1959-tibetan-uprising
name: 1959 Tibetan uprising
start: "1959-03-10"
end: "1959-03-23"
tier: B
summary: "A rising in Lhasa in March 1959 against Chinese rule, and its suppression by the People’s Liberation Army, which ended with the flight of the 14th Dalai Lama to India. Revolts against land reform and the campaigns against monasteries had spread from Kham and Amdo since 1956, and refugees and guerrillas of the Chushi Gangdruk crowded into central Tibet. On 10 March 1959, fearing that the Dalai Lama would be seized at a theatre performance in the PLA camp, thousands of Lhasa residents surrounded his summer palace, the Norbulingka; assemblies in the city declared Tibet independent. On the night of 17 March the Dalai Lama slipped away, and from 20 March the PLA shelled the Norbulingka and the Tibetan positions and took the city by 23 March. Thousands of Tibetans were killed in Lhasa; estimates of the dead in the suppression of the revolt across central Tibet range much higher. On 28 March the Chinese government dissolved the Tibetan government, and on 31 March the Dalai Lama crossed into India, where about 80,000 refugees followed him. Exiles mark 10 March as Tibetan Uprising Day; the Chinese government describes the events as an armed rebellion of the upper strata to preserve serfdom, and since 2009 marks 28 March as Serfs’ Emancipation Day."
countries: [cn, in]
sides:
  - id: cn
    name: People’s Republic of China
    polities: [china]
    ink: red
    moves: PLA moves
    success: PLA success
  - id: tib
    name: Tibetan government, Lhasa volunteers and Chushi Gangdruk
    polities: [tibet, chushi-gangdruk]
    ink: slate
