  - title: The battle for Lhasa
    date: 19–23 March 1959
    when: "1959-03-20"
    borders: "1959-03-23"
    countries: [cn]
    view:
      center: [91.112, 29.655]
      size: [24, 18]
    body:
      - The PLA did not learn at once that the Dalai Lama had gone. In the early hours of 20 March its artillery opened fire on the Norbulingka, on Chakpori hill with its medical college, on the Potala and on the Tibetan positions in the city. Thousands of Tibetans, many armed only with old rifles and swords, were killed in the palace grounds and the streets. The Norbulingka and Chakpori were taken on 20 March, and the last resistance, around the Jokhang temple in the centre of the old city, ended on 23 March.
      - On 28 March the State Council in Beijing dissolved the Tibetan government and handed its powers to the Preparatory Committee for the Tibet Autonomous Region, with the Panchen Lama as acting chairman. In the following months the PLA crushed the revolt in central Tibet; thousands of monks and laymen were arrested, and many monasteries were closed or damaged.
    facts:
      - [PLA shelling begins, "20 March 1959"]
      - [Jokhang taken, "23 March 1959"]
      - [Tibetan government dissolved, "28 March 1959"]
