    success: Tibetan success
notes:
  - Casualty figures are disputed. Estimates of the Tibetans killed in the fighting in Lhasa range from about 2,000 to 10,000 or more. The Tibetan government in exile cites a PLA document for 87,000 deaths in central Tibet in 1959–1960, a reading that historians such as Tom Grunfeld and Warren Smith question; the Peace Research Institute Oslo estimates about 10,000 Tibetan and 2,000 Chinese battle deaths in the uprising.
  - The Dalai Lama crossed the border on 31 March by most accounts; some give 30 March.
