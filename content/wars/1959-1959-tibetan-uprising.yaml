steps:
  - title: Crowds at the Norbulingka
    date: 10–17 March 1959
    when: "1959-03-10"
    borders: "1959-03-10"
    countries: [cn]
    view:
      center: [91.112, 29.655]
      size: [24, 18]
    body:
      - Under the Seventeen Point Agreement of 1951 the Dalai Lama’s government still ran central Tibet, alongside a growing Chinese administration and garrison. In Kham and Amdo, outside its territory, land reform and campaigns against monasteries and chiefs had set off revolts from 1956, and refugees and fighters moved west. By 1958 the guerrillas of the Chushi Gangdruk held much of Lhoka, south of Lhasa, and Beijing pressed the Lhasa government to use its army against them.
      - The PLA command invited the Dalai Lama to a theatre performance at its headquarters on 10 March 1959, asking him to come without his usual escort. Rumours spread that he was to be abducted, and on the morning of 10 March a crowd of Lhasa residents, estimated at anything from several thousand to 30,000, surrounded the Norbulingka, his summer palace, to stop him going. A Tibetan official thought to be close to the Chinese was killed by the crowd. Assemblies in the city declared Tibet independent and the 1951 agreement void, and on 12 March thousands of women demonstrated before the Potala. Tibetan troops and volunteers took up positions around the city, and the PLA reinforced its garrison.
      - On 17 March two shells landed near the Norbulingka. That night the Dalai Lama, in disguise, left the palace with his family and ministers, crossed the Kyichu river and rode south with an escort of Tibetan soldiers and Chushi Gangdruk fighters.
