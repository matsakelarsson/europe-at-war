id: basque-conflict
name: Basque conflict
start: "1959-07-31"
end: "2011-10-20"
tier: C
summary: The armed campaign of ETA (Euskadi Ta Askatasuna, “Basque Homeland and Freedom”) for an independent socialist Basque state, against Franco’s dictatorship and then against democratic Spain and France. Founded in 1959, ETA killed its first victim in 1968, assassinated the Spanish prime minister Luis Carrero Blanco in 1973, and in all killed over 800 people, among them police, soldiers, politicians, journalists and many bystanders, with its worst year in 1980 and the Hipercor bombing in Barcelona in 1987 the deadliest attack. The state answered with mass arrests, cases of torture and, in 1983–1987, the GAL death squads, which killed 27 people. Weakened by arrests and loss of support, ETA declared a definitive end to its armed activity on 20 October 2011, gave up its weapons in 2017 and dissolved itself in 2018.
countries: [es, fr]
