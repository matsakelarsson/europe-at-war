id: escambray-rebellion
name: Escambray rebellion
start: "1959"
end: "1965"
tier: C
summary: "The guerrilla war against Fidel Castro’s government in the Escambray Mountains of central Cuba, which the government called the struggle against bandits (Lucha Contra Bandidos). Within months of the revolution of January 1959, former fighters of the Second National Front of the Escambray, which had fought Batista in the same mountains, former soldiers of Batista’s army, anti-communist students and local peasants (guajiros) took up arms against the new government’s turn towards communism and its land reform. Among their leaders were Plinio Prieto, Evelio Duque, Osvaldo Ramírez, Tomás San Gil and Julio Emilio Carretero; William Alexander Morgan, an American comandante of the Second Front, was executed in March 1961 for helping them. The CIA supplied some bands with arms and money in 1960–1961, but its support faded after the Bay of Pigs. The government answered with tens of thousands of militiamen and soldiers, who swept the mountains in tightening rings of encirclement, the largest in the winter of 1960–1961, and from July 1962 with special counter-insurgency units of the Lucha Contra Bandidos under Raúl Menéndez Tomassevich; it also moved peasant families suspected of helping the rebels out of the mountains, many of them to new settlements in Pinar del Río. Ramírez was killed in April 1962 and San Gil in 1963, and smaller bands fought in Matanzas, Pinar del Río, Camagüey and Oriente. The last bands were wiped out in 1965. Estimates of the insurgents range from about 2,000 to 4,000 at different times, in some 170–180 bands, with several thousand collaborators. Figures for the dead vary widely: Raúl Castro put the government’s losses at about 500 in 1970, and estimates of all deaths range from about 1,000 to 7,000."
