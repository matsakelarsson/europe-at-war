notes:
  - "The Cuban government called the insurgents “bandits” and its campaign the Lucha Contra Bandidos; the insurgents and Cuban exiles speak of a war of resistance against communism. Figures from both sides are hard to verify, and insurgents who surrendered or were captured were often tried by revolutionary tribunals and shot."
