    polities: [pathet-lao, north-vietnam]
    ink: red
    moves: Pathet Lao and North Vietnamese moves
    success: Pathet Lao and North Vietnamese success
notes:
  - The neutralists changed sides. Kong Le’s forces fought alongside the Pathet Lao in 1960–1962; after the coalition of 1962 broke down, most of them joined the Royal Lao Government, while a pro-communist wing, the “patriotic neutralists” of Colonel Deuane Sunnalath, stayed with the Pathet Lao.
  - The war was “secret” because the Geneva agreement of 1962 forbade foreign troops in Laos. North Vietnam denied that its army was there, and the United States hid its bombing and the CIA’s army from the American public until 1969–1970.
  - Estimates of the war’s dead vary widely. The Royal Lao Army is thought to have lost some 15,000 killed; Hmong losses are put at tens of thousands; deaths in the Pathet Lao and North Vietnamese forces and among civilians killed by the bombing are not well known.
