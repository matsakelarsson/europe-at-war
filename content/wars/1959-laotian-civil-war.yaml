  - title: The ceasefire and 1975
    date: 1973–1975
    when: "1973-02-21"
    borders: "1975-12-02"
    countries: [la, th, us]
    body:
      - "A month after the Paris accords on Vietnam, the Vientiane agreement of 21 February 1973 brought a ceasefire in Laos, and in April 1974 a Provisional Government of National Union took office under Souvanna Phouma, with the Pathet Lao sharing the ministries. American bombing stopped, but North Vietnamese troops stayed. After the fall of Phnom Penh and Saigon in April 1975 the Pathet Lao took power without a battle: demonstrations drove right-wing ministers out, and on 14 May Vang Pao and some of his officers were flown out of Long Tieng by the CIA, leaving tens of thousands of Hmong to flee on foot. The Pathet Lao entered Vientiane, which they declared liberated on 23 August."
      - "On 2 December 1975 King Savang Vatthana abdicated, and the Lao People’s Democratic Republic was proclaimed under Kaysone Phomvihane. Tens of thousands of former officials and officers were sent to “seminar” camps in the north-east, where many died; the king, the queen and the crown prince were taken to a camp in Houaphanh in 1977 and died there. Some 300,000 people, about a tenth of the population, fled across the Mekong to Thailand in the following years, among them most of the Hmong who had fought with Vang Pao, many of whom settled in the United States. Some Hmong fought on in the mountains for decades."
    facts:
      - [Vientiane ceasefire agreement, "21 February 1973"]
      - [Vang Pao leaves Long Tieng, "14 May 1975"]
      - [Lao People’s Democratic Republic proclaimed, "2 December 1975"]
