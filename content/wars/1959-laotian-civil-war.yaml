id: laotian-civil-war
name: Laotian Civil War
start: "1959-05-23"
end: "1975-12-02"
tier: B
summary: "The war between the Royal Lao Government and the communist Pathet Lao, a proxy front of the Vietnam War. Attempts to bring the Pathet Lao into the kingdom’s government and army broke down in 1959, and a neutralist coup by Captain Kong Le in 1960 led to a three-sided war in which the United States and Thailand backed the right-wing army and the Soviet Union and North Vietnam the Pathet Lao and the neutralists. The Geneva agreement of 1962 declared Laos neutral, but the fighting resumed within a year. North Vietnam kept its troops in the east of the country to guard the Ho Chi Minh trail, while the American Central Intelligence Agency waged a “secret war” with an army of Hmong and other highlanders under Vang Pao, based at Long Tieng. From 1964 to 1973 American aircraft dropped more than 2 million tonnes of bombs on Laos, making it, per person, the most heavily bombed country in history. After the ceasefire of 1973 the Pathet Lao took power step by step, and on 2 December 1975 they abolished the monarchy and proclaimed the Lao People’s Democratic Republic."
countries: [la, vn, us, th]
sides:
  - id: rlg
    name: Royal Lao Government, Vang Pao’s forces and the United States
    polities: [laos, united-states, thailand]
    ink: blue
    moves: Royal Lao and American moves
    success: Royal Lao and American success
  - id: neu
    name: Neutralists (Kong Le)
    polities: [lao-neutralists]
    ink: teal
    moves: Neutralist moves
    success: Neutralist success
  - id: pl
