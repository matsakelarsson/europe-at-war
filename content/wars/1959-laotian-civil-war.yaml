  - title: The secret war and the bombing
    date: 1963–1973
    when: "1964-05-01"
    borders: "1970-01-01"
    countries: [la, vn, us, th]
    body:
      - "The coalition broke apart in 1963, and fighting resumed around the Plain of Jars, which the Pathet Lao and North Vietnamese took in May 1964. North Vietnam kept tens of thousands of troops in Laos, most of them along the Ho Chi Minh trail in the east. The United States answered with bombing: from 1964 to 1973 its aircraft, flying from Thailand, South Vietnam and carriers, flew more than 580,000 bombing missions over Laos, about one every eight minutes for nine years, and dropped over 2 million tonnes of bombs, including some 270 million cluster bomblets, of which up to a third failed to explode. Villagers in the Pathet Lao zones lived in caves and farmed at night; the Pathet Lao leadership ran its government from the caves of Vieng Xay. Unexploded bombs have killed or injured more than 20,000 people in Laos since the war."
      - "On the ground the war followed the seasons: the North Vietnamese and the Pathet Lao attacked in the dry season and the royal forces in the wet. Vang Pao’s army of Hmong, Lao and other highlanders, paid and supplied by the CIA through Air America from its base at Long Tieng, and later reinforced by Thai “volunteers”, bore much of the fighting. On 10–11 March 1968 North Vietnamese commandos overran the secret American radar station at Phou Pha Thi (Lima Site 85), killing 11 or 12 American airmen. Vang Pao swept the Plain of Jars in 1969, but the North Vietnamese retook it in 1970 and in 1971–1972 attacked Long Tieng itself, which held. Hmong losses were so great that boys of thirteen were recruited."
    facts:
      - [American bombing of Laos, "1964–1973, over 2 million tonnes"]
      - [Fall of Lima Site 85, "10–11 March 1968"]
      - [Vang Pao’s offensive on the Plain of Jars, "August–September 1969"]
    markers:
