steps:
  - title: Coups and neutralists
    date: 1959–1962
    when: "1959-05-23"
    borders: "1961-01-01"
    countries: [la, vn, us, th]
    body:
      - "The Geneva conference of 1954 left the Pathet Lao, the communist movement led by Prince Souphanouvong and allied with the Viet Minh, in control of the north-eastern provinces of Phongsaly and Sam Neua. A coalition under Souvanna Phouma, Souphanouvong’s half-brother, brought them into the government in 1957, and in the elections of 1958 their party won 9 of 21 seats. American alarm brought a right-wing government, which dropped the Pathet Lao ministers. When the two Pathet Lao battalions were to be merged into the royal army in May 1959, one of them slipped away from the Plain of Jars to the Vietnamese border, and the war resumed; Souphanouvong, arrested, escaped in 1960."
      - "On 9 August 1960 Captain Kong Le, a paratroop commander, seized Vientiane and called for a neutral Laos under Souvanna Phouma. General Phoumi Nosavan, backed by Thailand and the CIA, marched on the capital from Savannakhet and took it after a bombardment from 13 to 16 December that killed several hundred civilians. Kong Le retreated north and, with arms flown in by the Soviet Union, took the Plain of Jars at the turn of the year, allied with the Pathet Lao and North Vietnamese troops. The CIA began to arm Hmong villagers under Vang Pao, a royal army officer. After the royal army was routed at Nam Tha in May 1962, a fourteen-nation conference in Geneva declared Laos neutral on 23 July 1962 and called for foreign troops to leave, under a new coalition government."
    facts:
      - [Kong Le’s coup, "9 August 1960"]
      - [Battle of Vientiane, "13–16 December 1960"]
      - [Geneva agreement on the neutrality of Laos, "23 July 1962"]
