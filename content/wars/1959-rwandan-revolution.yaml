id: rwandan-revolution
name: Rwandan Revolution and the Inyenzi raids
start: "1959-11-01"
end: "1967"
tier: C
summary: "The violent overthrow of the Tutsi monarchy in Rwanda, then a Belgian-administered UN trust territory, and the armed attempts of Tutsi exiles to return, from 1959 to the late 1960s. Under Belgian rule the Tutsi elite around the king (mwami) held almost all chiefships, and in 1957 Hutu intellectuals led by Grégoire Kayibanda answered with the Bahutu Manifesto. After King Mutara III Rudahigwa died in July 1959, his brother Kigeli V was installed against Belgian wishes and monarchists formed UNAR, while Kayibanda founded PARMEHUTU. On 1 November 1959 UNAR youths attacked the Hutu sub-chief Dominique Mbonyumutwa at Byimana; rumours of his death set off Hutu attacks on Tutsi officials and the burning of Tutsi homes across the country, and from 7 November the king’s militias struck back, killing Hutu leaders. The Belgian Colonel Guy Logiest restored order and then replaced Tutsi chiefs with Hutu, and PARMEHUTU won the communal elections of mid-1960; Kigeli left the country in July 1960. On 28 January 1961, with Logiest’s backing, Hutu councillors meeting at Gitarama proclaimed a republic, confirmed by a referendum on 25 September 1961 that abolished the monarchy, and Rwanda became independent on 1 July 1962 with Kayibanda as president. Local massacres of Tutsi went on through 1960 and 1961, and by late 1964 at least 336,000 Tutsi had fled to Burundi, Uganda, Tanganyika and the Congo. From late 1960 armed exiles, called Inyenzi (“cockroaches”), raided Rwanda from these countries. On 21 December 1963 several hundred crossed from Burundi, took the army camp at Gako in Bugesera and advanced towards Kigali before they were beaten. The government’s reprisals were the largest killing of Tutsi before 1994: estimates for December 1963 and January 1964 range from 1,000–3,000 (UN) and at least 10,000 (René Lemarchand) to 10,000–14,000 (World Council of Churches) and higher, many of them in Gikongoro prefecture, and the Tutsi politicians still in the country were executed. Smaller Inyenzi raids were repelled until about 1966–1967. The exiles and their children later formed the Rwandan Patriotic Front, which invaded in 1990."
