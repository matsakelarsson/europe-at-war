  - title: Katanga and South Kasai secede
    date: July – September 1960
    when: "1960-07-11"
    borders: "1960-08-27"
    countries: [cd, be]
    body:
      - On 11 July 1960 Moïse Tshombe, the head of Katanga’s provincial government, declared Katanga independent. Katanga produced most of the Congo’s wealth, mainly the copper, cobalt and uranium of the Belgian company Union Minière du Haut Katanga, and Tshombe’s party CONAKAT had long wanted autonomy. Belgian officers built a Katangese Gendarmerie and were later joined by mercenaries from Europe, Rhodesia and South Africa. No state recognised Katanga, but Belgium supported it in practice. In the north of the province the Luba of the Balubakat party rejected the secession and fought the Gendarmerie.
      - On 8 August Albert Kalonji, whose Luba followers had been driven from Luluabourg in fighting with the Lulua, proclaimed the Mining State of South Kasai around Bakwanga (Mbuji-Mayi), the centre of the Congo’s diamond mines. Lumumba, who refused to wait for the UN, sent the ANC against South Kasai in late August with Soviet aircraft and trucks. The troops took Bakwanga and killed some 3,000 Luba civilians, a massacre the UN Secretary-General, Dag Hammarskjöld, called a case of incipient genocide; the offensive stopped before it reached Katanga.
      - The UN Security Council called on Belgium to withdraw on 14 July and created the UN Operation in the Congo (ONUC), whose first troops arrived the next day. Belgian forces left the rest of the country, but Hammarskjöld would not use the UN force to end Katanga’s secession, and its troops entered Katanga only in August with Tshombe’s agreement.
    facts:
      - [Katanga declares independence, "11 July 1960"]
      - [UN Security Council Resolution 143, "14 July 1960"]
      - [South Kasai declares independence, "8 August 1960"]
      - [Luba civilians killed by the ANC in South Kasai, "about 3,000"]
