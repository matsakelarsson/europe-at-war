notes:
  - The country was called the Republic of the Congo, or Congo-Léopoldville to tell it from the former French colony across the river, Congo-Brazzaville; it took the name Democratic Republic of the Congo in 1964 and was Zaire from 1971 to 1997. Places are given by their names of the time with today’s names in brackets.
  - "Figures are uncertain. The total of about 100,000 dead covers the fighting, the massacres in South Kasai, North Katanga and the rebel areas, and the repression of the rebellions of 1964–1965. ONUC lost about 250 personnel."
  - "Who was responsible for Lumumba’s death has been examined by a Belgian parliamentary inquiry (2001), which found that Belgian ministers bore “moral responsibility”, and by the American Church Committee (1975), which described a CIA plan to poison him that was not carried out. Belgium apologised in 2002, and in 2022 it returned a tooth, his only known remains, to his family."
