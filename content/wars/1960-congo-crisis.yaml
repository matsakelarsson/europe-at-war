  - title: Operation Grand Slam ends the secession
    date: December 1962 – January 1963
    when: "1962-12-28"
    borders: "1963-01-21"
    countries: [cd, be, se, in]
    body:
      - South Kasai’s secession ended first. In September 1962 its commanders turned against Kalonji, and on 5 October central government troops arrived in Bakwanga. In Katanga, a plan by the new Secretary-General, U Thant, for a federal constitution and a sharing of mining revenues went nowhere, and the United States, which had lost patience with Tshombe, backed stronger action.
      - When Katangese gendarmes fired on UN positions around Élisabethville for several days, ONUC launched Operation Grand Slam on 28 December 1962. Indian, Ethiopian, Irish and other troops took the town and its surroundings in two days, while Swedish and Ghanaian troops advanced from Kamina base and the UN’s jets destroyed the small Katangese air force on the ground. Indian troops crossed the Lufira River and entered Jadotville on 3 January 1963, faster than UN headquarters in New York had authorised.
      - Tshombe, who had threatened to blow up the mines and dams, told U Thant on 15 January that he was ready to end the secession, and on 21 January he let UN troops into his last stronghold, Kolwezi. Many gendarmes and mercenaries crossed into Portuguese Angola, where the gendarmes later formed the FNLC that invaded the Congo in 1977 and 1978.
    facts:
      - [South Kasai’s secession ends, "5 October 1962"]
      - [Operation Grand Slam begins, "28 December 1962"]
      - [UN takes Jadotville, "3 January 1963"]
      - [UN enters Kolwezi, "21 January 1963"]
