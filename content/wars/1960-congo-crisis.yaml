  - title: Mobutu takes power
    date: 1965
    when: "1965-11-25"
    borders: "1965-11-25"
    countries: [cd]
    body:
      - By the end of 1965 the rebellion had been broken, although small groups held out in the east, among them that of Laurent-Désiré Kabila. Tshombe’s CONACO coalition won the parliamentary elections of March–April 1965, but Kasa-Vubu dismissed him in October and named Évariste Kimba in his place, and parliament refused to confirm Kimba. The two men’s rivalry deadlocked the government.
      - On 25 November 1965 Mobutu, now lieutenant-general and army commander, took power in a second, bloodless coup and declared himself president for five years. He banned political parties other than his own, had Kimba and three other former ministers hanged in public in 1966 for an alleged plot, and ruled the country, which he renamed Zaire in 1971, until he was overthrown in the First Congo War of 1996–1997. Tshombe died in exile in Algeria in 1969.
    facts:
      - [Kasa-Vubu dismisses Tshombe, "13 October 1965"]
      - [Mobutu’s second coup, "25 November 1965"]
      - [Total deaths of the Congo Crisis, "about 100,000 (estimate)"]
    markers:
      - kind: capital
        side: gov
        name: Léopoldville (Kinshasa)
        date: 25 November 1965
        text: Mobutu’s coup ended the five years of crisis and began a rule of more than 31 years.
        lonlat: [15.31, -4.32]
