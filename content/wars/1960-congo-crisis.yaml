  - title: Lumumba’s fall and death
    date: September 1960 – January 1961
    when: "1960-09-05"
    borders: "1960-12-25"
    countries: [cd, be]
    body:
      - On 5 September 1960 Kasa-Vubu dismissed Lumumba on the radio, and Lumumba in turn declared Kasa-Vubu deposed. On 14 September Mobutu announced that the army was “neutralising” both and installed a College of Commissioners of young graduates; he expelled the Soviet and Czechoslovak diplomats. American and Belgian officials, who saw Lumumba as a danger, encouraged his removal, and the CIA prepared a plan to poison him that was not carried out. Lumumba stayed in his residence in Léopoldville, guarded by UN troops on the inside and the ANC on the outside.
      - On 27 November Lumumba slipped out to reach his supporters in Stanleyville, but he was caught by Mobutu’s soldiers at Lodi on the Sankuru on 1 December and held at Camp Hardy in Thysville. When the garrison there grew restless in January, the Léopoldville authorities had him flown with two companions, Maurice Mpolo and Joseph Okito, to Élisabethville on 17 January 1961. They were beaten and that evening shot near the town by a Katangese firing squad, in the presence of Katangese ministers and Belgian officers. The deaths were announced only in February, and protests followed around the world.
      - Lumumba’s deputy, Antoine Gizenga, set up a government in Stanleyville in late 1960, recognised by the Soviet Union, China and several African states. Its troops took Bukavu and Kivu in December, and in January 1961 they pushed into North Katanga, where the Balubakat were fighting Tshombe’s Gendarmerie.
    facts:
      - [Lumumba dismissed, "5 September 1960"]
      - [Mobutu’s first coup, "14 September 1960"]
      - [Lumumba captured at Lodi, "1 December 1960"]
      - [Lumumba, Mpolo and Okito killed, "17 January 1961"]
