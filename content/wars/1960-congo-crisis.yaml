steps:
  - title: Independence and the mutiny
    date: June – July 1960
    when: "1960-06-30"
    borders: "1960-07-10"
    countries: [cd, be]
    body:
      - Belgium had ruled the Congo since 1908, after the personal rule of King Leopold II, and had prepared it for independence only from 1959, when riots in Léopoldville forced the pace. At independence on 30 June 1960 there were fewer than twenty Congolese university graduates and no Congolese officers in the army, the Force Publique. Patrice Lumumba of the Mouvement National Congolais became prime minister and Joseph Kasa-Vubu of the Bakongo party ABAKO president. At the ceremony, after King Baudouin praised Leopold’s “genius”, Lumumba answered with a speech on the humiliations of colonial rule.
      - On 5 July the Force Publique’s Belgian commander, General Émile Janssens, wrote on a blackboard that “before independence = after independence”. Soldiers at Camp Hardy in Thysville and in Léopoldville rose against their Belgian officers, and the mutiny spread across the country, with attacks on Europeans, including rapes. Lumumba renamed the army the Armée Nationale Congolaise (ANC), dismissed the Belgian officers and promoted Congolese soldiers in their place; a former sergeant and journalist, Joseph-Désiré Mobutu, became chief of staff.
      - Belgium sent paratroopers from its bases at Kamina and Kitona without the Congolese government’s consent, landing at Élisabethville on 10 July and at Luluabourg and other towns. On 11 July, after the Belgian navy had evacuated Europeans from Matadi, the main port, Belgian ships shelled the town, killing at least nineteen Congolese civilians. Most of the country’s Belgian officials and settlers left within weeks. Lumumba and Kasa-Vubu broke off relations with Belgium and appealed to the United Nations.
    facts:
      - [Independence, "30 June 1960"]
      - [Mutiny at Camp Hardy, Thysville, "5 July 1960"]
      - [Belgian troops land at Élisabethville, "10 July 1960"]
      - [Shelling of Matadi, "11 July 1960"]
