  - title: The UN force fights in Katanga
    date: February – December 1961
    when: "1961-09-13"
    borders: "1961-09-13"
    countries: [cd, be, ie, se]
    body:
      - After Lumumba’s death the Security Council, on 21 February 1961, authorised ONUC to use force as a last resort to prevent civil war and called for the removal of Belgian officers and mercenaries. A parliament meeting under UN protection at Lovanium University chose Cyrille Adoula as prime minister in August, and Gizenga joined his government as deputy before breaking away again; he was arrested in January 1962, ending the Stanleyville regime.
      - In Katanga, Operation Rumpunch on 28 August 1961 rounded up foreign officers and mercenaries without bloodshed, but many returned. Operation Morthor, launched on 13 September to take the radio station and post office in Élisabethville and arrest Katangese ministers, turned into a week of fighting. At Jadotville (Likasi) some 155 Irish soldiers were besieged by a much larger Katangese force with mercenary officers and surrendered on 17 September after running out of water and ammunition. On the night of 17–18 September Hammarskjöld, flying to meet Tshombe, was killed when his plane crashed near Ndola in Northern Rhodesia; the cause has never been settled.
      - In November the Security Council authorised force to remove mercenaries. Katangese attacks on UN troops led to Operation Unokat in December, in which ONUC took control of much of Élisabethville. On 21 December Tshombe signed the Kitona Declaration accepting in principle the Congo’s unity, but he did not keep it.
    facts:
      - [Resolution 161 authorises force, "21 February 1961"]
      - [Operation Rumpunch, "28 August 1961"]
      - [Siege of Jadotville, "13–17 September 1961"]
      - [Death of Dag Hammarskjöld, "18 September 1961"]
      - [Kitona Declaration, "21 December 1961"]
