id: congo-crisis
name: Congo Crisis
start: "1960-07-05"
end: "1965-11-25"
tier: A
summary: "The political crisis and wars that followed the independence of the Belgian Congo on 30 June 1960. Within a week the soldiers of the Force Publique rose against their Belgian officers, Belgium sent troops to protect its citizens without the new government’s consent, and the mineral-rich province of Katanga under Moïse Tshombe, backed by Belgian officers and mining interests, declared independence; South Kasai followed in August. Prime Minister Patrice Lumumba asked the United Nations for help and then the Soviet Union, and was dismissed by President Joseph Kasa-Vubu, removed by the army chief Joseph-Désiré Mobutu, handed to the Katangese and killed on 17 January 1961 with Belgian officers present. His followers set up a rival government in Stanleyville. The UN force (ONUC), up to about 20,000 troops, ended Katanga’s secession in January 1963 after three rounds of fighting. Risings by Lumumba’s followers in 1964 (the Simba rebellion) were put down by the army, white mercenaries and a Belgian–American airborne operation, and on 25 November 1965 Mobutu took power in a coup. Some 100,000 people are estimated to have died."
