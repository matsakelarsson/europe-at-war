  - title: The rebellions of 1964 and Tshombe’s return
    date: 1964
    when: "1964-08-04"
    borders: "1964-11-24"
    countries: [cd, be, us]
    body:
      - The last ONUC troops left on 30 June 1964, just as Lumumba’s followers rose against Adoula’s government. Pierre Mulele led a rising in Kwilu in January, and in the east the National Liberation Council (CNL) of Christophe Gbenye and Gaston Soumialot raised the Simba rebellion. Its fighters took Albertville, Kindu and, on 4 August, Stanleyville, where they proclaimed a People’s Republic of the Congo; by then the rebels held about half the country.
      - Kasa-Vubu called back Tshombe from exile to be prime minister in July 1964. He recalled his Katangese gendarmes from Angola and hired white mercenaries under Mike Hoare and others, who with the ANC retook the rebel towns. On 24 November Belgian paratroopers flown in American aircraft landed at Stanleyville to free hundreds of European and American hostages held by the Simbas, while a mercenary column entered the town; the rebels killed many hostages and thousands of Congolese whom they saw as enemies, and the government forces and mercenaries also killed many civilians.
    facts:
      - [Last ONUC troops leave, "30 June 1964"]
      - [Simbas take Stanleyville, "4 August 1964"]
      - [Operation Dragon Rouge, "24 November 1964"]
