notes:
  - "The government and its supporters called MK and the PAC’s fighters terrorists and the struggle a communist onslaught; the movements and most of the world saw them as freedom fighters. The Truth and Reconciliation Commission (1996–2003) found the state responsible for most of the gross human rights violations of the period, and also found that the ANC, the PAC, Inkatha and others had committed such violations, including attacks that killed civilians and abuses in the ANC’s own camps in exile."
