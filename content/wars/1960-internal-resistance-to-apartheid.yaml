id: internal-resistance-to-apartheid
name: Armed struggle against apartheid
start: "1960-03-21"
end: "1990-08-06"
tier: C
summary: "The armed struggle of South Africa’s liberation movements against apartheid, and the state’s war against them at home and in neighbouring countries, from the Sharpeville massacre to the suspension of armed struggle in 1990. On 21 March 1960 police at Sharpeville fired on a crowd protesting against the pass laws, killing 69 people; the government banned the African National Congress (ANC) and the Pan Africanist Congress (PAC) on 8 April. Turning to violence after half a century of non-violent protest, ANC and Communist Party leaders, among them Nelson Mandela, formed Umkhonto we Sizwe (MK, the Spear of the Nation) in June 1961; it began a campaign of sabotage against installations on 16 December 1961, while the PAC’s Poqo killed whites and others it saw as collaborators. The police broke both: the leaders of MK were arrested at Liliesleaf Farm in Rivonia on 11 July 1963, and on 12 June 1964 Mandela and seven others were sentenced to life imprisonment. From exile in Tanzania, Zambia and later Angola, MK tried to infiltrate fighters, with ZIPRA in Rhodesia in 1967–1968. The Soweto uprising of 16 June 1976, in which police killed at least 176 people and by some estimates several hundred, sent thousands of young people abroad to join MK, which from 1977 attacked police stations, the Sasol oil-from-coal plants (1980), the Koeberg nuclear power station (1982) and, increasingly, places where civilians died, as in the Church Street car bomb in Pretoria on 20 May 1983 (19 killed). South Africa’s forces raided ANC houses and offices in Matola in Mozambique (1981), Maseru in Lesotho (1982, 42 killed), Gaborone in Botswana (1985, 12 killed) and elsewhere, and its death squads killed activists at home and abroad. From 1984 the townships rose in revolt under the United Democratic Front; the government declared states of emergency in 1985 and 1986, deployed the army in the townships and detained tens of thousands of people, and a bitter conflict between the ANC and Inkatha grew in Natal. President F. W. de Klerk lifted the bans on 2 February 1990 and released Mandela on 11 February; in the Pretoria Minute of 6 August 1990 the ANC suspended its armed struggle. Political violence, much of it between the ANC and Inkatha and fuelled by elements of the security forces, killed some 14,000 more people before the elections of April 1994; a widely cited estimate puts the dead of political violence between 1948 and 1994 at about 21,000."
