id: west-new-guinea-dispute
name: West New Guinea dispute
start: "1960-08-17"
end: "1962-08-18"
tier: B
summary: "The armed climax of the dispute between Indonesia and the Netherlands over the western half of New Guinea, which the Dutch had kept when they transferred sovereignty over the rest of the Dutch East Indies in 1949. Indonesia claimed it as part of the former colony; the Netherlands argued that the Papuans were a different people with a right to decide their own future, and from 1961 prepared them for self-government, with an elected New Guinea Council and a Papuan flag, the Morning Star. Indonesia broke off relations in August 1960, bought large quantities of Soviet arms, and on 19 December 1961 Sukarno ordered the territory to be taken by force (Trikora). An attempt to land troops by sea ended in the sinking of an Indonesian torpedo boat off Vlakke Hoek on 15 January 1962; through 1962 some 1,700 Indonesian soldiers were landed by sea or dropped by parachute, most of them killed or captured, while a full invasion was prepared. Under American pressure the Netherlands agreed in the New York Agreement of 15 August 1962 to hand the territory to a United Nations administration (UNTEA), which passed it to Indonesia on 1 May 1963, with a promise of an act of self-determination. In the Act of Free Choice of 1969, 1,025 Papuan representatives chosen by the Indonesian authorities voted unanimously for integration, a vote whose fairness is disputed to this day."
