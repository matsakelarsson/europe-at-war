steps:
  - title: Trikora and Vlakke Hoek
    date: December 1961 – January 1962
    when: "1961-12-19"
    borders: "1962-01-15"
    countries: [id, nl]
    body:
      - "When the Netherlands recognised Indonesia’s independence in December 1949, it kept western New Guinea, leaving its future to be settled by negotiation within a year. The talks failed. Indonesia held that the territory had been part of the Dutch East Indies and so belonged to the republic; the Dutch argued that its Melanesian peoples had little in common with the rest of Indonesia and should decide for themselves. Indonesia took the question to the UN General Assembly several times without winning the two-thirds majority it needed, seized Dutch businesses in 1957–1958, broke off diplomatic relations on 17 August 1960 and bought warships, bombers and fighters from the Soviet Union. The Dutch speeded up the training of Papuan officials, and on 5 April 1961 opened an elected New Guinea Council in Hollandia. On 1 December 1961 the Morning Star flag, chosen by a Papuan committee, was raised beside the Dutch flag."
      - "On 19 December 1961, the anniversary of the Dutch attack on Yogyakarta in 1948, Sukarno announced in that city the “Three Commands of the People” (Trikora): to defeat the creation of a Dutch “puppet state of Papua”, to raise the Indonesian flag in West Irian, and to prepare for general mobilisation. In January 1962 a joint Mandala Command was set up in Makassar under Major General Suharto to take the territory by force. On the night of 15 January three Indonesian torpedo boats carrying about 150 troops tried to land them on the south coast. Off the cape of Vlakke Hoek, at the entrance to Etna Bay, they were spotted by a Dutch Neptune patrol aircraft and engaged by the destroyers Evertsen and Kortenaer. The Matjan Tutul was sunk with the deputy chief of the Indonesian navy, Commodore Yos Sudarso, on board, and the other two boats turned back."
    facts:
      - [New Guinea Council opened, "5 April 1961"]
      - [Morning Star flag first raised, "1 December 1961"]
      - [Trikora speech, "19 December 1961, Yogyakarta"]
      - [Battle off Vlakke Hoek, "15 January 1962, Dutch victory"]
