  - title: Infiltrators and the New York Agreement
    date: March – August 1962
    when: "1962-05"
    borders: "1962-08-15"
    countries: [id, nl, us]
    body:
      - "From March 1962 Indonesia sent small parties of soldiers into the territory, landed from boats on the south-west coast or dropped by parachute from aircraft flying from bases in the Moluccas, to prepare the ground for an invasion and to show the world that the fight had begun. Over eight months some 560 men were landed by sea and about 1,150 dropped from the air, near Fakfak, Kaimana, Teminabuan, Sorong and Merauke among other places. Most were hunted down by Dutch marines and soldiers and by the new Papuan Volunteer Corps, or surrendered hungry and sick in the swamps and forests; the largest drops, near Merauke in June, held out longer. Meanwhile Suharto prepared Operation Jayawijaya, a landing on Biak with tens of thousands of troops, Soviet-built bombers and submarines, set for August."
      - "The United States, anxious that Indonesia might turn to the Soviet bloc and unwilling to back its NATO ally in a colonial war, pressed the Netherlands to give way. Talks under the American diplomat Ellsworth Bunker produced the New York Agreement, signed at the UN on 15 August 1962: the Netherlands would hand the territory to a UN Temporary Executive Authority (UNTEA) on 1 October 1962, and UNTEA would pass it to Indonesia after 1 May 1963; before the end of 1969, with UN advice, Indonesia would give the Papuans an act of free choice on their future. A ceasefire took effect on 18 August and the invasion was called off. No Papuans had been party to the negotiations."
    facts:
      - [Indonesian troops infiltrated, "about 560 by sea, 1,150 by air"]
      - [New York Agreement, "15 August 1962"]
      - [Ceasefire, "18 August 1962"]
