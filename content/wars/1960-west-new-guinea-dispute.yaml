  - title: UNTEA and the Act of Free Choice
    date: 1962–1969
    when: "1962-10-01"
    borders: "1963-01-01"
    countries: [id, nl]
    body:
      - "On 1 October 1962 the Netherlands handed the territory over to UNTEA, the first time the United Nations had itself governed a territory. Its administrator, the Iranian diplomat Djalal Abdoh, ruled from Hollandia with Dutch and then Indonesian officials, guarded by a UN Security Force of 1,500 Pakistani troops. The Dutch flag was lowered on 31 December 1962 and the Indonesian flag raised beside the UN flag, and on 1 May 1963 UNTEA handed the territory to Indonesia. Papuan political parties were soon banned, and the Morning Star flag was outlawed; the first armed Papuan resistance began in 1965."
      - "The act of free choice took place from 14 July to 2 August 1969. Indonesia declared that one man, one vote was impossible in so undeveloped a country and used instead the Indonesian practice of consultation (musyawarah): 1,025 representatives, selected by the authorities, met in councils in the eight regencies, starting at Merauke and ending at Jayapura, and all of them declared for remaining with Indonesia. Foreign journalists and later Papuan witnesses reported threats and pressure. On 19 November 1969 the UN General Assembly took note of the result. Indonesia considers the matter closed; many Papuans regard the vote as a fraud and still demand a new one."
    facts:
      - [UNTEA, "1 October 1962 – 1 May 1963"]
      - [UN Security Force, "1,500 Pakistani troops"]
      - [Act of Free Choice, "14 July – 2 August 1969"]
      - [UN General Assembly resolution 2504, "19 November 1969"]
    markers:
