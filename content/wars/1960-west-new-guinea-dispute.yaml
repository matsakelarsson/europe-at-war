notes:
  - Indonesia called the territory West Irian (Irian Barat), later Irian Jaya and, from 2002, Papua; the Dutch called it Netherlands New Guinea. Its capital Hollandia was renamed Kota Baru, then Sukarnopura and, in 1968, Jayapura. Since 2003 the territory has been divided into several provinces.
  - "How the Act of Free Choice is judged is contested. Indonesia regards it, and the UN General Assembly’s resolution 2504 of 19 November 1969, which “took note” of the result by 84 votes to none with 30 abstentions, as having settled the territory’s status. Papuan independence supporters and many historians call it the “Act of No Choice”, since the New York Agreement had promised a vote “in accordance with international practice” and the representatives were chosen and pressed by the Indonesian military; the UN representative, Fernando Ortiz-Sanz, reported only that an act of free choice had taken place “in accordance with Indonesian practice”. The later conflict is told in the Papua conflict."
  - Casualty figures for 1962 vary. The figures usually given are about 214 Indonesian and 9 Dutch dead; the torpedo boat fight off Vlakke Hoek cost Indonesia between 21 and 39 lives, and up to 55 survivors were picked up by the Dutch.
