  - title: Three movements in exile
    date: 1962 – 1966
    when: "1962-03-27"
    borders: "1966-03-13"
    countries: [ao, cd, cg, zm]
    body:
      - In March 1962 the UPA merged with a smaller Bakongo party into the National Front for the Liberation of Angola (FNLA), and in April Roberto formed a government in exile, the GRAE, recognised by the Congo and in 1963 by the Organisation of African Unity. Its army trained at Kinkuzu in the Congo, and Roberto received money from the CIA. The MPLA, which dated its founding to 1956 and was led from 1962 by the poet and doctor Agostinho Neto, was expelled from Léopoldville in 1963 and moved to Brazzaville, from where it opened a front in the enclave of Cabinda in 1964 and supplied its fighters in the Dembos forest north of Luanda.
      - Jonas Savimbi, an Ovimbundu who had been the GRAE’s foreign minister, broke with Roberto in 1964, accusing him of tribalism and dependence on the United States. On 13 March 1966 he founded the National Union for the Total Independence of Angola (UNITA) at Muangai in Moxico, in the east. UNITA’s first attack, on 25 December 1966, stopped trains on the Benguela Railway at Teixeira de Sousa (Luau) on the Zambian border; when it cut the line again in 1967, Zambia, which sent its copper by that railway, expelled UNITA, and Savimbi went back inside Angola.
    facts:
      - [FNLA formed, "27 March 1962"]
      - [MPLA moves to Brazzaville, "1963"]
      - [UNITA founded, "13 March 1966"]
      - [UNITA’s first attack, "25 December 1966"]
