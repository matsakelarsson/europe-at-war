notes:
  - "Casualty figures are estimates. Portugal lost some 2,700 soldiers killed in Angola; estimates of nationalist fighters killed run from 10,000 to 25,000 and of civilians from 30,000 to 50,000, most of them in 1961. Between 300,000 and 500,000 people fled to the Congo or to Luanda in the first year."
  - "Who organised the attack of 4 February 1961 is disputed: the MPLA later claimed it, while other accounts credit a group around the Luanda priest Manuel das Neves. The UPA’s attacks of 15 March were aimed at settlers and at Ovimbundu contract workers from the south alike; the Portuguese reprisals that followed were far deadlier."
  - The movements had different bases and backers. The FNLA drew on the Bakongo of the north and was backed by Mobutu’s Congo (Zaire), for a time the United States and later China; the MPLA drew on the Mbundu of the Luanda region and the urban, often mixed-race, elite, and was backed by the Soviet bloc and Cuba; UNITA drew on the Ovimbundu of the central highlands and the peoples of the east.
