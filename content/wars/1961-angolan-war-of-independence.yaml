  - title: Revolution in Lisbon and the Alvor Agreement
    date: April 1974 – November 1975
    when: "1974-04-25"
    borders: "1975-01-15"
    countries: [ao, pt]
    body:
      - By 1974 Portugal held all the towns and most of Angola, which was earning more than ever from coffee, diamonds and the oil found off Cabinda; the MPLA was split by the revolts of Daniel Chipenda in the east (1973) and of a group of intellectuals (1974), and the FNLA was largely confined to the north. The war was decided in Lisbon. On 25 April 1974 young officers of the Armed Forces Movement, weary of wars in three colonies that took some 40 per cent of the state budget, overthrew the dictatorship in the Carnation Revolution.
      - UNITA agreed a ceasefire in June 1974 and the FNLA and MPLA in October. On 15 January 1975, at Alvor in the Algarve, Portugal and the three movements agreed on a transitional government and set independence for 11 November 1975. But each movement kept its army, foreign backers poured in arms, and from March 1975 the FNLA and MPLA fought for Luanda; by July the MPLA had driven its rivals out of the capital. Most of the 300,000 or more Portuguese settlers left in 1975. On 11 November the MPLA proclaimed the People’s Republic of Angola in Luanda, in the middle of a civil war.
    facts:
      - [Carnation Revolution, "25 April 1974"]
      - [Alvor Agreement, "15 January 1975"]
      - [Independence, "11 November 1975"]
