  - title: “To Angola, quickly and in force”
    date: April – October 1961
    when: "1961-08-09"
    borders: "1961-08-09"
    countries: [ao, pt, cd]
    body:
      - After defeating an attempted coup by his defence minister, Júlio Botelho Moniz, Salazar took over the defence ministry and on 13 April announced on television, “To Angola, quickly and in force”. Troops were flown and shipped out, and in the meantime settler militias and the army took revenge across the north, killing many Africans suspected of supporting the rising, among them educated men who had nothing to do with it. In the first year of the war 20,000 to 30,000 Angolans were killed, and between 300,000 and 500,000 people fled, most of them Bakongo crossing into the Congo.
      - From July the army went over to the offensive. In Operation Viriato three columns converged on Nambuangongo and retook it on 9 August, and Portugal’s first airborne assault took Quipedro soon after; by October the army had reoccupied the north, although the UPA kept bands in the forests. In September Portugal abolished the indigenato, the legal status that set Africans apart, and forced labour, but kept up the war.
    facts:
      - [Salazar’s broadcast, "13 April 1961"]
      - [Nambuangongo retaken, "9 August 1961"]
      - [Angolans killed in 1961, "20,000–30,000 (estimate)"]
      - [Refugees in the first year, "300,000–500,000"]
