  - title: The eastern front
    date: 1966 – 1972
    when: "1968-01-01"
    borders: "1970-01-01"
    countries: [ao, zm, pt]
    body:
      - When Zambia became independent in 1964 the MPLA gained a new rear base. From 1966 its fighters crossed into the thinly populated savanna of Moxico and Cuando Cubango, and by 1969–1970 its columns were moving west towards Bié and the central highlands along supply routes they called the Agostinho Neto trail. UNITA, much smaller, fought in the same region and clashed with the MPLA as often as with the Portuguese.
      - Portugal answered with helicopters and airborne troops, with the Flechas, an African special unit of the PIDE secret police, and with “aldeamentos”, fortified villages into which rural people were moved to cut the guerrillas off from them. South African helicopters and pilots helped in the south-east from bases such as Cuito Cuanavale, under a secret alliance with South Africa and Rhodesia (Exercise Alcora). From 1971 the army’s eastern campaign under General Bettencourt Rodrigues broke up the MPLA’s fronts; documents later showed that Portuguese commanders had a secret understanding with Savimbi, Operation Madeira, under which UNITA fought the MPLA.
    facts:
      - [MPLA opens the eastern front, "1966"]
      - [Portuguese troops in Angola, "about 65,000 by 1974"]
      - [Portuguese eastern campaign, "1971–1972"]
