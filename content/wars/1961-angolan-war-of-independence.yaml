steps:
  - title: Cotton, prisons and the north rise
    date: January – March 1961
    when: "1961-02-04"
    borders: "1961-03-15"
    countries: [ao, pt]
    body:
      - Angola had been a Portuguese colony, in parts, since the 1500s, and the Estado Novo dictatorship of António de Oliveira Salazar called it an “overseas province” and encouraged settlement; by 1960 some 170,000 Portuguese lived there. Africans were subject to forced labour and compulsory crops. On 3–4 January 1961 workers of the cotton company Cotonang in the Baixa de Cassanje, east of Malanje, burned their identity cards and attacked company traders. The Portuguese Air Force bombed some twenty villages; the MPLA later spoke of 10,000 dead, and most estimates run from 400 to 7,000.
      - Early on 4 February, a few hundred men armed mostly with machetes attacked the São Paulo prison and police posts in Luanda to free political prisoners. Seven members of the security forces and, by different accounts, 25 to 40 attackers were killed, and settlers and police then killed hundreds of Africans in the city’s musseques. The day is celebrated in Angola as the start of the armed struggle.
      - On 15 March, Holden Roberto’s Union of the Peoples of Angola (UPA), based in Léopoldville, sent several thousand fighters into the coffee districts of the north. With local farm workers they attacked farms, administrative posts and towns such as Quitexe, killing about 1,000 Portuguese settlers and several thousand Africans, many of them Ovimbundu contract workers from the south, and destroying roads and bridges. Within days the UPA held much of the north up to the Dembos forest, where it declared Nambuangongo its capital.
    facts:
      - [Baixa de Cassanje revolt, "3–4 January 1961"]
      - [Attack on the Luanda prisons, "4 February 1961"]
      - [UPA rising in the north, "15 March 1961"]
      - [Settlers killed in March 1961, "about 1,000"]
