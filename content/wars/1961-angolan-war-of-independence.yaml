id: angolan-war-of-independence
name: Angolan War of Independence
start: "1961-02-04"
end: "1974-04-25"
tier: A
summary: "The war fought in 1961–1974 by Angolan nationalist movements against Portuguese rule, the first and longest theatre of the Portuguese Colonial War. A strike by cotton workers in the Baixa de Cassanje in January 1961 was crushed from the air; on 4 February militants attacked the prisons of Luanda, and on 15 March fighters of Holden Roberto’s UPA rose in the coffee country of the north, killing about 1,000 settlers and thousands of African workers. Portugal’s army and settler militias answered with reprisals that killed tens of thousands and drove hundreds of thousands of Bakongo into the Congo. The war then became a guerrilla war fought from neighbouring countries by three rival movements: the FNLA from Zaire, the MPLA of Agostinho Neto from Congo-Brazzaville and, from 1966, Zambia, and Jonas Savimbi’s UNITA in the east. Portugal, with up to some 65,000 troops, held the towns and most of the country, and the movements fought each other as well as the Portuguese. The war ended with the Carnation Revolution in Lisbon on 25 April 1974; the Alvor Agreement of January 1975 set independence for 11 November 1975, but the movements were already fighting the civil war that followed."
countries: [ao, pt, cd, cg, zm]
