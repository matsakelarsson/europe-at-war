steps:
  - title: Operation Vijay in Goa
    date: 17–19 December 1961
    when: "1961-12-18"
    borders: "1961-12-17"
    countries: [in, pt]
    body:
      - After independence India asked Portugal to hand over its enclaves on the west coast, as France gave up Pondicherry in 1954. Salazar’s government refused and declared them provinces of Portugal. In 1955 Portuguese police fired on unarmed Indian satyagrahis who marched across the border, killing more than twenty, and India broke off relations. In November 1961, after Portuguese troops on Anjediva island fired on an Indian passenger ship and on fishing boats, Nehru’s government decided to use force.
      - About 45,000 Indian troops, with the carrier Vikrant, cruisers and frigates and some twenty Canberra bombers, moved against a Portuguese garrison of about 3,500 with a single sloop and three patrol boats. Salazar ordered his commanders to fight to the last man. On 18 December the 50th Parachute Brigade advanced from the north and the 17th Infantry Division from Belgaum in the east, while aircraft bombed the airfield at Dabolim and the radio station at Bambolim. Indian frigates disabled the sloop Afonso de Albuquerque in Mormugao harbour, and Indian marines suffered their heaviest losses in an assault on the island of Anjediva.
      - The Portuguese troops blew bridges and fell back towards the port of Vasco da Gama, but offered little resistance. Indian paratroops entered Panaji on 19 December, and that evening Vassalo e Silva signed the surrender. The fighting in all the territories cost 22 Indian and 30 Portuguese lives; 4,668 Portuguese were taken prisoner.
