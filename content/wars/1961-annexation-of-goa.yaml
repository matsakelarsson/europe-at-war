id: annexation-of-goa
name: Annexation of Goa
start: "1961-12-17"
end: "1961-12-19"
tier: B
summary: "India’s military takeover of Portuguese India, Goa, Daman and Diu, in December 1961, code-named Operation Vijay. Portugal had ruled Goa since 1510 and, under Salazar, refused to negotiate after Indian independence, declaring its Indian territories overseas provinces of Portugal. After years of failed diplomacy and the suppression of nonviolent protests, India sent about 45,000 troops with air and naval support against a Portuguese garrison of some 3,500. The Governor-General, Manuel António Vassalo e Silva, disobeyed Salazar’s order to fight to the last and surrendered on 19 December after about 36 hours. India calls the operation the Liberation of Goa; Portugal called it an invasion and recognised Indian sovereignty only in 1974."
countries: [in, pt]
sides:
  - id: in
    name: India
    polities: [india]
    ink: orange
    moves: Indian moves
    success: Indian success
  - id: pt
    name: Portugal
    polities: [portugal]
    ink: green
    moves: Portuguese moves
    success: Portuguese success
notes:
  - India regarded the Portuguese territories as colonial enclaves that should have come to it at independence, and the Western powers’ objections as a defence of colonialism. Portugal and its allies held that India had used force against a sovereign territory in breach of the UN Charter. A Western-backed resolution in the UN Security Council calling for a ceasefire and Indian withdrawal was vetoed by the Soviet Union.
  - The enclaves of Dadra and Nagar Haveli, inland from Daman, had been taken over by Indian and Goan volunteers in 1954 and were formally merged into India in August 1961.
