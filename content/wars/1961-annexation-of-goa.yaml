  - title: Daman, Diu and after
    date: December 1961 – 1974
    when: "1961-12-19"
    borders: "1961-12-19"
    countries: [in, pt]
    body:
      - At the same time Indian troops attacked the two small enclaves on the Gujarat coast. At Daman the Portuguese garrison surrendered on the morning of 19 December after a day of fighting. At Diu, an island fortress, Indian aircraft bombed the airfield and fort, sank a patrol boat and the cruiser Delhi shelled the shore; the garrison decided to surrender on the evening of 18 December and laid down its arms the next day.
      - Goa, Daman and Diu became a union territory of India, and Goa a state in 1987. Portugal broke off relations, Salazar refused to accept the loss, and Vassalo e Silva and other officers were court-martialled and cashiered for not fighting on. Portuguese prisoners were held for months while Lisbon refused India’s terms for their release. After the Carnation Revolution, Portugal recognised Indian sovereignty in a treaty of 31 December 1974.
