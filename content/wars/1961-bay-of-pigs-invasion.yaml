  - title: Playa Girón
    date: 17–19 April 1961
    when: "1961-04-17"
    borders: "1961-04-17"
    countries: [cu, us]
    view:
      center: [-81.10, 22.28]
      size: [120, 110]
    body:
      - "The brigade began landing after midnight on 17 April at Playa Larga, at the head of the bay, and at Playa Girón, 35 km to the south-east. Coral reefs the planners had taken for seaweed ripped the landing craft, and local militiamen raised the alarm by radio. Paratroopers dropped at dawn to hold the causeways at Palpite and San Blas. Cuban aircraft attacked the ships offshore and sank the Houston, carrying a battalion and supplies, and the Río Escondido, with most of the brigade’s ammunition and fuel; the other freighters fled out to sea. The brigade’s slow B-26s, flying from Nicaragua without fighter escort, were shot down one after another."
      - "Castro took command from the Australia sugar mill north of the swamp. Militia battalions, among them the cadets of the militia officers’ school at Matanzas, and regular troops under José Ramón Fernández attacked down the causeway to Playa Larga on 17 April, taking heavy losses from the brigade’s tanks and mortars, and were reinforced with tanks and artillery overnight. On 18 April the brigade abandoned Playa Larga and fell back on Girón, while other Cuban columns pushed in from Covadonga and Yaguaramas to the east."
      - "Kennedy allowed only one hour of unmarked jet cover from the carrier Essex on the morning of 19 April, and through a mix-up over time zones it missed the brigade’s last bombers, four of whose American crewmen were killed. That afternoon, out of ammunition and with Cuban forces closing in, the brigade broke up at Girón; San Román ordered his men into the swamps, where most were rounded up over the following days. In all 114 men of the brigade were killed and 1,202 captured. They were tried in 1962 and, after long negotiations, released in December 1962 in exchange for $53 million in food and medicine. Kennedy took public responsibility for the failure."
    facts:
      - [Landings, "night of 16–17 April 1961"]
      - [Brigade losses, "114 killed, 1,202 captured"]
      - [Cuban losses, "176 soldiers killed (official figure), with many more militiamen killed or wounded"]
      - [Prisoners released, "23–24 December 1962"]
