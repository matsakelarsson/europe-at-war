notes:
  - "Casualty figures for the Cuban side are uncertain. The Cuban government gave 176 dead among its armed forces; estimates of militia losses, killed and wounded, run to about 2,000. Four American pilots of the Alabama Air National Guard, flying for the CIA, were killed on 19 April. In Cuba the security services detained tens of thousands of suspected opponents during the invasion."
  - The brigade took its number from the serial number of Carlos Rodríguez Santana, a recruit who died in a training accident in Guatemala. The training camps in Guatemala and the departure port of Puerto Cabezas in Nicaragua belong to the Central American story, covered in a later wave.
