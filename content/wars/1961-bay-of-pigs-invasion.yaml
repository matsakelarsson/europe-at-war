id: bay-of-pigs-invasion
name: Bay of Pigs Invasion
start: "1961-04-15"
end: "1961-04-20"
tier: B
summary: "The failed invasion of Cuba by Brigade 2506, about 1,400 Cuban exiles recruited, trained and armed by the CIA, in April 1961. President Eisenhower approved a plan to overthrow Fidel Castro in March 1960, as Castro’s government nationalised American property and drew close to the Soviet Union, and the brigade trained in Guatemala. President Kennedy, in office since January 1961, approved a revised plan that moved the landing to the remote Bay of Pigs in the Zapata swamp on Cuba’s south coast and kept the American role hidden. On 15 April 1961 exile pilots in B-26 bombers painted in Cuban markings struck three Cuban airfields but left part of Castro’s small air force intact, and the cover story fell apart within hours; Kennedy cancelled a second strike. The brigade landed at Playa Larga and Playa Girón before dawn on 17 April. Cuban aircraft sank two of its supply ships, and Cuban troops and militias, led by Castro himself, attacked down the causeways through the swamp. Short of ammunition and without the American air cover they had expected, the invaders were defeated by the evening of 19 April: 114 were killed and 1,202 captured, while Cuba gave its own losses as 176 dead, with many more militiamen killed or wounded by other estimates. The victory strengthened Castro, who had declared the revolution socialist on 16 April, and pushed Cuba closer to the Soviet Union; the prisoners were ransomed in December 1962 for $53 million in food and medicine, and the United States turned to covert sabotage against Cuba in Operation Mongoose."
countries: [cu, us]
