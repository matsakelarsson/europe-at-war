steps:
  - title: The exile brigade and the air strikes
    date: March 1960 – 16 April 1961
    when: "1961-04-15"
    borders: "1961-04-15"
    countries: [cu, us]
    body:
      - "In March 1960 President Eisenhower approved a CIA plan to train Cuban exiles for guerrilla war against Fidel Castro, whose government was seizing American-owned land and businesses and buying Soviet oil and arms. As the exile force grew, the plan became an invasion. The brigade, drawn from Cubans of many backgrounds, among them former officers of Batista’s army and men who had fought against Batista, trained at camps in the Guatemalan highlands, and the CIA gathered exile politicians in the Cuban Revolutionary Council in Miami, which was to form a provisional government. The plan counted on the landing setting off a rising inside Cuba and on the anti-Castro guerrillas of the Escambray Mountains."
      - "Kennedy inherited the plan. Wanting to hide the American hand, he rejected a landing at the town of Trinidad, near the Escambray, and in March 1961 approved one at the Bay of Pigs (Bahía de Cochinos), a remote inlet in the Zapata swamp with an airstrip at Playa Girón and only three causeways leading in. The brigade, five infantry battalions, a paratroop battalion and a heavy-weapons battalion with a few tanks, about 1,400 men under José Pérez San Román, sailed from Puerto Cabezas in Nicaragua on chartered freighters escorted at a distance by the US Navy."
      - "At dawn on 15 April eight B-26 bombers flown by exile pilots and painted in the markings of Cuba’s air force struck the airfields at San Antonio de los Baños, Ciudad Libertad in Havana and Santiago de Cuba. They destroyed several aircraft, but Castro kept a handful of Sea Fury fighters, T-33 jets and B-26s flying. One pilot landed in Miami and claimed to be a defector, a story that unravelled at the United Nations. At the funeral of those killed in the raids, on 16 April, Castro declared for the first time that the revolution was socialist. That evening Kennedy cancelled the second air strike planned for the morning of the landing."
    facts:
      - [Plan approved by Eisenhower, "17 March 1960"]
      - [Brigade 2506, "about 1,400 men"]
      - [Air strikes on Cuban airfields, "15 April 1961"]
      - [Castro declares the revolution socialist, "16 April 1961"]
