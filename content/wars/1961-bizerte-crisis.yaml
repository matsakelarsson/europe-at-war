id: bizerte-crisis
name: Bizerte crisis
start: "1961-07-19"
end: "1961-07-23"
tier: C
summary: "A short and bloody clash between Tunisia and France over the naval base of Bizerte, which France had kept when Tunisia became independent in 1956. After the French bombing of Sakiet Sidi Youssef in 1958 France gave up its other bases in Tunisia, but it held on to Bizerte, its great harbour on the Strait of Sicily, while the war in neighbouring Algeria went on. In July 1961, angered by work to lengthen the runway at the base and by France’s refusal to set a date for leaving, President Habib Bourguiba demanded a timetable for withdrawal, and on 19 July Tunisian troops and thousands of volunteers, many of them barely armed, blockaded the base. France flew in paratroopers under Vice-Admiral Maurice Amman; French aircraft, artillery and tanks broke the roadblocks, and on 21–23 July French forces fought their way into the town of Bizerte and took it. The UN Security Council called for a ceasefire on 22 July, and a special session of the General Assembly met on the crisis in August. Tunisia gave its losses as 630 killed and 1,555 wounded, many of them civilians and young volunteers; about 24 French soldiers died. Tunisia broke off relations with France for a time, and the last French forces left Bizerte on 15 October 1963, after the end of the Algerian War, a day Tunisia keeps as Evacuation Day."
