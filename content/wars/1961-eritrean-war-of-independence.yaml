steps:
  - title: The federation and the first shots
    date: 1950–1962
    when: "1961-09-01"
    borders: "1961-09-01"
    countries: [er, et, sd]
    body:
      - "Eritrea had been an Italian colony from 1890 and under British military administration since 1941. Its people were divided over its future: much of the Christian highland population, organised in the Unionist Party with the support of the Ethiopian church and government, wanted union with Ethiopia, while the Muslim League and other parties, strongest in the lowlands, wanted independence. On 2 December 1950 the UN General Assembly decided on a compromise, and on 15 September 1952 Eritrea became an autonomous unit federated with Ethiopia under the Ethiopian crown, with its own assembly, government and official languages, Tigrinya and Arabic."
      - "Haile Selassie’s government wore the autonomy down: political parties and trade unions were suppressed, Amharic replaced the Eritrean languages in schools and offices, and in 1959 the Eritrean flag was lowered. In July 1960 Eritrean exiles, mostly Muslim students and intellectuals, founded the Eritrean Liberation Front in Cairo under Idris Muhammad Adam. On 1 September 1961 Hamid Idris Awate, a former soldier in the Italian colonial army, and a band of about a dozen men fired on police at Mount Adal near Haykota in the western lowlands, the date Eritreans count as the start of the armed struggle. On 14 November 1962 the Eritrean Assembly, under heavy pressure, voted to end the federation, and Eritrea became a province of Ethiopia."
    facts:
      - [UN resolution on federation, "2 December 1950"]
      - [Federation begins, "15 September 1952"]
      - [Battle of Adal, "1 September 1961"]
      - [Annexation, "14 November 1962"]
    markers:
      - kind: battle
        side: elf
        name: Mount Adal (Haykota)
        date: 1 September 1961
        text: Hamid Idris Awate’s band fired on Ethiopian police at Mount Adal near Haykota, the first shots of the war. Awate died in 1962 and is buried near Haykota.
        lonlat: [37.075, 15.182]
      - kind: event
        side: et
        name: Asmara
        date: 14 November 1962
        text: The Eritrean Assembly voted here to end the federation; Eritrea became a province of Ethiopia.
        lonlat: [38.930, 15.330]
  - title: The ELF’s war and the split
    date: 1962–1974
    when: "1965-05"
    borders: "1970-12-01"
    countries: [er, et, sd]
    body:
      - "The ELF grew slowly, from about 250 fighters in 1963 to some 2,000 by 1965, drawing at first on the Muslim pastoralists of the western lowlands and later on Christian highlanders too. In May 1965 it divided Eritrea into zonal commands on the model of the Algerian FLN’s wilayas, directed from Kassala in Sudan, and Arab states supplied money and arms. The Ethiopian army answered with commando units trained by Israeli advisers, the burning of villages and killings of civilians, among them Hazemo in 1967 and, in reprisal for the killing of an Ethiopian general, Besikdira, where some 120 villagers were shut in the mosque and killed, and Ona near Keren, where more than 800 were killed, on 30 November and 1 December 1970."
      - "The zonal commands bred rivalries along regional and religious lines, and young fighters, Christian and Muslim, protested at the leadership and at killings within the front. From 1970 breakaway groups formed in the north, among them a highland group led by Isaias Afwerki; in 1972 the ELF went to war with them, and in 1973 they joined as what became the Eritrean People’s Liberation Front (EPLF). The fighting between the fronts went on until 1974, when the pressure of Eritrean villagers and the turmoil in Ethiopia brought a truce."
    facts:
      - [Zonal commands, "May 1965"]
      - [Besikdira and Ona massacres, "30 November – 1 December 1970"]
      - [First civil war between the fronts, "1972–1974"]
    markers:
      - kind: event
        side: et
        name: Besikdira and Ona (Keren)
        date: 30 November – 1 December 1970
        text: Ethiopian troops killed about 120 people at Besikdira and more than 800 at Ona, two villages near Keren. The dead of Ona were buried on 2 December.
        lonlat: [38.451, 15.777]
      - kind: event
        side: elf
        name: Kassala
        date: From 1965
        text: The ELF’s revolutionary command directed the zonal commands from this Sudanese border town.
        lonlat: [36.400, 15.450]
    areas:
      - style: contested
        side: elf
        label: Main ELF operating areas, late 1960s (approximate)
        polygon: [[36.450, 14.300], [36.450, 16.200], [37.600, 17.200], [38.400, 17.800], [38.900, 16.700], [38.700, 15.700], [37.900, 15.200], [37.300, 14.300]]
  - title: The revolution and the rebel tide
    date: 1974–1977
    when: "1975-01-31"
    borders: "1977-12-21"
    countries: [er, et]
    body:
      - "In September 1974 the military committee known as the Derg deposed Haile Selassie. Its first chairman, the Eritrean-born General Aman Andom, wanted talks; he was killed in November 1974, and the Derg chose force. At the end of January 1975 the ELF and EPLF, now cooperating, attacked Asmara; in the reprisals that followed Ethiopian troops killed civilians in and around the city, some 3,000 by one count, and thousands of young Eritreans went to the fronts. A peasant army raised by the Derg in Tigray and Wollo for an invasion in 1976 broke up without reaching its goal."
      - "In 1977, while Ethiopia also fought Somalia in the Ogaden and the United States closed its Kagnew communications station in Asmara, the fronts overran most of Eritrea. The EPLF took Nakfa on 25 March and then Afabet, Keren, Elabored and Dekemhare; the ELF took Om Hajer, Tesseney, Agordat, Mendefera and Adi Quala. Ethiopia held only Asmara, Massawa, Assab, Barentu and Adi Keyh, all of them besieged. In December the EPLF broke into Massawa and took most of the town, but Ethiopian naval guns on the peninsulas and islands drove it back after a barrage on 23 December that cost it at least 2,000 dead."
    facts:
      - [Aman Andom killed, "November 1974"]
      - [Attack on Asmara, "end of January 1975"]
      - [EPLF takes Nakfa, "25 March 1977"]
      - [Battle for Massawa, "December 1977"]
    markers:
