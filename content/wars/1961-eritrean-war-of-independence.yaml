  - title: The Ethiopian counter-offensives
    date: 1978–1979
    when: "1978-05"
    borders: "1978-11-26"
    countries: [er, et]
    body:
      - "When the Ogaden War ended in March 1978, the Derg turned its army, rebuilt with Soviet arms and advised by Soviet and Cuban officers, on Eritrea. From May 1978 aircraft from a new airfield at Mekelle bombed the fronts’ positions and also towns, villages and herds. In July a ground offensive retook the towns of southern and central Eritrea within weeks; the ELF’s positions collapsed. In November a second offensive relieved Massawa and retook Keren after a two-day battle at Elabored (25–26 November)."
      - "The EPLF made what it called a “strategic withdrawal” to the mountains of the Sahel around Nakfa, carrying off what it could of its workshops and supplies. Three more offensives against Nakfa in 1979, with over 50,000 troops, failed; between 14 and 22 July alone the army lost an estimated 6,000 dead and the EPLF 2,500. A further offensive in December 1979 ended in a rout of the government forces."
    facts:
      - [Ogaden War ends, "March 1978"]
      - [Ethiopian offensive retakes the south, "July 1978"]
      - [Keren retaken, "November 1978"]
      - [Offensives against Nakfa, "January – December 1979"]
