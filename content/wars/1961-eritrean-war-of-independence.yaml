  - title: Massawa
    date: February 1990
    when: "1990-02-08"
    borders: "1990-02-17"
    countries: [er, et]
    body:
      - "In 1989 the Tigray People’s Liberation Front, the EPLF’s ally, drove the Ethiopian army out of Tigray, and the Derg’s Second Army in Eritrea depended on the port of Massawa. On the night of 8 February 1990 the EPLF launched Operation Fenkil, attacking down the coast and from the hills with tanks taken from the Ethiopians and fast boats at sea. In about ten days of fighting it destroyed the 606th Corps and took the port; Ethiopia lost an estimated 9,000 killed and 8,000 captured, the EPLF some 3,000. Isaias Afwerki called it the greatest strategic victory of the struggle."
      - "The Ethiopian air force bombed Massawa until the end of March 1990, with cluster bombs and, by many reports, napalm, killing hundreds of civilians and destroying much of the old town. The Second Army in Asmara could now be supplied only by air."
    facts:
      - [Operation Fenkil, "8–10 February 1990"]
      - [Battle for Massawa, "8–17 February 1990"]
