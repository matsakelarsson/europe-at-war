  - title: Nakfa and the Red Star
    date: 1980–1987
    when: "1982-02-15"
    borders: "1982-03-01"
    countries: [er, et, sd]
    body:
      - "In 1980–1981 the EPLF, with the help of the Tigray People’s Liberation Front, drove the weakened ELF out of Eritrea into Sudan, where it broke into factions; from then on the EPLF was the only front fighting inside the country. Behind the trench lines in the Sahel it built a society underground: hospitals, schools, workshops and garages dug into the hillsides, a large share of them run by women, who made up about a third of its fighters."
      - "On 15 February 1982 Mengistu Haile Mariam launched the Red Star Campaign, the largest offensive yet, with some 84,500 troops in ten divisions against about 22,000 EPLF fighters. It came within 3 km of Nakfa but did not take it, and on 5 July 1982 the army stopped and dug in. By Ethiopian army records it lost 10,115 killed, 23,313 wounded and 3,159 missing; the EPLF acknowledged about 4,000 dead and three times as many wounded. A further offensive in 1983 also failed; in 1985 the EPLF took Barentu, but lost it again to an Ethiopian counter-attack. The famine of 1983–1985 struck Eritrea hard."
    facts:
      - [ELF driven into Sudan, "1980–1981"]
      - [Red Star Campaign, "15 February – 5 July 1982"]
      - [Ethiopian troops committed, "about 84,500"]
