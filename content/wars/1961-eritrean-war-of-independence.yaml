id: eritrean-war-of-independence
name: Eritrean War of Independence
start: "1961-09-01"
end: "1991-05-29"
tier: A
summary: "Thirty years of war in which Eritrean fronts fought for independence from Ethiopia. The former Italian colony was federated with Ethiopia by the United Nations in 1952; as Emperor Haile Selassie dismantled its autonomy, the Eritrean Liberation Front (ELF), founded in Cairo in 1960, began an armed struggle on 1 September 1961, and in 1962 Ethiopia annexed Eritrea as a province. Ethiopian counter-insurgency, with massacres of villagers, swelled the fronts, which split in the early 1970s: the Eritrean People’s Liberation Front (EPLF) of Isaias Afwerki broke away and the two fought each other. After the revolution of 1974 the military government, the Derg, lost almost all of Eritrea to the fronts by 1977, then won most of it back in 1978 with Soviet arms. The EPLF held its mountain base around Nakfa through repeated offensives, drove the ELF out in 1981 and from 1988, after its victory at Afabet, went over to the attack. It took Massawa in 1990 and entered Asmara on 24 May 1991, as the Derg fell to the EPLF’s Tigrayan allies; Eritrea became independent after a referendum in April 1993. Estimates of the dead range widely: some 65,000–70,000 Eritrean fighters, tens of thousands of Ethiopian soldiers and between 90,000 and 280,000 civilians."
countries: [er, et, sd]
