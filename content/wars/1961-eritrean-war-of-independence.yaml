  - title: Afabet
    date: March 1988
    when: "1988-03-17"
    borders: "1988-03-20"
    countries: [er, et]
    body:
      - "On 17 March 1988 the EPLF broke through the front of the Nadew Command, the Ethiopian army’s northern front, three divisions of some 15,000–22,000 men. In three days the command was destroyed: Ethiopia lost an estimated 8,000–9,000 killed and 5,000 captured, among them three Soviet advisers, and huge stocks of weapons gathered for an offensive fell to the EPLF at Afabet. The EPLF, with some 15,000–20,000 fighters, lost an estimated 4,000–5,000 killed. The historian Basil Davidson compared the battle to Dien Bien Phu; the Ethiopian historian Gebru Tareke noted that the Ethiopian army fought on for three more years."
      - "After Afabet the Ethiopian army gave up Tesseney, Barentu and Agordat and fell back on Keren and the highlands. Its reprisals continued; in 1988 soldiers killed some 400 villagers, most of them women and children, at She’eb near Massawa. To free troops for Eritrea, Mengistu made peace with Somalia in April 1988, which helped set off the Somali National Movement’s offensive in northern Somalia (see Somaliland War of Independence)."
    facts:
      - [Battle of Afabet, "17–20 March 1988, EPLF success"]
      - [Ethiopian losses, "8,000–9,000 killed, 5,000 captured"]
