  - title: Asmara and independence
    date: May 1991 – May 1993
    when: "1991-05-24"
    borders: "1991-05-24"
    countries: [er, et]
    body:
      - "In the spring of 1991 the EPLF broke through the Ethiopian lines around Asmara, while the TPLF-led coalition, the Ethiopian People’s Revolutionary Democratic Front (EPRDF), closed in on Addis Ababa. Mengistu fled to Zimbabwe on 21 May. The Second Army in Asmara disintegrated, tens of thousands of its soldiers surrendering or making their way home, and on 24 May 1991 EPLF fighters entered Asmara without a battle. Assab fell the next day, and on 28 May the EPRDF entered Addis Ababa."
      - "The EPLF set up a provisional government, and the new Ethiopian government accepted Eritrea’s right to decide its future. In a referendum held under UN observation on 23–25 April 1993, 99.83 per cent of voters chose independence. Eritrea declared its independence on 24 May 1993 and joined the United Nations on 28 May, with Isaias Afwerki as president. The border between the two countries was not demarcated, and in 1998 they went to war again (see Eritrean–Ethiopian War)."
    facts:
      - [EPLF enters Asmara, "24 May 1991"]
      - [EPRDF enters Addis Ababa, "28 May 1991"]
      - [Independence referendum, "23–25 April 1993, 99.83% yes"]
      - [Independence, "24 May 1993"]
