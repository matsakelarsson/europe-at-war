notes:
  - "Most figures in this war come from the fronts, the Ethiopian government or later historians (notably Gebru Tareke for the Ethiopian army’s records) and often differ widely. The estimates on Wikipedia, from several sources, are 65,000–70,000 Eritrean fighters killed, about 100,000 Ethiopian soldiers killed, 90,000–280,000 civilians killed and 440,000 to over 600,000 people displaced or made refugees, most of them in Sudan."
  - "Ethiopia regarded the war as a fight against secession and, after 1974, against “bandits” and foreign-backed separatists; the fronts regarded the federation’s end in 1962 as an illegal annexation of a former colony entitled to self-determination. The fronts drew support at various times from Sudan, Syria, Iraq, Libya and other Arab states and from China; Ethiopia from the United States and Israel under the emperor and from the Soviet Union and Cuba under the Derg."
