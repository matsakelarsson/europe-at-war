    moves: Kurdish moves
    success: Kurdish success
notes:
  - Casualty figures vary widely. Iraqi military deaths are estimated at 5,000 to 10,000; estimates of all deaths, most of them Kurdish fighters and villagers, range from about 10,000 to 100,000, and tens of thousands of people were displaced.
  - The Kurdish-held areas are drawn approximately; the government held the towns of the plains, and the Peshmerga the mountains and many villages.
