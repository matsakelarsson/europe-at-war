  - title: The Ba’ath and the March agreement
    date: 1968–1970
    when: "1968-10"
    borders: "1970-03-11"
    countries: [iq, ir]
    body:
      - The Ba’ath party returned to power in July 1968, and fighting resumed in the autumn. Barzani now had support from the Shah of Iran, who used the Kurds against Baghdad in his quarrel over the Shatt al-Arab, and from Israel, which sent advisers and arms through Iran. Kurdish raids reached the oil installations at Kirkuk in 1969, and Iraqi offensives again failed to defeat the Peshmerga, while Barzani’s rivals in the KDP led by Jalal Talabani fought on the government’s side.
      - Saddam Hussein, the regime’s rising strongman, negotiated directly with Barzani, and on 11 March 1970 they announced a peace agreement. It recognised the Kurds as one of Iraq’s two nationalities, made Kurdish an official language in Kurdish areas and promised an autonomous region within four years, with a census to decide whether Kirkuk was part of it. The census was never held, and the dispute over Kirkuk and oil led to a new war in 1974.
    facts:
      - [Fighting resumes, "October 1968"]
      - [March agreement, "11 March 1970"]
