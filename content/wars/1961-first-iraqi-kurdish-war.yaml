id: first-iraqi-kurdish-war
name: First Iraqi–Kurdish War
start: "1961-09-11"
end: "1970-03-11"
tier: B
summary: The Kurdish revolt in northern Iraq led by Mustafa Barzani and the Kurdistan Democratic Party (KDP) against the governments of Abd al-Karim Qasim, the Arif brothers and, from 1968, the Ba’ath party. It began in September 1961, after Qasim, who had welcomed Barzani home from Soviet exile in 1958, refused Kurdish demands for autonomy. The Kurdish Peshmerga held the mountains along the Iranian and Turkish borders against repeated offensives, interrupted by ceasefires in 1963, 1964 and 1966; their victory at Mount Handrin in May 1966 was the largest of the war. Iran, and secretly Israel, came to support the Kurds. The war ended with the agreement of 11 March 1970, in which the Ba’athist government promised the Kurds autonomy within four years. Estimates of the dead range from about 10,000 to as many as 100,000.
countries: [iq]
sides:
  - id: iq
    name: Iraq
    polities: [iraq]
    ink: brown
    moves: Iraqi moves
    success: Iraqi success
  - id: kdp
    name: Kurdish rebels (Barzani and the KDP)
    polities: [kdp]
