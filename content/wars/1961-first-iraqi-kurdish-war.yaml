steps:
  - title: Barzani’s revolt
    date: 1961–1966
    when: "1961-09-11"
    borders: "1966-06-29"
    countries: [iq]
    body:
      - After the revolution of July 1958 Qasim promised that Arabs and Kurds would be partners in the new Iraq, and Mustafa Barzani returned from eleven years in the Soviet Union. But Qasim soon turned against the KDP and armed Barzani’s tribal rivals. Fighting broke out in September 1961, and the Iraqi air force bombed the Barzan region; the KDP joined the revolt by the end of the year. Barzani’s Peshmerga, fighters numbering in the thousands, took control of most of the mountains from Zakho to the Iranian border near Sulaymaniyah.
      - The Ba’athists who overthrew Qasim in February 1963 agreed to a ceasefire, then in June launched a major offensive, joined by some 6,000 Syrian troops, which burned villages but could not break the Kurds. Abd al-Salam Arif agreed to a ceasefire in February 1964. When the war resumed, an Iraqi offensive towards the Iranian border in May 1966 ended in disaster at Mount Handrin near Rawanduz, where the Peshmerga destroyed an Iraqi brigade; estimates of the Iraqi dead range from about 1,000 to 3,000. Prime Minister Abd al-Rahman al-Bazzaz then offered a twelve-point peace plan and a ceasefire on 29 June 1966.
    facts:
      - [Revolt begins, "11 September 1961"]
      - [Ba’athist offensive with Syrian troops, "June 1963"]
      - [Battle of Mount Handrin, "11–12 May 1966, Kurdish victory"]
      - [Bazzaz declaration, "29 June 1966"]
