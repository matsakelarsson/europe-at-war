  - title: The Carnation Revolution and independence
    date: April 1974 – November 1975
    when: "1974-04-25"
    borders: "1975-11-11"
    countries: [pt, ao, gw, mz, cv, st]
    body:
      - In February 1974 Spínola, now deputy chief of staff, published Portugal and the Future, arguing that the wars could not be won. On 25 April 1974 the Armed Forces Movement, mostly captains and majors who had served in Africa, overthrew the regime of Salazar’s successor, Marcelo Caetano, almost without bloodshed; soldiers put carnations in their rifles, and the revolution took its name from them.
      - The new rulers moved quickly to end the wars. Portugal recognised Guinea-Bissau on 10 September 1974; the Lusaka Accord of 7 September 1974 handed Mozambique to FRELIMO, which took power at independence on 25 June 1975; Cape Verde became independent on 5 July and São Tomé and Príncipe on 12 July 1975. In Angola the three movements could not share power, and independence on 11 November 1975 came in the middle of a civil war. Hundreds of thousands of settlers, the retornados, returned to Portugal.
    facts:
      - [Carnation Revolution, "25 April 1974"]
      - [Guinea-Bissau recognised, "10 September 1974"]
      - [Mozambique independent, "25 June 1975"]
      - [Cape Verde independent, "5 July 1975"]
