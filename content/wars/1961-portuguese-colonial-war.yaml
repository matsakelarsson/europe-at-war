id: portuguese-colonial-war
name: Portuguese Colonial War
start: "1961-02-04"
end: "1974-04-25"
tier: B
summary: The wars fought by Portugal’s Estado Novo dictatorship against independence movements in its African colonies, in Angola from 1961, Portuguese Guinea (Guinea-Bissau) from 1963 and Mozambique from 1964. Portugal held most of the territory with large conscript armies, by one count mobilising some 1.4 million men for military and support service over the years, but the guerrillas of the MPLA, FNLA and UNITA in Angola, the PAIGC in Guinea and FRELIMO in Mozambique could not be defeated. Weariness with the war led army officers to overthrow the regime in the Carnation Revolution of 25 April 1974, and all five African colonies became independent in 1974–1975.
