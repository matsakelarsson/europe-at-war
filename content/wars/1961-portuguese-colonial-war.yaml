notes:
  - "Casualty figures are estimates. Portugal lost about 8,800 soldiers dead in the three wars, including deaths from accidents and disease; estimates of guerrillas killed run to some 40,000–46,000 and of civilians killed from about 70,000 to 110,000. Atrocities were committed on all sides, among them the massacre of settlers and African workers by the UPA in northern Angola in March 1961, the reprisals that followed, and the massacre of villagers by Portuguese commandos at Wiriyamu in Mozambique in December 1972, where estimates of the dead range from about 150 to at least 385."
  - African soldiers made up about 18 per cent of Portugal’s forces in Africa in 1961 and, by one estimate, more than half by 1974. The three wars are told in their own stories, the Angolan War of Independence, the Guinea-Bissau War of Independence and the Mozambican War of Independence.
