notes:
  - The fighting took place in Africa, outside the map. Portugal lost about 8,000–9,000 soldiers killed; losses among the guerrillas and especially civilians were far higher, with estimates of civilian deaths ranging from about 70,000 to 110,000. Atrocities were committed on all sides, among them the massacre of settlers and others by the UPA in northern Angola in March 1961 and the massacre of villagers by Portuguese troops at Wiriyamu in Mozambique in 1972.
