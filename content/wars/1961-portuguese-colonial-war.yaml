steps:
  - title: Three wars in Africa
    date: 1961 – 1974
    when: "1961-02-04"
    borders: "1970-01-01"
    countries: [ao, gw, mz, pt]
    body:
      - Salazar’s Portugal refused to give up its colonies when Britain, France and Belgium were leaving theirs, calling them overseas provinces of a single nation. The war began in Angola, with the attack on the Luanda prisons on 4 February 1961 and the UPA rising in the north on 15 March. In Portuguese Guinea the PAIGC of Amílcar Cabral attacked the barracks at Tite on 23 January 1963 and within a few years held much of the south and east. In Mozambique FRELIMO, led by Eduardo Mondlane, opened its war with an attack on the administrative post of Chai in Cabo Delgado on 25 September 1964 and built its strongholds on the Makonde plateau and in Niassa, later also in Tete.
      - Portugal fought all three wars at once, with an average of more than 100,000 troops in Africa each year, a growing share of them African. In Guinea General António de Spínola tried to win the population with reforms as well as force, and Portuguese commandos raided Conakry in 1970; in Mozambique General Kaúlza de Arriaga’s Operation Gordian Knot of 1970 hit FRELIMO’s bases in the north without ending the war. Portugal was allied in secret with South Africa and Rhodesia. Mondlane was killed by a parcel bomb in 1969 and Cabral was shot in Conakry on 20 January 1973, but the PAIGC proclaimed Guinea-Bissau’s independence in the Boé hills near Madina do Boé on 24 September 1973, and dozens of states recognised it.
    facts:
      - [Angola, "from 4 February 1961"]
      - [Guinea, "from 23 January 1963"]
      - [Mozambique, "from 25 September 1964"]
      - [Guinea-Bissau declares independence, "24 September 1973"]
