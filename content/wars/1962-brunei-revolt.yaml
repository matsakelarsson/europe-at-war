id: brunei-revolt
name: Brunei revolt
start: "1962-12-08"
end: "1963-05-18"
tier: C
summary: "The rising of the North Kalimantan National Army (TNKU) in the British protectorate of Brunei and the neighbouring parts of Sarawak and North Borneo. The left-wing Brunei People’s Party of A. M. Azahari had won every elected seat in the Legislative Council in 1962 and opposed the plan to bring Brunei into Malaysia; it wanted a unitary state of North Kalimantan joining Brunei, Sarawak and North Borneo under the Sultan, and its armed wing had been trained and armed with Indonesian help. At about 2 a.m. on 8 December 1962 several thousand TNKU members attacked police stations and government offices across the protectorate, failed to take the Sultan’s palace in Brunei Town, seized the Shell oil field at Seria with European hostages, and took Bangar, Limbang and other towns, while Azahari proclaimed the state from Manila. British troops flown from Singapore, starting with Gurkhas that evening and the Queen’s Own Highlanders on 10 December, retook Brunei Town and Seria within days; on 12 December Royal Marines of 42 Commando stormed Limbang from the river and freed the British Resident and other hostages, losing five men. Iban and other Dayak volunteers raised by Tom Harrisson helped hunt down the rebels in the interior. About 40 rebels were killed and some 3,400 detained; the Commonwealth side lost six dead. The last TNKU commander, Yassin Affendi, was wounded and captured on 18 May 1963. The Sultan declared a state of emergency, which has never been lifted, banned the party and decided in 1963 not to join Malaysia; Brunei stayed a British protectorate until it became independent on 1 January 1984. Indonesia’s support for the revolt led directly to its confrontation with Malaysia."
