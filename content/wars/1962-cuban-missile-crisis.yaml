steps:
  - title: Operation Anadyr
    date: May – 16 October 1962
    when: "1962-09-08"
    borders: "1962-10-14"
    countries: [cu, us, ru]
    body:
      - "After the Bay of Pigs the Cuban government expected another American invasion, and the CIA’s sabotage campaign, Operation Mongoose, and large US military exercises in the Caribbean seemed to confirm it. In May 1962 Khrushchev proposed to station Soviet nuclear missiles in Cuba, which he said would protect the revolution and would give the Americans a taste of what it was like to live with enemy missiles next door, as the Soviet Union did with the American Jupiters in Turkey and Italy. Castro agreed, and the operation, code-named Anadyr, was approved in July. It was to be kept secret until the missiles were ready."
      - "From July more than 80 Soviet ships carried some 43,000 troops to Cuba, hidden below decks. The first R-12 medium-range missiles, able to reach Washington and most of the eastern United States, arrived on the night of 8 September, followed by their nuclear warheads; the longer-range R-14s were still at sea when the crisis broke and never arrived. The ships also brought IL-28 bombers, MiG-21 fighters, SA-2 anti-aircraft missiles, coastal cruise missiles and, unknown to the Americans until decades later, about a hundred tactical nuclear weapons for use against an invasion. In public and in private the Soviet government told Kennedy that it was sending only defensive weapons."
      - "On 14 October an American U-2 flown by Major Richard Heyser photographed launch sites under construction near San Cristóbal in western Cuba. Analysts identified the missiles the next day, and on the morning of 16 October President Kennedy was shown the photographs. He gathered a group of advisers, later called the Executive Committee (ExComm), which met in secret for a week, weighing air strikes, an invasion and a blockade."
    facts:
      - [Operation Anadyr approved, "July 1962"]
      - [Soviet troops in Cuba, "about 43,000"]
      - [First R-12 missiles arrive, "8 September 1962"]
      - [U-2 photographs the San Cristóbal sites, "14 October 1962"]
