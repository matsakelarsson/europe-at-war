  - title: Dismantling the missiles
    date: 28 October – 20 November 1962
    when: "1962-10-28"
    borders: "1962-11-20"
    countries: [cu, us, ru, tr, it]
    body:
      - "On the morning of 28 October Radio Moscow broadcast Khrushchev’s reply: the Soviet Union would dismantle the weapons and take them home, under UN verification, and Kennedy publicly welcomed it, pledging not to invade Cuba. The secret promise on the Jupiters was not part of the public settlement. Castro learned of the decision from the radio and was furious. He set out five conditions of his own, among them an end to the embargo and to American raids and overflights and the return of Guantánamo Bay, and refused any inspection on Cuban soil, even when the UN Secretary-General, U Thant, came to Havana on 30–31 October."
      - "The Soviet deputy premier Anastas Mikoyan spent three weeks in Havana trying to win Castro over. The launch sites were bulldozed, and in early November the missiles were loaded onto ships at Mariel and other ports; American aircraft and warships counted them at sea from the air and alongside. Kennedy then insisted that the IL-28 bombers also go. When Khrushchev agreed, Kennedy lifted the quarantine on 20 November. The tactical nuclear weapons, which the Americans did not know about, were shipped home by December. The Jupiter missiles were removed from Turkey and Italy by April 1963, in June 1963 the two governments agreed on a direct teletype link between Washington and Moscow, the hotline, and in August they signed the Partial Test Ban Treaty with Britain."
    facts:
      - [Khrushchev’s announcement, "28 October 1962"]
      - [Quarantine lifted, "20 November 1962"]
      - [Jupiter missiles removed from Turkey and Italy, "by April 1963"]
    markers:
      - kind: treaty
        side: us
        name: Washington
        date: 28 October 1962
        text: Kennedy welcomed Khrushchev’s announcement and pledged that the United States would not invade Cuba.
        lonlat: [-77.04, 38.90]
      - kind: event
        side: su
        name: Mariel
        date: November 1962
        text: The dismantled missiles were loaded onto Soviet ships here and at other ports; American aircraft photographed them on deck.
        lonlat: [-82.75, 23.01]
        lp: l
      - kind: capital
        side: cu
        name: Havana
