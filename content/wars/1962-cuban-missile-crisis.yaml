  - title: The quarantine
    date: 22–27 October 1962
    when: "1962-10-22"
    borders: "1962-10-22"
    countries: [cu, us, ru]
    body:
      - "On the evening of 22 October Kennedy told the American people about the missiles on television, announced a naval “quarantine” of all offensive weapons bound for Cuba, a word chosen because a blockade was an act of war, and warned that any missile launched from Cuba would be met with a full retaliatory response against the Soviet Union. The Organization of American States endorsed the quarantine the next day. It came into force at 10 a.m. on 24 October; the Strategic Air Command went to DEFCON 2, with nuclear bombers in the air around the clock, and more than 100,000 troops gathered in Florida and Georgia for an invasion. In Cuba Castro put the armed forces and the militias, several hundred thousand people, on alert."
      - "On 24 October the Soviet ships carrying weapons stopped or turned back before reaching the line of American warships; a tanker was allowed through, and on 26 October a freighter, the Marucla, was boarded and found to carry no weapons. At the United Nations the American ambassador, Adlai Stevenson, showed the reconnaissance photographs. But work on the missile sites went on. On 26 October a letter from Khrushchev offered to remove the missiles in return for a pledge not to invade Cuba; on 27 October a second message, broadcast on Radio Moscow, also demanded the removal of the Jupiters from Turkey."
      - "Saturday 27 October was the most dangerous day. A Soviet SA-2 battery shot down a U-2 over Banes in eastern Cuba, killing Major Rudolf Anderson; Cuban anti-aircraft guns fired on low-flying American reconnaissance jets, and Castro wrote to Khrushchev urging him not to hesitate to use nuclear weapons if the Americans invaded. Near the quarantine line American destroyers dropped practice depth charges to force the Soviet submarine B-59 to surface; its commander, believing war might have begun, wanted to arm its nuclear torpedo, and the brigade chief of staff on board, Vasily Arkhipov, is credited with talking him out of it. That evening Robert Kennedy told the Soviet ambassador, Anatoly Dobrynin, that the Jupiters would be removed from Turkey if this was never made public."
    facts:
      - [Kennedy’s address, "22 October 1962"]
      - [Quarantine in force, "from 10 a.m., 24 October 1962"]
      - [U-2 shot down over Banes, "27 October 1962"]
