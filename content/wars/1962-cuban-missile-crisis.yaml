notes:
  - "The size of the Soviet force and the number of nuclear weapons in Cuba were not known in Washington at the time: the CIA estimated about 10,000 Soviet troops, and the tactical nuclear weapons only became known in the 1990s, from Soviet participants and archives. The secret part of the settlement, the removal of the Jupiter missiles from Turkey, was kept from the public by the Kennedy administration and confirmed by its participants only years later."
