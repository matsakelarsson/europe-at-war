id: cuban-missile-crisis
name: Cuban Missile Crisis
start: "1962-10-16"
end: "1962-11-20"
tier: B
summary: "The confrontation of October 1962 between the United States and the Soviet Union over Soviet nuclear missiles secretly installed in Cuba, the closest the Cold War came to nuclear war. In the spring of 1962 Nikita Khrushchev decided, with Fidel Castro’s agreement, to send ballistic missiles with nuclear warheads and some 43,000 Soviet troops to Cuba (Operation Anadyr), to deter another American invasion after the Bay of Pigs and to offset the American lead in long-range missiles and the US Jupiter missiles in Turkey. An American U-2 photographed missile sites on 14 October. After a week of secret deliberation, President Kennedy announced on 22 October a naval “quarantine” of Cuba and demanded the missiles’ removal; American forces went on alert, the Strategic Air Command at DEFCON 2 for the only time in its history, and an invasion force gathered in the south-eastern United States. Soviet ships carrying weapons turned back from the quarantine on 24 October, but work on the missile sites went on, and on 27 October a Soviet anti-aircraft missile shot down a U-2 over eastern Cuba, killing its pilot, Major Rudolf Anderson. On 28 October Khrushchev announced that the missiles would be dismantled and taken home, in return for a public American pledge not to invade Cuba and a secret promise to remove the Jupiter missiles from Turkey, which were withdrawn, with those in Italy, in 1963. Castro, who had not been consulted, refused UN inspection; after the Soviet Union agreed to take back its IL-28 bombers as well, the United States lifted the quarantine on 20 November. The crisis led to the Moscow–Washington hotline and the Partial Test Ban Treaty of 1963."
countries: [cu, us, ru, tr, it]
