id: first-tuareg-rebellion
name: First Tuareg rebellion
start: "1962"
end: "1964"
tier: C
summary: "A rising of the Kel Adagh Tuareg of the Adrar des Ifoghas, around Kidal in the far north-east of Mali, against the new Malian state, remembered in Tamasheq as Alfellaga. When French rule ended in 1960, the Tuareg and Arab nomads of the north found themselves governed from Bamako by the socialist government of Modibo Keïta and by officials from the south, who brought new taxes, controls on herds and trade, and plans to settle the nomads; some northern notables had asked France in the late 1950s not to place them under a state ruled from the south. Small hit-and-run raids on posts and patrols began in 1962 and grew in 1963. The rebels had no single leadership or plan, rode camels, carried old rifles and probably never numbered more than about 1,500. The Malian army, newly equipped with Soviet weapons, answered with a harsh counter-insurgency: it executed suspected rebels and civilians, among them religious and clan leaders, and its commandant at Kidal, Diby Sillas Diarra, became notorious for public executions. Between November 1963 and February 1964 Keïta won the support of Algeria and Morocco, which let Malian troops pursue rebels across the border; the rebel leaders Zeyd ag Attaher and Ilyas ag Ayyuba were arrested in Algeria in November 1963 and handed over to Mali, Mohamed Ali ag Attaher was arrested in Morocco and the military leader Elledi ag Alla in Algeria in March 1964. By the end of 1964 the revolt had been crushed and the north was placed under military administration. No reliable count of the dead exists. Many Tuareg fled to Algeria and Libya, the development promised for the north never came, and the memory of the repression fed the rebellions of 1990 and 2012."
