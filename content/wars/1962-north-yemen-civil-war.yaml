notes:
  - Casualty figures are rough. Most estimates of the dead range from 100,000 to 200,000, including civilians; Egyptian military deaths are put at between about 10,000 and 26,000.
  - Saudi Arabia, Jordan and Britain supplied the royalists with money, weapons and, in Britain’s case, deniable mercenary advisers, and Israel secretly dropped arms to them; the Soviet Union supplied Egypt and the republic. The royalist areas are drawn approximately; control of the countryside shifted with tribal allegiances.
