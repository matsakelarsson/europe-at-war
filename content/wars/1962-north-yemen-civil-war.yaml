steps:
  - title: Revolution and the Egyptian intervention
    date: September 1962 – 1964
    when: "1962-09-26"
    borders: "1963-03-01"
    countries: [ye, eg, sa]
    body:
      - Imam Ahmad, who had ruled the Mutawakkilite Kingdom of Yemen as an isolated theocracy, died on 19 September 1962. A week later army officers led by Colonel Abdullah al-Sallal shelled the palace of his son and successor, Muhammad al-Badr, in Sanaa and proclaimed the Yemen Arab Republic. The imam escaped to the mountains of the north-west and rallied the Zaydi tribes, with money and arms from Saudi Arabia. Within days Egyptian troops began to arrive to defend the republic.
      - In the Ramadan offensive of February–March 1963 Egyptian forces drove east to Marib and Harib on the edge of the desert, while Egyptian aircraft bombed royalist camps and the Saudi border towns of Najran and Jizan, from which the royalists were supplied. A UN observer mission in 1963–1964 failed to stop foreign intervention on either side. The republic and Egypt held the cities, the coast and the main roads; the royalists held much of the northern and eastern mountains.
    facts:
      - [Republic proclaimed, "26 September 1962"]
      - [Egyptian Ramadan offensive, "February – March 1963"]
