id: north-yemen-civil-war
name: North Yemen Civil War
start: "1962-09-26"
end: "1970"
tier: B
summary: The war between the Yemen Arab Republic, proclaimed by army officers who overthrew the Zaydi imam Muhammad al-Badr on 26 September 1962, and the royalists who rallied to the imam in the northern highlands. Egypt under Gamal Abdel Nasser sent an expeditionary force that grew to some 70,000 men to defend the republic, while Saudi Arabia, Jordan and, covertly, Britain armed the royalists, making the war a proxy struggle between Arab republics and monarchies, sometimes called “Egypt’s Vietnam”. Egyptian forces held the towns and roads but could not defeat the tribes, and used chemical weapons. After its defeat by Israel in June 1967 Egypt agreed to withdraw; the republicans held Sanaa through a 70-day royalist siege in 1967–1968, and in 1970 a compromise brought royalists into the government and Saudi recognition of the republic. Estimates of the dead range from about 100,000 to 200,000.
countries: [ye, eg, sa]
sides:
  - id: rep
    name: Yemen Arab Republic and Egypt
    polities: [yemen, egypt]
    ink: red
    moves: Republican and Egyptian moves
    success: Republican success
  - id: roy
