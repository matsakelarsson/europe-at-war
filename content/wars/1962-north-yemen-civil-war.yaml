  - title: Stalemate and the “long breath”
    date: 1964–1967
    when: "1964-08"
    borders: "1966-06-01"
    countries: [ye, eg, sa]
    body:
      - In August 1964 a large Egyptian offensive from Haradh tried to trap the imam in the mountains near the Saudi border; it took ground but failed to capture him. In August 1965 Nasser and King Faisal of Saudi Arabia agreed at Jeddah on a ceasefire and a conference of Yemenis, but the conference at Haradh in November broke down. From 1966 Egypt, with about 70,000 troops in Yemen, adopted a “long breath” strategy, pulling back to the triangle between Sanaa, Taiz and Hodeidah and relying on air power.
      - Egyptian aircraft dropped chemical weapons, phosgene and mustard gas, on royalist villages from 1963, most deadly in 1967 at Kitaf and Gahar, where the International Committee of the Red Cross confirmed gas attacks. The republican camp was itself divided between Sallal’s supporters and moderates who resented Egyptian control.
