  - title: The siege of Sanaa and the compromise
    date: 1967–1970
    when: "1967-11-05"
    borders: "1968-02-08"
    countries: [ye, eg, sa]
    body:
      - Egypt’s defeat by Israel in June 1967 forced Nasser to bring his army home. At the Khartoum summit in August he and King Faisal agreed that Egypt would withdraw and Saudi Arabia would stop aiding the royalists, and the last Egyptian troops left in December. On 5 November 1967 Sallal was overthrown by republicans led by Abdul Rahman al-Iryani. The royalists then besieged Sanaa from the surrounding mountains. For 70 days the city was defended by the army, armed citizens and newly raised units, supplied by a Soviet airlift, until the siege was broken in February 1968.
      - The war wound down as both camps quarrelled internally and their foreign backers lost interest. In 1970 Saudi Arabia brokered a compromise under which royalists, except for the Hamid al-Din royal family, took seats in the republic’s government and council, the imam went into exile in Britain, and Saudi Arabia recognised the Yemen Arab Republic.
    facts:
      - [Sallal overthrown, "5 November 1967"]
      - [Last Egyptian troops leave, "December 1967"]
      - [Siege of Sanaa, "December 1967 – February 1968"]
      - [Compromise and Saudi recognition, "1970"]
