notes:
  - Indonesia changed sides in the course of the conflict. Under Sukarno it armed and trained the Sarawak guerrillas against Malaysia; after the army took power in 1965–1966 it made peace with Malaysia (August 1966) and from 1967 fought the guerrillas on its side of the border, with joint operations under a border agreement.
