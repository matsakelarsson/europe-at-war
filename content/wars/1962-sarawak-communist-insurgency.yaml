id: sarawak-communist-insurgency
name: Communist insurgency in Sarawak
start: "1962-12"
end: "1990-10-17"
tier: C
summary: "The guerrilla war of Sarawak’s communist movement against the British colony and then Malaysia. A clandestine communist organisation had grown among the Chinese of Sarawak since the 1950s, through trade unions, Chinese schools and the left wing of the Sarawak United People’s Party; the British called it the Clandestine Communist Organisation. After the Brunei revolt of December 1962 and the start of Indonesia’s confrontation with Malaysia, hundreds of young Chinese crossed into Indonesian Borneo, where with Indonesian army and communist help they formed the Sarawak People’s Guerrilla Force (PGRS, March 1964) and the North Kalimantan People’s Army (PARAKU, October 1965), and fought alongside Indonesian troops in raids across the border. To cut them off from supporters, the government moved some 7,500 rural Chinese into guarded settlements along the Kuching–Serian road in 1965. After 1965 Suharto’s Indonesia turned on its former allies: in 1967 Indonesian troops and Malaysian forces hunted the guerrillas in West Kalimantan, where Dayak attacks, widely believed to have been instigated by the army, killed many Chinese villagers in October–November 1967 and drove tens of thousands from the interior. The movement, organised from 1970 as the North Kalimantan Communist Party, fell back on the Rajang delta, where Malaysia set up the Rajang Area Security Command (RASCOM) at Sibu in 1972. In 1973–1974 the party’s leader Bong Kee Chok and 481 followers, about three quarters of its fighters, laid down their arms under the Sri Aman agreement; the last remaining guerrillas signed a peace agreement with the Sarawak government in Kuching on 17 October 1990. Casualty figures are uncertain: the government side counted about 100 dead, the guerrillas several hundred."
