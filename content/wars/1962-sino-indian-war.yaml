  - title: The Namka Chu and Tawang
    date: September – October 1962
    when: "1962-10-20"
    borders: "1962-10-25"
    countries: [in, cn]
    body:
      - In June 1962 India set up the Dhola post on the Namka Chu, a stream below the Thag La ridge at the western end of the McMahon Line, where the line on the map and the watershed India took as the border did not agree. On 8 September Chinese troops occupied the heights above it. Delhi ordered the army to drive them back, and a new corps commander, Lieutenant-General B. M. Kaul, was flown in. The 7th Infantry Brigade under Brigadier John Dalvi was strung along the stream at over 4,000 metres, short of food, ammunition and winter clothing. On 10 October a Chinese battalion drove back an Indian patrol at Tseng-jong.
      - Before dawn on 20 October 1962 the Chinese attacked across the Namka Chu and around both flanks. The brigade was destroyed in a few hours; Dalvi was captured two days later. Other Chinese columns came through the Bum La pass, and Tawang was given up and occupied on 25 October. The Indian forces fell back to the Se La pass. On the same day China attacked along the McMahon Line further east, at Longju and at Kibithu near Walong in the Lohit valley.
    facts:
      - [Chinese occupy the Thag La heights, "8 September 1962"]
      - [Battle of the Namka Chu, "20 October 1962, Chinese victory"]
      - [Tawang occupied, "25 October 1962"]
