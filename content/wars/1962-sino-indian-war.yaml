  - title: Se La, Bomdila and Walong
    date: 14–20 November 1962
    when: "1962-11-17"
    borders: "1962-11-18"
    countries: [in, cn]
    body:
      - On 14 November the Indian 11th Brigade counter-attacked at Walong in the Lohit valley and failed, and the Chinese, reinforced by a fresh division, took Walong on 16 November. In Kameng the 4th Division held Se La, Dirang and Bomdila, about 10,000 men on a single mountain road. Chinese columns climbed round Se La by old tracks to the east and cut the road behind it. On the night of 17 November the Se La garrison was ordered to withdraw; its columns were ambushed on the road and broke up. Bomdila fell on 18 November, and the division ceased to exist as a fighting force. Many soldiers made their way through the forests to the plains for weeks afterwards.
      - Chinese troops reached Chaku and Rupa, about 50 km from the Assam plain. In Tezpur officials burned banknotes and the town emptied, and on 20 November Nehru said in a broadcast that his “heart goes out to the people of Assam”. India asked the United States for fighter and bomber squadrons.
    facts:
