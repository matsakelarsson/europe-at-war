steps:
  - title: The disputed border
    date: 1950–1962
    when: "1959-10-21"
    borders: "1962-10-19"
    countries: [in, cn]
    body:
      - India inherited from British India two frontiers with Tibet that had never been agreed. In the west it claimed Aksai Chin, a high, almost uninhabited plateau, on the basis of British surveys of the 19th century; China regarded the area as part of Xinjiang and Tibet. In the east India claimed the McMahon Line, drawn along the crest of the Himalayas at the Simla Conference of 1914 between British India and Tibet, which China’s delegate initialled but his government never accepted. After China took control of Tibet in 1950–1951, India extended its administration up to the McMahon Line, including the monastery town of Tawang.
      - In the 1950s China built a road across Aksai Chin to link Xinjiang with western Tibet; India learned of it only when it was finished in 1957. After the Tibetan uprising of March 1959 the Dalai Lama fled to India and was given asylum, and relations soured. Armed clashes followed at Longju in the east in August 1959 and at the Kongka Pass in Ladakh on 21 October 1959, where ten Indian policemen were killed. Talks between Nehru and Zhou Enlai in Delhi in April 1960 failed; China was thought willing to accept the McMahon Line in exchange for Aksai Chin, which India refused.
      - From late 1961 India pursued a “forward policy”, setting up small posts in disputed territory, some behind Chinese positions, on the assumption that China would not fight. China answered with posts of its own, and in July 1962 Chinese troops surrounded an Indian post in the Galwan valley.
    facts:
      - [Simla Conference and McMahon Line, "1914"]
      - [Dalai Lama reaches India, "31 March 1959"]
      - [Kongka Pass clash, "21 October 1959, ten Indian police killed"]
      - [Forward policy, "from November 1961"]
