  - title: Rezang La and Chushul
    date: 18–20 November 1962
    when: "1962-11-18"
    borders: "1962-11-18"
    countries: [in, cn]
    body:
      - In Ladakh the Chinese struck at the defences of Chushul on 18 November. At Rezang La, a pass on the ridge south-east of the airfield at about 5,000 metres, C Company of the 13th Kumaon Regiment under Major Shaitan Singh fought from its trenches until it was overrun; by the generally accepted figures, 114 of its roughly 120 men were killed, and their frozen bodies were found in their positions months later. On Gurung Hill, east of Chushul, Gurkha and other troops were driven off after heavy losses on both sides.
      - The Chinese did not go on to the airfield. With the ridges around Chushul taken, they had reached the line China claimed in Ladakh and had no need to go further.
    facts:
      - [Battle of Rezang La, "18 November 1962"]
      - ["C Company, 13 Kumaon", "114 of about 120 killed"]
    markers:
