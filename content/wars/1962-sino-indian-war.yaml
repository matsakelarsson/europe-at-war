  - title: The ceasefire
    date: November 1962 – 1963
    when: "1962-11-21"
    borders: "1962-11-21"
    countries: [in, cn]
    body:
      - Late on 20 November China announced a unilateral ceasefire from midnight and said that from 1 December its troops would withdraw to 20 km behind the line of actual control of 7 November 1959. In the east they withdrew north of the McMahon Line by early 1963, returning captured equipment and the Indian prisoners. In the west China kept Aksai Chin and the ground it had taken up to its claim line. India never formally accepted the terms, and six non-aligned states put forward the Colombo Proposals in December 1962 without settling the dispute.
      - By official figures India lost 1,383 killed, 1,047 wounded, 1,696 missing and 3,968 captured, and China 722 killed and 1,697 wounded. The defeat ended the career of Krishna Menon and damaged that of Nehru, who died in 1964. India doubled its defence spending, raised new mountain divisions and drew closer to both the Soviet Union and the West, while Pakistan drew closer to China. The line of actual control has never been agreed; the border saw clashes again in 1967 and 2020 and a tense standoff in 1986–1987.
    facts:
      - [Ceasefire, "21 November 1962"]
      - [Indian losses (official), "1,383 killed, 1,047 wounded, 1,696 missing, 3,968 captured"]
      - [Chinese losses (official), "722 killed, 1,697 wounded"]
