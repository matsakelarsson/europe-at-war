  - title: Ladakh and the lull
    date: 20 October – 13 November 1962
    when: "1962-10-24"
    borders: "1962-10-24"
    countries: [in, cn]
    body:
      - In Ladakh China attacked on the same morning. The Indian forward posts in the Chip Chap and Galwan valleys and on the north shore of Pangong Lake, small and isolated, were overrun in two days; some fought until almost every man was killed. India kept its positions around Chushul and its airfield, which became the key of its defence.
      - On 24 October Zhou Enlai proposed that both sides withdraw 20 km from the line of actual control and negotiate. Nehru refused, demanding a return to the positions of 8 September. India declared a national emergency on 26 October and asked for help from the West; the United States and Britain began flying in arms and equipment in early November. The defence minister, V. K. Krishna Menon, blamed by many for the army’s unreadiness, resigned on 7 November. For three weeks both armies brought up reinforcements.
    facts:
      - [Zhou Enlai’s proposal, "24 October 1962"]
      - [Indian state of emergency, "26 October 1962"]
      - [Krishna Menon resigns, "7 November 1962"]
