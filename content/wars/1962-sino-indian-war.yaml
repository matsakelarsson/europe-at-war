id: sino-indian-war
name: Sino-Indian War
start: "1962-10-20"
end: "1962-11-21"
tier: A
summary: "A month-long border war between China and India in the Himalayas in October and November 1962, fought at two fronts 1,000 km apart: Aksai Chin in Ladakh, held by China and claimed by India, and the North-East Frontier Agency (today Arunachal Pradesh), held by India up to the McMahon Line and claimed by China. After years of disputes, the flight of the Dalai Lama to India in 1959 and India’s “forward policy” of posts in disputed land, China attacked on both fronts on 20 October. Its troops overran Indian positions on the Namka Chu and at Tawang, and in a second offensive in November took Se La, Bomdila and Walong and reached the edge of the Assam plain, while in Ladakh they took the Indian posts up to China’s claim line. China then declared a ceasefire on 21 November and withdrew in the east, keeping Aksai Chin. The defeat shook India’s government and led to a large expansion of its army."
countries: [in, cn]
sides:
  - id: in
    name: India
    polities: [india]
    ink: orange
    moves: Indian moves
    success: Indian success
  - id: cn
    name: China
    polities: [china]
    ink: red
    moves: Chinese moves
    success: Chinese success
notes:
  - The two governments describe the war differently. India regarded it as an unprovoked Chinese invasion of its territory. China called it a counter-attack in self-defence against Indian advances into Chinese territory under the forward policy. Neither side declared war or broke off diplomatic relations.
  - Casualty figures are the official figures of each side. India’s own inquiry into the defeat, the Henderson Brooks–Bhagat report of 1963, has never been officially released; parts were published by the journalist Neville Maxwell in 2014.
  - Areas drawn for Aksai Chin and the Chinese advances are approximate.
