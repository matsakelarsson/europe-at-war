  - title: Crater and the British withdrawal
    date: 1967
    when: "1967-06-20"
    borders: "1967-11-29"
    countries: [ye, gb]
    body:
      - In 1967 the NLF and the Egyptian-backed FLOSY fought each other in Aden’s streets as well as the British. On 20 June 1967, after four of their colonels were suspended, men of the South Arabian Army and police mutinied, and 22 British soldiers were killed; the armed police in the old town of Crater went over to the rebels, who held the district for two weeks. On the night of 3 July the Argyll and Sutherland Highlanders under Lieutenant-Colonel Colin Mitchell retook Crater without loss and ruled it with a firm hand until the end.
      - From August the NLF took over the federal states of the hinterland one after another as their rulers fled, and the South Arabian Army sided with it against FLOSY in heavy fighting in Aden’s suburbs in early November. Britain had no choice but to negotiate with the NLF. The last High Commissioner, Sir Humphrey Trevelyan, left on 29 November, the last British troops followed, and on 30 November 1967 the NLF proclaimed the People’s Republic of South Yemen, with Qahtan al-Shaabi as president.
    facts:
      - [Crater mutiny, "20 June 1967, 22 British soldiers killed"]
      - [Crater retaken, "3–4 July 1967"]
      - [Independence of South Yemen, "30 November 1967"]
