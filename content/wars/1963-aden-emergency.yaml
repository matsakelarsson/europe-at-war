notes:
  - British losses are usually given as about 90–92 soldiers killed and some 510 wounded, with 17 British civilians killed. A study by J. E. Peterson gives 382 insurgents killed and 1,714 wounded; Arab civilian deaths, many of them in the fighting between the NLF and FLOSY, are not well recorded.
  - Both British forces and the insurgents were accused of abuses; Amnesty International criticised the interrogation of detainees in Aden in 1966.
