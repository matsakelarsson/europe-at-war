steps:
  - title: The Radfan and the grenade war
    date: 1963–1966
    when: "1963-10-14"
    borders: "1964-05-31"
    countries: [ye, gb]
    body:
      - Aden was a British colony and one of the busiest ports in the world, and its base was the headquarters of British forces in the Middle East. In 1963 Britain joined it to the Federation of South Arabia, whose sultans, emirs and sheikhs depended on British subsidies, over the protests of Aden’s Arab nationalists and trade unions. The revolution in North Yemen in 1962 gave the nationalists a base and Egyptian support. In October 1963 tribesmen of the Radfan mountains, armed from Yemen, attacked federal forces, and on 10 December 1963 a grenade thrown at the British High Commissioner at Khormaksar airport killed two people and wounded about fifty. A state of emergency was declared.
      - In 1964 British and federal troops, with RAF aircraft, fought the Radfan tribes for months; in April an SAS patrol was ambushed and two of its men were killed and beheaded. By June the main rebel strongholds were taken. In Aden the NLF, founded in 1963, began a campaign of grenade attacks and shootings of British soldiers, policemen and Arab officials, many of them Special Branch officers. In February 1966 the British government announced that it would leave South Arabia by 1968 without a defence treaty, which undermined the federal rulers and set the nationalist movements to fight for the succession.
    facts:
      - [Radfan revolt begins, "14 October 1963"]
      - [Khormaksar airport grenade, "10 December 1963"]
      - [Britain announces withdrawal, "February 1966"]
