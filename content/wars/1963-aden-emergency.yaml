id: aden-emergency
name: Aden Emergency
start: "1963-10-14"
end: "1967-11-30"
tier: B
summary: The armed revolt against British rule in Aden and the Federation of South Arabia, the union of Aden colony and the sultanates of its hinterland that Britain had formed to keep its naval and air base. Nationalist movements backed by Nasser’s Egypt and the new Yemen Arab Republic, chiefly the National Liberation Front (NLF) and, from 1966, the Front for the Liberation of Occupied South Yemen (FLOSY), fought British troops in the Radfan mountains in 1964 and waged a campaign of bombings and assassinations in Aden itself. In 1966 Britain announced that it would leave. In 1967 the NLF and FLOSY fought each other as well as the British; after a mutiny in June the rebels held Aden’s Crater district for two weeks. The NLF took over the sultanates one by one, and when the last British troops left on 29–30 November 1967 it proclaimed the People’s Republic of South Yemen. About 90 British soldiers and several hundred Arab fighters and civilians were killed.
