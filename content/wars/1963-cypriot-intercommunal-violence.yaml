id: cypriot-intercommunal-violence
name: Cypriot intercommunal violence of 1963–1964
start: "1963-12-21"
end: "1964-08-10"
tier: C
summary: Fighting between Greek and Turkish Cypriots that broke up the power-sharing republic of 1960, beginning in Nicosia on 21 December 1963 – the start of what Turkish Cypriots call Bloody Christmas – after President Makarios proposed constitutional changes that Turkish Cypriots rejected. By August 1964 some 364 Turkish Cypriots and 174 Greek Cypriots had been killed and about 25,000 Turkish Cypriots had withdrawn into armed enclaves, and Turkish air strikes during a Greek Cypriot attack on Kokkina brought Greece and Turkey close to war.
countries: [cy, tr, gr]
sides:
  - id: gc
    name: Greek Cypriot government forces and irregulars
    polities: [cyprus]
    ink: navy
  - id: tc
    name: Turkish Cypriot fighters, with Turkish air support
    polities: [turkey]
    ink: teal
notes:
  - A British-drawn ceasefire line through Nicosia in December 1963 was the first Green Line. The United Nations force UNFICYP, set up by the Security Council on 4 March 1964, is still in Cyprus; fighting flared again in 1967 at Kofinou, and the enclaves lasted until 1974.
