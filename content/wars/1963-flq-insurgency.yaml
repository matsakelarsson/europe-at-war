id: flq-insurgency
name: FLQ insurgency and the October Crisis
start: "1963-03-07"
end: "1970-12-28"
tier: C
summary: "The bombing and kidnapping campaign of the Front de libération du Québec (FLQ), a clandestine movement of small, loosely linked cells that sought an independent, socialist Quebec by armed struggle, and the October Crisis of 1970 that ended it. Its first attacks, firebombs against army buildings in Montreal on the night of 7 March 1963, were followed by bombs in mailboxes and at federal buildings; on 20 April 1963 a bomb at an army recruiting centre killed a 65-year-old night watchman, William Vincent O’Neill. Pierre Vallières and Charles Gagnon, whose group joined the FLQ in 1965, gave it its manifesto writings. Over seven years the FLQ was blamed for more than 160 bombings, armed robberies and other attacks, the largest of which, at the Montreal Stock Exchange on 13 February 1969, injured 27 people; in all about eight people were killed. On 5 October 1970 the Liberation cell kidnapped the British trade commissioner, James Cross, in Montreal, and on 10 October the Chénier cell kidnapped Quebec’s labour minister, Pierre Laporte. At the request of the Quebec government and the city of Montreal, the army was sent into Quebec on 15 October, and early on 16 October Pierre Trudeau’s federal government invoked the War Measures Act, the only time it was used in peacetime: civil liberties were suspended and some 450–500 people, among them singers, poets and union leaders, were arrested without charge, nearly all of them later released. Laporte was found dead in the trunk of a car on 17 October. Cross was freed on 3 December 1970 in exchange for safe passage to Cuba for five members of the Liberation cell, and on 28 December police found Paul and Jacques Rose and Francis Simard of the Chénier cell in a farmhouse at Saint-Luc; Paul Rose and Simard were convicted of Laporte’s murder, and Jacques Rose, acquitted of kidnapping and murder, of being an accessory after the fact. The FLQ lost what public sympathy it had and did not act again, and the movement for independence turned to the Parti Québécois, which won the Quebec election of 1976."
