notes:
  - "The FLQ was not one organisation but a succession of cells, often unknown to each other, which the police broke up several times between 1963 and 1970. Counts of its attacks differ, from more than 160 to more than 200 violent actions depending on what is counted, as do counts of those arrested under the War Measures Act (453 by police figures at the end of 1970, 497 in later accounts). The use of the Act remains controversial in Quebec and in Canada; it was replaced by the Emergencies Act in 1988."
