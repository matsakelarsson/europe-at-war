id: guinea-bissau-war-of-independence
name: Guinea-Bissau War of Independence
start: "1963-01-23"
end: "1974-09-10"
tier: A
summary: "The war of the African Party for the Independence of Guinea and Cape Verde (PAIGC) against Portuguese rule in Portuguese Guinea, the Guinean theatre of the Portuguese Colonial War. The PAIGC, founded in 1956 by Amílcar Cabral and others, turned to armed struggle after Portuguese police killed striking dockworkers at Pidjiguiti in Bissau in 1959, and opened the war with an attack on the barracks at Tite on 23 January 1963. Its guerrillas, based in neighbouring Guinea and later Senegal, held the island of Como against a large Portuguese offensive in 1964 and by the late 1960s claimed to control two-thirds of the countryside, where the party set up schools, clinics, courts and stores. Portugal kept some 30,000 soldiers in the colony, many of them Africans; from 1968 the governor, General António de Spínola, combined reforms with raids such as the attack on Conakry in 1970. Cabral was assassinated in Conakry in January 1973, but Soviet anti-aircraft missiles ended Portuguese air superiority that spring, and the PAIGC declared independence in the Boé hills on 24 September 1973. After the Carnation Revolution in Lisbon, Portugal recognised Guinea-Bissau on 10 September 1974. About 2,000 Portuguese soldiers, some 6,000 PAIGC fighters and about 5,000 civilians were killed."
countries: [gw, pt, gn, sn, cv]
sides:
  - id: paigc
    name: PAIGC
    polities: [paigc]
    ink: green
    moves: PAIGC moves
    success: PAIGC success
  - id: pt
    name: Portugal
    polities: [portugal, guinea-bissau]
    ink: red
    moves: Portuguese moves
    success: Portuguese success
notes:
  - "Support. The PAIGC had bases and rear areas in the Republic of Guinea, whose president Ahmed Sékou Touré gave it a headquarters in Conakry, and from 1966 in Senegal. It received weapons and training from the Soviet Union, Cuba, China, Algeria and other states; Cuban instructors, artillerymen and doctors served with it, and Yugoslavia ran a hospital for it at Boké. Sweden was its largest civilian donor. A smaller nationalist movement, the FLING, played little part in the fighting."
  - "Casualties. Portugal lost 2,069 soldiers killed and over 8,000 wounded in Guinea; the PAIGC lost about 6,000 fighters, and about 5,000 civilians died, according to the figures collected by Wikipedia; all are estimates. After independence the new government executed many African soldiers who had served in Portuguese units, especially the African commandos; the number is disputed, and one estimate is 7,447."
  - Places held by the PAIGC and the Portuguese changed often, and both sides’ claims about the extent of the liberated zones were part of the war of propaganda; the areas shown are approximate.
