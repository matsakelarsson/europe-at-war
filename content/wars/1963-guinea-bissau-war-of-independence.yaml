  - title: Spínola’s “Better Guinea”
    date: 1968–1972
    when: "1969-02-06"
    borders: "1970-01-01"
    countries: [gw, gn, sn]
    body:
      - "In May 1968 General António de Spínola became governor and commander-in-chief. Under the slogan “For a Better Guinea” he built schools, clinics and roads, held “people’s congresses” of chiefs and notables and raised African units, including African commandos and marines, so that by 1974 most of Portugal’s soldiers in Guinea were Africans. He also concentrated his forces: in February 1969 the post of Madina do Boé was given up, and on 6 February, as the garrison crossed the Corubal River at Cheche, a ferry overturned and 47 soldiers drowned."
      - "Spínola also tried to split the PAIGC. Talks he held secretly with local PAIGC commanders in the Manjaco country ended on 20 April 1970, when three Portuguese majors and their interpreter were killed at the meeting place near Canchungo. On 22 November 1970 a force of Portuguese and African commandos and Guinean exiles raided Conakry (Operation Green Sea), freeing 26 Portuguese prisoners but failing to kill Cabral or overthrow Sékou Touré; the United Nations condemned Portugal. In May 1972 Spínola met President Léopold Sédar Senghor of Senegal at Cap Skirring to explore a negotiated settlement, but the Portuguese prime minister, Marcelo Caetano, rejected it. In April 1972 a United Nations mission visited the liberated zones, and later that year the PAIGC held elections there for a national assembly."
    facts:
      - [Spínola governor, "May 1968 – August 1973"]
      - [Cheche ferry disaster, "6 February 1969, 47 soldiers drowned"]
      - [Killings near Canchungo, "20 April 1970"]
      - [Operation Green Sea, "22 November 1970"]
