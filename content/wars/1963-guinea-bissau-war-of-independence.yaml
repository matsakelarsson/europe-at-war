steps:
  - title: From Pidjiguiti to Tite
    date: 1956 – January 1963
    when: "1963-01-23"
    borders: "1963-01-23"
    countries: [gw, gn]
    body:
      - Portuguese Guinea was a small colony of rice-growing and cattle-keeping peoples, the Balanta, Fula, Manjaco, Mandinka, Pepel and others, ruled by a few thousand Portuguese and by Cape Verdeans who served as clerks and officials. Under the Estado Novo dictatorship of António de Oliveira Salazar, which called the colonies overseas provinces of Portugal, almost all Africans were classed as “natives” without civil rights. In 1956 Amílcar Cabral, an agronomist born in Bafatá to Cape Verdean parents, founded the PAIGC in Bissau with Aristides Pereira, his half-brother Luís Cabral and others, to win independence for Guinea and Cape Verde together.
      - On 3 August 1959 dockworkers at the Pidjiguiti quay in Bissau went on strike for higher pay; police and armed civilians fired on them, killing at least fifty. The PAIGC concluded that peaceful protest was useless, moved its leadership to Conakry in newly independent Guinea in 1960 and trained cadres there to organise the peasants of the countryside, above all the Balanta of the south. On 23 January 1963 PAIGC fighters attacked the Portuguese barracks at Tite, south of the Geba estuary, and the war began; within months the guerrillas were active across the south.
    facts:
      - [PAIGC founded, "19 September 1956 (date given by the party)"]
      - [Pidjiguiti massacre, "3 August 1959, at least 50 killed"]
      - [Attack on Tite, "23 January 1963"]
