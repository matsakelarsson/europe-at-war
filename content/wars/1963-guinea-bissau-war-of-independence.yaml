  - title: Como and the congress of Cassacá
    date: January – March 1964
    when: "1964-01-15"
    borders: "1964-03-01"
    countries: [gw]
    body:
      - "In January 1964 the Portuguese launched Operation Tridente (Trident) to retake the island of Como in the far south, which the PAIGC had made a base. About 3,000 Portuguese troops with aircraft and naval support fought for more than two months among the island’s rice fields and mangroves, and then withdrew; the guerrillas, who numbered a few hundred, stayed. Both sides claimed victory, but Como became a symbol of the PAIGC’s ability to hold ground."
      - "During the battle, in February 1964, the PAIGC held its first congress at Cassacá on the mainland nearby. Cabral used it to curb local commanders who had abused villagers and to bring the guerrilla bands under the party’s control. The congress created a regular army, the Revolutionary Armed Forces of the People (FARP), alongside local militias, and divided the country into fronts in the south, the north and the east."
    facts:
      - [Operation Tridente, "January – March 1964"]
      - [Portuguese force, "about 3,000 men"]
      - [Congress of Cassacá, "February 1964"]
