  - title: The liberated zones
    date: 1964–1968
    when: "1966"
    borders: "1967-01-01"
    countries: [gw, gn, sn]
    body:
      - By 1968 the PAIGC claimed to control about two-thirds of the country, in three fronts, the south (Quinara and Tombali), the north around the forest of Morés and the Oio, and the east around the Boé hills. In these liberated zones the party set up its own administration, with elected village committees, schools, clinics, people’s courts and people’s stores that bartered cloth and tools for rice. The Portuguese army held the towns and a network of fortified posts linked by roads and rivers, bombed the PAIGC zones from the air, at times with napalm, and moved villagers into protected settlements.
      - The guerrillas had their rear bases in the Republic of Guinea, along the southern border near Boké and Kandiafara, and from 1966 Senegal allowed them to use its territory to the north. The Soviet Union, Cuba and other states sent weapons, including artillery and rockets; Cuban advisers and doctors joined the PAIGC from 1966. Cabral travelled widely and became one of the best-known leaders and theorists of African liberation.
    facts:
      - [PAIGC claim, "two-thirds of the country by 1967–1968"]
      - [Portuguese troops, "about 25,000–30,000 by the late 1960s"]
