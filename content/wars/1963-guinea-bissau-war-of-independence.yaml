  - title: Cabral’s murder and the missiles
    date: January – July 1973
    when: "1973-01-20"
    borders: "1973-05-22"
    countries: [gw, gn]
    body:
      - On the night of 20 January 1973 Amílcar Cabral was shot dead outside his home in Conakry by a group of PAIGC members led by Inocêncio Kani, a former naval commander. The killers, who resented the party’s Cape Verdean leaders, were arrested with Guinean help; many suspected Portuguese involvement, which has never been proven. Aristides Pereira succeeded Cabral as secretary-general.
      - From March 1973 the PAIGC used Soviet Strela-2 (SA-7) shoulder-fired missiles, which shot down several Portuguese aircraft in a few weeks; the Portuguese air force, which had moved troops and supplied the posts freely, now flew low and seldom. In May the PAIGC attacked posts on both borders, besieging Guidage in the north from 8 May and shelling Guileje in the south, which the Portuguese abandoned on 22 May (some accounts say 25 May); the garrison and villagers withdrew to Gadamael, which the PAIGC then shelled for weeks. Portuguese officers spoke of a military collapse, and Spínola left Guinea in August.
    facts:
      - [Cabral assassinated, "20 January 1973, Conakry"]
      - [First missiles used, "March 1973"]
      - [Guileje abandoned, "22 May 1973 (some sources 25 May)"]
    markers:
      - kind: event
        side: none
        name: Conakry
        date: 20 January 1973
        text: Amílcar Cabral was assassinated outside his home by PAIGC dissidents.
        lonlat: [-13.70, 9.52]
      - kind: taken
        side: paigc
        name: Guileje
        date: 22 May 1973
        text: The Portuguese garrison, cut off and shelled, destroyed its equipment and withdrew to Gadamael with the villagers.
        lonlat: [-14.87, 11.33]
      - kind: capital
        side: pt
        name: Bissau
        date: "1973"
        text: The Portuguese command in Bissau now had to supply its posts by road and river.
        lonlat: [-15.58, 11.86]
        lp: l
  - title: Independence
    date: September 1973 – September 1974
    when: "1973-09-24"
    borders: "1974-09-10"
    countries: [gw, pt, cv]
    body:
      - On 24 September 1973 the People’s National Assembly elected in the liberated zones met at Lugajole in the Boé hills, near Madina do Boé, and proclaimed the Republic of Guinea-Bissau, with Luís Cabral as head of state. Dozens of states recognised it within weeks, and on 2 November 1973 the United Nations General Assembly welcomed its independence by 93 votes to 7 and condemned the Portuguese occupation of parts of its territory.
      - "On 25 April 1974 officers of the Armed Forces Movement, many of whom had served in Guinea, overthrew Caetano’s government in the Carnation Revolution in Lisbon; Spínola, whose book Portugal and the Future had argued that the wars could not be won militarily, became president. Fighting in Guinea soon stopped. By the Algiers Accord of 26 August 1974 Portugal agreed to recognise Guinea-Bissau, which it did on 10 September 1974, and its troops left by October. Cape Verde became independent separately on 5 July 1975; the union of the two countries that Cabral had planned ended with a coup in Bissau in 1980."
    facts:
      - [Declaration of independence, "24 September 1973, Lugajole (Boé)"]
      - [UN General Assembly vote, "2 November 1973, 93–7"]
      - [Carnation Revolution, "25 April 1974"]
      - [Algiers Accord, "26 August 1974"]
      - [Portugal recognises independence, "10 September 1974"]
    markers:
      - kind: treaty
        side: paigc
