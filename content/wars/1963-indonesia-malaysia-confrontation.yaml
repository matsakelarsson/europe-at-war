notes:
  - "Neither side declared war, and much of the fighting was kept secret at the time: Indonesia described its troops in Borneo as volunteers, and Britain did not disclose its cross-border Claret operations until 1974, Australia not until 1996. The Philippines, which claimed Sabah, also opposed Malaysia’s formation and broke off relations with it in 1963, but took no part in the fighting."
  - "Casualty figures differ between sources. Those usually given are about 140 British dead (44 of them Gurkhas), 23 Australians (seven on operations), 12 New Zealanders and 9 Singaporeans, besides Malaysian losses; the Commonwealth counted 590 Indonesians killed and 771 captured, and other estimates of Indonesian dead run to 2,300. Thirty-six civilians were killed."
