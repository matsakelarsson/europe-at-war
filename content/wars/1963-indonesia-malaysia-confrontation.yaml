  - title: Suharto and the peace
    date: October 1965 – August 1966
    when: "1966-06-01"
    borders: "1966-08-11"
    countries: [my, id, gb]
    body:
      - "The attempted coup of 1 October 1965 in Jakarta and the army’s seizure of power under General Suharto changed Indonesia’s course. The army had never been keen on the confrontation, which tied down troops and served the Communist Party, and its officers opened secret contacts with Malaysia through intelligence officers such as Ali Moertopo and Benny Moerdani. Raids across the Borneo border continued into 1966, but on a smaller scale."
      - "After Suharto took effective power from Sukarno in March 1966, the new foreign minister, Adam Malik, met Malaysia’s deputy prime minister, Tun Abdul Razak, in Bangkok from 29 May to 1 June 1966 and agreed to end hostilities. The peace agreement was signed in Jakarta on 11 August 1966: Indonesia recognised Malaysia, and the people of Sabah and Sarawak were to reaffirm their choice in elections. Indonesia rejoined the United Nations, which it had left in protest when Malaysia took a seat on the Security Council in January 1965, and in 1967 Indonesia, Malaysia, Singapore, Thailand and the Philippines founded ASEAN in Bangkok."
    facts:
      - [Bangkok talks, "29 May – 1 June 1966"]
      - [Peace agreement signed in Jakarta, "11 August 1966"]
      - [ASEAN founded, "8 August 1967"]
