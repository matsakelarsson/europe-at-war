steps:
  - title: “Crush Malaysia”
    date: January – December 1963
    when: "1963-01-20"
    borders: "1963-09-16"
    countries: [my, id, bn, gb]
    body:
      - "In May 1961 the prime minister of Malaya, Tunku Abdul Rahman, proposed a federation of Malaya with Singapore and the British territories in Borneo, and Britain agreed. Sukarno, who had just forced the Dutch out of western New Guinea, saw the plan as a British device to keep its bases and influence in the region, and the Indonesian Communist Party pressed him to oppose it; the Philippines claimed Sabah. After Indonesia’s support for the failed Brunei revolt of December 1962, Foreign Minister Subandrio announced on 20 January 1963 a policy of confrontation (konfrontasi). On 12 April 1963 raiders from Indonesian Kalimantan attacked the police station at Tebedu in Sarawak, the first of many raids across the 1,500-kilometre jungle border."
      - "A UN mission reported in September that most people in Sarawak and North Borneo supported Malaysia, and the federation was proclaimed on 16 September 1963; Brunei stayed out. Indonesia refused to recognise it, crowds in Jakarta burned the British embassy, and Sukarno declared the aim of “crushing Malaysia” (Ganyang Malaysia). Larger raids followed, now with Indonesian regular troops among the volunteers: at Long Jawai in the interior of Sarawak, a force of some 150–200 overran a post of Gurkhas, police and Border Scouts at the end of September and executed captured scouts, and on 29 December Indonesian troops attacked a Malaysian army post at Kalabakan in Sabah, killing eight soldiers. Britain sent reinforcements to Borneo under Major General Walter Walker."
    facts:
      - [Confrontation announced, "20 January 1963"]
      - [First raid, Tebedu, "12 April 1963"]
      - [Malaysia proclaimed, "16 September 1963"]
      - [Kalabakan, "29 December 1963"]
