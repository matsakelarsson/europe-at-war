id: indonesia-malaysia-confrontation
name: Indonesia–Malaysia confrontation
start: "1963-01-20"
end: "1966-08-11"
tier: B
summary: "The undeclared war Indonesia waged against the creation of Malaysia, known in Indonesia and Malaysia as Konfrontasi. Sukarno denounced the federation of Malaya, Singapore, Sarawak and North Borneo (Sabah) planned by Malaya and Britain as a British neo-colonial scheme, backed the Brunei revolt of December 1962 and on 20 January 1963 announced a policy of confrontation. From April 1963 Indonesian volunteers and then regular troops raided across the jungle border in Borneo, and after Malaysia was proclaimed on 16 September 1963 Sukarno vowed to “crush Malaysia”. British, Gurkha, Malaysian, Australian and New Zealand troops held the border and from 1964 struck back with secret raids into Indonesian Kalimantan; Indonesian landings and parachute drops on the Malay Peninsula in 1964 failed, and bombings in Singapore killed civilians. After the army under General Suharto took power in Indonesia in 1965–1966, it made peace: an agreement signed in Jakarta on 11 August 1966 ended the conflict, and Indonesia recognised Malaysia. British, Australian, New Zealand and Singaporean losses were about 180 killed, besides Malaysian losses; Indonesian dead are estimated at 590 to over 2,000, and 36 civilians were killed."
