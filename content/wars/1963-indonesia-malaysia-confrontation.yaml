  - title: Landings in Malaya and the Claret raids
    date: 1964–1965
    when: "1964-08-17"
    borders: "1964-09-01"
    countries: [my, id, sg, gb, au, nz]
    body:
      - "In 1964 Sukarno carried the war to the Malay Peninsula. On 17 August, Indonesia’s independence day, about a hundred Indonesian soldiers and Malaysian volunteers landed from the sea at Pontian on the south-west coast of Johor, and on the night of 2 September some ninety paratroopers were dropped from transport aircraft near Labis in northern Johor. Few local people helped them, and within weeks nearly all had been killed or captured by Malaysian, British, Gurkha, Australian and New Zealand troops; later landings in 1964 and 1965 fared no better. In Singapore, Indonesian saboteurs set off bombs, the deadliest on 10 March 1965 at MacDonald House in Orchard Road, where three people were killed and 33 injured; the two Indonesian marines responsible were hanged in 1968."
      - "In Borneo the Commonwealth built a chain of fortified bases along the border and relied on helicopters, Border Scouts recruited among the Dayak peoples, and Gurkha and SAS patrols. From July 1964 British, Gurkha and later Australian and New Zealand units made secret cross-border raids, called Claret operations, to ambush Indonesian troops in Kalimantan before they could reach the border, at first up to about 4.5 km deep and from 1965 up to about 18 km. On 27 April 1965 several hundred Indonesian soldiers attacked a company base of the British Parachute Regiment at Plaman Mapu and were driven off. On 9 August 1965 Singapore left Malaysia after quarrels between its leaders and Kuala Lumpur."
    facts:
      - [Landing at Pontian, "17 August 1964"]
      - [Paratroop drop at Labis, "2 September 1964"]
      - [MacDonald House bombing, "10 March 1965, 3 killed"]
      - [Plaman Mapu, "27 April 1965, Commonwealth success"]
      - [Singapore leaves Malaysia, "9 August 1965"]
