notes:
  - "Indonesia regards Papua as an integral part of the country, confirmed by the Act of Free Choice and the UN General Assembly’s resolution of 1969, and calls the armed groups “armed criminal groups” (KKB); in April 2021 it designated them as terrorists. Papuan independence supporters regard the 1969 vote as invalid and seek a new referendum. Some Papuan and foreign activists describe Indonesia’s rule as genocide; the Indonesian government rejects this, and most scholars describe grave and repeated abuses without agreeing on the term."
  - "Both sides have killed civilians. Security forces have been accused of extrajudicial killings, torture and the destruction of villages, and of air and drone strikes in populated areas; the TPNPB has killed migrant workers, teachers, health workers and pilots it accuses of being spies, and has taken hostages. Foreign journalists and the UN human rights office have only limited access, so many incidents cannot be independently verified."
  - The zones of fighting drawn in the steps are approximate.
