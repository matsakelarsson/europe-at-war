steps:
  - title: The first risings
    date: 1963–1984
    when: "1965-07-28"
    borders: "1969-08-02"
    countries: [id, pg]
    body:
      - "Indonesia took over western New Guinea from the UN on 1 May 1963, banned Papuan political parties and the Morning Star flag, and sent in troops and officials from other islands. Papuan nationalists who had worked with the Dutch, and soldiers of the disbanded Papuan Volunteer Corps, formed the Free Papua Movement (OPM). Its first major armed action came on 28 July 1965, when several hundred Papuans led by Permenas Ferry Awom attacked the army barracks at Arfai in Manokwari. The army answered with operations in the Bird’s Head, among them Operation Sadar, that by Papuan and church accounts killed many villagers; Awom surrendered with some 400 men in 1971. Resistance flared again around the Act of Free Choice in 1969, which confirmed Indonesian rule; on 1 July 1971 Seth Rumkorem and Jacob Prai proclaimed a Republic of West Papua at their “Victoria headquarters” near the border with Australian New Guinea."
      - "In 1977, around Indonesia’s general election, highlanders rose in the Baliem valley and around the Freeport copper mine at Tembagapura, whose slurry pipeline OPM fighters cut. The army and air force struck back with ground-attack aircraft and troops; church and human rights groups later reported that thousands of highlanders were killed, a figure the government has never acknowledged. Indonesia’s transmigration programme brought settlers from Java and other islands to the lowlands. In February 1984 a planned rising in Jayapura failed; the anthropologist and musician Arnold Ap, curator of the university museum and a leading figure of Papuan culture, was killed in custody in April, and some 10,000 Papuans fled across the border into Papua New Guinea, where many still live."
    facts:
      - [Indonesian rule begins, "1 May 1963"]
      - [First OPM attack, Arfai, "28 July 1965"]
      - [Republic of West Papua proclaimed, "1 July 1971"]
      - [Highlands uprising, "1977"]
      - [Refugees to Papua New Guinea, "1984, about 10,000"]
