id: papua-conflict
name: Papua conflict
start: "1963-05-01"
end: ongoing
tier: B
summary: "The long, low-level war between Indonesia and Papuan independence fighters in the western half of New Guinea, which Indonesia took over from a UN administration in 1963 and formally integrated after the disputed Act of Free Choice of 1969. The Free Papua Movement (Organisasi Papua Merdeka, OPM) has fought since 1965 with small, scattered guerrilla bands, often armed with bows, arrows and old rifles, and today mainly through the West Papua National Liberation Army (TPNPB); its political wing abroad is the United Liberation Movement for West Papua. Indonesia has answered with military operations in the highlands, a heavy security presence and restrictions on foreign journalists, and since 2001 with special autonomy and, in 2022, a division of the region into six provinces. Papuans’ grievances include the 1969 vote, killings and abuses by the security forces, the arrival of migrants from other islands, who now make up a large part of the population, and the exploitation of resources such as the Grasberg copper and gold mine. The fighting has intensified since 2018 in the central highlands, where tens of thousands have been displaced. Estimates of the total dead since the 1960s vary enormously, from about 100,000 to several hundred thousand, and none rests on a systematic count. Last updated 27 November 2026."
