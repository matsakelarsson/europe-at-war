        lonlat: [138.384, -4.601]
  - title: The highlands war
    date: 2019–2026
    when: "2026-11-27"
    borders: "2026-11-27"
    countries: [id]
    body:
      - "Last updated 27 November 2026. In August 2019 racist abuse of Papuan students in Surabaya set off protests and riots across Papua; parliament buildings were burned in Manokwari and Jayapura, and in Wamena on 23 September some 33 people, most of them migrants from other islands, were killed. Indonesia cut the internet and flew in thousands of troops. On 25 April 2021 the TPNPB killed the head of the state intelligence agency in Papua, Brigadier General I Gusti Putu Danny Karya Nugraha, in Puncak regency, and days later the government designated the armed groups as terrorists. In 2022 Papua was divided into six provinces, with new ones in the south, centre, highlands and south-west. On 7 February 2023 Egianus Kogoya’s fighters took the New Zealand pilot Philip Mehrtens hostage at Paro in Nduga; he was freed on 21 September 2024 after more than nineteen months."
      - "Fighting has since spread through the central highlands, especially Intan Jaya, Puncak, Nduga and Yahukimo, where the army has used drones, mortars and air strikes and the TPNPB has attacked soldiers, migrant miners, workers and civilian aircraft; on 11 February 2026 gunmen killed the pilot and co-pilot of a Smart Air plane after it landed at a remote airstrip in Boven Digoel. An Indonesian parliamentary committee counted 59 conflict deaths in 2026 by October, 43 of them civilians, and about 124,000 people still displaced; Papuan monitors count more. There are no peace talks, and the government says the problem is one of law and order. Pacific governments, among them Vanuatu and Solomon Islands, continue to press for a visit by the UN High Commissioner for Human Rights. Figures for the conflict as a whole are uncertain."
    facts:
      - [Wamena riot, "23 September 2019, about 33 killed"]
      - [Armed groups designated terrorists, "April 2021"]
      - [Philip Mehrtens held hostage, "7 February 2023 – 21 September 2024"]
      - [Deaths in 2026, "59 by October, 43 civilians (Indonesian parliamentary committee)"]
      - [Displaced, "about 124,000 (October 2026)"]
