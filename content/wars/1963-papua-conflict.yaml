  - title: Hostages, Biak and special autonomy
    date: 1996–2018
    when: "1998-07-06"
    borders: "2001-11-21"
    countries: [id]
    body:
      - "In January 1996 OPM fighters under Kelly Kwalik seized a team of WWF researchers at Mapenduma in the highlands, among them four Britons and two Dutch; on 15 May army special forces under Prabowo Subianto stormed their camp, freeing nine hostages while two Indonesian hostages were killed. After Suharto’s fall, Papuans raised the Morning Star flag across the region. On Biak a crowd gathered around the flag on a water tower from 2 July 1998; on 6 July troops opened fire and broke up the gathering, and in the following days bodies washed up on the coast. Estimates of the dead run from about eight confirmed to more than a hundred. In 2000 a Papuan Congress in Jayapura declared that Papua had been independent since 1961; its leader, the tribal chief Theys Eluay, was murdered by Indonesian special forces soldiers on 10 November 2001."
      - "In November 2001 Indonesia passed a special autonomy law, giving Papua a larger share of its revenues and a Papuan People’s Assembly, and in 2003 split off the western part as a separate province (West Papua since 2007). Many Papuans judged that autonomy brought money but not protection. Small TPNPB units kept up ambushes in the highlands and around the Freeport mine; Kelly Kwalik was shot dead in Timika in 2009. Abroad, Papuan groups formed the United Liberation Movement for West Papua in 2014 under Benny Wenda. On 2 December 2018 fighters of the TPNPB’s Nduga command under Egianus Kogoya killed some 17–19 construction workers building the Trans-Papua Highway near Puncak Kabo, as well as a soldier; the army offensive in Nduga that followed displaced tens of thousands of people."
    facts:
      - [Mapenduma hostage crisis, "8 January – 15 May 1996"]
      - [Biak massacre, "6 July 1998"]
      - [Theys Eluay murdered, "10 November 2001"]
      - [Special autonomy law, "November 2001"]
      - [Nduga killings, "2 December 2018"]
    markers:
