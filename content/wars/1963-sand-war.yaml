notes:
  - Losses are uncertain. The figures at the time were about 60 Algerians killed and 250 wounded (from French sources) and 39 Moroccans killed (the official figure); later works give about 300 Algerian and 200 Moroccan dead. About 379 Algerians and 57 Moroccans were taken prisoner.
  - Morocco’s claim rested on the authority its sultans had held over the people of the border oases before the French conquest; Algeria’s on the principle, adopted by the OAU in 1964, that independent African states keep the borders they inherited.
