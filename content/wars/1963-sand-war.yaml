  - title: Bamako and the border
    date: 30 October 1963 – 1972
    when: "1963-10-30"
    borders: "1963-11-04"
    countries: [ma, dz]
    body:
      - "The Arab League, Tunisia’s Habib Bourguiba and King Idris of Libya all tried to mediate. In the end the new Organisation of African Unity, founded that May, brought Hassan II and Ben Bella to Bamako, where they met Emperor Haile Selassie and President Modibo Keïta of Mali on 29–30 October 1963. They agreed on a ceasefire from 2 November, a demilitarised zone to be marked out by Moroccan, Algerian, Ethiopian and Malian officers and watched by Ethiopian and Malian observers, and an OAU commission to study the border. Fighting near Figuig went on until 4 November, when a Malian officer arrived to enforce the ceasefire. A formal agreement followed in Bamako on 20 February 1964, and prisoners were exchanged."
      - "Neither side gained ground. In 1969 the Algerian president Houari Boumediène and Hassan II signed a treaty of friendship at Ifrane, and on 15 June 1972 the two countries signed a convention that fixed the border along the colonial line, leaving Tindouf to Algeria, with an agreement to work the Gara Djebilet iron ore together. Algeria ratified it in 1973; Morocco only in 1989. The war left a deep distrust, and within three years Algeria was sheltering and arming the Polisario Front against Morocco in Western Sahara."
    facts:
      - [Bamako meeting, "29–30 October 1963"]
      - [Ceasefire, "2 November 1963 (fighting at Figuig until 4 November)"]
      - [Bamako agreement, "20 February 1964"]
      - [Border convention, "15 June 1972"]
