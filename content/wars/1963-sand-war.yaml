steps:
  - title: Hassi Beida, Tinjoub and Tindouf
    date: 25 September – 30 October 1963
    when: "1963-09-25"
    borders: "1963-10-15"
    countries: [ma, dz]
    body:
      - "The border between Morocco and French Algeria had been drawn by treaty only for its first 165 km inland from the sea, in 1845. Further south the French moved their administrative lines several times, and in 1952 they placed Tindouf and Colomb-Béchar inside Algeria’s departments. When Morocco became independent in 1956 it claimed them, and in 1961 King Hassan II reached an agreement with the Algerian provisional government to settle the border once Algeria was free. Independent Algeria, whose people had just fought eight years for the whole territory, refused to give up land. Talks in 1963 failed, and both sides moved troops to the frontier."
      - "On 25 September 1963 Moroccan units, about a thousand men, took the small Algerian posts of Hassi Beida and Tinjoub, in the desert on the track between Colomb-Béchar and Tindouf. Algeria retook them on 8 October, and the Moroccans returned in force in the week of 14 October with tanks and artillery and took them again. A Moroccan advance on Tindouf from 13 October was held by the Algerian garrison, reinforced by Egyptian troops, and a second offensive planned for 28 October was called off. In the north Algerian forces attacked across the border on 18 October and drove the Moroccans from Ich, a village north of Figuig. The Moroccan army, trained and equipped by France, had the better of the fighting in the desert, but neither side could force a decision, and both came under heavy pressure from African and Arab governments to stop."
