id: sand-war
name: Sand War
start: "1963-09-25"
end: "1963-11-04"
tier: B
summary: "A short border war between Morocco and Algeria in the autumn of 1963, a year after Algeria’s independence. France had never fixed the border south of Figuig and had attached the Sahara around Tindouf and Colomb-Béchar, with its iron ore and possible oil, to Algeria. Morocco, where the Istiqlal party’s idea of a Greater Morocco was widely held, claimed these lands and said that Algeria’s wartime leaders had promised to settle the question after independence; Ahmed Ben Bella’s government held to the colonial borders. On 25 September 1963 Moroccan troops seized the Algerian border posts of Hassi Beida and Tinjoub on the road from Colomb-Béchar to Tindouf. Algeria retook them on 8 October and Morocco took them back the following week, while a Moroccan push towards Tindouf stalled; Algeria opened a second front in the north, taking Ich near Figuig on 18 October. Egypt sent some 1,000 troops to help Algeria, and Cuba sent about 700 soldiers with tanks, who arrived at Oran on 22 October but saw little fighting. Mediation by the Organisation of African Unity, Haile Selassie of Ethiopia and Modibo Keïta of Mali brought Hassan II and Ben Bella to Bamako, where on 30 October they agreed a ceasefire from 2 November and a demilitarised zone watched by Ethiopian and Malian officers, the OAU’s first peacekeeping mission; fighting near Figuig went on for two more days. The losses were small: Algeria gave about 60 dead and Morocco 39, though later works give some 300 and 200. The border stayed in place: the two countries signed a border convention in 1972, which Morocco ratified only in 1989, and the war left a lasting distrust between them that shaped the Western Sahara conflict."
countries: [ma, dz]
sides:
  - id: ma
    name: Morocco
    polities: [morocco]
    ink: red
    moves: Moroccan moves
    success: Moroccan success
  - id: dz
