  - title: Manyattas and the Arusha memorandum
    date: 1966 – 1967
    when: "1967-10-28"
    borders: "1967-10-28"
    countries: [ke, so]
    body:
      - "By 1966 the insurgents, about 1,200 of them trained by the Somali army, were raiding towns and mining roads. The Kenyan government answered by moving the population of the war zone into 14 guarded villages, manyattas, from 1966–1967, and by banning the cattle trade. Huge numbers of camels, cattle and goats were confiscated or killed, both to starve the insurgents and to force herders into the villages; the scholar Alex de Waal called it “a military assault upon the entire pastoral way of life”. As British officers left the Kenyan forces in 1967, the army and the General Service Unit acted with what the United States embassy called “harsh brutality”. Two amnesties in 1967, from 1 June to 15 July and from 20 October to 20 November, brought in 340 and 151 fighters."
      - "Somalia’s support was wavering as the closed border hurt its own economy. Muhammad Haji Ibrahim Egal, who became prime minister in July 1967, sought détente with Kenya. Talks at the summit of the Organisation of African Unity in Kinshasa in September led to a meeting at Arusha in Tanzania, where on 28 October 1967, under the chairmanship of President Kenneth Kaunda of Zambia, Kenya and Somalia signed a memorandum of understanding: both would end their states of emergency and restore diplomatic and trade relations. On 23 November Kenya announced that it would launch no new offensives. Many fighters took their weapons to Somalia rather than surrender them."
      - "The dead were never counted: Kenyan government records put them in the thousands, and non-governmental organisations reported more than 10,000. Many herders lost their livestock and ended in poverty around the towns. The north-east remained under emergency rule for decades and suffered later abuses by the security forces, among them the Wagalla massacre near Wajir in 1984, when security forces rounded up some 5,000 Degodia Somali men at the Wagalla airstrip and opened fire on them; the government at first admitted 57 deaths and in 2000 380, while survivors and later inquiries put the number far higher."
