id: shifta-war
name: Shifta War
start: "1963-11"
end: "1967-10-28"
tier: B
summary: "A secessionist war in Kenya’s Northern Frontier District (NFD), where Somalis and many Borana, Gabbra, Rendille and Sakuye pastoralists sought to join the Somali Republic, which backed them. Before independence an informal British inquiry in 1962 found that most of the district’s people wanted union with Somalia, but Britain left the NFD to Kenya. In the weeks before Kenyan independence on 12 December 1963 a few hundred supporters of the Northern Province People’s Progressive Party (NPPPP) took up arms as the Northern Frontier Districts Liberation Movement (NFDLM), attacking police and army posts. Jomo Kenyatta’s government declared a state of emergency on 28 December 1963, created a prohibited zone along the Somali border and, deliberately, called the rebels “shifta”, a Swahili word for bandits, to deny the war its political character; Somalis call the war Gaf Daba. Somalia armed and trained the insurgents, about 1,200 by 1966; Britain gave Kenya military support and Ethiopia signed a defence pact with it in 1964. Neither side could win: the rebels ambushed convoys and laid mines, and the Kenya Army and the paramilitary General Service Unit answered with collective punishment, the confiscation and slaughter of livestock and, in 1966–1967, the forced resettlement of the population into 14 guarded villages (manyattas), which ruined much of the pastoral economy. After Muhammad Haji Ibrahim Egal became Somalia’s prime minister in 1967, Kenya and Somalia signed a memorandum of understanding at Arusha under the chairmanship of Zambia’s President Kenneth Kaunda on 28 October 1967, ending the emergencies on both sides and restoring relations. Kenyan government records put the dead in the thousands; non-governmental organisations reported more than 10,000. Insecurity and cattle raiding went on for years, and the former NFD remained under emergency laws and among Kenya’s poorest regions."
