steps:
  - title: The NFD and the emergency
    date: 1962 – 1965
    when: "1963-12-28"
    borders: "1963-12-28"
    countries: [ke, so]
    body:
      - "The Northern Frontier District covered the arid north and north-east of Kenya, home mostly to Somali, Borana, Gabbra, Rendille and other pastoral peoples. The British had closed it to outsiders and ruled it with passes and little investment. When British Somaliland and Italian Somalia united as the Somali Republic in 1960, Somali nationalists in the NFD, led by the NPPPP, sought to join it, and in 1962 an informal plebiscite and the British Northern Frontier District Commission found that most of the district’s people favoured union. Kenya’s nationalist leaders refused; Jomo Kenyatta called the NFD “a domestic affair of Kenya” and told Somalis who wanted to leave to “pack up your camels and go to Somalia”. Britain sided with them, and in 1963 the colonial government detained NPPPP leaders."
      - "In the weeks before independence a few hundred NPPPP supporters took up arms as the NFDLM, in two loose groups: one, mainly Hawiye, between Wajir, Moyale and Mandera, the other, mainly Darod, led by Chief Maalim Mohammed Stamboul near Garissa. In 1963 two Borana leaders who opposed secession, District Commissioner Dabaso Wabera and Chief Haji Galma Dido, were killed on the road to Isiolo. After independence on 12 December 1963 insurgents attacked police stations and administrative posts, and on 28 December the government declared a state of emergency in the North Eastern Region: detention without trial for up to 56 days, collective confiscation of property, a prohibited zone along the Somali border and the death penalty for carrying unlicensed firearms. A government committee decided to call the rebels “shifta”, bandits, and the national radio was told not to call the conflict a border dispute."
      - "Somalia, rearmed by the Soviet Union from 1963, supplied the insurgents and later trained them. Kenyatta relied on the paramilitary General Service Unit, trained by the British, and British troops and aircraft; in March 1964 Britain and Kenya signed an agreement on British use of Kenyan bases and airspace, and the Kenya Army began a major offensive, though the insurgents still struck at Marsabit. In 1964 Kenya signed a defence treaty with Ethiopia, which was fighting Somalia over the Ogaden. Half of the Kenya Army was tied down in the north."
