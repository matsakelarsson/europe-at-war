  - title: Guevara’s column and the end of the rising
    date: 1965
    when: "1965-04-24"
    borders: "1965-11-21"
    countries: [cd, cu]
    body:
      - The rebels lost their towns one after another in early 1965, and mercenary-led operations along the Ugandan and Sudanese borders cut their supply routes. In April 1965 Che Guevara crossed Lake Tanganyika from Tanzania with about 100 Afro-Cuban volunteers to train the rebels of the Fizi–Baraka hills, where Laurent-Désiré Kabila was one of the leaders. Guevara found the rebels divided and their leaders mostly absent, and his diary called the campaign a failure.
      - In September 1965 the ANC and Hoare’s mercenaries launched Operation South against Fizi and Baraka, attacking across the lake as well as overland. Baraka fell in late September and Fizi in October, and on 21 November the Cubans withdrew across the lake. Four days later Mobutu took power. Small groups, Kabila’s among them, held out in the hills of South Kivu for decades; Mulele, lured back from exile in 1968 with a promise of amnesty, was tortured and killed.
    facts:
      - [Guevara arrives on Lake Tanganyika, "April 1965"]
      - [Operation South begins, "September 1965"]
      - [Cubans withdraw, "21 November 1965"]
