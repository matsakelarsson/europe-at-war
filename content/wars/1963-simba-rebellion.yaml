id: simba-rebellion
name: Simba rebellion
start: "1963-08"
end: "1965-11"
tier: B
summary: "Risings in 1963–1965 by followers of the murdered prime minister Patrice Lumumba against the government of the Congo (Léopoldville). Pierre Mulele led a peasant rising in Kwilu from January 1964, and in the east the National Liberation Council (CNL) of Christophe Gbenye and Gaston Soumialot raised an army of young fighters, the Simbas (“lions” in Swahili), who in 1964 took about half the country and proclaimed a People’s Republic of the Congo at Stanleyville. Prime Minister Moïse Tshombe’s army, white mercenaries and Katangese gendarmes, with American aircraft and Belgian officers, drove them back; on 24 November 1964 Belgian paratroopers landed at Stanleyville to free hundreds of foreign hostages (Operation Dragon Rouge). A Cuban column under Che Guevara fought with the rebels near Lake Tanganyika in 1965 and left in November, when the last major rebel stronghold fell. The rebels killed thousands of Congolese they saw as enemies and some 200–400 foreigners; the repression killed tens of thousands more."
countries: [cd, be, us, cu]
