  - title: Stanleyville and Dragon Rouge
    date: September – November 1964
    when: "1964-11-24"
    borders: "1964-11-24"
    countries: [cd, be, us]
    body:
      - On 7 September 1964 the rebels proclaimed a People’s Republic of the Congo in Stanleyville, with Gbenye as president. In the towns they held, Simbas and their supporters executed thousands of people seen as enemies, among them officials, teachers, clerks and others with an education, many in front of the monument to Lumumba in Stanleyville. As government columns advanced, the rebels took Belgian, American and other foreign residents hostage, holding several hundred in Stanleyville to deter attack.
      - Tshombe, prime minister since July, rebuilt the army with Katangese gendarmes recalled from Angola and with white mercenaries from South Africa, Rhodesia and Europe under Mike Hoare and others, led by Belgian officers under Colonel Frédéric Vandewalle. A mechanised column, the Ommegang, fought its way north from Kindu. On 24 November 1964, in Operation Dragon Rouge, some 320–350 Belgian paratroopers jumped from American C-130 aircraft onto Stanleyville airport; as they reached the town, Simbas opened fire on hostages gathered in the street, killing at least eighteen. The paratroopers and the column, which arrived the same day, evacuated some 1,800 foreigners over two days, and a second drop, Dragon Noir, took Paulis (Isiro) on 26 November. Hundreds of foreigners and many Congolese were killed by rebels elsewhere, and mercenaries and soldiers killed many Congolese civilians in the reconquest.
    facts:
      - [People’s Republic of the Congo proclaimed, "7 September 1964"]
      - [Operation Dragon Rouge, "24 November 1964"]
      - [Operation Dragon Noir, Paulis, "26 November 1964"]
      - [Foreigners evacuated from Stanleyville, "about 1,800"]
