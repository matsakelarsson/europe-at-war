notes:
  - "The name Simba (“lion”) was used by the eastern rebels themselves; their fighters, many of them teenagers, went into battle after rituals (dawa) that were believed to turn bullets into water. Death tolls are rough: the rebels executed at least 20,000 Congolese and, by one count, 392 Europeans and Americans; the government’s campaigns against the Kwilu rising alone are estimated to have killed 60,000–70,000 people."
  - "The rebels received arms and training from the Soviet Union, China, Algeria, Egypt and Cuba, and supplies through Sudan, Uganda, Tanzania and Burundi; the government relied on American aircraft (some flown by Cuban exiles hired by the CIA), Belgian officers and mercenaries."
