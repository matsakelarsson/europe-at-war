  - title: Kwilu and the east rise
    date: August 1963 – August 1964
    when: "1964-01-16"
    borders: "1964-08-04"
    countries: [cd]
    body:
      - Lumumba’s followers had lost power in Léopoldville and their Stanleyville government had collapsed in 1962. Pierre Mulele, a minister in Lumumba’s government who had trained in China, returned to his home region of Kwilu in 1963 and organised young men and women in forest camps. On 16 January 1964 his partisans rose around Idiofa and Gungu, attacking government posts, missions and anyone linked to the state; the army’s counter-campaign, which went on into 1965, was brutal, and the government did not declare the rebellion over until 1968.
      - In Brazzaville, across the river, Lumumbist leaders founded the National Liberation Council (CNL) in October 1963. Gaston Soumialot entered South Kivu from Burundi and took Uvira on 15 May 1964; Albertville (Kalemie) fell after a rising on 19 June, and Kindu, the capital of Maniema, on 22 July. The ANC often fled before the Simbas. On 4 August the rebels under Nicolas Olenga took Stanleyville, but in mid-August their attack on Bukavu was beaten off. By then they held about half of the Congo.
    facts:
      - [CNL founded in Brazzaville, "3 October 1963"]
      - [Kwilu rising, "16 January 1964"]
      - [Simbas take Uvira, "15 May 1964"]
      - [Simbas take Stanleyville, "4 August 1964"]
