notes:
  - "Ethiopia held that the Ogaden was its territory by the treaties of 1897 and 1954 and treated the rising as a rebellion backed from Mogadishu; Somalia held that the treaties had been made without the Somali people and that the Ogaden Somalis had a right to self-determination. Accounts differ on who began the fighting in January 1964; many independent accounts blame an Ethiopian incursion by the 3rd Division."
