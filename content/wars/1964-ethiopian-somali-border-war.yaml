id: ethiopian-somali-border-war
name: Ethiopian–Somali Border War
start: "1964-02-08"
end: "1964-04-02"
tier: C
summary: "A short border war between Ethiopia and the Somali Republic over the Ogaden, the Somali-inhabited east of Ethiopia that Somalia claimed as part of a Greater Somalia. In June 1963 Ogaden Somalis led by Mukhtar Dahir (“Nasrallah”) rose against Ethiopian tax collection; Ethiopia accused Somalia of arming them, which Somalia denied, and answered with reprisals against herders and villages. After clashes from mid-January 1964, both governments declared states of emergency on 8 February. Ethiopia, with some 55,000–60,000 troops and F-86 Sabre jets, against about 9,000–11,000 Somali soldiers and up to 3,000 Ogaden fighters, fought tank and artillery battles around Tog Wajaale (Togochale) on the northern border and bombed Feerfeer, Galkayo, Buuhoodle and other Somali towns, and the war spread south to Dolow on the Kenyan border. Ceasefires called by the Soviet Union and the Organisation of African Unity failed; Sudan’s president Ibrahim Abboud mediated a ceasefire on 30 March, and fighting ended on 2 April 1964, followed by an accord in Khartoum to withdraw troops and stop hostile propaganda. Both sides claimed victory, and neither gained ground; an estimated 1,000–2,000 people were killed. Somalia rejected the OAU’s Cairo declaration of July 1964 that colonial borders should stand, and the dispute led to the Ogaden War of 1977–1978."
