id: mexican-dirty-war
name: Mexican Dirty War
start: "1964"
end: "1982"
tier: C
summary: "The conflict between the Mexican state, ruled by the Institutional Revolutionary Party (PRI), and left-wing guerrillas and the student and peasant movements it treated as subversive, known in Mexico as the guerra sucia. In Chihuahua the Grupo Popular Guerrillero of the teacher Arturo Gámiz took up arms for landless peasants in 1964, and on 23 September 1965 attacked the army barracks at Ciudad Madera, where Gámiz and most of his comrades were killed. In Mexico City soldiers and the plain-clothes Olympia Battalion opened fire on a student rally in the Plaza de las Tres Culturas at Tlatelolco on 2 October 1968, ten days before the Olympic Games; the government spoke of about 30 dead, and estimates range up to 300 or more. On 10 June 1971 the Halcones, a paramilitary group trained by the state, attacked a student march in the capital (the Corpus Christi massacre or Halconazo), killing dozens of people; some estimates exceed 100. Repression drove many young people to arms. In the mountains of Guerrero two schoolteachers led guerrilla wars: Genaro Vázquez of the National Revolutionary Civic Association (ACNR), who died after a car crash in 1972, and Lucio Cabañas of the Party of the Poor (PDLP), who kidnapped the senator and candidate for governor Rubén Figueroa in 1974 and was killed by the army on 2 December 1974. In the cities the Liga Comunista 23 de Septiembre, founded in Guadalajara in 1973 and named after the Madera attack, robbed banks and kidnapped businessmen and diplomats; its attempt to kidnap the Monterrey industrialist Eugenio Garza Sada left him dead in September 1973. The army, the Federal Security Directorate (DFS) and, from 1976, the police unit known as the Brigada Blanca answered with torture, secret prisons, extrajudicial killings and disappearances, including “death flights” over the Pacific; in and around Atoyac de Álvarez in Guerrero alone, relatives have documented more than 470 people who disappeared. A political reform and an amnesty in 1978 legalised left-wing parties and freed many prisoners, but disappearances went on into the early 1980s. Estimates of the victims range from about 1,200 disappeared, the figure most often given, to some 3,000 killed or disappeared and 7,000 tortured. A special prosecutor’s office (FEMOSPP, 2002–2006) documented the abuses but convicted no senior official, and a case against the former president Luis Echeverría for the killings of 1968 and 1971 was dismissed; in 2019 the government opened the DFS archives and apologised, and in 2021 it set up a truth commission for the abuses of 1965–1990."
countries: [mx]
