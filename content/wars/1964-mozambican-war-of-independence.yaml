        lonlat: [32.567, -25.966]
  - title: Chai and the northern fronts
    date: 1964–1967
    when: "1964-09-25"
    borders: "1964-09-25"
    countries: [mz, tz]
    body:
      - "FRELIMO began the war on 25 September 1964 with an attack on the Portuguese administrative post at Chai in Cabo Delgado, helped by local people, and with smaller attacks in Niassa. A front in Zambezia and Tete was soon abandoned, because Malawi’s president Hastings Banda would not let FRELIMO use his country. In the north the guerrillas crossed the Rovuma from Tanzania, where FRELIMO trained its fighters at Nachingwea, and found support among the Makonde of the Mueda plateau, who lived on both sides of the river. In Niassa, among the Nyanja and Yao, they came in from Tanzania and across Lake Niassa."
      - "The Portuguese army, about 8,000 strong when the war began, grew to some 24,000 by 1967, with its command at Nampula and garrisons at Mueda, Vila Cabral (Lichinga) and the posts along the border. It held the towns and roads, while FRELIMO moved through the bush and the plateau and laid mines on the roads. By 1967 FRELIMO had about 8,000 fighters and said it controlled a fifth of the territory and a seventh of the people, mostly in northern Cabo Delgado and Niassa; Portugal denied that FRELIMO held any territory at all."
      - "In the zones it held, which it called liberated, FRELIMO set up its own administration, schools, clinics and cooperative farms and shops, and sent produce to Tanzania to sell. Portuguese aircraft bombed villages and fields in these areas, and the army moved people from the contested districts into fortified villages, the aldeamentos, to cut the guerrillas off from them."
    facts:
      - [War begins, "25 September 1964, attack on Chai"]
      - [Portuguese troops, "about 8,000 (1964) to 24,000 (1967)"]
      - [FRELIMO fighters, "about 8,000 (1967)"]
