steps:
  - title: Mueda and the founding of FRELIMO
    date: 1960–1964
    when: "1960-06-16"
    borders: "1962-06-25"
    countries: [mz, tz]
    body:
      - "Portugal had held posts on the Mozambican coast since the early 1500s, but conquered the interior only around 1900, and much of the north and centre was run by chartered companies until 1929 and 1942. Under António de Oliveira Salazar’s Estado Novo, Africans were subjects without political rights; most were liable to forced labour (chibalo) or forced cultivation of cotton, and many men went as contract labourers to the mines of South Africa. White settlement grew fast after the Second World War. While Britain and France were leaving Africa, Salazar declared the colonies overseas provinces of Portugal in 1951 and refused to discuss independence."
      - "On 16 June 1960 Makonde farmers gathered at the administrative post of Mueda in Cabo Delgado to present grievances over taxes and to ask for independence. The district administrator had their leaders arrested, and when the crowd protested, troops fired on it. How many died is disputed; nationalist accounts later spoke of hundreds. For many in the north, Mueda proved that peaceful protest was useless."
      - "Exile movements formed among Mozambicans in Tanganyika, Southern Rhodesia and Nyasaland. On 25 June 1962, in Dar es Salaam, three of them, the National Democratic Union of Mozambique (UDENAMO), the Mozambique African National Union (MANU) and the National African Union of Independent Mozambique (UNAMI), merged as the Mozambique Liberation Front, FRELIMO, with Tanzania’s president Julius Nyerere as host. Its president was Eduardo Mondlane, a Mozambican sociologist who had studied in South Africa, Portugal and the United States and worked for the United Nations. FRELIMO sent its first recruits for military training to Algeria and set up camps in southern Tanzania."
    facts:
      - [Mueda massacre, "16 June 1960"]
      - [FRELIMO founded, "25 June 1962, Dar es Salaam"]
      - [First president, Eduardo Mondlane]
    markers:
