  - title: Across the Zambezi
    date: 1972–1974
    when: "1972-07-25"
    borders: "1973-06-01"
    countries: [mz, zw]
    body:
      - "On 25 July 1972 FRELIMO announced a fourth front in Manica and Sofala, south of the Zambezi, the heart of the colony’s settler farming and of the railway and road from Beira to Rhodesia. Through 1973 its groups attacked the Beira–Umtali railway, farms and convoys around Vila Pery (Chimoio) and Vila Gouveia (Catandica), and reached towards the coast near Beira. The Portuguese command first ignored the new front in its bulletins."
      - "The settlers, who had felt the war was far away in the north, grew afraid, and many blamed the army and the government in Lisbon for not protecting them; their protests added to the strain on the regime. In Portugal, the cost of thirteen years of war on three fronts weighed more heavily than ever: military service lasted up to four years, much of the budget went on the colonial wars, and many young men emigrated to escape the draft. Among the junior officers, a movement of captains formed in 1973."
    facts:
      - [Manica and Sofala front, "announced 25 July 1972"]
      - [Targets, "the Beira–Umtali railway and road, farms and convoys"]
