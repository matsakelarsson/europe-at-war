  - title: Tete, Matchedje and the death of Mondlane
    date: 1968–1970
    when: "1968-07"
    borders: "1968-07-20"
    countries: [mz, tz, zm]
    body:
      - "In March 1968 FRELIMO opened a third front in Tete, entering from Zambia, which had become independent in 1964. Tete mattered to Portugal: in 1969 work began on the Cahora Bassa dam on the Zambezi, a project backed by South African money and meant to sell power to South Africa and to bring more settlers to the valley."
      - "In July 1968 FRELIMO held its Second Congress inside Mozambique, at Matchedje in Niassa, to show that it held ground there. The congress also exposed deep divisions. Lázaro Kavandame, a Makonde leader in Cabo Delgado, and others wanted a narrower movement led by northerners and a war against whites; Mondlane, Samora Machel, who commanded the army, and Marcelino dos Santos stood for a movement for all Mozambicans and a social revolution in the liberated zones. In Dar es Salaam students rebelled against the leadership."
      - "On 3 February 1969 Mondlane was killed in Dar es Salaam when a book bomb sent to him exploded. Who sent it is still disputed; most historians blame the Portuguese secret police, PIDE, possibly with help from FRELIMO dissidents. Kavandame went over to the Portuguese in April 1969. A council of three, Uria Simango, Machel and dos Santos, led FRELIMO until Simango was expelled, and in May 1970 Machel became president."
    facts:
      - [Tete front opened, "March 1968"]
      - [Second Congress, "July 1968, Matchedje (Niassa)"]
      - [Mondlane killed, "3 February 1969, Dar es Salaam"]
      - [Machel president of FRELIMO, "May 1970"]
