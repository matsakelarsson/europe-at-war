  - title: Gordian Knot
    date: July 1970 – 1971
    when: "1970-07-01"
    borders: "1970-07-01"
    countries: [mz, tz]
    body:
      - "In March 1970 General Kaúlza de Arriaga took command in Mozambique, determined to win the war in the north by force. His Operation Gordian Knot (Nó Górdio), launched in mid-1970 from headquarters at Mueda (sources give dates from May to 1 July), sent in the end some 35,000 troops, with aircraft, helicopters and artillery, against FRELIMO’s bases in Cabo Delgado and the infiltration routes from Tanzania. Airborne assaults struck the smaller camps, while columns led by bulldozers swept the Mueda plateau and the bush towards the Rovuma. The campaign lasted about seven months."
      - "Arriaga claimed 61 bases and 165 camps destroyed and 651 guerrillas killed and 1,840 captured, for 132 Portuguese soldiers dead; these claims cannot be checked independently. It was Portugal’s most successful offensive of the war, but it did not end FRELIMO in the north. The guerrillas scattered into smaller groups, the rains hampered the columns, and the cost in men and money was criticised in Lisbon."
      - "Portugal relied more and more on Africans: by the early 1970s its forces in Mozambique numbered some 50,000–60,000, and a growing share were Mozambicans, among them special units such as the Grupos Especiais and the Flechas of the secret police. Hundreds of thousands of villagers were moved into aldeamentos. FRELIMO, meanwhile, shifted its weight to Tete."
    facts:
      - [Operation Gordian Knot, "mid-1970, about seven months"]
      - [Portuguese troops, "about 35,000"]
      - [Claimed results, "61 bases and 165 camps destroyed, 651 guerrillas killed, 1,840 captured"]
      - [Portuguese dead, "132"]
    markers:
