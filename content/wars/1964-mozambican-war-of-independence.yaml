  - title: Tete and Wiriyamu
    date: 1971–1973
    when: "1972-12-16"
    borders: "1972-12-16"
    countries: [mz, zw, pt]
    body:
      - "In Tete FRELIMO attacked the roads and convoys to Cahora Bassa and the railway from Malawi to Beira, mined the roads and spread south of the Zambezi. Here it worked with the guerrillas of Rhodesia’s ZANU, whom it let pass through its zones to the Rhodesian border, and Rhodesian troops and aircraft, invited by Portugal, operated in Tete against both. The Portuguese army and the secret police, now called DGS, answered with resettlement, bombing and reprisals against villages suspected of feeding the guerrillas."
      - "On 16 December 1972 a company of Portuguese commandos, guided by a DGS agent, attacked the villages of Wiriyamu, Juwau, Chaworha and others near Tete in an operation code-named Marosca, and killed the people they found, women and children among them. Estimates of the dead range from about 150 (the Red Cross) to at least 385 (a list compiled by Spanish missionaries); a later investigation by the Lisbon weekly Expresso, based on soldiers’ testimony, gave about 300."
      - "The British priest Adrian Hastings made the massacre public in The Times on 10 July 1973, just before the Portuguese prime minister, Marcelo Caetano, visited London. Portugal first denied it, and some claimed the reports were invented or blamed FRELIMO. In 2022 Portugal’s prime minister António Costa called it an unforgivable act that dishonoured Portugal’s history."
    facts:
      - [Wiriyamu massacre, "16 December 1972"]
      - [Dead, "about 150 (Red Cross) to at least 385 (missionaries’ list)"]
      - [Made public, "The Times, 10 July 1973"]
    markers:
