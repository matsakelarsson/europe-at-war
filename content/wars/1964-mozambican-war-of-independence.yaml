        date: July – August 1970
        text: The centre of Operation Gordian Knot. Portuguese columns swept the plateau and the bush to the Rovuma and destroyed many FRELIMO camps.
        lonlat: [39.556, -11.663]
      - kind: held
        side: pt
        name: Nampula
        date: "1970"
        text: Arriaga’s headquarters.
        lonlat: [39.262, -15.119]
