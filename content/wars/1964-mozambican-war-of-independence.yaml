        side: fre
        name: Lourenço Marques (Maputo)
        date: 7–10 September 1974; 25 June 1975
        text: Settlers seized the radio station here on the day of the accord. Independence was proclaimed in the city on 25 June 1975.
        lonlat: [32.567, -25.966]
    areas:
