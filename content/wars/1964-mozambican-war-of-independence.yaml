id: mozambican-war-of-independence
name: Mozambican War of Independence
start: "1964-09-25"
end: "1974-09-08"
tier: A
summary: "The guerrilla war fought by the Mozambique Liberation Front (FRELIMO) against Portuguese rule. Formed in Dar es Salaam in 1962 under Eduardo Mondlane, FRELIMO began the war on 25 September 1964 with an attack on the administrative post at Chai in Cabo Delgado. From bases in Tanzania it built liberated zones among the Makonde of the Mueda plateau and in northern Niassa, and in 1968 opened a front in Tete, where Portugal was building the Cahora Bassa dam. Mondlane was killed by a parcel bomb in 1969, and Samora Machel became FRELIMO’s leader. Portugal answered with a large conscript army, a growing share of it recruited in Mozambique, with resettlement of villagers into fortified aldeamentos and with General Kaúlza de Arriaga’s Operation Gordian Knot of 1970, the largest offensive of the war; Rhodesian forces fought FRELIMO in Tete. In December 1972 Portuguese commandos massacred hundreds of villagers at Wiriyamu. FRELIMO crossed the Zambezi into Manica and Sofala in 1972–1973. After army officers overthrew the dictatorship in Lisbon on 25 April 1974, Portugal and FRELIMO signed the Lusaka Accord on 7 September 1974, and Mozambique became independent on 25 June 1975. About 1,800 Portuguese soldiers were killed, some 10,000 FRELIMO fighters and tens of thousands of civilians."
countries: [mz, pt, tz, zm, mw, zw]
sides:
  - id: pt
    name: Portugal (Portuguese Mozambique)
    polities: [portugal, mozambique]
    ink: green
    moves: Portuguese moves
    success: Portuguese success
  - id: fre
    name: Mozambique Liberation Front (FRELIMO)
    polities: [frelimo]
    ink: red
    moves: FRELIMO moves
    success: FRELIMO success
notes:
  - "Portugal called Mozambique an overseas province, part of Portugal, and the war a campaign against terrorists; FRELIMO and Mozambicans call it the armed struggle for national liberation. Both sides’ claims of enemy losses were inflated, and figures for the dead vary: the Portuguese armed forces lost about 1,800 men killed (more if deaths from accidents and disease are counted), FRELIMO’s dead are usually estimated at about 10,000, and civilian deaths at about 50,000."
  - "Rhodesia, whose forces operated in Tete from the late 1960s, and South Africa, which joined Portugal and Rhodesia in the secret Alcora exercise from 1970, helped Portugal; Tanzania and Zambia gave FRELIMO its rear bases, and the Soviet Union, China and the Eastern bloc its weapons. A smaller movement, COREMO, fought briefly from Zambia."
  - "Places are given by their colonial names with today’s names in brackets: Lourenço Marques (Maputo), Vila Cabral (Lichinga), Vila Pery (Chimoio)."
