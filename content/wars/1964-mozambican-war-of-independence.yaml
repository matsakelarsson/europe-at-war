  - title: The Carnation Revolution and the Lusaka Accord
    date: April 1974 – June 1975
    when: "1974-04-25"
    borders: "1974-09-07"
    countries: [mz, pt, zm]
    body:
      - "On 25 April 1974 the Armed Forces Movement, led by junior officers tired of the colonial wars, overthrew Caetano’s government in Lisbon in the Carnation Revolution. The new president, General António de Spínola, wanted a ceasefire and a slow federal solution; FRELIMO refused to stop fighting until Portugal recognised Mozambique’s right to independence and handed power to it, and kept up its attacks, including in Zambezia. Many Portuguese units stopped patrolling, and some made local truces with the guerrillas."
      - "Talks in Lusaka, with Zambia’s president Kenneth Kaunda as host, ended in the Lusaka Accord, signed on 7 September 1974 by Machel and the Portuguese foreign minister Mário Soares. A ceasefire took effect the next day. A transitional government, led by FRELIMO’s Joaquim Chissano as prime minister with a Portuguese high commissioner, took office in late September, and independence was set for 25 June 1975, without elections."
      - "On the day of the accord, groups of settlers in Lourenço Marques seized the Rádio Clube station and called for a white-ruled independence; in four days of violence before Portuguese troops and FRELIMO ended the revolt, many people were killed in the city and its African suburbs. Mozambique became independent on 25 June 1975, with Machel as president of a one-party People’s Republic. Most of the settlers left for Portugal and South Africa. In the war about 1,800 Portuguese soldiers had been killed in action, some 10,000 FRELIMO fighters and, by most estimates, about 50,000 civilians."
    facts:
      - [Carnation Revolution, "25 April 1974"]
      - [Lusaka Accord, "7 September 1974"]
      - [Ceasefire, "8 September 1974"]
      - [Independence, "25 June 1975"]
    markers:
