  - title: Altena Farm and the war in the north-east
    date: 1972–1974
    when: "1972-12-21"
    borders: "1972-12-21"
    countries: [zw, mz]
    body:
      - "From about 1970 ZANLA moved its guerrillas through FRELIMO’s zones in Tete into the north-east of Rhodesia. For two years they prepared the ground: they held night meetings, the pungwes, recruited young people, hid arms and won the help of spirit mediums, among them the medium of Nehanda, whose name recalled the risings of 1896. Rhodesia’s rejection of majority rule had been confirmed in 1972, when the British Pearce Commission found that Africans overwhelmingly rejected a settlement Smith had reached with Britain."
      - "On 21 December 1972 ZANLA guerrillas attacked Altena Farm near Centenary, the start of the war in earnest. The Rhodesian forces launched Operation Hurricane in the north-east and closed the border with Zambia in January 1973. They imposed collective fines on villages that helped the guerrillas, created a no-go zone along the border and from 1973–1974 moved people from areas such as Chiweshe and Madziwa into fortified protected villages, the keeps. New units came into being: the Selous Scouts (1973), which used captured or turned guerrillas to pose as guerrilla bands, and the Fireforce, small groups of soldiers dropped by helicopter on guerrillas spotted from observation posts."
    facts:
      - [Altena Farm attack, "21 December 1972"]
      - [Operation Hurricane, "from December 1972"]
      - [Border with Zambia closed, "January 1973"]
