        polygon: [[30.20, -16.10], [31.10, -15.95], [32.20, -16.15], [33.00, -16.60], [32.60, -17.30], [31.50, -17.40], [30.50, -17.10]]
  - title: Détente, Chitepo and the eastern border
    date: 1974–1976
    when: "1975-03-18"
    borders: "1976-08-09"
    countries: [zw, mz, zm, za]
    body:
      - "The Portuguese revolution of April 1974 changed the war. South Africa’s prime minister John Vorster, wanting a settlement in Rhodesia, joined Zambia’s Kenneth Kaunda in a policy of détente: Smith released Nkomo, Sithole and Mugabe in December 1974 for talks, and a ceasefire was called that never held. A conference held in a train on the Victoria Falls bridge on 25–26 August 1975 failed, and South Africa withdrew its police that month. ZANU was in crisis: a revolt of ZANLA fighters, the Nhari rebellion, was put down in December 1974, and on 18 March 1975 ZANU’s chairman Herbert Chitepo was killed by a car bomb in Lusaka. Zambia blamed ZANU rivals and jailed many of its leaders; later accounts point to the Rhodesian secret service."
      - "Mozambique became independent under FRELIMO on 25 June 1975 and gave ZANLA bases along the whole eastern border; Mugabe, who had crossed into Mozambique in 1975, emerged as ZANU’s leader. On 3 March 1976 Samora Machel closed the border and applied sanctions. The war spread to the east (Operation Thrasher, 1976) and the south-east (Operation Repulse), and thousands of young people crossed into Mozambique to train or as refugees."
      - "On 9 August 1976 a column of 84 Selous Scouts disguised as FRELIMO drove into the ZANLA camp at Nyadzonya, on the Pungwe river in Mozambique, and opened fire on the people assembled on the parade ground. Rhodesia claimed 1,028 guerrillas killed. ZANU and Amnesty International said most of the dead, about a thousand, were unarmed refugees; later historians write that most were unarmed but that many were guerrillas or recruits under training."
    facts:
      - [Victoria Falls conference, "25–26 August 1975"]
      - [Chitepo killed, "18 March 1975, Lusaka"]
      - [Mozambique closes the border, "3 March 1976"]
      - [Nyadzonya raid, "9 August 1976, about 1,000 killed"]
