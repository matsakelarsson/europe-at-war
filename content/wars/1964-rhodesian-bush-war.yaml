notes:
  - "Rhodesian governments called the guerrillas terrorists (“terrs”) and the war a fight against communism; the nationalists called it the Second Chimurenga, after the risings of 1896–1897, and their fighters freedom fighters or comrades. The war has no single agreed start: Zimbabwe dates it from the Battle of Sinoia (28 April 1966), others from the first killing of a white settler by ZANU guerrillas on 4 July 1964 or from the attack on Altena Farm on 21 December 1972."
  - "Figures are uncertain. Rhodesian official figures give about 1,360 members of the security forces killed, many of them black soldiers and police (a later roll of honour lists some 2,600 deaths), and about 10,000 guerrillas, a number that leaves out many of those killed in the raids on camps in Mozambique and Zambia; several thousand civilians were killed, most of them black, by both sides. Most estimates of the total dead are about 20,000."
  - "Most of Rhodesia’s soldiers and police were black Africans, and fewer than a quarter of a million whites ruled nearly seven million Africans by the late 1970s. South Africa sent police units in 1967–1975 and gave money, weapons, aircraft and pilots; Portugal helped until 1974. ZANLA was armed and trained mainly by China and later by FRELIMO’s Mozambique, ZIPRA by the Soviet Union and Cuba; Zambia, Tanzania, Mozambique and Botswana, the Frontline States, gave the movements their rear bases."
  - "Places are given by their names of the time, with today’s names in brackets: Salisbury (Harare), Sinoia (Chinhoyi), Wankie (Hwange), Umtali (Mutare), Sipolilo (Guruve), Melsetter (Chimanimani)."
