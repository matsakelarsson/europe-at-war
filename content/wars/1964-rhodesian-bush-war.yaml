  - title: Zimbabwe Rhodesia
    date: 1979
    when: "1979-06-01"
    borders: "1979-06-01"
    countries: [zw, mz, zm, gb]
    body:
      - "In April 1979 elections under the internal settlement, boycotted by the Patriotic Front and held under martial law in much of the country, gave Muzorewa’s UANC 51 of the 72 seats elected by black voters, and on 1 June 1979 he became prime minister of Zimbabwe Rhodesia. Whites kept control of the army, police, courts and civil service, and no country recognised the new state. Britain’s new Conservative government under Margaret Thatcher was tempted to, but at the Commonwealth conference in Lusaka in August 1979 it agreed instead to call a constitutional conference."
      - "The fighting reached its height. Tens of thousands of guerrillas were inside the country or in the camps, ZIPRA was building a conventional army with Soviet weapons, including tanks, in Zambia, and martial law covered most of Rhodesia. The Rhodesian forces, stretched thin, recruited auxiliaries loyal to Muzorewa and Sithole and struck ever deeper: in September 1979 they destroyed bridges and the railway in Gaza province in Operation Uric and attacked ZANLA’s new camps near Chimoio, and from October they bombed bridges and roads in Zambia to cut its supplies."
    facts:
      - [Election, "April 1979; UANC 51 of 72 black seats"]
      - [Zimbabwe Rhodesia, "1 June 1979"]
      - [Commonwealth conference in Lusaka, "August 1979"]
