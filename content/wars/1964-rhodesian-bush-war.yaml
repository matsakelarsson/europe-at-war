  - title: Wankie and Sipolilo
    date: 1967–1968
    when: "1967-08-01"
    borders: "1967-08-01"
    countries: [zw, zm, bw, za]
    body:
      - "In 1967 ZAPU joined forces with the African National Congress of South Africa, whose fighters of Umkhonto we Sizwe wanted a route home through Rhodesia. On 1 August 1967 the Luthuli Detachment, 79 ZIPRA and MK fighters, crossed the Zambezi about 20 km east of Victoria Falls and marched into the Wankie game reserve, planning to split towards Tjolotjo and Nkayi to raise support and towards South Africa. The Rhodesian African Rifles and the Rhodesian Light Infantry hunted them down in Operation Nickel. By 8 September 29 of them had been killed and 17 captured in Rhodesia, and 29 had been arrested in Botswana; eight members of the Rhodesian forces were killed."
      - "In 1968 larger groups crossed in the north, around Sipolilo, and were again broken up by the Rhodesian forces in Operation Cauldron. From August 1967 Pretoria also sent units of the South African Police to Rhodesia, where they served along the Zambezi until 1975."
      - "The defeats taught the movements different lessons. ZAPU, backed by the Soviet Union, came to plan for a conventional army that could cross in strength; ZANU, backed by China, turned to Maoist guerrilla war, preparing the rural population politically before fighting, and looked for a new route into Rhodesia through Mozambique, where FRELIMO was opening its front in Tete."
    facts:
      - [Operation Nickel, "1 August – 8 September 1967"]
      - [Luthuli Detachment, "79 ZIPRA and MK fighters"]
      - [Result, "29 killed and 17 captured in Rhodesia, 29 arrested in Botswana"]
