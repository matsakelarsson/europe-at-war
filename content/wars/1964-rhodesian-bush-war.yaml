  - title: Lancaster House and independence
    date: September 1979 – April 1980
    when: "1979-12-21"
    borders: "1979-12-21"
    countries: [zw, gb]
    body:
      - "The conference at Lancaster House in London, chaired by the British foreign secretary Lord Carrington, opened on 10 September 1979 with the Patriotic Front led by Mugabe and Nkomo and the Zimbabwe Rhodesia delegation led by Muzorewa and Smith. Under pressure from Mozambique and Zambia, which wanted the war over, and from South Africa, the parties accepted a constitution with 20 of 100 seats reserved for whites for seven years and protections for white-owned land, a return to British rule for the transition, and a ceasefire. Rhodesia formally reverted to British rule when the governor, Lord Soames, arrived in Salisbury on 12 December, and the agreement was signed on 21 December 1979."
      - "The ceasefire came into force on 28 December. More than 20,000 guerrillas gathered at 16 assembly points watched by a Commonwealth Monitoring Force of about 1,300 soldiers, though many ZANLA fighters stayed in the villages. In the election of 27–29 February 1980, marked by intimidation on all sides, Mugabe’s ZANU–PF won 57 of the 80 common-roll seats, Nkomo’s Patriotic Front (ZAPU) 20 and Muzorewa’s UANC 3; Smith’s Rhodesian Front took all 20 white seats."
      - "Zimbabwe became independent on 18 April 1980, with Mugabe as prime minister. Mugabe spoke of reconciliation and kept Walls and many white officials for a time, and the three armies were merged into one. But the rivalry between ZANU and ZAPU, and between their armies, broke out in clashes in 1980–1981 and led to the Gukurahundi killings in Matabeleland in 1983–1987."
