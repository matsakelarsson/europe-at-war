  - title: Chimoio and Tembué
    date: 1976–1977
    when: "1977-11-23"
    borders: "1977-11-23"
    countries: [zw, mz, zm, gb, za]
    body:
      - "Under pressure from Henry Kissinger and South Africa, Smith accepted the principle of majority rule within two years on 24 September 1976, but the conference in Geneva that followed (October–December 1976) failed. For it ZANU and ZAPU formed the Patriotic Front, an alliance that held at the negotiating table but not on the ground. In 1977 Rhodesia set up a Combined Operations headquarters under Lieutenant-General Peter Walls, extended military service and called up older white men, while emigration rose. Martial law spread over more and more of the country."
      - "Rhodesia took the war to the guerrillas’ bases. After raids on Mapai and other camps in Gaza province in 1976–1977, on 23 November 1977 Rhodesian aircraft and some 200 paratroopers and helicopter-borne troops attacked the ZANLA headquarters at New Farm near Chimoio in Operation Dingo, and two days later the camp at Tembué in Tete. The camps held perhaps 8,000–10,000 people, guerrillas, recruits, refugees and staff. Rhodesia claimed between 1,200 and 3,000 guerrillas killed for two of its own men; ZANU said many of the dead were refugees and children, and most sources agree that more than 1,000 people died, hundreds of them civilians."
    facts:
      - [Geneva conference, "October – December 1976"]
      - [Operation Dingo, "23–25 November 1977 (Chimoio), then Tembué"]
      - [Dead, "more than 1,000; Rhodesia claimed 1,200–3,000"]
