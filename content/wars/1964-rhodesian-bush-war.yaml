steps:
  - title: UDI and Sinoia
    date: 1964–1966
    when: "1965-11-11"
    borders: "1966-04-28"
    countries: [zw, zm, gb]
    body:
      - "Southern Rhodesia had been governed since 1923 by its white settlers, who in the early 1960s numbered about 220,000 among nearly four million Africans. The Land Apportionment Act reserved half the land, the best of it, for whites, and a qualified franchise kept almost all Africans off the voters’ roll. As the Central African Federation broke up in 1963 and Nyasaland and Northern Rhodesia moved to independence under African governments, Britain would not grant Southern Rhodesia independence without progress to majority rule. The Rhodesian Front, elected in 1962, refused, and in April 1964 Ian Smith became prime minister."
      - "The nationalist movement had split. Joshua Nkomo’s ZAPU, banned in 1962, was challenged in August 1963 by the Zimbabwe African National Union of Ndabaningi Sithole, with Robert Mugabe as its secretary-general. In 1964 the government detained the leaders of both, Mugabe and Nkomo for ten years. On 4 July 1964 a ZANU group known as the Crocodile Gang killed Petrus Oberholzer, a white foreman at a wattle company, at a roadblock near Melsetter, the first white settler killed in the conflict. On 11 November 1965 Smith’s government declared independence unilaterally. Britain called it rebellion and imposed sanctions, which the United Nations made mandatory in 1966, but refused to use force; South Africa and Portugal kept Rhodesia supplied."
      - "Both movements sent guerrillas trained abroad across the Zambezi from Zambia. On 28 April 1966 police and air force helicopters caught a group of seven ZANLA fighters near Sinoia and killed all of them. Zimbabwe commemorates the day as Chimurenga Day, the start of the liberation war; for the Rhodesian forces it was a small action that showed how easily such groups could be found and destroyed."
    facts:
      - [Oberholzer killed, "4 July 1964"]
      - [Unilateral Declaration of Independence, "11 November 1965"]
      - [Battle of Sinoia, "28 April 1966, seven ZANLA fighters killed"]
