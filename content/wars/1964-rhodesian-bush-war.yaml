  - title: The internal settlement and the Viscounts
    date: 1978
    when: "1978-03-03"
    borders: "1978-09-03"
    countries: [zw, zm]
    body:
      - "On 3 March 1978 Smith signed an internal settlement in Salisbury with three African leaders who had stayed inside the country, Bishop Abel Muzorewa of the United African National Council, Ndabaningi Sithole and Chief Jeremiah Chirau, providing for majority rule with entrenched protections for whites. The Patriotic Front, the Frontline States and most of the world rejected it, and the war grew worse. ZANLA by now had guerrillas in most of the rural east, centre and south, and ZIPRA in the west, from bases in Zambia and Botswana."
      - "On 3 September 1978 ZIPRA fighters shot down Air Rhodesia Flight 825, a Vickers Viscount, with a Soviet SA-7 missile soon after it took off from Kariba. Of the 56 people aboard, 38 died in the crash and 10 of the survivors were then shot by guerrillas at the crash site; Nkomo said his men had downed the plane but denied they killed the survivors. On 12 February 1979 a second Viscount, Flight 827, was shot down after leaving Kariba and all 59 aboard were killed."
      - "Rhodesia answered with Operation Gatling on 19 October 1978. Its aircraft bombed Freedom Camp at Westlands Farm outside Lusaka, Mkushi and other ZIPRA camps in Zambia, while the leader of the formation, calling himself Green Leader, told the control tower at Lusaka to keep Zambia’s air force on the ground. Rhodesia claimed more than 1,500 guerrillas killed; the ZAPU historian Eliakim Sibanda writes that 351 boys and girls were killed at Freedom Camp, and other historians think many of the dead were unarmed recruits and refugees."
    facts:
      - [Internal settlement, "3 March 1978"]
      - [Flight 825 shot down, "3 September 1978, 48 killed"]
      - [Operation Gatling, "19 October 1978"]
      - [Flight 827 shot down, "12 February 1979, 59 killed"]
    markers:
      - kind: treaty
        side: rh
        name: Salisbury (Harare)
        date: 3 March 1978
        text: Smith, Muzorewa, Sithole and Chirau signed the internal settlement here.
        lonlat: [31.046, -17.832]
      - kind: air
