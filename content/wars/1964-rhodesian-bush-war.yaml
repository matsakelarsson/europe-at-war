id: rhodesian-bush-war
name: Rhodesian Bush War
start: "1964-07-04"
end: "1979-12-21"
tier: A
summary: "The war between the white-minority government of Rhodesia and the African nationalist movements that fought for majority rule, known in Zimbabwe as the Second Chimurenga or the liberation war. After Ian Smith’s government declared independence from Britain unilaterally (UDI) on 11 November 1965 to avoid majority rule, the Zimbabwe African National Union (ZANU), with its army ZANLA, and the Zimbabwe African People’s Union (ZAPU), with its army ZIPRA, sent guerrillas from Zambia. The early incursions, at Sinoia in 1966 and Wankie in 1967, were crushed. From December 1972 ZANLA, working with FRELIMO in Mozambique, spread the war through the north-east and, after Mozambique’s independence in 1975, along the whole eastern border, while ZIPRA operated from Zambia and Botswana in the west. Rhodesia answered with conscription, the Fireforce, the Selous Scouts, protected villages and raids on guerrilla camps in Mozambique and Zambia that killed thousands, many of them refugees. ZIPRA shot down two Air Rhodesia airliners. Smith’s internal settlement with Abel Muzorewa produced the unrecognised Zimbabwe Rhodesia in 1979. The Lancaster House Agreement of 21 December 1979 brought a ceasefire, British-run elections that Robert Mugabe’s ZANU won, and the independence of Zimbabwe on 18 April 1980. Some 20,000 people were killed."
countries: [zw, zm, mz, za, bw, gb]
sides:
