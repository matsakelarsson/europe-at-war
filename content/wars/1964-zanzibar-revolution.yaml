id: zanzibar-revolution
name: Zanzibar Revolution
start: "1964-01-12"
end: "1964-04-26"
tier: B
summary: "The overthrow of the Sultan of Zanzibar and his Arab-led government by African insurgents on 12 January 1964, a month after the islands became independent, and the killings of Arabs and South Asians that followed. Zanzibar’s population of about 300,000 included some 230,000 Africans, among them people of mainland origin and Shirazis who claimed Persian descent, about 50,000 Arabs, who owned most of the land, and 20,000 South Asians. In elections in 1961 and 1963 the African-led Afro-Shirazi Party (ASP) won the most votes but, under a constituency map drawn to its disadvantage, not a majority of seats, and the Zanzibar Nationalist Party and its ally formed the government that took Zanzibar to independence on 10 December 1963 under Sultan Jamshid bin Abdullah. Before dawn on 12 January 1964 some 600–800 poorly armed men, many from the ASP Youth League and joined by recently dismissed policemen, led by John Okello, a Ugandan labourer and self-styled “field marshal”, seized the police armouries, the radio station and the airstrip; the Sultan fled by yacht. Gangs then killed Arabs and South Asians across Unguja, looting their property and raping women. Estimates of the dead range from several hundred to 20,000; Western newspapers at the time gave 2,000–4,000. A Revolutionary Council under the ASP leader Abeid Karume proclaimed the People’s Republic of Zanzibar and Pemba. Britain and the United States evacuated their citizens and Britain drew up intervention plans it never carried out; the Soviet Union, China and East Germany recognised the new government at once. Karume sidelined Okello, who was barred from the islands in March, and on 26 April 1964 Zanzibar united with Tanganyika in what became the United Republic of Tanzania."
