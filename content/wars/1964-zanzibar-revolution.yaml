steps:
  - title: The night of 12 January
    date: 12 January 1964
    when: "1964-01-12"
    borders: "1964-01-11"
    countries: [tz]
    view:
      center: [39.25, -6.10]
      size: [90, 90]
    body:
      - "Independence on 10 December 1963 left power with the government of Prime Minister Muhammad Shamte Hamadi, backed by the Zanzibar Nationalist Party (ZNP) and the Zanzibar and Pemba People’s Party (ZPPP), although the ASP, led by Abeid Karume, had won 54 per cent of the vote in July 1963. The government banned the radical Umma Party and dismissed policemen of mainland origin, leaving it with a small, untested force. John Okello, a Ugandan who had come to Pemba in 1959 and become an ASP Youth League organiser, had been planning a rising for months; Karume and the Umma leader Abdulrahman Babu were on the mainland when it began."
      - "At about 3 a.m. on 12 January 1964 some 600–800 men armed with spears, machetes and a few guns attacked the police stations of Unguja. Okello led the assault on the police headquarters at Ziwani, the largest armoury on the island, and the insurgents took the radio station, from which Okello broadcast at about 7 a.m. as “the field marshal”. Within six hours they held the telegraph office and the main government buildings of Zanzibar Town, and they took the airstrip at 2.18 p.m. Only the Malindi police station near the harbour, under the British police commissioner J. M. Sullivan, held out until the afternoon, when it ran out of ammunition. Sultan Jamshid, Shamte and members of the cabinet escaped on the royal yacht Seyyid Khalifa; the Sultan’s appeals to Kenya and Tanganyika for troops failed, and British forces in Kenya stood by but did not move."
