  - title: The killings and the union with Tanganyika
    date: January – April 1964
    when: "1964-04-26"
    borders: "1964-04-26"
    countries: [tz]
    body:
      - "Over the following days gangs armed with knives, spears and machetes killed Arabs and South Asians across Unguja, raped women and looted property, while Okello urged them on in radio broadcasts; Europeans were spared on his orders. Estimates of the dead range from several hundred to 20,000, and Western newspapers reported 2,000–4,000; the violence did not spread to Pemba. An estimated 10,000 people fled the islands. A Revolutionary Council of the ASP and the Umma Party made Karume president, Abdullah Kassim Hanga prime minister and Babu foreign minister, renamed the country the People’s Republic of Zanzibar and Pemba, banished the Sultan and banned the ZNP and ZPPP. The destroyer USS Manley arrived on 13 January to evacuate American citizens and was allowed to do so on 15 January."
      - "The new government’s ties to the Soviet Union, China and East Germany alarmed Britain and the United States, and Britain drew up plans for intervention that were never carried out. On 20 January the Tanganyika Rifles mutinied in Dar es Salaam, and soldiers in Uganda and Kenya followed; at their governments’ request British troops put the mutinies down within days. In Zanzibar Karume moved against Okello, whose followers were disarmed; on 11 March Okello was stripped of his rank and refused entry to the islands. Karume and Tanganyika’s President Julius Nyerere then agreed a union: the Articles of Union were signed on 22 April, and on 26 April 1964 the United Republic of Tanganyika and Zanzibar came into being, renamed Tanzania on 29 October. Zanzibar kept its own government and president, and Karume ruled it until his assassination in 1972."
