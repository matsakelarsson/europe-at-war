notes:
  - "The death toll is disputed and was long ignored in Tanzania: estimates range from “hundreds” to 20,000, and the highest figures may be inflated by Okello’s own boasts on the radio. An Italian film crew filmed mass graves from a helicopter for the documentary Africa Addio, the only known film of the killings. The official Zanzibari history credits the revolution to Karume and the ASP; most historians give Okello and the Youth League the leading role."
