  - title: Habré, Malloum and the battle of N’Djamena
    date: August 1978 – November 1979
    when: "1979-02-12"
    borders: "1979-02-12"
    countries: [td, ly, fr, ng]
    body:
      - "To face Goukouni and Libya, Malloum made peace with Habré. Under a Fundamental Charter signed on 25 August 1978 Habré became prime minister on 29 August, and his FAN fighters moved into N’Djamena alongside the largely southern national army. The two men soon quarrelled over power and over the place of the north and the Muslims in the state."
      - "On 12 February 1979, after a general strike called by Habré, fighting broke out in the capital between the FAN and Malloum’s army. Habré’s men took most of the city, while French troops held the European quarter and the airport and did not intervene; on 19 February Goukouni’s fighters joined Habré. The army withdrew south, and estimates of the dead in the capital range from about 2,000 to 5,000, with some 60,000–70,000 people displaced. In the following weeks thousands of Muslims, many of them traders from the north, were killed in the towns of the south, and southerners were killed in the north and centre; Lieutenant Colonel Wadel Abdelkader Kamougué took control of the south."
      - "Nigeria, Chad’s great neighbour, called the factions to Kano, where an accord signed on 16 March 1979 led Malloum to resign and go into exile on 23 March. Further talks at Kano and Lagos, with eleven factions present, ended in the Lagos Accord of 21 August 1979, which created a Transitional Government of National Unity (GUNT) under Goukouni as president, with Habré as defence minister and Kamougué as vice-president; it took office on 10 November. Each leader kept his own army, and within months the GUNT’s factions were fighting each other in the capital."
    facts:
      - [Habré prime minister, "29 August 1978"]
      - [Fighting in N’Djamena, "from 12 February 1979"]
      - [Lagos Accord, "21 August 1979"]
