notes:
  - "Chad’s capital was called Fort-Lamy until 1973, when Tombalbaye renamed it N’Djamena. The north (Borkou-Ennedi-Tibesti, the BET) is the land of the Toubou (Teda and Daza, or Gorane); the centre and east are home to Arabs, Ouaddaïans and many other Muslim peoples; the Sara and other peoples of the south, largely Christian or of local faiths, had been favoured in schools and the colonial service."
  - Casualty figures for this war are rough estimates. Estimates of the deaths caused by the French and Chadian operations of 1968–1971 alone range from about 2,000 to 10,000, many of them civilians; some 50 French soldiers died in 1969–1972 and 18 more in 1978–1980.
