  - title: Aouzou, the Claustre affair and the fall of Tombalbaye
    date: 1972–1975
    when: "1973"
    borders: "1975-04-13"
    countries: [td, ly, fr]
    body:
      - "In 1972 Tombalbaye changed course: he broke off relations with Israel, signed a treaty of friendship with Libya in December and received Libyan aid, and Gaddafi stopped backing FROLINAT. About six months later Libyan troops moved into the Aouzou Strip, the northern edge of the Tibesti and Borkou, and built an airbase north of the oasis of Aouzou. Libya claimed the strip under a Franco-Italian treaty of 1935 that was never ratified; Chad maintained that its border was the one France and Libya had confirmed in 1955. Whether Tombalbaye secretly ceded the strip was disputed for twenty years, until the International Court of Justice ruled for Chad in 1994."
      - "At home Tombalbaye launched a campaign of “authenticity”: Fort-Lamy became N’Djamena in 1973, Chadians were told to drop Christian names, and southern civil servants were made to undergo the yondo initiation rites of the Sara. He purged the army and jailed its chief of staff, Félix Malloum, while the great Sahel drought of the early 1970s ruined herders and farmers."
      - "In the north the Toubou rebels held out. On 21 April 1974 fighters of Habré and Goukouni raided Bardaï and seized the French archaeologist Françoise Claustre and two other Europeans; the wife of one of them was killed. Habré had the French officer sent to negotiate, Pierre Galopin, executed in April 1975. The affair embarrassed France and was not ended until Goukouni’s faction released Claustre in January 1977."
      - "On 13 April 1975 army and gendarmerie units attacked the presidential palace in N’Djamena and killed Tombalbaye. A Supreme Military Council under Malloum, freed from prison, took power on 15 April. Malloum denounced the Libyan occupation of Aouzou, and Gaddafi resumed his support for the rebels."
    facts:
      - [Libyan occupation of the Aouzou Strip, "1973"]
      - [Claustre kidnapped at Bardaï, "21 April 1974"]
      - [Tombalbaye killed, "13 April 1975"]
