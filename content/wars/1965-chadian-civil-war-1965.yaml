steps:
  - title: Taxes, Mangalmé and the founding of FROLINAT
    date: 1962–1966
    when: "1965-11-01"
    borders: "1966-06-22"
    countries: [td, sd]
    body:
      - "Chad became independent on 11 August 1960 under François Tombalbaye, a Sara from the south, whose Chadian Progressive Party (PPT) became the only legal party in 1962. Southerners, who had been favoured by French schools and the colonial service, filled the new state’s offices and army, while the Muslim north and centre felt shut out. Opponents were jailed by the thousands, and demonstrations in Fort-Lamy in September 1963 were put down with between 19 and 100 dead. In 1964 Tombalbaye raised taxes and imposed a “national loan”, collected by force by officials and soldiers, many of whom kept part of it."
      - "On 1 November 1965 at Mangalmé, in the Guéra hills, villagers rose against the tax collectors; more than 500 people were killed, among them a member of the National Assembly and other officials. Historians usually date the start of the civil war to these riots. In 1966 peasant revolts spread through the Guéra, Batha, Ouaddaï and Salamat, and unconfirmed French reports said that the army killed between 250 and 400 people near Lake Fitri. In the far north, where French military administration had ended in January 1965, a brawl at Bardaï in September 1965 led the sub-prefect to humiliate and arrest Toubou notables, among them the derde, the spiritual head of the Teda, and his son Goukouni Oueddei; in December 1966 the derde fled to Libya with about a thousand followers."
      - "On 22 June 1966, at Nyala in Sudanese Darfur, 24 delegates of exiled Chadian groups founded the National Liberation Front of Chad (FROLINAT) under Ibrahim Abatcha, a radical from the Ouaddaï. Its programme called for the overthrow of Tombalbaye, an end to French bases and influence, equality for Arabic and the Muslim regions, and land and tax reform. Sudan gave it a refuge, and its fighters began to organise the scattered revolts in the centre and east."
    facts:
      - [Riots at Mangalmé, "1 November 1965"]
      - [FROLINAT founded, "22 June 1966, Nyala"]
