id: chadian-civil-war-1965
name: Chadian Civil War (1965–1979)
start: "1965-11-01"
end: "1979-11-10"
tier: A
summary: "The first civil war of independent Chad, between the governments of François Tombalbaye and Félix Malloum in Fort-Lamy (N’Djamena from 1973) and rebels of the Muslim centre, east and north. Tombalbaye’s one-party state, dominated by southerners, raised taxes that were collected by force, and tax riots at Mangalmé in November 1965 began a peasant revolt that spread across the centre and east. In 1966 exiles in Sudan founded the National Liberation Front of Chad (FROLINAT), and from 1968 Toubou fighters in the Tibesti under Goukouni Oueddei and later Hissène Habré joined the rebellion. France intervened in 1968–1972 and drove the rebels back at the cost of thousands of lives, mostly Chadian. Libya, which occupied the Aouzou Strip in the far north in 1973, armed the rebels; FROLINAT split into rival armies. Tombalbaye was killed in a coup in 1975. In 1978 Goukouni’s forces, with Libyan support, took Faya-Largeau and advanced on the capital until French troops stopped them; Habré then joined the government as prime minister and in February 1979 turned on Malloum. The battle for N’Djamena and the killings that followed in the north and south left thousands dead, the state fell apart into factions, and the agreements of Kano and Lagos brought Goukouni to power at the head of a government of national unity in November 1979. Its collapse began the Chadian–Libyan war."
