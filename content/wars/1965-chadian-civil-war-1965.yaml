  - title: The rebellion spreads and France intervenes
    date: 1967–1972
    when: "1968-03"
    borders: "1969-04-15"
    countries: [td, fr, ly]
    body:
      - "FROLINAT’s First Liberation Army spread through the Batha, Salamat, Ouaddaï and Guéra, ambushing patrols and killing officials and chiefs who sided with the government; Tombalbaye answered with reprisals and with a new security force, the Compagnies Tchadiennes de Sécurité. Abatcha was killed in combat near Abéché on 11 February 1968. In March 1968 the Toubou soldiers of the Nomad Guard at Aouzou, in the Tibesti, mutinied and joined rebels besieging the post; relief columns from Bardaï failed, and this rising became FROLINAT’s Second Liberation Army in the north, where Goukouni Oueddei rose to lead it."
      - "Under its defence agreements France sent aircraft to drop supplies to the besieged garrison of Aouzou and to support the Chadian relief column, which reached the post but withdrew with its garrison, leaving the area to the rebels. In April 1969 France began a much larger intervention, known as Operation Limousin and later Opération Bison, under General Michel Arnaud and then General Édouard Cortadellas, with Foreign Legion and marine units and helicopters, together with a mission to reform the Chadian administration and its taxes. In late 1969 and 1970 the French and Chadian forces broke up the rebels’ concentrations in the centre and pushed them into the hills and the desert. The intervention officially ended in June 1971, though French units stayed in the BET until 1972. Estimates of the dead range from about 2,000 to 10,000, many of them civilians; some 50 French soldiers were killed."
      - "FROLINAT was weakened and divided. Abba Siddick, who took over its leadership in 1969 and worked from Tripoli and Algiers, was rejected by the fighters of the north. In 1971 Goukouni’s Second Liberation Army broke with him, and Hissène Habré, a Gorane from Faya who had studied in Paris and served as a sub-prefect, joined Goukouni. Libya, under Muammar Gaddafi since 1969, gave the rebels arms and a base, and in August 1971 Tombalbaye broke off relations with Libya after an attempted coup that he blamed on it."
    facts:
      - [Death of Ibrahim Abatcha, "11 February 1968"]
      - [French intervention (Limousin, then Bison), "April 1969 – 1972"]
