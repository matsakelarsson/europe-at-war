  - title: Goukouni’s offensive and Opération Tacaud
    date: 1976–1978
    when: "1977"
    borders: "1978-05-18"
    countries: [td, ly, fr]
    body:
      - "In 1976 Habré and Goukouni split. Habré rejected Libya’s hold on Aouzou and took his men east as the Armed Forces of the North (FAN), while Goukouni’s People’s Armed Forces (FAP), the main body of FROLINAT in the north, accepted Libyan arms. In 1977 the FAP took Bardaï, which surrendered on 4 July after a long siege, and Zouar, and attacked Ounianga Kébir, which held out with the help of French advisers. By the end of the year the government held little in the BET beyond Faya-Largeau and Fada."
      - "On 29 January 1978 the FAP began the Ibrahim Abatcha offensive against Faya-Largeau, Fada and Ounianga Kébir. Faya-Largeau fell on 18 February: some 2,500 rebels, backed by Libyan troops whose numbers are disputed, with estimates up to 4,000, defeated a garrison of about 5,000 and took many of them prisoner. Malloum restored relations with Libya at Sabha and accepted a ceasefire in the Benghazi accord of March 1978, but FROLINAT columns pushed south towards N’Djamena."
      - "France answered with Opération Tacaud, launched on 20 February 1978: marine and Foreign Legion units, armoured cars and Jaguar strike aircraft. On 18–19 May at Ati, some 380 km east of the capital, French and Chadian troops drove off a FROLINAT attack after two days of fighting, and on 31 May at Djedaa they routed another force, though a Jaguar was shot down. The advance was stopped. Tacaud lasted until May 1980; 18 French soldiers were killed and two Jaguars lost."
    facts:
      - [Fall of Faya-Largeau, "18 February 1978"]
      - [Opération Tacaud, "20 February 1978 – May 1980"]
      - [Battle of Ati, "18–19 May 1978"]
