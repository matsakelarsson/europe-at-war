id: communist-insurgency-in-thailand
name: Communist insurgency in Thailand
start: "1965-08-07"
end: "1983"
tier: C
summary: "The guerrilla war of the Communist Party of Thailand (CPT) against the Thai state. The party, founded in 1942 and banned under anti-communist laws, followed Mao Zedong’s line, broadcast from China and trained its cadres in China, North Vietnam and Laos. It dates its armed struggle from a clash with police at Na Bua in Nakhon Phanom province on 7 August 1965, “the day the guns spoke”. The war was fought above all in the poor north-east (Isan), in the northern hills among the Hmong and other highland peoples, around Phu Hin Rong Kla on the borders of Phitsanulok, Loei and Phetchabun, and in the south around Phatthalung and Surat Thani. The government, backed by American aid and advisers, answered with its Communist Suppression Operations Command, rural development and armed village scouts; in the “Red Drum” killings in Phatthalung in 1972, security forces burned suspected communists in oil drums, with estimates of the dead ranging from several hundred to about 3,000. After the massacre of students at Thammasat University in Bangkok on 6 October 1976 (46 dead by the official count) and the coup that followed, some 3,000 students and activists joined the party in the jungle, and its armed strength rose to perhaps 10,000–12,000. The movement then collapsed: after Vietnam’s invasion of Cambodia, China drew close to Thailand and closed the party’s radio station in 1979, Vietnam and Laos turned against its pro-Chinese leaders, and the students fell out with the party. Prime Minister Prem Tinsulanonda’s Order 66/2523 of April 1980 offered amnesty and a political path, thousands surrendered, and by 1983 the insurgency was over. Several thousand people were killed on both sides."
