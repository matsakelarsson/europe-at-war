  - title: Qaboos, Mirbat and the end of the rebellion
    date: 1970–1976
    when: "1970-07-23"
    borders: "1975-12-11"
    countries: [om, ye, ir, gb, jo]
    body:
      - On 23 July 1970 Said bin Taimur was overthrown in a palace coup, with British backing, by his son Qaboos, who renamed the country the Sultanate of Oman. Qaboos offered an amnesty, began to build schools, clinics and wells in Dhofar, and enlarged the army. The SAS raised firqat, units of surrendered rebels who fought for the government in their own tribal areas. On 19 July 1972 some 250 rebels attacked the small garrison of Mirbat, held by nine SAS soldiers and a few dozen Omani gendarmes and tribal guards; with air support the defenders held, and the rebels lost dozens of fighters.
      - Iran’s Shah sent a brigade in 1973, rising to some 4,000 troops, and Jordan sent a battalion. Army lines of barbed wire and mines, the Hornbeam Line and later the Damavand Line built by the Iranians after they retook Rakhyut in January 1975, cut the rebels off from their supplies in South Yemen. In October 1975 Omani forces captured the last rebel strongholds near the border, and the air force struck Hauf. On 11 December 1975 Qaboos declared the war over, and a ceasefire with South Yemen followed in March 1976.
    facts:
      - [Qaboos takes power, "23 July 1970"]
      - [Battle of Mirbat, "19 July 1972"]
      - [Rakhyut retaken by Iranian troops, "5 January 1975"]
      - [War declared over, "11 December 1975"]
