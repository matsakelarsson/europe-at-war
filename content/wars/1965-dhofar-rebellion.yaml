id: dhofar-rebellion
name: Dhofar Rebellion
start: "1965-06-09"
end: "1976-03-11"
tier: B
summary: An insurgency in Dhofar, the mountainous southern province of the Sultanate of Muscat and Oman. It began among the Jebali tribes as a revolt against the neglect and harsh rule of Sultan Said bin Taimur, led from 1965 by the Dhofar Liberation Front, and from 1968, under the name Popular Front for the Liberation of the Occupied Arabian Gulf (PFLOAG), it became a Marxist movement supplied by South Yemen, China and the Soviet Union. By 1970 the rebels held almost all of Dhofar outside the town of Salalah. That year Said was overthrown by his son Qaboos, who combined reforms and an amnesty with a counter-insurgency campaign led by British officers and the SAS, and later with troops from Iran and Jordan. The rebels were pushed back towards the South Yemeni border, and Qaboos declared the war won in December 1975. Estimates of the dead range from a few thousand to about 10,000.
countries: [om, ye]
sides:
  - id: om
    name: Sultanate of Oman and its allies (Britain, Iran, Jordan)
    polities: [oman, united-kingdom, persia, jordan]
    ink: red
    moves: Omani and allied moves
    success: Omani and allied success
  - id: dlf
