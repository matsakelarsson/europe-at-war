notes:
  - The origins of the revolt go back to a tribal rising in 1962–1963; the first attack of the Dhofar Liberation Front came on 9 June 1965. The end is dated variously from Qaboos’s declaration of victory on 11 December 1975 to the ceasefire with South Yemen in March 1976; isolated rebel groups held out for some years.
  - Casualty figures are uncertain and not well sourced. One compilation gives 187 Omani, 719 Iranian and 24 British dead and about 1,400 rebels killed; other estimates of all deaths run to about 10,000.
  - The rebel areas are drawn approximately. Britain’s role was kept largely secret at the time.
