steps:
  - title: The revolt in the mountains
    date: 1965–1970
    when: "1965-06-09"
    borders: "1970-07-22"
    countries: [om, ye]
    body:
      - Said bin Taimur ruled Oman as a closed country, with almost no schools, hospitals or roads, and he lived in Salalah, the capital of Dhofar, whose Jebali mountain tribes, speaking South Arabian languages, felt themselves apart from the rest of Oman. Dhofari exiles working in the Gulf founded the Dhofar Liberation Front, which began attacking government posts and oil company vehicles in June 1965. In April 1966 soldiers of the sultan’s own guard tried to kill him.
      - After the British left Aden in 1967, the new Marxist government of South Yemen gave the rebels a safe haven and supply route across the border. At a congress at Hamrin in September 1968 the movement adopted Marxism-Leninism and renamed itself the Popular Front for the Liberation of the Occupied Arabian Gulf, aiming at revolution throughout the Gulf monarchies; its cadres, some trained in China, also tried to uproot tribal and religious customs. In 1969 it took the coastal town of Rakhyut, and by 1970 the sultan’s small army held little more than Salalah and its plain.
    facts:
      - [First DLF attack, "9 June 1965"]
      - [Hamrin congress, "September 1968"]
      - [Rakhyut taken by the rebels, "August 1969"]
