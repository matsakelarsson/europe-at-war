steps:
  - title: The April Revolution
    date: 24–28 April 1965
    when: "1965-04-24"
    borders: "1965-04-24"
    countries: [do]
    view:
      center: [-69.83, 18.48]
      size: [50, 40]
    body:
      - "Rafael Trujillo, dictator since 1930, was assassinated on 30 May 1961. In December 1962 Juan Bosch of the Dominican Revolutionary Party (PRD), a writer who had returned after more than twenty years in exile, won the country’s first free election in decades, but his reformist constitution of 1963 alarmed the army, the Church and the business elite, and the military overthrew him on 25 September 1963. A civilian triumvirate, led from late 1963 by Donald Reid Cabral, governed with the army’s backing, while a group of younger officers around Colonel Rafael Fernández Domínguez plotted to bring Bosch back."
      - "On 24 April 1965 the plotters seized the army chief of staff and two barracks, and José Francisco Peña Gómez of the PRD called on the radio for people to come out into the streets. Reid Cabral resigned the next day and José Rafael Molina Ureña was sworn in as provisional president until Bosch could return from Puerto Rico. The senior generals at the San Isidro air base under General Elías Wessin y Wessin refused, and their aircraft strafed the National Palace. The Constitutionalists handed out weapons to thousands of civilians."
      - "On 27 April Wessin’s tanks and infantry crossed the Duarte Bridge over the Ozama into the city. Molina Ureña took refuge in an embassy, but Colonel Francisco Caamaño rallied the Constitutionalist soldiers and armed civilians, who stopped the tanks in the streets and destroyed or captured many of them. The Constitutionalists held most of the capital and soon took the Ozama Fortress, the police headquarters, while on 28 April a Loyalist junta at San Isidro asked the United States for troops."
    facts:
      - [Assassination of Trujillo, "30 May 1961"]
      - [Coup against Bosch, "25 September 1963"]
      - [Constitutionalist revolt, "24 April 1965"]
      - [Battle of the Duarte Bridge, "27 April 1965"]
