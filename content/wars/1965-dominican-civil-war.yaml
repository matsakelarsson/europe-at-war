  - title: The American intervention
    date: 28 April – June 1965
    when: "1965-04-28"
    borders: "1965-05-21"
    countries: [do, us]
    view:
      center: [-69.83, 18.48]
      size: [50, 40]
    body:
      - "On the evening of 28 April President Johnson ordered Marines ashore, at first to evacuate Americans and other foreigners from the Hotel Embajador; on 30 April paratroopers of the 82nd Airborne Division landed at San Isidro. Johnson justified the intervention by the danger of a “second Cuba”, citing a list of communists among the rebels. American troops set up an International Security Zone around the embassies in the west of the city, and on 3 May they opened a corridor, the “line of communication”, from the Duarte Bridge to the security zone, cutting the Constitutionalists in Ciudad Nueva off from the northern districts and the rest of the country. Some 22,000 American troops were ashore by mid-May."
      - "On 4 May the members of Congress elected in 1962 chose Caamaño as constitutional president; on 7 May the United States backed a rival Government of National Reconstruction under General Antonio Imbert Barrera, one of Trujillo’s assassins. On 6 May the Organization of American States voted narrowly to form an Inter-American Peace Force, which took command in late May under the Brazilian general Hugo Panasco Alvim, with about 1,750 Latin American troops serving alongside the Americans. Between 13 and 21 May Imbert’s forces, in Operation Clean-Up (Operación Limpieza), took the northern districts and the radio station from the Constitutionalists; Fernández Domínguez was killed attacking the National Palace on 19 May. On 15–16 June the heaviest fighting of the intervention broke out between the Constitutionalists and American troops, who advanced several blocks into Ciudad Nueva."
    facts:
      - [Marines land, "28 April 1965"]
      - [82nd Airborne lands at San Isidro, "30 April 1965"]
      - [Line of communication opened, "3 May 1965"]
      - [Inter-American Peace Force created, "6 May 1965"]
