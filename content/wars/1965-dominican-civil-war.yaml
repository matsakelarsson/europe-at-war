notes:
  - "Casualty figures vary widely between sources. Loyalist losses are given as about 500 soldiers and 325 police killed, and Constitutionalist losses as about 600 soldiers killed besides an unknown number of armed civilians; estimates of all Dominican casualties, killed and wounded, run to about 6,000. American losses were 27 killed in action and 44–47 dead from all causes."
  - "The American claim that communists had taken over the revolt rested on a list of 53, later 58, alleged communists among the rebels, which journalists found to be unreliable; the intervention was widely criticised in Latin America and in the US Senate."
