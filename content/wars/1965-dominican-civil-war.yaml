  - title: Reconciliation and elections
    date: June 1965 – September 1966
    when: "1965-09-03"
    borders: "1965-09-03"
    countries: [do, us]
    body:
      - "An OAS committee led by the American diplomat Ellsworth Bunker negotiated through the summer. On 31 August both sides signed the Act of Dominican Reconciliation and an Institutional Act, and on 3 September 1965 Héctor García-Godoy, a diplomat who had served under Trujillo and Bosch, took office as provisional president; Caamaño and Imbert stepped down, and the Constitutionalists handed in their weapons. Clashes went on: on 19 December 1965 army troops attacked Caamaño and his officers at the Hotel Matum in Santiago until the Peace Force intervened. In January 1966 Caamaño and the leading Loyalist officers were sent abroad, Caamaño as military attaché in London."
      - "Bosch returned but campaigned little, fearing for his life, and on 1 June 1966 Joaquín Balaguer, who had been Trujillo’s figurehead president in 1960–1961, won the presidential election with American support. The last troops of the Peace Force left on 21 September 1966. Balaguer governed for the next twelve years, during which hundreds or, by some estimates, thousands of opponents were killed. Caamaño returned secretly in February 1973 at the head of a small guerrilla band and was captured and killed within weeks."
    facts:
      - [Act of Dominican Reconciliation, "31 August 1965"]
      - [García-Godoy provisional president, "3 September 1965"]
      - [Presidential election, "1 June 1966"]
      - [Last foreign troops leave, "21 September 1966"]
