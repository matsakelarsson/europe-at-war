id: dominican-civil-war
name: Dominican Civil War
start: "1965-04-24"
end: "1965-09-03"
tier: B
summary: "The civil war of 1965 in Santo Domingo, also called the April Revolution, between the Constitutionalists, officers and armed civilians who wanted to restore the elected president Juan Bosch and the constitution of 1963, and the Loyalists of the military establishment, and the American intervention that ended it. Bosch, the first freely elected president after the assassination of the dictator Rafael Trujillo in 1961, had been overthrown by the army in September 1963. On 24 April 1965 a group of officers rose against the civilian triumvirate that followed, crowds poured into the streets and the Constitutionalists, led militarily by Colonel Francisco Caamaño, armed civilians and drove back an attack by Loyalist tanks and aircraft under General Elías Wessin y Wessin at the Duarte Bridge on 27 April. On 28 April President Lyndon Johnson sent in the Marines, to protect American lives and, as he said, to stop a communist takeover; some 22,000 American troops landed, with more offshore, cut the rebel zone in the old city off from the rest of Santo Domingo and opened a corridor across the capital. The Organization of American States joined the occupation with an Inter-American Peace Force of troops from Brazil, Honduras, Paraguay, Nicaragua, Costa Rica and El Salvador. Loyalist forces under the Government of National Reconstruction of General Antonio Imbert Barrera cleared the northern districts in May, and fighting flared again in June, but OAS mediation led to an Act of Reconciliation, and on 3 September 1965 Héctor García-Godoy became provisional president. Joaquín Balaguer defeated Bosch in the elections of 1 June 1966, and the last foreign troops left in September 1966. Estimates of Dominican casualties, killed and wounded, run to about 6,000; the United States lost 27 killed in action and 44–47 dead in all."
