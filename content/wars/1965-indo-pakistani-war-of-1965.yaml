  - title: Grand Slam
    date: 1–6 September 1965
    when: "1965-09-01"
    borders: "1965-09-05"
    countries: [in, pk]
    body:
      - At five in the morning of 1 September 1965 Pakistani armour and infantry attacked across the ceasefire line and the border in the Chhamb sector, south-west of Jammu. Their aim was the bridge at Akhnoor on the Chenab, which carried the only road from Jammu to the Indian forces in Poonch and Rajouri. The outnumbered Indian brigade fell back, and India sent in its air force for the first time, losing several old Vampire jets to Pakistani Sabres.
      - On 2 September command of the Pakistani attack passed from Major-General Akhtar Hussain Malik to Major-General Yahya Khan, a pause that gave India time to bring up reinforcements. Pakistani troops took Chhamb and pushed on to Jaurian, some 15 km from Akhnoor, but did not reach it. On 6 September India opened a new front in the Punjab, and Pakistan had to send its reserves south.
    facts:
      - [Operation Grand Slam, "1–6 September 1965"]
      - [Ground taken by Pakistan, "about 490 km² in the Chhamb sector"]
    markers:
