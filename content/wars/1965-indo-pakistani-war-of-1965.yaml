  - title: Sialkot and Chawinda
    date: 8–22 September 1965
    when: "1965-09-14"
    borders: "1965-09-19"
    countries: [in, pk]
    body:
      - On the night of 7–8 September India’s I Corps, with its 1st Armoured Division, attacked from Jammu into the Sialkot sector, aiming at the Grand Trunk Road behind Sialkot. Pakistan’s 6th Armoured Division and infantry met it in a series of tank battles. India won at Phillora on 11 September, and the Pakistani forces fell back to the railway town of Chawinda.
      - From 14 to 19 September hundreds of tanks fought around Chawinda, in what has often been called the largest tank battle since the Second World War. The Indian attacks were held, with heavy losses on both sides; neutral estimates put tank losses at about 100 Indian and 60 Pakistani. Further south, Indian troops took Dograi on the Ichhogil canal in hand-to-hand fighting on 21–22 September. In the Rajasthan desert Pakistan took Munabao, and India occupied ground in Sindh.
    facts:
      - [Battle of Phillora, "11 September 1965, Indian victory"]
      - [Battle of Chawinda, "14–19 September 1965, Pakistani victory"]
      - [Dograi taken, "21–22 September 1965"]
    markers:
