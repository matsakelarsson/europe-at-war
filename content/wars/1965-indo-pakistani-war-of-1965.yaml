  - title: Lahore and Khem Karan
    date: 6–11 September 1965
    when: "1965-09-06"
    borders: "1965-09-10"
    countries: [in, pk]
    body:
      - On 6 September India’s XI Corps crossed the international border towards Lahore on three axes, from Amritsar along the Grand Trunk Road, through Khalra towards Burki, and from Khem Karan towards Kasur. Its divisions reached the Ichhogil canal, a wide irrigation channel that formed Lahore’s outer defence, and fought at Dograi, Burki and the bridges, but did not cross in force. The same evening the Pakistani air force struck Indian air bases at Pathankot, Adampur and Halwara, and the Indian air force attacked Sargodha the next day. Pakistan marks 6 September as Defence Day.
      - On 8 September Pakistan’s 1st Armoured Division, equipped with American Patton tanks, attacked from Kasur through Khem Karan towards the Beas bridges, to cut off the Indian forces before Lahore. Near the village of Asal Uttar the Indian 4th Mountain Division and an armoured brigade waited in sugar-cane fields flooded by breaching the irrigation channels. Over three days the Pakistani tanks were caught in the mud and destroyed or abandoned; Indian accounts count about 97 destroyed or captured. Khem Karan stayed in Pakistani hands until the end of the war.
      - On the night of 7 September the Pakistani navy shelled the Indian coastal town of Dwarka in Gujarat.
    facts:
