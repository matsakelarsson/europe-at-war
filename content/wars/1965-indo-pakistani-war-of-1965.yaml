steps:
  - title: The Rann of Kutch
    date: April – June 1965
    when: "1965-04-09"
    borders: "1965-04-26"
    countries: [in, pk]
    body:
      - The Rann of Kutch is a salt marsh between Sindh and Gujarat, flooded in the monsoon and dry for the rest of the year. Its northern border had never been marked, and Pakistan claimed roughly the northern half. From early 1965 both sides set up posts there, and in April the clashes grew into fighting between brigades. Indian police beat off a Pakistani attack on Sardar Post on 9 April, but later in the month Pakistani forces with American-supplied Patton tanks took Biar Bet and other Indian posts. The British prime minister, Harold Wilson, arranged a ceasefire and an agreement of 30 June to refer the border to an international tribunal, which in 1968 gave Pakistan about a tenth of the area it claimed.
      - In Kashmir tension had been rising since the theft of a revered relic from the Hazratbal shrine in Srinagar in December 1963, and India was tying Indian-held Kashmir more closely to the union; Sheikh Abdullah was arrested again in May 1965. Pakistan’s foreign minister, Zulfikar Ali Bhutto, and part of its army leadership believed that India had been weakened by its defeat by China, that Kashmiris would rise if given a lead, and that time was against Pakistan as India rearmed.
    facts:
      - [Fighting in the Rann of Kutch, "April 1965"]
      - [Kutch agreement, "30 June 1965"]
      - [Tribunal award, "February 1968"]
    markers:
      - kind: battle
        side: pk
        name: Rann of Kutch
        date: April 1965
        text: Pakistani forces took Indian posts in the north of the Rann. Both sides withdrew under the June agreement.
        lonlat: [69.900, 24.050]
  - title: Operation Gibraltar
    date: August 1965
    when: "1965-08-05"
    borders: "1965-08-28"
    countries: [in, pk]
    body:
      - From 5 August 1965 groups of armed men, mostly Azad Kashmir irregulars and volunteers led by Pakistani officers, crossed the ceasefire line at many points to raid, sabotage and start a rising in Indian-held Kashmir. Most accounts put them at seven to eight thousand. Some reached the outskirts of Srinagar, but the population did not rise, many villagers reported them, and most were killed, captured or driven back within weeks.
      - India answered by crossing the ceasefire line to close the infiltration routes. It took heights near Kargil overlooking the Srinagar–Leh road on 15 August and posts near Tithwal, and on 28 August Indian paratroops captured the Haji Pir pass, cutting the main route between Azad Kashmir’s Poonch and Uri sectors.
    facts:
      - [Infiltration begins, "5 August 1965"]
      - [Infiltrators, "7,000–8,000 by most accounts"]
      - [Haji Pir pass taken, "28 August 1965"]
