  - title: Ceasefire and Tashkent
    date: September 1965 – February 1966
    when: "1965-09-23"
    borders: "1965-09-23"
    countries: [in, pk]
    body:
      - On 20 September the UN Security Council demanded a ceasefire within two days. India accepted at once; Pakistan, running short of ammunition under an American embargo on arms to both countries, accepted too, and the fighting stopped on 23 September. UN observers watched the lines. Independent estimates put the dead at about 3,000 Indian and 3,800 Pakistani soldiers. At the ceasefire India held about 1,840 km² of Pakistani territory, mainly in the Sialkot and Lahore sectors and around Haji Pir, and Pakistan about 540 km² of Indian territory, mainly at Chhamb, Khem Karan and in the desert.
      - The Soviet premier, Alexei Kosygin, brought the Indian prime minister, Lal Bahadur Shastri, and President Ayub Khan together at Tashkent. In the Tashkent Declaration of 10 January 1966 both agreed to withdraw to the positions of 5 August 1965 and to settle disputes peacefully. Shastri died of a heart attack in Tashkent the next night. The withdrawals were completed by 25 February. In Pakistan the return of the gains, Haji Pir among them on the Indian side, was unpopular; Bhutto left the government and began the opposition that brought down Ayub Khan in 1969.
    facts:
      - [UN Security Council Resolution 211, "20 September 1965"]
      - [Ceasefire, "23 September 1965"]
      - [Soldiers killed (independent estimates), "about 3,000 Indian and 3,800 Pakistani"]
      - [Tashkent Declaration, "10 January 1966"]
    markers:
