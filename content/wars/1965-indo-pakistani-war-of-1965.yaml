id: indo-pakistani-war-of-1965
name: Indo-Pakistani War of 1965
start: "1965-08-05"
end: "1965-09-23"
tier: A
summary: "The second war between India and Pakistan over Kashmir, also called the Second Kashmir War. After clashes in the Rann of Kutch in the spring, Pakistan sent several thousand irregulars across the ceasefire line in August 1965 (Operation Gibraltar) in the hope of a rising in Indian-held Kashmir, which did not come. India crossed the line and took the Haji Pir pass, and Pakistan attacked in the Chhamb sector towards Akhnoor. On 6 September India opened a front across the international border towards Lahore and then Sialkot, and great tank battles were fought at Asal Uttar and Chawinda. A UN-demanded ceasefire took effect on 23 September with neither side decisively ahead, and in the Tashkent Declaration of January 1966 both agreed to return to their pre-war positions. Each country still marks the war as a success."
countries: [in, pk]
sides:
  - id: in
    name: India
    polities: [india]
    ink: orange
    moves: Indian moves
    success: Indian success
  - id: pk
    name: Pakistan
    polities: [pakistan]
    ink: green
    moves: Pakistani moves
    success: Pakistani success
notes:
  - Claims of losses, especially of tanks and aircraft, differ widely between Indian and Pakistani sources. Figures given here are the independent estimates cited by the sources, or are marked as one side’s claim.
  - India commemorates the war as a victory in which it stopped Pakistan’s attempts to take Kashmir; Pakistan marks 6 September as Defence Day for the defence of Lahore. Most neutral accounts call the result a stalemate.
