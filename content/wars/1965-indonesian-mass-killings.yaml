id: indonesian-mass-killings
name: 30 September Movement and the Indonesian mass killings
start: "1965-10-01"
end: "1966-03-12"
tier: B
summary: "The failed coup of the 30 September Movement and the mass killings of communists and suspected communists that followed in Indonesia. In the early hours of 1 October 1965 a group of army officers calling itself the 30 September Movement kidnapped and killed six generals of the army high command in Jakarta and announced that it had taken power to protect President Sukarno. Major General Suharto crushed it within a day, and the army blamed the Communist Party of Indonesia (PKI), then the largest communist party outside the communist states. From October 1965 to early 1966 the army, together with civilian militias, Muslim and nationalist youth groups and local vigilantes, killed members and alleged supporters of the PKI and its affiliated unions and peasant, women’s and youth organisations across Java, Bali, Sumatra and other islands. Estimates of the dead range from about 78,500, the official figure of early 1966, to 3 million; most historians accept 500,000 to 1 million. Some 1 to 1.5 million people were imprisoned at one time or another, many for years without trial. The killings destroyed the PKI, which was banned on 12 March 1966, the day after Sukarno signed over much of his authority to Suharto, who went on to rule Indonesia as president until 1998."
