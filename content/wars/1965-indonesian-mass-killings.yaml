  - title: The killings
    date: October 1965 – March 1966
    when: "1965-10-20"
    borders: "1965-12-01"
    countries: [id]
    body:
      - "Within days the army launched a campaign against the PKI, which its newspapers blamed for the murders. Party offices were burned and leaders arrested; Aidit fled to Central Java, where he was captured on 21 November and shot the next day. In Aceh killings began in early October. In mid-October paratroopers of the RPKAD under Colonel Sarwo Edhie Wibowo moved into Central Java, where the PKI was strong, and armed and trained local youth groups; in Boyolali, Klaten, Solo and many other districts, people held in army camps were taken out at night and shot or hacked to death. In East Java the youth wing of the Nahdlatul Ulama, Ansor, together with the army, killed communists in village after village from the second half of October, and bodies floated down the Brantas and other rivers. In Bali, where the PKI and the nationalist PNI were bitter rivals, the killing began after the RPKAD arrived in December; an estimated 80,000 people, about 5 per cent of the island’s population, were killed by early 1966. There were also mass killings in North Sumatra, on the plantations around Medan, and in Flores and Timor."
      - "The victims were members of the PKI and of the peasant union BTI, the labour federation SOBSI, the women’s movement Gerwani and the youth organisation Pemuda Rakyat, schoolteachers, artists and others denounced by neighbours; in some places ethnic Chinese were also killed. The PKI, which had prepared no armed resistance, hardly fought back. Most killings were carried out or organised by the army and by civilians it armed, encouraged or allowed to act, often after lists of names had been drawn up; others grew out of local feuds over land and religion. Western governments were informed: the American embassy passed lists of thousands of names of communists to the army, and American, British and Australian officials welcomed the PKI’s destruction. Estimates of the total range from about 78,500 to 3 million; most historians accept a figure between 500,000 and 1 million."
    facts:
      - [Aidit killed, "22 November 1965"]
      - [RPKAD in Central Java, "from mid-October 1965"]
      - [Killings in Bali, "December 1965 – early 1966, about 80,000 dead"]
      - [Estimated dead, "500,000 – 1,000,000 (range of estimates 78,500 – 3 million)"]
