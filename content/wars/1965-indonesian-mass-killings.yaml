steps:
  - title: The night of 30 September
    date: 1–2 October 1965
    when: "1965-10-01"
    borders: "1965-10-01"
    countries: [id]
    body:
      - "Under Sukarno’s Guided Democracy, power in Indonesia rested on a tense balance between the president, the army and the PKI, which claimed some 3 million members and, with its mass organisations, perhaps 20 million followers. In 1965 the economy was collapsing, the PKI was pressing for land reform and for a “fifth force” of armed workers and peasants, and rumours spread of a “Council of Generals” plotting against Sukarno, who had fallen ill in August. In the early hours of 1 October, troops led by Lieutenant Colonel Untung of the palace guard set out from Halim air base to seize seven generals. Three, among them the army commander Ahmad Yani, were shot dead in their homes; three were taken alive to Lubang Buaya, next to the air base, and killed there. The defence minister, General Abdul Haris Nasution, escaped over a wall, but his five-year-old daughter Ade Irma Suryani was fatally wounded and his aide, Lieutenant Pierre Tendean, was taken in his place and killed. The bodies were thrown into a disused well."
      - "At 7 a.m. the movement announced on state radio that it had acted to forestall a coup by the generals and later named a Revolutionary Council. Major General Suharto, commander of the army’s strategic reserve (Kostrad), whose name had not been on the list, took command of the army; by the evening his troops had retaken the radio station and the centre of Jakarta without a fight, and on 2 October they took Halim, which Sukarno had left for his palace at Bogor. In Central Java officers sympathetic to the movement took over several battalions and killed two colonels in Yogyakarta, but gave up within days. The bodies of the generals were recovered on 4 October and buried on Armed Forces Day, 5 October. Army newspapers accused the PKI and its women’s organisation, Gerwani, of torturing and mutilating them, claims that the autopsies did not bear out."
    facts:
      - [Generals seized, "early hours of 1 October 1965"]
      - [Killed in Jakarta, "six generals, Lieutenant Pierre Tendean, a police officer and Nasution’s daughter"]
      - [Movement defeated in Jakarta, "1–2 October 1965"]
