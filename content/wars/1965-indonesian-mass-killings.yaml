  - title: Supersemar and the prison camps
    date: March 1966 – 1979
    when: "1966-03-11"
    borders: "1966-03-11"
    countries: [id]
    body:
      - "Students’ demonstrations, backed by the army, kept up the pressure on Sukarno, who still defended the PKI. On 11 March 1966, with unidentified troops surrounding the palace in Jakarta, he went to Bogor, where three generals obtained his signature on an order, known as Supersemar, giving Suharto authority to take whatever steps he judged necessary to restore order. The next day Suharto banned the PKI. In March 1967 the provisional parliament stripped Sukarno of his powers and named Suharto acting president; he was elected president in 1968. Sukarno died under house arrest in 1970."
      - "Hundreds of thousands of people were held without trial; estimates of those detained at one time or another run to 1.5 million and more. Most were released in the late 1970s under international pressure, but about 12,000 men classed as hard-core prisoners were sent from 1969 to labour camps on the island of Buru, among them the novelist Pramoedya Ananta Toer; the last were freed in 1979. Former prisoners and their families carried marks on their identity cards and were barred from many jobs for decades. Under the New Order the killings could not be discussed; since 1998 victims’ groups, historians and the International People’s Tribunal held in The Hague in 2015 have documented them, and in 2023 President Joko Widodo expressed regret, but no one has been prosecuted."
    facts:
      - [Supersemar signed, "11 March 1966"]
      - [PKI banned, "12 March 1966"]
      - [Suharto acting president, "12 March 1967"]
      - [Buru prison camps, "1969–1979, about 12,000 prisoners"]
    markers:
