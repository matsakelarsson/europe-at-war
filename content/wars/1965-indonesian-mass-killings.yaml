notes:
  - "Who was behind the 30 September Movement is still debated. Suharto’s New Order taught that the PKI planned a coup, and from 1984 every schoolchild was shown a state film telling that story. In 1971 Benedict Anderson and Ruth McVey of Cornell University argued that it was an internal army affair of junior officers in which the PKI played a minor part. The historian John Roosa concluded from later evidence that the plot was organised by a secret bureau of the PKI under Sjam Kamaruzaman together with party chairman D. N. Aidit, without the knowledge of most of the party, and that it was badly planned. Others have suggested that Suharto, who was not on the list of generals to be seized, knew of the plot in advance. No evidence has shown that the United States organised the movement, but declassified American records show that American, British and Australian officials knew of the killings that followed, welcomed the destruction of the PKI, and that the US embassy passed lists of names of communists to the army."
  - "No full count of the dead exists. A fact-finding commission set up by Sukarno reported 78,500 deaths in early 1966, which its own members thought far too low; the security command (Kopkamtib) later spoke of about 1 million, and the paratroop commander Sarwo Edhie Wibowo claimed 3 million. In 2012 Indonesia’s National Commission on Human Rights found that the killings, imprisonment and other abuses were gross violations of human rights. On 11 January 2023 President Joko Widodo acknowledged and expressed regret for twelve past gross human rights violations, the killings of 1965–1966 among them, without an apology; no one has been tried for them."
