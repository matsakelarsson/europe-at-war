notes:
  - The dates are those usually given, from Kim Il-sung’s speech of 5 October 1966 to the release on 3 December 1969 of three American soldiers whose helicopter had been shot down over the DMZ. Infiltrations and clashes went on, at a lower level, long after.
  - The Pueblo’s position is disputed. The United States has always held that the ship was in international waters, outside the 12-mile limit; North Korea, which claimed wider sea boundaries, says it had entered North Korean territorial waters.
