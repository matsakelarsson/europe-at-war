  - title: Uljin–Samcheok and the end of the campaign
    date: October 1968 – December 1969
    when: "1968-10-30"
    borders: "1968-11-15"
    countries: [kr, kp, us]
    body:
      - On the night of 30 October 1968, 120 men of Unit 124 landed from the sea at eight places between Uljin and Samcheok on the east coast, to set up bases for a guerrilla war in the Taebaek Mountains. They entered villages and held meetings to win over the inhabitants, killing some who resisted, but villagers alerted the authorities. South Korean troops, police and the new reservist militia, flown in by helicopter, hunted the commandos for two months. By the end of December 110 had been killed and 7 captured; about 40 South Korean soldiers and police and 23 civilians were killed, among them a nine-year-old boy, Lee Seung-bok, whose story became a part of the South’s anti-communist teaching.
      - The failure of the landings and the absence of any popular rising led North Korea to scale back the campaign. Its last major attack came on 15 April 1969, Kim Il-sung’s birthday, when North Korean fighters shot down an American EC-121 reconnaissance aircraft over the Sea of Japan (the East Sea), killing all 31 aboard; the United States did not retaliate. By 1969 South Korea had fenced the DMZ, raised a reservist force of more than two million and tightened its control of the population. In all, the conflict cost 299 South Korean soldiers, 81 American soldiers and 47 South Korean civilians killed; North Korea lost at least 397 dead, and more than 2,400 agents were captured in the South.
