steps:
  - title: The DMZ, the Blue House raid and the Pueblo
    date: October 1966 – December 1968
    when: "1968-01-21"
    borders: "1968-01-21"
    countries: [kr, kp, us]
    body:
      - In a speech on 5 October 1966 Kim Il-sung called for a more active struggle against the South, where he expected that guerrilla warfare could succeed while American and South Korean troops were tied down in Vietnam. On 2 November, during a visit to Seoul by President Lyndon Johnson, North Korean troops ambushed an American patrol south of the DMZ and killed six Americans and a Korean soldier serving with them. Clashes along the line multiplied in 1967, when North Korean coastal guns also sank the South Korean patrol ship Dangpo off the east coast, killing 39 of its crew.
      - On 17 January 1968, 31 men of the North Korean Unit 124, dressed as South Korean soldiers, cut through the fence in the American sector of the DMZ and made their way to Seoul to kill President Park Chung-hee. On the night of 21 January police stopped them at a checkpoint less than 100 metres from the Blue House, the presidential residence, and in the gunfight and manhunt that followed 28 of the raiders were killed and one, Kim Shin-jo, was captured; one or two escaped. Some 68 South Koreans, many of them civilians, and three or four Americans were killed. In reply South Korea secretly formed a unit of its own, Unit 684, trained on the island of Silmido to kill Kim Il-sung; it was never sent, and its men rose in revolt in 1971.
      - On 23 January North Korean patrol boats and MiGs attacked the American electronic intelligence ship Pueblo off Wonsan, killed one sailor and took the ship and its 82 surviving crew into port. The crew were held for eleven months and released at Panmunjom on 23 December 1968, after the United States signed an apology that it repudiated in the same breath. North Korea keeps the ship in Pyongyang as a museum.
