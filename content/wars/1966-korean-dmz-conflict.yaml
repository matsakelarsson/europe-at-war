id: korean-dmz-conflict
name: Korean DMZ conflict
start: "1966-10-05"
end: "1969-12-03"
tier: B
summary: "A low-level war between North Korea and the South Korean and American forces in South Korea from 1966 to 1969, sometimes called the Second Korean War. With the United States and South Korea heavily committed in Vietnam, Kim Il-sung set out in October 1966 to challenge the armistice and to stir up a guerrilla movement in the South. North Korean units ambushed patrols along the Demilitarized Zone, landed agents on the coasts and, in January 1968, sent a commando unit to kill President Park Chung-hee in Seoul; two days later North Korean warships seized the American intelligence ship Pueblo off Wonsan. In late 1968 some 120 commandos landed on the east coast between Uljin and Samcheok to set up guerrilla bases in the mountains and were hunted down. South Korea answered with fences, patrols, a reservist militia and secret raids of its own across the line. The fighting killed 299 South Korean and 81 American soldiers and 47 South Korean civilians, and North Korea lost at least 397 dead; the uprising Kim hoped for never came, and the campaign died down in 1969."
countries: [kr, kp, us]
sides:
  - id: rok
    name: South Korea and the United States
    polities: [south-korea, united-states]
    ink: blue
    moves: South Korean and American moves
    success: South Korean and American success
  - id: nk
