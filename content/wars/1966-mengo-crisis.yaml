id: mengo-crisis
name: Mengo crisis (Buganda crisis)
start: "1966-02-22"
end: "1966-05-24"
tier: C
summary: "The power struggle between Uganda’s prime minister, Milton Obote, and the Kabaka (king) of Buganda, Mutesa II, which ended with the army storming the Kabaka’s palace on Mengo Hill in Kampala in May 1966. At independence in 1962 Buganda kept wide autonomy in a federal constitution, and in 1963 Mutesa became Uganda’s ceremonial president. Relations broke over the “lost counties”, two counties that Buganda had gained from Bunyoro in the colonial period and that voted to return to Bunyoro in a referendum on 4 November 1964, and over a scandal raised in Parliament in February 1966, when Daudi Ochieng accused Colonel Idi Amin, Obote and two ministers of profiting from gold and ivory from the Congo. Obote answered with what amounted to a coup against his own government: on 22 February 1966 he had five ministers arrested at a cabinet meeting, on 24 February he suspended Mutesa as president and took full powers himself, and in April he imposed a new constitution that ended Buganda’s federal status. On 20 May the Buganda parliament, the Lukiiko, demanded that the central government leave Buganda’s soil within ten days. The government issued an emergency decree and sent troops into the kingdom, and on 24 May 1966 troops under Amin attacked the Lubiri palace at Mengo, defended by 120–160 guards with old rifles and a few machine guns. The guards held out until about 2 pm; Mutesa escaped over the wall, hid at Rubaga Cathedral and fled via Burundi to Britain, where he died in 1969. Volunteers carried over 200 bodies to the morgue and soldiers buried others in mass graves; some estimates put the dead at up to 1,000. The 1967 constitution abolished Uganda’s kingdoms, and the army, and Amin within it, gained the weight that let Amin seize power in 1971. The Buganda monarchy was restored in 1993."
