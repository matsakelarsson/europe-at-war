notes:
  - The air attacks on Aizawl in March 1966 are the only time India has used its air force against its own territory. Their extent was long denied by the government and is still disputed; Mizo accounts describe days of bombing that burned much of the town.
  - There is no agreed total for the deaths of the twenty-year conflict. The grouping of villages, which uprooted much of the rural population, is remembered in Mizoram as a time of great hardship.
