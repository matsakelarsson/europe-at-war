id: mizo-uprising
name: Mizo National Front uprising
start: "1966-02-28"
end: "1986-06-30"
tier: B
summary: "An armed rising for the independence of the Mizo Hills, then a district of Assam, led by the Mizo National Front (MNF) of Laldenga, and the twenty-year insurgency that followed; in Mizoram it is remembered as the Rambuai, the troubled years. The MNF grew out of anger at the government’s handling of the famine of 1959. On the night of 28 February 1966 its fighters attacked government posts across the district and on 1 March declared independence. The Indian army retook the towns within weeks, with the air force bombing and strafing Aizawl, and in the following years the government forced most of the villagers into guarded grouping centres. The insurgency continued from bases in East Pakistan and Burma until the Mizoram Peace Accord of 30 June 1986, after which Laldenga became chief minister of the new state of Mizoram."
countries: [in]
