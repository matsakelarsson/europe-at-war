  - title: Grouping, war and the accord
    date: 1967–1987
    when: "1986-06-30"
    borders: "1986-06-30"
    countries: [in, bd, mm]
    body:
      - The MNF turned to guerrilla war, ambushing convoys and patrols. From 1967 the government moved villagers from the hills into guarded grouping centres along the roads to cut the guerrillas off from food and recruits; the resettlement disrupted farming and caused great hardship, and was challenged in the courts. The MNF kept bases in the Chittagong Hill Tracts of East Pakistan until Bangladesh’s independence in 1971, and then in Burma.
      - The Mizo Hills became the union territory of Mizoram on 21 January 1972. Talks began in the mid-1970s and failed several times, and in 1975 MNF gunmen killed three senior police officers in Aizawl. The Mizoram Peace Accord was signed on 30 June 1986 by Laldenga and the government of Rajiv Gandhi. The MNF gave up arms and the demand for independence, its fighters were amnestied, and Mizoram became a state on 20 February 1987 with Laldenga as chief minister. The settlement has held, and Mizoram has since been one of the most peaceful states of the north-east.
