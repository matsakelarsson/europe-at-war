steps:
  - title: Operation Jericho
    date: February – March 1966
    when: "1966-02-28"
    borders: "1966-03-01"
    countries: [in]
    body:
      - In 1959 the flowering of the bamboo forests, which happens about every fifty years, brought a plague of rats that ate the crops of the Mizo Hills, and famine followed. A relief organisation, the Mizo National Famine Front, became in October 1961 the Mizo National Front under Laldenga, demanding independence. Anger at neglect by the Assam government and at the imposition of Assamese as the state’s official language fed its support, and from 1963 it received arms and training in East Pakistan.
      - On the night of 28 February 1966, in an operation code-named Jericho, MNF volunteers attacked the posts of the Assam Rifles and the Border Security Force and government offices in Aizawl, Lunglei, Champhai, Kolasib, Vairengte and other places. They seized the treasury at Aizawl and took several posts, and on 1 March Laldenga declared independence. The Assam Rifles headquarters at Aizawl held out under siege.
      - India sent troops from Silchar, and on 5 and 6 March fighter aircraft attacked Aizawl and nearby villages with guns and rockets. The army relieved Aizawl around 7 March and by 25 March had retaken all the places the MNF had seized. Its fighters withdrew into the forests.
