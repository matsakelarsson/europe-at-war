steps:
  - title: Omugulugwombashe
    date: 1960–1966
    when: "1966-08-26"
    borders: "1966-08-26"
    countries: [na, za]
    body:
      - "South Africa conquered German South West Africa in 1915 and from 1920 governed it under a League of Nations mandate. After the Second World War it refused to place the territory under the United Nations trusteeship system and ruled it as a fifth province in all but name, with white representatives in the South African parliament, apartheid laws and, from the Odendaal Commission of 1964, plans for separate homelands for each African people. The contract labour system brought tens of thousands of Ovambo men from the north, where about half the population lived, to the mines, farms and towns of the south."
      - "In 1960 the Ovamboland People’s Organisation became the South West Africa People’s Organisation, SWAPO, led by Sam Nujoma, who went into exile. SWAPO sent young men for military training to Egypt, the Soviet Union, China, North Korea and Tanzania and formed an army, later named the People’s Liberation Army of Namibia (PLAN). When the International Court of Justice dismissed the case brought by Ethiopia and Liberia against South Africa’s rule on 18 July 1966, SWAPO decided on armed struggle."
      - "PLAN fighters set up a camp at Omugulugwombashe in Ovamboland. On 26 August 1966 South African police and paratroopers, flown in by helicopters, attacked it, killing two guerrillas and capturing eight. Namibia commemorates the day as Heroes’ Day, the start of the war of liberation. On 27 October 1966 the UN General Assembly ended South Africa’s mandate; South Africa ignored the decision."
    facts:
      - [SWAPO founded, "1960"]
      - [ICJ ruling, "18 July 1966"]
      - [Omugulugwombashe, "26 August 1966; 2 PLAN fighters killed, 8 captured"]
      - [UN ends the mandate, "27 October 1966"]
