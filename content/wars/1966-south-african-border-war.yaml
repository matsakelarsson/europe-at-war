  - title: The New York Accords and independence
    date: December 1988 – March 1990
    when: "1988-12-22"
    borders: "1990-03-21"
    countries: [na, ao, za, cu]
    body:
      - "On 13 December 1988 the Brazzaville Protocol set the timetable, and on 22 December 1988, in New York, Angola, Cuba and South Africa signed the Tripartite Accord, while Angola and Cuba signed a separate agreement on the Cuban withdrawal. Resolution 435 was to take effect on 1 April 1989; South Africa would reduce its troops in Namibia to 1,500 within twelve weeks, and the Cubans would leave Angola in stages by July 1991. The UN Transition Assistance Group (UNTAG) was to supervise the transition."
      - "On 1 April 1989, the day the ceasefire took effect, PLAN fighters crossed from Angola into Ovamboland in large numbers, saying they meant to report to UN monitors; South Africa, with UN permission, sent its forces back into action, and in nine days of fighting some 260–275 PLAN fighters and 23–27 South African soldiers and police were killed. The Mount Etjo Declaration of 8–9 April restored the process."
      - "Some 40,000 exiles came home. In the election of 7–11 November 1989 SWAPO won 57 percent of the vote and 41 of the 72 seats of the Constituent Assembly, short of a two-thirds majority, and the Democratic Turnhalle Alliance 21. The assembly adopted a constitution in February 1990, and on 21 March 1990 Namibia became independent, with Sam Nujoma as president. South Africa kept Walvis Bay until 1 March 1994."
