  - title: Mavinga and the Lomba
    date: 1985–1987
    when: "1987-10-03"
    borders: "1987-10-03"
    countries: [ao, za, cu, na]
    body:
      - "In south-eastern Angola, South Africa supplied and protected Jonas Savimbi’s UNITA, whose headquarters were at Jamba near the Namibian border, and the United States began to arm UNITA in 1986. The Angolan government, rearmed by the Soviet Union, sent FAPLA brigades from Cuito Cuanavale towards UNITA’s base at Mavinga in 1985, when South African aircraft helped stop them, and again in 1987, in a larger offensive planned with Soviet advisers."
      - "To save UNITA, South Africa sent a mechanised force with artillery into Angola in Operation Moduler. In September and October 1987 it fought the FAPLA brigades as they tried to cross the Lomba river north of Mavinga. On 3 October FAPLA’s 47th Brigade was destroyed on the south bank, and the offensive collapsed. By South African count FAPLA lost about 1,060 dead and 2,100 wounded on the Lomba, for 17 South African dead. The FAPLA brigades fell back on Cuito Cuanavale, and South Africa decided to pursue them."
    facts:
