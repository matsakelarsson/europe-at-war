  - title: Cassinga
    date: May – September 1978
    when: "1978-05-04"
    borders: "1978-05-04"
    countries: [na, ao, za, cu]
    body:
      - "On 4 May 1978, in Operation Reindeer, some 370 South African paratroopers dropped on Cassinga, about 260 km inside Angola, which SWAPO used as a camp and the SADF called Objective Moscow. At the same time a mechanised force attacked PLAN bases at Chetequera (Objective Vietnam), just north of the border. At Cassinga the paratroopers overran the camp and were lifted out by helicopter as a Cuban armoured column from Techamutete counter-attacked. About 600 people were killed at Cassinga: a secret SWAPO report listed 582 dead and 400 wounded, and an Angolan government white paper 624 dead, among them 167 women and 298 teenagers and children. The South Africans lost three dead and one missing; South Africa claimed about 150 Cubans killed; the historian Piero Gleijeses gives 16 Cuban dead and more than 80 wounded. At Chetequera PLAN lost about 250 dead and 200 captured."
      - "What Cassinga was is still disputed. South Africa said it was PLAN’s main base in the region and that most of the dead were combatants; SWAPO said it was a refugee camp and the attack a massacre, and 4 May is Cassinga Day in Namibia. Historians agree it held both PLAN fighters and many civilians, women and children among them. The UN Security Council condemned the raid on 6 May."
      - "Western powers, the Contact Group of Britain, Canada, France, West Germany and the United States, had negotiated a plan for UN-supervised elections; on 29 September 1978 the Security Council adopted it as Resolution 435. South Africa accepted it in principle but held its own elections in December 1978, won by the Democratic Turnhalle Alliance, and the plan stayed on paper for ten years."
    facts:
      - [Cassinga raid, "4 May 1978"]
      - [Dead at Cassinga, "about 600 (582 in a SWAPO report, 624 in an Angolan white paper)"]
      - [Resolution 435, "29 September 1978"]
