notes:
  - "South Africans call it the Border War (die Grensoorlog) or the bush war; Namibians call it the war of liberation or the armed struggle. South Africa called PLAN’s fighters terrorists; the United Nations General Assembly recognised SWAPO in 1973 as the authentic representative of the Namibian people."
  - "The war in southern Angola after 1975 was part of the Angolan Civil War, which has its own story on this site; this story follows South Africa’s war with SWAPO, its operations in Angola and the road to Namibia’s independence."
  - "Figures are uncertain and disputed. Estimates give some 2,000–2,500 dead for the South African forces (including the Territorial Force and police), about 11,000 for PLAN, about 2,000 or more Cubans (including those killed in the Angolan Civil War), thousands of Angolan soldiers and about 950–1,100 Namibian civilians; the number of Angolan civilians killed is unknown. Both sides’ claims of enemy losses in single battles were often inflated."
  - "Places in Angola are given by their names of the time where they differ: Ngiva or Ondjiva (Vila Pereira de Eça), Lubango (Sá da Bandeira until 1975)."
