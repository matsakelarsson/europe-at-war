  - title: Cuito Cuanavale
    date: November 1987 – March 1988
    when: "1988-03-23"
    borders: "1988-03-23"
    countries: [ao, za, cu]
    view:
      center: [19.35, -15.25]
      size: [120, 90]
    body:
      - "Through November and December 1987 the South Africans and UNITA pushed the retreating FAPLA brigades back to the Cuito river. Fidel Castro decided to defend Cuito Cuanavale and sent Cuban officers, troops and aircraft to the town, and FAPLA dug in on the east bank of the river around the Tumpo, a bridgehead covered by artillery and minefields. South African long-range G5 guns shelled the town and its airstrip for months."
      - "In Operations Hooper and Packer, the South Africans and UNITA drove FAPLA brigades from the high ground at Chambinga back into the Tumpo bridgehead on 14 February 1988. Their attacks on the Tumpo itself, on 25 February, 29 February – 1 March and finally 23 March, failed in the minefields and under artillery and air attack; on 23 March South African tanks were abandoned in the minefield. About 700 FAPLA troops were killed in these operations, and Cuba lost 42 soldiers and several pilots in the battle; South Africa officially lost 31 dead in the whole campaign from August 1987, and UNITA about 3,000."
      - "Both sides claim the battle. South African veterans and many military historians stress that the FAPLA offensive was destroyed with heavy losses and the South African force was never large; Cuba, Angola, SWAPO and the ANC count the defence of Cuito Cuanavale as the turning point that broke the myth of South African invincibility and led to Namibia’s independence."
    facts:
      - [Chambinga, "14 February 1988"]
      - [Assaults on the Tumpo, "25 February, 29 February – 1 March and 23 March 1988"]
      - [Dead, "about 700 FAPLA in Hooper and Packer; 42 Cuban soldiers and several pilots; 31 South Africans (official, whole campaign from August 1987)"]
