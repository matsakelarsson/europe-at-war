  - title: Angola and the move north
    date: 1975–1977
    when: "1975-08-09"
    borders: "1975-11-11"
    countries: [na, ao, za, cu, zm]
    body:
      - "As Angola slid into civil war between the MPLA, the FNLA and UNITA, South African troops occupied the Calueque dam on the Cunene, which supplied water and power to northern Namibia, on 9 August 1975, and from October South African columns, in Operation Savannah, drove deep into Angola to help UNITA and the FNLA against the Soviet-backed MPLA. Cuba sent troops to the MPLA, which declared Angola independent on 11 November 1975. The South Africans withdrew in early 1976, and the MPLA government, with Cuban support, held most of the country."
      - "SWAPO sided with the MPLA. The new Angolan government gave PLAN bases in the south, and PLAN moved its headquarters from Lusaka to Lubango. In 1976 a revolt in SWAPO’s camps in Zambia against the leadership was put down with the help of the Zambian army, and its leader Andreas Shipanga and many others were detained. On the Namibian side, South Africa built bases at Oshakati, Ondangwa, Rundu and Grootfontein, cleared a strip along the border, the cutline, and began talks at the Turnhalle in Windhoek with ethnic leaders on an internal settlement without SWAPO."
    facts:
      - [Calueque occupied, "9 August 1975"]
      - [Operation Savannah, "October 1975 – March 1976"]
      - [Angolan independence, "11 November 1975"]
