id: south-african-border-war
name: South African Border War
start: "1966-08-26"
end: "1990-03-21"
tier: A
summary: "The war for South West Africa (Namibia), fought between South Africa and the South West Africa People’s Organisation (SWAPO) and its army, the People’s Liberation Army of Namibia (PLAN), and from 1975 also in southern Angola against the Angolan army (FAPLA) and its Cuban allies. South Africa had ruled the former German colony under a League of Nations mandate since 1920 and extended apartheid to it; the United Nations ended the mandate in 1966. The war began on 26 August 1966 with a South African attack on a PLAN camp at Omugulugwombashe. After Angola’s independence in 1975 PLAN fought from bases in southern Angola, and the war centred on Ovamboland, along the border. South Africa built up a large army there, with the police unit Koevoet and the South West Africa Territorial Force, raided deep into Angola, as at Cassinga in 1978, occupied part of Cunene province in 1981–1985 and backed Jonas Savimbi’s UNITA. In 1987–1988 South African troops defeated an Angolan offensive at the Lomba river but failed to take Cuito Cuanavale, and a Cuban advance towards the Namibian border followed. The New York Accords of 22 December 1988 linked South Africa’s withdrawal from Namibia to the departure of the Cubans from Angola. Under UN supervision Namibia held elections in November 1989, which SWAPO won, and became independent on 21 March 1990. Some 2,000–2,500 South African soldiers, about 11,000 PLAN fighters, Cubans, Angolans and about 1,000 Namibian civilians were killed."
countries: [na, ao, za, cu, zm]
sides:
