  - title: Ovamboland and the Caprivi
    date: 1967–1975
    when: "1971-12"
    borders: "1972-01-10"
    countries: [na, za, zm, ao]
    body:
      - "For several years PLAN’s war was small: groups crossed from Zambia into the Caprivi Strip and Kavango, laid landmines and attacked police posts, while the South African Police, not the army, fought them. Leaders of SWAPO inside the country, among them Andimba Toivo ya Toivo, were tried under the Terrorism Act and sent to Robben Island in 1968."
      - "In 1971 the International Court of Justice ruled in an advisory opinion that South Africa’s presence in Namibia was illegal. On 13 December 1971 Ovambo contract workers began a general strike against the contract labour system in Windhoek, and the next day in Walvis Bay; some 25,000 workers joined it as it spread to the mines of Tsumeb and beyond. South Africa declared a state of emergency in Ovamboland in February 1972. In 1974 the South African Defence Force took over the war from the police."
      - "The Portuguese revolution of April 1974 opened the border with Angola, where the Portuguese army had kept PLAN out. Thousands of young Namibians crossed into Angola and Zambia to join SWAPO, and PLAN gained a long border from which to fight."
    facts:
      - [ICJ advisory opinion, "21 June 1971"]
      - [General strike, "13 December 1971 – January 1972"]
      - [SADF takes over the war, "1974"]
