  - title: The south-west front and Calueque
    date: March – August 1988
    when: "1988-06-27"
    borders: "1988-06-27"
    countries: [ao, za, cu, na]
    body:
      - "While Cuito Cuanavale held, Castro moved some 40,000 Cuban troops with Angolan and PLAN units south in western Angola, from March 1988, towards the Namibian border, with new air bases and air defences that challenged South Africa’s control of the air. South Africa called up reserves. At the same time, under American mediation with Soviet support, Angola, Cuba and South Africa met for talks in London, Cairo, New York and Geneva."
      - "On 27 June 1988, after a clash between South African and Cuban troops near Techipa, Cuban MiG-23s bombed the Calueque dam, damaging it and killing eleven or twelve South African soldiers. It was the last major fighting between them. In the Geneva Protocol of August 1988 the parties agreed on a ceasefire, which took effect on 8 August, and the South African forces left Angola by the end of the month."
    facts:
      - [Cuban advance in the south-west, "from March 1988"]
      - [Calueque bombed, "27 June 1988"]
      - [Ceasefire, "8 August 1988"]
      - [South Africa leaves Angola, "30 August 1988"]
