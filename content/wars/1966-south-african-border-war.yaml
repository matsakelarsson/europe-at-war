  - title: Koevoet and the cross-border operations
    date: 1979–1984
    when: "1981-08-24"
    borders: "1981-09-01"
    countries: [na, ao, za, cu]
    body:
      - "Inside Namibia the war became a hunt for PLAN groups crossing the border, above all in the rainy season. South Africa formed Koevoet (crowbar), a police counter-insurgency unit of white officers and Ovambo trackers who followed guerrillas in mine-protected vehicles and were paid bounties for kills, in 1979, and the South West Africa Territorial Force in 1980, which by the mid-1980s provided most of the combat troops on the border. Ovamboland was under emergency regulations and a dusk-to-dawn curfew; Koevoet and the army were accused of torture and killings of civilians, and PLAN of landmines and killings of headmen and others it saw as collaborators."
      - "From 1980 the SADF struck PLAN’s bases in Angola with mechanised columns: Operation Sceptic in June 1980 against Chifufua, Operation Protea in August 1981, which took Xangongo and Ngiva (Ondjiva) after a week of fighting with FAPLA and PLAN, killing more than 1,000 for 14 South African dead, Operation Daisy in November 1981 and Operation Askari in December 1983 – January 1984. After Protea South African troops stayed in southern Cunene. The United States under Ronald Reagan, following Chester Crocker’s policy of “constructive engagement”, linked Namibia’s independence to the withdrawal of the Cubans from Angola."
      - "In the Lusaka Accord of 16 February 1984 Angola and South Africa agreed on a disengagement: South Africa would withdraw from southern Angola, which it completed in 1985, and Angola would restrain PLAN, under a joint monitoring commission. The truce lasted little more than a year."
    facts:
      - [Koevoet formed, "1979"]
      - [Operation Protea, "August 1981; Xangongo and Ngiva taken"]
      - [Operation Askari, "December 1983 – January 1984"]
      - [Lusaka Accord, "16 February 1984"]
