    ink: blue
    moves: Cambodian government and allied moves
    success: Cambodian government and allied success
notes:
  - “Khmer Rouge” (“Red Khmers”) was Sihanouk’s name for the Cambodian communists. Their party, the Communist Party of Kampuchea, kept its existence secret until 1977 and spoke to the people as Angkar, “the Organisation”. From 1970 they fought as part of Sihanouk’s National United Front of Kampuchea (FUNK) and its government in exile (GRUNK). Lon Nol’s army was the Khmer National Armed Forces (FANK).
  - Estimates of the dead of the civil war range from about 250,000 to 310,000. Estimates of the deaths caused by the American bombing range from tens of thousands to 150,000.
