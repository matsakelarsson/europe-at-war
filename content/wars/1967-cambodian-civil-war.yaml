steps:
  - title: Samlaut and the coup against Sihanouk
    date: 1967–1970
    when: "1967-04-02"
    borders: "1970-06-01"
    countries: [kh, vn]
    body:
      - "Prince Norodom Sihanouk kept Cambodia neutral in the Vietnam War by tolerating North Vietnamese and NLF bases along the eastern border and the shipment of their supplies through the port of Sihanoukville, while his police hunted the Cambodian left. On 2 April 1967 villagers near Samlaut in Battambang province, angry at the forced sale of rice to the army at low prices and at land grabs, killed two soldiers and took up arms. The army and militias under Lon Nol put down the revolt with great brutality, burning villages and killing hundreds of people, perhaps more. Leftist politicians fled to the forests, and on 17 January 1968 the Communist Party of Kampuchea, led by Saloth Sar (later known as Pol Pot), began its armed struggle with an attack on an army post at Bay Damran near Battambang."
      - "On 18 March 1970, while Sihanouk was abroad, the National Assembly voted him out of office and Lon Nol and Prince Sisowath Sirik Matak took power, demanding that the Vietnamese leave. Sihanouk, in Beijing, formed a National United Front with the Khmer Rouge, his former enemies, on 23 March; in Kampong Cham, crowds rising for him killed two deputies, and troops fired on the demonstrators. In April soldiers and police massacred hundreds of Vietnamese civilians living in Cambodia, and some 200,000 or more Vietnamese fled or were expelled to South Vietnam. The North Vietnamese army struck west, routed Lon Nol’s forces, took the north-eastern provinces and Angkor, and handed the conquered districts to the Khmer Rouge to govern."
    facts:
      - [Samlaut uprising, "from 2 April 1967"]
      - [Communist armed struggle begins, "17 January 1968"]
      - [Coup against Sihanouk, "18 March 1970"]
