  - title: Invasion, Chenla and the bombing
    date: 1970–1973
    when: "1970-05-01"
    borders: "1972-01-01"
    countries: [kh, vn, us]
    body:
      - "On 29 April and 1 May 1970 South Vietnamese and American troops crossed the border to destroy the bases in the Parrot’s Beak and the Fishhook; the Americans left by 30 June, and the South Vietnamese stayed to fight along the roads of eastern Cambodia. American aircraft, which had secretly bombed the border areas since March 1969, now bombed across the country in support of Lon Nol. Lon Nol’s army grew to some 200,000 men, many of them barely trained, and his two offensives to reopen Route 6 to Kampong Thom, Chenla I in 1970 and Chenla II in 1971, ended when the North Vietnamese and the Khmer Rouge cut the column apart in December 1971."
      - "By 1972 the Khmer Rouge, trained and armed by the North Vietnamese, had grown into an army of tens of thousands and were taking over the fighting. They refused to join the Paris ceasefire of January 1973, began to purge Vietnamese-trained cadres and imposed collective farming in their zones. To hold them off, American B-52s bombed the countryside around Phnom Penh with great intensity from February to August 1973, until Congress cut off funds; on 6 August a misdirected strike on the town of Neak Leung killed 137 people. Estimates of the deaths caused by the bombing range from tens of thousands to 150,000, and its role in driving recruits to the Khmer Rouge is debated."
    facts:
      - [Incursion into Cambodia, "29 April – 30 June 1970 (US)"]
      - [Chenla II destroyed, "December 1971"]
      - [American bombing ends, "15 August 1973"]
    markers:
