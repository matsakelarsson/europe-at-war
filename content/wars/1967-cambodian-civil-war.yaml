id: cambodian-civil-war
name: Cambodian Civil War
start: "1967-04-02"
end: "1975-04-17"
tier: B
summary: "The war in which the Communist Party of Kampuchea, the Khmer Rouge, came to power in Cambodia. A peasant revolt at Samlaut in 1967 and a communist rising from 1968 were put down by Prince Norodom Sihanouk’s government, but the war widened when General Lon Nol deposed Sihanouk on 18 March 1970. Sihanouk allied with the Khmer Rouge from exile in Beijing; North Vietnamese troops, whose bases in eastern Cambodia had been bombed in secret by the Americans since 1969, routed Lon Nol’s army; and American and South Vietnamese forces invaded the border areas in May 1970. The Khmer Republic, kept alive by American aid and one of the heaviest bombing campaigns in history, lost the countryside to the Khmer Rouge, who besieged Phnom Penh from January 1975 and took it on 17 April 1975. They emptied the cities the same day and began the rule of Democratic Kampuchea, in which some 1.5 to 2 million people died."
countries: [kh, vn, us]
sides:
