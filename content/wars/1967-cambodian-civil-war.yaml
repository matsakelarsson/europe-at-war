  - title: The fall of Phnom Penh
    date: January – 17 April 1975
    when: "1975-01-01"
    borders: "1975-04-17"
    countries: [kh, us]
    body:
      - "The Khmer Rouge took Oudong, the old royal capital, in March 1974 and drove out or killed its inhabitants, a sign of what was to come. On 1 January 1975 they launched their final offensive on Phnom Penh, a city of some two million people, most of them refugees. Mines and guns on the banks of the Mekong stopped the convoys that brought fuel and rice upriver from South Vietnam, and from February the city lived on an American airlift into Pochentong airport, which came under rocket fire. Neak Leung, the last government base on the Mekong, fell on 1 April; Lon Nol left the country the same day, and on 12 April the Americans evacuated their embassy by helicopter."
      - "On 17 April 1975 Khmer Rouge troops entered Phnom Penh. Within hours they ordered the whole population out of the city, saying the Americans were about to bomb it; the old, the sick and patients from the hospitals were driven onto the roads with everyone else, and thousands died. Officers and officials of the Republic, among them Sirik Matak and the prime minister Long Boret, were executed. Democratic Kampuchea, as the Khmer Rouge state was named, abolished money, markets, schools and religion and drove the population into forced labour; by January 1979 an estimated 1.5 to 2 million people, about a quarter of the population, had died of execution, starvation, overwork and disease."
    facts:
      - [Final Khmer Rouge offensive, "from 1 January 1975"]
      - [Neak Leung taken, "1 April 1975"]
      - [American evacuation (Eagle Pull), "12 April 1975"]
      - [Khmer Rouge enter Phnom Penh, "17 April 1975"]
    markers:
      - kind: taken
        side: kr
        name: Phnom Penh
        date: 17 April 1975
        text: Taken by the Khmer Rouge, who forced its whole population into the countryside the same day.
        lonlat: [104.920, 11.560]
        lp: l
      - kind: taken
        side: kr
        name: Neak Leung
