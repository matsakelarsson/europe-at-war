id: nathu-la-and-cho-la-clashes
name: Nathu La and Cho La clashes
start: "1967-09-11"
end: "1967-10-01"
tier: C
summary: "Two armed clashes between Indian and Chinese troops in 1967 on the border between Sikkim, then an Indian protectorate, and Tibet. At the Nathu La pass, after weeks of scuffles over trenches and wire, fighting broke out on 11 September when Indian soldiers began laying barbed wire along the crest to mark the border. It grew into days of artillery and machine-gun duels, in which the Indian positions on the heights of Sebu La and Camel’s Back destroyed many Chinese bunkers, until the firing died down by 14–15 September. On 1 October a second clash at the Cho La pass, further north, ended with the Chinese pulling back. By Indian figures India lost 88 killed and 163 wounded and China about 340 killed and 450 wounded; Chinese figures give 32 Chinese and about 100 Indian dead. The clashes were India’s first success against China after 1962, and the Sikkim border stayed quiet for decades."
