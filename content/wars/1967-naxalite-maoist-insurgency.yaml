notes:
  - "The Naxalite movement split into dozens of parties over the decades; most later took part in elections. The armed groups that merged in 2004 into the Communist Party of India (Maoist) were the People’s War Group, strongest in Andhra Pradesh, and the Maoist Communist Centre of Bihar and Jharkhand. India banned the CPI (Maoist) as a terrorist organisation in 2009."
  - "Both sides were accused of grave abuses. The Maoists killed villagers they accused of being police informers, extorted money and planted mines that killed civilians; the security forces and the Salwa Judum militia were accused of burning villages, rape and killing Adivasi villagers in staged “encounters”. By one widely used count about 12,000 people were killed between 2000 and 2026 alone: some 4,100 civilians, 2,700 members of the security forces and more than 5,000 insurgents."
  - The zones of the insurgency are drawn in the steps and are approximate; the guerrillas never held towns for long.
