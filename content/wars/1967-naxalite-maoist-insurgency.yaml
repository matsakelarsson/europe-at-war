  - title: The deadline
    date: 2024–2026
    when: "2026-03-31"
    borders: "2026-11-27"
    countries: [in]
    body:
      - "Last updated 27 November 2026. In August 2024 the home minister, Amit Shah, set 31 March 2026 as the deadline for ending the insurgency. Security forces built camps deep in the Bastar forests and, together with District Reserve Guard units made up partly of former Maoists, killed several hundred Maoists in 2024 and 2025, among them 29 near Kanker in April 2024. On 21 May 2025 they killed the party’s general secretary, Nambala Keshava Rao (Basavaraju), and 26 others in Abujhmarh. In October 2025 the politburo member Mallojula Venugopal Rao surrendered with 60 cadres in Gadchiroli, and more than 200 others laid down their arms in Jagdalpur days later. On 18 November 2025 Madvi Hidma, the guerrillas’ most wanted field commander, was killed in Andhra Pradesh."
      - "In February 2026 Thippiri Tirupathi (Devuji), named by some reports as the new general secretary, surrendered in Telangana. On 30 March Amit Shah told parliament that Bastar was free of Naxalism and that all but two of the top Maoist leaders had been killed or had surrendered, and the government declared the country free of the insurgency. Fighting went on for some months in the Saranda forest of Jharkhand, where a squad of about 40–50 led by Misir Besra, the last active member of the politburo, held out; on 28 July 2026 he was arrested near Parasnath hill. No clashes were widely reported after that. The CPI (Maoist) has not formally ended its armed struggle, and small groups may remain; rights groups questioned whether some of the killings of the last two years were genuine encounters."
    facts:
      - [Basavaraju killed, "21 May 2025"]
      - [Madvi Hidma killed, "18 November 2025"]
      - [Government declares the insurgency over, "30–31 March 2026"]
      - [Misir Besra arrested, "28 July 2026"]
    markers:
