steps:
  - title: Naxalbari and the first wave
    date: 1967–1972
    when: "1967-05-25"
    borders: "1967-05-25"
    countries: [in]
    body:
      - "In the spring of 1967 sharecroppers and tea-garden workers around Naxalbari, at the foot of the Himalaya in northern West Bengal, began seizing land from landlords, organised by radical members of the Communist Party of India (Marxist) led by Charu Majumdar, Kanu Sanyal and Jangal Santhal. On 24 May a police inspector was killed with arrows, and the next day police fired on a crowd at Prasadjote, killing eleven people, most of them women and children. The rising was put down within weeks, but “Naxalite” became the name for India’s Maoist revolutionaries, and China’s People’s Daily hailed it as “spring thunder over India”."
      - "In April 1969 the radicals founded the Communist Party of India (Marxist–Leninist), and Majumdar called for the “annihilation of class enemies”: the killing of landlords, moneylenders and policemen. The movement spread to the tribal hills of Srikakulam in Andhra Pradesh and to the students of Calcutta, where in 1970–1971 Naxalites, police and rival leftists fought a small urban war. In July and August 1971 the army and police of several states carried out Operation Steeplechase; thousands were killed or jailed, and Majumdar died in police custody in Calcutta on 28 July 1972."
    facts:
      - [Naxalbari rising, "May 1967"]
      - [CPI (Marxist–Leninist) founded, "22 April 1969"]
      - [Operation Steeplechase, "July – August 1971"]
      - [Charu Majumdar dies in custody, "28 July 1972"]
