id: naxalite-maoist-insurgency
name: Naxalite–Maoist insurgency
start: "1967-05-25"
end: ongoing
tier: B
summary: "The armed movement of India’s Maoist revolutionaries, called Naxalites after the village of Naxalbari in West Bengal, where a peasant rising in 1967 began it. The first wave, of land seizures and killings of landlords and police in West Bengal, Andhra Pradesh and Calcutta, was crushed by 1972. Regrouped in the forests of central and eastern India among the Adivasi (tribal) peoples, the movement merged in 2004 into the Communist Party of India (Maoist), whose guerrillas were active at their peak in some 180 districts of a “Red Corridor” and inflicted heavy losses on the security forces. A government-backed militia and large paramilitary offensives followed, and violence declined after 2010. In 2024 the government set a deadline of 31 March 2026 to end the insurgency; its forces killed the party’s general secretary in 2025, most other leaders were killed or surrendered, and in March 2026 the government declared the country free of the insurgency. The last active member of the party’s politburo was arrested in July 2026, but the party has not declared an end to its armed struggle. Last updated 27 November 2026."
