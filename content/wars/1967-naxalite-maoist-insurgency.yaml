        lonlat: [88.364, 22.573]
  - title: The Red Corridor
    date: 1980–2023
    when: "2010-04-06"
    borders: "2010-04-06"
    countries: [in]
    body:
      - "The movement regrouped in two main parties: the People’s War Group, founded in Andhra Pradesh in 1980 by Kondapalli Seetharamaiah, and the Maoist Communist Centre, which in Bihar fought upper-caste militias such as the Ranvir Sena in a cycle of massacres in the 1990s. Driven out of the Andhra plains, the guerrillas moved into the forests of Dandakaranya, above all Bastar in Chhattisgarh, where they took up the grievances of Adivasis over land, forests and mining. In September 2004 the two parties merged into the Communist Party of India (Maoist). In 2006 Prime Minister Manmohan Singh called it the single biggest threat to India’s internal security, and by the late 2000s it was active in about 180 districts."
      - "In 2005 the Chhattisgarh government backed the Salwa Judum, a militia of armed Adivasis; hundreds of villages were emptied and tens of thousands of people displaced, and in July 2011 the Supreme Court declared it unconstitutional. In 2009 the central government began a large offensive with paramilitary forces, known in the press as Operation Green Hunt. The Maoists struck back: on 6 April 2010 they ambushed a company of the Central Reserve Police Force near Chintalnar, killing 76 men, their deadliest attack; on 25 May 2013 they ambushed a Congress party convoy in the Jhiram valley, killing 27 people, among them the state’s party leaders and Mahendra Karma, the founder of the Salwa Judum. Deaths peaked at more than 1,000 a year in 2009–2010 and then fell, as roads, police camps and surrender schemes spread into the forests."
    facts:
      - [CPI (Maoist) founded, "21 September 2004"]
      - [Salwa Judum, "2005–2011"]
      - [Chintalnar ambush, "6 April 2010, 76 killed"]
      - [Jhiram valley ambush, "25 May 2013, 27 killed"]
