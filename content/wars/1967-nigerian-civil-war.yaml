  - title: The final offensive and the surrender at Lagos
    date: December 1969 – January 1970
    when: "1970-01-07"
    borders: "1970-01-15"
    countries: [ng]
    body:
      - In December 1969 the federal 1st Division pushed down from the north and the 3rd Marine Commando Division, now under Colonel Olusegun Obasanjo, from the south, while the 2nd Division held the line of the Niger. On 7 January 1970 the marines launched Operation Tail-Wind, and the exhausted Biafran front broke. Owerri fell on 9 January and Uli on 11 January.
      - "On the night of 10–11 January Ojukwu flew from Uli to exile in Côte d’Ivoire, leaving his chief of staff, Major General Philip Effiong, in charge. On 12 January Effiong announced on Biafran radio that Biafra ceased to exist, and on 15 January 1970, at Dodan Barracks in Lagos, he formally surrendered to Gowon. Gowon declared that there was “no victor and no vanquished” and promised reconciliation, reconstruction and rehabilitation; there were no mass reprisals, but many Igbo lost their property and savings, and the east took years to recover."
    facts:
      - [Operation Tail-Wind, "from 7 January 1970"]
      - [Owerri falls, "9 January 1970"]
      - [Uli falls, "11 January 1970"]
      - [Surrender, "15 January 1970, Dodan Barracks, Lagos"]
