steps:
  - title: The coups and massacres of 1966
    date: January – October 1966
    when: "1966-01-15"
    borders: "1966-06-01"
    countries: [ng]
    body:
      - Nigeria became independent in 1960 as a federation of three regions, each dominated by one large people, the Hausa-Fulani in the North, the Yoruba in the West and the Igbo in the East, with many smaller peoples in all three. The Northern People’s Congress led the federal government, and disputed elections in 1964 and 1965 and violence in the West shook the federation. On 15 January 1966 a group of young army officers, most of them Igbo, led by Major Chukwuma Kaduna Nzeogwu in Kaduna, killed the federal prime minister, Abubakar Tafawa Balewa, the Premier of the North, Ahmadu Bello, the Premier of the West, Samuel Akintola, and senior officers, most of them northerners. The coup failed in Lagos, and the army commander, Major General Johnson Aguiyi-Ironsi, an Igbo, took power.
      - Many northerners saw the coup as an Igbo plot, and Ironsi’s decree of 24 May 1966 abolishing the regions in favour of a unitary state deepened their fears. Riots against Igbo living in the North followed in May. On 29 July northern officers struck back; Ironsi was killed at Ibadan with his host, the military governor of the West, Adekunle Fajuyi, and Lieutenant Colonel Yakubu Gowon, a Christian from the Middle Belt, became head of state. The military governor of the East, Lieutenant Colonel Odumegwu Ojukwu, refused to recognise him.
      - In September and October 1966 mobs and soldiers in the North killed Igbo and other easterners in Kano, Kaduna, Zaria, Jos and other towns; 29 September is remembered as “Black Thursday”. Estimates of the dead range from about 10,000 to 30,000, and between one and two million people fled to the Eastern Region, while non-easterners were driven out of the East.
    facts:
      - [First coup, "15 January 1966"]
      - [Counter-coup, "29 July 1966"]
      - [Killed in the North in 1966, "about 10,000–30,000 (estimates)"]
      - [Refugees to the East, "1–2 million"]
