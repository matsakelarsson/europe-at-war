  - title: Aburi, secession and the first battles
    date: January – July 1967
    when: "1967-05-30"
    borders: "1967-07-15"
    countries: [ng]
    body:
      - At a meeting of the military leaders at Aburi in Ghana on 4–5 January 1967, Gowon and Ojukwu agreed on a loose federation with strong regions, but the two sides read the accord differently and it was never carried out. The East took over federal revenues and institutions in its territory, and the federal government imposed sanctions. On 27 May 1967 Gowon declared a state of emergency and divided Nigeria’s four regions into twelve states, splitting the East into an Igbo-majority East Central State and the Rivers and South-Eastern states of its minority peoples, which held most of its oil. On 30 May Ojukwu proclaimed the Republic of Biafra, named after the Bight of Biafra.
      - The federal government called its first attack a police action. On 6 July 1967 two columns of the federal 1st Division crossed into the north of Biafra. One took Garkem and Ogoja in the north-east by 12 July; the other took Nsukka, with its university, on 14 July. On 25–26 July federal marines under Lieutenant Colonel Benjamin Adekunle landed on Bonny Island, which commanded the oil terminal at the mouth of the river leading to Port Harcourt. The federal navy blockaded the Biafran coast.
    facts:
      - [Aburi meeting, "4–5 January 1967"]
      - [Twelve states decreed, "27 May 1967"]
      - [Biafra proclaimed, "30 May 1967"]
      - [War begins, "6 July 1967"]
