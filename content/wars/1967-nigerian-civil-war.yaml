id: nigerian-civil-war
name: Nigerian Civil War
start: "1967-07-06"
end: "1970-01-15"
tier: A
summary: "The war between the Federal Military Government of Nigeria and the Republic of Biafra, the state proclaimed by the former Eastern Region, also called the Biafran War. Two coups in 1966 and the massacres of thousands of Igbo and other easterners in the North that year drove the east, led by its military governor Lieutenant Colonel Odumegwu Ojukwu, to break away; Ojukwu declared Biafra independent on 30 May 1967, three days after the federal head of state, Lieutenant Colonel Yakubu Gowon, divided the region into three states. Federal troops attacked in July 1967. A Biafran thrust into the Midwest reached Ore, within about 210 km of Lagos, in August, but was driven back, and the federal army took Enugu, Calabar, Onitsha and, in May 1968, Port Harcourt, cutting Biafra off from the sea. Under a federal blockade the shrinking enclave suffered a famine that relief flights to the airstrip at Uli could only partly relieve; most of the war’s dead were civilians who died of hunger and disease, with estimates ranging from about 500,000 to 3 million. A final federal offensive in January 1970 broke Biafra’s resistance; Ojukwu left for Côte d’Ivoire, and his deputy, Philip Effiong, surrendered in Lagos on 15 January 1970."
countries: [ng]
sides:
  - id: ng
    name: Federal Military Government of Nigeria
    polities: [nigeria]
    ink: green
    moves: Federal moves
    success: Federal success
  - id: bf
    name: Republic of Biafra
    polities: [biafra]
    ink: orange
    moves: Biafran moves
    success: Biafran success
notes:
  - "Foreign support. Britain and the Soviet Union armed the federal government, and Egyptian pilots flew some of its aircraft. France sent arms to Biafra covertly through Gabon and Côte d’Ivoire, and Portugal, South Africa and Rhodesia helped it with arms and air links; mercenaries fought on both sides. Tanzania, Gabon, Côte d’Ivoire, Zambia and Haiti recognised Biafra. The Organisation of African Unity backed Nigeria’s unity."
  - "Death toll. No count was made. Estimates of combatants killed range from about 45,000 to 100,000. Estimates of civilian deaths, most of them from hunger and disease under the blockade, range from about 500,000 to 3 million (Britannica gives 500,000 to 3,000,000 for all deaths); some historians give figures between 500,000 and 1 million, and Biafran and some relief agency estimates were higher. Between 2 and 4.5 million people were displaced. Whether the federal blockade amounted to genocide, as Biafra charged, remains disputed; an international observer team invited by the federal government reported in 1968 that it found no evidence of genocide."
  - The Eastern Region’s people included, besides the Igbo majority, the Ijaw, Ibibio, Efik, Ogoja peoples and others; many of these minority peoples did not support secession, and the federal government’s creation of the Rivers and South-Eastern states in May 1967 appealed to them.
