  - title: Umuahia lost and Owerri retaken
    date: 1969
    when: "1969-04-22"
    borders: "1969-06-01"
    countries: [ng]
    body:
      - The war settled into a stalemate in 1969. Biafra’s soldiers were short of everything, but they knew the ground and the federal armies, now some 200,000 men, advanced slowly and at great cost. On 22 April 1969 federal troops took Umuahia, the second Biafran capital; three days later the Biafrans retook Owerri, whose federal garrison had been besieged for six months and fought its way out. Ojukwu moved his government to Owerri, Biafra’s last capital.
      - From 22 May 1969 the Swedish pilot Carl Gustaf von Rosen led small Swedish-built MFI-9 light aircraft in raids on federal airfields at Port Harcourt, Enugu, Benin and elsewhere. In May Biafran commandos attacked an oil station at Kwale in the Midwest, killing 11 Italian oil workers and capturing 18 foreigners, who were later released. On 1 June Ojukwu set out Biafra’s aims in the Ahiara Declaration. On 5 June federal aircraft shot down a Red Cross relief plane, and Nigeria demanded control over relief flights; the Red Cross suspended its flights, and talks on daylight relief failed.
    facts:
      - [Umuahia taken, "22 April 1969"]
      - [Owerri retaken by Biafra, "25 April 1969"]
      - [Ahiara Declaration, "1 June 1969"]
      - [Red Cross aircraft shot down, "5 June 1969"]
