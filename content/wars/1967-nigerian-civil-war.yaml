  - title: The Midwest invasion and the fall of Enugu
    date: August – October 1967
    when: "1967-08-09"
    borders: "1967-08-20"
    countries: [ng]
    body:
      - On 9 August 1967 a Biafran column of about 3,000 men under Lieutenant Colonel Victor Banjo, a Yoruba officer, crossed the Niger bridge at Onitsha and overran the Midwest Region almost unopposed, taking Benin City the same day. It drove west towards Lagos and Ibadan, and was stopped on 21 August at Ore, about 210 km from Lagos. The federal government now mobilised for full war; a new 2nd Division under Colonel Murtala Mohammed counter-attacked. On 19 September the Biafrans proclaimed the Midwest the Republic of Benin under Major Albert Okonkwo, but federal troops retook Benin City on 22 September, and the Biafrans fell back across the Niger. Ojukwu had Banjo and other officers accused of plotting against him shot.
      - "When the 2nd Division entered Asaba, on the west bank of the Niger opposite Onitsha, its soldiers killed hundreds of the town’s men and boys on 5–7 October 1967, many of them shot after being called out to welcome the troops. Estimates range from about 500 to over 1,000 dead. To the north, the federal 1st Division took Enugu, the Biafran capital, on 4 October, and Ojukwu’s government moved to Umuahia."
    facts:
      - [Biafrans enter the Midwest, "9 August 1967"]
      - [Halted at Ore, "21 August 1967"]
      - [Benin City retaken, "22 September 1967"]
      - [Enugu falls, "4 October 1967"]
      - [Asaba massacre, "5–7 October 1967; about 500 to over 1,000 killed"]
