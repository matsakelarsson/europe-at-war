  - title: The blockade and the famine
    date: 1968–1969
    when: "1968-06"
    borders: "1968-09-30"
    countries: [ng]
    body:
      - The federal blockade, applied from the start of the war, aimed to bring Biafra down by cutting off arms and supplies, and food could not come in except by air. In the crowded enclave food ran out from the spring of 1968; children died in great numbers of kwashiorkor, a disease of protein starvation. In September 1968 the International Committee of the Red Cross estimated that 8,000 to 10,000 people were dying each day. Photographs of starving children made Biafra one of the first famines watched by television viewers worldwide, and Biafra’s publicists and supporters abroad called the blockade genocide. The federal government said that relief flights also carried arms and that starving the enemy was a legitimate means of war.
      - "Relief came by night flights to Uli, a stretch of road converted into an airstrip, code-named “Annabelle”, which the Biafrans kept open under air attack until the end of the war. Joint Church Aid, a group of Protestant and Catholic agencies, flew more than 5,300 missions and delivered about 60,000 tons of food, mostly from the Portuguese island of São Tomé; the Red Cross flew from Fernando Po (Bioko) and Cotonou, and arms flights came from Libreville and Lisbon. At least 29 aircrew were killed. In September 1968 the marines took Aba and Owerri, and the Biafran heartland shrank further."
    facts:
      - [ICRC estimate of daily deaths, "8,000–10,000 (September 1968)"]
      - [Joint Church Aid, "more than 5,300 missions, about 60,000 tons"]
      - [Aba and Owerri taken, "September 1968"]
