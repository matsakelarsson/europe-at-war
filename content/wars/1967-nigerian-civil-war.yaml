  - title: Calabar, Onitsha and Port Harcourt
    date: October 1967 – May 1968
    when: "1968-03"
    borders: "1968-05-19"
    countries: [ng]
    body:
      - On 17–20 October 1967 Adekunle’s 3rd Marine Commando Division took Calabar in a landing from the sea, and the town and port became a federal base. Murtala Mohammed’s attempts to cross the Niger from Asaba to Onitsha in October 1967 failed with heavy losses; his division then marched round by the north and took Onitsha in March 1968. On 31 March Biafran troops under Major Jonathan Uchendu ambushed a large federal convoy bringing supplies to Onitsha at Abagana and destroyed most of it.
      - In the south the marines advanced through the creeks and the Ibibio country. Port Harcourt, Biafra’s largest port and its oil and refining centre, fell on 19 May 1968. Biafra had now lost its cities, its ports, its oil and the land of most of the minority peoples, and was cut off from the sea; it held a landlocked heartland of the Igbo country, crowded with refugees.
