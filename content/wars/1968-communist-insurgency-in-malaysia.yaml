notes:
  - The communist insurgency in Sarawak (1962–1990) was a separate conflict, waged by the Sarawak communists and ended by its own agreement in 1990. Thailand fought its own communist insurgency (1965–1983); the MCP’s bases in the south of Thailand were the subject of joint Thai–Malaysian operations from 1977 and of the Thai side of the Hat Yai agreements.
