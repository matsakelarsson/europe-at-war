id: communist-insurgency-in-malaysia
name: Communist insurgency in Malaysia
start: "1968-06-17"
end: "1989-12-02"
tier: C
summary: "The second armed struggle of the Malayan Communist Party (MCP), sometimes called the Second Malayan Emergency. After its defeat in the Malayan Emergency (1948–1960), the party’s army, the Malayan National Liberation Army, withdrew under Chin Peng to the jungle on the Thai side of the border, around Betong and Sadao. Encouraged by China, it resumed the war on 17 June 1968 with an ambush at Kroh–Betong that killed 17 members of the Malaysian security forces. It recruited among Chinese youth after the race riots of May 1969, broadcast from a radio station in southern China, and carried out ambushes along the border and bombings and assassinations in the towns: Inspector-General of Police Abdul Rahman Hashim was shot dead in Kuala Lumpur on 7 June 1974, and the National Monument was bombed on 26 August 1975. Purges of suspected government agents in 1970 split the party into three rival factions. Malaysia never declared a new emergency; it relied on its security and development programme (KESBAN), village guards, a special forces unit (VAT 69) and, from 1977, joint operations with Thailand. China’s support faded after it established relations with Malaysia in 1974. Talks mediated by Thailand ended the war: in two agreements signed at Hat Yai on 2 December 1989, the MCP agreed to end its armed struggle and disband its army, then about 1,200 strong. Figures commonly given are about 155 members of the security forces killed and 854 wounded, and some 212 guerrillas killed. Chin Peng was not allowed to return to Malaysia and died in Bangkok in 2013."
