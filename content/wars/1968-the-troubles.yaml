steps:
  - title: Civil rights, Bloody Sunday and the 1970s
    date: October 1968 – August 1979
    when: "1968-10-05"
    borders: "1979-08-27"
    countries: [gb, ie]
    body:
      - Since 1921 Northern Ireland had had its own parliament and government, always led by unionists, and its Catholic minority faced discrimination in housing, jobs and local elections. In the late 1960s a civil rights movement took to the streets. On 5 October 1968 police batoned a banned march in Derry, and in January 1969 loyalists ambushed a student march at Burntollet Bridge. In August 1969, after the “Battle of the Bogside” between Derry nationalists and the police, and riots in Belfast in which Catholic streets were burned, the British government sent in troops. The IRA split, and the new Provisional IRA began a campaign to drive Britain out.
      - Internment without trial, brought in in August 1971, was used almost only against nationalists. On 30 January 1972, Bloody Sunday, paratroopers shot dead 13 unarmed men at a civil rights march in Derry, and another died later. 1972 was the deadliest year, with nearly 500 killed. Britain suspended Stormont and ruled directly from London, and on Bloody Friday, 21 July, the IRA set off some twenty bombs in Belfast, killing nine people.
      - A power-sharing government formed under the Sunningdale Agreement collapsed in May 1974 during a loyalist general strike. That month UVF car bombs killed 33 people in Dublin and Monaghan, the deadliest attack of the Troubles, and in November IRA bombs killed 21 people in two Birmingham pubs. Sectarian murders by both sides went on through the decade. On 27 August 1979 the IRA killed Lord Mountbatten and three others in County Sligo and 18 soldiers at Warrenpoint.
    facts:
      - [British troops deployed, "14 August 1969"]
      - [Bloody Sunday, "30 January 1972, 14 civilians killed"]
      - [Deadliest year, "1972, nearly 500 dead"]
    markers:
      - kind: event
        name: Bloody Sunday
        date: 30 January 1972
        text: Soldiers of the Parachute Regiment opened fire on a march against internment in the Bogside. The Saville Inquiry found in 2010 that none of the victims had posed a threat, and the British prime minister apologised.
        lonlat: [-7.326, 54.997]
      - kind: event
        name: Bloody Friday
        date: 21 July 1972
        text: At least twenty IRA bombs, most of them car bombs, went off across Belfast in 80 minutes, killing five civilians, two soldiers, a police reservist and a UDA member, and injuring 130 people.
        lonlat: [-5.927, 54.597]
      - kind: event
        name: Dublin and Monaghan bombings
        date: 17 May 1974
        text: Three car bombs in Dublin’s evening rush hour and a fourth in Monaghan killed 33 civilians and an unborn child. The UVF admitted responsibility in 1993.
        lonlat: [-6.254, 53.351]
      - kind: event
        name: Birmingham pub bombings
        date: 21 November 1974
        text: Bombs in two city-centre pubs killed 21 people. Six Irishmen convicted of the attack were freed in 1991, when their convictions were quashed.
        lonlat: [-1.9, 52.48]
      - kind: event
        name: Mullaghmore
        date: 27 August 1979
        text: An IRA bomb on Lord Mountbatten’s fishing boat killed him, two boys and an elderly woman.
        lonlat: [-8.449, 54.466]
      - kind: event
        name: Warrenpoint
        date: 27 August 1979
        text: Two IRA bombs at Narrow Water killed 18 soldiers, the British Army’s heaviest loss in a single attack in Northern Ireland.
        lonlat: [-6.279, 54.112]
  - title: Hunger strikes, ceasefires and the Good Friday Agreement
    date: 1981 – 1998
    when: "1981-03-01"
    borders: "1998-05-22"
    countries: [gb, ie]
    body:
      - In 1976 Britain stopped treating paramilitary prisoners as a special category, and republicans in the Maze prison protested for years, then went on hunger strike. In 1981 ten men, seven from the IRA and three from the INLA, starved to death. The first, Bobby Sands, was elected to Parliament weeks before he died in May, and some 100,000 people went to his funeral. Sinn Féin, the IRA’s political wing, began to stand in elections. The IRA bombed the Brighton hotel where Margaret Thatcher’s government was staying in 1984 and killed eleven people at a Remembrance Day ceremony in Enniskillen in 1987.
      - The Anglo-Irish Agreement of 1985 gave the Irish government a say in Northern Ireland, to the fury of unionists. Secret talks, the Downing Street Declaration of December 1993 and American mediation opened a peace process. The IRA declared a ceasefire on 31 August 1994 and the main loyalist groups in October. The IRA broke it with a bomb in London’s Docklands in February 1996, then restored it in July 1997.
      - Talks chaired by the American senator George Mitchell produced the Good Friday Agreement of 10 April 1998, which set up a power-sharing government and cross-border bodies, released paramilitary prisoners and laid down that Northern Ireland would stay in the United Kingdom until a majority there voted otherwise. Voters approved it on 22 May, by 71 per cent in Northern Ireland and 94 per cent in the Republic. On 15 August a bomb planted by the Real IRA, a breakaway group, killed 29 people in Omagh. In all more than 3,500 had died; republicans killed about 60 per cent of them, loyalists 30 and the security forces 10.
    facts:
      - [Hunger strike, "1 March – 3 October 1981; ten prisoners died"]
      - [IRA ceasefire, "31 August 1994; renewed 20 July 1997"]
      - [Good Friday Agreement, "10 April 1998; approved by referendums 22 May 1998"]
    markers:
      - kind: event
        name: Maze prison
        date: 1 March – 3 October 1981
        text: Ten republican prisoners died on hunger strike here, demanding to be treated as political prisoners. Bobby Sands died on 5 May after 66 days.
        lonlat: [-6.108, 54.489]
        lp: l
      - kind: event
        name: Brighton hotel bombing
        date: 12 October 1984
        text: An IRA bomb in the Grand Hotel during the Conservative Party conference killed five people; Thatcher was unhurt.
        lonlat: [-0.147, 50.821]
      - kind: event
        name: Enniskillen
        date: 8 November 1987
        text: An IRA bomb went off beside the war memorial as people gathered for the Remembrance Sunday ceremony, killing eleven people.
        lonlat: [-7.639, 54.345]
      - kind: event
        name: Docklands bombing
        date: 9 February 1996
        text: A truck bomb near Canary Wharf ended the IRA ceasefire, killing two men and causing damage estimated at £85 million.
        lonlat: [-0.018, 51.501]
      - kind: treaty
        name: Good Friday Agreement
        date: 10 April 1998
        text: Agreed at Stormont in Belfast by the British and Irish governments and most of Northern Ireland’s parties; the Democratic Unionist Party opposed it.
        lonlat: [-5.815, 54.598]
      - kind: event
        name: Omagh bombing
        date: 15 August 1998
        text: A Real IRA car bomb in the town centre killed 29 people, among them a woman pregnant with twins, the most killed by a single bomb in the Troubles.
        lonlat: [-7.309, 54.598]
