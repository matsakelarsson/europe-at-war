notes:
  - Writers date the start differently, to the founding of the loyalist Ulster Volunteer Force in 1966, the Derry march of October 1968 or the arrival of British troops in August 1969. Violence by small groups opposed to the peace process went on after 1998.
  - The main republican groups were the Provisional IRA and the smaller Irish National Liberation Army (INLA); the main loyalist groups were the Ulster Volunteer Force (UVF) and the Ulster Defence Association (UDA). The security forces were the British Army, the Royal Ulster Constabulary (RUC) and the locally recruited Ulster Defence Regiment.
  - The city of Derry is officially named Londonderry; both names are in use, and this story uses the shorter one. Figures for the dead are from the Sutton Index of Deaths (CAIN, Ulster University).
