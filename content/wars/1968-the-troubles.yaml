id: the-troubles
name: The Troubles
start: "1968-10-05"
end: "1998-04-10"
tier: B
summary: A conflict in Northern Ireland from the late 1960s to 1998 between republican paramilitaries seeking a united Ireland, loyalist paramilitaries determined to keep Northern Ireland British, and the British Army and police. More than 3,500 people were killed, about half of them civilians, before ceasefires and the Good Friday Agreement of 1998 set up a power-sharing government.
