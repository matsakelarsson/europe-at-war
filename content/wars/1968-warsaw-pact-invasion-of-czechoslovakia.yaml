id: warsaw-pact-invasion-of-czechoslovakia
name: Warsaw Pact invasion of Czechoslovakia
start: "1968-08-20"
end: "1968-08-21"
tier: B
summary: The invasion of Czechoslovakia on the night of 20–21 August 1968 by about 250,000 troops of the Soviet Union, Poland, Hungary and Bulgaria, which ended the reforms of the Prague Spring. The Czechoslovak army was ordered not to resist, and 137 Czechoslovak citizens were killed in the invasion and the months that followed. The reformist leaders were forced to accept the Moscow Protocol, Soviet troops stayed until 1991, and from 1969 Gustáv Husák’s “normalisation” restored strict Communist rule.
