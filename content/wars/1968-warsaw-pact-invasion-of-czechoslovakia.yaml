steps:
  - title: The Prague Spring and the invasion
    date: January – 21 August 1968
    when: "1968-01-05"
    borders: "1968-08-21"
    countries: [cz, sk, ru, pl, hu, bg, ua]
    body:
      - In January 1968 the Slovak Communist Alexander Dubček replaced Antonín Novotný as party leader in Czechoslovakia. Under him censorship was relaxed and then effectively ended, victims of the purges of the 1950s were rehabilitated, and the party’s Action Programme of April promised “socialism with a human face”. Public debate flourished. The Soviet leadership under Leonid Brezhnev, and the leaders of Poland, East Germany, Hungary and Bulgaria, feared that the reforms would end the party’s monopoly of power and spread to their own countries. In July they demanded a halt in the Warsaw Letter, and talks at Čierna nad Tisou and Bratislava brought only a brief pause.
      - At about 11 pm on 20 August some 250,000 Soviet, Polish, Hungarian and Bulgarian troops with about 2,000 tanks crossed the borders, and Soviet airborne troops landed at Prague’s Ruzyně airport. The Czechoslovak army was ordered not to resist. By morning Dubček and other leaders had been arrested, and they were soon flown to the Soviet Union. Crowds surrounded the tanks, argued with the young soldiers and took down street signs to confuse the invaders, while clandestine radio stations kept broadcasting. People were killed in Prague, Bratislava, Liberec and other towns, several outside the Prague radio building.
    facts:
      - [Dubček party leader, "from 5 January 1968"]
      - [Invasion, "night of 20–21 August 1968"]
