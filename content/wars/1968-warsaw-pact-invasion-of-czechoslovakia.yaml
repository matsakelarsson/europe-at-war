  - title: The Moscow Protocol and “normalisation”
    date: 21 August 1968 – April 1969
    when: "1968-08-22"
    borders: "1969-04-17"
    countries: [cz, sk, ru]
    body:
      - The invaders had expected a new government to take over, but no credible collaborators came forward. An extraordinary party congress met secretly in a Prague factory on 22 August and backed Dubček. President Ludvík Svoboda flew to Moscow and insisted that the arrested leaders join the talks. On 26 August all of them except František Kriegel signed the Moscow Protocol, accepting renewed censorship and the presence of Soviet troops, which a treaty in October let stay “temporarily”; they remained until 1991. In 1968, 137 Czechoslovak citizens were killed during the invasion and occupation, and some 70,000 fled to the West.
      - Resistance went on in other forms. In January 1969 the student Jan Palach set himself on fire in Wenceslas Square and died three days later; Jan Zajíc did the same in February. After crowds celebrating an ice-hockey victory over the Soviet Union in March 1969 attacked the Soviet airline office in Prague, Moscow forced Dubček out. On 17 April Gustáv Husák replaced him as party leader and began what was called “normalisation”. Purges removed hundreds of thousands from the party, reformers lost their jobs and censorship returned. The Brezhnev Doctrine justified the invasion as the defence of socialism in the bloc.
    facts:
      - [Moscow Protocol, "26 August 1968"]
      - [Jan Palach, "set himself on fire on 16 January 1969"]
      - [Husák party leader, "from 17 April 1969"]
