steps:
  - title: Jabidah and the MNLF’s war
    date: 1968–1976
    when: "1974-02-07"
    borders: "1974-02-07"
    countries: [ph, my]
    body:
      - "The sultanates of Sulu and Maguindanao had resisted Spain for three centuries and were brought under American rule only by force. Under American and then Philippine governments, settlers from Luzon and the Visayas were encouraged to move to Mindanao, and by the 1960s Muslims were a minority in most of the island, often losing land they had held by custom to titled newcomers. In March 1968 news broke that Muslim recruits trained on the island of Corregidor for a secret operation to stir up revolt in Sabah, which the Philippines claimed from Malaysia, had been shot by their officers; the number killed is disputed, and only one survivor told the story. The killings outraged Muslims. A Muslim Independence Movement was founded in 1968, and young Moros trained in Malaysia from 1969 formed the core of the Moro National Liberation Front, led by Nur Misuari, a lecturer at the University of the Philippines."
      - "In 1970–1972 fighting between Christian militias known as the Ilaga and Muslim armed groups spread through Cotabato and Lanao; at Manili in June 1971 Ilaga gunmen killed some 65–70 Muslims in a mosque. After Marcos declared martial law in September 1972, the MNLF’s Bangsa Moro Army, armed by Libya and through Sabah, rose across the south; at its height it may have had 30,000 fighters. In February 1974 the army retook Jolo from the MNLF in a battle in which much of the town was burned, and in September 1974 soldiers killed many Moro men at Malisbong in Sultan Kudarat, some 1,500 by Moro accounts. With mediation by Libya and the Organisation of the Islamic Conference, the government and the MNLF signed the Tripoli Agreement on 23 December 1976, promising autonomy for thirteen provinces."
    facts:
      - [Jabidah massacre, "18 March 1968"]
      - [Manili massacre, "19 June 1971"]
      - [Battle of Jolo, "February 1974"]
      - [Tripoli Agreement, "23 December 1976"]
