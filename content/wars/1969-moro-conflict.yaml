  - title: The Bangsamoro
    date: 2012–2026
    when: "2019-02-26"
    borders: "2026-11-27"
    countries: [ph]
    body:
      - "Last updated 27 November 2026. Talks between the government of Benigno Aquino III and the MILF, with Malaysia as facilitator, produced a framework agreement in October 2012 and the Comprehensive Agreement on the Bangsamoro on 27 March 2014. The process nearly collapsed after 25 January 2015, when police commandos hunting a Malaysian bomb-maker at Mamasapano clashed with MILF and other fighters, and 44 commandos, 18 MILF fighters and 5 civilians were killed. In 2017 fighters allied to the Islamic State held Marawi for five months. The Bangsamoro Organic Law was signed in July 2018 and approved in plebiscites in January and February 2019, and on 26 February 2019 the Bangsamoro Autonomous Region in Muslim Mindanao (BARMM) replaced the ARMM, with the MILF chairman Murad Ebrahim as interim chief minister. More than 26,000 MILF fighters handed in their weapons between 2015 and 2022, and Abu Sayyaf, worn down by military operations and surrenders, was declared gone from Sulu in 2023."
      - "In September 2024 the Supreme Court ruled that Sulu, which had voted against the new region, was not part of it. The first elections to the Bangsamoro parliament were postponed several times and held on 14 September 2026, amid violence that left several people dead; no party won a majority, and on 30 October the parliament elected Abdulraof Macacua, a former MILF commander who had replaced Murad as interim chief minister in March 2025 and now led a rival party, as chief minister by 51 votes to 27 over Murad. The decommissioning of the last 14,000 or so MILF fighters, which the MILF put on hold in 2025, has not resumed. Small groups linked to the Islamic State still fight the army in Lanao and Maguindanao: four soldiers were killed in an ambush at Munai in January 2026, and ten fighters of the Dawlah Islamiyah–Maute group in a clash in Lanao del Sur in April."
    facts:
      - [Comprehensive Agreement on the Bangsamoro, "27 March 2014"]
      - [Mamasapano clash, "25 January 2015, 67 killed"]
      - [Bangsamoro region inaugurated, "26 February 2019"]
      - [Sulu excluded by the Supreme Court, "9 September 2024"]
      - [First Bangsamoro parliamentary election, "14 September 2026"]
