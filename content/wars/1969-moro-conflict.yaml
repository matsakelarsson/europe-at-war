notes:
  - "Moro is the old Spanish word for Muslims, taken from the Moors; the movements adopted it, and the name Bangsamoro (“Moro nation”), as a name for the thirteen Muslim peoples of the south, among them the Maguindanaon, Maranao and Tausug. The Battle of Marawi (2017) has its own entry. Some accounts date the end of the Moro conflict to the creation of the Bangsamoro region in 2019; others count the fighting with the remaining armed groups as its continuation."
  - "All sides killed civilians. The government’s forces and Christian militias such as the Ilaga were responsible for massacres of Muslims in the 1970s, including at Manili (1971) and Malisbong (1974); Moro fighters attacked Christian towns, and Abu Sayyaf killed and beheaded hostages and bombed ferries and markets. Feuds between clans (rido) and private armies of local politicians have added to the violence."
  - The autonomous regions drawn in the steps are approximate. The Bangsamoro region also includes 63 villages of Cotabato province (the Special Geographic Area), too small to show, but not Isabela City in Basilan.
