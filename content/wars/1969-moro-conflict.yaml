  - title: Autonomy, the MILF and Abu Sayyaf
    date: 1977–2013
    when: "2000-07-09"
    borders: "2000-07-09"
    countries: [ph, my]
    body:
      - "Marcos put the Tripoli Agreement into effect on his own terms, with a plebiscite the MNLF boycotted, and the war resumed at a lower level. In 1977 the MNLF’s vice-chairman, Hashim Salamat, broke away with followers who wanted a more Islamic movement; from 1984 they called themselves the Moro Islamic Liberation Front, based at Camp Abubakar in the Lanao–Maguindanao hills. Under Corazon Aquino an Autonomous Region in Muslim Mindanao (ARMM) was created in 1989 and took office in 1990, with the four provinces that voted for it. On 2 September 1996 the government of Fidel Ramos and the MNLF signed a final peace agreement, mediated by Indonesia, and Misuari became governor of the ARMM. Meanwhile former MNLF members led by Abdurajak Janjalani had formed Abu Sayyaf in Basilan in the early 1990s; it raided the town of Ipil in April 1995, killing 53 people, kidnapped 21 people from the Malaysian diving island of Sipadan in 2000, and in 2004 bombed the Superferry 14 in Manila Bay, killing 116."
      - "President Joseph Estrada declared “all-out war” on the MILF in 2000, and the army took Camp Abubakar on 9 July. Talks resumed under Gloria Macapagal Arroyo with Malaysian mediation, but when the Supreme Court halted, and later struck down, a draft agreement on the Bangsamoro homeland in 2008, MILF commanders attacked towns in Lanao del Norte and Cotabato, and hundreds of thousands of people fled the fighting. In September 2013 MNLF fighters loyal to Misuari, who rejected the new talks with the MILF, landed in Zamboanga City; three weeks of fighting killed more than 200 people, most of them MNLF fighters, and burned some 10,000 homes."
    facts:
      - [MILF splits from the MNLF, "1977 (named MILF 1984)"]
      - [ARMM set up, "1989–1990"]
      - [Final Peace Agreement with the MNLF, "2 September 1996"]
      - [Camp Abubakar taken, "9 July 2000"]
      - [Zamboanga City crisis, "9–28 September 2013"]
