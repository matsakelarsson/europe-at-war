id: moro-conflict
name: Moro conflict
start: "1969"
end: ongoing
tier: B
summary: "The armed struggle of the Muslim peoples of the southern Philippines, the Moros, for independence and later autonomy, and the wars of the groups that came out of it. Decades of settlement by Christians from the north had made Muslims a minority in much of Mindanao, and land disputes, poverty and the massacre of Muslim army trainees on Corregidor in 1968 led to the founding of the Moro National Liberation Front (MNLF) under Nur Misuari. Its war against Ferdinand Marcos’s martial-law regime (1972–1976) was the bloodiest phase. The Tripoli Agreement of 1976 promised autonomy, but fighting resumed; the Moro Islamic Liberation Front (MILF) split away in 1977, and an autonomous region was created in 1989–1990. The MNLF signed a final peace agreement in 1996; the MILF fought on, with full-scale offensives against it in 2000, 2003 and 2008, until the Comprehensive Agreement on the Bangsamoro of 2014. Small groups rejected every settlement: Abu Sayyaf, known for kidnappings and bombings, and fighters allied to the Islamic State, who seized Marawi in 2017. In 2019 the Bangsamoro Autonomous Region replaced the old autonomous region, led by the MILF, which began to disarm. Estimates of the dead since the early 1970s range from about 100,000 to 150,000, with 120,000 the figure most often given, and more than two million people have been displaced at one time or another. Last updated 27 November 2026: the Bangsamoro region elected its first parliament in September 2026, but the disarmament of the last MILF fighters has stalled and small armed groups linked to the Islamic State are still fought by the army."
