notes:
  - "The National Democratic Front of the Philippines (NDFP), formed in 1973, represents the CPP and the NPA in peace talks. The United States (2002) and the Philippine government (2017) designated the CPP–NPA as terrorist organisations; the CPP rejects the label. Human rights groups have accused the NPA of killing civilians it accused of being informers, of extortion (“revolutionary taxes”) and of using landmines, and the security forces and government-backed militias of extrajudicial killings, disappearances and the “red-tagging” of activists, journalists and church workers as communists."
  - "Casualty figures are uncertain. The figure commonly quoted for all deaths since 1969 is about 40,000; other counts give more than 43,000 by 2008. Government estimates of the NPA’s strength fell from about 25,000 in 1987 to some 4,000 around 2017 and about 1,000 or fewer by the mid-2020s."
