id: new-peoples-army-rebellion
name: New People’s Army rebellion
start: "1969-03-29"
end: ongoing
tier: B
summary: "The Maoist “people’s war” of the Communist Party of the Philippines (CPP) and its New People’s Army (NPA), one of the longest communist insurgencies in the world. Re-founded in December 1968 by José Maria Sison, the party formed the NPA on 29 March 1969 in Tarlac with a few dozen fighters. Under Ferdinand Marcos’s martial law (1972–1981) it grew into a guerrilla army of perhaps 25,000 by the mid-1980s, active in most provinces, while bloody internal purges and the end of the dictatorship in 1986 began its decline. A split in 1992, decades of on-and-off peace talks with Norway as facilitator, a terrorist designation by the government in 2017 and sustained military pressure reduced it to a few thousand and then, by government counts, to a few hundred fighters in scattered remnants. Estimates of the dead since 1969 run to about 40,000. Last updated 27 November 2026: the government says the NPA has been all but defeated and refuses to resume talks, the CPP insists its armed struggle continues, and clashes still occur, notably in Negros."
