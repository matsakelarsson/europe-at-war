  - title: Talks, vigilantes and splits
    date: 1986–2016
    when: "1987-01-22"
    borders: "1987-01-22"
    countries: [ph]
    body:
      - "After the People Power revolution of February 1986, President Corazon Aquino freed Sison and Buscayno and agreed a sixty-day ceasefire from December 1986. Talks collapsed after marines and police fired on a march of farmers demanding land reform near Malacañang Palace on 22 January 1987, killing thirteen, in what became known as the Mendiola massacre. The government launched a “total war” policy, and armed anti-communist vigilante groups such as Alsa Masa in Davao, encouraged by the army, spread through the countryside. Sison went into exile in the Netherlands, where he lived until his death."
      - "By the early 1990s the NPA had shrunk. In 1992 the CPP split between those who reaffirmed Sison’s line of protracted people’s war in the countryside and those who rejected it, and several regional organisations broke away. Peace talks resumed under President Fidel Ramos and produced The Hague Joint Declaration of 1 September 1992 and an agreement on human rights and humanitarian law in 1998, but no settlement; Norway became facilitator from 2001. Under President Gloria Macapagal Arroyo, hundreds of left-wing activists, journalists and church workers were killed, which a UN special rapporteur in 2007 blamed largely on the armed forces. The NPA recovered to several thousand fighters, strongest in eastern Mindanao, Samar and Negros."
    facts:
      - [Ceasefire, "December 1986 – February 1987"]
      - [Mendiola massacre, "22 January 1987, 13 killed"]
      - [The Hague Joint Declaration, "1 September 1992"]
      - [Human rights agreement (CARHRIHL), "16 March 1998"]
