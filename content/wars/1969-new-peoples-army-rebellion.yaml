  - title: Terrorist designation and decline
    date: 2016–2026
    when: "2026-04-19"
    borders: "2026-04-19"
    countries: [ph]
    body:
      - "Last updated 27 November 2026. President Rodrigo Duterte opened talks with the NDFP in Oslo in August 2016, but after clashes and mutual accusations he ended them on 23 November 2017 and on 5 December declared the CPP and NPA terrorist organisations. A national task force set up in 2018 combined military operations with offers of cash and amnesty for those who surrendered, while human rights groups accused it of branding legal activists as communists. The NPA lost many of its leaders: Benito and Wilma Tiamzon, the party’s chairman and secretary-general, died at sea off Samar in August 2022, and Sison died in Utrecht on 16 December 2022. In November 2023 the government and the NDFP agreed in Oslo to work towards resuming talks, but they did not resume."
      - "By the armed forces’ count the NPA had only one weakened guerrilla front left by the end of 2024, and in July 2025 President Ferdinand Marcos Jr. declared that there were no more guerrilla groups in the country; the CPP denied that the NPA was defeated. Fighting continued at a lower level. On 19 April 2026 an army operation at Toboso in Negros Occidental killed a regional NPA leader and others; the army said 19 rebels died, while the CPP and a later fact-finding mission said that ten fighters and nine civilians were killed, and the Commission on Human Rights opened an inquiry. In May 2026 Defense Secretary Gilberto Teodoro rejected calls to reopen peace talks unless the NPA renounced armed struggle. The armed forces report hundreds of surrenders each quarter, and more than 13,000 former rebels had applied for amnesty by April 2026; how many fighters remain is uncertain."
