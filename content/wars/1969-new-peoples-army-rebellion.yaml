steps:
  - title: The people’s war under martial law
    date: 1968–1986
    when: "1969-03-29"
    borders: "1972-09-23"
    countries: [ph]
    body:
      - "On 26 December 1968 José Maria Sison, a young lecturer who had broken with the old pro-Soviet Communist Party, refounded the Communist Party of the Philippines on Maoist lines. On 29 March 1969, at Capas in Tarlac, it joined forces with Bernabe Buscayno (“Kumander Dante”), a former member of the Huk guerrillas, to form the New People’s Army, with about sixty fighters and some thirty-five guns. The bombing of a Liberal Party rally at Plaza Miranda in Manila on 21 August 1971, which killed nine people, was blamed by President Ferdinand Marcos on the communists and helped him justify martial law in September 1972; former party members later said the CPP was responsible, which its leaders denied, while others blamed Marcos."
      - "Martial law drove students, workers, priests and peasants into the underground. Although Buscayno (1976) and Sison (1977) were captured, the NPA spread in small units across the countryside, from Samar, where it made its first big ambushes in the mid-1970s, to the Cordillera, Negros, Bicol and above all Mindanao. By 1986 it was present in most provinces and claimed some 25,000 fighters. In Mindanao in 1985–1986 the party’s fear of military infiltrators led to a purge, Kampanyang Ahos, in which hundreds of its own members were tortured and killed, a crime later revealed in mass graves."
    facts:
      - [CPP refounded, "26 December 1968"]
      - [NPA founded, "29 March 1969, Capas, Tarlac"]
      - [Plaza Miranda bombing, "21 August 1971"]
      - [Martial law, "September 1972 – January 1981"]
      - [NPA strength at its peak, "about 25,000 (mid-1980s)"]
