  - title: Tielieketi and the brink of war
    date: May – October 1969
    when: "1969-08-13"
    borders: "1969-08-13"
    countries: [cn, ru, kz]
    body:
      - "Clashes went on through the spring and summer, on the Amur and in Central Asia. On 8 July there was a clash on Goldinsky Island in the Amur, south-west of Khabarovsk. On 13 August, at the Dzungarian frontier between Soviet Kazakhstan and Xinjiang, some 300 Soviet troops with armoured vehicles and helicopters surrounded a Chinese patrol on the hills near Lake Zhalanashkol (Tielieketi to the Chinese) and destroyed it: about 28 Chinese soldiers were killed and one captured, and the Soviet side lost 2 killed and 10 wounded."
      - "The Soviet Union massed troops on the border, and its diplomats sounded out foreign governments, the United States among them, on how they would react to a strike on China’s nuclear installations. Moscow’s calls to Beijing went unanswered until the death of the Vietnamese leader Ho Chi Minh brought both governments to Hanoi in September. On his way home Kosygin stopped in Beijing, and on 11 September he and Zhou Enlai talked for three and a half hours at Beijing airport and agreed to keep the troops apart and open talks. China still feared a surprise attack: on 18 October the defence minister Lin Biao put the armed forces on alert with his “Order No. 1”, and leaders and offices were moved out of Beijing. Talks began in Beijing on 20 October 1969, and the fighting did not resume."
    facts:
      - [Goldinsky Island incident, "8 July 1969"]
      - [Tielieketi (Zhalanashkol), "13 August 1969"]
      - [Kosygin–Zhou meeting at Beijing airport, "11 September 1969"]
      - [Border talks begin, "20 October 1969"]
