  - title: The border settled
    date: 1991–2008
    when: "1991-05-16"
    borders: "1991-05-16"
    countries: [cn, ru]
    body:
      - The talks opened in 1969 dragged on for years and made little progress while relations stayed cold. They resumed in earnest after Mikhail Gorbachev’s visit to Beijing in 1989. On 16 May 1991 the two countries signed an agreement on the eastern section of the border, which followed the main channel of the rivers and gave Zhenbao Island to China; Soviet troops left it, and the agreement on the short western section followed in 1994.
      - Two islands at the meeting of the Amur and the Ussuri opposite Khabarovsk, Bolshoy Ussuriysky (Heixiazi) and Tarabarov (Yinlong), were left aside; the Soviet Union had held them since 1929. A supplementary agreement of 14 October 2004 gave China Tarabarov and about half of Bolshoy Ussuriysky, and the land was handed over in 2008, ending the last territorial dispute between the two countries.
    facts:
      - [Agreement on the eastern border, "16 May 1991"]
      - [Supplementary agreement on the islands, "14 October 2004"]
      - [Islands handed over, "2008"]
    markers:
