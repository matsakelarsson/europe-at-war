steps:
  - title: Zhenbao (Damansky) Island
    date: 2–17 March 1969
    when: "1969-03-02"
    borders: "1969-03-02"
    countries: [cn, ru]
    body:
      - By the late 1960s the quarrel between the Soviet Union and China over ideology and leadership of the communist world had become a confrontation of states. Border talks in 1964 had failed, there had been thousands of minor incidents, and after the Soviet invasion of Czechoslovakia in 1968 Beijing feared that it might be next. Zhenbao Island, about 0.7 square kilometres of low ground in the Ussuri, lay closer to the Chinese bank but was held by Soviet border guards, and through the winter of 1968–1969 patrols from both sides had brawled on the ice.
      - On the morning of 2 March 1969 Chinese soldiers who had crossed to the island at night ambushed a Soviet patrol from the Nizhne-Mikhailovka post under Senior Lieutenant Ivan Strelnikov. Strelnikov and some 30 of his men were killed and 14 wounded; Chinese sources give 29 Chinese dead, Soviet sources far more. Both countries then held mass protests. On 15 March the two sides fought for the island again, with tanks, artillery and, on the Soviet side, the then-secret BM-21 Grad rocket launchers firing into Chinese territory. Colonel Demokrat Leonov, the commander of the Iman border detachment, was killed after his tank was knocked out, and the Chinese later recovered a Soviet T-62 tank from the ice. In the whole battle Soviet losses were 58 killed and 94–95 wounded; Chinese sources give 72 Chinese killed and 68 wounded, while Soviet estimates of Chinese losses ran to 800.
    facts:
      - [Ambush on Zhenbao, "2 March 1969"]
      - [Main battle, "15 March 1969"]
      - [Soviet losses, "58 killed, 94–95 wounded"]
      - [Chinese losses, "72 killed and 68 wounded by Chinese count; Soviet claims up to 800 killed"]
