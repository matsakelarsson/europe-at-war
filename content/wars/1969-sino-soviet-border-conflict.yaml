id: sino-soviet-border-conflict
name: Sino-Soviet border conflict
start: "1969-03-02"
end: "1969-09-11"
tier: B
summary: "An undeclared conflict between the Soviet Union and the People’s Republic of China along their long border in 1969, the high point of the Sino-Soviet split. On 2 March Chinese troops ambushed a Soviet border patrol on Zhenbao Island (Damansky to the Russians), a small island in the Ussuri River claimed by both, and on 15 March the two sides fought a battle there with tanks and heavy artillery. Clashes followed on the Amur and in Xinjiang, where on 13 August Soviet troops destroyed a Chinese patrol near Lake Zhalanashkol (Tielieketi). Talk of a Soviet strike on China’s nuclear sites brought fears of a wider war, until the Soviet premier Alexei Kosygin met Zhou Enlai at Beijing airport on 11 September and the two governments agreed to negotiate. The conflict pushed China towards its opening to the United States. The border was finally settled by agreements of 1991 and 2004, which gave Zhenbao Island to China."
countries: [cn, ru, kz]
sides:
  - id: su
    name: Soviet Union
    polities: [ussr]
    ink: red
    moves: Soviet moves
    success: Soviet success
  - id: cn
    name: People’s Republic of China
    polities: [china]
    ink: gold
    moves: Chinese moves
    success: Chinese success
notes:
  - The border on the Amur and Ussuri was set by the treaties of Aigun (1858) and Peking (1860), which China calls unequal treaties. The Soviet Union held that the border ran along the Chinese bank, China that it followed the main channel (thalweg), which would put most islands, among them Zhenbao, on the Chinese side.
  - Each side blamed the other for starting the fighting, and casualty figures differ sharply between Soviet and Chinese sources. The fighting on 15 March and later is often counted as lasting until the end of the crisis in September or October 1969.
