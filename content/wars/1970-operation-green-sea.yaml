id: operation-green-sea
name: Operation Green Sea
start: "1970-11-22"
end: "1970-11-23"
tier: C
summary: "The Portuguese raid on Conakry, the capital of the Republic of Guinea, on the night of 21–22 November 1970, during the Guinea-Bissau War of Independence. Planned in Portuguese Guinea under the governor, General António de Spínola, and led by the naval officer Alpoim Calvão, a force of about 220 Portuguese soldiers, most of them African commandos and marines from Portuguese Guinea, and about 200 Guinean exiles of the National Liberation Front of Guinea (FLNG), sailed in unmarked ships and landed at several points in the city. Its aims were to free Portuguese prisoners held by the PAIGC, destroy the PAIGC’s boats and Guinea’s MiG fighters, capture or kill Amílcar Cabral and bring down President Ahmed Sékou Touré’s government. The raiders freed 26 Portuguese prisoners from Camp Boiro and burned PAIGC supply boats and Touré’s summer residence, but Cabral was abroad, the raiders did not destroy Guinea’s MiGs, the exiles attacked a radio station that was no longer in use, and no uprising followed; the force withdrew the next day, having lost a handful of men. Guinean deaths are estimated at between about 50 and 500. The UN Security Council condemned Portugal in Resolution 290 of 8 December 1970, and the Organisation of African Unity did the same; Portugal denied involvement. In Guinea, Sékou Touré used the attack to purge real and supposed opponents: a revolutionary tribunal sentenced dozens to death in January 1971, and many more were imprisoned in Camp Boiro, where many died."
