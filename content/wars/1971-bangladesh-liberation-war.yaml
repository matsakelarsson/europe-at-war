  - title: India enters the war
    date: 21 November – 9 December 1971
    when: "1971-12-03"
    borders: "1971-12-07"
    countries: [bd, in, pk]
    body:
      - On 21 November Indian troops with Mukti Bahini fighters crossed the border near Boyra and destroyed a Pakistani armoured counter-attack at Garibpur; the next day Indian fighters shot down Pakistani Sabres over the border. On the evening of 3 December 1971 the Pakistani air force struck air bases in north-western India, and India declared that it was at war. On 6 December India recognised Bangladesh. The Indian Eastern Command under Lieutenant-General Jagjit Singh Aurora and the Mukti Bahini formed a joint command.
      - About 90,000 Pakistani regular and paramilitary troops under Lieutenant-General A. A. K. Niazi were spread in fortified towns along the borders to defend every district. The Indian corps, with the Mukti Bahini guiding them, went round the strongpoints and raced for the river crossings on the way to Dhaka. India won command of the air in the first days and its carrier, INS Vikrant, blockaded the ports. Jessore was abandoned on 7 December, troops were landed by helicopter near Sylhet the same day, and on 9–11 December helicopters lifted an Indian brigade across the Meghna past the blown bridge at Ashuganj. The Pakistani submarine Ghazi sank off Visakhapatnam on 4 December.
    facts:
      - [Battle of Garibpur, "21–22 November 1971"]
      - [Pakistani air strikes in the west, "3 December 1971"]
      - [India recognises Bangladesh, "6 December 1971"]
      - [Jessore taken, "7 December 1971"]
    markers:
