  - title: Bangladesh
    date: December 1971 – 1974
    when: "1971-12-22"
    borders: "1971-12-17"
    countries: [bd, in, pk]
    body:
      - The provisional government returned to Dhaka on 22 December. Mujib was released by Bhutto, who had replaced Yahya Khan as president, and returned to Dhaka on 10 January 1972 to a huge welcome. Indian troops left Bangladesh by March 1972. Under the Simla Agreement of July 1972 and later agreements the Pakistani prisoners were sent home by 1974, without the war-crimes trials Bangladesh had planned, and Pakistan recognised Bangladesh in February 1974.
      - The country had to be rebuilt after a war that had destroyed bridges, ports and railways and uprooted tens of millions; most of the refugees returned from India within months. Hundreds of thousands of Urdu-speaking Biharis, seen as collaborators, were left stateless in camps. Bangladesh set up an International Crimes Tribunal in 2010, which tried and executed several leaders of the Jamaat-e-Islami and the militias for crimes committed in 1971; the trials were welcomed by many Bangladeshis and criticised by human-rights groups for their procedures.
    facts:
      - [Mujib returns to Dhaka, "10 January 1972"]
      - [Simla Agreement, "2 July 1972"]
      - [Pakistan recognises Bangladesh, "22 February 1974"]
    markers:
      - kind: capital
        side: bd
        name: Dhaka
        date: 10 January 1972
        text: Sheikh Mujibur Rahman returned by way of London and Delhi and became prime minister.
        lonlat: [90.410, 23.810]
