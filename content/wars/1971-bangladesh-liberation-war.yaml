notes:
  - "The death toll is disputed. Bangladesh’s official figure is three million. Many scholarly estimates fall between about 300,000 and 500,000; some researchers give lower figures, and Pakistan’s Hamoodur Rahman Commission (1974) gave about 26,000 civilians killed by the army. Bangladeshi estimates of women raped range from 200,000 to 400,000. Many international scholars and organisations describe the killings as genocide; Pakistan has not accepted the term."
  - Bengali fighters and crowds also killed many Urdu-speaking Biharis and West Pakistanis, in March and April 1971 and again after the surrender; estimates range widely, from a few thousand to many tens of thousands.
  - The war is the Liberation War (Muktijuddho) in Bangladesh. Pakistani accounts often call it the 1971 war or the fall of Dhaka, and stress Indian intervention. The war on India’s western front in December 1971 is told in the Indo-Pakistani War of 1971.
  - Place names are given in today’s forms (Dhaka, Chattogram is given as Chittagong, Jashore as Jessore).
