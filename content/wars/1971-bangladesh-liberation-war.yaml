  - title: The surrender at Dhaka
    date: 10–16 December 1971
    when: "1971-12-16"
    borders: "1971-12-16"
    countries: [bd, in, pk]
    body:
      - On 11 December Indian paratroops dropped at Tangail to cut off the Pakistani forces retreating from the north, and Indian columns and the Kader Bahini moved on Dhaka from the north while IV Corps closed from the east. Indian aircraft hit the Governor’s House on 14 December, and the provincial government resigned. The United States sent a naval task force led by the carrier Enterprise into the Bay of Bengal, and Soviet warships followed it. On 14 December, as the end approached, Al-Badr militiamen abducted and killed scores of Bengali teachers, doctors, writers and journalists, whose bodies were found at Rayerbazar and Mirpur.
      - Niazi agreed to surrender. On the afternoon of 16 December 1971 he signed the Instrument of Surrender before Aurora on the Ramna Race Course in Dhaka, in front of a large crowd. About 93,000 Pakistani soldiers, paramilitaries, police and civilians became prisoners of India. The Indian army lost about 1,500 killed in the east, and Pakistani forces several thousand; the Mukti Bahini’s own losses were heavy. Khulna, the last garrison, surrendered on 17 December. Bangladesh marks 16 December as Victory Day.
