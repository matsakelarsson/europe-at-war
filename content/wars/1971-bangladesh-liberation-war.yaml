steps:
  - title: The election and the crackdown
    date: November 1970 – March 1971
    when: "1971-03-25"
    borders: "1971-03-25"
    countries: [bd, pk]
    body:
      - Pakistan was two wings 1,600 km apart. The eastern wing, East Pakistan, had more than half the population, but the army, the civil service and economic power were dominated by the west. Bengali grievances had grown since the language movement of 1952, and in 1966 Sheikh Mujibur Rahman of the Awami League put forward Six Points for a loose federation. In November 1970 a cyclone killed several hundred thousand people in the coastal districts, and the central government’s slow response deepened the anger.
      - In Pakistan’s first general election, on 7 December 1970, the Awami League won 160 of the 162 general seats in East Pakistan, giving it a majority in the National Assembly of 313. In the west Zulfikar Ali Bhutto’s Pakistan Peoples Party won most seats. Bhutto would not accept a constitution on Mujib’s terms, and on 1 March 1971 the military president, General Yahya Khan, postponed the assembly. East Pakistan answered with strikes and a non-cooperation movement that left the provincial administration taking orders from Mujib. On 7 March Mujib told a huge crowd in Dhaka that “the struggle this time is the struggle for independence”. Talks in Dhaka went on while the army flew in troops.
      - On the night of 25 March the army began Operation Searchlight. Troops attacked Dhaka University, the police lines at Rajarbagh, the headquarters of the East Pakistan Rifles and Hindu neighbourhoods of the old city, killing thousands in a few days. Mujib was arrested at his house soon after midnight and flown to West Pakistan, where he was held for the rest of the war.
    facts:
      - [Bhola cyclone, "12 November 1970"]
      - [General election, "7 December 1970"]
      - [Awami League, "160 of 162 general seats in East Pakistan"]
      - [Operation Searchlight, "night of 25 March 1971"]
