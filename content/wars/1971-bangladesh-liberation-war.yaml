id: bangladesh-liberation-war
name: Bangladesh Liberation War
start: "1971-03-26"
end: "1971-12-16"
tier: A
summary: "The war in which East Pakistan became independent as Bangladesh. After the Awami League of Sheikh Mujibur Rahman won the Pakistani elections of December 1970 and the military government postponed the new assembly, the Pakistan Army began a crackdown in Dhaka on the night of 25 March 1971 (Operation Searchlight) and arrested Mujib. Bengali leaders declared independence, a government in exile was formed, and Bengali soldiers, police and volunteers, the Mukti Bahini, fought a guerrilla war with Indian support. The army and allied militias killed large numbers of civilians, especially Hindus, students and Awami League supporters; estimates of the dead range from about 300,000 to three million, and some ten million refugees fled to India. India entered the war openly in December, and Pakistan’s Eastern Command surrendered in Dhaka on 16 December 1971."
countries: [bd, in, pk]
sides:
  - id: bd
    name: Bangladesh (the provisional government and the Mukti Bahini)
    polities: [bangladesh]
    ink: red
    moves: Mukti Bahini moves
    success: Bangladeshi success
  - id: in
