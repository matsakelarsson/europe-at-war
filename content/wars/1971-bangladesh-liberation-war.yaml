  - title: The guerrilla war
    date: May – November 1971
    when: "1971-08-15"
    borders: "1971-08-15"
    countries: [bd, in, pk]
    body:
      - The provisional government organised its forces, the Mukti Bahini, under Colonel M. A. G. Osmani in eleven sectors, with regular brigades formed from the Bengali battalions. India trained and armed tens of thousands of guerrillas in camps along the border. They ambushed patrols, blew up bridges and attacked river traffic, and in Tangail a local force under Kader Siddiqui held a large area. On the night of 15–16 August naval commandos trained in India mined ships in Chittagong, Mongla, Chandpur and Narayanganj (Operation Jackpot). The army raised Bengali and Bihari auxiliaries, the Razakars, and militias of the Jamaat-e-Islami’s student wing, Al-Badr and Al-Shams.
      - By the autumn some ten million refugees, most of them Hindus, were living in camps in West Bengal, Tripura, Assam and Meghalaya. India’s prime minister, Indira Gandhi, toured world capitals to press for a settlement. Washington under Richard Nixon and Henry Kissinger leaned towards Pakistan, which was its channel to China, despite protests from its own diplomats in Dhaka; on 9 August India signed a treaty of friendship with the Soviet Union. From October Indian artillery and troops increasingly supported the guerrillas across the border.
    facts:
      - [Operation Jackpot, "15–16 August 1971"]
      - [Indo-Soviet Treaty of Friendship, "9 August 1971"]
      - [Refugees in India, "about 10 million"]
      - [Mukti Bahini, "about 175,000 by December, regulars and guerrillas"]
    markers:
      - kind: event
        side: bd
        name: Chittagong
        date: 15–16 August 1971
        text: Naval commandos swam into the harbour at night and sank or damaged several ships with limpet mines.
        lonlat: [91.800, 22.310]
      - kind: event
        side: bd
