  - title: Independence declared
    date: March – May 1971
    when: "1971-03-26"
    borders: "1971-04-17"
    countries: [bd, in, pk]
    body:
      - Independence was declared on 26 March 1971; Bangladeshi accounts hold that Mujib sent out the declaration before his arrest. On 27 March Major Ziaur Rahman of the East Bengal Regiment read a declaration on Mujib’s behalf over a rebel radio transmitter at Kalurghat near Chittagong. Bengali battalions of the army, most of the East Pakistan Rifles and the police rose, and for some weeks they held Chittagong, Kushtia, Jessore’s countryside and much of the province outside the cantonments.
      - Reinforced by air from the west, the army retook the towns by May. Its operations were accompanied by mass killings, above all of Hindus, students, intellectuals and Awami League supporters, and by widespread rape. At Chuknagar near Khulna on 20 May troops killed thousands of Hindu refugees on their way to India. In the same weeks Bengali crowds and fighters killed many Biharis in towns such as Chittagong, Khulna and Santahar.
      - Awami League leaders who escaped to India formed a provisional government. It was proclaimed on 10 April and sworn in on 17 April in a mango grove at Baidyanathtala on the Indian border, renamed Mujibnagar, with Mujib as president in absentia, Syed Nazrul Islam as acting president and Tajuddin Ahmad as prime minister. It worked from Calcutta for the rest of the war.
    facts:
      - [Declaration of independence, "26 March 1971"]
      - [Kalurghat broadcast, "27 March 1971"]
      - [Provisional government sworn in, "17 April 1971"]
      - [Chuknagar massacre, "20 May 1971"]
