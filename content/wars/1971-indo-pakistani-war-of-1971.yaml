  - title: Ceasefire and the Simla Agreement
    date: December 1971 – 1974
    when: "1971-12-17"
    borders: "1971-12-17"
    countries: [in, pk, bd]
    body:
      - After the surrender in Dhaka on 16 December, India announced a unilateral ceasefire in the west, which Pakistan accepted; the fighting stopped on the evening of 17 December. Yahya Khan resigned, and Zulfikar Ali Bhutto took over as president of what remained of Pakistan. India held about 93,000 Pakistani prisoners and some 15,000 km² of Pakistani territory in the west, while Pakistan held ground at Chhamb and a few other places.
      - At Simla on 2 July 1972 Indira Gandhi and Bhutto agreed to settle their differences by peaceful means and bilateral talks. India returned the land it had taken across the international border; in Kashmir the line at the ceasefire, which left India about 880 km² and Pakistan about 150 km² gained across the old line, replaced the 1949 ceasefire line as the Line of Control. The prisoners were sent home by 1974, after Pakistan recognised Bangladesh in February that year.
    facts:
      - [Ceasefire in the west, "17 December 1971"]
      - [Simla Agreement, "2 July 1972"]
      - [Pakistani prisoners, "about 93,000"]
    markers:
