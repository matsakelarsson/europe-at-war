  - title: Shakargarh, Sindh and Karachi
    date: 4–17 December 1971
    when: "1971-12-15"
    borders: "1971-12-16"
    countries: [in, pk]
    body:
      - On the night of 4–5 December Indian missile boats, towed close to the coast, attacked Karachi in Operation Trident, sinking the destroyer Khaibar, a minesweeper and a cargo ship, and setting oil tanks on fire; a second raid on 8–9 December (Operation Python) hit more ships and the fuel depot. On 9 December the Pakistani submarine Hangor sank the Indian frigate Khukri off Diu with the loss of 194 men. In the east the Pakistani submarine Ghazi had sunk off Visakhapatnam on the first night.
      - India attacked into the Shakargarh salient between Jammu and the Punjab, and from 15 to 16 December its armour defeated Pakistani counter-attacks at Basantar, where Second Lieutenant Arun Khetarpal was killed in his tank and awarded the Param Vir Chakra. In the desert Indian troops advanced into Sindh and took several thousand square kilometres around Chachro, and in Ladakh they took Turtuk and other villages of the Shyok valley.
