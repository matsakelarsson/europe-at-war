id: indo-pakistani-war-of-1971
name: Indo-Pakistani War of 1971
start: "1971-12-03"
end: "1971-12-17"
tier: B
summary: "The third war between India and Pakistan, fought on both of Pakistan’s fronts from 3 to 17 December 1971. It grew out of the Bangladesh Liberation War: after months of Indian support for the Bengali guerrillas, Pakistan struck Indian air bases on 3 December, and India declared war. In the east Indian forces and the Mukti Bahini reached Dhaka in thirteen days, and Pakistan’s Eastern Command surrendered on 16 December; that campaign is told in the Bangladesh Liberation War. In the west the armies fought in Kashmir, the Punjab and the Rajasthan desert, with battles at Chhamb, Longewala and Basantar, and the Indian navy attacked Karachi with missile boats. India declared a ceasefire in the west on 17 December. About 93,000 Pakistani prisoners were taken, and the Simla Agreement of 1972 turned the ceasefire line in Kashmir into the Line of Control."
