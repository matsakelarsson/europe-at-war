steps:
  - title: The air strikes and the western front
    date: 3–7 December 1971
    when: "1971-12-03"
    borders: "1971-12-03"
    countries: [in, pk]
    body:
      - On the evening of 3 December 1971 the Pakistani air force struck Indian air bases from Srinagar and Amritsar to Agra, hoping to repeat the Israeli surprise of 1967. The damage was slight. Indira Gandhi told the nation that Pakistan had launched a war, and India attacked in the east and went over to the defensive in most of the west, where Pakistan had concentrated its strength.
      - In the north Pakistan attacked again in the Chhamb sector, as in 1965, and after a week of hard fighting pushed the Indian forces back across the Munawar Tawi; Chhamb stayed in Pakistani hands after the war. Attacks on Poonch were beaten off. In the Rajasthan desert a Pakistani armoured brigade drove at night on 4–5 December towards the Indian post at Longewala, held by about 120 men of the 23rd Punjab Regiment. The post held until dawn, when Indian Hunter jets attacked the tanks stuck in the sand, destroying or disabling dozens.
    facts:
      - [Pakistani air strikes, "3 December 1971"]
      - [Battle of Longewala, "4–7 December 1971, Indian victory"]
      - [Battle of Chhamb, "3–10 December 1971, Pakistani victory"]
