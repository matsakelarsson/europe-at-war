notes:
  - Casualty estimates vary. Indian official figures give about 3,800 Indian dead on both fronts; estimates of Pakistani military dead range from about 5,000 (a CIA estimate) to 9,000. The eastern campaign and its dead are described in the Bangladesh Liberation War.
  - In Pakistan the war and the loss of the east are remembered as the fall of Dhaka, and blamed on Indian intervention and on the failures of the military government examined by the Hamoodur Rahman Commission.
