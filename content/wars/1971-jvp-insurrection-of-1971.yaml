id: jvp-insurrection-of-1971
name: JVP insurrection of 1971
start: "1971-04-05"
end: "1971-06"
tier: C
summary: "An armed rising against the government of Ceylon (Sri Lanka from 1972) by the Janatha Vimukthi Peramuna (JVP, People’s Liberation Front), a Marxist movement of mostly young, educated and unemployed Sinhalese from the rural south. Its leader, Rohana Wijeweera, was arrested in March 1971, and the government of Sirimavo Bandaranaike declared a state of emergency. On 5 April, starting with the police station at Wellawaya, JVP groups attacked 92 police stations across the island, took five and forced the abandonment of dozens more, and for some weeks held much of the Southern and Sabaragamuwa provinces and parts of the interior. With arms, aircraft and helicopters sent by India, Pakistan, the United Kingdom, the Soviet Union and others, the army and police retook the rebel areas by June. Thousands of young people were killed, many after capture; the government’s figure at the time was about 1,200 dead, while unofficial estimates run from 4,000–5,000 to 10,000 or more."
