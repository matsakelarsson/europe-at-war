notes:
  - The security forces lost about 60 dead. Thousands of suspected insurgents were detained, and their leaders were tried by a special Criminal Justice Commission; Wijeweera was released in 1977 and led a second, larger JVP insurrection in 1987–1989.
  - Government forces were accused of summary executions, of which the killing of the young Kataragama woman Premawathie Manamperi became the best known.
