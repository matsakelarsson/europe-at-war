id: ikiza
name: Ikiza (1972 killings in Burundi)
start: "1972-04-29"
end: "1972-06-21"
tier: C
summary: "A Hutu rising in southern Burundi in April 1972 and the mass killings of Hutu by the Tutsi-dominated army and government that followed, known in Kirundi as the Ikiza (“the catastrophe”) or Ubwicanyi (“the killings”). Since 1966 President Michel Micombero had ruled with a circle of Tutsi officers and officials from Bururi province, the Groupe de Bururi, and Hutu had been pushed out of the army and government after the killings and the attempted coup of 1965. On 30 March 1972 the deposed king Ntare V returned from exile in Uganda and was held at Gitega. Between 20:00 and 21:00 on 29 April Hutu militants, joined by exiled Zairean rebels whom Burundians called “Mulelists”, attacked in Bujumbura and in the south around Rumonge, Nyanza-Lac and Bururi, killing officials and every Tutsi they found and Hutu who would not join them: missionaries estimated 800–1,200 dead. That night Ntare V was killed at Gitega. Zaire’s President Mobutu sent paratroopers to hold Bujumbura airport and Tanzania sent ammunition; the army retook Rumonge on 1 May and Nyanza-Lac on 2 May. It then turned on the Hutu population across the country, above all educated Hutu: teachers, priests, civil servants, soldiers, pupils and university students were taken from lists and killed by the army and the ruling party’s youth wing, the Jeunesses Révolutionnaires Rwagasore, and buried in mass graves. The army declared operations over on 21 June. Conservative estimates of the dead range from 100,000 to 150,000; some go up to 300,000, about 10–15 per cent of Burundi’s Hutu men. Tens of thousands fled, most of them to Tanzania; by mid-1973 about 35,000 had reached Zaire and about 6,000 Rwanda. Historians disagree whether it was a genocide: Jean-Pierre Chrétien and Leo Kuper called it one, René Lemarchand a “selective genocide”, others “organised massacres”; in December 2021 Burundi’s Truth and Reconciliation Commission declared that the state had committed genocide against the Hutu in 1972. The Ikiza’s legacy, and the fear it left on both sides, shaped Burundi’s later crises of 1988 and 1993."
