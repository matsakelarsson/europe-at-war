notes:
  - Upper Volta was renamed Burkina Faso on 4 August 1984. Its colonial borders were unsettled partly because France abolished the colony in 1932 and divided it among French Sudan, Niger and the Ivory Coast, before restoring it in 1947.
  - The extent of the disputed strip is drawn approximately; the border on the map is the line the International Court of Justice fixed in 1986.
