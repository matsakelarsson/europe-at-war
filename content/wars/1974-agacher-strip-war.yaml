id: agacher-strip-war
name: Agacher Strip War
start: "1974-11"
end: "1985-12-30"
tier: B
summary: "Two short border wars between Mali and Upper Volta (Burkina Faso from 1984) over the Agacher, a strip of semi-desert about 160 km long on their common border in the north-east of Burkina Faso, with seasonal pools along the Béli river that mattered to herders and, it was believed, minerals underground. The colonial boundary between French Sudan and Upper Volta had never been marked on the ground, and both states claimed the strip. Fighting in November and December 1974 ended in African mediation and an agreement to have the line studied. In December 1985, after a Burkinabé census reached villages in the strip, Mali attacked on Christmas Day with armour and aircraft and took most of the Agacher; Burkinabé aircraft bombed Sikasso. A ceasefire arranged by the West African defence pact ANAD took effect on 30 December. Estimates of the dead range from about 60 to about 140, soldiers and civilians. Both states had already put the dispute to the International Court of Justice, whose chamber on 22 December 1986 divided the strip roughly in two, giving Mali the more populated west and Burkina Faso the east along the Béli; both accepted the ruling."
countries: [ml, bf]
sides:
