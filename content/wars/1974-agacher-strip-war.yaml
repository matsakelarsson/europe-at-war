        polygon: [[-1.70, 14.55], [-1.10, 14.72], [-0.80, 14.92], [-0.50, 14.95], [0.25, 14.80], [0.25, 15.10], [-0.50, 15.25], [-0.85, 15.25], [-1.20, 15.05], [-1.75, 14.85]]
  - title: The Christmas War and the court’s ruling
    date: 25–30 December 1985
    when: "1985-12-25"
    borders: "1985-12-25"
    countries: [ml, bf]
    body:
      - "Relations worsened after Captain Thomas Sankara took power in Upper Volta in 1983 and renamed it Burkina Faso. In 1983 he and Moussa Traoré agreed to take the dispute to the International Court of Justice, but Sankara’s revolutionary speeches alarmed Mali’s military government, which faced drought, debt and unrest of its own. Burkina Faso held its national census from 10 to 20 December 1985, and on 14 December soldiers entered the Agacher to help the census takers. Mali accused them of pressing its citizens in the villages of Dionouga, Sebba, Kounia and Douna to register as Burkinabé, which Burkina Faso denied."
      - "On 25 December Malian armoured columns crossed the border and quickly took Dionouga, Selba, Kouna and Douna, while Malian MiG-21s bombed Djibo, Ouahigouya and Nassoumbou. Burkina Faso’s forces, weaker in armour, fought back with small units, raided across the border at Zégoua and on 26 December bombed Sikasso. On 28 December a Malian column heading for the border village of Koloko, on the road to Bobo-Dioulasso, was stopped at Mahon, and Malian aircraft struck Djibo, Ouahigouya, Tougan and Dédougou. A truce proposed by Libya and Nigeria broke down within hours, and the leaders of Senegal, the Ivory Coast, Togo, Benin and Niger offered another; the ceasefire arranged by ANAD, the defence pact of the francophone West African states, held from the morning of 30 December."
      - "Estimates of the dead range from about 60, the official figures of 48 Burkinabé and 11 Malians, to more than 100 Burkinabé and some 40 Malians, soldiers and civilians together; prisoners were exchanged in early 1986. Traoré and Sankara were reconciled at an ANAD summit in Yamoussoukro on 17 January 1986. On 22 December 1986 a chamber of the International Court of Justice drew a line through the Agacher that gave Mali the more populated western part and Burkina Faso the eastern part along the Béli; both governments accepted it. The poor showing of his army hurt Sankara, who was overthrown and killed by Blaise Compaoré in October 1987."
    facts:
      - [Malian offensive, "25 December 1985"]
      - [Ceasefire, "30 December 1985"]
      - [ICJ judgment, "22 December 1986"]
