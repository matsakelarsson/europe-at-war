steps:
  - title: The first clashes
    date: November 1974 – July 1975
    when: "1974-11"
    borders: "1974-12-15"
    countries: [ml, bf]
    body:
      - "The Agacher lies where the Sahel turns into desert, north of Djibo and west of the Béli, a seasonal river whose pools and pastures drew Fulani and Tuareg herders from both sides of the border. When French West Africa broke up in 1960, Mali and Upper Volta inherited a boundary that rested on colonial decrees and maps that disagreed with each other, and both claimed the strip; Upper Volta administered it, while Mali argued that its inhabitants had always looked to Malian districts. The drought of the early 1970s made water and grazing more valuable, and rumours of manganese and other minerals added to the stakes."
      - "In late November 1974 Malian troops moved into villages of the strip and the two armies clashed. Presidents Moussa Traoré of Mali and Sangoulé Lamizana of Upper Volta met at Faramana on the border on 4 December, but incidents went on until a truce at the end of December. The Organisation of African Unity set up a mediation commission, with Togo, Niger, Guinea and Senegal among its members; at Lomé in June 1975 both sides agreed to a neutral commission to study the line, and in July 1975 the two presidents met in Conakry under the auspices of Guinea’s Ahmed Sékou Touré. The clashes were brief, but the dispute was not settled."
    facts:
      - [First clashes, "late November – December 1974"]
      - [Lomé meeting, "June 1975"]
