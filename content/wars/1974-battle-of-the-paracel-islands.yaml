id: battle-of-the-paracel-islands
name: Battle of the Paracel Islands
start: "1974-01-19"
end: "1974-01-20"
tier: C
summary: "A naval battle in which China took the western Paracel Islands in the South China Sea from South Vietnam. The islands are claimed by China, Taiwan and Vietnam; since 1956 the People’s Republic had held the eastern Amphitrite group, with Woody Island, and South Vietnam the western Crescent group, with Pattle Island. In January 1974 Chinese fishing boats and militia landed on Duncan and Drummond islands, and South Vietnamese warships came to remove them. On 19 January four South Vietnamese warships and six smaller Chinese submarine chasers and minesweepers fought off Duncan Island: the escort ship Nhật Tảo was sunk and the other ships damaged, and South Vietnam lost about 75 men killed; China gave its losses as 18 killed. The next day Chinese troops landed on Pattle, Robert and Money islands and took 48 prisoners, among them an American liaison officer, Gerald Kosh, who was released on 31 January. The United States declined to intervene, the UN Security Council dropped South Vietnam’s complaint, and North Vietnam kept silent. China has held all the Paracels since. China regards the islands as Chinese since ancient times and the battle as a counter-attack in self-defence; Vietnam, which renewed the claim after reunification as successor to South Vietnam and to the Nguyễn emperors who sent expeditions to the islands from the 18th century, calls it an invasion and commemorates the 74 sailors it counts as killed. On 14 March 1988, at Johnson South Reef in the Spratly Islands, Chinese ships opened fire on Vietnamese troops standing on the reef and sank their transport ships, killing 64 Vietnamese; China took six reefs and has since turned some of them into artificial islands. The disputes over both archipelagos remain unresolved."
