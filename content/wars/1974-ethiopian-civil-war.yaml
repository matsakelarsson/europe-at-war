  - title: Afabet, Shire and the loss of Tigray
    date: 1988–1989
    when: "1989-02-15"
    borders: "1989-03-01"
    countries: [et, er]
    body:
      - "In March 1988 the EPLF broke out of its Nakfa trenches and destroyed the Derg’s Nadew Command at Afabet, capturing tanks and heavy guns and some thousands of prisoners. The TPLF, which had resumed military cooperation with the EPLF, attacked in Tigray at the same time and took several towns. The government struck back from the air: on 22 June 1988, market day, its aircraft bombed and strafed the town of Hawzen, which the TPLF had held, killing an estimated 1,800 to 2,500 people."
      - "In February 1989 the TPLF defeated a government army corps at Shire (Inda Selassie) in north-western Tigray; thousands of soldiers were killed or captured. The government then evacuated its garrisons from Mekelle and the rest of Tigray, which came wholly under TPLF control. On 16 May 1989, while Mengistu was abroad, senior generals attempted a coup; it failed, and many of them were killed or executed, weakening the army further."
      - "In 1989 the TPLF and the Ethiopian People’s Democratic Movement, an Amhara group it had sponsored, formed the Ethiopian People’s Revolutionary Democratic Front (EPRDF), later joined by the Oromo People’s Democratic Organisation, with the TPLF’s leader Meles Zenawi as its chairman. The new front announced that its aim was to overthrow the Derg in all of Ethiopia, not only to free Tigray. Soviet support was meanwhile drying up as Mikhail Gorbachev cut aid to Moscow’s allies."
    facts:
      - [Battle of Afabet, "17–20 March 1988"]
      - [Hawzen bombed, "22 June 1988"]
      - [Battle of Shire, "February 1989"]
      - [Coup attempt, "16 May 1989"]
