notes:
  - "The war in Eritrea, which began in 1961, has its own story (Eritrean War of Independence), and so has the Ogaden War with Somalia (1977–1978); this story tells them only where they shaped the war in Ethiopia as a whole."
  - "Death tolls are uncertain. Estimates for the Red Terror range from about 10,000 to over 500,000 (Amnesty International gave the higher figure); for the famine of 1983–1985 from about 300,000 (USAID) and 400,000–500,000 (Alex de Waal) to the United Nations figure of one million, which de Waal considers unfounded. Human Rights Watch put the deaths caused by forced resettlement at no fewer than 50,000."
  - Ethiopian dates are given in the Gregorian calendar, as in the English sources.
