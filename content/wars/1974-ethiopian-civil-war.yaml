id: ethiopian-civil-war
name: Ethiopian Civil War
start: "1974-09-12"
end: "1991-05-28"
tier: A
summary: "The seventeen years of war that followed the overthrow of Emperor Haile Selassie by the Derg, a committee of army officers and soldiers, in September 1974. Under Mengistu Haile Mariam the Derg declared Ethiopia a Marxist–Leninist state, nationalised the land, and fought a long list of opponents with Soviet and Cuban support: the Eritrean fronts, the Tigray People’s Liberation Front (TPLF), the Oromo Liberation Front, the Western Somali Liberation Front and Somalia, the monarchist Ethiopian Democratic Union, and in the cities the Ethiopian People’s Revolutionary Party, which it crushed in the Red Terror of 1976–1978. The famine of 1983–1985, worsened by war and by the government’s counterinsurgency, killed some 400,000 to a million people. From 1988 the rebels gained the upper hand: the Eritrean People’s Liberation Front destroyed a Derg army at Afabet, the TPLF drove the government out of Tigray after the battle of Shire in 1989, and the TPLF-led Ethiopian People’s Revolutionary Democratic Front (EPRDF) advanced on Addis Ababa. Mengistu fled on 21 May 1991, the EPLF took Asmara on 24 May and the EPRDF entered the capital on 28 May. At least 1.4 million people died in the war and the famines, and Eritrea became independent in 1993."
countries: [et, er]
