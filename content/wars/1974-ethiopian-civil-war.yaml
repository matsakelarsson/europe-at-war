  - title: The Red Terror
    date: 1976–1978
    when: "1977-02-03"
    borders: "1977-06-01"
    countries: [et]
    body:
      - "The Derg’s bitterest enemies in the cities were on the left. The EPRP, a Marxist party with strong support among students, teachers and workers, demanded civilian rule and in 1976 began a campaign of assassinations of Derg officials and supporters, which its opponents called the White Terror. The rival All-Ethiopia Socialist Movement (MEISON) at first worked with the Derg. In September 1976 the Derg proclaimed a counter-campaign, the Qey Shibir or Red Terror, and armed the urban neighbourhood associations, the kebeles, to hunt down “counter-revolutionaries”."
      - "On 3 February 1977 a shootout at the Derg’s headquarters left Teferi Bante and his supporters dead, and Mengistu Haile Mariam became chairman. In a speech in Revolution Square he called for death to the EPRP and smashed bottles of red liquid to show what awaited the revolution’s enemies. Through 1977 and into 1978 kebele militias and security forces arrested, tortured and killed tens of thousands of young people, mainly in Addis Ababa but also in Gondar, Dessie, Asmara and other towns; bodies were left in the streets with notices, and families had to pay for the bullets to recover them. MEISON, which broke with the Derg in August 1977, was destroyed in turn."
      - "Estimates of the dead range from about 10,000 to several hundred thousand. After 1991 the new government put Derg officials on trial; in 2006 Mengistu, in exile in Zimbabwe, was convicted of genocide in absentia, and in 2008 the Supreme Court sentenced him to death. The Red Terror Martyrs’ Memorial Museum in Addis Ababa commemorates the victims."
    facts:
      - [Red Terror, "September 1976 – 1978"]
      - [Mengistu chairman of the Derg, "3 February 1977"]
      - [Dead, "estimates range from about 10,000 to over 500,000"]
    markers:
      - kind: toll
        side: et
        name: Addis Ababa
        date: 1976–1978
        text: Centre of the Red Terror. The kebele militias and security forces killed EPRP and MEISON members and suspects by the thousand.
        lonlat: [38.752, 9.036]
        lp: l
      - kind: toll
        side: et
        name: Gondar
        date: 1977–1978
        text: The Red Terror was carried out in provincial towns as well, among them Gondar, where its local leader Melaku Tefera was later tried for the killings.
        lonlat: [37.467, 12.610]
      - kind: toll
        side: et
        name: Dessie
        date: 1977–1978
        text: One of the provincial towns where kebele militias killed young people suspected of EPRP sympathies.
        lonlat: [39.635, 11.123]
  - title: Famine and counterinsurgency
    date: 1982–1986
    when: "1984"
    borders: "1984-10-01"
    countries: [et, er]
    body:
      - "In the 1980s the TPLF built up a guerrilla army and an administration in rural Tigray, with land reform, elected councils and its relief arm, the Relief Society of Tigray (REST), while the government held the towns and the main roads. In 1982 the Derg launched its largest offensive in Eritrea, the Red Star campaign, which failed to take Nakfa. When drought returned in 1983–1984, the government’s war against the rebels turned it into a disaster: it restricted the movement of people and trade, bombed markets, and used relief food to feed its troops and to draw people out of rebel areas, while ten years of the revolution were celebrated in Addis Ababa in September 1984."
      - "The famine struck Tigray, Wollo and Eritrea hardest. In October 1984 a BBC report by Michael Buerk from the camp at Korem, where tens of thousands of starving people had gathered, described “a biblical famine in the 20th century” and set off a worldwide relief effort, among them the Live Aid concerts of 13 July 1985. Aid to rebel areas went across the border from Sudan; the TPLF and REST led some 200,000 people on foot to camps in Sudan in late 1984 and 1985. Estimates of deaths range from about 300,000 to a million, and Human Rights Watch concluded that government policy caused more than half of them."
      - "In 1984–1986 the government moved some 600,000 people from the north to the south and west, many of them by force, in a resettlement programme that also emptied rebel areas; at least 50,000 died in it. In 1985 it began villagization, moving millions of peasants into planned villages. In 1987 the Derg dissolved itself and proclaimed the People’s Democratic Republic of Ethiopia, with Mengistu as president and the Workers’ Party of Ethiopia as the only party."
    facts:
      - [Red Star campaign in Eritrea, "February – June 1982"]
      - [BBC report from Korem, "October 1984"]
      - [Famine deaths, "about 300,000 to a million"]
      - [Resettled, "about 600,000 (1984–1986)"]
    markers:
