steps:
  - title: The fall of the emperor
    date: February – November 1974
    when: "1974-09-12"
    borders: "1974-09-12"
    countries: [et]
    body:
      - "In early 1974 Ethiopia was an empire ruled for over forty years by Haile Selassie, now in his eighties, with a landed nobility, a church that held much of the land, and a war in Eritrea that had gone on since 1961. A famine in Wollo and Tigray in 1972–1974 had killed tens of thousands, perhaps far more, while the government played it down; a British television film about it, The Unknown Famine, was shown in Ethiopia in September 1974. From February 1974 revolts by soldiers in army units, strikes, and protests by students and teachers over fuel prices and pay forced the government to resign."
      - "In June officers and soldiers elected from army and police units formed a committee, the Derg (“committee” in Ge’ez). It arrested the emperor’s ministers and courtiers one by one, and on 12 September 1974 it deposed Haile Selassie himself, who was driven from the palace in a Volkswagen. Lieutenant General Aman Andom, a popular Eritrean-born soldier, became head of state, but he wanted a negotiated settlement in Eritrea and clashed with the Derg’s radicals, among them Major Mengistu Haile Mariam."
      - "On the night of 23 November 1974 the Derg had sixty prisoners shot without trial at the Kerchele prison in Addis Ababa: two former prime ministers, ministers, nobles, generals and some of its own members. Aman Andom was killed the same night resisting arrest at his house. The killings, known as the Massacre of the Sixty or Black Saturday, ended any hope of a peaceful transition. Brigadier General Teferi Bante became chairman, and the Derg sent more troops to Eritrea."
    facts:
      - [Haile Selassie deposed, "12 September 1974"]
      - [Massacre of the Sixty, "23 November 1974"]
      - [Haile Selassie’s death in custody, "27 August 1975"]
    markers:
      - kind: event
        side: et
        name: Addis Ababa
        date: 12 September and 23 November 1974
        text: The emperor was deposed in his palace in September. In November sixty officials of the old regime were executed in the Kerchele prison.
        lonlat: [38.752, 9.036]
        lp: l
      - kind: toll
        name: Famine in Wollo
        date: 1972–1974
        text: The famine in the north-east, hidden by the imperial government, helped to discredit it. Estimates of deaths range from about 40,000 to 200,000.
        lonlat: [39.635, 11.123]
      - kind: event
        name: Asmara
        date: November 1974
        text: The Derg rejected Aman Andom’s plan for talks with the Eritrean fronts and sent reinforcements to Eritrea, where the war had gone on since 1961.
        lonlat: [38.933, 15.339]
  - title: Revolution and rebellion everywhere
    date: 1975–1977
    when: "1975-02-18"
    borders: "1977-06-01"
    countries: [et, er]
    body:
      - "The Derg declared Ethiopia socialist, nationalised banks and industry, and on 4 March 1975 nationalised all rural land, ending the power of the landlords in the south. Students were sent to the countryside in a campaign to teach and organise the peasants, and urban land and rented houses were nationalised too. The monarchy was abolished in March 1975; Haile Selassie died in custody in August."
      - "Armed opposition rose on all sides. On 18 February 1975 a group of Tigrayan students founded the Tigray People’s Liberation Front (TPLF) at Dedebit in western Tigray, at first with help from the EPLF in Eritrea. It fought not only the government but rival movements: the Tigray Liberation Front, the monarchist Ethiopian Democratic Union (EDU) of Ras Mengesha Seyoum, which operated from Sudan and briefly took border towns such as Humera in 1977, and the Ethiopian People’s Revolutionary Party (EPRP), which had an armed wing in eastern Tigray. The Oromo Liberation Front, founded in 1973, fought in the Chercher highlands of Hararghe, and in the south-east the Western Somali Liberation Front, backed by Somalia, took most of the Ogaden."
      - "By mid-1977 the two Eritrean fronts held almost all of Eritrea except Asmara, Massawa and a few garrisons. The Derg answered with a peasant army: in 1976 it marched tens of thousands of poorly armed peasants, the Raza force, towards Eritrea, and they were scattered. The turning point came when the Soviet Union, breaking with Somalia, armed Ethiopia from late 1977 and Cuba sent troops; the Ogaden was recovered in March 1978, and in 1978 a Soviet-backed offensive drove the Eritrean fronts back into the northern mountains around Nakfa."
    facts:
      - [Rural land nationalised, "4 March 1975"]
      - [TPLF founded, "18 February 1975, at Dedebit"]
      - [Somali invasion of the Ogaden, "13 July 1977"]
    link: { href: "#/war/ogaden-war", text: Ogaden War }
