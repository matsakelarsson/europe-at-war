  - title: The fall of the Derg
    date: February 1990 – May 1991
    when: "1991-05-21"
    borders: "1991-05-23"
    countries: [et, er]
    body:
      - "In February 1990 the EPLF took the port of Massawa, cutting the main supply line to the army in Eritrea, which was now besieged in Asmara and a few towns. The EPRDF pushed south from Tigray into Wollo and Gondar. In early 1991 it launched its final offensive, named after the emperor Tewodros: Gondar and Gojjam fell in February and March, with Bahir Dar in March, while other columns came down through Wollo by way of Dessie. In the west, EPRDF columns took Nekemte in April, and the OLF fought in western Oromia and Hararghe."
      - "Mengistu’s army, the largest in sub-Saharan Africa, was collapsing. On 21 May 1991 Mengistu flew to Zimbabwe, where he has lived since. On 24–25 May Israel airlifted some 14,000 Ethiopian Jews out of Addis Ababa in Operation Solomon, and on 24 May the EPLF entered Asmara. At talks in London on 27 May, chaired by the American diplomat Herman Cohen, the United States encouraged the EPRDF to take the capital to restore order, and on 28 May 1991 its troops entered Addis Ababa after little fighting."
      - "A conference in July 1991 set up a Transitional Government of Ethiopia, with Meles Zenawi as president and the OLF among its members until it withdrew in 1992; the EPRDF would govern Ethiopia until 2018. Eritrea, governed by the EPLF, voted for independence in a referendum in April 1993 and became independent on 24 May 1993. The new constitution of 1995 made Ethiopia a federation of ethnically defined regions."
    facts:
      - [Massawa taken by the EPLF, "8–10 February 1990"]
      - [Mengistu flees, "21 May 1991"]
      - [Asmara taken by the EPLF, "24 May 1991"]
      - [EPRDF enters Addis Ababa, "28 May 1991"]
