id: second-iraqi-kurdish-war
name: Second Iraqi–Kurdish War
start: "1974-03"
end: "1975-03"
tier: C
summary: The renewed war between the Ba’athist government of Iraq and the Kurdish rebels of Mustafa Barzani’s Kurdistan Democratic Party (KDP). In March 1974 Baghdad imposed its own autonomy law, which left oil-rich Kirkuk outside the Kurdish region, and the KDP rejected it. The Iraqi army, rebuilt with Soviet weapons, attacked in strength, while the Kurds were supplied by Iran, Israel and, secretly, the United States, and Iranian artillery and troops fought across the border. Iraqi bombing of Qala Diza in April 1974 killed more than a hundred civilians. The war ended suddenly when Iraq and Iran signed the Algiers Agreement on 6 March 1975, in which Iraq accepted the middle of the Shatt al-Arab as the border, and the Shah cut off all aid to the Kurds. The revolt collapsed within weeks. Barzani went into exile, more than 100,000 Kurds fled to Iran, and the government razed villages along the borders and moved Arabs into Kirkuk. Jalal Talabani founded the Patriotic Union of Kurdistan (PUK) in exile in June 1975.
