        text: The harbour town fell shortly before the first ceasefire took effect.
        lonlat: [33.317, 35.34]
      - kind: event
        side: tr
        name: Gönyeli
        date: 20 July 1974
        text: Turkish paratroopers landed around the Turkish Cypriot enclave north of Nicosia to link up with the troops from the coast.
        lonlat: [33.31, 35.215]
        lp: l
