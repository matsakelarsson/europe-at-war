        date: 20 July 1974
        text: The main landing, west of Kyrenia, met stiff resistance as it pushed inland across the Kyrenia mountains.
        lonlat: [33.25, 35.335]
        lp: l
      - kind: taken
        side: tr
        name: Kyrenia
