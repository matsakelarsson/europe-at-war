id: turkish-invasion-of-cyprus
name: Turkish invasion of Cyprus
start: "1974-07-20"
end: "1974-08-18"
tier: B
summary: Turkey’s military intervention in Cyprus in July and August 1974, five days after a coup backed by the Greek junta had overthrown President Makarios. In two offensives the Turkish army took about 36 per cent of the island in the north; some 150,000 Greek Cypriots and later about 60,000 Turkish Cypriots were uprooted, and the ceasefire line, patrolled by the United Nations, has divided the island ever since.
countries: [cy, tr, gr]
sides:
  - id: tr
    name: Turkey and Turkish Cypriot fighters
    polities: [turkey]
    ink: teal
    moves: Turkish moves
    success: Turkish success
  - id: cy
    name: Cypriot National Guard and Greek forces
    polities: [cyprus]
    ink: navy
    moves: Greek Cypriot and Greek moves
    success: Greek Cypriot and Greek success
notes:
  - Turkey calls the operation the Cyprus Peace Operation and cites its rights as a guarantor under the Treaty of Guarantee of 1960; the Republic of Cyprus, Greece and the United Nations Security Council regard the continuing presence of Turkish troops in the north as an occupation. The Turkish Republic of Northern Cyprus, declared in 1983, is recognised only by Turkey.
  - The base map shows Cyprus as one state, as it is internationally recognised; the Turkish-held north and the ceasefire line are shown as areas.
  - Civilians were killed on both sides. The Committee on Missing Persons in Cyprus lists about 1,500 Greek Cypriots and 500 Turkish Cypriots missing from 1963–1964 and 1974, many of whom have since been identified from remains.
