steps:
  - title: The coup of 15 July
    date: 15–19 July 1974
    when: "1974-07-15"
    borders: "1974-07-15"
    countries: [cy, gr]
    body:
      - Since the violence of 1963–1964, Turkish Cypriots had lived largely in armed enclaves, watched over by a United Nations force. President Makarios had given up enosis, union with Greece, as an aim, and the military junta in Athens backed the underground EOKA-B against him. On 2 July 1974 Makarios demanded that Greece withdraw the Greek officers who commanded the Cypriot National Guard. On 15 July the National Guard, led by those officers, attacked the presidential palace in Nicosia and seized the radio station and other key points across the island.
      - Makarios escaped through the back of the burning palace to Paphos, where he broadcast that he was alive; the British flew him out from their base at Akrotiri the next day. The coup leaders made Nikos Sampson, a former EOKA gunman known for his hostility to the Turkish Cypriots, president. Fighting between the coup forces and Makarios’s supporters killed many Greek Cypriots, with estimates ranging from about a hundred to several hundred. Turkey called the coup a step towards annexation by Greece, and when Britain declined to act with it, prepared to invade.
    facts:
      - [Coup, "15 July 1974"]
      - [Makarios flown out, "16 July 1974"]
      - [President installed by the coup, "Nikos Sampson"]
    markers:
      - kind: taken
        side: cy
        name: Presidential palace
        date: 15 July 1974
        text: National Guard tanks shelled and stormed the palace in Nicosia; Makarios slipped out and fled south-west.
        lonlat: [33.343, 35.163]
      - kind: event
        name: Paphos
        date: 15–16 July 1974
        text: Makarios broadcast from a local radio station that he was alive, while his supporters fought the coup forces in the town.
        lonlat: [32.42, 34.775]
      - kind: event
        name: Akrotiri
        date: 16 July 1974
        text: A Royal Air Force aircraft flew Makarios from the British base to Malta, and from there he went on to London and New York.
        lonlat: [32.95, 34.6]
    side_names:
      cy: National Guard and EOKA-B (the coup)
  - title: The first landing
    date: 20 July – 13 August 1974
    when: "1974-07-20"
    borders: "1974-07-22"
    countries: [cy, tr, gr]
    body:
      - Before dawn on 20 July Turkish troops landed on a beach west of Kyrenia, while paratroopers dropped into the Turkish Cypriot enclave north of Nicosia. The National Guard and the Greek army contingent on the island fought back, and a Turkish destroyer was sunk by Turkish aircraft by mistake. Elsewhere Greek Cypriot forces overran Turkish Cypriot quarters and villages and took thousands of Turkish Cypriot men prisoner. When a ceasefire called for by the United Nations took hold on 22 July, Turkish forces held Kyrenia and a corridor to Nicosia, about 3 per cent of the island.
      - The crisis brought down the junta in Athens, which handed power to civilians on 23 July, and Konstantinos Karamanlis returned from exile to lead Greece. In Cyprus, Sampson resigned and Glafcos Clerides became acting president. Britain, Greece and Turkey, the three guarantor powers, met in Geneva, but the Turkish army went on widening its bridgehead, and the Turkish Cypriot leadership pressed for a federation of two separate zones.
    facts:
      - [Turkish landings, "20 July 1974"]
      - [Ceasefire, "22 July 1974"]
      - [Greek junta falls, "23 July 1974"]
    markers:
