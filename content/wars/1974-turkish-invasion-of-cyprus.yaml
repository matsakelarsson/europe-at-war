  - title: The August offensive and the Green Line
    date: 14–18 August 1974
    when: "1974-08-14"
    borders: "1974-08-18"
    countries: [cy, tr]
    body:
      - The second Geneva conference broke down on 14 August, when the Turkish side demanded an immediate answer on separate zones and the Greek Cypriot and Greek delegations asked for time. Within hours the Turkish army attacked east and west. It took Famagusta on 15–16 August and Morphou in the west, and by the ceasefire of 16 August, with a few later advances, held about 36 per cent of the island. The ceasefire line became the United Nations buffer zone, the Green Line, running through the centre of Nicosia.
      - About 150,000 Greek Cypriots fled or were driven from the north, and over the following year about 60,000 Turkish Cypriots moved there from the south. Civilians were killed on both sides. Turkish Cypriot villagers at Maratha, Santalaris, Aloda and Tochni were massacred by EOKA-B, while Greek Cypriot civilians and prisoners were killed by Turkish troops and Turkish Cypriot fighters. Varosha, the modern quarter of Famagusta, was fenced off and left empty. The north declared itself the Turkish Republic of Northern Cyprus in 1983, recognised only by Turkey, and the island remains divided.
    facts:
      - [Second offensive, "14–16 August 1974"]
      - [Area held by Turkey, "about 36 per cent of the island"]
      - [People uprooted, "about 150,000 Greek Cypriots and 60,000 Turkish Cypriots"]
