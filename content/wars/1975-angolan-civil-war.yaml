  - title: The war of the cities
    date: 1993 – 1994
    when: "1993-03-07"
    borders: "1993-06-01"
    countries: [ao, za]
    body:
      - UNITA struck back across the country and by mid-1993 held perhaps two-thirds of Angola, including the diamond fields of the north-east and the oil town of Soyo. On 9 January 1993 it began a 55-day battle for Huambo, Angola’s second city, which it took on 7 March after some 10,000 people had been killed. It besieged Kuito (Cuito), the capital of Bié, for most of 1993 and 1994, shelling the town and starving its people, and laid siege to Malanje and other towns. Perhaps 120,000 people were killed in the 18 months after the election, and a thousand a day were dying of war and hunger in 1993 according to the UN.
      - The government rebuilt its army with arms bought with oil money and hired the South African private military company Executive Outcomes, which helped retake Soyo in 1993 and the Cafunfo diamond area in 1994. The UN imposed an arms and oil embargo on UNITA in September 1993. Government forces retook Huambo in November 1994, days before the Lusaka Protocol, initialled on 31 October and signed on 20 November 1994, which again provided for a ceasefire, the disarmament of UNITA and its entry into government.
    facts:
