notes:
  - "Casualty figures are rough. Estimates of the dead for the whole war range from 500,000 to 800,000, most of them civilians who died of hunger, disease and landmines; perhaps 120,000 were killed in the 18 months after the 1992 election alone. Cuba lost about 2,000 soldiers in Angola over 15 years, by its own figures."
  - "The United States backed the FNLA and UNITA through the CIA in 1975 until Congress banned such aid (the Clark Amendment, 1976), and again from 1985 to 1991. The MPLA government paid for its war with oil revenues, and UNITA largely with diamonds from the north-east, which led the UN to impose sanctions on UNITA from 1993 and on its diamond trade from 1998."
  - "The war in southern Angola overlapped with South Africa’s war against SWAPO, the Namibian independence movement, which had bases in Angola; that war is told in the South African Border War. The separatist war in Cabinda is told in the Cabinda conflict."
