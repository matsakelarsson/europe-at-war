  - title: The MPLA state and UNITA’s war from Jamba
    date: 1976 – 1986
    when: "1977-05-27"
    borders: "1983-08-14"
    countries: [ao, za, cu, us]
    body:
      - The MPLA built a one-party Marxist-Leninist state. On 27 May 1977 a faction around the former interior minister Nito Alves tried to seize power in Luanda; the attempt failed, and in the purge that followed MPLA and Cuban forces killed thousands of real or suspected supporters, with estimates ranging from about 2,000 to tens of thousands. Neto died in 1979 and was succeeded by José Eduardo dos Santos, who ruled until 2017.
      - UNITA rebuilt its forces in the remote south-east, with its headquarters at Jamba near the Caprivi Strip, supplied and trained by South Africa. South African forces, pursuing the Namibian guerrillas of SWAPO, occupied much of Cunene province from 1981 until they withdrew under the Lusaka Accord of 1984, completing the withdrawal in 1985, and repeatedly fought FAPLA and Cuban units; UNITA spread its war north across the central highlands, cut the Benguela Railway and in August 1983, with South African air support, took the garrison town of Cangamba after a siege. After the US Congress repealed the Clark Amendment in 1985, the Reagan administration sent UNITA arms, including Stinger missiles from 1986.
    facts:
      - [Nito Alves coup attempt, "27 May 1977"]
      - [José Eduardo dos Santos president, "1979–2017"]
      - [UNITA takes Cangamba, "August 1983"]
      - [Clark Amendment repealed, "July 1985"]
