  - title: Operation Savannah and the Cuban airlift
    date: October 1975 – March 1976
    when: "1975-11-04"
    borders: "1975-12-12"
    countries: [ao, za, cu, na]
    body:
      - On 14 October 1975, with American encouragement and in secret, South African forces crossed from South West Africa (Namibia). A mechanised column, Task Force Zulu, made up largely of FNLA and former Portuguese soldiers led by South African officers, raced up the coast, taking Sá da Bandeira (Lubango) on 24 October, Moçâmedes on 28 October and the ports of Benguela and Lobito on 6–7 November; a second group, Foxbat, moved from the highlands. Their aim was to help UNITA and the FNLA take as much of the country as possible before independence.
      - On 4 November Fidel Castro ordered Operation Carlota, the shipping and airlifting of Cuban combat troops; there were some 36,000 Cubans in Angola by early 1976. Cubans and FAPLA ambushed a South African column at Ebo on 23 November and held the line of the Queve River and the Nhia, where South Africa won the battle of Bridge 14 on 9–12 December. When the United States Congress cut off covert aid and African states rallied to the MPLA after the South African invasion became known, South Africa pulled back; its last troops left on 27 March 1976.
      - In the north, Cuban and FAPLA columns took Ambriz, Uíge and São Salvador in January and February 1976, and the FNLA and its mercenaries fled into Zaire; thirteen mercenaries were tried in Luanda and four executed. Huambo fell on 8 February, and UNITA went back to the bush. The Organisation of African Unity recognised the MPLA government in February 1976.
    facts:
