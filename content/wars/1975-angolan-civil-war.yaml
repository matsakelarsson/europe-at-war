steps:
  - title: The battle for Luanda and independence
    date: March – November 1975
    when: "1975-11-10"
    borders: "1975-11-11"
    countries: [ao, cd, cu, za]
    body:
      - The transitional government set up under the Alvor Agreement fell apart within weeks. From March 1975 the FNLA and MPLA fought in the streets of Luanda, and in July the MPLA drove the FNLA and UNITA out of the capital. The FNLA, the strongest army on paper, advanced on Luanda from the north with some 1,200 Zairian troops sent by Mobutu and money from the CIA; UNITA held the central highlands around Huambo. The MPLA received Soviet arms, and from August Cuban instructors arrived to train its army, FAPLA.
      - On 10 November, the day before independence, the FNLA, Zairian troops and Portuguese mercenaries, supported by South African artillery, attacked across the marshes of the Bengo River at Quifangondo, 20 km from Luanda. FAPLA and Cuban troops, with Soviet multiple rocket launchers, routed them, and the FNLA never recovered. The Portuguese high commissioner left without handing power to anyone, and at midnight Agostinho Neto proclaimed the People’s Republic of Angola in Luanda; the FNLA and UNITA proclaimed a rival government at Huambo, which no state recognised. In Cabinda, MPLA and Cuban troops beat off an attack by FLEC and Zairian troops in early November.
    facts:
      - [Fighting in Luanda begins, "March 1975"]
      - [Battle of Quifangondo, "10 November 1975"]
      - [Independence proclaimed in Luanda, "11 November 1975"]
    link: { href: "#/war/cabinda-conflict", text: "The war in Cabinda" }
