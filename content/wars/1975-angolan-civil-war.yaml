  - title: Cuito Cuanavale and the New York Accords
    date: August 1987 – December 1988
    when: "1987-09-06"
    borders: "1988-03-23"
    countries: [ao, za, cu, na]
    body:
      - In August 1987 eight FAPLA brigades, planned and advised by Soviet officers, set out from Cuito Cuanavale towards Mavinga, the gateway to UNITA’s heartland (Operation Saluting October). South Africa sent in its own troops. At the Lomba River in September and October 1987 the South Africans and UNITA stopped the brigades at the crossings, destroyed the 47th Brigade on 3 October and drove the survivors back towards Cuito Cuanavale; by South African figures FAPLA lost about 1,060 dead.
      - Castro, who had opposed the offensive, sent reinforcements, raising the Cuban force to more than 50,000. From January to 23 March 1988 the South Africans and UNITA attacked the FAPLA and Cuban positions east of the Cuito River again and again (six times, by one count) without breaking through. Meanwhile a strong Cuban and FAPLA force advanced in the south-west towards the Namibian border; on 27 June 1988 Cuban aircraft bombed the Calueque dam, killing eleven or twelve South African soldiers. Both sides still claim Cuito Cuanavale as a victory.
      - "With the war at a stalemate and costs rising on every side, Angola, Cuba and South Africa signed the New York Accords on 22 December 1988: South Africa would let Namibia become independent, and the Cubans would leave Angola by mid-1991. The accords did not cover the war between the MPLA and UNITA."
    facts:
      - [Battle of the Lomba River, "September – October 1987"]
      - [Last South African assault at Cuito Cuanavale, "23 March 1988"]
      - [Air strike on Calueque, "27 June 1988"]
      - [New York Accords, "22 December 1988"]
