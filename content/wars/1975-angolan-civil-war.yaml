  - title: Bicesse and the election of 1992
    date: May 1991 – November 1992
    when: "1992-09-29"
    borders: "1992-10-31"
    countries: [ao, pt]
    body:
      - With the Cold War ending, dos Santos and Savimbi signed the Bicesse Accords in Portugal on 31 May 1991, under Portuguese, American and Soviet mediation. The MPLA gave up Marxism-Leninism and the one-party state, the two armies were to be merged, and a small UN mission (UNAVEM II) was to watch over the process. Neither side demobilised fully.
      - At the elections of 29–30 September 1992, judged generally free and fair by UN observers, the MPLA won the parliamentary vote and dos Santos took 49.6 per cent of the presidential vote against Savimbi’s 40.1 per cent, short of the majority needed to avoid a run-off. Savimbi rejected the result as fraudulent and withdrew his generals from the joint army. Fighting broke out in Luanda on 30 October; over the next days government forces and armed civilians killed thousands of UNITA supporters and Ovimbundu and Bakongo people in the capital, among them UNITA’s vice-president Jeremias Chitunda, in what became known as the Halloween massacre.
    facts:
      - [Bicesse Accords, "31 May 1991"]
      - [Elections, "29–30 September 1992"]
      - [Presidential vote, "dos Santos 49.6%, Savimbi 40.1%"]
      - [Halloween massacre in Luanda, "30 October – 2 November 1992"]
    markers:
