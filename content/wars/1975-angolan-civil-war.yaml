id: angolan-civil-war
name: Angolan Civil War
start: "1975-11-11"
end: "2002-04-04"
tier: A
summary: "The war for power in independent Angola between the MPLA, which held Luanda and proclaimed the People’s Republic of Angola on 11 November 1975, and its rivals UNITA and, until 1976, the FNLA. It began as a Cold War battleground: the Soviet Union armed the MPLA and some 36,000 Cuban troops arrived by early 1976, while South Africa invaded in support of UNITA and the FNLA (Operation Savannah), Zaire backed the FNLA and the United States gave covert aid. The MPLA won the first round; UNITA under Jonas Savimbi rebuilt its army in the south-east with South African and, from 1985, American help. After the battles around Cuito Cuanavale in 1987–1988, the New York Accords brought a Cuban withdrawal and Namibia’s independence, and the Bicesse Accords of 1991 led to elections in 1992. Savimbi rejected his defeat, and the war resumed more destructively than before; the Lusaka Protocol of 1994 broke down in 1998. The war ended only when government troops killed Savimbi on 22 February 2002; the Luena Memorandum of 4 April 2002 made peace. Estimates of the dead range from 500,000 to 800,000, and some 4 million people were displaced."
countries: [ao, cu, za, cd, na, us, ru]
sides:
