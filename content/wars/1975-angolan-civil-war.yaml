  - title: The last war and Savimbi’s death
    date: 1995 – 2002
    when: "2002-02-22"
    borders: "2002-04-04"
    countries: [ao]
    body:
      - A larger UN force, UNAVEM III, oversaw the Lusaka Protocol, and in 1997 UNITA members joined a government of national unity. But Savimbi kept much of his army and his diamond mines, which earned UNITA hundreds of millions of dollars a year. In December 1998 the government declared that it would end the war by force, and in September 1999 it launched a large offensive that took UNITA’s strongholds of Bailundo and Andulo in October. Savimbi went back to guerrilla war in the east and the hills, and both sides forced civilians from their land; by 2001 some 4 million Angolans had been displaced.
      - On 22 February 2002 government soldiers caught and killed Savimbi near Lucusse in Moxico. UNITA’s remaining leaders agreed a ceasefire within weeks, and on 4 April 2002 the army and UNITA signed the Luena Memorandum of Understanding, under which UNITA disarmed and became a political party. Millions of landmines were left in the countryside.
    facts:
      - [Government offensive takes Bailundo and Andulo, "October 1999"]
      - [Savimbi killed, "22 February 2002"]
      - [Luena Memorandum, "4 April 2002"]
      - [Dead in the whole war, "500,000–800,000 (estimates)"]
