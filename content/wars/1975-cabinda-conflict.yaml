id: cabinda-conflict
name: Cabinda conflict
start: "1975-08-01"
end: ongoing
tier: C
summary: "Last updated 27 November 2026. A low-intensity separatist insurgency in Cabinda, the oil-rich Angolan exclave between the two Congos. Cabinda’s chiefs placed it under Portuguese protection by the Treaty of Simulambuco in 1885, and it was ruled as a separate protectorate before Portugal attached it to Angola; the Front for the Liberation of the Enclave of Cabinda (FLEC), founded in 1963, argues that it was never part of Angola. The Alvor Agreement of January 1975 treated Cabinda as an integral part of Angola, and on 1 August 1975 FLEC proclaimed a Republic of Cabinda, but MPLA and Cuban troops took control of the enclave and its oil installations in November 1975 and beat off FLEC and Zairian attacks. FLEC split into factions and fought a guerrilla war in the forests of Mayombe, kidnapping foreign oil workers and attacking soldiers, while the Angolan army, which built up large forces after the civil war ended in 2002, was accused by rights groups of abuses against civilians. In 2006 a memorandum of understanding with the Cabinda Forum for Dialogue and FLEC-Renovada under António Bento Bembe gave Cabinda a special status, but the main armed faction, FLEC-FAC, rejected it. On 8 January 2010 gunmen of a FLEC faction, FLEC-PM, attacked the bus of Togo’s football team before the Africa Cup of Nations, killing two team officials and the driver. Since then FLEC-FAC has claimed sporadic attacks, including one in March 2025 in which it said it had killed 32 soldiers, claims that cannot be verified and that Angola does not confirm. On 2 February 2026 FLEC’s secretary general, Jacinto António Telica, declared Cabinda “a sovereign and independent state” in a video shown at a press conference in Brussels, the day after police in Cabinda arrested demonstrators marking the anniversary of the Simulambuco treaty; no state is known to have recognised the declaration, and Angola treats the enclave as one of its provinces. The death toll of the conflict is not known."
