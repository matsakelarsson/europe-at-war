steps:
  - title: Civil war and invasion
    date: August 1975 – July 1976
    when: "1975-12-07"
    borders: "1975-12-07"
    countries: [tl, id, pt, au, us]
    body:
      - "After the Carnation Revolution of 25 April 1974 Portugal prepared to give up its colonies, and three main parties formed in East Timor: the Timorese Democratic Union (UDT), which first wanted a gradual path under Portugal, Fretilin, which wanted independence, and the small Apodeti, which wanted union with Indonesia. On 11 August 1975 the UDT seized power in Dili; Fretilin, backed by most Timorese soldiers of the colonial army, struck back and in a few weeks of civil war, in which some 1,500–3,000 people died, drove the UDT and its followers across the border into Indonesian West Timor. The Portuguese governor withdrew to the island of Atauro. Indonesian special forces, in an operation the government kept secret, began raids across the border. On 16 October 1975, as Indonesian troops took Balibo, they killed five journalists working for Australian television, two Britons, two Australians and a New Zealander."
      - "On 28 November 1975 Fretilin declared the Democratic Republic of East Timor; the next day the UDT, Apodeti and two smaller parties signed a declaration, drafted in Indonesia, calling for integration. On 6 December President Gerald Ford and Secretary of State Henry Kissinger visited Suharto in Jakarta and made clear that the United States would not object. Before dawn on 7 December Indonesian paratroopers and marines landed in Dili; in the following days soldiers killed many civilians in the town, among them the Australian journalist Roger East, shot on the wharf on 8 December. Baucau was taken on 10 December. A “People’s Assembly” convened by the Indonesian authorities petitioned for integration, and on 17 July 1976 Indonesia annexed East Timor as its 27th province. The United Nations called for Indonesia’s withdrawal and never recognised the annexation."
    facts:
      - [UDT coup, "11 August 1975"]
      - [Balibo Five killed, "16 October 1975"]
      - [Fretilin declares independence, "28 November 1975"]
      - [Invasion of Dili, "7 December 1975"]
      - [Annexation, "17 July 1976"]
