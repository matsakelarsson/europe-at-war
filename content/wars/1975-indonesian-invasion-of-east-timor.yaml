notes:
  - "The UN General Assembly (resolution 3485 of 12 December 1975) and the Security Council (resolutions 384 of 22 December 1975 and 389 of 22 April 1976) called on Indonesia to withdraw. Only Australia gave formal recognition to the annexation, in 1978–1979; the UN went on regarding Portugal as the administering power. The map shows East Timor as part of Indonesia from 17 July 1976 to October 1999, as the map of its time."
  - "The Commission for Reception, Truth and Reconciliation in East Timor (CAVR) reported in 2005 that at least 102,800 people died because of the conflict between 1974 and 1999: about 18,600 killed or disappeared and about 84,200 who died of hunger and illness beyond the normal death rate; its estimates of all conflict-related deaths range from about 90,800 to 202,600. It attributed most of the killings to the Indonesian forces and their auxiliaries, and some to Fretilin, in the civil war of 1975 and in its internal purges of the late 1970s. The CAVR’s report, Chega! (“Enough!”), also criticised the political and military support that the United States, Australia, Britain and other states had given Indonesia."
