        lonlat: [126.365, -8.857]
  - title: Santa Cruz to independence
    date: November 1991 – October 1999
    when: "1999-08-30"
    borders: "1999-09-20"
    countries: [tl, id, au, pt]
    body:
      - "On 12 November 1991 Indonesian troops opened fire on a procession of young Timorese mourners at the Santa Cruz cemetery in Dili. Indonesia first admitted 19 dead and later about 50; Timorese groups counted 271 killed and some 250 missing. The British cameraman Max Stahl filmed the shooting, and the footage, smuggled abroad, brought the occupation to the world’s attention. Xanana Gusmão was captured in Dili in November 1992 and sentenced to life imprisonment. In 1996 Bishop Carlos Filipe Ximenes Belo and José Ramos-Horta, the resistance’s spokesman abroad, shared the Nobel Peace Prize."
      - "After Suharto fell in May 1998, his successor B. J. Habibie offered the Timorese a choice between wide autonomy and independence, and on 5 May 1999 Indonesia and Portugal agreed in New York on a UN-run ballot. The Indonesian army armed and directed pro-integration militias, such as Aitarak in Dili and Besi Merah Putih in Liquiçá, which attacked independence supporters; in April militiamen and soldiers killed dozens of people sheltering in the church at Liquiçá. On 30 August 1999, 98.6 per cent of registered voters went to the polls and 78.5 per cent rejected autonomy. When the result was announced on 4 September, militias and soldiers killed some 1,400 people, among them dozens in the church at Suai on 6 September, burned most of Dili and other towns and forced more than 200,000 people into West Timor. Under international pressure Habibie accepted a peacekeeping force, and on 20 September the Australian-led INTERFET, eventually some 11,500 troops from 22 countries under Major General Peter Cosgrove, landed in Dili. The Indonesian parliament revoked the annexation in October, the UN Transitional Administration (UNTAET) took over on 25 October, and the last Indonesian troops left on 31 October 1999."
    facts:
      - [Santa Cruz massacre, "12 November 1991"]
      - [Referendum, "30 August 1999, 78.5% for independence"]
      - [INTERFET lands in Dili, "20 September 1999"]
      - [Last Indonesian troops leave, "31 October 1999"]
      - [Independence of Timor-Leste, "20 May 2002"]
