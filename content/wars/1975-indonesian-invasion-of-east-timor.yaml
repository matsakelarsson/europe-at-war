id: indonesian-invasion-of-east-timor
name: Indonesian invasion and occupation of East Timor
start: "1975-12-07"
end: "1999-10-31"
tier: B
summary: "Indonesia’s invasion of the Portuguese colony of East Timor in December 1975 and its occupation of the territory until 1999. After the Carnation Revolution in Portugal in 1974, East Timorese parties formed to decide the colony’s future; a short civil war in August 1975 left Fretilin, the party of independence, in control, and on 28 November it declared the Democratic Republic of East Timor. Indonesia, which feared a left-wing state in its midst and had already sent troops across the border, invaded on 7 December 1975, a day after President Gerald Ford and Henry Kissinger had visited Jakarta, and in July 1976 annexed the territory as its 27th province. The United Nations never recognised the annexation. Fretilin’s army, Falintil, fought on in the mountains; the Indonesian campaigns of 1977–1979 destroyed its bases and drove hundreds of thousands of people into camps, where many died of famine and disease. A truth commission later counted at least 102,800 conflict-related deaths between 1974 and 1999, out of a population of about 650,000 in 1975, most of them from hunger and illness. The killing of protesters at the Santa Cruz cemetery in Dili in 1991 drew the world’s attention, and after the fall of Suharto Indonesia agreed to a vote: on 30 August 1999, 78.5 per cent of voters chose independence. Militias organised by the Indonesian army then killed some 1,400 people, forced more than 200,000 into West Timor and burned much of the country, until an Australian-led international force (INTERFET) landed on 20 September. Indonesia gave up its claim in October 1999, and after two years of UN administration East Timor became independent as Timor-Leste on 20 May 2002."
