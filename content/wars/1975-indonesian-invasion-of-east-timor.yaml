  - title: Encirclement and famine
    date: 1977–1990
    when: "1978-11"
    borders: "1978-11-01"
    countries: [tl, id]
    body:
      - "For more than two years Falintil held much of the mountainous interior, where tens of thousands of people lived in Fretilin’s “support bases”, growing food under its administration. In 1977 the Indonesian army began a campaign of encirclement and annihilation, using aircraft newly supplied by the United States, among them OV-10 Bronco ground-attack planes, to bomb the bases and burn crops. The last great refuge, Mount Matebian in the east, fell in November 1978 after weeks of bombardment, and thousands of people came down from the mountains to surrender. Fretilin’s president, Nicolau Lobato, was killed on 31 December 1978. Fretilin was also torn by purges of its own leaders in 1977–1978."
      - "The people who surrendered or were captured were held in resettlement camps, where the army controlled food and movement. In 1978–1979 a famine swept the camps and the countryside; the truth commission later estimated that tens of thousands died of hunger and disease. Xanana Gusmão rebuilt the resistance in the 1980s as a small guerrilla force with a clandestine network in the towns. In 1981 the army forced tens of thousands of civilians to march across the mountains in a human chain to flush out the guerrillas; a ceasefire in 1983 broke down, and after an attack on an army post at Kraras in August 1983 soldiers killed some 200 villagers. Thousands of suspected supporters of the resistance were held on the island of Atauro. From 1989 Indonesia opened the province to visitors."
    facts:
      - [Encirclement and annihilation campaign, "1977–1979"]
      - [Mount Matebian falls, "November 1978"]
      - [Nicolau Lobato killed, "31 December 1978"]
      - [Kraras killings, "August – September 1983, about 200 dead"]
    markers:
      - kind: taken
        side: id
        name: Mount Matebian
        date: November 1978
        text: The last large Fretilin base, where tens of thousands had taken refuge, fell after weeks of bombing and shelling; the survivors were moved to camps.
        lonlat: [126.597, -8.641]
      - kind: capital
