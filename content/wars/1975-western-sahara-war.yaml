  - title: The berm
    date: 1980–1987
    when: "1982"
    borders: "1987-04-16"
    countries: [eh, ma, dz]
    body:
      - "From August 1980 Moroccan engineers began to build a wall of sand and stone across the desert. The first, finished in 1982, enclosed the “useful triangle” of Laayoune, Smara and the phosphate mines of Bou Craa. Five more walls followed in 1984–1987, each pushing the line further east and south, until in April 1987 it reached the Mauritanian border near Guerguerat. The berm runs for some 2,700 km: an embankment a few metres high with ditches, barbed wire and one of the largest minefields in the world in front of it, watched by radar and by garrisons a few kilometres apart, with mobile forces behind. Morocco kept well over 100,000 troops along it."
      - "The berm ended the Polisario’s war of movement. Its columns could still attack the wall, and did so at Mahbes, Farsia and elsewhere, but they could not break through and stay. The Polisario held the land east of the wall, about a fifth of the territory, almost empty of people, which it calls the “liberated territories”. The war became one of attrition, costly to Morocco but impossible for the Polisario to win in the field."
      - "The struggle moved to diplomacy. The Organisation of African Unity admitted the SADR, and when it took its seat in 1984, Morocco left the organisation. In the same year Libya ended its support for the Polisario under a treaty of union with Morocco. Algeria kept its support, but restored relations with Morocco in 1988."
    facts:
      - [Construction begun, "August 1980"]
      - [Useful triangle enclosed, "1982"]
      - [Last wall completed, "April 1987"]
      - [Length, "about 2,700 km"]
      - [Morocco leaves the OAU, "November 1984"]
