steps:
  - title: Spanish Sahara and the Polisario
    date: June 1970 – October 1975
    when: "1973-05-20"
    borders: "1975-10-16"
    countries: [eh, es, ma, mr]
    body:
      - "The Spanish Sahara, made up of Saguia el-Hamra in the north and Río de Oro in the south, was a desert territory the size of Britain with fewer than 100,000 inhabitants: a Spanish census in 1974 counted some 74,000 Sahrawis, Hassaniya-speaking people of tribes such as the Reguibat, Izarguien and Oulad Delim, many of them nomads, besides Spanish soldiers and settlers. From 1972 Spain exported phosphate from the great mine at Bou Craa. Morocco claimed the territory on the grounds that its tribes had owed allegiance to the sultans; Mauritania claimed it as part of the Moorish world from which its own people came. The UN called from 1966 for a referendum on self-determination."
      - "On 17 June 1970 Spanish troops broke up a demonstration in the Zemla district of El Aaiún organised by Muhammad Bassiri’s Movement for the Liberation of the Sahara, killing several people; Bassiri was arrested and disappeared. On 10 May 1973 young Sahrawis led by El-Ouali Mustapha Sayed founded the Popular Front for the Liberation of Saguia el-Hamra and Río de Oro, the Polisario, and ten days later raided the Spanish post of El Khanga. Its guerrillas attacked patrols and, in October 1974, sabotaged the conveyor belt that carried the Bou Craa phosphate to the coast. Libya and then Algeria gave it arms."
      - "Spain, under pressure, announced a referendum for 1975. A UN visiting mission in May–June 1975 reported overwhelming support among Sahrawis for independence and for the Polisario. At Morocco’s request the UN General Assembly asked the International Court of Justice for an opinion, which it gave on 16 October 1975: there had been ties of allegiance between the sultan and some tribes, and rights to land between the Mauritanian entity and others, but no tie of territorial sovereignty that could prevent the decolonisation of the territory through the free expression of its people’s will."
    facts:
      - [Zemla demonstration, "17 June 1970"]
      - [Polisario founded, "10 May 1973"]
      - [First Polisario raid, "El Khanga, 20 May 1973"]
      - [Advisory opinion of the ICJ, "16 October 1975"]
