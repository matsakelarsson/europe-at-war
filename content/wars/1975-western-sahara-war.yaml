id: western-sahara-war
name: Western Sahara War
start: "1975-10-31"
end: "1991-09-06"
tier: A
summary: "The war over the former Spanish Sahara between Morocco, Mauritania and the Polisario Front, the Sahrawi independence movement backed by Algeria. As Spain prepared to leave its colony in 1975, Morocco and Mauritania claimed it, while a UN mission found that most Sahrawis wanted independence, and the International Court of Justice found no tie of sovereignty that would override their right to self-determination. Morocco answered with the Green March of some 350,000 unarmed civilians in November 1975, and by the Madrid Accords Spain handed the administration to Morocco and Mauritania. Moroccan and Mauritanian troops moved in, tens of thousands of Sahrawis fled to camps near Tindouf in Algeria, and on 27 February 1976 the Polisario proclaimed the Sahrawi Arab Democratic Republic. With fast columns of Land Rovers the Polisario struck deep into Mauritania, raiding Nouakchott and the iron mines of Zouérat, until a coup in 1978 brought Mauritania to make peace in 1979; Morocco then took the Mauritanian share. Against Morocco the Polisario won battles in 1979–1981, but from 1980 Morocco built a sand wall, the berm, which by 1987 ran some 2,700 km and enclosed about four fifths of the territory, turning the war into a stalemate. A UN-brokered ceasefire took effect on 6 September 1991, with a promise of a referendum on independence that has never been held. Estimates of the dead range from about 10,000 to 20,000."
countries: [eh, ma, mr, dz, es, fr]
