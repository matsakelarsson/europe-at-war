  - title: Partition and the flight to Tindouf
    date: January – April 1976
    when: "1976-02-27"
    borders: "1976-04-14"
    countries: [eh, ma, mr, dz]
    body:
      - "At the end of January 1976 Moroccan troops attacked Algerian army units at Amgala, in the desert east of Smara, and took about a hundred prisoners; Algeria said its soldiers had been bringing food and medicine to the refugees. In February the Polisario overran the Moroccan garrison at Amgala. It was the nearest the two countries came to open war. In the same weeks Moroccan aircraft attacked the refugee encampments at Umm Dreiga, Guelta Zemmour and Tifariti; the Polisario and foreign witnesses reported the use of napalm and white phosphorus, Morocco denied attacking civilians, and the numbers killed are disputed. The refugees moved on into Algeria, where camps grew up near Tindouf, named after the towns of the territory: El Aaiún, Smara, Awserd and Dakhla."
      - "Spain completed its withdrawal on 26 February 1976. The next day, at Bir Lehlou, the Polisario proclaimed the Sahrawi Arab Democratic Republic (SADR), and Algeria recognised it on 6 March, whereupon Morocco broke off relations with Algeria. On 14 April Morocco and Mauritania divided the territory between them: Morocco took the northern two thirds, Saguia el-Hamra and the north of Río de Oro, and Mauritania the southern third, Tiris al-Gharbiya, with the port of Villa Cisneros (Dakhla)."
    facts:
