  - title: The war against Mauritania
    date: June 1976 – August 1979
    when: "1977-05-01"
    borders: "1978-07-10"
    countries: [eh, mr, ma, fr]
    body:
      - "The Polisario turned first on the weaker of its enemies. Mauritania had an army of only a few thousand men, and its economy depended on the iron ore of Zouérat, carried to the sea by a single railway some 700 km long. Polisario columns of Land Rovers armed with machine guns and recoilless rifles crossed hundreds of kilometres of desert to strike almost anywhere. In June 1976 a column shelled Nouakchott, the capital; the Polisario’s leader El-Ouali was killed as it withdrew, and Mohamed Abdelaziz succeeded him. On 1 May 1977 the Polisario attacked Zouérat, killed two Frenchmen and took six hostage, and in July it shelled Nouakchott again. Mauritania expanded its army to some 15,000–18,000 men and called in about 9,000 Moroccan troops under a defence pact."
      - "France, whose citizens worked the mines, intervened. In Operation Lamantin, from December 1977 to mid-1978, French Jaguar aircraft flying from Dakar attacked Polisario columns in Mauritania. The French hostages were freed through UN mediation in December 1977."
      - "The war ruined Mauritania’s economy and divided its people, many of whom were related to the Sahrawis. On 10 July 1978 army officers overthrew President Moktar Ould Daddah, and the Polisario declared a ceasefire with Mauritania. By the Algiers agreement of 5 August 1979 Mauritania gave up its claim. Morocco at once moved its troops into Dakhla and the rest of Tiris al-Gharbiya, and on 14 August annexed it as the province of Oued Ed-Dahab."
    facts:
      - [First raid on Nouakchott, "June 1976"]
      - [Attack on Zouérat, "1 May 1977"]
      - [Operation Lamantin, "December 1977 – 1978"]
      - [Coup in Mauritania, "10 July 1978"]
      - [Algiers agreement, "5 August 1979"]
