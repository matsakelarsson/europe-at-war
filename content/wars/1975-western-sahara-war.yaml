notes:
  - "Western Sahara is on the UN list of non-self-governing territories, and its status is disputed. Morocco regards it as its Southern Provinces, reunited with the kingdom in 1975, and offers autonomy under its sovereignty; the Polisario and Algeria regard it as an occupied country whose people have the right to decide on independence in a referendum. The Sahrawi Arab Democratic Republic has been recognised by dozens of states, some of which later withdrew or froze their recognition, and is a member of the African Union. The base map shows Western Sahara as one territory from the Spanish withdrawal; the zones held by Morocco, Mauritania and the Polisario are drawn as areas."
  - "Losses are uncertain. Estimates of all deaths in 1975–1991 range from about 10,000 to 20,000; Mauritania lost some 2,000 soldiers, the Polisario held more than 2,000 Moroccan prisoners, the last of whom were freed in 2005, and hundreds of Sahrawis disappeared in Moroccan custody. The number of refugees in the camps near Tindouf is also disputed: the UN refugee agency long used a planning figure of 90,000, while Algerian and Polisario figures are about 170,000."
  - "Places are given by their usual English names, with the Spanish names of the time in brackets where they differ: Laayoune (El Aaiún), Dakhla (Villa Cisneros), Lagouira (La Güera)."
