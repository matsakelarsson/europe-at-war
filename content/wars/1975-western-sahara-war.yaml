  - title: A referendum that never came
    date: 1991–2020
    when: "2007-04-11"
    borders: "2020-11-12"
    countries: [eh, ma, dz, mr]
    body:
      - "The referendum was never held. Morocco and the Polisario could not agree on who should vote: Morocco wanted tens of thousands of people of Saharan descent living in Morocco included, the Polisario wanted the Spanish census of 1974 to be the basis. In 2000 MINURSO published a list of some 86,000 voters, which Morocco rejected. The plans of the UN envoy James Baker, the second of which, in 2003, offered several years of autonomy followed by a vote, were accepted by the Polisario but rejected by Morocco. In April 2007 Morocco offered autonomy under its sovereignty; the Polisario insisted on a vote that would include independence."
      - "Meanwhile Morocco invested heavily in the territory and settled many Moroccans there, and Sahrawi activists who demanded independence faced arrest and trial. In October 2010 thousands of Sahrawis set up a protest camp at Gdeim Izik near Laayoune; when Moroccan forces broke it up on 8 November, at least 13 people were killed, most of them members of the security forces. The refugees stayed in the camps near Tindouf, now with a generation born there. In November 2020 a dispute over the road through the buffer strip at Guerguerat led the Polisario to end the ceasefire, and fighting resumed; see Renewed fighting in Western Sahara."
    facts:
      - [MINURSO voter list, "about 86,000 (2000)"]
      - [Baker Plan II, "2003"]
      - [Moroccan autonomy initiative, "11 April 2007"]
      - [Gdeim Izik camp broken up, "8 November 2010"]
