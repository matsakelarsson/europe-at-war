  - title: The war against Morocco
    date: January 1979 – October 1981
    when: "1979-10-14"
    borders: "1979-10-14"
    countries: [eh, ma, dz]
    body:
      - "With Mauritania out of the war, the Polisario threw its full strength, perhaps 15,000 fighters armed by Algeria and Libya, against Morocco. In its Houari Boumediène offensive, named after the Algerian president who died in December 1978, it struck into southern Morocco itself, raiding Tan-Tan on 28 January 1979 and overrunning the garrison of Lebouirate in August. In October it attacked Smara and overran the Moroccan base at Mahbes. Morocco held the towns but could not hold the desert, and its army, which grew to some 60,000 men in the Sahara, suffered heavy losses."
      - "Morocco looked abroad for help. The United States, which had restricted arms deliveries, agreed in late 1979 to sell it reconnaissance aircraft and helicopters, and expanded its aid under President Reagan; France supplied Mirage fighters, and Saudi Arabia paid much of the cost. The Polisario received Soviet-made weapons through Algeria and Libya. On 11 August 1979 the Moroccan garrison of Bir Anzarane, in the south that Morocco had just occupied, beat off a large Polisario attack, with heavy losses on both sides. On 13 October 1981 the Polisario attacked the garrison of Guelta Zemmour with tanks and shot down a Mirage and a C-130 transport with surface-to-air missiles."
    facts:
      - [Raid on Tan-Tan, "28 January 1979"]
      - [Smara attacked, "October 1979"]
      - [Mahbes overrun, "14 October 1979"]
      - [Bir Anzarane, "11 August 1979"]
      - [Guelta Zemmour, "13 October 1981"]
    markers:
