  - title: The ceasefire
    date: August 1988 – September 1991
    when: "1991-09-06"
    borders: "1991-09-06"
    countries: [eh, ma, dz, mr]
    body:
      - "On 30 August 1988 Morocco and the Polisario accepted in principle a settlement plan drawn up by the UN Secretary-General, Javier Pérez de Cuéllar, and the OAU: a ceasefire, followed by a referendum in which the Sahrawis would choose between independence and integration with Morocco. Hassan II received Polisario leaders in Marrakesh in January 1989, but fighting flared again, as at Guelta Zemmour in October 1989."
      - "On 29 April 1991 the UN Security Council set up the UN Mission for the Referendum in Western Sahara (MINURSO). In August and September 1991 Moroccan forces made a last push east of the berm, around Tifariti, Bir Lehlou and Mehaires, before the ceasefire took effect on 6 September 1991. The referendum was planned for January 1992."
      - "Morocco held more of the territory than ever. In June 1991 it released more than 300 Sahrawis who had disappeared years earlier into secret prisons; the Polisario held more than 2,000 Moroccan prisoners of war, some for over twenty years, and the last were freed only in 2005."
