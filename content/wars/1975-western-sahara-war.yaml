        date: 10 May 1973
        text: The Polisario was founded in northern Mauritania, among Sahrawi students and former soldiers; accounts place its founding congress in this mining town or at the desert fort of Ain Bentili, near the border.
        lonlat: [-12.467, 22.737]
  - title: The Green March and the Madrid Accords
    date: 31 October – December 1975
    when: "1975-11-06"
    borders: "1975-11-14"
    countries: [eh, ma, mr, es]
    body:
      - "On the evening of the ICJ’s opinion King Hassan II announced that 350,000 unarmed Moroccans would march into the Sahara. While General Franco lay dying in Madrid, Moroccan troops crossed the border in the north-east from 31 October, at Jdiriya, Haouza and Farsia, and fought the Polisario there. On 6 November the marchers, carrying flags, portraits of the king and copies of the Quran, crossed from the Tarfaya region a few kilometres into the territory, where the Spanish army had pulled back behind minefields. The UN Security Council deplored the march and called on Morocco to withdraw its marchers; on 9 November Hassan called them back."
      - "On 14 November 1975 Spain signed the Madrid Accords with Morocco and Mauritania. It agreed to hand over the administration to the two countries, with a Spanish share during a transition, and to leave by the end of February 1976, keeping a stake in the Bou Craa mine and fishing rights. The accords did not transfer sovereignty, and the UN never recognised them as doing so; Algeria and the Polisario rejected them. On 28 November most members of the Djemaa, the tribal assembly Spain had created, met with the Polisario at Guelta Zemmour and declared it dissolved."
      - "Moroccan troops took Smara on 27 November and entered El Aaiún on 11 December, while Mauritanian troops fought their way into La Güera in the far south in December. Tens of thousands of Sahrawis fled the towns into the desert, towards Amgala, Tifariti, Guelta Zemmour and Umm Dreiga, where the Polisario gathered them."
    facts:
      - [Moroccan troops cross into the north-east, "31 October 1975"]
      - [Green March, "6–9 November 1975"]
      - [Marchers, "about 350,000"]
      - [Madrid Accords, "14 November 1975"]
      - [Moroccan troops in El Aaiún, "11 December 1975"]
