  - title: Referendum, ceasefires and martial law
    date: 1999–2004
    when: "2003-05-19"
    borders: "2003-05-19"
    countries: [id]
    body:
      - "After Suharto’s fall GAM recruited thousands of young men and set up a shadow administration in much of the countryside, while violence by the security forces went on. On 3 May 1999 soldiers fired on protesters at the Simpang KKA crossroads near Lhokseumawe, killing at least 21 people, and on 23 July soldiers killed the religious teacher Teungku Bantaqiah and dozens of his students at Beutong Ateuh. On 8 November 1999, encouraged by the referendum in East Timor, hundreds of thousands of people gathered in Banda Aceh to demand a vote on independence. Mediated by the Henry Dunant Centre in Geneva, the government and GAM agreed a “humanitarian pause” in 2000 and a Cessation of Hostilities Agreement on 9 December 2002, but neither held."
      - "When last talks in Tokyo failed, President Megawati Sukarnoputri declared martial law on 19 May 2003, and some 40,000 soldiers and police launched an offensive against GAM, whose fighters numbered perhaps 5,000. Journalists and aid workers were kept away. The army reported killing large numbers of GAM fighters, while Human Rights Watch reported summary executions of civilians, the burning of schools and the forced displacement of villagers; GAM was weakened but not destroyed. Martial law was replaced by a civil emergency in May 2004."
    facts:
