id: aceh-insurgency
name: Aceh insurgency
start: "1976-12-04"
end: "2005-12-27"
tier: B
summary: "The war of the Free Aceh Movement (Gerakan Aceh Merdeka, GAM) for the independence of Aceh, at the northern tip of Sumatra, from Indonesia. Aceh had been an independent sultanate until the Dutch conquest (1873–1904), and many Acehnese felt that Jakarta had broken its promises of autonomy and taken the wealth of the natural gas fields opened near Lhokseumawe in the 1970s. Hasan di Tiro declared independence on 4 December 1976; his small movement was crushed by 1979, revived in 1989 with fighters trained in Libya, and was met by a decade of military operations in which thousands of civilians were killed, tortured or disappeared. After the fall of Suharto in 1998 GAM grew quickly; ceasefires in 2000 and 2002 broke down, and in May 2003 the government imposed martial law and launched its largest military operation since East Timor. The Indian Ocean tsunami of 26 December 2004, which killed some 170,000 people in Aceh, pushed both sides to talks in Helsinki under the former Finnish president Martti Ahtisaari. In the agreement of 15 August 2005 GAM gave up its demand for independence and disarmed, and Indonesia withdrew most of its troops, granted an amnesty and allowed local political parties; GAM disbanded its army on 27 December 2005. An estimated 15,000 people, most of them civilians, died in the conflict, though estimates range from about 10,000 to 30,000."
