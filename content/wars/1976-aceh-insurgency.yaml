  - title: The tsunami and the Helsinki agreement
    date: December 2004 – December 2006
    when: "2005-08-15"
    borders: "2005-08-15"
    countries: [id]
    body:
      - "On 26 December 2004 an earthquake off Sumatra sent a tsunami onto the coasts of Aceh, killing some 170,000 people, dead and missing, and destroying much of Banda Aceh, Meulaboh and other coastal towns. GAM declared a ceasefire, foreign aid workers and troops arrived, and the new president, Susilo Bambang Yudhoyono, and his vice-president, Jusuf Kalla, who had already sought contacts with GAM, took up an offer of talks. From January 2005 five rounds of negotiations were held near Helsinki under Martti Ahtisaari and his Crisis Management Initiative."
      - "The memorandum of understanding signed in Helsinki on 15 August 2005 gave Aceh wide self-government within Indonesia, 70 per cent of the revenues from its natural resources, the right to form local political parties and an amnesty for GAM members; GAM dropped its demand for independence. An Aceh Monitoring Mission of the European Union and five ASEAN countries oversaw the handover of 840 GAM weapons, which were destroyed by December 2005, and the withdrawal of the soldiers and police sent from outside Aceh, which left about 24,000 in the province. GAM dissolved its army on 27 December 2005. The Law on the Governing of Aceh was passed in 2006, and in December that year a former GAM leader, Irwandi Yusuf, was elected governor. Ahtisaari received the Nobel Peace Prize in 2008, in part for his work in Aceh."
    facts:
      - [Indian Ocean tsunami, "26 December 2004, about 170,000 dead in Aceh"]
      - [Helsinki agreement, "15 August 2005"]
      - [GAM weapons handed over, "840, by December 2005"]
      - [GAM army dissolved, "27 December 2005"]
