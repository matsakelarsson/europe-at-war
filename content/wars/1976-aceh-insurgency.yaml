steps:
  - title: Hasan di Tiro and the military operations area
    date: 1976–1998
    when: "1976-12-04"
    borders: "1976-12-04"
    countries: [id]
    body:
      - "Aceh, a sultanate that had resisted Dutch conquest for three decades, joined the Indonesian revolution in 1945, but rose again in 1953 under Daud Beureueh as part of the Darul Islam rebellion, which ended in 1962 after Aceh was made a “special region” with autonomy in religion, education and custom. In the 1970s natural gas from the Arun field and a liquefied gas plant near Lhokseumawe brought great wealth to the central government and to companies from Java and abroad, but little to most Acehnese. Hasan di Tiro, a descendant of a hero of the war against the Dutch, who had spent years in the United States, returned in 1976 and on 4 December, in the hills of Pidie, declared Aceh’s independence. His movement had only a few hundred followers; by 1979 the army had killed or captured most of its leaders, and di Tiro went into exile, leading GAM from Sweden."
      - "In the late 1980s several hundred young Acehnese were trained in Libya, and in 1989 GAM began attacking police and army posts. The army replied with a large counter-insurgency operation, and from 1989 or 1990 to 1998 Aceh was treated as a “military operations area” (Daerah Operasi Militer, DOM). Soldiers killed suspected rebels and sympathisers and left their bodies by the roads as a warning, and thousands of people were tortured, raped or disappeared; the house known as Rumoh Geudong in Pidie became notorious as a place of torture. When the DOM was lifted in August 1998, after Suharto’s fall, mass graves were opened and investigators collected testimony of the abuses."
    facts:
      - [Independence declared, "4 December 1976"]
      - [GAM crushed, "by 1979"]
      - [Military operations area (DOM), "about 1989–1998"]
      - [DOM lifted, "August 1998"]
