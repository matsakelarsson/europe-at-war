notes:
  - "Both sides were accused of grave abuses. Indonesian troops and police carried out summary executions, torture, rape and disappearances, notably in the years of the “military operations area” (1989–1998) and under martial law (2003–2004); GAM killed civilians it accused of being informers and drove out many Javanese settlers. In January 2023 President Joko Widodo listed three Acehnese cases (Rumoh Geudong and Pos Sattis in 1989–1998, Simpang KKA in 1999 and Jambo Keupok in 2003) among twelve past gross human rights violations he regretted. Aceh set up its own Truth and Reconciliation Commission in 2016."
  - The Helsinki agreement left Aceh within Indonesia with wide self-government under the Law on the Governing of Aceh (2006), including the right to apply Islamic law, which Aceh had already begun to do in 2001, and a large share of its oil and gas revenues. Former GAM leaders have since governed the province; Irwandi Yusuf was elected governor in December 2006.
