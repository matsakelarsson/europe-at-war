  - title: The invasion and the fall of Phnom Penh
    date: 25 December 1978 – 1979
    when: "1978-12-25"
    borders: "1979-01-07"
    countries: [kh, vn, th, cn]
    body:
      - "On 25 December 1978 some 150,000 Vietnamese troops, with Cambodian units of the Salvation Front, invaded Cambodia along the roads from the east and north-east, supported by aircraft and an amphibious landing on the coast near Kampong Som. The Khmer Rouge army, weakened by purges, broke. Phnom Penh, whose leaders fled to the west, fell on 7 January 1979, and the People’s Republic of Kampuchea was proclaimed with Heng Samrin as head of state. Within weeks the Vietnamese held all the towns, and the Khmer Rouge with tens of thousands of civilians they drove before them retreated to the mountains along the Thai border, where many died of hunger and malaria."
      - "The new government opened the S-21 prison to the world as a museum of the regime’s crimes. The country was ruined: the harvest had not been brought in, and famine in 1979–1980 sent hundreds of thousands of Cambodians to the Thai border, where aid agencies fed them through a “land bridge” and camps were set up. On 17 February 1979 China, Democratic Kampuchea’s ally, attacked northern Vietnam to “teach it a lesson” (see the Sino-Vietnamese War). China, the United States and ASEAN refused to recognise the new government, and the UN seat stayed with Democratic Kampuchea."
    facts:
