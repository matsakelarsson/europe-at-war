id: cambodian-vietnamese-war
name: Cambodian–Vietnamese War
start: "1977-04-30"
end: "1991-10-23"
tier: B
summary: "The war between Vietnam and the Khmer Rouge, and the long occupation that followed. From 1977 the forces of Democratic Kampuchea raided Vietnamese border villages and massacred their people, while purges inside Cambodia drove Khmer Rouge commanders to flee to Vietnam. On 25 December 1978 the Vietnamese army invaded with Cambodian exiles, took Phnom Penh on 7 January 1979 and installed the People’s Republic of Kampuchea, ending a regime under which some 1.5 to 2 million Cambodians had died. China answered with its own attack on Vietnam in February 1979. For ten years Vietnamese troops fought a guerrilla war along the Thai border against the Khmer Rouge, armed by China and sheltered by Thailand, and two non-communist movements backed by ASEAN and the West, which together kept Cambodia’s seat at the United Nations. Vietnam withdrew its army in September 1989, and the Paris Peace Agreements of 23 October 1991 placed Cambodia under UN transitional rule until elections in 1993."
countries: [kh, vn, th, cn]
