notes:
  - "Vietnam called its invasion a response to Khmer Rouge aggression and help to the Cambodian people against a genocidal regime; China, the United States and most of ASEAN called it an invasion and occupation, and the UN General Assembly voted every year from 1979 for the withdrawal of foreign troops. Democratic Kampuchea, and from 1982 the Coalition Government of Democratic Kampuchea, kept Cambodia’s UN seat until 1990. In Cambodia 7 January is celebrated by the government as Victory over Genocide Day and contested by its opponents as the start of an occupation."
  - Casualty figures are uncertain. Vietnam gave its losses in Cambodia in 1977–1989 as about 15,000 dead and 30,000 wounded; other estimates are higher. Losses of the Cambodian forces and civilian deaths in the war, the famine of 1979–1980 and the K5 labour campaign are counted in the tens of thousands.
