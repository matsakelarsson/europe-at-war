  - title: Resistance, K5 and the withdrawal
    date: 1979–1991
    when: "1982-06-22"
    borders: "1985-03-01"
    countries: [kh, vn, th, cn]
    body:
      - "Three movements fought the Vietnamese and the People’s Republic from bases on and across the Thai border: the Khmer Rouge, rebuilt with Chinese arms and Thai help into some 30,000–40,000 fighters; the Khmer People’s National Liberation Front of the former prime minister Son Sann; and Sihanouk’s FUNCINPEC with its Sihanoukist National Army. Under pressure from ASEAN and China they formed a Coalition Government of Democratic Kampuchea on 22 June 1982, with Sihanouk as president. Hundreds of thousands of Cambodians lived in camps along the border, such as Khao-I-Dang and Site 2 in Thailand, which also served the guerrillas as rear bases."
      - "In the dry season of 1984–1985 the Vietnamese army overran the resistance camps and bases along the border, from Nong Chan and Ampil to the Khmer Rouge base at Phnom Malai, driving more than 200,000 people into Thailand. They then began the K5 plan: from 1985 to 1989 hundreds of thousands of Cambodian civilians were conscripted to clear forest and build a barrier of trenches, fences and minefields along the Thai border. Tens of thousands died of malaria, mines and attacks, and the mines have killed and maimed people ever since."
      - "With Soviet aid running out, Vietnam pulled its last troops out of Cambodia on 26 September 1989, and the People’s Republic, renamed the State of Cambodia under Prime Minister Hun Sen, fought on alone. The Paris Peace Agreements, signed on 23 October 1991 by the four Cambodian factions and eighteen states, gave a UN Transitional Authority (UNTAC) the task of disarming the factions, repatriating 360,000 refugees and holding elections, which took place in May 1993. The Khmer Rouge boycotted the vote and fought on until its last forces at Anlong Veng surrendered in 1998–1999, after Pol Pot’s death there on 15 April 1998."
    facts:
      - [Coalition Government of Democratic Kampuchea, "22 June 1982"]
      - [Dry-season offensive, "November 1984 – March 1985"]
      - [Vietnamese withdrawal completed, "26 September 1989"]
      - [Paris Peace Agreements, "23 October 1991"]
