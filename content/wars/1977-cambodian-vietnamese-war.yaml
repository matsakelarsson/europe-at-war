steps:
  - title: The border war
    date: April 1977 – December 1978
    when: "1977-04-30"
    borders: "1978-04-30"
    countries: [kh, vn]
    body:
      - "After their victories in 1975 the Vietnamese and Cambodian communists fell out over the border, which the Khmer Rouge did not accept, and over the Khmer Rouge leaders’ fear that Vietnam meant to dominate Indochina. From 30 April 1977 Khmer Rouge troops attacked villages in the Vietnamese provinces of An Giang and Châu Đốc, and in September they killed some 300 people in Tây Ninh province. At Ba Chúc, near the border in An Giang, they killed 3,157 villagers between 18 and 30 April 1978; only two survived. Inside Cambodia the regime was killing and starving its own people, and from 1977 it turned on its own cadres as traitors; thousands were tortured and executed at the security prison S-21 in Phnom Penh."
      - "In December 1977 the Vietnamese army struck back with tens of thousands of men into the provinces of Svay Rieng and Kampong Cham, then withdrew in January, bringing Cambodian refugees with them; Democratic Kampuchea broke off relations on 31 December. In May 1978 the Khmer Rouge leadership sent troops to purge the Eastern Zone, whose cadres it accused of serving Vietnam; tens of thousands were killed, and commanders such as Heng Samrin fled to Vietnam, where Hun Sen, who had defected in 1977, had already arrived. Vietnam signed a treaty of friendship with the Soviet Union on 3 November, and on 2 December 1978 the Kampuchean United Front for National Salvation was proclaimed in the border area under Heng Samrin."
    facts:
      - [First Khmer Rouge attacks in An Giang, "30 April 1977"]
      - [Ba Chúc massacre, "18–30 April 1978, 3,157 dead"]
      - [Diplomatic relations broken, "31 December 1977"]
      - [Salvation Front proclaimed, "2 December 1978"]
