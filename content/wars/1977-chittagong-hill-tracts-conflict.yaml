steps:
  - title: The hills at war
    date: 1972–1989
    when: "1980-03-25"
    borders: "1980-03-25"
    countries: [bd, in]
    body:
      - "Under British rule the Chittagong Hill Tracts were a protected district closed to outside settlement. The Kaptai dam, built by Pakistan in 1962, flooded some 40 per cent of the hill tracts’ farmland and displaced about 100,000 people, many of whom went to India. In 1972 Manabendra Narayan Larma, a Chakma member of parliament, asked for autonomy in Bangladesh’s first constitution and was refused; the new constitution called all citizens Bengalis. In 1973 he and others founded the PCJSS, and its armed wing, the Shanti Bahini, made its first attack on an army convoy in 1977, using bases across the border in Tripura."
      - "From 1979 the government of Ziaur Rahman resettled hundreds of thousands of landless Bengalis from the plains in the hills, while the army built camps across the region and moved hill villagers into guarded “cluster villages”. The share of Bengalis in the population rose from 12 per cent in 1974 to almost half by 1991. Soldiers and settlers attacked hill villages, as at Kalampati in Kaukhali on 25 March 1980, where many Chakma villagers were killed; the Shanti Bahini raided settlements and killed many settlers. In 1983 the movement split, and on 10 November Larma was killed by members of a rival faction; his brother Jyotirindra Bodhipriya (Santu) Larma took over."
    facts:
      - [Kaptai dam, "1962, about 100,000 displaced"]
      - [PCJSS founded, "1973"]
      - [First Shanti Bahini attack, "1977"]
      - [Manabendra Narayan Larma killed, "10 November 1983"]
