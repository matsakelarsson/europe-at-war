notes:
  - "Casualty figures are uncertain and disputed: estimates range from a few thousand to about 30,000 dead, among them 3,500 to 25,000 civilians, both hill people and Bengali settlers. Bangladesh accused India of giving the Shanti Bahini bases and training in Tripura, which India did not acknowledge."
  - "The accord created a regional council and hill district councils and promised the return of land and the withdrawal of temporary army camps; hill groups say much of it has not been carried out. The United People’s Democratic Front (UPDF), founded in 1998 by opponents of the accord, and the PCJSS have since fought each other, and an armed group of the Bawm people, the Kuki-Chin National Front, has fought the army since 2022."
  - The area of the hill tracts is drawn in the steps and is approximate.
