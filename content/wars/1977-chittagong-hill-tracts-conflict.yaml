  - title: Massacres and the peace accord
    date: 1989–1998
    when: "1997-12-02"
    borders: "1997-12-02"
    countries: [bd, in]
    body:
      - "In 1989 the government of Hussain Muhammad Ershad set up elected district councils in the three hill districts, which the PCJSS rejected as powerless. Violence against hill people went on: on 4 May 1989 settlers, with soldiers and village guards, burned the village of Langadu, and on 10 April 1992 settlers and village guards set fire to Logang village near Panchari, killing scores of people by most accounts, after a Bengali boy was killed. On 17 November 1993 soldiers and settlers attacked a student procession at Naniarchar bazaar, killing dozens. By the early 1990s some 50,000–70,000 Jumma refugees lived in camps in Tripura."
      - "After a ceasefire in 1992 and many rounds of talks, a new Awami League government under Sheikh Hasina reached agreement with the PCJSS, and on 2 December 1997 the Chittagong Hill Tracts Peace Accord was signed in Dhaka by the government’s chief whip, Abul Hasnat Abdullah, and Santu Larma. On 10 February 1998, at a ceremony in Khagrachari, Santu Larma handed his weapon to Sheikh Hasina, and in the following weeks nearly 2,000 Shanti Bahini fighters handed in their arms. The refugees in Tripura returned home between 1994 and 1998."
    facts:
