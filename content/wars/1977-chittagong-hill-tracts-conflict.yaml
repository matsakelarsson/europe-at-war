id: chittagong-hill-tracts-conflict
name: Chittagong Hill Tracts conflict
start: "1977"
end: "1997-12-02"
tier: B
summary: "The insurgency of the Jumma, the Buddhist, Hindu and Christian hill peoples of the Chittagong Hill Tracts in south-eastern Bangladesh, against the Bangladeshi state. The Chakma, Marma, Tripura and other peoples had lost much of their best land to the Kaptai dam in the 1960s, and after independence in 1971 Bangladesh refused their demand for autonomy. The Parbatya Chattagram Jana Samhati Samiti (PCJSS), led by Manabendra Narayan Larma, formed an armed wing, the Shanti Bahini (“peace force”), which began attacking the army in 1977. The government answered with a large military presence and by settling some 400,000 landless Bengalis in the hills, which led to clashes over land and to massacres of hill people by soldiers and settlers; the Shanti Bahini also attacked settlers. Tens of thousands of Jumma fled to India. Talks from the late 1980s led to the Chittagong Hill Tracts Peace Accord of 2 December 1997, under which the Shanti Bahini laid down its arms. Estimates of the dead range up to about 30,000."
countries: [bd, in]
