id: libyan-egyptian-war
name: Libyan–Egyptian War
start: "1977-07-21"
end: "1977-07-24"
tier: C
summary: "A four-day border war between Libya and Egypt, also called the Four Day War. Muammar Gaddafi had pressed Egypt to unite with Libya, and when Anwar Sadat turned away from him after the October War of 1973, moved towards peace with Israel and drew closer to the United States, relations broke down. Each accused the other of plotting against it: Libya backed Egyptian opponents of Sadat and Egypt backed opponents of Gaddafi, and from 1976 there were clashes on the frontier. On 21 July 1977 a Libyan tank battalion raided the Egyptian border town of Sallum and was ambushed by the Egyptian army, which struck back with a mechanised force that pushed some 24 km into Libya towards Musaid and then withdrew, while Egyptian aircraft bombed the Gamal Abdel Nasser air base at al-Adem near Tobruk and radar stations at Bardia and Jaghbub. Over the next days Egyptian aircraft and helicopter-borne commandos raided al-Adem again, the air base at Kufra, Jaghbub and camps in eastern Libya, and Libyan aircraft attacked Mersa Matruh. Under pressure from Arab governments and the United States, and after mediation by Algeria’s President Houari Boumediène and the PLO leader Yasser Arafat, Sadat declared a ceasefire on 24 July. Both sides claimed victory; Egypt lost about 100 men killed or wounded and Libya about 400, with dozens of tanks and armoured vehicles and, by different estimates, between six and twenty aircraft. Prisoners were exchanged in August 1977, but no peace treaty followed, and relations worsened again after Sadat’s visit to Jerusalem that November."
