  - title: The Zambezia offensive and Mbuzini
    date: 1986–1987
    when: "1986-10-19"
    borders: "1986-10-19"
    countries: [mz, mw, za, zw, tz]
    body:
      - "In the second half of 1986 thousands of RENAMO fighters crossed from Malawi into Zambezia and Tete and took district towns such as Milange and Morrumbala, threatening to cut the country in two along the Zambezi. Malawi’s president Hastings Banda had let RENAMO use his territory. In September 1986 Machel, with Mugabe and Zambia’s Kenneth Kaunda, went to Blantyre and threatened Banda; Malawi then expelled thousands of RENAMO fighters into Mozambique."
      - "On 19 October 1986 the Tupolev Tu-134 carrying Machel home from a meeting in Zambia crashed into hills at Mbuzini, just inside South Africa near the Mozambican and Swazi borders. Machel and 33 others were killed. A South African inquiry blamed the Soviet crew; Mozambique and the Soviet Union suspected that a false radio beacon had lured the plane off course, and the question has never been settled. Joaquim Chissano became president."
      - "From late 1986 Zimbabwean and Tanzanian troops helped the Mozambican army retake the lost towns in Zambezia, and from April 1987 Malawian troops guarded the Nacala railway, which carried Malawi’s trade, in Mozambique."
    facts:
      - [RENAMO offensive in Zambezia, "from mid-1986"]
      - [Machel killed, "19 October 1986, Mbuzini (34 dead)"]
      - [Malawian troops in Mozambique, "from April 1987"]
