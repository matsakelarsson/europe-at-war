id: mozambican-civil-war
name: Mozambican Civil War
start: "1977"
end: "1992-10-04"
tier: A
summary: "The war between Mozambique’s FRELIMO government and the Mozambican National Resistance (RENAMO), which began two years after independence and lasted until 1992. RENAMO was created by Rhodesia’s Central Intelligence Organisation in 1976–1977 to strike back at Mozambique for supporting the Zimbabwean guerrillas, with André Matsangaissa and then Afonso Dhlakama as its leaders. After Zimbabwe’s independence in 1980 South Africa’s military intelligence took it over, and it spread through the centre and south of the country, attacking roads, railways, schools, clinics and villages. The Nkomati Accord of 1984, in which South Africa promised to stop helping RENAMO, did not end that help. Zimbabwe sent troops to guard the Beira corridor and helped take RENAMO’s headquarters at Casa Banana in 1985; Tanzania and Malawi also sent troops. President Samora Machel died in a plane crash at Mbuzini in 1986. RENAMO’s massacres, as at Homoine in 1987, and the government’s forced removals, together with drought, brought famine. After the Cold War ended FRELIMO gave up Marxism–Leninism and adopted a multiparty constitution, and talks mediated by the Community of Sant’Egidio led to the Rome General Peace Accords of 4 October 1992 and elections in 1994. About a million people died, most of them from hunger and disease, some five million were displaced and 1.7 million fled abroad."
countries: [mz, za, zw, mw, tz]
