  - title: South Africa takes over
    date: 1980–1984
    when: "1984-03-16"
    borders: "1984-03-16"
    countries: [mz, za, zw]
    body:
      - "South Africa’s military intelligence took RENAMO over, trained its fighters at Phalaborwa in the northern Transvaal and supplied them by air drops and by sea. RENAMO grew fast and spread from Manica and Sofala to Inhambane, Gaza, Zambezia and the outskirts of Maputo. It attacked the things that held the state and the economy together: roads and railways, the oil pipeline and railway from Beira to Zimbabwe, shops, schools, clinics, communal villages and their officials. It forcibly recruited young men and boys and took food and porters from villages."
      - "South Africa also struck directly, raiding ANC houses in Matola outside Maputo in January 1981 and bombing the city in 1983. In 1983–1984 drought and war together caused a famine that killed tens of thousands of people, by some estimates far more. Machel’s government, its economy in ruins, turned to the West and to Pretoria. On 16 March 1984, on the border on the Nkomati river, Machel and the South African prime minister P. W. Botha signed the Nkomati Accord, a non-aggression pact: South Africa would stop helping RENAMO and Mozambique would expel the ANC’s fighters."
      - "Mozambique kept its side of the bargain. South Africa did not: before the accord its military intelligence had sent RENAMO large stocks of weapons, and it went on supplying it secretly afterwards."
    facts:
