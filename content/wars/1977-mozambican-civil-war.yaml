  - title: Zimbabwe’s corridor and Casa Banana
    date: 1982–1986
    when: "1985-08-28"
    borders: "1985-08-28"
    countries: [mz, zw, za]
    body:
      - "For landlocked Zimbabwe the shortest route to the sea was the Beira corridor, the railway, road and oil pipeline from Beira to Mutare. From late 1982 Zimbabwean troops guarded the pipeline, and in 1985 Robert Mugabe sent thousands more, saying the route was worth defending with up to 30,000 men; more than 10,000 were deployed along the corridor by the end of August 1985, and diplomats’ estimates that year ran to 12,000–15,000. They also guarded the road from Tete to Malawi and fought alongside the Mozambican army (FPLM)."
      - "On 28 August 1985 Zimbabwean paratroopers and special forces, with Mozambican troops, captured RENAMO’s headquarters at Casa Banana, in the foothills of the Gorongosa massif. Papers found there, the Gorongosa documents, showed that South African officers had gone on supplying RENAMO after Nkomati and that a South African deputy minister had visited the base. RENAMO retook Casa Banana a few months later, and the Zimbabweans took it again in 1986."
    facts:
      - [Zimbabwean troops in Mozambique, "from 1982; more than 10,000 from August 1985 (estimates up to 15,000)"]
      - [Casa Banana taken, "28 August 1985"]
