  - title: Talks in Rome and the peace accords
    date: 1989–1994
    when: "1992-10-04"
    borders: "1992-10-04"
    countries: [mz, zw, it]
    body:
      - "As the Cold War ended, both sides lost their backers: South Africa under F. W. de Klerk wound down its support, and Soviet aid dried up. In 1989 FRELIMO gave up Marxism–Leninism, and in November 1990 a new constitution allowed multiparty elections and a market economy. Direct talks between the government and RENAMO began in Rome in July 1990, at the Community of Sant’Egidio, a Catholic lay community, with Sant’Egidio’s Andrea Riccardi and Matteo Zuppi, the archbishop of Beira Jaime Gonçalves and the Italian government’s Mario Raffaelli as mediators. A partial ceasefire in December 1990 confined Zimbabwe’s troops to the Beira and Limpopo corridors."
      - "Chissano and Dhlakama signed the General Peace Accords in Rome on 4 October 1992, during the worst drought in living memory. The United Nations Operation in Mozambique (ONUMOZ), with some 6,500 troops, oversaw the ceasefire, the departure of the Zimbabwean and Malawian troops and the demobilisation of more than 76,000 soldiers on both sides. In the elections of 27–29 October 1994 Chissano won the presidency and FRELIMO 129 of the 250 seats in parliament, against 112 for RENAMO, which accepted the result."
      - "The war had killed about a million people, most of them from hunger and disease. The peace held for two decades; fighting between RENAMO and the government resumed in 2013–2019 and ended with a new accord in Maputo in August 2019."
    facts:
