steps:
  - title: Rhodesia’s creation
    date: 1976–1980
    when: "1977"
    borders: "1979-10-17"
    countries: [mz, zw]
    body:
      - "Independent Mozambique was ruled by FRELIMO as a one-party state; at its Third Congress in February 1977 FRELIMO declared itself a Marxist–Leninist vanguard party. It nationalised land, schools, health care and rented housing, moved rural people into communal villages and state farms, sent thousands of people it called enemies, idlers or prostitutes to re-education camps, and pushed aside chiefs and religious leaders. Most of the Portuguese, with their skills and capital, had left. Mozambique gave bases to Zimbabwe’s ZANLA guerrillas and closed its border with Rhodesia in March 1976, at heavy cost to its own economy."
      - "Rhodesia struck back. Its Central Intelligence Organisation, under Ken Flower, began broadcasts by a Voz da África Livre (Voice of Free Africa) in 1976 and recruited former Portuguese soldiers, deserters from FRELIMO and Mozambicans in Rhodesia into a Mozambican National Resistance (MNR, later RENAMO). Its leader was André Matsangaissa, a former FRELIMO officer freed by a Rhodesian raid on a re-education camp; Orlando Cristina, a Portuguese former counter-insurgency operative, ran its politics. From bases at Odzi near Umtali, RENAMO groups crossed into Manica and Sofala, guided Rhodesian raids, attacked ZANLA and freed prisoners from re-education camps."
      - "In October 1979 Matsangaissa was killed in an attack on Vila Paiva de Andrada (Gorongosa), and after a struggle for the leadership Afonso Dhlakama took over. Government offensives in 1979–1980 took RENAMO’s camps in the Gorongosa mountains and at Sitatonga. When Zimbabwe became independent in April 1980 RENAMO lost its patron and its bases, and its leaders and some hundreds of fighters were moved to South Africa."
    facts:
      - [FRELIMO declares itself Marxist–Leninist, "February 1977"]
      - [Matsangaissa killed, "October 1979, Vila Paiva de Andrada"]
      - [RENAMO moved to South Africa, "1980"]
