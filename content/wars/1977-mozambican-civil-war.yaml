notes:
  - "The government called RENAMO armed bandits (bandidos armados) and treated the war as foreign aggression by Rhodesia and South Africa; RENAMO presented itself as fighting for democracy and against communism. Historians agree that RENAMO was created and long supplied from outside, and also that it found real support in parts of central Mozambique, among people alienated by FRELIMO’s communal villages, its hostility to chiefs and religion, and its neglect of the centre and north."
  - "Figures are estimates. The death toll is usually given as about a million (estimates range from about 600,000 to more than a million), most from famine and disease caused or worsened by the war; RENAMO was held responsible for most killings of civilians, but government forces and militias also killed civilians. About 4–5 million people were displaced inside the country and some 1.7 million fled to Malawi, Zimbabwe, South Africa and other neighbours."
  - "Places are given by their names of the time where they differ: Vila Paiva de Andrada (Gorongosa), Umtali (Mutare)."
