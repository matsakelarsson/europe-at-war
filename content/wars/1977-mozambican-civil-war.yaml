  - title: Homoine and the war against civilians
    date: 1987–1990
    when: "1987-07-18"
    borders: "1987-07-18"
    countries: [mz, mw]
    body:
      - "On 18 July 1987 RENAMO fighters attacked the town of Homoine in Inhambane, defended by a small garrison, and killed 424 people, among them patients in the hospital, women and children; RENAMO denied responsibility and blamed government troops. In the following months hundreds more were killed in attacks on Manjacaze and on road convoys, as near Taninga north of Maputo in October 1987."
      - "In April 1988 a report for the United States State Department by Robert Gersony, based on interviews with refugees, estimated that RENAMO had killed some 100,000 civilians and attributed to it the great majority of the murders, abductions and lootings the refugees described. The report ended any chance of American support for RENAMO. Government soldiers and militias also killed, raped and looted, though far less often according to the refugees, and the government forcibly moved people and conscripted young men."
      - "By the late 1980s much of the countryside was cut off; food aid kept millions alive, and about a million refugees were in Malawi alone. In Zambezia and Nampula a militia called Naparama, led by the healer Manuel António, whose fighters believed a ritual vaccine protected them from bullets, drove RENAMO out of many districts in 1990–1991."
    facts:
      - [Homoine massacre, "18 July 1987, 424 killed"]
      - [Gersony report, "April 1988; about 100,000 civilians killed by RENAMO"]
      - [Refugees in Malawi, "about a million by the early 1990s"]
