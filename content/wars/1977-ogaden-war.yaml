steps:
  - title: Western Somalia and the WSLF
    date: 1960 – June 1977
    when: "1976"
    borders: "1977-06-01"
    countries: [et, so]
    body:
      - "When British Somaliland and Italian Somalia joined as the Somali Republic in 1960, its flag carried a five-pointed star for the five lands where Somalis lived: the two former colonies, French Somaliland (Djibouti), Kenya’s Northern Frontier District and the Ogaden. Ethiopia’s title to the Ogaden rested on the Anglo-Ethiopian treaty of 1897 and on Britain’s handover of the Ogaden in 1948 and of the Haud grazing lands in 1954; Somalia did not accept them. A rising in the Ogaden in 1963 led to a short border war in 1964, and its fighters later formed the core of the Western Somali Liberation Front."
      - "Mohamed Siad Barre, who took power in Mogadishu in a coup in 1969, built with Soviet help one of the largest armies in sub-Saharan Africa, and in 1974 signed a treaty of friendship with the Soviet Union, which used the port of Berbera. In Ethiopia, the revolution of 1974 brought the Derg to power amid famine, purges, the Eritrean war and risings in many provinces. From 1975 Somalia armed and trained the WSLF, and in 1976 its guerrillas, many of them Somali soldiers on leave, began attacking Ethiopian posts; the Somali Abo Liberation Front fought further west in Bale and Sidamo. On 1 June 1977 the WSLF cut the railway from Addis Ababa to Djibouti, which became independent at the end of that month. By then the Ethiopian army held little more than its garrison towns."
      - "The Soviet Union and Cuba tried to keep both their clients. In March 1977 Fidel Castro brought Siad Barre and Mengistu Haile Mariam together in Aden and proposed a federation of socialist states in the Horn; Siad Barre refused anything short of self-determination for the Ogaden. Ethiopia closed the American military mission in April and began receiving Soviet arms, and Siad Barre decided to strike before they arrived."
    facts:
      - [Anglo-Ethiopian treaty, "1897"]
      - [Ogaden handed over by Britain, "1948 (the Haud in 1954)"]
      - [Somali–Soviet treaty, "1974"]
      - [Railway to Djibouti cut, "1 June 1977"]
