  - title: The counteroffensive and Jijiga
    date: February – March 1978
    when: "1978-02-01"
    borders: "1978-03-05"
    countries: [et, so, cu]
    body:
      - "The Ethiopian and Cuban counteroffensive began on 1 February 1978 at Harewa, east of Harar, and Jaldessa fell on 4 February. Its planners, Soviet and Cuban, did not attack the Somali positions in the Marda Pass head on. Instead a mechanised force with Cuban tanks and artillery worked its way through the mountains north of the pass, by tracks the Somalis thought impassable for armour, to come down on the Jijiga plain from the north. Ethiopia and Cuba together had about 300 tanks and 46 combat aircraft against a Somali army that had lost much of its armour and air force."
      - "In late February and early March, Soviet-built Mi-6 and Mi-8 helicopters lifted Ethiopian and Cuban troops and light armour behind the Somali lines, and paratroops dropped near Jijiga. On 5 March a frontal assault through the pass and the airmobile force in the rear converged on Jijiga, and the Somali defenders, threatened with encirclement, broke. Jijiga was retaken the same day, and the road into the Ogaden lay open."
    facts:
      - [Counteroffensive begins, "1 February 1978"]
      - [Jijiga retaken, "5 March 1978"]
