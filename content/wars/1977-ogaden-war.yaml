  - title: Withdrawal and aftermath
    date: March 1978 and after
    when: "1978-03-09"
    borders: "1978-03-23"
    countries: [et, so, cu]
    body:
      - "On 9 March 1978 Siad Barre announced that the Somali army would withdraw from the Ogaden. Ethiopian and Cuban columns followed it, taking Degehabur and Fik on 8 March and then Kebri Dahar, Warder and Gode, and on 23 March Ethiopia declared that its last border post had been regained. The Cubans stopped at the border; the Soviet Union and Cuba did not want Ethiopia to invade Somalia. Some 5,000–6,500 soldiers had died on each side. Somalia had lost about a third of its regular army, much of its armour and half its air force."
      - "The war did not end the fighting in the Ogaden. The WSLF kept up a guerrilla war, and Ethiopian sweeps in 1978–1980 drove hundreds of thousands of Ogadeni Somalis and Oromo into camps in Somalia; the government there spoke of more than a million refugees by 1980, relief agencies of fewer. Ethiopia resettled highlanders in the region. Somalia turned to the West and in 1980 gave the United States access to Berbera. In April 1988 Siad Barre and Mengistu, each facing rebels the other supported, agreed to stop backing them."
      - "In Somalia the defeat started the unravelling of Siad Barre’s rule. On 9 April 1978 officers, most of them from the Majeerteen clan, attempted a coup; its survivors founded the Somali Salvation Democratic Front with Ethiopian backing. Isaaq exiles founded the Somali National Movement in 1981, and the wars that followed in the north and the south brought down the Somali state in 1991."
    facts:
      - [Somali withdrawal announced, "9 March 1978"]
      - [Last border post regained, "23 March 1978"]
      - [Coup attempt in Mogadishu, "9 April 1978"]
