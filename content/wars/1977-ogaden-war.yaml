  - title: The siege of Harar and the airlift
    date: October 1977 – January 1978
    when: "1977-11-13"
    borders: "1977-11-13"
    countries: [et, so, cu, ru, ye]
    body:
      - "From late September to mid-December Somali forces pressed on towards Harar through the hills, reaching its outskirts, while others cut the roads to Dire Dawa. Harar held. Ethiopian militia and regulars dug in around the city, the Ethiopian air force, flying American-built F-5s and soon Soviet MiG-21s, won command of the air and bombed Somali supply lines as far as Berbera and Hargeisa, and the Somali offensive, far from its bases and short of fuel and spare parts, lost its momentum. By December the Somali forces had fallen back to positions at Fedis, Jaldessa and Harewa in the hills around the city."
      - "On 13 November 1977 Somalia ordered all Soviet advisers to leave within a week, ended Soviet use of Berbera and broke off relations with Cuba. Within days the Soviet Union began a huge sea and air lift to Ethiopia, flying tanks, artillery and aircraft through Aden and over the Red Sea. With it came about 1,500 Soviet advisers under General Vasily Petrov, who planned the counteroffensive, about 12,000–18,000 Cuban troops under General Arnaldo Ochoa, among them armoured brigades and pilots, and some 2,000 South Yemeni soldiers. Western governments refused Somalia’s requests for arms while its army was inside Ethiopia; China gave diplomatic support."
      - "On 22–23 January 1978 the Somalis made a last attempt on Harar. Cuban armoured brigades and Ethiopian units met them in the hills east of the city and inflicted their worst losses of the war."
    facts:
