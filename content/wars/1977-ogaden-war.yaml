  - title: The invasion
    date: July – August 1977
    when: "1977-07-13"
    borders: "1977-08-01"
    countries: [et, so]
    body:
      - "On 13 July 1977 the Somali National Army crossed the border in force, with some 35,000 men, about 250 tanks and its air force, beside the WSLF. Ethiopia had perhaps 35,000–47,000 regulars and militia in the region, many of them newly raised peasant militia. Somali columns advanced on Gode in the south, on Degehabur, Kebri Dahar and Warder in the centre, and on Jijiga and Dire Dawa in the north. Gode, with its airfield, fell on 25 July after heavy fighting; of 2,350 militiamen sent there, only 489 made it back to Harar."
      - "In the north a Somali force surprised Dire Dawa, the railway town and air base, on 16 July but was driven back by reinforcements from Harar. A second assault on 17 August broke into the outskirts and reached the airfield before the Ethiopian Third Division and the air force threw it back; Ethiopian F-5 fighters destroyed Somali tanks on the plain. Dire Dawa was never taken, but within a month Somali and WSLF forces held most of the Ogaden lowlands. Somalia publicly denied that its army was in Ethiopia and said the fighting was the WSLF’s."
    facts:
      - [Somali invasion, "13 July 1977"]
      - [Gode taken, "25 July 1977"]
      - [Attacks on Dire Dawa, "16 July and 17 August 1977"]
