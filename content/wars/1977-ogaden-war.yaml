  - title: Jijiga and the Marda Pass
    date: September 1977
    when: "1977-09-12"
    borders: "1977-09-15"
    countries: [et, so, ru]
    body:
      - "The Somali army’s main blow fell on Jijiga, the headquarters of the Ethiopian forces in the north of the Ogaden, held by a division with tanks and artillery. After weeks of attacks the garrison, short of supplies and shaken by the loss of its armour, turned on its officers and fled, and Somali forces entered the town on 12 September 1977. The next day they took the Marda Pass on Mount Karamara, the gateway through the hills from the Ogaden plain towards Harar and Dire Dawa. By the end of September Ethiopia admitted that it controlled only about a tenth of the Ogaden."
      - "The Soviet Union now chose between its clients. In early September it began shipping arms to Ethiopia, and about two weeks later it stopped deliveries to Somalia. Siad Barre went to Moscow and was turned away. In Addis Ababa the Derg mobilised the country under the slogan “Revolutionary Motherland or Death”, raising and training a people’s militia of tens of thousands, while its campaign of Red Terror against the civilian left went on in the capital."
    facts:
      - [Jijiga taken, "12 September 1977"]
      - [Marda Pass taken, "13 September 1977"]
      - [Ogaden held by Ethiopia, "about 10% (late September 1977)"]
