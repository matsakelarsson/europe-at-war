id: ogaden-war
name: Ogaden War
start: "1977-07-13"
end: "1978-03-23"
tier: A
summary: "War between Somalia and Ethiopia over the Ogaden, the Somali-inhabited east of Ethiopia, which Somalia claimed as Western Somalia. In 1976–1977 the Western Somali Liberation Front (WSLF), armed and trained by Somalia, drove Ethiopian forces into their garrisons while the Derg, Ethiopia’s new military government, was fighting rebellions across the country. In July 1977 the Somali National Army invaded. Within two months Somali and WSLF forces held most of the Ogaden, took Jijiga and the Marda Pass, and laid siege to Harar and Dire Dawa. The Soviet Union, which had armed Somalia, then switched to Ethiopia; Somalia expelled its Soviet advisers in November 1977, and a Soviet airlift brought arms, about 1,500 Soviet advisers and some 12,000–18,000 Cuban troops to Ethiopia, with a South Yemeni contingent. The Ethiopian and Cuban counteroffensive of February–March 1978 retook Jijiga, and on 9 March Siad Barre ordered his army home. Some 5,000–6,500 soldiers were killed on each side and hundreds of thousands of Ogadeni Somalis fled to Somalia. The defeat discredited Siad Barre’s government and opened the way to the rebellions that destroyed the Somali state in 1991."
