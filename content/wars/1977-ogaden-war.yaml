notes:
  - "Sources give 12, 13 or 23 July 1977 for the start of the Somali invasion, and 9, 15 or 23 March 1978 for its end: Siad Barre announced the withdrawal on 9 March, and Ethiopia declared on 23 March that it had regained its last border post."
  - "Figures for the war vary. Ethiopian losses are given as about 5,000–6,100 killed and 8,200–10,500 wounded, Somali losses as about 5,700–6,500 killed; Cuba lost about 160–400 killed, the Soviet Union 33 advisers and South Yemen about 100. One estimate puts civilian deaths at about 25,000. Refugee numbers in Somalia were disputed: the Somali government gave much higher figures than relief agencies."
  - The Somali name for the Ogaden in the claims of the time was Western Somalia (Soomaali Galbeed). Ogaden is also the name of the Somali clan family that lives in much of it.
