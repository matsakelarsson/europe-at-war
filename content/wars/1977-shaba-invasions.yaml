steps:
  - title: Shaba I
    date: March – May 1977
    when: "1977-03-08"
    borders: "1977-04-25"
    countries: [cd, ao, ma, fr]
    body:
      - On 8 March 1977 FNLC fighters under Nathaniel Mbumba crossed the Angolan border in three columns, some on bicycles. They took Dilolo, Kisenge and Kapanga within days, and the local Lunda population, long hostile to Mobutu, largely welcomed them. Zairian troops withdrew with little fighting, and on 25 March the FNLC entered Mutshatsha on the railway, some 110 km west of Kolwezi, whose copper and cobalt mines earned most of Zaire’s foreign currency.
      - Mobutu called it an invasion by Cuban-backed mercenaries and appealed for help. The United States sent only non-military supplies. On 9 April eleven French transport aircraft flew some 1,500 Moroccan troops to Kolwezi, Egypt sent pilots and technicians for Zaire’s Mirage jets, and Saudi Arabia paid. The Moroccan and Zairian counter-offensive retook Mutshatsha on 25 April, and by 26 May the FNLC had withdrawn into Angola without a decisive battle. Mobutu’s troops then took reprisals against Lunda villagers suspected of helping the invaders.
    facts:
      - [FNLC crosses the border, "8 March 1977"]
      - [FNLC takes Mutshatsha, "25 March 1977"]
      - [Moroccan airlift to Kolwezi, "9 April 1977"]
      - [Last FNLC fighters withdraw, "26 May 1977"]
