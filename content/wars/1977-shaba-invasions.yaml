  - title: Shaba II and Kolwezi
    date: May – June 1978
    when: "1978-05-13"
    borders: "1978-05-20"
    countries: [cd, zm, fr, be]
    body:
      - In May 1978 several thousand FNLC fighters, avoiding the route of the year before, crossed a corner of Zambia and on 13 May seized Kolwezi, a town with about 3,000 European residents. Zairian paratroopers dropped on 15 May were beaten off. In the following days FNLC fighters and local supporters killed hundreds of people, Zairians and Europeans, some of them in massacres of hostages; others were killed by Zairian troops.
      - "On 19 May about 400 men of the French Foreign Legion’s 2nd Foreign Parachute Regiment, flown from Corsica by way of Kinshasa, jumped onto Kolwezi, and on 20 May Belgian paratroopers, staged through Kamina, landed at the airport to evacuate Europeans. Within days the town was retaken and the FNLC retreated through Zambia to Angola. An Inter-African Force of Moroccan, Senegalese, Togolese and Gabonese troops, with Ivorian medics, then held Shaba for a year. Angola and Zaire agreed later in 1978 to stop supporting each other’s rebels: Angola disarmed the FNLC, and Zaire stopped sheltering the FNLA and FLEC."
