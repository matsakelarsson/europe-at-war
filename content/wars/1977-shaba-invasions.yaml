id: shaba-invasions
name: Shaba invasions (Shaba I and Shaba II)
start: "1977-03-08"
end: "1978-06"
tier: B
summary: "Two invasions of Zaire’s mining province of Shaba (Katanga) by the Congolese National Liberation Front (FNLC), an army of former Katangese gendarmes and their sons who had gone into exile in Angola after Katanga’s secession ended in 1963 and had fought for the Portuguese and then for the MPLA. In Shaba I (March–May 1977) some 1,600–3,000 FNLC fighters took the towns along the Benguela Railway up to Mutshatsha, near Kolwezi; Mobutu’s army barely resisted, and the invaders were driven out by about 1,500 Moroccan troops flown in by France, with Egyptian pilots and Saudi money. In Shaba II (May 1978) the FNLC crossed through Zambia and seized Kolwezi itself, where hundreds of African and European civilians were killed; French Foreign Legion paratroopers dropped on the town on 19 May and Belgian paratroopers arrived the next day. Mobutu and his Western allies accused Angola, Cuba and the Soviet Union of backing the invasions; Angola and Zaire made peace in 1978, and the FNLC was disarmed."
countries: [cd, ao, zm, ma, fr, be]
sides:
  - id: zr
    name: Zaire (with Moroccan, French and Belgian troops)
    polities: [dr-congo, morocco, france, belgium]
    ink: blue
    moves: Zairian and allied moves
    success: Zairian and allied success
  - id: fnlc
    name: Congolese National Liberation Front (FNLC)
    polities: [fnlc]
    ink: orange
    moves: FNLC moves
    success: FNLC success
notes:
  - "Outside support for the FNLC is disputed. Zaire, Morocco and France claimed Cuban and Soviet involvement; the Carter administration said in 1977 that it had no evidence of it, and Cuba denied it, although the FNLC had been armed in Angola, whose government sheltered it. The Moroccan airlift of 1977 was organised through the Safari Club, an anti-communist alliance of France, Morocco, Egypt, Iran and Saudi Arabia."
  - "Casualty figures for Kolwezi in 1978: about 700 African civilians and 120–170 Europeans were killed, most in massacres by the FNLC, and some 250–400 FNLC fighters; five French legionnaires and one Belgian paratrooper died. Zairian troops also executed hundreds of people they accused of helping the rebels."
