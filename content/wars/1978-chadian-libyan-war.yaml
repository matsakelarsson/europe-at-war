  - title: Habré takes N’Djamena
    date: November 1981 – October 1982
    when: "1982-06-07"
    borders: "1982-06-07"
    countries: [td, sd, cm]
    body:
      - "Habré struck as soon as the Libyans had gone. His FAN, rearmed through Sudan, took Abéché on 19 November 1981 and Oum Hadjer in January 1982, while the Inter-African Force stood aside. On 5 June 1982 the GUNT’s forces made a last stand at Massaguet, some 50 km north-east of the capital, and were beaten, and on 7 June Habré entered N’Djamena unopposed. Goukouni fled to Cameroon and then to Libya. In the south Kamougué’s forces resisted until the FAN took Moundou and Sarh in September, and Habré was sworn in as president on 21 October 1982."
      - "Habré’s regime united the country under a northern army and a feared political police, the Documentation and Security Directorate (DDS). Southern rebels, the Hadjerai, the Zaghawa and other groups suspected of disloyalty were repressed; in September 1984 government troops killed many civilians in the south. A truth commission set up after his fall estimated that some 40,000 people died in detention or were executed in 1982–1990, and in 2016 the Extraordinary African Chambers in Dakar sentenced him to life imprisonment for crimes against humanity, war crimes and torture."
    facts:
      - [Abéché taken, "19 November 1981"]
      - [Habré enters N’Djamena, "7 June 1982"]
      - [Habré sworn in as president, "21 October 1982"]
