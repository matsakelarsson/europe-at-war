  - title: The Toyota War
    date: January – March 1987
    when: "1987-01-02"
    borders: "1987-03-27"
    countries: [td, ly, fr, us]
    body:
      - "The Chadian army that Habré’s commander-in-chief Hassan Djamous led north in 1987 fought in a new way: in fast columns of Toyota pickup trucks, some 400 of them supplied by France, armed with machine guns, recoilless rifles and MILAN anti-tank missiles. On 2 January it attacked the Libyan base at Fada, held by some 1,000 Libyans and 300–400 CDR fighters; by Chadian figures 784 Libyans and CDR militiamen were killed and 81 captured and 92 tanks destroyed, for the loss of 18 Chadians."
      - "In March Djamous struck at the main Libyan base in Chad. On 19–20 March his columns ambushed Libyan relief columns at Bir Kora, about 50 km away, and on 22 March they stormed Ouadi Doum, where some 5,000 Libyans broke and fled, many of them through their own minefields, losing hundreds killed and captured. Among the prisoners was Colonel Khalifa Haftar, who later turned against Gaddafi and, decades later, led one side in Libya’s civil wars."
      - "Gaddafi ordered his army out of the north. The garrison of Faya-Largeau, some 3,000 men, abandoned the town on 27 March and fell back to the Aouzou Strip, leaving behind vast stores of equipment. US sources estimated that Libya had lost a tenth of its army and $1.5 billion worth of arms; the United States, which had given Habré money and Stinger missiles, welcomed the result."
    facts:
      - [Battle of Fada, "2 January 1987"]
      - [Fall of Ouadi Doum, "22 March 1987"]
      - [Faya-Largeau abandoned, "27 March 1987"]
    markers:
