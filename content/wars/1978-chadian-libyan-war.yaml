steps:
  - title: Aouzou and Libya’s first interventions
    date: 1973–1979
    when: "1978-02-18"
    borders: "1978-02-18"
    countries: [td, ly, fr]
    body:
      - "Libya had held the Aouzou Strip, a band of desert some 100 km deep along its border with Chad, since 1973 (see the Chadian Civil War). Gaddafi claimed it under the unratified Franco-Italian treaty of 1935; the strip was said to hold uranium, and it gave Libya an airbase from which to reach into Chad, where Gaddafi hoped to see a friendly, Arab-oriented government. From 1976 Libya armed Goukouni Oueddei’s People’s Armed Forces (FAP), the largest rebel army in the north."
      - "In January 1978 the FAP, with Libyan troops, armour and aircraft in support, launched the offensive that took Faya-Largeau on 18 February, and only French intervention, Opération Tacaud, stopped its advance on N’Djamena at Ati in May. A year later, after the fall of Félix Malloum, Goukouni joined the provisional government and turned against his former patron: when some 2,500 Libyan troops crossed into Chad towards Faya-Largeau on 26 June 1979, his militia and French reconnaissance and strike aircraft forced them back."
    facts:
      - [Fall of Faya-Largeau, "18 February 1978"]
      - [Libyan incursion turned back, "June 1979"]
