  - title: The second battle of N’Djamena and the Libyan intervention
    date: March 1980 – November 1981
    when: "1980-03-22"
    borders: "1980-12-16"
    countries: [td, ly, fr, sd]
    body:
      - "The government of national unity formed under the Lagos Accord kept its factions’ armies, and on 22 March 1980 fighting broke out in N’Djamena between Habré’s Armed Forces of the North (FAN) and Goukouni’s FAP. For nine months the two armies fought across the city with artillery and rockets, wrecking much of it; tens of thousands fled across the river to Kousséri in Cameroon, and the French troops left in May. Habré’s men gained the upper hand in the capital and took Faya-Largeau in June."
      - "On 15 June 1980 Goukouni signed a treaty of friendship with Libya, and from October Libyan forces were flown into the north and moved south with Soviet-built T-54 and T-55 tanks, some 7,000–9,000 men with fighters of the Islamic Legion. Libyan and GUNT forces attacked on 6 December and took N’Djamena on 16 December; Habré retreated east to the Sudanese border and announced that he would go on fighting."
      - "On 6 January 1981 Gaddafi and Goukouni announced in Tripoli that the two countries would work for a full union. The announcement provoked protests across Africa, the Organisation of African Unity condemned it, and France, Sudan and Egypt began to arm Habré. Under this pressure, and fearing that Libya meant to stay, Goukouni asked the Libyans to leave by the end of the year; they withdrew from N’Djamena and the rest of Chad, except the Aouzou Strip, by 16 November 1981. An OAU Inter-African Force of Nigerian, Senegalese and Zairean troops, some 3,300 men at its peak, took their place."
    facts:
      - [Fighting in N’Djamena, "22 March – December 1980"]
      - [Libyan and GUNT forces take N’Djamena, "16 December 1980"]
      - [Libyan withdrawal completed, "16 November 1981"]
