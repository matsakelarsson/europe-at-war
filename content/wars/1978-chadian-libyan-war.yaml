id: chadian-libyan-war
name: Chadian–Libyan war
start: "1978-01-29"
end: "1987-09-11"
tier: A
summary: "A war over northern Chad between Muammar Gaddafi’s Libya and successive Chadian governments, fought in and around Chad’s own civil war. Libya had occupied the Aouzou Strip on the Libyan border in 1973 and backed Goukouni Oueddei’s rebels, who took Faya-Largeau with Libyan help in 1978. After the government of national unity formed in 1979 broke apart, Libyan troops helped Goukouni drive his rival Hissène Habré out of N’Djamena in December 1980, and Gaddafi announced a union of the two countries, which alarmed Africa and France; the Libyans withdrew in November 1981, and Habré took the capital in June 1982. Libya then backed Goukouni’s rival government in the north, retook Faya-Largeau in 1983 and held the north of the country for three years, while French troops in Operations Manta and Épervier guarded the south along the 15th and then the 16th parallel. When Goukouni broke with Libya in 1986, the Chadian forces, united under Habré and mounted on Toyota pickup trucks with anti-tank missiles, won the “Toyota War” of 1987: they destroyed the Libyan bases at Fada and Ouadi Doum, took Faya-Largeau and even raided the airbase of Maaten al-Sarra inside Libya. A ceasefire on 11 September 1987 left Libya only the Aouzou Strip, which the International Court of Justice awarded to Chad in 1994; Libya withdrew that May. Habré’s own rule was brutal: a Chadian commission later blamed it for some 40,000 political killings, and he was convicted of crimes against humanity in 2016."
countries: [td, ly, fr, sd, ng, cd, us]
