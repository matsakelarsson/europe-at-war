  - title: Faya-Largeau and Operation Manta
    date: 1983–1984
    when: "1983-06-25"
    borders: "1983-08-10"
    countries: [td, ly, fr, cd, us]
    body:
      - "In October 1982 Goukouni, back in the Tibesti with Libyan support, proclaimed a rival “National Peace Government” at Bardaï under the GUNT’s name. In June 1983 his forces, with Libyan arms and advisers, attacked south and took Faya-Largeau on 25 June. Habré’s army, now called FANT, counter-attacked with French and American supplies and retook the town on 30 July, but Libya threw in its air force and armour, and on 10 August GUNT and Libyan forces took Faya-Largeau again; FANT lost some 700 men. Zaire sent about 2,000 troops to guard N’Djamena, and the United States gave arms and money."
      - "France was reluctant to fight Libya directly, but on 9 August 1983 President François Mitterrand announced that he would contain Gaddafi, and Operation Manta began with troops sent from the Central African Republic; it grew to some 3,500 men with Jaguar strike aircraft, France’s largest intervention in Africa since the Algerian War. Its troops took up positions along a “red line” on the 15th parallel, from Mao to Abéché, and left the north to the Libyans and the GUNT. After a GUNT attack on Ziguey in January 1984, during which a French Jaguar pursuing the raiders was shot down, France moved the line north to the 16th parallel. Chad was in effect partitioned."
      - "On 17 September 1984 France and Libya agreed to withdraw their troops from Chad by 10 November. France left; Libya kept at least 3,000 men in the north and began building an airbase at Ouadi Doum, which Mitterrand admitted after meeting Gaddafi in Crete in November."
    facts:
      - [Faya-Largeau retaken by the GUNT and Libya, "10 August 1983"]
      - [Operation Manta, "August 1983 – November 1984"]
      - [Franco-Libyan withdrawal agreement, "17 September 1984"]
