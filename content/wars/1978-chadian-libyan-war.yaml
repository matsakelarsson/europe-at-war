notes:
  - "The name GUNT (Transitional Government of National Unity) belonged first to the coalition government formed under the Lagos Accord of 1979, in which Goukouni was president and Habré defence minister. After Habré took N’Djamena in 1982, Goukouni and his allies kept the name for their rival government in the north. FANT (Chadian National Armed Forces) was the name of Habré’s army from 1983. Libya also fielded its Islamic Legion, recruited among Sahelian migrants."
  - "Figures are uncertain and come mostly from the two governments. For 1987 alone Libyan losses are given as about 7,500 killed and 1,000 captured, with some 800 tanks and armoured vehicles and 28–32 aircraft lost; Chadian losses as about 1,000 killed. Chad’s Truth Commission of 1992 estimated that about 40,000 people died in detention or were executed under Habré’s rule in 1982–1990."
