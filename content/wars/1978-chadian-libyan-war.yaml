  - title: Épervier and the break-up of the GUNT
    date: 1985–1986
    when: "1986-02-10"
    borders: "1986-02-14"
    countries: [td, ly, fr]
    body:
      - "By 1985 Libya had some 7,000 troops, 300 tanks and 60 combat aircraft in northern Chad. On 10 February 1986 Libyan and GUNT forces attacked across the 16th parallel against Kouba Olanga, Kalaït and Oum Chalouba, and FANT drove them back within days. France answered with Opération Épervier: on 16 February its Jaguars bombed the runway at Ouadi Doum, and the next day a Libyan Tu-22 bomber struck N’Djamena airport, doing little damage. Some 1,200 French troops and air-defence units deployed in the south and stayed for decades."
      - "Meanwhile the GUNT fell apart. Goukouni stayed away from OAU talks in March 1986, the Democratic Revolutionary Council of Acheikh ibn Oumar sided with Libya and turned on Goukouni’s men, and in October Goukouni’s People’s Armed Forces fought Libyan troops at Fada and in the Tibesti. Goukouni was arrested by the Libyans, and on 24 October his fighters went over to Habré. In December Libya launched an offensive against them in the Tibesti, and France dropped supplies to the besieged FAP. For the first time almost all Chadian factions stood together against Libya."
    facts:
