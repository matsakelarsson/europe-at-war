  - title: Aouzou, Maaten al-Sarra and the peace
    date: August 1987 – May 1994
    when: "1987-08-08"
    borders: "1987-09-11"
    countries: [td, ly, fr]
    body:
      - "On 8 August 1987 FANT routed a Libyan force and occupied the oasis of Aouzou itself. Libya counter-attacked with heavy air support, and on 28 August drove out the 400 or so Chadian troops left there. Habré answered with a raid deep into Libya: on 5 September his columns struck the airbase of Maaten al-Sarra, more than 100 km inside Libya, and by Chadian figures killed 1,713 Libyans, took 300 prisoners and destroyed 26 aircraft, for 65 dead of their own. France, which had not been told, disapproved; the United States welcomed it."
      - "A ceasefire brokered by the OAU chairman, Kenneth Kaunda, took effect on 11 September 1987. Chad and Libya restored relations in October 1988 and in August 1989 agreed to put the Aouzou question to the International Court of Justice. Habré was overthrown on 1 December 1990 by his former commander Idriss Déby, whose forces came from Sudan, and fled to Senegal."
      - "On 3 February 1994 the court ruled by 16 votes to 1 that the border had been fixed by the Franco-Libyan treaty of 1955 and that the strip belonged to Chad. Libya accepted the ruling and withdrew under the eyes of UN observers, and on 30 May 1994 the two countries declared the handover complete."
    facts:
      - [Aouzou taken and lost, "8 and 28 August 1987"]
      - [Raid on Maaten al-Sarra, "5 September 1987"]
      - [Ceasefire, "11 September 1987"]
      - [ICJ judgment, "3 February 1994"]
    markers:
