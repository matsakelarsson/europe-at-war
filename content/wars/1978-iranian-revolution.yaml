notes:
  - The number of people killed is disputed. The researcher Emadeddin Baghi, working from the records of the Martyrs Foundation, counted about 2,800 deaths in 1978–1979; the revolutionaries at the time spoke of tens of thousands. Hundreds of officials of the old regime were executed by revolutionary courts in 1979.
