id: iranian-revolution
name: Iranian Revolution
start: "1978-01-09"
end: "1979-02-11"
tier: C
summary: The revolution that overthrew Mohammad Reza Shah Pahlavi and made Iran an Islamic republic under Ayatollah Ruhollah Khomeini. Opposition to the Shah’s autocratic rule, his secret police (SAVAK), inequality and rapid Westernisation united clergy, bazaar merchants, students, liberals and leftists. After police fired on seminary students in Qom in January 1978, mourning ceremonies every forty days grew into nationwide protests; a fire at the Cinema Rex in Abadan in August, which killed more than 400 people and was blamed on the government, though Islamist militants were later convicted, and the shooting of demonstrators in Tehran’s Jaleh Square on “Black Friday”, 8 September 1978, turned many against the Shah. Strikes, above all in the oil industry, paralysed the country through the autumn, and millions marched in December. The Shah left Iran on 16 January 1979, Khomeini returned from exile on 1 February, and on 11 February the army declared itself neutral and the monarchy fell after two days of street fighting. An Islamic Republic was proclaimed after a referendum on 1 April 1979.
