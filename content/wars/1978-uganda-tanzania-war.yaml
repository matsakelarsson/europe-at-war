  - title: Libya intervenes – the Battle of Lukaya
    date: March 1979
    when: "1979-03-11"
    borders: "1979-03-11"
    countries: [ug, tz, ly]
    body:
      - "Muammar Gaddafi, who saw Amin’s Uganda as a Muslim state threatened by a Christian-led army, began flying Libyan troops into Entebbe in mid-February, against the advice of his own army commander; on 9 March more than 1,000 Libyan soldiers arrived with about 40 PLO fighters, and in all some 4,500 Libyans served in Uganda. Encouraged by the defeat of a rebel attack on Tororo on 2–4 March, Amin ordered a combined Ugandan, Libyan and Palestinian force with T-55 and Sherman tanks to retake Masaka."
      - "The only road from Masaka to Kampala crossed a long causeway through the swamp at Lukaya. On 10 March the attackers drove the TPDF’s 201st Brigade out of Lukaya in panic, but stopped there instead of pushing on. The Tanzanians brought the 208th Brigade under Brigadier Mwita Marwa round through the bush from the north-west to cut the road behind them, and on 11 March the regrouped 201st attacked from the front and the 208th from the rear. The Ugandan and Libyan force broke; the Ugandan commander, Lieutenant Colonel Godwin Sule, was killed, and more than 400 of his men died, about 200 of them Libyans. Lukaya was the largest battle of the war, and after it the Uganda Army began to fall apart."
      - "From 24 to 26 March Ugandan exile groups met at Moshi in Tanzania and founded the Uganda National Liberation Front and its army, with the former university principal Yusuf Lule as chairman. Gaddafi sent Nyerere an ultimatum to withdraw within 24 hours, and a Libyan Tu-22 bomber tried to bomb the fuel depot at Mwanza and missed; Tanzanian jets struck fuel depots in Kampala, Jinja and Tororo in reply. Meanwhile the TPDF’s 205th Brigade fought a three-week battle at Sembabule, the longest of the war, and other brigades cleared the road to Kampala and took Mpigi."
    facts:
