steps:
  - title: Amin invades Kagera
    date: October – November 1978
    when: "1978-11-01"
    borders: "1978-11-01"
    countries: [ug, tz]
    body:
      - "Idi Amin had seized power in Uganda from Milton Obote in January 1971, and Obote lived in exile in Tanzania as a guest of President Julius Nyerere. A raid by Obote’s supporters from Tanzania failed in 1972, and an agreement reached at Mogadishu calmed the border for a time. By 1978 Amin’s regime was in economic crisis and his army was divided by purges and mutinies. The Kagera Salient, some 1,900 square kilometres of Tanzanian land between the straight colonial border along latitude 1° South and the Kagera River, about 29 kilometres to the south, had long been claimed by Ugandan nationalists."
      - "Ugandan troops raided the village of Kakunyu on 9 October 1978, Ugandan MiGs bombed Bukoba on 18 October, and on 25 October fighting broke out around Mutukula. On 30 October about 3,000 Ugandan soldiers under Major General Yusuf Gowon invaded along four routes, through Kukunga, Masanya, Mutukula and Minziro, and reached the Kyaka Bridge over the Kagera that evening. They looted the salient, drove off cattle and killed about 1,500 civilians, while some 5,000 hid in the bush. On 1 November Radio Uganda announced the “liberation” of the salient and declared the Kagera River the new border; two days later the Ugandans blew up the Kyaka Bridge to stop a counter-attack."
      - "On 2 November Nyerere declared war: “We have the reason, we have the resources, and we have the will to fight him.” The Organisation of African Unity did not condemn Uganda, but six African leaders, among them Samora Machel and Kenneth Kaunda, did, and Mozambique offered a battalion. Under pressure, Amin announced on 14 November that he was withdrawing his troops, though many stayed."
    facts:
      - [Bukoba bombed, "18 October 1978"]
      - [Ugandan invasion of the Kagera Salient, "30 October 1978, about 3,000 troops"]
      - [Civilians killed in Kagera, "about 1,500"]
      - [Annexation announced, "1 November 1978"]
      - [Tanzania declares war, "2 November 1978"]
