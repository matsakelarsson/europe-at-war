  - title: Tanzania retakes Kagera
    date: November 1978 – January 1979
    when: "1979-01-22"
    borders: "1979-01-22"
    countries: [tz, ug]
    body:
      - "Tanzania had a small army, fewer than 40,000 soldiers, and the TPDF called up reservists, police, prison guards and the militia until it had more than 150,000 under arms. On 19 November its engineers laid a pontoon bridge across the Kagera, and on 23 November three brigades crossed and began to reoccupy the salient, against little resistance. On 4 December the 206th and Southern Brigades secured Mutukula on the Tanzanian side of the border and the 207th Brigade retook Minziro. By early January the salient was clear."
      - "On 25 December the TPDF opened an artillery bombardment along the border with BM-21 Grad rocket launchers, which terrified the Ugandan troops, who called them “Saba-Saba”. Ugandan exiles joined the Tanzanians: Kikosi Maalum, loyal to Obote and led by Tito Okello and David Oyite-Ojok, and Yoweri Museveni’s Front for National Salvation (FRONASA). On 22 January 1979 Tanzanian troops crossed the border and took Mutukula in Uganda, then razed it and killed several civilians in revenge for Kagera; Nyerere, horrified, ordered his army to spare civilians and property from then on."
