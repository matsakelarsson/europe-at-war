  - title: To the Sudanese border
    date: April – June 1979
    when: "1979-06-03"
    borders: "1979-06-03"
    countries: [ug, tz]
    body:
      - "The war went on in the east and north. On 22 April the TPDF took Jinja and the Owen Falls Dam, which supplied all of Uganda’s electricity, intact. Amin’s loyalists tried to stop the advance northwards at Bombo, Lira and Karuma Falls and were beaten each time. The last clash came on 27 May near Bondo in West Nile, after which the Tanzanian task force took Arua without resistance, and on 3 June 1979 a Tanzanian brigade reached the Sudanese border, ending the war. In West Nile, Amin’s home region, Ugandan rebels of FRONASA and Kikosi Maalum and local vigilantes carried out revenge killings."
      - "Tanzania lost 373 soldiers, 96 of them in combat, and about 1,500 civilians, almost all in Kagera; about 150 Ugandan rebels died. About 1,000 Uganda Army soldiers were killed and 3,000 captured, and at least 600 Libyans died. The war cost Tanzania between $500 million and $1 billion, a heavy burden on one of the world’s poorest countries. Tanzanian troops stayed in Uganda to support the new government until October 1981, as the UNLF split and Uganda went into the Bush War."
    facts:
      - [Jinja and the Owen Falls Dam taken, "22 April 1979"]
      - [Last battle, "27 May 1979, near Bondo"]
      - [Sudanese border reached, "3 June 1979"]
      - [Tanzanian military dead, "373 (96 in combat)"]
      - [Libyan dead, "at least 600"]
