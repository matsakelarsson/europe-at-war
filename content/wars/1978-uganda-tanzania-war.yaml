id: uganda-tanzania-war
name: Uganda–Tanzania War
start: "1978-10-09"
end: "1979-06-03"
tier: A
summary: "The war between Idi Amin’s Uganda and Julius Nyerere’s Tanzania that ended with the fall of Amin. Relations had been hostile since Amin overthrew Milton Obote in 1971 and Obote took refuge in Tanzania. In October 1978 Ugandan troops, amid unrest in their own army, crossed the border, and on 30 October about 3,000 of them invaded the Kagera Salient, the Tanzanian land between the border and the Kagera River, killing some 1,500 civilians; on 1 November Amin announced its annexation. Nyerere declared war, mobilised the Tanzania People’s Defence Force (TPDF), which grew from under 40,000 to over 150,000, and drove the Ugandans out of Kagera by January 1979. With Ugandan exile forces, among them Obote’s supporters and Yoweri Museveni’s FRONASA, the TPDF then invaded Uganda, took and razed Masaka and Mbarara in February, and on 10–11 March defeated a Ugandan, Libyan and Palestinian force at Lukaya, the largest battle of the war; Muammar Gaddafi had sent about 4,500 Libyan troops to save Amin, and the PLO a few hundred fighters. While the exiles formed the Uganda National Liberation Front (UNLF) at Moshi, the Tanzanians took Entebbe on 7 April and Kampala on 10–11 April 1979; Amin fled to Libya and later Saudi Arabia, and the UNLF’s Yusuf Lule became president. Tanzanian forces reached the Sudanese border on 3 June. Tanzania lost 373 soldiers, 96 of them in combat, and about 1,500 civilians; about 1,000 Ugandan soldiers and at least 600 Libyans were killed. Numbers of Ugandan civilian deaths are uncertain; revenge killings by Ugandan rebels in the north and west were widespread. The war cost Tanzania between $500 million and $1 billion, and its troops stayed in Uganda until 1981, while Uganda slid into the Bush War."
countries: [ug, tz, ly]
sides:
  - id: tz
    name: Tanzania and the Ugandan exiles (UNLF)
    polities: [tanzania, unlf, mozambique]
    ink: green
    moves: Tanzanian and UNLF moves
    success: Tanzanian and UNLF success
  - id: ug
    name: Uganda, Libya and the PLO
    polities: [uganda, libya, plo]
    ink: red
    moves: Ugandan and Libyan moves
    success: Ugandan and Libyan success
notes:
  - "Tanzania called the war the Kagera War and the advance into Uganda a counter-attack; in Uganda it is remembered as the war of liberation from Amin, and 11 April was celebrated as Liberation Day until 1986. Mozambique sent a battalion of about 800 men, and several African states sent Tanzania small amounts of arms."
  - "Losses are uncertain: Tanzanian figures are the best documented (373 soldiers dead, 96 in combat). Estimates of Ugandan civilian deaths range from about 500 (Tony Avirgan and Martha Honey) to several thousand; PLO losses were 12 by the PLO’s count and as many as 200 by Tanzania’s."
