  - title: The fall of Kampala
    date: April 1979
    when: "1979-04-11"
    borders: "1979-04-11"
    countries: [ug, tz, ly]
    body:
      - "From the heights of Mpigi the Tanzanians could see the Entebbe peninsula, where the Libyans had their airbridge, and they decided to take it before attacking the capital. On 7 April the 208th Brigade took Entebbe; the Libyans there suffered heavy losses, and Amin, who was at the State House, escaped by helicopter to Kampala. Nyerere then let Gaddafi know that the Libyan troops could be flown out unopposed from the airstrip at Jinja, and most of them left Uganda."
      - "On 10 April the TPDF and UNLF fighters advanced into Kampala against light resistance, and the city was secured on 11 April; its inhabitants came out to celebrate, and widespread looting followed. Amin had already fled, first to Libya and later to Saudi Arabia, where he died in 2003. On 13 April Yusuf Lule was flown in and sworn in as president, and 11 April was celebrated in Uganda as Liberation Day until 1986."
