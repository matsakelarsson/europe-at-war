  - title: Into Uganda – Masaka and Mbarara
    date: February 1979
    when: "1979-02-25"
    borders: "1979-02-25"
    countries: [ug, tz]
    body:
      - "When Amin refused to give up his claim to Kagera and the OAU still did not condemn him, Nyerere decided to occupy southern Uganda and its two main towns, Masaka and Mbarara, expecting that Amin’s army might collapse. Two TPDF brigades advanced on Masaka from Mutukula, clearing Ugandan positions and seizing the airstrip at Lukoma on 13 February, and took the garrison of Kalisizo, 28 kilometres south of Masaka. Further west, the 206th Brigade, pushing towards Mbarara, met stiffer resistance, and a battalion was ambushed near Lake Nakivale, losing 24 men."
      - "The Tanzanians surrounded Masaka on three sides and, after waiting for an OAU mediation attempt in Nairobi to fail, bombarded it; they took the town on 24 February and blew up much of what was left. On 25 February the TPDF and several dozen of Museveni’s rebels took Mbarara and destroyed its remaining buildings with dynamite. Crowds of civilians cheered the advancing Tanzanians in many places."
    facts:
