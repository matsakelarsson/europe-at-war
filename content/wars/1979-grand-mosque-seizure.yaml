id: grand-mosque-seizure
name: Grand Mosque seizure
start: "1979-11-20"
end: "1979-12-04"
tier: C
summary: The two-week occupation of the Great Mosque of Mecca, Islam’s holiest site, by armed followers of Juhayman al-Otaybi, a former Saudi National Guard corporal and preacher who denounced the Saudi royal family as corrupt and Westernised. At dawn prayers on 20 November 1979, the first day of the Islamic year 1400, between 300 and 600 men seized the mosque with tens of thousands of worshippers inside, and proclaimed Juhayman’s brother-in-law, Mohammed Abdullah al-Qahtani, to be the Mahdi, the redeemer expected at the end of time. After the senior clergy issued a ruling allowing force in the sanctuary, Saudi troops and National Guardsmen fought for the mosque and then for the cellars beneath it, with advice and gas from a small team of French GIGN commandos and help from Pakistani special forces, until the last militants surrendered on 4 December. Al-Qahtani was killed in the fighting. Official figures gave 127 soldiers, 117 militants and 26 pilgrims killed, though diplomats believed the toll was higher. Juhayman and 62 of his followers were beheaded on 9 January 1980 in eight Saudi cities. Afterwards the government gave the conservative clergy greater influence over Saudi society.
