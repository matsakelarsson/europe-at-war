steps:
  - title: The invasion of February 1979
    date: 17 February – 16 March 1979
    when: "1979-02-17"
    borders: "1979-03-01"
    countries: [vn, cn]
    body:
      - "Before dawn on 17 February 1979, after an artillery bombardment, Chinese armies crossed the border at some 26 points along its 1,300 km length, from Lai Châu in the west to Quảng Ninh on the coast. The main thrusts were aimed at the provincial capitals: Lào Cai, on the Red River opposite Hekou, fell within days, Cao Bằng after heavy fighting by the end of February, and Lạng Sơn, the gateway to Hanoi, after the battle for Đồng Đăng and its caves and a week of fighting in the town, on 5–6 March. Vietnam kept most of its regular divisions back to defend Hanoi or in Cambodia, and the Chinese, using the human-wave tactics and poor communications of an army that had not fought since Korea, lost heavily to border troops, militia and regional forces."
      - "On 5 March, having taken Lạng Sơn and opened the road to the Red River delta, China announced that it had achieved its aims and would withdraw. As they left, its troops blew up bridges, railways, mines, factories and public buildings and drove off livestock; the last crossed back on 16 March. China said it had punished Vietnam and shown that the Soviet Union would not come to its aid; Vietnam said it had repelled the invasion with its local forces alone. Vietnam did not withdraw from Cambodia."
