    moves: Vietnamese moves
    success: Vietnamese success
notes:
  - China called its attack a “self-defensive counter-attack” against Vietnamese border provocations; Vietnam calls the war the “war to defend the northern border” against Chinese aggression. For years the war was barely mentioned in either country’s official histories.
  - "Casualty figures are disputed. China gave its losses in 1979 as about 6,900 dead and 15,000 wounded; Vietnam claimed 62,500 Chinese casualties. Chinese sources put Vietnamese losses at more than 40,000 dead; Vietnam gave about 10,000 civilian dead and has not published its military losses. Thousands more died in the border fighting of 1980–1989."
