id: sino-vietnamese-war
name: Sino-Vietnamese War
start: "1979-02-17"
end: "1991-11"
tier: B
summary: "China’s invasion of northern Vietnam in February–March 1979 and the border war that followed until 1991. Relations between the former allies had broken down over Vietnam’s alliance with the Soviet Union, its treatment of its ethnic Chinese, who fled in their hundreds of thousands in 1978, disputed borders and islands, and above all its invasion of Cambodia, China’s ally. On 17 February 1979 some 200,000 Chinese troops attacked along the whole border to “teach Vietnam a lesson”, in Deng Xiaoping’s words. They took the provincial capitals of Lào Cai, Cao Bằng and Lạng Sơn against fierce resistance from Vietnamese border troops and militia, then announced their withdrawal on 5 March and left by 16 March, destroying what they could. Both sides claimed victory. Vietnam did not leave Cambodia, and for ten more years the two armies shelled each other and fought for hilltops along the border, most heavily at Vị Xuyên (Laoshan) in 1984–1989. Relations were normalised in November 1991."
countries: [vn, cn]
sides:
  - id: cn
    name: China
    polities: [china]
    ink: gold
    moves: Chinese moves
    success: Chinese success
  - id: vn
    name: Vietnam
    polities: [vietnam]
