  - title: The border war and normalisation
    date: 1979–1991
    when: "1984-04-28"
    borders: "1984-07-12"
    countries: [vn, cn]
    body:
      - "The border stayed a war zone for ten years. Chinese and Vietnamese troops shelled each other’s positions and fought for hilltops, at Fakashan and Koulin near Lạng Sơn in 1981 and most heavily in Vị Xuyên district of Hà Giang province, opposite Malipo in Yunnan, which the Chinese call Laoshan. On 28 April 1984 Chinese troops took Hill 1509 and the neighbouring heights there; a Vietnamese counter-attack on 12 July failed with heavy losses. Shelling and raids went on until 1989, and Vietnamese veterans remember the front as the “lime kiln of the century”. At sea, Chinese ships sank Vietnamese supply vessels at Johnson South Reef in the Spratly Islands on 14 March 1988, killing 64 Vietnamese sailors."
      - "As the Soviet Union withdrew its support and Vietnamese troops left Cambodia in 1989, both governments sought a settlement. Vietnam’s party leader Đỗ Mười and prime minister Võ Văn Kiệt visited Beijing in November 1991, after the Paris agreements on Cambodia, and relations were normalised. A land border treaty followed on 30 December 1999, and the demarcation of the border was completed in 2008–2009. The dispute over the Paracel and Spratly islands in the South China Sea remains unresolved."
