id: soviet-afghan-war
name: Soviet–Afghan War
start: "1979-12-24"
end: "1989-02-15"
tier: A
summary: The war in which the Soviet Union sent its army into Afghanistan to prop up the communist government of the People’s Democratic Party of Afghanistan (PDPA), which had seized power in April 1978 and faced revolts across the country. Soviet troops crossed the border on 24–25 December 1979, killed the party leader Hafizullah Amin and installed Babrak Karmal. For nine years some 100,000 Soviet soldiers and the Afghan army fought the mujahideen, Islamist and tribal guerrillas armed through Pakistan with money from the United States, Saudi Arabia and others. The Soviet forces held the cities and roads but could not end the insurgency, and much of the countryside was bombed and emptied. Under Mikhail Gorbachev the Soviet Union signed the Geneva Accords in April 1988 and withdrew its last troops on 15 February 1989. Between about half a million and two million Afghans died, more than five million fled abroad, and about 15,000 Soviet soldiers were killed.
countries: [af, ru, pk]
sides:
  - id: sov
    name: Soviet Union and the Afghan government
    polities: [ussr, afghanistan]
    ink: red
    moves: Soviet and Afghan government moves
    success: Soviet and government success
  - id: muj
    name: Afghan mujahideen
    polities: [mujahideen]
    ink: olive
    moves: Mujahideen moves
    success: Mujahideen success
notes:
  - Afghan deaths are very uncertain; estimates range from about 560,000 to 2 million, most of them civilians. The official Soviet count of its dead rose from 13,833 in 1989 to about 15,000 in later figures. Afghan government losses are not well known.
  - The mujahideen were not one force. Seven Sunni parties based in Peshawar, Pakistan, received most of the foreign aid, through Pakistan’s Inter-Services Intelligence (ISI); Shia parties were backed by Iran; and many local commanders, such as Ahmad Shah Massoud in the Panjshir and Ismail Khan around Herat, acted largely on their own.
  - The Soviet Union described its intervention as help requested by the Afghan government under the friendship treaty of December 1978. The UN General Assembly called for the withdrawal of foreign troops in January 1980 by 104 votes to 18.
