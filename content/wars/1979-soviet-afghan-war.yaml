        text: Among the first regions to rise against the new government.
        lonlat: [70.6, 35.35]
  - title: The invasion
    date: December 1979 – January 1980
    when: "1979-12-24"
    borders: "1980-01-14"
    countries: [af, ru, uz, tm]
    body:
      - On 12 December 1979 a small group in the Soviet Politburo around Leonid Brezhnev decided to intervene. From 24 December Soviet transport aircraft landed airborne troops at Kabul and Bagram, and on 25 December motor rifle divisions of the 40th Army crossed the Amu Darya at Termez and the border at Kushka. On the evening of 27 December Soviet special forces stormed the Tajbeg Palace outside Kabul in Operation Storm-333 and killed Amin, while other units took the capital’s ministries and radio station.
      - Babrak Karmal, leader of the PDPA’s rival Parcham faction, was flown in and proclaimed head of government. Soviet columns drove south over the Salang Pass to Kabul and from Kushka through Herat and Shindand to Kandahar, and by mid-January about 80,000 Soviet troops were in the country. The invasion was condemned by the UN General Assembly and by most Muslim countries. The United States stopped grain sales, boycotted the 1980 Moscow Olympics and began, with Pakistan and Saudi Arabia, to arm the Afghan resistance.
    facts:
      - [Soviet troops cross the border, "24–25 December 1979"]
      - [Operation Storm-333, "27 December 1979, Amin killed"]
      - [UN General Assembly Resolution ES-6/2, "14 January 1980"]
