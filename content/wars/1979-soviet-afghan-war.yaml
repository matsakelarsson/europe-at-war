  - title: The war in the valleys
    date: 1980–1985
    when: "1980-04"
    borders: "1984-05-01"
    countries: [af]
    body:
      - The Soviet commanders had expected to garrison the cities and leave the fighting to the Afghan army, but desertions cut that army in half, and Soviet troops were drawn into a war against guerrillas in the mountains. They held Kabul, the provincial capitals, the air bases and the ring road, and launched large sweeps with tanks, helicopters and airborne troops into valleys that the mujahideen used as bases. The Panjshir valley north of Kabul, held by Ahmad Shah Massoud’s fighters, was attacked nine times between 1980 and 1985; the Soviets agreed a truce with Massoud in 1983–1984, then struck it again with more than 13,000 Soviet and Afghan troops in April 1984.
      - To deny the guerrillas food and shelter, Soviet and Afghan forces bombed villages, destroyed irrigation channels and crops and scattered millions of mines, and sometimes killed civilians in reprisal for attacks. Whole regions near the Pakistani border and along the main roads were emptied. In Herat, Ismail Khan’s fighters held parts of the old city for years, and Kandahar was fought over street by street. The war became a stalemate in which the Soviet side could win any battle it chose but could not hold the countryside.
    facts:
      - [Soviet troops in Afghanistan, "about 100,000–115,000 at the peak"]
      - [Panjshir offensives, "nine, 1980–1985"]
    markers:
      - kind: battle
        side: muj
        name: Panjshir valley
        date: 1980–1985
        text: Massoud’s base, attacked in nine Soviet offensives. Each time the guerrillas withdrew into side valleys and returned when the troops left.
        lonlat: [69.6, 35.38]
      - kind: air
        side: sov
        name: Bagram
        date: 1980–1989
        text: The base from which most offensives in the north-east were flown.
        lonlat: [69.27, 34.95]
        lp: l
