steps:
  - title: The Saur Revolution and the revolts
    date: April 1978 – December 1979
    when: "1978-04-27"
    borders: "1979-03-15"
    countries: [af]
    body:
      - On 27–28 April 1978 army officers loyal to the People’s Democratic Party of Afghanistan (PDPA), a small Marxist party, overthrew and killed President Mohammad Daoud Khan in what the party called the Saur (April) Revolution. Its leader, Nur Muhammad Taraki, and his deputy Hafizullah Amin pushed through land reform, changes to marriage law and a literacy campaign, and arrested and executed thousands of real and supposed opponents, among them clergy, tribal leaders and rival communists; many were killed at Pul-e Charkhi prison outside Kabul.
      - Revolts broke out in Nuristan, Kunar and the Hazara highlands. In April 1979 government troops with Soviet advisers killed between 1,100 and 1,700 men of the village of Kerala in Kunar. In March 1979 the city of Herat rose; soldiers of the garrison mutinied and joined the rebels, and Soviet advisers and their families were killed. Government forces retook the city with bombing and tanks, and estimates of the dead range from about 3,000 to 25,000.
      - The Soviet leadership refused Taraki’s first requests for troops but sent weapons, advisers and, during 1979, small units. In September Amin overthrew Taraki, who was murdered on his orders in October. Moscow distrusted Amin and feared that he would lose the war or turn to the West.
    facts:
      - [Saur Revolution, "27–28 April 1978"]
      - [Herat uprising, "15–20 March 1979"]
      - [Taraki overthrown by Amin, "September 1979"]
