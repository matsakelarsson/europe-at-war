  - title: Refugees, Peshawar and the foreign backers
    date: 1980–1987
    when: "1981"
    borders: "1985-01-01"
    countries: [af, pk, ir, us, sa]
    body:
      - By the mid-1980s more than three million Afghans lived in camps in Pakistan’s North-West Frontier Province and Baluchistan, and about two million in Iran, the largest refugee population in the world. The camps were also the bases of the seven Sunni mujahideen parties in Peshawar, among them Gulbuddin Hekmatyar’s Hezb-e Islami and Burhanuddin Rabbani’s Jamiat-e Islami, through which Pakistan’s Inter-Services Intelligence (ISI) distributed weapons. Iran supported Shia parties among the Hazaras.
      - Under Operation Cyclone the United States’ Central Intelligence Agency funded the mujahideen through the ISI, from a few tens of millions of dollars a year at first to several hundred million a year from 1985, matched by Saudi Arabia; China, Egypt and Britain also supplied arms. Thousands of volunteers from Arab countries joined the fight, among them Osama bin Laden, though their military role was small. Pakistan’s border areas suffered bombing and sabotage attributed to the Afghan and Soviet secret services.
    facts:
      - [Afghan refugees, "more than 5 million at the peak, in Pakistan and Iran"]
      - [US aid, "several hundred million dollars a year by the late 1980s, matched by Saudi Arabia"]
    markers:
      - kind: event
        side: muj
        name: Peshawar
        date: 1980–1989
        text: The seat of the seven Sunni mujahideen parties and a centre of the refugee camps and of the arms pipeline.
        lonlat: [71.58, 34.01]
      - kind: event
        side: muj
        name: Quetta
        date: 1980–1989
        text: Refugee camps and supply routes for the southern provinces.
        lonlat: [67.00, 30.18]
      - kind: event
        side: muj
        name: Mashhad
        date: 1980–1989
        text: Iran sheltered about two million Afghan refugees and supported Shia mujahideen groups.
        lonlat: [59.61, 36.30]
    arrows:
