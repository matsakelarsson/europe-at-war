        label: Magistral
        via: [[69.22, 33.6], [69.5, 33.5], [69.92, 33.35]]
  - title: Geneva and the withdrawal
    date: April 1988 – February 1989
    when: "1988-04-14"
    borders: "1989-02-15"
    countries: [af, ru, pk, uz]
    body:
      - On 14 April 1988 Afghanistan and Pakistan signed the Geneva Accords, with the Soviet Union and the United States as guarantors. Soviet troops were to leave within nine months, starting on 15 May; both superpowers kept the right to arm their sides, and the mujahideen, who were not party to the talks, rejected them. Half the Soviet force left by August 1988. Garrisons such as Kandahar and Kunduz were handed to the Afghan army, and in January 1989 Soviet aircraft and artillery bombarded villages along the Salang highway to secure the last convoys.
      - On 15 February 1989 the commander of the 40th Army, General Boris Gromov, walked across the Friendship Bridge over the Amu Darya to Termez, the last Soviet soldier to leave, he said. About 620,000 Soviet soldiers had served in Afghanistan. Najibullah’s government, still supplied by Moscow, survived the withdrawal, and the war went on among Afghans.
    facts:
      - [Geneva Accords, "14 April 1988"]
      - [Withdrawal, "15 May 1988 – 15 February 1989"]
      - [Soviet dead, "about 14,500–15,000"]
    markers:
