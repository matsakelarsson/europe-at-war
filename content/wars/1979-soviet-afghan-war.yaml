  - title: Stingers and national reconciliation
    date: 1986–1987
    when: "1986-05-04"
    borders: "1987-12-30"
    countries: [af, ru, pk]
    body:
      - Mikhail Gorbachev, Soviet leader from March 1985, called the war a “bleeding wound” and decided to end it, but first allowed his commanders a last push. In May 1986 Moscow replaced Karmal with Mohammad Najibullah, the head of the secret police, who in January 1987 offered a ceasefire and “national reconciliation” with the mujahideen; they refused. In April 1986 Soviet and Afghan forces took the guerrilla base of Zhawar near the Pakistani border, but abandoned it days later.
      - In September 1986 mujahideen near Jalalabad shot down Soviet helicopters with American Stinger missiles, the first of some 2,000 supplied. Low-flying aircraft became much more vulnerable, and Soviet tactics changed. In late 1987, in Operation Magistral, Soviet and Afghan troops fought through the Satukandav pass to relieve Khost, cut off for years, in one of the last large Soviet operations.
    facts:
      - [Najibullah replaces Karmal, "4 May 1986"]
      - [First Stinger shoot-down, "25 September 1986"]
      - [Operation Magistral, "November 1987 – January 1988"]
    markers:
      - kind: event
        side: muj
        name: Jalalabad
        date: 25 September 1986
        text: Mujahideen fighters shot down three Mi-24 helicopters approaching the airfield, the first use of Stingers in the war.
        lonlat: [70.45, 34.43]
      - kind: taken
        side: sov
        name: Zhawar
        date: April 1986
        text: A fortified mujahideen base of caves near the Pakistani border, taken after weeks of fighting and given up soon after.
        lonlat: [69.95, 33.21]
        lp: b
      - kind: held
        side: sov
        name: Khost
        date: 1987–1988
        text: Relieved by Operation Magistral after a long siege. The road was given up again when Soviet troops left.
        lonlat: [69.92, 33.34]
      - kind: event
        side: sov
        name: Kabul
        date: 1986–1987
        text: Najibullah’s government offered national reconciliation, a new constitution and a role for non-communists.
        lonlat: [69.17, 34.53]
        lp: l
    arrows:
