        date: 1980–1989
        text: Ismail Khan, a former army captain who had joined the 1979 revolt, led the resistance in the west.
        lonlat: [62.20, 34.35]
      - kind: battle
        side: muj
        name: Kandahar
        date: 1980–1988
        text: The southern city saw some of the heaviest fighting of the war, much of it inside the city.
        lonlat: [65.71, 31.61]
      - kind: battle
        name: Kunar valley
