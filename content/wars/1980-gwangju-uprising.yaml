steps:
  - title: The paratroopers and the rising
    date: 18–21 May 1980
    when: "1980-05-18"
    borders: "1980-05-18"
    countries: [kr]
    body:
      - On the morning of 18 May 1980, the day after martial law was extended to the whole country, students gathered at the gate of Chonnam National University to protest against its closure. Paratroopers of the 7th Special Forces Brigade charged them, and the protest moved into the city centre. Over the next two days the special forces, reinforced by the 11th and 3rd Brigades, beat, bayoneted and arrested students and passers-by alike, and the people of Gwangju, outraged, joined the protests in tens of thousands. On the evening of 20 May hundreds of taxi and bus drivers drove in a column to the provincial office, the local broadcasting stations that had ignored the events were set on fire, and troops near Gwangju Station opened fire.
      - On 21 May, the Buddha’s birthday, a huge crowd filled the main avenue, Geumnam-ro. At about 1 p.m. troops guarding the South Jeolla provincial office fired into the crowd, killing dozens. Citizens then took rifles and machine guns from police stations and reservist armouries in Hwasun, Naju and other towns of the region and fought the troops in the streets; by evening the army had withdrawn from the city to its outskirts. Protests spread to Mokpo, Haenam and other towns of South Jeolla.
    facts:
      - [Martial law extended nationwide, "17 May 1980"]
      - [First clashes at Chonnam National University, "18 May 1980"]
      - [Troops fire at the provincial office, "21 May 1980, about 1 p.m."]
