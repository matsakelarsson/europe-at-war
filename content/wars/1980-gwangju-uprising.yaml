  - title: The free city and 27 May
    date: 22–27 May 1980
    when: "1980-05-22"
    borders: "1980-05-27"
    countries: [kr]
    body:
      - From 22 May the city was surrounded by some 23,000 troops, while inside it citizens’ committees negotiated with the authorities, collected weapons, organised funerals and kept order; there was little looting or crime. The army killed people trying to leave or enter the city. On 23 May soldiers fired on a minibus at Jiwon-dong on the south-eastern edge of the city and killed 15 of its 18 passengers, and on 24 May, at Songam-dong, two army units mistook each other for armed citizens and opened fire, killing 13 soldiers, after which troops killed several residents of the area.
      - The negotiations failed, and at 4 a.m. on 27 May troops of the 3rd, 7th and 11th Special Forces Brigades entered the city in Operation Sangmu-Chungjeong. A few hundred armed citizens, many of them students and young workers, had stayed at the provincial office and other buildings; their spokesman, Yun Sang-won, was among those killed. The building was taken within about two hours.
      - The government called the rising a riot stirred up by communists and by Kim Dae-jung, who was sentenced to death (later commuted). Chun became president in September 1980. The memory of Gwangju drove the democracy movement that forced direct presidential elections in 1987. In 1996 Chun and his successor Roh Tae-woo were convicted of military rebellion and treason for the coup and the killings in Gwangju; Chun’s death sentence was commuted, and both were pardoned in 1997. Since 1997, 18 May has been a national day of remembrance, and investigations in 2018 confirmed that troops had fired from helicopters and had committed sexual violence.
