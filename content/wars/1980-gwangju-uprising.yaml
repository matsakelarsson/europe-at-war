id: gwangju-uprising
name: Gwangju uprising
start: "1980-05-18"
end: "1980-05-27"
tier: B
summary: "A popular uprising in the city of Gwangju in South Korea in May 1980 against the military rule of General Chun Doo-hwan, put down by the army; in South Korea it is called the May 18 Democratization Movement. After President Park Chung-hee was assassinated in October 1979, Chun seized control of the army in a coup on 12 December, and on 17 May 1980 he extended martial law to the whole country, closed the universities and arrested opposition leaders, among them Kim Dae-jung, who came from the region. When students in Gwangju protested on 18 May, special forces paratroopers beat and bayoneted protesters and bystanders, and the city rose. On 21 May troops fired on a crowd in front of the provincial office; citizens took weapons from police stations and reservist armouries and drove the army out of the city, which was then sealed off and run for five days by citizens’ committees. In the early hours of 27 May troops retook the provincial office. The government counted 165 civilians killed and 76 missing, with 22 soldiers and 4 police officers dead; other estimates of the dead range from about 600 to 2,000. The killings shaped the democracy movement that ended military rule in 1987, and Chun was convicted for them in 1996."
