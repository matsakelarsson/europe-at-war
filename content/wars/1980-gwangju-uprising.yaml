notes:
  - The number of dead is still disputed. The official count, based on the families’ association and later government investigations, is 165 civilians killed and 76 missing between 18 and 27 May, besides 22 soldiers (13 of them killed by other soldiers at Songam-dong) and 4 police officers; recorded deaths in the city in May 1980 were about 2,300 above the average, and estimates of the dead range from about 600 to 2,000.
  - The American role is debated. The South Korean troops were under the combined command, and the US commander allowed units of the 20th Division to be moved to Gwangju; many Koreans saw this as approval of the crackdown, which the United States has always denied.
