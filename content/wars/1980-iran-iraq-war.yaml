id: iran-iraq-war
name: Iran–Iraq War
start: "1980-09-22"
end: "1988-08-20"
tier: A
summary: The war between Iraq under Saddam Hussein and the Islamic Republic of Iran, which Iraq began on 22 September 1980 by invading the Iranian oil province of Khuzestan, hoping to win the Shatt al-Arab waterway and to strike at the new revolutionary government before it could stir up Iraq’s Shia majority. Iran drove the invaders back by 1982 and then fought for six years on Iraqi soil, using waves of young volunteers against Iraqi defences, while Iraq used chemical weapons, attacked Iran’s cities and oil exports and, at home, killed tens of thousands of Kurds in the Anfal campaign. The war spread to Gulf shipping and drew in the US Navy. Iran accepted the UN’s ceasefire resolution in July 1988, after a last series of Iraqi victories, and the fighting stopped on 20 August 1988 with the borders unchanged. Estimates of the dead range from about 300,000 to well over half a million, most of them Iranian.
countries: [ir, iq]
