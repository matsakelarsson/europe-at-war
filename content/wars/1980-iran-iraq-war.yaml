        text: Taken in a surprise night crossing of the Shatt al-Arab. Iran held the peninsula for two years.
        lonlat: [48.47, 29.98]
      - kind: battle
        side: iq
        name: Karbala-5
        date: January – February 1987
        text: Iran’s offensive against the lines around Fish Lake, east of Basra. The Iraqis lost ground but kept the city.
        lonlat: [47.95, 30.55]
      - kind: held
