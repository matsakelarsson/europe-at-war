  - title: The Tanker War and the War of the Cities
    date: 1984–1988
    when: "1984-03"
    borders: "1987-07-22"
    countries: [ir, iq, kw, sa, us]
    body:
      - With the land war deadlocked, Iraq turned on Iran’s oil exports. From 1984 Iraqi aircraft with French-made Exocet missiles attacked the terminal at Kharg Island and the tankers that called there, and Iran struck back at ships trading with Kuwait and Saudi Arabia, Iraq’s financial backers. More than 400 merchant ships were hit during the war, and several hundred seamen were killed. In 1987 Kuwait asked the great powers for protection; the United States put eleven Kuwaiti tankers under its flag and escorted them through the Gulf from July. In May an Iraqi missile struck the US frigate Stark by mistake, killing 37 sailors.
      - Iran laid mines and attacked ships with speedboats. After the frigate Samuel B. Roberts was badly damaged by a mine, the US Navy destroyed two Iranian oil platforms and sank or crippled several Iranian warships on 18 April 1988 in Operation Praying Mantis. On 3 July 1988 the cruiser Vincennes, in a clash with Iranian gunboats, shot down Iran Air Flight 655, an Airbus on a scheduled flight from Bandar Abbas to Dubai, killing all 290 people on board. The United States later expressed regret and paid compensation to the victims’ families, without admitting legal liability.
      - Both sides also attacked each other’s cities, with aircraft, artillery and missiles, in several “wars of the cities” in 1984–1988. In the worst, from February to April 1988, Iraq fired some 190 extended-range Scud missiles at Tehran, Qom, Isfahan and other cities, killing about 2,000 people and driving perhaps a quarter of Tehran’s population to flee. Iran fired fewer missiles at Baghdad.
    facts:
      - [Ships attacked, "more than 400, 1981–1988"]
      - [Operation Praying Mantis, "18 April 1988"]
      - [Iran Air Flight 655, "3 July 1988, 290 killed"]
    markers:
      - kind: event
        side: iq
        name: Kharg Island
        date: 1984–1988
        text: Iran’s main oil terminal, bombed again and again by Iraqi aircraft.
        lonlat: [50.32, 29.25]
      - kind: event
        side: iq
        name: Tehran
        date: February – April 1988
        text: The target of most Iraqi missiles in the last war of the cities. Many residents left the capital for the countryside.
        lonlat: [51.39, 35.69]
      - kind: naval
        side: us
        name: Operation Praying Mantis
        date: 18 April 1988
        text: The largest US naval battle since 1945. US ships and aircraft destroyed the Sassan and Sirri platforms and sank an Iranian frigate and several smaller craft.
        lonlat: [54.54, 25.91]
        lp: l
      - kind: event
        side: us
        name: Iran Air Flight 655
        date: 3 July 1988
        text: Shot down over the Strait of Hormuz by the USS Vincennes, which mistook the airliner for an attacking fighter. All 290 on board were killed, 66 of them children.
        lonlat: [56.04, 26.67]
      - kind: event
        side: ir
        name: Kuwait
        date: 1986–1988
        text: Iran attacked tankers bound for Kuwait and fired missiles at its oil installations; the reflagging of Kuwaiti tankers brought the US Navy into the Gulf.
        lonlat: [47.98, 29.37]
        lp: l
  - title: Faw and the battles for Basra
    date: 1986–1987
    when: "1986-02-09"
    borders: "1987-02-26"
    countries: [ir, iq]
    body:
      - On the night of 9–10 February 1986, in Operation Wal Fajr 8, Iranian frogmen and infantry crossed the Shatt al-Arab in heavy rain and seized the Faw peninsula, cutting Iraq off from the Gulf and bringing Iranian forces close to Kuwait. Iraqi counter-attacks, with heavy use of chemical weapons, failed to retake it. In May Iraq took the Iranian border town of Mehran, but lost it again in July.
      - In January 1987 Iran launched Operation Karbala-5, its largest offensive, against the defences east of Basra around the artificial Fish Lake. In seven weeks of fighting Iranian troops came within about 15 kilometres of the city, and the battle became one of the bloodiest of the war, with estimates of the dead on both sides running to several tens of thousands. Iraq held, and Karbala-5 was Iran’s last great attempt to break through in the south. Its manpower was exhausted, volunteers were harder to find, and its economy was strained by low oil prices.
    facts:
      - [Faw taken by Iran, "9–11 February 1986"]
      - [Operation Karbala-5, "9 January – 26 February 1987"]
    markers:
