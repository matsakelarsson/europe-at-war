  - title: Iran invades Iraq
    date: July 1982 – March 1984
    when: "1982-07-13"
    borders: "1984-03-01"
    countries: [ir, iq]
    body:
      - On 13 July 1982 Iran launched Operation Ramadan towards Basra, Iraq’s second city. Waves of Revolutionary Guards and Basij volunteers, some of them teenagers, attacked across open ground into Iraqi minefields and artillery fire. Fighting on their own soil, Iraqi soldiers held, and the offensive was called off after heavy losses. Iraq built deep belts of earthworks, flooded ground and fortified lines around Basra, and Iran tried again and again to break them in the Wal Fajr (“Dawn”) offensives of 1983 along the whole front.
      - Iraq began to use chemical weapons, first tear gas and from 1983 mustard gas, against Iranian attacks in the Kurdish mountains at Haj Omran and Penjwen and then in the south. In February 1984, in Operation Kheibar, Iranian troops crossed the Hawizeh marshes in boats and took the Majnoon islands with their oil fields; Iraqi counter-attacks, using mustard gas and, for the first time in war, the nerve agent tabun, could not dislodge them. In March 1984 a UN team confirmed that chemical weapons had been used against Iranian troops.
    facts:
      - [Operation Ramadan, "13 July – 3 August 1982, Iraqi defensive victory"]
      - [Operation Kheibar, "February – March 1984, Majnoon islands taken by Iran"]
      - [Chemical weapons, "confirmed by a UN team in March 1984"]
    markers:
