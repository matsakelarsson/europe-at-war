steps:
  - title: The invasion of Khuzestan
    date: September – November 1980
    when: "1980-09-22"
    borders: "1980-11-10"
    countries: [ir, iq]
    body:
      - The two neighbours had long quarrelled over the Shatt al-Arab, the river below Basra that forms their border, and in the Algiers Agreement of 1975 Iraq had accepted a border down the middle of the river, giving up its claim to the whole waterway, in return for an end to Iranian support for Kurdish rebels. After the revolution of 1979 the new Islamic Republic called on Iraq’s Shia to rise against Saddam Hussein’s secular Ba’athist government, and border clashes and assassinations followed. Saddam, believing that purges and chaos had crippled the Iranian army, tore up the Algiers Agreement on 17 September 1980.
      - On 22 September Iraqi aircraft struck ten Iranian airfields, and the next day six Iraqi divisions crossed the border on a front of some 650 kilometres. The main thrust went into Khuzestan, whose oil fields and Arabic-speaking population Iraq hoped to win. Iraqi columns surrounded Susangerd, shelled Dezful and Ahvaz and reached the Karun river, while further north they took Qasr-e Shirin and Mehran to shield Baghdad. Iran answered with air raids on Iraqi bases and oil plants.
      - Iraq had expected a short war. Instead, Revolutionary Guards, army units and local volunteers fought for Khorramshahr street by street for more than a month before it fell on 24–26 October; Iranians came to call it Khunin-shahr, the “city of blood”. Iraqi forces then cut off Abadan, with its great refinery, on three sides, but could not take it. By December the invasion had stalled, and the front settled into trenches through the winter rains.
    facts:
      - [Iraqi invasion, "22–23 September 1980"]
      - [Khorramshahr falls, "24–26 October 1980"]
      - [Siege of Abadan, "November 1980 – September 1981"]
