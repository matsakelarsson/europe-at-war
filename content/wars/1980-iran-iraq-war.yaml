  - title: Iran drives Iraq out
    date: September 1981 – June 1982
    when: "1981-09-27"
    borders: "1982-05-24"
    countries: [ir, iq]
    body:
      - A first Iranian counter-offensive near Hoveyzeh in January 1981, led by President Abolhassan Bani-Sadr, ended in a costly defeat, and in June the clergy-dominated parliament removed him. The Revolutionary Guards and the regular army then learned to fight together, combining night attacks by masses of infantry, many of them Basij volunteers, with the army’s armour and artillery. In September 1981 they broke the siege of Abadan, and at the end of November they retook Bostan.
      - In March 1982, in Operation Fath ol-Mobin (“Undeniable Victory”), Iranian forces routed several Iraqi divisions west of Dezful and Shush. In Operation Beit ol-Moqaddas they crossed the Karun and, on 24 May 1982, retook Khorramshahr, capturing about 19,000 Iraqi soldiers. Saddam announced in June that his troops would withdraw to the border, and offered a ceasefire.
      - Iran’s leaders refused. They demanded Saddam’s removal and reparations, and Ayatollah Khomeini decided to carry the war into Iraq. Israel’s bombing of the Osirak nuclear reactor near Baghdad in June 1981, after an earlier Iranian raid on it, had already shown how far the conflict could reach.
    facts:
      - [Siege of Abadan broken, "27–29 September 1981"]
      - [Operation Fath ol-Mobin, "22–30 March 1982"]
      - [Khorramshahr retaken, "24 May 1982"]
    markers:
