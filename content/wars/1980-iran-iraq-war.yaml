notes:
  - Casualty figures are uncertain and disputed. Britannica puts the dead at perhaps 500,000; other estimates run from about 300,000 to over a million. Iran’s official figures put its own dead at about 200,000, and Iraqi deaths are usually estimated at 100,000 to 200,000 or more. Hundreds of thousands more were wounded, and tens of thousands were held as prisoners, some until 2003.
  - Iraq dates the war from 4 September 1980, when it says Iranian artillery shelled Iraqi border towns; most accounts date it from the Iraqi air strikes and invasion of 22 September. Iraq had abrogated the 1975 Algiers Agreement on 17 September.
  - Iranian operation names (Fath ol-Mobin, Beit ol-Moqaddas, Wal Fajr, Karbala) and Iraqi ones (Ramadan Mubarak, Tawakalna ala Allah) are given as they appear in the sources. Front lines are approximate.
  - Both Iraq and, to a much smaller extent, Iran received weapons and money from many foreign governments; the United States, the Soviet Union, France and the Gulf monarchies backed Iraq in different ways, and Iran bought arms from China, North Korea, Libya, Syria and, secretly, from Israel and the United States (the Iran–Contra affair).
