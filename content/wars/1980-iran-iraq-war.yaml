  - title: The ceasefire
    date: July – August 1988
    when: "1988-07-25"
    borders: "1988-08-20"
    countries: [ir, iq]
    body:
      - Days after Iran accepted the ceasefire, on 25–26 July 1988, the National Liberation Army of the People’s Mojahedin (MEK), an Iranian opposition group armed and based in Iraq, invaded western Iran in Operation “Eternal Light”, hoping to set off an uprising. Its columns took Kerend and Islamabad-e Gharb but were stopped and destroyed by Iranian forces, in what Iran calls Operation Mersad, near the Chahar Zebar pass on the road to Kermanshah. In the weeks that followed the Iranian authorities executed thousands of political prisoners, MEK members and leftists, after brief hearings; estimates range from about 2,800 to more than 5,000, and some are much higher.
      - The ceasefire came into force on 20 August 1988, watched by a UN observer mission. Neither side had gained territory, and the 1975 border along the middle of the Shatt al-Arab was restored when Saddam, about to fight a new war over Kuwait, accepted it in August 1990. The last prisoners of war were exchanged only in 2003. The war left both countries deeply in debt, killed hundreds of thousands of people and wounded many more, among them tens of thousands of Iranians who still suffer from the effects of chemical weapons.
    facts:
      - [Operation Mersad, "26–29 July 1988"]
      - [Ceasefire, "20 August 1988"]
      - [Dead, "about 300,000 to over 500,000 by most estimates; some estimates higher"]
