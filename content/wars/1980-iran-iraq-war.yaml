  - title: Anfal and Halabja
    date: 1987–1988
    when: "1988-02-23"
    borders: "1988-09-06"
    countries: [iq, ir]
    body:
      - In the mountains of Iraqi Kurdistan the Kurdistan Democratic Party (KDP) and the Patriotic Union of Kurdistan (PUK) fought alongside Iran, and by 1987 they held much of the countryside. In March 1987 Saddam gave his cousin Ali Hassan al-Majid full powers over the north. Iraqi forces razed villages and drove their people into camps, and in the Anfal campaign of February to September 1988 they attacked the Kurdish rural areas in eight stages, using chemical weapons on dozens of villages. Men and boys were taken away and shot in mass graves in the south and west of Iraq.
      - In March 1988 Iranian troops and PUK fighters took the town of Halabja near the border. On 16 March Iraqi aircraft bombed it with mustard gas and nerve agents, killing between 3,200 and 5,000 people, most of them civilians, in the largest chemical attack on a civilian population in history. Human Rights Watch, using Iraqi government documents, estimated that 50,000 to 100,000 people were killed in the Anfal campaign; Kurdish sources give up to 182,000. Some 2,000 villages were destroyed in the campaign itself, and thousands more in the years before. The Iraqi High Tribunal in 2007, and earlier a Dutch court, called Anfal a genocide; al-Majid was hanged in 2010.
    facts:
      - [Anfal campaign, "23 February – 6 September 1988"]
      - [Halabja chemical attack, "16 March 1988, 3,200–5,000 killed"]
      - [Killed in Anfal, "50,000–100,000 (Human Rights Watch), up to 182,000 (Kurdish estimates)"]
    markers:
      - kind: event
        side: iq
        name: Halabja
        date: 16 March 1988
        text: Bombed with chemical weapons two days after Iranian and PUK forces took the town. Thousands died in the streets and houses; many survivors suffered lifelong illness.
        lonlat: [45.99, 35.18]
      - kind: event
        side: iq
        name: Sardasht
        date: 28 June 1987
        text: An Iranian Kurdish town bombed by Iraq with mustard gas; about 110 civilians were killed and thousands injured.
        lonlat: [45.48, 36.15]
      - kind: event
        side: iq
        name: Kirkuk
        date: 1987–1988
        text: Al-Majid ran the campaign from the Ba’ath party’s Northern Bureau here.
        lonlat: [44.39, 35.47]
        lp: l
      - kind: event
        side: iq
        name: Badinan
        date: August 1988
        text: The last stage of Anfal, after the ceasefire with Iran, struck the KDP’s heartland near the Turkish border with chemical attacks; tens of thousands of Kurds fled into Turkey.
        lonlat: [43.6, 37.1]
    arrows:
      - side: ir
        via: [[46.2, 35.3], [46.1, 35.25], [46.0, 35.2]]
    areas:
      - style: contested
        side: kurds
        label: Main areas of the Anfal campaign, 1988
        polygon: [[42.7, 37.2], [43.5, 37.3], [44.4, 37.15], [44.9, 36.75], [45.4, 36.2], [45.9, 35.8], [46.1, 35.15], [45.6, 34.8], [45.05, 35.05], [44.7, 35.6], [43.9, 36.1], [43.2, 36.6], [42.75, 36.85]]
  - title: Iraq’s last offensives
    date: April – July 1988
    when: "1988-04-17"
    borders: "1988-07-18"
    countries: [iq, ir]
    body:
      - On 17 April 1988, the first day of Ramadan, Iraqi forces stormed the Faw peninsula in Operation Ramadan Mubarak and retook it in about 36 hours, using large amounts of nerve gas. A series of Iraqi offensives followed, each prepared for months and supported by chemical weapons and by the Republican Guard. In May Iraq retook the ground around Fish Lake and Shalamcheh east of Basra, in June the Majnoon islands, and in July its forces drove deep into Iran near Dehloran and Mehran, taking tens of thousands of prisoners and large amounts of equipment before pulling back.
      - The defeats, the missile attacks on Tehran, the shooting down of the Iran Air airliner and fear of Iraqi chemical attacks on Iranian cities broke the will of Iran’s leaders. Akbar Hashemi Rafsanjani, the new acting commander-in-chief, argued that the war could not be won. On 18 July 1988 Iran accepted UN Security Council Resolution 598, passed a year earlier, and on 20 July Khomeini told the nation that agreeing to the ceasefire was “more deadly than drinking poison”.
    facts:
      - [Faw retaken by Iraq, "17–18 April 1988"]
      - [Majnoon islands retaken, "25 June 1988"]
      - [Iran accepts Resolution 598, "18 July 1988"]
    markers:
      - kind: taken
        side: iq
        name: Faw
        date: 17–18 April 1988
        text: Retaken in a day and a half in a carefully rehearsed attack with heavy use of chemical weapons.
        lonlat: [48.47, 29.98]
      - kind: battle
