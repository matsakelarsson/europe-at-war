id: maitatsine-uprising
name: Maitatsine uprisings
start: "1980-12"
end: "1985-04"
tier: C
summary: "A series of violent clashes in northern Nigeria between the followers of the preacher Muhammad Marwa, known as Maitatsine (Hausa for “the one who damns”), and the security forces. Marwa, who came from Marwa (Maroua) in northern Cameroon, had preached in Kano since the 1940s against the use of radios, watches, bicycles and cars and against wealth, rejected much of the Islamic tradition and denounced the established religious and political authorities; he was deported by the colonial government, returned after independence and gathered a following, the ’Yan Tatsine, mostly among poor young migrants and Qur’anic students. In December 1980 attacks by his followers on other Muslims and on the police in Kano led to fighting that the police could not contain; the army crushed the uprising, and Marwa died, of his wounds or of a heart attack. The official toll was 4,177 civilians and about 135 police and soldiers killed; other estimates are around 5,000. Survivors carried the movement to other towns: riots in Bulumkutu near Maiduguri and in Kaduna in October 1982 killed over 3,000 people; in Yola and Jimeta in February–March 1984, under Marwa’s successor Musa Makaniki, about 1,000 died and half the town was left homeless; and in Gombe in April 1985 several hundred more were killed. Makaniki fled to Cameroon and was arrested in Nigeria in 2004. Some analysts see the uprisings as a forerunner of Boko Haram."
