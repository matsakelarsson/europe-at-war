id: gambian-coup-attempt-1981
name: Gambian coup attempt and Senegalese intervention (1981)
start: "1981-07-30"
end: "1981-08-05"
tier: C
summary: "An attempt to overthrow President Dawda Jawara of the Gambia, crushed by Senegalese troops. On 30 July 1981, while Jawara was in London for the wedding of Prince Charles and Lady Diana Spencer, Kukoi Samba Sanyang, a left-wing former politician, and members of the paramilitary Field Force seized the Field Force depot at Bakau, the radio station and key points in Banjul, proclaimed a National Revolutionary Council and released and armed prisoners; members of Jawara’s family were among the hostages they took. Jawara flew to Dakar and invoked a defence agreement with Senegal, whose troops entered the Gambia from 31 July in an operation the Senegalese named Fodé Kaba II and, after several days of fighting in and around Banjul and Serrekunda, retook the country by 5 August; a small team of British SAS soldiers helped free the hostages. Estimates of the dead range from about 500 to over 1,000, many of them civilians killed in the fighting and in looting. Kukoi escaped abroad. The coup led to the Senegambia Confederation, agreed on 12 December 1981 and in force from 1 February 1982, which joined the two countries’ armed forces and foreign policy but was dissolved in 1989; Senegalese troops guarded Jawara’s government for much of the 1980s."
