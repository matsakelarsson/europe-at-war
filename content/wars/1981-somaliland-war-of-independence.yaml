id: somaliland-war-of-independence
name: Somaliland War of Independence
start: "1981-04-06"
end: "1991-05-18"
tier: B
summary: "The war of the Somali National Movement (SNM), drawn mainly from the Isaaq clans of north-western Somalia, against the government of Mohamed Siad Barre. Founded in London in 1981, the SNM fought from bases in Ethiopia until a peace deal between Siad Barre and Mengistu Haile Mariam in April 1988 forced it out. In May 1988 it attacked Burao and Hargeisa. The government answered by shelling and bombing the cities, which were largely destroyed, and by killing Isaaq civilians across the north; estimates of the dead range from 50,000 to 100,000, with some as high as 200,000, and up to half a million people fled to Ethiopia. A UN investigation in 2001 concluded that genocide had been committed against the Isaaq. The SNM fought on in the countryside, and when Siad Barre fell in January 1991 it took control of the north. On 18 May 1991 a conference of the northern clans at Burao declared the former British Somaliland independent as the Republic of Somaliland. Somalia regards it as part of its territory; Israel, in December 2025, was the first UN member state to recognise it."
countries: [so, et]
sides:
  - id: snm
    name: Somali National Movement (SNM)
    polities: [snm]
    ink: green
    moves: SNM moves
