steps:
  - title: The SNM and the north
    date: 1981–1987
    when: "1981-04-06"
    borders: "1984-01-01"
    countries: [so, et]
    body:
      - "After the Ogaden War, many in the north-west of Somalia, the former British Somaliland, felt shut out of power by Siad Barre’s government, which favoured clans allied to his own Marehan. The Isaaq, the largest clan family of the north, resented the arming of refugees from the Ogaden settled on their grazing lands, the confiscation of businesses, and the arrests and executions of officials, teachers and doctors in Hargeisa. On 6 April 1981 Isaaq exiles, businessmen, students and former officials founded the Somali National Movement in London."
      - "From 1982 the SNM gathered fighters, many of them Isaaq officers and soldiers who had deserted, in camps in Ethiopia, which backed it as Somalia backed the WSLF. Its guerrillas raided army posts and convoys in the north; in January 1983 a raid on Mandera prison near Berbera freed political prisoners. The government replied with collective punishment: curfews, the burning of villages and the poisoning of wells, the requisitioning of trucks and the mining of grazing lands. In January 1986 General Mohammed Said Hersi Morgan, Siad Barre’s son-in-law and later military governor of the north, sent the president a report, known in Somaliland as the “Letter of Death”, proposing a scorched-earth policy against the Isaaq."
    facts:
      - [SNM founded, "6 April 1981, in London"]
      - [Morgan report, "January 1986"]
