notes:
  - "The killings of 1987–1989 are called the Isaaq genocide, or the Hargeisa Holocaust, in Somaliland and by several genocide scholars; a UN investigation led by Chris Mburu reached that conclusion in 2001. The Somali state at the time called its campaign a counterinsurgency. Death tolls are uncertain: most estimates range from 50,000 to 100,000 civilians, a few as high as 200,000."
  - "Somaliland’s status is contested. It has governed itself since 1991 with its own elections, army and currency, and bases its claim on the borders of British Somaliland, which was briefly independent in June 1960 before it joined Somalia. Somalia and the African Union regard it as part of Somalia; Israel recognised it on 26 December 2025, the only UN member state to have done so by late 2026."
