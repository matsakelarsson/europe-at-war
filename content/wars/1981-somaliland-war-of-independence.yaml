  - title: Victory and the declaration of Somaliland
    date: 1990 – 18 May 1991
    when: "1991-05-18"
    borders: "1991-05-18"
    countries: [so]
    body:
      - "By 1990 Siad Barre faced rebels across the country: the SNM in the north-west, the Somali Salvation Democratic Front in the north-east, the Somali Patriotic Movement in the south and the United Somali Congress around Mogadishu. When the USC drove him from the capital in January 1991, the army in the north collapsed, and the SNM took Hargeisa, Berbera, Burao and the rest of the north-west."
      - "From 27 April to 18 May 1991 the SNM and the elders of the northern clans, including the Gadabuursi, Issa, Dhulbahante and Warsangeli, who had been divided in the war, met at Burao in the Grand Conference of the Northern Clans. Under pressure from SNM fighters and the public, the conference on 18 May 1991 declared the restoration of the independence that British Somaliland had held for five days in June 1960, as the Republic of Somaliland, with the SNM chairman Abdirahman Ahmed Ali Tuur as its first president."
      - "Somaliland has since governed itself, with peace conferences at Borama in 1993 and elsewhere, a constitution approved in 2001 and several peaceful changes of government. Somalia regards it as part of its territory, and its eastern regions of Sool and Sanaag are disputed with Puntland and with local movements. Israel recognised Somaliland on 26 December 2025, the first UN member state to do so."
    facts:
      - [Siad Barre leaves Mogadishu, "26 January 1991"]
      - [Grand Conference of the Northern Clans, "27 April – 18 May 1991, Burao"]
      - [Independence declared, "18 May 1991"]
