  - title: Hargeisa and Burao
    date: May 1988 – 1989
    when: "1988-05-31"
    borders: "1988-06-15"
    countries: [so, et]
    body:
      - "In April 1988 Siad Barre and Mengistu Haile Mariam, each weakened by rebels the other supported, agreed to end their support for them, and the SNM had to leave its bases in Ethiopia. Instead of disbanding, it struck. On 27 May 1988 its fighters entered Burao, and on 31 May they attacked Hargeisa, taking much of both cities and the army barracks around them."
      - "The government’s response fell on the Isaaq population. Artillery shelled Hargeisa and Burao, and aircraft flying from Hargeisa’s own airport bombed the cities and the columns of people fleeing them. Estimates of the destruction of Hargeisa run from 70 to 90 per cent, and Burao was largely flattened. Soldiers and allied militias killed Isaaq civilians in the towns and the countryside, in Berbera, Erigavo and elsewhere, and mass graves were still being found decades later. Most estimates of the civilians killed in 1987–1989 range from 50,000 to 100,000. Up to 500,000 people fled across the border to camps in Ethiopia such as Hartisheikh, then one of the largest refugee camps in the world, and some 400,000 more were displaced."
      - "The SNM withdrew from the cities but held much of the countryside. Reports by Africa Watch, Amnesty International and the United States government brought the killings to the world’s attention, and in 1989 the United States and other donors suspended aid to Somalia."
