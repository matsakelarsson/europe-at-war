  - title: The Okello coup and the NRA victory
    date: July 1985 – March 1986
    when: "1986-01-26"
    borders: "1986-01-26"
    countries: [ug]
    body:
      - "In July 1985 Acholi troops led by Brigadier Bazilio Olara-Okello marched from the north, took Lira and entered Kampala; Obote fled to Tanzania and General Tito Okello became head of state. Okello brought several rebel groups, including FEDEMU and FUNA, into his government, and the UNLA dissolved into marauding bands. The NRA joined peace talks in Nairobi, chaired by Kenya’s President Daniel arap Moi, but kept fighting: from August 1985 it besieged and took the garrisons of Masaka and Mbarara and held most of the west and south-west. The Nairobi agreement signed on 17 December 1985 never took effect."
      - "In January 1986 the NRA advanced on Kampala, by then grown to about 10,000 fighters, many of them recruited in the territory it had taken, among them child soldiers. It took the capital on 26 January 1986, and Museveni was sworn in as president on 29 January. The NRA pushed east and north, taking Jinja and Tororo and, in March 1986, Gulu and Kitgum, where Olara-Okello’s holdouts dispersed; the Okellos and Obote went into exile. Estimates of the deaths in the war range from about 100,000 to 500,000. The defeat of the northern army left the Acholi region disarmed and resentful, and within months new insurgencies began there, among them Alice Lakwena’s Holy Spirit Movement and later Joseph Kony’s Lord’s Resistance Army."
    facts:
