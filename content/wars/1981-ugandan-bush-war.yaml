notes:
  - "The war is also called the Luwero War or, in Uganda, the Resistance War or the NRM revolution. The numbers of dead in the Luwero Triangle are disputed and have been the subject of political argument in Uganda since; the government of Obote denied the massacres, while NRA abuses, including the recruitment of child soldiers, received less attention."
