id: ugandan-bush-war
name: Ugandan Bush War
start: "1980-10-06"
end: "1986-03"
tier: B
summary: "The civil war in Uganda between the governments of Milton Obote and, from July 1985, Tito Okello, with their Uganda National Liberation Army (UNLA), and several rebel groups, above all Yoweri Museveni’s National Resistance Army (NRA), which won it in January 1986. After Tanzania and Ugandan exiles overthrew Idi Amin in 1979, Obote returned to power in disputed elections in December 1980. Former Amin soldiers had already risen in West Nile in October 1980, and the UNLA’s reprisals there drove some 250,000 people into exile. Museveni, who said the elections had been rigged, began a guerrilla war on 6 February 1981 with an attack on Kabamba barracks; his Popular Resistance Army merged with Yusuf Lule’s fighters into the National Resistance Movement and its army, with its base in the Luwero Triangle north of Kampala. The UNLA, advised by North Korean officers, fought the NRA there with massacres, looting and the forced removal of hundreds of thousands of civilians into camps, notably in Operation Bonanza from June 1983. After Acholi officers under Bazilio Olara-Okello and Tito Okello overthrew Obote in July 1985, the NRA refused a power-sharing deal signed in Nairobi in December, took Masaka and Mbarara and entered Kampala on 26 January 1986; Museveni was sworn in as president on 29 January, and the NRA took the north in March. Estimates of the dead range from about 100,000 to 500,000, most of them civilians; the International Committee of the Red Cross estimated in 1985 that the Obote government was responsible for more than 300,000 civilian deaths since 1980. The NRA also committed abuses and used child soldiers, the kadogo. The defeated northern soldiers formed new rebel groups, among them those that led to the Lord’s Resistance Army."
