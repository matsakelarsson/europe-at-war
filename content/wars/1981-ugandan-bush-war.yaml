steps:
  - title: West Nile and the first attacks
    date: October 1980 – 1982
    when: "1981-02-06"
    borders: "1981-02-06"
    countries: [ug]
    body:
      - "After Tanzanian troops and Ugandan exiles took Kampala in April 1979, the Uganda National Liberation Front (UNLF) went through three presidents in a year, and in December 1980 Milton Obote’s Uganda People’s Congress won elections that the Democratic Party and Museveni’s Uganda Patriotic Movement called rigged. Even before the vote, on 6 October 1980, some 500 former soldiers of Idi Amin crossed from Sudan and Zaire and attacked Koboko in West Nile, Amin’s home region. The UNLA drove them back, levelled the town of Arua and killed more than 1,000 civilians, and over 250,000 people fled to Sudan and Zaire. The West Nile rebels later split into the Uganda National Rescue Front (UNRF) of Moses Ali and the Former Uganda National Army (FUNA)."
      - "On 6 February 1981 Museveni and a few dozen men of his Popular Resistance Army attacked the army barracks at Kabamba in Mubende district; the raid failed to seize the armoury, but the fighters escaped into the bush and began a guerrilla war, recruiting among the Baganda of the countryside north and west of Kampala. In June 1981 they joined Yusuf Lule’s Uganda Freedom Fighters to form the National Resistance Movement, with Lule as chairman and Museveni as commander of its army, the NRA. Andrew Kayiira’s Uganda Freedom Movement, which raided Kampala in February 1982, was another opponent. Several of the NRA’s early fighters, among them Fred Rwigyema and Paul Kagame, were Rwandan Tutsi refugees."
