  - title: The Luwero Triangle
    date: 1982 – mid-1985
    when: "1983-06-16"
    borders: "1983-06-16"
    countries: [ug]
    body:
      - "The NRA made the Luwero Triangle, the farmland of Buganda bounded by the roads from Kampala to Hoima and Gulu, its main area of operations, while recruiting in Ankole in the west as well. It lived among the population, set up village resistance councils and attacked army posts and convoys. The UNLA, many of its soldiers from the Acholi and Langi of the north, treated the people of the triangle as rebel supporters. On 16 June 1983 it launched Operation Bonanza, using up to half its forces, which killed tens of thousands of people and drove hundreds of thousands from their homes into guarded camps."
      - "Obote’s chief of staff, David Oyite-Ojok, was killed in a helicopter crash in December 1983, and the army began to break up into rival factions. The NRA escaped encirclement at Birembo in January 1985 and in June 1985 defeated the UNLA at Kembogo and Rubona. The International Committee of the Red Cross estimated that by July 1985 the Obote government had been responsible for more than 300,000 civilian deaths across Uganda."
    facts:
