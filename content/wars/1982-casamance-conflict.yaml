notes:
  - "Figures are uncertain. About 5,000 deaths since 1982 is the estimate most often cited, with over a thousand battle deaths in 1992–2001; tens of thousands of people fled to the Gambia and Guinea-Bissau, and landmines laid during the war have killed and maimed hundreds. Senegalese soldiers and MFDC fighters were both accused of killing civilians, and the MFDC also of robbery and of trading cannabis and timber."
  - "Guinea-Bissau and the Gambia have been both refuges for the rebels and mediators. The MFDC’s links with Ansumane Mané, a Bissau-Guinean general accused of supplying it with weapons, helped set off the Guinea-Bissau Civil War of 1998–1999, in which Senegalese troops intervened."
