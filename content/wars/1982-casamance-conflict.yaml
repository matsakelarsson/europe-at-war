  - title: Offensives and peace agreements
    date: 2018 – November 2026
    when: "2022-03-13"
    borders: "2026-11-27"
    countries: [sn, gm, gw]
    body:
      - Last updated 27 November 2026. On 6 January 2018 gunmen killed 13 or 14 young men collecting wood in the Boffa-Bayotte forest near Ziguinchor; MFDC leaders denied responsibility. In January and February 2021 the army attacked and overran rebel bases near the border with Guinea-Bissau. In January 2022 fighters of Sadio’s faction attacked Senegalese soldiers of the ECOWAS mission in the Gambia, killing four and capturing seven, who were later released; on 13 March 2022 the army launched an offensive against Sadio’s bases along the Gambian border, and thousands of villagers fled into the Gambia.
      - "In August 2022 Badiate’s faction signed a peace agreement with the government in Bissau, and in May 2023 about 250 fighters of the commander Fatoma Coly laid down their arms. On 25 February 2025 Prime Minister Ousmane Sonko, of the government of President Bassirou Diomaye Faye, announced in Bissau an agreement with MFDC factions to end the conflict, after three days of talks mediated by Guinea-Bissau’s president, Umaro Sissoco Embaló; which factions it covered and its terms were not made fully public."
      - "In December 2025 President Faye, on a visit to the Ziguinchor region, appealed to the MFDC fighters still under arms to join the peace process. By 2026 the rebellion was much weakened, with ageing, residual forces divided into factions and cut off from supplies now that the Gambia and Guinea-Bissau cooperate with Dakar, and displaced people were returning to most of the region. But some armed groups still refused to give up their weapons, especially in the forests of northern Sindian near the Gambian border, where the army destroys cannabis fields that it says finance them: a soldier was killed and six wounded on 11 March 2026, and three soldiers died in an explosion during an anti-cannabis operation on 17 March. No comprehensive peace agreement has been signed, and how many fighters remain under arms is unclear."
    facts:
      - [Boffa-Bayotte killings, "6 January 2018"]
      - [Offensive against Sadio’s bases, "from 13 March 2022"]
      - [Badiate faction’s peace agreement, "August 2022"]
      - [Further agreement, "25 February 2025"]
