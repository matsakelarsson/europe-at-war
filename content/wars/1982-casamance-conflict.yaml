steps:
  - title: From Ziguinchor to the maquis
    date: 1982–1999
    when: "1982-12-26"
    borders: "1990-06-01"
    countries: [sn, gw]
    body:
      - On 26 December 1982 several hundred people marched in Ziguinchor, the main town of Casamance, to call for independence; police broke up the march and arrested many of the marchers. The movement’s leader, Father Augustin Diamacoune Senghor, a Catholic priest, argued that Casamance had been administered separately under French rule and should have become independent on its own. Another protest a year later ended in many deaths, and Diamacoune was sentenced to ten years in prison; he was released in 1991. The MFDC formed an armed wing, Atika (“warrior” in Jola), in 1985, and after mass protests were suppressed in 1990 it began a guerrilla war, attacking army posts and officials from the forests along the borders.
      - "The Senegalese army sent thousands of troops and was accused of arresting, torturing and killing suspected supporters. A ceasefire signed at Cacheu in Guinea-Bissau in May 1991 soon broke down, and in 1992 the movement split between a Northern Front that accepted talks and a Southern Front that fought on. A new ceasefire in 1993 was followed by more fighting; in 1995 the disappearance of four French tourists was blamed on the rebels, who denied it. The fighting was heaviest in the 1990s; in 1999 shelling reached Ziguinchor itself and some 20,000 people fled the border areas, before peace talks began at Banjul in December 1999."
    facts:
      - [March in Ziguinchor, "26 December 1982"]
      - [Armed wing Atika founded, "1985"]
      - [Ceasefire of Cacheu, "May 1991"]
