  - title: Accords and splinters
    date: 2000–2014
    when: "2004-12-30"
    borders: "2005-01-01"
    countries: [sn, gw, gm]
    body:
      - President Abdoulaye Wade, elected in 2000, promised a quick peace. On 30 December 2004 Diamacoune and the interior minister signed a general peace accord in Ziguinchor, but hardline commanders rejected it, and fighting broke out again in 2006. Diamacoune died in Paris on 13 January 2007, and the movement split into rival political wings and armed factions, the strongest led by Salif Sadio along the Gambian border north of the Casamance River and by César Atoute Badiate in the south near Guinea-Bissau.
      - "Attacks on soldiers and civilians continued at a low level, with the rebels and the army trading accusations. After Macky Sall became president in 2012, talks were held through the Community of Sant’Egidio in Rome, and on 1 May 2014 Sadio declared a unilateral ceasefire. Many of the displaced began to return, and the region was largely quiet for some years."
    facts:
      - [General peace accord, "30 December 2004, Ziguinchor"]
      - [Death of Diamacoune, "13 January 2007"]
      - [Sadio’s unilateral ceasefire, "1 May 2014"]
