id: falklands-war
name: Falklands War
start: "1982-04-02"
end: "1982-06-14"
tier: C
summary: A ten-week war between Argentina and the United Kingdom over the Falkland Islands and South Georgia in the South Atlantic, British territories that Argentina claims as the Malvinas. Argentina’s military government invaded the Falklands on 2 April 1982 and South Georgia the next day. Britain sent a naval task force, retook South Georgia on 25 April and declared an exclusion zone around the Falklands. On 2 May a British submarine sank the Argentine cruiser General Belgrano, with the loss of 323 lives, and Argentine aircraft went on to sink several British ships, among them the destroyer HMS Sheffield. British troops landed at San Carlos on 21 May, won at Goose Green and in the hills around Stanley, and the Argentine garrison surrendered on 14 June. In all 649 Argentine and 255 British servicemen and three islanders were killed. The defeat brought down the Argentine junta, and democracy returned to Argentina in 1983; Argentina still claims the islands.
