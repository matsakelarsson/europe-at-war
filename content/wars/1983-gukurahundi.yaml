id: gukurahundi
name: Gukurahundi
start: "1983-01"
end: "1987-12-22"
tier: C
summary: "The campaign of killings carried out by Zimbabwe’s government in Matabeleland and parts of the Midlands, mainly among the Ndebele-speaking supporters of Joshua Nkomo’s ZAPU. After independence in 1980 the rivalry between Robert Mugabe’s ZANU–PF and ZAPU and between their former armies broke out in clashes at Entumbane in Bulawayo in 1980–1981. In February 1982 the government announced the discovery of arms caches on ZAPU-owned properties, dismissed Nkomo from the cabinet and detained ZIPRA commanders; hundreds of former ZIPRA fighters deserted and took up arms as “dissidents”, whom Nkomo disowned, and who killed several hundred civilians in the following years. In January 1983 the government sent the Fifth Brigade, trained by North Korean instructors, answerable directly to the prime minister’s office and commanded by Perrance Shiri, into Matabeleland North, and later into Matabeleland South and the Midlands. Its soldiers killed villagers in public executions and mass shootings, as on the Cewale river in Lupane in March 1983, burned homesteads, and tortured detainees in camps such as Bhalagwe; in 1984, during a drought, the security forces blocked or tightly controlled food supplies into Matabeleland South, causing hunger. The name, Shona for “the early rain that washes away the chaff before the spring rains”, was the Fifth Brigade’s own. The Catholic Commission for Justice and Peace documented at least 2,000–2,750 deaths and thought the true number might be 8,000 or more; most later estimates are about 20,000, and some local estimates go higher. The killings ended when Mugabe and Nkomo signed the Unity Accord on 22 December 1987, merging ZAPU into ZANU–PF, followed by an amnesty in 1988. Mugabe later called the period “a moment of madness”; no one has been prosecuted, and many scholars and the International Association of Genocide Scholars describe it as genocide. In 2024 the government of Emmerson Mnangagwa, who was minister of state security at the time, began community hearings led by traditional chiefs, which critics say avoid accountability."
