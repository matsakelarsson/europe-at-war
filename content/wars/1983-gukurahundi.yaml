notes:
  - "Most of the victims were unarmed civilians with no part in the fighting. The government presented the operations as a counter-insurgency against dissidents backed by South Africa; South Africa did arm and train a small group of so-called Super-ZAPU dissidents. The term “dissidents” was the government’s; the armed men themselves were few, perhaps a few hundred at most."
