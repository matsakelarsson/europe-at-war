  - title: Militias, famine and Operation Lifeline
    date: 1985–1989
    when: "1988"
    borders: "1988-06-01"
    countries: [ss, sd, ke]
    body:
      - The elected government of Sadiq al-Mahdi (1986–1989) armed the Baggara cattle-herders of southern Darfur and Kordofan as militias, the murahaleen, and turned them loose on the Dinka of northern Bahr el Ghazal. They burned villages, stole cattle and carried off women and children, many of whom were held as slaves in the north. On 27–28 March 1987 at Ed Daein in southern Darfur more than 1,000 Dinka who had fled there were killed, many burned alive in railway wagons, as two Sudanese academics documented. The SPLA, for its part, shot down a Sudan Airways airliner leaving Malakal on 16 August 1986, killing all 60 aboard, and its forces also killed civilians and recruited children.
      - In 1988 raids, fighting and blockades on both sides, together with drought, brought famine to Bahr el Ghazal. Starving people walked north to the railway towns of southern Kordofan and Darfur, where many died in camps; about 250,000 people are estimated to have died that year. The scandal led in 1989 to Operation Lifeline Sudan, an agreement between the UN, the government and the SPLA to let food reach both sides, run largely from Lokichoggio in northern Kenya.
      - The SPLA meanwhile won control of much of the southern countryside. It took Kapoeta in 1988 and Torit in 1989, and its raid on Kurmuk in Blue Nile in November 1987 caused alarm in Khartoum. The government held the main towns of the south, Juba, Wau and Malakal, supplied by air and river.
    facts:
      - [Ed Daein massacre, "27–28 March 1987, more than 1,000 killed"]
      - [Famine in Bahr el Ghazal, "1988, about 250,000 dead"]
      - [Operation Lifeline Sudan, "from April 1989"]
