id: second-sudanese-civil-war
name: Second Sudanese Civil War
start: "1983-05-16"
end: "2005-01-09"
tier: A
summary: "One of the longest and deadliest wars of the late 20th century, fought between the government of Sudan and the Sudan People’s Liberation Movement and Army (SPLM/SPLA), mainly in the south but also in the Nuba Mountains, Blue Nile and the east. It began in May 1983 when southern soldiers mutinied at Bor; their officers, led by John Garang, founded the SPLA in Ethiopia with the support of the Derg. Gaafar Nimeiry had just divided the self-governing Southern Region and was about to impose Islamic law. Garang called not for southern independence but for a secular, democratic “New Sudan”. Successive governments, above all the Islamist regime of Omar al-Bashir and Hassan al-Turabi after 1989, fought with the army, Arab militias and a jihad, and used hunger as a weapon; militia raids carried off women and children as slaves. The SPLA lost its Ethiopian bases in 1991 and split along ethnic lines, and Nuer and Dinka factions killed each other’s civilians. Oil, exported from 1999, financed the government’s war and drove the clearing of the oil fields. Under pressure from the United States and the regional body IGAD, the two sides signed the Comprehensive Peace Agreement in Nairobi on 9 January 2005, which gave the south autonomy and a referendum on independence. About 2 million people died, most of them from famine and disease, and some 4 million were displaced."
countries: [sd, ss, et, ug, ke, er]
