  - title: Oil
    date: 1998–2002
    when: "1999-08-30"
    borders: "2000-06-01"
    countries: [ss, sd]
    body:
      - Oil had been found near Bentiu and at Heglig on the north–south border in the late 1970s and early 1980s, but the war had stopped Chevron from producing it. In the 1990s a consortium of the China National Petroleum Corporation, Malaysia’s Petronas, Canada’s Talisman Energy and the Sudanese state company developed the fields and built a 1,600 km pipeline from Heglig to the Red Sea near Port Sudan. The first oil was exported on 30 August 1999, and oil soon earned most of Sudan’s export income, paying for helicopter gunships and new weapons.
      - In Western Upper Nile (Unity State) the army and its southern allies, among them the forces of Paulino Matip, cleared the people from around the oil fields with attacks by helicopter gunships and Antonov bombers and the burning of villages, displacing hundreds of thousands, as human rights groups documented. The fight over the oil fields also set Nuer factions against each other. Talisman sold its share in 2003 after a campaign against its role.
      - The Khartoum Peace Agreement brought Machar little, and in January 2002 he returned to the SPLA. Meanwhile the attacks of 11 September 2001 drew American attention to Sudan, and the Bush administration, under pressure from evangelical groups concerned about the war and about slavery in the south, sent an envoy, John Danforth, to press for peace.
    facts:
      - [First oil exports, "30 August 1999"]
      - [Pipeline, "about 1,600 km from Heglig to the Red Sea"]
      - [Machar rejoins the SPLA, "January 2002"]
    markers:
      - kind: event
        side: sd
