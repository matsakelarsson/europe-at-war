  - title: Uganda, Eritrea and the Khartoum Peace Agreement
    date: 1993–1998
    when: "1997-04-21"
    borders: "1997-06-01"
    countries: [ss, sd, ug, er]
    body:
      - The war became regional. Sudan’s Islamist government backed rebels against Eritrea, Ethiopia and Uganda, including the Lord’s Resistance Army, and was accused of sheltering Osama bin Laden until 1996. In return Uganda, Eritrea and Ethiopia supported the SPLA, which joined the northern opposition parties in the National Democratic Alliance; by the Asmara Declaration of June 1995 they agreed on self-determination for the south and the separation of religion and state. In January 1997 the SPLA and NDA forces took Kurmuk and opened a front in Blue Nile and the east.
      - In March 1997, with Ugandan help, the SPLA launched Operation Thunderbolt in Equatoria and took Yei and much of western and central Equatoria; Rumbek fell to it the same year. Khartoum answered by buying off the SPLA’s rivals. On 21 April 1997 Riek Machar and other southern faction leaders signed the Khartoum Peace Agreement, which promised a referendum on self-determination; their forces became the South Sudan Defence Force, allied with the government, and Machar was made an assistant to the president.
      - In January 1998 Kerubino Kuanyin Bol, who had sided with Khartoum, changed sides again and attacked Wau. The fighting and the government’s ban on relief flights brought famine to Bahr el Ghazal in 1998, which killed an estimated 70,000 people before food reached them.
    facts:
      - [Asmara Declaration, "June 1995"]
      - [Operation Thunderbolt, "from March 1997"]
      - [Khartoum Peace Agreement, "21 April 1997"]
      - [Bahr el Ghazal famine, "1998, about 70,000 dead"]
