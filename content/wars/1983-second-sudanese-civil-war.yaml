steps:
  - title: Bor and the birth of the SPLA
    date: 1983–1985
    when: "1983-05-16"
    borders: "1983-07-31"
    countries: [ss, sd, et]
    body:
      - The Addis Ababa Agreement of 1972 had given the south self-government, but by the early 1980s it was failing. Oil had been found near Bentiu, and Khartoum planned to pipe it north and to redraw the border; the Jonglei Canal threatened the herders of the Sudd; and Nimeiry, now allied with the Muslim Brotherhood, moved to undo southern autonomy. When the army ordered southern units, many of them former Anyanya, to be transferred to the north, Battalion 105 at Bor under Major Kerubino Kuanyin Bol refused and on 16 May 1983 fought off the troops sent against it; units at Pibor, Pochalla and Ayod followed. Colonel John Garang de Mabior, a Dinka officer with a doctorate in agricultural economics from Iowa State University who had been sent to Bor to deal with the mutineers, joined them, and they went over the border into Ethiopia.
      - There, with arms and bases from Mengistu Haile Mariam’s government, they founded the Sudan People’s Liberation Movement and its army, the SPLA, whose manifesto of July 1983 called for a united, socialist “New Sudan” rather than southern secession. Garang won a bloody struggle for control with the separatist Anyanya II, whose leaders Samuel Gai Tut and Akuot Atem were killed. Tens of thousands of young recruits, many of them boys, walked to the training camps and refugee camps around Itang and Bonga in Ethiopia. In June 1983 Nimeiry split the Southern Region into three, and in September his “September Laws” imposed Islamic criminal law on the whole country.
      - Discontent in the north, worsened by drought and debt, brought Nimeiry down in a popular uprising and a military takeover on 6 April 1985. The SPLA refused to join the transitional government, and the war went on.
    facts:
      - [Bor mutiny, "16 May 1983"]
      - [Southern Region divided, "June 1983"]
      - [September Laws, "September 1983"]
      - [Nimeiry overthrown, "6 April 1985"]
