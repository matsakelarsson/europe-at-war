  - title: The split of 1991 and the Bor massacre
    date: 1991–1992
    when: "1991-11-15"
    borders: "1991-11-15"
    countries: [ss, sd, et]
    body:
      - "In May 1991 the Derg fell in Ethiopia, and the new government expelled the SPLA. Its bases and the refugee camps at Itang and elsewhere, home to some 200,000–400,000 southerners, were abandoned, and the refugees streamed back across the border. On 28 August 1991 three commanders at Nasir, Riek Machar, Lam Akol and Gordon Kong, announced that they had deposed Garang, accusing him of dictatorship and calling for southern independence. The split followed ethnic lines: Machar was a Nuer, Lam Akol a Shilluk, and Garang’s core a Dinka."
      - In November 1991 Machar’s forces and thousands of Nuer from the armed cattle-camp youth, the White Army, attacked the Dinka of Bor, Garang’s home area. Beginning on 15 November they killed an estimated 2,000 civilians, with some estimates far higher, burned villages and drove off hundreds of thousands of cattle; famine followed. Dinka and Nuer factions fought and raided one another for years, and the area between Ayod, Kongor and Waat became known as the “hunger triangle”.
      - The government took advantage. Its 1992 offensive, supplied with new arms from Iran and China, retook Bor, Pibor and Kapoeta and on 13 July 1992 captured the SPLA headquarters at Torit. SPLA attacks on Juba in June and July 1992 were beaten back, and hundreds of suspected collaborators were killed afterwards in the town, many at the Giyada barracks. In the Nuba Mountains, after religious leaders at El Obeid declared a jihad in 1992, the army and the PDF burned villages and moved tens of thousands of Nuba into “peace camps”.
    facts:
      - [Fall of the Derg, "May 1991"]
      - [Nasir Declaration, "28 August 1991"]
      - [Bor massacre, "from 15 November 1991, about 2,000 killed"]
      - [Torit retaken by the army, "13 July 1992"]
