notes:
  - "The government also armed and used southern militias, among them the Anyanya II in the 1980s, the forces of Paulino Matip in Western Upper Nile and, after 1997, the South Sudan Defence Force of the factions that signed the Khartoum Peace Agreement. The SPLA was supported at different times by Ethiopia (until 1991), Uganda, Eritrea and Libya (in the early 1980s); the government in turn supported the Lord’s Resistance Army against Uganda."
  - The figure of about 2 million dead is an estimate made around 2001 and widely repeated; no count was possible. Most deaths were from famine and disease.
