  - title: Bashir, Turabi and the jihad
    date: 1989–1991
    when: "1989-06-30"
    borders: "1990-06-01"
    countries: [ss, sd]
    body:
      - On 30 June 1989, as Sadiq al-Mahdi’s government was preparing to negotiate with the SPLA on the basis of freezing the September Laws, Brigadier Omar Hassan al-Bashir seized power in a coup planned by the National Islamic Front of Hassan al-Turabi. The new regime purged the army and civil service, banned parties and unions, and set out to make Sudan an Islamic state. It created the Popular Defence Forces, a militia of volunteers and conscripts who were told the war was a jihad, and it brought the murahaleen into the PDF.
      - The SPLA was at its strongest. It held most of the countryside of Equatoria, Upper Nile and Bahr el Ghazal and towns such as Torit and Bor, besieged Juba, and in the Nuba Mountains of southern Kordofan under Yusuf Kuwa and in Blue Nile it had fighters among peoples who were not southerners. It ran its areas through its army, with little civil administration, and its commanders, under Garang’s tight personal control, were often harsh to civilians.
    facts:
      - [Bashir’s coup, "30 June 1989"]
      - [Popular Defence Forces created, "1989"]
