        atoms: [SS-UY]
  - title: Machakos, Naivasha and the peace
    date: 2002–2005
    when: "2005-01-09"
    borders: "2005-01-09"
    countries: [ss, sd, ke]
    body:
      - Talks under IGAD, the regional organisation of East Africa, led by the Kenyan general Lazarus Sumbeiywo and backed by the United States, Britain and Norway, made a breakthrough at Machakos in Kenya. In the Machakos Protocol of 20 July 2002 the government accepted that the south would have six years of self-government and then a referendum on independence, while Islamic law would apply only in the north. Fighting went on during the talks, and in the same years war broke out in Darfur.
      - "At Naivasha Garang and the vice-president, Ali Osman Taha, worked out the details: security arrangements in September 2003, the sharing of oil revenues and wealth in January 2004, and the three disputed areas of Abyei, the Nuba Mountains and Blue Nile in May 2004. The Comprehensive Peace Agreement was signed in Nairobi on 9 January 2005. The south gained an autonomous government in Juba and half the oil revenues from its fields, the SPLA kept its own army, and Garang became first vice-president of Sudan on 9 July 2005."
      - Three weeks later, on 30 July 2005, Garang was killed when the Ugandan presidential helicopter carrying him crashed in bad weather; riots followed in Khartoum and Juba. Salva Kiir Mayardit succeeded him. In the referendum of January 2011 nearly 99 per cent voted for independence, and South Sudan became independent on 9 July 2011. The disputes over Abyei, the border and the Nuba Mountains and Blue Nile were left unsettled.
    facts:
      - [Machakos Protocol, "20 July 2002"]
      - [Comprehensive Peace Agreement, "9 January 2005"]
      - [Death of John Garang, "30 July 2005"]
      - [South Sudan independent, "9 July 2011"]
      - [Dead in the war, "about 2 million"]
