  - title: "Eelam War IV: the east"
    date: 2006–2007
    when: "2006-07-26"
    borders: "2006-07-26"
    countries: [lk]
    body:
      - "Violence rose through 2006. In April an LTTE suicide bomber gravely wounded the army commander, Sarath Fonseka, in Colombo, and in June a mine attack on a bus at Kebithigollewa killed 64 Sinhalese villagers. In July the LTTE closed the sluice gates of the Mavil Aru reservoir south of Trincomalee, cutting water to thousands of farmers in government-held areas, and the government answered with an offensive. Talks in Geneva in February and October failed. In August 17 local aid workers of the French charity Action contre la Faim were killed in Muttur; the monitors blamed the security forces, which the government denied."
      - "The army took Sampur, on the southern shore of Trincomalee harbour, in September 2006 and Vakarai, on the coast north of Batticaloa, in January 2007, as tens of thousands of civilians fled. With Karuna’s TMVP fighting on its side, it then cleared the jungles west of Batticaloa and on 11 July 2007 took the LTTE’s last eastern stronghold, Thoppigala. The government declared the east liberated, and in 2008 the TMVP’s leader Pillayan became chief minister of the new Eastern Province."
      - "The LTTE fought back with bombings, its naval wing and its small air wing of light aircraft, which bombed the Katunayake air base in March 2007; in October its commandos destroyed several aircraft at the Anuradhapura air base. On 2 November 2007 an air strike in Kilinochchi killed the head of its political wing, S. P. Thamilchelvan. On 2 January 2008 the government gave notice that it was leaving the ceasefire agreement, which formally lapsed on 16 January."
    facts:
