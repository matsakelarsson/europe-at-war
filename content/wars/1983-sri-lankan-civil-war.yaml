  - title: Jaffna, Mullaitivu and the Vanni
    date: 1995–2001
    when: "1995-10-17"
    borders: "1995-12-05"
    countries: [lk]
    body:
      - "The LTTE ended the truce on 19 April 1995 by sinking two navy gunboats in Trincomalee harbour. In October the army launched Operation Riviresa (“Sunray”) on the Jaffna peninsula. As the troops advanced, the LTTE ordered the people of Jaffna to leave, and at the end of October some 350,000 to 500,000 people, by different estimates, fled to the Vanni and the east of the peninsula. Early in December the army raised the national flag in Jaffna, which the government had not held since 1990, and most of the people returned in 1996. The LTTE answered with bombings in the south: on 31 January 1996 a truck bomb at the Central Bank in Colombo killed 91 people and injured more than 1,400."
      - "In July 1996 the LTTE overran the army base at Mullaitivu on the north-east coast, killing more than 1,200 soldiers, and in September 1998 it took Kilinochchi. The army’s Operation Jayasikurui (“Certain Victory”), launched in May 1997 to open a land route to Jaffna along the A9 road through the Vanni, became one of the costliest offensives of the war and was called off at the end of 1998 well short of its goal."
      - "In November 1999 the LTTE’s Unceasing Waves III offensive drove the army out of almost all the ground it had won in the Vanni in a few days, and on 22 April 2000 the LTTE took the Elephant Pass base, cutting the land link to the peninsula and threatening Jaffna itself. In December 1999 President Kumaratunga lost an eye in a suicide attack at an election rally. On 24 July 2001 LTTE commandos attacked the Katunayake air base and Colombo’s international airport next to it, destroying or damaging about two dozen military and civilian aircraft."
    facts:
      - [Jaffna retaken, "December 1995"]
      - [Central Bank bombing, "31 January 1996, 91 killed"]
      - [Fall of Mullaitivu base, "18–25 July 1996"]
      - [Fall of Elephant Pass, "22 April 2000"]
