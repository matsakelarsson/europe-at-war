  - title: The fall of Kilinochchi
    date: 2008 – January 2009
    when: "2009-01-02"
    borders: "2009-01-02"
    countries: [lk]
    body:
      - "The northern offensive began on the western side of the Vanni. The army’s 57 Division advanced from Vavuniya and the new Task Force 1, later 58 Division, under Brigadier Shavendra Silva from the Mannar district, taking the Madhu church area in April 2008 and moving up the west coast to Pooneryn, opposite Jaffna, by 15 November. Other divisions pushed north from Vavuniya and from Weli Oya towards Mullaitivu. Much enlarged and trained for small-unit fighting, the army took one LTTE line of ditches and earth walls after another."
      - "In September 2008 the government ordered the UN and aid agencies out of the Vanni. As the LTTE retreated it took the civilian population, several hundred thousand people, with it, and it forcibly recruited young people, including children. On 2 January 2009 the army entered Kilinochchi, the LTTE’s capital. Elephant Pass fell on 9 January, opening the A9 road to Jaffna, and Mullaitivu town on 25 January. The LTTE and the civilians were now pressed into the north-east corner of the Mullaitivu district."
    facts:
      - [Madhu taken, "April 2008"]
      - [Pooneryn taken, "15 November 2008"]
      - [Kilinochchi taken, "2 January 2009"]
      - [Elephant Pass and Mullaitivu taken, "9 and 25 January 2009"]
    markers:
      - kind: taken
        side: lk
