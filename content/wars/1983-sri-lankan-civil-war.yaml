id: sri-lankan-civil-war
name: Sri Lankan Civil War
start: "1983-07-23"
end: "2009-05-18"
tier: A
summary: "The war between the Sri Lankan state and the Liberation Tigers of Tamil Eelam (LTTE), who fought for an independent Tamil state, Tamil Eelam, in the north and east of the island. It grew out of decades of Tamil grievances against Sinhalese-majority governments and began in earnest with an LTTE ambush and the anti-Tamil pogrom of July 1983. India first sheltered the Tamil militants, then sent a peacekeeping force under the Indo-Sri Lanka Accord of 1987, which fought the LTTE until it withdrew in 1990. The LTTE built a de facto state in the Vanni, with its own army, navy and suicide units, and killed Rajiv Gandhi and President Premadasa. A Norwegian-brokered ceasefire in 2002 broke down after 2005, and in 2006–2009 the army took the east and then the north, destroying the LTTE in a final battle on a strip of coast in May 2009, in which very many civilians died. The UN estimated that 80,000 to 100,000 people were killed in the war; the civilian toll of its last months is contested."
countries: [lk, in]
sides:
  - id: lk
    name: Sri Lankan government
    polities: [sri-lanka]
    ink: blue
    moves: Sri Lankan government moves
    success: Sri Lankan government success
  - id: ltte
    name: Liberation Tigers of Tamil Eelam (LTTE)
    polities: [ltte]
