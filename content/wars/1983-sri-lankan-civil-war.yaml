steps:
  - title: Black July and the Tamil militants
    date: 1983–1986
    when: "1983-07-23"
    borders: "1983-07-23"
    countries: [lk, in]
    body:
      - "Since independence in 1948 Tamil parties had protested against measures taken by governments elected by the Sinhalese majority: the Sinhala Only Act of 1956, which made Sinhala the sole official language, university admission rules in the 1970s that cut the number of Tamil students, and state-sponsored settlement of Sinhalese farmers in the east. In 1976 the Tamil United Liberation Front called for a separate state, Tamil Eelam, and young militants began to kill policemen and Tamil politicians they saw as collaborators. The Liberation Tigers of Tamil Eelam, founded in 1976 by Velupillai Prabhakaran, were one of several such groups. The burning of the Jaffna Public Library by policemen and government-backed mobs in 1981 deepened the anger."
      - "On 23 July 1983 the LTTE ambushed an army patrol, Four Four Bravo, at Thirunelveli near Jaffna and killed 13 soldiers. After the bodies were brought to Colombo, Sinhalese mobs attacked Tamils, their homes and shops in Colombo and other towns for about a week; in two attacks on 25 and 27 July Sinhalese prisoners killed more than 50 Tamil prisoners in Welikada prison. Estimates of the dead range from about 300, the government’s figure, to between 400 and 3,000 by the counts of NGOs and international agencies, and higher in Tamil sources. Some 150,000 people were made homeless, and many thousands of Tamils fled to India and the West. The pogrom, known as Black July, is taken as the start of the war."
      - "Thousands of young Tamils joined the militant groups, many of them trained in camps in Tamil Nadu with help from India’s intelligence service. The militants attacked police stations and army camps in the north, and the security forces carried out reprisals against Tamil civilians. In May 1985 LTTE gunmen killed 146 civilians in Anuradhapura, many of them pilgrims at the sacred Bodhi tree. Talks between the government and the Tamil groups in Thimphu, Bhutan, in July and August 1985 failed. In 1986 the LTTE turned on its rivals, all but destroying TELO, and became the dominant Tamil force."
    facts:
      - [Four Four Bravo ambush, "23 July 1983, 13 soldiers killed"]
      - [Black July, "24–30 July 1983"]
      - [Anuradhapura massacre, "14 May 1985, 146 civilians killed"]
    markers:
