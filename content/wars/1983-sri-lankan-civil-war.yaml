  - title: The final battle
    date: February – May 2009
    when: "2009-05-18"
    borders: "2009-05-19"
    countries: [lk, in]
    body:
      - "The government declared a first “no-fire zone” for civilians on 21 January and, as the front moved, a second one on 12 February along a narrow strip of coast between the Nandikadal lagoon and the sea, and a smaller third zone on 8 May. The LTTE moved its fighters and guns among the civilians, stopped them from leaving and shot some who tried; the army shelled the zones, including makeshift hospitals, while saying it was not using heavy weapons there. Journalists were kept out, food and medicine were restricted, and the number of trapped civilians, which the government put far lower, turned out to be about 300,000."
      - "In early April the army destroyed much of the LTTE’s remaining fighting strength at Anandapuram, near Puthukkudiyiruppu. On 20 April troops breached an earth wall at Puthumathalan, and more than 100,000 civilians crossed to government lines within days. By mid-May the army had sealed the last pocket at Mullivaikkal. On 17 May the LTTE said the battle had “reached its bitter end”, and on 18 May the army announced that Prabhakaran had been killed; his body was shown on 19 May beside the Nandikadal lagoon, the day President Rajapaksa told parliament the war was over. Some 280,000 people were held in closed camps around Vavuniya, many of them for months."
      - "How many civilians died in the last months is contested. An internal UN count recorded 7,721 civilian deaths from August 2008 to 13 May 2009, which the UN Secretary-General’s Panel of Experts (2011) judged far too low, citing credible estimates of as many as 40,000. The government at first said its forces had caused no civilian deaths; its own Lessons Learnt and Reconciliation Commission (2011) accepted that civilians had been killed, but blamed the LTTE above all. The UN panel found credible allegations of war crimes and crimes against humanity by both sides, and a 2015 investigation by the UN human rights office reached similar conclusions. For the whole war, the UN estimated in 2009 that 80,000 to 100,000 people had been killed."
    facts:
      - [Second no-fire zone, "declared 12 February 2009"]
      - [Puthumathalan breach, "20 April 2009"]
      - [Prabhakaran killed, "18 May 2009"]
      - [War declared over, "19 May 2009"]
