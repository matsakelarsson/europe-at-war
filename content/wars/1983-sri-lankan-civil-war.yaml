  - title: Eelam War II
    date: 1990–1994
    when: "1990-06-11"
    borders: "1991-07-10"
    countries: [lk, in]
    body:
      - "Talks between Premadasa’s government and the LTTE broke down within three months of the Indian withdrawal. On 11 June 1990 the LTTE attacked police stations across the east, and several hundred policemen who surrendered on government orders were taken away and shot, between 600 and 774 by different counts. The army fought its way back into the eastern towns, and hundreds of Tamil civilians were killed or disappeared in reprisals. The LTTE killed 147 Muslim worshippers in mosques at Kattankudy on 3 August, and in October it expelled the entire Muslim population of the Northern Province, some 72,000 to 75,000 people, giving them hours to leave."
      - "In July 1991 the LTTE besieged the army base at Elephant Pass, on the causeway that links the Jaffna peninsula to the mainland, in its first large conventional battle. An amphibious landing relieved the base after a month, with heavy losses on both sides. The LTTE kept the rest of the peninsula, which it ran from Jaffna town under a government economic embargo."
      - "The LTTE also killed leaders it saw as enemies. On 21 May 1991 a woman suicide bomber killed Rajiv Gandhi at an election rally at Sriperumbudur in Tamil Nadu; India banned the LTTE, and an Indian court later indicted Prabhakaran. On 1 May 1993 another suicide bomber killed President Premadasa in Colombo, and in October 1994 a bomb killed the opposition’s presidential candidate, Gamini Dissanayake. Chandrika Kumaratunga, elected president in November 1994 on a promise of peace, agreed a truce with the LTTE in January 1995."
    facts:
      - [Massacre of surrendered policemen, "11 June 1990"]
      - [Expulsion of Muslims from the north, "October 1990, about 72,000–75,000 people"]
      - [Siege of Elephant Pass, "10 July – 9 August 1991"]
      - [Rajiv Gandhi killed, "21 May 1991"]
    markers:
