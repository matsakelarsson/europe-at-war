  - title: Ceasefire and the Karuna split
    date: 2002–2005
    when: "2002-02-22"
    borders: "2002-02-22"
    countries: [lk]
    body:
      - "The United National Party won the parliamentary elections of December 2001, and on 22 February 2002 its prime minister, Ranil Wickremesinghe, and Prabhakaran signed a ceasefire agreement brokered by Norway. Nordic monitors, the Sri Lanka Monitoring Mission, oversaw it; the A9 road to Jaffna reopened, and six rounds of talks were held abroad, at which the LTTE agreed in Oslo in December 2002 to explore a federal solution. It suspended the talks in April 2003 and later proposed an Interim Self-Governing Authority, which the government saw as a step towards independence. In the areas it held the LTTE ran its own police, courts and taxes from Kilinochchi."
      - "In March 2004 the LTTE’s eastern commander, Vinayagamoorthy Muralitharan, known as Colonel Karuna, broke away with several thousand fighters, saying that the northern leadership neglected the east. The LTTE routed his forces in April, but Karuna’s men, later organised as the TMVP, went on fighting it with the army’s tacit support. The Indian Ocean tsunami of 26 December 2004 killed about 35,000 people in Sri Lanka, many of them on the Tamil and Muslim east coast."
      - "Killings continued throughout the ceasefire; the monitors recorded thousands of violations, most of them by the LTTE. On 12 August 2005 an LTTE sniper killed the foreign minister, Lakshman Kadirgamar, a Tamil. In the presidential election of November 2005 the LTTE enforced a boycott in the areas it controlled, which helped Mahinda Rajapaksa, who promised a harder line, to defeat Wickremesinghe narrowly."
    facts:
      - [Ceasefire agreement, "22 February 2002"]
      - [Karuna split, "March 2004"]
      - [Tsunami, "26 December 2004, about 35,000 killed in Sri Lanka"]
