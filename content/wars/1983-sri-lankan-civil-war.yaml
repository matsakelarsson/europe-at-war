        date: 23 July 1983
        text: The LTTE ambushed an army patrol with a landmine and gunfire, killing an officer and 12 soldiers.
        lonlat: [80.028, 9.691]
      - kind: event
        name: Jaffna Public Library
        date: 31 May – 1 June 1981
        text: "Burned by policemen and government-backed mobs, with some 97,000 books and manuscripts, a loss that Tamils remember as an attack on their culture."
        lonlat: [80.012, 9.662]
        lp: l
