  - title: The Indian Peace Keeping Force
    date: 1987–1990
    when: "1987-10-10"
    borders: "1987-10-10"
    countries: [lk, in]
    body:
      - "The LTTE handed in only part of its weapons, and the truce broke down in October 1987, after a dozen LTTE members captured at sea by the Sri Lankan navy killed themselves with cyanide while awaiting transfer to Colombo. The LTTE massacred Sinhalese villagers in the east, and on 10 October the IPKF launched Operation Pawan to disarm it by force. A heliborne raid on the LTTE leadership at Jaffna University on the night of 11–12 October went badly wrong, and the Indian army needed more than two weeks of street fighting to take Jaffna, losing hundreds of men. On 21–22 October Indian troops entering the Jaffna Teaching Hospital killed about 70 patients and staff; the army said it had come under fire from the hospital."
      - "The IPKF grew to about 100,000 troops at its peak and fought a guerrilla war against the LTTE in the jungles of the Vanni and the east. India backed the EPRLF, which won the elections to the new North-Eastern Provincial Council in November 1988, and helped it raise a Tamil National Army. Both the IPKF and the LTTE were accused of killing civilians; in August 1989 Indian soldiers killed dozens of people in Valvettithurai after an ambush. In the Sinhalese south the presence of Indian troops fed the JVP insurrection of 1987–1989."
      - "Ranasinghe Premadasa, president from January 1989, demanded that India withdraw, opened talks with the LTTE and, as a later presidential commission found, secretly supplied it with weapons to fight the IPKF and the Tamil National Army. The last Indian troops left on 24 March 1990, and the LTTE took over the north and much of the east. The intervention cost India 1,165 dead by its official count. The chief minister of the North-Eastern Province, Varatharaja Perumal, made a declaration of independence before leaving for India with the departing troops."
    facts:
      - [Operation Pawan, "from 10 October 1987"]
      - [IPKF strength, "about 100,000 at its peak"]
      - [Indian losses, "1,165 killed (official)"]
      - [Withdrawal completed, "24 March 1990"]
