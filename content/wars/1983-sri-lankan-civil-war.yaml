notes:
  - The LTTE was one of several Tamil militant groups in the 1980s; others (TELO, PLOTE, EPRLF, EROS) were destroyed or absorbed by the LTTE or later sided with the government or with India. The LTTE was banned as a terrorist organisation by India (1992), the United States (1997), the European Union (2006) and some 30 other countries.
  - "Casualty figures are uncertain and contested, above all for the last phase of the war (2008–2009). The government’s figures for the security forces are about 28,700 killed; the LTTE lost about 27,000 by commonly cited estimates. The LTTE killed several thousand civilians of all communities in massacres and bombings, and the security forces were responsible for many killings and disappearances of Tamil civilians. Both are described in the steps with the figures the sources give."
  - On the base map Sri Lanka is one state throughout; areas held by the LTTE are drawn in the steps and are approximate. Tamil place names have several spellings; the common English forms are used.
