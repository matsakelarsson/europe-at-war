        text: Mobs burned Tamil homes and businesses and killed Tamils in the streets of the capital and other towns. Tamil prisoners were murdered in Welikada prison.
        lonlat: [79.861, 6.927]
      - kind: event
        side: ltte
        name: Anuradhapura
        date: 14 May 1985
        text: LTTE gunmen opened fire at the bus station and at the Sri Maha Bodhi, the sacred fig tree, killing 146 civilians.
        lonlat: [80.396, 8.345]
  - title: Operation Liberation and the Indo-Sri Lanka Accord
    date: January – July 1987
    when: "1987-05-26"
    borders: "1987-07-29"
    countries: [lk, in]
    body:
      - "By 1986 the LTTE controlled most of the Jaffna peninsula, where the army was confined to its camps, and in January 1987 it announced that it would take over the civil administration. The government of President J. R. Jayewardene imposed a fuel and food blockade on the peninsula and on 26 May launched Operation Liberation, also called the Vadamarachchi Operation, its largest offensive so far. In about two weeks the army took the north-eastern part of the peninsula around Valvettithurai, Prabhakaran’s home town, and Point Pedro. Civilians were killed in the shelling and air raids."
      - "Under pressure from Tamil Nadu, the Indian government sent a flotilla of relief supplies, which the Sri Lankan navy turned back, and on 4 June Indian Air Force transport planes escorted by fighters dropped food over Jaffna (Operation Poomalai). Jayewardene halted the offensive. On 5 July the LTTE carried out its first suicide attack: a fighter known as “Captain Miller” drove a truck packed with explosives into an army camp at Nelliady, killing many soldiers; figures vary."
      - "On 29 July Jayewardene and the Indian prime minister, Rajiv Gandhi, signed the Indo-Sri Lanka Accord in Colombo. Sri Lanka agreed to devolve power to provincial councils, with the Northern and Eastern provinces merged pending a referendum, and to make Tamil an official language; the Tamil militants were to hand in their weapons to an Indian Peace Keeping Force (IPKF). The first Indian troops landed at Palaly the next day. The accord was made without the LTTE, which accepted it only reluctantly, and it angered many Sinhalese: riots broke out in the south, and a sailor in the guard of honour struck Rajiv Gandhi with his rifle butt."
    facts:
      - [Operation Liberation, "26 May – June 1987"]
      - [Operation Poomalai, "4 June 1987, Indian airdrop over Jaffna"]
      - [Indo-Sri Lanka Accord, "29 July 1987"]
    markers:
      - kind: taken
        side: lk
        name: Valvettithurai
        date: May–June 1987
        text: The army landed and advanced along the coast and took Vadamarachchi, the home ground of Prabhakaran, who escaped.
        lonlat: [80.165, 9.818]
        lp: t
      - kind: event
        side: ltte
        name: Nelliady
        date: 5 July 1987
        text: The LTTE’s first suicide attack, on an army camp in a school, by its new Black Tiger unit.
        lonlat: [80.230, 9.780]
      - kind: event
        side: in
        name: Jaffna
        date: 4 June 1987
        text: Five Indian Air Force transports, escorted by Mirage fighters, dropped about 25 tonnes of food and medicine over the besieged peninsula.
        lonlat: [80.012, 9.665]
        lp: l
      - kind: event
        side: in
        name: Palaly
        date: 30 July 1987
        text: The first troops of the Indian Peace Keeping Force landed at the air base north of Jaffna.
        lonlat: [80.076, 9.790]
        lp: t
      - kind: treaty
        name: Indo-Sri Lanka Accord
        date: 29 July 1987
        text: Signed in Colombo by Jayewardene and Rajiv Gandhi. It led to the Thirteenth Amendment to the constitution, which created the provincial councils.
        lonlat: [79.861, 6.927]
