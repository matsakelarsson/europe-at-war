notes:
  - "Casualty figures differ slightly between sources: American losses are given as 19 killed, Grenadian military losses as 21–45 killed, and Cuban losses as 24 or 25 killed. Of the 784 Cubans on the island, about 630 were construction workers, many of them with militia training, and fewer than 50 were military personnel; 638 were captured and sent home."
  - "Whether the Governor-General asked for the intervention before it began is disputed: his written request was dated 24 October but signed only after the landing. Supporters of the invasion called it a rescue mission; critics, among them most of the UN General Assembly, called it an unlawful use of force."
