steps:
  - title: The revolution and Bishop’s death
    date: March 1979 – 24 October 1983
    when: "1983-10-19"
    borders: "1983-10-19"
    countries: [gd, cu]
    view:
      center: [-61.68, 12.12]
      size: [55, 55]
    body:
      - "On 13 March 1979, while Prime Minister Eric Gairy was abroad, the New Jewel Movement, a socialist party led by the lawyer Maurice Bishop, seized power in a nearly bloodless coup. Its People’s Revolutionary Government suspended the constitution, held no elections and kept political prisoners at Richmond Hill, but it was popular for its schools, clinics and cooperatives. It built close ties with Cuba, which sent doctors, teachers, advisers and the workers who were building a new international airport at Point Salines, and with the Soviet Union and its allies. The Reagan administration saw Grenada as a Soviet and Cuban foothold and the airport, with its long runway, as a future military base; the government said it was for tourism."
      - "In 1983 the party split between Bishop and his deputy, Bernard Coard, who led a stricter Marxist-Leninist faction and had the support of much of the army. The party’s central committee voted that the two should share the leadership; when Bishop hesitated, he was put under house arrest on 13 October. On 19 October a crowd of several thousand freed him and marched to the army headquarters at Fort Rupert in St George’s. Troops sent from Fort Frederick opened fire on the crowd, killing an unknown number of people, and executed Bishop and seven of his supporters, among them the ministers Unison Whiteman, Jacqueline Creft and Norris Bain. General Hudson Austin announced a 16-member Revolutionary Military Council and a four-day curfew under which anyone outside would be shot on sight."
    facts:
      - [New Jewel Movement takes power, "13 March 1979"]
      - [Bishop under house arrest, "13 October 1983"]
      - [Bishop executed at Fort Rupert, "19 October 1983"]
