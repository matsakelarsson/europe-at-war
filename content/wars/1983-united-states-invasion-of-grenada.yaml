  - title: Occupation and elections
    date: November 1983 – December 1984
    when: "1983-11-01"
    borders: "1983-11-01"
    countries: [gd, us, cu]
    body:
      - "Marines landed on the island of Carriacou on 1 November and found its garrison ready to surrender, and on 2 November the United States declared hostilities over. The same day the UN General Assembly deplored the invasion as “a flagrant violation of international law” by 108 votes to 9, with 27 abstentions; the United States had vetoed a similar resolution in the Security Council. The Cubans were flown home, and in Havana Fidel Castro honoured the dead. Many Grenadians welcomed the invasion after the killing of Bishop, and polls in the United States showed broad support."
      - "Scoon appointed an advisory council under Nicholas Brathwaite to govern until elections, and American combat troops left by 15 December 1983, leaving support units and the Caribbean Peace Force until 1985. In the election of 3 December 1984 Herbert Blaize’s New National Party won 14 of the 15 seats. In 1986 a Grenadian court convicted 17 people, among them Coard and Austin, of the killings of 19 October 1983; 14 were sentenced to death, the sentences were commuted to life imprisonment, and the last of the “Grenada 17” were released in 2009. In 2009 the Point Salines airport was renamed Maurice Bishop International Airport."
    facts:
      - [Carriacou occupied, "1 November 1983"]
      - [UN General Assembly Resolution 38/7, "2 November 1983, 108 votes to 9"]
      - [American combat troops leave, "15 December 1983"]
      - [Elections, "3 December 1984"]
