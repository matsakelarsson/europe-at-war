id: united-states-invasion-of-grenada
name: United States invasion of Grenada
start: "1983-10-25"
end: "1983-12-15"
tier: B
summary: "The American-led invasion of Grenada in October 1983, code-named Operation Urgent Fury, which overthrew the military council that had seized power after the killing of Prime Minister Maurice Bishop. Bishop’s New Jewel Movement had taken power in a revolution in 1979 and set up the People’s Revolutionary Government, which built close ties with Cuba and the Soviet Union and, with Cuban workers, a new international airport at Point Salines that the Reagan administration said was meant for military use. In October 1983 a rival faction around Deputy Prime Minister Bernard Coard put Bishop under house arrest; when a crowd freed him on 19 October, soldiers executed him and seven others at Fort Rupert, and General Hudson Austin’s Revolutionary Military Council took power under a shoot-on-sight curfew. At the request of the Organisation of Eastern Caribbean States, Barbados and Jamaica, and citing the safety of about 600 American medical students, President Reagan sent some 7,300 troops, joined by about 350 soldiers and police of a Caribbean Peace Force. They landed on 25 October against resistance from the People’s Revolutionary Army and armed Cuban construction workers and military personnel, and by 28 October held the island. The United States lost 19 killed and 116 wounded; 45 Grenadian soldiers, 25 Cubans and at least 24 Grenadian civilians were killed, 18 of them when American aircraft bombed a mental hospital by mistake. The UN General Assembly condemned the invasion as a flagrant violation of international law by 108 votes to 9, and Britain, whose queen was Grenada’s head of state, had not been consulted. The Governor-General, Sir Paul Scoon, appointed an interim government, American combat troops left in December 1983, and elections were held in December 1984."
