  - title: Operation Urgent Fury
    date: 25–28 October 1983
    when: "1983-10-25"
    borders: "1983-10-25"
    countries: [gd, us, cu, jm, bb, dm, lc, vc, ag, kn]
    view:
      center: [-61.68, 12.10]
      size: [55, 55]
    body:
      - "On 21 October the Organisation of Eastern Caribbean States, led by Dominica’s prime minister, Eugenia Charles, joined by Barbados and Jamaica, asked the United States to intervene. Reagan agreed, citing the danger to about 600 American students at St George’s University medical school, the request of Grenada’s neighbours and, later, a request from the Governor-General, Sir Paul Scoon. Before dawn on 25 October Army Rangers parachuted onto the unfinished runway at Point Salines under fire from Cuban and Grenadian troops, while Marines landed by helicopter at Pearls airport and Grenville on the east coast, where they met little resistance. Navy SEALs reached Government House to protect Scoon but were pinned down there until Marines who had landed at Grand Mal Bay, north of St George’s, relieved them on 26 October."
      - "The Cubans at Point Salines surrendered after a day of fighting. The Rangers reached the students at the True Blue campus on 25 October, but only learned then that more were at Grand Anse, where they were flown out by helicopter on 26 October. American aircraft destroyed the anti-aircraft positions around St George’s and by mistake bombed the island’s mental hospital, killing 18 patients. Fort Frederick and Richmond Hill fell on 26 October and the Calivigny barracks, found empty, on 27 October, when three soldiers died in a helicopter crash. Coard and Austin were captured within days. About 7,300 American troops took part, with some 350 soldiers and police of the Caribbean Peace Force, who guarded prisoners and took over policing."
    facts:
