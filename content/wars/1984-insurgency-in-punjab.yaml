notes:
  - "Official figures for 1981–1993 count 11,690 civilians, 7,946 militants and some 1,700 police killed, besides soldiers; human rights groups say the true numbers, especially of young Sikhs killed or disappeared in police custody, were much higher. The main militant groups were the Khalistan Commando Force, the Babbar Khalsa, the Khalistan Liberation Force and the Bhindranwale Tiger Force, which often fought each other. India accused Pakistan of arming and training them, which Pakistan denied."
  - "The death toll of Operation Blue Star is disputed: the government’s White Paper gave 83 soldiers and 493 militants and civilians killed, while other estimates of the civilian dead run into the thousands. The official count of Sikhs killed in the riots of November 1984 is about 3,350, 2,733 of them in Delhi; other estimates are higher."
