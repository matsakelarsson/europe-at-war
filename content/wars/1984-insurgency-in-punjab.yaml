  - title: The guerrilla war
    date: 1985–1995
    when: "1988-05-12"
    borders: "1988-05-12"
    countries: [in]
    body:
      - "Rajiv Gandhi, who succeeded his mother, signed an accord with the moderate Akali leader Harcharan Singh Longowal on 24 July 1985, but Longowal was shot dead on 20 August, and the accord was never fully carried out. On 23 June 1985 a bomb planted by Sikh militants in Canada destroyed Air India Flight 182 off Ireland, killing all 329 people on board. On 29 April 1986 a militant Panthic Committee declared Khalistan independent at the Akal Takht. Militant groups, armed with automatic rifles from across the border, killed policemen, politicians, journalists and Hindus, sometimes pulling passengers off buses and shooting them, and Sikhs who opposed them; their own rivalries and crimes cost them support. In May 1988, in Operation Black Thunder, police commandos besieged militants in the Golden Temple until they surrendered, this time without storming the shrine. Deaths rose to several thousand a year in 1988–1991."
      - "After elections in February 1992, boycotted by the Akalis and with a turnout of about a quarter of voters, the new chief minister, Beant Singh, gave the police chief K. P. S. Gill a free hand. With rewards for kills, village defence committees and the help of the army, the police killed or captured most militant leaders by 1993. Human rights groups documented thousands of extrajudicial killings and disappearances, and in 1995 the human rights activist Jaswant Singh Khalra, who had exposed mass cremations of unidentified bodies by the Punjab police, was abducted and killed by policemen. On 31 August 1995 a suicide bomber of the Babbar Khalsa killed Beant Singh and 16 others at the state secretariat in Chandigarh; it was the last major attack of the insurgency."
