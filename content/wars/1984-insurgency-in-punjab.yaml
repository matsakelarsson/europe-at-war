id: insurgency-in-punjab
name: Insurgency in Punjab
start: "1984-06-01"
end: "1995-08-31"
tier: B
summary: "The armed movement of Sikh militants for an independent Sikh state, Khalistan, in the Indian state of Punjab, and its suppression. It grew out of the Akali Dal’s campaign for more autonomy for Punjab and the rise of the preacher Jarnail Singh Bhindranwale, who with armed followers made the Golden Temple in Amritsar, the holiest shrine of Sikhism, his base. In June 1984 Prime Minister Indira Gandhi sent the army into the temple in Operation Blue Star, killing Bhindranwale and many militants and pilgrims. In October she was killed by two Sikh bodyguards, and mobs killed thousands of Sikhs in Delhi and other cities. Militant groups then waged a guerrilla war in Punjab, killing thousands of civilians, many of them Hindus and Sikhs who opposed them, and Sikh militants abroad bombed an Air India airliner in 1985, killing 329 people. The police under K. P. S. Gill crushed the insurgency in 1992–1993, with mass arrests and killings of suspects in staged encounters. The killing of Chief Minister Beant Singh in 1995 was its last major attack. About 21,000 people were killed by official figures."
