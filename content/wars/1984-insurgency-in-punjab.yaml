steps:
  - title: Bhindranwale and Operation Blue Star
    date: 1978–1984
    when: "1984-06-06"
    borders: "1984-06-06"
    countries: [in]
    body:
      - "On 13 April 1978 followers of Jarnail Singh Bhindranwale, a fundamentalist preacher, clashed in Amritsar with the Nirankaris, a sect they considered heretical, and 13 Sikhs were killed. In the following years Bhindranwale gained a large following among young Sikhs, and his supporters were blamed for killings of Nirankaris, Hindus and opponents. In 1982 he and the Akali Dal launched a mass campaign of civil disobedience, the Dharam Yudh Morcha, for the autonomy demands of the Anandpur Sahib Resolution, and he moved with armed followers into the Golden Temple complex in Amritsar, from December 1983 into the Akal Takht, the seat of Sikh religious authority. On 23 April 1983 a senior police officer, A. S. Atwal, was shot dead at the temple gate. Killings across Punjab mounted, and in October 1983 the state was put under president’s rule."
      - "On 1 June 1984 the army surrounded the Golden Temple, where hundreds of armed militants, led by the former major general Shabeg Singh, had fortified the complex, and thousands of pilgrims had gathered for a festival. In the night of 5–6 June troops stormed it; meeting fierce resistance, the army brought in tanks, which badly damaged the Akal Takht. Bhindranwale and Shabeg Singh were killed on 6 June. The army also raided dozens of other gurdwaras, and in Operation Woodrose it swept the Punjab countryside for militants. The assault on the shrine outraged Sikhs around the world, and on 31 October 1984 two Sikh bodyguards shot Indira Gandhi dead in Delhi. In the next three days mobs, some led by members of the governing Congress party, killed thousands of Sikhs in Delhi and other cities while the police largely stood by."
    facts:
