steps:
  - title: The insurgency
    date: 1984–1999
    when: "1984-08-15"
    borders: "1999-02-15"
    countries: [tr, iq, sy]
    body:
      - The PKK was founded in 1978 by Abdullah Öcalan as a Marxist–Leninist party seeking an independent Kurdistan, at a time when the Kurdish language was restricted in public life in Turkey. After the military coup of 1980 its leaders worked from Syria and the Syrian-controlled Beqaa valley in Lebanon. On 15 August 1984 its fighters attacked gendarmerie posts and barracks in Eruh and Şemdinli. The state answered by arming Kurdish villagers as paid village guards and from 1987 placed the south-eastern provinces under emergency rule. The PKK attacked village guards and their families, teachers and others it saw as agents of the state.
      - The war was at its worst in the early and mid-1990s. Security forces emptied or burned some 3,000 villages, uprooting hundreds of thousands of people, and thousands of Kurdish activists, journalists and businessmen were killed in murders that were never solved. The army struck PKK bases in northern Iraq, in 1997 with tens of thousands of troops. In 1998 Turkey threatened Syria with war unless it expelled Öcalan; he left and was seized by Turkish agents in Nairobi on 15 February 1999. Sentenced to death, a sentence later commuted to life, he was imprisoned on the island of İmralı.
    facts:
      - [First attacks, "Eruh and Şemdinli, 15 August 1984"]
      - [Emergency rule in the south-east, "1987–2002"]
      - [Öcalan captured, "Nairobi, 15 February 1999"]
