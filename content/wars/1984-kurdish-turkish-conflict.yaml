  - title: From ceasefires to disarmament
    date: 1999 – November 2026
    when: "1999-08-01"
    borders: "2025-07-11"
    countries: [tr, iq, sy]
    body:
      - Last updated 19 November 2026. After Öcalan’s capture the PKK called a ceasefire and changed its aim from independence to autonomy and rights within Turkey, while Turkey, seeking to join the European Union, eased restrictions on the Kurdish language. Fighting resumed in 2004. A peace process begun in 2013 broke down in July 2015. In 2015–2016 PKK youth units dug in inside towns, and army sieges and curfews destroyed much of the old city of Diyarbakır, Cizre and Nusaybin, killing hundreds of civilians. Turkey also struck PKK-linked Kurdish forces in Syria and built a chain of bases in northern Iraq.
      - In October 2024 Devlet Bahçeli, leader of the nationalist party allied with President Erdoğan, proposed that Öcalan call on the PKK to lay down its arms. Öcalan did so on 27 February 2025. The PKK declared a ceasefire and on 12 May announced that it was dissolving itself and ending its armed struggle. On 11 July some 30 fighters burned their weapons at a ceremony near Sulaymaniyah in Iraqi Kurdistan, and in October the PKK said it was withdrawing its fighters from Turkey. In August 2026 Turkey’s parliament passed a law on the return of PKK members, conditional on verified disarmament, which Turkey had not yet confirmed.
    facts:
      - [Peace process, "2013–2015"]
      - [PKK announces dissolution, "12 May 2025"]
      - [Reintegration law, "August 2026, conditional on verified disarmament"]
