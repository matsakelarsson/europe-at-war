id: kurdish-turkish-conflict
name: Kurdish–Turkish conflict (PKK insurgency)
start: "1984-08-15"
end: ongoing
tier: B
summary: The armed conflict between the Turkish state and the Kurdistan Workers’ Party (PKK), which took up arms in south-eastern Turkey in 1984, first for an independent Kurdish state and later for autonomy and Kurdish rights; more than 40,000 people were killed, most of them in the 1990s, and the fighting spread into northern Iraq and Syria. The PKK declared its dissolution and the end of its armed struggle in May 2025, but as of November 2026 Turkey had not confirmed that its disarmament was complete.
countries: [tr, iq, sy]
