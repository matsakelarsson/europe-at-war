  - id: tr
    name: Turkey
    polities: [turkey]
    ink: teal
    moves: Turkish moves
    success: Turkish success
  - id: pkk
    name: PKK (Kurdistan Workers’ Party)
    ink: gold
    moves: PKK moves
    success: PKK success
notes:
  - The PKK is listed as a terrorist organisation by Turkey, the European Union and the United States. Both sides were accused of grave abuses; the PKK killed civilians, village guards and teachers, and the European Court of Human Rights ruled against Turkey in many cases of village destruction, torture and killings in the 1990s.
  - The death toll is usually given as more than 40,000 since 1984, including soldiers, police, village guards, PKK fighters and civilians.
  - This entry treats the conflict as ongoing because the disarmament process begun in 2025 had not been declared complete. It will be updated when it is.
