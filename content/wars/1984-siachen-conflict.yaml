    moves: Pakistani moves
    success: Pakistani success
notes:
  - "India holds some 2,000–2,500 square kilometres east of the Saltoro Ridge; the line between the two armies is known as the Actual Ground Position Line. India argues that the ceasefire line should follow the watershed northward from NJ9842; Pakistan argues that it runs north-east to the Karakoram Pass, which would give it the glacier. India has said it will withdraw only if Pakistan first accepts the present positions in writing, which Pakistan has refused."
  - Both armies have published few casualty figures. India’s defence minister said in 2019 that more than 1,000 Indian soldiers had died in the area since 1984, most of them from the weather; Pakistan’s losses are thought to be of a similar order.
