id: siachen-conflict
name: Siachen conflict
start: "1984-04-13"
end: "2003-11-26"
tier: B
summary: "The war between India and Pakistan for the Siachen Glacier and the Saltoro Ridge in the eastern Karakoram, the highest battlefield in the world, where posts stand at more than 6,000 metres. The ceasefire line of 1949 and the Line of Control of 1972 ended at a map point called NJ9842, leaving the glaciers to the north undemarcated. In the 1970s Pakistan allowed foreign mountaineering expeditions into the area and many maps drew the line north-east to the Karakoram Pass, which India saw as a claim to the glaciers. In April 1984, in Operation Meghdoot, India flew troops onto the glacier and seized the main passes of the Saltoro Ridge just before Pakistani troops could reach them. Pakistan tried several times to dislodge them, most seriously in 1987, and the two armies fought artillery duels and assaults on each other’s posts until a ceasefire in November 2003. Far more soldiers died of cold, altitude sickness and avalanches than of enemy fire; estimates put the dead of both sides at about 2,000 by 2003, and many more have died since. India still holds the glacier and the main ridge, and talks on demilitarising the area have failed."
countries: [in, pk]
sides:
  - id: in
    name: India
    polities: [india]
    ink: orange
    moves: Indian moves
    success: Indian success
  - id: pk
    name: Pakistan
    polities: [pakistan]
