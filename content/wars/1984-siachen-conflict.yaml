  - title: War on the glacier
    date: 1987–2003
    when: "1987-06-26"
    borders: "1987-06-26"
    countries: [in, pk]
    body:
      - "In 1987 Pakistan held a post at about 6,500 metres, named Quaid Post after the founder of Pakistan, from which it could fire on the Indian positions at Bilafond La. On 26 June 1987, after earlier attempts had failed, a small Indian party led by Naib Subedar Bana Singh climbed a sheer ice wall and took it in close combat; it was renamed Bana Top. In September Pakistani forces, among them special forces under Brigadier Pervez Musharraf, launched a large attack on the Indian positions near Bilafond La, which failed with heavy losses. Further battles followed at Chumik in 1989, at Bahadur post in 1992, when a Pakistani brigadier was killed when his helicopter was shot down, and in other sectors in the 1990s."
      - "The two armies settled into a costly stalemate along the ridge, with frequent artillery fire, until a ceasefire along the Line of Control and the Actual Ground Position Line took effect on 26 November 2003. Since then the dead have been the victims of the mountains: on 7 April 2012 an avalanche buried a Pakistani battalion headquarters at Gayari, killing 129 soldiers and 11 civilians, and in February 2016 an avalanche killed ten Indian soldiers at a post at about 6,000 metres. Proposals to withdraw both armies and make the area a “mountain of peace” have come to nothing."
