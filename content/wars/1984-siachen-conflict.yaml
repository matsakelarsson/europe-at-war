steps:
  - title: Operation Meghdoot
    date: 1984
    when: "1984-04-17"
    borders: "1984-04-17"
    countries: [in, pk]
    body:
      - "Alarmed by Pakistani-permitted expeditions and by reports that Pakistan had bought cold-weather gear in Europe, India decided to occupy the passes of the Saltoro Ridge, the watershed west of the Siachen Glacier, before the summer. On 13 April 1984 Indian army helicopters and transport aircraft began landing troops of the Kumaon Regiment and the Ladakh Scouts at Bilafond La, and on 17 April at Sia La, at the northern end of the ridge; Gyong La, further south, followed in June. Pakistani troops arriving days later found the passes held."
      - "Pakistan set up posts on the western slopes and attacked the Indian positions; the first clash was on 25 April 1984. Supplies for the Indian posts had to be flown in by helicopter or carried on foot up the 76-kilometre glacier, and both sides lost many more men to frostbite, falls into crevasses and the thin air than to combat."
