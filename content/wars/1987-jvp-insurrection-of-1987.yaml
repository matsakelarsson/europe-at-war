notes:
  - "Most of the dead were killed by the security forces and by death squads linked to them, such as the “Black Cats” and the People’s Revolutionary Red Army; the JVP killed several thousand people. Commissions of inquiry set up from 1994 received reports of more than 20,000 disappearances in the south in these years. The JVP’s first rising, in 1971, has its own entry; the war in the north and east is the Sri Lankan Civil War."
