steps:
  - title: Against the accord
    date: 1987–1988
    when: "1987-08-18"
    borders: "1987-08-18"
    countries: [lk]
    body:
      - "Accused by the government of a role in the anti-Tamil riots of July 1983, which it denied, the JVP was banned and its leaders went into hiding. On 15 April 1987 its cadres raided the army camp at Pallekele near Kandy and carried off rifles and ammunition. When President J. R. Jayewardene signed the Indo-Sri Lanka Accord on 29 July 1987, promising autonomy to the Tamil north and east and inviting Indian troops to keep the peace there, riots broke out in Colombo and the south. The JVP turned the anger into a campaign against the accord and the Indian presence. On 18 August a grenade thrown into a meeting of the governing party’s MPs in the parliament building killed a minister and an official; Jayewardene and Prime Minister Premadasa escaped unhurt."
      - "Through the DJV, the JVP killed members of the governing party, supporters of the provincial councils set up under the accord and rival leftists: on 16 February 1988 gunmen shot the popular actor and politician Vijaya Kumaratunga, who had backed the accord, outside his home in Colombo. It called strikes and curfews enforced by killing those who ignored them, and threatened voters before the elections of December 1988 and February 1989, in which turnout fell sharply in the south. Premadasa, elected president in December 1988, offered talks, which the JVP rejected."
