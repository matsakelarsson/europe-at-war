  - title: Terror and counter-terror
    date: 1989
    when: "1989-11-13"
    borders: "1989-11-13"
    countries: [lk]
    body:
      - "In 1989 the JVP’s strikes paralysed transport, schools and businesses in much of the country, and it called for a boycott of Indian goods and ordered soldiers and police to resign. When it threatened to kill the families of members of the security forces who did not, the army turned against it in full force. Under the state minister for defence, Ranjan Wijeratne, the army launched Operation Combine, and the security forces and death squads linked to them hunted down suspected JVP members and sympathisers, mostly young rural Sinhalese, across the south. Thousands were tortured in camps such as the one at the Batalanda housing scheme near Colombo; bodies were burned on piles of tyres by the roadside or left floating in rivers."
      - "On 12 November 1989 Rohana Wijeweera was captured at Ulapane near Kandy, where he had been living as a tea planter under a false name; he was killed in custody the next day, and the official account of his death has been widely doubted. Most of the JVP’s politburo was killed in the following weeks, and on 29 December the last of its leaders at large, Saman Piyasiri Fernando, known as Keerthi Vijayabahu, was killed. Only Somawansa Amarasinghe escaped abroad. The JVP later returned to parliamentary politics, and in 2024 its leader, Anura Kumara Dissanayake, was elected president of Sri Lanka."
