id: jvp-insurrection-of-1987
name: JVP insurrection of 1987–1989
start: "1987-04-15"
end: "1989-12-29"
tier: B
summary: "The second armed rising of the Janatha Vimukthi Peramuna (JVP, People’s Liberation Front), a Marxist movement of young Sinhalese from the rural south of Sri Lanka, and the state terror with which it was crushed. Banned after the riots of July 1983, the JVP went underground, and after the Indo-Sri Lanka Accord of July 1987 brought Indian troops to the north and east, it led a violent campaign against the accord, which it called a betrayal of the nation. Its armed wing, the Deshapremi Janatha Viyaparaya (DJV, Patriotic People’s Movement), killed politicians, officials, police and anyone who defied its orders to strike, and in 1988–1989 brought much of the south to a halt. The government of Ranasinghe Premadasa answered with a counter-insurgency in which the army, the police and death squads killed tens of thousands of young people, many of whom disappeared. The JVP’s leader Rohana Wijeweera was captured and killed in November 1989, and by the end of the year the rising was over. Estimates of the dead range from about 40,000 to 80,000."
