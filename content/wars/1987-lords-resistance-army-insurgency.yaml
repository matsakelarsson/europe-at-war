  - title: The remnant of the LRA
    date: 2017 – 2026
    when: "2026-11-27"
    borders: "2026-11-27"
    countries: [cf, sd, ug]
    body:
      - "Last updated 27 November 2026. After the Ugandan and US forces left, the LRA survived as a small, scattered group in the borderlands of the CAR, Sudan and South Sudan, living by trade, poaching and raids. In 2023 two LRA groups gave themselves up, the largest defection in its history. In April 2024 fighters of Russia’s Wagner Group raided Haute-Kotto near Sam Ouandja in an attempt to capture Kony, without success. In March 2026 the researcher Kristof Titeca estimated that the LRA was down to possibly 12 to 20 fighters, mainly in the borderlands of the CAR and Sudan, and that the war in Sudan since 2023 had disrupted the trade it lived on."
      - "At the ICC, a hearing on the charges against Kony was held in his absence on 9–10 September 2025, and on 6 November 2025 the court’s Pre-Trial Chamber III confirmed 39 counts of war crimes and crimes against humanity for crimes in northern Uganda in 2002–2005; a trial cannot open unless he is arrested. In October 2026 the ICC’s lead investigator, Leonie von Braun, said that Kony was still alive and “very much present” within the LRA, which had abducted at least 25 children in raids on villages in the east and south-east of the CAR. Between June and September 2026 the UN documented 26 serious incidents involving alleged LRA fighters in the south-east of the CAR, among them rape, sexual slavery and the abduction of children, and on 12 September local deputies blamed it for an attack on three villages near Bangassou in which 44 people were abducted, 13 of whom, all children, were still held days later. Other armed groups are active in the same areas, and how far these attacks are the work of the LRA itself is uncertain."
    facts:
      - [ICC confirms charges against Kony, "6 November 2025, 39 counts"]
      - [Estimated strength of the LRA, "possibly 12 to 20 fighters (March 2026)"]
      - [Children abducted in raids in the CAR, "at least 25 (ICC investigator, October 2026)"]
    markers:
