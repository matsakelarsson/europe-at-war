  - title: The ICC warrants and the Juba talks
    date: 2005 – 2008
    when: "2006-08-26"
    borders: "2006-08-26"
    countries: [ug, ss, cd]
    body:
      - "In July and September 2005 the ICC issued arrest warrants, made public on 13 October, against Kony, his deputy Vincent Otti and the commanders Raska Lukwiya, Okot Odhiambo and Dominic Ongwen, its first warrants ever. Under pressure in Uganda, and with Sudan’s civil war ended by the peace agreement of January 2005, the LRA moved west. In September 2005 Otti led a group into the Garamba National Park in the north-east of the DR Congo, where Kony followed."
      - "Peace talks between the Ugandan government and the LRA opened in Juba on 14 July 2006, mediated by Riek Machar, the vice-president of the autonomous government of Southern Sudan, and later backed by the former Mozambican president Joaquim Chissano as UN envoy. On 26 August 2006 the two sides signed a cessation of hostilities, under which LRA fighters were to gather at assembly points. The truce brought northern Uganda its first real peace in twenty years; people began to leave the camps, and over the following years most went home. The talks dragged on: Otti, who had led the LRA delegation, was killed on Kony’s orders around October 2007, and in April and again in November 2008 Kony failed to appear to sign the Final Peace Agreement, demanding that the ICC warrants be lifted first."
    facts:
      - [ICC arrest warrants, "July and September 2005, made public 13 October 2005"]
      - [Juba talks open, "14 July 2006"]
      - [Cessation of hostilities, "26 August 2006"]
      - [Vincent Otti killed, "about October 2007"]
    markers:
      - kind: treaty
        name: Juba
        date: 14 July 2006 – 2008
        text: Talks between the Ugandan government and the LRA, mediated by Riek Machar, produced a truce on 26 August 2006, but Kony never signed the final agreement.
