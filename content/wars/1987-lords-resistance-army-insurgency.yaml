notes:
  - "Numbers are uncertain. The estimate of more than 100,000 deaths comes from the UN; deaths in the camps from disease and malnutrition, for which the government bears responsibility, were far higher than those caused directly by the LRA. Many LRA fighters were themselves abducted children, which makes the war especially painful for the Acholi, who suffered most from both sides. The Ugandan army was also accused of killings, rape and torture in the north."
  - "Since the 2010s information on the LRA comes mostly from defectors, the UN, researchers and local officials in remote areas of the CAR, the DR Congo and Sudan; attributions of attacks to the LRA there cannot always be confirmed, as other armed groups are active in the same areas."
