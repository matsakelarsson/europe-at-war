  - title: The hunt for Kony
    date: 2010 – 2017
    when: "2012-05-12"
    borders: "2012-05-12"
    countries: [cf, cd, ss, ug, us]
    body:
      - "In May 2010 the US Congress passed the Lord’s Resistance Army Disarmament and Northern Uganda Recovery Act, and in October 2011 President Barack Obama sent about 100 special forces advisers to help the Ugandan army and its partners hunt Kony. On 5 March 2012 the American charity Invisible Children released the video Kony 2012, which was viewed tens of millions of times within days and was criticised by many Ugandans for oversimplifying the war. That year the African Union set up a Regional Task Force of up to 5,000 troops, mostly Ugandan, with its headquarters at Yambio in South Sudan."
      - "Ugandan soldiers captured the senior commander Caesar Achellam in the CAR on 12 May 2012, and defections, encouraged by leaflets and radio broadcasts, steadily thinned the LRA, which fell to a few hundred fighters. In January 2015 Dominic Ongwen, himself abducted as a child, gave himself up in the CAR and was handed to the ICC, which convicted him in 2021 of 61 war crimes and crimes against humanity and sentenced him to 25 years. Kony, believed to move between the CAR and the Kafia Kingi enclave on the border of Sudan and South Sudan, eluded his pursuers. In 2017 the United States ended its operation and Uganda withdrew its troops from the CAR."
    facts:
      - [US advisers deployed, "October 2011, about 100"]
      - [Kony 2012 released, "5 March 2012"]
      - [Caesar Achellam captured, "12 May 2012"]
      - [Dominic Ongwen surrenders, "January 2015"]
      - [Ongwen sentenced by the ICC, "6 May 2021, 25 years"]
      - [US and Ugandan operations end, "2017"]
