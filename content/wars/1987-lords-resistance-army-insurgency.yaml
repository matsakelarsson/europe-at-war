id: lords-resistance-army-insurgency
name: Lord’s Resistance Army insurgency
start: "1987"
end: ongoing
tier: A
summary: "The war waged by Joseph Kony’s Lord’s Resistance Army (LRA), first against the government of Yoweri Museveni in northern Uganda and later in the borderlands of South Sudan, the Democratic Republic of the Congo and the Central African Republic. It grew out of the defeat of the northern army in 1986 and of Alice Lakwena’s Holy Spirit Movement, and drew on Acholi grievances, Christian and spiritual beliefs and Kony’s own claims of prophecy. The LRA became known for the abduction of children to serve as fighters, porters and “wives”: a University of California, Berkeley study estimated that by 2006 it had taken 24,000–38,000 children and 28,000–37,000 adults. Sudan armed it from 1994 in return for Uganda’s support of southern Sudanese rebels. To deny it support, the Ugandan government forced most of the Acholi population, up to 1.5–2 million people, into camps where disease and hunger killed far more people than the rebels did, according to World Health Organization data. The UN estimates that more than 100,000 people were killed. Museveni referred the LRA to the International Criminal Court, which issued its first ever arrest warrants in 2005 against Kony and four commanders. Peace talks in Juba in 2006–2008 brought calm to northern Uganda, but Kony never signed the final agreement. Driven from Garamba in the Congo by a regional offensive in December 2008, the LRA massacred hundreds of Congolese civilians and spread into the CAR and Sudan’s Kafia Kingi enclave, pursued by Ugandan troops, an African Union task force and US special forces until 2017. It has since shrunk to a small band, but Kony remains at large; in November 2025 the ICC confirmed 39 counts of war crimes and crimes against humanity against him in his absence, and in 2026 attacks and abductions in the south-east of the CAR were again attributed to the LRA."
countries: [ug, ss, cd, cf, sd]
