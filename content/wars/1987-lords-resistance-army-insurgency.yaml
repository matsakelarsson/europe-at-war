  - title: Lightning Thunder and the massacres in the Congo
    date: 2008 – 2010
    when: "2008-12-25"
    borders: "2008-12-25"
    countries: [cd, ss, cf, ug]
    body:
      - "While the talks stalled, the LRA rebuilt its strength by abducting hundreds of people in the DR Congo, Southern Sudan and, from February 2008, the Central African Republic, where it raided the town of Obo in March. On 14 December 2008 Uganda, the DR Congo and Southern Sudan, with American planning and intelligence support, launched Operation Lightning Thunder, an air and ground attack on the LRA’s camps in Garamba. Kony escaped."
      - "The LRA broke up into small groups and took revenge on Congolese villagers. In the “Christmas massacres” of 24–27 December 2008 at Faradje, Doruma, Batande and other villages of Haut-Uélé, its fighters killed hundreds of people, many of them with clubs and machetes; Caritas counted more than 400 dead, and Human Rights Watch later documented at least 865 civilians killed in the Congo and Southern Sudan between 24 December and 17 January. In December 2009, in four days around Makombo, fighters said to have acted on Dominic Ongwen’s orders killed at least 321 civilians and abducted 250 more. Tens of thousands fled their homes in north-eastern Congo, southern Sudan and the south-east of the CAR."
    facts:
      - [Operation Lightning Thunder, "from 14 December 2008"]
      - [Christmas massacres, "24–27 December 2008; at least 865 killed by 17 January (Human Rights Watch)"]
      - [Makombo massacre, "December 2009, at least 321 killed"]
