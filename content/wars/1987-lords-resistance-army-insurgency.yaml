steps:
  - title: Alice Lakwena and the rise of Joseph Kony
    date: 1986 – 1991
    when: "1987-10"
    borders: "1987-10-01"
    countries: [ug]
    body:
      - "When Museveni’s National Resistance Army took Kampala in January 1986, the defeated soldiers of the Okello government fled north to Acholiland, the home region of many of them. NRA abuses and fear of revenge fed resistance there. Alice Auma, a spirit medium from Gulu known as Lakwena after the spirit she said spoke through her, formed the Holy Spirit Movement, whose fighters were anointed with shea oil that she said would turn bullets into water. In 1987 her Holy Spirit Mobile Forces won several fights against the NRA and marched south through Kitgum, Lira and Soroti towards Kampala, gaining recruits along the way. Near Jinja, at the end of 1987, the NRA destroyed them; Alice fled to Kenya, where she lived in a refugee camp until her death in 2007."
      - "Joseph Kony, a young man from Odek near Gulu who also claimed to be possessed by spirits, had formed his own group in early 1987 and took in many of the Holy Spirit Movement’s survivors and men of the former army’s Uganda People’s Democratic Army. His movement, later called the Lord’s Resistance Army, mixed Acholi spirit beliefs, Christianity and Islam, and claimed to fight for a government based on the Ten Commandments. Until 1991 it raided villages for food and took people to carry it away, holding most of them only briefly."
    facts:
      - [NRA takes Kampala, "26 January 1986"]
      - [Holy Spirit Movement defeated near Jinja, "late 1987"]
      - [Kony’s group founded, "1987"]
    markers:
      - kind: battle
        side: ug
        name: Jinja
        date: late 1987
        text: The NRA routed the Holy Spirit Mobile Forces near the town, ending Alice Lakwena’s march on Kampala.
        lonlat: [33.204, 0.423]
      - kind: event
        side: lra
        name: Gulu
        date: "1987"
        text: Alice Lakwena and Joseph Kony both came from the Gulu area, the heart of Acholiland.
        lonlat: [32.299, 2.782]
        lp: l
      - kind: taken
        side: hsm
        name: Soroti
        date: "1987"
        text: The Holy Spirit Mobile Forces passed through Teso on their march towards Kampala.
        lonlat: [33.611, 1.715]
    arrows:
      - side: hsm
        label: The Holy Spirit Movement’s march, 1987
        via: [[32.878, 3.20], [32.90, 2.25], [33.611, 1.715], [33.40, 1.00], [33.204, 0.50]]
  - title: Operation North, the Bigombe talks and Sudan
    date: 1991 – 1996
    when: "1994-02-06"
    borders: "1994-02-06"
    countries: [ug, sd]
    body:
      - "In March 1991 the government launched Operation North, sealing off the north and arresting suspected rebel supporters. Betty Bigombe, the minister charged with ending the insurgency, organised “Arrow Groups”, local militias armed mostly with bows and arrows; Kony took their formation as a betrayal by the Acholi and turned his violence on civilians, cutting off lips, ears and noses. In 1993–1994 Bigombe arranged the first face-to-face talks with the LRA, but on 6 February 1994 Museveni gave the rebels seven days to come out of the bush, and the talks collapsed."
      - "Two weeks later LRA fighters crossed into southern Sudan and set up bases there with the approval of Khartoum, which armed them in return for Uganda’s support of the Sudan People’s Liberation Army. From then on the LRA struck from Sudan, and in 1994 it began the mass abduction of children and youths. On 20 April 1995 a force under Vincent Otti overran Atiak, abducted the young and executed most of the remaining 200–300 captives. In October 1996 they took 139 girls from St Mary’s College at Aboke; the deputy headmistress, Sister Rachele Fassera, followed them and won the release of 109, but 30 were kept, and several died in captivity."
    facts:
      - [Operation North, "from March 1991"]
      - [Museveni’s ultimatum, "6 February 1994"]
      - [Atiak massacre, "20 April 1995"]
      - [Aboke abductions, "October 1996, 139 schoolgirls"]
