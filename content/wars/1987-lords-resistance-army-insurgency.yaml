  - title: The camps, Iron Fist and the spread of the war
    date: 1996 – 2004
    when: "2003-06"
    borders: "2003-06-01"
    countries: [ug, sd]
    body:
      - "From 1996 the government ordered the people of Acholiland to leave their homes within 48 hours and move into “protected villages”, later called camps for internally displaced people. By the early 2000s up to 1.5–2 million people, almost the whole rural population of the Acholi districts and many in Lango and Teso, lived in crowded, unsanitary camps that soldiers often failed to protect; the World Health Organization found that excess deaths in the camps, from disease and malnutrition, far exceeded the killings by the LRA. Every evening tens of thousands of children, the “night commuters”, walked into Gulu, Kitgum and other towns to sleep in safety."
      - "After the attacks of 11 September 2001 Sudan drew closer to the United States and allowed Uganda to strike the LRA on its territory. In March 2002 the Uganda People’s Defence Force launched Operation Iron Fist against the LRA’s bases in southern Sudan. The LRA escaped and returned to Uganda with a brutality not seen since the mid-1990s, and in 2003 it pushed east into Lango and Teso, including Soroti, which the war had never reached before. In February 2004 an LRA unit under Okot Odhiambo killed more than 300 people at the Barlonyo camp near Lira. In December 2003 Museveni referred the situation in northern Uganda to the new International Criminal Court."
    facts:
      - [People in camps, "up to 1.5–2 million at the peak"]
      - [Operation Iron Fist, "from March 2002"]
      - [Barlonyo massacre, "21 February 2004, more than 300 killed"]
      - [Referral to the ICC, "December 2003"]
    markers:
