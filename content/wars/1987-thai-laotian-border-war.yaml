id: thai-laotian-border-war
name: Thai–Laotian Border War
start: "1987-12-15"
end: "1988-02-19"
tier: C
summary: "A short war between Thailand and Laos over a disputed stretch of their border in the Luang Prabang range, around the village of Ban Rom Klao in Chat Trakan district of Phitsanulok province and Botene district of Sainyabuli province. The Franco-Siamese treaty of 1907 put the border on the watershed, but the French map drawn after it did not always follow it, and where a river split into two branches each side claimed a different one; logging in the disputed forest added to the friction. Clashes in 1984 over three villages on the border of Uttaradit province had already brought the two countries close to war. In December 1987 the Thai army moved to drive Lao troops from Hill 1428 above Ban Rom Klao, which both sides claimed, and the fighting grew into a two-month battle for the hill. Thai F-5 and other aircraft bombed the Lao positions, and Thailand lost two aircraft to Lao air defences; Vietnam, then allied with Laos, moved troops into Sainyabuli. The Lao forces kept the summit. After talks on 16–17 February 1988 a ceasefire took effect on 19 February, and both sides pulled back 3 km. Estimates of the dead range from about 100 to 200 Thai and some 300 Lao soldiers. The war hastened a change in Thai policy: the new prime minister, Chatichai Choonhavan, spoke in 1988 of turning the battlefields of Indochina into marketplaces, and the border was surveyed and largely demarcated in the following decades."
