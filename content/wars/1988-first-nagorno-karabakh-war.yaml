  - title: Kalbajar, Agdam and the ceasefire
    date: 1993–1994
    when: "1993-04-03"
    borders: "1994-05-12"
    countries: [az, am]
    body:
      - In spring 1993 Armenian forces broke out of Karabakh to the west. Kalbajar fell on 3 April, and about 60,000 Azerbaijani and Kurdish inhabitants fled over the mountains; the UN Security Council demanded a withdrawal in Resolution 822. Azerbaijan’s army was weakened by turmoil at home. In June a rebel colonel, Surat Huseynov, marched on Baku from Ganja, President Elchibey fled, and Heydar Aliyev, the former Soviet Azerbaijani leader, took power. Armenian forces took Agdam in July, then Fuzuli, Jabrayil and Qubadli in August and Zangilan in October, reaching the Iranian border, and three more UN resolutions followed.
      - Azerbaijan’s winter offensive, from December 1993, retook Horadiz on the Araxes, but failed with heavy losses in the snow at the Omar Pass above Kalbajar. Russian mediation produced the Bishkek Protocol in May 1994, and a ceasefire took effect on 12 May. Armenian forces held almost all of Nagorno-Karabakh and all or part of seven Azerbaijani districts around it. Estimates of the dead range from about 20,000 to more than 30,000. Some 724,000 Azerbaijanis had been driven from Armenia, Karabakh and the occupied districts, and 300,000–500,000 Armenians from Azerbaijan.
    facts:
      - [Fall of Kalbajar, "3 April 1993"]
      - [Ceasefire, "12 May 1994"]
      - [Displaced, "about 724,000 Azerbaijanis and 300,000–500,000 Armenians"]
