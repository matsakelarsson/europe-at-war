    polities: [azerbaijan]
    ink: teal
    moves: Azerbaijani moves
    success: Azerbaijani success
notes:
  - Nagorno-Karabakh and the surrounding districts are shown as part of Azerbaijan on the map, as they are internationally recognised. The self-proclaimed Nagorno-Karabakh Republic (later the Republic of Artsakh) was recognised by no member of the United Nations.
  - Many places have both Armenian and Azerbaijani names, such as Stepanakert (Khankendi), Shusha (Shushi), Mardakert (Aghdara) and Lachin (Berdzor). The more common English forms are used here.
  - Numbers of dead and displaced are estimates and are disputed; both sides’ official figures differ from independent ones.
