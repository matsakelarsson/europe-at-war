  - title: Khojaly, Shusha and Lachin
    date: 1992
    when: "1992-02-26"
    borders: "1992-07-04"
    countries: [az, am]
    body:
      - Through the winter of 1991–92 Azerbaijani forces bombarded Stepanakert with Grad rockets from Shusha, the old Azerbaijani-majority town on the heights above it, while Armenian fighters took Azerbaijani villages around the city. On 25–26 February 1992 Armenian forces, helped by some troops of the former Soviet 366th Regiment, took Khojaly, the site of the region’s airport. Civilians fleeing through the snow towards Agdam were shot down near Nakhichevanik. Azerbaijan gives the dead as 613; Human Rights Watch called it the largest massacre of the conflict and held Karabakh Armenian forces directly responsible. In April Azerbaijani forces killed dozens of Armenian villagers at Maraga.
      - On 8–9 May Armenian forces stormed Shusha, ending the bombardment, and on 18 May they took Lachin, opening a road to Armenia; the Azerbaijani inhabitants of both towns fled. The defeats cost President Ayaz Mutalibov his post, and in June the Popular Front leader Abulfaz Elchibey was elected president of Azerbaijan. That month Azerbaijan struck back with tanks inherited from the Soviet army, overrunning the Shahumyan district north of Karabakh and much of Mardakert, which fell on 4 July, and their Armenian inhabitants fled.
    facts:
      - [Fall of Khojaly, "25–26 February 1992"]
      - [Fall of Shusha, "8–9 May 1992"]
      - [Fall of Mardakert, "4 July 1992"]
