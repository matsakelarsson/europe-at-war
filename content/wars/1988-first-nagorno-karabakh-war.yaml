id: first-nagorno-karabakh-war
name: First Nagorno-Karabakh War
start: "1988-02-20"
end: "1994-05-12"
tier: B
summary: A war between Azerbaijan and the Armenians of Nagorno-Karabakh, backed by Armenia, over the Armenian-majority region inside Soviet Azerbaijan. It began as a campaign for union with Armenia in 1988, accompanied by pogroms and mutual expulsions, and became a full war as the Soviet Union collapsed. When a ceasefire took effect in May 1994, Armenian forces held Nagorno-Karabakh and seven surrounding Azerbaijani districts, and about a million people on both sides had been driven from their homes.
