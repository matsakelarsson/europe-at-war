steps:
  - title: Miatsum and the pogroms
    date: 1988–1991
    when: "1988-02-20"
    borders: "1991-12-31"
    countries: [az, am]
    body:
      - Nagorno-Karabakh, a mountainous autonomous region of Soviet Azerbaijan where about three-quarters of the people were Armenians, had long sought to join Soviet Armenia. Encouraged by Mikhail Gorbachev’s reforms, its regional soviet voted on 20 February 1988 to ask for the transfer, and vast crowds demonstrated in Yerevan for miatsum, “unification”. Moscow refused. Two young Azerbaijanis were killed in a clash near Askeran on 22 February, and from 27 to 29 February mobs in the industrial city of Sumgait, north of Baku, attacked Armenians; officially 32 people died, most of them Armenians, while Armenian sources put the toll much higher.
      - Over the next two years almost all Azerbaijanis left Armenia, and most Armenians left Azerbaijan outside Karabakh, often under threat of violence. In January 1990 a pogrom in Baku killed dozens of Armenians; on the night of 19–20 January Soviet troops stormed the city, officially to restore order and protect the Soviet authorities from the Popular Front, and killed about 130–150 civilians. In spring 1991, in Operation Ring, Soviet troops and Azerbaijani special police deported thousands of Armenians from villages around Karabakh. On 2 September 1991 the Karabakh Armenians proclaimed the Nagorno-Karabakh Republic; Azerbaijan abolished the region’s autonomy, and as Soviet troops withdrew the conflict became a war.
    facts:
      - [Vote of the Karabakh soviet, "20 February 1988"]
      - [Sumgait pogrom, "27–29 February 1988, officially 32 dead"]
      - [Black January, "19–20 January 1990, about 130–150 civilians killed"]
