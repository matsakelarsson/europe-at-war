id: operation-cactus
name: 1988 Maldives coup attempt (Operation Cactus)
start: "1988-11-03"
end: "1988-11-06"
tier: C
summary: "An attempt to overthrow President Maumoon Abdul Gayoom of the Maldives, defeated by an Indian intervention that India called Operation Cactus. Before dawn on 3 November 1988 between 80 and 200 armed members of the People’s Liberation Organisation of Tamil Eelam (PLOTE), a Sri Lankan Tamil militant group hired by the Maldivian businessman Abdullah Luthufi, who lived in Sri Lanka, landed in Malé from a ship. They seized parts of the capital, but failed to take the headquarters of the National Security Service, whose men held out, or to capture Gayoom, who went into hiding and appealed for help abroad. India answered within hours: about nine hours after the appeal, paratroopers of its 50th Independent Parachute Brigade, flown non-stop from Agra, landed at Hulhulé airport, crossed to Malé by boat and restored the government’s control that night. Some of the mercenaries fled with hostages on the hijacked freighter Progress Light; Indian frigates and aircraft caught it off Sri Lanka, fired on it after the mercenaries killed hostages, and on 6 November Indian navy commandos took the ship and its crew. Nineteen people died, most of them mercenaries, among them eight members of the Maldivian security service; India lost no one. The captured mercenaries were tried in the Maldives in 1989 and sentenced to death, later commuted to life imprisonment."
