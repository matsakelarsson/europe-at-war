notes:
  - "Accounts differ on the number of mercenaries, from about 80 to 200, and on the number of hostages killed, two or four. The former president Ibrahim Nasir was accused of backing the plot, which he denied; Gayoom pardoned him in 1990. The intervention strengthened ties between India and Gayoom and was welcomed by the United States and the United Kingdom."
