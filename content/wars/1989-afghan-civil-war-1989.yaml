notes:
  - The Uppsala Conflict Data Program counts about 15,000 battle deaths in 1989–1992; civilian deaths from shelling and rocket attacks on cities were many more. The mujahideen were supplied by Pakistan, the United States and Saudi Arabia until 1991–1992, and the government by the Soviet Union until the end of 1991.
  - The government changed its name to the Republic of Afghanistan in 1987 and its party, the PDPA, renamed itself the Watan (Homeland) Party in 1990, dropping communism.
