  - title: Khost, and the fall of Kabul
    date: 1991 – April 1992
    when: "1991-03-31"
    borders: "1992-04-28"
    countries: [af]
    body:
      - On 31 March 1991 mujahideen forces led by Jalaluddin Haqqani took Khost, near the Pakistani border, the first city to fall to them. The government held on as long as Soviet supplies arrived; but after the failed coup in Moscow in August 1991 the Soviet Union and the United States agreed to stop arming their sides from 1 January 1992, and the Soviet Union itself was dissolved. Fuel and food ran short. Najibullah agreed in March 1992 to step down in favour of a UN-sponsored interim government.
      - Dostum’s militia mutinied in the north and joined Massoud, and they took Mazar-i-Sharif. On 16 April Najibullah, trying to fly out of Kabul, was stopped at the airport and took refuge in the UN compound, where he stayed for four years. Massoud’s forces and Dostum’s militias, flown in by government aircraft, entered Kabul, while Hekmatyar’s fighters infiltrated from the south and were driven back. The mujahideen leaders agreed in the Peshawar Accord on 24–26 April to share power, and on 28 April the Islamic State of Afghanistan was proclaimed in Kabul, with Sibghatullah Mojaddedi as interim president.
    facts:
      - [Khost taken by the mujahideen, "31 March 1991"]
      - [Najibullah takes refuge in the UN compound, "16 April 1992"]
      - [Islamic State of Afghanistan proclaimed, "28 April 1992"]
