steps:
  - title: Jalalabad and the survival of Najibullah
    date: 1989–1990
    when: "1989-03-05"
    borders: "1990-03-06"
    countries: [af, pk]
    body:
      - In February 1989 the mujahideen parties in Peshawar formed an Afghan Interim Government, and Pakistan’s intelligence service urged them to take a city to house it. On 5 March some 10,000 or more fighters attacked Jalalabad, near the Pakistani border. They took the airfield’s outskirts and the post of Samarkhel, but government troops, who learned that captured soldiers had been killed, fought hard, and the air force and Scud missiles pounded the attackers. The siege dragged on until the summer and ended in failure, with thousands dead on both sides.
      - The defeat discredited the Interim Government, and the mujahideen parties quarrelled; in July 1989 Hekmatyar’s men ambushed and killed commanders of Massoud’s faction. On 6 March 1990 the defence minister, General Shahnawaz Tanai, a hardliner of the party’s Khalq faction, tried to overthrow Najibullah with air strikes on the presidential palace, in alliance with Hekmatyar; the coup failed, and Tanai fled to Pakistan. Najibullah dropped communism, offered a share of power and relied on militias such as Dostum’s Uzbek forces, paid with Soviet money.
    facts:
      - [Battle of Jalalabad, "5 March – July 1989, government victory"]
      - [Tanai’s coup attempt, "6 March 1990"]
