id: afghan-civil-war-1989
name: Afghan Civil War (1989–1992)
start: "1989-02-15"
end: "1992-04-28"
tier: B
summary: The war between the communist government of President Mohammad Najibullah and the mujahideen after the last Soviet troops left Afghanistan in February 1989. Most observers expected the government to fall quickly, but its army, militias and air force, still supplied by the Soviet Union, beat off a mujahideen assault on Jalalabad in 1989, and Najibullah survived a coup attempt by his own defence minister in 1990. The mujahideen took their first city, Khost, in March 1991. When the Soviet Union collapsed at the end of 1991, its aid stopped; Najibullah’s northern militia commanders, led by Abdul Rashid Dostum, went over to Ahmad Shah Massoud, and in April 1992 the government fell. Najibullah took refuge in the UN compound in Kabul, and the mujahideen parties proclaimed the Islamic State of Afghanistan, but they soon fell to fighting among themselves.
