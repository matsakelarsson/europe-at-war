  - title: Factions and failed accords
    date: 1993–1995
    when: "1994-09"
    borders: "1995-08-19"
    countries: [lr]
    body:
      - The war broke into more pieces. In 1993 the Liberia Peace Council of George Boley, a Krahn force with links to the AFL, attacked the NPFL in the south-east. ULIMO split in 1994 into ULIMO-J, a Krahn faction under Roosevelt Johnson, and ULIMO-K, a Mandingo faction under Alhaji Kromah, which fought each other in Bomi and Lofa. In September 1994 a coalition of the NPFL’s enemies and its own dissidents took Gbarnga; the NPFL retook it in December. Each faction lived off the land and the trade in timber, rubber and diamonds, and civilians were their main victims.
      - Agreements at Akosombo in September 1994 and Accra in December 1994 brought the factions’ leaders into the talks, and the Abuja Accord of 19 August 1995 set up a Council of State in which Taylor, Kromah and Boley’s allies sat together under a civilian chairman, Wilton Sankawulo.
    facts:
      - [ULIMO splits, "1994"]
      - [Coalition takes Gbarnga, "September 1994 (retaken by the NPFL in December)"]
      - [Abuja Accord, "19 August 1995"]
