  - title: Operation Octopus
    date: October 1992 – September 1993
    when: "1992-10-15"
    borders: "1993-06-06"
    countries: [lr, ng, gh]
    body:
      - On 15 October 1992 the NPFL launched Operation Octopus, a surprise assault on Monrovia from the east and north. Its fighters reached the city’s outskirts, and five American nuns were among those killed in the suburbs. ECOMOG, reinforced and now openly fighting alongside the AFL and ULIMO, used Nigerian jets and artillery to drive the NPFL back beyond the suburbs by the end of the year, and in 1993 it pushed inland, taking Kakata and the port of Buchanan and cutting Taylor off from the sea.
      - On the night of 5–6 June 1993 about 600 displaced people, mostly women and children, were killed at the Carter Camp near Harbel, the Firestone rubber plantation. The government and ECOMOG blamed the NPFL, but a United Nations panel concluded that AFL soldiers had done it. On 25 July 1993 the factions signed a peace agreement at Cotonou, and in September the UN Security Council set up an observer mission, UNOMIL, to work alongside ECOMOG.
    facts:
