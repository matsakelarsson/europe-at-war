  - title: Monrovia, 1990
    date: July – November 1990
    when: "1990-07-29"
    borders: "1990-09-09"
    countries: [lr, ng, gh, gn, sl, gm]
    view:
      center: [-10.77, 6.33]
      size: [70, 55]
    body:
      - "In July 1990 the NPFL and Johnson’s INPFL fought their way into Monrovia from different sides, while Doe held out in the Executive Mansion with his Krahn soldiers. On the night of 29 July government soldiers broke into St Peter’s Lutheran Church in Sinkor, where some 2,000 people, mostly Gio and Mano, had taken refuge, and killed about 600 of them. Both rebel forces also killed civilians they took for Krahn or Mandingo."
      - "The United States evacuated its citizens but would not intervene. The Economic Community of West African States set up a Ceasefire Monitoring Group, ECOMOG, led by Nigeria, and on 24 August 1990 about 4,000 troops from Nigeria, Ghana, Guinea, Sierra Leone and the Gambia landed at the Freeport. Taylor, who saw it as a Nigerian move to save Doe, fought them. On 9 September Doe drove to ECOMOG’s headquarters at the port, where Johnson’s men seized him; he was tortured on camera and killed. In November ECOWAS installed an Interim Government of National Unity under Amos Sawyer in Monrovia, which ECOMOG held."
    facts:
      - [St Peter’s Church massacre, "29 July 1990, about 600 killed"]
      - [ECOMOG lands, "24 August 1990"]
      - [Doe captured and killed, "9 September 1990"]
      - [Interim Government (Amos Sawyer), "November 1990"]
    markers:
