  - title: Greater Liberia and ULIMO
    date: 1990–1992
    when: "1991-06"
    borders: "1992-06-01"
    countries: [lr, sl, gn]
    body:
      - Taylor refused to recognise the Interim Government and ruled most of the country from Gbarnga as “Greater Liberia”, with its own currency and administration, financed by the sale of timber, rubber, iron ore and diamonds through Côte d’Ivoire and foreign companies. In March 1991 NPFL fighters helped Foday Sankoh’s Revolutionary United Front invade Sierra Leone, which had sent troops to ECOMOG. The peace agreements negotiated at Yamoussoukro in 1991 provided for disarmament under ECOMOG, but Taylor did not carry them out.
      - In 1991 Krahn and Mandingo exiles and former soldiers of Doe’s army formed the United Liberation Movement of Liberia for Democracy (ULIMO) in Sierra Leone and Guinea. In 1992 it pushed into western Liberia, taking much of Grand Cape Mount and Bomi counties and their diamond fields from the NPFL.
    facts:
      - [ULIMO founded, "1991"]
      - [RUF invasion of Sierra Leone, "March 1991"]
