        date: 9 September 1990
        text: ECOMOG landed here on 24 August. Doe was seized here by Johnson’s INPFL and killed.
        lonlat: [-10.80, 6.35]
        lp: t
      - kind: held
        side: gov
        name: Executive Mansion
