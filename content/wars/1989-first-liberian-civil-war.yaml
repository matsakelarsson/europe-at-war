notes:
  - The factions were largely drawn from particular peoples, the NPFL and INPFL from the Gio (Dan) and Mano of Nimba, the AFL, ULIMO-J and the LPC from the Krahn, and ULIMO-K from the Mandingo, and all of them killed civilians of the peoples they saw as enemies. But they were led by politicians and soldiers seeking power and the country’s timber, diamonds, rubber and iron ore, and alliances shifted often.
  - "Figures are uncertain. No reliable count of the dead exists; figures of up to about 200,000 for 1989–1996 are often cited, and estimates for this war and the second Liberian civil war (1999–2003) together exceed 250,000. About a million Liberians were displaced inside the country or fled to Guinea, Côte d’Ivoire and Sierra Leone."
  - All the factions used child soldiers, and torture, rape and mutilation were widespread. ECOMOG was itself accused of looting and of arming factions opposed to Taylor; Liberians joked that its name stood for “Every Car Or Moving Object Gone”.
