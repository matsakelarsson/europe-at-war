id: first-liberian-civil-war
name: First Liberian Civil War
start: "1989-12-24"
end: "1997-08-02"
tier: A
summary: "The war that began when Charles Taylor’s National Patriotic Front of Liberia (NPFL) crossed from Côte d’Ivoire into Nimba County on 24 December 1989 to overthrow President Samuel Doe. Thousands of Gio and Mano, whom Doe’s mostly Krahn army had persecuted, joined the rebels, and by mid-1990 they had overrun most of the country and besieged Monrovia, where government soldiers massacred some 600 refugees in a Lutheran church. A breakaway faction under Prince Johnson captured and killed Doe on 9 September 1990, soon after the West African intervention force ECOMOG landed at Monrovia. Taylor ruled most of the country from Gbarnga as “Greater Liberia”, while an interim government sat in Monrovia under ECOMOG’s protection. New factions, ULIMO and the Liberia Peace Council, fought the NPFL; Taylor’s assault on Monrovia, Operation Octopus, was beaten back in 1992; and more than a dozen peace agreements failed before the Abuja accords of 1995 and 1996. After fighting devastated Monrovia again in April 1996, the factions disarmed, and Taylor won the election of July 1997 by a landslide. The war killed tens of thousands of people, by many estimates up to about 200,000, drove about a million from their homes and used thousands of child soldiers."
countries: [lr, ng, gh, gn, sl, ci]
