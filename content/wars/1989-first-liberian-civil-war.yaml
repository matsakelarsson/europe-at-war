steps:
  - title: Christmas Eve 1989
    date: December 1989 – June 1990
    when: "1989-12-24"
    borders: "1990-06-01"
    countries: [lr, ci]
    body:
      - Master Sergeant Samuel Doe, a Krahn, seized power on 12 April 1980 in a coup that killed President William Tolbert and ended more than a century of rule by the True Whig Party, dominated by Americo-Liberians, the descendants of freed slaves from the United States. Doe filled the army with Krahn, stole the 1985 election, and after a failed coup by his former comrade Thomas Quiwonkpa, a Gio from Nimba, in November 1985, his soldiers killed hundreds of Gio and Mano in Nimba County. The United States, which valued Liberia in the Cold War, gave his government large amounts of aid in the early 1980s.
      - "On 24 December 1989 Charles Taylor, a former official of Doe’s government who had escaped from an American jail, crossed from Côte d’Ivoire at Butuo with a small force of about a hundred men trained in Libya, with help from Burkina Faso. The army’s reprisals in Nimba drove thousands of Gio and Mano to join him. The NPFL advanced through Ganta and Gbarnga, took the port of Buchanan on 22 May 1990, and by June it held most of the country and was closing on Monrovia. Prince Johnson, one of Taylor’s commanders, broke away to form his own Independent NPFL."
    facts:
      - [Doe’s coup, "12 April 1980"]
      - [NPFL invasion, "24 December 1989"]
      - [Buchanan taken, "22 May 1990"]
