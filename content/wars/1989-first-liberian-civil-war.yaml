  - title: The battle of Monrovia and the 1997 election
    date: April 1996 – August 1997
    when: "1996-04-06"
    borders: "1997-08-02"
    countries: [lr, ng]
    body:
      - "On 6 April 1996 the Council of State, now dominated by Taylor and Kromah, sent fighters to arrest Roosevelt Johnson on a murder charge. His ULIMO-J and AFL soldiers resisted, and Monrovia was again a battlefield for weeks: the factions looted the city, aid agencies lost almost everything, and thousands of people sheltered in the Barclay Training Center and the American embassy compound. American forces evacuated more than 2,000 foreigners in Operation Assured Response."
      - "A revised Abuja agreement of August 1996 set a timetable for disarmament and elections and made Ruth Perry chair of the Council of State, the first woman to lead an African state in modern times. Disarmament under ECOMOG took place from November 1996 to early 1997. In the election of 19 July 1997 Taylor won about 75% of the votes against twelve rivals, among them Ellen Johnson Sirleaf; many voters feared that he would go back to war if he lost. He was inaugurated on 2 August 1997. Fighting began again in 1999."
    facts:
      - [Battle of Monrovia, "from 6 April 1996"]
      - [Revised Abuja Accord, "August 1996"]
      - [Election, "19 July 1997; Taylor about 75%"]
      - [Taylor inaugurated, "2 August 1997"]
    markers:
      - kind: battle
        side: none
        name: Monrovia
        date: April – May 1996
        text: The NPFL and ULIMO-K fought ULIMO-J and the AFL in the capital; most of it was looted.
        lonlat: [-10.80, 6.31]
        lp: l
      - kind: capital
        side: npfl
        name: Gbarnga
        date: 1996–1997
        text: Taylor’s base until he moved to Monrovia as president.
        lonlat: [-9.47, 7.00]
