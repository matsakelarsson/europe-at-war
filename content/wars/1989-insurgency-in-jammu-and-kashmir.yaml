  - title: Summers of protest
    date: 2008–2019
    when: "2016-07-08"
    borders: "2016-07-08"
    countries: [in, pk]
    body:
      - "In 2008, 2010 and 2016 the valley rose in mass protests in which young men threw stones at security forces, who answered with tear gas, bullets and, increasingly, shotguns firing pellets. In 2010, after soldiers killed three villagers at Machil and passed them off as infiltrators, about 110 protesters were killed. A new generation of local militants, recruited through social media, gathered around the Hizbul Mujahideen commander Burhan Wani. His killing by security forces near Kokernag on 8 July 2016 set off months of unrest in which nearly 100 civilians were killed and thousands were wounded by pellets, hundreds of them in the eyes."
      - "On 18 September 2016 militants attacked an army base at Uri, killing 19 soldiers; India blamed Jaish-e-Mohammed and on 29 September announced “surgical strikes” on militant launch pads across the Line of Control, which Pakistan said had not taken place. In June 2018 the UN human rights office published its first report on Kashmir, criticising excessive force by Indian forces and abuses in Pakistan-administered Kashmir; India rejected it. On 14 February 2019 a Jaish suicide car bomber killed 40 paramilitary policemen at Lethpora near Pulwama, which led to air strikes between India and Pakistan."
    facts:
