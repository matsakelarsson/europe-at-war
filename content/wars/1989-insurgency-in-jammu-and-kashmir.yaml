id: insurgency-in-jammu-and-kashmir
name: Insurgency in Jammu and Kashmir
start: "1989-07"
end: ongoing
tier: A
summary: "The armed insurgency against Indian rule in Jammu and Kashmir, the Muslim-majority region whose status India and Pakistan have disputed since 1947. It broke out in 1989 after a widely disputed state election, first led by the pro-independence JKLF and then by pro-Pakistan groups such as Hizbul Mujahideen and Pakistan-based organisations such as Lashkar-e-Taiba and Jaish-e-Mohammed. India accuses Pakistan of arming and sending the militants; Pakistan says it gives the Kashmiris only moral, political and diplomatic support. Most of the valley’s Kashmiri Hindus (Pandits) fled in 1990, and both the militants and the Indian security forces were accused of grave abuses. Violence peaked around 2001, fell during the peace process of 2004–2008, and revived in waves of protest and local militancy. In 2019 India revoked the region’s special status and divided the state. The Indian government counted about 41,000 deaths by 2017; other estimates are much higher. In 2026 violence was at its lowest level since 1989, but attacks continued."
countries: [in, pk]
