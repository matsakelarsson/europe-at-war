  - title: Suicide squads and the peace process
    date: 1999–2008
    when: "2001-10-01"
    borders: "2001-10-01"
    countries: [in, pk]
    body:
      - "After the Kargil War, Lashkar-e-Taiba and the new Jaish-e-Mohammed, founded in 2000 by Masood Azhar, whom India had freed in exchange for the hostages of a hijacked airliner in December 1999, sent fidayeen (suicide squads) against army camps and police posts. On 20 March 2000 gunmen killed 35 Sikh villagers at Chittisinghpura; days later five men said to be the killers were shot dead at Pathribal, a killing India’s Central Bureau of Investigation later called staged. On 1 October 2001 a Jaish car bomb and gunmen at the state assembly in Srinagar killed 38 people, and the attack on India’s parliament that December brought India and Pakistan to the brink of war. In May 2002 militants killed 31 people, many of them soldiers’ wives and children, at Kaluchak near Jammu, and in March 2003 24 Pandits at Nadimarg."
      - "A ceasefire on the Line of Control in November 2003, an Indian fence along the line and a pledge by President Musharraf in January 2004 not to let territory under Pakistan’s control be used for terrorism opened four years of talks. A bus service between Srinagar and Muzaffarabad began in 2005, and violence fell from more than 4,000 deaths in 2001 to about 540 in 2008. The attack on Mumbai by Lashkar-e-Taiba gunmen in November 2008 ended the peace process."
    facts:
      - [Chittisinghpura massacre, "20 March 2000"]
      - [Assembly bombing in Srinagar, "1 October 2001"]
      - [Line of Control ceasefire, "November 2003"]
      - [Srinagar–Muzaffarabad bus, "from April 2005"]
