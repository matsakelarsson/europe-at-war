        date: 22 April 2025
        text: Gunmen came out of the forest above the Baisaran meadow and shot tourists, the deadliest attack on civilians in Kashmir in two decades.
        lonlat: [75.334, 34.003]
      - kind: event
        name: Nowgam
        date: 14 November 2025
        text: Seized explosives being examined at the police station exploded, killing nine people, most of them police and forensic staff.
        lonlat: [74.826, 34.029]
        lp: l
      - kind: event
        side: mil
