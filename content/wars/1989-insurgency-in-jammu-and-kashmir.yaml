        date: January and November 2026
        text: The forests of Kishtwar sheltered the most active militant groups in 2026.
        lonlat: [75.769, 33.311]
      - kind: event
        side: in
        name: Kulgam
        date: November 2026
        text: After an attack on a checkpoint, security forces killed two militants in operations that residents protested against.
        lonlat: [75.019, 33.645]
