notes:
  - "The militant groups differed in their aims: the Jammu and Kashmir Liberation Front (JKLF) wanted an independent Kashmir, Hizbul Mujahideen union with Pakistan, and groups such as Lashkar-e-Taiba and Jaish-e-Mohammed, based in Pakistan, also framed the struggle as a jihad. India, the United States and the UN list several of them as terrorist organisations. India holds that Pakistan’s army and intelligence service have trained, armed and infiltrated militants across the Line of Control; Pakistan denies sponsoring militancy and supports the Kashmiris’ right to self-determination under UN resolutions of 1948–1949."
  - "Casualty figures differ widely. The Indian government counted about 41,000 deaths from 1990 to early 2017: some 14,000 civilians, 5,000 security personnel and 22,000 militants. Human Rights Watch estimated in 2006 that at least 20,000 civilians had died, and Kashmiri civil society groups give figures of 70,000 or more. Rights groups say more than 8,000 people disappeared after arrest, and in 2011 the state’s human rights commission reported 2,730 bodies in unmarked graves in four districts. Militants killed Kashmiri Pandits, Sikhs, politicians, suspected informers and many Kashmiri Muslims."
  - The base map shows the territory each state administers; the insurgency was fought in Indian-administered Jammu and Kashmir. The 1947–1948 war over Kashmir and the wars and crises between India and Pakistan of 1965, 1971, 1999, 2001–2002, 2019 and 2025 have their own entries.
