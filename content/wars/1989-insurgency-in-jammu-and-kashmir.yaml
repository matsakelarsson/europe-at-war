  - title: Hizbul Mujahideen and the foreign fighters
    date: 1990–1999
    when: "1993-10-15"
    borders: "1993-10-15"
    countries: [in, pk]
    body:
      - "Hizbul Mujahideen, founded in 1989 and backed by Pakistan, wanted Kashmir to join Pakistan, and in the early 1990s it overtook the JKLF, whose fighters it fought; in 1994 the JKLF’s Yasin Malik, released from prison, declared a ceasefire. The separatist parties formed the All Parties Hurriyat Conference in 1993. Indian troops and paramilitaries cordoned and searched whole neighbourhoods; there were custodial killings and torture, and villagers of Kunan and Poshpora accused soldiers of mass rape in February 1991, which the army denied. A month-long siege of militants in the Hazratbal shrine in Srinagar ended in a negotiated surrender in November 1993; in May 1995 the town and shrine of Charar-e-Sharief burned during a standoff between the army and militants."
      - "From the mid-1990s militants from Pakistan and Afghanistan took a growing part, above all Harkat-ul-Ansar and Lashkar-e-Taiba. In July 1995 a group calling itself Al-Faran kidnapped six Western trekkers near Pahalgam; one was beheaded, one escaped and four were never found. India raised militias of surrendered militants, the Ikhwan, who were accused of many killings, and held a state election in 1996. Militants massacred Hindu villagers, among them 23 Kashmiri Pandits at Wandhama in January 1998."
    facts:
      - [Hurriyat Conference formed, "1993"]
      - [Siege of Hazratbal, "October – November 1993"]
      - [Charar-e-Sharief burned, "May 1995"]
      - [Wandhama massacre, "25 January 1998"]
