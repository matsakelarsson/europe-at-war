  - title: The end of special status
    date: 2019–2024
    when: "2019-08-05"
    borders: "2019-10-31"
    countries: [in, pk]
    body:
      - "On 5 August 2019 the Indian government revoked the special status of Jammu and Kashmir under Article 370, and on 31 October it split the state into two union territories ruled from Delhi, Jammu and Kashmir and Ladakh. Tens of thousands of extra troops were sent in, phone and internet links were cut, with mobile internet restored only in stages until February 2021, and thousands of people were detained, among them three former chief ministers. The government said the change would end militancy and bring investment; Pakistan downgraded diplomatic ties and suspended trade."
      - "Militancy changed shape. New groups such as The Resistance Front (TRF) and the People’s Anti-Fascist Front, which India regards as fronts for Lashkar-e-Taiba and Jaish-e-Mohammed, carried out targeted killings of Kashmiri Pandits, Sikhs, workers from other states and local police in 2021–2022. Attacks also moved south of the Pir Panjal range, to the forests of Rajouri and Poonch, where ambushes killed dozens of soldiers in 2021–2024, and on 9 June 2024 gunmen attacked a bus of Hindu pilgrims near Reasi, killing nine. India and Pakistan renewed their ceasefire on the Line of Control in February 2021. In the first assembly elections in ten years, in September–October 2024, the National Conference won, and Omar Abdullah became chief minister, but statehood was not restored."
    facts:
      - [Article 370 revoked, "5 August 2019"]
      - [Union territories created, "31 October 2019"]
      - [Reasi bus attack, "9 June 2024"]
      - [Assembly elections, "September – October 2024"]
    markers:
