  - title: Pahalgam and after
    date: 2025–2026
    when: "2025-04-22"
    borders: "2026-11-27"
    countries: [in, pk]
    body:
      - "Last updated 27 November 2026. On 22 April 2025 gunmen killed 26 civilians, most of them Hindu tourists, at the Baisaran meadow above Pahalgam, singling out non-Muslim men. The Resistance Front claimed the attack and then withdrew the claim; Pakistan denied any role and called for a neutral investigation. India held Pakistan responsible, suspended the Indus Waters Treaty and in May 2025 struck targets in Pakistan, which led to four days of fighting between the two countries. In July 2025 Indian forces killed three men they identified as the attackers near Srinagar."
      - "On 10 November 2025 a car bomb near the Red Fort in Delhi killed at least 13 people. Investigators linked it to a network of doctors from Kashmir, working in Faridabad near Delhi, that the police said had ties to Jaish-e-Mohammed and had been uncovered days before; on 14 November explosives seized from the network blew up by accident at the Nowgam police station in Srinagar, killing nine people."
      - "In 2026 violence fell to its lowest level since 1989. By the count of the South Asia Terrorism Portal, four security personnel and two civilians were killed in Jammu and Kashmir up to 22 November, and the police said local recruitment had fallen almost to zero. Militants, many of them from Pakistan, remained active in the forests of the Jammu region: an ambush in Kishtwar in January killed a soldier and wounded eight, and in November the bodies of two special police officers were found there. In Kulgam militants fired on a paramilitary checkpoint on 11 November, and security forces killed two militants there on 16 and 18 November. Statehood had still not been restored; on 16 November Deputy Chief Minister Surinder Choudhary asked when the “last” militant would be eliminated, and the former chief minister Mehbooba Mufti called the Kulgam operations collective punishment. Indian officials said hundreds of militants were waiting at launch pads across the Line of Control; whether the lull will last is uncertain."
    facts:
      - [Pahalgam attack, "22 April 2025, 26 killed"]
      - [Red Fort car bomb, "10 November 2025"]
      - [Security forces killed in 2026, "4, the first single-digit figure since 1989 (SATP, to 22 November)"]
