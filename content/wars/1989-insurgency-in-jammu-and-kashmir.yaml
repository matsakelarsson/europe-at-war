steps:
  - title: The 1987 election and the uprising
    date: 1987–1990
    when: "1990-01-21"
    borders: "1990-01-21"
    countries: [in, pk]
    body:
      - "Since the war of 1947–1948 Kashmir had been divided along a ceasefire line, later the Line of Control. The Indian state of Jammu and Kashmir had a special autonomy under Article 370 of the constitution, but it had been whittled away, and many Kashmiris resented governments they saw as installed from Delhi. The state election of March 1987, won by the National Conference in alliance with the Congress party, was widely believed to have been rigged against the Muslim United Front, and several of the Front’s young workers and candidates, among them Yasin Malik and Mohammad Yusuf Shah (later known as Syed Salahuddin), crossed into Pakistan-administered Kashmir to train for armed struggle."
      - "The pro-independence Jammu and Kashmir Liberation Front (JKLF) began a campaign of bombings and killings in 1988–1989. In December 1989 it kidnapped Rubaiya Sayeed, daughter of India’s home minister, and won the release of five militants, to cheering crowds. In January 1990 Delhi appointed Jagmohan governor, Chief Minister Farooq Abdullah resigned, and on 21 January paramilitary police fired on protesters at the Gawkadal bridge in Srinagar, killing at least 50 people by most counts. Huge demonstrations for azadi (freedom) filled the streets, and the Armed Forces Special Powers Act was extended to the state that year."
      - "Militants killed Hindu officials, judges and others, and threats were broadcast from some mosques. Between January and March 1990 most of the valley’s Kashmiri Pandits, more than 100,000 people by most estimates, fled to Jammu, Delhi and elsewhere; many lived for years in camps. Whether they were driven out by a deliberate campaign of the militants or encouraged to leave by the administration has been bitterly argued ever since. In May 1990, after militants killed the Mirwaiz, Kashmir’s chief preacher, security forces fired on his funeral procession, killing dozens."
    facts:
      - [State election, "23 March 1987"]
      - [Rubaiya Sayeed kidnapping, "December 1989"]
      - [Gawkadal shooting, "21 January 1990"]
      - [Exodus of Kashmiri Pandits, "January – March 1990"]
