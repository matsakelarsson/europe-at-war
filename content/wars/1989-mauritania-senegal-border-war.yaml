steps:
  - title: Diawara and the riots of April 1989
    date: April – May 1989
    when: "1989-04-09"
    borders: "1989-04-09"
    countries: [mr, sn]
    body:
      - "The Senegal River had long been less a frontier than a shared valley: Halpulaar, Soninke and Wolof farmers on both banks were kin, herders crossed it with their cattle, and tens of thousands of Mauritanian Moors kept shops in Senegalese towns while Senegalese worked in Mauritania. In the 1980s the Diama and Manantali dams promised year-round irrigation and made the land of the valley valuable. A Mauritanian land reform of 1983 let the state and well-connected Moorish businessmen take over land that Black Mauritanian villages farmed by custom, while the government’s policy of Arabisation and the arrest and execution of Halpulaar officers accused of a coup plot in 1987 sharpened ethnic fear."
      - "On 9 April 1989, at Diawara near Bakel, Fulani herders from the Mauritanian bank and Soninke farmers on the Senegalese side quarrelled over cattle in the fields; Mauritanian border guards opened fire, killed two Senegalese and took others away. In Senegal, where the economy was in crisis and the government had been shaken by riots after the 1988 election, crowds attacked and looted the shops of Mauritanian traders. In Nouakchott and Nouadhibou mobs, joined by security forces, killed Senegalese residents and Black Mauritanians taken for Senegalese, and in Dakar crowds killed Mauritanians in reprisal. Estimates of the dead differ widely; most put them at about 200 Senegalese and dozens of Mauritanians."
      - "From late April an air and sea bridge with planes and ships from France, Spain, Algeria and Morocco took some 250,000 people home in both directions: Mauritanian traders and their families from Senegal, and Senegalese from Mauritania. Many had lived for decades in the country they now left, and lost their property."
    facts:
      - [Incident at Diawara, "9 April 1989"]
      - [People repatriated, "about 250,000"]
