id: mauritania-senegal-border-war
name: Mauritania–Senegal Border War
start: "1989-04-09"
end: "1991-07-18"
tier: B
summary: "A conflict between Mauritania and Senegal that began with a quarrel over grazing land on the Senegal River in April 1989 and grew into riots, killings and mass expulsions in both countries and two years of clashes along the river. After Mauritanian border guards killed two Senegalese farmers at Diawara on 9 April 1989, crowds in Senegal attacked the shops of Mauritanian traders, and in Nouakchott and Nouadhibou mobs and security forces killed Senegalese residents; hundreds died in the last weeks of April, by most estimates some 200 Senegalese in Mauritania and dozens of Mauritanians in Senegal. With help from France, Spain, Algeria and Morocco about 250,000 people were taken home by air and sea. Mauritania also expelled tens of thousands of its own Black citizens, most of them Halpulaar (Fulani) of the river valley, into Senegal and Mali. The two countries broke off relations in August 1989, and from October their armies exchanged fire across the river, Mauritania with Iraqi arms and Senegal backing the African Liberation Forces of Mauritania (FLAM). In 1990–1991 the Mauritanian government arrested some 3,000 Black soldiers and officials, of whom more than 500 were killed in detention. A peace treaty was signed on 18 July 1991 and the border reopened in May 1992. Between 2008 and 2012 some 24,000 refugees returned to Mauritania with UNHCR’s help; about 14,000 chose to stay in Senegal."
countries: [mr, sn, ml]
sides:
  - id: mr
    name: Mauritania (Maaouya Ould Sid’Ahmed Taya)
    polities: [mauritania]
    ink: green
    moves: Mauritanian moves
    success: Mauritanian success
  - id: sn
    name: Senegal (Abdou Diouf)
    polities: [senegal]
    ink: red
    moves: Senegalese moves
    success: Senegalese success
notes:
  - Sources give 8 or 9 April 1989 for the incident at Diawara, and they differ on the order of the riots and on the number of dead in each country. Mauritanians call the killings and expulsions of 1989–1991 the “humanitarian liability” (passif humanitaire).
  - In Mauritania the Arabic-speaking Moors (Beydane and Haratin) formed the majority and held power; the Halpulaar, Soninke and Wolof, called Black Mauritanians or Afro-Mauritanians in the sources, lived mainly along the Senegal River.
