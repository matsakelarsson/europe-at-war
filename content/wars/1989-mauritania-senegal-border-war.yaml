  - title: The “humanitarian liability” and the return
    date: 1990–2012
    when: "1990-10"
    borders: "1990-11-28"
    countries: [mr, sn]
    body:
      - "In late 1990 the Mauritanian government announced that it had uncovered a coup plot by Black officers. Between October 1990 and January 1991 some 3,000 Black soldiers and civil servants were arrested; by Human Rights Watch’s count more than 500 of them were executed or died under torture in detention. At the military post of Inal, on the night of 27–28 November 1990, as the country marked thirty years of independence, 28 Black soldiers were hanged; Amnesty International gave a higher figure. An amnesty law of 1993 shielded those responsible, and the families of the dead still campaign for an inquiry."
      - "After Taya’s fall in 2005, President Sidi Ould Cheikh Abdallahi acknowledged the abuses and invited the refugees home. Under an agreement between Mauritania, Senegal and UNHCR, convoys took 24,272 people back across the river between January 2008 and March 2012; many returned to find their land taken and struggled to recover their identity papers. About 14,000 chose to stay in Senegal, which offered them local integration."
    facts:
      - [Hangings at Inal, "night of 27–28 November 1990"]
      - [Refugees returned with UNHCR, "24,272 (2008–2012)"]
    markers:
