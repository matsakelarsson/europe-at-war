  - title: Expulsions and the border war
    date: May 1989 – July 1991
    when: "1989-05"
    borders: "1990-01-01"
    countries: [mr, sn, ml]
    body:
      - "Under cover of the repatriations, the Mauritanian authorities expelled tens of thousands of their own Black citizens, most of them Halpulaar herders and farmers of the river valley, together with Soninke and Wolof. Soldiers and officials took their identity papers, herds and land and drove them across the river into Senegal or into Mali; estimates run to 60,000–70,000 people. Haratin and Moorish settlers were moved onto some of the abandoned land. The refugees settled in camps and villages along the Senegalese bank, where many stayed for twenty years."
      - "Senegal and Mauritania broke off diplomatic relations on 21 August 1989 and closed the border. Mediation by the Organisation of African Unity and by Egypt’s Hosni Mubarak failed over compensation and over where the border ran in the river. From October 1989 the two armies traded fire across the river, and in January 1990 there was a heavy artillery duel near Doundou. Iraq supplied Mauritania with arms and advisers, and Senegal let the African Liberation Forces of Mauritania (FLAM), a movement of exiled Black Mauritanians, raid across the river. Neither side launched a full invasion. A peace treaty was signed on 18 July 1991; relations were restored in April 1992 and the border reopened to civilians on 2 May 1992."
