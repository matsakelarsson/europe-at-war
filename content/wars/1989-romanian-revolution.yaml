id: romanian-revolution
name: Romanian Revolution
start: "1989-12-16"
end: "1989-12-27"
tier: B
summary: The violent overthrow of Nicolae Ceaușescu’s communist dictatorship in December 1989, after protests that began in Timișoara on 16 December spread to Bucharest, where the army turned against the regime on 22 December. Ceaușescu and his wife Elena fled, were captured, tried by a military tribunal and shot on 25 December; most of the 1,104 people killed died in confused fighting after the National Salvation Front had taken power.
countries: [ro]
sides:
  - id: reg
    name: Ceaușescu regime (Securitate, militia and, until 22 December, the army)
    polities: [romania]
    ink: slate
    moves: Regime moves
    success: Regime success
  - id: rev
    name: Protesters, then the army and the National Salvation Front
    ink: orange
    moves: Revolutionary moves
    success: Revolutionary success
notes:
  - Who fired on the crowds and the army after 22 December, the so-called terrorists, has never been fully established. Many deaths were caused by soldiers, militiamen and armed civilians firing on each other in confusion, and whether the revolution was a popular uprising or was taken over by a group within the party and army is still debated in Romania. Ion Iliescu and others were indicted in 2019 for crimes against humanity over the events after 22 December.
  - Official figures give 1,104 dead, 162 of them in the protests up to 22 December and 942 afterwards, and some 3,350 wounded.
