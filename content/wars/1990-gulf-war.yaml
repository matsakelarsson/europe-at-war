  - title: Desert Shield
    date: August 1990 – January 1991
    when: "1990-08-07"
    borders: "1990-11-29"
    countries: [sa, kw, iq, us]
    body:
      - Fearing that Iraq would move on the Saudi oil fields, King Fahd agreed on 6 August to let US troops into the kingdom, and the first arrived the next day. Over five months the United States, Britain, France, Egypt, Syria, the Gulf states and some 25 other countries built up a force of more than 900,000 troops, about 700,000 of them American, under US General Norman Schwarzkopf and Saudi Prince Khalid bin Sultan. Japan and Germany, which sent no combat troops, paid a large part of the costs.
      - Iraq held thousands of Western and other foreigners as hostages, some at military and industrial sites as “human shields”, until December. Diplomacy failed; Saddam offered to withdraw only if Israel left the occupied Palestinian territories, which the coalition rejected. On 29 November the Security Council, in Resolution 678, authorised member states to use “all necessary means” if Iraq did not leave Kuwait by 15 January 1991. On 12 January the US Congress authorised the use of force.
    facts:
      - [First US troops arrive, "7 August 1990"]
      - [Coalition forces, "more than 900,000, from about 35 countries"]
      - [Resolution 678, "29 November 1990, deadline 15 January 1991"]
