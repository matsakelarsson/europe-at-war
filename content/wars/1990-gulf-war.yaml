  - title: The air war
    date: 17 January – 23 February 1991
    when: "1991-01-17"
    borders: "1991-01-17"
    countries: [iq, kw, sa, il]
    body:
      - In the early hours of 17 January 1991 coalition aircraft and cruise missiles began the air campaign of Operation Desert Storm. In about 100,000 sorties over five and a half weeks they destroyed Iraq’s air defences, command centres, power stations, bridges and suspected weapons plants, and pounded the Iraqi army in Kuwait and southern Iraq. On 13 February two US bombs destroyed the Amiriyah shelter in Baghdad, which the United States believed was a command bunker, killing 408 civilians sheltering there.
      - Iraq fired some 88 Scud missiles at Israel and Saudi Arabia, trying to draw Israel into the war and split the Arab members of the coalition. Israel, under US pressure, did not retaliate. On 25 February a Scud hit a US barracks at Dhahran, killing 28 soldiers. Late in January Iraqi forces released millions of barrels of crude oil into the Gulf, and on 29 January Iraqi troops raided across the border and took the empty Saudi town of Khafji, which Saudi and Qatari troops, with US air and artillery support, retook on 1 February.
    facts:
      - [Air campaign, "17 January – 23 February 1991"]
      - [Amiriyah shelter, "13 February 1991, 408 civilians killed"]
      - [Battle of Khafji, "29 January – 1 February 1991"]
