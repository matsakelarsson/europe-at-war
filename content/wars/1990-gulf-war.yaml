  - title: The 100-hour ground war
    date: 24–28 February 1991
    when: "1991-02-24"
    borders: "1991-02-28"
    countries: [kw, iq, sa]
    body:
      - The ground offensive began on 24 February. US Marines and Saudi, Egyptian, Syrian and Gulf troops broke through the Iraqi lines in Kuwait, while far to the west, in the “left hook”, the US XVIII Airborne Corps and French troops drove deep into the Iraqi desert to the Euphrates, and the US VII Corps, with a British division, swung north and then east to destroy the Republican Guard. Many Iraqi conscripts, short of food after weeks of bombing, surrendered in their thousands.
      - On 26 February Saddam ordered his forces out of Kuwait. Coalition aircraft attacked the columns of vehicles fleeing north on the road past Mutla Ridge, which became known as the Highway of Death. Coalition and Kuwaiti forces entered Kuwait City on 26–27 February. In the last two days US armoured divisions fought the Republican Guard in some of the largest tank battles since 1945, but several Republican Guard divisions escaped through Basra. President George H. W. Bush declared a ceasefire on 28 February, after 100 hours of ground fighting. The retreating Iraqi forces set fire to more than 600 oil wells, which burned until November 1991.
    facts:
      - [Ground offensive, "24–28 February 1991"]
      - [Kuwait City retaken, "26–27 February 1991"]
      - [Oil wells set on fire, "more than 600"]
