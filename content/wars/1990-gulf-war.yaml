steps:
  - title: Iraq invades Kuwait
    date: August 1990
    when: "1990-08-02"
    borders: "1990-08-08"
    countries: [iq, kw]
    body:
      - Iraq ended its war with Iran in 1988 owing tens of billions of dollars, much of it to Kuwait and Saudi Arabia. Saddam Hussein demanded that the debts be forgiven, accused Kuwait of keeping oil prices low by producing above its OPEC quota and of slant-drilling into the Rumaila field on the border, and massed troops on the frontier in July 1990. Talks in Jeddah broke down on 1 August.
      - Early on 2 August about 100,000 Iraqi troops of the Republican Guard crossed the border, while helicopters landed commandos in Kuwait City. Kuwait’s small army was overwhelmed within a day. The emir, Sheikh Jaber al-Ahmad, escaped to Saudi Arabia, but his brother Sheikh Fahad was killed defending the Dasman Palace. Iraq set up a puppet “Provisional Free Government”, announced the annexation of Kuwait on 8 August and made it Iraq’s 19th province on 28 August. The UN Security Council demanded withdrawal the same day as the invasion (Resolution 660), imposed a trade embargo on 6 August (661) and declared the annexation void on 9 August (662).
    facts:
      - [Invasion, "2 August 1990"]
      - [Annexation announced, "8 August 1990"]
      - [UN Security Council resolutions, "660 (2 August), 661 (6 August), 662 (9 August)"]
