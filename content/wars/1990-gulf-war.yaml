        lonlat: [47.71, 30.11]
      - kind: event
        side: iq
        name: Basra
        date: March 1991
        text: Retreating soldiers began the uprising in the south here; it was crushed within weeks.
        lonlat: [47.78, 30.51]
        lp: l
