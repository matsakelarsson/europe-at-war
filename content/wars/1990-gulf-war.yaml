id: gulf-war
name: Gulf War
start: "1990-08-02"
end: "1991-04-11"
tier: A
summary: The war that followed Iraq’s invasion and annexation of Kuwait on 2 August 1990. Saddam Hussein’s government, deep in debt after the war with Iran, accused Kuwait of overproducing oil and drilling into Iraq’s Rumaila field, and revived an old claim to the emirate. The UN Security Council condemned the invasion and imposed sanctions, and a coalition of some 35 countries led by the United States gathered more than 900,000 troops in Saudi Arabia. After Iraq ignored a UN deadline of 15 January 1991, the coalition bombed Iraq and Iraqi forces in Kuwait for five and a half weeks from 17 January, and in a ground offensive of 24–28 February drove them out of Kuwait in about 100 hours. Iraqi forces set fire to more than 600 Kuwaiti oil wells as they left. The ceasefire left Saddam in power, under UN sanctions and weapons inspections. Estimates of Iraqi military dead range from about 8,000 to 50,000 and more; the coalition lost about 300 killed.
countries: [iq, kw, sa, us, il]
sides:
  - id: iq
    name: Iraq
    polities: [iraq]
    ink: brown
    moves: Iraqi moves
    success: Iraqi success
  - id: coal
    name: US-led coalition
    polities: [kuwait, united-states, united-kingdom, saudi-arabia, france, egypt, syria]
    ink: blue
    moves: Coalition moves
    success: Coalition success
notes:
  - Iraqi casualties are uncertain. Estimates of military dead range from about 8,000 to 50,000 or more, with 20,000–35,000 often cited; about 3,500 Iraqi civilians are estimated to have died from the bombing itself, and many more from the destruction of power and water systems and the sanctions that followed. About 1,000 Kuwaiti civilians were killed during the occupation, and several hundred Kuwaitis taken to Iraq were never returned.
  - The occupation of Kuwait is shown as an area; Iraq’s annexation of Kuwait was declared void by the UN Security Council and is not shown on the base map.
  - Coalition deaths were about 300, of which 147 US service members were killed in action; about a quarter of the US combat dead were killed by friendly fire.
