  - title: The ceasefire
    date: March – April 1991
    when: "1991-03-03"
    borders: "1991-04-11"
    countries: [iq, kw]
    body:
      - On 3 March General Schwarzkopf and Iraqi generals met in a tent at Safwan airfield in southern Iraq to agree the terms of the ceasefire. Schwarzkopf allowed Iraq to keep flying helicopters, which its forces then used to crush the uprisings that had broken out in the south and the Kurdish north. On 3 April the Security Council passed Resolution 687, which Iraq accepted on 6 April; the ceasefire took formal effect on 11 April.
      - The resolution required Iraq to destroy its chemical and biological weapons and long-range missiles under UN inspection, to give up any nuclear weapons programme, to pay compensation from its oil revenues and to accept a new, UN-demarcated border with Kuwait, watched by a UN observer force. Sanctions stayed in force until Iraq complied, and lasted until 2003. Kuwait was restored to the Al Sabah family, and coalition forces left southern Iraq by May.
    facts:
      - [Safwan talks, "3 March 1991"]
      - [Resolution 687, "3 April 1991"]
      - [Formal ceasefire, "11 April 1991"]
    markers:
      - kind: treaty
