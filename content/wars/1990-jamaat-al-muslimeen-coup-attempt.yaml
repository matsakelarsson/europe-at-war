id: jamaat-al-muslimeen-coup-attempt
name: Jamaat al Muslimeen coup attempt
start: "1990-07-27"
end: "1990-08-01"
tier: C
summary: "An attempt by the Jamaat al Muslimeen, a Muslim organisation led by Yasin Abu Bakr, a former police officer, to overthrow the government of Trinidad and Tobago. The group had long been in dispute with the state over land at No. 1 Mucurapo Road in Port of Spain, which it occupied and where a court had ordered it to leave, and it condemned the hardship caused by the austerity of Prime Minister A. N. R. Robinson’s government; its armed men had also run anti-drug patrols, and a police raid on its compound in 1988 deepened the quarrel. At about 6 p.m. on Friday 27 July 1990, shortly after a bomb went off at police headquarters, 42 armed members led by Bilaal Abdullah stormed the Red House, the seat of Parliament, during a sitting and took Robinson and most of his cabinet hostage, while Abu Bakr and 72 others seized the state television station, Trinidad and Tobago Television, from which he announced that the government had been overthrown. Robinson was beaten and shot in the leg after calling on the army to attack. While the police and the Trinidad and Tobago Defence Force surrounded the two buildings, widespread looting and arson broke out in Port of Spain and along the East–West Corridor, and a curfew was imposed. After six days of negotiation the insurgents released their hostages and surrendered on 1 August in return for a written amnesty. About 24 people died, among them the member of Parliament Leo Des Vignes, and many more were injured; losses from looting and arson were later estimated at TT$450 million. The insurgents were charged with treason, but the courts upheld the amnesty and they were freed in 1992; the Privy Council later held that the amnesty was invalid but that they could not be re-arrested. A Commission of Enquiry reported in 2014 that the security services had failed to act on warnings of the attack."
