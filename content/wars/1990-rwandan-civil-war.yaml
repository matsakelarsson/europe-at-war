id: rwandan-civil-war
name: Rwandan Civil War
start: "1990-10-01"
end: "1994-07-18"
tier: A
summary: "The war between the Rwandan government of President Juvénal Habyarimana and the Rwandan Patriotic Front (RPF), a rebel army formed mostly of Tutsi refugees in Uganda, during which extremists in the government carried out the genocide against the Tutsi in 1994. Hundreds of thousands of Tutsi had fled Rwanda after the revolution of 1959–1962, and many of their children grew up in Uganda, where Fred Rwigyema and Paul Kagame rose in Yoweri Museveni’s army. On 1 October 1990 the RPF invaded from Uganda; with French, Belgian and Zairian help the Rwandan army threw it back, and Rwigyema was killed. Under Kagame the RPF fought a guerrilla war from the Virunga mountains and the northern border, while the government arrested thousands of Tutsi and local officials organised massacres of them. A ceasefire in July 1992 led to talks at Arusha, and after a new RPF offensive in February 1993 brought it within 30 kilometres of Kigali, the Arusha Accords of 4 August 1993 provided for power-sharing, a merged army and a UN peacekeeping force, UNAMIR. Extremists of the Hutu Power movement, with their militias, the Interahamwe and Impuzamugambi, and the radio station RTLM, rejected the deal. On 6 April 1994 Habyarimana’s plane was shot down over Kigali, and within hours soldiers and militias began killing Tutsi and moderate Hutu across the country. In about 100 days they killed between 500,000 and 662,000 Tutsi according to most scholarly estimates (the Rwandan government counts 1,074,017 victims of the genocide), as well as many Hutu opponents. The RPF resumed the war on 7–8 April, took Kigali on 4 July and the last government stronghold, Gisenyi, on 18 July, ending the genocide and the war; France’s Opération Turquoise held a zone in the south-west until August. About 2 million Hutu fled to Zaire, Tanzania and Burundi, and RPF soldiers also killed civilians, by some estimates tens of thousands. The war and the refugee camps in Zaire led directly to the Congo wars."
countries: [rw, ug, fr, cd, tz]
