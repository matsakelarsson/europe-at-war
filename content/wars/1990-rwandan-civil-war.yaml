notes:
  - "This atlas follows the United Nations and the Rwandan government in calling the genocide of 1994 the genocide against the Tutsi. Many Hutu who opposed it, or were taken for opponents, were also killed. Most scholarly estimates of the Tutsi killed range from about 500,000 to 662,000, roughly two-thirds of the Tutsi then in Rwanda; the Rwandan government’s census of victims counted 1,074,017 dead, 94 per cent of them Tutsi. Between 250,000 and 500,000 women were raped."
  - "Who shot down Habyarimana’s plane has not been established in court, and historians are divided: many have blamed Hutu extremists opposed to the Arusha Accords, while others, among them René Lemarchand, have found the evidence against the RPF persuasive. French and Spanish judges accused the RPF in 2006 and 2008, but a Rwandan inquiry in 2010 and a French ballistics report in 2012 placed the launch site at or near the government’s Kanombe military camp, and the French case was closed in 2018 without trial."
  - "Killings by the RPF during and after the war are disputed: Human Rights Watch put those of April to August 1994 at a minimum of 25,000 to 30,000, a UN consultant, Robert Gersony, at 25,000 to 45,000, and some historians, among them Gérard Prunier, have estimated up to 100,000; the Rwandan government rejects these figures. About 7,500 combatants were killed in the war."
