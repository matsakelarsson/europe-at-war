  - title: Opération Turquoise and the end of the war
    date: June – August 1994
    when: "1994-07-18"
    borders: "1994-07-18"
    countries: [rw, fr, cd]
    body:
      - "On 22 June the UN Security Council authorised France to lead a humanitarian intervention, and French troops entered south-western Rwanda from Goma and Bukavu in Zaire. Opération Turquoise set up a safe humanitarian zone in the Cyangugu–Kibuye–Gikongoro triangle, about a fifth of the country. Radio France Internationale estimated that it saved about 15,000 lives, among them Tutsi survivors at Bisesero, reached only after French soldiers had first passed them by; but France had been the government’s main foreign backer, and the zone also let the interim government, army units and organisers of the genocide escape to Zaire. The French left on 21 August."
      - "The RPF took Ruhengeri and, on 18 July, Gisenyi, and the interim government and the remains of the army fled into Zaire. The RPF declared the war over and on 19 July formed a government of national unity under the Arusha framework, with Pasteur Bizimungu, a Hutu member of the RPF, as president and Kagame as vice-president and defence minister. About 2 million Hutu, driven by fear of RPF revenge and urged on by their leaders, fled to Zaire, Tanzania and Burundi; in the camps around Goma, cholera and dysentery killed tens of thousands within weeks."
    facts:
      - [UN authorisation of Opération Turquoise, "22 June 1994"]
      - [Gisenyi taken, "18 July 1994"]
      - [Government of national unity, "19 July 1994"]
      - [Refugees, "about 2 million"]
      - [French withdrawal, "21 August 1994"]
