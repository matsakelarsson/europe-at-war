steps:
  - title: The RPF invades
    date: October 1990
    when: "1990-10-01"
    borders: "1990-10-01"
    countries: [rw, ug, fr]
    body:
      - "More than 336,000 Tutsi had fled Rwanda by 1964, and successive governments refused to let them return. In Uganda many young refugees joined Museveni’s National Resistance Army, and when it took power in 1986 Fred Rwigyema and Paul Kagame became senior officers. The Rwandan Patriotic Front, founded in 1987 from an older refugee association, drew on these soldiers, and in 1990, as Ugandans began to resent the Rwandans’ prominence and Rwanda’s government came under pressure to open up to other parties, Rwigyema and Kagame decided to invade."
      - "On 1 October 1990 RPF soldiers deserted their Ugandan posts with their weapons and crossed into Rwanda at the Kagitumba border post, and in the first days advanced 60 kilometres south to Gabiro. On 2 October Rwigyema was killed, by a stray bullet according to the RPF or, in another account, by a rival commander. France sent 600 soldiers in Opération Noroît, officially to protect French citizens, and Belgium and Zaire sent troops; Zaire’s presidential guard fought alongside the Rwandan army, the Forces Armées Rwandaises (FAR). By the end of the month the RPF had been driven back to the Ugandan border, and on 30 October the government declared the war over."
      - "On the night of 4–5 October gunfire in Kigali, presented as an RPF attack but probably staged, gave the government a pretext to arrest more than 8,000 people, mostly Tutsi and opponents. On 11 October local authorities organised the killing of 383 Tutsi in Kibilira commune in Gisenyi prefecture, the first of several such massacres."
    facts:
      - [RPF invasion, "1 October 1990"]
      - [Death of Fred Rwigyema, "2 October 1990"]
      - [Arrests after the staged attack on Kigali, "more than 8,000"]
      - [Kibilira massacre, "11 October 1990, 383 Tutsi killed"]
