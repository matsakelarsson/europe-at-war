  - title: The RPF advance
    date: April – July 1994
    when: "1994-07-04"
    borders: "1994-07-04"
    countries: [rw, tz]
    body:
      - "On 7 April Kagame warned that the RPF would resume the war if the killing did not stop, and its forces crossed the demilitarised zone on three fronts, while the RPF battalion in Kigali fought its way out of the CND. Rather than attack Kigali directly, the RPF moved to surround it. One column swept down the east of the country, and by late April held the whole Tanzanian border; at the end of April some 500,000 people from Kibungo, led by local officials who had organised the killing, crossed the bridge at Rusumo Falls into Tanzania. The RPF then turned west, south of Kigali."
      - "On 16 May it cut the road from Kigali to Gitarama, seat of the interim government, which fled to Gisenyi in the north-west when Gitarama fell on 13 June. RPF advances saved many Tutsi and Hutu in the areas it reached, but RPF soldiers also carried out reprisal killings of civilians. On 4 July 1994, after weeks of fighting, the RPF took Kigali, a day now celebrated as Liberation Day; Butare fell about the same time."
    facts:
      - [RPF resumes the war, "7–8 April 1994"]
      - [Refugees crossing at Rusumo, "about 500,000 at the end of April 1994"]
      - [Gitarama taken, "13 June 1994"]
      - [Kigali taken, "4 July 1994"]
