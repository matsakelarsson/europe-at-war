  - title: 6 April 1994 and the genocide against the Tutsi
    date: April – July 1994
    when: "1994-04-07"
    borders: "1994-04-07"
    countries: [rw]
    body:
      - "On the evening of 6 April 1994 the plane carrying Habyarimana and Burundi’s president, Cyprien Ntaryamira, was shot down by missiles as it approached Kigali airport, killing all on board. Within hours a crisis committee led by Colonel Théoneste Bagosora took control. The Presidential Guard and militias set up roadblocks in Kigali and went from house to house with lists, killing Tutsi and moderate Hutu politicians. On 7 April soldiers killed the prime minister, Agathe Uwilingiyimana, and the ten Belgian peacekeepers guarding her, as well as other opposition leaders and journalists. An interim government formed under Bagosora’s influence and called on the population, through local officials and RTLM, to kill."
      - "The killing spread across the country in days. Soldiers, gendarmes, the Interahamwe and ordinary Hutu men, often neighbours of their victims, killed Tutsi with guns, grenades and machetes at roadblocks, in their homes and in churches, schools and hospitals where they had taken refuge: thousands died in the churches of Ntarama and Nyamata, at Nyarubuye, at the Murambi technical school near Gikongoro and in the hills of Bisesero, where Tutsi resisted for weeks. In Butare, where the prefect resisted until he was dismissed in mid-April, killing began after the interim president came to incite it on 19 April. Women were raped on a vast scale. Within about 100 days between 500,000 and 662,000 Tutsi were murdered, according to most scholarly estimates, about two-thirds of the Tutsi in Rwanda; Rwanda’s government counts 1,074,017 victims."
      - "UNAMIR, with a mandate that did not allow it to use force, sheltered thousands of people at the Amahoro stadium and other sites in Kigali. After the death of its soldiers Belgium withdrew its contingent, and on 21 April the UN Security Council cut UNAMIR to a few hundred men. Fifteen UN soldiers died, among them the Senegalese captain Mbaye Diagne, who saved hundreds of people before he was killed. France, Belgium, Italy and the United States flew out their own citizens; the UN and the major powers avoided calling the killing genocide for weeks."
    facts:
      - [Habyarimana’s plane shot down, "6 April 1994"]
      - [Duration of the genocide, "about 100 days, April – July 1994"]
      - [Tutsi killed, "500,000–662,000 (most scholarly estimates); 1,074,017 victims (Rwandan government)"]
      - [UN soldiers killed, "15"]
