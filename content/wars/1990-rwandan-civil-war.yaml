  - title: Guerrilla war in the north
    date: 1991 – 1992
    when: "1991-01-23"
    borders: "1991-01-23"
    countries: [rw, ug]
    body:
      - "Kagame, who had been on a course in the United States, took command in mid-October 1990, withdrew the demoralised RPF to the cold, steep Virunga mountains on the north-western border and spent three months reorganising it. On 23 January 1991 it struck Ruhengeri, freed the inmates of the country’s largest prison and held the town for a day before returning to the mountains. From then on it waged a guerrilla war across the north, attacking in many places at once, and took the border crossing at Gatuna, cutting Rwanda’s road to the port of Mombasa. By late 1991 it held about 5 per cent of Rwanda, with its headquarters in an abandoned tea factory at Mulindi."
      - "Under pressure from abroad, Habyarimana allowed opposition parties in 1991, and a coalition government with opposition ministers was formed in April 1992. But the war also hardened the regime’s supporters. Local officials organised massacres of Tutsi civilians: up to 1,000 Bagogwe Tutsi pastoralists were killed in the north-west in 1991, and others in Bugesera in 1992. A Hutu extremist party, the Coalition for the Defence of the Republic (CDR), was founded in 1992, and the ruling party’s youth wing grew into the Interahamwe militia. In July 1992 the RPF and the government agreed a ceasefire and began talks at Arusha in Tanzania."
    facts:
      - [Kagame takes command, "mid-October 1990"]
      - [Raid on Ruhengeri, "23 January 1991"]
      - [Ceasefire and start of the Arusha talks, "July 1992"]
