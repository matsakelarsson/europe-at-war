  - title: The February offensive and the Arusha Accords
    date: February – December 1993
    when: "1993-08-04"
    borders: "1993-08-04"
    countries: [rw, fr, tz]
    body:
      - "In January 1993 the negotiators at Arusha agreed on sharing power between the ruling MRND, the RPF and the opposition parties, excluding the CDR; Habyarimana’s party disowned the deal, and Hutu extremists killed hundreds of Tutsi in the north-west. On 8 February 1993 the RPF broke the ceasefire. It took Ruhengeri on the first day and then Byumba, and by 20 February it was within 30 kilometres of Kigali. France reinforced its troops, and the offensive drove more than a million people from their homes. Kagame halted; he later said he had never meant to take the capital. Under a ceasefire the RPF withdrew to its earlier lines behind a demilitarised zone."
      - "The Arusha Accords were signed on 4 August 1993. They provided for a broad transitional government, elections, the return of refugees and an army merging the FAR and the RPF. A UN force, the United Nations Assistance Mission for Rwanda (UNAMIR), under the Canadian General Roméo Dallaire, arrived from October, and in December 1993 600 RPF soldiers moved into the parliament building, the CND, in Kigali to protect RPF politicians."
      - "The extremists, known as Hutu Power, organised against the accords. The murder of Burundi’s Hutu president, Melchior Ndadaye, by Tutsi officers in October 1993 strengthened their case. The radio station RTLM spread hatred of Tutsi, the Interahamwe and the CDR’s Impuzamugambi trained and stockpiled weapons, including imported machetes, and in January 1994 an informant warned UNAMIR of plans to exterminate the Tutsi of Kigali. UN headquarters refused Dallaire’s request to seize the arms."
    facts:
      - [RPF offensive, "8–20 February 1993"]
      - [Arusha Accords, "4 August 1993"]
      - [UNAMIR deployed, "from October 1993"]
      - [RPF battalion arrives at the CND in Kigali, "December 1993"]
