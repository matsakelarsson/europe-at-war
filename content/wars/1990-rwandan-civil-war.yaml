  - title: Aftermath
    date: 1994 – 1996
    when: "1995-04-22"
    borders: "1995-04-22"
    countries: [rw, cd, tz]
    body:
      - "The RPF inherited a devastated country. About 7,500 combatants had died in the war, besides the victims of the genocide. In the months after the victory RPF soldiers killed civilians in reprisals and operations against suspected génocidaires; a UN consultant, Robert Gersony, estimated that 25,000 to 45,000 people were killed in 1994, Human Rights Watch gave a minimum of 25,000 to 30,000, and some historians such as Gérard Prunier have estimated that the total may have reached 100,000, figures the Rwandan government rejects. On 22 April 1995 RPF soldiers closing the camp for displaced people at Kibeho opened fire on the crowd; Australian peacekeepers of UNAMIR counted at least 4,000 dead, the government 338."
      - "The UN set up the International Criminal Tribunal for Rwanda at Arusha in November 1994; it convicted Bagosora and dozens of others of genocide. In Rwanda the courts and, from 2005, the community gacaca courts tried more than a million cases. Leaders of the former regime and their army regrouped in the refugee camps in Zaire, from which they raided Rwanda, and in 1996 the RPF army invaded Zaire, starting the First Congo War. Kagame became president in 2000 and has ruled Rwanda since."
