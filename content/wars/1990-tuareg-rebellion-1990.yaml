steps:
  - title: Tchin-Tabaraden and Ménaka
    date: May 1990 – 1991
    when: "1990-05-07"
    borders: "1990-07-01"
    countries: [ml, ne, dz]
    body:
      - "The Tuareg of Mali and Niger had been pushed to the margins of both states since independence, and the repression of the rising of 1963–1964 was remembered in Mali. The great droughts killed most of the herds; families crowded into camps around the towns, and thousands of young men, called ishumar in Tamasheq after the French chômeur, “unemployed”, went to work or to soldier in Algeria and Libya. In 1989–1990, as Libya and Algeria sent many of them home, Niger promised to resettle returnees but provided little, and aid meant for them was said to have been embezzled."
      - "On 7 May 1990 young Tuareg attacked the gendarmerie and prison at Tchin-Tabaraden in Niger to free comrades and seize arms. The army’s reprisals in the following days killed Tuareg civilians in the town and the camps around it, by estimates that range from the official few dozen to more than a thousand claimed by Tuareg sources; most accounts speak of several hundred. In Mali, on 28 June 1990, fighters of the Popular Movement for the Liberation of Azawad (MPLA) under Iyad Ag Ghaly attacked Ménaka, and the revolt spread across the regions of Gao, Kidal and Timbuktu, with attacks on posts and convoys and army reprisals against nomad camps."
      - "Algeria, worried for its own south, mediated. The Tamanrasset accords of 6 January 1991, signed by the chief of staff of the Malian army and Iyad Ag Ghaly for the rebels, promised a ceasefire, a reduced army presence in the north and a special status for it. In March 1991 mass protests and a coup by Lieutenant Colonel Amadou Toumani Touré overthrew Moussa Traoré, and the transitional government reopened talks while the rebel movements split along clan and ethnic lines."
