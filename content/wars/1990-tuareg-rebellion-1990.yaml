notes:
  - "The movements split and merged often. In Mali: the Popular Movement for the Liberation of Azawad (MPLA, later MPA), the Arab Islamic Front of Azawad (FIAA), the Revolutionary Army for the Liberation of Azawad (ARLA) and the Popular Front for the Liberation of Azawad (FPLA), from 1991 joined in the Unified Movements and Fronts of Azawad (MFUA). In Niger: the Front for the Liberation of Aïr and Azawak (FLAA), the Liberation Front of Tamoust (FLT), the Coordination of Armed Resistance (CRA) and the Organisation of Armed Resistance (ORA)."
  - Azawad is the Tuareg name for the plains north of the Niger bend; the rebels used it for the whole north of Mali. Numbers of dead in the reprisals of 1990 are disputed and rest on very different sources.
