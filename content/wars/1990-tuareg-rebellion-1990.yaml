  - title: The rebellions of 2006–2009
    date: 2006–2009
    when: "2006-05-23"
    borders: "2007-06-01"
    countries: [ml, ne, dz, ly]
    body:
      - "In Mali, on 23 May 2006, Tuareg officers who had deserted, among them Ibrahim Ag Bahanga, Hassan Ag Fagaga and Iyad Ag Ghaly, attacked army posts in Kidal and Ménaka as the Democratic Alliance for Change. Algeria brokered an accord in July 2006, but Bahanga’s faction kept fighting from 2007 along the Algerian border, taking soldiers hostage. After a further Algerian-brokered truce in 2008 it attacked again, at Nampala in December 2008, and in January 2009 the army and Tuareg and Arab militias loyal to it, led by Colonel Elhadji Ag Gamou, overran its bases; Bahanga fled to Libya."
      - "In Niger the Niger Movement for Justice (MNJ) took up arms in February 2007, saying that the 1995 accords had not been kept and demanding a share of the wealth from the uranium mines of Arlit. It attacked army posts in the Aïr, and landmines killed soldiers and civilians as far south as Niamey; the government declared a state of alert in the north, restricted the press and aid groups and expelled foreign organisations. Libyan mediation brought a ceasefire and an amnesty in 2009. When Gaddafi fell in 2011, many Malian Tuareg who had served him came home armed, and the next rebellion, in 2012, began the Mali War."
    facts:
      - [Attacks on Kidal and Ménaka, "23 May 2006"]
      - [MNJ rising in Niger, "February 2007"]
    markers:
