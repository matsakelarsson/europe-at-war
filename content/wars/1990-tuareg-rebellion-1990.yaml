  - title: The National Pact, Ganda Koy and the Flame of Peace
    date: 1992–1996
    when: "1992-04-11"
    borders: "1995-04-24"
    countries: [ml, ne, bf, dz]
    body:
      - "On 11 April 1992 Mali’s transitional government and the Unified Movements and Fronts of Azawad signed the National Pact, which promised a special administration for the north, the integration of rebel fighters into the army and civil service, the withdrawal of most troops and a development fund. President Alpha Oumar Konaré, elected that year, kept to it, but integration was slow and money short, and the movements fought each other. In 1994 killings by rebels and by soldiers led Songhai and Fulani townsmen of the Niger valley to form Ganda Koy (“masters of the land”), a militia that attacked Tuareg and Arab camps and civilians; rebels attacked Songhai villages in turn, and the north came close to civil war between communities."
      - "Peace came from below as much as from the state. From 1995 a series of meetings between chiefs, elders and community leaders in the north, backed by the government and foreign donors, reconciled the communities, and fighters of the movements and of Ganda Koy agreed to disarm. On 27 March 1996, at the Flame of Peace in Timbuktu, some 3,000 weapons were burned and the movements declared themselves dissolved."
      - "In Niger the Front for the Liberation of Aïr and Azawak (FLAA) of Rhissa Ag Boula and other groups fought in the Aïr mountains and the Azawak plain from 1991. After truces in 1992–1994 brokered with French, Algerian and Burkinabé help, the government and the Organisation of Armed Resistance signed a peace accord in Ouagadougou on 24 April 1995, with decentralisation and the integration of fighters."
    facts:
