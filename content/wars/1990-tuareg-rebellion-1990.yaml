id: tuareg-rebellion-1990
name: Tuareg rebellion of 1990–1995
start: "1990-05-07"
end: "1996-03-27"
tier: B
summary: "Rebellions of Tuareg, and in Mali also Arab, movements against the governments of Mali and Niger in the early 1990s. The droughts of 1973–1974 and 1984–1985 destroyed the herds on which the nomads of the Sahara’s southern edge lived, and many young men left for Algeria and Libya, where some served in Muammar Gaddafi’s Islamic Legion. When they came back at the end of the 1980s to poverty and suspicion, a raid on the post at Tchin-Tabaraden in Niger in May 1990 brought army reprisals that killed hundreds of Tuareg civilians, and in June an attack on Ménaka opened the war in Mali. Algeria brokered the Tamanrasset accords in January 1991, and after a coup in Bamako Mali signed a National Pact with the rebel movements in April 1992, promising a special status for the north, the integration of fighters and development. Fighting flared again in 1994, when the Songhai militia Ganda Koy and the rebels killed civilians of each other’s communities, before local peace meetings ended it; the weapons of the Malian war were burned in Timbuktu on 27 March 1996. In Niger the government signed a peace accord with the Tuareg movements in Ouagadougou on 24 April 1995. More than 2,500 people were killed. New rebellions broke out in both countries in 2006–2009."
