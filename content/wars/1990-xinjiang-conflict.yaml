notes:
  - The Chinese government describes the conflict as a fight against terrorism, separatism and religious extremism, and the camps as voluntary vocational education and training centres. Uyghur exile groups, human rights organisations and many governments describe the violence as a response to repression and the camps as mass arbitrary detention; the United States and several parliaments have called the policies genocide, a charge China rejects. Independent reporting from Xinjiang is very limited, and most figures for attacks and deaths are official Chinese figures.
  - This file covers the violence of 1990–2017. Many accounts, including Wikipedia’s, treat the Xinjiang conflict as a longer and still ongoing conflict going back to the 1930s; its earlier phases are told here as the Kumul rebellion, the Ili rebellion and the Kuomintang Islamic insurgency. The end date is that of the last attack reported in Xinjiang. The government says there has been no attack since December 2016, crediting its policies.
