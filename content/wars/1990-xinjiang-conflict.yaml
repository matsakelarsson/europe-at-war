        lonlat: [87.617, 43.825]
  - title: Kunming, Strike Hard and the camps
    date: 2013–2017
    when: "2014-03-01"
    borders: "2017-02-14"
    countries: [cn]
    body:
      - Violence peaked in 2013–2014. On 28 October 2013 a car was driven into crowds in Tiananmen Square in Beijing, killing two bystanders and the three people in it. On 1 March 2014 a group armed with knives killed 31 people at Kunming railway station; on 22 May two vehicles drove into a market in Ürümqi and exploded, killing 43; and on 28 July violence in Yarkand county left 96 dead by official count, 37 civilians and 59 attackers. Clashes in towns across southern Xinjiang killed scores more. Some Uyghurs went abroad to fight with the Turkistan Islamic Party in Syria.
      - In May 2014 the government launched its “Strike Hard Campaign against Violent Terrorism”, and from 2016, under the regional party secretary Chen Quanguo, it built a dense system of police posts and digital surveillance. From 2017 it detained Uyghurs, Kazakhs and other Muslims in large numbers in camps it calls vocational education and training centres; researchers estimate that more than a million people passed through them. Officials said in 2019 that all trainees had graduated, but many detainees were moved into prisons, and in 2026 human rights groups reported hundreds of thousands still imprisoned. On 31 August 2022 the UN human rights office concluded that the detentions “may constitute international crimes, in particular crimes against humanity”.
      - The government says no attack has occurred in Xinjiang since an attack in Karakax (Moyu) county on 28 December 2016; a knife attack in Pishan county on 14 February 2017, which killed five people and the three attackers, is the last one reported. The camps and the security regime, not armed violence, have defined Xinjiang since then.
    facts:
      - [Kunming railway station attack, "1 March 2014, 31 killed"]
      - [Ürümqi market bombing, "22 May 2014, 43 killed"]
      - [Strike Hard campaign, "from May 2014"]
      - [UN human rights office report, "31 August 2022"]
