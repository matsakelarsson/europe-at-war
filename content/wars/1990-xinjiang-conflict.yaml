id: xinjiang-conflict
name: Xinjiang conflict
start: "1990-04-05"
end: "2017-02-14"
tier: B
summary: "Armed attacks, riots and uprisings by Uyghurs in Xinjiang and elsewhere in China from 1990 to 2017, and the Chinese government’s response, which grew from security campaigns into mass surveillance and the detention of hundreds of thousands, by many estimates more than a million, Uyghurs, Kazakhs and other Muslims. Grievances over Han migration, restrictions on religion and language, birth-control rules and jobs fed a movement for an independent “East Turkestan”, a small part of which turned to violence; the government treats separatism, religious extremism and terrorism as one threat. The main events were the Baren uprising (1990), the Ghulja protests and the Ürümqi bus bombings (1997), the Kashgar attack before the 2008 Olympics, the Ürümqi riots of July 2009, in which 197 people were killed, and a wave of attacks in 2013–2014, among them the killing of 31 people at Kunming railway station. The government answered with the Strike Hard campaign of 2014 and, from 2017, the internment camps, which a UN report of 2022 said may amount to crimes against humanity. No attacks in Xinjiang have been reported since February 2017; the security regime and the detentions continue."
