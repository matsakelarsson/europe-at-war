steps:
  - title: Baren and Ghulja
    date: 1990–1997
    when: "1990-04-05"
    borders: "1997-02-25"
    countries: [cn]
    body:
      - After 1949 Xinjiang became an autonomous region of the People’s Republic, and Han settlement, much of it through the Xinjiang Production and Construction Corps founded in 1954, raised the Han share of the population from a few per cent to about 40 per cent. The opening of the 1980s eased controls on religion, and the independence of the Central Asian republics in 1991 encouraged hopes among some Uyghurs of a state of their own.
      - On 5 April 1990 an armed group at Baren, a township in Akto county south-west of Kashgar, rose against the government; by official figures 7 police and soldiers and 16 rebels, among them their leader Zeydin Yusup, were killed before the rising was put down. The government blamed an East Turkestan Islamic Party, and about 7,900 people were arrested in the following months. A nationwide Strike Hard campaign against crime from 1996 was used in Xinjiang against separatism and unofficial religious activity.
      - On 5–6 February 1997, during Ramadan, protests in Ghulja (Yining) against the arrest of young Uyghurs were broken up by security forces; officially at least nine people were killed, while exile groups give far higher figures, and many were arrested. On 25 February 1997, the day of Deng Xiaoping’s funeral, three bombs on buses in Ürümqi killed nine people and injured 68.
