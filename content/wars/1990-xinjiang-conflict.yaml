  - title: Kashgar and the Ürümqi riots
    date: 2008–2009
    when: "2009-07-05"
    borders: "2009-07-05"
    countries: [cn]
    body:
      - On 4 August 2008, four days before the opening of the Beijing Olympics, two men drove a truck into a group of police officers on a morning run in Kashgar and attacked them with explosives and knives, killing 16. The government blamed the East Turkestan Islamic Movement, which the UN had listed as a terrorist group in 2002.
      - In June 2009 false rumours of a rape led to a brawl at a toy factory in Shaoguan, in Guangdong, in which two Uyghur workers were killed. On 5 July a protest by Uyghurs in Ürümqi turned into riots in which Uyghur crowds attacked Han residents, and on 7 July Han crowds armed with clubs sought revenge. By official figures 197 people were killed, most of them Han, and 1,721 injured; Uyghur exile groups said the police had fired on protesters and put the deaths at far more, and many Uyghurs disappeared in the arrests that followed. Internet access in the region was cut and not fully restored until May 2010.
    facts:
      - [Kashgar attack, "4 August 2008, 16 police killed"]
      - [Ürümqi riots, "5–7 July 2009"]
      - [Killed in Ürümqi (official figures), "197, with 1,721 injured"]
    markers:
