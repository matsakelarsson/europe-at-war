  - title: The Civil Concord
    date: 1998 – February 2002
    when: "1999-09-16"
    borders: "1999-09-16"
    countries: [dz]
    body:
      - "In 1998 Hassan Hattab and other GIA commanders broke away to form the Salafist Group for Preaching and Combat (GSPC), which said it would fight only the state and spare civilians. Zéroual stepped down early, and on 15 April 1999 Abdelaziz Bouteflika, a former foreign minister backed by the army, was elected president after his six rivals withdrew, accusing the authorities of fraud. His Civil Concord law offered amnesty or reduced sentences to fighters who surrendered and had not taken part in killings, rapes or bombings in public places, and was approved in a referendum on 16 September 1999 by 98.6 per cent of the voters. Several thousand fighters came down from the mountains, and the AIS disbanded in January 2000 under a full amnesty."
      - "The GIA dwindled to a few bands. On 8 February 2002 security forces killed Antar Zouabri in Boufarik, which is usually taken as the end of the war. The GSPC fought on from Kabylia and the Sahara, and in 2007 became al-Qaeda in the Islamic Maghreb; see Insurgency in the Maghreb."
      - "In 2005 a Charter for Peace and National Reconciliation, approved by referendum, extended the amnesty to most remaining fighters, gave the security forces immunity, offered compensation to families of the disappeared and made it a crime to use the wounds of the national tragedy to harm the state. Few people on any side were ever tried, and the families of the disappeared still campaign to learn what happened to them."
    facts:
      - [GSPC founded, "1998"]
      - [Bouteflika elected, "15 April 1999"]
      - [Civil Concord approved, "16 September 1999; 98.6 per cent"]
      - [Zouabri killed, "8 February 2002"]
      - [Charter for Peace, "29 September 2005"]
    markers:
