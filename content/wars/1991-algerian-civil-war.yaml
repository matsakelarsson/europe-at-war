steps:
  - title: October 1988 and the rise of the FIS
    date: October 1988 – November 1991
    when: "1988-10-05"
    borders: "1990-06-12"
    countries: [dz]
    body:
      - "For a quarter of a century after independence Algeria was ruled by the FLN as the only party, with the army as the real power behind it. When the price of oil collapsed in 1986, the state that lived from oil and gas could no longer pay for jobs, housing and food for a young and fast-growing population. In October 1988 young people rioted in Algiers and other cities, attacking government buildings and FLN offices; the army fired on them and killed officially 159 people and by other counts about 500. President Chadli Bendjedid answered with a new constitution in February 1989 that allowed other parties."
      - "The strongest of the new parties was the Islamic Salvation Front (FIS), led by Abbassi Madani, a university lecturer, and Ali Belhadj, a young preacher from Algiers. Built on a network of mosques and charities, it promised an Islamic state and an end to the corruption of the FLN. In the local elections of 12 June 1990, the first free elections since independence, the FIS won 54 per cent of the vote and most of the towns."
      - "In May and June 1991 the FIS called a general strike against a new electoral law and occupied squares in Algiers. The army cleared them, the government declared a state of siege, and Madani and Belhadj were arrested and later sentenced to twelve years in prison. On 28–29 November 1991 militants, some of them veterans of the war in Afghanistan, attacked the border post of Guemmar and killed several conscripts."
    facts:
      - [October riots, "5–10 October 1988; 159 dead officially, about 500 by other counts"]
      - [Multiparty constitution, "February 1989"]
      - [Local elections, "12 June 1990; FIS 54 per cent"]
      - [Madani and Belhadj arrested, "June 1991"]
    markers:
      - kind: event
        name: Algiers
        date: October 1988 – June 1991
        text: The riots of October 1988 began in the working-class districts of Bab El Oued and Belcourt. In June 1991 the army cleared the squares the FIS had occupied.
        lonlat: [3.059, 36.754]
      - kind: battle
        name: Guemmar
        date: 28–29 November 1991
        text: Militants attacked the army post here, in the oasis country near the Tunisian border, and killed conscripts, one of the first armed attacks of the conflict.
        lonlat: [6.833, 33.500]
  - title: The cancelled election
    date: December 1991 – August 1992
    when: "1992-01-11"
    borders: "1992-01-11"
    countries: [dz]
    body:
      - "In the first round of the parliamentary elections on 26 December 1991 the FIS won 188 of the 231 seats decided, against 25 for the Socialist Forces Front and 16 for the FLN. It needed only a few more in the second round, set for 16 January, to win a majority of the 430 seats. Many secular Algerians, women’s groups and trade unions feared an Islamic state; the army’s leaders, among them the defence minister General Khaled Nezzar, decided to stop it."
      - "On 11 January 1992 the army forced Chadli to resign and cancelled the second round. A High Council of State took power, headed by Mohamed Boudiaf, one of the founders of the FLN, who came back after 28 years in exile in Morocco. A state of emergency followed in February and the FIS was dissolved in March. Thousands of its members, by some estimates tens of thousands, were held without trial in camps in the Sahara, at Reggane, In Salah and other places."
      - "On 29 June 1992 Boudiaf was shot dead by one of his bodyguards, a lieutenant of the special forces, while giving a speech in Annaba. The official inquiry spoke of a lone gunman; many Algerians suspected men within the state. In August a bomb at Algiers airport killed nine people. The war had begun."
    facts:
      - [First round of elections, "26 December 1991; FIS 188 of 231 seats decided"]
      - [Chadli resigns, "11 January 1992"]
      - [FIS dissolved, "4 March 1992"]
      - [Boudiaf assassinated, "29 June 1992"]
