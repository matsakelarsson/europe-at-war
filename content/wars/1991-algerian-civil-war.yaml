  - title: The massacres of 1997–1998
    date: August 1997 – January 1998
    when: "1997-08-29"
    borders: "1997-09-22"
    countries: [dz]
    body:
      - "In 1997 the killing reached its peak. On the night of 28–29 August armed men went from house to house in the village of Raïs, in the Mitidja south of Algiers, killing men, women and children with knives, axes and guns; the official toll was 98, and survivors and hospital staff spoke of several hundred. On 5–6 September dozens were killed at Beni Messous, on the western edge of the capital, and on the night of 22–23 September some two hundred or more at Bentalha, again south of Algiers. Around the new year the massacres moved west: on 30 December 1997 and 4 January 1998 hundreds of villagers were killed in hamlets in the hills of Relizane province, and on 11 January more than a hundred at Sidi Hamed."
      - "The GIA claimed many of the massacres. Many victims came from villages that had supported the FIS and then turned away from the armed groups; some killings followed quarrels over land or vendettas. At Bentalha the killers worked for hours within sight of army barracks that did not intervene, and survivors, journalists and later some former officers asked whether the security services had let them, or had infiltrated the GIA. The government rejected the charges and refused an international inquiry."
      - "The AIS, whose leaders had been negotiating secretly with the army, announced a unilateral truce from 1 October 1997 and blamed the GIA and its manipulators for the massacres. The GIA split into smaller groups, and its strength declined."
    facts:
      - [Raïs, "28–29 August 1997; 98 dead officially, several hundred by other accounts"]
      - [Bentalha, "22–23 September 1997"]
      - [Relizane villages, "30 December 1997 and 4 January 1998"]
      - [AIS truce, "from 1 October 1997"]
    markers:
