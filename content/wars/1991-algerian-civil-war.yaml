  - title: Hijacking, bombs and elections
    date: December 1994 – 1996
    when: "1995-11-16"
    borders: "1995-11-16"
    countries: [dz, fr]
    body:
      - "On 24 December 1994 four GIA men hijacked an Air France airliner at Algiers airport and killed three passengers. When the plane was allowed to fly to Marseille, French gendarmes of the GIGN stormed it on 26 December and killed the hijackers. In the summer and autumn of 1995 the GIA carried its war to France, which it accused of supporting the Algerian regime: a bomb in the Saint-Michel station of the Paris RER on 25 July killed eight people, and other bombs and attempts followed."
      - "In Algeria Zéroual called a presidential election for 16 November 1995. Despite the GIA’s threats to kill voters, turnout was high and he won with about 61 per cent. The GIA turned on its own: its emir Djamel Zitouni had rival commanders and Islamists killed, and in March 1996 his men kidnapped seven French Trappist monks from the monastery of Tibhirine near Médéa, who were killed in May. After Zitouni’s death in July 1996, his successor Antar Zouabri declared almost the whole of Algerian society to be apostate."
    facts:
