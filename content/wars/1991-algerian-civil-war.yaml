notes:
  - "The Algerian state calls the period the national tragedy and called the armed groups terrorists; the groups called themselves mujahideen. Algerians often call it the black decade (la décennie noire)."
  - "Casualty figures are uncertain. Algerian officials spoke of about 100,000 dead in 1999 and about 150,000 later, and 200,000 is often cited; some studies estimate 40,000–50,000. Official death tolls for the massacres were often lower than those given by survivors, hospital staff and the press. A government commission counted 6,146 people who disappeared after being taken by state agents; associations of families give higher figures. Hundreds of thousands of people fled their homes."
  - "Who was behind some of the massacres of 1997–1998 is still debated. The GIA claimed many of them, and most researchers attribute them to armed Islamist groups; survivors, former officers and human rights groups asked why army units nearby did not intervene, and some alleged that the security services had infiltrated or manipulated the GIA, which the government denied. The areas of armed activity on the maps are approximate."
