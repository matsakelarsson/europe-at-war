        lonlat: [2.467, 27.197]
  - title: The armed groups
    date: 1992–1995
    when: "1993-09"
    borders: "1994-07-01"
    countries: [dz]
    body:
      - "The first armed groups were the Islamic Armed Movement (MIA) of Abdelkader Chebouti, a veteran of the Islamist maquis of the 1980s, and many local bands in the poor suburbs of Algiers and the mountains around the Mitidja plain. From late 1992 the most radical of them came together as the Armed Islamic Group (GIA), led by a series of emirs, many of them veterans of Afghanistan, who rejected any talks with the state and any loyalty to the FIS. In July 1994 the MIA and other groups loyal to the FIS formed the Islamic Salvation Army (AIS) under Madani Mezrag, strongest in the east around Jijel and in the west."
      - "The armed groups killed police, soldiers, officials and conscripts, and burned schools and factories. The GIA also murdered writers, journalists, artists and doctors, among them the novelist Tahar Djaout in 1993 and the singer Cheb Hasni in 1994, women who would not wear the veil, and foreigners, whom it ordered to leave the country in late 1993. Parts of the Mitidja and the hills around Blida and Médéa became zones the security forces entered only in strength."
      - "The state fought back with special anti-terrorist units, which tortured prisoners and carried out summary executions, and from 1994 with armed village militias, the self-defence groups or patriots. Inside the state, eradicators who wanted to crush the Islamists faced conciliators who wanted talks. General Liamine Zéroual, made president in January 1994, held talks with the imprisoned FIS leaders, without result. In January 1995 the FIS, the FLN, the Socialist Forces Front and other parties signed a platform for a peaceful solution at the Community of Sant’Egidio in Rome; the government rejected it."
    facts:
      - [GIA formed, "1992–1993"]
      - [AIS formed, "July 1994"]
      - [Foreigners killed by the end of 1993, "26"]
      - [Sant’Egidio platform, "January 1995"]
