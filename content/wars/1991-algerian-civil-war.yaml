id: algerian-civil-war
name: Algerian Civil War
start: "1991-12-26"
end: "2002-02-08"
tier: A
summary: "The war between the Algerian state and armed Islamist groups that followed the army’s cancellation of the elections of 1991–1992, known in Algeria as the black decade. After riots in October 1988 ended the FLN’s single-party rule, the Islamic Salvation Front (FIS) won local elections in 1990 and the first round of parliamentary elections on 26 December 1991. On 11 January 1992 the army forced President Chadli Bendjedid to resign, cancelled the second round, banned the FIS and interned thousands of its members in desert camps. Armed groups took to the mountains and the suburbs: the Islamic Salvation Army (AIS), loyal to the FIS, fought the security forces, while the more radical Armed Islamic Group (GIA) killed police and soldiers, officials, journalists, intellectuals, foreigners and finally villagers by the hundreds, above all in the massacres of 1997–1998 around Algiers and in the west. The security forces answered with torture, summary executions and thousands of disappearances, and armed village militias. The AIS declared a truce in 1997, President Abdelaziz Bouteflika’s Civil Concord of 1999 offered amnesty to fighters who surrendered, and the killing of the GIA’s leader Antar Zouabri in February 2002 is usually taken as the end of the war, though the GSPC fought on. Algerian officials gave about 150,000 dead, a figure of 200,000 is often cited, and some researchers estimate far fewer; several thousand people disappeared."
