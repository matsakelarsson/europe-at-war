notes:
  - The Republic of Serbian Krajina was recognised by no state. The map shows it, and the JNA’s hold on the Dubrovnik coast, as areas inside Croatia, whose independence the base map shows from 25 June 1991. Front lines are approximate.
  - Casualty figures for many events are disputed between Croatian, Serbian and international sources; the figures given are those of the sources listed, and ICTY findings where the tribunal settled them.
  - The Croatian army was called the National Guard Corps (ZNG) until November 1991. Croatian Serb forces were the SAO Krajina police and Territorial Defence, from 1992 the Serbian Army of Krajina (SVK).
