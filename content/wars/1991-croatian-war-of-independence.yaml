id: croatian-war-of-independence
name: Croatian War of Independence
start: "1991-03-31"
end: "1995-11-12"
tier: A
summary: The war that followed Croatia’s break with Yugoslavia. From August 1990 Serbs in the Knin region and other Serb-populated areas rose against the new Croatian government and set up the Serbian Autonomous Region of Krajina. After Croatia declared independence on 25 June 1991, the Yugoslav People’s Army (JNA) joined the rebels; by the end of the year Vukovar had been destroyed, Dubrovnik besieged and almost a third of Croatia taken, and most Croats and other non-Serbs had been driven out of the Serb-held areas. A UN-supervised ceasefire from January 1992 froze the front around the Republic of Serbian Krajina for three years. Croatia retook western Slavonia in May 1995 and the Krajina in Operation Storm that August, when most of its Serb population fled. Eastern Slavonia returned peacefully under the Erdut Agreement and a UN transitional administration, which ended in January 1998. More than 20,000 people were killed.
