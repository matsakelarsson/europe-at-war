steps:
  - title: The Log Revolution
    date: August 1990 – March 1991
    when: "1990-08-17"
    borders: "1991-03-31"
    countries: [hr, rs]
    body:
      - Franjo Tuđman’s Croatian Democratic Union won Croatia’s first multi-party elections in spring 1990. Many of the republic’s Serbs, about an eighth of the population, feared the new government, and Belgrade’s media told them they faced persecution. On 17 August 1990 Serbs around Knin, led by Milan Babić and the local police chief Milan Martić, blocked the roads into Dalmatia with felled trees to protect a referendum on Serb autonomy. The “Log Revolution” cut the coast off from the rest of Croatia in the middle of the tourist season.
      - On 21 December the Serb-run municipalities of Knin, Benkovac, Obrovac, Gračac, Vojnić, Dvor and Kostajnica adopted a statute for a Serbian Autonomous Region (SAO) of Krajina. More than two hundred armed incidents followed. In March 1991 Krajina forces clashed with Croatian police at Pakrac, and on 31 March at the Plitvice Lakes, where the policeman Josip Jović and the Krajina fighter Rajko Vukadinović were killed. The next day the SAO Krajina declared that it was leaving Croatia to join Serbia, and the JNA moved in between the two sides.
    facts:
      - [Log Revolution began, 17 August 1990]
      - [SAO Krajina statute, 21 December 1990]
      - [Plitvice Lakes clash, "31 March 1991, one killed on each side"]
