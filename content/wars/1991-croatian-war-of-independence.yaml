  - title: Erdut and the UN transition
    date: November 1995 – January 1998
    when: "1995-11-12"
    borders: "1996-01-15"
    countries: [hr, rs]
    body:
      - After Storm only eastern Slavonia remained in Serb hands. Croatia made its return a condition of taking part in the Dayton peace talks, and the mediators pressed for a peaceful solution. The Erdut Agreement was signed on 12 November 1995 by Hrvoje Šarinić for Croatia and Milan Milanović for the local Serbs, acting on instructions from Belgrade, with the US ambassador Peter Galbraith and the UN mediator Thorvald Stoltenberg as witnesses. It provided for a transitional period under international rule, guarantees of minority rights and the return of refugees.
      - The UN Security Council set up the Transitional Administration for Eastern Slavonia, Baranja and Western Syrmium (UNTAES) on 15 January 1996, with about 5,000 troops. It demilitarised the region, reformed its police, issued Croatian papers and held local elections in April 1997. On 15 January 1998 the region returned to Croatian rule. Its Serb and Croat communities, Vukovar’s above all, remain divided.
    facts:
      - [Erdut Agreement, 12 November 1995]
      - [UNTAES, "15 January 1996 – 15 January 1998"]
      - [War dead, "over 20,000"]
