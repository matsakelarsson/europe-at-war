  - title: Independence and the JNA
    date: May – September 1991
    when: "1991-05-02"
    borders: "1991-08-26"
    countries: [hr, rs]
    link: { href: "#/war/ten-day-war", text: The Ten-Day War in Slovenia }
    body:
      - On 2 May 1991 Croatian police drove into an ambush at Borovo Selo near Vukovar; twelve policemen and one Serb fighter were killed. On 19 May 93 per cent of voters backed independence in a referendum, and Croatia declared independence on 25 June, the same day as Slovenia. Under the Brioni Declaration of 7 July both agreed to suspend their decisions for three months, but the fighting in Croatia only grew.
      - While the JNA left Slovenia, in Croatia it increasingly fought alongside the rebels. Serb forces from eastern Slavonia attacked Dalj on 1 August, killing police and National Guard defenders who had surrendered, and by early August Serb forces had overrun much of Banovina. On 26 August the JNA, under Colonel Ratko Mladić, and Martić’s police took the Croatian village of Kijevo near Knin and burned it. The ICTY later found that the attack was meant to drive its Croat inhabitants out.
    facts:
      - [Independence referendum, "19 May 1991, 93% in favour, 83% turnout"]
      - [Independence declared, 25 June 1991]
      - [Kijevo taken, 26 August 1991]
    markers:
      - kind: battle
        side: rsk
        name: Borovo Selo
        date: 2 May 1991
        text: Croatian police sent to free two captured colleagues were ambushed; twelve policemen and one Serb paramilitary were killed before the JNA intervened.
        lonlat: [18.958, 45.381]
      - kind: capital
        side: hr
        name: Zagreb
        date: 25 June 1991
        text: The Croatian parliament declared independence on 25 June 1991 and, after the Brioni moratorium ran out, cut all remaining ties with Yugoslavia on 8 October.
        lonlat: [15.977, 45.813]
      - kind: event
        name: Dalj
        date: 1 August 1991
        text: Krajina Serb Territorial Defence, the JNA and Serbian paramilitaries took the village; Croatian police and guardsmen who surrendered were killed, and its non-Serb civilians were persecuted until mid-1992.
        lonlat: [18.986, 45.484]
      - kind: taken
        side: rsk
        name: Kijevo
        date: 26 August 1991
        text: Blockaded in April and again from mid-August by the JNA 9th Corps and SAO Krajina police, the village was taken, looted and burned. The ICTY’s Martić judgement of 2007 described the attack as aimed at expelling its Croat population.
        lonlat: [16.351, 43.979]
      - kind: event
        name: Plitvice police station
        date: Late August 1991
        text: The Croatian police post left at the lakes after the March clash was blockaded by the JNA and taken.
        lonlat: [15.61, 44.88]
        lp: l
