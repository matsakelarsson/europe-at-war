  - title: The Sarajevo ceasefire and the UN Protected Areas
    date: January – June 1992
    when: "1992-01-02"
    borders: "1992-01-15"
    countries: [hr, rs]
    body:
      - The UN envoy Cyrus Vance negotiated a ceasefire signed in Geneva on 23 November 1991, which did not hold, and an implementation agreement signed in Sarajevo on 2 January 1992 by the JNA general Andrija Rašeta and Croatia’s defence minister Gojko Šušak, which did. Under the Vance plan the Serb-held areas became UN Protected Areas in four sectors, East, West, North and South, patrolled by the UN Protection Force (UNPROFOR) from spring 1992. The JNA was to leave, local forces to disarm and refugees to return.
      - Only the first part was carried out. The Krajina Serbs, who had proclaimed the Republic of Serbian Krajina on 19 December 1991, kept their weapons under police and army names, and few of the 170,000–250,000 Croats and other non-Serbs driven from the area could return. The European Community recognised Croatia on 15 January 1992, and it joined the UN on 22 May. The front now ran through a quarter of the country, and fighting flared at its edges, as on the Miljevci plateau in June.
    facts:
      - [Implementation agreement, "2 January 1992, Sarajevo"]
      - [EC recognition of Croatia, 15 January 1992]
      - [Area held by the RSK, "about 13,900 km², over a quarter of Croatia"]
