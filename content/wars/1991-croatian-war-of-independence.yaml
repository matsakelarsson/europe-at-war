  - title: Vukovar and Škabrnja
    date: August – December 1991
    when: "1991-08-25"
    borders: "1991-11-18"
    countries: [hr, rs, ba]
    body:
      - From 14 September Croatian forces blockaded JNA barracks across the country and captured many, including all those of the Varaždin corps, gaining the heavy weapons they had lacked. The JNA answered with a full offensive. Vukovar on the Danube, held by about 1,800 guardsmen and volunteers, was besieged for 87 days by up to 36,000 troops and Serbian paramilitaries and reduced to ruins. On 7 October Yugoslav aircraft bombed the presidential palace in Zagreb; the next day Croatia cut its last ties with Yugoslavia.
      - Vukovar fell on 18 November. About 3,000 people had died in the battle, and at least 20,000 inhabitants were expelled. On 20 November some 200 prisoners taken from the town’s hospital were shot at the Ovčara farm; the ICTY convicted the JNA officers Mile Mrkšić and Veselin Šljivančanin. Seventy Croat civilians were killed at Lovas in October, and 62 civilians and five prisoners at Škabrnja near Zadar on 18–19 November, crimes for which the tribunal convicted the Krajina leaders Babić and Martić.
      - Serb civilians were also killed on the Croatian side. In October 100–120 people, most of them Serbs, were murdered in Gospić on the orders of local commanders, and in December soldiers killed 18 Serbs and a Hungarian at Paulin Dvor near Osijek; Croatian courts later convicted those responsible. In late 1991 Croatian offensives in western Slavonia, Otkos 10 and Orkan 91, retook much of the area the JNA had seized there.
    facts:
      - [Siege of Vukovar, "25 August – 18 November 1991, about 3,000 dead"]
      - [Ovčara massacre, "20 November 1991, at least 200 killed"]
      - [Dead by the end of 1991, "about 10,000"]
    markers:
      - kind: siege
        side: yu
        name: Vukovar
        date: 25 August – 18 November 1991
        text: Up to 12,000 shells and rockets a day fell on the town. It was the first major European town to be entirely destroyed since the Second World War.
        lonlat: [19.002, 45.352]
        lp: r
      - kind: event
        name: Ovčara
        date: 20 November 1991
        text: About 200 Croatian prisoners of war and civilians removed from Vukovar hospital, among them Serbs, Hungarians and Bosniaks, were beaten and shot by Krajina Serb Territorial Defence and Serbian paramilitaries after the JNA handed them over.
        lonlat: [19.059, 45.296]
        lp: r
      - kind: event
        name: Lovas
        date: 10–18 October 1991
        text: Seventy Croat civilians were killed after the JNA and Serb paramilitaries occupied the village; on 18 October prisoners were forced to walk into a minefield and then fired upon.
        lonlat: [19.169, 45.226]
        lp: b
      - kind: event
        name: Škabrnja
        date: 18–19 November 1991
        text: After JNA armour broke into the village, SAO Krajina troops killed 62 civilians and five prisoners in Škabrnja and Nadin.
        lonlat: [15.451, 44.091]
        lp: l
      - kind: event
        name: Gospić
        date: October 1991
        text: 100–120 civilians, mostly Serbs arrested in Gospić and Karlobag, were shot. The local commanders Tihomir Orešković and Mirko Norac were convicted in Croatia in 2004.
        lonlat: [15.375, 44.546]
        lp: l
      - kind: event
        name: Paulin Dvor
        date: 11 December 1991
        text: Croatian soldiers killed nineteen civilians aged 41 to 85, eighteen Serbs and one Hungarian. Two were later convicted, and in 2010 President Ivo Josipović apologised at the victims’ graves.
        lonlat: [18.624, 45.443]
        lp: l
      - kind: air
        side: yu
        name: Banski dvori
        date: 7 October 1991
        text: Yugoslav aircraft struck the presidential residence in Zagreb while Tuđman was meeting the federal president Stjepan Mesić and prime minister Ante Marković; none was hurt.
        lonlat: [15.973, 45.816]
      - kind: taken
        side: hr
        name: Varaždin barracks
        date: September 1991
        text: In the Battle of the Barracks Croatian forces took the whole JNA 32nd Corps, with about 250 tanks among the weapons seized across Croatia.
        lonlat: [16.336, 46.305]
