  - title: Maslenica and the Medak Pocket
    date: January – September 1993
    when: "1993-01-22"
    borders: "1993-09-17"
    countries: [hr]
    body:
      - The Serb-held strip around Maslenica left Dalmatia joined to northern Croatia only by ferries and the Pag bridge. On 22 January 1993 the Croatian army attacked, retaking the Maslenica crossing, Zemunik airport and the hinterland of Zadar, and on 28 January the Peruća dam, which Serb forces had mined. Croatian sources put the dead at 114 Croatian and 490 Serb soldiers. The villages of Islam Grčki, Kašić and Smoković were burned. The UN Security Council condemned the offensive.
      - On 9 September Croatian troops attacked the Medak Pocket, a Serb-held salient on the edge of Gospić from which the town was shelled. They took the villages of Divoselo, Čitluk and part of Počitelj, but under international pressure withdrew after a week; by UN and Canadian accounts they exchanged fire with Canadian peacekeepers moving in. The villages were destroyed. ICTY investigators found that at least 100 Serbs had been unlawfully killed; a Croatian court later convicted the commander Mirko Norac of failing to stop the killings of civilians and prisoners.
    facts:
      - [Operation Maslenica, 22 January 1993]
      - [Operation Medak Pocket, 9–17 September 1993]
      - [Serb civilians killed at Medak, "at least 29 identified (ICTY investigators: at least 100 Serbs unlawfully killed)"]
    markers:
      - kind: taken
        side: hr
        name: Maslenica
        date: 22 January 1993
        text: The crossing where the bridge had been destroyed in 1991; its capture reopened a land route to Dalmatia, first by a pontoon bridge.
        lonlat: [15.523, 44.237]
      - kind: taken
        side: hr
        name: Zemunik airport
        date: January 1993
        text: Zadar’s airport, held by Krajina forces since 1991, was retaken.
        lonlat: [15.346, 44.108]
        lp: l
      - kind: taken
        side: hr
        name: Peruća dam
        date: 28 January 1993
        text: Krajina forces had chased off the UN guards and mined the dam above the Cetina valley. The charges they set off as they retreated damaged it, but it held.
        lonlat: [16.589, 43.789]
      - kind: event
        name: Medak Pocket
        date: 9–17 September 1993
        text: About 400 Serb civilians lived in the pocket before the attack. Twenty-nine executed civilians and five killed prisoners were identified, and Serb property was systematically looted and destroyed.
        lonlat: [15.43, 44.48]
        lp: r
      - kind: held
        side: hr
        name: Gospić
        date: 1991–1995
        text: The town remained in Croatian hands throughout the war but was regularly shelled from the Serb-held hills to its south and east.
        lonlat: [15.375, 44.546]
        lp: l
      - kind: event
        name: Islam Grčki
        date: January 1993
        text: This Serb village, with Kašić and Smoković, was burned by Croatian forces, and many civilians fled.
        lonlat: [15.455, 44.174]
        lp: b
