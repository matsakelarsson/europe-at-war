  - title: Flash and Storm
    date: May – August 1995
    when: "1995-05-01"
    borders: "1995-08-07"
    countries: [hr, ba, rs]
    link: { href: "#/war/bosnian-war", text: The Bosnian War }
    body:
      - A ceasefire in March 1994 and an economic agreement in December reopened the Zagreb–Belgrade motorway through western Slavonia, but Krajina leaders refused even to receive the Z-4 peace plan in January 1995. On 1 May the Croatian army launched Operation Flash and in three days took the 558 km² Serb-held salient around Okučani. Of about 14,000 Serbs there, most fled. In reply Krajina forces fired cluster rockets at Zagreb on 2 and 3 May, killing seven people; the ICTY convicted Martić for the attacks.
      - In late July Croatian and Bosnian Croat forces took Bosansko Grahovo and Glamoč in Bosnia, outflanking Knin. Operation Storm began on 4 August along a 630 km front. Knin fell the next day, and on 6 August Croatian troops linked up with the Bosnian army’s 5th Corps, ending the siege of Bihać. Within four days Croatia had retaken 10,400 km², the whole of the Krajina except eastern Slavonia.
      - On 4 August the Krajina authorities ordered the evacuation of northern Dalmatia and Lika, and 150,000–200,000 Serbs fled to Bosnia and Serbia. Many of the elderly who stayed were killed in the following months, as at Grubori and Varivode, and villages were looted and burned; ICTY prosecutors put the civilian dead at 324, Serbian sources at 1,192. The tribunal convicted the generals Ante Gotovina and Mladen Markač in 2011, but acquitted them on appeal in 2012, rejecting the charge of a plan to expel the Serbs.
    facts:
      - [Operation Flash, "1–3 May 1995, 558 km² retaken"]
      - [Operation Storm, "4–7 August 1995, 10,400 km² retaken"]
      - [Serbs who fled, "150,000–200,000"]
    markers:
      - kind: taken
        side: hr
        name: Okučani
        date: 2 May 1995
        text: Croatian columns from Novska and Nova Gradiška met at the town; the last organised Krajina resistance in western Slavonia ended on 3 May.
        lonlat: [17.199, 45.26]
        lp: b
      - kind: event
        name: Rocket attacks on Zagreb
        date: 2–3 May 1995
        text: Orkan rockets with cluster munitions killed seven people and wounded more than 200 in the capital. The ICTY found Martić responsible.
        lonlat: [15.977, 45.813]
      - kind: taken
        side: hr
        name: Knin
        date: 5 August 1995
        text: The Krajina capital fell on the second day of Storm, after the Split Corps under Ante Gotovina came down from the Dinara.
        lonlat: [16.197, 44.041]
      - kind: event
        side: hr
        name: Tržačka Raštela
        date: 6 August 1995
        text: Croatian troops linked up with the Bosnian 5th Corps near Rakovica, ending the three-year siege of the Bihać pocket; the meeting was staged for the press here.
