  - title: The siege of Dubrovnik
    date: October 1991 – October 1992
    when: "1991-10-01"
    borders: "1991-12-06"
    countries: [hr, me, ba, rs]
    body:
      - On 1 October 1991 the JNA attacked the Dubrovnik region from Montenegro and eastern Herzegovina, with many Montenegrin reservists in its ranks, while the Yugoslav Navy blockaded the coast. Cavtat fell on 16 October, and by the end of the month the army held almost all the land between the Pelješac peninsula and Prevlaka except Dubrovnik itself, defended at first by a few hundred poorly armed men. Villages in Konavle and the Dubrovnik hinterland were looted and burned.
      - The city was shelled for months, most heavily on 6 December, when the walled Old Town, a World Heritage Site, was hit. The bombardment caused international outrage and helped bring about recognition of Croatia. About 16,000 refugees were evacuated by sea. In May 1992 the JNA pulled back into Herzegovina and handed its equipment to the Bosnian Serb army, and by the end of 1992 Croatian forces had retaken the whole region. The ICTY convicted the commanders Pavle Strugar and Miodrag Jokić for the attacks on the Old Town.
    facts:
      - [Croatian dead, "194 soldiers and 82–88 civilians"]
      - [JNA dead, 165]
      - [Heaviest shelling, 6 December 1991]
    markers:
      - kind: siege
        side: hr
        name: Dubrovnik
        date: October 1991 – May 1992
        text: The city held out under siege and naval blockade, without electricity or running water for three months; more than 11,000 buildings in the region were damaged.
        lonlat: [18.109, 42.641]
        lp: b
      - kind: held
        side: hr
        name: Fort Imperial, Srđ
        date: 6 December 1991
        text: The fort above the city, held by a handful of defenders, was attacked on 6 December but not taken.
        lonlat: [18.113, 42.648]
        lp: t
      - kind: taken
        side: yu
        name: Cavtat
        date: 16 October 1991
        text: Taken by the JNA’s Boka Kotorska naval sector, supported by a landing east of Dubrovnik.
        lonlat: [18.219, 42.581]
        lp: b
      - kind: taken
        side: yu
        name: Slano
        date: October 1991
        text: The JNA’s advance from Herzegovina reached the coast at Slano, cutting the road to the north.
        lonlat: [17.892, 42.786]
        lp: l
      - kind: taken
        side: hr
        name: Konavle
        date: September – October 1992
        text: Croatian forces retook the area south-east of Dubrovnik after the JNA’s withdrawal; Operation Tiger had pushed the front back from the city in July 1992.
        lonlat: [18.374, 42.518]
        lp: r
      - kind: event
        name: Prevlaka
        date: 1992–2002
        text: The peninsula at the mouth of the Bay of Kotor was demilitarised and watched by UN military observers until 2002.
        lonlat: [18.515, 42.401]
        lp: b
