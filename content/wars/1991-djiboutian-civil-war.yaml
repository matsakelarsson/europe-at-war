id: djiboutian-civil-war
name: Djiboutian Civil War
start: "1991-10"
end: "1994-12-26"
tier: C
summary: "An armed rising of the Front for the Restoration of Unity and Democracy (FRUD), drawn mainly from the Afar of northern and western Djibouti, against the government of President Hassan Gouled Aptidon, which was dominated by the Issa Somali and his single party, the People’s Rally for Progress. Formed in 1991 from Afar opposition groups, FRUD began its guerrilla campaign in the autumn of 1991, attacked the garrison of Obock in November, took most of the army posts in the north and besieged Tadjourah and Obock. In December 1991 troops fired on a crowd in the Arhiba district of the capital, killing at least 59 people. France, which kept a large garrison in Djibouti, deployed troops in the north from February 1992 as a buffer and pressed for talks, and Djibouti adopted a multi-party constitution in September 1992, although FRUD boycotted the elections. On 5 July 1993 the much-enlarged army launched a counteroffensive that took FRUD’s main base at Assa-Gueyla and the towns of the north and west; some 70,000 civilians were driven from their homes and about 30,000 fled the country. A faction of FRUD under Ali Mohamed Daoud signed a peace agreement at Aba’a on 26 December 1994, joining the government and integrating its fighters into the army; the faction of Ahmed Dini Ahmed fought on at a low level until a final agreement on 12 May 2001. Estimates of the dead are uncertain; FRUD’s losses are given as about 1,000."
