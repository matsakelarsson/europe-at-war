steps:
  - title: The uprising
    date: 1–20 March 1991
    when: "1991-03-01"
    borders: "1991-03-20"
    countries: [iq]
    body:
      - On 15 February 1991, during the Gulf War, President George H. W. Bush called on the Iraqi military and people to “take matters into their own hands” and force Saddam Hussein aside. Soon after the ceasefire, on 1 March, soldiers returning from the defeat in Kuwait turned their guns on Ba’ath party offices and portraits of Saddam in Basra. Within days the revolt spread to Nasiriyah, Amarah, Kut, Hilla, Diwaniyah and the holy cities of Najaf and Karbala, where rebels killed Ba’ath officials and security men, opened prisons and looked to the senior clergy for leadership. Fighters of SCIRI crossed from Iran with portraits of Ayatollah Khomeini, which alarmed Washington and the Gulf states.
      - In the north the uprising began in Ranya on 5 March. Kurdish townspeople and Peshmerga of the Kurdistan Front took Sulaymaniyah, Erbil, Duhok and Zakho, and on 20 March Kirkuk. Many of the government’s Kurdish militiamen changed sides. In the south, though, the rebels had no common leadership or plan, and the coalition, whose troops still occupied the far south, stood aside.
    facts:
      - [Uprising begins in Basra, "1 March 1991"]
      - [Kurdish uprising begins in Ranya, "5 March 1991"]
      - [Kirkuk taken by the Kurds, "20 March 1991"]
