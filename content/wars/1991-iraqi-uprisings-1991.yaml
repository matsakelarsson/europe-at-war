id: iraqi-uprisings-1991
name: 1991 Iraqi uprisings
start: "1991-03-01"
end: "1991-04-05"
tier: B
summary: The revolts that broke out across southern and northern Iraq after the Gulf War ceasefire, against Saddam Hussein’s government. Beginning in Basra on 1 March 1991 among soldiers retreating from Kuwait, the uprising spread within days through the Shia cities of the south, and from 5 March the Kurds rose in the north, taking Sulaymaniyah, Erbil and, on 20 March, Kirkuk. At their height the rebels held 14 of Iraq’s 18 provinces. But the Republican Guard had survived the war, the coalition allowed Iraq to fly helicopters, and the United States, which had called on Iraqis to rise, did not intervene. By early April loyal forces had crushed the revolts with great brutality, shelling the shrine cities of Najaf and Karbala and executing thousands. Nearly two million people, most of them Kurds, fled towards Turkey and Iran, and the UN Security Council’s Resolution 688 led to a Western-protected safe haven in the north and, later, Kurdish self-rule.
