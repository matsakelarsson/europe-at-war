notes:
  - Estimates of the dead range widely, from tens of thousands to as many as 180,000, and include many civilians and prisoners executed after the fighting; mass graves from 1991 were still being found after 2003. Human Rights Watch documented systematic killings in its 1992 report Endless Torment.
  - The southern uprising was largely spontaneous, joined by army deserters, Shia clergy and, from Iran, fighters of the Supreme Council for the Islamic Revolution in Iraq (SCIRI). The Kurdish parties had formed the Iraqi Kurdistan Front in 1988. Rebel-held areas are drawn approximately; many cities changed hands within days.
