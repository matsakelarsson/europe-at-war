  - title: The crushing of the revolts and the safe haven
    date: March – October 1991
    when: "1991-03-05"
    borders: "1991-10-31"
    countries: [iq, tr, ir]
    body:
      - Republican Guard divisions, with tanks, artillery and helicopter gunships, retook the southern cities one by one in March. Najaf and Karbala were shelled and stormed, the shrines damaged, and thousands of young men were rounded up and shot; many rebels and civilians fled into the southern marshes or to the coalition lines and Saudi Arabia. At the end of March the army turned north, retook Kirkuk on 28–29 March, Erbil and Duhok on 30 March and Sulaymaniyah on 3 April. Fearing a repeat of the gassings of 1988, almost the entire Kurdish population of the cities fled into the mountains, and some 1.5 million Kurds made for the Iranian and Turkish borders in the cold and rain, and hundreds died each day in the camps on the Turkish side.
      - On 5 April the UN Security Council condemned the repression in Resolution 688. The United States, Britain and France launched Operation Provide Comfort to drop supplies and, from mid-April, sent troops into northern Iraq to build camps in a safe haven around Zakho, protected by a no-fly zone north of the 36th parallel, so that the refugees could come down from the mountains. In October 1991 the government pulled its administration and troops out of most of the Kurdish provinces, which then governed themselves. A second no-fly zone over the south followed in August 1992, but it did not stop the army from draining the marshes and crushing the Shia resistance there.
    facts:
