id: january-events-1991
name: January Events in Vilnius and Riga
start: "1991-01-11"
end: "1991-01-27"
tier: C
summary: In January 1991 the Soviet leadership tried to reverse the independence moves of Lithuania, which had declared independence on 11 March 1990, and of Latvia. In Vilnius, in the early hours of 13 January, Soviet troops, among them paratroopers and the KGB’s Alpha unit, stormed the television tower and the radio and television building; 14 unarmed civilians died, 13 of them killed by Soviet fire, and hundreds were injured. A KGB officer was also killed, by a shot from his own side. Crowds kept watch around the parliament, which was not attacked. In Riga, from 13 January, tens of thousands of people built and guarded barricades around key buildings; six people died in Soviet attacks, five of them in the OMON assault on the Latvian interior ministry on 20 January. The violence drew international condemnation, and the Soviet Union recognised the independence of both states in September 1991.
