notes:
  - Sources give different numbers of injured in Vilnius, from over 140 to about 700. The count of 14 civilian dead includes one man who died of a heart attack during the assault.
  - The Latvian events are known as the Barricades (Barikādes), and the Lithuanian ones as the January Events (Sausio įvykiai).
