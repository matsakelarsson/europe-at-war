steps:
  - title: The RUF crosses from Liberia
    date: March 1991 – 1992
    when: "1991-03-23"
    borders: "1991-06-01"
    countries: [sl, lr]
    body:
      - Sierra Leone had been a one-party state under the All People’s Congress since 1978. Its diamonds, gold and rutile enriched a small elite and smugglers, while schools and services decayed and many young men lived by digging diamonds or not at all. Foday Sankoh, a former army corporal who had been jailed after a coup plot in 1971, formed the Revolutionary United Front with other Sierra Leonean radicals, some of whom had trained in Libya, and allied himself with Charles Taylor, whose NPFL resented Sierra Leone’s part in ECOMOG.
      - On 23 March 1991 RUF and NPFL fighters attacked Bomaru in Kailahun District, and a second force entered Pujehun District in the south. They took much of the east and south, recruiting and abducting young people and killing chiefs, officials and traders. The army, small and badly paid, grew rapidly by recruiting young men and boys. On 29 April 1992 young officers led by Captain Valentine Strasser, who had fought at the front, overthrew President Joseph Momoh and set up the National Provisional Ruling Council (NPRC).
    facts:
      - [RUF invasion, "23 March 1991"]
      - [NPRC coup, "29 April 1992"]
