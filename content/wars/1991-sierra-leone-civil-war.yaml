id: sierra-leone-civil-war
name: Sierra Leone Civil War
start: "1991-03-23"
end: "2002-01-18"
tier: A
summary: "The war that began when the Revolutionary United Front (RUF) of Foday Sankoh, backed by Charles Taylor’s NPFL, crossed from Liberia into eastern Sierra Leone on 23 March 1991. Sierra Leone had been run down by decades of one-party rule and corruption, and the RUF, which claimed to fight for the poor and the young, became notorious for abducting children as fighters, for mass rape and for cutting off the hands and limbs of civilians. The war was fought over the alluvial diamond fields as much as for power. Young officers of the National Provisional Ruling Council (NPRC) seized power in 1992; in 1995 the government hired the South African private military company Executive Outcomes, which, with local hunters’ militias, the Kamajors, drove the RUF back. After an election in 1996, soldiers of the Armed Forces Revolutionary Council (AFRC) overthrew President Ahmad Tejan Kabbah in May 1997 and shared power with the RUF until the Nigerian-led ECOMOG force drove them from Freetown in February 1998. In January 1999 the rebels stormed Freetown again, killing thousands. The Lomé agreement of July 1999 brought Sankoh into government and a United Nations force, UNAMSIL, into the country, but the RUF’s seizure of some 500 peacekeepers in May 2000 led to British intervention, Sankoh’s arrest and, with Guinean attacks on the RUF, its disarmament. Kabbah declared the war over on 18 January 2002. Some 50,000 to 70,000 people were killed and about 2.5 million, half the population, displaced."
countries: [sl, lr, gn, ng, gb]
