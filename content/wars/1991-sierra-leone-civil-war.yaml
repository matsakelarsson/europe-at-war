  - title: Freetown, January 1999
    date: December 1998 – January 1999
    when: "1999-01-06"
    borders: "1999-01-06"
    countries: [sl, ng]
    body:
      - In December 1998 the RUF and AFRC took Koidu and Makeni and advanced on the capital. On 6 January 1999 they broke into Freetown, in an offensive some of its commanders called Operation No Living Thing, and held the eastern half of the city for about two weeks. They killed civilians systematically, burned thousands of homes, cut off the hands and arms of hundreds of people and abducted thousands, many of them children, when they withdrew.
      - ECOMOG, mainly Nigerian, fought them house by house and drove them out by the end of January, and its own soldiers summarily executed suspected rebels and collaborators. Human Rights Watch estimated that more than 7,000 people were killed in the battle for Freetown, at least half of them civilians.
    facts:
      - [Attack on Freetown, "6 January 1999"]
      - [Killed, "more than 7,000, at least half civilians (Human Rights Watch estimate)"]
