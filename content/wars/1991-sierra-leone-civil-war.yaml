  - title: The AFRC junta
    date: May 1997 – March 1998
    when: "1997-05-25"
    borders: "1997-06-01"
    countries: [sl, ng, gn]
    body:
      - "On 25 May 1997 soldiers broke open Freetown’s Pademba Road prison, freed some 600 inmates, among them Major Johnny Paul Koroma, and overthrew Kabbah, who fled to Conakry. Koroma’s Armed Forces Revolutionary Council invited the RUF to share power, and RUF fighters came into the capital; the junta ruled by looting and terror, and most of the world, ECOWAS above all, refused to recognise it. Nigerian troops already in the country under ECOMOG held Lungi airport and fought the junta, and ECOWAS imposed sanctions; a peace plan agreed at Conakry in October 1997 was not carried out."
      - "In February 1998 Nigerian-led ECOMOG troops attacked and drove the AFRC and RUF out of Freetown, and Kabbah returned on 10 March. The Kamajors fought the junta in the south and east. A British company, Sandline International, had helped supply arms to Kabbah’s side in breach of a UN embargo, which caused a scandal in London. The junta’s forces retreated into the north and east, looting as they went."
    facts:
      - [AFRC coup, "25 May 1997"]
      - [Conakry Peace Plan, "October 1997"]
      - [ECOMOG takes Freetown, "February 1998"]
      - [Kabbah returns, "10 March 1998"]
