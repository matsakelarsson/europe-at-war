  - title: Diamonds, sobels and mercenaries
    date: 1993–1996
    when: "1995-01"
    borders: "1995-06-01"
    countries: [sl, za]
    body:
      - In 1993 the army, helped by Nigerian and Guinean troops, pushed the RUF back to the Liberian border and retook the Kono diamond fields around Koidu. The RUF broke into small bands in the forests and came back in 1994 and 1995 with raids across the country, often in collusion with government soldiers. In January 1995 it overran the Sierra Rutile and Sieromco mines in the south-west, taking foreign workers hostage, and by the spring it was attacking villages within about 30 km of Freetown. The NPRC hired Gurkha Security Guards, whose commander was killed in February 1995, and then the South African company Executive Outcomes, made up largely of veterans of South Africa’s apartheid-era special forces.
      - Executive Outcomes’ few hundred men, with helicopters and armoured vehicles, drove the RUF from the outskirts of Freetown and in August 1995 retook Koidu and the Kono diamond fields; the company was paid partly in mining concessions. Local hunters’ societies, the Kamajors of the Mende country, became a militia, the Civil Defence Forces, under Sam Hinga Norman. After Brigadier Julius Maada Bio replaced Strasser in January 1996, elections went ahead in February and March, and Ahmad Tejan Kabbah of the Sierra Leone People’s Party became president. On 30 November 1996 Kabbah and Sankoh signed a peace agreement at Abidjan, and Executive Outcomes left in early 1997.
    facts:
      - [Rutile and bauxite mines seized, "January 1995"]
      - [Executive Outcomes hired, "1995"]
      - [Kono retaken, "August 1995"]
      - [Abidjan Peace Accord, "30 November 1996"]
