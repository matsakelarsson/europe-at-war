  - title: Lomé, UNAMSIL and the British
    date: July 1999 – September 2000
    when: "2000-05"
    borders: "2000-05-17"
    countries: [sl, gb]
    body:
      - "Under pressure from its Western backers and with Nigeria preparing to withdraw, the government signed a peace agreement with the RUF at Lomé on 7 July 1999. It gave the rebels an amnesty and made Sankoh vice-president and chairman of a commission over the country’s mineral resources. In October 1999 the UN Security Council set up the United Nations Mission in Sierra Leone (UNAMSIL), which took over from ECOMOG. The RUF kept control of the diamond fields and obstructed disarmament."
      - "In May 2000 RUF fighters seized some 500 UNAMSIL peacekeepers, most of them Zambian and Kenyan, and advanced towards Freetown. Britain sent paratroopers, marines and warships in Operation Palliser, at first to evacuate foreigners; they secured Lungi airport and the capital and then helped the army and UNAMSIL stop the rebels. On 8 May Sankoh’s guards fired on protesters outside his house, killing about twenty, and on 17 May he was captured. Indian troops rescued a besieged UNAMSIL garrison at Kailahun in July, and on 10 September British special forces and paratroopers freed soldiers held by the West Side Boys, an AFRC splinter group, at Gberi Bana near Magbeni in Operation Barras."
    facts:
      - [Lomé Peace Accord, "7 July 1999"]
      - [UNAMSIL established, "October 1999"]
      - [Peacekeepers seized, "May 2000"]
      - [Sankoh captured, "17 May 2000"]
      - [Operation Barras, "10 September 2000"]
