  - title: Disarmament and the end of the war
    date: September 2000 – January 2002
    when: "2001-05"
    borders: "2002-01-18"
    countries: [sl, gn, lr]
    body:
      - From September 2000 RUF fighters and Liberian forces raided across the border into Guinea, which hosted hundreds of thousands of Sierra Leonean and Liberian refugees. The Guinean army and its helicopter gunships struck back hard at the RUF’s bases in the border areas and in Kambia and Kailahun districts in late 2000 and 2001, while United Nations sanctions on Liberian diamonds cut Taylor’s support.
      - Weakened, the RUF agreed to a ceasefire at Abuja on 10 November 2000 and, in May 2001, to disarm alongside the CDF. UNAMSIL, at its peak about 17,500 troops, then the largest UN peacekeeping force in the world, deployed across the country, and more than 70,000 fighters disarmed by January 2002. On 18 January 2002 Kabbah declared the war over; he was re-elected in May 2002, and UNAMSIL left at the end of 2005.
    facts:
      - [Abuja ceasefire, "10 November 2000"]
      - [Abuja II agreement, "May 2001"]
      - [War declared over, "18 January 2002"]
      - [Combatants disarmed, "more than 70,000"]
