notes:
  - "Atrocities. All armed groups committed abuses, but the RUF and AFRC were responsible for most of them, according to the Truth and Reconciliation Commission. Thousands of people had hands, arms or legs cut off; tens of thousands of women and girls were raped; and all sides, including the army and the CDF, used child soldiers. Government soldiers who looted and collaborated with the rebels were called “sobels”, soldiers by day and rebels by night."
  - "The Special Court for Sierra Leone, set up by the United Nations and the government in 2002, convicted leaders of the RUF, the AFRC and the CDF; Foday Sankoh died in custody in 2003 before his trial ended. In 2012 it convicted Charles Taylor of aiding and abetting the RUF’s and AFRC’s crimes and sentenced him to 50 years in prison."
  - The diamonds the RUF sold through Liberia led to the campaign against “blood diamonds” and to the Kimberley Process for certifying the origin of rough diamonds (2003).
