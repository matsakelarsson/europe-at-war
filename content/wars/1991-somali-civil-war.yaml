  - title: The battle of Mogadishu and the withdrawal
    date: July 1993 – March 1995
    when: "1993-10-03"
    borders: "1993-10-03"
    countries: [so, us, pk, my]
    view: { center: [45.330, 2.035], size: [50, 40] }
    body:
      - "Through the summer of 1993 UNOSOM II and American forces hunted Aidid in Mogadishu, and his militia fought back. On 12 July American helicopters attacked a meeting at the house of Abdi Hassan Awale (Abdi Qeybdiid), killing dozens of clan elders and others, many of them moderates; the Red Cross counted 215 Somali casualties. Four foreign journalists who came to the scene were killed by the crowd. Many Somalis turned against the UN, and Aidid’s supporters began to target American troops."
      - "On 3 October 1993 the US special forces of Task Force Ranger, Rangers and Delta Force operators, flew from their base at the airport to seize two of Aidid’s lieutenants at a house near the Olympic Hotel, by the Bakara market. The raid, planned to last about half an hour, became an all-night battle when militiamen and armed residents shot down two Black Hawk helicopters with rocket-propelled grenades; the pilot of the second, Michael Durant, was captured. A relief column of the US 10th Mountain Division in Malaysian armoured vehicles, with Pakistani tanks, reached the trapped soldiers in the night and brought them out to the Pakistani-held stadium the next morning. Eighteen Americans and one Malaysian were killed; Somali dead were estimated at between 200 and 700, many of them civilians."
      - "Pictures of dead American soldiers dragged through the streets turned American opinion against the mission. President Bill Clinton announced that US forces would leave by 31 March 1994, and they did. UNOSOM II stayed on without them, losing more peacekeepers, until the last UN troops were evacuated under American and Italian cover in March 1995. Aidid had made himself president in June 1995 but controlled only part of the capital; he died of wounds on 1 August 1996, and his son Hussein Farrah Aidid succeeded him."
    facts:
      - [Attack on Abdi House, "12 July 1993"]
      - [Battle of Mogadishu, "3–4 October 1993"]
      - [American dead, "18 (and one Malaysian)"]
      - [Last US troops leave, "March 1994"]
      - [Last UN troops leave, "March 1995"]
