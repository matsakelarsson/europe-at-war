  - title: The battle for Mogadishu
    date: January 1991 – March 1992
    when: "1991-11-17"
    borders: "1991-11-17"
    countries: [so]
    view: { center: [45.250, 2.300], size: [380, 300] }
    body:
      - "The victors quarrelled at once. On 29 January 1991 a USC group, the Manifesto group of Mogadishu businessmen and politicians, named Ali Mahdi Muhammad, a hotelier of the Abgaal clan, as interim president. Aidid, of the Habar Gidir, who had led the USC’s fighters, refused to accept him. Conferences in Djibouti in June and July 1991 confirmed Ali Mahdi but did not bring Aidid in."
      - "On 17 November 1991 full-scale war broke out between the two factions in the capital. For four months the city was divided along a front, later called the Green Line, between Ali Mahdi’s north and Aidid’s south, which held the airport and the port, and both sides shelled each other’s districts with artillery, mortars and anti-aircraft guns mounted on trucks, the “technicals”. Africa Watch estimated that some 14,000 people were killed and 27,000 wounded, most of them civilians. A UN-brokered ceasefire took effect on 3 March 1992, but the city stayed divided."
    facts:
      - [Ali Mahdi named interim president, "29 January 1991"]
      - [War in Mogadishu, "17 November 1991 – 3 March 1992"]
      - [Dead and wounded, "about 14,000 killed and 27,000 wounded (Africa Watch)"]
    markers:
      - kind: battle
        name: Mogadishu
        date: 17 November 1991 – 3 March 1992
        text: Ali Mahdi held the north of the city and Aidid the south, with the airport and the port. The front between them was later called the Green Line.
        lonlat: [45.342, 2.035]
      - kind: battle
        side: aidid
        name: Afgooye
        date: April 1992
        text: Aidid’s forces defeated an attempt by Siad Barre’s Somali National Front to advance on Mogadishu, then pursued it to the Kenyan border.
        lonlat: [45.119, 2.146]
        lp: l
