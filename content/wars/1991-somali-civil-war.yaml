  - title: The Islamic Courts take Mogadishu
    date: February – December 2006
    when: "2006-06-05"
    borders: "2006-10-01"
    countries: [so, et, us]
    body:
      - "Since the 1990s clan-based sharia courts in Mogadishu had restored a measure of order in their districts, with militias of their own, and businessmen funded them. They formed a joint council, from 2006 the Islamic Courts Union (ICU), led by Sharif Sheikh Ahmed, a schoolteacher, with Hassan Dahir Aweys, a former leader of al-Itihaad, as head of its council. Its youth militia, al-Shabaab (“the Youth”), was led by men trained in Afghanistan."
      - "In February 2006 Mogadishu faction leaders formed the Alliance for the Restoration of Peace and Counter-Terrorism (ARPCT), which, as was soon reported, the United States funded to hunt suspected members of al-Qaeda. The fighting between the alliance and the Courts killed hundreds of people, mostly civilians, and by 5 June 2006 the ICU had driven the alliance’s faction leaders out of the capital. Mogadishu was united under one authority for the first time since 1991; the airport and port reopened, and the Courts banned the public showing of football matches and the chewing of khat."
      - "The Courts took Jowhar on 14 June and spread across the south, taking Beledweyne and, on 24–25 September, Kismayo. Talks with the Transitional Federal Government, which held only Baidoa, failed. Ethiopia, which saw the Courts as a threat because of Aweys’s past and their claims on the Ogaden, sent troops to protect Baidoa, and Eritrea sent arms to the Courts. On 24 December 2006 Ethiopia openly went to war."
    facts:
      - [ARPCT formed, "February 2006"]
      - [Islamic Courts take Mogadishu, "5 June 2006"]
      - [Kismayo taken, "24–25 September 2006"]
      - [Ethiopian intervention, "24 December 2006"]
