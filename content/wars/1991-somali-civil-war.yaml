  - title: The famine
    date: 1991–1992
    when: "1992-09"
    borders: "1992-09-01"
    countries: [so]
    body:
      - "The worst suffering fell on the farmers of the lands between the Juba and Shebelle rivers, mostly of the Digil and Mirifle (Rahanweyn) clans and the Bantu minority, who had few weapons of their own. The armies of Siad Barre, the Somali Patriotic Movement and Aidid’s USC fought back and forth across the region in 1991–1992, looting grain stores, killing livestock and driving people from their farms, while drought ruined the harvest. Baidoa, the capital of the Bay region, became known as the “city of death”; Bardera, on the Juba, was another centre of the famine."
      - "Relief agencies such as the International Committee of the Red Cross, which distributed most of the food that reached Somalia, worked under the protection of hired gunmen, and militias looted aid at the ports and on the roads, though how much is disputed. The UN set up a small mission, UNOSOM I, in April 1992, with 50 observers and later 500 Pakistani troops who were confined to Mogadishu airport. At the peak, in the autumn of 1992, tens of thousands died each month, many of them children, of hunger, measles and other diseases. Estimates of the total range from about 200,000 to 300,000 dead."
    facts:
      - [UNOSOM I established, "April 1992"]
      - [Peak of the famine, "September – November 1992"]
      - [Dead, "about 200,000–300,000"]
    markers:
      - kind: toll
        name: Baidoa
        date: 1992
        text: The “city of death”, where hundreds of people died each day at the height of the famine in the autumn of 1992.
        lonlat: [43.644, 3.120]
      - kind: toll
        name: Bardera
        date: 1992
        text: Fought over by Siad Barre’s forces and Aidid’s; the famine here was among the worst.
        lonlat: [42.285, 2.337]
        lp: l
      - kind: event
        side: un
        name: Mogadishu
        date: April – September 1992
        text: UNOSOM I’s observers and Pakistani troops arrived but could not protect relief beyond the airport.
        lonlat: [45.342, 2.035]
    areas:
      - style: contested
        label: Worst-hit famine areas
        atoms: [SO-BY, SO-BK, SO-SH, SO-GE, SO-JD]
  - title: Restore Hope and UNOSOM II
    date: December 1992 – June 1993
    when: "1992-12-09"
    borders: "1993-01-01"
    countries: [so, us]
    body:
      - "On 3 December 1992 the UN Security Council authorised a US-led force to secure the delivery of relief, and on 9 December the first American marines came ashore at Mogadishu before the television cameras. The Unified Task Force (UNITAF), Operation Restore Hope to the Americans, grew to some 37,000 troops from more than twenty countries, about 25,000 of them American. It spread out to the relief centres of the south, Baidoa, Bardera, Kismayo, Beledweyne, Merca and others, divided into sectors among the national contingents. Food reached the famine areas, though the worst of the famine had passed by then; studies credit the international effort as a whole with saving about 100,000 lives."
      - "UNITAF worked with the faction leaders rather than disarming them, and in March 1993 peace talks in Addis Ababa brought fifteen factions to sign an agreement. On 4 May 1993 UNITAF handed over to UNOSOM II, a UN force of some 28,000 troops with a mandate to disarm the factions and rebuild the state, which Aidid saw as directed against him. On 5 June 1993 Aidid’s militia and crowds attacked Pakistani peacekeepers inspecting his weapons stores and radio station, killing 24 of them. The next day the Security Council called for the arrest of those responsible."
    facts:
      - [UNITAF lands, "9 December 1992"]
      - [UNITAF troops, "about 37,000 (25,000 American)"]
      - [UNOSOM II takes over, "4 May 1993"]
      - [Pakistani peacekeepers killed, "5 June 1993 (24 dead)"]
