notes:
  - "Somali politics in these years was organised largely by clan, and the factions are usually described by the clan families and clans that backed them: the USC by the Hawiye (Ali Mahdi by the Abgaal, Aidid by the Habar Gidir), the Somali Salvation Democratic Front by the Majeerteen (Darod), the Somali Patriotic Movement by the Ogaden (Darod), the SNM by the Isaaq, and the Rahanweyn Resistance Army by the Digil and Mirifle. Such labels simplify: every faction had members and opponents from many clans."
  - "Numbers are uncertain. Estimates for the famine of 1991–1992 range from about 200,000 to 300,000 dead; for the fighting in Mogadishu in 1991–1992 Africa Watch gave about 14,000 killed and 27,000 wounded; for the battle of 3–4 October 1993, between about 200 and 700 Somalis killed (the Somali National Alliance said 315)."
  - The independence of Somaliland, declared in May 1991, has its own story (Somaliland War of Independence).
