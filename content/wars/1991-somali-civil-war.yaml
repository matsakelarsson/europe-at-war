id: somali-civil-war
name: Somali Civil War (1991–2006)
start: "1991-01-26"
end: "2006-12-24"
tier: A
summary: "The collapse of the Somali state and the fifteen years of war, famine and failed peace efforts that followed. When clan-based rebel movements drove Mohamed Siad Barre from Mogadishu in January 1991, the victors fell out: the United Somali Congress split between Ali Mahdi Muhammad and Mohamed Farrah Aidid, whose battle for the capital killed thousands, while the north-west declared itself independent as Somaliland. War and drought caused the famine of 1991–1992, in which some 200,000–300,000 people died, most in the farming lands between the Juba and Shebelle rivers. A US-led force (UNITAF) secured relief from December 1992, but its UN successor, UNOSOM II, was drawn into war with Aidid; after the battle of Mogadishu on 3–4 October 1993, in which 18 American soldiers and hundreds of Somalis were killed, the United States and then the UN withdrew. For a decade Somalia had no central government: Puntland and other regions set up their own administrations, and a series of peace conferences produced governments that could not govern. In 2006 the Islamic Courts Union defeated the faction leaders of Mogadishu, often called warlords, and took most of the south, which led to the Ethiopian intervention of December 2006."
countries: [so, us, et, ke, dj]
