  - title: The years without a state
    date: 1995–2004
    when: "1998-08-01"
    borders: "2000-08-26"
    countries: [so, et, ke, dj]
    body:
      - "After the UN left, Somalia had no central government for a decade. Faction leaders, the “warlords”, held parts of Mogadishu and the south, taxed roads and ports, and fought one another; Ali Mahdi and Hussein Aidid kept the capital divided until 1998. Ethiopian troops crossed the border in 1996–1997 to attack the Islamist group al-Itihaad al-Islami around Luuq and Dolo, and later armed allied factions. The Rahanweyn Resistance Army took Baidoa in 1999 with Ethiopian support. In the north-east, a conference at Garowe founded the autonomous Puntland State on 1 August 1998 under Abdullahi Yusuf Ahmed, while Somaliland in the north-west kept its own peace."
      - "Without a state, Somalis rebuilt much of daily life through clans, elders, Islamic courts and private business, from money-transfer companies to mobile telephones. Neighbours and the UN held a long series of peace conferences. At Arta in Djibouti in 2000 a conference of clan delegates and civil society chose a Transitional National Government under Abdiqasim Salad Hassan, which most faction leaders rejected and which never controlled more than parts of Mogadishu. Talks in Kenya from 2002, at Eldoret and Mbagathi, produced a Transitional Federal Government; its parliament elected Abdullahi Yusuf president on 10 October 2004. Too insecure to sit in Mogadishu, the government moved in 2005 to Jowhar and then Baidoa."
    facts:
      - [Aidid dies, "1 August 1996"]
      - [Puntland founded, "1 August 1998"]
      - [Transitional National Government, "August 2000 (Arta, Djibouti)"]
      - [Transitional Federal Government, "October 2004 (Nairobi)"]
    markers:
