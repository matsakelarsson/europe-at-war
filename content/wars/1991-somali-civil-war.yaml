steps:
  - title: The fall of Siad Barre
    date: 1988 – January 1991
    when: "1991-01-26"
    borders: "1991-01-27"
    countries: [so, ke]
    body:
      - "By the late 1980s Siad Barre’s government was at war with much of the country. After the SNM’s offensive in the north in 1988 and the government’s killing of Isaaq civilians there, the Somali Patriotic Movement rose among the Ogaden clans of the south in 1989, and the United Somali Congress (USC), founded in Rome in 1989 and drawn from the Hawiye clans of central Somalia and Mogadishu, took up arms under General Mohamed Farrah Aidid. Western aid was suspended, the army disintegrated into clan militias, and in July 1989 security forces killed hundreds of people in Mogadishu after the murder of the Catholic bishop and protests in the mosques."
      - "In December 1990 the USC rose in Mogadishu itself. After a month of street fighting and shelling, in which thousands of civilians were killed, Siad Barre fled the capital in a tank column on 26 January 1991, retreating to his clan’s lands in Gedo. His forces, now the Somali National Front, tried twice to return; Aidid drove them back and in May 1992 Siad Barre went into exile in Kenya, dying in Nigeria in 1995. As the state fell, militias of the victorious clans attacked members of clans associated with the government, above all the Darod, in Mogadishu and across the south."
    facts:
      - [USC rising in Mogadishu, "30 December 1990"]
      - [Siad Barre leaves Mogadishu, "26 January 1991"]
      - [Siad Barre into exile in Kenya, "May 1992"]
