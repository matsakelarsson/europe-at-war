id: south-ossetia-war-1991
name: South Ossetia War
start: "1991-01-05"
end: "1992-06-24"
tier: C
summary: After South Ossetia declared itself a Soviet republic separate from Georgia, the Georgian parliament under Zviad Gamsakhurdia abolished the region’s autonomy on 11 December 1990. On the night of 5–6 January 1991 Georgian police and National Guard units entered Tskhinvali, and fighting with South Ossetian militias, helped by volunteers from North Ossetia, went on around the town and in the villages for a year and a half, with Tskhinvali besieged and shelled. About 1,000 people were killed. More than 40,000 Ossetians fled, most of them to North Ossetia in Russia, and about 23,000 Georgians left South Ossetia. The Sochi (Dagomys) Agreement signed by Boris Yeltsin and Eduard Shevardnadze on 24 June 1992 ended the fighting and set up joint Russian, Georgian and Ossetian peacekeeping forces, leaving most of South Ossetia under separatist control.
