id: ten-day-war
name: Ten-Day War
start: "1991-06-27"
end: "1991-07-07"
tier: B
summary: Slovenia declared independence from Yugoslavia on 25 June 1991, after a referendum in which 88.5 per cent of voters had backed it. Two days later the Yugoslav People’s Army (JNA) moved to seize the republic’s border crossings and Ljubljana airport. The Slovenian Territorial Defence and police, prepared for months, blockaded barracks and ambushed tank columns, and many of the army’s conscripts surrendered. A European Community ceasefire held from 4 July and the Brioni Declaration of 7 July ended the fighting. About 80 people were killed, and the last JNA troops left Slovenia in October.
