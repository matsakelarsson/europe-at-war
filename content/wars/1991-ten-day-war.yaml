        side: si
        name: Ljubljana
        date: 25 June 1991
        text: The Slovenian parliament proclaimed independence on 25 June. On 27 June the TO shot down a JNA Gazelle helicopter over Rožna Dolina; its pilot, Toni Mrlak, was himself a Slovene, and it turned out to be carrying bread for the troops.
        lonlat: [14.506, 46.051]
        lp: b
      - kind: taken
        side: yu
        name: Brnik airport
        date: 27–28 June 1991
        text: A JNA armoured column from Vrhnika took the airport on 27 June. Yugoslav aircraft struck it the next day, killing the Austrian journalists Nikolas Vogel and Norbert Werner and wrecking four Adria Airways airliners.
        lonlat: [14.458, 46.224]
        lp: t
      - kind: battle
        side: si
        name: Trzin
        date: 27 June 1991
        text: Four JNA soldiers and the TO fighter Edvard Peperko were killed in a firefight; the rest of the army unit surrendered.
        lonlat: [14.562, 46.136]
      - kind: battle
        side: si
        name: Holmec
        date: 28 June 1991
        text: The TO took the border post on the Austrian border, killing three JNA soldiers and capturing 45, for two of its own dead. Austrian television filmed soldiers apparently trying to surrender as shots rang out; whether any of them were killed has been disputed ever since.
        lonlat: [14.841, 46.567]
        lp: t
      - kind: battle
        side: si
        name: Nova Gorica
        date: 28 June 1991
        text: Slovenian special forces destroyed two T-55 tanks on the Italian border and took dozens of JNA soldiers prisoner; some wounded crossed to hospital in Gorizia.
        lonlat: [13.648, 45.956]
        lp: l
      - kind: air
        side: yu
        name: Medvedjek
        date: 28 June 1991
        text: Air strikes on a lorry barricade blocking a JNA column on the Ljubljana–Zagreb road killed six lorry drivers.
        lonlat: [14.917, 45.930]
        lp: b
      - kind: air
        side: yu
        name: Štrihovec
        date: 28 June 1991
        text: Yugoslav aircraft supporting a blocked tank column near the Austrian border killed four lorry drivers.
        lonlat: [15.667, 46.667]
        lp: r
