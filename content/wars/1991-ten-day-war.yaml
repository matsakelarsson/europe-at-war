steps:
  - title: Independence and the border crossings
    date: 25–28 June 1991
    when: "1991-06-25"
    borders: "1991-06-28"
    countries: [si, hr, rs]
    body:
      - On 23 December 1990 Slovenes voted for independence in a referendum, and the republic’s government spent the following months preparing its Territorial Defence (TO) for a fight with the Yugoslav People’s Army. Slovenia and Croatia both declared independence on 25 June 1991, a day earlier than planned. Slovenian officers took over the border posts with Italy, Austria and Hungary and set up new ones on the border with Croatia.
      - Early on 27 June JNA columns left their barracks to retake the crossings and Brnik airport. The army expected little resistance, but the Slovenian leadership under Milan Kučan chose to fight. The TO shot down two army helicopters, blocked roads with lorries and besieged barracks across the country. By midnight the JNA held every crossing on the Italian border and most on the Austrian, but many of its units were stranded, and on 28 June the TO went over to a general offensive.
    facts:
      - [Independence declared, 25 June 1991]
      - [JNA operation began, 27 June 1991]
      - [Referendum, "23 December 1990, 88.5% of the electorate in favour"]
    markers:
