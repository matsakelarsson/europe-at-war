  - title: Surrender, ceasefire and Brioni
    date: 29 June – 26 October 1991
    when: "1991-06-29"
    borders: "1991-07-07"
    countries: [si, hr, rs]
    link: { href: "#/war/croatian-war-of-independence", text: The Croatian War of Independence }
    body:
      - In the following days the TO overran crossings at Šentilj, Gornja Radgona and Vrtojba and took barracks and depots, re-arming itself with captured weapons. The garrison at Dravograd, some 400 men, surrendered on 30 June. On 2 July, the heaviest day of fighting, a relief column from Jastrebarsko in Croatia was turned back at Bregana, and a trapped air defence column in the Krakovo Forest held out near Krško.
      - The army’s generals wanted a full-scale offensive, but the federal presidency would not authorise one. A ceasefire took hold from the evening of 3 July, and on 7 July Slovenia, Croatia and the federal government signed the Brioni Declaration under European Community mediation. Slovenia and Croatia suspended their independence for three months. On 18 July the federal presidency decided to withdraw the JNA from Slovenia, and the last troops left by 26 October. The war in Croatia was only beginning.
    facts:
      - [Killed, "44 JNA soldiers, 19 Slovenian fighters, 6 Slovenian civilians and 12 foreigners (Slovenian estimates)"]
      - [Captured by Slovenia, "4,692 JNA soldiers and 252 federal police"]
      - [Brioni Declaration, 7 July 1991]
    markers:
      - kind: treaty
        name: Brioni Declaration
        date: 7 July 1991
        text: Signed on the Brijuni Islands under European Community mediation. It ended the fighting, left Slovenia’s police and TO in control of the republic and put a three-month moratorium on both declarations of independence.
        lonlat: [13.744, 44.916]
        lp: l
      - kind: taken
        side: si
        name: Dravograd
        date: 30 June 1991
        text: The whole JNA garrison, 16 officers and about 400 men, surrendered with its equipment; the TO had also taken the barracks at nearby Bukovje.
        lonlat: [15.019, 46.589]
        lp: l
      - kind: taken
        side: si
        name: Šentilj
        date: 29 June – 2 July 1991
        text: The TO took the crossing on the Austrian border and seized the tanks of the unit holding it.
        lonlat: [15.648, 46.682]
        lp: t
      - kind: battle
        side: si
        name: Gornja Radgona
        date: 2–3 July 1991
        text: The TO overran the crossing on 2 July; a JNA relief force sent towards it was halted near Radenci the next day.
        lonlat: [15.992, 46.673]
      - kind: battle
        side: si
        name: Bregana
        date: 2 July 1991
        text: Units of the JNA 4th Armoured Brigade moving up from Jastrebarsko in Croatia were beaten back at the border.
        lonlat: [15.688, 45.840]
        lp: r
      - kind: siege
        name: Krakovo Forest
        date: 30 June – 4 July 1991
        text: The 306th Air Defence Regiment, having retreated from Medvedjek, was surrounded near Krško but refused to surrender before the ceasefire.
        lonlat: [15.43, 45.88]
        lp: t
      - kind: air
        side: yu
        name: Domžale transmitter
        date: 2 July 1991
        text: Two MiG-21s attacked and heavily damaged the radio transmitter north of Ljubljana.
        lonlat: [14.594, 46.138]
