steps:
  - title: The battle for Kabul
    date: 1992–1994
    when: "1992-05"
    borders: "1994-06-30"
    countries: [af]
    body:
      - The Peshawar Accord shared out ministries among the mujahideen parties, but Hekmatyar refused to enter Kabul while Massoud’s forces and Dostum’s militias held it. From May 1992 his Hezb-e Islami fired thousands of rockets into the city from Charasiab in the south; in August 1992 alone more than 2,000 people, most of them civilians, were killed. Rabbani was chosen president in June 1992 and kept the post after his term ran out. In the west of the city Hezb-e Wahdat fought Abdul Rasul Sayyaf’s Ittehad, and in February 1993 government and Ittehad forces attacked the Hazara district of Afshar, killing or abducting some 700 civilians.
      - A peace deal signed in Islamabad in March 1993 made Hekmatyar prime minister but did not stop the fighting. On 1 January 1994 Dostum changed sides and joined Hekmatyar and Hezb-e Wahdat in an all-out attack on Kabul. Massoud held the city centre, but street fighting and bombardment that year destroyed much of west and south Kabul; the Afghanistan Justice Project estimated that some 25,000 people had been killed in the city by mid-1994. Hundreds of thousands fled to Pakistan, and the country was divided among warlords who taxed the roads.
