notes:
  - Kabul’s civilian dead are estimated at about 25,000 by mid-1994 by the Afghanistan Justice Project, and at more for the whole war; the Uppsala Conflict Data Program counts about 27,000 battle deaths in 1992–1996. The city’s population fell from about two million to some 500,000. Human Rights Watch and others have documented war crimes by all the factions, including the indiscriminate shelling of Kabul, abductions, rape and massacres.
  - Alliances changed often; in 1994 Hekmatyar, Dostum and Hezb-e Wahdat fought together against the government, and in June 1996 Hekmatyar became Rabbani’s prime minister. Zones of control are approximate.
