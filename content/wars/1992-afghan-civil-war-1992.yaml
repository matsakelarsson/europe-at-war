  - title: The rise of the Taliban
    date: 1994 – September 1996
    when: "1994-10-12"
    borders: "1996-09-27"
    countries: [af, pk]
    body:
      - In 1994 a group of religious students (taliban) and former mujahideen in Kandahar province rallied around Mullah Mohammad Omar, a village preacher, promising to end the warlords’ abuses and impose their strict version of Islamic law. Supported by Pakistan, which wanted a friendly force to open trade routes to Central Asia, they took Spin Boldak on 12 October 1994 and Kandahar on 5 November. Within months they controlled the south and reached the edge of Kabul, driving Hekmatyar from Charasiab in February 1995, but Massoud threw them back in March. Hezb-e Wahdat’s leader, Abdul Ali Mazari, was killed in Taliban custody.
      - The Taliban took Herat in September 1995, and Ismail Khan fled to Iran. In June 1996 Hekmatyar made peace with Rabbani and became prime minister, but it was too late. The Taliban took Jalalabad on 11 September 1996 and outflanked Kabul from the east, and Massoud withdrew north to the Panjshir. On 27 September 1996 the Taliban entered Kabul. They dragged Najibullah and his brother from the UN compound, killed them and hung their bodies in a city square, and proclaimed the Islamic Emirate of Afghanistan.
    facts:
      - [Kandahar taken by the Taliban, "5 November 1994"]
      - [Herat taken, "5 September 1995"]
      - [Kabul taken, "27 September 1996"]
