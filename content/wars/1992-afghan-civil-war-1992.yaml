id: afghan-civil-war-1992
name: Afghan Civil War (1992–1996)
start: "1992-04-28"
end: "1996-09-27"
tier: B
summary: The war among the victorious mujahideen factions after the fall of Najibullah’s government. The Islamic State of Afghanistan, led by President Burhanuddin Rabbani and his defence minister Ahmad Shah Massoud, held Kabul, but Gulbuddin Hekmatyar’s Hezb-e Islami, backed by Pakistan, shelled the capital from the south, and the Hazara Shia party Hezb-e Wahdat and, from 1994, Abdul Rashid Dostum’s Uzbek Junbish-e Milli also fought the government in shifting alliances. Much of Kabul, which had come through the Soviet war largely intact, was destroyed, and tens of thousands of its people were killed. In 1994 a new movement of religious students, the Taliban, emerged in Kandahar, disarmed local warlords with Pakistani support, and swept across the south and west, taking Herat in 1995 and Kabul on 27 September 1996, when they hanged Najibullah.
