  - title: The Washington Agreement and 1994
    date: February – December 1994
    when: "1994-02-05"
    borders: "1994-11-03"
    countries: [ba, hr, rs]
    body:
      - On 5 February 1994 a mortar bomb killed 68 people at the Markale market in Sarajevo. NATO ordered the Bosnian Serbs to withdraw their heavy weapons from around the city, and on 12 February Sarajevo had its first day without casualties since April 1992. With American mediation the Bosnian government and the Bosnian Croats agreed a ceasefire, and on 18 March signed the Washington Agreement, which joined the areas they held in a Federation of ten cantons.
      - In April the VRS attacked the Goražde safe area. NATO aircraft struck Serb positions, the first time they had done so in support of UN troops, and an ultimatum forced the Serbs back. In the Bihać pocket the Bosnian army’s 5th Corps defeated Abdić in the summer, survived a Bosnian and Krajina Serb counter-offensive in November that led NATO to bomb Udbina airfield in Croatia, but lost Velika Kladuša again in December. In the south-west the allies retook Kupres on 3 November.
    facts:
      - [First Markale massacre, "5 February 1994, 68 killed"]
      - [Washington Agreement, 18 March 1994]
      - [Kupres retaken, 3 November 1994]
    markers:
      - kind: event
        name: Markale
        date: 5 February 1994
        text: A 120 mm mortar bomb killed 68 people and wounded 144. Responsibility was long disputed; the ICTY found it reasonable to conclude that it was fired from Serb positions.
        lonlat: [18.424, 43.860]
      - kind: held
        side: ba
        name: Goražde
        date: April 1994
        text: The VRS overran much of the enclave and took about 150 UN soldiers hostage before NATO air strikes and an ultimatum made it withdraw.
        lonlat: [18.976, 43.668]
      - kind: air
        side: nato
        name: Udbina airfield
        date: 21 November 1994
        text: NATO aircraft struck the Krajina Serb airfield in Croatia from which attacks had been flown on the Bihać pocket.
        lonlat: [15.766, 44.531]
        lp: l
      - kind: siege
        side: ba
        name: Bihać
        date: 1992–1995
        text: The 5th Corps held the pocket against the VRS, Krajina Serb forces and, from 1993, Abdić’s troops until Operation Storm lifted the siege in August 1995.
        lonlat: [15.871, 44.817]
      - kind: taken
        side: ba
        name: Velika Kladuša
        date: August 1994
        text: The 5th Corps overran Abdić’s province in Operation Tiger; he returned with Serb help in December.
        lonlat: [15.806, 45.185]
        lp: t
      - kind: taken
        side: hr
        name: Kupres
        date: 3 November 1994
        text: Retaken from the VRS by the HVO and the Bosnian army, their first joint operation after the Washington Agreement.
        lonlat: [17.276, 43.993]
      - kind: battle
        side: hr
        name: Livno valley
        date: November – December 1994
        text: In Operation Winter ’94 Croatian and HVO forces advanced up the valley towards Bosansko Grahovo.
        lonlat: [16.85, 43.92]
        lp: l
