  - title: Srebrenica
    date: May – July 1995
    when: "1995-05-25"
    borders: "1995-07-25"
    countries: [ba, rs, nl]
    body:
      - After NATO aircraft bombed Bosnian Serb positions at Pale on 25 May 1995, the VRS shelled the safe areas and took hundreds of UN peacekeepers hostage. That evening a shell killed 71 civilians, most of them young, in the centre of Tuzla. On 6 July the VRS attacked the Srebrenica enclave, defended by a weak Bosnian army division and about 400 lightly armed Dutch peacekeepers, and on 11 July Mladić entered the town.
      - Some 25,000–30,000 women, children and old men were bussed to Bosnian lines after the men were separated from them at the Dutch base at Potočari. Men who tried to escape through the woods towards Tuzla were hunted down. In the following days more than 8,000 Bosniak men and boys were shot and buried in mass graves, later dug up and scattered to hide the crime. A list of the missing and dead contains 8,372 names.
      - The ICTY, in the Krstić appeal of 2004, and the International Court of Justice in 2007 ruled that the killings were genocide; the ICJ found that Serbia had failed to prevent and punish it, though it was not itself responsible. Karadžić and Mladić were sentenced to life imprisonment. Žepa fell on 25 July, but its Ukrainian commander secured the evacuation of its civilians.
    facts:
      - [Srebrenica fell, 11 July 1995]
      - [Killed, "more than 8,000 men and boys; 8,372 names listed"]
      - [Ruled genocide, "ICTY (2004) and ICJ (2007)"]
    markers:
      - kind: air
        side: nato
        name: Pale
        date: 25–26 May 1995
        text: NATO bombed VRS positions after the Bosnian Serbs failed to return heavy weapons; the VRS answered by seizing UN peacekeepers, some of whom were chained to likely targets.
        lonlat: [18.570, 43.817]
      - kind: event
        name: Tuzla
        date: 25 May 1995
        text: A VRS shell landed among young people at the Kapija square, killing 71 civilians and wounding about 240.
        lonlat: [18.676, 44.538]
      - kind: taken
        side: rs
        name: Srebrenica
        date: 11 July 1995
        text: Taken in Operation Krivaja ’95 by the VRS Drina Corps under Mladić’s command.
        lonlat: [19.297, 44.108]
        lp: r
      - kind: event
        name: Potočari
        date: 12–13 July 1995
        text: At the Dutch base, where thousands had sought safety, Serb troops separated men and boys from their families; on 13 July the peacekeepers handed over some 5,000 people sheltering there.
        lonlat: [19.278, 44.153]
        lp: l
      - kind: event
        name: Kravica warehouse
        date: 13 July 1995
        text: About a thousand men captured on the road to Tuzla were killed in and around a farm warehouse, one of the first mass executions.
        lonlat: [19.199, 44.212]
        lp: t
      - kind: taken
        side: rs
        name: Žepa
        date: 25 July 1995
        text: The VRS took the second eastern safe area; its commander, Avdo Palić, disappeared in Serb custody.
        lonlat: [19.133, 43.954]
