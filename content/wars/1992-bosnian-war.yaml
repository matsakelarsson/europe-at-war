  - title: Markale, Deliberate Force and the western offensives
    date: August – October 1995
    when: "1995-08-28"
    borders: "1995-10-12"
    countries: [ba, hr, rs]
    link: { href: "#/war/croatian-war-of-independence", text: Operation Storm in Croatia }
    body:
      - After Operation Storm had swept the Krajina Serbs out of Croatia and relieved Bihać, a VRS mortar attack on the Markale market in Sarajevo killed 43 people on 28 August 1995. Two days later NATO began Operation Deliberate Force. Until 20 September some 400 aircraft from 15 countries struck 338 Bosnian Serb targets, from air defences and artillery around Sarajevo to depots and command posts, and the VRS pulled its heavy weapons back from the city.
      - At the same time Croatian and HVO forces took Jajce, Šipovo and Drvar in Operation Mistral 2, and the Bosnian army’s 5th Corps broke out of the Bihać pocket and took Bosanska Krupa, Bosanski Petrovac and Ključ. When a Serb counter-attack threatened Ključ, the Croats’ Operation Southern Move took Mrkonjić Grad and came within 25 km of Banja Luka. Southern Move alone displaced some 10,000 Serbs, and at least 181 were killed. A nationwide ceasefire took effect on 12 October, with the Federation now holding about half the country.
    facts:
      - [Second Markale massacre, "28 August 1995, 43 killed"]
      - [Operation Deliberate Force, "30 August – 20 September 1995"]
      - [Ceasefire, 12 October 1995]
    markers:
      - kind: event
        name: Markale
        date: 28 August 1995
        text: Five mortar shells fired by the VRS killed 43 people and wounded 75 near the market.
        lonlat: [18.424, 43.860]
      - kind: air
        side: nato
        name: Han Pijesak
        date: August – September 1995
        text: NATO aircraft struck targets around Han Pijesak, seat of the VRS main staff, and around Sarajevo; depleted uranium rounds were used near both.
        lonlat: [18.953, 44.082]
      - kind: taken
        side: hr
        name: Jajce
        date: September 1995
        text: Taken in Mistral 2, with Šipovo and Drvar, as HV and HVO forces gained more than 2,500 km².
        lonlat: [17.271, 44.342]
      - kind: taken
        side: ba
        name: Ključ
        date: September 1995
        text: The 5th Corps broke out of the Bihać pocket in Operation Sana, advancing some 70 km before the VRS counter-attacked.
        lonlat: [16.777, 44.533]
      - kind: taken
        side: ba
        name: Sanski Most
        date: October 1995
        text: Captured by the 5th and 7th Corps as the ceasefire came into force.
        lonlat: [16.667, 44.767]
      - kind: taken
        side: hr
        name: Mrkonjić Grad
        date: 10 October 1995
        text: Taken in Southern Move; a mass grave found after the war held the bodies of 181 Serbs, mostly civilians.
        lonlat: [17.083, 44.417]
        lp: b
