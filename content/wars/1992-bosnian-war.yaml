  - title: Ethnic cleansing and the camps
    date: April – December 1992
    when: "1992-04-07"
    borders: "1992-08-06"
    countries: [ba, rs]
    body:
      - In April and May 1992 Serb forces, with JNA support and paramilitaries from Serbia, took the Bosniak-majority towns along the Drina and in the north-west. Some 40,000 Bosniaks were driven from the Zvornik district; in Višegrad, in what the ICTY called one of the most ruthless campaigns of the war, Bosniaks were killed on the Drina bridge and burned alive in houses; in Foča women were held and raped in detention sites. By the end of the year Bosnian Serb forces held about 70 per cent of the country.
      - Around Prijedor, taken on 30 April, Bosniaks and Croats were rounded up after the shelling of Kozarac in May. Some 6,000 men were held at Omarska, where hundreds died, and about 30,000 people passed through Trnopolje. When Western journalists reached the camps in August they were closed. Of some 4,868 people killed or missing in the municipality, 3,515 were Bosniak, 186 Croat and 78 Serb civilians. The ICTY sentenced twenty people for crimes in Prijedor; its first trial, of Duško Tadić, concerned them.
      - Bosniak and Croat forces held prisoners too. At the Čelebići camp near Konjic some 400–700 Serbs, mostly civilians, were held in 1992 and as many as 30 died; three of its staff were convicted by the ICTY. At Tuzla on 15 May 1992 a withdrawing JNA column was ambushed and 52 soldiers, most of them Serbs, were killed.
    facts:
      - [Bosnian Serb-held, "about 70% of Bosnia by late 1992"]
      - [Omarska camp, "about 6,000 held, May–August 1992"]
      - [Refugees and displaced, "2.6 million by June 1992"]
    markers:
      - kind: event
        name: Zvornik
        date: April 1992
        text: Taken by Arkan’s men, the White Eagles and local Serb forces; several hundred Bosniaks were killed and tens of thousands fled.
        lonlat: [19.103, 44.386]
      - kind: event
        name: Višegrad
        date: April – July 1992
        text: The town’s entire Bosniak population was killed or deported. Milan Lukić was sentenced to life imprisonment for burning people alive in two houses.
        lonlat: [19.293, 43.783]
      - kind: event
        name: Foča
        date: April 1992 – 1994
        text: All Bosniaks were expelled. The ICTY convicted several Serb soldiers and officers for the mass rapes committed there.
        lonlat: [18.779, 43.507]
      - kind: event
        name: Omarska
        date: May – August 1992
        text: A mine turned into a camp for Bosniak and Croat prisoners, where murder, torture and rape were common.
        lonlat: [16.883, 44.869]
        lp: b
      - kind: event
        name: Trnopolje
        date: May – November 1992
        text: Held 4,000–7,000 people at a time and served as a staging point for the deportation of women, children and old men.
        lonlat: [16.804, 44.934]
        lp: l
      - kind: event
        name: Čelebići camp
        date: April – December 1992
        text: Run by Bosnian government and HVO units for Serb prisoners, who were beaten, tortured and sexually abused; some were killed.
        lonlat: [17.896, 43.684]
      - kind: event
        name: Tuzla
        date: 15 May 1992
        text: The JNA’s 92nd Motorised Brigade, allowed to leave by agreement, was attacked in the Brčanska Malta district; 52 soldiers were killed.
        lonlat: [18.667, 44.538]
