  - title: The corridor, Jajce and the eastern enclaves
    date: June 1992 – May 1993
    when: "1992-06-24"
    borders: "1993-05-06"
    countries: [ba, rs, hr]
    body:
      - The Bosnian Serbs’ lands were cut in two in May 1992 when Croatian and Bosnian Croat forces took Derventa in Posavina. In Operation Corridor, from 24 June to 6 October, the VRS reopened the road from Banja Luka to eastern Bosnia and drove Croatian forces back across the Sava at Bosanski Brod, leaving them only the Orašje pocket. On 29 October Jajce, defended by an uneasy mix of HVO and Bosnian army troops, fell to the VRS; its Croats fled to Herzegovina and some 20,000 Bosniaks to Travnik and the Lašva valley.
      - In the east, Bosniak forces under Naser Orić held a large area around Srebrenica and raided Serb villages; at Kravica on Orthodox Christmas, 7 January 1993, 43 Serbs were killed, 13 of them civilians. From March the VRS took back most of the enclave, and the UN Security Council declared Srebrenica a safe area on 16 April and Sarajevo, Tuzla, Žepa, Goražde and Bihać on 6 May. The Vance–Owen peace plan, which would have divided Bosnia into ten provinces, was rejected by the Bosnian Serbs that month.
    facts:
      - [Operation Corridor, "24 June – 6 October 1992"]
      - [Jajce fell, 29 October 1992]
      - [Safe areas, "UN Security Council Resolutions 819 (16 April 1993) and 824 (6 May 1993)"]
    markers:
      - kind: taken
        side: rs
        name: Bosanski Brod
        date: 6 October 1992
        text: The VRS destroyed the Croatian bridgehead on the Sava, completing the corridor through Posavina.
        lonlat: [17.987, 45.138]
      - kind: held
        side: hr
        name: Orašje
        date: 1992–1995
        text: The HVO held this pocket on the Sava for the rest of the war.
        lonlat: [18.693, 45.034]
      - kind: taken
        side: rs
        name: Jajce
        date: 29 October 1992
        text: The fall of the town, blamed by each side on the other, deepened the rift between the HVO and the Bosnian army.
        lonlat: [17.271, 44.342]
      - kind: event
        name: Kravica
        date: 7 January 1993
        text: Attacked by Orić’s men from the Srebrenica enclave. Orić was convicted by the ICTY of failing to prevent the mistreatment of Serb prisoners, but acquitted on appeal in 2008.
        lonlat: [19.199, 44.212]
        lp: l
