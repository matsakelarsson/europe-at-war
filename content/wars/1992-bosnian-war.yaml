steps:
  - title: Referendum and outbreak
    date: January – April 1992
    when: "1992-01-09"
    borders: "1992-04-06"
    countries: [ba, rs, hr]
    link: { href: "#/war/croatian-war-of-independence", text: The Croatian War of Independence }
    body:
      - In 1991 Bosnia and Herzegovina was 44 per cent Bosniak, 32.5 per cent Serb and 17 per cent Croat. As Yugoslavia broke up, Radovan Karadžić’s Serb Democratic Party rejected independence, and on 9 January 1992 Bosnian Serb deputies proclaimed a Serb republic that would stay in Yugoslavia. In a referendum on 29 February and 1 March, which most Serbs boycotted or were prevented from joining, 99.7 per cent of those voting, on a 64 per cent turnout, chose independence. President Alija Izetbegović declared it on 3 March.
      - Barricades went up in Sarajevo, and violence spread. On 26 March Croat and Bosniak fighters killed some nine to eleven Serb civilians at Sijekovac near Bosanski Brod. On 1–2 April Arkan’s Serb Volunteer Guard and local paramilitaries took Bijeljina, killing dozens of Bosniak civilians. On 5 April Serb gunmen fired on a peace march in Sarajevo, killing Suada Dilberović and Olga Sučić on the Vrbanja bridge. The next day the European Community and the United States recognised Bosnia, and Serb forces began shelling the capital.
    facts:
      - [Independence referendum, "29 February – 1 March 1992, 99.7% in favour, 64% turnout"]
      - [Independence declared, 3 March 1992]
      - [International recognition, 6 April 1992]
