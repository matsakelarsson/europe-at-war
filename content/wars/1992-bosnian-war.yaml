  - title: War between Croats and Bosniaks
    date: October 1992 – February 1994
    when: "1992-10-18"
    borders: "1993-11-09"
    countries: [ba, hr]
    body:
      - The HVO and the Bosnian army had fought the Serbs together in 1992, but the Croatian Community of Herzeg-Bosnia under Mate Boban was building its own state, and clashes began in October at Novi Travnik and Prozor. Fighting spread from Gornji Vakuf in January 1993 to open war in central Bosnia in April. On 16 April HVO troops killed about 120 Bosniak civilians at Ahmići in the Lašva valley; the ICTY sentenced their political leader, Dario Kordić, to 25 years. On the same day Bosnian army soldiers killed 22 Croats, sixteen of them civilians, at Trusina near Konjic.
      - On 9 May the HVO attacked the Bosniak east bank of Mostar and besieged it until early 1994, holding thousands of Bosniak men at camps such as the Heliodrom and Dretelj. On 9 November its tanks destroyed the 16th-century Old Bridge. In 2017 the ICTY Appeals Chamber confirmed the convictions of six Herzeg-Bosnia leaders for crimes against Bosniaks, though it judged the bridge itself a military target. Herzeg-Bosnia declared itself a republic on 28 August 1993.
      - The larger Bosnian army took Travnik, Kakanj and Fojnica in June and July and Bugojno in July, where 15,000 Croats left, and Vareš in November. Its soldiers killed at least 13 Croat villagers at Grabovica and 29 at Uzdol in September; HVO troops killed at least 37 Bosniaks at Stupni Do in October. In the Bihać pocket Fikret Abdić proclaimed an Autonomous Province of Western Bosnia on 27 September and made deals with the Serb and Croat leaders. A ceasefire on 23 February 1994 ended the Croat–Bosniak war.
    facts:
      - [Ahmići massacre, "16 April 1993, about 120 killed"]
      - [Old Bridge destroyed, 9 November 1993]
      - [Croat–Bosniak ceasefire, 23 February 1994]
    markers:
      - kind: event
        name: Ahmići
        date: 16 April 1993
        text: The worst massacre of the Croat–Bosniak war, the culmination of the HVO’s expulsions in the Lašva valley; found by British UN troops under Colonel Bob Stewart.
        lonlat: [17.839, 44.144]
        lp: l
      - kind: event
        name: Trusina
        date: 16 April 1993
        text: Bosnian army troops killed sixteen Croat civilians and six Croat prisoners of war.
        lonlat: [17.836, 43.728]
      - kind: siege
        name: Mostar and the Old Bridge
        date: May 1993 – March 1994
        text: The HVO besieged East Mostar, cutting off aid and destroying ten mosques. The Ottoman bridge, shelled down on 9 November 1993, was rebuilt and reopened in 2004.
        lonlat: [17.815, 43.337]
      - kind: event
        name: Dretelj camp
        date: 1993
        text: One of the HVO prison camps where Bosniak men from Herzegovina were held in brutal conditions.
        lonlat: [17.707, 43.126]
        lp: l
      - kind: taken
        side: ba
        name: Bugojno
        date: July 1993
        text: Taken by the Bosnian army; about 800 Croats were held in the town’s football stadium.
        lonlat: [17.451, 44.057]
        lp: l
      - kind: event
        name: Uzdol and Grabovica
        date: 8–14 September 1993
        text: During the Bosnian army’s Neretva ’93 offensive its troops killed at least 29 Croat villagers at Uzdol and, the ICTY found, 13 at Grabovica.
        lonlat: [17.70, 43.81]
        lp: b
      - kind: event
        name: Stupni Do
        date: 23 October 1993
        text: HVO units under Ivica Rajić killed at least 37 Bosniak villagers and burned the village; Rajić pleaded guilty before the ICTY.
        lonlat: [18.324, 44.125]
      - kind: capital
        side: wb
        name: Velika Kladuša
        date: 27 September 1993
        text: Capital of Abdić’s Autonomous Province of Western Bosnia, which fought the Bosnian army’s 5th Corps in the Bihać pocket.
        lonlat: [15.806, 45.185]
