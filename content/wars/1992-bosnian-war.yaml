  - title: The siege of Sarajevo
    date: April 1992 – February 1996
    when: "1992-04-05"
    borders: "1992-06-29"
    countries: [ba, rs]
    view:
      center: [18.4, 43.86]
      size: [190, 160]
    body:
      - From April 1992 JNA and Bosnian Serb forces, some 13,000 men at first, ringed Sarajevo from the surrounding hills and held suburbs such as Ilidža and part of Grbavica. An attack to cut the city in two failed on 2 May. The next day the JNA seized Izetbegović at the airport, and Bosnian fighters attacked the army column leaving the city in exchange for his release. The JNA’s Bosnian units became the Army of Republika Srpska under Ratko Mladić, and on 29 June the airport was handed to the UN for an airlift that lasted more than three years.
      - The siege lasted 1,425 days, until 29 February 1996. On average 329 shells a day struck the city, which lived for long periods without water, power or gas; the National Library burned with most of its collection in August 1992. From mid-1993 a tunnel under the airport runway was the only land link to the outside. About 13,952 people were killed, 5,434 of them civilians. The ICTY convicted the Sarajevo commanders Stanislav Galić and Dragomir Milošević of terrorising civilians, and Karadžić and Mladić for the siege.
    facts:
      - [Siege, "5 April 1992 – 29 February 1996, 1,425 days"]
      - [Killed, "about 13,952, including 5,434 civilians"]
      - [Heaviest shelling, "3,777 shells on 22 July 1993"]
    markers:
      - kind: siege
        side: ba
        name: Sarajevo
        date: 1992–1996
        text: Defended by the Bosnian army, with an HVO brigade among its units. Snipers and shells killed people in bread queues, at water points and in markets.
        lonlat: [18.413, 43.856]
        lp: t
      - kind: event
        side: ba
        name: Airport and tunnel
        date: June 1992 – July 1993
        text: The Serbs handed the airport to UNPROFOR on 29 June 1992 after a UN ultimatum, opening it to humanitarian flights; hundreds of people died trying to run across the runway. From July 1993 a tunnel dug under it from Dobrinja to Butmir carried food, arms and people between the city and Mount Igman.
        lonlat: [18.334, 43.823]
        lp: b
      - kind: held
        side: rs
        name: Ilidža
        date: 1992–1996
        text: The western suburb was held by Bosnian Serb forces throughout the siege.
        lonlat: [18.307, 43.832]
        lp: t
      - kind: capital
        side: rs
        name: Pale
        date: 1992–1995
        text: Seat of the Bosnian Serb leadership, a short drive from the siege lines.
        lonlat: [18.570, 43.817]
        lp: r
