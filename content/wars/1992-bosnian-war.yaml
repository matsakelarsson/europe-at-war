id: bosnian-war
name: Bosnian War
start: "1992-04-06"
end: "1995-12-14"
tier: A
summary: The war that followed Bosnia and Herzegovina’s independence from Yugoslavia. Bosnian Serb forces, armed by the Yugoslav People’s Army and backed by Serbia, seized about 70 per cent of the country in 1992, driving out or killing Bosniaks and Croats, and besieged Sarajevo for almost four years. In 1993 the Bosniak-led government and the Bosnian Croats, backed by Croatia, fought each other, until the Washington Agreement of March 1994 made them allies again. The fall of the UN safe area of Srebrenica in July 1995, where more than 8,000 Bosniak men and boys were killed in what international courts ruled was genocide, was followed by NATO air strikes and Croatian and Bosnian offensives. The Dayton Agreement of November 1995 kept Bosnia as one state of two entities. About 100,000 people were killed and 2.2 million displaced.
