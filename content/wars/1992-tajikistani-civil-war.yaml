notes:
  - Estimates of the dead range from about 20,000 to more than 100,000; most sources give 50,000 to 100,000, many of them civilians killed in 1992. About 1.2 million people, a fifth of the population, were displaced, and up to 150,000 fled to Afghanistan. Human Rights Watch and others documented summary executions and other abuses by both sides.
  - The Russian 201st Motor Rifle Division stayed in Tajikistan throughout the war, and Russian border guards held the Afghan border; more than 300 Russian servicemen were killed. Areas of control are approximate.
