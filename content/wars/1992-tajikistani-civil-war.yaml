id: tajikistani-civil-war
name: Tajikistani Civil War
start: "1992-05-05"
end: "1997-06-27"
tier: B
summary: The civil war that followed Tajikistan’s independence from the Soviet Union. It was fought between the old communist establishment, drawn mainly from the northern Leninabad (Khujand) region and the southern Kulob region, and an opposition of Islamists, democrats and Pamiri nationalists, drawn largely from the Gharm valley and Gorno-Badakhshan. After a coalition government formed in May 1992 collapsed, the pro-government Popular Front, backed by Russia and Uzbekistan, took the capital Dushanbe in December 1992, and its militias killed and expelled thousands of people from opposition regions in the south. The opposition, united from 1993 as the United Tajik Opposition (UTO), fought on from bases in Afghanistan and the eastern mountains, attacking Russian border posts on the Panj river. UN-sponsored talks from 1994 led to the General Agreement on the Establishment of Peace and National Accord, signed in Moscow on 27 June 1997 by President Emomali Rahmon and the UTO leader Sayid Abdullo Nuri, which gave the opposition 30 per cent of government posts.
countries: [tj, af, ru, uz]
