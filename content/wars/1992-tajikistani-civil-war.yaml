steps:
  - title: The war of 1992
    date: May – December 1992
    when: "1992-05-05"
    borders: "1992-12-10"
    countries: [tj, ru, uz]
    body:
      - In the spring of 1992 rival crowds faced each other for weeks on two squares in Dushanbe, supporters of President Rahmon Nabiev, a communist from Khujand, on one and the opposition on the other. In May, after armed clashes, Nabiev agreed to a coalition government that gave the opposition a third of the ministries. The old elite of Kulob and Khujand refused to accept it. In the cotton lands of the Vakhsh valley around Qurghonteppa, where Kulobis lived alongside settlers from Gharm and the Pamirs, fighting between militias became a war of villages, with massacres on both sides. In September opposition youths forced Nabiev to resign at Dushanbe airport.
      - The Popular Front, led by Sangak Safarov, a Kulobi former convict, and armed from Soviet stocks with help from Uzbekistan, won the south in the autumn. A session of the Supreme Soviet in Khujand in November chose Emomali Rahmonov, a state farm director from the Kulob region, as head of state, and on 10 December the Popular Front entered Dushanbe. Its fighters hunted down people from Gharm and the Pamirs, killing thousands, and tens of thousands fled across the Panj river to Afghanistan. Government forces then pushed into the Gharm valley early in 1993.
