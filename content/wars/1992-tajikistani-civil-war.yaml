  - title: War on the border and the peace of 1997
    date: 1993–1997
    when: "1993-07-13"
    borders: "1997-06-27"
    countries: [tj, af, ru]
    body:
      - The opposition regrouped in northern Afghanistan, where the Islamic Renaissance Party’s leader Sayid Abdullo Nuri set up an exile government, and in the mountains of Gharm, Tavildara and Gorno-Badakhshan. On 13 July 1993 opposition fighters and Afghan allies attacked the 12th post of the Russian border guards on the Panj, killing 25 guards, and Russia answered with air and artillery strikes on northern Afghanistan. Russian and Central Asian troops were deployed as a peacekeeping force of the Commonwealth of Independent States. Fighting in the Tavildara valley changed hands several times in 1994–1996, and warlords on both sides mutinied against their commanders.
      - Talks under UN auspices began in April 1994, and a temporary ceasefire was agreed in September; UN military observers (UNMOT) were deployed from December 1994. Rahmonov was elected president in November 1994. The rise of the Taliban in Afghanistan pushed both sides towards a deal, and on 27 June 1997 Rahmonov, Nuri and the UN envoy Gerd Merrem signed the General Agreement in Moscow. The opposition fighters were integrated into the army, Nuri returned to Dushanbe, and most refugees came home. In later years Rahmon pushed the opposition out of government, and the Islamic Renaissance Party was banned in 2015.
