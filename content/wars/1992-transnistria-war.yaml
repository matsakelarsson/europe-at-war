notes:
  - Transnistria is shown as part of Moldova on the map, as it is internationally recognised. Casualty figures differ between Moldovan, Transnistrian and Russian sources.
  - Fighting had begun on a small scale at Dubăsari in November 1990; the war is usually dated from 2 March 1992.
