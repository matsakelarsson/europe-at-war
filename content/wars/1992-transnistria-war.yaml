id: transnistria-war
name: Transnistria War
start: "1992-03-02"
end: "1992-07-21"
tier: C
summary: In September 1990 leaders on the left bank of the Dniester, where many people were Russian or Ukrainian speakers wary of Moldova’s moves towards Romania, proclaimed the Pridnestrovian Moldavian Republic. Clashes began that November and grew into war in March 1992, with fighting around Dubăsari and the bridgeheads over the river and, worst of all, in Bender (Tighina) on 19–21 June. Cossack and other volunteers from Russia and Ukraine joined the separatists, and the Russian 14th Army, stationed in the region, armed them; after its new commander, Alexander Lebed, arrived, its artillery struck Moldovan forces near Bender on 3 July, in effect ending the fighting. About 1,000 people were killed. A ceasefire signed by Boris Yeltsin and Mircea Snegur on 21 July 1992 created joint peacekeeping forces, and Transnistria has stayed outside Moldovan control, recognised by no member of the United Nations.
