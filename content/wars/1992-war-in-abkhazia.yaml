id: war-in-abkhazia
name: War in Abkhazia
start: "1992-08-14"
end: "1993-09-30"
tier: C
summary: On 14 August 1992, amid a dispute over Abkhazia’s status, Georgian National Guard troops entered the region and took Sukhumi, and the Abkhaz leadership under Vladislav Ardzinba withdrew to Gudauta, where a Russian military base stood. Abkhaz forces, joined by thousands of volunteers from the North Caucasus, among them Shamil Basayev, and helped by arms and air support from parts of the Russian military, took Gagra in October 1992 and, after a ceasefire of July 1993 broke down, Sukhumi on 27 September 1993. Atrocities were committed on both sides, and the Abkhaz victory was followed by the killing and expulsion of ethnic Georgians, the largest group in Abkhazia before the war. About 250,000 people fled or were driven out, which the OSCE called ethnic cleansing. A ceasefire agreed in Moscow in May 1994 was policed by Russian peacekeepers.
countries: [ge]
sides:
  - id: ge
    name: Georgia
    polities: [georgia]
    ink: red
  - id: ab
    name: Abkhazia and North Caucasian volunteers
    polities: [abkhazia]
    ink: olive
notes:
  - Abkhazia is shown as part of Georgia on the map, as it is internationally recognised. Russia officially claimed neutrality; the extent of Russian military help to the Abkhaz side is disputed in detail but widely documented.
  - Numbers of dead are uncertain; sources give from about 10,000 to 30,000 in all.
