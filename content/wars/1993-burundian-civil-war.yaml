id: burundian-civil-war
name: Burundian Civil War
start: "1993-10-21"
end: "2005-08-26"
tier: B
summary: "The civil war in Burundi that followed the murder of the country’s first elected Hutu president, Melchior Ndadaye, by Tutsi army officers on 21 October 1993, and was fought between the Tutsi-dominated army and Hutu rebel movements, chiefly the CNDD-FDD and PALIPEHUTU-FNL. In the weeks after the coup Hutu peasants and local officials killed Tutsi neighbours and the army killed Hutu in reprisal; estimates for the first year range from 50,000 to 100,000 dead. Ndadaye’s successor, Cyprien Ntaryamira, died in the plane shot down over Kigali on 6 April 1994 with Rwanda’s president, and the war grew alongside the Rwandan genocide and the Congo wars: Hutu rebels used bases in Zaire, while Tutsi militias and the army fought them in the hills and in Bujumbura. Major Pierre Buyoya took power in a coup on 25 July 1996, and Burundi’s neighbours imposed an embargo. Peace talks at Arusha, led by Julius Nyerere and after his death by Nelson Mandela, produced the Arusha Peace and Reconciliation Agreement of 28 August 2000, which the main rebel groups did not sign at first. South African troops, an African Union mission and from 2004 a UN operation supported a transition; the CNDD-FDD signed a ceasefire on 3 December 2002 and joined the government in 2003, and after elections its leader, Pierre Nkurunziza, was sworn in as president on 26 August 2005, the date usually taken as the end of the war. The FNL fought on until a ceasefire in 2006, renewed fighting in 2008 and its disarmament in 2009. About 300,000 people were killed in the war, and hundreds of thousands fled to Tanzania."
