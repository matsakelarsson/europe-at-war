steps:
  - title: The murder of Ndadaye and the killings of 1993
    date: June 1993 – July 1996
    when: "1993-10-21"
    borders: "1993-10-21"
    countries: [bi, rw]
    body:
      - "In June 1993 Burundians elected Melchior Ndadaye of the Front for Democracy in Burundi (FRODEBU) as their first Hutu president, defeating Major Pierre Buyoya, who accepted the result. The army and the civil service remained overwhelmingly Tutsi. On 21 October 1993 Tutsi officers launched a coup in Bujumbura and murdered Ndadaye and other leading members of FRODEBU. The coup collapsed within days under internal and international pressure, but the murder set off killings across the country: Hutu peasants and FRODEBU officials killed Tutsi, and the army killed Hutu in reprisal. Estimates of the dead in the following months range from 50,000 to 100,000, and hundreds of thousands of Hutu fled to Rwanda, Zaire and Tanzania."
      - "Ndadaye’s successor, Cyprien Ntaryamira, was killed on 6 April 1994 when the plane carrying him and Rwanda’s President Juvénal Habyarimana was shot down over Kigali. A weak coalition under Sylvestre Ntibantunganya could not control the army or the Tutsi militias, such as the Sans Échec, which drove Hutu out of districts of Bujumbura. Ndadaye’s former interior minister, Léonard Nyangoma, founded the CNDD and its armed wing, the FDD, while the older PALIPEHUTU and its armed wing, the FNL, fought on in the hills around the capital."
