  - title: Ceasefire, transition and Nkurunziza
    date: 2002 – 2005
    when: "2005-08-26"
    borders: "2005-08-26"
    countries: [bi]
    body:
      - "After being promised places in the government and the army, the main wings of the CNDD-FDD signed a ceasefire on 3 December 2002. An African Union mission, mostly South African, Ethiopian and Mozambican troops, deployed from April 2003, and on 30 April 2003 Domitien Ndayizeye of FRODEBU succeeded Buyoya as president. Under a power-sharing deal of October 2003 the CNDD-FDD of Pierre Nkurunziza joined the government, and its fighters were merged with the army. A UN operation, ONUB, took over from the African Union in 2004. The FNL fought on around Bujumbura; on 13 August 2004 its fighters killed about 160 Congolese Tutsi (Banyamulenge) refugees in a UN camp at Gatumba."
      - "A new constitution was approved by referendum in February 2005, and the CNDD-FDD won the elections that followed. On 26 August 2005 Pierre Nkurunziza was sworn in as president, elected by parliament, the date usually taken as the end of the war. The curfew in force since 1993 was lifted in April 2006. The FNL signed a ceasefire in Dar es Salaam in September 2006, fought again in 2008 and disarmed in 2009. About 300,000 people had been killed in the war."
