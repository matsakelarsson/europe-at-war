  - title: Buyoya’s coup and the Arusha agreement
    date: July 1996 – 2001
    when: "2000-08-28"
    borders: "2000-08-28"
    countries: [bi, tz, cd]
    body:
      - "On 25 July 1996 the army brought Pierre Buyoya back to power in a coup. Burundi’s neighbours, led by Tanzania, imposed an economic embargo. The CNDD-FDD raided from bases around Uvira and Bukavu in eastern Zaire, and after the fall of Mobutu in 1997 it pushed into Bururi and Makamba in the south; the army answered by forcing hundreds of thousands of rural Hutu into regroupment camps. Rwandan troops, fighting their own Hutu insurgents, also crossed into Burundi. Both the army and the rebels massacred civilians."
      - "Formal peace talks opened at Arusha in Tanzania on 15 June 1998 with Julius Nyerere as mediator; after his death in 1999 Nelson Mandela took over. On 28 August 2000 the government and most of the political parties signed the Arusha Peace and Reconciliation Agreement, which set out a transition and a sharing of power and of the army between Hutu and Tutsi. The main rebel groups, the CNDD-FDD and the FNL, did not sign and fought on; on 28 December 2000 gunmen killed 21 passengers of a Titanic Express bus near Bujumbura. A transitional government took office in November 2001, with Buyoya as president for 18 months, protected by South African troops."
