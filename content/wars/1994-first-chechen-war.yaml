    moves: Chechen moves
    success: Chechen success
notes:
  - Chechnya is shown as part of Russia on the map, as it is internationally recognised; no member of the United Nations recognised Ichkeria.
  - Casualty figures vary widely. Russia’s official count of its military dead is about 5,500; estimates of civilian deaths range from about 30,000 to 100,000.
