  - title: Budyonnovsk, Grozny and Khasavyurt
    date: June 1995 – August 1996
    when: "1995-06-14"
    borders: "1996-08-31"
    countries: [ru]
    body:
      - On 14 June 1995 Shamil Basayev and more than 100 fighters drove into Budyonnovsk in southern Russia and seized its hospital with well over 1,500 hostages. Two assaults by special forces failed; Prime Minister Viktor Chernomyrdin then negotiated with Basayev by telephone, promised a ceasefire and talks, and let the gunmen return to Chechnya with volunteer hostages. At least 129 people died. The talks broke down by the end of the year, and in January 1996 Salman Raduyev’s raid on Kizlyar in Dagestan ended in a battle at Pervomayskoye. On 21 April Dudayev was killed by a Russian missile.
      - On 6 August 1996, days before Yeltsin began his second term, Chechen fighters under Aslan Maskhadov infiltrated Grozny and cut off the Russian garrisons there. Yeltsin’s new security chief, Alexander Lebed, then negotiated with Maskhadov, and on 31 August they agreed the Khasavyurt Accord in Dagestan. Russian forces withdrew by the end of the year, and the question of Chechnya’s status was put off until the end of 2001. More than half a million people had been driven from their homes.
    facts:
      - [Budyonnovsk hospital hostage crisis, "14–19 June 1995"]
      - [Chechen recapture of Grozny, "from 6 August 1996"]
      - [Khasavyurt Accord, "31 August 1996"]
    markers:
      - kind: event
        name: Budyonnovsk
        date: 14–19 June 1995
        text: Basayev’s men shot people in the town as they took it, then held the hospital for six days; many hostages died in the failed assaults.
        lonlat: [44.167, 44.783]
      - kind: event
        name: Kizlyar
        date: 9–18 January 1996
        text: Raduyev’s fighters took hostages in the town’s hospital and were then trapped by Russian forces in the village of Pervomayskoye.
        lonlat: [46.714, 43.855]
      - kind: taken
        side: ich
        name: Grozny
        date: 6–20 August 1996
        text: Chechen fighters retook the city in a surprise attack and besieged the Russian posts inside it.
        lonlat: [45.699, 43.312]
      - kind: treaty
        name: Khasavyurt Accord
        date: 31 August 1996
        text: Signed by Lebed and Maskhadov. The Moscow peace treaty of May 1997 followed, but Chechnya’s status was never settled.
        lonlat: [46.583, 43.25]
