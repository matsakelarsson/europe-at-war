id: first-chechen-war
name: First Chechen War
start: "1994-12-11"
end: "1996-08-31"
tier: B
summary: A war in which Russia tried to end the independence that Chechnya had declared in 1991. Russian forces took a ruined Grozny in early 1995 at a heavy cost in civilian lives, but Chechen fighters fought on, and after they retook Grozny in August 1996 the Khasavyurt Accord brought a Russian withdrawal and left Chechnya’s status undecided.
