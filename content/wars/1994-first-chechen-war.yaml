steps:
  - title: The storming of Grozny
    date: December 1994 – June 1995
    when: "1994-12-11"
    borders: "1995-03-06"
    countries: [ru]
    body:
      - In November 1991, as the Soviet Union broke up, the former Soviet air force general Dzhokhar Dudayev, newly elected president of Chechnya, declared it independent. Russia never accepted this, and three years of uneasy separation followed. In 1994 Moscow armed an anti-Dudayev opposition, but its attack on Grozny on 26 November, with Russian soldiers secretly hired as tank crews, failed, and some of the Russians were captured. On 11 December Boris Yeltsin sent about 40,000 troops into Chechnya from the north, the west and the east.
      - The assault on Grozny on New Year’s Eve was a disaster for Russia. Armoured columns sent into the city with little infantry were destroyed in its streets, among them the 131st Maikop Brigade at the railway station. Russia then pounded the city with artillery and bombing, took the ruins of the presidential palace on 19 January 1995 and the last districts in early March. Yeltsin’s human rights adviser Sergei Kovalev estimated that about 27,000 civilians died in the first five weeks. In April interior troops killed scores of civilians in the village of Samashki, and in June Russian forces took Vedeno and Shatoy in the mountains.
    facts:
      - [Russian invasion, "11 December 1994, about 40,000 troops"]
      - [Presidential palace taken, "19 January 1995"]
      - [Civilian deaths in Grozny, "about 27,000 in five weeks (Kovalev’s estimate)"]
