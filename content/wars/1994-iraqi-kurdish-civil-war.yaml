id: iraqi-kurdish-civil-war
name: Iraqi Kurdish Civil War
start: "1994-05"
end: "1997-11-24"
tier: C
summary: The war between the two main Kurdish parties of northern Iraq, Masoud Barzani’s Kurdistan Democratic Party (KDP) and Jalal Talabani’s Patriotic Union of Kurdistan (PUK), in the self-governing Kurdish region that had existed since 1991 under Western air protection. Quarrels over land and over the customs revenue from trade with Turkey turned into open fighting in May 1994, and the regional parliament and government split in two. In August 1996 the PUK, with Iranian support, drove towards Erbil, and Barzani called in Saddam Hussein. On 31 August some 30,000 Iraqi troops took Erbil for the KDP and executed many members of the opposition Iraqi National Congress, and the United States answered with cruise missile strikes on southern Iraq. The KDP went on to take Sulaymaniyah, which the PUK retook in October. Fighting flared again in 1997, with the Turkish army entering on the KDP’s side against the PUK and the PKK, until a ceasefire on 24 November 1997. The Washington Agreement of September 1998 ended the war, though the region stayed divided into KDP and PUK zones for years.
