id: operation-uphold-democracy
name: 1991 Haitian coup and Operation Uphold Democracy
start: "1991-09-29"
end: "1995-03-31"
tier: C
summary: "The military coup that overthrew Haiti’s first freely elected president, Jean-Bertrand Aristide, and the US-led intervention that restored him three years later. Aristide, a Catholic priest from the slums of Port-au-Prince and leader of the Lavalas movement, won the election of December 1990 with about two-thirds of the vote and took office in February 1991. On 29–30 September 1991 the army under General Raoul Cédras seized power, and Aristide went into exile, first in Venezuela and then in the United States. Under the military government soldiers and the paramilitary Front for the Advancement and Progress of Haiti (FRAPH), led by Emmanuel “Toto” Constant, killed, tortured and raped supporters of Aristide; estimates of the dead range from about 3,000 to 5,000. Tens of thousands of Haitians fled by boat; the US Coast Guard intercepted about 38,000 by the end of 1992 and returned most of them or held them at Guantánamo Bay. The Organization of American States and then the United Nations imposed embargoes, and in the Governors Island Accord of July 1993 Cédras agreed to step down, but when the USS Harlan County arrived with US and Canadian troops to help carry it out in October 1993, armed demonstrators kept it from landing, and the justice minister, Guy Malary, was murdered days later. On 31 July 1994 UN Security Council Resolution 940 authorised a multinational force to remove the military leaders. With invasion forces already in the air, a delegation of the former US president Jimmy Carter, Senator Sam Nunn and General Colin Powell persuaded Cédras on 18 September to step down, and on 19 September 1994 US troops landed unopposed; the force grew to about 20,000–25,000, with contingents from Caribbean and other countries. On 24 September US Marines killed ten Haitian soldiers in a firefight at Cap-Haïtien. Cédras resigned in October and left for Panama, Aristide returned to Port-au-Prince on 15 October 1994, disbanded the army in 1995, and on 31 March 1995 the multinational force handed over to the UN Mission in Haiti (UNMIH)."
