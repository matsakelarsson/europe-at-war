notes:
  - Casualty figures vary. The government gave 931 soldiers and civilians killed and some 5,000 wounded; other estimates are about 6,000 fighters and 513 civilians, or 7,000 to 10,000 dead in all.
  - The Democratic Republic of Yemen (21 May – 7 July 1994) is drawn as the southern side’s area, not as a recognised state; Saudi Arabia and some other Gulf states were sympathetic to it, while the UN Security Council called for a ceasefire in Resolutions 924 and 931.
