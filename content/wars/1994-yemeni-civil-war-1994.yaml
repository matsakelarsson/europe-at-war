steps:
  - title: From unity to war
    date: 1993 – May 1994
    when: "1994-05-04"
    borders: "1994-05-21"
    countries: [ye]
    body:
      - The merger of 1990 joined a northern state of some 9 million people with a southern one of about 2.5 million, and the south’s rulers, the Yemeni Socialist Party, soon felt pushed aside. Scores of their officials and members were assassinated in 1991–1993, and in the elections of April 1993 the party came third. In August 1993 al-Beidh left Sanaa for Aden. Mediation by Jordan produced the Document of Pledge and Accord, signed in Amman on 20 February 1994, but clashes broke out between northern and southern units stationed in each other’s territory, and on 27 April a tank battle was fought at Amran, north of Sanaa.
      - On 4 May southern aircraft bombed Sanaa and other northern cities, and northern aircraft struck Aden; southern Scud missiles fired at Sanaa killed dozens of civilians. Northern forces, with tribal levies and Islamist volunteers, advanced on several fronts. They claimed the al-Anad air base north of Aden on 20 May, and on 21 May al-Beidh declared the Democratic Republic of Yemen, with its capital at Aden. On 24 May the north took Ataq, the capital of Shabwa and the gateway to the oil fields.
