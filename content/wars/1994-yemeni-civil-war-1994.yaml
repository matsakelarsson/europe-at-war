  - title: The siege and fall of Aden
    date: June – July 1994
    when: "1994-06-01"
    borders: "1994-07-07"
    countries: [ye]
    body:
      - The UN Security Council called for a ceasefire on 1 June in Resolution 924, and again on 29 June in Resolution 931, but ceasefires lasted only hours. The northern armies closed in on Aden from the north and east and shelled the city, cutting off its water supply in the summer heat, while the oil refinery was hit. In the east, the southern forces abandoned Mukalla, the main port of Hadramaut, in early July.
      - Northern troops and jihadist fighters entered Aden on 4 July, and the city fell on 7 July. Its government buildings, factories and homes were looted, and party offices and the property of the southern elite were seized. Al-Beidh fled to Oman and other leaders to Saudi Arabia and the Gulf; a court later sentenced several of them to death in their absence. Saleh announced a general amnesty, but many southern officers and officials were forced into retirement, and the land and jobs they lost became the grievances of the Southern Movement that rose in 2007.
    facts:
      - [UN Resolution 924, "1 June 1994"]
      - [Northern forces enter Aden, "4 July 1994"]
      - [Aden falls, "7 July 1994"]
