id: yemeni-civil-war-1994
name: Yemeni Civil War (1994)
start: "1994-05-04"
end: "1994-07-07"
tier: B
summary: A short war between the armies of the former North and South Yemen, four years after the two states united in May 1990. The union had kept the two armies separate, and its leaders, President Ali Abdullah Saleh of the north and Vice-President Ali Salim al-Beidh of the south, fell out over the sharing of power and oil revenue and over a string of assassinations of southern Yemeni Socialist Party officials. After al-Beidh withdrew to Aden in 1993, a reconciliation accord signed in Amman in February 1994 failed, and full war broke out on 4 May. On 21 May al-Beidh proclaimed a Democratic Republic of Yemen in the south, which no state recognised. The larger northern forces, joined by Islamist volunteers and southerners who had fled after the South’s own civil war of 1986, besieged Aden and took it on 7 July, while the southern leaders fled abroad. Estimates of the dead range from under 1,000, the government’s figure, to about 10,000. The south’s grievances after the war later fed a secessionist movement.
countries: [ye]
sides:
