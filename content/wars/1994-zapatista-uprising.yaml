id: zapatista-uprising
name: Zapatista uprising
start: "1994-01-01"
end: "1994-01-12"
tier: B
summary: "The armed rising of the Zapatista Army of National Liberation (EZLN) in Chiapas, Mexico’s southernmost and one of its poorest states, on 1 January 1994, the day the North American Free Trade Agreement (NAFTA) came into force. The EZLN, founded in the Lacandon Jungle in 1983 by a small group of urban leftists who joined Tzeltal, Tzotzil, Ch’ol and Tojolabal Maya communities, took its name from Emiliano Zapata and spoke for Indigenous peoples who demanded land, work, health care, education, democracy and an end to discrimination, and who saw NAFTA and the reform of 1992 that ended land redistribution as a threat to their communities. Several thousand insurgents, many of them women, seized San Cristóbal de las Casas, Ocosingo, Las Margaritas, Altamirano and other towns and declared war on the federal army and the government of President Carlos Salinas de Gortari. The army struck back with troops, aircraft and armour; the worst fighting was in the market of Ocosingo. On 12 January, as large crowds marched in Mexico City for peace, Salinas declared a ceasefire. Official figures gave about 145 dead, among them soldiers, police, insurgents and civilians; other estimates are higher. The EZLN’s spokesman, Subcomandante Marcos, became known around the world. Talks led to the San Andrés Accords on Indigenous rights in February 1996, which the government did not put into law, while an army offensive in February 1995 and paramilitary violence, above all the Acteal massacre of 1997, continued the conflict at lower intensity. The EZLN has kept its arms but has not fought the army since, and governs its own autonomous communities in Chiapas."
countries: [mx]
