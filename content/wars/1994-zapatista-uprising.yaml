notes:
  - "Numbers are uncertain. The government said the EZLN had a few thousand fighters, while the EZLN claimed many more; official counts of the dead of January 1994 range from about 145 to 153, and human rights groups reported summary executions of captured insurgents and civilians by soldiers, notably in Ocosingo."
  - The conflict in Chiapas was never formally ended. The ceasefire and the Law for Dialogue of March 1995 have held between the EZLN and the army, but the region saw paramilitary killings and displacement in the late 1990s and later violence by armed groups.
