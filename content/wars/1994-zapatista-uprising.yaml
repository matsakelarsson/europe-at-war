  - title: Talks, offensive and the San Andrés Accords
    date: February 1994 – December 1997
    when: "1996-02-16"
    borders: "1996-02-16"
    countries: [mx]
    body:
      - "Talks in the cathedral of San Cristóbal in February and March 1994, mediated by Bishop Samuel Ruiz, produced proposals that the Zapatista communities rejected. In December 1994 the EZLN declared dozens of autonomous municipalities. On 9 February 1995 the new president, Ernesto Zedillo, named Marcos as Rafael Sebastián Guillén Vicente, a former university teacher, ordered the arrest of the EZLN’s leaders and sent the army into the Zapatista zone; it occupied the rebel headquarters at Guadalupe Tepeyac and thousands of villagers fled into the mountains. Public protest stopped the offensive, and in March 1995 Congress passed a Law for Dialogue that suspended the arrest warrants."
      - "Talks resumed at San Andrés Larráinzar (San Andrés Sakamch’en de los Pobres), and on 16 February 1996 the government and the EZLN signed the San Andrés Accords on Indigenous rights and culture, promising autonomy and constitutional recognition. The government did not put them into law, and the talks broke down. Paramilitary groups linked to local PRI officials attacked Zapatista sympathisers, and on 22 December 1997 gunmen killed 45 Tzotzil members of Las Abejas, a pacifist Catholic group, among them many women and children, as they prayed in a chapel at Acteal. The EZLN later turned to building autonomous government in its communities, the caracoles and Good Government Councils of 2003, while a constitutional reform of 2001 fell short of the accords."
    facts:
      - [Army offensive, "9 February 1995"]
      - [San Andrés Accords, "16 February 1996"]
      - [Acteal massacre, "22 December 1997, 45 killed"]
