steps:
  - title: The first of January
    date: 1 January 1994
    when: "1994-01-01"
    borders: "1994-01-01"
    countries: [mx]
    body:
      - "Chiapas produced much of Mexico’s electricity, coffee and cattle, yet most of its Indigenous people lived in poverty, many without land of their own, and landowners and local bosses of the ruling Institutional Revolutionary Party (PRI) dominated the countryside. Thousands of Maya families had settled the Lacandon Jungle and the valleys of the Cañadas since the 1950s. There, from 1983, the EZLN grew in secret into a guerrilla army answerable, it said, to the communities through a Clandestine Revolutionary Indigenous Committee. The reform of Article 27 of the constitution in 1992, which ended the redistribution of land promised by the Mexican Revolution, and NAFTA, which threatened the price of maize, helped persuade the communities to vote for war."
      - "In the first hours of 1 January 1994 columns of insurgents in brown and black uniforms, some armed only with wooden rifles, occupied the town halls of San Cristóbal de las Casas, Ocosingo, Las Margaritas, Altamirano, Chanal and other towns. In San Cristóbal, where a column led by Major Ana María took the town hall, Subcomandante Marcos read to tourists and journalists from the First Declaration of the Lacandon Jungle, which declared war on the federal army and called for Salinas to be removed. The insurgents opened jails and burned land records. The EZLN’s Revolutionary Women’s Law, drafted by Comandanta Ramona and others, announced equal rights for women in its ranks and communities."
