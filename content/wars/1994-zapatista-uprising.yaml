  - title: Twelve days of war
    date: 2–12 January 1994
    when: "1994-01-02"
    borders: "1994-01-02"
    countries: [mx]
    body:
      - "On 2 January the EZLN left San Cristóbal and attacked the army’s base at Rancho Nuevo nearby, where it was beaten back, and took the former governor of Chiapas, General Absalón Castellanos Domínguez, from his ranch near Comitán; he was held until February. The army flew in reinforcements and recovered the towns. In Ocosingo the insurgents who stayed were trapped in the market, and in fighting on 2–4 January dozens were killed; journalists found the bodies of five men with their hands tied, shot in the head. Air force planes fired rockets at the hills south of San Cristóbal, and human rights groups reported executions and disappearances in villages such as the ejido Morelia."
      - "The rising won wide sympathy in Mexico and abroad, and Marcos’s communiqués, carried by the press and early internet networks, made the rebels’ case. On 10 January Salinas named a peace commissioner, Manuel Camacho Solís, and on 12 January, as tens of thousands marched for peace in Mexico City, he declared a unilateral ceasefire, which the EZLN accepted. Official figures gave about 145 dead in the twelve days."
