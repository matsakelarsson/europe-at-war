id: third-taiwan-strait-crisis
name: Third Taiwan Strait Crisis
start: "1995-07-21"
end: "1996-03-25"
tier: C
summary: "A series of Chinese missile tests and military exercises around Taiwan in 1995–1996, meant to warn Taiwan’s president Lee Teng-hui against moves towards independence and to sway Taiwan’s first direct presidential election. After the United States allowed Lee to visit Cornell University, where he had studied, in June 1995, the PLA fired missiles into target zones in the sea north of Taiwan from 21 July and held naval and amphibious exercises in August and November. In March 1996, in the weeks before the election, it fired missiles into zones close to the ports of Keelung and Kaohsiung, disrupting shipping, and held live-fire exercises and landing drills in the strait, the largest at Pingtan from 18 to 25 March. The United States sent two aircraft carrier groups, led by the USS Independence and the USS Nimitz, to the waters near Taiwan, its largest show of force in Asia since the Vietnam War. No one was killed. Lee won the election on 23 March 1996 with 54 per cent of the vote. The crisis led China to build up forces able to keep American carriers away from the strait, and the United States to deepen its military ties with Taiwan."
