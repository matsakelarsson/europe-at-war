id: adf-insurgency
name: ADF insurgency
start: "1996-11-13"
end: ongoing
tier: C
summary: "Last updated 27 November 2026. The insurgency of the Allied Democratic Forces (ADF), a Ugandan Islamist rebel group that has fought mostly in the eastern Democratic Republic of the Congo and since 2019 has been, in its main faction, the Congolese branch of the Islamic State’s Central Africa Province (ISCAP). The ADF was formed in the mid-1990s by Jamil Mukulu, a convert from Catholicism who had joined the Tabligh movement, and merged with the remnants of an older western Ugandan rebel group, NALU, aiming to overthrow Yoweri Museveni’s government. Its first large attack, on Bwera and Mpondwe in Kasese district on 13 November 1996, killed about 50 people; on 8 June 1998 its fighters killed some 80 students at Kichwamba Technical College in Kabarole, and bombs in Kampala restaurants and on buses killed dozens more that year. Driven out of Uganda by the army by the early 2000s, it settled in the Rwenzori mountains and the Beni area of North Kivu, financed by timber, gold and trade. It revived from 2013; from October 2014 a wave of massacres around Beni killed hundreds of civilians, though investigators also found that Congolese army officers and other armed groups had a hand in some of the killings. Mukulu was arrested in Tanzania in April 2015, and his deputy Musa Baluku took over and brought the group into the Islamic State, which recognised it as part of ISCAP in 2018 and to which it pledged allegiance in 2019; a minority stayed loyal to Mukulu. The ADF killed UN peacekeepers, among them 15 Tanzanians at Semuliki on 7 December 2017, attacked prisons and Christian congregations, and moved north into Ituri. After a series of bombings in Uganda in late 2021, among them suicide attacks in Kampala, Uganda and the DR Congo launched a joint offensive, Operation Shujaa, on 30 November 2021, with 4,000–5,000 Ugandan troops by early 2025. It pushed the ADF out of most strongholds near Beni, but the group shifted west into Irumu and Mambasa in Ituri and south into Lubero and Tshopo, and kept raiding: 42 people, most of them pupils, were killed at Lhubiriha Secondary School in Mpondwe, Uganda, in June 2023; more than 40 people (at least 43 according to the UN) at a Catholic church in Komanda, Ituri, on 27 July 2025; at least 71 mourners at a funeral wake at Ntoyo, Lubero, on 8 September 2025; and 28 people, 17 of them in a church-run hospital, at Byambwe on 14–15 November 2025, part of a week of attacks in Lubero that killed at least 89 according to the UN. In 2025 the ADF partly rebuilt its strength while Congolese forces were drawn into the war with the M23; a strike on Musa Baluku’s headquarters on 23 February 2026 forced his camp to move deeper into the forest, but attacks went on, and the group’s raids hampered the response to an Ebola outbreak declared in Ituri in May 2026. In one week in November 2026 the ADF killed at least 44 civilians in Mambasa territory, Ituri, days after killing 66 people in North Kivu, according to humanitarian and security sources, and Africanews reported that the Ugandan and Congolese armies had had no significant success against it. Total deaths since 1996 run into the thousands, mostly Congolese civilians; exact figures are not known."
