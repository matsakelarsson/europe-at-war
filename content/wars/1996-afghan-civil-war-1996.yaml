  - title: Taloqan, the Buddhas and the death of Massoud
    date: 1999 – October 2001
    when: "2000-09-05"
    borders: "2001-09-09"
    countries: [af, pk, us]
    body:
      - The Taliban’s offensives on the Shomali plain north of Kabul in 1999 drove out its Tajik population and burned villages and orchards. In September 2000 they took Taloqan, Massoud’s headquarters in Takhar, leaving the Northern Alliance with little more than Badakhshan, the Panjshir and pockets in the centre and north. The UN Security Council imposed sanctions on the Taliban for sheltering Osama bin Laden. In January 2001 Taliban forces killed some 170 Hazara civilians at Yakawlang, and in March they blew up the giant Buddha statues of Bamyan, carved in the 6th century, despite appeals from around the world.
      - On 9 September 2001 two al-Qaeda members posing as journalists killed Massoud with a bomb hidden in their camera at Khwaja Bahauddin in the far north-east. Two days later al-Qaeda carried out the attacks of 11 September in the United States. When the Taliban refused to hand over bin Laden, the United States and Britain began bombing on 7 October 2001 and allied themselves with the Northern Alliance, whose forces, now led by Mohammed Fahim, swept the Taliban from the north and Kabul in November.
    facts:
      - [Taloqan taken by the Taliban, "5 September 2000"]
      - [Bamyan Buddhas destroyed, "March 2001"]
      - [Massoud killed, "9 September 2001"]
