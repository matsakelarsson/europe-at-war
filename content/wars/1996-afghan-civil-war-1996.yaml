id: afghan-civil-war-1996
name: Afghan Civil War (1996–2001)
start: "1996-09-27"
end: "2001-10-07"
tier: B
summary: The war between the Taliban’s Islamic Emirate of Afghanistan, which took Kabul in September 1996, and the Northern Alliance (United Islamic Front), a coalition of the forces of Ahmad Shah Massoud, Abdul Rashid Dostum, the Hazara party Hezb-e Wahdat and others, which kept the internationally recognised government of Burhanuddin Rabbani alive in the north-east. The Taliban, supported by Pakistan and joined by thousands of foreign fighters including Osama bin Laden’s al-Qaeda, took Mazar-i-Sharif in 1998 after a failed attempt the year before, and by 2001 held about 85 to 90 per cent of the country. Both sides committed massacres of prisoners and civilians, often along ethnic lines. Massoud was killed by al-Qaeda suicide bombers two days before the attacks of 11 September 2001, and the war merged into the US-led invasion that began on 7 October 2001.
countries: [af, pk, ir]
