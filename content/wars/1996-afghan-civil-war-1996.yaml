steps:
  - title: The battles for Mazar-i-Sharif
    date: 1996–1998
    when: "1997-05-19"
    borders: "1998-09-13"
    countries: [af, ir]
    body:
      - After losing Kabul, Massoud held the Panjshir valley and the north-east, and Dostum ruled the north from Mazar-i-Sharif. In May 1997 Dostum’s deputy, Abdul Malik Pahlawan, turned against him and let the Taliban into Mazar; Dostum fled to Turkey. Within days the Taliban’s attempt to disarm the Hazara and Uzbek fighters set off an uprising, and they were driven out with heavy losses. Malik’s forces killed some 2,000 to 3,000 Taliban prisoners, many of them suffocated in shipping containers or shot and buried in mass graves at Dasht-i-Laili.
      - In August 1998 the Taliban returned. They took Mazar-i-Sharif on 8 August and for several days went from house to house killing men and boys, above all Hazaras; Human Rights Watch put the dead at at least 2,000, and some estimates exceed 4,000. They also killed eight Iranian diplomats and a journalist in the Iranian consulate, and Iran massed some 70,000 troops on the border before backing down. The Taliban took Bamyan, the Hazara heartland, in September. On 20 August 1998 the United States struck al-Qaeda camps near Khost with cruise missiles after the bombings of its embassies in Kenya and Tanzania.
    facts:
      - [Taliban expelled from Mazar-i-Sharif, "May 1997"]
      - [Mazar-i-Sharif taken by the Taliban, "8 August 1998"]
      - [Estimated dead in the 1998 massacre, "2,000 to more than 4,000"]
