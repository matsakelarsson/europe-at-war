notes:
  - The Uppsala Conflict Data Program counts about 36,000 battle deaths in 1996–2001; deaths from massacres, displacement and the drought of 2000–2001 add many more. Only Pakistan, Saudi Arabia and the United Arab Emirates recognised the Taliban government; Rabbani’s government kept Afghanistan’s seat at the United Nations. The Northern Alliance was supported by Iran, Russia, India and Tajikistan.
  - Areas of control are approximate; the front lines in the north moved repeatedly.
