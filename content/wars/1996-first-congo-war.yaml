  - title: Across Zaire
    date: December 1996 – April 1997
    when: "1997-03-15"
    borders: "1997-04-09"
    countries: [cd, rw, ug, ao]
    body:
      - After a pause the AFDL and its allies pushed west on several lines. Mobutu, ill with cancer and long absent in Europe, hired mercenaries, among them Serbian pilots and soldiers of the so-called White Legion, and turned to UNITA and the ex-FAR; but his unpaid soldiers mostly fled. Kindu fell in early March and Kisangani, Zaire’s third city, on 15 March 1997 after a short battle.
      - In February 1997 Angola entered the war against Mobutu, who had long supplied UNITA, sending its own troops and the Katangese “Tigers”, descendants of the gendarmes who had fought for Katanga and in the Shaba invasions. The diamond town of Mbuji-Mayi fell on 4 April and Lubumbashi, the capital of Katanga, on 9 April, and by late April the AFDL held Kikwit on the road to Kinshasa. Mining companies began to sign deals with Kabila’s representatives.
