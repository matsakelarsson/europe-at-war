  - title: The hunt for the refugees
    date: December 1996 – May 1997
    when: "1997-04-22"
    borders: "1997-05-13"
    countries: [cd, rw]
    body:
      - Several hundred thousand Rwandan refugees, among them the ex-FAR and Interahamwe but mostly women, children and the old, fled west across Zaire on foot. Some 150,000 gathered at Tingi-Tingi near Lubutu, where aid agencies fed them until the AFDL advanced at the end of February 1997; others reached camps at Kasese and Biaro on the railway south of Kisangani. In April AFDL and Rwandan troops closed off the camps to aid workers and journalists, and tens of thousands of refugees disappeared; witnesses reported massacres and mass graves.
      - The survivors were pursued for more than 1,500 km. At Mbandaka on the Congo River, on 13 May 1997, soldiers killed hundreds of refugees as they tried to cross into Congo-Brazzaville; others reached the Central African Republic, Congo-Brazzaville and Angola. Kabila refused UN investigations. The UN Mapping Report of 2010 described systematic killings by AFDL and Rwandan troops at dozens of sites, which it said might be crimes of genocide if proven in court; Rwanda rejected its findings.
    facts:
      - [Tingi-Tingi camp overrun, "end of February 1997"]
      - [Killings at Kasese and Biaro, "April 1997"]
      - [Mbandaka massacre, "13 May 1997"]
      - [UN Mapping Report published, "1 October 2010"]
