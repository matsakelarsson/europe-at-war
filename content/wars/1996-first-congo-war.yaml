steps:
  - title: The camps and the Banyamulenge
    date: July 1994 – October 1996
    when: "1996-10-07"
    borders: "1996-10-18"
    countries: [cd, rw, bi]
    body:
      - When the Rwandan Patriotic Front ended the genocide against the Tutsi in July 1994, more than a million Hutu fled into eastern Zaire, led by the defeated army (the ex-FAR) and the Interahamwe militias. Huge camps grew up around Goma, among them Mugunga, Kibumba and Katale, and around Bukavu and Uvira, fed by the UN refugee agency. The former army and militias controlled the camps, rearmed with help from Mobutu’s officers, and raided across the border into Rwanda.
      - The camps sharpened old conflicts over land and citizenship in the Kivus. Zaire had stripped people of Rwandan origin of citizenship in 1981, and in North Kivu fighting between Hunde, Nyanga and Nande militias and Banyarwanda killed thousands from 1993; with the ex-FAR’s help, Tutsi were driven out of Masisi in 1996. In South Kivu the Banyamulenge, Tutsi long settled on the high plateaux above Uvira, were told by the deputy governor on 7 October 1996 to leave the country within a week.
      - Rwanda had been training and arming Banyamulenge for months. Fighting with Zairian troops broke out around Uvira in September and October, and on 18 October 1996 the Alliance of Democratic Forces for the Liberation of Congo-Zaire (AFDL) was announced at Lemera, joining four small rebel groups under Laurent-Désiré Kabila, who had kept up a small rebellion in the hills of South Kivu since the 1960s.
    facts:
      - [Rwandan refugees in Zaire, "more than 1 million (1994–1996)"]
      - [Banyamulenge ordered to leave, "7 October 1996"]
      - [AFDL founded, "18 October 1996"]
