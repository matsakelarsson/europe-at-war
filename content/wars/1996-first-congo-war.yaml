  - title: The fall of Kinshasa
    date: May 1997
    when: "1997-05-17"
    borders: "1997-05-17"
    countries: [cd, ao, za]
    body:
      - South Africa’s president, Nelson Mandela, brought Mobutu and Kabila together aboard the South African naval ship Outeniqua off Pointe-Noire on 4 May 1997, but Kabila refused any deal that would delay his entry into Kinshasa. In early May AFDL troops, with Angolan and Rwandan support, broke the last resistance of Mobutu’s Presidential Division and UNITA fighters at Kenge, about 200 km east of the capital.
      - On 16 May Mobutu left Kinshasa for his palace at Gbadolite and then for exile in Togo and Morocco, where he died of cancer on 7 September 1997. AFDL troops entered Kinshasa on 17 May with little fighting, and Kabila declared himself president and renamed Zaire the Democratic Republic of the Congo. Within a year he fell out with his Rwandan and Ugandan backers, and when he ordered their troops to leave in July 1998, a new war began.
    facts:
      - [Talks aboard the SAS Outeniqua, "4 May 1997"]
      - [Mobutu leaves Kinshasa, "16 May 1997"]
      - [AFDL enters Kinshasa, "17 May 1997"]
      - [Death of Mobutu, "7 September 1997"]
    link: { href: "#/war/second-congo-war", text: "What followed: the Second Congo War" }
