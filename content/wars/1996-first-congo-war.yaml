notes:
  - "Rwanda planned and led the campaign; its defence minister and vice-president, Paul Kagame, said so publicly in July 1997, and Rwandan officers such as James Kabarebe commanded the AFDL’s troops. Eritrea and Zambia also gave help, and the United States, while not a party, was close to the Rwandan and Ugandan governments."
  - "The number of Hutu refugees killed is disputed. The UN Mapping Report of 2010 documented massacres of refugees and Congolese Hutu by AFDL and Rwandan troops at dozens of places and said the attacks, if proven before a court, might be characterised as crimes of genocide; Rwanda rejected the report. Estimates of refugees who died or disappeared range from tens of thousands to more than 200,000. Mobutu’s army and the ex-FAR also killed and looted as they retreated."
