  - title: The camps broken
    date: October – December 1996
    when: "1996-11-15"
    borders: "1996-11-15"
    countries: [cd, rw, ug, bi]
    body:
      - Rwandan, Burundian and AFDL troops took Uvira on 24–25 October 1996 and Bukavu on 29–30 October, where the Catholic archbishop, Christophe Munzihirwa, was shot dead; Goma fell on 1–2 November after Rwandan artillery shelled it from Gisenyi across the border. The Zairian army fled, looting as it went. The refugees in the southern camps scattered into the forests, while hundreds of thousands crowded into Mugunga, west of Goma.
      - On 15 November the attackers shelled Mugunga and opened a road east. Over the next few days some 500,000–600,000 refugees walked back to Rwanda, while the ex-FAR, the Interahamwe and hundreds of thousands of other refugees fled west into the forests. A Canadian-led multinational force, authorised by the UN Security Council on 15 November to protect the refugees, was called off in December, its backers arguing that most had gone home. Ugandan troops entered from the north and took Bunia and the north-east in December, and Rwanda began to treat the war as a march on Kinshasa.
    facts:
      - [Uvira taken, "24–25 October 1996"]
      - [Bukavu taken, "29–30 October 1996"]
      - [Goma taken, "1–2 November 1996"]
      - [Refugees returning to Rwanda, "500,000–600,000 (mid-November 1996)"]
