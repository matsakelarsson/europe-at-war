id: first-congo-war
name: First Congo War
start: "1996-10-24"
end: "1997-05-17"
tier: A
summary: "The war in which Rwanda, Uganda and their allies overthrew Mobutu Sese Seko, who had ruled Zaire since 1965. After the genocide of 1994, more than a million Rwandan Hutu refugees, among them the soldiers and militiamen who had carried out the genocide, settled in camps along Zaire’s eastern border, from which they raided Rwanda and attacked Congolese Tutsi. In October 1996 Rwanda’s army and Congolese Tutsi fighters attacked the camps, under the cover of a new rebel coalition, the Alliance of Democratic Forces for the Liberation of Congo-Zaire (AFDL), led by the veteran rebel Laurent-Désiré Kabila. Several hundred thousand refugees went home; others fled west across the country, where AFDL and Rwandan troops hunted them down and killed tens of thousands, killings a UN report of 2010 said might be classed as genocide if proven in court. Joined by Uganda, Burundi and Angola, the AFDL crossed Zaire in seven months against a collapsing army. Mobutu fled Kinshasa on 16 May 1997, and the next day Kabila declared himself president of the Democratic Republic of the Congo. His break with his Rwandan and Ugandan backers led to the Second Congo War in 1998."
countries: [cd, rw, ug, bi, ao]
sides:
