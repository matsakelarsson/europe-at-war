        atoms: [NP-RA]
  - title: The royal massacre and the army
    date: 2001–2002
    when: "2001-11-23"
    borders: "2001-11-23"
    countries: [np]
    body:
      - "On 1 June 2001 Crown Prince Dipendra shot dead nine members of the royal family at the Narayanhiti Palace, among them King Birendra and Queen Aishwarya, and then shot himself; he was proclaimed king while in a coma and died three days later. The king’s brother Gyanendra came to the throne. Many Nepalis distrusted the official account, and the Maoists made use of it. A ceasefire from July and three rounds of talks failed over the Maoist demand for an elected constituent assembly, and in the night of 22–23 November the Maoists attacked the army for the first time, at its barracks in Ghorahi in Dang. On 26 November the government declared a state of emergency, called the Maoists terrorists and sent in the Royal Nepal Army."
      - "2002 was the bloodiest year of the war. The Maoists overran district towns with thousands of fighters: at Mangalsen in Achham on 17 February they killed more than 100 soldiers, policemen and officials, and at Sandhikharka in Arghakhanchi in September dozens more. The army, enlarged with American, British and Indian help, struck back with raids and air attacks on Maoist gatherings and was accused of killing many unarmed villagers. Parliament was dissolved in May, and on 4 October King Gyanendra dismissed the elected prime minister and appointed governments of his own."
    facts:
      - [Royal massacre, "1 June 2001"]
      - [Attack on Ghorahi, "night of 22–23 November 2001"]
      - [State of emergency, "26 November 2001"]
      - [King dismisses the government, "4 October 2002"]
    markers:
      - kind: event
        name: Narayanhiti Palace
        date: 1 June 2001
        text: The crown prince killed his parents and seven other members of the family at a dinner in the palace.
        lonlat: [85.318, 27.715]
      - kind: battle
        side: mao
        name: Ghorahi
        date: 22–23 November 2001
        text: The Maoists stormed the army barracks and seized weapons, breaking the ceasefire.
        lonlat: [82.487, 28.039]
      - kind: battle
        side: mao
        name: Mangalsen
        date: 17 February 2002
        text: Simultaneous attacks on the district headquarters of Achham and the nearby airfield, one of the deadliest single attacks of the war.
        lonlat: [81.256, 29.141]
      - kind: battle
        side: mao
        name: Sandhikharka
        date: 8 September 2002
        text: The Maoists overran the headquarters of Arghakhanchi district, killing dozens of policemen.
        lonlat: [83.127, 27.976]
    areas:
