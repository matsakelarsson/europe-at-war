  - title: Ceasefire, royal rule and the height of the war
    date: 2003–2004
    when: "2004-03-20"
    borders: "2004-03-20"
    countries: [np]
    body:
      - "A second ceasefire, agreed on 29 January 2003, led to three rounds of talks but broke down on 27 August, again over the constituent assembly. Days earlier, on 17 August, soldiers at Doramba in Ramechhap had taken 19 people, most of them Maoists attending a meeting, and executed them, as Nepal’s National Human Rights Commission later found. In 2003 and 2004 the UN recorded more enforced disappearances in Nepal than in any other country; at the army’s Maharajgunj barracks in Kathmandu alone, a UN investigation found that 49 detainees had disappeared."
      - "The Maoists mounted ever larger raids. In March 2004 thousands of them attacked Beni, the headquarters of Myagdi district, freeing prisoners and seizing the chief district officer before withdrawing. In August 2004 they called a blockade of Kathmandu, and for a week traffic to the capital almost stopped, though they had few fighters near it. The war was a stalemate: the army held the towns and highways, and the Maoists most of the countryside."
    facts:
      - [Second ceasefire, "29 January – 27 August 2003"]
      - [Doramba killings, "17 August 2003"]
      - [Attack on Beni, "20–21 March 2004"]
      - [Blockade of Kathmandu, "August 2004"]
    markers:
      - kind: event
        side: np
        name: Doramba
        date: 17 August 2003
        text: Soldiers marched 19 captured people to a hillside and shot them, one of the worst killings by the security forces.
        lonlat: [85.921, 27.547]
      - kind: battle
        name: Beni
        date: 20–21 March 2004
        text: The Maoists attacked the town with several thousand fighters. Dozens were killed on both sides before they withdrew.
        lonlat: [83.567, 28.344]
      - kind: event
        side: mao
        name: Kathmandu
        date: August 2004
        text: A week-long Maoist blockade, enforced mostly by threats, cut the capital off from the rest of the country.
        lonlat: [85.324, 27.717]
    areas:
      - style: occupied
        side: mao
        label: Countryside largely under Maoist control (approximate)
        atoms: [NP-RA, NP-BH, NP-KA, NP-SE, NP-MA, NP-DH]
  - title: The royal coup
    date: 2005
    when: "2005-02-01"
    borders: "2005-02-01"
    countries: [np]
    body:
      - "On 1 February 2005 King Gyanendra dismissed the government, declared a state of emergency, cut telephone and internet lines and arrested party leaders and journalists, saying the politicians had failed to defeat the insurgency. India and Britain suspended military aid, and the United States held back part of its aid. The war went on: on 6 June a Maoist landmine blew up a crowded bus at Badarmude near Madi in Chitwan, killing some 38 passengers, for which the Maoist leadership apologised, and in August the Maoists overran an army camp at Pili in Kalikot."
      - "The coup drove the Maoists and the parliamentary parties together. In September the Maoists declared a unilateral ceasefire, and on 22 November 2005, after talks in New Delhi, they and the Seven Party Alliance agreed a 12-point understanding to end the “autocratic monarchy”, hold elections to a constituent assembly and bring the Maoists into multiparty politics."
    facts:
      - [Royal coup, "1 February 2005"]
      - [Madi bus bombing, "6 June 2005"]
      - [12-point understanding, "22 November 2005"]
    markers:
      - kind: event
        side: np
        name: Kathmandu
        date: 1 February 2005
        text: The king took absolute power, and soldiers were posted in newsrooms to censor the press.
        lonlat: [85.324, 27.717]
      - kind: event
        side: mao
        name: Madi
        date: 6 June 2005
        text: A Maoist mine destroyed a passenger bus at Badarmude, killing some 38 people, many of them women and children.
        lonlat: [84.352, 27.435]
    areas:
      - style: occupied
        side: mao
        label: Countryside largely under Maoist control (approximate)
        atoms: [NP-RA, NP-BH, NP-KA, NP-SE, NP-MA, NP-DH]
  - title: The April uprising and the peace accord
    date: 2006
    when: "2006-11-21"
    borders: "2006-11-21"
    countries: [np]
    body:
      - "The Maoists ended their ceasefire in January 2006 and attacked several towns, among them Tansen, the headquarters of Palpa district. In April the Seven Party Alliance called a general strike, backed by the Maoists, and for 19 days, from 6 to 24 April, hundreds of thousands of people marched in Kathmandu and other towns in defiance of curfews; security forces killed about 20 protesters and injured thousands. On 24 April King Gyanendra announced that he would restore the House of Representatives. It met on 28 April, stripped the king of his powers and his command of the army, and the new government of Girija Prasad Koirala and the Maoists declared ceasefires."
      - "On 21 November 2006 Koirala and Prachanda signed the Comprehensive Peace Accord. Maoist fighters went into cantonments, where a UN mission (UNMIN) monitored them and their weapons from 2007 to 2011; the Maoists joined an interim parliament and government. They became the largest party in the Constituent Assembly elected in April 2008, which abolished the monarchy on 28 May 2008, and Prachanda became prime minister. More than 17,000 people had been killed and about 1,300 had disappeared. Commissions on truth and on disappearances, set up in 2015, received more than 60,000 complaints but resolved few of them."
    facts:
      - [April uprising, "6–24 April 2006"]
      - [Parliament restored, "24–28 April 2006"]
      - [Comprehensive Peace Accord, "21 November 2006"]
      - [Monarchy abolished, "28 May 2008"]
    markers:
      - kind: battle
        side: mao
        name: Tansen
        date: 31 January 2006
        text: Maoist fighters attacked the town at night, burning government buildings and part of a historic palace.
        lonlat: [83.547, 27.866]
      - kind: treaty
        name: Comprehensive Peace Accord
        date: 21 November 2006
        text: Signed in Kathmandu after weeks of mass protest had ended the king’s rule. The palace became a museum after the monarchy was abolished in 2008.
        lonlat: [85.324, 27.717]
