    ink: red
    moves: Maoist moves
    success: Maoist success
notes:
  - The Maoists fought through a People’s Liberation Army and village militias, and ran “people’s governments”, courts and taxes in the areas they held. The government fought first with the police and an armed police force; the Royal Nepal Army was deployed from November 2001.
  - "Both sides committed grave abuses. By the counts of Nepali human rights groups, government forces were responsible for about two-thirds of the deaths and the Maoists for about one-third; the security forces carried out extrajudicial executions and enforced disappearances, and the Maoists killed civilians they accused of being informers, abducted villagers and students, and recruited children. Few cases have been prosecuted."
  - Zones of Maoist control are drawn as areas in the steps and are approximate; the district towns mostly stayed in government hands.
