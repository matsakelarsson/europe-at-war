steps:
  - title: The People’s War begins
    date: 1996–2001
    when: "1996-02-13"
    borders: "1996-02-13"
    countries: [np]
    body:
      - "The People’s Movement of 1990 made Nepal a constitutional monarchy with multiparty elections, but short-lived governments did little for the poor, low-caste and ethnic communities of the hills, above all in the mid-west. The Communist Party of Nepal (Maoist), led by Pushpa Kamal Dahal, known as Prachanda, and Baburam Bhattarai, gave the prime minister a list of 40 demands on 4 February 1996. Nine days later, on 13 February, it began a “People’s War” with attacks on police posts in Rolpa, Rukum and Sindhuli, among them the post at Holeri in Rolpa, and on government offices and a bank."
      - "Police operations in Rolpa, such as Operation Romeo in 1995 and Kilo Sierra II in 1998, were marked by beatings, rapes and killings of villagers, which drove many into the Maoists’ ranks. From their base area in Rolpa and Rukum, the Maoists built up a militia and a guerrilla army, set up “people’s governments” and, by 2001, had driven the police out of much of the rural mid-west and other hill districts. Their attacks grew larger: in September 2000 they overran the district headquarters of Dolpa at Dunai, killing 14 policemen. The army stayed in its barracks."
    facts:
      - [40 demands, "4 February 1996"]
      - [People’s War launched, "13 February 1996"]
      - [Attack on Dunai, "25 September 2000"]
    markers:
      - kind: event
        side: mao
        name: Holeri
        date: 13 February 1996
        text: One of the police posts attacked on the first night of the People’s War.
        lonlat: [82.506, 28.184]
        lp: b
      - kind: capital
        side: mao
        name: Thawang
        date: 1996–2006
        text: A village in northern Rolpa that became the heart of the Maoist base area, often called its capital.
        lonlat: [82.740, 28.459]
      - kind: taken
        side: mao
        name: Dunai
        date: 25 September 2000
        text: Hundreds of Maoists overran the headquarters of Dolpa district, killing 14 policemen and robbing the bank.
        lonlat: [82.917, 28.933]
      - kind: capital
        side: np
        name: Kathmandu
        date: 1996
        text: The capital, seat of King Birendra and of an elected government led by the Nepali Congress.
        lonlat: [85.324, 27.717]
    areas:
