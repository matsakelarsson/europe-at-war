id: nepalese-civil-war
name: Nepalese Civil War
start: "1996-02-13"
end: "2006-11-21"
tier: A
summary: "The armed rebellion of the Communist Party of Nepal (Maoist), which launched a “People’s War” against the constitutional monarchy in 1996 from the hills of the mid-west. Drawing on rural poverty and caste and ethnic exclusion, the Maoists spread their control over much of the countryside. After the royal massacre of 2001 the army was sent in and the war grew much bloodier, with large attacks on district towns, extrajudicial killings and disappearances. King Gyanendra’s seizure of absolute power in 2005 drove the parliamentary parties into an alliance with the Maoists; a popular uprising in April 2006 forced him to restore parliament, and the Comprehensive Peace Accord of November 2006 ended the war. More than 17,000 people were killed and about 1,300 disappeared. The Maoists entered the government, and in 2008 an elected assembly abolished the monarchy."
countries: [np]
sides:
  - id: np
    name: Government of Nepal (Kingdom of Nepal)
    polities: [nepal]
    ink: blue
    moves: Government moves
    success: Government success
  - id: mao
