steps:
  - title: The battle for Brazzaville
    date: June – October 1997
    when: "1997-06-05"
    borders: "1997-10-15"
    countries: [cg, ao, cd]
    body:
      - On 5 June 1997 Lissouba, fearing a coup, sent the army and his Cocoye militia to disarm Sassou Nguesso’s Cobras and arrest him at his residence in the Mpila quarter of Brazzaville. The Cobras fought back, and the capital split into zones held by each militia. Both sides shelled densely populated quarters, and French troops evacuated some 6,000 foreigners in mid-June. Mediation by Gabon’s president Omar Bongo and others brought only short ceasefires; the election was never held. In September Lissouba made Kolélas prime minister, bringing his Ninjas into the war on the government’s side.
      - Angola, which accused Lissouba of letting UNITA use Congo as a supply route, entered the war in October. Angolan aircraft bombed Cocoye positions on 11–12 October, and Angolan troops with tanks crossed from Cabinda into the south. Lissouba fled, the Cobras took Brazzaville on 15 October and Angolan troops took Pointe-Noire, and on 25 October Sassou Nguesso was sworn in as president. Large parts of Brazzaville had been destroyed and looted.
    facts:
      - [War begins in Brazzaville, "5 June 1997"]
      - [Angolan air strikes, "11–12 October 1997"]
      - [Cobras take Brazzaville, "15 October 1997"]
      - [Sassou Nguesso sworn in, "25 October 1997"]
