  - title: The war in the Pool and the south
    date: 1998 – December 1999
    when: "1998-12-16"
    borders: "1999-01-01"
    countries: [cg, ao, td]
    body:
      - Driven from the capital, the Cocoyes regrouped in the Niari, Bouenza and Lékoumou, and in April 1998 they seized the Moukoukoulou dam, cutting power to Pointe-Noire for weeks. Kolélas’s Ninjas and a new Lari militia, the Nsiloulou of the pastor Frédéric Bintsamou (Pastor Ntumi), fought in the Pool. On 16 December 1998 Ninja fighters infiltrated the southern quarters of Brazzaville, Bacongo and Makélékélé; government forces shelled the quarters, and some 200,000 people fled. Government troops, Angolan and Chadian soldiers retook the towns of the south, among them Nkayi and Dolisie, and killed and raped many civilians; the rebels also killed civilians and officials.
      - Through 1999 government offensives wore the militias down. Agreements signed at Pointe-Noire on 16 November and in Brazzaville on 29 December 1999 provided for a ceasefire, an amnesty and the surrender of weapons, and some 2,000 Ninja and Cocoye fighters gave themselves up. Sassou Nguesso, who had ruled in 1979–1992, won a new constitution and elections in 2002 and was declared the winner of a fifth term in March 2026. Ntumi’s Ninjas held out in the Pool and fought the government again in 2002–2003 and in the Pool War of 2016–2017.
    facts:
