notes:
  - The militias recruited along regional and ethnic lines, the Cobras among the Mbochi and other peoples of the north, the Cocoyes in the Niari, Bouenza and Lékoumou (the Nibolek) and the Ninjas among the Lari of Brazzaville and the Pool. They had first fought each other in 1993–1994, after disputed parliamentary elections.
  - "Foreign involvement went beyond Angola: France was accused of arming Sassou Nguesso’s Cobras to protect its oil interests, some Rwandan Hutu refugees from Zaire fought for Sassou Nguesso and others against him, UNITA, which Lissouba’s government had helped, was accused of aiding his side, and Kinshasa’s artillery shelled Brazzaville in 1997. In May 1999 hundreds of refugees returning from Kinshasa disappeared after arriving at Brazzaville’s river port (the “Beach” case); families later filed complaints over 353 missing people."
