id: republic-of-the-congo-civil-war
name: Republic of the Congo Civil War (1997–1999)
start: "1997-06-05"
end: "1999-12-29"
tier: B
summary: "The war in Congo-Brazzaville between the militias of the country’s three main politicians, the elected president Pascal Lissouba (the Cocoyes), the former military ruler Denis Sassou Nguesso (the Cobras) and Brazzaville’s mayor Bernard Kolélas (the Ninjas). It began on 5 June 1997, a few weeks before a presidential election, when government forces surrounded Sassou Nguesso’s residence in Brazzaville, and turned the capital into a battlefield divided between the militias. In October 1997 Angola, which accused Lissouba of helping UNITA, sent troops and aircraft, and Sassou Nguesso took power. Fighting resumed in 1998–1999 in the south, the Pool region and the southern quarters of Brazzaville, where Ninjas and Cocoyes fought the new government, its Angolan allies and Chadian troops; hundreds of thousands of people fled to the forests. Ceasefires signed in November and December 1999 ended the war. Estimates of the dead range from about 14,000 to 25,000."
countries: [cg, ao, cd]
