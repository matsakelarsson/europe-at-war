    name: Eritrea
    polities: [eritrea]
    ink: blue
    moves: Eritrean moves
    success: Eritrean success
  - id: et
    name: Ethiopia
    polities: [ethiopia]
    ink: red
    moves: Ethiopian moves
    success: Ethiopian success
notes:
  - "How the war began is disputed. Eritrea says that Badme lay on its side of the border fixed by the Italian–Ethiopian treaties of 1900–1908, that Ethiopia had been moving into Eritrean land, and that its patrol was fired on at Badme on 6 May 1998. Ethiopia says that Eritrea invaded land it had always administered. The Eritrea–Ethiopia Claims Commission ruled in 2005 that Eritrea had broken international law by attacking across the line Ethiopia administered on 12 May 1998, while the Boundary Commission ruled in 2002 that the treaty line placed Badme in Eritrea."
  - "Casualty figures are uncertain and were long kept secret. Eritrea acknowledged about 19,000 soldiers killed; Ethiopian figures for its own dead range from about 34,000 upwards, and some estimates give over 100,000 Ethiopian dead. Most international estimates of the total lie between 70,000 and 100,000; a few go up to 300,000. About 600,000 people were displaced in 1998–1999, and many more in Eritrea in 2000."
