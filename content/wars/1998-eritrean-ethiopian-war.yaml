  - title: No war, no peace
    date: 2008–2018 and after
    when: "2018-07-09"
    borders: "2018-07-09"
    countries: [er, et, so]
    body:
      - "For eighteen years the two armies faced each other along the border. Each backed the other’s rebels: Eritrea armed Ethiopian opposition fronts such as the Ogaden National Liberation Front and the Oromo Liberation Front and supported the Islamic Courts in Somalia, and Ethiopia hosted Eritrean opposition groups. Eritrea kept its young people in an open-ended national service that drove hundreds of thousands to flee the country. Clashes flared from time to time; in June 2016, in a battle at Tsorona, each side claimed to have killed hundreds of the other’s soldiers."
      - "In April 2018 Abiy Ahmed became prime minister of Ethiopia, and on 5 June his ruling coalition announced that it would accept the Algiers agreement and the boundary ruling in full. Abiy visited Asmara, and on 9 July 2018 he and President Isaias Afwerki signed a joint declaration of peace and friendship. Embassies and flights resumed, and the border crossings at Zalambessa and Bure opened in September 2018, although they were closed again within months and the border was never demarcated on the ground. Abiy received the Nobel Peace Prize in 2019, largely for the peace with Eritrea."
      - "The rapprochement turned into a military alliance against the TPLF in the Tigray War of 2020–2022, in which Eritrean troops fought inside Ethiopia. It broke down after the Pretoria agreement, from which Eritrea was excluded. As Abiy spoke of Ethiopia’s need for access to the Red Sea, relations worsened again; in October 2026 the two countries broke off diplomatic relations, and in November 2026 their forces exchanged drone strikes and artillery fire near Badme."
    facts:
      - [Ethiopia accepts the boundary ruling, "5 June 2018"]
      - [Joint declaration of peace and friendship, "9 July 2018, Asmara"]
      - [Border crossings reopened, "11 September 2018"]
