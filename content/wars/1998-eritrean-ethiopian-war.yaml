  - title: Operation Sunset
    date: February – March 1999
    when: "1999-02-23"
    borders: "1999-03-01"
    countries: [er, et]
    body:
      - "Fighting resumed in early February 1999. On 22 February Ethiopia launched Operation Sunset against the Eritrean fortifications around Badme. After several days of assaults by massed infantry, supported by tanks, artillery and aircraft, Ethiopian forces broke through the trench lines, and Eritrean troops withdrew from the Badme area on 26–27 February. Observers estimated that tens of thousands of soldiers were killed in these few weeks. On 27 February Eritrea announced that it accepted the OAU’s framework agreement."
      - "Ethiopia went on to attack on the central front. From 16 March 1999 it sent wave after wave of infantry against the Eritrean lines at Tsorona, where the Eritreans held and both sides suffered heavy losses. Fighting continued on all three fronts through the spring, including at Bure, and then settled into trench warfare while mediators worked on technical arrangements for a ceasefire that neither side would sign."
    facts:
      - [Operation Sunset, "22–27 February 1999"]
      - [Badme retaken by Ethiopia, "26–27 February 1999"]
      - [Ethiopian offensive at Tsorona, "from 16 March 1999"]
