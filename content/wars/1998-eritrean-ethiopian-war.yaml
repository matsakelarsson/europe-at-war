steps:
  - title: From allies to enemies
    date: 1991 – May 1998
    when: "1998-05-06"
    borders: "1998-05-12"
    countries: [er, et]
    body:
      - "The Eritrean People’s Liberation Front and the Tigray People’s Liberation Front had fought side by side to overthrow the Derg in 1991, and Ethiopia’s new government, led by the TPLF’s Meles Zenawi, accepted Eritrean independence in 1993. The two economies stayed bound together: Ethiopia used the Eritrean ports of Assab and Massawa, and Eritrea sold most of its exports in Ethiopia and used the Ethiopian birr. Relations soured over trade rules, the Assab oil refinery, which closed in 1997, and above all Eritrea’s new currency, the nakfa, introduced in November 1997, which Ethiopia refused to treat as equal to the birr, demanding hard currency for trade."
      - "The border itself had never been marked on the ground. It rested on treaties between Italy and Ethiopia of 1900, 1902 and 1908, which drew it along rivers, the Mereb and the Setit, and straight lines between them that local administration had never followed exactly. In July 1997 Ethiopian troops entered the Bada area in the Afar lowlands, and in October Tigray’s regional government published a map that showed land Eritrea claimed as Ethiopian. A joint border commission met without result."
      - "On 6 May 1998 an Eritrean patrol in the area of Badme, a small town in the Yirga triangle administered by Tigray, exchanged fire with Tigrayan militia and police, and several Eritrean officers were killed. On 12 May Eritrean mechanised forces moved in and occupied Badme and the surrounding area. On 13 May Ethiopia’s parliament declared that Eritrea had committed aggression and demanded its withdrawal, in effect declaring war."
    facts:
