  - title: The offensive of May 2000
    date: 12 May – 18 June 2000
    when: "2000-05-12"
    borders: "2000-06-18"
    countries: [er, et]
    body:
      - "After talks broke down, Ethiopia attacked on the western front on 12 May 2000 with several armoured and over twenty infantry divisions. Its forces broke through west of the Mereb, outflanked the Eritrean defences and took Barentu, the main town of the south-west, around 18 May, then Tesseney and other towns in the Gash-Barka lowlands; the UN Security Council imposed an arms embargo on both countries on 17 May. Hundreds of thousands of Eritrean civilians fled north, and Ethiopian troops looted and destroyed property in the towns they held."
      - "On the central front Ethiopia retook Zalambessa on 23–25 May, after Eritrea announced a withdrawal from the disputed areas, and its troops pushed on into Eritrea as far as Senafe. On 25 May Ethiopia declared that the war was over, but fighting went on at Bure, where Eritrean forces stopped the last Ethiopian attacks on the road to Assab in early June. The Eritrean army had lost much ground but remained intact."
      - "At talks in Algiers, both sides signed an Agreement on Cessation of Hostilities on 18 June 2000. Ethiopia agreed to withdraw to its positions of 6 May 1998, and a Temporary Security Zone 25 km deep was to be set up inside Eritrea, patrolled by UN peacekeepers."
    facts:
