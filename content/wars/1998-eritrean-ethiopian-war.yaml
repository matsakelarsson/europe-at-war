  - title: Three fronts and the air war
    date: May 1998 – January 1999
    when: "1998-06-05"
    borders: "1998-06-15"
    countries: [er, et]
    body:
      - "Fighting spread along the border in May and June 1998 on three fronts: in the west around Badme and Shiraro, in the centre between Tsorona and Zalambessa, where Eritrean forces took Zalambessa and the hills around it, and in the east at Bure, on the road from Ethiopia to Assab. Both armies were led by veterans of the guerrilla war against the Derg and both called up hundreds of thousands of soldiers. They dug trench lines that reminded observers of the First World War."
      - "On 5 June 1998 Ethiopian aircraft bombed Asmara’s airport and Eritrean aircraft bombed Mekelle, where cluster bombs hit the Ayder school and killed dozens of people, many of them children; Eritrean planes also struck Adigrat. The United States arranged a moratorium on air strikes on 14 June. Mediators from the United States, Rwanda and the Organisation of African Unity proposed that both sides return to their positions before 6 May, which Ethiopia accepted and Eritrea rejected."
      - "Both governments turned on each other’s people. Ethiopia deported some 77,000 Eritreans and Ethiopians of Eritrean descent, many of whom had lived in Ethiopia all their lives, often seizing their property; Eritrea expelled or pressured out some 70,000 Ethiopians. Both bought new tanks, aircraft and artillery during the winter lull, Ethiopia from Russia and eastern Europe."
    facts:
