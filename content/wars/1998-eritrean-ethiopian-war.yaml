  - title: Algiers and the boundary ruling
    date: December 2000 – 2008
    when: "2002-04-13"
    borders: "2002-04-13"
    countries: [er, et]
    body:
      - "The peace agreement signed in Algiers on 12 December 2000 ended the war. It set up a neutral Boundary Commission to delimit the border on the basis of the colonial treaties, with both sides bound in advance to accept its decision, and a Claims Commission for damages. The UN Mission in Ethiopia and Eritrea (UNMEE), some 4,000 peacekeepers, patrolled the Temporary Security Zone, and Ethiopian troops withdrew from most of Eritrea in early 2001."
      - "On 13 April 2002 the Boundary Commission gave its decision. Both governments at first claimed victory, but the commission’s maps, clarified in 2003, placed Badme, the town where the war began, on the Eritrean side. Ethiopia called the ruling unjust and refused to let it be marked on the ground; in 2004 it accepted it “in principle” but asked for talks, which Eritrea refused, demanding withdrawal first. In 2005 the Claims Commission found that Eritrea had broken international law by attacking at Badme on 12 May 1998, and both countries liable for violations against civilians."
      - "Eritrea, frustrated, restricted the UN peacekeepers until the mission was ended in 2008. In November 2007 the Boundary Commission declared the border demarcated by map coordinates and dissolved itself. Troops of both armies faced each other across the line, and Ethiopia kept Badme."
