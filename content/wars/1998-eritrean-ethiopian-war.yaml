id: eritrean-ethiopian-war
name: Eritrean–Ethiopian War
start: "1998-05-06"
end: "2000-06-18"
tier: A
summary: "A border war between Eritrea and Ethiopia, whose ruling fronts, the EPLF and the TPLF, had fought together against the Derg until 1991. Disputes over trade, Eritrea’s new currency and the unmarked colonial border came to a head in May 1998 when fighting broke out at Badme, a small town administered by Ethiopia and claimed by Eritrea, and Eritrean forces occupied it. The war was fought in trenches along three fronts, with mass infantry assaults, tanks, artillery and aircraft on both sides; tens of thousands of soldiers were killed, and each country expelled tens of thousands of the other’s nationals. Ethiopia retook Badme in Operation Sunset in February 1999, and in May 2000 its offensive broke the western front and occupied a strip of western and southern Eritrea. A ceasefire was signed on 18 June 2000 and a peace agreement in Algiers on 12 December 2000. The boundary commission set up by the agreement awarded Badme to Eritrea in 2002, but Ethiopia would not withdraw, and the two countries stayed in a state of “no war, no peace” until Prime Minister Abiy Ahmed accepted the ruling in 2018. Estimates of the dead range from about 70,000 to 100,000, and some go far higher."
countries: [er, et]
sides:
