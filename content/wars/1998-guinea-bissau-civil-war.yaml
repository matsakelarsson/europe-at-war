id: guinea-bissau-civil-war
name: Guinea-Bissau Civil War
start: "1998-06-07"
end: "1999-05-10"
tier: C
summary: "The war between President João Bernardo “Nino” Vieira and a military junta led by his former chief of staff, Brigadier Ansumane Mané. Vieira had suspended Mané in January 1998, accusing him of letting weapons from army depots reach the separatist rebels of Casamance in neighbouring Senegal. On 7 June 1998, the day after Vieira dismissed Mané and named a successor, troops loyal to him seized barracks and the airport in Bissau, and most of the army and many veterans of the independence war joined them. About 1,300 Senegalese and 400 Guinean troops intervened on Vieira’s side, and the fighting in and around Bissau drove some 200,000 people from the capital and 350,000 from their homes in all; more than 3,000 foreigners were evacuated. A truce in July and a ceasefire in August were followed by the Abuja accord of 1 November 1998, which provided for a government of national unity, elections and the replacement of the Senegalese and Guinean troops by an ECOMOG force from Togo, Benin, Niger and the Gambia. Fighting resumed briefly in early 1999; the foreign troops left in March, and in early May, in a dispute over disarmament, the junta attacked again and overthrew Vieira on 7 May 1999. He took refuge in the Portuguese embassy, signed an unconditional surrender on 10 May and went into exile in Portugal. At least 655 people were killed. Kumba Ialá won the presidential election of 1999–2000; Mané, who tried to take power again, was killed in November 2000, and Vieira returned to be elected president in 2005."
