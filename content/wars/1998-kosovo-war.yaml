steps:
  - title: The KLA and Prekaz
    date: 1989 – March 1998
    when: "1998-02-28"
    borders: "1998-03-07"
    countries: [xk, rs]
    body:
      - In 1989 Serbia, led by Slobodan Milošević, took away most of the autonomy Kosovo had held under the Yugoslav constitution of 1974. Kosovo Albanians, the great majority of the province’s people, were dismissed in their tens of thousands from state jobs, and Albanian-language schools and the university moved into private houses. Under Ibrahim Rugova they voted for independence in an unofficial referendum in 1991, built parallel institutions and kept to peaceful resistance. When the Dayton Agreement of 1995 left Kosovo out, a small armed group, the Kosovo Liberation Army (KLA), began attacking Serbian police, and in 1997 it armed itself with weapons looted from depots in Albania during that country’s collapse into unrest.
      - The KLA was strongest in Drenica, a hilly district west of Priština. On 28 February 1998 an ambush there killed four Serbian policemen, and police attacking the villages of Likoshan and Qirez killed more than two dozen Albanians, many of them civilians; the war is usually dated from that day. On 5–7 March special police besieged the compound of the KLA leader Adem Jashari at Prekaz and killed him and almost 60 members of his family, women and children among them. Belgrade called the operation a strike against terrorists; Albanians remembered it as a massacre, and thousands joined the KLA. On 31 March the UN Security Council placed an arms embargo on Yugoslavia.
    facts:
      - [Kosovo’s autonomy curtailed, "March 1989"]
      - [Likoshan and Qirez, "28 February – 1 March 1998"]
      - [Attack on Prekaz, "5–7 March 1998"]
