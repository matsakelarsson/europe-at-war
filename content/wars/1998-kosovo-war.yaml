  - title: The 1998 offensive and the October agreement
    date: May – December 1998
    when: "1998-05"
    borders: "1998-10-25"
    countries: [xk, rs, al]
    body:
      - Through the spring the KLA spread from Drenica across central and western Kosovo, cutting roads and setting up checkpoints, and in July it claimed to hold up to 40 per cent of the province, though its hold on much of it was thin. On 17 July it seized the town of Orahovac, which police retook within days; dozens of Serbs abducted in the fighting were never seen again. From late July the Yugoslav Army and Serbian police counter-attacked with artillery, retook Mališevo and the KLA’s border stronghold of Junik, and burned villages as they went. By autumn some 200,000–300,000 people had been driven from their homes, tens of thousands of them sheltering in the hills.
      - On 26 September Serbian forces killed 21 members of the Deliaj family at Gornje Obrinje, and the images of the dead helped harden Western opinion. The UN Security Council had demanded a ceasefire and the withdrawal of security forces three days earlier, and on 13 October NATO authorised air strikes. The same day the American envoy Richard Holbrooke and Milošević agreed that Yugoslav forces would be cut back and that up to 2,000 unarmed monitors of the OSCE’s Kosovo Verification Mission would watch the ceasefire, with NATO aircraft flying over. The KLA moved back into the ground the police left, and by December the fighting had flared again.
    facts:
      - [KLA seizes Orahovac, "17 July 1998"]
      - [UN Security Council Resolution 1199, "23 September 1998"]
      - [Holbrooke–Milošević agreement, "13 October 1998"]
    markers:
