  - title: Kumanovo, Resolution 1244 and KFOR
    date: 3–20 June 1999
    when: "1999-06-03"
    borders: "1999-06-20"
    countries: [xk, rs, mk]
    move_names: { none: "Russian column from Bosnia" }
    body:
      - On 3 June Milošević accepted a peace plan brought to Belgrade by Finland’s president, Martti Ahtisaari, for the European Union, and Russia’s envoy, Viktor Chernomyrdin, and the Serbian parliament approved it the same day. On 9 June NATO and Yugoslav generals signed the Military Technical Agreement at Kumanovo in Macedonia. All Yugoslav forces were to leave Kosovo within eleven days, and a five-kilometre ground safety zone and a 25-kilometre air safety zone were set along its boundary inside Serbia. NATO stopped the bombing on 10 June, and the same day the UN Security Council adopted Resolution 1244, with China abstaining.
      - The resolution reaffirmed Yugoslavia’s sovereignty and territorial integrity but put Kosovo under an interim UN administration (UNMIK), with “substantial autonomy” pending a decision on its final status, and an international security force, KFOR. On 12 June KFOR began entering from Macedonia. Some 200 Russian peacekeepers from Bosnia had driven through Serbia overnight and reached Priština airport first; the British general Mike Jackson refused an order from NATO’s commander, Wesley Clark, to block the runway, and Russia later took part in KFOR. The last Yugoslav forces left on 20 June, and the KLA agreed to disarm, which it completed by 20 September.
    facts:
      - [Kumanovo Agreement, "9 June 1999"]
      - [UN Security Council Resolution 1244, "10 June 1999, 14–0 with China abstaining"]
