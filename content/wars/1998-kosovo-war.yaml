id: kosovo-war
name: Kosovo War
start: "1998-02-28"
end: "1999-06-11"
tier: A
summary: A war in Kosovo, then a province of Serbia within the Federal Republic of Yugoslavia, between Yugoslav and Serbian forces and the Kosovo Liberation Army (KLA), which fought for independence after a decade of Serbian rule that had stripped the province of its autonomy. After a year of fighting and failed talks at Rambouillet, NATO bombed Yugoslavia for 78 days in 1999 without a UN Security Council mandate, while Yugoslav forces drove some 850,000 Kosovo Albanians out of the province. The war ended in June 1999 with the Kumanovo Agreement and UN Security Council Resolution 1244, which put Kosovo under UN administration and a NATO-led force; about 200,000 Serbs, Roma and other non-Albanians then fled or were driven out.
countries: [xk, rs, me, al, mk]
sides:
  - id: fry
    name: FR Yugoslavia and Serbia
    polities: [yugoslavia]
    ink: red
    moves: Yugoslav and Serbian moves
    success: Yugoslav and Serbian success
  - id: kla
    name: Kosovo Liberation Army (KLA)
    polities: [kla]
    ink: purple
    moves: KLA moves
    success: KLA success
  - id: nato
    name: NATO
    polities: [nato]
    ink: navy
    moves: NATO and KFOR moves
    success: NATO success
notes:
  - Kosovo is shown as part of the Federal Republic of Yugoslavia on the map until its declaration of independence on 17 February 2008, which Serbia and a number of other states do not recognise. The UN administration of 1999–2008 is drawn as an area.
  - Places are named in their Serbian form, with the Albanian form where it is often used in English, as in Račak (Reçak), Orahovac (Rahovec), Peć (Peja), Đakovica (Gjakova) and Priština (Prishtina).
  - The NATO bombing had no UN Security Council mandate, and whether it was lawful is still disputed; an independent international commission chaired by Richard Goldstone called it “illegal but legitimate” in 2000. Serbian and Kosovo Albanian accounts of the war differ sharply, above all on the KLA, which Belgrade called a terrorist organisation.
  - Casualty figures are uncertain. The Kosovo Memory Book, a name-by-name count by the Humanitarian Law Center, lists 13,535 people killed or missing from January 1998 to December 2000, among them 10,812 Albanians, 2,197 Serbs and 526 Roma, Bosniaks, Montenegrins and others. Human Rights Watch counted about 490–530 civilians killed by NATO strikes; the Yugoslav government gave much higher figures.
