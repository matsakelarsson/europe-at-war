  - title: Račak and Rambouillet
    date: December 1998 – March 1999
    when: "1999-01-15"
    borders: "1999-03-20"
    countries: [xk, rs]
    body:
      - On 14 December 1998 gunmen killed six Serb teenagers in a café in Peć; no one was ever convicted. On 15 January 1999, after the KLA had killed several policemen nearby, Serbian police attacked the village of Račak, and the next day verifiers found the bodies of 45 Albanians, among them a woman and a 12-year-old boy. The head of the verification mission, William Walker, called it a massacre of civilians. Belgrade said the dead were KLA fighters killed in combat and ordered him out of the country. A Finnish forensic team found no evidence that the victims were anything other than unarmed civilians, but Serbian accounts still dispute what happened, and Račak became a turning point in Western policy.
      - The Contact Group of the great powers summoned both sides to the château of Rambouillet, near Paris, on 6 February. The draft agreement offered Kosovo broad autonomy within Yugoslavia for three years, guarded by a NATO-led force of about 30,000, with an appendix giving NATO troops free movement throughout Yugoslavia. The Kosovo Albanian delegation, led by the KLA’s Hashim Thaçi, signed it in Paris on 18 March; the Yugoslav and Serbian delegation refused any foreign troops. Yugoslav forces were already massing around Kosovo, and on 20 March the verifiers withdrew.
    facts:
      - [Račak, "15 January 1999, 45 Albanians killed"]
      - [Rambouillet talks, "6–23 February 1999, resumed in Paris 15–18 March"]
      - [Verifiers withdraw, "20 March 1999"]
