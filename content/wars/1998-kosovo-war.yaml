  - title: UNMIK and the flight of Serbs and Roma
    date: 1999–2008
    when: "1999-06-21"
    borders: "2000-12-31"
    countries: [xk, rs]
    body:
      - Most of the Kosovo Albanian refugees came home within weeks, to burned villages and mined fields. As they returned, Serbs, Roma, Ashkali and other non-Albanians were attacked, their houses burned and Orthodox churches damaged, and about 200,000 of them fled, most to Serbia. On 23 July 1999 fourteen Serb farmers were shot dead while harvesting at Staro Gracko; the killers were never found. Serbs held on in enclaves guarded by KFOR and in the north, where Mitrovica was divided at the Ibar river. The Kosovo Memory Book counts 13,535 people killed or missing in 1998–2000, about four-fifths of them Albanians.
      - UNMIK governed Kosovo for almost nine years, the KLA became a civil emergency corps and its leaders went into politics, and some of its veterans fought on in the Preševo Valley and Macedonia. Riots in March 2004 killed 19 people and drove thousands of Serbs from their homes. After UN-led talks on Kosovo’s status failed, it declared independence on 17 February 2008, which Serbia rejects. The Hague tribunal convicted senior Yugoslav and Serbian officers of crimes against Kosovo Albanians; Milošević died in 2006 before his trial ended. In September 2026 a special court in The Hague convicted Thaçi and three other former KLA leaders of war crimes against detainees.
    facts:
      - [Non-Albanians who left Kosovo, "about 200,000"]
      - ["Killed or missing, 1998–2000", "13,535 (Kosovo Memory Book)"]
      - [Declaration of independence, "17 February 2008"]
