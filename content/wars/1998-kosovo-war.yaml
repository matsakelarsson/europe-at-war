  - title: The bombing and the expulsions
    date: 24 March – 10 June 1999
    when: "1999-03-24"
    borders: "1999-06-01"
    countries: [xk, rs, me, al, mk]
    move_names: { none: "Flight and deportation of Kosovo Albanians" }
    body:
      - On the night of 24 March NATO began Operation Allied Force, the first war in the alliance’s history, without a mandate from the UN Security Council, where Russia and China opposed it; NATO justified it as necessary to stop a humanitarian catastrophe. Over 78 days its aircraft and missiles struck air defences and troops, then bridges, factories, refineries, power stations and the state television building in Belgrade, where 16 staff were killed on 23 April. Strikes also hit a passenger train at Grdelica, refugee columns near Đakovica and at Koriša, and on 7 May the Chinese embassy, killing three. Human Rights Watch counted about 500 civilian dead. A US stealth bomber was shot down, but NATO lost no one in combat.
      - Within days of the first strikes, Yugoslav army, police and paramilitary units began driving Kosovo Albanians out of the province, emptying towns and villages, burning houses and taking identity papers at the borders; many were packed onto trains to the Macedonian border. By early June about 850,000 had fled or been deported to Albania, Macedonia and Montenegro, and hundreds of thousands more were hiding inside Kosovo. Mass killings took place at Bela Crkva and the Kruša villages, Suva Reka, Izbica and, on 27 April, Meja, where more than 300 men and boys were taken from a refugee column and shot. Many of the bodies were later found in mass graves near Belgrade.
      - Belgrade said people were fleeing NATO bombs and the fighting, but in 2009 the Yugoslav war crimes tribunal at The Hague convicted senior Yugoslav and Serbian commanders of deportation and murder as crimes against humanity. The rearmed KLA, meanwhile, fought Yugoslav troops along the Albanian border at Košare and Mount Paštrik. On 27 May the tribunal announced its indictment of Milošević for crimes in Kosovo.
    facts:
      - [Operation Allied Force, "24 March – 10 June 1999, 78 days"]
      - [Refugees from Kosovo, "about 850,000 by early June 1999"]
      - [Civilians killed by NATO strikes, "about 490–530 (Human Rights Watch)"]
