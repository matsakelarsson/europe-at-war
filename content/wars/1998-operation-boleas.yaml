id: operation-boleas
name: South African intervention in Lesotho (Operation Boleas)
start: "1998-09-22"
end: "1999-05"
tier: C
summary: "The military intervention by South Africa, later joined by Botswana, in Lesotho in September 1998, carried out in the name of the Southern African Development Community (SADC). In the elections of May 1998 the ruling Lesotho Congress for Democracy (LCD) of Prime Minister Pakalitha Mosisili won 79 of the 80 seats. The opposition parties called the vote rigged and their supporters besieged the royal palace in Maseru for weeks; a SADC commission under the South African judge Pius Langa found no evidence that the result had been falsified. In September junior officers of the Lesotho Defence Force mutinied, detained or forced out their commanders and sided with the protesters, and Mosisili’s government, fearing a coup, asked SADC for help. On 22 September 1998, with President Nelson Mandela abroad and Mangosuthu Buthelezi acting as president, about 600 South African troops crossed the border; more followed, and Botswana sent soldiers too. They met heavier resistance than expected at the Makoanyane barracks in Maseru and at the Katse dam of the Lesotho Highlands Water Project, which supplies water to South Africa’s industrial heartland, where 17 Lesotho soldiers were killed. In Maseru opposition supporters and others looted and burned much of the city centre, and towns such as Mafeteng and Mohale’s Hoek were also damaged. Eight to eleven South African soldiers were killed; estimates of the Basotho dead, soldiers and civilians, range from several dozen to well over a hundred. An agreement in October and November 1998 kept the LCD in government and set up an interim political authority of all the parties to prepare new elections, held in 2002 under a mixed electoral system. The last South African troops left in May 1999. South Africa and SADC called the operation a peace mission to prevent a coup; critics in Lesotho and South Africa called it an invasion to protect a friendly government and the water project."
