notes:
  - "Figures are disputed. South Africa’s count of its dead varies between sources from eight to eleven, and the Basotho dead were never fully counted; some families buried their dead without reporting them. The killing of 17 Lesotho soldiers at Katse, whose barracks South African paratroopers attacked by helicopter, has never been fully explained; lawyers for their families said the soldiers there were not rebels and fired only after being attacked."
