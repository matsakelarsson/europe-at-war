  - title: A country cut in three
    date: November 1998 – July 1999
    when: "1999-07-03"
    borders: "1999-07-10"
    countries: [cd, ug, rw, td, zw, ao]
    body:
      - In November 1998 Jean-Pierre Bemba, son of a rich Mobutist businessman, founded the Movement for the Liberation of the Congo (MLC) in Équateur with Ugandan backing. With the Ugandan army it took Gemena on 30 December and, after driving back Chadian and government forces, Mobutu’s old capital Gbadolite on 3 July 1999. In the east the RCD and Rwanda pushed into Kasai and Katanga, while Mai-Mai militias, local self-defence forces that rejected the Rwandan presence, and Rwandan Hutu fighters of the ex-FAR and Interahamwe fought them with Kinshasa’s support.
      - "The war became a contest for the Congo’s wealth. Zimbabwean officers and companies received mining concessions in Katanga and Kasai, Rwanda ran the coltan and cassiterite trade of the Kivus, and Ugandan officers traded gold, diamonds and timber from the north-east. Civilians suffered most: villages were burned in reprisal raids, rape was used as a weapon on a vast scale, and the collapse of health care and food supplies killed far more people than the fighting."
    facts:
