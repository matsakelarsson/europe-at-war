id: second-congo-war
name: Second Congo War
start: "1998-08-02"
end: "2003-07-18"
tier: A
summary: "The largest war in modern African history, sometimes called Africa’s World War, fought in the Democratic Republic of the Congo by nine African states and dozens of armed groups. In July 1998 President Laurent-Désiré Kabila ordered out the Rwandan troops who had brought him to power; on 2 August soldiers in Goma rebelled, and Rwanda and Uganda backed a new rebel movement, the Rally for Congolese Democracy (RCD), and flew troops across the country to Kitona in an attempt to take Kinshasa. Angola, Zimbabwe and Namibia, and for a time Chad, sent troops to save Kabila, and the war settled into a front of some 2,400 km dividing the country between the government, the RCD and Rwanda in the east, and Uganda and Jean-Pierre Bemba’s MLC in the north. All sides exploited the Congo’s diamonds, gold, timber and coltan. The Lusaka ceasefire of 1999 was widely broken, and Rwanda and Uganda fought each other at Kisangani. After Kabila was assassinated in January 2001, his son Joseph Kabila revived the peace process: the Pretoria and Luanda agreements of 2002 brought the withdrawal of Rwandan and Ugandan troops, and a transitional government took office in July 2003. Millions died, most of hunger and disease; how many is disputed: the International Rescue Committee estimated 5.4 million excess deaths for 1998–2007, a figure other researchers argue is far too high."
countries: [cd, rw, ug, bi, ao, zw, na, td]
