steps:
  - title: Kabila turns on his allies
    date: July – August 1998
    when: "1998-08-02"
    borders: "1998-08-12"
    countries: [cd, rw, ug]
    body:
      - Within a year of taking power, Laurent-Désiré Kabila had quarrelled with the Rwandan officers who ran his army and with the Congolese Tutsi in his government, who were widely resented as agents of a foreign power. On 13 July 1998 he dismissed his Rwandan chief of staff, James Kabarebe, and on 27 July he ordered all Rwandan troops out of the country. On 2 August the commander of the army’s 10th Brigade announced from Goma that the army had decided to remove Kabila. Rebel and Rwandan troops took Goma and Bukavu within days, and on 12 August the rebels, Tutsi officers, former Mobutu officials and Kabila’s former allies, formed the Rally for Congolese Democracy (RCD).
      - On 4 August, in one of the boldest operations in African military history, Kabarebe flew Rwandan and Ugandan troops in hijacked airliners some 2,000 km from Goma to the Kitona base on the Atlantic coast. Joined by former Mobutu soldiers held at Kitona, they took the ports of Banana and Moanda and the town of Matadi, and seized the Inga dams, cutting power to Kinshasa on 11 August. In Kinshasa, Kabila’s government called on people to defend themselves, and mobs killed Tutsi and people taken for Tutsi.
    facts:
      - [Kabila orders Rwandan troops out, "27 July 1998"]
      - [Rebellion announced in Goma, "2 August 1998"]
      - [Kitona airlift, "4 August 1998"]
      - [RCD formed, "12 August 1998"]
