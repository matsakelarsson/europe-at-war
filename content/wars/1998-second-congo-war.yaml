  - title: Angola and Zimbabwe save Kabila
    date: August – December 1998
    when: "1998-08-23"
    borders: "1998-12-30"
    countries: [cd, ao, zw, na, rw, ug, td]
    body:
      - A summit of the Southern African Development Community in Harare on 19 August, against South Africa’s objections, backed military help for Kabila. Zimbabwean troops began landing in Kinshasa on 20 August, and on 22 August Angolan armoured columns and aircraft crossed from Cabinda and Angola into Bas-Congo, retaking Kitona, Matadi and the Inga dams. By the end of August the attackers in the west had been killed, captured or scattered, some escaping into Angola with UNITA’s help. Namibia also sent troops.
      - In the east the war went the rebels’ way. The RCD and the Rwandan army took Kisangani on 23 August, and Uganda sent its army in, claiming it needed to secure its border against Ugandan rebels and Sudan. Rwandan and RCD forces killed hundreds of civilians at Kasika in South Kivu on 24 August, and more at Makobola at the turn of the year. By December they had taken Kindu and advanced into northern Katanga, where Zimbabwean, Congolese and Rwandan Hutu forces fought them at Kabalo; Chad and Sudan sent troops to the north to stop Uganda.
    facts:
      - [SADC summit backs Kabila, "19 August 1998"]
      - [Zimbabwean troops reach Kinshasa, "20 August 1998"]
      - [Angolan forces enter Bas-Congo, "22 August 1998"]
      - [RCD and Rwandans take Kisangani, "23 August 1998"]
