  - title: Lusaka and the battles for Kisangani
    date: July 1999 – December 2000
    when: "2000-06-05"
    borders: "2000-06-10"
    countries: [cd, rw, ug, zm, zw, na]
    body:
      - At Lusaka the six states at war signed a ceasefire on 10 July 1999; the MLC signed on 1 August and the RCD on 31 August. It called for a national dialogue, the disarmament of the armed groups and the withdrawal of foreign armies under a UN force, and the UN Security Council created the UN mission (MONUC) in November 1999. But fighting went on, the rebel movements split, and Rwanda and Uganda fell out over Kisangani and its diamonds. The RCD divided into the Rwandan-backed RCD-Goma and the Ugandan-backed RCD-Kisangani/ML of Ernest Wamba dia Wamba, and Uganda’s backing of rival factions in Ituri set off the war there.
      - "The Rwandan and Ugandan armies fought each other in Kisangani in August 1999, in May 2000 and, on a larger scale, from 5 to 10 June 2000, when their shells killed hundreds of the city’s civilians and wounded thousands. Elsewhere the front still moved: the MLC and Uganda pushed back a government offensive in Équateur, a Zimbabwean and Namibian garrison was besieged at Ikela, and in December 2000 the Rwandans took Pweto near the Zambian border, sending Congolese and Zimbabwean troops fleeing into Zambia."
    facts:
      - [Lusaka Ceasefire Agreement, "10 July 1999"]
      - [MONUC created, "30 November 1999"]
      - [Six-Day War in Kisangani, "5–10 June 2000"]
      - [Rwandans take Pweto, "December 2000"]
