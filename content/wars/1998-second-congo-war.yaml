  - title: Kabila’s death and the road to peace
    date: January 2001 – July 2003
    when: "2002-07-30"
    borders: "2003-07-18"
    countries: [cd, rw, ug, za, ao]
    body:
      - On 16 January 2001 Laurent-Désiré Kabila was shot dead in his palace in Kinshasa by one of his bodyguards; the motives and the people behind the killing have never been fully established. His 29-year-old son Joseph Kabila succeeded him, let the UN deploy observers and accepted the inter-Congolese dialogue. Talks between the government, the rebels, the opposition and civil society at Sun City in South Africa (February–April 2002) produced only a partial deal with the MLC, and in May 2002 RCD-Goma troops killed more than 150 people in Kisangani after a mutiny.
      - "Under South African and American pressure, Kabila and Rwanda’s president Paul Kagame signed the Pretoria Accord on 30 July 2002: Rwanda would withdraw its troops, and the Congo would disarm and repatriate the Rwandan Hutu fighters on its soil. By October more than 20,000 Rwandan soldiers had left. The Luanda Agreement of 6 September 2002 provided for Uganda’s withdrawal, and Zimbabwe, Angola and Namibia also pulled out. The Global and All-Inclusive Agreement, signed in Pretoria on 17 December 2002, created a transitional government with Kabila as president and four vice-presidents, among them Bemba and the RCD-Goma leader Azarias Ruberwa. It took office on 30 June 2003, and on 18 July the Congolese flag was raised again in Goma. Fighting continued in Ituri and the Kivus."
    facts:
      - [Laurent-Désiré Kabila assassinated, "16 January 2001"]
      - [Pretoria Accord, "30 July 2002"]
      - [Luanda Agreement, "6 September 2002"]
      - [Global and All-Inclusive Agreement, "17 December 2002"]
      - [Transitional government takes office, "30 June 2003"]
