notes:
  - "The death toll is disputed. Surveys by the International Rescue Committee estimated 5.4 million excess deaths from August 1998 to April 2007, most from disease and malnutrition rather than violence, making it the deadliest conflict since the Second World War. The Human Security Report Project argued in 2010 that the surveys assumed too low a pre-war death rate and drew too heavily on the worst-hit areas, and that excess deaths for 2001–2007 were less than a third of the IRC’s figure for those years; the IRC replied that the true figure could lie between 3 and 7.6 million. Both agree that the great majority of deaths were not from fighting."
  - "A UN panel of experts reported in 2001–2002 on the systematic plunder of the Congo’s minerals, timber and other resources by the armies of Rwanda, Uganda and Zimbabwe, by rebel movements and by officials in Kinshasa. The UN Mapping Report of 2010 documented massacres, mass rape and other crimes by nearly all the armed forces and groups."
  - "Sudan was reported to have helped Kabila in 1998–1999, and Libya, Eritrea and others were involved diplomatically; Burundi’s army fought mainly against Burundian Hutu rebels based in the Congo. The Ituri conflict, which grew out of the war, is told separately."
