id: batken-conflict
name: Batken conflict
start: "1999-07-30"
end: "1999-10-25"
tier: C
summary: An incursion by the Islamic Movement of Uzbekistan (IMU), an armed group seeking to overthrow Uzbekistan’s government, into the Batken region of southern Kyrgyzstan. In August 1999 several hundred IMU fighters, based in the mountains of Tajikistan since the end of the Tajik civil war, crossed into Kyrgyzstan, apparently aiming to reach Uzbekistan’s part of the Fergana Valley, and occupied villages in the mountains around Batken. They took hostages, among them a Kyrgyz general, Anarbek Shamkeev, and, on 22–23 August, four Japanese geologists and their interpreter. Kyrgyz troops, with Uzbek air strikes, some of which hit villages in Tajikistan, fought the militants through September; the IMU fighters withdrew to Tajikistan, and the Japanese hostages were freed on 25 October, reportedly after a ransom was paid. Between about 20 and 30 Kyrgyz soldiers were killed; claims of militant losses vary widely. The IMU made a larger incursion into Uzbekistan and Kyrgyzstan in 2000 before many of its fighters moved to Afghanistan.
