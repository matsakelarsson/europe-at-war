notes:
  - The UÇPMB wanted the three municipalities, which have large Albanian populations (a majority in Preševo and Bujanovac), joined to Kosovo; Belgrade called it a terrorist group. Casualty and strength figures vary between sources, and the date of the Končulj agreement is given as both 20 and 21 May 2001.
  - Many former UÇPMB fighters went on to join the National Liberation Army in the 2001 insurgency in Macedonia. Low-level incidents continued in the valley for years afterwards.
