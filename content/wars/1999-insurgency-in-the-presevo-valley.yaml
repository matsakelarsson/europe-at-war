id: insurgency-in-the-presevo-valley
name: Insurgency in the Preševo Valley
start: "1999-06-12"
end: "2001-06-01"
tier: C
summary: An ethnic Albanian insurgency in the municipalities of Preševo, Bujanovac and Medveđa in southern Serbia, on the border of Kosovo, after the Kosovo War. The Liberation Army of Preševo, Medveđa and Bujanovac (UÇPMB), many of whose fighters came from the disbanded Kosovo Liberation Army, attacked Serbian police from the 5-kilometre Ground Safety Zone along the boundary, where the Kumanovo Agreement allowed Yugoslav forces to carry only light arms. After the fall of Slobodan Milošević in October 2000, Belgrade offered the Čović plan of amnesty, Albanian recruits for the police and economic development, and NATO let the Yugoslav Army return to the zone sector by sector from March 2001. Under the Končulj agreement of May 2001 the UÇPMB disarmed and disbanded; some 400 fighters gave themselves up to KFOR, and by 1 June the army held the whole zone. Fewer than a hundred people were killed, among them about 18 Serbian police and soldiers and 15 civilians.
countries: [rs, xk]
