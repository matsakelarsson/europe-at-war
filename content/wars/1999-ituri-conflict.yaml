id: ituri-conflict
name: Ituri conflict
start: "1999-06"
end: ongoing
tier: C
summary: "Last updated 27 November 2026. A conflict in the Ituri region of north-eastern DR Congo, rooted in disputes over land and local power between the mainly pastoralist Hema and the mainly farming Lendu, which became a war during the Second Congo War. In June 1999 the Ugandan army, which occupied the region, made Ituri a province under a Hema governor; Ugandan officers and traders took sides, and fighting between Hema and Lendu spread. Ethnic militias, among them Thomas Lubanga’s Hema UPC, the Lendu FNI, the Ngiti FRPI and PUSIC, backed at different times by Uganda, Rwanda and Kinshasa, fought over Bunia and the gold mines and committed massacres such as Nyankunde in 2002 and Bogoro and Drodro in 2003. When the Ugandan army withdrew in May 2003 and fighting engulfed Bunia, the European Union sent a French-led force (Operation Artemis, June to September 2003) before handing over to the UN mission. Most militias were disarmed by 2007, and in 2012 Lubanga became the first person convicted by the International Criminal Court. Estimates of the dead for 1999–2006 range from more than 50,000 to about 60,000, and some 500,000 people were displaced. From December 2017 violence returned: CODECO, an armed political-religious movement drawn from the Lendu, attacked Hema villages and displacement camps, among them Plaine Savo in 2022 and Djaiba in February 2025, and Hema militias formed in response. In 2025 Uganda sent troops to fight CODECO, and Lubanga, released in 2020, founded a new armed group, the Convention for the Popular Revolution (CRP). In late April 2026 CODECO attacks, in reprisal for a CRP attack, killed at least 69 people, among them militiamen and soldiers; on 23 November the CRP took Iga-Barrière, some 25 km north of Bunia, and on 24 November announced that it would halt its advance and withdraw, citing talks mediated by Uganda."
