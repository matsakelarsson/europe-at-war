notes:
  - "Whether the Ituri conflict is one war is debated. Hema and Lendu had clashed over land as early as 1972, and many accounts limit the name to the war of 1999–2003; others treat the violence since 2017 as a new war, or as a continuation, since the same land disputes, militias’ successors and leaders such as Lubanga are involved. Uganda’s role is disputed in both phases: in 1999–2003 its officers armed different militias and its army was accused of plundering Ituri’s gold, and in 2025 some Lendu saw its deployment against CODECO as a return of the occupation."
  - The war around Beni and in southern Ituri waged by the Allied Democratic Forces (ADF) is told separately.
