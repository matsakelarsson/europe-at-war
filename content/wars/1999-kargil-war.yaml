  - title: Operation Vijay and the air war
    date: late May – early June 1999
    when: "1999-05-26"
    borders: "1999-05-26"
    countries: [in, pk]
    body:
      - "India launched Operation Vijay to clear the intrusion, moving in two divisions and large numbers of guns, and on 26 May its air force began air strikes, Operation Safed Sagar, the first use of air power in Kashmir since 1971. It soon learned how dangerous the mountains were: on 27 May a MiG-27 went down with engine trouble and a MiG-21 was shot down by a shoulder-fired missile while searching for it; the MiG-27 pilot was captured and the MiG-21 pilot killed. On 28 May a Mi-17 helicopter was shot down near Tololing with its crew of four. The air force switched to Mirage 2000s bombing from higher altitudes, some with laser-guided bombs, and hit Pakistani supply camps."
      - "On the ground, Indian infantry had to climb steep, bare slopes at 4,000 to 5,500 metres, often at night, against men dug in on the crests above them. The first attacks in Dras and Batalik failed with heavy losses. India kept its troops and aircraft on its own side of the Line of Control, a restraint that won it international support, while its navy moved ships towards the Pakistani coast."
    facts:
      - [Operation Safed Sagar, "from 26 May 1999"]
      - [Aircraft lost, "MiG-27 and MiG-21 on 27 May, Mi-17 on 28 May"]
