id: kargil-war
name: Kargil War
start: "1999-05-03"
end: "1999-07-26"
tier: A
summary: "A war between India and Pakistan in the Kargil district of Ladakh, then part of the Indian state of Jammu and Kashmir, the first fought between two nuclear-armed states. Over the winter of 1998–1999 Pakistani soldiers of the Northern Light Infantry, presented by Pakistan at first as Kashmiri fighters, crossed the Line of Control and occupied heights overlooking the Srinagar–Leh road. After the intrusion was discovered in May 1999, India drove them back in costly mountain assaults supported by air strikes, retaking Tololing, Tiger Hill and most other positions. Under American and international pressure Prime Minister Nawaz Sharif agreed on 4 July to withdraw, and India declared its operation complete on 26 July. India put its dead at 527 and Pakistan at 453; other estimates of Pakistan’s losses are higher. The war contributed to the military coup that overthrew Sharif in October 1999."
countries: [in, pk]
sides:
  - id: in
    name: India
    polities: [india]
    ink: orange
    moves: Indian moves
    success: Indian success
  - id: pk
    name: Pakistan
    polities: [pakistan]
    ink: green
    moves: Pakistani moves
    success: Pakistani success
notes:
  - "Pakistan at first said that the men on the heights were Kashmiri mujahideen and that its army was not involved. Captured documents, the bodies of soldiers, and later statements by Pakistani leaders, including Pervez Musharraf’s memoir of 2006, showed that the force was made up mainly of Northern Light Infantry battalions, with some special forces and irregulars."
  - "Casualty figures: India’s official figure is 527 killed and about 1,360 wounded. Pakistan’s official figure is 453 killed; Indian estimates, and some later Pakistani statements, put its losses considerably higher."
  - The Line of Control is the ceasefire line of 1949, adjusted in 1972; it is not an international border. The base map shows the territory each state administers; the positions occupied in 1999 are drawn as areas and are approximate.
