  - title: Tololing and the Dras heights
    date: June 1999
    when: "1999-06-13"
    borders: "1999-06-13"
    countries: [in, pk]
    body:
      - "The key was Tololing, a ridge east of Dras from which Pakistani observers could watch every vehicle on the highway. Attacks by 18 Grenadiers from late May failed with heavy losses. On the night of 12–13 June 2 Rajputana Rifles, under massive artillery cover, took the ridge after hand-to-hand fighting, the first major Indian victory of the war. The nearby Hump and Point 4590 followed."
      - "Massed Indian artillery, including Bofors howitzers firing directly at the peaks, made the difference in the battles that followed. On 20 June 13 Jammu and Kashmir Rifles took Point 5140 above Tololing; its young company commander, Captain Vikram Batra, radioed the success with a soft-drink slogan, “Yeh dil maange more” (“This heart wants more”), which made him famous. Diplomatic pressure on Pakistan grew: the United States and the G8 called on it to restore the Line of Control."
    facts:
      - [Tololing taken, "13 June 1999"]
      - [Point 5140 taken, "20 June 1999"]
    markers:
