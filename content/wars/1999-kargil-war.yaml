        side: in
        name: Tololing
        date: 12–13 June 1999
        text: Taken by 2 Rajputana Rifles after three weeks of failed assaults. Point 5140, on the ridge above, fell on 20 June.
        lonlat: [75.795, 34.471]
      - kind: event
        side: in
