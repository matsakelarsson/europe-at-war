steps:
  - title: The bus to Lahore, and the intrusion
    date: February – May 1999
    when: "1999-05-03"
    borders: "1999-05-03"
    countries: [in, pk]
    body:
      - "India and then Pakistan tested nuclear weapons in May 1998. In February 1999 the Indian prime minister, Atal Bihari Vajpayee, rode the first bus service from Delhi to Lahore, and on 21 February he and Nawaz Sharif signed the Lahore Declaration, in which both promised to settle their disputes, Kashmir among them, by peaceful means. By then, however, Pakistani troops had begun to cross the Line of Control in the Kargil district, where the Indian army withdrew from many high posts during the winter."
      - "Several battalions of the Northern Light Infantry, then a paramilitary force recruited in the Northern Areas (Gilgit-Baltistan), with some special forces and irregulars, occupied well over a hundred positions on the ridges along about 150 km of the line, from the Mushkoh valley west of Dras to Batalik and Turtuk. From there their artillery observers could direct fire onto the only road from Srinagar to Leh. The plan was drawn up by the army chief, General Pervez Musharraf, and a few senior generals; how much Sharif knew of it beforehand is disputed."
      - "Local shepherds reported armed men on the heights near Batalik at the beginning of May. A patrol led by Captain Saurabh Kalia with five soldiers, which went out on 15 May, was captured; their bodies, returned in June, bore marks of torture, which Pakistan denied. Only after several more patrols were ambushed did the Indian army realise the scale of the intrusion. Pakistani shelling set off the army’s ammunition dump at Kargil on 9 May."
    facts:
      - [Lahore Declaration, "21 February 1999"]
