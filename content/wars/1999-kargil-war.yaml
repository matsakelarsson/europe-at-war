  - title: Washington and the withdrawal
    date: July – October 1999
    when: "1999-07-26"
    borders: "1999-07-26"
    countries: [in, pk]
    body:
      - "With his troops losing ground and almost no international backing, even from China, Nawaz Sharif flew to Washington and met President Bill Clinton at Blair House on 4 July. According to Clinton’s adviser Bruce Riedel, Clinton warned him of the danger of nuclear escalation and refused to mediate on Kashmir. Sharif agreed to take steps to restore the Line of Control. The Pakistani forces began to withdraw around 11 July; India attacked the posts that were not vacated, and on 26 July declared Operation Vijay complete, a date it marks as Kargil Vijay Diwas."
      - "India’s official toll was 527 dead; Pakistan acknowledged 453. In India the Kargil Review Committee criticised the failure of intelligence to detect the intrusion, and the army kept troops on the heights through the winter from then on. In Pakistan the war deepened the rift between Sharif and Musharraf, who blamed each other for it; on 12 October 1999, when Sharif tried to dismiss him, the army overthrew the government and Musharraf took power. The Northern Light Infantry was made a regular regiment of the Pakistan Army."
    facts:
      - [Clinton–Sharif meeting, "Washington, 4 July 1999"]
      - [Operation Vijay declared complete, "26 July 1999"]
      - [Dead, "India 527, Pakistan 453 (official figures)"]
      - [Military coup in Pakistan, "12 October 1999"]
    markers:
