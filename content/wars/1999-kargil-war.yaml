  - title: Tiger Hill and Batalik
    date: late June – 7 July 1999
    when: "1999-07-04"
    borders: "1999-07-04"
    countries: [in, pk]
    body:
      - "Tiger Hill, a peak of more than 5,000 metres west of Dras, was the highest point overlooking the road. After air strikes and days of shelling, 18 Grenadiers climbed its sheer north-eastern face while 8 Sikh attacked from the west, and the summit was taken early on 4 July; Grenadier Yogendra Singh Yadav, who led the climb though badly wounded, received India’s highest award for gallantry, the Param Vir Chakra. Pakistani counter-attacks failed. Captain Karnal Sher Khan of the Northern Light Infantry was killed in one of them and received Pakistan’s highest award, the Nishan-e-Haider, as did Havildar Lalak Jan, killed in the same days."
      - "In the Mushkoh valley Point 4875 was taken on 7 July; Captain Vikram Batra was killed there and awarded the Param Vir Chakra after his death. In the Batalik sector, where Indian troops had been fighting since May, 1/11 Gorkha Rifles took the Khalubar ridge on 3 July; its platoon leader, Lieutenant Manoj Kumar Pandey, was killed in the assault and also received the Param Vir Chakra. By then most of the heights were back in Indian hands."
    facts:
      - [Khalubar taken, "3 July 1999"]
      - [Tiger Hill taken, "4 July 1999"]
      - [Point 4875 taken, "7 July 1999"]
