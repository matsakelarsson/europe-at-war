id: maluku-sectarian-conflict
name: Sectarian conflict in Maluku
start: "1999-01-19"
end: "2002-02"
tier: C
summary: "The fighting between Christians and Muslims in the Maluku Islands of eastern Indonesia after the fall of Suharto. On 19 January 1999, the day of Idul Fitri, a quarrel between a Christian bus driver and a Muslim youth at the Batu Merah terminal in Ambon turned into riots between the city’s Christian and Muslim quarters, and the violence spread to Seram, Haruku, Saparua, Buru and the Kei Islands. Behind it lay old balances upset by the crisis of 1997–1998: competition for jobs and posts, the arrival of Muslim migrants from Sulawesi, and rivalries within the security forces, parts of which were accused of taking sides. In North Maluku, made a separate province in 1999, a land dispute at Malifut in August 1999 began a cycle of killings in Halmahera; at the end of December 1999 hundreds of Muslims were killed in and around Tobelo, and Christians were killed in Galela in reprisal. From April–May 2000 several thousand fighters of Laskar Jihad, a militia founded in Java by Ja’far Umar Thalib, arrived in Ambon despite the government’s ban and joined attacks on Christian villages; Christian militias fought back. President Abdurrahman Wahid declared a civil emergency in June 2000. Talks brokered by the minister Jusuf Kalla led to the Malino II agreement of February 2002, after which the fighting died down, though bombings and riots recurred, notably in Ambon in April 2004; Laskar Jihad disbanded in October 2002. Estimates of the dead range from about 5,000 to 10,000, and up to 700,000 people were displaced. In Poso in Central Sulawesi a related conflict between Christians and Muslims (December 1998 – December 2001) killed an estimated 1,000–2,500 people, among them many Muslims massacred at the Walisongo boarding school in May 2000; it was ended by the Malino I declaration of 20 December 2001, but small Islamist armed groups remained active around Poso for years."
