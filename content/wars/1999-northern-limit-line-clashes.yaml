steps:
  - title: The battles of Yeonpyeong, 1999 and 2002
    date: June 1999 – June 2002
    when: "1999-06-15"
    borders: "1999-06-15"
    countries: [kr, kp]
    body:
      - The armistice of 1953 left the five islands off the Hwanghae coast to the UN Command but fixed no line at sea, and on 30 August 1953 the UN Command drew the Northern Limit Line between the islands and the North Korean shore. North Korea began to contest it in 1973. Every June, in the crab season, North Korean fishing boats and their patrol boats crossed the line, and South Korean patrol boats pushed them back by ramming.
      - In June 1999 North Korean patrol boats crossed the line west of Yeonpyeong day after day. On 15 June they opened fire on the South Korean boats trying to push them back, and in the exchange that followed a North Korean torpedo boat was sunk and several patrol boats badly damaged; South Korea estimated 17–30 North Koreans killed, and nine South Koreans were wounded. On 29 June 2002, during the football World Cup held in South Korea and Japan, a North Korean patrol boat crossed the line and opened fire at close range on the South Korean patrol boat Chamsuri 357, killing its captain. In the battle that followed the Chamsuri sank and six South Korean sailors died; South Korea estimated 13 North Koreans killed. North Korea blamed the South for both clashes.
    facts:
      - [Northern Limit Line drawn, "30 August 1953"]
      - [First battle of Yeonpyeong, "15 June 1999"]
      - [Second battle of Yeonpyeong, "29 June 2002"]
      - [Dead, "1999 – 17–30 North Koreans (South Korean estimate); 2002 – 6 South Koreans and about 13 North Koreans"]
