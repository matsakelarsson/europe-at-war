id: northern-limit-line-clashes
name: Northern Limit Line clashes
start: "1999-06-09"
end: "2010-11-23"
tier: B
summary: "A series of armed clashes between North and South Korea in the Yellow Sea (West Sea) along the Northern Limit Line (NLL), the sea boundary that the UN Command drew after the armistice of 1953 and that North Korea does not recognise. The line keeps five islands off the North Korean coast, among them Baengnyeong and Yeonpyeong, under South Korean control, and runs through rich crab grounds. Naval battles near Yeonpyeong in June 1999 and June 2002, both fought when North Korean patrol boats crossed the line with fishing boats, cost a North Korean torpedo boat and a South Korean patrol boat and dozens of lives, and a further clash followed near Daecheong in November 2009. On 26 March 2010 the South Korean corvette Cheonan broke in two and sank near Baengnyeong with the loss of 46 sailors; an international investigation led by South Korea blamed a North Korean torpedo, which North Korea denies. On 23 November 2010 North Korean artillery shelled Yeonpyeong Island, killing two marines and two civilians, the first attack on South Korean civilians on land since the Korean War."
countries: [kr, kp]
