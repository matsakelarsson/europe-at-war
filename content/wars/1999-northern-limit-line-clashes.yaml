notes:
  - "The status of the line is disputed. South Korea and the UN Command hold that the NLL, drawn on 30 August 1953 when the armistice failed to fix a sea boundary and observed by both sides for two decades, is the de facto maritime border, and point to the 1991 Basic Agreement between the two Koreas, which kept the areas each side then controlled until a new line was agreed. North Korea says that the line was drawn unilaterally, was never part of the armistice and cuts it off from its own 12-mile territorial waters; it has disputed the line since 1973 and in 1999 declared a “West Sea Military Demarcation Line” farther south. American documents of the 1970s show that the United States also doubted that the line had a basis in international law."
  - The figures for North Korean losses are South Korean estimates; North Korea has published none.
