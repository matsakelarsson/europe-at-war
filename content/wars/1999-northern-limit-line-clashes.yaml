  - title: The shelling of Yeonpyeong
    date: 23 November 2010
    when: "2010-11-23"
    borders: "2010-11-23"
    countries: [kr, kp]
    body:
      - On the afternoon of 23 November 2010, after South Korean marines on Yeonpyeong had held a firing exercise into waters the North claims, North Korean artillery on the coast fired some 170 shells and rockets at the island, about 80 of which struck it. Two marines and two civilian construction workers were killed and houses in the village burned. South Korean guns on the island fired back at the North Korean batteries. North Korea said it had answered a provocation and shells fired into its waters; South Korea and its allies called it an unprovoked attack on civilians. Most of the island’s 1,700 inhabitants left for the mainland.
      - South Korea reinforced the islands and loosened its rules of engagement, and there were no further deadly clashes. In the military agreement of 19 September 2018 the two sides set up a buffer zone at sea in which artillery drills were banned, but the agreement collapsed in 2023–2024, when North Korea fired artillery near the islands again and Kim Jong-un called for its southern sea border to be redrawn. The dispute remains unresolved.
