  - title: Daecheong and the Cheonan
    date: November 2009 – 2010
    when: "2010-03-26"
    borders: "2010-03-26"
    countries: [kr, kp]
    body:
      - On 10 November 2009 a North Korean patrol boat crossed the line near Daecheong Island and exchanged fire with South Korean ships; the North Korean boat withdrew in flames, while the South Koreans reported no casualties. At 9.22 p.m. on 26 March 2010 the South Korean corvette Cheonan, on patrol south-west of Baengnyeong Island, was torn in two by an explosion and sank; 46 of its 104 sailors died.
      - On 20 May 2010 an investigation led by South Korea with experts from the United States, the United Kingdom, Canada, Australia and Sweden reported that a torpedo fired by a North Korean midget submarine had sunk the ship, citing parts of a torpedo recovered from the sea floor. North Korea denied any part in it, China called the evidence inconclusive, and a Russian team did not publish its findings; some researchers in South Korea and abroad questioned the investigation. South Korea cut almost all trade with the North. On 9 July the UN Security Council condemned the attack without naming who was responsible.
