steps:
  - title: Dagestan and the apartment bombings
    date: August – October 1999
    when: "1999-08-07"
    borders: "1999-10-01"
    countries: [ru]
    body:
      - After 1996 Chechnya, independent in all but name under President Aslan Maskhadov, slid into lawlessness, with kidnappings for ransom common, and radical Islamist commanders such as Shamil Basayev and the Saudi-born Ibn al-Khattab defied the government. On 7 August 1999 they led some 1,500–2,000 fighters into the mountains of neighbouring Dagestan and proclaimed an Islamic state there. Russian forces, under the new prime minister Vladimir Putin, drove them out by late August and then stormed the Islamist villages of Karamakhi and Chabanmakhi; a second incursion in September was also beaten back.
      - Between 4 and 16 September bombs destroyed apartment blocks in Buynaksk, Moscow and Volgodonsk, killing about 300 people. The government blamed Chechen militants, and Russian courts later convicted men linked to Khattab. But on 22 September residents in Ryazan found a bomb-like device in a basement, which the FSB, the security service, said was a training exercise, and some historians and journalists have accused the service of staging the bombings. Amid public anger Russian aircraft began bombing Chechnya, and on 1 October ground troops crossed the border.
    facts:
      - [Invasion of Dagestan, "7 August 1999"]
      - [Apartment bombings, "4–16 September 1999, about 300 killed"]
      - [Russian ground invasion, "1 October 1999"]
