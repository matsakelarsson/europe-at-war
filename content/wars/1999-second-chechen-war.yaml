  - title: The fall of Grozny
    date: October 1999 – June 2000
    when: "1999-10-01"
    borders: "2000-02-06"
    countries: [ru]
    body:
      - This time Russian commanders advanced slowly and relied on artillery and air power. By mid-October they held the plains north of the Terek, and by December they had surrounded Grozny, while hundreds of thousands of civilians fled, many of them to Ingushetia. The assault on the city, held by a few thousand fighters, began on 25 December. Bombardment flattened what was left of it after the first war, and estimates of the civilians killed in the siege run from about 5,000 to 8,000. In 2003 the United Nations called Grozny the most destroyed city on Earth.
      - At the end of January 2000 the main Chechen force broke out south-west through a minefield towards Alkhan-Kala, losing hundreds of men; Basayev lost a foot. Russia declared Grozny taken on 6 February, and the day before, Russian police killed at least 50 civilians in the Novye Aldi district. In the southern mountains Chechen fighters nearly wiped out a company of paratroopers on Height 776 near Ulus-Kert at the start of March. In May Putin imposed direct rule, and in June he appointed Akhmad Kadyrov, a former separatist mufti who had changed sides, to head the administration.
    facts:
      - [Battle of Grozny, "25 December 1999 – 6 February 2000"]
      - [Civilians killed in the siege, "about 5,000–8,000 (estimates)"]
      - [Akhmad Kadyrov appointed, "12 June 2000"]
    markers:
      - kind: battle
        side: ru
        name: Battle of Grozny
        date: 25 December 1999 – 6 February 2000
        text: Russian forces took the city after six weeks of street fighting and bombardment.
        lonlat: [45.699, 43.312]
      - kind: event
        name: Novye Aldi
        date: 5 February 2000
        text: Russian riot police went from house to house in this district of Grozny, shooting residents and looting.
        lonlat: [45.64, 43.29]
        lp: l
      - kind: event
        name: Ingushetia
        date: from October 1999
        text: Most refugees fled west into Ingushetia, where many lived in tent camps for years.
        lonlat: [44.767, 43.217]
      - kind: battle
        side: ich
        name: Height 776
        date: 29 February – 1 March 2000
        text: Fighters breaking out of the Argun Gorge overran a company of the 104th Guards Airborne Regiment; 84 paratroopers were killed.
        lonlat: [45.805, 42.963]
