  - title: Insurgency, Beslan and the end of the operation
    date: 2000–2009
    when: "2002-10-23"
    borders: "2009-04-16"
    countries: [ru]
    body:
      - The war turned into an insurgency of ambushes, assassinations and suicide bombings, met by sweeps of villages, filtration camps and thousands of enforced disappearances, documented by Human Rights Watch and the Russian group Memorial. Attacks reached Moscow, where in October 2002 gunmen took more than 800 people hostage in a theatre and about 130 hostages died, most of them from a gas pumped in by special forces. Moscow handed power to loyal Chechens. A new constitution was approved in March 2003, and Akhmad Kadyrov was elected president that October, but a bomb killed him in a Grozny stadium on 9 May 2004.
      - On 1 September 2004 a group sent by Basayev seized School No. 1 in Beslan, North Ossetia, with more than 1,100 hostages, most of them children and parents at the start of the school year. On the third day explosions in the gym set off a chaotic battle, and 334 hostages died, 186 of them children. Maskhadov was killed in March 2005 and Basayev in July 2006. Akhmad Kadyrov’s son Ramzan built up a powerful militia and became president in 2007, as the insurgency spread to Dagestan, Ingushetia and Kabardino-Balkaria. Russia formally ended its counter-terrorism operation in Chechnya on 16 April 2009.
    facts:
      - [Moscow theatre siege, "23–26 October 2002, about 130 hostages died"]
      - [Beslan school siege, "1–3 September 2004, 334 hostages killed, 186 of them children"]
      - [End of the counter-terrorism operation, "16 April 2009"]
    markers:
      - kind: event
        name: Beslan school siege
        date: 1–3 September 2004
        text: The deadliest of the attacks. Most hostages were held for three days in the school gym without water.
        lonlat: [44.55, 43.183]
      - kind: event
        name: Grozny
        date: 9 May 2004
        text: Akhmad Kadyrov was killed by a bomb under the VIP stand of the Dynamo stadium during the Victory Day parade.
        lonlat: [45.699, 43.312]
      - kind: event
        side: ru
        name: Tolstoy-Yurt
        date: 8 March 2005
        text: Aslan Maskhadov was killed in a bunker here by Russian special forces.
        lonlat: [45.777, 43.446]
      - kind: event
        side: ru
        name: Ekazhevo
        date: 10 July 2006
        text: Shamil Basayev was killed in an explosion near this Ingush village; Russia said its security service carried it out.
        lonlat: [44.819, 43.208]
        lp: l
      - kind: battle
        side: ru
        name: Nalchik
        date: 13 October 2005
        text: Insurgents attacked police and security buildings across the city and were beaten off; more than 100 people were killed, most of them attackers.
        lonlat: [43.617, 43.483]
    areas:
      - style: outline
        label: Chechnya
        atoms: [RU-CE]
