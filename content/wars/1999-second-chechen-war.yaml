id: second-chechen-war
name: Second Chechen War
start: "1999-08-07"
end: "2009-04-16"
tier: B
summary: A war that began when Chechnya-based Islamist fighters invaded Dagestan in August 1999 and deadly apartment bombings struck Russian cities. Russian forces reconquered Chechnya, destroying Grozny in the winter of 1999–2000, and then fought a long insurgency, marked by atrocities against civilians and by terrorist attacks such as the Beslan school siege, while power in Chechnya passed to the Kadyrov family. Russia ended its counter-terrorism operation in 2009.
countries: [ru]
sides:
  - id: ru
    name: Russia
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
  - id: ich
    name: Chechen separatists and Islamist fighters
    polities: [ichkeria]
    ink: purple
    moves: Separatist and Islamist moves
    success: Separatist and Islamist success
notes:
  - Chechnya is shown as part of Russia on the map, as it is internationally recognised.
  - Casualty figures are uncertain and disputed. Russia gives about 6,000 soldiers killed; Amnesty International estimated about 25,000 civilians killed and 5,000 missing, and other estimates are higher.
  - The cause of the 1999 apartment bombings remains disputed.
