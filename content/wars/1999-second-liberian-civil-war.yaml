steps:
  - title: LURD comes out of Guinea
    date: April 1999 – 2002
    when: "2000-07"
    borders: "2002-02-15"
    countries: [lr, gn]
    body:
      - Taylor ruled Liberia after 1997 as he had ruled “Greater Liberia”, through his own security forces and through the sale of timber and diamonds, much of it smuggled from Sierra Leone, where he backed the RUF. In April 1999 armed exiles attacked Voinjama in Lofa County from Guinea; by mid-2000 they had come together as Liberians United for Reconciliation and Democracy (LURD), drawn largely from former ULIMO fighters, Mandingo and Krahn, and backed by Guinea. Taylor’s forces and the RUF raided into Guinea in return.
      - "In 2001 the United Nations Security Council imposed an arms embargo, a ban on Liberian diamond exports and a travel ban on Taylor’s officials. LURD fought its way south through Lofa, and in February 2002, when its fighters reached Klay Junction, about 44 km from Monrovia, Taylor declared a state of emergency."
    facts:
      - [First attacks from Guinea, "April 1999"]
      - [UN sanctions on Liberian diamonds, "2001"]
      - [LURD at Klay Junction, "February 2002"]
