  - title: Taylor’s exile and the Accra agreement
    date: August – October 2003
    when: "2003-08-11"
    borders: "2003-08-18"
    countries: [lr, ng, us, gh]
    body:
      - "On 4 August 2003 the first Nigerian troops of a new ECOWAS force, ECOMIL, landed at Roberts International Airport, and American warships stood off the coast. On 11 August Taylor handed power to his vice-president, Moses Blah, and flew into exile in Calabar in Nigeria. On 14 August LURD withdrew from the port and Bushrod Island, which ECOMIL took over with a small force of American marines."
      - "On 18 August 2003 the government, LURD, MODEL and the political parties signed the Accra Comprehensive Peace Agreement, which set up a transitional government under the businessman Gyude Bryant, who took office on 14 October. The UN Security Council created the United Nations Mission in Liberia (UNMIL) on 19 September; it took over from ECOMIL on 1 October 2003, grew to some 15,000 troops and disarmed more than 100,000 fighters. Ellen Johnson Sirleaf won the election of 2005, becoming Africa’s first elected woman head of state. Taylor was handed over in 2006 to the Special Court for Sierra Leone, which convicted him in 2012."
    facts:
      - [ECOMIL lands, "4 August 2003"]
      - [Taylor resigns and leaves for Nigeria, "11 August 2003"]
      - [Accra Comprehensive Peace Agreement, "18 August 2003"]
      - [UNMIL takes over, "1 October 2003"]
