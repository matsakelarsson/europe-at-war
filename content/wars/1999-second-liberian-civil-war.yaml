id: second-liberian-civil-war
name: Second Liberian Civil War
start: "1999-04-21"
end: "2003-08-18"
tier: B
summary: "The war against President Charles Taylor’s government by two rebel movements, Liberians United for Reconciliation and Democracy (LURD), which attacked from Guinea from 1999, and the Movement for Democracy in Liberia (MODEL), which entered from Côte d’Ivoire in 2003. LURD fought its way through Lofa County to the outskirts of Monrovia by 2002, while United Nations sanctions punished Taylor for arming Sierra Leone’s RUF; in 2003 MODEL took the south-east and LURD besieged the capital in three assaults from June to August, killing hundreds of civilians with mortar fire. On 4 June 2003 the Special Court for Sierra Leone announced its indictment of Taylor for war crimes. A West African force, ECOMIL, landed in August; Taylor resigned on 11 August and went into exile in Nigeria, and the factions signed a comprehensive peace agreement at Accra on 18 August 2003. A United Nations mission, UNMIL, disarmed more than 100,000 fighters, and Ellen Johnson Sirleaf was elected president in 2005. About 50,000 people were killed in the war."
countries: [lr, gn, ci, ng, us]
sides:
  - id: gov
    name: Charles Taylor’s government (the AFL, the Anti-Terrorist Unit and militias)
    polities: [liberia]
    ink: red
    moves: Government moves
    success: Government success
  - id: lurd
    name: Liberians United for Reconciliation and Democracy (LURD)
    polities: [lurd]
    ink: purple
    moves: LURD moves
    success: LURD success
  - id: model
    name: Movement for Democracy in Liberia (MODEL)
    polities: [model]
    ink: brown
    moves: MODEL moves
    success: MODEL success
  - id: ecomil
    name: ECOWAS Mission in Liberia (ECOMIL), then the UN Mission in Liberia (UNMIL)
    polities: [ecomog, un-peacekeepers]
    ink: green
    moves: ECOMIL and UNMIL moves
    success: ECOMIL or UNMIL success
notes:
  - "Foreign backing. Guinea, whose border regions Taylor’s forces and the RUF had raided in 2000–2001, gave LURD bases and supplies; MODEL was backed by the government of Côte d’Ivoire, which accused Taylor of supporting rebels in its own civil war. Taylor’s forces included the Anti-Terrorist Unit, commanded by his son Chuckie Taylor, and former fighters of the RUF."
  - All sides used child soldiers and committed killings, rape and looting. Liberians named the three LURD assaults on Monrovia in June, July and August 2003 “World War I, II and III”. About 50,000 people are estimated to have been killed, and hundreds of thousands were displaced.
