  - title: MODEL and the siege of Monrovia
    date: March – August 2003
    when: "2003-06-04"
    borders: "2003-07-30"
    countries: [lr, ci, gn]
    body:
      - In early 2003 a second rebel movement, MODEL, mostly Krahn and backed by Côte d’Ivoire, crossed from the east, took Zwedru and pushed down to the coast, taking Greenville and, in July, the port of Buchanan. On 4 June 2003, as Taylor arrived for peace talks in Accra, the Special Court for Sierra Leone announced that it had indicted him for war crimes in Sierra Leone; Ghana let him fly home.
      - "LURD attacked Monrovia three times, in June, July and August 2003. Its fighters took Bushrod Island and the Freeport and fought government forces for the bridges into the city centre, while their mortar fire fell on crowded neighbourhoods and on displaced people sheltering near the American embassy, killing hundreds. Food and water ran out in the besieged city, and Liberians piled bodies outside the embassy to demand that the United States intervene."
