id: india-pakistan-standoff-2001
name: India–Pakistan standoff of 2001–2002
start: "2001-12-13"
end: "2002-10-16"
tier: C
summary: "The largest military confrontation between India and Pakistan since 1971, in which up to a million soldiers faced each other along the border and the Line of Control for ten months. On 13 December 2001 five gunmen attacked the Indian Parliament in New Delhi, killing nine people, most of them security staff, before they were killed. India blamed Lashkar-e-Taiba and Jaish-e-Mohammed, militant groups based in Pakistan, and demanded that Pakistan hand over suspects and shut them down; Pakistan condemned the attack and denied any role. India launched Operation Parakram, its largest mobilisation since 1971, moving some 500,000 troops to the border, and Pakistan answered in kind. Under American and British pressure, President Pervez Musharraf banned the two groups in January 2002, but the tension peaked again after gunmen killed 31 people, most of them soldiers’ wives and children, at an army camp at Kaluchak near Jammu on 14 May 2002. Fears of a war that could turn nuclear led many foreigners to leave both countries, until Pakistan promised to stop militants crossing into Indian-administered Kashmir and tensions eased in June. There was artillery fire across the Line of Control, but no war; India announced the end of its mobilisation on 16 October 2002. India said 798 of its soldiers died during the deployment, most in accidents and mine-laying."
