id: insurgency-in-macedonia-2001
name: 2001 insurgency in Macedonia
start: "2001-01-22"
end: "2001-08-13"
tier: B
summary: An armed conflict in the Republic of Macedonia (now North Macedonia) between the security forces and the National Liberation Army (NLA), an ethnic Albanian armed group whose ranks included veterans of the wars in Kosovo and the Preševo Valley. The NLA said it was fighting for equal rights for Albanians, about a quarter of the population; the government called it a terrorist group bent on secession. After fighting around Tetovo, Kumanovo and Skopje, the Ohrid Framework Agreement of 13 August 2001 promised Albanians wider rights in return for the NLA’s disarmament, which NATO oversaw. Some 150–250 people were killed and about 140,000 fled their homes, most of whom returned.
