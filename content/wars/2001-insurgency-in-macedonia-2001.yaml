  - title: The Ohrid Agreement and Essential Harvest
    date: July – November 2001
    when: "2001-07-05"
    borders: "2001-09-26"
    countries: [mk]
    body:
      - A ceasefire signed on 5 July and guaranteed by NATO held only in part. In late July fighting broke out again in and around Tetovo; on 8 August an NLA ambush at Karpalak killed ten soldiers, and on 10 August a landmine killed eight more near Ljuboten, north of Skopje. From 10 to 12 August police and irregulars attacked Ljuboten, an Albanian village; Human Rights Watch found that ten civilians were killed and more than 100 men arrested, many of them beaten in custody. The International Criminal Tribunal for the former Yugoslavia later sentenced a police officer, Johan Tarčulovski, to 12 years and acquitted the interior minister, Ljube Boškoski.
      - Talks at Ohrid, mediated by American and European envoys, ended on 13 August with the Ohrid Framework Agreement, signed by the leaders of the main Macedonian and Albanian parties. It promised more Albanians in the police and public service, official use of Albanian where Albanians made up more than a fifth of the population, more local self-government and changes to the constitution, in return for the NLA’s disarmament. In NATO’s Operation Essential Harvest, from 27 August to 26 September, several thousand troops collected nearly 4,000 weapons handed in by the NLA, which then announced that it had disbanded. Parliament adopted the constitutional amendments in November, and in 2002 Ahmeti founded a party, the Democratic Union for Integration.
    facts:
      - [Ceasefire, "5 July 2001"]
      - [Ohrid Framework Agreement, "13 August 2001"]
