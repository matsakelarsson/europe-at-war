notes:
  - The country was admitted to the UN in 1993 as “the former Yugoslav Republic of Macedonia” and has been called North Macedonia since 2019. The NLA was known in Albanian as the UÇK (Ushtria Çlirimtare Kombëtare), the same initials as the Kosovo Liberation Army. Places are named in their Macedonian form.
  - Whether the NLA aimed at equal rights within Macedonia, as its leaders said, or at secession and a union with Kosovo or Albania, as the government claimed, is still disputed. Casualty figures vary between sources; most give 63–77 dead among the security forces and 64–105 among the NLA, besides civilians.
