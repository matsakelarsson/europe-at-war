steps:
  - title: From Tearce to Aračinovo
    date: January – June 2001
    when: "2001-01-22"
    borders: "2001-06-25"
    countries: [mk, xk]
    body:
      - Albanians, about a quarter of the Republic of Macedonia’s people, had long complained of being second-class citizens. The constitution of 1991 called the state the national state of the Macedonian people, Macedonian was the only official language, and few Albanians served in the police or the army. On 22 January 2001 a new armed group, the National Liberation Army (NLA), led by Ali Ahmeti and drawing on veterans of the Kosovo Liberation Army and the Preševo Valley, attacked the police station at Tearce near Tetovo, killing a policeman. In February and March its fighters held Tanuševci, a village on the Kosovo border, until Macedonian forces drove them out.
      - In mid-March the NLA appeared on the hills above Tetovo, the largest Albanian town, and the army and police shelled the heights from 25 March until they declared the offensive over on 31 March. On 28 April an ambush at Vejce killed eight members of the security forces. From May the NLA held villages north of Kumanovo around Lipkovo, Vaksince and Slupčane, which the army shelled, and on 12 June it took Aračinovo, within reach of Skopje. Under a deal brokered by NATO some 350 fighters left on 25 June with their weapons, escorted by American troops; that night thousands of angry Macedonians stormed the parliament in Skopje.
