notes:
  - Casualty figures vary by source and method. The Costs of War project at Brown University estimated in 2021 that about 176,000 people were killed in Afghanistan, including 46,319 civilians, about 69,000 Afghan soldiers and police, and about 53,000 opposition fighters. About 2,450 US service members and some 1,150 soldiers of other coalition countries died. The UN mission (UNAMA), which counted civilian casualties systematically from 2009, attributed most of them to anti-government forces and a large minority to government and international forces.
  - The Taliban government of 1996–2001 was recognised by only three states; the UN seat stayed with the Islamic State of Afghanistan, whose forces formed the Northern Alliance. On the base map Afghanistan is one state throughout; zones of control are drawn in the steps and are approximate.
  - The insurgency was fought largely from sanctuaries in Pakistan, whose government was at the same time a US ally; Pakistan’s own war against the Pakistani Taliban is not covered here.
