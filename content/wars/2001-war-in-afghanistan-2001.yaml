steps:
  - title: The fall of the Taliban
    date: October – December 2001
    when: "2001-10-07"
    borders: "2001-12-07"
    countries: [af, us, pk]
    body:
      - After the attacks of 11 September 2001, in which al-Qaeda hijackers killed nearly 3,000 people in the United States, the Taliban refused to hand over Osama bin Laden without evidence and a trial in an Islamic country. On 7 October the United States and Britain began bombing Taliban and al-Qaeda targets. CIA officers and US special forces joined the commanders of the Northern Alliance, the coalition of mainly Tajik, Uzbek and Hazara factions that had fought the Taliban since 1996 and held only the north-east, directing US aircraft onto Taliban lines.
      - Mazar-i-Sharif fell to Abdul Rashid Dostum’s and Atta Muhammad Nur’s forces on 9 November, and the Taliban abandoned Kabul on the night of 12–13 November. Thousands of Taliban and foreign fighters surrendered at Kunduz on 24–26 November; a revolt by prisoners at the Qala-i-Jangi fortress was put down with US air strikes, and many prisoners later suffocated in sealed containers on the way to Sheberghan, an episode whose death toll is disputed. In the south, Hamid Karzai and Gul Agha Sherzai advanced on Kandahar, which the Taliban leader Mullah Mohammad Omar left on 7 December.
      - In the mountains of Tora Bora near the Pakistani border, Afghan militias backed by US bombing attacked al-Qaeda’s last stronghold in December, but bin Laden and many of his fighters escaped into Pakistan. On 5 December, at a conference in Bonn, Afghan factions agreed on an interim administration headed by Karzai, which took office on 22 December.
    facts:
