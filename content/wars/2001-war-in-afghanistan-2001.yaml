  - title: A new state, and the Taliban in Pakistan
    date: 2002–2005
    when: "2002-03-02"
    borders: "2004-10-09"
    countries: [af, us, pk]
    body:
      - In March 2002, in Operation Anaconda, US and Afghan troops attacked al-Qaeda and Taliban fighters gathered in the Shah-i-Kot valley in Paktia; the fighting in the snow-covered mountains was harder than expected, and many of the fighters slipped away. After that the war went quiet for some years. A UN-mandated International Security Assistance Force (ISAF) guarded Kabul from December 2001, under NATO command from August 2003, while some 10,000 US troops hunted al-Qaeda in the east.
      - A loya jirga chose Karzai as head of state in June 2002, a new constitution was adopted in January 2004, and Karzai won the first presidential election in October 2004. Millions of refugees returned and girls went back to school. But the United States turned its attention to Iraq, reconstruction lagged, warlords kept their militias, and the opium harvest grew to the largest in the world. The Taliban leadership regrouped in Quetta and in Pakistan’s tribal areas, and its fighters began to cross back into the southern and eastern provinces.
    facts:
      - [Operation Anaconda, "2–18 March 2002"]
      - [NATO takes command of ISAF, "11 August 2003"]
      - [Karzai elected president, "9 October 2004"]
    markers:
      - kind: battle
        side: coal
        name: Shah-i-Kot valley
        date: 2–18 March 2002
        text: The largest battle of the early war; eight US soldiers were killed, and estimates of the enemy dead vary from dozens to several hundred.
        lonlat: [69.33, 33.33]
      - kind: capital
        side: afg
        name: Kabul
        date: 2002–2005
        text: Seat of the new government, guarded by ISAF.
        lonlat: [69.17, 34.53]
        lp: l
      - kind: event
        side: tal
        name: Quetta
        date: from 2002
        text: The Taliban leadership council, known as the Quetta Shura, met here and in the surrounding refugee towns.
        lonlat: [67.00, 30.18]
  - title: The Taliban return
    date: 2006–2008
    when: "2006-07-31"
    borders: "2008-06-13"
    countries: [af, pk]
    body:
      - In 2006 ISAF took over the south from US forces, and British troops arrived in Helmand, Canadians in Kandahar and Dutch in Uruzgan, just as the Taliban launched their largest offensive since 2001. In September 2006 Canadian-led forces drove hundreds of Taliban fighters out of the Panjwayi district west of Kandahar in Operation Medusa. In Helmand small British garrisons were besieged in district centres such as Sangin and Musa Qala, which the Taliban held from February to December 2007.
      - The insurgents used roadside bombs and, increasingly, suicide attacks, which had been almost unknown in Afghanistan, and they set up shadow governments and courts in the villages. Air strikes that killed civilians, among them at Azizabad in Herat province in August 2008, where the UN found that about 90 civilians died, turned many Afghans against the foreign forces. By 2008 violence had spread from the south and east to provinces near Kabul.
