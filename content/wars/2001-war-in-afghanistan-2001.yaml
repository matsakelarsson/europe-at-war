id: war-in-afghanistan-2001
name: War in Afghanistan (2001–2021)
start: "2001-10-07"
end: "2021-08-30"
tier: A
summary: The war that began when the United States and its allies attacked Afghanistan after the al-Qaeda attacks of 11 September 2001, because the Taliban government refused to hand over al-Qaeda’s leader, Osama bin Laden. With US air power and special forces, the Northern Alliance took Kabul in November 2001 and the Taliban lost their last city, Kandahar, in December. A new Afghan state was built under the Bonn Agreement, protected by a NATO-led force, but the Taliban regrouped in Pakistan and from 2006 fought a growing insurgency in the south and east. A US “surge” in 2009–2011 brought foreign troop numbers to about 140,000, and bin Laden was killed in Pakistan in 2011, but the insurgency survived the handover of security to Afghan forces in 2014. After a US–Taliban agreement in February 2020 foreign troops withdrew; the Afghan republic collapsed as the Taliban took Kabul on 15 August 2021, and the last US troops left on 30 August after a chaotic airlift. About 176,000 people were killed in Afghanistan by one widely used estimate, among them some 46,000 civilians.
countries: [af, us, pk]
