        text: ISAF lowered its flag in a small ceremony at its headquarters.
        lonlat: [69.17, 34.53]
        lp: l
      - kind: event
        side: coal
        name: Camp Bastion
        date: October 2014
        text: The main British and US Marine base in Helmand, handed to the Afghan army.
        lonlat: [64.23, 31.86]
      - kind: event
        side: coal
        name: Panjwayi
        date: 11 March 2012
        text: A US staff sergeant killed 16 civilians, nine of them children, in two villages at night; he was later sentenced to life imprisonment.
        lonlat: [65.47, 31.53]
  - title: Afghan forces alone
    date: 2015–2019
    when: "2015-09-28"
    borders: "2019-12-31"
    countries: [af, us, pk]
    body:
      - Without foreign ground troops in combat, the Afghan army and police lost ground year by year. On 28 September 2015 the Taliban took Kunduz, the first provincial capital they had held since 2001; Afghan special forces with US support retook it within two weeks, and during the fighting a US gunship destroyed the Médecins Sans Frontières hospital in the city, killing 42 people. In 2016 the Taliban leader Akhtar Mansour was killed by a US drone in Pakistan, and in 2018 the Taliban overran much of Ghazni city for several days.
      - A new rival appeared. The Islamic State – Khorasan Province (ISIS-K), formed in 2015 from Pakistani and Afghan militants, took hold in parts of Nangarhar and carried out massacres of Shia Hazaras and other civilians in Kabul. In April 2017 the United States dropped its largest non-nuclear bomb on an ISIS-K tunnel complex in Achin. In May 2017 a truck bomb in Kabul’s diplomatic quarter killed about 150 people. By 2019 the government controlled the cities but the Taliban held or contested much of the countryside.
    facts:
      - [Kunduz taken by the Taliban, "28 September 2015"]
      - [Kunduz hospital air strike, "3 October 2015, 42 killed"]
      - [Kabul truck bomb, "31 May 2017, about 150 killed"]
