  - title: The fall of Kabul
    date: August 2021
    when: "2021-08-15"
    borders: "2021-08-30"
    countries: [af, us]
    body:
      - On 15 August 2021 President Ghani fled the country, and Taliban fighters entered Kabul. Crowds of Afghans who feared for their lives stormed the airport, and US and allied troops took control of it to run one of the largest airlifts in history, flying out about 122,000 people in two weeks. On 26 August an ISIS-K suicide bomber struck the crowd at the airport’s Abbey Gate, killing about 170 Afghans and 13 US soldiers. Three days later a US drone strike meant for ISIS-K killed ten civilians, seven of them children, in a Kabul courtyard; the Pentagon later admitted the mistake.
      - The last US aircraft left Kabul one minute before midnight on 30 August. Resistance in the Panjshir valley, led by Ahmad Massoud, son of Ahmad Shah Massoud, was overcome in early September, and the Taliban proclaimed a caretaker government of the Islamic Emirate of Afghanistan. After twenty years the war had ended where it began, with the Taliban in power. In July 2025 Russia became the first state to recognise their government formally.
    facts:
      - [Taliban enter Kabul, "15 August 2021"]
      - [Kabul airport attack, "26 August 2021, about 183 killed"]
      - [Last US flight, "30 August 2021"]
