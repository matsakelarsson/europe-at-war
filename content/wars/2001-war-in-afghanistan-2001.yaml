  - title: The Doha agreement and the Taliban offensive
    date: February 2020 – August 2021
    when: "2020-02-29"
    borders: "2021-08-14"
    countries: [af, us]
    body:
      - On 29 February 2020 the United States and the Taliban signed an agreement in Doha, Qatar. The United States promised to withdraw all its troops within 14 months; the Taliban promised not to let al-Qaeda or others use Afghanistan to threaten the United States, and to talk to the Afghan government, which was not a party to the deal. The talks that began in September went nowhere, while targeted killings of journalists, officials and activists multiplied. In April 2021 President Joe Biden announced that all US troops would leave by September.
      - As the foreign troops left, the Taliban launched a nationwide offensive in May 2021. They took rural districts across the north, then the border crossings, and from 6 August, beginning with Zaranj, the provincial capitals, many of which surrendered without a fight after local deals. Kunduz, Herat, Kandahar and Lashkar Gah fell between 8 and 13 August, Mazar-i-Sharif on 14 August and Jalalabad early on 15 August. The Afghan army, demoralised, unpaid in many places and dependent on US air support and contractors, collapsed.
    facts:
