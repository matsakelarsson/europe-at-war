  - title: Transition
    date: 2011–2014
    when: "2011-07"
    borders: "2014-12-28"
    countries: [af, us]
    body:
      - From July 2011 foreign troops began to leave, and province by province Afghan soldiers and police took over security; by mid-2013 they led everywhere. The Afghan forces, built up to some 350,000 men, took heavy casualties. Trust between them and the coalition was damaged by “insider” attacks, in which men in Afghan uniform killed dozens of foreign soldiers, by the burning of Qurans at Bagram in February 2012, and by the killing of 16 villagers in Panjwayi by a US soldier in March 2012.
      - The presidential election of 2014 ended in a bitter dispute between Ashraf Ghani and Abdullah Abdullah, settled by a US-brokered “national unity government” with Ghani as president. NATO ended its combat mission on 28 December 2014, and on 1 January 2015 its Resolute Support mission of about 13,000 troops began training and advising the Afghan forces, while US forces continued air strikes and raids against the Taliban and al-Qaeda.
    facts:
      - [Afghan forces lead security everywhere, "June 2013"]
      - [ISAF ends, "28 December 2014"]
      - [Resolute Support begins, "1 January 2015, about 13,000 troops"]
    markers:
