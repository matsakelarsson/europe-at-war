  - title: The surge
    date: 2009–2011
    when: "2009-12-01"
    borders: "2011-05-02"
    countries: [af, us, pk]
    body:
      - President Barack Obama sent 17,000 more troops in early 2009, and in December announced a further 30,000, to be followed by a withdrawal from 2011. By 2010 there were about 100,000 US troops and 40,000 from other countries in Afghanistan, the most of the war. Their commander, General Stanley McChrystal, put the protection of civilians first and limited air strikes. In February 2010 US Marines, British and Afghan troops took the Taliban stronghold of Marja in Helmand, and later that year US troops cleared the districts around Kandahar.
      - Karzai’s re-election in 2009 was marred by widespread fraud. US drone strikes on militants in Pakistan’s tribal areas multiplied. On 2 May 2011 US Navy SEALs flying from Afghanistan killed Osama bin Laden in a compound in Abbottabad, Pakistan, close to the country’s military academy. The surge pushed the Taliban out of parts of the south, but they kept their bases in Pakistan, and 2010 was the deadliest year of the war for foreign troops.
    facts:
      - [Surge announced, "1 December 2009"]
      - [Foreign troops at the peak, "about 140,000 (2010–2011)"]
      - [Bin Laden killed, "2 May 2011"]
    markers:
