  - title: Bouaké, 2004, and the Ouagadougou agreement
    date: 2004 – March 2007
    when: "2004-11-06"
    borders: "2004-11-06"
    countries: [ci, fr, bf]
    body:
      - "The United Nations Operation in Côte d’Ivoire (UNOCI) took over from the West African force in April 2004. In November 2004 Gbagbo broke the ceasefire with air raids on rebel towns, Operation Dignité. On 6 November an Ivorian Sukhoi jet bombed a French base in Bouaké, killing nine French soldiers and an American aid worker. France destroyed the Ivorian air force on the ground at Yamoussoukro and Abidjan; the Young Patriots attacked French and other foreigners in Abidjan, French troops fired on crowds near the Hôtel Ivoire, killing a number of Ivorians that is still disputed, and some 8,000 foreigners were evacuated. The UN imposed an arms embargo."
      - "Talks under South African mediation at Pretoria in 2005 kept a power-sharing government alive, and elections were postponed again and again. Gbagbo then negotiated directly with Soro under the mediation of President Blaise Compaoré of Burkina Faso. The Ouagadougou Political Agreement of 4 March 2007 made Soro prime minister, provided for dismantling the Zone of Confidence, merging the armies and registering voters, and ended the war; the presidential election it prepared was held only in 2010."
