steps:
  - title: The rebellion and the partition
    date: September 2002 – 2003
    when: "2002-09-19"
    borders: "2003-01-26"
    countries: [ci, fr, lr]
    body:
      - "On 19 September 2002 soldiers, many of them northerners facing demobilisation, attacked military and government targets in Abidjan, Bouaké and Korhogo. In Abidjan loyal forces beat them off, and the former military ruler Robert Guéï and the interior minister were among those killed; but the rebels, who called themselves the Patriotic Movement of Côte d’Ivoire (MPCI), held Bouaké, the second city, and Korhogo and soon the whole north. France, which had a base in Abidjan, launched Operation Licorne on 22 September to protect foreigners, and its troops halted the rebel advance towards Yamoussoukro; a ceasefire was agreed on 17 October."
      - "In late November two new rebel groups, the MPIGO and the MJP, took Man and Danané in the west, with Liberian fighters on both sides, and the fighting there brought massacres of civilians. In January 2003, at talks at Linas-Marcoussis near Paris, the government and the rebels agreed to a government of national reconciliation that would include the rebels, now called the Forces Nouvelles. Gbagbo’s supporters, the Young Patriots, rioted against the agreement and against France, and its terms were never fully carried out. French troops and a West African force, later the United Nations, held a buffer zone, the Zone of Confidence, between north and south."
    facts:
