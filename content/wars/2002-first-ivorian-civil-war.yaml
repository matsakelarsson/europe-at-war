id: first-ivorian-civil-war
name: First Ivorian Civil War
start: "2002-09-19"
end: "2007-03-04"
tier: B
summary: "The war that split Côte d’Ivoire into a rebel-held north and a government-held south. After the death of the country’s founding president, Félix Houphouët-Boigny, in 1993, the idea of “Ivoirité”, Ivorian identity, was used to exclude northerners and the opposition leader Alassane Ouattara from politics, and a coup in 1999 and a disputed election in 2000 brought Laurent Gbagbo to power. On 19 September 2002 soldiers attacked Abidjan, Bouaké and Korhogo; the attack on Abidjan failed, but the rebels, later the Forces Nouvelles under Guillaume Soro, took the north, and two further rebel groups took the far west with Liberian fighters. French troops of Operation Licorne and later a United Nations force held a buffer zone between the two halves. Power-sharing agreements at Linas-Marcoussis in 2003 and Pretoria in 2005 broke down; in November 2004 an Ivorian air raid killed nine French soldiers at Bouaké, and France destroyed the Ivorian air force. The Ouagadougou agreement of 4 March 2007 made Soro prime minister and ended the war. Estimates of the dead range from about 900 to 4,000, and some 750,000 people were displaced."
countries: [ci, fr, lr, bf]
