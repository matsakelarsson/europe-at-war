notes:
  - The northern rebellion, the Patriotic Movement of Côte d’Ivoire (MPCI), merged with the two western movements, the MPIGO and the MJP, as the Forces Nouvelles in December 2002. The government accused Burkina Faso of backing the rebels, which it denied; Liberian fighters, some sent by Charles Taylor, fought with the western rebels, and others were recruited by the government.
  - "Figures are uncertain. The Uppsala Conflict Data Program’s estimates of deaths range from about 900 to 4,000; the UNHCR counted about 750,000 people displaced. Death squads in Abidjan, militias on both sides and the rebels in the west were accused of killings of civilians, and many people from Burkina Faso, Mali and the north were attacked as “foreigners”."
