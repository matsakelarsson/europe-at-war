notes:
  - The wars in the Sahel where AQIM and its allies fought from 2012 are told in the Mali War and the jihadist insurgencies in Burkina Faso and Niger; the Libyan wars are told separately. Figures for militants killed come mostly from government statements and cannot be checked independently.
  - The governments call the insurgents terrorists; the groups call themselves mujahideen. Not every attack listed was the work of AQIM itself; the Casablanca and Marrakesh bombings were carried out by local cells inspired by al-Qaeda, and the attacks of 2014–2016 in Tunisia by supporters of the Islamic State.
