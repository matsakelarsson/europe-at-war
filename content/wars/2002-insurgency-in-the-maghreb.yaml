id: insurgency-in-the-maghreb
name: Insurgency in the Maghreb
start: "2002"
end: ongoing
tier: C
summary: "Last updated 27 November 2026. The jihadist insurgency in Algeria and its neighbours that outlived the Algerian Civil War. Its core was the Salafist Group for Preaching and Combat (GSPC), founded in 1998 by Hassan Hattab and other commanders who broke with the Armed Islamic Group (GIA) over its massacres of civilians and who refused the amnesty of 1999. From the mountains of Kabylia and eastern Algeria it kept up ambushes of soldiers and police, while its Saharan units under Amari Saïfi and Mokhtar Belmokhtar lived from smuggling and from kidnapping Europeans, starting with 32 tourists seized in 2003, and in June 2005 killed 15 Mauritanian soldiers at Lemgheity. Under Abdelmalek Droukdel the GSPC pledged allegiance to al-Qaeda and in January 2007 renamed itself al-Qaeda in the Islamic Maghreb (AQIM). It then turned to suicide bombings in Algiers: on 11 April 2007 against the government palace and a police station (33 dead), and on 11 December 2007 against the Constitutional Council and the UN offices (41 dead, 17 of them UN staff). In Morocco, bombings in Casablanca on 16 May 2003 killed 33 people and the twelve bombers, and a bomb in a Marrakesh café killed 17 in 2011; in Tunisia a truck bomb at the El Ghriba synagogue on Djerba killed 19 in 2002. Driven out of most of northern Algeria by the army, AQIM moved its weight south into the Sahel, where its fighters took part in the war in Mali from 2012 and joined JNIM in 2017. In January 2013 Belmokhtar’s breakaway group seized the Tiguentourine gas plant near In Amenas; when the Algerian army stormed it, 40 hostages, almost all foreign workers, and 29 attackers died. After the Tunisian revolution, AQIM’s Okba Ibn Nafaa Brigade fought the Tunisian army on Mount Chambi near Kasserine from December 2012, and gunmen loyal to the Islamic State killed 22 people at the Bardo museum in Tunis and 38 tourists on the beach at Sousse in 2015, and attacked Ben Guerdane from Libya in March 2016. French troops killed Droukdel in northern Mali in June 2020; his successor was Abu Ubaidah Yusuf al-Annabi. By 2026 attacks in Algeria, Tunisia and Morocco had become rare, though the Algerian army still reported clashes and killings of militants in the mountains each year, as in Tébessa in March 2026, and Tunisian forces still hunted small groups near the Algerian border; AQIM’s main strength lay in the Sahel."
