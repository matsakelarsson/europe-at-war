  - title: Occupation and insurgency
    date: May 2003 – June 2004
    when: "2003-05-16"
    borders: "2004-06-28"
    countries: [iq, us]
    body:
      - The Coalition Provisional Authority under the US diplomat Paul Bremer governed Iraq. Its first orders, in May 2003, barred senior Ba’ath party members from public jobs and dissolved the army, leaving hundreds of thousands of armed men without work. An insurgency grew in the Sunni Arab areas north and west of Baghdad. In August 2003 a truck bomb destroyed the UN headquarters at the Canal Hotel, killing 22 people including the UN envoy Sérgio Vieira de Mello, and a car bomb in Najaf killed the Shia leader Ayatollah Muhammad Baqir al-Hakim and scores of others. On 13 December US troops found Saddam Hussein hiding in a hole near Ad-Dawr.
      - In 2004 the occupation turned into open war. Photographs published in April showed US soldiers torturing and humiliating prisoners at Abu Ghraib prison. After four US contractors were killed and their bodies hung from a bridge in Fallujah on 31 March, US Marines attacked the city, but called off the assault in late April amid outrage at civilian deaths. In the same month Muqtada al-Sadr’s Mahdi Army rose in Baghdad and the Shia south. On 28 June 2004 the coalition handed sovereignty to an Iraqi interim government under Ayad Allawi.
    facts:
      - [Army dissolved, "23 May 2003"]
      - [Saddam captured, "13 December 2003"]
      - [Sovereignty handed over, "28 June 2004"]
    markers:
      - kind: event
        side: ins
        name: Canal Hotel
        date: 19 August 2003
        text: The bombing of the UN headquarters led the UN to withdraw most of its staff from Iraq.
        lonlat: [44.45, 33.33]
        lp: t
      - kind: event
        side: coal
        name: Ad-Dawr
        date: 13 December 2003
        text: Saddam was found in an underground hiding place on a farm near the Tigris. He was tried by an Iraqi court and hanged on 30 December 2006.
        lonlat: [43.79, 34.46]
      - kind: event
