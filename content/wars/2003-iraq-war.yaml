        name: Basra
        date: 25–31 March 2008
        text: The Iraqi army’s “Charge of the Knights” against the Mahdi Army and other militias; government forces took control of the city.
        lonlat: [47.78, 30.51]
        lp: l
      - kind: battle
        side: gov
        name: Sadr City
        date: March – May 2008
        text: US and Iraqi troops fought the Mahdi Army in the vast Shia district of Baghdad until a truce in May.
        lonlat: [44.45, 33.39]
  - title: The withdrawal
    date: November 2008 – December 2011
    when: "2008-11-17"
    borders: "2011-12-18"
    countries: [iq, us, kw]
    body:
      - On 17 November 2008 Iraq and the United States signed a Status of Forces Agreement under which US combat troops left Iraq’s cities by 30 June 2009 and all US forces were to leave by the end of 2011. Barack Obama, elected on a promise to end the war, declared the US combat mission over in August 2010, leaving some 50,000 troops to train and advise. Elections in March 2010 gave Ayad Allawi’s cross-sectarian list the most seats, but Maliki kept the premiership after eight months of deadlock.
      - Talks on keeping some US troops after 2011 failed over legal immunity for them, and the last US convoy crossed into Kuwait on 18 December 2011. Iraq was left with an elected government but deep sectarian divisions, a weakened but surviving Islamic State of Iraq, and a Kurdistan Region that ran its own affairs. The war had cost the United States nearly 4,500 dead and, by various estimates, between about 150,000 and several hundred thousand Iraqi lives.
    facts:
      - [Status of Forces Agreement, "17 November 2008"]
      - [US combat mission ends, "31 August 2010"]
      - [Last US troops leave, "18 December 2011"]
    markers:
      - kind: treaty
        name: Status of Forces Agreement
        date: 17 November 2008
        text: Signed in Baghdad and approved by the Iraqi parliament. It set the end of 2011 as the deadline for the US withdrawal.
        lonlat: [44.39, 33.31]
        lp: l
      - kind: event
        side: coal
        name: Tallil
        date: 18 December 2011
        text: The last US convoy left Contingency Operating Base Adder near Nasiriyah for Kuwait before dawn.
        lonlat: [46.09, 30.94]
    arrows:
