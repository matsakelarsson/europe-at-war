  - title: Elections and a widening war
    date: 2005
    when: "2005-01-30"
    borders: "2005-12-15"
    countries: [iq, us]
    body:
      - On 30 January 2005 Iraqis voted for a transitional assembly. Shia and Kurdish voters turned out in large numbers, while most Sunni Arabs boycotted the election; the Shia religious parties won and formed a government, and Jalal Talabani, a Kurd, became president. A new constitution, which created a federal state with a Kurdistan Region, was approved in a referendum in October, and a parliament elected in December, this time with Sunni participation.
      - The violence grew all the same. Al-Qaeda in Iraq carried out mass-casualty suicide bombings against Shia civilians, police recruits and mosques, while Shia militias, some inside the interior ministry, kidnapped and killed Sunni men. US forces mounted offensives along the Euphrates valley towards the Syrian border and in Tal Afar. In November 2005 US Marines killed 24 unarmed civilians, among them women and children, at Haditha after one of their comrades died in a roadside bombing.
    facts:
      - [Election, "30 January 2005"]
      - [Constitution approved, "15 October 2005"]
      - [Haditha killings, "19 November 2005, 24 civilians"]
    markers:
