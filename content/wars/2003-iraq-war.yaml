        text: The fighting around the shrine of Imam Ali ended in a settlement brokered by Ayatollah Sistani.
        lonlat: [44.33, 32.00]
      - kind: taken
        side: coal
        name: Fallujah
        date: 7 November – 23 December 2004
        text: Operation Phantom Fury (al-Fajr, “Dawn”) retook the city. Its residents were allowed to return only gradually, through checkpoints.
        lonlat: [43.78, 33.35]
        lp: l
      - kind: event
        side: ins
