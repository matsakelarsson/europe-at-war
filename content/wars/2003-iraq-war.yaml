        text: The bombing of the al-Askari shrine set off a wave of sectarian killings across Iraq. A second attack in 2007 destroyed its minarets.
        lonlat: [43.87, 34.20]
      - kind: event
        name: Baghdad
        date: 2006–2007
        text: Militias divided the capital into Sunni and Shia areas behind walls and checkpoints.
        lonlat: [44.39, 33.31]
