  - title: The surge and the Awakening
    date: 2007–2008
    when: "2007-01-10"
    borders: "2008-03-31"
    countries: [iq, us]
    body:
      - In Anbar province, Sunni tribal leaders led by Sheikh Abdul Sattar Abu Risha, alienated by al-Qaeda in Iraq’s killings and rule, allied with US forces from September 2006 in what became known as the Awakening. In January 2007 Bush announced a “surge” of about 30,000 more troops, bringing US numbers to some 170,000. Under General David Petraeus they moved into small outposts in Baghdad’s neighbourhoods, while about 100,000 men, mostly Sunni and many of them former insurgents, were paid to guard their own districts as the “Sons of Iraq”.
      - In August 2007 truck bombs killed about 800 Yazidis in two villages near Sinjar, the deadliest attack of the war; the same month Sadr ordered his militia to stand down. Violence fell steeply through the end of 2007. In March 2008 Maliki sent the Iraqi army against the Shia militias in Basra; the offensive faltered until US and British support arrived, and a truce brokered in Iran ended the fighting there and in Baghdad’s Sadr City.
    facts:
      - [Surge announced, "10 January 2007"]
      - [Qahtaniya bombings, "14 August 2007, about 800 killed"]
      - [Battle of Basra, "25–31 March 2008"]
    markers:
      - kind: event
        side: coal
        name: Ramadi
        date: 2006–2007
        text: The birthplace of the Awakening. Abu Risha was killed by a bomb in September 2007, days after meeting President Bush.
        lonlat: [43.30, 33.42]
        lp: l
      - kind: event
        side: coal
        name: Baghdad
        date: 2007
        text: Most surge troops went to Baghdad and its outskirts, where they lived among the population.
        lonlat: [44.39, 33.31]
        lp: l
      - kind: event
        side: ins
        name: Qahtaniya
        date: 14 August 2007
        text: Four coordinated truck bombs destroyed much of two Yazidi villages; estimates of the dead range from about 500 to 800.
        lonlat: [41.67, 36.35]
      - kind: battle
