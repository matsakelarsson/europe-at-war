id: iraq-war
name: Iraq War
start: "2003-03-20"
end: "2011-12-18"
tier: A
summary: The war that began with the invasion of Iraq by the United States, Britain and their allies on 20 March 2003, without the explicit authorisation of the UN Security Council, to overthrow Saddam Hussein, whose government they accused of hiding weapons of mass destruction and of links to terrorism; no such weapons were found. Baghdad fell on 9 April, but the occupation that followed, the dissolution of the Iraqi army and the purge of Ba’ath party members were followed by a Sunni Arab insurgency, uprisings by the Shia cleric Muqtada al-Sadr’s Mahdi Army and, after the bombing of the Shia shrine at Samarra in 2006, a sectarian civil war in which tens of thousands of civilians were killed. A US troop “surge” in 2007 and the turn of Sunni tribes against al-Qaeda in Iraq reduced the violence, and under a 2008 agreement with the elected Iraqi government the last US troops left on 18 December 2011. Estimates of the violent deaths range from about 150,000 to several hundred thousand.
