notes:
  - Death tolls are disputed. Iraq Body Count, which counts deaths reported in the media and official records, documented about 115,000 civilian deaths from violence from 2003 to 2011; the Iraq Family Health Survey estimated 151,000 violent deaths by mid-2006; a 2013 study in PLOS Medicine estimated about 405,000 excess deaths from 2003 to 2011; a much-criticised 2006 survey in The Lancet estimated about 655,000 excess deaths by mid-2006. About 4,500 US and 179 British service members died.
  - The UN Secretary-General, Kofi Annan, said in 2004 that the invasion was not in conformity with the UN Charter. The US-led Iraq Survey Group reported in 2004 that Iraq had destroyed its stockpiles of weapons of mass destruction after 1991 and had no active programmes to make them.
  - The insurgency was made up of many groups — former Ba’athists and soldiers, Sunni nationalists and Islamists, and al-Qaeda in Iraq, which later became the Islamic State — and Shia militias, some backed by Iran. The war against the Islamic State from 2013 is a separate entry.
