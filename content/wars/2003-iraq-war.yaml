  - title: Samarra and the sectarian war
    date: 2006
    when: "2006-02-22"
    borders: "2006-12-30"
    countries: [iq, us]
    body:
      - On 22 February 2006 bombs planted by al-Qaeda in Iraq destroyed the golden dome of the al-Askari shrine in Samarra, one of the holiest Shia sites. Hundreds of Sunni mosques were attacked in reprisal, and Iraq slid into a sectarian civil war. Shia militias and death squads, many from the Mahdi Army, and Sunni insurgents fought for control of Baghdad’s neighbourhoods; every morning bodies were found in the streets, many of them tortured. Mixed districts were emptied, and more than a million Iraqis were driven from their homes in 2006–2007, while hundreds of thousands fled to Syria and Jordan.
      - Abu Musab al-Zarqawi was killed by a US air strike near Baqubah on 7 June 2006, and in October his successors proclaimed the Islamic State of Iraq. Nuri al-Maliki became prime minister in May. Iraq Body Count documented about 29,000 civilian deaths in 2006, the worst year of the war. Saddam Hussein, sentenced to death for the killing of 148 Shia men from Dujail, was hanged on 30 December 2006.
    facts:
      - [Al-Askari shrine bombing, "22 February 2006"]
      - [Zarqawi killed, "7 June 2006"]
      - [Civilian deaths documented in 2006, "about 29,000 (Iraq Body Count)"]
