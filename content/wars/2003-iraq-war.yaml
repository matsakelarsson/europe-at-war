steps:
  - title: The invasion
    date: 20 March – 1 May 2003
    when: "2003-03-20"
    borders: "2003-04-09"
    countries: [iq, us, gb, kw]
    body:
      - After the attacks of 11 September 2001 the administration of George W. Bush argued that Saddam Hussein’s Iraq, under UN sanctions since 1990, was hiding chemical and biological weapons and seeking nuclear ones, and might give them to terrorists. UN inspectors returned to Iraq in November 2002 and found no such weapons. France, Russia and Germany opposed war, the Security Council did not authorise it, and millions marched against it around the world. Britain, Australia and Poland sent troops with the United States, and Kuwait provided the base.
      - The war began early on 20 March 2003 with air strikes aimed at Saddam and, on 21 March, a massive bombing campaign on Baghdad. US Army divisions drove up the Euphrates past Nasiriyah, Najaf and Karbala, and US Marines up the Tigris by Kut, fighting Republican Guard units and irregular Fedayeen; British troops took Umm Qasr and, on 6 April, Basra. In the north, US special forces and paratroopers fought alongside the Kurdish Peshmerga, who took Kirkuk on 10 April and Mosul on 11 April.
      - US armoured columns made “thunder runs” into Baghdad on 5 and 7 April, and on 9 April the government collapsed and a crowd, helped by US Marines, pulled down Saddam’s statue in Firdos Square. Tikrit fell on 14 April. Widespread looting of ministries, hospitals and the national museum followed. On 1 May Bush declared, aboard an aircraft carrier, that major combat operations had ended.
    facts:
      - [Invasion begins, "20 March 2003"]
      - [Basra taken, "6 April 2003"]
      - [Baghdad falls, "9 April 2003"]
