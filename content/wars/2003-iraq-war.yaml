        side: ins
        name: Fallujah
        date: 4–30 April 2004
        text: The first US assault was halted after a month. A “Fallujah Brigade” of former Iraqi soldiers took over the city, and insurgents soon ruled it.
        lonlat: [43.78, 33.35]
        lp: l
      - kind: event
        side: mahdi
        name: Najaf
        date: April – June 2004
        text: The Mahdi Army held the holy city until a truce in June.
        lonlat: [44.33, 32.00]
  - title: Najaf and Fallujah
    date: August – December 2004
    when: "2004-08-05"
    borders: "2004-12-23"
    countries: [iq, us]
    body:
      - In August 2004 the Mahdi Army rose again in Najaf. For three weeks US Marines and Iraqi troops fought Sadr’s men in the old city and the vast Wadi al-Salam cemetery, around the shrine of Imam Ali, one of Shia Islam’s holiest places, until Grand Ayatollah Ali al-Sistani returned from London and brokered a settlement on 27 August under which the militia left the shrine.
      - Fallujah had become the main stronghold of Sunni insurgents and of the Jordanian Abu Musab al-Zarqawi’s group, which pledged allegiance to al-Qaeda in October 2004. On 7 November some 10,000 US troops, with British and Iraqi units, attacked the city after most of its inhabitants had fled. In the hardest urban battle US forces had fought since Hue in 1968, they took the city block by block by late December. About 95 US soldiers and an estimated 1,200–2,000 insurgents were killed, and much of the city was destroyed.
    facts:
      - [Battle of Najaf, "5–27 August 2004"]
      - [Second Battle of Fallujah, "7 November – 23 December 2004"]
    markers:
