    moves: Rebel moves
    success: Rebel success
notes:
  - "“Janjaweed”, often explained as “devils on horseback”, was a name used by their victims and by outsiders for the Arab militias that fought for the government; the government called them by official names (Popular Defence Forces, Border Guards, Border Intelligence) and denied controlling them. Many Arab groups in Darfur did not take part, and the war also brought fighting among Arab groups and among the rebels."
  - "Whether the killings in Darfur amounted to genocide was contested. The US government (2004) and the ICC’s pre-trial chamber (2010) said yes; the UN International Commission of Inquiry (2005) found crimes against humanity and war crimes but no proof of a policy of genocide. Death toll estimates differ widely and depend on whether deaths from disease and hunger are counted."
  - The rebel movements split repeatedly; the SLM/A divided in 2006 into factions led by Minni Minnawi and Abdul Wahid al-Nur, and dozens of smaller groups formed.
