steps:
  - title: The rising
    date: 2001–2003
    when: "2003-04-25"
    borders: "2003-04-25"
    countries: [sd]
    body:
      - Darfur, a sultanate until 1916, had always been one of Sudan’s poorest and most neglected regions. Its people were all Muslim, but they were divided between groups who saw themselves as Arab, many of them camel and cattle herders, and non-Arab peoples such as the Fur, Masalit and Zaghawa, many of them farmers. Drought and the spread of the desert in the 1970s and 1980s set herders and farmers against each other over land and water, and the wars in Chad and Libya’s ambitions flooded the region with guns. A war between the Fur and Arab militias in 1987–1989 and fighting in Dar Masalit in 1996–1999 showed how successive governments armed Arab groups against the others. In 2000 an anonymous “Black Book” documented how a few northern riverain groups dominated the state.
      - In 2001 Fur and Zaghawa leaders swore an oath at Abu Gamra to fight together. Their Darfur Liberation Front, renamed the Sudan Liberation Movement/Army (SLM/A) in March 2003, was led by Abdul Wahid al-Nur, a Fur lawyer, and Minni Minnawi, a Zaghawa; the Justice and Equality Movement (JEM) of Khalil Ibrahim, a Zaghawa Islamist who had broken with the regime, joined the fighting. On 26 February 2003 the rebels claimed an attack on the government post at Golo in Jebel Marra.
      - Before dawn on 25 April 2003 SLA and JEM fighters in pickup trucks raided the air base at El Fasher, destroyed aircraft on the ground, among them Antonov bombers and helicopter gunships, killed about 75 soldiers and airmen and took 32 prisoners. In May they destroyed a battalion at Kutum. The army, many of whose soldiers came from Darfur, could not hold the countryside.
    facts:
      - [Oath of Abu Gamra, "21 July 2001"]
      - [Attack on Golo, "26 February 2003"]
      - [Raid on El Fasher air base, "25 April 2003"]
    markers:
