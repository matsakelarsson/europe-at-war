  - title: “Genocide” and Abuja
    date: 2004–2006
    when: "2004-09-09"
    borders: "2006-05-05"
    countries: [sd, td]
    body:
      - The killings came to world attention in 2004, the tenth anniversary of the genocide in Rwanda. A humanitarian ceasefire signed in N’Djamena on 8 April 2004 was broken almost at once, and the African Union sent a small monitoring mission, AMIS, which grew to about 7,000 troops by 2005 but could do little to protect civilians. On 9 September 2004 the US secretary of state, Colin Powell, told the Senate that genocide had been committed in Darfur and that the government and the Janjaweed were responsible. The UN International Commission of Inquiry reported in January 2005 that the government and the militias had committed crimes against humanity and war crimes, but that the government had not pursued a policy of genocide; on 31 March 2005 the Security Council referred Darfur to the International Criminal Court.
      - Talks in Abuja produced the Darfur Peace Agreement of 5 May 2006, but only Minni Minnawi’s faction of the SLA signed; Abdul Wahid al-Nur’s SLA and JEM refused, and the rebels fragmented into many groups that fought each other as well as the government. The war spread into Chad, where the Sudanese government backed rebels against President Idriss Déby, who in turn backed JEM (see the Chadian Civil War of 2005–2010).
    facts:
      - [N’Djamena ceasefire, "8 April 2004"]
      - [Powell’s genocide statement, "9 September 2004"]
      - [UN Commission of Inquiry report, "January 2005"]
      - [Referral to the ICC, "31 March 2005"]
      - [Darfur Peace Agreement, "5 May 2006"]
    markers:
      - kind: treaty
        side: none
        name: N’Djamena
        date: 8 April 2004
        text: The government and the two main rebel movements signed a humanitarian ceasefire, broken almost at once.
        lonlat: [15.04, 12.11]
      - kind: event
        side: none
