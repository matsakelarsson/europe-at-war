id: war-in-darfur
name: War in Darfur
start: "2003-02-26"
end: "2020-10-03"
tier: A
summary: "The war in Sudan’s western region of Darfur between rebel movements drawn mainly from the Fur, Masalit and Zaghawa peoples and the government of Omar al-Bashir, which fought them with its army and air force and with Arab militias known as the Janjaweed. The Sudan Liberation Movement/Army (SLM/A) and the Justice and Equality Movement (JEM) rose in 2003 against the region’s neglect and the arming of Arab groups against non-Arab farmers. The government answered with a campaign of bombing and militia raids that burned thousands of villages, killed tens of thousands of civilians and drove some 2–3 million people into camps in Darfur and Chad. The United States called it genocide in 2004; a UN commission found crimes against humanity and war crimes but no proven genocidal policy, and the case went to the International Criminal Court, which in 2009 and 2010 issued arrest warrants for Bashir, the second for genocide. African Union and then joint UN–AU peacekeepers (UNAMID) were deployed, peace agreements in 2006 and 2011 brought in only some of the rebels, and in 2013 the Janjaweed were reorganised as the Rapid Support Forces. The UN estimated about 300,000 deaths by 2008, most from disease and hunger; the government gave 10,000. After Bashir’s fall in 2019 most rebel groups signed the Juba Peace Agreement of October 2020, but Darfur became a battlefield again in the civil war of 2023."
countries: [sd, td]
sides:
  - id: sd
    name: Sudan (the government, the army and the Janjaweed, from 2013 the Rapid Support Forces)
    polities: [sudan, rsf]
    ink: red
    moves: Government and militia moves
    success: Government success
  - id: reb
