  - title: Bashir falls and the Juba agreement
    date: 2019–2020
    when: "2020-10-03"
    borders: "2020-10-03"
    countries: [sd]
    body:
      - Protests that began over the price of bread in December 2018 grew into a revolution, and on 11 April 2019 the army removed Bashir. On 3 June 2019 the security forces, among them the RSF, broke up the protesters’ sit-in in Khartoum, killing more than 100 people. A transitional government of military officers and civilians took office in August 2019, with Hemedti as deputy head of the Sovereignty Council.
      - The Juba Peace Agreement, initialled on 31 August and signed on 3 October 2020 in South Sudan’s capital, brought in the Sudan Revolutionary Front, including Minni Minnawi’s SLM and JEM under Khalil Ibrahim’s brother Gibril Ibrahim, with posts in government and promises of land, justice and the return of the displaced. Abdul Wahid al-Nur’s SLM refused to sign. UNAMID ended its mandate on 31 December 2020 and withdrew, and attacks on displaced people around El Geneina in 2021 killed hundreds. After the war between the army and the RSF broke out in April 2023, Darfur again saw mass killings (see the Sudanese civil war).
    facts:
      - [Bashir removed, "11 April 2019"]
      - [Juba Peace Agreement, "3 October 2020"]
      - [UNAMID mandate ends, "31 December 2020"]
      - [Deaths in the war, "about 300,000 by the UN’s 2008 estimate"]
    markers:
      - kind: event
        side: none
        name: Khartoum
        date: 11 April 2019
        text: The army removed Bashir after four months of protests.
        lonlat: [32.53, 15.60]
      - kind: treaty
        side: none
        name: Juba
        date: 3 October 2020
        text: Sudan’s transitional government and the Sudan Revolutionary Front signed the Juba Peace Agreement.
        lonlat: [31.58, 4.85]
      - kind: event
        side: none
        name: El Geneina
        date: January 2021
        text: Attacks on the Krinding camps for displaced Masalit killed more than 160 people weeks after UNAMID’s mandate ended.
        lonlat: [22.45, 13.45]
