        lonlat: [25.35, 13.63]
  - title: UNAMID and the raid on Omdurman
    date: 2007–2010
    when: "2008-05-10"
    borders: "2008-05-10"
    countries: [sd, td]
    body:
      - On 31 July 2007 the UN Security Council authorised a joint UN–African Union force, UNAMID, which took over from AMIS on 31 December 2007; it was meant to grow to some 26,000 troops and police, one of the largest peacekeeping missions in the world, but the government obstructed its deployment for years. On 30 September 2007 rebels overran the AMIS base at Haskanita and killed at least ten peacekeepers. In 2008 the UN’s humanitarian chief estimated that some 300,000 people had died since 2003, most of them from disease and hunger.
      - On 10 May 2008 JEM, armed and supplied from Chad, sent a column of more than a hundred pickup trucks over 1,000 km across Kordofan to Omdurman, the first rebel attack on the capital. It was beaten back at the bridges over the Nile, with heavy losses on both sides; Khalil Ibrahim escaped. Sudan blamed Chad for the raid, which followed an assault on N’Djamena by Chadian rebels in February 2008 that Chad blamed on Sudan.
      - On 4 March 2009 the ICC issued a warrant for the arrest of President Bashir for war crimes and crimes against humanity in Darfur, the first against a sitting head of state, and on 12 July 2010 a second warrant for genocide. Bashir responded by expelling thirteen international aid agencies. Chad and Sudan made peace in January 2010 and stopped supporting each other’s rebels.
    facts:
      - [UNAMID takes over from AMIS, "31 December 2007"]
      - [JEM attack on Omdurman, "10 May 2008"]
      - [ICC arrest warrants for Bashir, "4 March 2009 and 12 July 2010"]
    markers:
      - kind: battle
        side: sd
        name: Omdurman
        date: 10 May 2008
        text: JEM’s column reached the capital and was beaten back at the Nile bridges.
        lonlat: [32.48, 15.64]
      - kind: event
        side: none
