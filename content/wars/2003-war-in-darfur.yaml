  - title: The Janjaweed
    date: 2003–2004
    when: "2004-01"
    borders: "2004-01-01"
    countries: [sd, td]
    body:
      - Short of reliable troops, the government turned to Arab militias, mostly from landless camel-herding Abbala groups led by men such as Musa Hilal, armed them, paid them and gave them uniforms and impunity. From mid-2003 the army and the Janjaweed attacked the villages of the Fur, Masalit and Zaghawa together. Antonov aircraft and helicopter gunships bombed first; then militiamen on horses and camels and soldiers in trucks killed men and boys, raped women and girls, looted cattle, burned houses and grain stores and poisoned wells. Survivors described the attackers calling them slaves and saying the land would belong to Arabs.
      - By the end of 2004 well over a million people had fled to camps around the towns of Darfur, such as Kalma near Nyala and Abu Shouk and Zamzam near El Fasher, and some 200,000 had crossed into Chad, where camps grew along the border near Abéché. The government restricted access for aid agencies and journalists. Satellite images and refugee accounts showed thousands of villages destroyed.
    facts:
      - [Displaced in Darfur by end of 2004, "well over 1 million"]
      - [Refugees in Chad, "about 200,000 in 2004"]
    markers:
