  - title: Doha, the Rapid Support Forces and Jebel Marra
    date: 2011–2016
    when: "2016-01"
    borders: "2016-01-15"
    countries: [sd]
    body:
      - The Doha Document for Peace in Darfur of July 2011 was signed by the government and a coalition of small groups, the Liberation and Justice Movement, but not by the main rebels, who joined the SPLM-North of South Kordofan and Blue Nile in the Sudan Revolutionary Front in November 2011. Khalil Ibrahim of JEM was killed in an air strike in Kordofan in December 2011. Fighting among Arab groups over land and over the gold mine of Jebel Amer, discovered in 2012, killed hundreds more.
      - In 2013 the government reorganised many Janjaweed fighters into the Rapid Support Forces (RSF), first under the intelligence service, commanded by Mohamed Hamdan Dagalo, known as Hemedti, a Rizeigat camel-herder turned militia leader. In the government’s “Decisive Summer” campaigns of 2014 and 2015 the RSF swept through the rebel areas, burning villages again. In January 2016 the army began an offensive on the last SLA stronghold in Jebel Marra; Amnesty International reported that it had used chemical weapons there, which the government denied. By then the rebels held little territory in Darfur, though Abdul Wahid al-Nur’s faction kept parts of Jebel Marra.
    facts:
      - [Doha Document for Peace in Darfur, "July 2011"]
      - [Rapid Support Forces formed, "2013"]
      - [Jebel Marra offensive, "from January 2016"]
    markers:
