id: central-african-republic-bush-war
name: Central African Republic Bush War
start: "2004-11"
end: "2007-04"
tier: C
summary: "A rebellion against François Bozizé, who had seized power in the Central African Republic in March 2003 and was elected president in 2005. In the remote north-east, rebels later united in the Union of Democratic Forces for Unity (UFDR), led by Michel Djotodia, raided Birao in November 2004 and in late 2006 took Birao, Sam Ouandja and Ouadda; the government accused Sudan of backing them. French aircraft and troops, based in the country under a defence agreement, helped the army retake Birao in November–December 2006, and when the UFDR attacked again in March 2007 French paratroopers fought for the town, much of which was burned. In the north-west, the APRD, made up largely of supporters of the overthrown president Ange-Félix Patassé, and Abdoulaye Miskine’s FDPC fought the army, whose Presidential Guard burned villages and killed hundreds of civilians; Chadian troops also crossed the border. Some 212,000 people fled their homes. The FDPC signed a peace agreement at Sirte in Libya in February 2007, and the UFDR at Birao in April 2007; a comprehensive peace agreement signed in Libreville in June 2008 by the main groups provided for amnesty and disarmament, but its failure led to the Séléka rebellion of 2012."
countries: [cf, fr, td, sd]
sides:
