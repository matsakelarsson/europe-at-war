notes:
  - "The dates of the war and of the Birao agreement vary between sources: fighting is usually dated from 2004 or 2005, the UFDR’s main offensives came in 2006–2007, and the Birao agreement is dated 1 April 2007 in the PA-X database and 4 April in its text. Human Rights Watch found that most killings of civilians in the north-west were committed by government forces."
