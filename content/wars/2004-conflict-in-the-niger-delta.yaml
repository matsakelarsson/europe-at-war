id: conflict-in-the-niger-delta
name: Conflict in the Niger Delta
start: "2004-09"
end: ongoing
tier: C
summary: "Last updated 27 November 2026. The armed conflict over the oil wealth of the Niger Delta in southern Nigeria, where most of the country’s oil is pumped while many of the people, among them the Ijaw, Ogoni and others, live with oil spills, gas flaring and poverty. Peaceful protest in the 1990s was met with repression: the military government hanged the Ogoni writer Ken Saro-Wiwa and eight others in 1995, and soldiers destroyed the Ijaw town of Odi in 1999, killing scores, if not hundreds. In September 2004 Mujahid Dokubo-Asari’s Niger Delta People’s Volunteer Force (NDPVF), which fought rival militias around Port Harcourt and lived largely from stolen oil, declared “all-out war” on the state; from 2006 the Movement for the Emancipation of the Niger Delta (MEND) attacked pipelines and platforms and kidnapped more than 200 foreign oil workers, repeatedly forcing cuts in Nigeria’s oil output. After an army offensive in May 2009, President Umaru Yar’Adua offered an amnesty from 26 June 2009; some 30,000 fighters registered for stipends and training, among them leaders such as Government Ekpemupolo (Tompolo), whose firms were later paid to guard the pipelines, and violence fell sharply. In 2016 a new group, the Niger Delta Avengers, bombed pipelines and terminals and pushed output to its lowest level in decades before declaring a ceasefire in August. Since then oil theft, illegal refining and piracy have been the main problems, but attacks continued: in early 2025 pipelines were blown up in Rivers State, President Bola Tinubu declared a state of emergency there in March, saying its governor had done nothing to stop them, and in April MEND and another group claimed attacks on the main oil pipeline in Bayelsa State; on 15 June 2026 armed men attacked the Trans-Niger Pipeline at Odau in Rivers State. No one has published a reliable count of the dead; estimates run into the thousands."
