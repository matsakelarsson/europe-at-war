notes:
  - The militant groups were many and changing, and several were also criminal networks living from oil theft, kidnapping and political patronage; leaders who accepted the 2009 amnesty often became contractors to the state. Since 2021 some Niger Delta groups have also joined the separatist insurgency in south-eastern Nigeria.
