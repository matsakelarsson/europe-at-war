notes:
  - "Whether Aristide resigned or was removed is disputed: he and his supporters call it a coup carried out with American and French involvement, while the US and French governments say he left of his own will to avoid bloodshed. Haiti’s interim president was sworn in under the constitution’s provision for a vacancy."
