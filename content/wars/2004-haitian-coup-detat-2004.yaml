id: haitian-coup-detat-2004
name: 2004 Haitian coup d’état
start: "2004-02-05"
end: "2004-06-01"
tier: C
summary: "The armed revolt that drove President Jean-Bertrand Aristide from Haiti for the second time, and the foreign interventions that followed. After disputed legislative elections in May 2000 and Aristide’s return to the presidency in February 2001, the opposition, backed by much of the business elite and civil society, demanded his resignation, while armed gangs loyal to his Fanmi Lavalas party (the chimères) attacked opponents, and former soldiers raided across the Dominican border. On 5 February 2004 the Gonaïves Resistance Front, a former pro-Aristide gang once called the Cannibal Army that had turned against him after its leader Amiot Métayer was murdered in 2003, seized Gonaïves under Amiot’s brother Buteur Métayer. Former army officers and FRAPH paramilitaries, among them Guy Philippe and Louis-Jodel Chamblain, joined them in what became the National Revolutionary Front for the Liberation and Reconstruction of Haiti (FLRN); the police fled or were overrun across the north, and on 22 February the rebels took Cap-Haïtien. As they threatened Port-au-Prince and pro-Aristide gangs barricaded the capital, the United States and France pressed Aristide to leave. In the early hours of 29 February 2004 he signed a letter of resignation and was flown out on an American plane to the Central African Republic; he has said that he was forced out in a coup and kidnapped, which the US government denies. The chief justice, Boniface Alexandre, became interim president and Gérard Latortue prime minister. The same day UN Security Council Resolution 1529 authorised a Multinational Interim Force of US, French, Canadian and Chilean troops, and on 1 June 2004 it handed over to the UN Stabilization Mission in Haiti (MINUSTAH), led by Brazil, which stayed until 2017. At least 80 people were killed in the revolt, and many more in the reprisals between Lavalas supporters, former soldiers and the police in the months that followed. MINUSTAH fought the gangs of Cité Soleil in 2005–2007, lost its head, Hédi Annabi, and about a hundred of its staff in the earthquake of January 2010, and was blamed for the cholera epidemic that Nepalese peacekeepers brought to Haiti later that year, which killed about 10,000 people; the United Nations apologised in 2016."
