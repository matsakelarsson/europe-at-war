notes:
  - "The Tehrik-i-Taliban Pakistan, founded in 2007, is an umbrella of Pakistani militant groups, separate from the Afghan Taliban but sharing their ideology and allied with them. Other groups in the war included Maulana Fazlullah’s TNSM in Swat, Lashkar-e-Islam in Khyber, the Hafiz Gul Bahadur group in North Waziristan, Jamaat-ul-Ahrar, al-Qaeda and Central Asian fighters, and from 2015 the Islamic State’s Khorasan Province. Pakistan bans the TTP, and the United States and the UN list it as a terrorist organisation. Since 2024 the Pakistani government officially calls it Fitna al-Khawarij."
  - "Casualty figures vary with source and method. The Costs of War project at Brown University estimated in 2021 that about 66,000 people had been killed in Pakistan in the wars linked to Afghanistan since 2001, among them about 24,000 civilians and 9,400 members of the security forces. Millions were displaced, more than three million in 2009 alone. The security forces were accused of extrajudicial killings, enforced disappearances and collective punishment of tribal communities, and the militants of massacres of civilians, minorities and tribal elders."
  - The tribal areas (FATA) were governed separately under colonial-era law until they were merged into Khyber Pakhtunkhwa, then called the North-West Frontier Province, in 2018. The War in Afghanistan (2001–2021) and the Afghanistan–Pakistan conflict that began in 2025 have their own entries.
