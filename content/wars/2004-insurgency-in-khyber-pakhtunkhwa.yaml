        text: An ISIS-K suicide bomber attacked worshippers at a Shia mosque during Friday prayers.
        lonlat: [73.047, 33.684]
      - kind: event
        name: Bannu
        date: 9 May 2026
        text: A car bomb exploded at a security checkpoint, killing at least 21 people.
        lonlat: [70.604, 32.986]
