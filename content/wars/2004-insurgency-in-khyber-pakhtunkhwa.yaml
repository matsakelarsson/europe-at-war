        lonlat: [72.284, 34.791]
      - kind: event
        side: ttp
        name: Kohat
        date: 18 September and 11 November 2026
        text: An assault on the city’s old police lines killed 31 people in September; in November a TTP ambush in the district killed ten policemen.
        lonlat: [71.440, 33.597]
