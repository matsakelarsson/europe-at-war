  - title: The resurgence
    date: 2021–2025
    when: "2023-01-30"
    borders: "2023-01-30"
    countries: [pk, af]
    body:
      - "The Afghan Taliban’s return to power in August 2021 freed TTP prisoners in Afghanistan and, Pakistan says, gave the group a safe haven, which the Taliban deny. Splinter groups rejoined the TTP. Talks brokered by the Afghan Taliban brought a short ceasefire in November 2021 and further talks in 2022, but on 28 November 2022 the TTP declared the ceasefire over. Attacks rose sharply in the former tribal areas and the southern districts of the province, such as Bannu, Lakki Marwat and Dera Ismail Khan."
      - "On 30 January 2023 a suicide bomber killed about 100 people, most of them policemen, in the mosque of the police headquarters in Peshawar. In July 2023 an ISIS-K bomber killed more than 60 people at a political rally in Bajaur. In Kurram, an attack on a convoy of Shia travellers on 21 November 2024 killed more than 40 people and set off weeks of sectarian fighting. By the count of the Centre for Research and Security Studies in Islamabad, 2024 was the deadliest year for Pakistan’s security forces in a decade. Pakistan launched a new campaign, Azm-e-Istehkam, in 2024, and deported hundreds of thousands of Afghans. On 7–8 October 2025 a TTP ambush in Orakzai killed 11 soldiers, among them a lieutenant colonel and a major; two days later Pakistani air strikes in Kabul, aimed at the TTP’s leader, started a border war with Afghanistan."
    facts:
      - [TTP ends ceasefire, "28 November 2022"]
      - [Peshawar police mosque bombing, "30 January 2023"]
      - [Bajaur rally bombing, "30 July 2023"]
      - [Orakzai ambush, "7–8 October 2025"]
