id: insurgency-in-khyber-pakhtunkhwa
name: Insurgency in Khyber Pakhtunkhwa
start: "2004-03-16"
end: ongoing
tier: A
summary: "The war between the Pakistani state and Islamist militants in the north-west of Pakistan, above all the Pakistani Taliban, Tehrik-i-Taliban Pakistan (TTP). It began in 2004, when the army entered the tribal areas on the Afghan border, where Taliban and al-Qaeda fighters had taken refuge after 2001, and grew after the storming of the Red Mosque in Islamabad in 2007 and the founding of the TTP that year. The militants took over the Swat valley until the army drove them out in 2009, and carried out hundreds of suicide bombings across Pakistan, while American drones struck their leaders. Large army offensives in South and North Waziristan in 2009 and 2014 and the national response to the massacre at the Army Public School in Peshawar pushed the TTP into Afghanistan. After the Afghan Taliban returned to power in 2021 it revived, and in 2024–2026 violence rose to its highest level in a decade and spilled into open war between Pakistan and Afghanistan. Tens of thousands of people have been killed and millions displaced."
countries: [pk, af]
