steps:
  - title: Waziristan and the birth of the TTP
    date: 2004–2007
    when: "2004-03-16"
    borders: "2004-03-16"
    countries: [pk, af]
    body:
      - "After the US-led invasion of Afghanistan in 2001, Taliban and al-Qaeda fighters, among them Uzbeks, Chechens and Arabs, took refuge in the tribal areas along the border, where Pakistani law did not reach and local tribesmen sheltered them. Under American pressure the army entered the tribal areas for the first time, and in March 2004 an operation near Wana in South Waziristan met fierce resistance from Wazir tribesmen led by Nek Muhammad. The army made peace with him at Shakai in April; in June he was killed in the first known American drone strike in Pakistan. Further deals with Baitullah Mehsud in South Waziristan in 2005 and with the militants of North Waziristan in 2006 let them tighten their hold, and they killed hundreds of tribal elders who opposed them."
      - "In July 2007 the army stormed the Lal Masjid (Red Mosque) in Islamabad, whose clerics and students had defied the government for months; more than 100 people were killed. Militant groups declared war on the state, and suicide bombings across Pakistan multiplied. In December 2007 some 40 commanders formed the Tehrik-i-Taliban Pakistan under Baitullah Mehsud. On 27 December the former prime minister Benazir Bhutto was killed by a gunman and suicide bomber at a rally in Rawalpindi; the government blamed Baitullah Mehsud, who denied it."
    facts:
      - [Battle of Wana, "16–28 March 2004"]
      - [First US drone strike in Pakistan, "18 June 2004"]
      - [Siege of the Red Mosque, "3–11 July 2007"]
      - [TTP founded, "December 2007"]
