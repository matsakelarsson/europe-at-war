  - title: Bombings and drones
    date: 2010–2014
    when: "2012-10-09"
    borders: "2012-10-09"
    countries: [pk, af]
    body:
      - "The TTP and its allies waged a campaign of suicide bombings in cities across Pakistan against police and soldiers, Shia, Ahmadi and Christian worshippers, Sufi shrines and markets. In the tribal areas American drones struck hundreds of times, most often in North Waziristan, killing many militant leaders; the Bureau of Investigative Journalism counted between about 2,500 and 4,000 people killed by drones in Pakistan from 2004 to 2018, between about 400 and 970 of them civilians. The strikes were deeply unpopular, and relations with the United States sank after American forces killed Osama bin Laden in Abbottabad on 2 May 2011 without telling Pakistan."
      - "On 9 October 2012 a TTP gunman shot the 15-year-old schoolgirl and campaigner for girls’ education Malala Yousafzai in Mingora; she survived and won the Nobel Peace Prize in 2014. A drone killed Hakimullah Mehsud on 1 November 2013, and Fazlullah, who had fled Swat for Afghanistan, became leader of the TTP. In September 2013 suicide bombers killed more than 80 worshippers at All Saints Church in Peshawar. Talks between the government of Nawaz Sharif and the TTP in early 2014 broke down, and on 8 June 2014 militants attacked Karachi’s airport."
    facts:
      - [Bin Laden killed in Abbottabad, "2 May 2011"]
      - [Malala Yousafzai shot, "9 October 2012"]
      - [Hakimullah Mehsud killed, "1 November 2013"]
      - [Karachi airport attack, "8 June 2014"]
