  - title: Swat and South Waziristan
    date: 2007–2009
    when: "2009-05-08"
    borders: "2009-05-08"
    countries: [pk]
    body:
      - "In the Swat valley, a tourist region about 140 km from Islamabad, Maulana Fazlullah of the TNSM, known as “Mullah Radio” for his illegal FM broadcasts, raised a militia that closed and blew up girls’ schools, banned music and killed opponents, leaving bodies in Mingora’s main square. Army operations in 2007–2008 failed. In February 2009 the provincial government agreed to bring in sharia courts in return for peace, and in April President Asif Ali Zardari signed the Nizam-e-Adl regulation. Within days the Taliban pushed south into Buner, about 100 km from the capital."
      - "Under pressure at home and from Washington, the army launched Operation Rah-e-Rast in May 2009. More than two million people fled Swat and the neighbouring districts; the army retook Mingora on 30 May and most of the valley by July, amid reports of extrajudicial killings of suspects. On 5 August a US drone strike killed Baitullah Mehsud, and Hakimullah Mehsud took over the TTP. In October the army attacked the TTP’s heartland in South Waziristan (Operation Rah-e-Nijat). The TTP answered with an attack on army headquarters in Rawalpindi and a car bomb in Peshawar’s Meena Bazaar on 28 October that killed more than 130 people."
    facts:
      - [Nizam-e-Adl regulation, "April 2009"]
      - [Operation Rah-e-Rast, "May – July 2009"]
      - [Baitullah Mehsud killed, "5 August 2009"]
      - [Operation Rah-e-Nijat, "October – December 2009"]
    markers:
      - kind: taken
        side: pk
        name: Mingora
        date: 30 May 2009
        text: The main town of Swat, retaken after street fighting. Most of its people had fled.
        lonlat: [72.361, 34.773]
      - kind: taken
