        lonlat: [70.962, 33.747]
        lp: t
  - title: War on two fronts
    date: 2026
    when: "2026-02-06"
    borders: "2026-11-27"
    countries: [pk, af]
    body:
      - "Last updated 27 November 2026. In 2026 the insurgency became bound up with open war between Pakistan and Afghanistan’s Taliban government, which has its own entry. After an ISIS-K suicide bombing of a Shia mosque in Islamabad killed 31 worshippers on 6 February and further attacks in Bajaur and Bannu, Pakistan struck alleged TTP and ISIS-K camps in Afghanistan on 21–22 February, and on 26 February its defence minister declared “open war” on the Taliban. Pakistan’s mission to the UN said in October that attacks from Afghan territory had killed 4,700 Pakistanis in three years."
      - "Attacks inside the province went on through the year. A car bomb at a checkpoint in Bannu on 9 May killed at least 21 people; on 2 August a suicide attack on the Kabal police station in Swat killed ten civilians and seven policemen; and on 18 September an assault on the Old Police Lines in Kohat, claimed by Ittehad-ul-Mujahideen Pakistan, an alliance with roots in the TTP, killed 31 people and injured more than 100. A vehicle bomb at a checkpost in Dera Ismail Khan killed 12 on 26 September, and on 11 October Pakistan declared a state of emergency in Khyber Pakhtunkhwa."
      - "On 11 November the TTP ambushed police returning from an operation against illegal gold mining in Kohat district; ten policemen and 18 militants were killed in hours of fighting. On 13 November the army said it had killed 74 militants in raids along the Afghan border, and it reported 16 more killed in North Waziristan, two of them Afghans, the next day; on 24 November the police said eight militants had been killed in Peshawar and Bannu. No talks were under way, and the TTP and its allies remained active across the southern and border districts of the province."
    facts:
      - [Islamabad mosque bombing, "6 February 2026, 31 killed"]
      - [Kohat police lines attack, "18 September 2026, 31 killed"]
      - [State of emergency in the province, "from 11 October 2026"]
      - [Kohat ambush, "11 November 2026, 10 police and 18 militants killed"]
    markers:
