        lonlat: [71.578, 34.008]
  - title: Zarb-e-Azb and the school in Peshawar
    date: 2014–2020
    when: "2014-12-16"
    borders: "2014-12-16"
    countries: [pk, af]
    body:
      - "A week after the Karachi airport attack, on 15 June 2014, the army launched Operation Zarb-e-Azb in North Waziristan, the last militant stronghold in the tribal areas. About a million people fled, many of them to Bannu, and the army destroyed the militants’ bases in Miranshah and Mir Ali; it said it had killed thousands of militants, which could not be checked because journalists were barred. Many fighters escaped into Afghanistan."
      - "On 16 December 2014 TTP gunmen attacked the Army Public School in Peshawar and killed 149 people, 132 of them schoolchildren. Pakistan ended its moratorium on executions, set up military courts and adopted a National Action Plan against militancy, and violence fell steeply in the following years. In May 2018 parliament merged the tribal areas into Khyber Pakhtunkhwa. In June 2018 a US drone killed Fazlullah in Afghanistan, and Noor Wali Mehsud became leader of the TTP. From 2018 the Pashtun Tahafuz Movement led large protests against military abuses, disappearances and landmines in the tribal areas."
    facts:
      - [Operation Zarb-e-Azb, "from 15 June 2014"]
      - [Army Public School massacre, "16 December 2014, 149 killed"]
      - [Tribal areas merged into Khyber Pakhtunkhwa, "May 2018"]
    markers:
