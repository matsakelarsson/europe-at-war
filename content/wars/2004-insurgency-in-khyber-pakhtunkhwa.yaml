        lonlat: [71.525, 34.735]
      - kind: event
        name: Kurram
        date: 21 November 2024
        text: Gunmen ambushed a convoy of Shia travellers from Parachinar, setting off sectarian clashes and a months-long blockade of the district.
        lonlat: [70.250, 33.750]
      - kind: event
        side: ttp
        name: Orakzai
