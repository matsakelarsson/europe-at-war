  - title: The M23 takes Goma
    date: April – December 2012
    when: "2012-11-20"
    borders: "2012-11-20"
    countries: [cd, rw, ug]
    body:
      - In April 2012, as Kabila moved against Ntaganda and tried to post former CNDP officers away from the Kivus, hundreds of them deserted with their troops. Led by Colonel Sultani Makenga, they formed the March 23 Movement (M23), named after the 2009 agreement that they accused the government of breaking. On 6 July they took Bunagana on the Ugandan border, and soon most of Rutshuru.
      - A UN Group of Experts reported that Rwanda had armed and recruited for the M23 and that its officers commanded it, and that Uganda had also helped it; both governments denied this, and several donors suspended aid to Rwanda. On 20 November 2012 the M23 entered Goma as the army fled and UN peacekeepers held back. Under regional pressure it withdrew on 1 December, and talks began in Kampala.
    facts:
      - [M23 takes Bunagana, "6 July 2012"]
      - [M23 takes Goma, "20 November 2012"]
      - [M23 leaves Goma, "1 December 2012"]
