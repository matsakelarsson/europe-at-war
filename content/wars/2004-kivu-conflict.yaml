  - title: Rwanda changes sides
    date: January 2009 – 2011
    when: "2009-01-22"
    borders: "2009-03-23"
    countries: [cd, rw]
    body:
      - At the end of 2008 Kinshasa and Kigali made a surprise deal. On 22 January 2009 Nkunda was arrested in Rwanda, where he has been held without trial ever since; his chief of staff Bosco Ntaganda, wanted by the International Criminal Court for crimes in Ituri, took over the CNDP and brought its troops into the army. From 20 January to 25 February some 4,000 Rwandan soldiers joined the Congolese army against the FDLR in Operation Umoja Wetu (“Our Unity”). On 23 March 2009 the government signed agreements with the CNDP and other armed groups that turned the CNDP into a political party.
      - The army, now including former CNDP units, kept up the offensive against the FDLR with UN support in Kimia II (2009) and Amani Leo (2010–2011). The FDLR lost ground but took revenge on villagers, killing at least 96 people at Busurungi in May 2009, and soldiers also killed and raped civilians; Human Rights Watch counted more than 1,400 civilians deliberately killed by both sides between January and September 2009. From 30 July to 2 August 2010 Mai-Mai and FDLR fighters raped some 387 people in villages around Luvungi in Walikale. Former CNDP officers ran parallel chains of command inside the army and grew rich on the mines.
    facts:
      - [Nkunda arrested in Rwanda, "22 January 2009"]
      - [Operation Umoja Wetu, "20 January – 25 February 2009"]
      - [Agreement with the CNDP, "23 March 2009"]
      - [UN mission becomes MONUSCO, "1 July 2010"]
    markers:
