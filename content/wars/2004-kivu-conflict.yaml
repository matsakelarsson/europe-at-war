  - title: The Intervention Brigade defeats the M23
    date: February – December 2013
    when: "2013-11-05"
    borders: "2013-11-05"
    countries: [cd, rw, ug, za, tz, mw]
    body:
      - In February 2013 eleven countries of the region signed the Peace, Security and Cooperation Framework in Addis Ababa. The M23 split, and Ntaganda, defeated by Makenga’s faction, fled to Rwanda and on 18 March surrendered at the US embassy in Kigali, which handed him to the International Criminal Court; he was convicted in 2019 and sentenced to 30 years. On 28 March the UN Security Council created a Force Intervention Brigade of South African, Tanzanian and Malawian troops within MONUSCO, the first UN force mandated to carry out offensive operations against armed groups.
      - Supported by the brigade’s artillery and helicopters, a reorganised Congolese army drove the M23 from the Kibati heights north of Goma in August 2013 and, from late October, from Kiwanja, Rutshuru and Bunagana. With Rwanda under strong American and European pressure, the M23 announced the end of its rebellion on 5 November; its fighters fled into Uganda and Rwanda, and on 12 December the government and the M23 signed declarations in Nairobi.
    facts:
      - [Ntaganda surrenders in Kigali, "18 March 2013"]
      - [Intervention Brigade authorised, "28 March 2013"]
      - [M23 ends its rebellion, "5 November 2013"]
      - [Nairobi declarations, "12 December 2013"]
    markers:
