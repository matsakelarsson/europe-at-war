notes:
  - "When the Kivu conflict began is disputed. Many accounts, like this one, date it from 2004, when the Bukavu crisis broke the settlement that ended the Second Congo War. Others treat the Kivu wars as one conflict over land, citizenship and power that began with the Masisi war of 1993, the arrival of Rwandan Hutu refugees and armed forces in 1994 or the First Congo War in 1996."
  - "Rwanda’s role is contested. UN Groups of Experts documented Rwandan support for the CNDP in 2008 and for the M23 from 2012, and in 2024 estimated that 3,000–4,000 Rwandan soldiers were in eastern Congo; the UN Security Council called on the Rwanda Defence Force to withdraw in February 2025, and the United States sanctioned it in 2026. Rwanda has denied backing the M23, describing its forces near the border as defensive measures, and points to the FDLR, founded by people who took part in the 1994 genocide, and to the Congolese army’s cooperation with it, which UN experts have also documented. The CNDP and the M23 said they were defending Congolese Tutsi and other Kinyarwanda speakers against discrimination and violence."
  - "The Allied Democratic Forces (ADF), which have killed thousands of civilians around Beni in North Kivu and in Ituri since 2014, and the war in Ituri are told separately."
