  - title: Washington, Doha and Uvira
    date: June – December 2025
    when: "2025-12-04"
    borders: "2025-12-10"
    countries: [cd, rw, bi, us, qa]
    body:
      - The United States, which sought access to Congolese minerals, and Qatar led two parallel peace processes. On 27 June 2025 the foreign ministers of the Congo and Rwanda signed a peace agreement in Washington, under which Rwanda was to lift its “defensive measures” and withdraw its troops while the Congo neutralised the FDLR. In Doha the government and the AFC/M23 signed a declaration of principles on 19 July and a framework for a comprehensive peace agreement on 15 November, but the M23 kept the towns it held and both sides accused each other of breaking the ceasefire.
      - On 4 December Tshisekedi and Kagame signed the Washington Accords in the presence of President Donald Trump, together with agreements on critical minerals. Days later the M23 broke through in South Kivu, past Kamanyola towards the Burundian border, and on 10 December took Uvira, where the provincial government had moved after Bukavu fell. More than 500,000 people had been displaced by 11 December, according to the UN, and Burundi, whose troops withdrew, protested that artillery and drone strikes had hit its territory. Under American pressure the M23 announced in mid-December that it would withdraw from Uvira.
    facts:
      - [DRC–Rwanda peace agreement, "27 June 2025"]
      - [Doha framework, "15 November 2025"]
      - [Washington Accords, "4 December 2025"]
      - [M23 takes Uvira, "10 December 2025"]
