  - title: Nkunda’s CNDP at the gates of Goma
    date: 2006 – November 2008
    when: "2008-10-29"
    borders: "2008-11-01"
    countries: [cd, rw]
    body:
      - In 2006 the Congo held its first free elections since 1960, which Joseph Kabila won and RCD-Goma lost. In Masisi and Rutshuru Nkunda built his own army from former RCD soldiers and local recruits, and in July 2006 founded the National Congress for the Defence of the People (CNDP). He presented it as the defender of the Tutsi against the FDLR; critics saw it as a vehicle for Rwandan and local business and land interests. A 2007 scheme to mix his brigades with the army collapsed, and in December 2007 a large army offensive was routed at Mushaki.
      - A peace conference in Goma in January 2008 brought a ceasefire for the CNDP and some twenty other armed groups, but fighting resumed in August. On 26 October the CNDP took the army base at Rumangabo and advanced to the outskirts of Goma, from which government soldiers fled, looting as they went. Nkunda declared a ceasefire on 29 October but went on to take Rutshuru and Kiwanja, where after clashes with pro-government Mai-Mai on 4–5 November his fighters killed about 150 people, while UN peacekeepers less than a kilometre away failed to protect them. More than 250,000 people fled their homes in the autumn of 2008.
      - In December 2008 a UN Group of Experts reported that Rwanda had supported the CNDP and that the Congolese army had fought alongside the FDLR.
    facts:
      - [CNDP founded, "July 2006"]
      - [Army defeat at Mushaki, "December 2007"]
      - [CNDP takes Rumangabo, "26 October 2008"]
      - [Kiwanja killings, "4–5 November 2008"]
