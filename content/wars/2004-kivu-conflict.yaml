  - title: The M23 returns
    date: November 2021 – December 2024
    when: "2022-06-13"
    borders: "2024-12-31"
    countries: [cd, rw, ug, bi, ke, za, mw, tz]
    body:
      - In November 2021 M23 fighters, who had waited in camps in Uganda and Rwanda since 2013 and accused Kinshasa of breaking the Nairobi declarations, attacked army positions in Rutshuru. They took Bunagana on 13 June 2022 and advanced towards Goma. UN experts reported Rwandan troops fighting alongside them, and the Congo expelled Rwanda’s ambassador. The army allied itself with Mai-Mai and other militias, which took the name Wazalendo (“patriots”), and with FDLR units. In late November 2022 the M23 killed at least 171 civilians at Kishishe and nearby villages, according to the UN.
      - A regional force of the East African Community, led by Kenya, deployed from November 2022 and stood between the sides, but Kinshasa accused it of passivity and sent it home in December 2023. A Southern African mission (SAMIDRC) of South African, Malawian and Tanzanian troops replaced it, and Burundi sent thousands of soldiers to fight beside the Congolese army. In December 2023 Corneille Nangaa, former head of the electoral commission, founded the Congo River Alliance (AFC), a political-military coalition built around the M23.
      - In 2024 the M23 closed in on Goma from the west, took the coltan mines of Rubaya in April and Kanyabayonga at the end of June. A UN expert report estimated that 3,000–4,000 Rwandan soldiers were in the Congo, more than the M23’s own fighters. A ceasefire mediated by Angola from August 2024 did not hold, and a summit in Luanda in December was called off.
    facts:
      - [M23 takes Bunagana, "13 June 2022"]
      - [Kishishe killings, "29–30 November 2022"]
      - [East African force leaves, "December 2023"]
      - [M23 takes Rubaya, "April 2024"]
