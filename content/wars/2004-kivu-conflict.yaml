  - title: A war of many armed groups
    date: 2014 – 2021
    when: "2019-01-24"
    borders: "2019-01-24"
    countries: [cd, rw, bi, ug]
    body:
      - With the M23 gone, the army and the UN turned on the FDLR, whose strength fell from several thousand fighters to perhaps one or two thousand; its military commander Sylvestre Mudacumura was killed in September 2019. But the Kivus fragmented. Researchers counted more than 120 armed groups in the two provinces around 2020, from Raia Mutomboki and Nyatura militias to Mai-Mai groups and Burundian rebels, most of them small and local, fighting over land, mines, taxes and customary power, and often working with army officers. Around Beni the ADF killed thousands of civilians.
      - On the high plateaux of South Kivu, around Minembwe, Banyamulenge militias fought Mai-Mai groups of their Bafuliiru, Babembe and Banyindu neighbours and Burundian rebels from 2017, and hundreds of villages were burned. Félix Tshisekedi, who became president in January 2019, sought closer ties with Rwanda and Uganda. In May 2021 he placed North Kivu and Ituri under a state of siege run by military governors, and in November Ugandan troops entered North Kivu to fight the ADF.
    facts:
      - [Tshisekedi becomes president, "24 January 2019"]
      - [FDLR commander Mudacumura killed, "September 2019"]
      - [State of siege in North Kivu and Ituri, "May 2021"]
    link: { href: "#/war/adf-insurgency", text: "The ADF insurgency" }
    markers:
