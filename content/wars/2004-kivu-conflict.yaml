steps:
  - title: The Bukavu crisis
    date: May – December 2004
    when: "2004-06-02"
    borders: "2004-06-02"
    countries: [cd, rw, bi]
    body:
      - The transitional government of 2003 was meant to merge Kinshasa’s army with those of the former rebel movements. Many officers of RCD-Goma, the Rwandan-backed movement that had ruled the Kivus during the war, feared losing their power, and Congolese Tutsi and other Kinyarwanda speakers, whose citizenship had long been questioned, feared reprisals. Rwandan Hutu fighters of the FDLR, among them people who had taken part in the 1994 genocide, still controlled much of the Kivus’ countryside and mines.
      - In late May 2004 Colonel Jules Mutebutsi, the deputy army commander in South Kivu, rose against his commander, and General Laurent Nkunda, a former RCD-Goma officer who had refused a post in the new army, marched on Bukavu from the north. They said they were protecting the Banyamulenge, the Tutsi of South Kivu, from persecution. They took the city on 2 June while UN peacekeepers stood aside, and their troops killed and raped civilians; crowds attacked UN offices in Kinshasa and other cities. Under international pressure the rebels left within a week, Mutebutsi for Rwanda and Nkunda for Masisi in North Kivu.
      - On 13 August 2004 gunmen massacred more than 150 Congolese refugees, most of them Banyamulenge, at the Gatumba camp in Burundi; the Burundian Hutu rebel FNL claimed the attack. In December former RCD units fought the army around Kanyabayonga in North Kivu, while Rwanda threatened to send troops after the FDLR.
    facts:
      - [Mutebutsi rises in Bukavu, "26 May 2004"]
      - [Nkunda and Mutebutsi take Bukavu, "2 June 2004"]
      - [Gatumba massacre, "13 August 2004"]
