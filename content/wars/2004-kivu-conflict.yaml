  - title: Goma and Bukavu fall
    date: January – May 2025
    when: "2025-01-27"
    borders: "2025-02-16"
    countries: [cd, rw, bi, za, mw, tz]
    body:
      - In January 2025 the M23 and Rwandan troops broke through. They took Minova on 21 January, cutting Goma off from the south; North Kivu’s military governor, General Peter Cirimwami, was mortally wounded at the front on 23 January; and on 26–27 January they entered Goma. Thousands of soldiers surrendered or fled, prisoners broke out of the city’s jail, and peacekeepers of the UN and the SADC mission were killed, among them fourteen South Africans. The UN estimated that nearly 3,000 people were killed in the battle for the city.
      - The M23 then advanced south along the western shore of Lake Kivu, took Kavumu airport on 14 February and entered Bukavu on 14–16 February as the army and Burundian troops withdrew. On 21 February the UN Security Council unanimously condemned the offensive and called on the Rwanda Defence Force to withdraw. The AFC/M23 appointed its own governors, police and tax collectors; it took Walikale in March but left it in April, and the SADC mission left Goma through Rwanda in April and May.
      - Kinshasa accused Joseph Kabila, who had left the country in 2023, of backing the rebels. He appeared in Goma in May 2025, and on 30 September a military court sentenced him to death in absentia for treason, war crimes and crimes against humanity, charges he called political.
    facts:
      - [M23 takes Minova, "21 January 2025"]
      - [M23 takes Goma, "26–27 January 2025"]
      - [M23 takes Bukavu, "14–16 February 2025"]
      - [Killed in the battle for Goma, "nearly 3,000 (UN estimate)"]
    markers:
      - kind: taken
        side: m23
        name: Minova
