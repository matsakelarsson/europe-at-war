id: kivu-conflict
name: Kivu conflict
start: "2004-05-26"
end: ongoing
tier: A
summary: "The wars in the provinces of North and South Kivu in the eastern Democratic Republic of the Congo since the end of the Second Congo War. Their roots are older: disputes over land and over the citizenship of Kinyarwanda-speaking Congolese, the presence since 1994 of Rwandan Hutu forces that took part in the genocide, and the Kivus’ wealth in tin, coltan and gold. In 2004 Laurent Nkunda, a Tutsi officer of the former rebel RCD, took up arms; his CNDP fought the government until Rwanda and the Congo made a deal in 2009, and its former officers rebelled again as the M23, which took Goma in 2012 before a UN Intervention Brigade defeated it in 2013. The M23 returned in 2021 with Rwandan backing documented by UN experts; in January and February 2025 it took Goma and Bukavu, and it has kept them despite peace agreements signed in Washington and Doha. More than a hundred other armed groups, the Rwandan Hutu FDLR, Mai-Mai and Wazalendo militias, the Congolese army and foreign forces have also fought in the Kivus. No overall death toll is known; millions of people have been displaced."
countries: [cd, rw, bi, ug, za, mw, tz, ke, us, qa]
