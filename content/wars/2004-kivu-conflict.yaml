  - title: Kabila’s FRN and the war in 2026
    date: January – November 2026
    when: "2026-10-12"
    borders: "2026-11-27"
    countries: [cd, rw, us, qa]
    body:
      - Last updated 27 November 2026. The Congolese army returned to Uvira on 18 January 2026, although residents said M23 police and fighters stayed on, and the M23 kept positions in the hills above the city, where it went on fighting the army and the Wazalendo. On 2 March the United States sanctioned the Rwanda Defence Force and four of its senior commanders for supporting the M23 and demanded the immediate withdrawal of Rwandan troops; Rwanda denies supporting armed groups in the Congo. In August the parties to the Doha talks, with Qatar, the United States, Togo, the African Union Commission and Switzerland, agreed a road map and a mechanism to review its implementation.
      - On 12 October 2026 Joseph Kabila launched a new armed and political coalition in Goma, the Front for the Refoundation of the Nation (FRN), meant to replace the AFC/M23 alliance, with the rebel leaders Corneille Nangaa, Bertrand Bisimwa, Freddy Kaniki and Sultani Makenga as his deputies. The FRN says it succeeded the AFC and took over its commitments, but how the M23 itself fits into it remains unclear. On 26 October the African Union’s Peace and Security Council said that implementation of the Washington and Doha commitments remained limited, and on 28 October the United States also sanctioned Rwanda’s Ministry of Defence and a bank serving its security forces.
      - In early November FRN fighters advanced through the Kahuzi-Biega National Park along the road north-west from Bukavu; conflict monitors reported that on 8 November they took Bitale and the centre of Bulambika, while the army said it had halted them at Bulambika and was preparing a counteroffensive. Goma and Bukavu remained in the hands of the M23 and its allies. According to UNHCR, some 5.3 million people were internally displaced in the Congo at the end of July 2026, most of them in the east.
    facts:
      - [Army returns to Uvira, "18 January 2026"]
      - [US sanctions on the Rwanda Defence Force, "2 March 2026"]
      - [Kabila launches the FRN, "12 October 2026"]
      - [FRN reported to take Bitale and Bulambika, "8 November 2026"]
