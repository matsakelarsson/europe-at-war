  - title: Tak Bai unpunished and the stalled talks
    date: 2024 – November 2026
    when: "2024-10-25"
    borders: "2026-11-27"
    countries: [th, my]
    body:
      - "Last updated 27 November 2026. On 25 October 2024 the twenty-year statute of limitations for the Tak Bai killings expired without anyone having been tried; a court had accepted a case brought by victims’ families against senior officers in August 2024, but none of the accused appeared. Violence rose again in 2025 with shootings and bombings that killed civilians of both faiths, including monks and children. Talks held in Malaysia in December 2025 and January 2026 made little progress, and Bangkok suspended the dialogue in July 2026, the month in which an attack on a checkpoint in Narathiwat killed five soldiers; the government’s new chief negotiator, the intelligence chief Thanut Suvarnananda, appointed in May, said in August that Thailand was ready to change its approach and would consider decentralised government and amnesties, though not independence."
      - "In September 2026 a BRN spokesman told AFP that the movement still sought independence, but proposed a transitional arrangement in which it would govern the region for five to ten years, with Islamic courts and police for Muslims, before a democratic handover; he spoke of possible back-channel talks. Malaysia, the facilitator since 2013, said it was considering a new facilitator. More than 7,000 people have been killed since 2004. Whether formal talks will resume, and on what basis, is uncertain."
    facts:
      - [Tak Bai statute of limitations expires, "25 October 2024"]
      - [Dialogue suspended by Thailand, "July 2026"]
      - [Dead since 2004, "more than 7,000"]
