id: south-thailand-insurgency
name: South Thailand insurgency
start: "2004-01-04"
end: ongoing
tier: B
summary: "The armed struggle of Malay Muslim separatists in Thailand’s Deep South, the provinces of Pattani, Yala and Narathiwat and four districts of Songkhla, the lands of the old sultanate of Patani, which Siam conquered in 1785 and annexed outright in 1902. Separatist movements had fought the Thai state from the 1960s to the 1990s; the present conflict began with a raid on an army depot in Narathiwat on 4 January 2004 and grew through the killings at the Krue Se mosque and at Tak Bai that year. A secretive network led by the Barisan Revolusi Nasional (BRN) has waged a campaign of shootings and bombings against soldiers, police, officials, teachers and Buddhist and Muslim civilians, while the security forces have ruled the region under martial law and an emergency decree, with arrests, disappearances and torture documented by human rights groups. Talks facilitated by Malaysia since 2013 have not ended the violence. More than 7,000 people have been killed since 2004."
countries: [th, my]
