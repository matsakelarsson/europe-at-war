steps:
  - title: Patani and the killings of 2004
    date: 1785 – October 2004
    when: "2004-01-04"
    borders: "2004-10-25"
    countries: [th, my]
    body:
      - "The Malay sultanate of Patani, a trading state on the Gulf of Thailand, was conquered by Siam in 1785, split into seven provinces in the 19th century, and brought under direct rule in 1902; the Anglo-Siamese treaty of 1909 confirmed the border with British Malaya. Policies of Thai assimilation under Phibun Songkhram in the 1930s and 1940s, which pressed the Malays to give up their language, dress and Islamic courts, bred resistance. The religious leader Haji Sulong, who petitioned for autonomy, was arrested in 1948 and disappeared in police custody in 1954. Armed movements, among them the BRN (founded in 1963) and PULO (1968), fought from the 1960s, until amnesties and development under Prem Tinsulanonda’s government in the 1980s brought relative calm."
      - "On 4 January 2004, after the government of Thaksin Shinawatra had dissolved the region’s civilian-military administration, armed men raided the depot of an army development battalion in Cho-airong district of Narathiwat, killed four soldiers and carried off some 400 weapons, while schools across the province were burned. On 28 April 2004 groups of young men, most armed only with knives, attacked eleven police and army posts in Pattani, Yala and Songkhla; 106 attackers were killed, 32 of them in Pattani’s historic Krue Se mosque, which troops stormed after a siege, and five members of the security forces died. On 25 October 2004, at Tak Bai in Narathiwat, troops broke up a protest outside the police station: seven men were shot dead, and 78 of some 1,300 arrested men, stacked in layers in army trucks for the five-hour drive to a camp in Pattani, suffocated or were crushed to death."
    facts:
      - [Raid on the army depot, "4 January 2004"]
      - [Attacks of 28 April 2004, "106 attackers killed, 32 at Krue Se"]
      - [Tak Bai, "25 October 2004, 85 dead"]
