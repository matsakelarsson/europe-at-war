  - title: The long insurgency and the talks
    date: 2005–2024
    when: "2005-07-15"
    borders: "2013-02-28"
    countries: [th, my]
    body:
      - "From 2004 the region was under martial law, and from July 2005 under an emergency decree that allowed detention without charge; tens of thousands of soldiers, police, rangers and armed village volunteers were deployed. Violence peaked in 2007, when more than 800 people were killed. The BRN’s fighters shot and bombed soldiers and police, but also teachers, officials, monks, rubber tappers and Muslims they saw as collaborators; Buddhists left many villages. Bombs in markets, hotels and karaoke bars killed civilians in Yala, Sungai Kolok and Hat Yai. Human rights groups documented torture and disappearances in army custody, and killings of Muslims blamed on paramilitaries, such as the shooting of ten worshippers in the al-Furqan mosque in Cho-airong in June 2009; few cases reached the courts."
      - "On 28 February 2013 in Kuala Lumpur, a Thai security official and a BRN representative signed a “general consensus” to begin a dialogue facilitated by Malaysia. The talks were suspended after the coup of 2014, resumed with the umbrella group MARA Patani in 2015–2019, and from 2020 were held directly with the BRN. Violence fell to under 200 deaths a year in the 2020s, but attacks continued, and in 2024 the two sides discussed a joint plan for a ceasefire and public consultations without agreeing on it."
    facts:
