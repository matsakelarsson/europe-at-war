notes:
  - The BRN has never claimed most of its attacks and works through cells of village fighters (the RKK). Other groups, among them the Patani United Liberation Organisation (PULO) and the Islamic Mujahideen Movement of Patani (GMIP), have taken part, and from 2015 several of them, with a faction of the BRN, formed the umbrella group MARA Patani for talks with the government. The BRN calls its aim the independence or self-determination of Patani; the Thai government rules out any change to the country’s unity but has discussed autonomy-like decentralisation.
  - "Casualty counts differ. The monitoring group Deep South Watch counts more than 7,000 people killed and some 14,000 injured from 2004 to 2026, among them members of the armed movements, soldiers, police, defence volunteers and civilians of both faiths; Reuters has given more than 7,800 dead."
