id: chadian-civil-war-2005
name: Chadian Civil War (2005–2010)
start: "2005-12-18"
end: "2010-01-15"
tier: B
summary: "A war between the government of President Idriss Déby and rebel movements based in Darfur, fought alongside the war in Darfur as a proxy war between Chad and Sudan. Déby, who had taken power in 1990, faced defections from his own Zaghawa clan and army over his support for the Darfur rebels and over a constitutional change of 2005 that let him stand for a third term. Sudan armed and sheltered the Chadian rebels, while Chad backed the Darfur rebels of the Justice and Equality Movement (JEM). Rebel columns of pickup trucks crossed Chad from the Sudanese border and reached N’Djamena twice: in April 2006, when the United Front for Democratic Change was beaten back at the National Assembly, and in February 2008, when a coalition of the UFDD, UFDD-F and RFC broke into the capital and besieged Déby in his palace before withdrawing. France helped the government with intelligence, logistics and the evacuation of foreigners. In eastern Chad, where about 250,000 refugees from Darfur lived in camps, militias and rebels raided villages and some 170,000 Chadians were displaced; a European Union force and then a UN mission protected the camps in 2008–2010. After a last rebel offensive was crushed at Am Dam in May 2009, Chad and Sudan signed an agreement on 15 January 2010 to stop backing each other’s rebels."
