notes:
  - "The rebel movements: the Rally for Democracy and Liberty (RDL) and the United Front for Democratic Change (FUC) of Mahamat Nour Abdelkerim; the Union of Forces for Democracy and Development (UFDD) of Mahamat Nouri and its breakaway, the UFDD-Fondamentale of Abdelwahid Aboud Mackaye; the Rally of Forces for Change (RFC) of Timan Erdimi, a nephew of Déby; and from 2009 the Union of Resistance Forces (UFR) that brought most of them together. Several were led by former ministers and officers of Déby’s own government."
  - Casualty figures are uncertain. The Uppsala Conflict Data Program counts about 540 deaths in the battle of N’Djamena in 2008; some estimates put the dead of the whole war at about 7,000.
