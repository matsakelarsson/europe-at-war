steps:
  - title: Adré and the first battle of N’Djamena
    date: December 2005 – 2007
    when: "2005-12-18"
    borders: "2006-04-13"
    countries: [td, sd, cf]
    body:
      - "When the war in Darfur broke out in 2003, the Zaghawa, Déby’s own people, who live on both sides of the border, were among the main Darfur rebels, and many of Déby’s officers and kinsmen wanted Chad to back them openly. Others resented his growing reliance on family members and his plan, approved in a referendum in June 2005, to remove the limit on presidential terms. Through 2005 soldiers and officers deserted to the east, and Sudan, which accused Chad of arming the JEM, gave them bases in Darfur. On 18 December 2005 the Rally for Democracy and Liberty attacked Adré on the border; it was driven off, and Chad declared a “state of belligerence” with Sudan."
      - "Mahamat Nour Abdelkerim united several groups in the United Front for Democratic Change (FUC). In April 2006 its columns of pickup trucks drove some 1,000 km from Darfur, partly through the north of the Central African Republic, and in the early hours of 13 April entered N’Djamena, hoping to stop the presidential election set for 3 May. Government troops beat them back at the National Assembly; by official figures some 370 rebels and 30 soldiers were killed and 271 rebels captured, and the prisoners were shown to the public in the Place de l’Indépendance. Chad broke off relations with Sudan, and Déby won a third term on 3 May. Nour made peace in December 2006 and became defence minister, until he was dismissed a year later."
      - "In the east, Janjaweed militias from Darfur and Chadian Arab militias raided villages of the Dajo and other peoples in 2006–2007, killing hundreds and driving tens of thousands from their homes, while some 250,000 Darfur refugees lived in camps near the border."
