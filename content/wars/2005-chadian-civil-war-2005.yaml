  - title: EUFOR, Am Dam and peace with Sudan
    date: 2008 – January 2010
    when: "2008-03"
    borders: "2009-05-07"
    countries: [td, sd, cf]
    body:
      - "From March 2008 the European Union’s EUFOR Tchad/RCA, some 3,700 troops, more than half of them French, with Irish, Polish, Swedish, Austrian and other contingents, protected the refugee camps and aid routes in eastern Chad and the north-east of the Central African Republic. It handed over to the UN mission MINURCAT in March 2009. The proxy war went on: in May 2008 the JEM drove from Chad to Omdurman, across the Nile from Khartoum, and Sudan blamed Déby."
      - "In January 2009 the rebel groups joined in the Union of Resistance Forces (UFR) under Timan Erdimi. Its offensive from Darfur was met by the army on 7 May 2009 at Am Dam, south of Abéché, and broken; the government said 225 rebels and 22 soldiers had been killed. Mediation by Libya and Qatar, and the cost of the war to both governments, led to an agreement signed on 15 January 2010 by which Chad and Sudan stopped supporting each other’s rebels and formed a joint border force. The border reopened, Déby visited Khartoum in February 2010, many rebels came home under an amnesty, and MINURCAT left at the end of 2010."
    facts:
