  - title: The battle of N’Djamena, 2008
    date: 28 January – 4 February 2008
    when: "2008-02-02"
    borders: "2008-02-02"
    countries: [td, sd, fr, cm]
    body:
      - "At the end of January 2008 a coalition of some 2,000 fighters of the UFDD of Mahamat Nouri, the UFDD-Fondamentale and Timan Erdimi’s RFC set out from the Sudanese border in about 250–300 vehicles, days before a European force was due to deploy in eastern Chad. They took Oum Hadjer on 30 January, and on 1 February at Massaguet, some 50 km north-east of the capital, they defeated the army in a battle in which its chief of staff, General Daoud Soumain, was killed."
      - "On the morning of 2 February the rebels entered N’Djamena in two columns. They took much of the city and surrounded the presidential palace, where Déby refused French offers to fly him out, but tanks and helicopters held them off, and fighters of the JEM reportedly fought on the government side. On 3 February the rebels withdrew to the outskirts, and after a last clash they pulled back east. France’s forces in Chad guarded the airport, evacuated some 1,300 foreigners and gave the army intelligence; reports that they did more were denied. On 4 February the UN Security Council called on member states to support the government."
      - "The Red Cross counted at least 160 civilians killed and more than 1,000 wounded, and some 30,000 people fled across the river to Cameroon; overall estimates of the dead range from several hundred to about 700. After the battle the opposition leader Ibni Oumar Mahamat Saleh was arrested by soldiers and never seen again, and in August 2008 a court sentenced rebel leaders, along with the former president Hissène Habré, to death in their absence."
    facts:
