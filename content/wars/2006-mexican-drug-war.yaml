  - title: Los Zetas and the north-east
    date: 2010–2013
    when: "2011-08-25"
    borders: "2011-08-25"
    countries: [mx, us]
    body:
      - "Early in 2010 Los Zetas broke with the Gulf Cartel after a Gulf gunman killed one of their commanders in Reynosa, and war spread across Tamaulipas, Nuevo León, Coahuila and Veracruz. The Gulf Cartel allied with the Sinaloa Cartel and La Familia Michoacana. The Zetas, led by Heriberto Lazcano and Miguel Ángel Treviño Morales, ran their territories by terror and lived off extortion, kidnapping and fuel theft as well as drugs. Highways in Tamaulipas became deadly: in August 2010 the Zetas killed 72 migrants from Central and South America at a ranch near San Fernando, and in April 2011 mass graves around the town yielded 193 bodies, many of them bus passengers taken off the road. In March 2011 Zetas gunmen took revenge on suspected informers in the town of Allende, Coahuila, killing dozens of people; some estimates reach 300."
      - "Monterrey, Mexico’s industrial capital, became a battleground. On 25 August 2011 Zetas gunmen set fire to the Casino Royale, killing 52 people, and in May 2012 the bodies of 49 people were dumped on the highway at Cadereyta. In Veracruz a group calling itself the Matazetas, linked to the new Jalisco New Generation Cartel, dumped 35 bodies in Boca del Río in September 2011. Navy marines killed Lazcano near Progreso, Coahuila, on 7 October 2012 (his body was stolen from a funeral home), and captured Treviño near Nuevo Laredo in July 2013. Los Zetas then broke into factions, among them the Northeast Cartel."
    facts:
      - [San Fernando massacre, "August 2010, 72 migrants killed"]
      - [Casino Royale fire, "25 August 2011, 52 killed"]
      - [Heriberto Lazcano killed, "7 October 2012"]
