  - title: El Chapo and Ayotzinapa
    date: 2012–2017
    when: "2014-09-26"
    borders: "2014-09-26"
    countries: [mx, us]
    body:
      - "Enrique Peña Nieto of the PRI took office on 1 December 2012 promising to talk less about cartels and to reduce violence, and homicides fell for two years. On 22 February 2014 navy marines, acting on American intelligence, captured El Chapo Guzmán in Mazatlán. On 11 July 2015 he escaped from the Altiplano maximum-security prison through a tunnel about 1.5 km long dug to the shower in his cell. Marines caught him again in Los Mochis on 8 January 2016, and on 19 January 2017 he was extradited to the United States, where a New York court convicted him in 2019 and sentenced him to life imprisonment."
      - "On the night of 26–27 September 2014 municipal police in Iguala, Guerrero, working with the Guerreros Unidos gang, an offshoot of the Beltrán Leyva organisation, attacked students of the Ayotzinapa rural teachers’ college who had taken buses to travel to a demonstration. Six people were killed and 43 students disappeared. The attorney general’s “historical truth”, that the gang had burned their bodies at a rubbish dump in Cocula, was rejected by independent experts of the Inter-American Commission on Human Rights, and a government truth commission called it a “crime of the state” in 2022, implicating soldiers and officials at every level; the remains of only three students have been identified. The same year soldiers killed 22 people at Tlatlaya in the State of Mexico, at least 12 of them after they had surrendered. From 2015 the killing rose again, and 2017 was the most violent year recorded until then."
    facts:
      - [El Chapo captured, "22 February 2014"]
      - [Ayotzinapa students disappeared, "26–27 September 2014, 43 students"]
      - [El Chapo escapes, "11 July 2015"]
      - [El Chapo extradited, "19 January 2017"]
