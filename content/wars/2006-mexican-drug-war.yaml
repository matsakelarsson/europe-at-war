  - title: The death of El Mencho and the war today
    date: 2026
    when: "2026-11-20"
    borders: "2026-11-20"
    countries: [mx, us]
    body:
      - "Last updated 27 November 2026. On 22 February 2026 army special forces, with American intelligence support, raided a house in a gated estate at Tapalpa in the mountains of Jalisco; El Mencho was badly wounded trying to escape and died in the helicopter flying him out, and several of his guards were killed. Within hours the CJNG set up some 250 roadblocks with burning vehicles in 20 states, attacked the National Guard with car bombs and gunfire and freed 23 inmates from a prison in Puerto Vallarta; more than 70 people died in the violence, among them 25 National Guard members, but it was over within days. By most accounts the CJNG passed to El Mencho’s stepson, Juan Carlos Valencia González, “El 03”, without the infighting seen in Sinaloa; a rival for the succession, Audias Flores Silva, was captured on 27 April."
      - "In Sinaloa the war between the cartel’s factions went on: the state prosecutor counted 169 homicides in October 2026, the highest monthly figure of the year. On 20 November 2026 special forces captured Fausto Isidro Meza Flores, “El Chapo Isidro”, head of the Beltrán Leyva organisation and an ally of La Mayiza, in Guasave, with the help of American intelligence; by the army’s count four soldiers and seven gunmen were killed, and his men burned vehicles, petrol stations and shops across northern Sinaloa that night. The attorney general, Ernestina Godoy, said on 23 November that he would be tried in Mexico, but her office then said that an American extradition request remained open."
      - "Nationally, homicides fell: INEGI’s final count for 2025, published in November 2026, was 29,488, down about 12 per cent and the lowest since 2016, and the government said the daily rate of killings had fallen by about 40 per cent between September 2024 and the end of 2025, although disappearances and extortion did not decline and the official figures are disputed. Mexico had sent nearly 100 cartel figures to the United States, and Sheinbaum accepted American surveillance flights and intelligence while rejecting Donald Trump’s repeated threats of American strikes on Mexican soil. Analysts warned that arrests of leaders had again fragmented the cartels without breaking their hold on businesses, local politicians and much of the country."
    facts:
      - [El Mencho killed at Tapalpa, "22 February 2026"]
      - [Roadblocks after his death, "about 250 in 20 states"]
      - [El Chapo Isidro captured in Guasave, "20 November 2026"]
      - [Homicides in 2025, "29,488 (INEGI, final count)"]
