id: mexican-drug-war
name: Mexican drug war
start: "2006-12-11"
end: ongoing
tier: A
summary: "The armed conflict between the Mexican state and the drug-trafficking organisations known as cartels, and among the cartels themselves, since President Felipe Calderón sent the army against them in Michoacán on 11 December 2006. Mexican traffickers had grown rich smuggling Colombian cocaine, and later methamphetamine and fentanyl, into the United States, long protected by corrupt officials. Calderón’s offensive, backed by the United States through the Mérida Initiative, captured or killed many leaders, but the big organisations split and fought each other for routes and towns: the Sinaloa Cartel against the Juárez, Tijuana and Beltrán Leyva organisations, the Gulf Cartel against its former enforcers, Los Zetas, and later the fast-growing Jalisco New Generation Cartel (CJNG) against nearly everyone. Cartels moved into extortion, kidnapping, fuel theft and the control of local governments, and the violence was marked by massacres, mass graves and the disappearance of tens of thousands of people, among them the 43 students of Ayotzinapa in 2014. Neither Enrique Peña Nieto’s policies nor Andrés Manuel López Obrador’s “hugs, not bullets” brought the killing down: Mexico recorded more than 30,000 homicides a year from 2018 to 2024. In 2024 the abduction of the Sinaloa Cartel’s co-founder Ismael “El Mayo” Zambada to the United States set off a war inside the cartel, and under President Claudia Sheinbaum, pressed by the Trump administration, which designated the main cartels as terrorist organisations, the army killed the CJNG’s leader, Nemesio Oseguera, “El Mencho”, in February 2026. Homicides fell in 2025 to about 29,500, the fewest since 2016, but disappearances did not, and more than 130,000 people are registered as missing. How many of the dead since 2006 were killed in the drug war is disputed; estimates of all homicides in the period run to several hundred thousand."
countries: [mx, us]
sides:
  - id: mx
    name: Mexican government (the army, the navy, the Federal Police and, from 2019, the National Guard), with American intelligence and aid
    polities: [mexico]
    ink: green
    moves: Government moves
    success: Government success
  - id: cart
    name: Drug cartels (Sinaloa, Gulf, Los Zetas, Juárez, Tijuana, Beltrán Leyva, La Familia Michoacana and the Knights Templar, the Jalisco New Generation Cartel and others), fighting the state and each other
    polities: [mexican-cartels]
    ink: magenta
    moves: Cartel moves
    success: Cartel success
  - id: auto
    name: Self-defence groups (autodefensas) of Michoacán
    polities: [autodefensas]
    ink: teal
    moves: Autodefensa moves
    success: Autodefensa success
notes:
  - "There is no official count of deaths in the drug war. Mexico’s statistics office (INEGI) counts all homicides, of which there were roughly 350,000–400,000 from 2006 to 2021 by common estimates, more than 30,000 a year from 2018 to 2024 and 29,488 in 2025 by its final count, published in November 2026 (the preliminary count had been 27,989); researchers disagree on how many were linked to organised crime, with estimates from about a third to more than half. The national register of missing persons listed some 130,000 people still missing in March 2026, most of them since 2006; the government said a third of them might be alive, which families and human rights groups disputed. Critics also say that falling homicide figures partly reflect killings recorded as disappearances or other deaths."
  - "Cartels are not fixed organisations but shifting networks of factions, allies and local gangs, and the names used here are the ones most often given in the sources. Most of the guns used by the cartels are smuggled from the United States: about 70 per cent of the firearms recovered in Mexico and traced in the 2010s had been bought or made there. Security forces have also been accused of many abuses, among them extrajudicial killings, torture and disappearances, and several senior officials have been convicted of working for cartels, among them Calderón’s security minister, Genaro García Luna, in the United States in 2023."
