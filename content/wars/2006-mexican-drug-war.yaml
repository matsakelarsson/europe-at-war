  - title: Ciudad Juárez and the wars between cartels
    date: 2008–2011
    when: "2010-01-31"
    borders: "2010-01-31"
    countries: [mx, us]
    body:
      - "In January 2008 the Sinaloa Cartel moved to take Ciudad Juárez, the busiest crossing for drugs into Texas, from the Juárez Cartel and its enforcers, La Línea, and the city’s street gangs took sides. In March the government sent in the army in Joint Operation Chihuahua, and later thousands of federal police, but the killing grew: Juárez, a city of about 1.3 million, recorded about 1,600 murders in 2008 and more than 3,000 in 2010, when it was counted among the most violent cities in the world. On 31 January 2010 gunmen killed 15 people, most of them teenagers, at a party in the Villas de Salvárcar district. Calderón’s first remark, linking the victims to gangs, caused outrage, and his government launched a social programme for the city. By 2012 the Sinaloa Cartel had largely won, and the killing in Juárez fell steeply."
      - "Elsewhere the Sinaloa organisation split. After Alfredo Beltrán Leyva was arrested in Culiacán in January 2008, his brothers blamed Guzmán, broke away and fought the Sinaloa Cartel in Sinaloa, Sonora, Guerrero and Morelos; their gunmen killed the acting head of the Federal Police, Édgar Millán, in Mexico City in May 2008. On 16 December 2009 navy marines killed Arturo Beltrán Leyva in a gun battle at an apartment block in Cuernavaca. In Tijuana a faction under Teodoro García Simental fought the Arellano Félix family until his capture in January 2010. Nationwide, homicides more than doubled between 2007 and 2010."
    facts:
      - [Joint Operation Chihuahua, "from March 2008"]
      - [Murders in Ciudad Juárez, "about 1,600 in 2008, more than 3,000 in 2010"]
      - [Villas de Salvárcar massacre, "31 January 2010, 15 killed"]
      - [Arturo Beltrán Leyva killed, "16 December 2009"]
