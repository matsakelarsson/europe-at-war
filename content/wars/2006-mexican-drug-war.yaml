  - title: “Hugs, not bullets”
    date: 2018–2024
    when: "2019-10-17"
    borders: "2019-10-17"
    countries: [mx, us]
    body:
      - "Andrés Manuel López Obrador took office on 1 December 2018 promising “hugs, not bullets” (abrazos, no balazos): to attack the causes of crime with social programmes rather than leaders with soldiers. He created a National Guard in 2019 out of military and federal police units, placed under the army’s control in 2024, and gave the armed forces a larger role than ever, while arrests of cartel leaders became rarer. On 17 October 2019 soldiers detained El Chapo’s son Ovidio Guzmán in Culiacán; Sinaloa Cartel gunmen took over the city, blocking roads and besieging a housing complex for soldiers’ families, and the government released him to end the fighting. On 4 November 2019 gunmen killed three women and six children of the LeBarón and Langford families, Mexican-American Mormons, on a road near Bavispe in Sonora. In June 2020 CJNG gunmen ambushed Mexico City’s police chief, Omar García Harfuch, who survived; two of his bodyguards and a passer-by were killed."
      - "On 5 January 2023 troops captured Ovidio Guzmán again near Culiacán; 29 people, among them 10 soldiers, were killed in the fighting, and he was extradited to the United States in September. Synthetic opioids made in Mexico from Chinese chemicals, above all fentanyl, were by then killing some 70,000 people a year in the United States, and American pressure on Mexico grew. Homicides stayed above 30,000 a year by official counts, while the number of people registered as disappeared climbed, and mothers’ search collectives (madres buscadoras) dug up clandestine graves across the country."
    facts:
      - [National Guard created, "2019"]
      - [First Culiacanazo, "17 October 2019"]
      - [LeBarón massacre, "4 November 2019"]
      - [Ovidio Guzmán captured, "5 January 2023"]
