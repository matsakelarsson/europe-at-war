steps:
  - title: Calderón sends in the army
    date: December 2006 – 2008
    when: "2006-12-11"
    borders: "2006-12-11"
    countries: [mx, us]
    body:
      - "Mexican smugglers had moved marijuana and opium across the border for decades. In the 1980s, as the United States closed the Caribbean routes of the Colombian cartels, the Guadalajara cartel of Miguel Ángel Félix Gallardo took over much of the cocaine trade. After his arrest in 1989 the business was divided among regional organisations: the Arellano Félix family in Tijuana, the Carrillo Fuentes family in Ciudad Juárez, the Gulf Cartel in Tamaulipas, and the Sinaloa traffickers led by Joaquín “El Chapo” Guzmán and Ismael “El Mayo” Zambada. Under the long rule of the Institutional Revolutionary Party (PRI) they worked under the protection of police, military and political officials. With the end of one-party rule in 2000 those arrangements frayed. Guzmán escaped from prison in 2001, the Sinaloa traffickers fought the Gulf Cartel and its enforcers, Los Zetas, a group founded by deserters from the army’s special forces, for Nuevo Laredo, and in Michoacán La Familia Michoacana announced itself in September 2006 by rolling five severed heads onto a dance floor in Uruapan."
      - "Felipe Calderón of the National Action Party took office on 1 December 2006 after a narrowly won and bitterly disputed election. Ten days later he launched Operation Michoacán, sending about 6,500 soldiers, marines and federal police to the Tierra Caliente of his home state. Further operations followed in Baja California, Guerrero, the Golden Triangle of Sinaloa, Chihuahua and Durango, Nuevo León and Tamaulipas, and by the end of his term some 45,000–50,000 troops were deployed. His government pursued a “kingpin strategy” of capturing or killing cartel leaders and extradited dozens to the United States, which pledged US$1.6 billion over three years for aircraft, equipment and training under the Mérida Initiative, announced in October 2007. The removal of leaders split the organisations into rival factions, and violence rose sharply in 2008."
    facts:
      - [Operation Michoacán, "launched 11 December 2006"]
      - [Troops deployed under Calderón, "about 45,000–50,000 at the peak"]
      - [Mérida Initiative, "announced October 2007, US$1.6 billion for 2008–2010"]
