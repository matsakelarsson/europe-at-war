  - title: The war inside the Sinaloa Cartel
    date: July 2024 – 2025
    when: "2024-09-09"
    borders: "2024-09-09"
    countries: [mx, us]
    body:
      - "On 25 July 2024 a small plane landed at Santa Teresa, New Mexico, carrying Joaquín Guzmán López, one of El Chapo’s sons, and Ismael “El Mayo” Zambada, who had run the Sinaloa Cartel for half a century without being caught. Both were arrested by American agents. Zambada said he had been kidnapped and flown out against his will, and the Mexican government accused Washington of interfering. On 9 September 2024 war broke out in Culiacán between Los Chapitos, El Chapo’s sons Iván Archivaldo and Jesús Alfredo Guzmán, and La Mayiza, Zambada’s followers led by his son Ismael Zambada Sicairos. Bodies were left on streets and highways, schools and businesses closed, and the government sent thousands of troops; by the autumn of 2026 about 23 per cent of the country’s soldiers were deployed in Sinaloa. Los Chapitos were reported to have allied with the CJNG. Zambada pleaded guilty in New York in August 2025 and was sentenced to life imprisonment."
      - "Claudia Sheinbaum took office on 1 October 2024 with Omar García Harfuch as security minister and a strategy of intelligence and arrests. Under threat of American tariffs and military action from the second Trump administration, Mexico sent 10,000 National Guard troops to the northern border in February 2025, and on 20 February the United States designated the Sinaloa Cartel, the CJNG and four other Mexican groups as foreign terrorist organisations. Mexico sent 29 jailed cartel figures to the United States on 27 February 2025, among them Rafael Caro Quintero, and 26 more in August. In March 2025 a search collective found a ranch at Teuchitlán, Jalisco, used by the CJNG for recruiting and training, where they found burned remains and hundreds of shoes, a discovery that shocked the country."
    facts:
      - [El Mayo Zambada arrested in the United States, "25 July 2024"]
      - [War begins in Culiacán, "9 September 2024"]
      - [US designates cartels as terrorist organisations, "20 February 2025"]
      - [Cartel figures sent to the United States, "29 in February and 26 in August 2025"]
