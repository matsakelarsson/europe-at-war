  - title: The rise of the Jalisco New Generation Cartel
    date: 2010–2019
    when: "2015-05-01"
    borders: "2015-05-01"
    countries: [mx, us]
    body:
      - "The Jalisco New Generation Cartel (CJNG) grew out of the Sinaloa Cartel’s organisation in Jalisco after its local boss, Ignacio Coronel, was killed by soldiers in July 2010. Under Nemesio Oseguera, “El Mencho”, a former police officer from Michoacán, it expanded faster than any rival, trafficking methamphetamine and later fentanyl, publishing videos of its armed men and fighting the Sinaloa Cartel, the Zetas, the Knights Templar and many local groups. On 6 April 2015 it killed 15 state police in an ambush at San Sebastián del Oeste. On 1 May 2015, during an operation to capture El Mencho near Villa Purificación, its gunmen shot down an army helicopter with a rocket-propelled grenade, killing at least six soldiers, and blocked dozens of roads in and around Guadalajara with burning buses and lorries."
      - "By the end of the decade the CJNG operated in most Mexican states and on several continents. In Guanajuato its war with the Santa Rosa de Lima Cartel, which lived off fuel stolen from the state oil company’s pipelines, made the industrial state the deadliest in the country. Nationwide, homicides reached a new record of more than 33,000 in 2018 by the government’s count, and stayed near that level for several years."
    facts:
