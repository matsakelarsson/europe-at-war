  - title: Michoacán, the Knights Templar and the autodefensas
    date: 2011–2015
    when: "2014-01-13"
    borders: "2014-01-13"
    countries: [mx]
    body:
      - "In Michoacán, La Familia Michoacana gave way in 2011 to the Knights Templar Cartel, led by Servando Gómez, “La Tuta”, and Nazario Moreno, its quasi-religious founder. The Templarios controlled much of the state: they took a share of the harvests of limes and avocados, ran the export of illegally mined iron ore to China through the port of Lázaro Cárdenas and dominated many town halls. On 24 February 2013 farmers and ranchers in Tepalcatepec, led by the doctor José Manuel Mireles, and in La Ruana, led by the lime grower Hipólito Mora, took up arms as self-defence groups (autodefensas). Within a year they had driven the Templarios out of dozens of towns in the Tierra Caliente."
      - "In January 2014, as the autodefensas closed in on Apatzingán, the federal government sent in thousands of troops and named a commissioner for Michoacán, Alfredo Castillo, and on 27 January agreed to bring the groups under the law; in May many were sworn in as a Rural Defence Force. Marines killed Nazario Moreno on 9 March 2014, and La Tuta was captured in Morelia on 27 February 2015. The movement fractured: Mireles was jailed in June 2014, some groups were infiltrated by criminals, and new gangs, among them Los Viagras and the CJNG, moved in. The security forces were accused of killings of their own: federal police killed 16 people in Apatzingán on 6 January 2015, and at a ranch near Tanhuato on 22 May 2015 police killed 42 suspected CJNG members, 22 of whom the National Human Rights Commission found had been executed."
    facts:
      - [First autodefensas, "24 February 2013, Tepalcatepec and La Ruana"]
      - [Federal commissioner for Michoacán, "January 2014"]
      - [Nazario Moreno killed, "9 March 2014"]
      - [La Tuta captured, "27 February 2015"]
