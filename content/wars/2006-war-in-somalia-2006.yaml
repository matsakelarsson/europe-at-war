steps:
  - title: The Ethiopian intervention
    date: December 2006 – January 2007
    when: "2006-12-24"
    borders: "2007-01-01"
    countries: [so, et, us]
    body:
      - "By December 2006 the Islamic Courts held Mogadishu and most of the south, and the Transitional Federal Government only Baidoa, guarded by Ethiopian troops. The Courts’ hardliners called for jihad against Ethiopia, and on 13 December they gave the Ethiopians a week to leave. Fighting began around Baidoa on 20 December at Idale and Daynuunay, and on 24 December Ethiopia’s prime minister, Meles Zenawi, announced that his country was at war with the Courts. Ethiopian jets bombed Mogadishu’s airport and Beledweyne, and tanks and infantry broke the Courts’ lines around Baidoa, where hundreds of the Courts’ young fighters, many poorly trained, were killed."
      - "The Courts collapsed. Their leaders resigned on 27 December and their militias melted away, and on 28 December Ethiopian and government troops entered Mogadishu unopposed. The Courts’ remaining fighters retreated to Kismayo, which fell on 1 January 2007, and then towards Ras Kamboni on the Kenyan border, where Ethiopian troops attacked them and American AC-130 gunships struck on 7–8 January at men believed to include al-Qaeda members wanted for the bombings of the American embassies in Kenya and Tanzania in 1998. Sharif Sheikh Ahmed surrendered in Kenya and went into exile; other leaders escaped to Eritrea."
    facts:
      - [Battle of Baidoa, "20–26 December 2006"]
      - [Ethiopia declares war on the Courts, "24 December 2006"]
      - [Mogadishu taken, "28 December 2006"]
      - [Kismayo taken, "1 January 2007"]
