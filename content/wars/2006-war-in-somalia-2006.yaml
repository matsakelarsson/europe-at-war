notes:
  - "Figures are uncertain. Estimates of civilians killed in 2007–2008 range from about 16,000 to 20,000; the UN counted over a million people displaced by late 2007. Ethiopia never published its losses."
  - "Eritrea supplied arms and training to the Islamic Courts and later hosted the Alliance for the Re-liberation of Somalia, according to UN monitoring reports; it denied doing so. The UN imposed sanctions on Eritrea in 2009, partly for this."
