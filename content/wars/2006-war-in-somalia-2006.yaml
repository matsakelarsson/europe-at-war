  - title: Occupation and insurgency
    date: 2007–2008
    when: "2007-03-21"
    borders: "2008-08-22"
    countries: [so, et, ug, us]
    body:
      - "Many Somalis saw the Ethiopian troops, from a country Somalia had fought in 1964 and 1977, as occupiers, and the government as their creature. From early 2007 former Courts fighters, al-Shabaab and Hawiye clan militias attacked Ethiopian and government forces in Mogadishu with mortars, roadside bombs and suicide bombings, until then almost unknown in Somalia. Ethiopian forces answered with artillery and rocket fire on whole neighbourhoods; in the battles of March and April 2007 hundreds of civilians were killed and some 400,000 people fled the city, many to camps along the road to Afgooye, then one of the largest concentrations of displaced people in the world. Ugandan peacekeepers of the African Union mission, AMISOM, landed in March 2007, joined later by Burundians."
      - "In September 2007 opponents of the occupation met in Asmara and formed the Alliance for the Re-liberation of Somalia (ARS), led by Sharif Sheikh Ahmed and Hassan Dahir Aweys. Al-Shabaab, which the United States designated a terrorist organisation in February 2008, refused to join and fought on its own, imposing its strict version of Islamic law where it ruled. An American missile strike killed its leader Aden Hashi Ayro in Dhusamareb on 1 May 2008. Al-Shabaab took Kismayo in August 2008 and Merca in November, and by the end of 2008 the insurgents controlled most of southern and central Somalia; government soldiers deserted in large numbers."
    facts:
      - [AMISOM arrives, "March 2007"]
      - [ARS founded in Asmara, "September 2007"]
      - [Kismayo taken by al-Shabaab, "22 August 2008"]
