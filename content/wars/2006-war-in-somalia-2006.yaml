id: war-in-somalia-2006
name: War in Somalia (2006–2009)
start: "2006-12-20"
end: "2009-01-31"
tier: B
summary: "The Ethiopian intervention against the Islamic Courts Union and the insurgency that followed. In December 2006 Ethiopian forces, backing the internationally recognised but powerless Transitional Federal Government, defeated the Courts’ militias around Baidoa and drove them out of Mogadishu and Kismayo within two weeks, with American air strikes against suspected al-Qaeda members in the far south. The occupation of Mogadishu soon provoked an insurgency by former Courts fighters, clan militias and above all al-Shabaab, the Courts’ youth militia, which broke away to fight on its own. Shelling and street fighting in the capital killed thousands of civilians and drove hundreds of thousands into camps; African Union peacekeepers (AMISOM) arrived from March 2007. By late 2008 the insurgents held most of the south. A peace deal signed in Djibouti between the government and the moderate wing of the old Courts, led by Sharif Sheikh Ahmed, opened the way for Ethiopia’s withdrawal in January 2009 and Sharif’s election as president; al-Shabaab rejected it and fought on."
