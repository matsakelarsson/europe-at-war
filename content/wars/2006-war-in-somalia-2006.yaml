  - title: Djibouti and the Ethiopian withdrawal
    date: June 2008 – January 2009
    when: "2009-01-26"
    borders: "2009-01-31"
    countries: [so, et, dj]
    body:
      - "Under UN mediation, the government and the Djibouti wing of the ARS led by Sharif Sheikh Ahmed signed an agreement in Djibouti in 2008, initialled on 9 June and signed in August, providing for a ceasefire, the withdrawal of Ethiopian troops and a government of national unity. Aweys’s Asmara wing of the ARS and al-Shabaab rejected it. President Abdullahi Yusuf, isolated and at odds with his own parliament, resigned on 29 December 2008."
      - "Ethiopia withdrew its troops in January 2009, leaving AMISOM’s few thousand Ugandan and Burundian soldiers to guard the government in parts of Mogadishu. Al-Shabaab moved into the towns the Ethiopians left, taking Baidoa on 26 January. On 31 January 2009 a parliament enlarged with ARS members, meeting in Djibouti, elected Sharif Sheikh Ahmed president of Somalia. Al-Shabaab and Aweys’s new Hizbul Islam declared war on his government, and within months they were attacking it in the capital."
    facts:
      - [Djibouti agreement, "initialled 9 June 2008, signed 19 August 2008"]
      - [Abdullahi Yusuf resigns, "29 December 2008"]
      - [Baidoa taken by al-Shabaab, "26 January 2009"]
