  - title: The December war and the ceasefire
    date: November 2025 – November 2026
    when: "2025-12-07"
    borders: "2025-12-27"
    countries: [kh, th]
    body:
      - "On 10 November 2025, after a landmine maimed a Thai soldier in Sisaket, Thailand suspended the Kuala Lumpur declaration. Fighting resumed on 7–8 December, and on a far larger scale than in July: Thai aircraft struck Cambodian positions and supply lines deep behind the border, the Thai navy shelled positions on the coast of Koh Kong province, and Cambodian rockets fell again on Thai districts. In an offensive named after the first Thai soldier killed, Thai troops took Chong An Ma on 13 December, the temple of Ta Krabey on 15 December and a string of hills. At the height of the fighting the two governments reported more than a million people displaced on both sides."
      - "On 27 December the two defence ministers, Cambodia’s Tea Seiha and Thailand’s Nattaphon Narkphanit, signed a new ceasefire at a border checkpoint, under the eye of an ASEAN observer team; Thailand released the 18 Cambodian prisoners on 31 December. The ceasefire has held through 2026, but the dispute is unresolved. Thai troops still hold Ta Moan Thom, Ta Krabey and other points taken in December, which Cambodia says are on its soil; meetings of the Joint Boundary Commission have been postponed, tens of thousands of Cambodians remained displaced in mid-2026, and Thai soldiers have kept stepping on mines. In November 2026 Thailand rejected a Cambodian protest over a Thai visit to the border and restated its commitment to the ceasefire and the memorandum of 2000. Whether the ceasefire leads to a settlement is uncertain."
    facts:
      - [Kuala Lumpur declaration suspended by Thailand, "10 November 2025"]
      - [Renewed fighting, "7–27 December 2025"]
      - [Ceasefire, "27 December 2025"]
