steps:
  - title: Preah Vihear
    date: July 2008 – November 2013
    when: "2008-07-15"
    borders: "2011-02-05"
    countries: [kh, th]
    body:
      - "The Khmer temple of Preah Vihear, built from the 9th to the 12th century on a cliff of the Dângrêk escarpment, was awarded to Cambodia by the International Court of Justice on 15 June 1962, on the strength of a French map that Siam had never contested; the court did not rule on the surrounding land. On 7 July 2008 UNESCO listed the temple as a World Heritage Site on Cambodia’s nomination. The Thai government had at first supported it, but the opposition People’s Alliance for Democracy turned it into a nationalist cause, a Thai court annulled the government’s agreement with Cambodia, and on 15 July, after Thai protesters entered the temple grounds, troops of both countries moved into the area around it. Exchanges of fire in October 2008 and April 2009 killed several soldiers."
      - "The worst fighting came in 2011. From 4 to 7 February artillery and rocket fire was exchanged around the temple and over the border; ten people were killed, Thai villages were hit, tens of thousands of people fled on both sides, and part of the temple was damaged. The UN Security Council asked ASEAN to mediate, and Indonesia agreed to send observers, who were never deployed. From 22 April to early May fighting spread some 150 km west to the temples of Ta Moan Thom and Ta Krabey; some 18 soldiers and a civilian were killed, and Thailand admitted using cluster munitions. On 18 July 2011 the court ordered both sides to withdraw from a provisional demilitarised zone around Preah Vihear, and on 11 November 2013 it ruled unanimously that the whole promontory of the temple was Cambodian, but not the hill of Phnom Trap (Phu Makhuea) to its west."
    facts:
      - [ICJ judgment, "15 June 1962"]
      - [Temple listed by UNESCO, "7 July 2008"]
      - [Clashes at Preah Vihear, "4–7 February 2011, 10 dead"]
      - [Clashes at Ta Moan Thom and Ta Krabey, "22 April – early May 2011"]
      - [ICJ interpretation judgment, "11 November 2013"]
