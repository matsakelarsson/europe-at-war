  - title: The war of July 2025
    date: May – October 2025
    when: "2025-07-24"
    borders: "2025-07-27"
    countries: [kh, th]
    body:
      - "On 28 May 2025 a brief exchange of fire near Chong Bok, in the Emerald Triangle where Thailand, Cambodia and Laos meet, killed a Cambodian soldier. Both governments reinforced the border, closed crossings and traded bans, and Cambodia announced that it would take the disputes over four areas to the International Court of Justice. A leaked telephone call in which the Thai prime minister, Paetongtarn Shinawatra, spoke deferentially to Cambodia’s former leader Hun Sen and criticised a Thai general cost her coalition partners and, in August, her office. After Thai soldiers were maimed by landmines that Thailand said were newly laid, it expelled Cambodia’s ambassador on 23 July."
      - "On the morning of 24 July fighting broke out near the temple of Ta Moan Thom and spread along the border. Cambodian BM-21 rockets hit Thai villages and towns; one salvo killed eight civilians at a petrol station in Kantharalak district of Sisaket province. Thai F-16s bombed Cambodian positions, the first Thai air strikes since the war with Laos in 1987–1988, and the two armies fought with artillery and tanks from Preah Vihear and the hill of Phnom Trap to the coast of Trat. At least 40 soldiers and civilians were killed, and some 300,000 people fled their homes on both sides. Each side accused the other of starting the fighting and of hitting civilians."
      - "After calls from President Donald Trump, who threatened to halt trade talks with both countries, the Thai acting prime minister Phumtham Wechayachai and Cambodia’s prime minister Hun Manet met at Putrajaya under the chairmanship of Malaysia’s Anwar Ibrahim, with American and Chinese envoys present, and agreed to an unconditional ceasefire from midnight on 28 July. ASEAN observers were sent to the border, and at the ASEAN summit in Kuala Lumpur on 26 October Hun Manet and the new Thai prime minister, Anutin Charnvirakul, signed a joint declaration, witnessed by Anwar and Trump, on withdrawing heavy weapons, clearing mines and releasing 18 Cambodian soldiers captured in July."
    facts:
      - [Skirmish in the Emerald Triangle, "28 May 2025"]
      - [Fighting, "24–28 July 2025"]
      - [Putrajaya ceasefire, "28 July 2025"]
      - [Kuala Lumpur joint declaration, "26 October 2025"]
