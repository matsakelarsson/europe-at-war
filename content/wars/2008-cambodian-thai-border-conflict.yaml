id: cambodian-thai-border-conflict
name: Cambodian–Thai border conflict
start: "2008-07-15"
end: "2025-12-27"
tier: B
summary: "The armed clashes between Cambodia and Thailand over disputed stretches of their border along the Dângrêk escarpment, in 2008–2011 and again in 2025. The border was drawn by Franco-Siamese treaties of 1904 and 1907 and French maps whose lines do not always follow the watershed the treaties named. In 1962 the International Court of Justice awarded the temple of Preah Vihear to Cambodia, but not the land around it. When the temple was listed as a World Heritage Site in July 2008, Thai nationalists protested, troops faced each other at the temple, and clashes followed until 2011, the worst in February and April–May 2011, before the court ruled in 2013 that the whole promontory was Cambodian. In 2025 a skirmish in May led to five days of war in July, with artillery, rockets and Thai air strikes along some 200 km of the border, ended by a ceasefire brokered by Malaysia with American and Chinese help, and to three weeks of heavier fighting in December, in which Thai forces took several disputed temples and hills. A ceasefire signed on 27 December 2025 has held, uneasily, into late 2026."
countries: [kh, th]
sides:
  - id: kh
    name: Cambodia
    polities: [cambodia]
    ink: teal
    moves: Cambodian moves
    success: Cambodian success
  - id: th
    name: Thailand
    polities: [thailand]
    ink: purple
    moves: Thai moves
    success: Thai success
notes:
  - "The main positions. Cambodia relies on the treaties of 1904 and 1907 and the French map of the Dângrêk sector annexed to the 1962 judgment, and wants the International Court of Justice to rule on the other disputed temples, Ta Moan Thom, Ta Moan Toch and Ta Krabey, and the Emerald Triangle. Thailand holds that the border must follow the watershed, does not accept the court’s jurisdiction over these areas and insists on bilateral talks in the Joint Boundary Commission set up under a memorandum of understanding of 2000. Each side has accused the other of firing first in every round of fighting."
  - Temples and places are given in their Khmer forms with the Thai in brackets where they differ (Ta Moan Thom is Prasat Ta Muen Thom, Ta Krabey is Prasat Ta Khwai, Phnom Trap is Phu Makhuea).
  - "Casualty figures are disputed. In 2008–2011 some 20 soldiers on each side and a few civilians were killed. For the fighting of July and December 2025, Thailand gave its military dead as more than 40, and the two governments counted some 40 Cambodian and 17 Thai civilians killed by the fighting; estimates of Cambodian military losses range from the dozens Cambodia admitted to several hundred."
