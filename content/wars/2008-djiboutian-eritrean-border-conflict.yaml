id: djiboutian-eritrean-border-conflict
name: Djiboutian–Eritrean border conflict
start: "2008-06-10"
end: "2008-06-13"
tier: C
summary: "A short border war between Djibouti and Eritrea at Ras Doumeira, a headland on the Bab-el-Mandeb strait where their border meets the Red Sea, and the small Doumeira Island offshore. The 1900 Franco-Italian protocol put the border on the headland but left its exact line and the island unclear, and the two countries had already clashed there in 1996. From early 2008 Eritrean troops dug in around Ras Doumeira, and Djibouti moved troops to face them. On 10 June 2008, after several Eritrean soldiers deserted to the Djiboutian lines, fighting broke out and lasted until 13 June. Djibouti reported 44 of its soldiers killed and 55 wounded and estimated Eritrean losses at about 100 dead; Eritrea gave no figures and denied having attacked. France, which has a base in Djibouti, gave logistical, medical and intelligence support. The UN Security Council called on Eritrea to withdraw (Resolution 1862, January 2009) and in December 2009 imposed sanctions on it, also for its support of armed groups in Somalia. In June 2010 both sides accepted Qatari mediation and Qatar sent observers to the border; when they left in June 2017, Djibouti accused Eritrea of reoccupying the disputed hill and island. Eritrea released Djiboutian prisoners in 2016, and in September 2018, amid the wider Eritrean–Ethiopian peace, the two governments agreed to normalise relations, but the border has not been demarcated."
