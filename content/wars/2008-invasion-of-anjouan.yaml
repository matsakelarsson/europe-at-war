id: invasion-of-anjouan
name: Invasion of Anjouan
start: "2008-03-25"
end: "2008-03-26"
tier: C
summary: "The amphibious landing by Comoran and African Union troops on the island of Anjouan (Nzwani) on 25 March 2008, code-named Operation Democracy in Comoros, which removed Colonel Mohamed Bacar, the island’s president, who had refused to leave office. Since independence from France in 1975 the Comoros had seen more than 20 coups and attempted coups, and Anjouan had broken away once before, in 1997. Under the 2001 constitution each island of the Union of the Comoros had its own president; in 2007 Bacar refused to step down at the end of his term, held his own election in June, claimed 90 per cent of the vote against the objections of the federal government and the AU, and declared Anjouan independent in July. After sanctions and talks failed, the AU backed military action. A small Comoran landing near Domoni in mid-March withdrew after a brief clash, and on 19 March a French police helicopter from Mayotte crashed off Anjouan on an unauthorised flight, which led to accusations that France was protecting Bacar. On the morning of 24 March about 1,500 troops sailed from Fomboni on Mohéli: Comoran soldiers with AU contingents from Tanzania, Sudan and Senegal, carried in part by French aircraft and supported by Libya and the United States. About 450 landed at dawn on 25 March on the north side of Anjouan Bay near Ouani, took the airport after some fighting and went on to the capital, Mutsamudu, the port and the second town, Domoni; much of the population welcomed them. Casualty figures were never clearly reported. Bacar escaped by speedboat to the French island of Mayotte on 26 March; France refused him asylum on 15 May but would not hand him over to the Comoros because of the risk of persecution, and in July 2008 flew him from Réunion to Benin. Moussa Toybou won the new island election held in June 2008."
