id: russo-georgian-war
name: Russo-Georgian War
start: "2008-08-07"
end: "2008-08-16"
tier: B
summary: A short war in August 2008 that began with a Georgian assault on Tskhinvali, capital of breakaway South Ossetia, and turned into a Russian counter-offensive deep into Georgia. After a ceasefire brokered by France, Russia recognised South Ossetia and Abkhazia as independent states and kept troops in both, while most ethnic Georgians were driven out of South Ossetia.
