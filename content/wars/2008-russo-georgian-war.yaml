steps:
  - title: Tskhinvali and the Roki Tunnel
    date: 7–10 August 2008
    when: "2008-08-07"
    borders: "2008-08-08"
    countries: [ge, ru]
    body:
      - Since the wars of the early 1990s South Ossetia and Abkhazia had been outside Georgian control, with Russian peacekeepers in both. Mikheil Saakashvili, president from 2004, promised to restore Georgia’s territorial integrity and sought NATO membership, while Russia gave its passports to most people in the two regions. In early August 2008 exchanges of fire around Tskhinvali grew heavier. Late on 7 August, hours after declaring a unilateral ceasefire, Georgia began an artillery bombardment and ground assault on the town, saying it was answering attacks on Georgian villages and Russian troop movements through the Roki Tunnel. Russian peacekeepers were among those killed.
      - On 8 August Russia sent units of its 58th Army through the tunnel and began bombing targets across Georgia. Georgian forces were driven out of Tskhinvali by 10 August. A second front opened in the west, where Russian warships sank a Georgian boat off Abkhazia and Abkhaz forces, backed by Russia, drove Georgian troops from the upper Kodori Gorge. An EU inquiry, the Tagliavini report of 2009, found that the war began with the Georgian attack, which it judged unjustified under international law, but that Russia’s response went far beyond reasonable defence and that the blame could not be laid on one side alone.
    facts:
      - [Georgian assault on Tskhinvali, "night of 7–8 August 2008"]
      - [Russian troops through the Roki Tunnel, "8 August 2008"]
      - [Georgian withdrawal from Tskhinvali, "by 10 August 2008"]
