notes:
  - South Ossetia and Abkhazia are shown as part of Georgia on the map, as they are internationally recognised. The outline of South Ossetia and the Russian-held zones are approximate.
  - Exchanges of fire had escalated from 1 August, and some sources date the war from then. Each side’s casualty figures come from its own government.
