  - title: Gori, Poti and recognition
    date: 11 August – 8 October 2008
    when: "2008-08-11"
    borders: "2008-08-26"
    countries: [ge, ru]
    body:
      - On 11 August Russian forces moved beyond the conflict zones into the rest of Georgia. From Abkhazia they entered Zugdidi and the military base at Senaki and occupied the port of Poti, where they sank Georgian ships; from South Ossetia they took Gori on 13 August, cutting the country’s main east–west road. In and around South Ossetia militias burned and looted ethnic Georgian villages, and their inhabitants fled; the EU inquiry concluded that ethnic Georgians had been subjected to ethnic cleansing. About 192,000 people were displaced at the height of the war.
      - France’s president Nicolas Sarkozy, holding the EU presidency, brokered a six-point ceasefire on 12 August, signed by Saakashvili on 15 August and by Russia’s president Dmitry Medvedev the next day. On 26 August Russia recognised Abkhazia and South Ossetia as independent states, which only a handful of other countries followed. Russian troops left Gori on 22 August and the “buffer zones” on 8 October, when EU monitors arrived, but stayed in both regions. Georgia counted about 400 dead, among them 224 civilians; Russia reported 67 soldiers killed, and South Ossetia said 365 of its people died.
    facts:
      - [Six-point ceasefire, "12 August 2008, signed 15–16 August"]
      - [Russian recognition of Abkhazia and South Ossetia, "26 August 2008"]
      - [Displaced, "about 192,000 at the height of the war"]
