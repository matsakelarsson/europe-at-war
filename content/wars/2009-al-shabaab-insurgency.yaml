notes:
  - "Somali, African Union and al-Shabaab figures for battles are partisan and often far apart; African Union troop-contributing countries rarely publish their losses. The figure for the famine of 2010–2012, about 258,000 deaths, half of them children under five, comes from a study for the FAO and FEWS NET published in 2013."
  - "Al-Shabaab’s territory is hard to map: it holds much of the countryside and some towns, while the government and its allies hold most district towns and the roads between some of them, and control changes often. The areas in the steps are approximate."
  - "Kenya and Ethiopia fought partly within the African Union mission and partly on their own; Kenya’s Operation Linda Nchi (2011–2012) and Ethiopia’s campaigns of 2011–2012 and 2022 were outside it."
