  - title: Westgate, Garissa and El Adde
    date: 2013–2016
    when: "2013-09-21"
    borders: "2015-04-02"
    countries: [so, ke]
    body:
      - "Driven from the main towns, al-Shabaab took its war to its enemies’ homelands. On 21 September 2013 gunmen attacked the Westgate shopping mall in Nairobi; 67 people were killed in a siege that lasted four days. In June 2014 attackers killed about 60 people in and around Mpeketoni on the Kenyan coast, and on 2 April 2015 gunmen killed 148 people, most of them students, at Garissa University College, separating Christians from Muslims. Kenya answered with crackdowns on Somali Kenyans and refugees, which human rights groups said helped al-Shabaab recruit."
      - "In Somalia, American drones and special forces hunted the leadership, and on 1 September 2014 an American strike killed Ahmed Abdi Godane; Ahmed Diriye (Abu Ubaidah) succeeded him. AMISOM, now over 20,000 strong, and the Somali army took Barawe, al-Shabaab’s last port, in October 2014 in Operation Indian Ocean. But al-Shabaab fell back on rural areas and the Jubba valley around Jilib, and overran isolated African Union bases: Burundians at Leego in June 2015, Ugandans at Janale in September 2015 and Kenyans at El Adde on 15 January 2016, the deadliest attack on Kenya’s army in its history; Kenya never gave its losses, and estimates run from about 140 to 200 soldiers killed. In 2015 a faction in Puntland led by Abdulqadir Mumin pledged allegiance to the Islamic State, and in 2016 it briefly took the port of Qandala."
    facts:
      - [Westgate attack, "21–24 September 2013, 67 killed"]
      - [Godane killed, "1 September 2014"]
      - [Garissa University attack, "2 April 2015, 148 killed"]
      - [El Adde, "15 January 2016"]
