  - title: Out of Mogadishu, and the famine
    date: 2011
    when: "2011-08-06"
    borders: "2011-08-06"
    countries: [so, ke, et]
    body:
      - "In February 2011 AMISOM and government forces began pushing al-Shabaab back district by district in Mogadishu, at heavy cost in the narrow streets. On 6 August 2011 al-Shabaab withdrew most of its fighters from the city, calling it a tactical retreat. It kept up attacks on the capital with suicide bombers and gunmen, but Mogadishu would not again be a front line."
      - "At the same time the worst drought in decades hit the Horn of Africa. On 20 July 2011 the UN declared famine in Bakool and Lower Shabelle, both held by al-Shabaab, and later in other regions. Al-Shabaab had expelled the World Food Programme and other agencies in 2010 and denied there was a famine, while access to its areas was blocked by fighting, and food prices soared. A later study estimated that about 258,000 people died between October 2010 and April 2012, half of them children under five. Hundreds of thousands fled to camps in Mogadishu and across the borders to Dadaab in Kenya and Dolo Ado in Ethiopia."
    facts:
      - [Famine declared, "20 July 2011"]
      - [Al-Shabaab leaves Mogadishu, "6 August 2011"]
      - [Famine deaths, "about 258,000 (October 2010 – April 2012)"]
    markers:
      - kind: taken
        side: au
        name: Mogadishu
        date: 6 August 2011
        text: Al-Shabaab pulled out of the city after months of fighting with AMISOM and government troops.
        lonlat: [45.342, 2.035]
      - kind: event
        name: Dadaab
        date: 2011
        text: The refugee camps in north-eastern Kenya, already among the largest in the world, received tens of thousands of new arrivals each month.
        lonlat: [40.310, 0.060]
      - kind: event
        name: Dolo Ado
        date: 2011
        text: Camps on the Ethiopian side of the border, where many refugees from Bay and Bakool arrived.
        lonlat: [42.070, 4.180]
