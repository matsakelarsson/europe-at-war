id: al-shabaab-insurgency
name: Al-Shabaab insurgency
start: "2009-01-31"
end: ongoing
tier: A
summary: "The war of al-Shabaab, a Somali jihadist movement allied to al-Qaeda since 2012, against Somalia’s internationally backed governments, African Union peacekeepers, Kenya, Ethiopia and the United States. After the Ethiopian withdrawal in January 2009 al-Shabaab held most of southern and central Somalia and fought the government for Mogadishu, until African Union troops drove it out of the city in August 2011, the year a famine killed some 258,000 people in its areas and beyond. Kenyan and Ethiopian forces then entered Somalia, and by 2014 the African Union mission (AMISOM) and the Somali army had taken the main towns, including Kismayo and Barawe. Al-Shabaab fell back to the countryside, which it still largely governs and taxes, and fought on with ambushes, assaults on African Union bases and bombings in Mogadishu, among them the truck bomb of 14 October 2017 that killed 587 people, and in Uganda and Kenya, at the Westgate mall in Nairobi (2013) and Garissa University (2015). A government offensive with clan militias in 2022–2023 retook parts of central Somalia, but al-Shabaab won most of them back in 2025. A smaller branch of the Islamic State fights in Puntland. In late 2026 the war continues alongside a deep political crisis in Mogadishu."
countries: [so, ke, et, ug, us]
