    date: 2024 – November 2026
    when: "2025-07-07"
    borders: "2026-11-27"
    countries: [so, et, ke, ug, us, eg]
    body:
      - "Last updated 27 November 2026. The African Union mission was replaced on 1 January 2025 by the smaller African Union Support and Stabilization Mission in Somalia (AUSSOM), some 11,900 troops from Uganda, Ethiopia, Djibouti, Kenya and Egypt, chronically short of money; Uganda has said it will withdraw its troops by the end of 2027. Ethiopia’s memorandum with Somaliland in January 2024, which offered it access to the sea, set off a bitter quarrel with Mogadishu until Turkey mediated the Ankara Declaration in December 2024, and Egypt sent troops to Somalia. From the end of 2024 Puntland’s forces, with American air support, drove the Islamic State’s Somali branch from much of its base in the Cal Miskaad mountains."
      - "In February 2025 al-Shabaab opened its largest offensive in years in Middle Shabelle and Hiran. It retook most of what the government had won in 2022–2023, among them Adan Yabaal in April and Moqokori and Tardo in July 2025, came within about 40 km of Mogadishu at Sabiid and Anole, and claimed a bomb attack on the president’s convoy in March 2025. American strikes continued at a high rate; AFRICOM announced its 91st strike in Somalia of the year in early November 2026. Analysts estimated in early 2026 that al-Shabaab controlled about a third of the country and ran checkpoints on the outskirts of the capital, and it still attacks across the Kenyan border, most recently in Mandera in November 2026."
      - "The war is now entangled with a political crisis. Opposition parties and two of the most powerful federal member states rejected the constitutional amendments passed in March 2026 that would have kept President Hassan Sheikh Mohamud in office to 2027; government forces and armed opposition supporters fought in Mogadishu on 3–5 June 2026, and South West State has been at odds with the federal government since March. On 5 November 2026 the Supreme Court ruled that the president’s mandate had expired in May and called for elections within 90 days; the government rejected the ruling and moved against the court. Government and African Union forces stepped up operations in Hiran and elsewhere from July 2026, but how much ground either side holds is uncertain."
