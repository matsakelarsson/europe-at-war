steps:
  - title: The battle for Mogadishu
    date: 2009–2010
    when: "2010-08-23"
    borders: "2010-08-23"
    countries: [so, ug]
    body:
      - "Sharif Sheikh Ahmed’s election as president in January 2009 did not end the war. Al-Shabaab, led by Ahmed Abdi Godane, and the rival Islamist coalition Hizbul Islam, led by Hassan Dahir Aweys, rejected the new government as an apostate creation of foreigners and in May 2009 launched an offensive in Mogadishu that left the government and some 5,000–8,000 Ugandan and Burundian peacekeepers holding only a few districts around the airport, the port and the presidential palace, Villa Somalia. In the south, al-Shabaab ruled most towns, from Kismayo to Baidoa and the Shebelle valley, with its own courts, taxes and police, punishing theft with amputation and banning music, films and football."
      - "Al-Shabaab also struck beyond the front. On 3 December 2009 a suicide bomber killed some 25 people, among them three ministers and medical graduates, at a graduation ceremony in the Shamo Hotel in Mogadishu. On 11 July 2010 two suicide bombings at a rugby club and an Ethiopian restaurant in Kampala killed 74 people watching the football World Cup final, in revenge for Uganda’s part in AMISOM. In August 2010, during Ramadan, al-Shabaab threw thousands of fighters into a new offensive on the capital, which AMISOM and government troops beat back with heavy losses on both sides. Hizbul Islam merged into al-Shabaab in December 2010."
    facts:
      - [Al-Shabaab’s offensive in Mogadishu, "from May 2009"]
      - [Kampala bombings, "11 July 2010, 74 killed"]
      - [Ramadan offensive, "August – September 2010"]
