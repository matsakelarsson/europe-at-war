  - title: The offensive of 2022–2023
    date: 2022–2023
    when: "2022-08-23"
    borders: "2023-01-20"
    countries: [so, et]
    body:
      - "Hassan Sheikh Mohamud was elected president again in May 2022 and declared “total war” on al-Shabaab. When clans in Hiran, angered by al-Shabaab’s taxes and its killings of elders, took up arms as the Ma’awisley militias in mid-2022, the government backed them with the army, Turkish-trained special forces, American air strikes and African Union troops, now renamed the African Union Transition Mission in Somalia (ATMIS), which was to hand over to Somali forces and withdraw. In July 2022 al-Shabaab fighters crossed into Ethiopia’s Somali Region, where Ethiopian forces destroyed the incursion."
      - "Al-Shabaab struck back in the capital: gunmen besieged the Hayat Hotel in August 2022, killing 21 people, and two car bombs at the Ministry of Education on 29 October 2022 killed 121. The offensive nonetheless took dozens of towns and villages in Hiran, Middle Shabelle and Galgaduud, among them Adan Yabaal in December 2022 and the coastal towns of Harardhere and El Dher in January 2023. A second phase in the south stalled after al-Shabaab overran an army base at Cowsweyne in August 2023, and many of the gains rested on clan militias and thin garrisons."
    facts:
      - [Hassan Sheikh Mohamud re-elected, "15 May 2022"]
      - [Ministry of Education bombings, "29 October 2022, 121 killed"]
      - [Harardhere taken, "January 2023"]
