        atoms: [SO-BK, SO-SH]
  - title: Kenya, Ethiopia and the fall of Kismayo
    date: October 2011 – October 2012
    when: "2011-10-16"
    borders: "2012-10-01"
    countries: [so, ke, et]
    body:
      - "After a series of kidnappings of tourists and aid workers on its side of the border, Kenya sent troops into southern Somalia on 16 October 2011, Operation Linda Nchi (“Protect the Country”), with the Ras Kamboni militia of Ahmed Madobe. Slowed by rain and resistance, they took Afmadow in May 2012. Ethiopia sent troops back into Somalia from the west, taking Beledweyne on 31 December 2011 and Baidoa on 22 February 2012. In February 2012 al-Shabaab formally joined al-Qaeda. AMISOM, reinforced by Kenyan, Djiboutian and Sierra Leonean troops, pushed out of Mogadishu and took Afgooye in May 2012."
      - "In August 2012 the transitional period ended with a new provisional constitution and a Federal Government of Somalia, and on 10 September a new parliament elected Hassan Sheikh Mohamud president. On 28 September 2012 Kenyan troops landed from the sea north of Kismayo while Kenyan and Ras Kamboni forces advanced overland, and al-Shabaab abandoned the city, its main source of revenue, the next day. Kismayo became the capital of the Jubaland administration under Ahmed Madobe."
    facts:
