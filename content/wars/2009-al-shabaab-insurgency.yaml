  - title: Zoobe and the long stalemate
    date: 2017–2021
    when: "2017-10-14"
    borders: "2017-10-14"
    countries: [so, us, ke]
    body:
      - "On 14 October 2017 a truck packed with explosives blew up at the busy Zoobe junction in central Mogadishu, killing 587 people and injuring hundreds more, the deadliest bombing in Somalia’s history. Al-Shabaab did not claim it, but the government and most observers blamed it. Tens of thousands of Somalis marched against the group."
      - "The war settled into a stalemate. Al-Shabaab ran a parallel state in much of the south, collecting taxes on trade and harvests even in government-held areas, settling disputes in its courts, and recruiting among clans marginalised by others. The United States, which in 2017 loosened its rules for strikes, carried out dozens of air strikes a year, and Somali and African Union forces held towns that were often cut off and supplied by air. On 5 January 2020 al-Shabaab attacked the Kenyan base at Manda Bay, killing three Americans. Disputes between Mogadishu and the federal member states, and in 2021 over President Mohamed Abdullahi Farmaajo’s attempt to extend his term, which led to fighting in the capital in April 2021, weakened the war effort."
    facts:
      - [Zoobe bombing, "14 October 2017, 587 killed"]
      - [Attack on Manda Bay, "5 January 2020"]
