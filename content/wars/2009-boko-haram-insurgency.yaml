steps:
  - title: Mohammed Yusuf and the rising of 2009
    date: 2002 – July 2009
    when: "2009-07-26"
    borders: "2009-07-26"
    countries: [ng]
    body:
      - Mohammed Yusuf, a young preacher, built a following in Maiduguri, the capital of Borno State, from the early 2000s. He preached that Western-style education and the secular state were forbidden to Muslims and condemned the northern political and religious establishment as corrupt; his mosque and school drew young men, many of them poor students of Qur’anic schools. Borno and its neighbours were among the poorest parts of Nigeria, and northern states had adopted sharia law from 1999, which Yusuf said did not go far enough.
      - Clashes with the police grew, and on 26 July 2009 his followers attacked police stations in Bauchi, and in the following days in Maiduguri, Potiskum and Wudil in Kano State. The army crushed the rising within days, destroying Yusuf’s compound in Maiduguri; about 700 or more people were killed, many of them in summary executions. On 30 July Yusuf was captured and shot dead in police custody. His deputy Abubakar Shekau went underground.
    facts:
      - [Rising begins, "26 July 2009, Bauchi"]
      - [Killed in the rising, "about 700 or more"]
      - [Yusuf killed in custody, "30 July 2009"]
    markers:
      - kind: event
        side: ng
        name: Maiduguri
        date: 26–30 July 2009
        text: The army destroyed Yusuf’s compound and mosque; Yusuf was killed in police custody on 30 July.
        lonlat: [13.15, 11.84]
      - kind: battle
        side: ng
        name: Bauchi
        date: 26 July 2009
        text: Yusuf’s followers attacked a police station, and the rising spread to other towns.
        lonlat: [9.84, 10.32]
      - kind: battle
        side: ng
        name: Potiskum
        date: July 2009
        text: Clashes between Yusuf’s followers and the security forces.
        lonlat: [11.08, 11.71]
      - kind: battle
        side: ng
        name: Wudil
        date: July 2009
        text: Clashes in Kano State.
        lonlat: [8.84, 11.81]
  - title: Shekau’s war
    date: 2010–2013
    when: "2011-08-26"
    borders: "2013-05-14"
    countries: [ng]
    body:
      - Under Shekau the movement returned in 2010 as a clandestine armed group. On 7 September 2010 its fighters freed more than 700 prisoners, many of them members, from the prison in Bauchi. It killed police officers, politicians, Muslim clerics who criticised it and Christians, and bombed churches, markets and beer halls. In June 2011 it carried out Nigeria’s first suicide car bombing, against the police headquarters in Abuja, and on 26 August 2011 it bombed the United Nations building there, killing more than twenty people. Coordinated attacks on police and government buildings in Kano on 20 January 2012 killed about 185 people.
      - "On 14 May 2013 President Goodluck Jonathan declared a state of emergency in Borno, Yobe and Adamawa and sent the army in force. Young men in Maiduguri formed vigilante groups, the Civilian Joint Task Force, which helped drive the militants out of the city; the army and the vigilantes were accused of killing and detaining thousands of suspects without trial. Boko Haram fell back into the countryside, the Sambisa forest and the Mandara mountains on the Cameroonian border, and massacred villagers and students it accused of siding with the state."
    facts:
      - [Bauchi prison break, "7 September 2010"]
      - [UN building in Abuja bombed, "26 August 2011"]
      - [Kano attacks, "20 January 2012, about 185 killed"]
      - [State of emergency, "14 May 2013 (Borno, Yobe, Adamawa)"]
    markers:
