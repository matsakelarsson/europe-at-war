  - title: Shekau’s death and the surrenders
    date: 2021–2023
    when: "2021-05-19"
    borders: "2021-05-19"
    countries: [ng, cm, ne, td]
    body:
      - In May 2021 ISWAP fighters overran JAS’s camps in the Sambisa forest. Shekau, cornered, killed himself with an explosive vest on about 19 May 2021, according to both factions. Many of his fighters joined ISWAP; others, under Bakura Doro, held out on islands in Lake Chad and fought ISWAP there, winning a series of battles around Toumbun at the turn of 2023 before ISWAP struck back.
      - Tens of thousands of fighters and their families left the bush and surrendered after Shekau’s death; by July 2023 the military said more than 100,000 people had done so. Borno State put them through camps and a reintegration programme, which many victims resented. ISWAP remained the strongest insurgent force, held much of the Lake Chad shore and raided further afield, among other things breaking hundreds of prisoners out of Kuje prison near Abuja in July 2022, while violence in the north-east fell to its lowest level in a decade.
    facts:
      - [Shekau’s death, "about 19 May 2021"]
      - [Surrenders, "more than 100,000 fighters and family members by July 2023 (military figure)"]
