  - title: Chibok and the “caliphate”
    date: April 2014 – January 2015
    when: "2014-04-14"
    borders: "2015-01-07"
    countries: [ng, cm]
    body:
      - On the night of 14–15 April 2014 Boko Haram fighters abducted 276 girls from the government secondary school at Chibok in southern Borno. Dozens escaped at once, but the rest were taken to the Sambisa forest; the global campaign “Bring Back Our Girls” drew attention to the government’s slow response. Over the following years more than half were freed through negotiations or escaped, but dozens were still missing a decade later. Thousands of other women and children were abducted, forced into marriage or used as suicide bombers.
      - "From mid-2014 Boko Haram began to take and hold towns. In August Shekau declared a caliphate from Gwoza; Bama, Madagali, Michika and Mubi fell in September and October, and the army often fled. In early January 2015 the militants took Baga and the base of the regional task force on Lake Chad and killed hundreds of people there and in nearby Doron Baga; local reports cited by Amnesty International spoke of up to 2,000 dead, while the defence ministry said no more than 150 people were killed. By then Boko Haram held or contested an area of tens of thousands of square kilometres and was raiding across the border into Cameroon’s Far North."
    facts:
      - [Chibok abduction, "14–15 April 2014, 276 girls"]
      - [Caliphate declared, "August 2014, Gwoza"]
      - [Baga massacre, "3–7 January 2015, from about 150 to as many as 2,000 killed"]
