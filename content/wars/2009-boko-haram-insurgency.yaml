id: boko-haram-insurgency
name: Boko Haram insurgency
start: "2009-07-26"
end: ongoing
tier: A
summary: "The jihadist insurgency centred on Borno State in north-eastern Nigeria and the Lake Chad basin. Boko Haram, a Salafi movement founded in Maiduguri by the preacher Mohammed Yusuf, rose in July 2009; the army crushed the rising and Yusuf was killed in police custody. Under Abubakar Shekau the movement turned to bombings, assassinations and mass killings, abducted 276 schoolgirls from Chibok in April 2014 and by early 2015 held a large part of Borno and neighbouring states, which it declared a caliphate. Shekau pledged allegiance to the Islamic State in March 2015. A counter-offensive by Nigeria, Chad, Cameroon and Niger, later the Multinational Joint Task Force, retook the towns in 2015, but in 2016 the movement split: the Islamic State West Africa Province (ISWAP) built a base on the shores and islands of Lake Chad and attacked army bases, while Shekau’s faction (JAS) kept the Sambisa forest and the Mandara mountains. ISWAP overran Sambisa in May 2021 and Shekau died. After a lull, attacks by both factions rose again from 2024; the United States joined Nigeria in air strikes from December 2025, and fighting continued in 2026 in Borno, around Lake Chad and in Cameroon’s Far North. By the UN’s estimates the war has killed tens of thousands of people directly and, with hunger and disease, about 350,000 by the end of 2020, and has displaced some two million people in north-eastern Nigeria."
