  - title: The regional counter-offensive
    date: February 2015 – December 2016
    when: "2015-03-27"
    borders: "2015-03-27"
    countries: [ng, td, cm, ne]
    body:
      - In early 2015 Nigeria’s neighbours joined the war. Chadian troops crossed into Cameroon and Nigeria in February, fought Boko Haram at Fotokol and Gamboru and took Dikwa; Boko Haram attacked Bosso and Diffa in Niger and Fotokol in Cameroon. Nigeria, which had postponed its election, launched a large offensive with the help of foreign private military contractors, and retook Bama and, on 27 March 2015, Gwoza; the next day Muhammadu Buhari, a former general from the north, was elected president. On 7 March Shekau had pledged allegiance to the Islamic State, and the movement became its West Africa Province.
      - "The regional force was reorganised as the Multinational Joint Task Force (MNJTF) of Nigeria, Chad, Cameroon, Niger and Benin, with its headquarters at N’Djamena. Driven from the towns, the militants answered with suicide bombings, many by women and girls, in Maiduguri, N’Djamena, Maroua and elsewhere. Operations in the Sambisa forest freed hundreds of women and children, and in December 2016 Buhari announced that the last Boko Haram camp there had fallen, though the militants kept fighting in the forest."
    facts:
