notes:
  - "Names. “Boko Haram”, roughly “Western education is forbidden”, is a nickname given by outsiders; the movement called itself Jama’at Ahl al-Sunna li-l-Da’wa wa-l-Jihad (JAS). After it pledged allegiance to the Islamic State in March 2015 it was renamed the Islamic State’s West Africa Province. In August 2016 the Islamic State named Abu Musab al-Barnawi, Yusuf’s son, as its leader instead of Shekau; Shekau’s faction went back to the name JAS, and al-Barnawi’s kept the ISWAP name. Both are often still called Boko Haram."
  - "Figures are uncertain. Counts of reported deaths in fighting and attacks (ACLED and others) are about 35,000 or more since 2009; the UN Development Programme estimated in 2021 that the war had caused about 350,000 deaths in north-eastern Nigeria by the end of 2020, most of them from hunger and disease, many of them young children. Some two million people are displaced in north-eastern Nigeria, and hundreds of thousands more in Cameroon, Chad and Niger. Nigerian soldiers and the Civilian JTF have also been accused of extrajudicial killings and mass detentions."
  - The insurgency in Niger’s Diffa region is also told in the Jihadist insurgency in Niger. The Islamic State’s strikes in north-western Nigeria, and the jihadist groups there such as Lakurawa, are mentioned here only where they touch this war.
