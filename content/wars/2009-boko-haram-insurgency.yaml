  - title: Resurgence and American strikes
    date: 2024 – November 2026
    when: "2025-12-25"
    borders: "2026-11-27"
    countries: [ng, cm, td, ne, us]
    body:
      - "Last updated 27 November 2026. Attacks by both factions rose again from 2024. Suicide bombings in Gwoza on 29 June 2024 killed at least 32 people; Boko Haram killed 63 people at Darul Jamal near Bama on 5 September 2025 and in October 2025 seized Kirawa on the Cameroonian border, driving more than 5,000 people into Cameroon. ISWAP, estimated by UN experts at 8,000 to 12,000 fighters in 2025, overran army posts with drones and night raids, while JAS fighters fought it on the islands of Lake Chad and attacked Chadian posts there, killing 23 soldiers at Barka Tolorom on 5 May 2026. Niger left the Multinational Joint Task Force in 2025."
      - "After President Donald Trump threatened in November 2025 to act against the killing of Christians in Nigeria, American forces struck camps of Islamic State-linked groups in Sokoto State, in the north-west, on 25–26 December 2025 with Nigeria’s approval. American advisers arrived in February 2026, and on 15 May 2026 a joint American and Nigerian raid on islands in Lake Chad killed Abu Bilal al-Minuki, a Borno-born senior commander of ISWAP and the Islamic State whom President Trump called the Islamic State’s second-in-command, followed by further air strikes in Borno; most American forces left in July, while intelligence support continued. Reports in September of a secret three-month truce between the government and Boko Haram, linked to the release of captives from Ngoshe, were not confirmed by the government and were denied by a Boko Haram official; ACLED found that Boko Haram’s violence in Nigeria had been falling since May while it rose in Cameroon."
      - "ACLED recorded the highest level of violence in Nigeria since its records began in the second quarter of 2026. On 13–14 October ISWAP overran a base at Mairari near Monguno, killing 15 soldiers and five militiamen, a week after an attack at Kukawa; in November ISWAP attacked troops in Adamawa and suspected Boko Haram fighters struck troops on a road near Gwoza, and an attack attributed to Boko Haram killed 11 Nigerien soldiers in Diffa. The front lines are fluid and casualty figures come mostly from the army and local sources; how much of the countryside the insurgents control is uncertain."
    facts:
      - [American strikes in Sokoto State, "25–26 December 2025"]
      - [Abu Bilal al-Minuki killed, "15 May 2026"]
      - [Mairari base overrun, "13–14 October 2026"]
      - [Displaced in north-eastern Nigeria, "about 2 million (UN)"]
