  - title: Two movements around Lake Chad
    date: 2016–2020
    when: "2018-11-18"
    borders: "2018-12-26"
    countries: [ng, td, ne, cm]
    body:
      - In August 2016 the Islamic State named Abu Musab al-Barnawi, Yusuf’s son, as its governor in West Africa, and the movement split. Al-Barnawi’s ISWAP, which avoided killing Muslim civilians and tried to win over villagers by collecting taxes and providing a rough order, built its base on the islands and shores of Lake Chad and in northern Borno and Yobe. Shekau’s JAS kept the Sambisa forest and the Mandara mountains and went on killing and abducting civilians, and the two factions fought each other.
      - "ISWAP turned to attacking army bases. In February 2018 it abducted 110 schoolgirls from Dapchi, releasing most of them a month later. On 18 November 2018 it overran the base at Metele, killing at least 118 soldiers, and in December it took Baga and the MNJTF base there. Nigeria pulled its troops back into fortified “super camps” in 2019, leaving much of the countryside to the insurgents. On 23 March 2020 Boko Haram fighters killed 98 Chadian soldiers at Bohoma on Lake Chad; President Idriss Déby led a counter-offensive in person and threatened to withdraw his troops from the regional force."
    facts:
      - [Split, "August 2016"]
      - [Dapchi abduction, "19 February 2018, 110 girls"]
      - [Metele, "18 November 2018, at least 118 soldiers killed"]
      - [Bohoma, "23 March 2020, 98 Chadian soldiers killed"]
