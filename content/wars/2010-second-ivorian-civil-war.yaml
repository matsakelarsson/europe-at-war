  - title: Duékoué and the battle for Abidjan
    date: March – April 2011
    when: "2011-03-29"
    borders: "2011-04-11"
    countries: [ci, fr]
    body:
      - "On 28 March 2011 Ouattara’s forces, now named the Republican Forces of Côte d’Ivoire (FRCI), launched a general offensive. Gbagbo’s army collapsed: the FRCI took Duékoué on 29 March, Yamoussoukro on 30 March and the port of San-Pédro on 31 March, and reached Abidjan the same day. In Duékoué, a town of the Guéré people in the west, FRCI soldiers and Dozo hunters killed hundreds of men in the Carrefour quarter on 29 March; the Red Cross said at least 800 people died, Caritas more than 1,000, and the UN counted 330, more than 100 of them killed by pro-Gbagbo forces."
      - "In Abidjan Gbagbo’s Republican Guard and militias held out around the presidential palace and his residence in Cocody. On 30 March the UN Security Council demanded that he step down, and from 4 April UN and French helicopters attacked his heavy weapons, which the UN said were being used against civilians. On 11 April 2011 FRCI troops, supported by French armour, stormed the residence and captured Gbagbo, who was taken to the Golf Hotel. Fighting with militias in Yopougon went on into May. Ouattara was inaugurated in Yamoussoukro on 21 May 2011."
