id: second-ivorian-civil-war
name: Second Ivorian Civil War
start: "2010-11-28"
end: "2011-04-11"
tier: B
summary: "The war that followed Côte d’Ivoire’s disputed presidential election of 2010. After the run-off of 28 November 2010 the electoral commission declared Alassane Ouattara the winner, and the United Nations, which had certified the vote, the African Union and ECOWAS recognised him; but the Constitutional Council, headed by an ally of the incumbent, Laurent Gbagbo, annulled results from the north and declared Gbagbo re-elected. Both men were sworn in. Ouattara’s government sat in the Golf Hotel in Abidjan under UN protection while fighting spread in the city’s northern suburbs and in the west. In late March 2011 the former rebels of the north, now the Republican Forces of Côte d’Ivoire (FRCI), swept south to Yamoussoukro, San-Pédro and Abidjan; at Duékoué hundreds of civilians were massacred. After UN and French helicopters destroyed Gbagbo’s heavy weapons, the FRCI captured him in his residence on 11 April 2011. About 3,000 people were killed and more than a million displaced; Gbagbo was tried at the International Criminal Court and acquitted."
countries: [ci, fr, lr]
