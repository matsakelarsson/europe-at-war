notes:
  - "Both sides committed atrocities, according to a UN commission of inquiry and human rights organisations: pro-Gbagbo forces, militias and Liberian mercenaries killed suspected Ouattara supporters, northerners and West African immigrants, especially in Abidjan and the far west; pro-Ouattara forces and allied Dozo hunters killed civilians of the Guéré and other peoples seen as Gbagbo supporters, above all at Duékoué. Ouattara’s government prosecuted many Gbagbo supporters but few of its own."
  - "The International Criminal Court tried Gbagbo and his youth leader Charles Blé Goudé for crimes against humanity; both were acquitted in 2019, a verdict confirmed on appeal in 2021. His wife Simone Gbagbo, sentenced in Côte d’Ivoire, was amnestied in 2018."
