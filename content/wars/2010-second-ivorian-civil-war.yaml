steps:
  - title: Two presidents
    date: November 2010 – March 2011
    when: "2010-12-04"
    borders: "2010-12-04"
    countries: [ci, lr]
    body:
      - "The election of 2010, delayed for five years, was meant to close the first civil war. In the run-off on 28 November Gbagbo faced Ouattara, who was backed by the former president Henri Konan Bédié. On 2 December the Independent Electoral Commission announced that Ouattara had won with about 54% of the vote; the next day the Constitutional Council annulled the results of seven northern departments for alleged fraud and declared Gbagbo the winner with about 51%. On 4 December both men took the oath of office. The UN mission, which had certified the results, ECOWAS and the African Union recognised Ouattara, who governed from the Golf Hotel in Abidjan under the protection of UN peacekeepers and Forces Nouvelles troops, with Guillaume Soro as his prime minister."
      - "Gbagbo kept the army, the state media and the south. His security forces and militias killed and abducted suspected Ouattara supporters in Abidjan, and on 3 March 2011 soldiers fired on a women’s march in Abobo, killing seven. In Abobo, the large northern suburb, an armed group known as the “Invisible Commando” drove Gbagbo’s forces out, and Abobo was shelled. In the far west the Forces Nouvelles began to advance from February, taking Toulepleu on the Liberian border on 7 March; some 100,000 refugees fled into Liberia."
