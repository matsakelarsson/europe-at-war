id: tivoli-incursion
name: Tivoli Incursion
start: "2010-05-23"
end: "2010-06-24"
tier: C
summary: "The battle in West Kingston, Jamaica, in May 2010, when the security forces went into the Tivoli Gardens housing scheme to arrest Christopher “Dudus” Coke, wanted in the United States for drug and arms trafficking. Tivoli Gardens, built in the 1960s, was a stronghold of the Jamaica Labour Party (JLP) and part of Prime Minister Bruce Golding’s own constituency, and Coke, the leader of the Shower Posse, ruled it as a “don”, keeping order, giving out jobs and welfare and commanding armed men. The United States asked for his extradition in August 2009; Golding’s government resisted for nine months, arguing that the American evidence came from illegal wiretaps, and was found to have paid a US law firm, Manatt, Phelps & Phillips, to lobby in Washington on the case. Under mounting pressure Golding announced on 17 May 2010 that the extradition would go ahead. Coke’s supporters barricaded the approaches to Tivoli Gardens with vehicles, wire and explosives, and on 23 May gunmen attacked and burned police stations in West Kingston. The government declared a state of emergency in Kingston and St Andrew, and on 24 May more than 1,000 police of the Jamaica Constabulary Force and soldiers of the Jamaica Defence Force stormed the area; the army fired 37 mortar rounds into it, and a US surveillance aircraft filmed the operation, which the government at first denied. Coke was not found. In the fighting of the next few days more than 70 people were killed, nearly all of them civilians of West Kingston (the Public Defender counted 74 civilians and one soldier; other counts range from 73 to 77 dead), and more than 700 men were detained, most of them later released. Coke was arrested at a police checkpoint near Kingston on 22 June 2010 and extradited to New York on 24 June; he pleaded guilty to racketeering and assault charges and was sentenced in 2012 to 23 years in prison. The West Kingston Commission of Enquiry, chaired by Sir David Simmons, reported in June 2016 that the mortar fire was a serious error of judgement and named 15 people who may have been killed unlawfully by the police."
