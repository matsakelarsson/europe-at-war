  - title: The Nafusa Mountains
    date: April – July 2011
    when: "2011-06-15"
    borders: "2011-06-15"
    countries: [ly, tn, fr]
    body:
      - "In the Nafusa Mountains south-west of Tripoli, the Amazigh (Berber) towns of Nalut, Jadu, Kabaw and Yafran and the Arab town of Zintan had risen in February. Government forces besieged them and shelled them from the plain, and tens of thousands of people fled to Tunisia. On 21 April the rebels took the border post of Wazin, opening a supply route from Dehiba in Tunisia, and in June France acknowledged that it had parachuted weapons to the mountain fighters. Through June and July the rebels broke the sieges and began to push down towards the coastal plain and the road to Tripoli."
      - "The rebel side was a coalition of local brigades, Islamists, defectors and exiles, with little central command. On 28 July its military commander, the former interior minister Abdul Fatah Younis, was killed after being summoned to Benghazi, in circumstances never fully explained; fighters of a rebel brigade were blamed. Meanwhile more states recognised the NTC as Libya’s legitimate authority; France had been the first, in March, and the United States followed on 15 July."
    facts:
