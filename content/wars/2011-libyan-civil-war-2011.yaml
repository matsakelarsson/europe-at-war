  - title: Gaddafi’s counter-offensive
    date: 1–19 March 2011
    when: "2011-03-10"
    borders: "2011-03-18"
    countries: [ly, fr, gb, us]
    body:
      - "Untrained volunteers in pick-up trucks, with a few defecting army units, pushed west along the coast road from Ajdabiya, through the oil port of Brega, and took Ras Lanuf on 4 March and Bin Jawad on 5 March. There they met the regular army: tanks, artillery and aircraft, and brigades such as the one commanded by Gaddafi’s son Khamis. Government forces drove the rebels back from Bin Jawad on 6 March, from Ras Lanuf on 10–12 March and from Brega by 15 March, and attacked Ajdabiya. In the west, Zawiya was retaken after a week of fighting on 10 March."
      - "As government columns approached Benghazi, a city of some 700,000, and Gaddafi promised to show “no mercy” to those who resisted, the Arab League asked the UN for a no-fly zone. On 17 March the Security Council adopted Resolution 1973, which authorised member states to take all necessary measures to protect civilians, short of a foreign occupation force, by ten votes, with Brazil, China, Germany, India and Russia abstaining."
      - "On 19 March government tanks and troops broke into the southern edge of Benghazi. That afternoon French aircraft struck armour on the approaches to the city, and that night American and British ships and submarines fired more than a hundred cruise missiles at Libya’s air defences. Over the next days air strikes destroyed the columns on the road to Ajdabiya, and the government’s advance on Benghazi collapsed."
    facts:
      - [Ras Lanuf taken by the rebels, "4 March 2011"]
      - [Zawiya retaken by the government, "10 March 2011"]
      - [Resolution 1973, "17 March 2011; 10 votes, 5 abstentions"]
      - [Battle of Benghazi and first air strikes, "19 March 2011"]
