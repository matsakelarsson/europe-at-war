steps:
  - title: The uprising in the east
    date: 15–27 February 2011
    when: "2011-02-17"
    borders: "2011-02-27"
    countries: [ly]
    body:
      - "Muammar Gaddafi had ruled Libya since he and other young officers overthrew King Idris in 1969. Under his Jamahiriya, the “state of the masses”, there were no parties or free press, the security services were everywhere, and the east, the old base of the monarchy, felt neglected. In January 2011 the presidents of Tunisia and then Egypt fell to popular uprisings. On 15 February the arrest in Benghazi of Fathi Terbil, a lawyer for the families of some 1,200 prisoners killed at Abu Salim prison in Tripoli in 1996, brought crowds into the streets, and protests spread on 17 February, the day opponents had called a Day of Rage."
      - "The security forces shot protesters in Benghazi, Bayda and other towns, killing scores, but soldiers and police deserted and crowds stormed police stations and barracks. On 20 February the Katiba, the fortified barracks in the centre of Benghazi, fell, and within days the whole of Cyrenaica from Ajdabiya to the Egyptian border was out of the government’s control. Gaddafi’s interior minister, Abdul Fatah Younis, and justice minister, Mustafa Abdul Jalil, changed sides, as did ambassadors and army units. In the west, Misrata, Zawiya, Zintan and other towns rose; in Tripoli the protests of 20–21 February were put down with live fire."
      - "On 22 February Gaddafi vowed on television to hunt down the rebels “house by house”. On 26 February the UN Security Council imposed an arms embargo and sanctions and referred the situation to the International Criminal Court. The next day a National Transitional Council was formed in Benghazi under Abdul Jalil. The rebels adopted the red, black and green flag of the monarchy."
    facts:
      - [Protests begin in Benghazi, "15 February 2011"]
      - [Benghazi’s Katiba barracks taken, "20 February 2011"]
      - [UN Resolution 1970, "26 February 2011"]
      - [National Transitional Council formed, "27 February 2011"]
