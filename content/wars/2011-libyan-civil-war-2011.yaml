  - title: Bani Walid, Sirte and the death of Gaddafi
    date: September – November 2011
    when: "2011-10-20"
    borders: "2011-10-20"
    countries: [ly, fr, us]
    body:
      - "Gaddafi’s last strongholds were the desert town of Bani Walid, home of the Warfalla, and his birthplace, Sirte, on the coast between Misrata and the oil ports. The rebels took Sabha and the Fezzan in late September, while Bani Walid held out until 17 October. Sirte was besieged from mid-September by brigades from Misrata and Benghazi and fought over street by street for a month, under artillery fire and NATO air strikes, until much of the city lay in ruins."
      - "On the morning of 20 October a convoy carrying Gaddafi tried to break out of Sirte. NATO aircraft, a French jet and an American drone, struck it, and Gaddafi was found hiding in a drainage pipe by Misratan fighters, who beat him; he was dead by the time he reached Misrata, where his body and that of his son Mutassim were put on display. Human Rights Watch later found the bodies of some 66 of his followers, apparently executed, at a hotel in Sirte."
      - "On 23 October the NTC proclaimed “the liberation of Libya” at a ceremony in Benghazi, and NATO ended its campaign on 31 October. Saif al-Islam Gaddafi was captured on 19 November near Ubari by fighters from Zintan, who held him for years. The war left Libya awash with weapons and in the hands of hundreds of armed brigades, local and Islamist, that no government could control, the seeds of the second civil war of 2014."
    facts:
      - [Sabha taken, "21 September 2011"]
      - [Bani Walid taken, "17 October 2011"]
      - [Sirte taken and Gaddafi killed, "20 October 2011"]
      - [NTC declares the war over, "23 October 2011"]
      - [NATO campaign ends, "31 October 2011"]
