    moves: Coalition moves
    success: Coalition success
notes:
  - "Estimates of the dead vary widely and are uncertain. In September 2011 the NTC spoke of 30,000 dead or more; in 2013 the Libyan government counted about 4,700 dead and 2,100 missing on the rebel side, with losses on the Gaddafi side thought to be similar. A UN commission of inquiry found that NATO air strikes had killed 60 civilians; Human Rights Watch counted 72. The commission found that both Gaddafi’s forces and the rebels had committed war crimes, among them killings of prisoners."
  - "The rebels called themselves revolutionaries (thuwar) and flew the flag of the monarchy of 1951–1969; the government called them rats, traitors and al-Qaeda. The NATO campaign, Operation Unified Protector, flew about 26,500 sorties, some 9,700 of them strike missions. The rebel-held areas on the maps are approximate."
