  - title: The fall of Tripoli
    date: August 2011
    when: "2011-08-21"
    borders: "2011-08-23"
    countries: [ly]
    body:
      - "In early August the mountain brigades came down to the coastal plain. Between 13 and 20 August they took Zawiya, Surman and Sabratha, cutting Tripoli off from Tunisia, and between 15 and 18 August they took Gharyan on the road south. In the east the Misratan brigades took Zliten, and Brega finally fell."
      - "On the night of 20 August, as planned with the rebel leadership, people in several districts of Tripoli rose up, in what was called Operation Mermaid Dawn, while brigades from Zintan, Zawiya and the mountains drove in from the west and Misratans landed by sea. On 21 August they reached Green Square, which they renamed Martyrs’ Square, and on 23 August they stormed Bab al-Aziziya. Fighting went on in the Abu Salim district and elsewhere until about 28 August. Retreating government troops killed prisoners, among them some 45 men burned in a warehouse near the Khamis Brigade’s base."
      - "Gaddafi and his sons escaped. Part of his family crossed into Algeria on 29 August. The NTC moved to Tripoli, and on 16 September the UN General Assembly gave it Libya’s seat."
    facts:
