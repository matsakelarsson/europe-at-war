id: libyan-civil-war-2011
name: Libyan Civil War (2011)
start: "2011-02-15"
end: "2011-10-23"
tier: A
summary: "The uprising and civil war that overthrew Muammar Gaddafi, who had ruled Libya since 1969. Inspired by the revolutions in Tunisia and Egypt, protests broke out in Benghazi on 15 February 2011, and within days the east of the country and several towns in the west were in the hands of rebels, soldiers and officials who had changed sides. A National Transitional Council (NTC) formed in Benghazi on 27 February. Gaddafi’s forces crushed the rising in Zawiya, drove the rebels back along the coast and reached the outskirts of Benghazi on 19 March, two days after the UN Security Council authorised all necessary measures to protect civilians. French, British and American air strikes stopped them, and NATO took command of the air campaign at the end of March. Misrata held out through a siege of nearly three months, and the Berber and Arab towns of the Nafusa Mountains through the summer. In August the rebels advanced from the mountains to the coast, and Tripoli fell between 20 and 28 August. Gaddafi’s last strongholds, Bani Walid and his home town of Sirte, fell in October; on 20 October Gaddafi was captured outside Sirte and killed, and the NTC declared the war over on 23 October. Estimates of the dead range from about 10,000 to well over 20,000."
countries: [ly, fr, gb, us, it, tn]
sides:
