  - title: NATO and the siege of Misrata
    date: March – May 2011
    when: "2011-04-15"
    borders: "2011-04-15"
    countries: [ly, fr, gb, us, it]
    body:
      - "France, Britain and the United States led the first strikes, joined by Canada, Italy, Belgium, Denmark, Norway, Spain and others, with aircraft from Qatar and the United Arab Emirates and Swedish reconnaissance planes. On 31 March NATO took command of the operation, which it named Unified Protector, and its aircraft attacked tanks, artillery, ammunition stores and command centres, among them Gaddafi’s compound of Bab al-Aziziya in Tripoli, while its ships enforced the arms embargo. The United States, after the first weeks, left most of the strikes to its allies but provided refuelling, intelligence and drones."
      - "Misrata, a trading city of some 300,000 people, was cut off by land from late February. Government forces shelled it with artillery, Grad rockets and cluster munitions and sent tanks and snipers into Tripoli Street, the main avenue through the centre. The port was the city’s only lifeline: ships brought in food and weapons and took out the wounded and thousands of foreign workers. In bitter street fighting the city’s brigades drove the government forces out of the centre by late April, took the airport on 11 May and pushed the front back to the edge of the city. Government forces used the nearby town of Tawergha as a base; in August Misratan brigades expelled its entire population of some 30,000, black Libyans whom they accused of joining in the siege."
      - "In the east the front settled for months between Ajdabiya and Brega. The rebels were badly trained and equipped, and the war looked like a stalemate. The ICC issued arrest warrants on 27 June for Gaddafi, his son Saif al-Islam and his intelligence chief Abdullah Senussi."
    facts:
      - [NATO takes command, "31 March 2011"]
      - [Siege of Misrata, "late February – mid-May 2011"]
      - [Misrata airport taken, "11 May 2011"]
      - [ICC arrest warrants, "27 June 2011"]
