id: sudanese-conflict-in-south-kordofan-and-blue-nile
name: Conflict in South Kordofan and Blue Nile
start: "2011-06-05"
end: "2020-10-03"
tier: C
summary: "The war between the government of Sudan and the SPLM-North, the northern branch of the Sudan People’s Liberation Movement, in the two border states that stayed in Sudan when South Sudan became independent. The Nuba of South Kordofan and peoples of southern Blue Nile had fought on the SPLA’s side in the second civil war, and the peace agreement of 2005 promised them only “popular consultations”. After disputed state elections in South Kordofan in May 2011, which the ruling party’s Ahmed Haroun won against the SPLM’s Abdelaziz al-Hilu, the army moved to disarm the SPLA’s Nuba units; fighting broke out in Kadugli on 5 June 2011, with reports of targeted killings of Nuba civilians. In September 2011 it spread to Blue Nile, where the elected governor and SPLM-North chairman Malik Agar was removed and fled to Kurmuk. The government bombed villages with Antonov aircraft and restricted aid, and hundreds of thousands of people fled to the rebel-held Nuba Mountains around Kauda, to refugee camps such as Yida and Maban in South Sudan, and to Ethiopia. With the Darfur rebels the SPLM-North formed the Sudan Revolutionary Front in November 2011. The war also set Sudan against South Sudan, which Khartoum accused of arming the rebels: on 10 April 2012 South Sudan’s army seized the Heglig oil field, and Sudan retook it about ten days later and bombed the area around Bentiu; the two states signed cooperation agreements in Addis Ababa in September 2012. The SPLM-North split in 2017 between al-Hilu’s faction, which held most of the Nuba Mountains, and Agar’s. Ceasefires held from 2016, and after Bashir’s fall Agar’s faction signed the Juba Peace Agreement of 3 October 2020; al-Hilu’s faction stayed out, and in the civil war of 2023 it took part in the fighting and later allied with the RSF."
