id: central-african-republic-civil-war
name: Central African Republic Civil War
start: "2012-12-10"
end: ongoing
tier: A
summary: "The war that began in December 2012, when the Séléka, an alliance of rebel groups from the largely Muslim north-east, marched on Bangui and in March 2013 overthrew President François Bozizé. The Séléka’s looting and killings provoked the rise of the Anti-balaka, militias drawn mostly from Christian and animist communities, which drove much of the Muslim population out of the west of the country. French troops, African and then UN peacekeepers intervened, the Séléka leader Michel Djotodia resigned in 2014, and elections in 2016 brought Faustin-Archange Touadéra to power, but the country remained divided between more than a dozen armed groups fighting over mines, cattle routes and roadblocks. After a peace agreement in 2019 failed, the armed groups united against Touadéra in the Coalition of Patriots for Change (CPC) in December 2020; Russian Wagner fighters and Rwandan troops drove them back from Bangui and most towns. Two of the largest groups disarmed in 2025, but violence continues in the north-east and south-east. No reliable overall death toll exists; more than a million people were displaced at the height of the war."
countries: [cf, td, fr, za, rw, cm, cd, sd]
