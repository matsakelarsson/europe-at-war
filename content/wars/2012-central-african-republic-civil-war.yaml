  - title: Disarmament and the war at the borders
    date: 2023 – November 2026
    when: "2025-07-10"
    borders: "2026-11-27"
    countries: [cf, td, sd, ru]
    body:
      - Last updated 27 November 2026. After the death of Wagner’s founder Yevgeny Prigozhin in 2023, Russia moved to bring its forces in the country under the defence ministry’s Africa Corps, and in 2025 asked Bangui to pay for them; how far Africa Corps had replaced Wagner by 2026 is unclear. In the south-east the Azande Ani Kpi Gbe militia, parts of it trained by Wagner, fought the UPC and Fulani herders around Zemio from 2023, while the war in Sudan sent fighters, weapons and refugees across the north-eastern border.
      - Under an agreement signed in N’Djamena on 19 April 2025 with Chadian mediation, the leaders of the UPC and 3R, Ali Darassa and Sembé Bobbo, laid down their arms in Bangui on 10 July 2025 and announced the dissolution of their movements; by October 2026, 1,907 fighters had been disarmed. Touadéra won a third term in the election of 28 December 2025 with 77.9 per cent of the vote according to the Constitutional Court; the main opposition coalition boycotted it and other candidates alleged fraud.
      - Violence continued in the north-east and south-east. On 30 June 2026 armed groups attacked Am-Dafock on the Sudanese border, held it for five days and withdrew into Sudan, displacing some 17,000 people and wounding six peacekeepers. The UN attributed 26 serious incidents in the south-east between June and September to suspected Lord’s Resistance Army fighters, who abducted 68 civilians, about 40 of them children, and said the Azande Ani Kpi Gbe militia still threatened local people. On 12 November 2026 the UN Security Council extended MINUSCA’s mandate to November 2027, cutting its authorised strength from 14,046 to 12,000 soldiers.
    facts:
      - [UPC and 3R dissolve, "10 July 2025"]
      - [Touadéra re-elected, "28 December 2025"]
      - [Attack on Am-Dafock, "30 June 2026"]
      - [MINUSCA extended to, "15 November 2027"]
