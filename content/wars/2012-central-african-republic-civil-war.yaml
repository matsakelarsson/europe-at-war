  - title: Séléka rule and the Anti-balaka
    date: April 2013 – January 2014
    when: "2013-12-05"
    borders: "2013-12-05"
    countries: [cf, fr, td]
    body:
      - Séléka rule brought looting, killings and the burning of villages, much of it aimed at Christian communities in the west. Regional leaders recognised Djotodia only as head of a transition, and in September 2013 he formally dissolved the Séléka, but he could not control its fighters. Village self-defence groups and former soldiers of Bozizé’s army, mostly Christian or animist, organised as the Anti-balaka (the name is usually explained as “anti-machete” in Sango, or as “anti-bullet”), and from September they attacked the Séléka and Muslim civilians around Bossangoa.
      - On 5 December 2013 the Anti-balaka attacked Bangui; their killings and the Séléka’s reprisals left about 1,000 people dead in two days. The same day the UN Security Council authorised the African Union force MISCA and French troops to restore order, and France launched Operation Sangaris with 1,600 soldiers. Under pressure from the region’s leaders, Djotodia resigned at a summit in N’Djamena on 10 January 2014.
    facts:
      - [Séléka formally dissolved, "13 September 2013"]
      - [Anti-balaka attack on Bangui, "5 December 2013"]
      - [Operation Sangaris begins, "5 December 2013"]
      - [Djotodia resigns, "10 January 2014"]
    markers:
