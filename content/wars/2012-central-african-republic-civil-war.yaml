notes:
  - "The war is often described as a conflict between Muslims and Christians, and from 2013 the killings took on a strongly religious and communal character. Many historians and analysts stress its other roots: decades of neglect of the north-east, competition over diamonds, gold and cattle routes, the role of Chad and Sudan, and armed groups that recruited across religious lines and often fought among themselves. A UN commission of inquiry found in December 2014 that the Anti-balaka had carried out ethnic cleansing of Muslims and that both the Séléka and the Anti-balaka had committed war crimes and crimes against humanity, but did not conclude that there had been genocide; it estimated that up to 6,000 people had been killed by then, a figure it considered too low."
  - "Russia’s role is disputed. The government and Russia describe the Russian personnel as instructors invited under a defence agreement; UN experts, journalists and rights groups have identified most of them as Wagner fighters and accused them of executions, torture and the killing of civilians, and have documented Russian mining and timber interests. After Wagner’s founder died in 2023, Russia sought to bring its forces under the defence ministry’s Africa Corps; how far Africa Corps had replaced Wagner by 2026 is unclear."
  - The Central African Republic Bush War of 2004–2007, between Bozizé’s government and northern rebels, is told separately.
