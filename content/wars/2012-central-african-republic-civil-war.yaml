  - title: Ethnic cleansing and partition
    date: 2014 – 2015
    when: "2014-09-15"
    borders: "2014-09-15"
    countries: [cf, fr, td, cm]
    body:
      - As the Séléka withdrew to the north and east, Anti-balaka militias and mobs killed Muslims and drove them out of most of the west. Tens of thousands fled to Chad and Cameroon, and those who stayed were confined to enclaves guarded by peacekeepers, like the PK5 district of Bangui. Catherine Samba-Panza, the mayor of Bangui, was elected interim president on 20 January 2014. Chad, accused of favouring the Séléka, withdrew its troops from MISCA in April 2014 after its soldiers killed civilians in Bangui.
      - A ceasefire signed in Brazzaville in July 2014 did not hold. On 15 September 2014 the UN mission MINUSCA took over from MISCA. The ex-Séléka split into rival factions, among them Noureddine Adam’s FPRC in the north-east and Ali Darassa’s mainly Fulani UPC around Bambari, while Anti-balaka groups held much of the west, and the country was in effect partitioned. Peacekeepers, French soldiers among them, were accused of sexually abusing children, and the head of MINUSCA was dismissed in 2015.
    facts:
      - [Samba-Panza elected interim president, "20 January 2014"]
      - [Brazzaville ceasefire, "23 July 2014"]
      - [MINUSCA takes over, "15 September 2014"]
