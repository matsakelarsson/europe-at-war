  - title: Elections, Khartoum and the Russians
    date: 2016 – 2019
    when: "2019-02-06"
    borders: "2019-02-06"
    countries: [cf, fr, sd, ru]
    body:
      - Peaceful elections brought Faustin-Archange Touadéra, a former prime minister, to the presidency in March 2016, and France ended Operation Sangaris in October. But armed groups controlled most of the country and fought over mines, cattle routes and roadblocks. From 2017 the violence spread to the south-east, where Anti-balaka militias attacked Muslims and peacekeepers at Bangassou in May 2017 and UPC fighters attacked a camp for displaced people at the Catholic mission of Alindao in November 2018, killing dozens. In the north-west a Fulani militia, 3R, fought Anti-balaka groups.
      - As French influence waned, Touadéra turned to Russia. From 2018 Russian instructors, most of them from the Wagner Group, trained the army and guarded the president, and Russian companies received mining rights. Talks led by the African Union in Khartoum produced the Political Agreement for Peace and Reconciliation, signed in Bangui on 6 February 2019 by the government and fourteen armed groups. Leaders such as Ali Darassa of the UPC and Sidiki Abass of 3R were given government posts, but within months 3R fighters killed more than 50 villagers near Paoua.
    facts:
      - [Touadéra takes office, "30 March 2016"]
      - [Operation Sangaris ends, "October 2016"]
      - [Peace agreement signed in Bangui, "6 February 2019"]
