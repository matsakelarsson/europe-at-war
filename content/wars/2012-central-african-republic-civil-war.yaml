steps:
  - title: The Séléka takes Bangui
    date: December 2012 – March 2013
    when: "2013-03-24"
    borders: "2013-03-24"
    countries: [cf, td, za]
    body:
      - François Bozizé, who had seized power in 2003 with Chadian help, won disputed elections in 2011, and the rebel groups of the neglected north-east accused him of breaking the agreements that had ended the bush war. In December 2012 several of them, among them the CPJP, the UFDR and the CPSK, formed the Séléka (“alliance” in Sango), joined by fighters from Chad and Sudan. From 10 December they took Ndélé, Bria, Bambari and Kaga-Bandoro and reached Damara, some 75 km from Bangui, where Chadian troops of the regional peace force stood in their way.
      - A ceasefire signed at Libreville on 11 January 2013 made the Séléka leader Michel Djotodia minister of defence and an opposition politician prime minister, but the rebels accused Bozizé of not keeping it. In March the Séléka advanced again and on 22–24 March fought its way into Bangui, where some 200 South African soldiers sent to support Bozizé lost thirteen dead. Bozizé fled to the Democratic Republic of the Congo, the city was looted, and on 25 March Djotodia declared himself president, the first Muslim to rule the country.
    facts:
      - [Séléka offensive begins, "10 December 2012"]
      - [Libreville ceasefire, "11 January 2013"]
      - [Séléka takes Bangui, "24 March 2013"]
      - [South African soldiers killed, "13"]
