  - title: The CPC marches on Bangui
    date: December 2020 – 2023
    when: "2021-01-13"
    borders: "2021-01-13"
    countries: [cf, rw, ru, fr]
    body:
      - Bozizé returned from exile in December 2019. When the Constitutional Court barred him from the presidential election of December 2020, the main armed groups, among them ex-Séléka factions, the UPC, 3R and Anti-balaka groups, formed the Coalition of Patriots for Change (CPC) and advanced on the capital; Bozizé later became its coordinator. Touadéra was re-elected on 27 December amid the fighting, with many people unable to vote. On 13 January 2021 CPC fighters attacked the outskirts of Bangui and were driven off by the army, peacekeepers and Rwandan and Russian troops.
      - Rwanda, whose soldiers also served in MINUSCA, sent special forces under a bilateral agreement, and Russia sent hundreds more “instructors”, mostly Wagner fighters. In 2021 they drove the CPC from most towns, including Bambari and Bossangoa, but UN experts and rights groups accused Wagner and the army of executions, torture and the killing of civilians, as at Aïgbado in January 2022, where at least 65 people were killed. France suspended aid and withdrew its last soldiers in 2022, and a referendum in July 2023 abolished presidential term limits.
    facts:
      - [CPC formed, "December 2020"]
      - [Touadéra re-elected, "27 December 2020"]
      - [CPC attack on Bangui repulsed, "13 January 2021"]
      - [Term limits abolished by referendum, "30 July 2023"]
