  - title: Coups, Wagner and the French withdrawal
    date: 2020–2022
    when: "2020-08-18"
    borders: "2022-08-15"
    countries: [ml, fr, ru]
    body:
      - "Months of protests against IBK, led by the imam Mahmoud Dicko and the M5-RFP movement, ended on 18 August 2020 when colonels led by Assimi Goïta arrested the president, who resigned. A transitional government under the retired officer Bah Ndaw followed, with Goïta as vice-president, until Goïta removed Ndaw in a second coup on 24 May 2021 and became president. ECOWAS imposed sanctions in January 2022 when the junta put off elections, and lifted them in July."
      - "Relations with France broke down. A French air strike near Bounti in January 2021 killed 19 civilians at a wedding gathering, according to a UN inquiry that France rejected, and the junta, popular for its defiance, brought in the Russian Wagner Group in December 2021, calling its men instructors. From 27 to 31 March 2022, at Moura in the Inner Niger Delta, Malian soldiers and foreign armed men, whom witnesses identified as Russians, killed about 500 people, most of them men executed after the village was surrounded, according to a UN report of 2023; the government said 203 jihadists had been killed."
      - "France announced its withdrawal in February 2022, and the last Barkhane troops left Mali from Gao on 15 August 2022. In the east, the Islamic State’s Sahel Province, as ISGS was now called, killed hundreds of civilians in an offensive in the Ménaka region in 2022."
    facts:
      - [Coups, "18 August 2020 and 24 May 2021"]
      - [Moura massacre, "27–31 March 2022"]
      - [Last French troops leave Mali, "15 August 2022"]
    markers:
