        text: JNIM briefly took the army camp; 41 soldiers were killed.
        lonlat: [-5.251, 14.825]
      - kind: battle
        name: Kayes
        date: 1 July 2025
        text: JNIM attacked Kayes, Nioro du Sahel and other towns of the west; the army said it repelled them.
        lonlat: [-11.433, 14.450]
    areas:
      - style: contested
        side: jih
        label: Central Mali, contested by JNIM (approximate)
        atoms: [ML-5, ML-4]
  - title: The fuel blockade
    date: September 2025 – early 2026
    when: "2025-09-03"
    borders: "2025-10-28"
    countries: [ml, sn, ci, gn, ne]
    body:
      - "On 3 September 2025 JNIM announced a blockade of fuel imports into Mali. Landlocked, the country depends on tanker trucks from the ports of Dakar, Abidjan and Conakry, and JNIM fighters began to ambush the convoys on the roads through Kayes and Sikasso, kidnapping drivers and burning trucks. Escorts by the army and the Africa Corps could not stop them: more than 300 tankers were destroyed in the months that followed."
      - "By October Bamako and other towns were short of fuel. Drivers queued for hours or days, power cuts spread, businesses closed and schools shut from 26 October to 9 November. On 28 October the US embassy told American citizens to leave the country. Convoys under heavy escort brought fuel to the capital from late October, and on 1 November JNIM extended the blockade to fuel coming from Niger."
      - "The blockade eased in early 2026, through local deals, army operations and perhaps JNIM’s own preparations, though the government rationed fuel nationwide from January and a JNIM ambush of a convoy in the west killed at least 15 people on 29 January."
    facts:
      - [Blockade announced, "3 September 2025"]
      - [Schools closed, "26 October – 9 November 2025"]
      - [Tankers destroyed, "more than 300"]
    markers:
      - kind: capital
        side: ml
        name: Bamako
        date: October – November 2025
        text: The capital ran short of fuel; the government kept supplies for the army and the power plants.
        lonlat: [-8.003, 12.639]
      - kind: battle
        side: jih
        name: Kayes
        date: September 2025 onwards
        text: Convoys on the road from Dakar were ambushed and burned in the region of Kayes.
        lonlat: [-11.433, 14.450]
      - kind: battle
        side: jih
        name: Kolondiéba
        date: 17 October 2025
        text: More than 50 tankers on the road from the Ivory Coast were burned in a single ambush.
        lonlat: [-6.900, 11.083]
      - kind: event
        side: jih
        name: Sikasso
        date: October 2025
        text: The southern corridor from the Ivory Coast and Guinea was attacked repeatedly.
        lonlat: [-5.667, 11.317]
