  - title: Anéfis, Dioura and the return to Kidal
    date: July – November 2026
    when: "2026-07"
    borders: "2026-10-06"
    countries: [ml, ru, dz]
    body:
      - "Last updated 27 November 2026. Fighting resumed in July. The FLA took most of Anéfis on 4–5 July and lost it to an army counter-attack on 9 July, and on 17–18 July FLA and JNIM fighters ambushed a convoy returning from Anéfis, killing at least 50 soldiers and capturing dozens, the army’s worst loss in years. JNIM routed the army at Kouakourou in the Inner Niger Delta on 18 July and attacked the camp at San in August; on 10 September it overran the camp at Dioura, where AFP reported at least 50 soldiers and five Africa Corps fighters killed and later sources more than 100. The FLA released 82 captured soldiers in August and some 60 more in an exchange."
      - "In an air and ground campaign with the Africa Corps, the army closed in on Kidal, and on 6 October 2026 it entered the town after the FLA announced a “strategic and controlled withdrawal”, which it called temporary; the movements said the army met no resistance, and analysts called the gain symbolic rather than decisive."
      - "In November JNIM kept up attacks in the centre and the Niger bend: villages in the Mopti region emptied under attacks attributed to it in early November, it said it shelled the army camp at Léré on 12 November, it attacked army and Africa Corps positions in the Ségou region on 21 November, and on 25 November it gave the people of Tonka, south-west of Timbuktu, an ultimatum to leave before it blockaded the town. Army-escorted convoys brought some 1,500 fuel tankers to Bamako in the first half of November. ACLED counted 247 reported deaths in Mali in October. On 24 November Goïta told his commanders to keep up the pressure, while the International Crisis Group urged the Sahel governments to consider talks with JNIM. How far JNIM’s blockade of the capital holds, how much of the countryside it controls and how many have died this year cannot be checked independently, since journalists have little access to the north and centre."
    facts:
      - [Ambush near Anéfis, "17–18 July 2026, at least 50 soldiers killed"]
      - [Fall of the Dioura camp, "10 September 2026"]
      - [Army returns to Kidal, "6 October 2026"]
