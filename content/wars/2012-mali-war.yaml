notes:
  - "Azawad is the name the Tuareg movements give to the north of Mali (the regions of Timbuktu, Gao, Kidal and Ménaka). Its population is mostly Songhai, Fulani, Tuareg and Arab, and the separatists never spoke for all of it. The MNLA joined other movements in the Coordination of Azawad Movements (CMA) in 2014 and the Strategic Framework (CSP) in 2021–2023, and in November 2024 they merged into the Azawad Liberation Front (FLA)."
  - "The jihadist groups: Ansar Dine (“Defenders of the faith”), founded by Iyad Ag Ghaly in 2011; AQIM’s Saharan units; the Movement for Oneness and Jihad in West Africa (MUJAO); and al-Mourabitoun, formed by MUJAO and Mokhtar Belmokhtar’s men in 2013. With the Katiba Macina of Amadou Koufa they founded Jama’at Nusrat al-Islam wal-Muslimin (JNIM, “Group for the Support of Islam and Muslims”) on 2 March 2017. The Islamic State in the Greater Sahara (ISGS) split from al-Mourabitoun in 2015 and became the Islamic State’s Sahel Province in 2022."
  - "Casualty figures come from governments, armed groups, the UN and ACLED’s counts of reported deaths, and often differ widely; journalists have had little access to the north and centre since 2022. Estimates of the total dead run to about 20,000 or more."
