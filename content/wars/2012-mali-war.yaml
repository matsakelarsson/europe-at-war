id: mali-war
name: Mali War
start: "2012-01-17"
end: ongoing
tier: A
summary: "The war that began in January 2012 when the National Movement for the Liberation of Azawad (MNLA), a Tuareg separatist movement strengthened by fighters returning from Libya, rose in northern Mali together with the jihadist groups Ansar Dine, al-Qaeda in the Islamic Maghreb (AQIM) and MUJAO. After soldiers angry at their defeats overthrew the government in Bamako in March 2012, the rebels took the whole north and the MNLA declared an independent Azawad, but the jihadists soon drove it out and ruled the north under their law. When they advanced south in January 2013, France intervened with Operation Serval and, with Chadian and Malian troops, retook the towns of the north within weeks. A UN mission, MINUSMA, and France’s Sahel-wide Operation Barkhane followed, and the Algiers Accord of 2015 made peace with the Tuareg and Arab movements. But the jihadists, united from 2017 in JNIM, an al-Qaeda affiliate, and rivalled by the Islamic State in the Greater Sahara, spread into central Mali and into Burkina Faso and Niger, and communal massacres followed. Two coups in 2020 and 2021 brought Colonel Assimi Goïta’s junta to power; it turned to Russia’s Wagner Group, made the French and the UN leave, ended the Algiers Accord and took Kidal in 2023. Since 2025 JNIM has blockaded fuel supplies to the south, and in April 2026 JNIM and the Azawad Liberation Front (FLA) launched a nationwide offensive in which the defence minister was killed and the FLA took Kidal, which the army retook in October 2026. Some 20,000 people or more have been killed, and more than 400,000 were displaced inside Mali by 2025."
countries: [ml, fr, td, bf, ne, dz, ru]
