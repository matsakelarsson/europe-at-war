  - title: Ansar Dine, AQIM and MUJAO rule the north
    date: April 2012 – January 2013
    when: "2012-06-27"
    borders: "2012-07-01"
    countries: [ml, mr, bf, ne, dz]
    body:
      - "The alliance of the secular MNLA and the jihadists did not last. Talks on a merger with Ansar Dine broke down in May, and on 26–27 June 2012 MUJAO, an offshoot of AQIM led by Mauritanian and Malian Arabs, drove the MNLA out of Gao. Ansar Dine and AQIM took control of Timbuktu and Kidal, and by the end of the year the MNLA held little more than pockets near the Algerian and Nigerien borders. MUJAO took Douentza, at the edge of central Mali, on 1 September."
      - "The jihadists ruled the towns of the north under their reading of Islamic law. They banned music, smoking and alcohol, imposed the veil, flogged offenders, cut off the hands of thieves and in July 2012 stoned a couple to death at Aguelhok. From 30 June Ansar Dine fighters destroyed the tombs of Sufi saints in Timbuktu, a World Heritage Site, and in 2016 the International Criminal Court sentenced one of their leaders, Ahmad al-Faqi al-Mahdi, to nine years for the destruction. Some of the people of the north welcomed the order the jihadists brought after the looting of the rebellion, but some 400,000 fled, half of them to Mauritania, Burkina Faso, Niger and Algeria."
      - "In Bamako the government was weak and divided, and the army was in no state to retake the north. ECOWAS planned an African force, and on 20 December 2012 the UN Security Council authorised it as AFISMA, though it was not expected to deploy before the autumn of 2013."
    facts:
      - [Battle of Gao, "26–27 June 2012"]
      - [Destruction of Timbuktu’s mausoleums, "from 30 June 2012"]
      - [People displaced, "about 400,000"]
