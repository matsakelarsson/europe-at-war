  - title: MINUSMA, Kidal and the Algiers Accord
    date: 2013–2015
    when: "2013-07-01"
    borders: "2014-05-21"
    countries: [ml, fr, dz, bf]
    body:
      - "A preliminary agreement signed at Ouagadougou on 18 June 2013 with the MNLA and the High Council for the Unity of Azawad allowed elections, and Ibrahim Boubacar Keïta (IBK) was elected president that summer. On 1 July 2013 the UN mission MINUSMA, created by the Security Council in April, took over from AFISMA. With an authorised strength of some 13,000 troops and 1,900 police, it became the most dangerous UN peacekeeping mission of its time: by 2023 more than 300 of its personnel had died. On 1 August 2014 France replaced Serval with Operation Barkhane, a counter-terrorism operation of about 3,000, later 5,100, troops across Mali, Niger, Chad, Burkina Faso and Mauritania."
      - "Kidal remained the sticking point. When Prime Minister Moussa Mara insisted on visiting it on 17 May 2014, fighting broke out and officials taken hostage in the governor’s office were killed. On 21 May an army assault on the town collapsed; the MNLA and its allies drove the army from Kidal and several other towns of the north, and a ceasefire was arranged by Mauritania’s president as chairman of the African Union. The movements formed the Coordination of Azawad Movements (CMA), while pro-government Tuareg and Arab militias, among them the Imghad of GATIA, joined in the Platform and fought them."
      - "After months of talks in Algiers, the government and the Platform signed a peace agreement on 15 May 2015 and the CMA on 20 June. The Algiers Accord promised regional autonomy, the integration of rebel fighters into the army and development for the north, but was carried out slowly. The jihadists stayed outside it: on 20 November 2015 gunmen of al-Mourabitoun and AQIM attacked the Radisson Blu hotel in Bamako and killed 20 hostages."
    facts:
      - [MINUSMA takes over, "1 July 2013"]
      - [Battle of Kidal, "17–21 May 2014"]
      - [Algiers Accord, "15 May and 20 June 2015"]
