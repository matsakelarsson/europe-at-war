steps:
  - title: The MNLA rebellion and the coup
    date: January – April 2012
    when: "2012-01-17"
    borders: "2012-04-06"
    countries: [ml, ly]
    body:
      - "The Tuareg of the Adrar des Ifoghas had risen against the Malian state in 1963, 1990 and 2006, and the north remained poor, thinly governed and a corridor for smuggling, where AQIM held Western hostages from the mid-2000s. When Muammar Gaddafi fell in 2011, hundreds of Malian Tuareg who had served in his army came home with their weapons. In October 2011 they joined younger activists in the National Movement for the Liberation of Azawad (MNLA), which demanded independence for the north. Iyad Ag Ghaly, leader of the 1990 rebellion, failed to win its leadership and founded Ansar Dine, a movement that wanted Islamic law for all of Mali and was close to AQIM."
      - "On 17 January 2012 the MNLA attacked Ménaka, and over the next weeks it besieged the army camps of Aguelhok and Tessalit, with Ansar Dine and AQIM fighters taking part. When the camp at Aguelhok was overrun on 24–25 January, dozens of soldiers who had surrendered were executed; the Malian authorities spoke of 70 to more than 100 killed, and one Malian source gave 153 dead. Anger at the government’s handling of the war spread among soldiers and their families, and on 22 March junior officers led by Captain Amadou Sanogo overthrew President Amadou Toumani Touré, a month before he was due to step down. ECOWAS closed the borders and forced the junta to hand power to an interim president, Dioncounda Traoré, in April."
      - "The army in the north collapsed. Rebels took Kidal on 30 March, Gao on 31 March and Timbuktu on 1 April, and on 6 April the MNLA declared the independence of the State of Azawad. No state recognised it; the African Union and the European Union called the declaration null and void."
    facts:
      - [Attack on Ménaka, "17 January 2012"]
      - [Coup in Bamako, "22 March 2012"]
      - [Independence of Azawad declared, "6 April 2012"]
