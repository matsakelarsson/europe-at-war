  - title: Konna and Operation Serval
    date: January – March 2013
    when: "2013-01-10"
    borders: "2013-01-11"
    countries: [ml, fr, td, dz]
    body:
      - "In early January 2013 the jihadist groups moved south, and on 10 January they took Konna, 55 km from the army’s base and airfield at Sévaré, the gateway to the south. The interim president asked France for help, and on 11 January President François Hollande launched Operation Serval: French helicopters struck the columns near Konna, losing a pilot on the first day, and jets bombed bases in Gao and elsewhere. A second column took Diabaly in the west on 14 January. French ground troops, flown in from France and from bases in Africa, moved north with the Malian army, and Konna and Diabaly were back in government hands within ten days. In Algeria, on 16 January, Mokhtar Belmokhtar’s group seized the gas plant at In Amenas in reprisal."
      - "French and Malian troops took Gao on 26 January and Timbuktu on 27–28 January, where fleeing jihadists had set fire to a library of manuscripts. French troops landed at Kidal’s airport on 29–30 January, where the MNLA had returned, and kept the Malian army out of the town. Tessalit followed on 8 February."
      - "The jihadists withdrew into the Adrar des Ifoghas, the rocky massif north of Kidal. In February and March French troops and some 2,000 Chadian soldiers fought them in its valleys and destroyed AQIM’s main bases; the AQIM commander Abdelhamid Abou Zeid was killed in late February. Chad lost some 38 soldiers and France nine in the whole of Serval; the jihadists lost several hundred killed. Troops of AFISMA from West African states and Chad arrived through the spring."
    facts:
      - [Fall of Konna, "10 January 2013"]
      - [Operation Serval launched, "11 January 2013"]
      - [Gao and Timbuktu retaken, "26–28 January 2013"]
