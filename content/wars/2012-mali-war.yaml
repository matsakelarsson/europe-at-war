  - title: MINUSMA leaves and the army takes Kidal
    date: 2023 – January 2024
    when: "2023-08"
    borders: "2023-11-14"
    countries: [ml, ru, dz]
    body:
      - "In June 2023 Mali asked the UN to leave, and on 30 June the Security Council ended MINUSMA’s mandate; its troops left by the end of the year. As they handed over their camps in the north, the army and the Azawad movements, now grouped in the Strategic Framework (CSP), fought over them, and from August the movements fought the army at Ber, Bourem, Léré and elsewhere. JNIM besieged Timbuktu from August, and on 7 September its fighters attacked the river boat Tombouctou near Bamba and a nearby army camp; the government said 49 civilians and 15 soldiers were killed."
      - "In October a large army column with Wagner fighters, drones and aircraft moved north from Gao, took the camp at Anéfis and on 14 November 2023 entered Kidal, which the movements had held since 2014. The junta ended the Algiers Accord on 25 January 2024. With the juntas of Burkina Faso and Niger it had formed the Alliance of Sahel States in September 2023, and in January 2024 the three announced that they would leave ECOWAS, which they did a year later."
    facts:
      - [MINUSMA mandate ends, "30 June 2023"]
      - [Army and Wagner enter Kidal, "14 November 2023"]
      - [Algiers Accord ended, "25 January 2024"]
