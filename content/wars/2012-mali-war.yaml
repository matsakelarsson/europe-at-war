  - title: Tinzaouaten, Bamako and the Africa Corps
    date: 2024–2025
    when: "2024-07-25"
    borders: "2024-09-17"
    countries: [ml, ru, dz, ua]
    body:
      - "Pursuing the movements towards the Algerian border, an army and Wagner column was ambushed near Tinzaouaten on 25–27 July 2024 by the CSP, with JNIM claiming a part. It was Wagner’s worst defeat in Africa: estimates of the Russians killed run from about 25 to more than 80, and dozens of Malian soldiers were killed or captured. A Ukrainian intelligence spokesman hinted at a role, and Mali broke off relations with Ukraine. In late November 2024 the movements merged into the Azawad Liberation Front (FLA); a drone strike killed several of its leaders days later."
      - "On 17 September 2024 JNIM struck the capital itself, attacking the gendarmerie school at Faladié and the military airport in Bamako. The government gave no toll; security sources and AFP reported more than 70 dead, many of them young gendarmes."
      - "In 2025 JNIM overran army camps at Dioura in May, killing 41 soldiers, and at Boulkessi on 1 June, where some 100 soldiers were reported killed, and on 1 July it attacked Kayes, Nioro du Sahel and other towns of the west, near the borders of Senegal and Mauritania. In June Wagner announced that it was leaving Mali; the Russian defence ministry’s Africa Corps took its place. The junta dissolved the political parties in May and gave Goïta a five-year, renewable term in July."
    facts:
      - [Battle of Tinzaouaten, "25–27 July 2024"]
      - [JNIM attack on Bamako, "17 September 2024"]
      - [FLA founded, "30 November 2024"]
    markers:
      - kind: battle
