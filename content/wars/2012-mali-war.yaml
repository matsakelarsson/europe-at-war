  - title: The war moves to the centre
    date: 2015–2020
    when: "2017-03-02"
    borders: "2019-03-23"
    countries: [ml, bf, ne, fr]
    body:
      - "From 2015 the Katiba Macina of Amadou Koufa, a Fulani preacher from the Inner Niger Delta, spread the insurgency into the Mopti and Ségou regions. Its fighters killed officials, village chiefs and suspected informers, closed state schools and drew recruits among Fulani herders who resented the state, local elites and their Dogon and Bambara farming neighbours. On 2 March 2017 Iyad Ag Ghaly announced that Ansar Dine, the Katiba Macina, al-Mourabitoun and AQIM’s Saharan emirate had merged into JNIM, pledging allegiance to al-Qaeda. A rival, the Islamic State in the Greater Sahara, led by Adnan Abu Walid al-Sahrawi, fought in the borderlands of Ménaka, Niger and Burkina Faso; from 2019–2020 the two jihadist camps also fought each other."
      - "The violence turned communal. Dogon hunters’ militias, the largest of them Dan Na Ambassagou, attacked Fulani villages they accused of harbouring jihadists, and armed Fulani attacked Dogon villages. On 23 March 2019 gunmen killed some 160 Fulani villagers at Ogossagou in the cercle of Bankass, and in June about 35 were killed in the Dogon village of Sobane Da. Soldiers too were accused of killing civilians in their operations."
      - "Attacks on army posts grew bolder: in late 2019 assaults on Boulkessi, Mondoro, Indelimane and Tabankort killed more than a hundred soldiers. The G5 Sahel states formed a joint force in 2017, and France, at a summit at Pau in January 2020, raised Barkhane to 5,100 troops; in June 2020 French forces killed AQIM’s leader Abdelmalek Droukdel in northern Mali. By then the state had lost much of the countryside of the centre and north."
    facts:
      - [JNIM founded, "2 March 2017"]
      - [Ogossagou massacre, "23 March 2019"]
    markers:
