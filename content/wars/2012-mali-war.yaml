  - title: The offensive of April 2026
    date: April – June 2026
    when: "2026-04-25"
    borders: "2026-05-01"
    countries: [ml, ru, dz]
    body:
      - "Before dawn on 25 April 2026 JNIM and the FLA launched coordinated attacks across Mali. A car bomb at Kati, the garrison town just outside Bamako, killed the defence minister, General Sadio Camara, and members of his family, and fighting broke out in Kati, in Bamako and at Gao, Sévaré, Mopti and Kidal. The FLA took Kidal the same day; the Malian and Russian troops surrounded in the former UN camp negotiated their departure, and on 27 April the Africa Corps withdrew from Kidal, Aguelhok and Tessalit, whose base the FLA and JNIM took on 1 May. In the east IS Sahel occupied Labbezanga, abandoned by the army."
      - "On 28 April JNIM declared a blockade of Bamako and set up checkpoints on roads around the capital; how far it was enforced could not be verified. Goïta appeared in public only on the 28th, made himself defence minister on 4 May and had officers and opponents arrested, while the Africa Corps called the offensive a foiled coup. The FLA said it aimed to take Gao, Timbuktu and Ménaka and predicted that the regime would fall."
      - "In May and June JNIM attacked a prison near Bamako, killed dozens of villagers in central Mali who resisted it, among them at least 50 in two villages of the Mopti region on 7 May, and laid mines on the road from Bamako to Kayes, where a bus was blown up on 1 June. Army and Russian aircraft bombed Kidal and villages in the centre, where Human Rights Watch blamed an Africa Corps strike for the deaths of at least eight civilians in June."
    facts:
      - [Coordinated attacks, "25 April 2026"]
      - [FLA takes Kidal, "25 April 2026"]
      - [Blockade of Bamako declared, "28 April 2026"]
    markers:
