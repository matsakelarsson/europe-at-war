notes:
  - The Philippine government did not support the incursion; Jamalul Kiram III died in October 2013. The claim of the Sulu heirs to Sabah, and the meaning of the 1878 agreement (a lease or a cession), are disputed between them and Malaysia; the Philippines has never formally dropped its claim, which Malaysia rejects.
