id: lahad-datu-standoff
name: Lahad Datu standoff
start: "2013-02-11"
end: "2013-03-24"
tier: C
summary: "The armed incursion into eastern Sabah of followers of Jamalul Kiram III, one of several claimants to the title of Sultan of Sulu. The sultans of Sulu had granted or leased North Borneo to a British company in 1878, and Malaysia still paid the heirs 5,300 ringgit (about US$1,000) a year, which the heirs regarded as rent and Malaysia as payment for a cession; the Philippines has kept a dormant claim to Sabah since 1962. Feeling left out of the peace talks between Manila and the Moro Islamic Liberation Front, Kiram sent his brother Agbimuddin Kiram with about 200 men, some of them armed, by boat from Simunul in Tawi-Tawi to the village of Tanduo near Lahad Datu, where they landed on 11 February 2013 and declared themselves the Royal Security Forces of the Sultanate of Sulu and North Borneo. Malaysian police surrounded them, and the Philippine government urged them to return home. After three weeks of negotiation, a firefight at Tanduo on 1 March killed two Malaysian commandos and twelve of Kiram’s men; on 2 March gunmen ambushed police in the water village of Sri Jaya Siminul at Semporna, killing six. On 5 March Malaysia launched Operation Daulat with air strikes by fighter aircraft and an assault by army and police; Tanduo was taken on 11 March and the fighting ended in late March. Malaysian figures put the dead at ten members of the security forces, six civilians and 56–68 of Kiram’s men; about 150 people were detained, and nine Filipinos were later sentenced to death in Malaysia for waging war against the king. Malaysia set up the Eastern Sabah Security Command (ESSCOM) and stopped the annual payment; the heirs’ later claim in a European arbitration, which in 2022 awarded them US$14.9 billion, was set aside by French courts in 2023–2024."
