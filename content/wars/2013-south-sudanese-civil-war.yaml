  - title: Equatoria and famine
    date: 2016–2018
    when: "2017-02-20"
    borders: "2017-02-20"
    countries: [ss, ug]
    body:
      - The war now spread to the Equatoria region in the south, which had stayed largely out of it. Government forces fought local rebel groups and Machar’s supporters around Yei, Kajo Keji and Morobo, and killings of civilians on both sides emptied whole districts. About a million South Sudanese fled to Uganda, where the settlement of Bidi Bidi became for a time one of the largest refugee camps in the world. In 2017 a former deputy army chief, Thomas Cirillo, founded the National Salvation Front (NAS), and new groups kept forming.
      - On 20 February 2017 the UN and the government declared famine in Leer and Mayendit counties of Unity State, where some 100,000 people were starving, the first famine declared anywhere in the world for six years; millions more faced severe hunger. Aid convoys were attacked and looted, and South Sudan became one of the most dangerous countries for aid workers. In 2017 government forces killed civilians in Wau, and both sides recruited children.
    facts:
      - [Famine declared in Leer and Mayendit, "20 February 2017"]
      - [South Sudanese refugees in Uganda, "about 1 million by 2017"]
