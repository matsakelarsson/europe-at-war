  - title: The Revitalised Agreement
    date: 2018–2020
    when: "2018-09-12"
    borders: "2020-02-22"
    countries: [ss, et, sd]
    body:
      - After talks in Khartoum, where Kiir and Machar signed a declaration on a permanent ceasefire on 27 June 2018, the two leaders signed the Revitalised Agreement on the Resolution of the Conflict in South Sudan in Addis Ababa on 12 September 2018. It restored Machar as first vice-president among five vice-presidents, provided for the unification of the armies and for elections after a transition. In April 2019 Pope Francis knelt and kissed the feet of the two leaders at the Vatican to urge them to keep the peace.
      - The deadlines slipped twice, but on 22 February 2020 Machar was sworn in again as first vice-president in a unity government. Most of the fighting between the two sides stopped, though NAS fought on in Equatoria and local and communal violence went on. A study for the London School of Hygiene and Tropical Medicine estimated about 383,000 excess deaths between December 2013 and April 2018, some 190,000 of them violent; about 4 million people, a third of the population, had been displaced, 2.5 million of them abroad.
    facts:
