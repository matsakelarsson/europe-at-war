id: south-sudanese-civil-war
name: South Sudanese Civil War
start: "2013-12-15"
end: "2020-02-22"
tier: A
summary: "The civil war in South Sudan, two and a half years after its independence, between the government of President Salva Kiir and the SPLM/A-in-Opposition of his former vice-president Riek Machar. A power struggle in the ruling SPLM turned into fighting within the presidential guard in Juba on 15 December 2013, followed by the killing of hundreds of Nuer civilians in the capital. The army split largely along ethnic lines, with many Nuer units and the armed Nuer cattle-camp youth of the White Army joining Machar, while Kiir, a Dinka, was backed by Ugandan troops. Bor, Bentiu and Malakal changed hands several times in 2014, and both sides massacred civilians of the other’s community. A peace agreement in August 2015 collapsed when fighting broke out in Juba in July 2016; Machar fled on foot to Congo, and the war spread to the Equatoria region in the south. Famine was declared in parts of Unity State in February 2017. The Revitalised Agreement of September 2018 ended most of the fighting, and Kiir and Machar formed a unity government on 22 February 2020. A study estimated about 383,000 excess deaths by April 2018, half of them from violence, and some 4 million people were driven from their homes. In 2025 the peace broke down again: Machar was arrested and put on trial for treason, and fighting resumed in Upper Nile and Jonglei."
countries: [ss, ug, cd, et]
sides:
