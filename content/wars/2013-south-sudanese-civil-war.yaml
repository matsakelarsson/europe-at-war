  - title: A peace that failed
    date: 2015–2016
    when: "2016-07-08"
    borders: "2016-07-11"
    countries: [ss, cd]
    body:
      - In April and May 2015 the army and allied Bul Nuer militias swept through southern Unity State, around Leer and Mayendit, killing civilians, abducting and raping women and girls and burning villages, as UN investigators documented. In May the Shilluk commander Johnson Olony changed sides, and the opposition took Malakal again. Under heavy international pressure Machar signed a peace agreement on 17 August 2015 and Kiir, with reservations, on 26 August; it provided for a transitional government with Machar as first vice-president. Fighting went on, and in February 2016 armed men attacked the UN protection site at Malakal and killed at least 25 people.
      - Machar returned to Juba on 26 April 2016 with a guard of some 1,400 men. On 7–8 July a clash between the two leaders’ bodyguards outside the presidential palace turned into four days of fighting in the city with tanks and helicopters. Government soldiers looted, raped women in and around the UN camps, and on 11 July attacked the Terrain hotel compound, where they raped aid workers and killed the South Sudanese journalist John Gatluak. Machar fled the city and walked with his men through Central Equatoria for more than a month, pursued by helicopters, until he crossed into the Democratic Republic of the Congo in August. Kiir replaced him as first vice-president with Taban Deng Gai.
    facts:
      - [Peace agreement, "17 and 26 August 2015"]
      - [Machar returns to Juba, "26 April 2016"]
      - [Fighting in Juba, "7–11 July 2016"]
