  - title: Bor, Bentiu and Malakal
    date: January – May 2014
    when: "2014-04-15"
    borders: "2014-04-15"
    countries: [ss, ug]
    body:
      - Ugandan troops, first sent to secure Juba airport, joined the fighting on Kiir’s side, and with their armour and aircraft the government retook Bor on 18 January 2014 and Bentiu and Malakal soon after. A cessation of hostilities was signed under IGAD mediation in Addis Ababa on 23 January 2014, but both sides broke it within days. Malakal changed hands several times, and much of it was burned and looted; Bentiu was retaken by the opposition in April.
      - Both sides killed civilians for their ethnicity. When opposition forces took Bentiu on 15 April 2014 they killed hundreds of people, many of them Darfuri traders and Dinka, in the mosque, the hospital and a church, while a local radio station urged men to rape women of the other community; estimates of the dead range from about 200 to more than 400. On 17 April an armed crowd of Dinka youth forced its way into the UN base at Bor and killed dozens of Nuer sheltering there. By mid-2014 about 100,000 people lived in the UN’s “protection of civilians” sites, and a famine was only narrowly averted.
    facts:
      - [Government retakes Bor, "18 January 2014"]
      - [Cessation of hostilities, "23 January 2014"]
      - [Bentiu massacre, "15 April 2014"]
      - [Attack on the UN base at Bor, "17 April 2014"]
