notes:
  - "The war is often described as Dinka against Nuer, but both sides had allies from other communities: the government had Nuer generals and militias such as the Bul Nuer of Mayom, and the opposition had non-Nuer commanders, among them the Shilluk forces of Johnson Olony (from 2015) and, in Equatoria, many local groups. Other armed movements, such as Thomas Cirillo’s National Salvation Front (NAS), formed in 2017."
  - The figure of about 383,000 excess deaths comes from a study by the London School of Hygiene and Tropical Medicine published in 2018, covering December 2013 to April 2018; there was no count.
