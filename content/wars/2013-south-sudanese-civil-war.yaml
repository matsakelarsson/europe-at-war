steps:
  - title: Juba, December 2013
    date: July – December 2013
    when: "2013-12-15"
    borders: "2013-12-20"
    countries: [ss]
    body:
      - South Sudan became independent on 9 July 2011 under the SPLM, whose leaders had fought the north together but had also fought each other in the 1990s. Oil money was spent on the army and lost to corruption, and in 2012 the government shut down oil production in a dispute with Sudan over fees. In July 2013 President Salva Kiir dismissed his vice-president, Riek Machar, who had said he would challenge him for the party leadership, together with the whole cabinet. In December Machar and other dismissed leaders denounced Kiir’s rule as dictatorial.
      - On the night of 15 December 2013, during a meeting of the SPLM’s National Liberation Council, fighting broke out in Juba between Dinka and Nuer soldiers of the presidential guard. Kiir, appearing in military uniform, called it a coup attempt by Machar, who denied it and escaped from the city. Over the next days government soldiers and security forces went from house to house in Juba killing Nuer men; Human Rights Watch documented one massacre of 200–300 men in a police building in Gudele, and the African Union’s commission of inquiry found that killings of Nuer were organised. Tens of thousands of civilians fled into the UN bases.
      - The killings drove Nuer soldiers across the country to mutiny. On 18 December Peter Gadet’s troops took Bor, the capital of Jonglei; in Unity State the army’s 4th Division under James Koang went over to Machar and took Bentiu; and fighting spread to Malakal. At Akobo, Nuer fighters attacked the UN base and killed two Indian peacekeepers and Dinka civilians sheltering there.
    facts:
      - [Machar dismissed, "July 2013"]
      - [Fighting in Juba, "15 December 2013"]
      - [Rebels take Bor, "18 December 2013"]
