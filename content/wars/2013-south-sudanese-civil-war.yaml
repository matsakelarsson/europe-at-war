  - title: The peace unravels
    date: 2025–2026
    when: "2025-03-04"
    borders: "2026-04-14"
    countries: [ss, ug]
    body:
      - "Last updated 27 November 2026. The unification of the armies and the elections promised for 2022 were postponed again and again. In March 2025 the White Army overran the army garrison at Nasir in Upper Nile, and on 7 March a UN helicopter evacuating soldiers came under fire; its crew member and the garrison commander, Major General David Majur Dak, were among those killed. The government bombed the area, Uganda sent special forces to Juba to back Kiir, and in late March Machar was placed under house arrest. On 11 September 2025 he and seven others were charged with murder, treason and crimes against humanity, and he was suspended as first vice-president; his trial before a special court in Juba began on 22 September 2025 and was still going on in November 2026."
      - "The opposition army took up the war again. In late December 2025 SPLA-IO forces and the White Army took Waat and much of northern Jonglei; the government launched a counter-offensive on 25 January 2026, retook several bases and in March entered Akobo, which the opposition recaptured in April. Fighting also flared in Upper Nile, Unity and Central Equatoria, and by early 2026 well over 200,000 people had been displaced in Jonglei alone. Kiir dismissed Machar’s wife, Angelina Teny, as interior minister in January 2026 and dissolved the transitional government in September. On 14 November 2026 the election commission postponed the elections set for 22 December 2026 to 11 February 2027. The government says the country is not returning to civil war; whether the 2018 agreement still stands is disputed."
    facts:
      - [Nasir garrison overrun, "4 March 2025"]
      - [Machar charged, "11 September 2025"]
      - [Government offensive in Jonglei, "from 25 January 2026"]
      - [Elections postponed, "to 11 February 2027"]
    markers:
      - kind: taken
        side: io
        name: Nasir
        date: 4 March 2025
        text: The White Army overran the army garrison; the attempt to evacuate it by UN helicopter on 7 March came under fire.
        lonlat: [33.07, 8.60]
