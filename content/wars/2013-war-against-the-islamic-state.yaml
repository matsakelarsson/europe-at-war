  - title: Tikrit, Ramadi and Fallujah
    date: March 2015 – June 2016
    when: "2015-03-02"
    borders: "2016-06-26"
    countries: [iq]
    body:
      - In March 2015 Iraqi troops and Popular Mobilization Forces, with Iranian advisers, attacked Tikrit; after the offensive stalled, the coalition joined with air strikes, and the city was retaken on 31 March–1 April. Mass graves of the Speicher victims were found nearby. But on 17 May ISIS took Ramadi, the capital of Anbar, after the defenders withdrew in a sandstorm. The Baiji oil refinery changed hands several times before Iraqi forces secured it in October.
      - The rebuilt Iraqi army, led by its US-trained Counter Terrorism Service, retook the centre of Ramadi on 28 December 2015, though most of the city was destroyed by fighting, air strikes and booby traps. In May–June 2016 Iraqi forces and militias retook Fallujah, after a siege in which civilians went hungry; hundreds of men who fled the city were reported missing after being detained by militias. By mid-2016 ISIS held Mosul and its surroundings, the Hawija pocket south-west of Kirkuk, and the far west of Anbar along the Euphrates.
