  - title: The battle of Mosul
    date: October 2016 – July 2017
    when: "2016-10-17"
    borders: "2017-07-10"
    countries: [iq]
    body:
      - On 17 October 2016 about 100,000 Iraqi soldiers, police, Peshmerga and militiamen, supported by coalition aircraft, artillery and advisers, began the offensive to retake Mosul, where more than a million civilians still lived under ISIS rule. The Peshmerga closed in from the north and east, the Popular Mobilization Forces cut the roads to the west, and the Counter Terrorism Service fought its way into the eastern half of the city, which was declared retaken in January 2017.
      - The battle for western Mosul, with its dense old city, began in February. ISIS fought with snipers, suicide car bombs, drones and booby traps, and used civilians as human shields; Iraqi and coalition forces answered with air strikes and artillery. On 17 March a coalition strike in the Mosul al-Jadida district killed more than 100 civilians in one building. On 21 June ISIS blew up the 12th-century al-Nuri mosque and its leaning minaret, al-Hadba. Abadi declared victory in Mosul on 10 July 2017. Estimates of civilian deaths in the battle range from several thousand to about 11,000, and much of the old city lay in ruins.
