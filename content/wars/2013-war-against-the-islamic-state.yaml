id: war-against-the-islamic-state
name: War in Iraq against the Islamic State
start: "2013-12-30"
end: "2017-12-09"
tier: A
summary: The war in which the Islamic State (ISIS), the successor of al-Qaeda in Iraq, seized a third of Iraq in 2014 and was driven out again by 2017. Exploiting Sunni Arab anger at the Shia-led government of Nuri al-Maliki and the civil war in neighbouring Syria, its fighters took Fallujah in January 2014 and Mosul, Iraq’s second city, in June, and proclaimed a “caliphate” across the Syrian–Iraqi border. They massacred captured soldiers and Shia, and killed and enslaved thousands of Yazidis in a campaign the UN has called genocide. Iraqi forces, Shia volunteer militias of the Popular Mobilization Forces, Kurdish Peshmerga and a US-led coalition providing air power and advisers fought back, retaking Tikrit in 2015, Ramadi and Fallujah in 2016, and Mosul after a nine-month battle in July 2017. Prime Minister Haider al-Abadi declared victory on 9 December 2017, though an ISIS insurgency continued. Tens of thousands of civilians were killed and some five million people were displaced.
countries: [iq, sy]
