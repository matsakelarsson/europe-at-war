notes:
  - Civilian deaths are uncertain. The UN mission in Iraq (UNAMI) recorded about 30,000 civilians killed in 2014–2017, and Iraq Body Count, which counts all violence reported in the media and official records, about 67,000. Military losses are not reliably known on any side.
  - Iran sent advisers, weapons and commanders to the Iraqi government and the Popular Mobilization Forces, some of whose militias it had long backed; several of those militias were accused of killings, disappearances and looting in retaken Sunni areas. The United States led an international coalition (Operation Inherent Resolve) of more than 70 countries, which flew air strikes and trained Iraqi and Kurdish forces.
  - The war in Syria, where ISIS had its capital at Raqqa, is mentioned only where it bears on Iraq. ISIS-held areas are drawn approximately, from published control maps; much of the land they claimed was empty desert.
