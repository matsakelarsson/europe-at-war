  - title: The end of the caliphate in Iraq
    date: August – December 2017
    when: "2017-08-20"
    borders: "2017-12-09"
    countries: [iq, sy]
    body:
      - Iraqi forces took Tal Afar in August 2017 and the Hawija pocket in early October. In Syria the Kurdish-led Syrian Democratic Forces took Raqqa in October. In November Iraqi troops took al-Qaim and Rawa, the last towns ISIS held in Iraq, and on 9 December 2017 Abadi declared the war over. ISIS lost its last scrap of territory in Syria, at Baghuz, in March 2019, and Baghdadi was killed in a US raid in Syria in October 2019, but its cells kept up a low-level insurgency in the deserts and mountains of northern Iraq.
      - The victory reopened the quarrel between Baghdad and the Kurds. The Kurdistan Region held an independence referendum on 25 September 2017, including in Kirkuk and other disputed areas the Peshmerga had taken in 2014; about 93 per cent voted yes. Baghdad, Turkey and Iran rejected the vote, and on 16 October Iraqi forces and militias took Kirkuk and its oil fields with little fighting, while the Peshmerga withdrew from most of the disputed territories, including Sinjar. Kurdish leader Masoud Barzani stepped down as president of the region.
    facts:
      - [Tal Afar retaken, "August 2017"]
      - [Kurdish independence referendum, "25 September 2017"]
      - [Kirkuk taken by Iraqi forces, "16 October 2017"]
      - [Victory declared, "9 December 2017"]
