  - title: Sinjar and the US intervention
    date: August 2014 – 2015
    when: "2014-08-03"
    borders: "2014-09-01"
    countries: [iq, sy, us]
    body:
      - On 3 August 2014 ISIS attacked Sinjar, the homeland of the Yazidis, a Kurdish-speaking religious minority whom it regarded as devil-worshippers. The Peshmerga withdrew. ISIS fighters killed thousands of Yazidi men and older women and took thousands of women and children as slaves; estimates range from about 3,000 to 5,000 killed and some 6,000 to 7,000 abducted, most of them in the first weeks. Tens of thousands of Yazidis fled onto Mount Sinjar, where many died of heat and thirst before Syrian Kurdish fighters of the YPG and the PKK opened a corridor to safety through Syria. A UN investigative team found in 2021 that ISIS had committed genocide against the Yazidis.
      - ISIS also overran Christian towns on the Nineveh plains, took the Mosul Dam and advanced to within some 40 kilometres of Erbil, the Kurdish capital. On 8 August the United States began air strikes, and with Kurdish and Iraqi forces retook the dam within ten days; at the end of August Iraqi troops, Shia militias and Peshmerga broke the siege of the Turkmen town of Amirli. Maliki gave way to Haider al-Abadi in September, and the US-led coalition grew to dozens of countries. In Syria the Kurdish town of Kobani held out against ISIS from September 2014 to January 2015, and in November 2015 Kurdish forces retook Sinjar.
    facts:
