steps:
  - title: The fall of Mosul and the caliphate
    date: December 2013 – June 2014
    when: "2013-12-30"
    borders: "2014-06-29"
    countries: [iq, sy]
    body:
      - After the US withdrawal Sunni Arabs protested for a year against Prime Minister Nuri al-Maliki, whom they accused of shutting them out of power and arresting their leaders. The government broke up a protest camp at Hawija in April 2013, killing dozens, and cleared the camp at Ramadi on 30 December 2013. Within days fighters of the Islamic State of Iraq and the Levant (ISIL or ISIS), led by Abu Bakr al-Baghdadi and strengthened by the war in Syria, where they had taken Raqqa, seized Fallujah and parts of Ramadi with the help of local tribes.
      - On 6 June 2014 ISIS attacked Mosul. Although the defenders far outnumbered the attackers, the army and police, poorly led and riddled with corruption, collapsed, and on 10 June the city fell; about half a million people fled. ISIS swept south to Tikrit and the outskirts of Samarra and Baiji. At Camp Speicher near Tikrit it murdered between about 1,100 and 1,700 captured air force cadets and recruits, most of them Shia. Kurdish Peshmerga moved into Kirkuk as the army left.
      - On 13 June Iraq’s senior Shia cleric, Grand Ayatollah Ali al-Sistani, called on Iraqis to take up arms, and tens of thousands joined the Popular Mobilization Forces. On 29 June ISIS proclaimed a caliphate, calling itself simply the Islamic State, and on 4 July Baghdadi appeared in the al-Nuri mosque in Mosul to demand the allegiance of all Muslims.
