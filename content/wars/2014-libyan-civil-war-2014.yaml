  - title: Skhirat and the battle for Sirte
    date: December 2015 – December 2016
    when: "2016-08-01"
    borders: "2016-09-13"
    countries: [ly, us]
    body:
      - "On 17 December 2015 delegates of the two parliaments signed the Libyan Political Agreement at Skhirat in Morocco. It created a Presidential Council under Fayez al-Sarraj, a Tripoli businessman and member of the House of Representatives, and a Government of National Accord (GNA), which the UN Security Council recognised as Libya’s only legitimate government. The House of Representatives never approved it, and Haftar refused to serve under it. On 30 March 2016 Sarraj arrived in Tripoli by sea at the Abu Sitta naval base; most of the Tripoli and Misrata brigades accepted him, and the GNC’s government was pushed aside."
      - "In May 2016 GNA forces, mostly brigades from Misrata, launched Operation Solid Structure (al-Bunyan al-Marsus) against the Islamic State in Sirte. The jihadists defended the city with snipers, mines and suicide car bombs, and from 1 August American aircraft and drones flew hundreds of strikes in support. The last Islamic State fighters in the Giza Bahriya district were overrun on 6 December 2016. The GNA forces lost some 700 dead; the surviving jihadists scattered into the desert."
      - "In the east, the LNA advanced slowly in Benghazi. In September 2016 it seized the oil terminals of the Oil Crescent, Es Sider, Ras Lanuf, Brega and Zueitina, from Ibrahim Jadhran’s Petroleum Facilities Guard, which had sided with the GNA, and let the National Oil Corporation resume exports. The House of Representatives promoted Haftar to field marshal."
    facts:
      - [Libyan Political Agreement, "17 December 2015, Skhirat"]
      - [Sarraj arrives in Tripoli, "30 March 2016"]
      - [Oil Crescent seized by the LNA, "11–13 September 2016"]
      - [Sirte taken from the Islamic State, "6 December 2016"]
