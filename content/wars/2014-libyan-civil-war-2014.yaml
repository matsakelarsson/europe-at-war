  - title: Benghazi, Derna and the south
    date: 2017 – February 2019
    when: "2017-07-05"
    borders: "2019-02-15"
    countries: [ly]
    body:
      - "On 5 July 2017 Haftar declared victory in Benghazi after more than three years of fighting that had left whole districts of the city centre in ruins; the last pockets fell in December. Fighters on both sides were accused of abuses, and in August 2017 the International Criminal Court issued an arrest warrant for an LNA commander, Mahmoud al-Werfalli, for the execution of prisoners."
      - "The LNA besieged Derna, held by the Mujahideen Shura Council and its successors, and stormed it from May 2018, declaring it taken at the end of June, though fighting in the old city went on into early 2019. In January 2019 Haftar sent his forces into the Fezzan, where they took Sabha and, in February, the Sharara oil field, Libya’s largest, mostly through deals with local tribes. He now held the east, the south and most of the oil, and was courted by Egypt, the UAE, Russia and France."
      - "The UN envoy Ghassan Salamé prepared a national conference to agree on elections, to open at Ghadames in mid-April 2019."
    facts:
      - [Benghazi declared taken by the LNA, "5 July 2017"]
      - [Derna declared taken by the LNA, "28 June 2018"]
      - [Sabha and the Sharara oil field, "January – February 2019"]
