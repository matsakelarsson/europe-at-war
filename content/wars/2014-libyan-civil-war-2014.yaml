steps:
  - title: Dignity and Dawn
    date: 2012 – November 2014
    when: "2014-07-13"
    borders: "2014-08-23"
    countries: [ly]
    body:
      - "Libya’s first free elections, in July 2012, produced a General National Congress (GNC), but real power lay with the armed brigades of 2011, which the government paid but could not command. Islamist groups such as Ansar al-Sharia, blamed for the attack on the American mission in Benghazi that killed Ambassador Christopher Stevens on 11 September 2012, grew strong in the east, where hundreds of officers, judges and activists were assassinated. In 2013 a federalist commander, Ibrahim Jadhran, blockaded the oil ports, and the GNC, pressed by armed men, banned former officials of the Gaddafi era from office."
      - "On 16 May 2014 Khalifa Haftar, a general who had served Gaddafi, broken with him in the 1980s and lived for years in the United States, launched Operation Dignity in Benghazi against the Islamist brigades, with army units, air force officers and tribal fighters. The Islamist and revolutionary brigades of the city joined in the Benghazi Revolutionaries Shura Council. In elections on 25 June, with a turnout of about 18 per cent, Islamists lost ground in a new parliament, the House of Representatives."
      - "On 13 July Misratan and Islamist brigades, calling their offensive Libya Dawn, attacked the brigades from Zintan, allies of Haftar, who held Tripoli’s international airport. After six weeks of fighting that wrecked the terminal and many of the airliners on it, Libya Dawn took it on 23 August and the capital with it. The House of Representatives met in Tobruk, near the Egyptian border, and its government under Abdullah al-Thinni sat in Bayda; the old GNC reconvened in Tripoli and named its own prime minister. Libya now had two parliaments, two governments and two armies, and in November the Supreme Court in Tripoli declared the House of Representatives unconstitutional."
    facts:
      - [Operation Dignity launched, "16 May 2014"]
      - [House of Representatives elected, "25 June 2014"]
      - [Libya Dawn launched, "13 July 2014"]
      - [Tripoli airport taken by Libya Dawn, "23 August 2014"]
