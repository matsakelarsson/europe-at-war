id: libyan-civil-war-2014
name: Second Libyan Civil War
start: "2014-05-16"
end: "2020-10-23"
tier: A
summary: "The war between rival governments and armed coalitions that divided Libya from 2014 to 2020. After Gaddafi’s fall the state never controlled the brigades that had fought him. In May 2014 General Khalifa Haftar launched Operation Dignity against Islamist militias in Benghazi, and in July Libya Dawn, a coalition of Misratan and Islamist brigades, drove his allies from Tripoli’s airport and took the capital. The newly elected House of Representatives moved to Tobruk and backed Haftar’s Libyan National Army (LNA), while the old General National Congress set up a rival government in Tripoli. The Islamic State took Derna and then Sirte, where it was destroyed in 2016 by forces of the UN-backed Government of National Accord (GNA) with American air support. Haftar won Benghazi in 2017 and Derna in 2018, took the oil ports and the south, and in April 2019 attacked Tripoli. The battle drew in foreign powers: the United Arab Emirates, Egypt and Russia’s Wagner Group backed the LNA, Turkey and Syrian fighters the GNA, which drove the LNA back to Sirte and Jufra in June 2020. A permanent ceasefire was signed on 23 October 2020. The country remained divided between rival governments in Tripoli and the east, and at least 15,000 people were killed in the war by incomplete counts."
countries: [ly, eg, tr, ae, ru, us]
