  - title: Ceasefire and a divided country
    date: October 2020 – 2026
    when: "2020-10-23"
    borders: "2020-10-23"
    countries: [ly]
    body:
      - "On 23 October 2020 the military commission of five officers from each side, the 5+5 committee, signed a permanent ceasefire in Geneva under UN auspices. It called for all foreign forces and mercenaries to leave within three months, which did not happen: Turkish forces stayed in the west, and Russian forces, later renamed the Africa Corps, at Jufra and in the east. A UN-led forum chose a new Presidential Council under Mohamed al-Menfi and a Government of National Unity under Abdul Hamid Dbeibah, which took office in March 2021 with a promise of elections on 24 December 2021. The elections were postponed indefinitely amid disputes over the rules and over the candidacies of Haftar, Saif al-Islam Gaddafi and Dbeibah himself."
      - "In 2022 the House of Representatives named a rival prime minister, Fathi Bashagha, whose attempt to take over Tripoli led to fighting in the capital in August that killed 32 people. Rival brigades in Tripoli fought again in August 2023 and in May 2025, after the killing of the head of the Stability Support Apparatus, Abdelghani al-Kikli. In 2026 Libya was still divided between Dbeibah’s government in Tripoli and Haftar’s LNA, with a government appointed by the House of Representatives, in the east and south. The front lines had barely moved since 2020. In April 2026 the rival parliaments agreed on a joint budget for the first time in more than a decade, and soldiers from east and west trained together at Sirte in an exercise led by the United States, while UN-backed talks sought to unify the army and the state’s institutions. Violence within each camp was rising: in August a car bomb in Benghazi killed Haftar’s chief of military intelligence. On 30 August, in talks brokered by the UN mission, representatives of the Tripoli government, the LNA command and both parliamentary chambers agreed to reconstitute the election commission and amend the election laws, with parliamentary and presidential elections to be held within two years under a single government."
    facts:
      - [Permanent ceasefire, "23 October 2020, Geneva"]
      - [Government of National Unity, "March 2021"]
      - [Postponed elections, "24 December 2021"]
      - [Clashes in Tripoli, "August 2022, August 2023, May 2025"]
