  - title: Turkey’s intervention and the turn of the tide
    date: March – July 2020
    when: "2020-06-05"
    borders: "2020-06-06"
    countries: [ly, tr, ru, eg]
    body:
      - "With Turkish drones and air defences now in action, the GNA launched Operation Peace Storm in late March 2020. In April it took the coastal towns between Tripoli and the Tunisian border, on 18 May the al-Watiya air base, the LNA’s stronghold in the west, and in early June the old airport and the whole of southern Tripoli. On 5 June it took Tarhuna, where the Kaniyat militia had ruled by terror; mass graves found there held more than a hundred bodies. Wagner’s fighters and the LNA withdrew to Bani Walid and then to Sirte and the Jufra air base, leaving mines and booby traps in the houses of the suburbs."
      - "The United States said that Russia had flown MiG-29 and Su-24 jets to Jufra in May. As GNA forces closed in on Sirte, the Egyptian president, Abdel Fattah al-Sisi, declared on 20 June that a line from Sirte to Jufra was a red line, and Egypt’s parliament later authorised him to send troops into Libya. The front froze west of Sirte, on the edge of the Oil Crescent."
    facts:
      - [Operation Peace Storm, "from late March 2020"]
      - [Al-Watiya air base taken, "18 May 2020"]
      - [Tarhuna taken, "5 June 2020"]
      - [Egypt’s red line, "20 June 2020"]
    markers:
      - kind: taken
        side: gna
        name: Al-Watiya air base
        date: 18 May 2020
        text: The LNA’s main air base in western Libya fell to the GNA with Turkish drone support.
        lonlat: [11.900, 32.471]
