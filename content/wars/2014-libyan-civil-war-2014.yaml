  - title: The battle for Tripoli
    date: April 2019 – January 2020
    when: "2019-04-04"
    borders: "2019-07-02"
    countries: [ly, ae, eg, ru, tr]
    body:
      - "On 4 April 2019, days before the national conference, Haftar ordered his forces to march on Tripoli. They took Gharyan and Tarhuna, south of the capital, and reached its southern suburbs, around the old airport, Qasr bin Ghashir and Ain Zara. The brigades of Tripoli, Misrata, Zawiya and part of Zintan rallied to the GNA, and the offensive stalled in the suburbs. On 26 June GNA forces retook Gharyan, the LNA’s main base on the front."
      - "The battle became a war of drones and foreign fighters. Chinese-made drones operated for the LNA by the United Arab Emirates, as UN experts found, struck targets across western Libya; Turkey sent the GNA its own drones. On 2 July 2019 an air strike hit a detention centre for migrants at Tajoura, killing 53 people. From September hundreds of Russian contractors of the Wagner Group, with snipers and artillery, joined the LNA on the Tripoli front, along with fighters from Sudan and Chad. On 4 January 2020 a drone strike on a military academy in Tripoli killed at least 26 cadets."
      - "In November 2019 Turkey and the GNA signed agreements on security and maritime borders, and from January 2020 Turkey sent officers, air defences and several thousand Syrian fighters. On 6 January 2020 the LNA took Sirte when a local brigade changed sides. A conference in Berlin on 19 January pledged to respect the UN arms embargo, which went on being broken; the same week tribal forces allied with Haftar shut down the oil ports."
    facts:
      - [Offensive on Tripoli launched, "4 April 2019"]
      - [Gharyan retaken by the GNA, "26 June 2019"]
      - [Tajoura detention centre strike, "2 July 2019; 53 killed"]
      - [Sirte taken by the LNA, "6 January 2020"]
      - [Berlin conference, "19 January 2020"]
