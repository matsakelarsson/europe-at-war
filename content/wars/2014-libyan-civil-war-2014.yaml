  - title: The Islamic State in Derna and Sirte
    date: October 2014 – 2015
    when: "2015-02-15"
    borders: "2015-06-01"
    countries: [ly, eg]
    body:
      - "In October 2014 a group of jihadists in Derna, many of them back from fighting in Syria, pledged allegiance to Abu Bakr al-Baghdadi, and the Islamic State declared three provinces in Libya. Its men attacked the Corinthia Hotel in Tripoli in January 2015, killing ten people, and in February released a video of 21 Christian workers, 20 of them Egyptian Copts, beheaded on a beach near Sirte. Egypt answered the next day with air strikes on Derna, the first of many it made in support of Haftar; a few days later Islamic State car bombs killed some 40 people at al-Qubbah, east of Derna."
      - "In the first months of 2015 the Islamic State took Sirte, Gaddafi’s home town, from a Misratan brigade, and in August it crushed a revolt by local tribesmen. It ruled some 200 km of coast around Sirte, from Abu Grein in the west to Harawa and Nofaliya in the east, with several thousand fighters, many of them from Tunisia and other countries, and imposed its laws as in Syria and Iraq. In Derna, by contrast, the Mujahideen Shura Council, local Islamist brigades linked to al-Qaeda, rose against it in June 2015 and drove its fighters out of the city."
      - "Meanwhile the UN envoy Bernardino León pressed the two parliaments to form a single government. In Benghazi the LNA and the Shura Council fought district by district, and Egyptian and Emirati aircraft struck the Islamists."
    facts:
      - [Islamic State declares provinces in Libya, "November 2014"]
      - [Copts killed near Sirte, "video released 15 February 2015"]
      - [Egyptian air strikes on Derna, "16 February 2015"]
      - [Islamic State expelled from Derna, "June 2015 – April 2016"]
