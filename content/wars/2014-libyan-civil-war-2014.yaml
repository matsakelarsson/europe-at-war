notes:
  - "Libya is shown on the base map as one state throughout. The zones held by the rival camps are drawn as areas and are approximate; they are taken from published control maps and news reports, and much of the land they cover is empty desert held by local and tribal forces whose loyalties shifted. The camps were coalitions: many brigades changed sides, and the GNA’s forces came largely from Misrata, Tripoli, Zawiya and Zintan, the LNA’s from army units, tribal forces and Madkhali Salafist brigades in the east and south."
  - "Casualty figures are incomplete. Counts compiled from local sources and the Armed Conflict Location & Event Data Project give at least 15,000 dead for 2014–2020; hundreds of thousands of people were displaced at different times. UN experts found that the UAE, Turkey, Russia, Egypt, Jordan and others broke the UN arms embargo, and that both sides and their foreign backers committed abuses, including air strikes on civilians, killings of prisoners, and the mass graves found at Tarhuna in 2020."
  - "Each side called its enemies terrorists or militias: Haftar’s camp spoke of a war on terrorism and called the Tripoli forces Islamist militias, while the Tripoli camp called Haftar a war criminal leading mercenaries and remnants of the Gaddafi regime."
