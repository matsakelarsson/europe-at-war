  - title: The invasion of 24 February 2022
    date: February – March 2022
    when: "2022-02-24"
    borders: "2022-03-21"
    countries: [ua, ru, by]
    body:
      - Through 2021 Russia massed troops on Ukraine’s borders and in Belarus, some 150,000–190,000 by Western estimates, while demanding guarantees that NATO would never admit Ukraine. On 21 February 2022 Vladimir Putin recognised the Donetsk and Luhansk people’s republics as independent states, and before dawn on 24 February he announced a “special military operation” to “demilitarise and denazify” Ukraine. Missiles struck cities and airfields across the country, and Russian columns crossed the border from Belarus, Russia and Crimea. Zelensky stayed in Kyiv and declared martial law and a general mobilisation, and Western governments imposed sweeping sanctions on Russia and began sending arms.
      - From Belarus the invaders drove past Chornobyl towards Kyiv, and airborne troops landed at the Antonov airfield at Hostomel on the first day. Further east they surrounded Chernihiv, bypassed Sumy and Kharkiv and pushed to the eastern edge of Kyiv. From Crimea they took Kherson on 2 March, the only regional capital they captured in 2022, along with Melitopol and Berdiansk, seized the Zaporizhzhia nuclear power plant, Europe’s largest, on 4 March, and closed in on Mariupol. On 2 March the UN General Assembly demanded Russia’s withdrawal by 141 votes to 5. By the end of March more than four million Ukrainians had fled abroad.
    facts:
      - [Invasion begins, "24 February 2022"]
      - [Kherson taken, "2 March 2022"]
      - [UN General Assembly Resolution ES-11/1, "2 March 2022 (141 votes to 5)"]
