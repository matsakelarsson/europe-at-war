  - title: Sloviansk and MH17
    date: April – July 2014
    when: "2014-04-07"
    borders: "2014-07-17"
    countries: [ua, ru]
    body:
      - In March and April pro-Russian protesters seized government buildings across eastern Ukraine, and armed separatists proclaimed a Donetsk People’s Republic on 7 April and a Luhansk People’s Republic on 27 April. On 12 April armed men led by Igor Girkin, a former officer of Russia’s security service, took Sloviansk and Kramatorsk, and Ukraine’s interim government began what it called an anti-terrorist operation. On 2 May 48 people died in Odesa, most of them pro-Russian activists trapped in a burning trade union building after street clashes. The separatists held referendums on 11 May that Kyiv and Western governments rejected, and on 25 May Petro Poroshenko was elected president.
      - Ukrainian forces retook Mariupol in June and Sloviansk and Kramatorsk on 5 July, when Girkin’s men fell back on Donetsk. On 17 July Malaysia Airlines flight MH17, from Amsterdam to Kuala Lumpur, was shot down over separatist-held ground; all 298 people on board, 196 of them Dutch, were killed. A Dutch-led international investigation found that it was hit by a Buk missile from a Russian army brigade, brought across the border and taken back afterwards. A Dutch court convicted two Russians and a Ukrainian separatist of murder in their absence in 2022, and the council of the UN’s civil aviation organisation found Russia responsible in 2025. Russia denies any part in it.
    facts:
