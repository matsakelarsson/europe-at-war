  - title: Bakhmut, the Kakhovka dam and the counteroffensive
    date: 2023
    when: "2023-01"
    borders: "2023-12-31"
    countries: [ua, ru]
    body:
      - Through the winter Russian forces, many of them convicts recruited by the Wagner Group, a private military company, attacked Bakhmut in the longest and one of the bloodiest battles of the war. They took Soledar in January and Bakhmut, by then in ruins, in May; Wagner’s chief, Yevgeny Prigozhin, claimed it on 20 May. On 23–24 June Prigozhin led a mutiny, seized Rostov-on-Don and marched towards Moscow before turning back, and he died when his plane crashed in August. In March the International Criminal Court issued an arrest warrant for Putin over the unlawful deportation of children from occupied Ukraine.
      - On 6 June the Kakhovka dam on the Dnipro, held by Russian forces, was destroyed, flooding towns and villages downstream and draining the reservoir; dozens of people drowned. Ukraine and Western governments blamed Russia, which blamed Ukraine. The same week Ukraine opened its long-awaited counteroffensive in the south, but deep minefields, trenches and drones held it to a few villages, Robotyne among them. Ukraine did better at sea, driving much of the Black Sea Fleet from Sevastopol with drones and missiles and opening a corridor for grain ships after Russia left the UN-brokered grain deal in July. In October Russia began a costly offensive against Avdiivka.
    facts:
