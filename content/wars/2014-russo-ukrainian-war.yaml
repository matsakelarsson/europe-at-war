    countries: [ua, ru]
    body:
      - On 6 September Ukraine broke through the thinly held Russian line near Balakliia, in the Kharkiv region, and within days retook Izium, Kupiansk and most of the region; Lyman followed on 1 October. Near Izium investigators exhumed more than 400 bodies from a burial site in a forest, most of them civilians, some with signs of torture. On 21 September Putin ordered a “partial mobilisation” of 300,000 reservists, and hundreds of thousands of Russian men left the country. On 8 October a lorry bomb damaged the Kerch bridge to Crimea, and from 10 October Russia struck Ukraine’s power stations and grid with waves of missiles and drones.
      - From 23 to 27 September Russian-installed authorities held votes in the occupied parts of the Donetsk, Luhansk, Zaporizhzhia and Kherson regions and announced large majorities for joining Russia, and on 30 September Putin proclaimed their annexation, although his forces did not hold all of their territory. On 12 October the UN General Assembly, by 143 votes to 5, called the annexations invalid. In the south Ukrainian forces had for months struck the bridges over the Dnipro that supplied the Russian troops on its western bank. On 9 November Russia announced a withdrawal across the river, and on 11 November Ukrainian troops entered Kherson.
