  - title: Debaltseve, Minsk II and the frozen front
    date: January 2015 – 2021
    when: "2015-01"
    borders: "2021-12-31"
    countries: [ua, ru]
    body:
      - In January 2015 the separatists, backed by Russian troops, opened a winter offensive. They took the ruins of Donetsk airport, and on 24 January rockets fired from separatist-held ground killed about 30 civilians in Mariupol. After talks in Minsk between the leaders of Ukraine, Russia, France and Germany, a new package of measures, Minsk II, was signed on 12 February. It provided for a ceasefire, the withdrawal of heavy weapons, an amnesty, local elections and a constitutional reform giving the separatist areas a special status, after which Ukraine would regain control of its border. The separatists went on attacking the Debaltseve salient, and Ukrainian forces withdrew on 18 February.
      - The line of contact, more than 400 kilometres long, then barely moved for seven years. Ceasefires were declared and broken, OSCE monitors recorded violations almost daily, and the political parts of Minsk II were never carried out, as Kyiv and Moscow disagreed over their order. From 2019 Russia gave passports to hundreds of thousands of people in the separatist areas. Volodymyr Zelensky, elected president that year, promised peace, and a ceasefire in July 2020 brought the quietest months of the war. By the end of 2021 the UN estimated that 14,200–14,400 people had been killed since 2014, about 3,400 of them civilians, including those aboard MH17.
    facts:
      - [Minsk II, "12 February 2015"]
      - [Debaltseve abandoned, "18 February 2015"]
      - [Killed in 2014–2021, "14,200–14,400 (UN estimate)"]
