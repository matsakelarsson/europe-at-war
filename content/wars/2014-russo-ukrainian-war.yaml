id: russo-ukrainian-war
name: Russo-Ukrainian War
start: "2014-02-20"
end: ongoing
tier: C
summary: The war began in February 2014, after the Euromaidan protests and the flight of President Viktor Yanukovych, when Russian troops without insignia took control of Crimea, which Russia annexed in March after a referendum held under its military control; Ukraine and most members of the United Nations do not recognise the annexation. From April 2014 Russian-backed separatists, joined from August by regular Russian troops whose presence Russia denied, fought Ukrainian forces in the Donbas. The Minsk agreements of 2014 and 2015 reduced the fighting but did not end it, and by early 2022 some 14,000 people had been killed. On 24 February 2022 Russia launched a full-scale invasion. Its forces were driven back from around Kyiv that spring and lost ground near Kharkiv and Kherson in the autumn, but held much of the south and east, and in September 2022 Russia proclaimed the annexation of the Donetsk, Luhansk, Zaporizhzhia and Kherson regions, which it did not fully control. The UN has confirmed well over 10,000 civilian deaths since 2022 and believes the real number is considerably higher, military losses on both sides are estimated in the hundreds of thousands killed and wounded, and millions of Ukrainians have fled abroad. The fighting continued through 2023–2026; peace talks mediated by the United States in November 2026 ended without a ceasefire. Last updated 18 November 2026.
countries: [ua, ru]
