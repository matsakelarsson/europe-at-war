steps:
  - title: Euromaidan and Crimea
    date: November 2013 – March 2014
    when: "2014-02-20"
    borders: "2014-03-18"
    countries: [ua, ru]
    body:
      - In November 2013 President Viktor Yanukovych, under pressure from Russia, dropped an association agreement with the European Union that he had promised to sign. Protests on Kyiv’s Maidan Nezalezhnosti, the Euromaidan, swelled after riot police beat students, and clashes grew through the winter. Between 18 and 20 February 2014 more than a hundred people were killed in central Kyiv, most of them protesters shot by the security forces. Yanukovych fled the capital on 21 February, and the next day parliament voted to remove him. Russia called the change of government an unconstitutional coup.
      - From 27 February Russian soldiers without insignia, whom Moscow at first described as local self-defence forces, seized Crimea’s parliament and government buildings, its airports and the roads to the mainland, and surrounded Ukrainian bases. Under their control the regional parliament installed a new premier, Sergei Aksyonov, and called a referendum, held on 16 March, which the new authorities said had returned 97 per cent for joining Russia. Russia signed a treaty annexing Crimea and Sevastopol on 18 March, and most Ukrainian troops left without a fight. On 27 March the UN General Assembly, by 100 votes to 11, affirmed Ukraine’s territorial integrity and said the referendum had no validity.
    facts:
      - [Yanukovych removed by parliament, "22 February 2014"]
      - [Crimean referendum, "16 March 2014"]
      - [Russia’s treaty of annexation, "18 March 2014"]
