  - title: Talks and attrition in 2025
    date: 2025
    when: "2025-01"
    borders: "2025-12-31"
    countries: [ua, ru, pl]
    body:
      - Russia retook Sudzha in March 2025 and said in April that it had cleared the Kursk region, which Ukraine disputed; North Korea then confirmed that its troops had fought there. On 1 June Ukrainian drones, smuggled into Russia in lorries, struck strategic bombers at airfields as far away as Siberia. Russia’s summer offensive pushed into the Dnipropetrovsk region and closed on Pokrovsk, and by the counts of DeepState and ISW it gained some 4,300–5,300 square kilometres in the year. In December Ukraine withdrew from Siversk, and Russia claimed Pokrovsk, Vovchansk and Huliaipole, though Ukraine still held parts of Pokrovsk and had retaken Kupiansk.
      - Donald Trump’s new administration opened talks with Russia in Riyadh in February. After a clash between Trump and Zelensky at the White House on 28 February the United States briefly halted military aid, and on 11 March Ukraine accepted an American proposal for a 30-day ceasefire, which Russia did not. Direct Russian–Ukrainian talks in Istanbul from May to July produced the largest prisoner exchanges of the war, and Trump met Putin in Alaska on 15 August, but there was no ceasefire. An American peace plan in November led to talks in Geneva, Berlin and Florida; by the end of December Zelensky said a 20-point framework was 90 per cent agreed, but not territory.
      - Russian drone and missile attacks grew heavier. On 7 September Russia launched a record 810 drones, and the government building in Kyiv was damaged. On the night of 9–10 September drones crossed into Poland, where Polish and allied aircraft shot some down, and NATO launched Eastern Sentry to guard its eastern flank. A strike on apartment blocks in Ternopil on 19 November killed at least 38 people. The UN counted 2,514 civilians killed in 2025, the highest yearly toll since 2022.
    facts:
      - [Kursk region retaken by Russia, "March–April 2025"]
      - [Trump–Putin summit in Alaska, "15 August 2025"]
      - [Civilians killed in 2025, "2,514 (UN)"]
