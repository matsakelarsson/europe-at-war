  - title: The war in 2026
    date: January – November 2026
    when: "2026-01"
    borders: "2026-11-19"
    countries: [ua, ru]
    body:
      - Last updated 19 November 2026. Through the winter Russian strikes on power stations left much of Kyiv without heat in freezing weather, and Ukraine declared an energy emergency in January. Russia took Huliaipole in January and by February had, by most accounts, completed the capture of Pokrovsk and Myrnohrad, but its advance then slowed sharply. Ukraine won back ground early in the year, its first gains since 2023, and by ISW’s count Russia’s gains from January to October came to only about 117 square kilometres, against more than 5,000 in 2025; in September and October it lost more ground than it took, as Ukrainian forces pushed back north of Lyman. Fighting went on for Kostiantynivka.
      - Russian air attacks went on. A strike on an apartment building in Kyiv on 14 May killed 24 people, and on 2 November a strike on a school in Komyshuvakha, in the Zaporizhzhia region, that was being used as an aid centre and shelter killed 72 people, according to Ukrainian authorities. The UN said in November that 17,994 civilians had been confirmed killed and 57,854 injured since February 2022. In April the European Union approved a loan of €90 billion to fund Ukraine in 2026 and 2027, and in July Zelensky replaced the commander-in-chief, Oleksandr Syrskyi, with Mykhailo Drapatyi.
      - Talks between the United States, Ukraine and Russia in Abu Dhabi and Geneva in January and February brought prisoner exchanges but no breakthrough. On 10–11 November Russian and Ukrainian delegations met again in Abu Dhabi, for the first time in nine months, and agreed a large prisoner exchange, but not a ceasefire; the American envoys Steve Witkoff and Jared Kushner then met Putin in Moscow and Zelensky in Dublin. On 17 November Ukrainian drone and missile strikes brought down a section of the road bridge to Crimea. Russia holds about a fifth of Ukraine, including Crimea.
    facts:
      - ["Russian gains, January–October 2026", "about 117 km² (ISW)"]
      - [Civilians killed since February 2022, "17,994 confirmed (UN)"]
      - [Abu Dhabi talks, "10–11 November 2026"]
