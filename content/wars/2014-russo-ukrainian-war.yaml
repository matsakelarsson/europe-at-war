  - title: Mariupol and the battle of Donbas
    date: March – July 2022
    when: "2022-04-18"
    borders: "2022-07-31"
    countries: [ua, ru]
    body:
      - Mariupol, surrounded by early March, was pounded for weeks and largely destroyed. On 9 March a strike hit a maternity hospital, and on 16 March a bomb struck the Drama Theatre, where hundreds of civilians were sheltering and the word “children” had been painted in Russian on the ground outside; estimates of the dead there range from about a dozen to some 600. The last defenders, holed up in the Azovstal steelworks, surrendered between 16 and 20 May, and Russia said 2,439 had laid down their arms. The UN verified more than 1,300 civilian deaths in the city and believed the true figure to be thousands higher.
      - From 18 April Russia turned its main effort to the Donbas, grinding forward behind massed artillery. It took Popasna in May, Sievierodonetsk on 25 June and Lysychansk on 3 July, which gave it almost all of the Luhansk region, while its push south from Izium stalled before Sloviansk. On 30 June it abandoned Snake Island in the Black Sea. From June Ukraine received American HIMARS rocket launchers and used them against ammunition depots far behind the front. On 29 July an explosion killed some 50 Ukrainian prisoners of war, many of them from Azovstal, in a prison camp at Olenivka; each side blamed the other.
    facts:
      - [Drama Theatre bombed, "16 March 2022"]
      - [Azovstal surrenders, "16–20 May 2022"]
      - [Lysychansk falls, "3 July 2022"]
