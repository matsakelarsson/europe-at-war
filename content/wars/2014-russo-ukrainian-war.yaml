  - title: Ilovaisk and the Minsk Protocol
    date: August – September 2014
    when: "2014-08-07"
    borders: "2014-09-05"
    countries: [ua, ru]
    body:
      - By August Ukrainian forces had nearly surrounded Donetsk and Luhansk and were cutting the separatists off from the Russian border. In the second half of the month regular Russian units crossed into Ukraine; Moscow denied it, saying that any Russian soldiers there were volunteers. At Ilovaisk, east of Donetsk, Ukrainian troops, many of them from volunteer battalions, were encircled, and on 29 August they were cut down as they left by a corridor they had been promised; Ukrainian official figures put the dead at more than 360. A new thrust along the coast took Novoazovsk on 27 August and reached the outskirts of Mariupol.
      - On 5 September representatives of Ukraine, Russia, the OSCE and the separatists signed the Minsk Protocol, which provided for a ceasefire, an exchange of prisoners, monitoring by the OSCE and a special status for parts of the Donetsk and Luhansk regions. The fighting slowed but never stopped. The separatists held elections of their own on 2 November, which Ukraine and Western governments rejected, and the battle for Donetsk airport, where Ukrainian troops had held out since May, went on through the winter. By then several thousand people had been killed and hundreds of thousands had fled their homes.
    facts:
      - [Battle of Ilovaisk, "7 August – 2 September 2014"]
      - [Novoazovsk taken, "27 August 2014"]
      - [Minsk Protocol, "5 September 2014"]
