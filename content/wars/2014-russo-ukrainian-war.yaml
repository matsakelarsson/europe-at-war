  - title: Avdiivka and the Kursk incursion
    date: 2024
    when: "2024-02"
    borders: "2024-12-31"
    countries: [ua, ru]
    body:
      - Ukrainian forces withdrew from Avdiivka on 17 February 2024 after a four-month assault that cost Russia heavy losses, while a new American aid package was held up in Congress until April. On 10 May Russia opened a new front north of Kharkiv, around Vovchansk, and Ukraine’s allies then allowed it to strike targets in Russia near the border with their weapons. Through the summer and autumn Russian forces pressed west towards Pokrovsk, a logistics hub, taking Vuhledar in October and Selydove soon after. On 8 July a missile hit Okhmatdyt, Ukraine’s largest children’s hospital, in Kyiv, and in November Russia fired a new intermediate-range missile, the Oreshnik, at Dnipro.
      - On 6 August Ukrainian troops crossed the border into Russia’s Kursk region, the first invasion of Russian territory by a foreign army since the Second World War, and took the town of Sudzha and, by Ukraine’s account, more than 1,000 square kilometres. Russia brought in thousands of North Korean soldiers, some 11,000–12,000 by Western and South Korean estimates, to help win the ground back. Ukraine hoped the incursion would draw Russian troops away from the Donbas, but the advance on Pokrovsk went on, and by the end of the year Russia had made its largest gains since 2022.
    facts:
