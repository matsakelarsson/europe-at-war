  - title: Kyiv, Bucha and the withdrawal from the north
    date: March – April 2022
    when: "2022-03-25"
    borders: "2022-04-08"
    countries: [ua, ru, by]
    body:
      - The advance on Kyiv stalled in the north-western suburbs of Irpin, Bucha and Hostomel and on the roads from the east, as Ukrainian troops struck its long supply columns. On 25 March the Russian general staff said the first phase was over and that it would concentrate on the Donbas, and after talks in Istanbul on 29 March it announced that it would cut back its operations around Kyiv and Chernihiv. By early April Russian forces had left the Kyiv, Chernihiv and Sumy regions for Belarus and Russia. On 14 April the cruiser Moskva, flagship of the Black Sea Fleet, sank; Ukraine said it had hit her with missiles, while Russia spoke of a fire.
      - In the towns the Russians left behind, Ukrainian troops and journalists found the bodies of civilians in streets, yards and mass graves. In Bucha alone local officials counted more than 400 dead, many of them shot. UN human rights monitors documented the unlawful killing of dozens of civilians there, and a UN commission of inquiry later found that Russian forces had committed war crimes, including executions, in the Kyiv region. Russia denied it and called the images staged. On 8 April a missile carrying cluster munitions struck crowds waiting to be evacuated at Kramatorsk railway station, killing about 60 people; Russia blamed Ukraine.
    facts:
      - [Russia announces cut-back around Kyiv, "29 March 2022"]
      - [Kramatorsk station attack, "8 April 2022"]
      - [Moskva sunk, "14 April 2022"]
