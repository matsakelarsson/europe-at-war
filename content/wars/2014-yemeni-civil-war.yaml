  - title: Marib and the truce
    date: 2020–2023
    when: "2020-02"
    borders: "2022-04-07"
    countries: [ye, sa, ae]
    body:
      - In 2020 the Houthis took al-Hazm, the capital of al-Jawf, and launched a long offensive against Marib, the government’s last stronghold in the north, with its oil and gas fields and a population swollen by up to a million displaced people. Tens of thousands of fighters were killed in two years of fighting in the desert and the hills, but Marib city held, and in January 2022 the Giants Brigades pushed the Houthis back from Shabwa. The Houthis struck Abu Dhabi with missiles and drones in January 2022, killing three people.
      - On 2 April 2022 the UN brokered a two-month truce, which was extended twice. Days later Hadi handed his powers to an eight-member Presidential Leadership Council headed by Rashad al-Alimi, which included the STC’s leader, Aidarus al-Zubaidi. The truce formally expired in October 2022 but largely held; flights from Sanaa resumed, fuel ships entered Hodeidah, and in 2023, after Saudi Arabia and Iran restored relations, Saudi and Houthi officials met openly and nearly 900 prisoners were exchanged.
    facts:
      - [al-Hazm taken by the Houthis, "March 2020"]
      - [UN truce, "2 April 2022"]
      - [Presidential Leadership Council formed, "7 April 2022"]
    markers:
