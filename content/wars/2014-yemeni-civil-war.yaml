id: yemeni-civil-war
name: Yemeni Civil War
start: "2014-09-21"
end: ongoing
tier: A
summary: The war that began when the Houthis (Ansar Allah), a Zaydi Shia revivalist movement from the far north, took the capital Sanaa in September 2014, allied with the forces of the former president Ali Abdullah Saleh, and drove President Abd Rabbuh Mansur Hadi’s government south to Aden and into exile. In March 2015 a Saudi-led coalition intervened against the Houthis, whom it saw as Iran’s proxies, with air strikes and a blockade, and southern forces backed by the United Arab Emirates drove the Houthis out of Aden. The war then settled into years of stalemate, air strikes on Houthi-held areas, Houthi missile attacks on Saudi Arabia, and one of the world’s worst humanitarian crises. A UN-brokered truce of April 2022 largely held for four years, while the Houthis attacked shipping in the Red Sea in 2023–2025 and fought the United States and Israel. In 2026 the war flared up again, with a Houthi offensive on the Red Sea coast and around Taiz and a Saudi-backed government counter-offensive; the fighting was continuing in late November 2026. By the end of 2021 the UN estimated about 377,000 deaths, most of them from hunger and disease. Last updated 27 November 2026.
countries: [ye, sa, ae]
