  - title: Decisive Storm and the battle for Aden
    date: March – August 2015
    when: "2015-03-26"
    borders: "2015-08-04"
    countries: [ye, sa, ae]
    body:
      - In March 2015 Houthi and Saleh forces drove south, took the al-Anad air base and entered Aden; Hadi fled to Saudi Arabia. On 26 March Saudi Arabia launched Operation Decisive Storm with a coalition of the United Arab Emirates, Bahrain, Kuwait, Qatar, Egypt, Jordan, Morocco and Sudan, with US logistical and intelligence support. Coalition aircraft bombed Houthi positions, army bases and, increasingly, roads, bridges, factories and markets, and the coalition imposed an air and sea blockade. On 14 April the UN Security Council imposed an arms embargo on the Houthis and demanded that they withdraw from the cities (Resolution 2216).
      - Aden was fought over street by street for four months. In July 2015 southern militias, with Emirati troops and armour landed by sea, drove the Houthis out of the city, and in August they took al-Anad. In the chaos, al-Qaeda in the Arabian Peninsula (AQAP) seized Mukalla, the main city of Hadramawt, in April 2015 and held it for a year. Taiz, Yemen’s third city, was split by a front line and besieged by the Houthis.
    facts:
      - [Operation Decisive Storm begins, "26 March 2015"]
      - [UN Security Council Resolution 2216, "14 April 2015"]
      - [Aden retaken by southern forces, "July 2015"]
    markers:
