  - title: Stalemate, blockade and famine
    date: 2016–2018
    when: "2016-04"
    borders: "2017-12-04"
    countries: [ye, sa]
    body:
      - Peace talks in Kuwait in 2016 failed, and the war settled into stalemate along the edges of the northern highlands. Coalition air strikes hit hospitals, schools, markets, weddings and funerals; a strike on a funeral hall in Sanaa in October 2016 killed about 140 people, and in August 2018 a bomb on a school bus at Dahyan in Saada province killed 40 children. The Houthis fired ballistic missiles at Saudi cities, including Riyadh, and shelled the government-held parts of Taiz.
      - The blockade, the collapse of the currency and the unpaid salaries of public employees brought millions to the brink of starvation. A cholera epidemic from 2016 became the largest recorded in modern times, with more than two million suspected cases by 2019. In December 2017 Saleh broke with the Houthis and offered to talk to the Saudis; after days of fighting in Sanaa he was killed by Houthi fighters on 4 December 2017.
    facts:
      - [Sanaa funeral hall strike, "8 October 2016, about 140 killed"]
      - [Saleh killed, "4 December 2017"]
      - [Dahyan school bus strike, "9 August 2018, 40 children killed"]
    markers:
