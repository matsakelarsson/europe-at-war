notes:
  - Death tolls are estimates. A UN Development Programme study projected about 377,000 deaths by the end of 2021, some 60 per cent of them from indirect causes such as hunger, disease and lack of health care, and most of those young children. The Armed Conflict Location & Event Data Project (ACLED) recorded about 150,000 deaths in fighting and attacks by 2022. Both sides have been accused of war crimes; UN experts found that coalition air strikes killed thousands of civilians, and that the Houthis shelled cities indiscriminately, laid landmines, recruited children and blocked aid.
  - Iran supplies the Houthis with missiles, drones and other weapons, as UN panels have reported; Iran denies directing them, and the Houthis act on their own decisions. The United States, Britain and France sold arms to Saudi Arabia and the UAE and, in the early years, gave the coalition intelligence and refuelling.
  - Zones of control are approximate and drawn from published maps and news reports. The government, the Southern Transitional Council and other anti-Houthi forces were often rivals. Yemen is shown on the base map as one state, as it is internationally recognised.
  - The last step covers events up to 27 November 2026. Many claims by the parties about advances, strikes and casualties in 2026 could not be independently verified.
