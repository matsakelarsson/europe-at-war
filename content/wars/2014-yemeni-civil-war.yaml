steps:
  - title: The Houthis take Sanaa
    date: 2014 – February 2015
    when: "2014-09-21"
    borders: "2015-02-21"
    countries: [ye]
    body:
      - The Houthi movement, named after its founder Hussein al-Houthi, grew among the Zaydi Shia of Saada province, the northern highlands that had been the heart of Yemen’s old imamate, and fought six short wars against President Ali Abdullah Saleh’s government in 2004–2010. After the uprising of 2011 Saleh handed power to his deputy, Abd Rabbuh Mansur Hadi, in a Gulf-brokered transition, but the national dialogue that followed left the Houthis and many others dissatisfied, and Saleh, still powerful in the army and his party, quietly allied with his old enemies.
      - In 2014 the Houthis took Amran, and after protests against cuts in fuel subsidies their fighters entered Sanaa on 21 September 2014 with little resistance. They went on to take Hodeidah, Dhamar and Ibb. In January 2015 they surrounded the presidential palace; Hadi resigned and was put under house arrest, and in February the Houthis dissolved parliament and set up a Revolutionary Committee. On 21 February Hadi escaped to Aden, withdrew his resignation and called on the world for help.
    facts:
      - [Houthis enter Sanaa, "21 September 2014"]
      - [Hadi resigns, "22 January 2015"]
      - [Hadi escapes to Aden, "21 February 2015"]
