  - title: Hodeidah, Stockholm and the split in the south
    date: 2017–2019
    when: "2018-06-13"
    borders: "2019-08-10"
    countries: [ye, sa, ae]
    body:
      - Emirati-backed forces, among them southern Giants Brigades and fighters led by Saleh’s nephew Tareq Saleh, advanced up the Red Sea coast from Mokha, which they took in 2017, and in June 2018 attacked Hodeidah, the port through which most of northern Yemen’s food and fuel arrived. Fearing a famine, the UN pressed for a halt, and at talks in Sweden the two sides agreed on 13 December 2018 to a ceasefire in Hodeidah, the Stockholm Agreement, watched by a UN mission. The front lines froze on the city’s edge.
      - The anti-Houthi camp then split. The Southern Transitional Council (STC), formed in 2017 by southern leaders who wanted South Yemen restored as an independent state, seized Aden from Hadi’s government in August 2019, and Emirati aircraft struck government troops trying to retake it. A Saudi-brokered Riyadh Agreement in November 2019 papered over the rift. On 14 September 2019 drones and missiles struck the Saudi oil plants at Abqaiq and Khurais; the Houthis claimed the attack, while the United States and Saudi Arabia blamed Iran.
    facts:
