  - title: The south, and the war flares again
    date: December 2025 – November 2026
    when: "2025-12-03"
    borders: "2026-11-27"
    countries: [ye, sa, ae]
    body:
      - Last updated 27 November 2026. In early December 2025 the Southern Transitional Council seized Hadramawt and al-Mahra in a swift offensive, claiming control of all of former South Yemen. Saudi Arabia demanded its withdrawal and bombed its positions; on 30 December a coalition strike hit a shipment at Mukalla that it said was Emirati weapons for the STC (the UAE said it held only vehicles for its own forces); the government ordered Emirati forces out of the country, and the UAE announced that it would withdraw its remaining troops. In January 2026 Saudi-backed government forces retook Hadramawt and entered Aden on 7 January. Al-Zubaidi was charged with treason and fled abroad, and on 9 January STC officials in Riyadh announced the council’s dissolution, which some of its leaders disputed.
      - After the United States and Israel went to war with Iran in February 2026, the Houthis fired missiles at Israel from late March. On 13 July 2026 Saudi or government aircraft (reports differ) bombed the runway of Sanaa airport to stop an Iranian airliner carrying a Houthi delegation from landing. The Houthis declared the de-escalation over, announced a blockade of Saudi shipping and resumed missile and drone attacks on Saudi Arabia, and Saudi aircraft resumed strikes on Houthi-held areas, including the port of Hodeidah. In September the Houthis launched an offensive on the Red Sea coast, taking Mokha on 10 September and the coast towards the Bab al-Mandab, and by mid-October they had again closed every road out of Taiz. In October the government answered with a counter-offensive, Operation Yemen Dawn, on the west coast and in al-Jawf and al-Bayda; it retook Dhubab, claimed Mokha, which the Houthis denied, and gained ground in al-Jawf.
      - In October and November the Houthis struck airports, oil installations and office towers in Riyadh, Jizan, Dhahran and other Saudi cities with missiles and drones, killing about two dozen people and injuring hundreds, by Saudi figures. In November they advanced through Lahj province towards Aden. On 15 November government forces withdrew from Dhubab and the coast at the Bab al-Mandab to defend the city, and on 24 November an army spokesman said the Houthis were about 60 kilometres away but would not take it; the Houthis had said they did not intend to attack Aden. By 23 November health authorities in government-held areas had recorded about 2,400 deaths and 11,000 injuries since August, a count the World Health Organization called a minimum, and the UN counted more than 360,000 people displaced. Whether the Houthis would push on towards Aden, whether the government offensive would regain ground, and whether mediation could restore a truce were all uncertain.
