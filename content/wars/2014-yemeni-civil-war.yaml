  - title: The Red Sea crisis
    date: November 2023 – 2025
    when: "2023-11-19"
    borders: "2025-05-06"
    countries: [ye, il, us, gb, eg]
    body:
      - After the war in Gaza began in October 2023, the Houthis fired missiles and drones at Israel and, from November, attacked merchant ships in the Red Sea and the Gulf of Aden that they linked to Israel, and later to the United States and Britain, saying they acted in support of the Palestinians. On 19 November they seized the car carrier Galaxy Leader. Most shipping companies rerouted around Africa, and traffic through the Suez Canal fell by more than half. From 12 January 2024 US and British aircraft and warships struck Houthi targets; the Houthis sank the bulk carriers Rubymar and Tutor in 2024, and killed three crew members of the True Confidence in March 2024.
      - In July 2024 a Houthi drone killed a man in Tel Aviv, and Israel bombed the port of Hodeidah, the first of many Israeli strikes on Yemen’s ports, power stations and Sanaa airport. From 15 March 2025 the United States waged a much heavier air campaign; strikes on the Ras Isa fuel port and on a detention centre for African migrants in Saada each killed dozens of people. On 6 May 2025 Oman brokered a US–Houthi ceasefire, but attacks on Israel and on shipping continued. In July the Houthis sank two more ships, Magic Seas and Eternity C, and on 28 August an Israeli strike in Sanaa killed the Houthi prime minister, Ahmed al-Rahawi, and several ministers. The Houthis paused their attacks after the Gaza ceasefire of October 2025.
    facts:
      - [Galaxy Leader seized, "19 November 2023"]
      - [US and British strikes begin, "12 January 2024"]
      - [US–Houthi ceasefire, "6 May 2025"]
    markers:
      - kind: event
        side: hou
        name: Bab al-Mandab
        date: from November 2023
        text: The strait between Yemen and Djibouti through which about an eighth of world trade passed before the attacks.
        lonlat: [43.40, 12.62]
        lp: l
      - kind: air
        side: west
        name: Sanaa
        date: 2024–2025
        text: US and British strikes hit missile and drone sites around the capital and in the north; the US campaign of March–May 2025 was the heaviest.
        lonlat: [44.21, 15.35]
      - kind: air
        side: il
        name: Hodeidah
        date: from 20 July 2024
        text: Israel’s strikes on the port’s fuel tanks and cranes were its first in Yemen, in answer to the drone that hit Tel Aviv.
        lonlat: [42.95, 14.80]
        lp: l
      - kind: event
        side: hou
        name: Eilat
        date: 2023–2025
        text: The Israeli port at the head of the Red Sea, a frequent target of Houthi missiles and drones, most of which were intercepted. Its shipping traffic almost stopped.
        lonlat: [34.95, 29.56]
