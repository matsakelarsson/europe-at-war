id: insurgency-in-niger
name: Jihadist insurgency in Niger
start: "2015-02"
end: ongoing
tier: C
summary: "Last updated 27 November 2026. The jihadist insurgency in Niger, fought on two fronts. In the south-east, Boko Haram crossed from Nigeria into the Diffa region and attacked Bosso and Diffa in February 2015, after Niger joined the regional force against it; the war around Lake Chad has gone on there since, with Boko Haram and the Islamic State West Africa Province (ISWAP), which split from it in 2016. In the west, the Islamic State in the Greater Sahara (ISGS), founded in 2015 by Adnan Abu Walid al-Sahrawi, and later JNIM operated from Mali in the Tillabéri and Tahoua regions along the border, attacking army posts and villages. An ambush at Tongo Tongo on 4 October 2017 killed four American and at least four Nigerien soldiers; attacks on the bases of Inates on 10 December 2019 and Chinagodrar on 9 January 2020 killed 71 and 89 soldiers; six French aid workers and two Nigeriens were killed at Kouré in August 2020; about 100 villagers were killed at Tchoma Bangou and Zaroumdareye on 2 January 2021, and some 141 people in villages of the Tahoua region on 21 March 2021. ISGS became the Islamic State’s Sahel Province (IS Sahel) in 2022. Niger was then the main Western partner in the Sahel, with French troops and an American drone base at Agadez. On 26 July 2023 the presidential guard under General Abdourahamane Tiani overthrew President Mohamed Bazoum. The junta made French troops leave by December 2023 and American troops by September 2024, turned to Russia, whose Africa Corps arrived in April 2024, formed the Alliance of Sahel States with Mali and Burkina Faso and left ECOWAS in January 2025. The violence grew: ACLED recorded some 1,900 deaths in Niger in 2025, more than 1,200 of them in Tillabéri. In 2026 IS Sahel attacked the international airport and Air Base 101 at Niamey on the night of 28–29 January; JNIM overran an army post at Makalondi on 4 February, killing at least 36 soldiers; soldiers who mutinied in Niamey on 29 August attacked the airport, the presidency and the state broadcaster before loyal troops, helped by Russian forces, put the mutiny down. On 26 November 2026 an attack on a National Guard post at Sanam in Tillabéri killed at least 13 guardsmen, two days after an attack attributed to Boko Haram killed 11 soldiers in Diffa. JNIM and IS Sahel also fight each other along the borders with Mali and Burkina Faso. Most figures come from the government and from ACLED’s count of reported deaths and cannot be checked independently; how much of rural Tillabéri the state still controls is uncertain."
