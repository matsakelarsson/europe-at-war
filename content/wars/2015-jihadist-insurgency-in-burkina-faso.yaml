id: jihadist-insurgency-in-burkina-faso
name: Jihadist insurgency in Burkina Faso
start: "2015-08-23"
end: ongoing
tier: B
summary: "The war between the state of Burkina Faso and jihadist groups that spread into the country from Mali after 2015. It began in the Sahel region of the north, where Ansarul Islam, founded by the Fulani preacher Ibrahim Malam Dicko in 2016, drew on resentment of the state and of local elites, and widened as al-Qaeda’s JNIM and the Islamic State’s Sahel branch moved into the north, the east and the west. Attacks on the capital, Ouagadougou, in 2016–2018 were followed by a rural war in which jihadists killed soldiers, officials, teachers and villagers, while the army and the state-armed Volunteers for the Defence of the Homeland (VDP) were accused of massacring Fulani civilians. Anger at the army’s losses brought two coups in 2022; Captain Ibrahim Traoré, in power since September 2022, sent away the French forces, turned to Russia, mobilised the population and silenced critics. By the mid-2020s Burkina Faso was among the countries worst hit by terrorism in the world: some 2 million people had been displaced, towns such as Djibo were under blockade for years, and estimates of the dead run to 20,000–25,000."
countries: [bf, ml, ne, fr, ru]
