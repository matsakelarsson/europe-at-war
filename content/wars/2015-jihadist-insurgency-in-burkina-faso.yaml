  - title: Solhan, Inata and the coups of 2022
    date: 2021–2022
    when: "2021-06-05"
    borders: "2022-09-30"
    countries: [bf, ml, ne]
    body:
      - "On the night of 4–5 June 2021 gunmen killed at least 160 people, among them many VDP members and their families, at Solhan in the Yagha, near the Niger border, the deadliest attack of the war so far; the government first gave 132 dead. On 14 November 2021 jihadists overran the gendarmerie post at Inata, near the gold mine of the same name, and killed 53 people, 49 of them gendarmes who had reportedly been without food supplies for weeks. Protests against President Roch Marc Christian Kaboré’s handling of the war followed."
      - "On 24 January 2022 officers led by Lieutenant Colonel Paul-Henri Sandaogo Damiba overthrew Kaboré, promising to win back the territory lost. Instead the violence grew: in June 2022 gunmen killed some 86 people, by official figures and more by others, at Seytenga in the Séno, and JNIM laid siege to Djibo and other northern towns, cutting the roads and blowing up bridges so that they could be supplied only by convoy or by air. After a convoy to Djibo was ambushed at Gaskindé in September, Captain Ibrahim Traoré overthrew Damiba on 30 September 2022."
    facts:
