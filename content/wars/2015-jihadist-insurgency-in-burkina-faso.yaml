notes:
  - "French special forces (Task Force Sabre) were based near Ouagadougou until February 2023, and Russian military instructors arrived from 2024. The VDP, created by law in January 2020, are civilian auxiliaries armed and briefly trained by the state; their ranks were greatly enlarged in 2023."
  - "Casualty figures come from the government, the armed groups, aid agencies and ACLED’s counts of reported deaths, and often differ widely. Since 2022 the junta has restricted reporting, suspended foreign media and conscripted critics, so many attacks cannot be verified."
