steps:
  - title: Ansarul Islam and the attacks on Ouagadougou
    date: 2015–2020
    when: "2016-12-16"
    borders: "2019-01-01"
    countries: [bf, ml, ne]
    body:
      - "Under Blaise Compaoré, who ruled from 1987 until a popular uprising drove him out in October 2014, Burkina Faso had been spared the jihadist violence of its neighbours, by some accounts through tacit understandings with the armed groups in Mali. His fall, and the dissolution of his elite presidential guard after its failed coup of September 2015, weakened the security services just as the war in Mali spread south. The first attack on a gendarmerie post in the north came on 23 August 2015, and on 15 January 2016 gunmen of AQIM and al-Mourabitoun attacked the Splendid Hotel and the Cappuccino café in Ouagadougou and killed 30 people. Further attacks on the capital, on a Turkish restaurant on 13 August 2017 and on the French embassy and the army headquarters on 2 March 2018, followed."
      - "In the north the war had local roots. In the Soum province on the Malian border, Ibrahim Malam Dicko, a Fulani preacher who denounced the power of chiefs, marabouts and the wealthy, founded Ansarul Islam in 2016; on 16 December 2016 its fighters killed a dozen soldiers at Nassoumbou. After Dicko’s death in 2017 his brother Jafar led the group, which became part of the network of JNIM, al-Qaeda’s Sahel branch, while the Islamic State in the Greater Sahara operated in the Oudalan and Séno along the Niger border. From 2018 the insurgents spread into the forests of the east, where they drove out forest guards and officials."
      - "The war turned communal. On 1 January 2019, after jihadists killed a village chief and others at Yirgou, in the Centre-Nord, Mossi self-defence militias (Koglweogo) killed dozens of Fulani villagers; officially 49 people died, and local groups counted over 200. Jihadists closed schools, killed teachers and Christian worshippers, and the army was accused of executing Fulani suspects. By early 2020 some 800,000 people had fled their homes, and in January 2020 the government created the Volunteers for the Defence of the Homeland (VDP), armed civilian auxiliaries."
    facts:
      - [First attack in the north, "23 August 2015"]
      - [Attack on Ouagadougou, "15 January 2016, 30 killed"]
