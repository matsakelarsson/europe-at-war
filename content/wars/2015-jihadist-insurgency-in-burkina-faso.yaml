  - title: Traoré, Barsalogho and the war since 2023
    date: 2023 – November 2026
    when: "2024-08-24"
    borders: "2026-11-27"
    countries: [bf, ml, ne, fr, ru]
    body:
      - "Last updated 27 November 2026. Traoré’s junta asked the French forces to leave, which they did in February 2023, joined Mali and Niger in the Alliance of Sahel States and turned to Russia. It decreed a general mobilisation in April 2023, recruited tens of thousands of VDP and conscripted journalists and critics. The army and VDP were accused of massacres of civilians, among them at Karma in the Yatenga on 20 April 2023, where officials said at least 60 people were killed and witnesses spoke of far more, and at Solenzo in the west in March 2025. JNIM grew stronger. On 11 June 2024 it overran the army base at Mansila in the Yagha, killing more than 100 soldiers, and on 24 August 2024, at Barsalogho in the Centre-Nord, its fighters shot down villagers whom the army had ordered to dig trenches round the town; estimates of the dead range from about 200 to more than 600. In 2025 it attacked Diapaga in the east in March, killing some 50 to 65 soldiers and VDP by different counts, and Djibo on 11 May, where between 100 and 200 soldiers and civilians were reported killed."
      - "In 2026 JNIM kept up its attacks: in February some 30 raids on army and VDP posts killed more than 120 soldiers, forest guards and militiamen, by ACLED’s count, an attack on the base at Bagmoussa in the Centre-Est killed 28 on 22 April, and a raid on Di in the north-west on 4 July killed between about 20 and 34 soldiers and VDP by different counts. JNIM and the Islamic State fought each other along the Malian border near Kacham in early September and in the Oudalan in October; the Islamic State claimed to have killed hundreds of JNIM fighters. The junta dissolved the political parties in January 2026, broke off its remaining relations with France in June and restored the death penalty on 20 October. In November Human Rights Watch reported that 27 civilians had been killed in two attacks in the Yatenga in September. The UN counts some 4.5 million people in need of aid in 2026; the last official count of the displaced, about 2.1 million, dates from 2023. The International Crisis Group says JNIM controls or contests large parts of the country, though the government says it is winning back ground."
    facts:
      - [French forces leave, "February 2023"]
      - [Barsalogho massacre, "24 August 2024, about 200 to more than 600 killed"]
      - [Displaced, "about 2.1 million (2023)"]
