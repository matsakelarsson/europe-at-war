id: pool-war
name: Pool War
start: "2016-04-04"
end: "2017-12-23"
tier: C
summary: "A conflict in the Pool department of the Republic of the Congo, around Brazzaville, between the government and the Ninja militia of Frédéric Bintsamou, known as Pastor Ntumi. A 2015 referendum allowed President Denis Sassou Nguesso to run again, and his re-election in March 2016 was rejected by the opposition. On 4 April 2016 armed men attacked police and military posts in the southern quarters of Brazzaville; the government blamed Ntumi’s Ninjas, who denied it, and the army bombed and attacked their strongholds in the Pool. The Ninjas attacked trains and cut the railway between Brazzaville and Pointe-Noire, and in April 2017 killed 18 soldiers. The Pool was closed to journalists and aid workers for long periods; at least 115 people were killed, and estimates of the displaced range from about 13,000 to more than 100,000. A ceasefire signed on 23 December 2017 provided for the Ninjas’ disarmament and the reopening of the railway, which resumed service in November 2018."
