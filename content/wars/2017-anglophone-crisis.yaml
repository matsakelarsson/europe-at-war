steps:
  - title: From strikes to secession
    date: October 2016 – October 2017
    when: "2017-10-01"
    borders: "2017-10-01"
    countries: [cm]
    body:
      - The Northwest and Southwest regions were the southern part of the British Cameroons, a League of Nations mandate and UN trust territory, which voted in the plebiscite of February 1961 to join the former French Cameroon rather than Nigeria. The federation they joined was replaced by a unitary state in 1972, and many English-speaking Cameroonians, about a fifth of the population, came to feel that their common-law courts, their schools and their region were being absorbed into a centralised, French-speaking state run from Yaoundé under President Paul Biya, in power since 1982.
      - "In October 2016 lawyers in Bamenda and Buea went on strike against the appointment of French-trained judges to common-law courts, and in November teachers struck against French-speaking teachers in English-language schools. Security forces broke up the protests, killing several people. In January 2017 the government banned the Anglophone civil-society consortium, arrested its leaders and cut the internet in the two regions for about three months. After mass marches on 22 September and 1 October 2017, at which security forces killed at least 20 people, separatist leaders under Sisiku Julius Ayuk Tabe declared the independence of the “Federal Republic of Ambazonia” on 1 October 2017; armed groups had begun attacking gendarmes and police the month before."
    facts:
      - [Lawyers’ strike begins, "October 2016"]
      - [Internet shutdown, "January – April 2017"]
      - [Declaration of independence, "1 October 2017"]
