notes:
  - "Names and status. Separatists call the two regions Ambazonia or Southern Cameroons; the Cameroonian government regards the movement as an illegal secession and calls the armed groups terrorists. Some Anglophone leaders and civil-society groups seek a return to a federation rather than independence. No state has recognised Ambazonia. The separatist political leadership is divided between the Interim Government, which grew out of the leadership arrested in Nigeria in 2018 and later split into rival factions, and the Ambazonia Governing Council of Lucas Cho Ayaba, whose Ambazonia Defence Forces (ADF) are the best known militia; many local armed groups answer to neither."
  - "Figures are uncertain. The International Crisis Group counted at least 6,000 civilians killed by government forces and separatists by early 2023, a figure cited by Human Rights Watch; at the height of the crisis some 700,000 people were internally displaced and tens of thousands fled to Nigeria. Human rights groups have documented killings, torture and the burning of villages by the security forces, and killings, kidnappings and attacks on schools by separatist groups."
