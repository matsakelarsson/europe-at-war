id: anglophone-crisis
name: Anglophone Crisis
start: "2017-10-01"
end: ongoing
tier: B
summary: "The armed conflict in Cameroon’s two English-speaking regions, the Northwest and Southwest, between the Cameroonian army and separatists who seek an independent state they call Ambazonia. It grew out of protests by lawyers and teachers from October 2016 against the imposition of French-speaking judges and teachers and the long marginalisation of the Anglophone regions, the former British Southern Cameroons, which joined Cameroon in 1961. The government answered with arrests, killings of protesters and a three-month internet shutdown; on 1 October 2017 separatist leaders declared Ambazonia’s independence, and armed groups began attacking soldiers and police. The war has been fought between dozens of separatist militias, which enforce school boycotts and “ghost town” lockdowns and kidnap for ransom, and the army, which has burned villages and killed civilians. A national dialogue in 2019 brought a special status for the two regions but no peace, and mediation by Switzerland and Canada failed. By early 2023 more than 6,000 people had been killed, according to the International Crisis Group, and hundreds of thousands had been displaced. Fighting continued in 2026."
countries: [cm, ng]
sides:
