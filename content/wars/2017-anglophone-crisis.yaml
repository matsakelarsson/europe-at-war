  - title: A war without end
    date: 2021 – November 2026
    when: "2026-04-15"
    borders: "2026-11-27"
    countries: [cm]
    body:
      - "Last updated 27 November 2026. The war became a grinding conflict of ambushes, roadside bombs, kidnappings and army raids, with separatist groups fighting each other and preying on civilians, and the army killing separatist commanders one after another. In January 2023 Canada announced that the government and separatist groups had agreed to talks, but the Cameroonian government denied it had asked for mediation. In September 2024 Norway arrested Lucas Cho Ayaba, the leader of the Ambazonia Governing Council. Paul Biya, aged 92, was declared re-elected in the presidential election of 12 October 2025 with about 54% of the vote amid protests elsewhere in the country, and was sworn in for an eighth term on 6 November."
      - "In 2026 the fighting went on in both regions. Separatists killed 15 civilians at Mbandfung near Ndu in January, and the army killed several separatist commanders during the year. On 19 March the Supreme Court annulled the life sentences of Ayuk Tabe and nine other leaders and ordered a retrial. Separatist groups observed a ceasefire on 15–17 April for the visit of Pope Leo XIV to Bamenda, but clashes resumed within days. Separatists enforced lockdowns for the school year in September and “ghost towns” on 1 October, the anniversary of the declaration; on 28 October suspected separatists killed four civilians at Koshin in Menchum. Ten years after the protests began, no talks were under way. Casualty figures are uncertain, as both sides’ claims are hard to check."
    facts:
      - [Cho Ayaba arrested in Norway, "September 2024"]
      - [Biya sworn in for an eighth term, "6 November 2025"]
      - [Life sentences of the Interim Government leaders annulled, "19 March 2026"]
      - [Papal visit to Bamenda, "April 2026"]
    markers:
