  - title: War in the Northwest and Southwest
    date: November 2017 – 2020
    when: "2018-01-05"
    borders: "2019-10-01"
    countries: [cm, ng]
    body:
      - "In late 2017, after the killing of soldiers and police, Biya promised to crush the separatists, and the army, led by the elite Rapid Intervention Battalion, moved into the two regions. On 5 January 2018 Ayuk Tabe and other leaders of the Interim Government were arrested in Abuja and handed over to Cameroon, where a military court sentenced ten of them to life in prison in August 2019. Dozens of separatist militias, from the Ambazonia Defence Forces to small village groups with names such as the Red Dragons and the Tigers, attacked army posts, enforced the closure of schools and weekly “ghost town” lockdowns, and kidnapped officials, students and travellers. Soldiers burned hundreds of villages, and tens of thousands of people fled into the forest or across the border to Nigeria."
      - "A Major National Dialogue held in Yaoundé from 30 September to 4 October 2019, which the separatists boycotted, led to a law granting the two regions a special status; Swiss-led attempts at mediation in 2019 made little progress. On 14 February 2020 soldiers and allied armed Fulani killed at least 21 civilians, among them 13 children, at Ngarbuh in Ntumbaw near Ndu, by the count of independent reporters; the government at first denied it, then admitted the army’s part, and three soldiers were sentenced to prison in February 2026. On 24 October 2020 gunmen killed seven children at a school in Kumba; the government blamed the separatists, who denied it."
    facts:
      - [Interim Government leaders arrested in Abuja, "5 January 2018"]
      - [Major National Dialogue, "30 September – 4 October 2019"]
      - [Ngarbuh massacre, "14 February 2020"]
      - [Kumba school attack, "24 October 2020"]
