notes:
  - "The battle is part of the wider Moro conflict, told in its own entry, but its leaders rejected both the MILF’s peace process and the older Moro movements; the MILF helped open humanitarian corridors for trapped civilians. Many residents blamed the scale of the destruction on the government’s air strikes as much as on the militants."
  - "Figures are the government’s and are uncertain. Of the 87 civilian deaths it counted, about 40 were from illness in evacuation centres; residents’ groups believe more civilians died in the city, and some 300 people were reported missing. Estimates of the displaced range from about 350,000 for Marawi and the surrounding towns to more than a million counted by some agencies at the height of the crisis."
