steps:
  - title: The raid of 23 May
    date: 2016 – June 2017
    when: "2017-05-23"
    borders: "2017-05-23"
    countries: [ph]
    view:
      center: [124.250, 8.000]
      size: [170, 150]
    body:
      - "Isnilon Hapilon, a leader of Abu Sayyaf from Basilan, pledged allegiance to the Islamic State in 2014 and was recognised by it as its emir in Southeast Asia. He joined forces with the Maute group, founded by the brothers Omar and Abdullah Maute from a wealthy family of Butig in Lanao del Sur, which had fought the army around Butig in 2016 and bombed a night market in Davao in September 2016. On the afternoon of 23 May 2017 soldiers and police raided a house in Marawi to arrest Hapilon. They were met by heavy fire, and within hours several hundred militants, who had been preparing an attack for weeks, spread through the city. They occupied the city hall, the hospital and bridges over the Agus River, freed prisoners from the jail, burned St Mary’s Cathedral and a Protestant college, and took hostages, among them the Catholic vicar-general, Father Teresito Soganub."
      - "Duterte, on a visit to Moscow, declared martial law over the whole of Mindanao that night and flew home. Tens of thousands of residents fled along the road to Iligan in the next days, and almost all the city’s people, most of them Maranao Muslims, were soon living in evacuation centres or with relatives. The militants, some of them foreign fighters from Indonesia, Malaysia, Singapore and the Middle East, dug in among the concrete houses, mosques and tunnels of the commercial heart of the city, using snipers, improvised explosives and hostages as human shields. On 31 May an air strike aimed at them killed ten soldiers."
