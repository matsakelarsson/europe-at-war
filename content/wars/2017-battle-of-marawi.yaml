  - title: Five months of street fighting
    date: June – October 2017
    when: "2017-10-17"
    borders: "2017-10-17"
    countries: [ph]
    view:
      center: [124.250, 8.050]
      size: [150, 130]
    body:
      - "Through the summer the army, marines and police closed in on the militants’ shrinking area east of the Agus River, block by block, supported by air strikes from FA-50 jets and older aircraft, artillery and armoured vehicles. The United States provided surveillance aircraft, drones and intelligence through its special forces, and Australia sent AP-3C Orion surveillance planes; China and Russia donated rifles and ammunition. The army retook the Grand Mosque in August, and Father Soganub escaped in September. Hapilon and Omar Maute were killed on 16 October, Duterte declared Marawi liberated on 17 October, and the last militants were killed on 23 October; a Malaysian leader of the group, Mahmud Ahmad, was believed killed in the last days."
      - "By official figures 168 soldiers and police died and more than 1,400 were wounded; about 978 militants were killed and 87 civilians died, some 40 of them from illness in the camps. More than 350,000 people were displaced, and 24 districts at the centre of the city, the Most Affected Area, were reduced to ruins. Reconstruction was slow, and in 2020 more than 120,000 people were still displaced. A law to compensate the victims was passed in 2022. Congress extended martial law in Mindanao three times, and it lasted until 31 December 2019."
