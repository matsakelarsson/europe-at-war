id: battle-of-marawi
name: Battle of Marawi
start: "2017-05-23"
end: "2017-10-23"
tier: B
summary: "The five-month battle for the city of Marawi in Lanao del Sur, on the southern Philippine island of Mindanao, between the Philippine armed forces and fighters allied to the Islamic State, led by the Maute group and the Abu Sayyaf leader Isnilon Hapilon. A raid to capture Hapilon on 23 May 2017 met far stronger resistance than expected: several hundred fighters, among them foreigners from Indonesia, Malaysia and the Middle East, seized much of the city, took hostages and raised the black flag of the Islamic State, and President Rodrigo Duterte declared martial law over all of Mindanao the same night. Almost the whole population of about 200,000 fled. The army, supported by air strikes and American and Australian surveillance, retook the city street by street; Hapilon and Omar Maute were killed on 16 October, Duterte declared Marawi liberated the next day, and the fighting ended on 23 October. By official figures 168 soldiers and police, 87 civilians and about 978 militants died, and the centre of the city was destroyed. It was the longest urban battle in the Philippines since the Second World War."
