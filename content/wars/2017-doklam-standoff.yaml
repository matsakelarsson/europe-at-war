id: doklam-standoff
name: Doklam standoff
start: "2017-06-16"
end: "2017-08-28"
tier: C
summary: "A 73-day military standoff between India and China on the Doklam plateau, a high pasture claimed by both Bhutan and China near the point where Bhutan, China and the Indian state of Sikkim meet. On 16 June 2017 Chinese troops with road-building equipment began extending a track across the plateau towards the Jampheri ridge, which overlooks the narrow Siliguri corridor linking north-eastern India with the rest of the country. Bhutan protested, and on 18 June some 270 Indian soldiers crossed from their posts at Doka La in Sikkim, with two bulldozers, and stopped the work. Hundreds of troops faced each other a few metres apart for more than two months while China demanded an unconditional Indian withdrawal and its state media warned of war; no shots were fired. On 28 August both sides announced that they had disengaged and the road building stopped. China kept a strong military presence in the northern part of the plateau, where it later built roads, posts and villages."
