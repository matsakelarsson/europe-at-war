notes:
  - "The dispute turns on the Anglo-Chinese convention of 1890, which China says puts the trijunction at Mount Gipmochi, at the southern end of the plateau, while India and Bhutan place it further north at Batang La. China said its road was on Chinese territory and that India, not a party to the dispute, had trespassed; India said the road changed the status quo in violation of agreements between China and Bhutan and threatened its security. Bhutan took part only diplomatically."
