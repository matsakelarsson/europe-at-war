id: ecowas-intervention-in-the-gambia
name: ECOWAS military intervention in the Gambia
start: "2017-01-19"
end: "2017-01-21"
tier: C
summary: "The West African intervention that made President Yahya Jammeh of the Gambia, in power since a coup in 1994, hand over to the winner of the election of 1 December 2016, Adama Barrow. Jammeh first conceded defeat, then on 9 December rejected the result and appealed to the Supreme Court, which had no judges to hear the case. ECOWAS, the African Union and the United Nations backed Barrow; mediation by West African presidents failed, about 45,000 people fled to Senegal, and Jammeh declared a state of emergency. On 19 January 2017 Barrow was sworn in at the Gambian embassy in Dakar, the UN Security Council unanimously backed ECOWAS’s efforts in Resolution 2337, without explicitly authorising force, and the same day Senegalese troops, with Nigerian aircraft and ships and contingents from Ghana and other states, crossed the border in what was first called Operation Restore Democracy. The Gambian army did not resist; after a last mediation by the presidents of Guinea and Mauritania, Jammeh flew into exile on 21 January, first to Guinea and then to Equatorial Guinea. Barrow returned on 26 January. A smaller ECOWAS force, the ECOWAS Mission in the Gambia (ECOMIG), stayed to secure the transition and was still present in 2025; in January 2022 fighters of the Casamance rebel MFDC attacked a Senegalese ECOMIG patrol near the border, killing four soldiers and capturing seven."
