notes:
  - "The insurgents have never published a political programme of their own; their aims are known from their attacks, from Islamic State propaganda and from the testimony of former hostages and fighters. The government and its allies call them terrorists; local people often call them al-Shabaab (Swahili for “the youth”), and the Islamic State has claimed many of their attacks since June 2019."
  - "Mozambique has also used private military companies (Russia’s Wagner Group in 2019–2020 and South Africa’s Dyck Advisory Group in 2020–2021) and local militias. Human rights groups have accused the insurgents of beheadings, abductions of women and children and the burning of villages, and Mozambican government forces of killings, torture and abuses of civilians."
  - "Figures are uncertain. The death toll comes from ACLED’s count of reported events (about 6,570 by May 2026, some 2,760 of them civilians; international organisations cited more than 6,600 in November 2026), and displacement figures from the UN and other international organisations; many returned home after 2021 and new attacks have displaced others since."
