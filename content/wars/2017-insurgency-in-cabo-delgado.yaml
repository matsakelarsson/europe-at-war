id: insurgency-in-cabo-delgado
name: Insurgency in Cabo Delgado
start: "2017-10-05"
end: ongoing
tier: B
summary: "The Islamist insurgency in Mozambique’s northernmost province, Cabo Delgado, waged since October 2017 by the group known locally as al-Shabaab (unrelated to the Somali movement) or Ansar al-Sunna, which has fought since 2019 under the banner of the Islamic State, from 2022 as its Mozambique Province. Rooted in the grievances of young Muslims of the coast, poverty and unemployment in a province rich in rubies and natural gas, and in local religious conflict, the insurgency began with an attack on police stations in Mocímboa da Praia. The insurgents took Mocímboa da Praia in August 2020 and attacked Palma in March 2021, forcing TotalEnergies to halt a $20 billion gas project. Rwanda sent troops in July 2021, followed by a force of the Southern African Development Community (SAMIM), and together with Mozambican forces they retook Mocímboa da Praia in August 2021. The insurgents spread into Niassa and Nampula and fought on in smaller groups; SAMIM left in 2024, and Rwanda, with several thousand troops (over 6,300 by its own count in 2026), became the main foreign force. By late 2026 more than 6,600 people had been killed and about 1.3 million displaced."
countries: [mz, rw, tz, za]
sides:
