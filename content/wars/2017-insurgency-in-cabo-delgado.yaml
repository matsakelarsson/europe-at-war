  - title: Palma and the foreign forces
    date: 2021–2024
    when: "2021-03-24"
    borders: "2021-08-08"
    countries: [mz, rw, za, tz]
    body:
      - "On 24 March 2021 insurgents attacked Palma, the town next to the Afungi peninsula where TotalEnergies was building a $20 billion liquefied natural gas plant. They held the town for days, killing residents and workers; foreign and local contractors were trapped in a hotel and many died trying to escape. Tens of thousands fled. Government forces retook the ruined town in early April, but TotalEnergies withdrew its staff and declared force majeure in April 2021, halting the project."
      - "In July 2021 Rwanda sent about 1,000 soldiers and police at Mozambique’s request, and the Southern African Development Community deployed its Mission in Mozambique (SAMIM), with South African, Botswanan, Tanzanian and other troops. Rwandan and Mozambican forces retook Mocímboa da Praia on 8 August 2021, the insurgents having mostly left it. The insurgents broke into small groups and moved south and west: from late 2021 they attacked villages in Niassa, and in 2022 in Nampula province, where an Italian nun was killed at the Chipene mission on 6 September 2022. In May 2022 the Islamic State made Mozambique a province of its own."
      - "Fighting went on in Macomia, Muidumbe, Ancuabe and Chiúre. In early 2024 the insurgents occupied Quissanga and the island of Quirimba for weeks and attacked Macomia town in May. SADC, short of money and turning to eastern Congo, withdrew SAMIM; its mission formally ended in July 2024. Rwanda’s force, which had grown to several thousand, stayed, together with Tanzanian troops in the border districts."
    facts:
