steps:
  - title: Mocímboa da Praia
    date: 2017–2020
    when: "2017-10-05"
    borders: "2020-08-12"
    countries: [mz, tz]
    body:
      - "Cabo Delgado is one of Mozambique’s poorest provinces. Its coast is home mainly to Muslim Mwani and Makua people, while the Makonde of the Mueda plateau, mostly Christian, were the backbone of FRELIMO in the independence war and hold much of the province’s power. In the 2010s the discovery of vast natural gas fields offshore and of ruby deposits at Montepuez brought foreign companies and wealth that few local people shared; artisanal miners and fishermen were pushed off their land and waters. A movement of young preachers, influenced by the Kenyan cleric Aboud Rogo and his followers, broke with the established Muslim leaders, rejected the state’s schools and authority and recruited among unemployed young men, with links to Tanzania and the wider Swahili coast."
      - "On 5 October 2017 about thirty armed members of the group attacked three police stations in Mocímboa da Praia. Attacks on villages followed, with beheadings, and spread to Palma, Macomia, Nangade and Quissanga. From June 2019 the Islamic State claimed attacks in Mozambique as part of its Central Africa Province. The government, which at first played down the insurgency, hired Russia’s Wagner Group in 2019, which withdrew after losses, and then South Africa’s Dyck Advisory Group, whose helicopters were accused of firing on civilians."
      - "In 2020 the insurgents grew bolder. They briefly seized Mocímboa da Praia in March and Quissanga and Macomia in the following months, and on 11 August 2020, after a campaign in which they killed many soldiers, they took Mocímboa da Praia and its port, which they held for a year. In September they occupied islands off the coast."
    facts:
      - [First attack, "5 October 2017, Mocímboa da Praia"]
      - [First Islamic State claim, "June 2019"]
      - [Mocímboa da Praia taken, "11 August 2020"]
