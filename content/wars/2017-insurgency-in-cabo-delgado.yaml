  - title: A war of attrition
    date: 2025–2026
    when: "2026-11-27"
    borders: "2026-11-27"
    countries: [mz, rw, tz]
    body:
      - "Last updated 27 November 2026. The insurgency, by most accounts a few hundred fighters, has become a war of ambushes, raids and kidnappings in the forests and villages between the coast and the mining districts. In 2025 the insurgents attacked army posts in Muidumbe and Macomia, raided hunting camps in the Niassa reserve and took hostages for ransom; in February 2026 there was heavy fighting around the Catupa forest north of Macomia, where the insurgents had seized army positions and Rwandan reinforcements joined the Mozambican army, and from May more than 20,000 people fled attacks in Ancuabe district, according to the International Organization for Migration. In July 2026 President Daniel Chapo announced that the army’s northern operational command would move from Pemba to Mocímboa da Praia, where the Rwandan force has its headquarters."
      - "TotalEnergies lifted its force majeure in November 2025; by January 2026 work at Afungi had fully resumed with more than 4,000 workers, some 10,000 by September, and first gas is planned for 2029. Rwanda, whose force had grown to over 6,300 by its own count, threatened on 14 March 2026 to withdraw unless sustainable funding was found, after reports that the European Union would not renew its support beyond May and after the United States sanctioned the Rwandan army on 2 March over its support for the M23 rebels in Congo; on 19 May Rwanda said Mozambique had secured the money for it to stay."
      - "In October 2026 the insurgents were active in nine districts of Cabo Delgado, according to ACLED, and the attacks went on into November: at least 19 people were killed in attacks on villages in Mueda and Muidumbe in the last ten days of October, fishermen were beheaded, and in the week to 23 November six people were killed and others abducted around the mining areas of Montepuez and Ancuabe. Farmers along the Messalo river abandoned their fields. International organisations count more than 6,600 dead and about 1.3 million displaced since 2017. Reports from the area are hard to verify, and the figures are preliminary."
    facts:
      - [LNG force majeure lifted, "November 2025; work fully resumed by January 2026"]
      - [Rwandan troops, "over 6,300 (Rwandan government, April 2026)"]
      - [Dead since 2017, "more than 6,600 (late 2026)"]
      - [Displaced, "about 1.3 million since 2017"]
