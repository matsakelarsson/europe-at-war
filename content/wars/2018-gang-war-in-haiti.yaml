  - title: The Gang Suppression Force
    date: 2025–2026
    when: "2026-11-20"
    borders: "2026-11-20"
    countries: [ht, sv, ke]
    view:
      center: [-72.38, 18.85]
      size: [110, 100]
    body:
      - "Last updated 27 November 2026. In 2025 the gangs took Mirebalais in the Centre on 31 March, freeing some 500 prisoners, and attacked Kenscoff in the hills above the capital; the UN estimated that they controlled about 90 per cent of Port-au-Prince. From March 2025 a task force of private contractors from the American firm Vectus Global, hired by Prime Minister Alix Didier Fils-Aimé’s office, attacked gang leaders with explosive drones, killing many gang members and also civilians. The United States designated Viv Ansanm and Gran Grif as terrorist organisations in May. On 30 September 2025 the UN Security Council turned the MSS into a Gang Suppression Force (GSF) of up to 5,550 personnel, with a UN support office. The United Nations counted 5,915 people killed in 2025."
      - "The Transitional Presidential Council’s mandate ended on 7 February 2026, leaving Fils-Aimé to govern alone with American backing. Chadian troops, the first of the GSF’s new contingents, arrived on 1 April, and the last Kenyan police went home that month; Sri Lanka, Mongolia and others followed, but by November the force had only about 2,000 personnel. Gang violence spread through the lower Artibonite, where the GSF set up a base, and rural areas; on 23–24 August gangs killed at least 47 people in Kenscoff. From July to early October 2026 the UN recorded 1,123 people killed, and security operations caused about half of all deaths and injuries. In early October the elections planned for 13 December were postponed indefinitely."
      - "On 18 October four Salvadoran service members of the GSF went missing after a gang ambush at Santo, near Croix-des-Bouquets, a stronghold of the 400 Mawozo gang. President Nayib Bukele sent some 2,500 soldiers to Haiti under a separate agreement that Haiti approved on 17 November, and they raided the homes of gang leaders. On 19–20 November the Haitian army and police, with the contractors’ task force, launched the first major operation in five years to retake Martissant and reopen the road south; the police said 54 suspected gang members were killed in two days. UN experts reported infighting within Viv Ansanm, but gangs still held most of the capital, and nearly 1.5 million Haitians, more than one in ten, were displaced."
    facts:
      - [Gang Suppression Force authorised, "30 September 2025 (Resolution 2793)"]
      - [Transitional Presidential Council’s mandate ends, "7 February 2026"]
      - [Killed, July to early October 2026, "1,123 (UN)"]
      - [Displaced, "nearly 1.5 million (UN, October 2026)"]
