steps:
  - title: From La Saline to the president’s murder
    date: 2018–2022
    when: "2021-07-07"
    borders: "2021-07-07"
    countries: [ht]
    view:
      center: [-72.31, 18.54]
      size: [55, 45]
    body:
      - "Armed groups in the poor districts of Port-au-Prince had served politicians since the Duvalier and Aristide years, and the UN peacekeeping mission that had fought the gangs of Cité Soleil left in 2017. In 2018 and 2019 mass protests over fuel prices and the theft of PetroCaribe oil funds paralysed the country and demanded the resignation of President Jovenel Moïse. On 13 November 2018 gunmen attacked La Saline, a slum that had been a centre of the protests, killing at least 26 people according to the UN and 71 according to Haitian human rights groups; investigators accused a police officer, Jimmy Chérizier, and government officials of taking part. In June 2020 Chérizier, known as “Barbecue”, united nine gangs in the G9 an Fanmi e Alye, widely seen as close to the ruling party, and rival gangs formed the G-Pèp around Gabriel Jean-Pierre of Brooklyn in Cité Soleil. With no elections held, parliament’s term expired in January 2020 and Moïse governed by decree."
      - "In June 2021 gangs of Grand-Ravine and Village-de-Dieu fought their way into Martissant, cutting the main road from the capital to the south. On the night of 7 July 2021 a commando of mostly Colombian former soldiers killed Moïse at his home in Pèlerin, above Pétion-Ville; Ariel Henry, whom Moïse had named prime minister days before, took power. In October 2021 the 400 Mawozo gang kidnapped 17 American and Canadian missionaries near Croix-des-Bouquets, and kidnappings for ransom reached record levels. When Henry ended fuel subsidies in September 2022 the G9 blockaded the Varreux fuel terminal for nearly two months, cutting off fuel and water as cholera returned; on 7 October 2022 Henry asked for an international armed force."
    facts:
      - [La Saline massacre, "13 November 2018"]
      - [G9 formed, "June 2020"]
      - [Assassination of Jovenel Moïse, "7 July 2021"]
      - [Blockade of the Varreux terminal, "September – November 2022"]
