  - title: Viv Ansanm and the Kenyan-led mission
    date: 2023–2024
    when: "2024-03-02"
    borders: "2024-03-02"
    countries: [ht, ke]
    view:
      center: [-72.46, 18.85]
      size: [100, 90]
    body:
      - "Gangs extended their hold over the capital and the roads out of it, and in April 2023 residents began to lynch suspected gang members in a vigilante movement called Bwa Kale. The United Nations counted more than 4,700 people killed in 2023. On 2 October 2023 the Security Council authorised a Multinational Security Support mission (MSS), led by Kenya, which had offered 1,000 police. While Henry was in Nairobi to settle the deployment, on 29 February 2024 the G9 and G-Pèp joined forces as Viv Ansanm (“Living Together”) and attacked police stations, the airport and the National Palace. On 2–3 March they stormed the National Penitentiary and the Croix-des-Bouquets prison, freeing more than 4,700 inmates. The airport closed, and Henry, unable to return, promised on 11 March to resign; on 25 April a nine-member Transitional Presidential Council took power."
      - "The first 400 Kenyan police landed on 25 June 2024, followed by smaller contingents from Jamaica, the Bahamas, Belize, Guatemala and El Salvador, but the mission never reached half its planned 2,500 and was short of money and equipment. The gangs pushed into the Artibonite valley and the Centre: on 3 October 2024 the Gran Grif gang of Luckson Elan killed at least 115 people at Pont-Sondé, and on 6–11 December gang members of Wharf Jérémie in Cité Soleil killed at least 207 people, many of them elderly residents their leader accused of witchcraft. The United Nations counted 5,601 people killed in 2024."
    facts:
