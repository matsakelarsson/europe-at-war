id: gang-war-in-haiti
name: Gang war in Haiti
start: "2018-11-13"
end: ongoing
tier: B
summary: "The armed conflict between Haiti’s gangs and the Haitian state and the foreign forces sent to help it, which has left most of Port-au-Prince and large parts of the countryside under gang control. Armed groups tied to politicians and businessmen had long held the capital’s poor districts; from 2018, as protests against corruption shook President Jovenel Moïse’s government, they fought over territory and attacked residents, beginning with the massacre at La Saline in November 2018. In 2020 the former police officer Jimmy Chérizier, “Barbecue”, united nine gangs as the G9, opposed by the rival G-Pèp. Moïse was assassinated in July 2021, and under Prime Minister Ariel Henry, who governed without elections, kidnappings, massacres and blockades multiplied. In February and March 2024 the G9 and G-Pèp joined forces as Viv Ansanm, stormed the two largest prisons, closed the airport and forced Henry to resign; a Transitional Presidential Council took over, and from June 2024 a Kenyan-led Multinational Security Support mission (MSS), authorised by the United Nations, arrived to help the police. The gangs spread into the Artibonite and Centre departments, where the Gran Grif gang killed more than 100 people at Pont-Sondé in October 2024. In September 2025 the UN Security Council turned the under-strength mission into a larger Gang Suppression Force (GSF). The United Nations counted more than 4,700 people killed in 2023, 5,601 in 2024 and 5,915 in 2025, and nearly 1.5 million Haitians had been driven from their homes by 2026. In late 2026 the GSF, the police, the small Haitian army, private contractors with drones and some 2,500 Salvadoran troops were fighting to retake districts of the capital, while elections planned for December 2026 were postponed indefinitely."
countries: [ht, ke, sv]
