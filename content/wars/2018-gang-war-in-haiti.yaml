    success: Gang success
notes:
  - "Figures come from the United Nations Integrated Office in Haiti (BINUH), the UN human rights office and the International Organization for Migration, and are minimums; many killings in gang-held areas go unreported. Gangs, self-defence groups and the Bwa Kale vigilante movement, the police and foreign forces have all killed civilians: the UN found that security forces, including drone strikes by a task force of private contractors working for the prime minister’s office, caused most of the deaths and injuries recorded in the first quarter of 2026 and about half of those from July to October 2026."
  - "UN experts and others have accused politicians and businessmen of arming and paying gangs, and several former officials have been sanctioned by the United States, Canada and the UN. The United States designated Viv Ansanm and Gran Grif as foreign terrorist organisations in May 2025."
