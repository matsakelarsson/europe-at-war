id: ola-insurgency
name: Oromo Liberation Army insurgency
start: "2018"
end: ongoing
tier: C
summary: "Last updated 27 November 2026. The armed struggle of the Oromo Liberation Army (OLA) against the Ethiopian government in Oromia, Ethiopia’s largest region. The OLA began as the armed wing of the Oromo Liberation Front (OLF), founded in 1973, which had fought the Derg and left the transitional government in 1992. When Abiy Ahmed became prime minister in 2018 the OLF returned from exile under a peace deal, but many of its fighters, led by Kumsa Diriba (Jaal Marroo), refused to disarm and broke with the party in 2019. The insurgency grew in western Oromia (the Wollega zones) and in Guji and Borana in the south, and spread when federal troops went north to the Tigray War in 2020. Ethiopia’s parliament designated the OLA a terrorist organisation in May 2021; the government calls it “Shene”. In 2021 the OLA allied with the TPLF, and at the end of October 2021 its fighters briefly entered Kemise, on the main road to Addis Ababa, as Tigrayan forces advanced south. All sides have been accused of grave abuses: armed men killed scores of Amhara civilians at Gida Kiremu in 2021 and hundreds at Gimbi in June 2022, attacks the OLA denied and blamed on government-backed militias; government forces and Amhara militias killed Oromo civilians, and drone strikes and mass arrests hit Oromo villages; Amnesty International reported in March 2026 on sexual violence, summary killings and torture by OLA fighters. Talks in Tanzania in April and November 2023 failed, but in December 2024 a breakaway faction under Sanyi Nagassa made peace with the Oromia regional government and clashes declined in 2025. Since September 2026 the OLA has been part of a coalition of seven armed groups with the TPLF and the Amhara Fano National Movement, the Ethiopian Peoples’ Forces Coalition for Survival (EPFAS), which aims to remove Abiy Ahmed’s government, though the OLA calls its role a “procedural consensus”. Fighting continues in western and southern Oromia, where the OLA is strongest in the countryside of the Wollega zones and the south. Reports from Oromia are hard to verify: the region is largely closed to journalists and communications are often cut."
