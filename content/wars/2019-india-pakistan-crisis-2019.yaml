id: india-pakistan-crisis-2019
name: India–Pakistan crisis of 2019
start: "2019-02-14"
end: "2019-03-01"
tier: C
summary: "A brief military crisis between India and Pakistan, the first in which the two nuclear-armed states carried out air strikes on each other’s territory since 1971. On 14 February 2019 a young Kashmiri suicide bomber drove a car full of explosives into a convoy of the Central Reserve Police Force at Lethpora near Pulwama, killing 40 policemen; Jaish-e-Mohammed (JeM), a group based in Pakistan, claimed the attack. India blamed Pakistan, which denied involvement. On 26 February Indian Mirage 2000 jets bombed a site near Balakot in Khyber Pakhtunkhwa that India said was a large JeM training camp, claiming many militants killed; Pakistan said the bombs fell on empty forest, and satellite images examined by independent analysts showed the buildings still standing. The next day Pakistani aircraft struck open ground near Indian military sites in Jammu and Kashmir, and in the air battle that followed an Indian MiG-21 was shot down and its pilot, Wing Commander Abhinandan Varthaman, captured. India said he had shot down a Pakistani F-16, which Pakistan denied. The same day an Indian Mi-17 helicopter was brought down by an Indian missile over Budgam, killing six airmen and a civilian on the ground. Pakistan released the pilot on 1 March, and the crisis eased, although shelling across the Line of Control went on for weeks."
