notes:
  - "The results of the air strikes remain disputed: India maintains that the Balakot strike killed a large number of militants and that a Pakistani F-16 was shot down; Pakistan says no one was killed at Balakot and no F-16 was lost, and a count of Pakistan’s F-16s by US officials reported by Foreign Policy magazine found none missing. Six months later, on 5 August 2019, India revoked the special status of Jammu and Kashmir."
