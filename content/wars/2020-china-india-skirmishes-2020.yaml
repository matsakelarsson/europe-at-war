steps:
  - title: Galwan
    date: May – June 2020
    when: "2020-06-15"
    borders: "2020-06-15"
    countries: [in, cn]
    body:
      - "In April and May 2020, after a large exercise in Tibet, Chinese troops moved forward at several points in eastern Ladakh where the two sides’ claims overlap: in the Galwan valley, at Gogra and Hot Springs, in the Depsang plains and on the north bank of the Pangong lake, where they occupied the ridges known as Fingers 4 to 8 and blocked Indian patrols. On 5–6 May hundreds of soldiers brawled at the Pangong lake, and on 9 May at Naku La in Sikkim. India saw the moves as a reaction to its building of roads and airstrips near the border, among them the road to its northernmost airfield at Daulat Beg Oldi, which runs near the Galwan valley; China said Indian troops had crossed into its territory."
      - "Commanders agreed on 6 June to pull back, but on the evening of 15 June a dispute over a Chinese post near Patrol Point 14 in the Galwan valley turned into the deadliest fight on the border since 1967. Soldiers fought for hours in the dark with stones, clubs and rods wrapped in barbed wire, and some fell or were pushed into the freezing river. Twenty Indian soldiers, among them their commanding officer, Colonel B. Santosh Babu, were killed, and ten were held by the Chinese for some days; China acknowledged in February 2021 that four of its soldiers had died. Anti-Chinese protests followed in India, which banned TikTok and dozens of other Chinese apps on 29 June."
    facts:
      - [Brawl at the Pangong lake, "5–6 May 2020"]
      - [Galwan clash, "15 June 2020"]
      - [Dead in the Galwan clash, "20 Indian, 4 Chinese (official)"]
