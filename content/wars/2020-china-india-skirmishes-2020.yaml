id: china-india-skirmishes-2020
name: China–India border clashes of 2020–2021
start: "2020-05-05"
end: "2021-02-21"
tier: B
summary: "A military standoff along the Line of Actual Control (LAC), the undemarcated border between India and China in the Himalaya, in which soldiers of the two countries died in combat for the first time since 1975. In May 2020 Chinese troops moved into several areas in eastern Ladakh that both sides claimed and patrolled, and brawls broke out at the Pangong lake and in Sikkim. On the night of 15 June, in the Galwan valley, soldiers fought for hours with clubs, stones and rocks, since the two sides had agreed not to use firearms near the border; 20 Indian soldiers were killed, and China later acknowledged four dead. Both countries moved tens of thousands of troops, tanks and aircraft to the high plateau, India banned Chinese apps and curbed Chinese investment, and in late August Indian troops seized heights south of the Pangong lake, after which shots were fired for the first time in decades. Talks between corps commanders led to a pull-back from the Pangong area in February 2021, and from other friction points over the next years, with buffer zones in which neither side patrols."
countries: [in, cn]
sides:
  - id: in
    name: India
    polities: [india]
    ink: orange
    moves: Indian moves
    success: Indian success
  - id: cn
    name: China
    polities: [china]
    ink: red
    moves: Chinese moves
    success: Chinese success
notes:
  - "Each side accused the other of crossing the LAC and starting the violence. China acknowledged four dead in the Galwan clash only in February 2021; some reports have claimed higher Chinese losses, which China denies. The two sides do not agree on where the LAC runs, and neither publishes a map of its claim line; the Chinese positions shown are approximate."
  - "Disengagement followed at Gogra in August 2021 and at Hot Springs in September 2022, and in October 2024 an agreement restored patrolling in Depsang and Demchok. A separate clash at Yangtse in Arunachal Pradesh on 9 December 2022 left soldiers injured on both sides."
