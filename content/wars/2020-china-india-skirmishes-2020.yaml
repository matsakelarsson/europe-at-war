  - title: The Kailash range and disengagement
    date: August 2020 – February 2021
    when: "2020-08-30"
    borders: "2021-02-21"
    countries: [in, cn]
    body:
      - "Talks stalled through the summer while both armies brought up some 50,000 troops each, with tanks, artillery and fighter aircraft, and prepared to spend the winter at 4,000–5,000 metres. On the night of 29–30 August Indian troops, among them Tibetan soldiers of the Special Frontier Force, occupied heights of the Kailash range on the south bank of the Pangong lake, around Rezang La and Rechin La, overlooking Chinese positions at Moldo. China accused India of crossing the LAC, and in early September both sides fired warning shots, the first on the border since 1975. On 10 September the two foreign ministers, meeting in Moscow, agreed that troops should disengage."
      - "After nine rounds of talks between corps commanders, the two sides began to pull back from both banks of the Pangong lake on 10 February 2021: Chinese troops withdrew east of Finger 8 and Indian troops to their base near Finger 3, and India gave up the Kailash heights; the area between became a zone in which neither side patrols. The pull-back was completed in about ten days. Disengagement from the other friction points took years, and both armies kept large forces near the LAC; in October 2024 an agreement on patrolling in Depsang and Demchok was followed by a meeting between Narendra Modi and Xi Jinping, and relations began to improve."
    facts:
