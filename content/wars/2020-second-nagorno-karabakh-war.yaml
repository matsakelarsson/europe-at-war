steps:
  - title: The drone war in the south
    date: 27 September – 7 November 2020
    when: "2020-09-27"
    borders: "2020-11-07"
    countries: [az, am]
    body:
      - Talks under the OSCE Minsk Group had brought no settlement since 1994, and the fortified ceasefire line had flared up several times, most seriously in April 2016. On 27 September 2020 heavy fighting broke out along the whole line. Each side blamed the other, but Azerbaijan, with strong political and military backing from Turkey, quickly went over to a large offensive. Turkish Bayraktar TB2 drones and Israeli-made loitering munitions destroyed Armenian air defences, tanks and artillery, and Azerbaijan published the videos. There were reports, denied by Azerbaijan and Turkey, that Syrian fighters had been recruited for the war.
      - The main advance came in the open country of the south, along the Iranian border. Azerbaijani forces announced the capture of Jabrayil on 9 October, Fuzuli on 17 October, Zangilan on 20 October and Qubadli on 25 October, fought their way into Hadrut, and then turned north through wooded hills towards Shusha and the Lachin road. Elsewhere the front hardly moved. Both sides shelled towns. Stepanakert was hit repeatedly, including with cluster munitions, and Armenian missile strikes on Ganja and a cluster attack on Barda killed dozens of Azerbaijani civilians. Three humanitarian ceasefires in October broke down within hours.
    facts:
      - [Start of the war, "27 September 2020"]
      - [Azerbaijani gains in the south, "Jabrayil, Fuzuli, Zangilan, Qubadli and Hadrut, October 2020"]
      - [Humanitarian ceasefires, "10, 17 and 26 October, all broken"]
