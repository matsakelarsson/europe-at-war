  - title: Shusha, the ceasefire and the end of Artsakh
    date: November 2020 – September 2023
    when: "2020-11-08"
    borders: "2020-12-01"
    countries: [az, am]
    body:
      - Azerbaijani troops climbed through the forests below Shusha and took the town on 8 November, putting the road from Stepanakert to Armenia within range. On the night of 9–10 November Ilham Aliyev, Nikol Pashinyan and Vladimir Putin signed a statement ending the war. Armenia agreed to hand back the Agdam, Kalbajar and Lachin districts by 1 December, and about 2,000 Russian peacekeepers deployed along the new line and the Lachin corridor. About 2,900 Azerbaijani and 3,800 Armenian soldiers had been killed, and about 100 civilians on each side. Crowds in Yerevan denounced the agreement as a capitulation.
      - The rest of Karabakh stayed under its Armenian authorities, linked to Armenia only by the corridor. In December 2022 Azerbaijani protesters presented as environmental activists blocked it, and in April 2023 Azerbaijan set up a checkpoint, causing severe shortages of food, fuel and medicine. On 19 September 2023 Azerbaijan attacked, and the next day the Karabakh forces agreed to disarm. Within a week more than 100,000 people, nearly the whole Armenian population, fled to Armenia, and a fuel depot explosion near Stepanakert killed more than 170 of them. On 28 September the Artsakh president signed a decree dissolving the republic from 1 January 2024.
    facts:
      - [Fall of Shusha, "8 November 2020"]
      - [Ceasefire statement, "9–10 November 2020"]
      - [Armenians who fled in September 2023, "more than 100,000"]
