id: second-nagorno-karabakh-war
name: Second Nagorno-Karabakh War
start: "2020-09-27"
end: "2020-11-10"
tier: B
summary: A 44-day war in which Azerbaijan, with strong Turkish support, retook the districts around Nagorno-Karabakh that Armenian forces had held since 1994, along with Hadrut and Shusha. A ceasefire brokered by Russia on 9–10 November 2020 returned further districts to Azerbaijan and brought in Russian peacekeepers; in September 2023 an Azerbaijani offensive ended the Republic of Artsakh, and almost all of Karabakh’s Armenians fled to Armenia.
countries: [az, am]
