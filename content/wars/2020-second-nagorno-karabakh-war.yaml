    success: Azerbaijani success
  - id: arm
    name: Armenia and the Republic of Artsakh
    polities: [armenia, republic-of-artsakh]
    ink: orange
    moves: Armenian moves
    success: Armenian success
notes:
  - Nagorno-Karabakh and the surrounding districts are shown as part of Azerbaijan on the map, as they are internationally recognised. Areas of control are drawn approximately.
  - Many places have both Armenian and Azerbaijani names, such as Stepanakert (Khankendi) and Shusha (Shushi). The more common English forms are used here.
  - Each side played down its own losses and exaggerated the other’s; the figures given are those the two governments published after the war.
