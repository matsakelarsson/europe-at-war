  - title: Operation Alula and the return to Mekelle
    date: June – July 2021
    when: "2021-06-28"
    borders: "2021-06-28"
    countries: [et, er]
    body:
      - "On 18 June 2021, as Ethiopia held its delayed national election elsewhere, the Tigray Defense Forces launched an offensive they named after Ras Alula, the nineteenth-century Tigrayan general. They routed several federal divisions in central Tigray and took thousands of prisoners, whom they later marched through the streets of Mekelle. On 22 June an air strike on the crowded market at Togoga, west of Mekelle, killed 64 people. On 28 June federal forces and the interim administration abandoned Mekelle, the government declared a unilateral ceasefire, and Tigrayan forces entered the city to cheering crowds. Eritrean troops pulled back towards the border."
      - "The federal government cut Tigray off. Electricity, telephones, internet, banking and fuel were stopped, and aid convoys were held up on the only road in from Afar; UN officials described a de facto blockade, and a UN commission later found reasonable grounds to believe that the government had used starvation as a method of war. Amhara forces kept Western Tigray, cutting Tigray off from Sudan."
    facts:
      - [Operation Alula begins, "18 June 2021"]
      - [Togoga air strike, "22 June 2021, 64 killed"]
      - [Tigrayan forces retake Mekelle, "28 June 2021"]
