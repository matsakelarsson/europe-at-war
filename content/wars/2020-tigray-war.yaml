id: tigray-war
name: Tigray War
start: "2020-11-03"
end: "2022-11-02"
tier: A
summary: "A war in northern Ethiopia between the federal government of Prime Minister Abiy Ahmed, allied with Eritrea and the forces of the Amhara region, and the Tigray People’s Liberation Front (TPLF), which had dominated Ethiopia’s government until 2018 and still ruled the Tigray region. It began on the night of 3–4 November 2020 when Tigrayan forces seized the bases of the federal army’s Northern Command. Federal, Amhara and Eritrean forces took Mekelle within a month, and Amhara forces occupied Western Tigray, from which Tigrayans were driven out. Massacres, mass rape and the looting and blockade of the region followed, and by mid-2021 hundreds of thousands of people in Tigray faced famine. In June 2021 the Tigray Defense Forces retook Mekelle and then advanced deep into the Amhara and Afar regions, coming within about 200 km of Addis Ababa in November, before a government counteroffensive built on drones drove them back. After a truce in 2022 and a last offensive by Ethiopian and Eritrean forces, the African Union brokered a cessation of hostilities signed in Pretoria on 2 November 2022. Estimates of the dead, most of them civilians who died of violence, hunger and lack of care, range from about 100,000 to 600,000."
