  - title: Occupation, massacres and famine
    date: December 2020 – June 2021
    when: "2021-03-23"
    borders: "2021-03-23"
    countries: [et, er]
    body:
      - "The war did not end with Mekelle. The TPLF’s forces, now the Tigray Defense Forces (TDF), fought a guerrilla war from the mountains of central Tigray, joined by thousands of young Tigrayans angered by what they had seen. Federal, Eritrean and Amhara forces carried out massacres in villages and towns; videos and survivors’ accounts documented killings at Mahbere Dego, Bora and many other places. Rape and sexual slavery were used on a vast scale, against girls and women of all ages, by soldiers of all three forces, according to UN investigators and human rights groups. On 23 March 2021 Abiy acknowledged in parliament that Eritrean troops were in Tigray."
      - "In Western Tigray the new Amhara administration drove out the Tigrayan population. Human Rights Watch and Amnesty International concluded in April 2022 that a campaign of ethnic cleansing had expelled several hundred thousand Tigrayans, with killings, detention and the burning of homes; the Norwegian Refugee Council estimated that 140,000–185,000 people reached Shire in two weeks of March 2021 alone. Factories, hospitals, schools and crops were looted or destroyed across Tigray, and aid was blocked. In June 2021 the UN’s famine monitors estimated that more than 350,000 people in Tigray were in famine conditions, the most anywhere in the world in a decade."
    facts:
      - [Eritrean troops acknowledged, "23 March 2021"]
      - [People in famine conditions, "over 350,000 (IPC, June 2021)"]
      - [Refugees in Sudan, "about 60,000–70,000"]
