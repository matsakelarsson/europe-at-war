  - title: The advance into Amhara and Afar
    date: July – November 2021
    when: "2021-10-30"
    borders: "2021-11-15"
    countries: [et]
    body:
      - "In July 2021 the Tigray Defense Forces crossed into the Amhara and Afar regions, saying they aimed to break the blockade and force the government to negotiate. They took Lalibela, with its rock-hewn churches, on 5 August and Woldia on 12 August, and pushed east into Afar towards the road and railway to Djibouti, Ethiopia’s lifeline, where Afar forces and the army stopped them near Mille. The fighting was brutal on both sides: Tigrayan forces were accused of killing civilians at Chenna and Kobo and of rape in Nifas Mewcha and other towns, and shelling killed over a hundred displaced people at Galikoma in Afar."
      - "On 30 October–1 November the TDF took Dessie and Kombolcha, the main towns of Wollo, and moved south along the main road towards Addis Ababa, reaching Debre Sina and Shewa Robit, some 200 km from the capital, in late November. The OLA, now allied with the TPLF, was active along the same road near Kemise. On 2 November the government declared a state of emergency and called on citizens to take up arms, and thousands of Tigrayans in Addis Ababa were detained. On 5 November the TPLF, the OLA and seven smaller groups formed the United Front of Ethiopian Federalist and Confederalist Forces in Washington. Several foreign governments told their citizens to leave Ethiopia."
    facts:
      - [Lalibela taken, "5 August 2021"]
      - [Dessie and Kombolcha taken, "30 October – 1 November 2021"]
      - [State of emergency, "2 November 2021"]
      - [United Front formed, "5 November 2021"]
