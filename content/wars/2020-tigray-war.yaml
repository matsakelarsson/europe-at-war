steps:
  - title: The road to war
    date: 2018 – 4 November 2020
    when: "2020-11-04"
    borders: "2020-11-04"
    countries: [et, er]
    body:
      - "For 27 years the TPLF had led the EPRDF coalition that ruled Ethiopia after the fall of the Derg. Protests in Oromia and Amhara from 2015 brought Abiy Ahmed, an Oromo, to power in April 2018. He freed political prisoners, made peace with Eritrea, whose government saw the TPLF as its enemy, and removed TPLF figures from the security services and the government, some of whom were charged with crimes. In December 2019 he merged the coalition’s parties into a single Prosperity Party; the TPLF refused to join and withdrew to Mekelle."
      - "When the federal government postponed the elections due in August 2020 because of COVID-19, the TPLF held its own regional election in Tigray on 9 September 2020. Addis Ababa declared it illegal and cut funding to the regional government, and the TPLF declared the federal government unconstitutional once its term expired in October. Both sides built up forces; Tigray had large regional special forces and militias, and the Northern Command, the strongest part of the federal army, was based in Tigray facing Eritrea."
      - "On the night of 3–4 November 2020 Tigrayan forces, joined by many Tigrayan soldiers in the army, attacked and seized the Northern Command’s headquarters in Mekelle and its bases across the region, taking much of its heavy weaponry; soldiers were killed and thousands captured. Abiy announced a military operation the same day, and the government cut telephone and internet links to Tigray."
    facts:
      - [Prosperity Party founded, "1 December 2019"]
      - [Tigray regional election, "9 September 2020"]
      - [Attack on the Northern Command, "night of 3–4 November 2020"]
