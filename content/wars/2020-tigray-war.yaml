  - title: The fall of Mekelle
    date: November 2020
    when: "2020-11-28"
    borders: "2020-11-28"
    countries: [et, er]
    body:
      - "Federal forces advanced from the south through Raya and Alamata and from the west across the Tekeze, while Amhara special forces and Fano militias attacked Western Tigray from the south, taking Humera and the farmlands of Welkait, which the Amhara had long claimed. Eritrean troops crossed the border in the north and the west, a fact both governments denied for months. Tigrayan forces fired rockets at the airports of Bahir Dar and Gondar and at Asmara. On 9–10 November, in the town of Mai Kadra in Western Tigray, some 600 civilians, most of them Amhara seasonal labourers, were killed, according to the Ethiopian Human Rights Commission by a Tigrayan youth group and local militia; Tigrayans in the town were then killed in reprisals."
      - "Shire, Axum and Adigrat fell in the second half of November. In Axum, on 28–29 November, Eritrean soldiers killed hundreds of civilians, most of them men and boys, in house-to-house searches; estimates range from about 100 to 800. On 28 November federal forces entered Mekelle after shelling parts of the city, and Abiy declared the operation completed. The TPLF’s leaders and forces withdrew into the mountains, and tens of thousands of Tigrayans fled across the Tekeze into Sudan."
