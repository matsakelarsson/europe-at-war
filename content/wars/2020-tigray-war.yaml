  - title: An unfinished peace
    date: 2023–2026
    when: "2025-03"
    borders: "2026-10-12"
    countries: [et, er]
    body:
      - "The Pretoria agreement stopped the fighting in Tigray but left its hardest questions open. Western Tigray stayed under Amhara administration, and hundreds of thousands of Tigrayans displaced from it could not go home; Eritrean troops remained in parts of north-eastern Tigray. The alliance between Abiy and the Amhara militias broke down, and from 2023 the Fano fought the federal government in Amhara. The TPLF itself split between the faction of its chairman, Debretsion Gebremichael, and that of Getachew Reda; in March 2025 Debretsion’s supporters, backed by Tigrayan military commanders, took over the administration’s offices in Mekelle and other towns, Getachew left for Addis Ababa, and in April Abiy named Tadesse Werede, the wartime commander of the Tigrayan forces, to lead the interim administration. In May 2025 the national election board revoked the TPLF’s registration as a party."
      - "Relations between Mekelle and Addis Ababa, and between Ethiopia and Eritrea, worsened through 2025 and 2026. Clashes broke out in western Tigray in early 2026, the TPLF called the Pretoria agreement “effectively dead” in July, and on 20 September 2026 it joined the Fano, the OLA and other groups in an armed coalition against the federal government. On 23 September fighting resumed on a large scale. As of late November 2026 federal forces had retaken Alamata, Mekelle, Adigrat and Adwa, Eritrean troops had briefly entered Tigray in October before withdrawing, Ethiopia and Eritrea had broken off relations, and fighting continued in rural Tigray and along the Eritrean border; this new war is told in the story of the war in Amhara."
    facts:
      - [TPLF registration revoked, "May 2025"]
      - [Armed coalition against the government, "20 September 2026"]
      - [Renewed fighting in Tigray, "from 23 September 2026"]
    link: { href: "#/war/war-in-amhara", text: War in Amhara }
