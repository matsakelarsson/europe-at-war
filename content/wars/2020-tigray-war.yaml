notes:
  - "The death toll is among the most uncertain of any recent war, because Tigray was largely cut off from the outside world. Published estimates include more than 100,000 (Uppsala Conflict Data Program), 162,000–378,000 deaths from violence, hunger and lack of health care by 2022 (researchers at Ghent University), and about 600,000 (the African Union envoy Olusegun Obasanjo). Millions were displaced, and some 70,000 Tigrayans fled to Sudan."
  - "Both sides described the start of the war differently: the federal government called its campaign a “law enforcement operation” after the TPLF’s attack on the Northern Command, while the TPLF said it had acted pre-emptively against an imminent attack by federal and Eritrean forces. UN and human rights investigators found that all parties committed war crimes: federal, Eritrean and Amhara forces in Tigray, including mass killings, widespread rape and the deliberate denial of food, and Tigrayan forces in Amhara and Afar, including killings and rape of civilians."
  - "Western Tigray, also called Welkait by the Amhara who claim it, has been disputed since the 1990s, when it became part of the Tigray region."
