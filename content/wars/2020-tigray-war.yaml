  - title: Drones, retreat and truce
    date: December 2021 – August 2022
    when: "2021-12-20"
    borders: "2021-12-31"
    countries: [et]
    body:
      - "On 22 November 2021 Abiy announced that he would lead the army from the front. With hundreds of thousands of new recruits and militia, and armed drones bought from Turkey, the United Arab Emirates, Iran and China, the government counterattacked on several fronts. It retook Lalibela on 1 December and Dessie and Kombolcha on 6 December, and the drones struck Tigrayan columns and supply lines. On 20 December the TPLF announced it was withdrawing all its forces from Amhara and Afar, saying it wanted to open the way to peace; the army stopped at the border of Tigray."
      - "Drone and air strikes continued inside Tigray: on 7 January 2022 a strike on a camp for displaced people at Dedebit killed at least 56. On 24 March 2022 the government declared a humanitarian truce, and in the following months aid convoys reached Tigray for the first time in a year, though far fewer than were needed. Electricity, banking and telecommunications stayed cut. African Union mediators led by the former Nigerian president Olusegun Obasanjo tried to arrange talks."
    facts:
      - [Government counteroffensive, "from late November 2021"]
      - [TPLF withdrawal announced, "20 December 2021"]
      - [Dedebit air strike, "7 January 2022"]
      - [Humanitarian truce, "24 March 2022"]
