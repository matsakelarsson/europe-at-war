  - title: The last offensive and the Pretoria agreement
    date: August – November 2022
    when: "2022-11-02"
    borders: "2022-11-02"
    countries: [et, er]
    body:
      - "Fighting broke out again on 24 August 2022 on the southern front near Kobo. In September Eritrea mobilised its reserves and, with Ethiopian troops, attacked north-western Tigray from Eritrea around Sheraro, while the federal army advanced from the south and the west. Shire fell on 17 October, followed by Axum, Adwa and, in the south, Alamata and Korem. Tigrayan forces were outnumbered and short of ammunition, and Tigray’s civilians had endured two years of siege."
      - "Talks under the African Union opened in Pretoria on 25 October, mediated by Olusegun Obasanjo, the former Kenyan president Uhuru Kenyatta and the former South African deputy president Phumzile Mlambo-Ngcuka. On 2 November 2022 the federal government and the TPLF signed an agreement for a permanent cessation of hostilities: Tigrayan forces would disarm, federal authority would be restored in Tigray, services and aid would resume, and disputed areas would be settled under the constitution. Eritrea was not a party. A follow-up agreement in Nairobi on 12 November dealt with disarmament and aid; heavy weapons were handed over in January 2023, the TPLF was removed from the federal list of terrorist organisations in March 2023, and an interim regional administration led by the TPLF’s Getachew Reda took office."
    facts:
