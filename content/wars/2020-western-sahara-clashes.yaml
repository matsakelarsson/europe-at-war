id: western-sahara-clashes
name: Renewed fighting in Western Sahara
start: "2020-11-13"
end: ongoing
tier: C
summary: "Last updated 27 November 2026. The low-intensity war between Morocco and the Polisario Front that resumed in November 2020 after 29 years of ceasefire. In October 2020 Sahrawi protesters blocked the road through the UN buffer strip at Guerguerat, the only road from Morocco and Moroccan-held Western Sahara to Mauritania. On 13 November Moroccan troops moved into the strip, cleared the road and extended the sand wall (the berm) to the Mauritanian border, and the next day the Polisario declared the 1991 ceasefire over. Since then Polisario units have fired on Moroccan positions along the berm, claiming daily attacks that are hard to verify, and Morocco has struck vehicles and fighters east of the berm with armed drones, killing Polisario commanders and also civilians, among them Algerian and Mauritanian traders and herders; by one count at least 120 people had been killed by drone strikes by November 2024. Shells fired at the town of Smara killed a civilian in October 2023. The diplomatic balance moved towards Morocco: the United States recognised Moroccan sovereignty in December 2020, as Morocco restored relations with Israel; Spain, France and others backed Morocco’s autonomy plan; and Algeria, the Polisario’s main supporter, broke off relations with Morocco in August 2021. On 31 October 2025 UN Security Council Resolution 2797, adopted with Russia, China and Pakistan abstaining and Algeria not voting, called for negotiations on the basis of Morocco’s autonomy plan and said that genuine autonomy “could represent a most feasible outcome”; the Polisario and Algeria rejected it. Morocco, the Polisario, Algeria and Mauritania met for three rounds of talks in Washington and Madrid in January and February 2026, but by October the UN envoy reported a stalemate. On 30 October 2026 Russia vetoed a US draft that would have renewed the UN mission (MINURSO) while dropping the referendum from its name and mandate, a rival Russian draft failed, and on 31 October the mission’s mandate lapsed for the first time since 1991; its withdrawal began on 1 November. On 10 November the Polisario declared a general mobilisation, citing what it called escalating Moroccan military movements along the berm, while Morocco said it remained committed to the ceasefire. Moroccan media reported a drone strike on Polisario vehicles the same day; few such reports could be independently confirmed, and it was uncertain whether Morocco would try to take the area east of the berm."
