notes:
  - Western Sahara is a non-self-governing territory in UN terms. Morocco holds the land west of the berm, about four fifths of the territory, and regards it as its Southern Provinces; the Polisario, which proclaimed the Sahrawi Arab Democratic Republic in 1976, holds the strip east of the berm and runs the refugee camps near Tindouf in Algeria. The Polisario calls the fighting since 2020 a second war of liberation; Morocco long described the incidents as minor and denied that there was a war.
  - Claims by both sides about attacks and casualties since 2020 are rarely verifiable; journalists and UN observers have had little access to the area east of the berm.
