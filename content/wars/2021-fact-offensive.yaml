id: fact-offensive
name: FACT offensive in Chad
start: "2021-04-11"
end: "2021-05-09"
tier: C
summary: "An invasion of northern Chad from Libya by the Front for Change and Concord in Chad (FACT), during which President Idriss Déby was killed. FACT, led by Mahamat Mahdi Ali and drawing many of its fighters from the Goran (Daza) of the north, had been based in southern Libya, where a UN panel of experts placed it at the al-Jufra air base used by the forces of Khalifa Haftar and by the Russian Wagner Group. On 11 April 2021, the day of the presidential election in which Déby sought a sixth term, FACT columns of pickup trucks attacked a border post in the Tibesti and drove south through the desert towards N’Djamena. On 19 April, as the army fought them in Kanem near Nokou and Mao, some 250–300 km north of the capital, Déby was wounded at the front; his death was announced on 20 April, a day after provisional results had given him about 79 per cent of the vote. A Transitional Military Council under his son, General Mahamat Idriss Déby, suspended the constitution and dissolved parliament, and France, Chad’s main ally, accepted the takeover as necessary in exceptional circumstances; at least six protesters were killed in N’Djamena and the south when people demanded a civilian transition. The army drove the rebels back towards Niger and Libya and declared victory on 9 May; by its own figures it had killed some 540 rebels and captured about 210, and gave its own losses as 11 killed and 58 wounded; none of these figures could be checked. FACT refused to sign the peace agreement that the junta and some forty other rebel groups signed in Doha in August 2022. In March 2023 a court in N’Djamena sentenced more than 400 FACT members to life imprisonment for the attack; Mahamat Déby pardoned 380 of them days later, but not Mahamat Mahdi Ali, who was sentenced in his absence. Mahamat Déby was elected president in May 2024."
