steps:
  - title: The water war of 2021
    date: 28 April – 1 May 2021
    when: "2021-04-28"
    borders: "2021-05-01"
    countries: [kg, tj]
    body:
      - The Soviet authorities drew the borders of the Fergana Valley in the 1920s and redrew them often, and after 1991 the new states could not agree on hundreds of kilometres of them. In Batken the main road between Kyrgyz villages crosses Tajik land, the road to the Tajik exclave of Vorukh crosses Kyrgyz land, and the villages share irrigation water from the same rivers. Brawls between villagers over water and pasture repeatedly drew in border guards.
      - On 28 April 2021 a dispute over surveillance cameras at a water distribution point on the Isfara river near the Kyrgyz village of Kok-Tash, upstream of Vorukh, turned into stone-throwing between villagers and then into shooting between the two countries’ troops, with mortars and armoured vehicles. Kyrgyz villages near Vorukh were burned, and Tajik villages came under fire. About 55 people were killed, most of them civilians, and more than 33,000 people were evacuated from the Kyrgyz side. A ceasefire agreed on 1 May held, and both sides pulled back their troops on 3 May.
