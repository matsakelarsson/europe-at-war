id: kyrgyzstan-tajikistan-clashes
name: Kyrgyzstan–Tajikistan border clashes
start: "2021-04-28"
end: "2022-09-20"
tier: B
summary: Two short wars between Kyrgyzstan and Tajikistan over their disputed border in the Fergana Valley, in April 2021 and September 2022. Of the roughly 970-kilometre border inherited from the Soviet Union, more than a third had never been agreed, and the patchwork of villages, roads, pastures and canals around Kyrgyzstan’s Batken region and the Tajik exclave of Vorukh had produced repeated clashes. In April 2021 a quarrel over a water facility on the Isfara river turned into fighting between the two armies that killed about 55 people. In September 2022 much heavier fighting, with tanks, artillery and drones, spread along the whole Batken border and killed about 100 or more people, among them dozens of civilians, and more than 130,000 people were evacuated on the Kyrgyz side. Human Rights Watch found that forces on both sides had apparently committed war crimes. After long negotiations the two presidents signed a treaty settling the entire border on 13 March 2025.
