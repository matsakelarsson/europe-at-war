  - title: The September war of 2022 and the border treaty
    date: September 2022 – March 2025
    when: "2022-09-14"
    borders: "2022-09-20"
    countries: [kg, tj]
    body:
      - After further deadly shootings in January, March and June 2022, fighting broke out on 14 September at border posts in Batken, while the two presidents were on their way to a summit of the Shanghai Cooperation Organisation in Samarkand. By 16 September it had spread along much of the border, with tanks, rocket artillery and drones. Tajik forces crossed into Kyrgyzstan, and houses, shops and schools in the Kyrgyz village of Ak-Sai were reportedly burned and looted; Batken town and its airport were shelled. Tajik authorities said a Kyrgyz drone had struck a mosque, killing civilians. Some 136,000 people were evacuated on the Kyrgyz side. A ceasefire agreed on 16 September broke down within a day, but the fighting died away, and on 20 September the two sides signed a peace deal. Kyrgyzstan reported 63 dead and Tajikistan 41.
      - Human Rights Watch found that troops of both countries had apparently committed war crimes against civilians, including shootings of people fleeing. Russia, Uzbekistan and the UN urged a settlement, and the delimitation commissions worked through 2023 and 2024. On 13 March 2025 Presidents Sadyr Japarov and Emomali Rahmon signed a treaty in Bishkek that fixed the whole border, with exchanges of land, and reopened the border crossings; it came into force at the end of March, when the presidents of Kyrgyzstan, Tajikistan and Uzbekistan met in Khujand and agreed on the point where their three borders meet.
