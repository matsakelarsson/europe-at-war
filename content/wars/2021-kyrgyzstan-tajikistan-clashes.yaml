notes:
  - "Casualty figures come from the two governments and differ between sources. In 2021 Kyrgyzstan reported 36 dead and Tajikistan about 19. In September 2022 Kyrgyzstan reported 63 dead and Tajikistan 41; other estimates run from about 80 to more than 100. Human Rights Watch documented at least 37 civilians killed on both sides in 2022."
  - Each side blamed the other for starting both rounds of fighting; Human Rights Watch took no position on who began the 2022 conflict.
