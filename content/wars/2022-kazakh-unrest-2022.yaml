notes:
  - The government’s account of a coup attempt by “terrorists” and organised criminal groups, some trained abroad, is disputed by analysts and human rights groups; the protests began peacefully, and who organised the violence in Almaty remains unclear. Casualty figures are official, and independent groups have questioned their completeness.
  - Some reports gave larger figures for the CSTO force, up to about 3,800 troops. It was the alliance’s first collective deployment.
