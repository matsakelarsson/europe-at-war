id: kazakh-unrest-2022
name: 2022 Kazakh unrest
start: "2022-01-02"
end: "2022-01-19"
tier: C
summary: "Nationwide protests and riots in Kazakhstan in January 2022, known there as the January events or “Bloody January” (Qandy Qañtar). They began on 2 January in the oil town of Zhanaozen in Mangystau, after the lifting of a price cap nearly doubled the price of liquefied gas used to fuel cars, and spread within days to most cities, with demands that widened to direct elections of governors and the departure of the former president Nursultan Nazarbayev, who still chaired the Security Council. On 4–5 January protests in Almaty turned violent: the city hall and offices of the ruling Nur Otan party were set on fire, the airport was seized for a time and weapons were taken from police and security buildings. President Kassym-Jomart Tokayev dismissed the government, took over the Security Council from Nazarbayev, declared a state of emergency and asked the Russian-led Collective Security Treaty Organization (CSTO) for help; about 2,000 troops from Russia, Belarus, Armenia, Kyrgyzstan and Tajikistan arrived from 6 January to guard strategic sites. On 7 January Tokayev said he had ordered the security forces to “shoot to kill without warning” and called the rioters “terrorists” and “bandits”; he later described the events as an attempted coup. Official death tolls rose from 225 in mid-January to between 232 and 238 in later counts, 19 of them security personnel; more than 9,900 people were detained, and hundreds said they had been beaten or tortured in custody. The CSTO troops left by 19 January, when the state of emergency ended. The former head of the National Security Committee, Karim Massimov, was later convicted of treason and attempting to seize power; Human Rights Watch and others criticised the lack of an independent investigation into the killings."
