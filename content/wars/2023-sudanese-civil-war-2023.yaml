id: sudanese-civil-war-2023
name: Sudanese civil war (2023–present)
start: "2023-04-15"
end: ongoing
tier: A
summary: "The war between Sudan’s army, the Sudanese Armed Forces (SAF) under General Abdel Fattah al-Burhan, and the paramilitary Rapid Support Forces (RSF) of General Mohamed Hamdan Dagalo, known as Hemedti. The two generals had removed Omar al-Bashir together in 2019 and the civilian-led transitional government in 2021, but fell out over how and when the RSF would be merged into the army. Fighting broke out in Khartoum on 15 April 2023. The RSF took most of the capital, nearly all of Darfur, where its fighters and allied Arab militias massacred the Masalit of El Geneina, and in December 2023 the Gezira. From late 2024 the army, rearmed with drones, retook the Gezira, Sennar and, in March 2025, Khartoum. The RSF and its allies set up a rival government in Nyala, and in October 2025 they took El Fasher, the last army stronghold in Darfur, after an 18-month siege, killing thousands of civilians. The war then centred on Kordofan and Blue Nile and on drone strikes across the country. Both sides have been accused of war crimes; the United States determined in January 2025 that the RSF and allied militias had committed genocide. The war has caused the world’s largest displacement crisis, with some 13–14 million people driven from their homes, and famine; reported deaths number tens of thousands, and estimates of the true toll run far higher."
countries: [sd, td, ss, ly, eg]
sides:
  - id: saf
    name: Sudanese Armed Forces and allies (the Joint Forces of the Darfur movements and others)
    polities: [sudan, sla-jem]
    ink: red
    moves: SAF and allied moves
    success: SAF success
  - id: rsf
    name: Rapid Support Forces and allies (from 2025 the SPLM-North of Abdelaziz al-Hilu)
    polities: [rsf, splm-n]
    ink: orange
    moves: RSF and allied moves
    success: RSF success
notes:
  - "On the army’s side fight Islamist brigades, militias raised by popular mobilisation and the Joint Forces of the Darfur movements that signed the Juba agreement of 2020, among them Minni Minnawi’s SLM and Gibril Ibrahim’s JEM; Malik Agar’s faction of the SPLM-North joined the government. On the RSF’s side are Arab militias of Darfur and Kordofan and, from 2025, Abdelaziz al-Hilu’s faction of the SPLM-North. Abdul Wahid al-Nur’s SLM has kept its hold on Jebel Marra and stayed out of the war."
  - "Foreign support is disputed. UN experts and others have reported that the RSF received weapons through Chad, Libya and the Central African Republic and from the United Arab Emirates, which denies it; Sudan cut relations with the UAE in May 2025. The army has drones and weapons from Turkey, Iran, Egypt and others, according to reports."
  - "Figures are uncertain. Counts of reported deaths reached tens of thousands by 2026 (about 59,000 in late 2026 by one tally); estimates that include deaths from hunger and disease run from 150,000 to several hundred thousand. Places changed hands often, and claims by both sides are hard to verify."
