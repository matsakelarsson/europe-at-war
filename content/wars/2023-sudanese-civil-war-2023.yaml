  - title: The army retakes the centre
    date: September 2024 – March 2025
    when: "2025-03-21"
    borders: "2025-03-26"
    countries: [sd]
    body:
      - With new drones, recruits from popular mobilisation and the defection of RSF commanders, the army went on the offensive. On 26 September 2024 its troops crossed the bridges into central Khartoum and Bahri; in October they took Jebel Moya and Dinder, and in November Singa. On 11 January 2025 the army retook Wad Madani; some of its allied fighters were accused of killing civilians they suspected of collaborating with the RSF. Later that month it broke the siege of its General Command in Khartoum, and in February an army column lifted the RSF siege of El Obeid in North Kordofan.
      - On 21 March 2025 the army took the presidential palace in Khartoum, and on 26 March the airport; Burhan declared that “Khartoum is free”. The RSF withdrew west across the White Nile, leaving a ruined capital where the army found mass graves. In January the United States had determined that the RSF and its allied militias had committed genocide in Darfur and sanctioned Hemedti.
    facts:
      - [Army crosses the Khartoum bridges, "26 September 2024"]
      - [Army retakes Wad Madani, "11 January 2025"]
