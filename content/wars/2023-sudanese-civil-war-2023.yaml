  - title: Famine and the siege of El Fasher
    date: May – December 2024
    when: "2024-08-01"
    borders: "2024-08-01"
    countries: [sd, td]
    body:
      - From May 2024 the RSF besieged El Fasher, a city of perhaps 1.5 million people including some 800,000 displaced, defended by the army and the Joint Forces of the Zaghawa-led Darfur movements. It shelled the city and the camps around it, attacked its hospitals and slowly closed the roads, while the army bombed RSF-held towns from the air. On 13 June 2024 the UN Security Council demanded an end to the siege; it went on.
      - War, blockade and looting brought famine. On 1 August 2024 the Famine Review Committee confirmed famine in the Zamzam camp south of El Fasher, home to about half a million people; in December famine was also found in the Abu Shouk and El Salam camps and in parts of the Nuba Mountains, findings the government rejected. Both sides blocked or taxed aid. By late 2024 some 25 million people, half the population, faced acute hunger, and more than 11 million had been displaced inside Sudan or abroad.
    facts:
      - [Siege of El Fasher, "May 2024 – October 2025"]
      - [Famine confirmed in Zamzam camp, "1 August 2024"]
      - [People facing acute hunger, "about 25 million"]
