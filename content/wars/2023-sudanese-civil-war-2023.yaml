steps:
  - title: Two generals and the battle for Khartoum
    date: April – August 2023
    when: "2023-04-15"
    borders: "2023-04-15"
    countries: [sd]
    body:
      - The RSF grew out of the Janjaweed militias of the Darfur war and was given legal status in 2017, answerable in practice to Bashir himself; by 2023 it had perhaps 100,000 fighters and its own businesses, including gold mines. When protests brought Bashir down in April 2019, Burhan became head of the Sovereignty Council and Hemedti his deputy. On 25 October 2021 the two generals together removed the civilian prime minister, Abdalla Hamdok. A framework agreement of December 2022 was to restore civilian rule, but the army wanted the RSF merged into it within two years and the RSF wanted ten, and the question of who would command it divided them.
      - On the morning of 15 April 2023 fighting broke out in Khartoum and across the country. RSF fighters attacked the army’s General Command, the presidential palace and the airport, and seized the airport at Merowe in the north for a time. The RSF quickly took most of the three cities of the capital, Khartoum, Omdurman and Khartoum North (Bahri), while the army held its main bases and used its air force and artillery. Burhan was besieged in the General Command for four months. Foreign governments evacuated their citizens in late April, and millions of people fled the capital. RSF fighters occupied houses, looted and raped, and both sides’ fire killed many civilians.
      - Talks in Jeddah under Saudi and American mediation produced a declaration on protecting civilians on 11 May 2023 and short ceasefires that did not hold. On 24 August Burhan got out of the capital, and the army-led government moved to Port Sudan on the Red Sea.
    facts:
      - [Coup against the civilian government, "25 October 2021"]
      - [War breaks out, "15 April 2023"]
      - [Jeddah Declaration, "11 May 2023"]
      - [Burhan leaves Khartoum, "24 August 2023"]
