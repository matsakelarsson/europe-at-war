  - title: The fall of El Fasher
    date: October – November 2025
    when: "2025-10-26"
    borders: "2025-10-27"
    countries: [sd, td]
    body:
      - Through 2025 the RSF tightened its siege of El Fasher, surrounding the city with an earth berm that blocked food and trapped people trying to leave; in early October its shelling and drones hit a maternity hospital, a mosque and a shelter for displaced people. On 26 October 2025 RSF fighters overran the army’s 6th Infantry Division base, and the army and the Joint Forces withdrew; Burhan confirmed the withdrawal on 28 October.
      - What followed was one of the worst massacres of the war. RSF fighters killed civilians in the streets, in the Saudi maternity hospital, where the World Health Organization reported some 460 patients and companions killed, and on the roads out, and filmed many of the killings themselves; satellite images analysed by Yale’s Humanitarian Research Lab showed clusters consistent with bodies within days. The UN human rights office later documented about 6,000 killings in the first three days and said the real toll was much higher; other estimates run to tens of thousands. Many of the dead were Zaghawa and other non-Arab people. About 100,000 survivors reached Tawila and other towns in the first weeks, while tens of thousands were unaccounted for. Hemedti said violations would be investigated, and the RSF arrested some of its fighters.
    facts:
      - [RSF takes El Fasher, "26 October 2025"]
      - [Killed in the Saudi hospital, "about 460 (WHO)"]
      - [Killings documented in the first three days, "about 6,000 (UN human rights office)"]
    markers:
      - kind: taken
        side: rsf
