  - title: El Geneina and the conquest of Darfur
    date: April – November 2023
    when: "2023-11-04"
    borders: "2023-11-21"
    countries: [sd, td]
    body:
      - In Darfur the war became a war on the non-Arab peoples. In El Geneina, the capital of West Darfur and home of the Masalit, fighting began in late April 2023 between the RSF and allied Arab militias and Masalit armed groups. The attackers went through the town’s quarters and the camps for displaced people, killing men and boys and raping women; on 14 June the governor, Khamis Abakar, was killed hours after accusing the RSF of genocide on television. People fleeing to Chad were shot on the road to Adré. A UN panel of experts estimated that 10,000–15,000 people were killed in El Geneina in 2023, and hundreds of thousands of Masalit fled to Chad.
      - "In late October and November 2023 the RSF overran the army garrisons in Darfur one after another: Nyala on 26 October, Zalingei on 31 October, the base at Ardamata outside El Geneina on 4 November, where hundreds more Masalit were killed in the following days, and Ed Daein on 21 November. Only El Fasher, the capital of North Darfur, defended by the army and the Joint Forces of the Darfur movements, held out."
    facts:
      - [Killing of Governor Khamis Abakar, "14 June 2023"]
      - [Killed in El Geneina in 2023, "10,000–15,000 (UN panel estimate)"]
      - [RSF takes Nyala, "26 October 2023"]
      - [RSF takes Ed Daein, "21 November 2023"]
