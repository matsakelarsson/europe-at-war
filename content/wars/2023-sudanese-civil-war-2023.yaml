  - title: The drone war and the Blue Nile front
    date: 2026
    when: "2026-11-24"
    borders: "2026-11-24"
    countries: [sd, ss, et]
    body:
      - "Last updated 27 November 2026. Through 2026 neither side could win. In Blue Nile the RSF and al-Hilu’s SPLM-North opened a new front along the borders with South Sudan and Ethiopia: Kurmuk fell to them on 24 March, was retaken by the army on 8 July and lost again on 13 August, and by late November they held a string of border towns and villages 65–70 km from the state capital, Damazin, though the army still held all the larger towns. Sudan and Ethiopia accused each other of backing rebels. In the Nuba Mountains the SPLM-North also fought a rival Otoro faction for its stronghold of Kauda."
      - "In Kordofan the army launched an offensive in July 2026, retook Bara on 25 July and opened the road from Khartoum to El Obeid, then pushed west through Sodari and al-Mazroub; by mid-November it had retaken more than 30 villages and towns in North and West Kordofan and was about 60 km from the RSF-held city of En Nahud, aiming at Darfur. Several RSF commanders went over to the army. The RSF held all five state capitals of Darfur, where its government in Nyala set up its own central bank."
      - "Drones did much of the killing. The UN human rights office verified 2,230 civilian deaths from January to October 2026, about 73 per cent of them from drone strikes, and said the real number was higher. RSF drones hit power stations, Khartoum and its airport and, on 24 November, Damazin and Roseires, killing at least 19 people; army drones and aircraft struck markets and towns in RSF-held Darfur and Kordofan, and on 19 October a strike on the Amiet market in the disputed Abyei area killed at least 153 people; South Sudan blamed the Sudanese army, and a Sudanese officer said the strike targeted fuel supplies for the RSF. Diplomacy had stalled: Burhan said he would fight until the RSF was defeated, and the United States said neither general should have a role in Sudan’s future. Some 13–14 million people had been displaced, and famine persisted in parts of Darfur and Kordofan."
    facts:
      - [Kurmuk taken by the RSF and the SPLM-North, "24 March 2026 (and again 13 August)"]
      - [Army retakes Bara, "25 July 2026"]
      - [Civilians killed, January–October 2026, "2,230 verified by the UN, about 73% by drones"]
      - [Displaced, "some 13–14 million"]
