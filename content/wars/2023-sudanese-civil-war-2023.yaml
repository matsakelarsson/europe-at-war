  - title: Wad Madani and the Gezira
    date: December 2023 – October 2024
    when: "2023-12-18"
    borders: "2024-06-29"
    countries: [sd]
    body:
      - On 18–19 December 2023 the RSF swept into the Gezira, the irrigated breadbasket between the Blue and White Niles, and the army withdrew from its capital, Wad Madani, where hundreds of thousands of people from Khartoum had taken refuge. RSF fighters looted villages across the Gezira, and when villagers resisted they killed them; at Wad al-Nourah on 5 June 2024 more than 100 people were killed by local counts, and some reports gave up to 200. In June 2024 the RSF pushed into Sennar State, taking Jebel Moya on 24 June and Singa on 29 June, and in West Kordofan it took Al-Fula.
      - When an RSF commander in the eastern Gezira, Abu Aqla Kayka, went over to the army in October 2024, RSF fighters took revenge on the villages of his area, killing an estimated 80 to more than 120 people at Al-Sireha on 25–26 October and many more in other villages. In December 2023 the United States had already determined that both sides had committed war crimes and that the RSF had committed crimes against humanity and ethnic cleansing. Peace talks in Geneva in August 2024 failed when the army did not attend.
    facts:
