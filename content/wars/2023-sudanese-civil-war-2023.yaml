  - title: Kordofan
    date: October 2025 – February 2026
    when: "2025-12-08"
    borders: "2025-12-08"
    countries: [sd, ss]
    body:
      - "With Darfur in its hands, the RSF turned east into Kordofan. Bara, north of El Obeid, changed hands several times, and RSF fighters killed hundreds of villagers in the area in July and October 2025. On 1 December the RSF took the army’s 22nd Division headquarters at Babanusa after a siege of nearly two years, and on 8 December it seized the Heglig oil field on the border with South Sudan; under a three-way agreement both sides then withdrew and South Sudanese troops took over its protection. Together with al-Hilu’s SPLM-North the RSF besieged Kadugli and Dilling in the Nuba Mountains. Drones struck on all sides: on 4 December a strike blamed on the RSF killed at least 116 people, 43 of them children, at Kalogi in South Kordofan, and on 13 December a drone killed six Bangladeshi UN peacekeepers at their base in Kadugli."
      - In November 2025 the Quad, the United States, Saudi Arabia, the United Arab Emirates and Egypt, proposed a three-month humanitarian truce. The RSF accepted it on 6 November and on 24 November declared a unilateral truce, while its attacks went on; Burhan rejected the plan, citing the UAE’s role. The army-led government formally returned to Khartoum on 11 January 2026, and in January and February the army broke the sieges of Dilling and Kadugli, which were later renewed.
    facts:
      - [RSF takes Babanusa, "1 December 2025"]
      - [RSF seizes Heglig, "8 December 2025"]
      - [Government returns to Khartoum, "11 January 2026"]
