  - title: Two governments
    date: February – August 2025
    when: "2025-07-26"
    borders: "2025-08-30"
    countries: [sd, ly, eg]
    body:
      - On 23 February 2025 in Nairobi the RSF, Abdelaziz al-Hilu’s SPLM-North and other groups signed a charter for a rival “Government of Peace and Unity”, and their alliance, Tasis (“Foundation”), named its presidential council on 26 July with Hemedti at its head and al-Hilu as his deputy. Hemedti was sworn in at Nyala on 30 August, the same day an army drone strike on a hospital there killed dozens. In Port Sudan Burhan appointed a civilian prime minister, Kamil Idris, in May, and the army-led government began to move back to Khartoum.
      - On 11–13 April 2025 the RSF stormed the Zamzam camp; estimates of the dead range from several hundred to about 2,000, and some 400,000 people fled, most to Tawila west of El Fasher. In May RSF drones struck Port Sudan, its airport, fuel depots and power station, far from any front, and the government cut relations with the United Arab Emirates, which it accused of arming the RSF. In June forces loyal to Libya’s Khalifa Haftar and the RSF took the border triangle with Libya and Egypt, and the army withdrew from it.
    facts:
      - [Nairobi charter of the RSF alliance, "23 February 2025"]
      - [RSF storms Zamzam camp, "11–13 April 2025"]
      - [Drone strikes on Port Sudan, "from 4 May 2025"]
      - [Hemedti sworn in at Nyala, "30 August 2025"]
