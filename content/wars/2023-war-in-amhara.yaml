steps:
  - title: From allies to enemies
    date: April – August 2023
    when: "2023-08-04"
    borders: "2023-08-10"
    countries: [et]
    body:
      - "Fano is an old Amharic word for irregular fighters. Its modern militias, loosely organised and drawing on Amhara nationalism, grew during the protests of 2016–2018 and fought beside the federal army and the Amhara special forces against the TPLF in 2020–2022, taking Western Tigray and parts of Raya. Many Amhara felt betrayed by the Pretoria agreement, from which they were excluded and which left Western Tigray’s future to be settled later, and by the killings of Amhara civilians in Oromia. When the federal government ordered all regional special forces to be disbanded and absorbed into the army and police on 6 April 2023, protests and clashes broke out across Amhara, and many special-force members joined the Fano with their weapons."
      - "At the end of July 2023 the Fano rose across the region. On 2 August they took the airport at Lalibela, and in the following days they entered Gondar, fought in Bahir Dar and Debre Tabor and took several smaller towns. On 4 August the government declared a six-month state of emergency, later extended. The army retook the main towns within days, but the fighting moved into the countryside. On 13 August a drone strike on the main square of Finote Selam in West Gojjam killed some 26 people, the first of many such strikes on towns and markets in Amhara."
    facts:
      - [Order to disband regional special forces, "6 April 2023"]
      - [Lalibela airport taken by the Fano, "2 August 2023"]
      - [State of emergency, "4 August 2023"]
      - [Drone strike on Finote Selam, "13 August 2023"]
