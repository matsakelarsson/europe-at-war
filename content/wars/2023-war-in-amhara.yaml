id: war-in-amhara
name: War in Amhara
start: "2023-04-09"
end: ongoing
tier: B
summary: "Last updated 27 November 2026. The insurgency of the Fano, Amhara nationalist militias, against the Ethiopian federal government of Abiy Ahmed in the Amhara region, which since September 2026 has merged into a wider war. The Fano had fought beside the federal army against the TPLF in the Tigray War, but the Pretoria agreement of 2022, the government’s order in April 2023 to disband the regional special forces and the unresolved fate of Western Tigray turned them against it. In August 2023 Fano fighters briefly took Lalibela, Gondar and other towns, and the government declared a state of emergency. Since then the Fano, divided into regional commands in Gojjam, Gondar, Wollo and Shewa until they united as the Amhara Fano National Movement in January 2026, have controlled much of the countryside while the army holds the towns and main roads and strikes from the air; drone strikes, killings of civilians by all sides and mass arrests have been reported throughout. On 20 September 2026 the Fano joined the TPLF, the Oromo Liberation Army and other groups in an armed coalition against the government, and from 23 September fighting resumed in Tigray and spread along the fronts of Wollo, Wag Hemra and Afar, with Eritrea accused of backing the rebels."
