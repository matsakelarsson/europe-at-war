  - title: The Fano National Movement and the coalition war
    date: January – November 2026
    when: "2026-09-23"
    borders: "2026-11-27"
    countries: [et, er]
    body:
      - "Last updated 27 November 2026. In January 2026 the main Fano factions merged into the Amhara Fano National Movement (AFNM), chaired by Zemene Kassie. Its February offensive claimed more than a dozen towns, and its fighters entered Debre Tabor on 4 February before drone strikes drove them out. When Ethiopia voted in its general election on 1 June 2026, which the Prosperity Party won by a large majority, voting did not take place in Tigray, and insecurity kept 143 polling stations in Amhara and Oromia from opening."
      - "On 20 September 2026 the AFNM, the TPLF, the OLA and four smaller groups announced an alliance to overthrow Abiy Ahmed’s government and set up a transitional government. After federal drone strikes on 22 September, coalition forces attacked on 23 September on the Kobo front in North Wollo and along the border of Afar and Amhara, seized the airports of Mekelle, Axum and Shire, and opened a front in Wag Hemra. The army counterattacked: it retook Sekota on 27 September and Alamata on 28 September, where at least 52 civilians were reported killed, Mekelle’s airport and the city itself, which the TPLF left, on 3–4 October, and Adigrat, Adwa and Zalambessa on 10–12 October. Ethiopia accused Eritrea of backing the coalition; the two countries broke off relations on 1 October, Eritrean troops entered north-eastern Tigray on 7 October and withdrew under Ethiopian drone attacks, and in mid-November the two armies exchanged fire near Badme and Sheraro."
      - "In Amhara the Fano kept up attacks across the region, claiming towns such as Meragna in North Shewa in October; in November they fought the army for Wuchale and Girana on the main road south of Woldia, which the army retook, and near Debre Werq in East Gojjam. As of late November 2026 the government holds the cities and main roads of Amhara and the main towns of Tigray, while the Fano are active across rural Amhara and Tigrayan forces in rural Tigray; the African Union has been asked to mediate. Many reports from both sides could not be verified."
    facts:
      - [Amhara Fano National Movement formed, "22 January 2026"]
      - [Coalition announced, "20 September 2026"]
      - [Renewed war begins, "23 September 2026"]
      - [Ethiopia and Eritrea break off relations, "1 October 2026"]
