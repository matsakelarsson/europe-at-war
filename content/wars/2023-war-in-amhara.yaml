  - title: War in the countryside
    date: 2024–2025
    when: "2024-09-01"
    borders: "2024-10-01"
    countries: [et]
    body:
      - "Through 2024 and 2025 the Fano controlled much of rural Gojjam, Gondar, Wollo and North Shewa, ambushing convoys, blocking roads and briefly entering towns, while the army held the cities and main roads and answered with offensives and drone strikes. The Ethiopian Human Rights Commission said soldiers killed at least 45 civilians in Merawi in January 2024, and other accounts gave higher figures; on 19 February 2024 a drone strike on a truck near Sela Dingay in North Shewa killed at least 15 civilians, most of them returning from a baptism, and residents put the toll at about 30; the UN and rights groups reported hundreds of civilians killed by drone strikes, among them a strike in East Gojjam in April 2025 in which more than 100 people, many at a school, were reported killed. The Fano too were accused of killing civilians, officials and captives, and of kidnappings for ransom. Fano offensives in 2024 took the border town of Metemma in September and reached into Gondar and Bahir Dar, and in October the army began what its commanders called a “final operation”."
      - "The Fano remained divided into rival regional commands, which made both war and talks harder. In May 2025 four of them formed the Amhara Fano National Force, and in the autumn of 2025 Wollo Fano fighters claimed to have surrounded Woldia and taken Mekane Selam, claims the government disputed. In December 2025 the government signed a peace agreement with a Fano leader whom his own organisation said had already been suspended. By 2025 the war had displaced hundreds of thousands, closed thousands of schools and cut off much of the region’s health care."
    facts:
      - [Merawi killings, "January 2024"]
      - [Metemma taken by the Fano, "1 September 2024"]
      - [Amhara Fano National Force formed, "9 May 2025"]
