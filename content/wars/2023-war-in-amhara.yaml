notes:
  - "Reporting from Amhara is very hard to verify: journalists have little access, the internet is often cut, and both the government and the Fano make claims of towns taken and enemies killed that cannot be checked. Figures here come from the UN, the Ethiopian Human Rights Commission, ACLED and news agencies, and many are marked as unconfirmed."
  - "The coalition formed on 20 September 2026 is called the Ethiopian Peoples’ Forces Coalition (or Alliance) for Survival (EPFAS). Its core members are the Amhara Fano National Movement, the TPLF and the Oromo Liberation Army, with smaller Afar and Benishangul groups; the Gumuz People’s Democratic Movement, named at the launch, denied being a member, and the membership of the Ogaden National Liberation Front is disputed. The government accuses Eritrea, Egypt and Sudan of backing it; Eritrea denies any part in forming it."
