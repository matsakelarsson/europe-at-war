steps:
  - title: The October border war
    date: October – December 2025
    when: "2025-10-11"
    borders: "2025-10-11"
    countries: [pk, af]
    body:
      - "Since the Taliban took power in Kabul in 2021, attacks by the TTP in Pakistan had risen year by year, and Pakistan accused the Taliban of giving the group shelter, which they denied; Pakistan also deported hundreds of thousands of Afghan refugees. After a TTP ambush in Orakzai killed 11 Pakistani soldiers, explosions hit Kabul and Paktika on the night of 9 October 2025; the strikes were reportedly aimed at the TTP leader, Noor Wali Mehsud, who survived. On the night of 11–12 October Afghan forces attacked Pakistani posts along much of the border. Pakistan said it lost 23 soldiers and killed more than 200 Taliban and allied fighters; the Taliban said they had killed 58 Pakistani soldiers and lost nine men. Pakistan closed the Torkham and Chaman crossings."
      - "On 15 October heavy fighting broke out around Spin Boldak and in Kurram, and Pakistan struck targets in Kandahar and Kabul before announcing a 48-hour truce. After it ran out, a Pakistani strike in Paktika on 17 October killed ten people at a house, among them three local cricketers. On 19 October, at talks in Doha mediated by Qatar and Turkey, the two governments agreed to a ceasefire. Follow-up talks in Istanbul broke down on 7–8 November without agreement on how to stop the TTP, but the ceasefire largely held. The border stayed closed and trade between the two countries collapsed; after a suicide bombing outside a court in Islamabad killed 12 people on 11 November, Pakistan’s defence minister said the country was in a “state of war”. UNAMA counted 37 Afghan civilians killed and 425 wounded in the October fighting."
    facts:
      - [Strikes on Kabul, "9 October 2025"]
      - [Afghan attacks on border posts, "11–12 October 2025"]
      - [Doha ceasefire, "19 October 2025"]
      - [Istanbul talks collapse, "7–8 November 2025"]
