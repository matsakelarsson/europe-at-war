notes:
  - "Both governments restrict reporting from the border areas, and their claims of enemy losses, in the hundreds on each side, cannot be checked. Civilian casualty figures here are those of the UN mission in Afghanistan (UNAMA) unless another source is named."
  - The Taliban government, in power since August 2021, is recognised by few states; Afghanistan is shown as one state on the base map. Pakistan has never accepted Afghan objections to the Durand Line, the border drawn in 1893. The TTP’s insurgency inside Pakistan has its own entry.
