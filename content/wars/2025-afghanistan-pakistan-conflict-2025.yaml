id: afghanistan-pakistan-conflict-2025
name: Afghanistan–Pakistan conflict
start: "2025-10-09"
end: ongoing
tier: B
summary: "The war between Pakistan and Afghanistan’s Taliban government, which Pakistan accuses of sheltering the Pakistani Taliban (TTP) and other groups that attack it from Afghan soil; the Taliban deny this. In October 2025 Pakistani air strikes in Kabul, aimed at the TTP’s leader, were followed by Afghan attacks on Pakistani border posts and a week of the heaviest border fighting in decades, ended by a ceasefire mediated by Qatar and Turkey on 19 October. Talks in Istanbul failed and the border stayed closed. In February 2026, after a wave of bombings in Pakistan, Pakistan struck targets across Afghanistan, including Kabul, Kandahar and Bagram, and declared “open war”. Fighting along the border, Pakistani air and drone strikes and Afghan drone attacks continued through 2026, interrupted only by short truces at the Eid holidays, while talks mediated by China and others brought no settlement. By October 2026 the UN counted more than 1,100 Afghan civilians killed or wounded, and about 115,000 Afghans had been displaced. Last updated 27 November 2026."
countries: [pk, af]
