  - title: A war without a ceasefire
    date: June – November 2026
    when: "2026-09-21"
    borders: "2026-11-27"
    countries: [pk, af]
    body:
      - "Last updated 27 November 2026. The fighting eased in the summer but did not stop. Officials of the two sides met in Termez, Uzbekistan, in June, while Pakistan carried out ground and air operations in Paktia, Paktika and Kunar; the Taliban said a strike near Chamkani in Paktia on 28 June killed 28 villagers. There were heavy clashes in Khyber and Kurram in July. In Badakhshan, Afghan opposition fighters attacked Taliban posts and briefly took a district centre; the Taliban accused Pakistan of backing them, which Pakistan rejected."
      - "After an attack on the police lines in Kohat killed 31 people on 18 September, Pakistan struck Paktika and Kunar on 21 September and ten sites in Kandahar, Paktia and Khost on 24 September, and fighting flared in Nuristan. On 10 October Pakistan fired ballistic missiles and drones at targets in Paktia, and the next day it declared a state of emergency in Khyber Pakhtunkhwa. Clashes followed on the Kurram–Paktia border in mid-October and at Angoor Adda and Torkham from 27 October to 1 November, and Pakistani rockets hit houses at Shkin in Paktika, killing a civilian. On 5 November Pakistani troops fought Taliban forces in Kurram after what Pakistan said was a TTP infiltration attempt, and on 13 November its army said it had killed 74 militants in raids along the border. Russia, Saudi Arabia and Qatar offered mediation, and the United States said it would help with Pakistan’s concerns about cross-border attacks."
      - "By October the UN counted more than 1,100 Afghan civilian casualties since February, and UNHCR estimated about 115,000 people displaced in Afghanistan and 3,000 in Pakistan; Pakistan said attacks from Afghan territory had killed 4,700 Pakistanis in three years. The main border crossings had been closed for most of the year, and Afghan trade was being rerouted through Iran and Central Asia. At the end of November there was no ceasefire and no talks under way, and whether mediation could bring the two governments to an agreement on the TTP was uncertain."
    facts:
      - [Pakistani strikes after the Kohat attack, "21 and 24 September 2026"]
      - [State of emergency in Khyber Pakhtunkhwa, "11 October 2026"]
      - [Fighting at Angoor Adda and Torkham, "27 October – 1 November 2026"]
