  - title: Open war
    date: February – May 2026
    when: "2026-02-26"
    borders: "2026-02-26"
    countries: [pk, af]
    body:
      - "On 6 February 2026 an ISIS-K suicide bomber killed 31 worshippers at a Shia mosque in Islamabad, and further attacks followed in Bajaur and Bannu. On 21–22 February Pakistan’s air force struck what it called TTP and ISIS-K camps in Nangarhar, Paktika and Khost; the Taliban said homes and a religious school had been hit. Exchanges of fire spread along the border, and on 26 February the Taliban announced a “retaliatory operation”. Pakistan struck Taliban military sites in Kabul, Kandahar, Paktia and Nangarhar, and its defence minister, Khawaja Asif, declared “open war”; Pakistan called its campaign Operation Ghazab lil-Haq. Strikes followed on Jalalabad and the Bagram air base, and the Taliban claimed drone attacks on Pakistani military sites as far away as Nowshera and Abbottabad, some of which Pakistan denied."
      - "On 13 and 14 March Pakistan struck military targets in Kabul and Kandahar, and on 16 March a strike in Kabul hit a drug addiction treatment hospital, reportedly killing more than 200 people; Pakistan denied targeting the hospital. Pakistani forces took a number of border posts and, according to the BBC, citing satellite images, fenced off some 32 square kilometres of Paktika, which Afghanistan called aggression. Shelling cut off two districts of Nuristan for weeks, leaving some 100,000 people without aid. A truce at Eid al-Fitr (19–24 March), requested by Saudi Arabia, Qatar and Turkey, did not last, nor did a lull around Eid al-Adha in late May, and talks mediated by China in Ürümqi in April ended without agreement; Pakistan demanded that the Taliban declare the TTP a terrorist group and dismantle its bases under verification. By 12 May UNAMA counted 372 Afghan civilians killed and 397 wounded by Pakistani strikes."
    facts:
