steps:
  - title: Pahalgam and Operation Sindoor
    date: 22 April – 8 May 2025
    when: "2025-05-07"
    borders: "2025-05-07"
    countries: [in, pk]
    body:
      - "On 22 April 2025 gunmen attacked tourists in the Baisaran meadow above Pahalgam, singling out Hindu men, and killed 25 tourists and a local pony handler who tried to stop them. A group called The Resistance Front, which India regards as a front for Lashkar-e-Taiba, first claimed the attack and then denied it. India suspended its part in the Indus Waters Treaty of 1960, which governs the rivers flowing from India into Pakistan, closed the main land crossing at Attari and expelled Pakistani military advisers; Pakistan closed its airspace to Indian aircraft, suspended trade and threatened to suspend the Simla Agreement of 1972. From 24 April the two armies exchanged fire across the Line of Control."
      - "In the early hours of 7 May India fired missiles and guided bombs at nine sites: the headquarters of Jaish-e-Mohammed at Bahawalpur and of Lashkar-e-Taiba at Muridke, and sites in Sialkot district and in Pakistani-administered Kashmir, among them Muzaffarabad and Kotli. Pakistan said those killed were civilians, among them children, and that mosques had been hit, and its air force claimed to have shot down several Indian jets in the night’s air battle. Pakistani artillery shelled Indian towns along the Line of Control, above all Poonch, killing at least eleven civilians there. On 8 May India said Pakistan had tried to attack military sites across northern India with drones and missiles and struck air defence radars, including one at Lahore."
    facts:
      - [Pahalgam attack, "22 April 2025, 26 killed"]
      - [Indus Waters Treaty suspended by India, "23 April 2025"]
      - [Operation Sindoor, "7 May 2025"]
