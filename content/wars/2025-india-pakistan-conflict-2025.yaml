id: india-pakistan-conflict-2025
name: India–Pakistan conflict of 2025
start: "2025-05-07"
end: "2025-05-10"
tier: B
summary: "Four days of missile, drone and air strikes and artillery fire between India and Pakistan in May 2025, the most serious fighting between the two nuclear-armed states since 1971. On 22 April 2025 gunmen killed 26 people, nearly all of them Hindu tourists, at a meadow near Pahalgam in Indian-administered Kashmir. India blamed militants backed by Pakistan, suspended the Indus Waters Treaty and expelled Pakistani diplomats; Pakistan denied involvement and answered with measures of its own. On 7 May India struck nine sites in Pakistan and Pakistani-administered Kashmir that it called terrorist camps, in what it named Operation Sindoor; Pakistan said civilians and mosques had been hit and claimed to have shot down several Indian fighter jets. After days of shelling along the Line of Control and waves of drones, both sides struck each other’s air bases on 10 May, and that afternoon a ceasefire, first announced by US President Donald Trump, took effect. Officially, 21 civilians and 8 soldiers died on the Indian side and 40 civilians and 13 soldiers on the Pakistani side. Both countries claimed victory."
countries: [in, pk]
sides:
  - id: in
    name: India
    polities: [india]
    ink: orange
    moves: Indian moves
    success: Indian success
  - id: pk
    name: Pakistan
    polities: [pakistan]
    ink: green
    moves: Pakistani moves
    success: Pakistani success
notes:
  - "Most claims of the two sides remain disputed. India said its strikes of 7 May killed more than 100 militants of Jaish-e-Mohammed, Lashkar-e-Taiba and Hizbul Mujahideen; Pakistan said the dead were civilians. Pakistan claimed to have shot down six Indian aircraft, including French-built Rafales; India’s Chief of Defence Staff acknowledged losses on 31 May without giving a number. Each side also claimed heavy damage to the other’s air bases, and each said the other had started the drone and missile attacks of 8–10 May."
  - "India says the ceasefire was agreed directly between the two armies’ directors general of military operations, while Pakistan thanked the United States for its mediation. The Pahalgam attack is described in the entry on the insurgency in Jammu and Kashmir."
