  - title: The air bases and the ceasefire
    date: 8–10 May 2025
    when: "2025-05-10"
    borders: "2025-05-10"
    countries: [in, pk]
    body:
      - "On the nights of 8 and 9 May hundreds of drones were sent across the border and the Line of Control, and India reported drone sightings at 26 places from Kashmir to Gujarat; Pakistan said it had shot down dozens of Indian drones. Blackouts were imposed in border towns on both sides. In the early hours of 10 May India struck at least eleven Pakistani air bases and radar sites with missiles, among them Nur Khan near Rawalpindi, close to the army’s headquarters, Rafiqui, Murid, Sargodha, Rahim Yar Khan, Sukkur, Jacobabad and Skardu, saying it was answering Pakistani attacks. Pakistan announced Operation Bunyan-um-Marsoos, firing missiles and drones at Indian air bases and military sites, among them Udhampur, Pathankot and Adampur; India said most were intercepted."
      - "Under pressure from the United States, Saudi Arabia and others, the two armies’ directors general of military operations agreed by telephone to stop firing from 5 p.m. Indian time on 10 May, minutes after Donald Trump had announced the ceasefire. It was broken by drones and shelling that night, but held after that. Pakistan promoted its army chief, Asim Munir, to field marshal, and India said its operation had only been paused; India kept the Indus Waters Treaty in abeyance, and the land border and the two countries’ airspace stayed closed to each other."
    facts:
