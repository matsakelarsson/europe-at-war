id: twelve-day-war
name: Twelve-Day War
start: "2025-06-13"
end: "2025-06-24"
tier: B
summary: A war between Israel and Iran in June 2025, which the United States joined with strikes on Iran’s nuclear sites. After decades of shadow war, the two states had exchanged direct missile and air attacks twice in 2024. On 13 June 2025, the day after the International Atomic Energy Agency’s board found Iran in breach of its non-proliferation obligations, Israel launched a surprise air campaign against Iran’s nuclear facilities, missile forces and military leadership, killing the chief of staff of the armed forces, the commander of the Revolutionary Guards and at least ten nuclear scientists. Iran answered with more than 550 ballistic missiles and some 1,000 drones fired at Israel, most of which were intercepted, while Israeli aircraft struck targets across Iran. On 22 June American B-2 bombers struck the enrichment sites at Fordow and Natanz and the nuclear centre at Isfahan. After Iran fired missiles at a US air base in Qatar, President Donald Trump announced a ceasefire, which took effect on 24 June. Iran’s government reported about 1,060 dead and an Iranian human rights group about 1,190; in Israel 33 people were killed.
countries: [il, ir, us, qa]
