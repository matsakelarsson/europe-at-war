notes:
  - Casualty figures. Iran’s Foundation of Martyrs and Veterans Affairs gave about 1,060 killed and 5,800 wounded; the US-based Human Rights Activists News Agency (HRANA) counted 1,190 dead, of whom 436 were civilians, 435 military personnel and 319 unidentified, and 4,475 injured. In Israel 32 civilians and one off-duty soldier were killed and more than 3,200 people were wounded.
  - Israel and the United States said the strikes had set back Iran’s nuclear programme by years; early US intelligence assessments and the IAEA suggested a shorter delay, and the fate of Iran’s stock of uranium enriched to 60 per cent, enough for several weapons if further enriched, remained unknown. Iran has always said its programme is peaceful.
  - The ceasefire did not last. On 28 February 2026 Israel and the United States began a much larger war against Iran, in which Supreme Leader Ali Khamenei was killed; it is not covered by this entry.
