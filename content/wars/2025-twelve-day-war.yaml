  - title: Midnight Hammer and the ceasefire
    date: 22–24 June 2025
    when: "2025-06-22"
    borders: "2025-06-24"
    countries: [ir, us, qa, il]
    body:
      - Early on 22 June, Iranian time, seven American B-2 bombers dropped fourteen 13.6-tonne GBU-57 bunker-busting bombs on the enrichment plant at Fordow, built deep inside a mountain, and on Natanz, while Tomahawk cruise missiles fired from a submarine hit the nuclear centre at Isfahan. President Trump said the sites had been “obliterated”; Iran said it had moved much of its enriched uranium beforehand. On 23 June Israel struck Tehran’s Evin prison, where Iran’s judiciary said about 70 to 80 people were killed, and Iran fired missiles at the US base at Al Udeid in Qatar, having warned in advance; all but one were intercepted, and no one was hurt.
      - That evening Trump announced a ceasefire. After a last exchange, in which an Iranian missile killed four people in Beersheba and Israeli aircraft struck a radar near Tehran, it took effect early on 24 June. Both governments claimed victory. Iran’s parliament voted to suspend cooperation with the IAEA, whose inspectors left the country, and the state of Iran’s remaining nuclear material became unknown.
    facts:
      - [US strikes, "22 June 2025"]
      - [Iranian strike on Al Udeid, "23 June 2025"]
      - [Ceasefire in effect, "24 June 2025"]
