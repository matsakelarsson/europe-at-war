  - title: The missile war
    date: 14–21 June 2025
    when: "2025-06-15"
    borders: "2025-06-21"
    countries: [il, ir]
    body:
      - Israel claimed control of the skies over Tehran and widened its attacks to oil depots and the South Pars gas field, the state broadcaster IRIB, which was hit during a live broadcast on 16 June, the headquarters of the Revolutionary Guards and other security forces, and the Arak heavy-water reactor. Hundreds of thousands of people left Tehran. Iranian missiles that got through Israel’s defences killed nine people in Bat Yam on 15 June, damaged the Weizmann Institute in Rehovot, killed three workers at the Haifa oil refinery and four people in Petah Tikva on 16 June, and on 19 June hit the Soroka hospital in Beersheba, injuring dozens.
      - Most of the dead in Iran were killed in Israeli strikes on cities; most of the dead in Israel were civilians in apartment blocks. Iran’s missile launches fell from day to day as Israel destroyed launchers, and its allies, such as Hezbollah in Lebanon, stayed largely out of the fight. In Iran the authorities arrested thousands of people and hanged several men accused of spying for Israel.
    facts:
      - [Iranian ballistic missiles fired, "more than 550"]
      - [Iranian drones launched, "more than 1,000"]
      - [Killed in Bat Yam, "9 (15 June)"]
