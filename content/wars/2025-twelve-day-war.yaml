        lonlat: [50.99, 34.88]
      - kind: air
        side: us
        name: Natanz
        date: 22 June 2025
        text: Struck again, reportedly with two GBU-57 bombs.
        lonlat: [51.73, 33.72]
      - kind: air
        side: us
