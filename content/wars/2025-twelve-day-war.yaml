steps:
  - title: Rising Lion
    date: 13–14 June 2025
    when: "2025-06-13"
    borders: "2025-06-13"
    countries: [il, ir]
    body:
      - Israel and Iran had fought for decades through proxies, sabotage and assassinations. In April 2024, after an Israeli strike on Iran’s consular building in Damascus killed senior Revolutionary Guards officers, Iran launched more than 300 drones and missiles directly at Israel, nearly all of them shot down by Israel and its allies, and Israel replied with a limited strike near Isfahan. In October 2024, after Israel killed the Hezbollah leader Hassan Nasrallah, Iran fired some 180 ballistic missiles at Israel, and on 26 October Israeli aircraft destroyed much of Iran’s air defences and missile production. Talks between the United States and Iran on the nuclear programme were under way in 2025 when, on 12 June, the IAEA board declared Iran in breach of its safeguards obligations for the first time in twenty years.
      - Before dawn on 13 June Israel launched Operation Rising Lion. Some 200 aircraft, together with drones launched by Israeli agents from inside Iran, struck the enrichment plant at Natanz, missile bases and air defences. Strikes killed the armed forces chief of staff Mohammad Bagheri, the Revolutionary Guards commander Hossein Salami, the head of its aerospace force Amir Ali Hajizadeh and nuclear scientists, many of them in their homes in Tehran, along with members of their families and neighbours. That night Iran began Operation True Promise III, firing waves of ballistic missiles at Israeli cities and military bases.
    facts:
      - [IAEA board finds Iran in breach, "12 June 2025"]
      - [Israeli strikes begin, "13 June 2025"]
      - [Nuclear scientists killed, "at least 10"]
