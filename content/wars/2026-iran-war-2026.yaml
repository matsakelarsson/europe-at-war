notes:
  - The war followed the Twelve-Day War of June 2025. The United States called its operation Epic Fury and Israel called its operation Roaring Lion; Iran called its retaliation True Promise IV. Some media call the war the Third Gulf War, and Iranian state media the Third Imposed War.
  - Aims and legality are disputed. The US and Israeli governments said they acted against imminent threats from Iran’s missile and nuclear programmes, and President Trump also urged Iranians to overthrow their government. The UN Secretary-General called for an immediate end to hostilities, many governments condemned the attack, critics called it a war of aggression in breach of international law, and Iran called it a war crime. The UN Security Council in turn condemned Iran’s attacks on its Arab neighbours and Jordan (Resolution 2817, 11 March 2026).
  - Casualty figures are incomplete, and the parties dispute them. In Iran, the authorities counted at least 3,468 dead before the June memorandum, and the health ministry at least 50 more in US strikes in July; the US-based Human Rights Activists News Agency (HRANA) counted at least 3,636 dead by 7 April, of whom 1,701 were civilians (at least 254 of them children), 1,221 military personnel and 714 unclassified; the Kurdish rights group Hengaw counted at least 7,650 by 8 April, of whom 6,620 were military personnel. In Lebanon the health ministry, which does not separate civilians from fighters, counted more than 4,000 dead; Israel said it had killed about 2,500 Hezbollah fighters, while independent estimates were above 1,000. Israeli figures gave about 72 dead by August, among them some 26 people killed by Iranian missiles and 41 soldiers, most of them in Lebanon. The Pentagon counted 23 US service members dead (11 by hostile action) and 865 wounded by late October. Several dozen people were killed in the Gulf states and about 150 in Iraq, most of them members of the Popular Mobilization Forces.
  - Iran struck Saudi Arabia, the United Arab Emirates, Kuwait, Bahrain, Qatar and Oman throughout the war, but they are not shown as a side; their air defences, with American help, shot down most of the missiles and drones. Their roles differed. Qatar and Oman, with Pakistan, mediated between Washington and Tehran, and in May US officials told reporters that Saudi Arabia and the UAE had secretly carried out retaliatory strikes on Iran, which neither government confirmed. Jordan and Iraqi Kurdistan, which host US forces, were also struck.
  - The Lebanon front (the 2026 Lebanon war) and the Houthi escalation in Yemen are told here only in outline; for Yemen, see the Yemeni Civil War. Many claims by the parties about strikes, interceptions and damage could not be independently verified. The base map is unchanged; the zone Israel holds in southern Lebanon is drawn as an approximate area.
