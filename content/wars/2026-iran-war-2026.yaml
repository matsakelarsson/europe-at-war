  - title: Collapse and a war of attrition
    date: "July – November 2026"
    when: "2026-07-07"
    borders: "2026-11-27"
    countries: [ir, us, jo, bh, kw, lb, ye, sa, qa]
    body:
      - Last updated 27 November 2026. On 7 July three tankers were attacked in the strait, which the United States blamed on Iran; Trump declared the ceasefire “over” and restored sanctions on buyers of Iranian oil. On 8 July US forces struck more than 80 military targets around the strait, and Iranian media reported explosions at Bandar Abbas, Sirik, Qeshm and Kharg; the Revolutionary Guards said they had targeted 85 US sites in Bahrain and Kuwait. Iran declared the strait closed, and in mid-July the United States reimposed its blockade. On 17–18 July Iranian attacks killed three US service members in Jordan, and US aircraft struck the ports of Bandar Abbas and Chabahar. Iran’s health ministry counted at least 50 dead from US strikes in July by the 18th.
      - From late July the fighting paused. The memorandum’s 60 days ran out on 17 August without a final agreement; Iran said the United States had broken it and that there was no ceasefire left to extend. In September a tanker war broke out. The United States said it struck Iranian tankers, three on 5 September and five on 8 September, after missiles were fired at its warships, while Iran claimed attacks on tankers and US vessels and said it would declare an exclusion zone near the strait. On 17 September the UN-commissioned fact-finding mission accused the United States of probable war crimes at Minab and Lamerd, and Iran’s authorities of crimes against humanity in the January crackdown. In Yemen the Houthis resumed their war on the government and their attacks on Saudi Arabia.
      - In November the exchanges were smaller but continued. US aircraft struck Revolutionary Guards missile and air-defence sites on Qeshm Island on 2 and 17 November, which the United States called self-defence, and Iran launched drones at US radars in Bahrain on 13 and 15 November; the United States said it shot down those of the 13th. The Guards said tankers that had taken routes they forbade struck mines. The blockade cut Iran’s visible oil exports to almost nothing, and traffic through the strait stayed far below pre-war levels.
      - At the end of November no ceasefire was in force and talks were stalled. Qatar was mediating; on 24 November Ghalibaf, Iran’s chief negotiator, said Iran would not negotiate until seven conditions were met, among them an end to the blockade, the lifting of sanctions and the release of frozen assets, and warned that Iran could widen the conflict. Whether the limited exchanges would lead to a wider war or to a final agreement was uncertain.
    facts:
