steps:
  - title: Epic Fury and Roaring Lion
    date: "28 February 2026"
    when: "2026-02-28"
    borders: "2026-02-28"
    countries: [ir, il, us]
    body:
      - The Twelve-Day War of June 2025 had ended in a ceasefire but no settlement. In January 2026 Iranian security forces put down nationwide protests; state television gave a toll of 3,117 dead, while rights groups counted far more, the US-based HRANA more than 7,000 by late February. The United States, which was negotiating with Iran over its nuclear programme (the last round was held in Geneva on 26 February), meanwhile assembled its largest force in the region since the invasion of Iraq in 2003.
      - "On 27 February President Donald Trump authorised Operation Epic Fury, and on the morning of 28 February the United States and Israel, which called its part Operation Roaring Lion, struck targets across Iran. Israel said some 200 aircraft hit about 500 targets, mostly air defences and missile launchers, while simultaneous strikes on three meetings of senior officials in Tehran killed Supreme Leader Ali Khamenei, 86, in his compound, with members of his family, the armed forces chief of staff Abdolrahim Mousavi, the Revolutionary Guards commander Mohammad Pakpour, the defence minister Aziz Nasirzadeh and Khamenei’s adviser Ali Shamkhani. Trump said the aim was to remove imminent threats and destroy Iran’s missile industry, and told Iranians: “When we are finished, take over your government.”"
      - Iran’s Red Crescent reported more than 200 dead in 24 provinces on the first day. Two Tomahawk missiles struck the Shajareh Tayyebeh girls’ primary school in Minab, killing more than 150 people, about 120 of them children, according to a fact-finding mission commissioned by the UN. US officials blamed a targeting error caused by outdated data; in September the mission found reasonable grounds to believe that this strike and one on a sports hall in Lamerd were war crimes committed by the United States.
    facts:
      - [US and Israeli strikes begin, "28 February 2026"]
      - [Supreme Leader killed, "Ali Khamenei, 86"]
      - [Killed at the Minab school, "more than 150, about 120 of them children (UN mission)"]
