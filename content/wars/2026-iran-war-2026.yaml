  - title: The war on energy
    date: "13 March – 7 April 2026"
    when: "2026-03-13"
    borders: "2026-03-19"
    countries: [ir, us, il, qa, sa, ae]
    body:
      - On 13–14 March US aircraft struck more than 90 military targets on Kharg Island, Iran’s main oil export terminal, but spared the oil installations, a decision Trump said he would reconsider if Iran kept attacking ships. On 18 March the gas processing plants at Asaluyeh that serve South Pars, the world’s largest gas field, which Iran shares with Qatar, were struck; Iran blamed the United States and Israel, and Israel did not claim the attack. The next day Iranian missiles caused fires and extensive damage at Qatar’s Ras Laffan, which handles about a fifth of the world’s liquefied natural gas, and were fired at targets in Saudi Arabia, the United Arab Emirates, Kuwait and Bahrain, among them oil and gas sites. Qatar expelled Iran’s military attachés. Trump said the United States had had “nothing to do” with what he called the Israeli strike and threatened to destroy South Pars if Qatar was attacked again.
      - From 19 March US aircraft hunted Iranian boats and drones around the Strait of Hormuz, but shipping stayed almost at a standstill. Brent crude rose from about $72 a barrel before the war to nearly $120 on 6 March, and the members of the International Energy Agency released 400 million barrels from their emergency stocks, the largest release in the agency’s history.
      - Pakistan carried proposals between Washington and Tehran. On 25 March Iran rejected a US 15-point plan and put forward its own, and on 31 March Pakistan and China proposed an immediate end to hostilities. As his deadline for Iran to reopen the strait approached, Trump warned on 7 April that “a whole civilization will die tonight” if no agreement was reached.
    facts:
