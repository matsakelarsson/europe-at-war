id: iran-war-2026
name: 2026 Iran war
start: "2026-02-28"
end: ongoing
tier: A
summary: A war between Iran and the United States and Israel that began on 28 February 2026, eight months after the Twelve-Day War, when US and Israeli strikes (Operation Epic Fury and Operation Roaring Lion) killed Supreme Leader Ali Khamenei and much of Iran’s military leadership. Iran answered with missiles and drones fired at Israel, at US bases and at the Gulf states that host them, and closed the Strait of Hormuz, causing what the International Energy Agency called the largest oil supply disruption in history. Hezbollah in Lebanon, where Israel invaded the south, armed groups in Iraq and the Houthis in Yemen joined in on Iran’s side, and Khamenei’s son Mojtaba succeeded him as supreme leader. A ceasefire brokered by Pakistan on 7–8 April, failed talks in Islamabad and a US naval blockade of Iranian ports were followed on 17 June by the Islamabad Memorandum, which suspended the fighting for 60 days, but it collapsed in July after attacks on shipping. Since then the blockade and Iran’s closure of the strait have continued, with intermittent strikes and stalled talks. Thousands have been killed, most of them in Iran and Lebanon. Last updated 27 November 2026.
