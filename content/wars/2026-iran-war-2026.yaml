  - title: A new leader, and new fronts
    date: "2–31 March 2026"
    when: "2026-03-02"
    borders: "2026-03-28"
    countries: [ir, il, lb, iq, ye, us]
    body:
      - On 8 March the Assembly of Experts chose Mojtaba Khamenei, 56, the late leader’s son, as the Islamic Republic’s third supreme leader, and state media said the armed forces had pledged allegiance to him. Iranian officials said he had been lightly injured in the strike that killed his father; for months he was not seen in public, and his statements were read out on state television. Israel kept up its strikes on the leadership. Ali Larijani, the secretary of the Supreme National Security Council, and the Basij commander Gholamreza Soleimani were killed on 17 March, the intelligence minister Esmail Khatib the next day, and the Revolutionary Guards navy commander Alireza Tangsiri, according to Israel, around 26 March.
      - On 2 March, after Khamenei’s killing, Hezbollah fired on northern Israel for the first time since the ceasefire of November 2024, saying it was acting to force Israel to stop its attacks and leave Lebanese territory. Israel answered with strikes on Beirut’s southern suburbs and the south and ordered the evacuation of dozens of villages, and its troops moved into border villages from 3 March. From mid-March it widened the ground offensive, blew up the main bridges over the Litani river and fought for Bint Jbeil. More than a million people in Lebanon, about a sixth of the population, fled their homes.
      - In Iraq, armed groups allied with Iran, under the name Islamic Resistance in Iraq, claimed dozens of drone and rocket attacks a day on US forces at Erbil, Harir and Baghdad airport, most of which were shot down, while US and unclaimed air strikes hit bases of the Popular Mobilization Forces, which are formally part of the Iraqi state’s forces. The Houthis in Yemen held back for a month; on 28 March they fired their first ballistic missile of the war at Israel, which was intercepted.
    facts:
