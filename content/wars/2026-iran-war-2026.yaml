  - title: Ceasefire, talks and blockade
    date: "7 April – May 2026"
    when: "2026-04-07"
    borders: "2026-04-13"
    countries: [ir, us, il, lb, pk]
    body:
      - On the evening of 7 April, US time, less than two hours before his deadline, Trump accepted a two-week ceasefire mediated by Pakistan’s prime minister Shehbaz Sharif and its army chief Asim Munir. Iran’s Supreme National Security Council accepted it, saying the United States had agreed to take Iran’s ten-point plan as the basis for talks, and Israel agreed to pause its strikes on Iran. Pakistan said the truce covered Lebanon; Israel and the United States said it did not, and on 8 April Israeli aircraft carried out about a hundred strikes across Lebanon within ten minutes, killing 357 people according to Lebanon’s health ministry. Iran was reported to have stopped traffic through the strait again.
      - On 11–12 April Vice President JD Vance led the US delegation in Islamabad, in the highest-level talks between the two countries since 1979, facing Iran’s parliament speaker Mohammad Bagher Ghalibaf and foreign minister Abbas Araghchi. After 21 hours they ended without agreement; Vance said the United States had not obtained a key nuclear commitment from Iran, while Iran’s delegation spoke of maximalist demands. On 13 April the US Navy began a blockade of all shipping to and from Iranian ports, and on 19 April it seized an Iranian cargo ship, the Touska. On 21 April Trump extended the ceasefire but kept the blockade.
      - Israel and Lebanon agreed a ten-day truce on 16 April, later extended, but Israeli troops stayed in a zone up to about 10 kilometres deep along the border, behind what Israel called the Yellow Line, and air strikes went on; by mid-May Lebanon’s health ministry counted more than 3,000 dead since 2 March. The truce with Iran was strained by clashes around the strait, including US strikes in Hormozgan province on 7 May that the United States called self-defence and Iran a violation. In May US officials told reporters that Saudi Arabia and the United Arab Emirates had secretly carried out retaliatory strikes on Iran; neither government confirmed it.
    facts:
      - [Ceasefire, "7–8 April 2026"]
      - [Islamabad talks, "11–12 April 2026"]
      - [US naval blockade of Iranian ports, "from 13 April 2026"]
