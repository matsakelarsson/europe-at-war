    countries: [ir, us, pk, qa, kw, bh, il, lb]
    body:
      - In late May the two sides reached a tentative deal to extend the truce, but attacks went on. In early June Iranian drones damaged a passenger terminal at Kuwait’s main airport, killing one person; on 6 June Iran fired missiles and drones at Bahrain and Kuwait in response, it said, to US strikes on radar sites on Qeshm Island and near Sirik, and on 7 June it fired ballistic missiles at Israel for the first time since April. Pakistan and Qatar kept mediating, and on 14 June Trump announced that “the Deal with the Islamic Republic of Iran is now complete.”
      - On 17 June Trump and President Masoud Pezeshkian signed the Islamabad Memorandum, a 14-point framework. Military operations were suspended for 60 days while a final agreement was negotiated; Iran was to reopen the strait to commercial shipping and not charge transit fees during that time, and the United States lifted its blockade, as Central Command announced on 18 June, and eased restrictions on Iranian oil sales. On 19 June Trump announced a truce between Israel and Hezbollah, and on 21 June Vance travelled to Switzerland for talks on a final agreement.
      - The text was vague, and the two sides read it differently. Iran insisted that ships use a northern route along its coast, where it charged fees, while most kept to the southern route near Oman. On 25 and 27 June Iranian drones attacked ships on that route, US forces struck back, and Iran fired missiles at US bases in Jordan and Bahrain. On 4 July Iran held the funeral of Ali Khamenei.
    facts:
