  - title: True Promise IV
    date: "28 February – mid-March 2026"
    when: "2026-02-28"
    borders: "2026-03-11"
    countries: [ir, il, us, kw, bh, qa, ae, sa, iq]
    body:
      - Within hours Iran launched Operation True Promise IV, firing ballistic missiles and drones at Israel, at US bases and at the countries that host them. On 1 March a missile hit Beit Shemesh, west of Jerusalem, killing nine people, and an Iranian drone struck a lightly protected command post at the port of Shuaiba in Kuwait, killing six US Army reservists; another soldier died of wounds received that day at Prince Sultan Air Base in Saudi Arabia. Missiles and drones were fired at Bahrain, home of the US Fifth Fleet, at Kuwait’s international airport, at Abu Dhabi, Riyadh and Saudi Arabia’s Eastern Province, at Qatar’s gas plants at Ras Laffan and Mesaieed and at Erbil in Iraq. Most were shot down.
      - Iran closed the Strait of Hormuz to most shipping, and within days the flow of oil through it, about a fifth of the world’s supply, had fallen by more than 90 per cent, according to the International Energy Agency, which called it the largest supply disruption in the history of the oil market. On 4 March a US submarine sank the Iranian frigate Dena in the Indian Ocean off Sri Lanka, on its way home from an exercise in India; Sri Lanka’s navy recovered 87 bodies.
      - On 11 March the UN Security Council, in Resolution 2817, condemned Iran’s attacks on Bahrain, Kuwait, Oman, Qatar, Saudi Arabia, the United Arab Emirates and Jordan and demanded that they stop. It passed by 13 votes to none; Russia and China abstained because it did not mention the US and Israeli strikes on Iran, and Iran’s ambassador called it a misuse of the Council.
    facts:
      - [Iranian retaliation begins, "28 February 2026"]
      - [US soldiers killed at Shuaiba, "6 (1 March)"]
      - [Resolution 2817, "11 March 2026, 13–0, Russia and China abstaining"]
